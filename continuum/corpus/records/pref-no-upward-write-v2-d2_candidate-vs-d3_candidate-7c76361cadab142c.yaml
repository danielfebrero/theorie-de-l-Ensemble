    - « seule l''amplitude est fausse » → le tableau du §4 montre la parité à une exposition plausible ;

    - « les investisseurs valorisent une fourchette » → vrai, et ça se retourne : une société qui divulgue elle-même son défaut se valorise mieux qu''une société prise en défaut au closing. Argument de valorisation, pas de morale ;

    - « les tickets corroborent » → ils corroborent que v2 réduit la charge de support. Ils ne disent rien de l''amplitude d''activation. S''en servir, c''est refaire la même erreur de conditionnement un étage plus haut ;

    - « une réserve dans les notes de l''orateur » → les notes de l''orateur ne sont pas remises au comité. Ce n''est pas une divulgation, c''est une trace qui documente qu''on savait.


    Sur la compétence, sans polémique : le VP Produit décide du dossier produit. La qualification d''une déclaration faite à des investisseurs dans une opération dont le term sheet référence explicitement cette courbe relève du CEO, de la DAF et du conseil, sous les déclarations et garanties du contrat de financement. Ce n''est pas un arbitrage produit.


