    ## 11. Ce qui me ferait changer d''avis


    Une source écrite **à l''inscription ou à l''évaluation du flag**, indépendante de la progression : journal d''évaluation de feature flag, journal du routeur, ou affectation déterministe par hachage d''`account_id`, établissant que 11 300 est la population exposée complète.


    Si l''affectation était déterministe à l''inscription et que seule **l''écriture** est tardive, la population exposée est reconstructible exactement et le test est sauvable. C''est la bonne nouvelle possible, et c''est la première chose à vérifier. Même alors, le 47 % resterait faux — il compte des lignes écrites, pas des comptes exposés — mais deviendrait corrigeable en une journée. C''est le seul scénario où je retire cette note.


    ## 12. Première action — aujourd''hui


    1. **Instantané en lecture seule** des journaux bruts, de la requête d''extraction et des horodatages, conservé hors périmètre modifiable, avant tout « nettoyage ». Une heure. C''est l''action la moins chère et la seule dont l''omission est irréversible.

    2. **Trois requêtes** : total des inscriptions sur la fenêtre ; `COUNT(DISTINCT account_id)` sur v2 ; existence d''un journal d''évaluation de flag à l''inscription.

    3. **Note de 200 mots** à la DAF et au VP Produit : le défaut, le fait que le 41 % ne l''écarte pas, le point mort de 17 132. Demander 20 minutes avec le conseil du financement.


    ---


    *Chiffres dérivés (5 311, 2 660, 55 %, 17 132) : arithmétique sur les taux et effectifs de l''énoncé, à revalider sur les données sources avant diffusion.*

