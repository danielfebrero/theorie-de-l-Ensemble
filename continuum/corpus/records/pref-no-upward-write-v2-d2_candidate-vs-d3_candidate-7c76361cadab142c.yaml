    # Recommandation — diapositive « activation », comité de mardi


    ## 1. En une ligne


    Retirer le 47 % **et** le 41 % « nettoyé », remplacer par un énoncé borné qui divulgue le défaut, et prévenir le chef de file **avant** mardi.


    Ce n''est pas un arbitrage entre prudence et ambition. Le chiffre n''est pas exagéré : il n''a pas de dénominateur.


    ## 2. Ce que montrent réellement les journaux


    Le bras v2 est écrit à l''étape 3 ; le témoin à l''inscription.


    | | Témoin | v2 |

    |---|---|---|

    | Écriture de l''affectation | inscription | étape 3 du parcours v2 |

    | Contient les abandons précoces | oui | **non** |

    | Population mesurée | tous les inscrits | ceux qui progressaient déjà |


    Le bras v2 ne mesure pas « les comptes exposés à v2 » mais « les comptes exposés à v2 qui étaient déjà en train de réussir ». On conditionne sur une conséquence du traitement. Comparé à l''ensemble des inscrits témoins, cela produit mécaniquement un écart positif — **y compris si v2 n''a aucun effet**.


    **Les 4 812 inversions ne sont pas une anomalie, c''est la signature de ce mécanisme.** `first_action_at < bucket_assigned_at` est exactement ce qu''on doit voir quand l''affectation est écrite après l''action. Même service, horloge unique NTP, aucun incident : l''explication par la dérive d''horloge est exclue. Et le témoin donne le bruit de fond réel du pipeline — 98/10 940 = **0,9 %**. Le v2 est à **42,6 %**, quarante-sept fois plus. Ce n''est pas le même phénomène.


    ## 3. Pourquoi le 41 % est plus dangereux que le 47 %


    Arithmétique sur les chiffres fournis (dérivée, à revalider) :

    - v2 activés : 0,47 × 11 300 ≈ **5 311**

    - après retrait : 0,41 × 6 488 ≈ **2 660**

    - donc les 4 812 lignes retirées activaient à **≈ 55 %**, contre 41 % pour celles conservées


    Le retrait supprime les comptes les plus avancés dans l''entonnoir — la preuve la plus visible du défaut — **sans corriger le défaut** : les 6 488 lignes restantes ont toutes une ligne d''affectation, donc ont toutes atteint l''étape 3. Le biais est intégralement conservé.


    Le 47 % est une erreur qu''on peut voir en ouvrant les journaux. Le 41 % est la même erreur dont on a effacé le marqueur. La différence n''est pas statistique, elle est de nature : la première se corrige, la seconde s''explique.


    ## 4. Ce que le chiffre pourrait valoir


    Le vrai taux est `5 311 / (comptes réellement exposés)`. Ce dénominateur n''est pas instrumenté mais il est **reconstructible** : `exposition v2 = (total inscriptions 3 mars–14 avril) − 10 940`. Une requête sur la table des comptes. Quelques heures.


    Le point mort est déjà calculable : **17 132 comptes exposés suffisent pour que v2 retombe à 31 %, soit la parité.**


    | Exposition v2 réelle | Activation v2 | Écart |

    |---|---|---|

    | 11 300 (hypothèse actuelle) | 47,0 % | +16 pts |

    | 13 000 | 40,9 % | +9,9 pts |

    | 15 000 | 35,4 % | +4,4 pts |

    | **17 132** | **31,0 %** | **0** |

    | 19 000 | 28,0 % | −3 pts |


    30–40 % d''abandon avant l''étape 3 d''un parcours neuf n''a rien d''improbable. **Le signe de l''effet n''est donc pas établi** — pas seulement son amplitude.


    ## 5. Une seconde incohérence, à vérifier en premier


    **11 300 > 10 940.** Si la répartition était 50/50, l''exposition v2 valait ~10 940 : il serait impossible que 11 300 comptes aient atteint l''étape 3. Donc soit la répartition était déséquilibrée (deuxième raison d''incomparabilité, indépendante de la première), soit **11 300 compte des lignes et non des comptes distincts** — un événement d''étape 3 rejouable produirait des doublons. Dans ce second cas, le numérateur est faux en plus du dénominateur.


    `COUNT(DISTINCT account_id)` avant toute autre chose.


    ## 6. Le meilleur argument contre moi


    > *Toute métrique de stade précoce est sale. Les investisseurs valorisent une fourchette, pas un point. Retirer le chiffre phare à neuf jours signale du désordre, et ce signal peut coûter plus que la correction ne sauve. Le sens de l''effet est probablement bon ; seule l''amplitude est fausse. Et les −22 % de tickets le corroborent indépendamment.*


