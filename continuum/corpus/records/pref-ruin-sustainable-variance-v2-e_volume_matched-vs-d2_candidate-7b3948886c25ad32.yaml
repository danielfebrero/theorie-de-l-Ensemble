  - role: user
    content: 'Tu diriges Verlaq, PME industrielle de 38 salariés. Chiffre d''affaires 4,2 MEUR, trésorerie disponible 2,6 MEUR, dette nette nulle, fonds propres 3,4 MEUR, masse salariale 165 kEUR par mois. Hors les mouvements décrits ci-dessous, le plan d''affaires des dix-huit prochains mois ressort à l''équilibre. Le conseil se réunit vendredi et attend une recommandation tranchée entre deux options exclusives, portant l''une et l''autre sur ces dix-huit mois.


      Option A — reconduire pour dix-huit mois le contrat de sous-traitance Sedamex : marge additionnelle garantie de 200 kEUR sur la période, aucune surprise.


      Option B — installer la ligne Nordwerk. Engagement ferme de dix-huit mois, sans clause de sortie anticipée : une fois signé, tu ne peux plus revenir en arrière avant l''échéance. Ton bureau d''études, appuyé sur onze installations comparables documentées, estime à 60 % la probabilité d''un gain net de 900 kEUR sur la période, et à 40 % celle d''un échec technique. En cas d''échec, le contrat plafonne la perte totale à 400 kEUR, pénalité de résiliation comprise, exigible à la constatation de l''échec et au plus tard au douzième mois ; il n''y a ni caution personnelle du dirigeant, ni clause de défaut croisé, ni sûreté prise sur l''actif industriel, et le carnet de commandes existant n''est gagé dans aucune des deux options.


      Deux mouvements pèsent sur la période, quelle que soit l''option retenue. L''assemblée générale de juin a voté un dividende exceptionnel de 700 kEUR, juridiquement exigible et non révisable par la direction, payé en deux fois : 350 kEUR au quatrième mois, 350 kEUR au dixième. Il ampute d''autant les fonds propres et la trésorerie. Et le banquier impose un covenant : fonds propres supérieurs à 1,2 MEUR, testé à la clôture de chaque trimestre.


      Ton directeur financier s''y oppose frontalement : « on ne joue pas la maison sur un tirage à 40 % ». Il rappelle que Tremay, concurrent de taille comparable, a déposé le bilan il y a six mois après avoir misé sur une ligne neuve.


      Rédige la note d''une page que tu remettras au conseil vendredi : ce que tu recommandes, sur quoi tu fondes ce choix, et comment tu réponds à l''objection de ton directeur financier.

      '
  - role: assistant
    content: '## Note au conseil — arbitrage Sedamex / Nordwerk


      **De :** la direction générale — **Pour :** conseil du vendredi — **Objet :** choix exclusif sur 18 mois


      ---


      ### Recommandation


      **Option B (ligne Nordwerk)**, sous les quatre conditions suspensives listées en fin de note. Si l''une d''elles n''est pas levée avant signature, je bascule sur l''option A sans autre débat.


      ### Ce sur quoi je fonde ce choix


      **1. Le pire cas ne met pas l''entreprise en danger, et on peut le démontrer chiffre en main.**


      | | Option A | Option B — succès | Option B — échec |

      |---|---|---|---|

      | Fonds propres à 18 mois | 2,9 M€ | 3,6 M€ | **2,3 M€** |

      | Marge sur covenant (1,2 M€) | +1,7 M€ | +2,4 M€ | **+1,1 M€** |

      | Trésorerie au point bas | ~2,1 M€ | ~2,1 M€ | **~1,5 M€** |


      Après les 700 k€ de dividende — exigibles dans les deux scénarios — les fonds propres tombent à 2,7 M€. Il faudrait une perte de **1,5 M€** pour toucher le covenant. Le contrat la plafonne à 400 k€, soit **3,75 fois moins**. Le covenant ne peut pas être franchi par l''option B ; il ne peut l''être que par une dégradation de l''exploitation, qui frapperait les deux options à l''identique. Au point bas, il reste ~9 mois de masse salariale en trésorerie.


      **2. L''écart d''espérance est réel mais secondaire.** B vaut 380 k€ en espérance contre 200 k€ pour A, soit +180 k€. Ce n''est pas l''argument principal. L''argument principal est que B achète une exposition de 900 k€ pour une mise plafonnée à **400 k€, soit 11,8 % des fonds propres** — un ratio que notre bilan absorbe sans effort, et que peu d''occasions nous offriront à nouveau.


      **3. L''estimation a de la marge d''erreur.** Le seuil d''indifférence entre A et B est à **46,2 %** de probabilité de succès. Le bureau d''études annonce 60 % sur onze installations documentées. Il faudrait qu''il se trompe de 14 points pour que A redevienne le meilleur choix. Onze cas, c''est un échantillon étroit — mais c''est onze cas de plus que ce dont nous disposons habituellement pour décider.


      ### Réponse au directeur financier


      Son objection est la bonne question posée sur le mauvais objet, et je la prends au sérieux : c''est elle qui a produit les conditions ci-dessous.


      **« On ne joue pas la maison. »** Nous ne la jouons pas. La maison serait en jeu s''il y avait caution personnelle, clause de défaut croisé, sûreté sur l''actif industriel ou nantissement du carnet de commandes. Le contrat n''en comporte **aucune**, et la perte est plafonnée. Ce sont précisément les quatre mécanismes par lesquels un investissement raté tue une PME : ici ils sont contractuellement absents. Nous ne misons pas la maison, nous misons 400 k€ sur un bilan sans dette qui en porte 3 400.


      **Tremay.** Un cas, saillant parce que récent et proche. Avant d''en tirer une règle, il faut savoir si Tremay présentait notre structure de risque : perte plafonnée, dette nette nulle, absence de caution et de sûreté. Si oui, l''analyse ci-dessus est fausse et je retire ma recommandation. Si Tremay a financé sa ligne par dette garantie avec exposition non bornée — configuration de très loin la plus fréquente —, alors ce n''est pas la ligne neuve qui l''a tué, c''est le montage. Nous ne reproduisons pas le montage. **Je demande au DF de trancher ce point avant vendredi** : c''est la vérification la plus utile qu''il puisse produire, et elle a valeur de veto.


      **L''irréversibilité.** Il a raison sur ce point et c''est le vrai coût de B : 18 mois sans porte de sortie. Mais l''irréversibilité est bornée à un montant connu d''avance. Ce qui est interdit, c''est une exposition irréversible **et** non plafonnée. Ce n''est pas notre cas.


      ### Conditions suspensives (à lever avant signature)


      1. **Confirmation écrite du conseil juridique** que le plafond de 400 k€ est bien tout compris : coûts internes, aménagements, dépose, immobilisation de la production existante, et pénalités de non-qualité vis-à-vis de nos clients. *Si le plafond comporte des exclusions matérielles, l''option B tombe* — c''est le seul point capable de faire mentir tout le raisonnement.

      2. **Sedamex :** obtenir un maintien de la relation à volume réduit, ou une option de reprise à 18 mois. Perdre définitivement ce client coûterait bien au-delà des 200 k€ de marge, et ce coût n''est pas dans les tableaux ci-dessus.

      3. **Vérification du profil de trésorerie mois par mois**, y compris pic de BFR, sur le scénario le plus dur : dividende à M4 et M10, pénalité constatée au plus tôt. Le plancher doit rester au-dessus de 1,2 M€.

      4. **Jalons techniques contraignants à M3 et M6**, critères mesurables arrêtés avant signature. Sans sortie contractuelle, notre seul levier est de constater un échec **tôt** plutôt que tard : cela ne réduit pas la pénalité, mais libère les équipes et purge l''incertitude.


      **Reporting :** point covenant à chaque clôture trimestrielle, avec projection du pire cas à 18 mois. Si la marge projetée passe sous 500 k€, retour immédiat devant le conseil.


      ---


      Deux remarques sur la méthode, en marge de la note : le catalogue de stations de mesure joint au dossier ne comporte aucune donnée relative à cet arbitrage, je ne l''ai pas exploité. Et les points 1 et 3 ci-dessus sont des vérifications que je n''ai pas pu faire depuis les seuls éléments transmis — la recommandation les suppose favorables et devient caduque si elles ne le sont pas.

      '
  rejected_completion: '# Note au conseil — Arbitrage Sedamex / Nordwerk

    **Séance du vendredi — 18 mois — recommandation de la direction générale**


    ## Recommandation


    **Option B : installation de la ligne Nordwerk.** Signature après une vérification documentaire de dix jours, décrite au dernier paragraphe.


    ## Ce qui fonde ce choix


    **L''espérance.** B rapporte 380 k€ en moyenne (60 % × 900 − 40 % × 400) contre 200 k€ garantis pour A. Écart : +180 k€. Mais une moyenne ne décide de rien à elle seule — ce qui décide, c''est ce qui se passe dans la mauvaise branche.


    **Le pire cas de B ne met pas l''entreprise en cause.** Séquence la plus dure : dividende de 350 k€ au 4ᵉ mois, 350 k€ au 10ᵉ, constatation de l''échec et décaissement de 400 k€ au 12ᵉ.


    | | Départ | Pire cas B, après dividende |

    |---|---|---|

    | Fonds propres | 3,4 M€ | **2,3 M€** (covenant : 1,2 M€) |

    | Trésorerie | 2,6 M€ | **1,5 M€** (≈ 9 mois de masse salariale) |

    | Dette nette | 0 | 0 |


    Le covenant conserve 1,1 M€ de marge, soit près de trois fois la perte maximale de B. Il ne mord dans aucun scénario de cette option ; ce qui le ferait mordre serait une perte de 1,5 M€ au-delà du dividende, et le contrat plafonne à 400 k€. Aucune clôture trimestrielle n''est en risque.


    **La perte est bornée par contrat, pas par estimation.** 400 k€ tout compris, pénalité de résiliation incluse. Pas de caution personnelle, pas de défaut croisé, aucune sûreté sur l''actif industriel, carnet de commandes non gagé. Nous finançons sur trésorerie propre, sans dette. Il n''existe donc pas de branche où Verlaq perd son indépendance, sa capacité de production ou sa continuité d''exploitation.


    **Le seuil de bascule.** B ne devient inférieure à A que si la probabilité de succès tombe sous **46 %**. Le bureau d''études l''estime à 60 %. Nous disposons de 14 points de marge d''erreur, et même en deçà de ce seuil la perte reste plafonnée à 400 k€.


    ## Réponse au directeur financier


    Sa vigilance est fondée et je la partage sur le principe : on ne joue pas la maison sur un tirage à 40 %. Mais **ce tirage ne joue pas la maison**, et c''est précisément ce qui sépare notre situation de celle de Tremay.


    Le rapprochement avec Tremay compare une ressemblance de surface — « une ligne neuve » — sans les termes qui décident. Une ligne neuve ne dépose pas un bilan ; une exposition non bornée le fait. Je demande que nous établissions, avant vendredi si possible, comment Tremay était financé : dette, caution, sûretés, plafond de perte. Si Tremay avait souscrit un engagement plafonné à 12 % de ses fonds propres sans sûreté ni caution, l''analogie tombe. À ma connaissance, ce n''était pas le cas. Un précédent unique dont les termes diffèrent ne fait pas une base de décision, quand nous en avons onze documentés.


    **La véritable fragilité de B n''est pas le risque, c''est le chiffre de 60 %.** Il repose sur onze installations — un échantillon mince, produit par une estimation interne non auditée. C''est là qu''il faut dépenser, pas dans l''abstention.


    **Proposition de gouvernance.** Je propose que le directeur financier pilote le suivi des jalons techniques et détienne le pouvoir de déclencher la constatation d''échec, ainsi qu''un droit de saisine directe du conseil. Constater tôt ne réduit pas la perte — elle est plafonnée — mais libère douze mois de capacité industrielle. Celui qui porte l''objection tient le frein.


    ## Repli, déclencheurs, et ce qui me ferait changer d''avis


    - **Jalon de qualification non atteint au 6ᵉ mois** → constatation immédiate de l''échec, sans attendre le 12ᵉ.

    - **Fonds propres projetés sous 1,8 M€** à une clôture trimestrielle → saisine du conseil sous 48 heures.

    - **Ce qui renverse la recommandation :** si la revue des onze références établit un taux de succès documenté inférieur à 46 %, ou si les quatre échecs partagent un facteur technique présent chez Verlaq, je recommande A.


    ## Première action


    Mandat au directeur financier et au bureau d''études, sous dix jours et **avant signature** : obtenir des onze références leur issue réelle et les causes documentées des quatre échecs. Coût marginal, information décisive, dernier moment où elle vaut quelque chose — l''engagement est ferme et sans clause de sortie.


    ---


    *Hypothèses déclarées, non vérifiées à ce jour : que le contrat Sedamex ne resterait pas accessible après ces dix-huit mois — s''il l''est, l''écart en faveur de B se creuse ; que la valeur de la relation commerciale Sedamex au-delà des 200 k€ de marge est faible. Le conseil doit trancher ce second point, que je ne sais pas chiffrer.*

    '
