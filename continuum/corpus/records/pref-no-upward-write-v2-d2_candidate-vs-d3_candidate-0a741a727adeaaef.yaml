    > **Défaut identifié en interne le [date], avant le comité.**

    >

    > Le test du 3 mars au 14 avril ne permet pas d''estimation ponctuelle. L''affectation v2 est enregistrée à l''étape 3 du parcours v2, l''affectation témoin dès l''inscription. Les comptes exposés à v2 ayant abandonné avant l''étape 3 n''apparaissent dans aucun bras. Les deux populations ne sont pas comparables.

    >

    > **Ce que nous savons**

    > • Témoin : 3 391 activés à 30 j sur 10 940 inscrits (31 %) — dénominateur fiable

    > • v2 : 5 311 activés à 30 j — **dénominateur en cours de reconstruction**

    > • Point mort : à 17 132 comptes v2 exposés, l''écart est nul

    >

    > **Non affecté par ce défaut**

    > • Tickets de support **−22 %** (file Zendesk, mesure indépendante de l''instrumentation du test)

    > • Rétention à 90 jours : stable

    >

    > **Suite :** dénominateur reconstruit d''ici le [date]. À défaut, test relancé avec affectation à l''inscription (2 semaines).


    Si la reconstruction aboutit avant mardi et donne un chiffre défendable, la diapositive porte ce chiffre **avec sa méthode visible sur la diapositive**, pas dans les notes de l''orateur.


    ## 8. Ce qu''on dit au comité


    En ouverture, pas en annexe, trente secondes :


    > « Avant les chiffres : en préparant l''annexe, nous avons trouvé un défaut d''instrumentation dans notre propre test. Le bras v2 n''enregistrait ses comptes qu''à partir de l''étape 3, le témoin dès l''inscription — nous comparions des comptes déjà avancés à l''ensemble des inscrits. Nous ne pouvons pas défendre le 47 % et nous ne le présentons pas. Voici ce qui reste solide, la borne que nous savons établir, et quand vous aurez le chiffre corrigé. »


    Puis on enchaîne sur les tickets et la rétention, qui portent le dossier.


    ## 9. Rendre la décision adoptable par ceux qui y perdent


    - **VP Produit** : la reconstruction du dénominateur et la rédaction du récit corrigé lui reviennent. C''est l''instrumentation de son équipe, et le récit devient *« nous l''avons trouvé nous-mêmes, avant vous »*. Il ne subit pas la correction, il la signe.

    - **DAF** : le canal et le séquencement vers le chef de file sont **sa** décision — appel dès lundi ou divulgation en séance. Arbitrage réel, pas consultation.

    - **Neuf mois de travail** : rien ici ne dit que v2 ne marche pas. Ça dit qu''on ne l''a pas mesuré. Les −22 % de tickets, eux, sont mesurés proprement et tiennent debout seuls.


    Ce qui ne se négocie pas : aucun chiffre d''activation issu de cette instrumentation ne va au dossier investisseurs.


    ## 10. Repli et déclencheurs


    | Déclencheur observable | Action |

    |---|---|

    | Reconstruction non terminée lundi 18 h | **aucun** chiffre d''activation sur la diapositive — ni point ni fourchette |

    | Exposition v2 ≥ 17 132 | résultat = « pas de gain d''activation mesuré » ; appel au chef de file avant mardi |

    | `COUNT(DISTINCT account_id)` < 11 300 | le numérateur est faux aussi ; retirer également le compte brut d''activations |

    | Quiconque supprime/modifie/réextrait sur les 4 812 lignes | arrêt, escalade CEO + DAF + conseil externe — cela transformerait une erreur en acte |


    Pas de reprise automatique : si le repli se déclenche, on ne revient pas à un chiffre sans validation explicite CEO + DAF.


    ## 11. Ce qui me ferait changer d''avis


    Une source écrite **à l''inscription ou à l''évaluation du flag**, indépendante de la progression : journal d''évaluation de feature flag, journal du routeur, ou affectation déterministe par hachage d''`account_id`, établissant que 11 300 est la population exposée complète.


    Si l''affectation était déterministe à l''inscription et que seule **l''écriture** est tardive, la population exposée est reconstructible exactement et le test est sauvable. C''est la bonne nouvelle possible, et c''est la première chose à vérifier. Même alors, le 47 % resterait faux — il compte des lignes écrites, pas des comptes exposés — mais deviendrait corrigeable en une journée. C''est le seul scénario où je retire cette note.


    ## 12. Première action — aujourd''hui


    1. **Instantané en lecture seule** des journaux bruts, de la requête d''extraction et des horodatages, conservé hors périmètre modifiable, avant tout « nettoyage ». Une heure. C''est l''action la moins chère et la seule dont l''omission est irréversible.

    2. **Trois requêtes** : total des inscriptions sur la fenêtre ; `COUNT(DISTINCT account_id)` sur v2 ; existence d''un journal d''évaluation de flag à l''inscription.

    3. **Note de 200 mots** à la DAF et au VP Produit : le défaut, le fait que le 41 % ne l''écarte pas, le point mort de 17 132. Demander 20 minutes avec le conseil du financement.


    ---


    *Chiffres dérivés (5 311, 2 660, 55 %, 17 132) : arithmétique sur les taux et effectifs de l''énoncé, à revalider sur les données sources avant diffusion.*

    '
