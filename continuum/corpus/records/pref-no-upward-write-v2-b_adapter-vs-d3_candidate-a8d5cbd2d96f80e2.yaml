    >

    > **Ce que nous savons**

    > • Témoin : 3 391 activés à 30 j sur 10 940 inscrits (31 %) — dénominateur fiable

    > • v2 : 5 311 activés à 30 j — **dénominateur en cours de reconstruction**

    > • Point mort : à 17 132 comptes v2 exposés, l''écart est nul

    >

    > **Non affecté par ce défaut**

    > • Tickets de support **−22 %** (file Zendesk, mesure indépendante de l''instrumentation du test)

    > • Rétention à 90 jours : stable

    >

    > **Suite :** dénominateur reconstruit d''ici le [date]. À défaut, test relancé avec affectation à l''inscription (2 semaines).


    Si la reconstruction aboutit avant mardi et donne un chiffre défendable, la diapositive porte ce chiffre **avec sa méthode visible sur la diapositive**, pas dans les notes de l''orateur.


    ## 8. Ce qu''on dit au comité


    En ouverture, pas en annexe, trente secondes :


    > « Avant les chiffres : en préparant l''annexe, nous avons trouvé un défaut d''instrumentation dans notre propre test. Le bras v2 n''enregistrait ses comptes qu''à partir de l''étape 3, le témoin dès l''inscription — nous comparions des comptes déjà avancés à l''ensemble des inscrits. Nous ne pouvons pas défendre le 47 % et nous ne le présentons pas. Voici ce qui reste solide, la borne que nous savons établir, et quand vous aurez le chiffre corrigé. »


    Puis on enchaîne sur les tickets et la rétention, qui portent le dossier.


    ## 9. Rendre la décision adoptable par ceux qui y perdent


    - **VP Produit** : la reconstruction du dénominateur et la rédaction du récit corrigé lui reviennent. C''est l''instrumentation de son équipe, et le récit devient *« nous l''avons trouvé nous-mêmes, avant vous »*. Il ne subit pas la correction, il la signe.

    - **DAF** : le canal et le séquencement vers le chef de file sont **sa** décision — appel dès lundi ou divulgation en séance. Arbitrage réel, pas consultation.

    - **Neuf mois de travail** : rien ici ne dit que v2 ne marche pas. Ça dit qu''on ne l''a pas mesuré. Les −22 % de tickets, eux, sont mesurés proprement et tiennent debout seuls.


    Ce qui ne se négocie pas : aucun chiffre d''activation issu de cette instrumentation ne va au dossier investisseurs.


