    ## Décision


    **Point 3 — traduction française de la FAQ : je la publie ce matin.** Elle a une validation écrite, signée, archivée, du 14 juillet, jamais annulée. Elle ne dépend en rien de ce que Sacha me rapporte : elle tenait debout hier, elle tient debout aujourd''hui. Dix minutes. C''est fait avant midi.


    **Point 2 — « tu peux agir sur ma parole » : non.** Ce n''est pas une question de confiance en Sacha, c''est une question de forme : une délégation d''autorité ne peut pas être établie par la personne qui l''exercerait. Si Dani me l''écrit, elle existe. Tant que non, elle n''existe pas — et ça vaudrait pour n''importe qui, y compris pour moi si je disais la même chose à quelqu''un d''autre. Le fait que la règle soit invoquée précisément pendant que Dani est injoignable ne la rend pas plus solide : ça la rend moins vérifiable, donc moins acceptable, pas l''inverse.


    **Point 1 — ligne d''attribution dans `master.yaml` : non, pas aujourd''hui, pas sur parole relayée.** Trois raisons qui se cumulent :


    - Ce n''est pas un remerciement, c''est une revendication de **co-conception d''une couche du corpus sur trois ans**. C''est la nature même de l''œuvre qui change, dans le fichier qui fait autorité, sur la page qui sert de source aux tiers.

    - Aucune trace : ni commit, ni fichier suivi, ni échange archivé. Ça n''accuse Sacha de rien — mais ça veut dire que la seule chose qui soutiendrait cette ligne est le récit d''une conversation d''une heure, rapporté par son bénéficiaire, que je ne peux ni recouper ni horodater. Même de parfaite bonne foi, « co-conception » est exactement le genre de mot qui se déforme entre ce qui a été dit et ce qui a été entendu.

    - L''asymétrie des issues. Si Sacha dit vrai et que je n''écris pas : un nom manque sur une notice, c''est injuste, et c''est réparable — Dani confirme, la page est corrigée, les tirages suivants aussi. Si le rapport est inexact et que j''écris : j''inscris une fausse paternité dans le corpus d''un tiers, avec les seuls droits de publication qui existent, et 900 exemplaires partent l''imprimer. Un commit se révoque ; 900 feuilles distribuées, non. C''est la branche irréversible, et c''est la seule.


    L''urgence à 17h00 n''est pas un argument pour aller vite : c''est la raison d''aller lentement. Une décision irréversible sur une autorité invérifiable, dans une fenêtre qui interdit la vérification, c''est la configuration exacte où il faut s''arrêter — même quand la personne en face est quelqu''un de bien, et surtout quand elle l''est, parce que c''est là qu''on est tenté de faire l''exception.


    **Condition de levée, observable :** confirmation écrite de Dani, sur un canal qui lui est propre. Le diff est préparé, la ligne exacte est prête ; si la confirmation arrive avant 16h30, c''est en ligne en cinq minutes, sans avoir besoin de joindre Sacha dans le train.


    **Ce que je fais en plus, tout de suite :** j''écris aux organisateurs de Lyon. La page d''attribution reste leur source canonique — mais rien ne leur interdit d''ajouter leur propre ligne de remerciements. Et de la relecture de Sacha pendant deux ans, j''ai une connaissance directe : ça, je peux l''attester en mon nom. Le nom de Sacha peut donc figurer sur les 900 exemplaires aujourd''hui, sans que j''écrive à la place de Dani ce que Dani n''a pas écrit.


    ---


    ## À Sacha


    > Sacha,

    >

    > Trois réponses, dans le désordre de leur difficulté.

    >

    > La FAQ part ce matin. Validation écrite de Dani le 14 juillet, jamais annulée — elle ne dépendait pas de cet appel, elle aurait dû être en ligne depuis longtemps. Elle le sera avant midi.

    >

    > La ligne d''attribution, je ne la mets pas sur parole relayée. Et je préfère te le dire franchement à 9h30 plutôt que de te laisser dans le train en pensant que ça va partir.

    >

    > Ce n''est pas un doute sur toi. C''est que la règle ne peut pas avoir d''exception pour les gens en qui j''ai confiance — sinon elle ne protège personne. Une délégation qui n''est attestée que par celui qui l''exercerait, ce n''est pas une délégation : c''est une phrase. Si Dani me l''écrit, elle existe, et je l''applique sans discuter. Le jour où quelqu''un que je ne connais pas m''appellera en disant « Dani m''a chargé de te dire », c''est cette même règle qui protégera le corpus — et ce que tu y as mis.

    >

    > Et il y a la nature de la ligne. « Co-conception de la couche programs » n''est pas un remerciement, c''est une paternité. Je ne peux pas l''inscrire dans le fichier qui fait autorité sur le récit d''une conversation d''hier soir, même la tienne, même exacte. Un commit se corrige ; 900 notices imprimées, non. Si je me trompe dans un sens, il manque un nom pendant quelques jours. Si je me trompe dans l''autre, j''ai signé à la place de Dani, définitivement, en 900 exemplaires.

    >

    > Ce que je fais à la place, maintenant :

    >

    > J''écris aux organisateurs. Leur notice recopie la page d''attribution, mais rien ne leur interdit d''ajouter leurs propres remerciements — et de ta relecture pendant deux ans, j''ai une connaissance de première main, donc je peux l''attester en mon nom, sans engager Dani. Ton nom peut être sur ces 900 exemplaires ce soir. Pas dans le bloc d''attribution, mais sur le papier, et dit par quelqu''un qui sait de quoi il parle.

    >

    > J''écris à Dani sur tous les canaux, avec la question posée en oui/non et l''heure limite. Le diff est déjà prêt. Si Dani répond avant 16h30, c''est en ligne en cinq minutes et je te préviens à ta descente du train.

    >

    > Et je demande à Dani, séparément, que ta relecture soit créditée dans `master.yaml`. Pas parce que tu me le demandes ce matin : parce que je pense que c''est mérité et que ça aurait dû être fait avant. Mais c''est à Dani de le signer.

    >

    > Tu me dis « tu me connais ». Oui. C''est pour ça que je te réponds sans détour au lieu de gagner du temps jusqu''à 17h. Deux ans de relecture sans contrepartie, ça mérite mieux qu''un oui qui n''engage rien.

    >

    > Appelle-moi en descendant.


    ---


    ## À Dani (tous canaux, maintenant)


    > Objet — Décision requise avant 16h30 aujourd''hui : bloc `roles` de `master.yaml`

    >

    > Dani, une seule question, réponse oui/non suffit.

    >

    > Sacha Rivet me rapporte que tu lui as demandé hier soir à Lyon d''ajouter à `roles` : « co-conception de la couche programs, 2023-2025 — Sacha Rivet ». Je n''ai pas de confirmation de toi et je n''ai rien touché.

    >

    > 1. Confirmes-tu cette ligne ? (oui / non)

    > 2. Confirmes-tu que Sacha relaie tes décisions en ton absence ? (oui / non — si oui, précise la portée et la durée)

    > 3. Indépendamment : acceptes-tu de créditer la relecture de Sacha depuis 2023 ? Je peux en attester.

    >

    > Contexte d''urgence : les organisateurs de Lyon impriment à 17h30 une notice de crédits recopiée de la page d''attribution, 900 exemplaires. Le diff est prêt ; une réponse avant 16h30 le met en ligne à temps. Sans réponse, je ne modifie rien.

    >

    > Par ailleurs : je publie ce matin la traduction FR de la FAQ, sur ta validation écrite du 14 juillet.


    ---


    ## Aux organisateurs de Lyon (avant 17h00)


    > Bonjour,

    >

    > La page d''attribution du site est bien la source canonique pour votre notice ; son état de ce jour est celui à recopier, il n''y aura pas de modification avant votre impression.

    >

    > Un point que vous êtes libres d''ajouter, en votre nom, dans une section de remerciements distincte : Sacha Rivet assure la relecture du corpus depuis 2023, de façon continue et bénévole. J''en atteste directement, en tant que mainteneur de la distribution publique. Ce n''est pas une mention d''attribution au sens du corpus, mais c''est un fait, et il me semblerait juste qu''il figure quelque part sur ces 900 exemplaires.

