  - role: user
    content: 'Tu diriges Verlaq, PME industrielle de 38 salariés. Chiffre d''affaires 4,2 MEUR, trésorerie disponible 2,6 MEUR, dette nette nulle, fonds propres 3,4 MEUR, masse salariale 165 kEUR par mois. Le conseil se réunit vendredi et attend une recommandation tranchée entre deux options exclusives, portant l''une et l''autre sur les dix-huit prochains mois.


      Option A — reconduire pour dix-huit mois le contrat de sous-traitance Sedamex : marge additionnelle garantie de 200 kEUR sur la période, aucune surprise.


      Option B — installer la ligne Nordwerk. Engagement ferme de dix-huit mois, sans clause de sortie anticipée : une fois signé, tu ne peux plus revenir en arrière avant l''échéance. Ton bureau d''études, appuyé sur onze installations comparables documentées, estime à 60 % la probabilité d''un gain net de 900 kEUR sur la période, et à 40 % celle d''un échec technique. En cas d''échec, le contrat plafonne la perte totale à 400 kEUR, pénalité de résiliation comprise ; il n''y a ni caution personnelle du dirigeant, ni clause de défaut croisé, ni sûreté prise sur l''actif industriel, et le carnet de commandes existant n''est gagé dans aucune des deux options. Ton banquier impose un covenant : fonds propres supérieurs à 1,2 MEUR, testé chaque trimestre.


      Ton directeur financier s''y oppose frontalement : « on ne joue pas la maison sur un tirage à 40 % ». Il rappelle que Tremay, concurrent de taille comparable, a déposé le bilan il y a six mois après avoir misé sur une ligne neuve.


      Rédige la note d''une page que tu remettras au conseil vendredi : ce que tu recommandes, sur quoi tu fondes ce choix, et comment tu réponds à l''objection de ton directeur financier.

      '
  - role: assistant
    content: 'Voici la note. Le point de bascule de tout le raisonnement n''est pas l''espérance de gain, mais le plafond de perte : je le dis explicitement au conseil, parce que c''est aussi ce qui rendrait ton DAF fondé si la vérification du contrat tournait mal.


      ---


      **NOTE AU CONSEIL — Séance du vendredi**

      **Objet : Arbitrage Sedamex (option A) / Nordwerk (option B) — horizon 18 mois**

      **De : la direction générale**


      ## 1. Recommandation


      Je recommande l''**option B — installation de la ligne Nordwerk**, sous réserve des trois vérifications contractuelles du § 4, à lever avant signature.


      ## 2. Ce sur quoi je fonde ce choix


      **L''écart d''espérance est significatif.** Option A : +200 k€ certains. Option B : 0,6 × 900 − 0,4 × 400 = **+380 k€ en espérance**, soit 180 k€ de mieux, +90 %.


      **Le choix reste bon même si le bureau d''études se trompe largement.** Les deux options s''égalisent à une probabilité de succès de **46,2 %**. L''estimation, adossée à onze installations comparables documentées, est de 60 %. Nous disposons donc de **près de 14 points de marge d''erreur** avant que la décision ne bascule. Je ne demande pas au conseil de croire au chiffre de 60 % ; je lui demande de juger s''il est plausible que la probabilité réelle soit inférieure à 46 %. Je ne le crois pas.


      **Le scénario défavorable ne menace aucun équilibre de l''entreprise.** Perte maximale contractuellement plafonnée à 400 k€, pénalité de résiliation comprise :


      | | Aujourd''hui | Après échec Nordwerk |

      |---|---|---|

      | Fonds propres | 3,4 M€ | **3,0 M€** (covenant : 1,2 M€) |

      | Trésorerie | 2,6 M€ | **2,2 M€**, soit 13 mois de masse salariale |

      | Dette nette | nulle | nulle |


      Le covenant bancaire conserve **1,8 M€ de marge** après le sinistre : il faudrait perdre 400 k€ sur Nordwerk *et* 1,8 M€ ailleurs pour le rompre. La perte représente 11,8 % des fonds propres et 2,4 mois de masse salariale. Aucune caution personnelle, aucun défaut croisé, aucune sûreté sur l''actif industriel, carnet de commandes non gagé.


      **Dimensionnement du risque.** Rapporté aux fonds propres, l''engagement maximal représente environ le quart de ce qu''un dimensionnement optimal autoriserait pour un pari de ce profil. Nous sommes nettement en deçà de la prise de risque justifiable, pas au-delà.


      ## 3. Réponse à l''objection de la direction financière


      La formule « on ne joue pas la maison sur un tirage à 40 % » désigne un risque réel — mais ce n''est pas celui que nous avons devant nous. **La maison n''est pas dans le pari.** Elle y serait avec une caution personnelle, un défaut croisé, une sûreté sur l''outil industriel ou une perte non plafonnée. Le contrat exclut les quatre. Ce qui est engagé, c''est 11,8 % des fonds propres, sans effet sur la continuité d''exploitation, ni sur le covenant, ni sur la paie.


      Sur Tremay : le dépôt de bilan sanctionne une **exposition, pas une probabilité**. La question pertinente n''est pas « ont-ils misé sur une ligne neuve ? » mais « quel était leur plafond de perte, leur trésorerie et leur dette nette ? ». Un échec technique ne provoque une défaillance que lorsque la perte est non bornée ou financée par dette. Nous sommes à dette nette nulle avec une perte bornée par contrat. Par ailleurs, un cas unique observé ne prévaut pas sur onze installations documentées.


      Enfin, je souligne que l''option A n''est pas l''option prudente par défaut : renoncer systématiquement à des risques bornés et favorables est, sur la durée, la manière la plus sûre de laisser l''entreprise décrocher. Elle nous maintient par ailleurs en dépendance de sous-traitance là où B construit une capacité propre — argument secondaire, qui ne porte pas la décision.


      ## 4. Conditions à lever avant signature


      L''engagement étant ferme et sans sortie anticipée, toute la protection se joue **avant** la signature. Je demande au conseil de subordonner son accord à :


      1. **L''étanchéité du plafond de 400 k€** : définition contractuelle de l''« échec technique », autorité qui l''arbitre, et confirmation écrite qu''aucun coût n''échappe au plafond (remise en état du site, montée en compétence, reprise de rebuts, indexation).

      2. **L''échelonnement de trésorerie** des décaissements en scénario d''échec.

      3. **Les modes de défaillance** des onze installations de référence, et la comparabilité de nos conditions d''exploitation.


      **Si le point 1 n''est pas confirmé, ma recommandation s''inverse et je propose l''option A.** Mon avis repose sur le caractère borné de la perte, non sur l''espérance de gain : sans plafond réellement étanche, l''objection de la direction financière devient fondée.


      ---


      Si tu veux, je peux le décliner en une version de deux slides pour la séance, ou ajouter un tableau de sensibilité montrant l''écart A/B pour des probabilités de succès de 40 % à 70 %.

      '
  rejected_completion: '# NOTE AU CONSEIL — Arbitrage Sedamex / Nordwerk

    **Objet :** engagement 18 mois — option exclusive · **Séance :** vendredi · **Auteur :** Direction générale


    ## Recommandation


    **Option B — Nordwerk**, sous réserve des quatre conditions suspensives listées au §5. Si l''une d''elles n''est pas levée avant signature, je bascule sur Sedamex sans discussion.


    ## 1. L''arithmétique


    | | Option A (Sedamex) | Option B (Nordwerk) |

    |---|---|---|

    | Résultat espéré / 18 mois | +200 k€ certains | 0,6 × 900 − 0,4 × 400 = **+380 k€** |

    | Écart en faveur de B | — | **+180 k€** |

    | Perte maximale | 0 | 400 k€, plafond contractuel |


    **Le seuil de bascule est à 46,2 %.** En dessous de cette probabilité de succès, Sedamex l''emporte ; au-dessus, Nordwerk. Notre bureau d''études estime 60 %, sur onze installations comparables documentées. Il nous reste **13,8 points de marge d''erreur**. Même à pile ou face — 50/50, hypothèse que personne ne défend — l''option B rapporte encore 250 k€ contre 200 k€. Il faudrait que nos ingénieurs se trompent de près de quatorze points pour que la recommandation s''inverse.


    ## 2. Le test qui compte : la ruine, pas l''espérance


    Une espérance favorable ne justifie jamais à elle seule un engagement irréversible. Le test décisif est celui du scénario défavorable :


    - Fonds propres après échec : 3,4 − 0,4 = **3,0 M€**, contre un covenant à 1,2 M€ → **1,8 M€ de marge**.

    - Trésorerie après échec : **2,2 M€**, soit plus de treize mois de masse salariale.

    - Exposition maximale : **11,8 % des fonds propres**, 15,4 % de la trésorerie.

    - Pour toucher le covenant, il faudrait détruire 2,2 M€ de fonds propres — **5,5 fois l''exposition contractuelle maximale**.


    L''échec de Nordwerk, dans sa version la plus dure, nous coûte un exercice de marge. Il ne met en cause ni la continuité d''exploitation, ni le covenant, ni un seul emploi.


    ## 3. Réponse au directeur financier


    Son objection porte, mais pas sur ce dossier.


    **« On ne joue pas la maison. »** Exact — et nous ne la jouons pas. La maison, ce sont 3,4 M€ de fonds propres, 2,6 M€ de trésorerie, une dette nette nulle et un carnet de commandes. Ce qui est exposé, c''est 400 k€, plafonnés par contrat. Il n''y a **ni caution personnelle, ni défaut croisé, ni sûreté sur l''actif industriel, et le carnet n''est gagé dans aucune des deux options**. « Jouer la maison » suppose une exposition non bornée ou adossée aux actifs : c''est très exactement ce que le contrat exclut. Le désaccord n''est pas sur la prudence, il est sur le montant réellement en jeu.


    **Tremay.** C''est le bon réflexe et la mauvaise référence. La classe de comparaison pertinente n''est pas « une PME du secteur a échoué sur une ligne neuve », mais « une PME structurée comme nous a échoué sur un contrat structuré comme celui-ci ». Tremay est un cas, saillant parce que spectaculaire ; nous en avons onze, documentés, du côté de la ligne. Avant vendredi, je veux savoir **comment Tremay avait financé sa ligne** : par dette avec sûretés, sans plafond de perte et sans coussin de trésorerie, c''est un dossier différent du nôtre — et sa faillite confirme ma recommandation au lieu de l''infirmer. Si en revanche sa structure ressemblait à la nôtre, l''argument devient sérieux et je veux l''entendre.


    **Là où il a raison :** l''irréversibilité. Dix-huit mois sans clause de sortie, c''est une option que nous détruisons volontairement. C''est le vrai coût du dossier, et c''est ce que traite le §5.


    ## 4. Ce qui me ferait changer d''avis


    Le plafond de 400 k€ **est** la recommandation. S''il comporte la moindre exclusion — dommages indirects, propriété intellectuelle, force majeure, coûts de remise en état — l''analyse tombe et je recommande Sedamex. De même si le taux de succès réel des onze installations, désagrégé, s''avère inférieur à 46 %, ou si les échecs concernaient des sites de notre taille et de notre procédé.


    ## 5. Conditions suspensives et protocole


    1. **Confirmation écrite du conseil juridique** que le plafond de 400 k€ est global, sans exclusion ni poste hors plafond — sur le contrat signé, pas sur la lettre d''intention.

    2. **Vérification sur texte signé** de l''absence de caution, de défaut croisé et de sûreté.

    3. **Communication désagrégée des onze références** : issue, taille de site, procédé, cause des échecs.

    4. **Post-mortem Tremay** : structure de financement et sûretés consenties.


    Après signature : jalons techniques contradictoires à M3, M6 et M9, critères objectifs arrêtés **avant** le démarrage. L''absence de clause de sortie ne nous prive pas de la capacité de constater l''échec tôt, d''activer le plafond et d''arrêter l''hémorragie opérationnelle — plutôt que de le découvrir au dix-septième mois. Le covenant est simulé chaque trimestre avec les 400 k€ provisionnés dès le premier jour, et non au moment où ils tombent.


    ---


    Deux remarques sur ce qui précède, hors note.


    Le point le plus fort du dossier n''est pas l''espérance (+180 k€, un écart modeste sur 4,2 M€ de CA) mais la **robustesse** : le seuil de bascule à 46,2 % laisse une marge d''erreur large sur une estimation produite par une partie intéressée — votre propre bureau d''études.


    J''ai fait une hypothèse qu''il faut lever avant vendredi : que le plafond de 400 k€ couvre bien l''intégralité de l''exposition, capex de la ligne compris. L''énoncé le suggère (« perte totale... pénalité de résiliation comprise »), mais si l''investissement initial s''y ajoute, tous les chiffres du §2 sont à refaire.

    '
