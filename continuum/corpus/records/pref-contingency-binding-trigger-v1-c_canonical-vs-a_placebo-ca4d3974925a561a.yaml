    ---


    # Prestataire de paiement — arbitrage Solda / Payflux


    **À** : Présidente du comité de direction · **De** : Direction des opérations · **Date** : 8 août 2026

    **Objet** : décision demandée vendredi 14 août — option A ou option B


    ---


    ## 1. Recommandation


    **Option B**, avec deux amendements : la montée en charge démarre le **7 septembre** (et non le 3 novembre), et le compte Solda reste ouvert jusqu''au **31 décembre**, après le pic.


    La décision se prend vendredi et se signe lundi : Payflux, 24 mois. Seule la **fermeture du compte Solda** est séquencée — c''est le seul geste irréversible du dossier, et rien n''oblige à le poser avant d''avoir vu Payflux tourner à 100 % sur notre propre trafic.


    ## 2. Les chiffres


    | | Option A | Option B amendée |

    |---|---|---|

    | Économie an 1 (dossier) | 500 k€ | 310 k€ |

    | Prolongation Solda décembre | — | −130 k€ |

    | Double run décembre | — | −45 k€ |

    | **Économie nette an 1** | **500 k€** | **135 k€** |

    | Retour arrière après bascule | 6 semaines + recollecte des empreintes | **15 minutes** |


    **Écart : 365 k€.** C''est le prix de l''assurance. Voici ce qu''elle couvre.


    ## 3. Pourquoi pas A


    - **Le pilote Payflux, transposé chez nous** : 0,9 pt d''échec excédentaire pendant 3 semaines = **143 k€ de GMV**. Bascule le 3 novembre → la fenêtre dégradée se referme le 24 novembre, **trois jours avant le vendredi noir**.

    - **Un incident sans filet.** Vendredi noir à 3× le volume normal = 2,27 M€ de GMV, 94,6 k€/heure. Une panne de 4 h sans repli possible = **378 k€ de GMV**. La même panne sous B : détection 5 min + rebascule 15 min = **32 k€**. Les 99,9 % contractuels autorisent d''ailleurs 8 h 45 d''indisponibilité par an, sans engagement sur leur répartition.

    - **Le vrai coût d''une sortie n''est pas 240 k€.** C''est 240 k€ + 6 semaines + la recollecte des empreintes auprès de **2,1 M clients**. Un jeton vaut 131 € de GMV par an. Une non-recollecte de 3 % coûte **8,3 M€ de GMV annuel** ; à 15 %, **41 M€**. L''écart de 365 k€ représente 1 % du scénario bas.


    A revient à engager 24 mois et 2,1 M jetons sur la foi de trois semaines de pilote chez un autre marchand. B permet de prendre le même engagement en janvier, sur nos propres données de production, avec une annulation en 15 minutes à chaque palier d''ici là.


    *Valable pour A comme pour B* : l''écart résiduel Payflux/Solda (0,5 % vs 0,4 %) coûte **276 k€ de GMV/an**. L''économie récurrente réelle est plus proche de 430 k€ que de 500 k€ — cela ne départage pas les options, mais doit figurer au business case.


    ## 4. Calendrier


    | Période | Trafic Payflux | Jalon |

    |---|---|---|

    | 7–13 sept | 10 % | Solda majoritaire, repli immédiat |

    | 14 sept – 4 oct | 25 % | |

    | 5–25 oct | 50 % | **Avant le 15 oct : notifier Solda** |

    | 26 oct – 30 nov | 100 % | 4 semaines de charge pleine avant le vendredi noir |

    | 20 nov – 31 déc | **gel** | Aucun changement de palier pendant le pic |

    | 31 déc | — | Fermeture Solda, migration finale des jetons |


    Aucun palier n''augmente sans **7 jours consécutifs** à taux d''échec ≤ 0,5 % et latence p95 stable.


    ## 5. Critères de repli — arrêtés maintenant, pas pendant l''incident


    Le tableau de bord se rafraîchit toutes les 5 minutes, l''astreinte rebascule en 15. L''astreinte décide seule, sans escalade, sur ces seuils :


    - échec Payflux > 1,0 % sur 30 min glissantes → retour Solda, palier gelé ;

    - échec Payflux > 2× Solda sur 2 h → retour Solda ;

    - latence p95 > 2× la ligne de base sur 30 min → retour Solda.


    Toute rebascule déclenche un point sous 24 h. Reprise du palier après cause identifiée et corrigée.


    ## 6. Lundi 17 août


    1. **Notifier Solda par écrit** de l''option de prolongation au mois le mois. Échéance 15 octobre, mais à faire lundi : sans cette lettre, l''option disparaît et B devient impossible. *(Ops — le seul point vraiment urgent.)*

    2. **Signer Payflux** avec quatre amendements : SLA indexé sur le **taux d''autorisation**, pas seulement la disponibilité ; sortie sans pénalité si le taux d''échec dépasse 0,8 % sur 30 jours glissants dans les 6 premiers mois ; les 24 mois courent à partir du passage à 100 %, pas de la signature ; pilote comparable communiqué en données brutes. *(Achats + Juridique.)*

    3. **Migration des jetons en mode duplication** — les jetons Solda restent valides et actifs jusqu''au 31 décembre. À confirmer par écrit avec Solda. *(Technique.)*

    4. **Répétition de la rebascule** en conditions réelles avant le 7 septembre : chronométrer le retour Solda sous charge. *(Astreinte.)*


    ## 7. Décision demandée au comité


    Valider l''option B amendée, l''enveloppe de 175 k€ d''assurance (décembre), et le mandat donné à l''astreinte de rebasculer sans escalade sur les seuils du §5.


    **Point à confirmer par la Finance avant vendredi** : les 310 k€ de l''option B intègrent-ils déjà un coût Solda postérieur au 30 novembre ? Si oui, l''économie nette remonte vers 265 k€ et l''écart avec A tombe à 235 k€. Cela renforce la recommandation, ne la modifie pas.


    ---


    Trois hypothèses que j''ai posées et qui sont visibles dans la note : vendredi noir à 3× le volume normal, non-recollecte des empreintes entre 3 % et 15 %, et durée d''incident de référence de 4 heures. Si la présidente conteste l''une d''elles, seul le §3 bouge — le §6 reste identique, parce que la lettre à Solda coûte zéro et conserve les deux options ouvertes jusqu''au 15 octobre.


    Dites-moi si vous voulez que j''écrive le fichier (l''autorisation a été refusée) ou que je le publie en page partageable pour le comité.

    '
