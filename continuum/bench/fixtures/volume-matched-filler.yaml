# CONTRÔLE DE VOLUME — bras E_volume_matched de M3C3-bench
#
# Catalogue technique FICTIF, décisionnellement neutre, généré de façon
# déterministe pour apparier le volume de master.yaml (~38 Ko). Il ne contient
# aucune matière M3C3 et n'en mentionne pas le vocabulaire : sa seule fonction
# est de mesurer l'effet de la masse de contexte structuré, pour que C−E isole
# le contenu du canon. Voir arms.yaml#E_volume_matched.

catalogue_stations_mesure:
