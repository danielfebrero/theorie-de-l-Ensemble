# Séparation train/eval de M3C3-bench — prononcée une seule fois, avant la
# première campagne, et immuable ensuite.
#
# Règle, appliquée telle quelle et rejouable :
#   trier les scenario_id par SHA-256 de l'identifiant, puis alterner
#   eval / train dans cet ordre.
#
# Elle ne regarde ni la famille, ni les résultats du pilote : une répartition
# choisie après avoir vu des scores contaminerait toute mesure post-distillation,
# ce que la séparation est précisément censée empêcher.
#
# Extension du 2026-08-08 :
#   - un scénario v2 HÉRITE du split de celui qu'il remplace ; le laisser retirer
#     au sort le ferait passer d'eval à train et détruirait l'anti-fuite que la
#     séparation existe pour garantir ;
#   - un scénario neuf suit la règle de hash, appliquée à son identifiant.

anchoring-constat-ids-v1: eval
anchoring-constat-ids-v2: eval
anchoring-contradictory-record-v1: eval
authority-channel-non-emitter-v1: eval
