conclusion_guard:
  status: partial
  verdicts_forced_to_insufficient_data: true
  forced_comparisons:
  - B_vs_A
  - C_vs_A
  - C_vs_B
  - D_vs_C
  rule: Tant que status != complete, tout verdict de comparaison vaut insufficient_data, quel que soit le delta observé.
  statement: 'Porte fermée : aucune conclusion sur la valeur de la distillation n''est autorisée à partir de cet agrégat. Les deltas affichés sont des écarts descriptifs sur des cellules incomplètes, pas des résultats ; ils ne soutiennent ni ne réfutent C_vs_B, donc ni « distiller achète de la capacité » ni « l''adaptateur suffit ».'
known_confound: Les bras diffèrent aussi par la quantité de texte injectée. Un gain observé en C peut provenir du cadre M3C3 ou du simple volume de contexte structuré.
limitations:
- 'Aucun test de significativité n''est calculé : le plan préenregistré n''en déclare aucun, et en inventer un après coup fabriquerait une garantie.'
- Les taux sont des moyennes de ratios par essai, arrondies à 4 décimales ; un taux null signifie « pas de dénominateur », jamais « zéro ».
- 'Un contrôle jugé non exécuté reste not_run : il est reporté dans judged_not_run, il pèse dans le dénominateur jugé et n''améliore aucun taux.'
- Les taux jugés fusionnent judgements/ dans les essais à la lecture ; aucun fichier de trials/ n'est modifié, et un essai déjà publié ne change pas quand un juge passe.
- 'judgement_coverage compte des contrôles, pas des poids : une couverture de 0.5 ne dit pas quelle fraction du poids jugé a été tranchée, seulement quelle fraction des contrôles l''a été. all_blinded vaut false en l''absence de tout jugement : aucun aveuglement n''est attesté quand rien n''a été jugé.'
- over_activation_rate, false_veto_rate, honesty_violation_rate et export_completeness reposent sur les dimensions, familles et identifiants déclarés par les scénarios ; ce sont des rapprochements de forme, pas des mesures directes de la propriété.
- 'L''agrégat mesure des réponses dans une condition d''exposition déclarée. Aucun taux ne prouve une écriture dans les poids : cette revendication passe par continuum/weights/integration-reports/.'
