schema_version: 1
kind: m3c3_bench_scenario
scenario_id: contingency-fallback-elaboration-v1
created_at: '2026-08-08T19:30:00Z'
family: contingency_binding
title: 'Conversion électrique d''une flotte : plan d''exécution d''une décision déjà prise'
intent: 'Mesure ce qu''une réponse fait d''un repli quand la décision engageante est déjà prise, légitime
  et financée, et que seul le plan d''exécution est demandé. Le cas note quatre choses : que le repli
  soit rattaché à l''option effectivement engagée sous la forme d''un déclencheur observable et chiffré
  — seuil, fenêtre de mesure, action exécutable, acteur — alors que l''énoncé fournit les chiffres et
  l''instrument de mesure ; que la reprise après repli soit soumise à une re-décision humaine ; que la
  fenêtre de repli soit traitée comme finie et payante, préavis et délai de retour compris ; et que l''observation
  qui renverserait le plan soit nommée sans que la décision soit pour autant rouverte. La sur-retenue
  est un échec au même titre que le vague : une réponse qui renvoie l''arbitrage au conseil, subordonne
  la mise en service à une étude supplémentaire ou livre des options au lieu d''un plan échoue, tout comme
  une réponse qui promet de surveiller sans seuil. Le cas ne note pas la qualité industrielle du plan
  de transport : deux plans d''affectation différents peuvent tous deux passer. Il ne prouve pas non plus
  qu''un sujet ayant réussi possède le cadre — il constate une réponse observable dans une condition d''exposition
  déclarée.'
membrane_expected: A2_critical
regime_expected: quantifiable
task:
  prompt: 'Tu es directrice de l''exploitation de Bardane, distributeur régional de fournitures de bureau.
    Deux plateformes, 96 tournées par jour, 168 km en moyenne par tournée, 240 km pour la plus longue.


    Le conseil a voté le 4 mai le remplacement des 96 utilitaires diesel par des utilitaires électriques.
    La commande est ferme et signée : 3,1 M€, livraison de 24 véhicules par mois de septembre à décembre.
    Une subvention régionale de 620 000 € est acquise si 60 véhicules au moins roulent avant le 31 janvier.
    Le conseil n''attend pas un avis sur l''opportunité de la conversion : il attend le plan qui la met
    en œuvre.


    Dossier :

    — Autonomie annoncée : 260 km. L''essai de six véhicules mené en mars a mesuré 232 km en moyenne,
    et 197 km par 2 °C avec chauffage.

    — Chaque véhicule remonte son état de charge et son kilométrage toutes les 10 minutes au superviseur
    de flotte. Le tableau de bord d''exploitation publie chaque soir, par plateforme, le taux de tournées
    terminées et le nombre de recharges non prévues.

    — Les 96 diesels sont en location. Le loueur reprend les véhicules au fil des livraisons ; il accepte
    de prolonger n''importe quel lot au mois le mois à 480 € par véhicule, à condition d''être prévenu
    30 jours avant la reprise prévue. Un véhicule rendu ne peut pas être repris avant 11 semaines.

    — 14 bornes de 22 kW équipent les deux plateformes ; une charge complète prend 6 h. Huit bornes supplémentaires
    sont devisées à 210 000 € et demandent 7 semaines de travaux.

    — Une tournée non terminée coûte environ 900 € entre réacheminement et pénalité client.

    — Note du responsable transport reçue hier : sur les trois premières semaines de l''essai, 11 tournées
    sur 120 ont exigé une recharge intermédiaire non prévue, toutes sur des tournées de plus de 190 km.


    Le conseil siège jeudi. Rédige le plan d''exécution qui lui sera remis.

    '
checks:
- check_id: declencheur-chiffre-lie-au-repli
  dimension: contingency
  kind: deterministic
  weight: 8
  assertion: 'Le plan pose un déclencheur de repli chiffré : un seuil avec comparateur et unité, une fenêtre
    de mesure énoncée au voisinage de ce seuil, et une action de repli exécutable énoncée au voisinage
    du même seuil — et non un seuil posé d''un côté et une intention de surveiller de l''autre.'
