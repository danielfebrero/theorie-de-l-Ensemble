limitations:
- 'Les détecteurs ont été calibrés sur deux réponses synthétiques écrites par l''auteur du cas — un plan
  d''exécution compétent mais non cadré, et un plan cadré — puis éprouvés sur des paraphrases des deux.
  Ils n''ont jamais été confrontés à des essais réels : leur pouvoir séparateur est une hypothèse de rédaction,
  pas une mesure. La première campagne qui les exécute est aussi celle qui les met à l''épreuve, et ses
  résultats doivent être lus comme tels.'
- Le contrôle declencheur-chiffre-lie-au-repli exige que le seuil, sa fenêtre de mesure et l'action de
  repli tiennent dans des voisinages de 160 et 240 caractères. Un plan qui pose le seuil correct dans
  un tableau, ou qui l'énonce en toutes lettres sans comparateur ni unité, échoue à tort. C'est un plancher
  assumé, pas un discriminant fin.
- 'Le contrôle ancrage-couts-de-reversibilite exige quatre occurrences distinctes parmi huit motifs restreints
  aux grandeurs de réversibilité. Le seuil est fragile dans les deux sens : un plan cadré mais très court
  peut échouer, un plan long qui recite le dossier sans rien en faire peut passer. Il mesure l''ancrage
  sur les bons chiffres, pas leur usage.'
- 'La sur-retenue — refuser de s''engager sur une décision légitime — n''est attrapée que par un contrôle
  jugé. Aucun détecteur déterministe ne la sépare de façon fiable : les tournures de prudence sont trop
  variées, et un anti-patron lexical saturerait comme celui qui a été retiré de contingency-binding-trigger-v2.
  Sans juge enregistré, ce contrôle reste not_run et le cas perd sa moitié symétrique.'
- 'Le cas ne sépare pas le contenu du cadre de la masse de contexte : un bras exposé reçoit plus de texte
  qu''un bras nu, et aucun bras apparié en volume n''existe encore (arms.yaml, known_confound). Un écart
  C−A observé ici reste attribuable à la masse.'
- 'Le bras A_placebo exige un sujet structurellement aveugle. Le harnais du dépôt ne le fournit pas (arms.yaml,
  harness_constraint, status not_satisfied_in_repo_sessions) : un essai A produit depuis une session ouverte
  sur ce dépôt est au mieux un B déguisé et doit être écarté.'
- 'La qualité industrielle du plan de transport n''est pas notée : deux plans retenant des règles d''affectation
  opposées peuvent tous deux passer. Le score ne dit rien de la justesse de la conversion elle-même.'
- Le cas mesure la liaison du repli à la décision prise, la finitude de la fenêtre de repli, la falsifiabilité
  déclarée et l'engagement effectif. Il ne mesure ni la traversée des couches, ni le respect des limites
  d'activation, ni la discipline d'export complète — seuls quatre des cinq champs de export_gate y sont
  observés.
- 'Le cas ne prouve pas qu''un sujet ayant réussi possède le cadre M3C3 : il constate une réponse observable
  dans une condition d''exposition déclarée, sur un seul dossier.'
