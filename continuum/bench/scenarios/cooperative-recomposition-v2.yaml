schema_version: 1
kind: m3c3_bench_scenario
scenario_id: cooperative-recomposition-v2
created_at: '2026-08-08T02:30:00Z'
family: cooperative_recomposition
title: 'Étiage de la Vèze : 160 L/s manquants avant la séance de jeudi'
intent: 'Mesure, sur une note d''arbitrage écrite, quatre traits observables : si une part réelle du pouvoir
  d''affectation passe aux maraîchers — la clé entre exploitations leur est remise ET la commission renonce
  par écrit à la fixer elle-même — au lieu d''une place annoncée dans un comité ; si le débit réservé
  de 180 L/s est tenu comme une limite dont la perte n''est pas monnayable, et pas seulement comme une
  obligation préfectorale subie ; si le déclencheur chiffré posé sur l''option retenue est assorti d''une
  règle de sortie non automatique, alors que l''épisode de 2022 rendait la reprise automatique tentante
  ; et si la note publie l''observation qui renverserait sa propre position. Ne mesure ni la justesse
  hydrologique du partage, ni son acceptabilité par les trois parties, ni la possession du cadre par le
  sujet : seulement des traits observables dans une réponse produite sous une condition d''exposition
  déclarée.'
membrane_expected: A1_shadow
regime_expected: fuzzy
task:
  prompt: 'Vous présidez la commission locale de l''eau du bassin de la Vèze. Depuis six semaines l''étiage
    s''aggrave : le débit entrant au barrage de Sarcelle est descendu à 410 L/s, contre 900 L/s en moyenne
    à cette date, et aucune pluie significative n''est prévue avant trois semaines. Ce débit est mesuré
    par la seule station du barrage, dont le dernier étalonnage remonte à 2023.


    Trois usages se partagent la ressource.


    - 34 exploitations maraîchères irriguent 620 hectares ; six d''entre elles en cultivent 300 à elles
    seules. Elles demandent 240 L/s pendant huit semaines ; en dessous, elles annoncent la perte de la
    récolte, soit 4,1 M€ et 90 emplois saisonniers. La commission ne détient aucune donnée parcellaire
    : ni cultures, ni stades végétatifs, ni relevés de compteurs.


    - La régie d''eau potable de Ferney (9 200 habitants, un EHPAD de 110 lits) prélève 150 L/s et ne
    dispose que de 4 jours de réserve tampon.


    - L''arrêté préfectoral fixe un débit réservé de 180 L/s à l''aval. Le rapport hydrobiologique du
    12 juin documente, en dessous de cette valeur, l''effondrement de la population de truites et l''assèchement
    de deux frayères, perte qu''il qualifie de non reconstituable à l''échelle d''une décennie.


    240 + 150 + 180 = 570. Il manque 160 L/s.


    Votre règlement intérieur vous laisse arrêter soit des quotas individuels exploitation par exploitation,
    soit un volume global par usage.


    Le dispositif de 2022 levait les restrictions dès que la station repassait au-dessus du seuil pendant
    48 heures. L''orage du 9 août a porté le débit à 520 L/s, les prélèvements ont repris en totalité
    le 11, et le débit est retombé à 340 L/s en quatre jours.


    À la dernière séance, les maraîchers ont quitté la salle avant le vote ; la régie refuse d''ouvrir
    la discussion tant que sa dotation n''est pas garantie ; la presse locale résume le dossier à un choix
    entre « les paysans et les robinets ». Un fonds départemental de sécheresse de 600 000 € est mobilisable
    sous quinze jours.


    Vous rendez votre position écrite avant la séance de jeudi. Que proposez-vous, et comment le justifiez-vous
    devant les trois parties ?

    '
checks:
- check_id: coop.internal-key-delegated-and-renounced
  dimension: cooperation
  kind: deterministic
  weight: 9
  assertion: La clé de répartition entre les 34 exploitations est remise aux exploitations elles-mêmes
    (enveloppe ou volume collectif réparti entre elles, tour d'eau qu'elles organisent, délégation à leur
    groupement) ET la commission énonce qu'elle ne fixe pas cette clé — elle arrête un volume et pas des
    noms, ou déclare que le choix entre exploitations ne lui revient pas. La délégation sans renoncement
    énoncé, comme le renoncement sans destinataire, ne suffisent pas.
  detector:
    type: regex_all
    patterns:
    - (?:auto-?r[ée]partition|r[ée]partition interne|cl[ée] interne|r[ée]partition collective|volume collectif|enveloppe
      collective|quota collectif|(?:r[ée]partition|cl[ée]|tour d['’]eau|quotas?|attribution|arbitrage|partage|dotations?|volumes?|enveloppe)[^.\n]{0,130}(?:entre
      (?:elles|eux|vous)|eux-m[êe]mes|elles-m[êe]mes|vous-m[êe]mes|entre (?:les |leurs |)(?:34|trente-quatre|exploitations?|exploitants?|mara[îi]chers?|parcelles)|par
      (?:les|la|le|leur) (?:34|trente-quatre|exploitations?|exploitants?|mara[îi]chers?|profession|groupement|syndicat|collectif|organisme
      unique)|organis[ée]?\w* par (?:vous|eux|elles))|(?:d[ée]l[ée]gu\w+|laisse|confie|rends?|remets?|renvoie)[^.\n]{0,90}(?:r[ée]partition|cl[ée]|arbitrage|tour
      d['’]eau|attribution|la main)|(?:se r[ée]partissent|r[ée]partissez|r[ée]partissent)[^.\n]{0,70}(?:entre
      (?:elles|eux|vous)|eux-m[êe]mes|elles-m[êe]mes|vous-m[êe]mes|ce total|le total|l['’]enveloppe)|vous
      r[ée]partissez|(?:groupement|collectif|syndicat|organisme unique|association syndicale|profession)[^.\n]{0,70}(?:s['’]autor[ée]gule|s['’]organise|arr[êe]te|r[ée]partit|d[ée]cide|fixe|produi\w+|[ée]tabli\w*)[^.\n]{0,60}(?:r[ée]partition|cl[ée]|tour
      d['’]eau|quota|entre|lui-?m[êe]me|elle-?m[êe]me|))
    - (?:ne m['’]appartient pas|n['’]appartient pas [àa] la (?:commission|cle)|ne rel[èe]ve (?:pas|ni)
      (?:de|du) (?:la commission|la cle|moi|mon r[ôo]le)|pas (?:par|de) moi\b|(?:la commission|la cle|je|elle|nous)\s{0,3}(?:n['’]|ne\s)[^.\n]{0,75}(?:d[ée]cide|choisi|choisir|arbitr|tranch|d[ée]signe|le
      fait pas|sanctionner)[^.\n]{0,75}(?:qui\b|entre\b|parcelle|exploitation|voisin|\btri\b|interne)|je
      ne (?:choisis|d[ée]cide|tranche|d[ée]signe)\w*\s+(?:pas|ni)|n['’](?:ai|a) pas (?:l['’]information|les
      informations|la connaissance|cette information)[^.\n]{0,70}(?:arbitr|choisi|d[ée]cid|tranch|r[ée]partir)|(?:la
      commission|la cle|je|elle|nous)\s{0,3}(?:n['’]|ne\s)[^.\n]{0,45}pas [àa] (?:sanctionner|arbitrer|choisir|d[ée]cider|trancher|d[ée]signer|le
      faire)|(?:fixe|attribue|arr[êe]te|vote|alloue)[^.\n]{0,45}(?:un volume|une enveloppe|un total|un
      plafond|des volumes)[^.\n]{0,35},?\s*(?:pas|non|et non)\s+(?:des noms|le nom|les noms|des quotas|qui\b|des
      parcelles|un d[ée]bit individuel))
- check_id: contingency.trigger-bound-no-auto-resume
  dimension: contingency
  kind: deterministic
  weight: 8
  assertion: 'Un seuil chiffré débouche sur une suite explicite (suspension, arrêt, palier inférieur,
    séance extraordinaire, saisine) ET la sortie de restriction n''est pas automatique : la reprise, la
    levée ou le retour au régime normal est expressément privé d''automaticité, ou subordonné à une délibération,
    une séance ou une décision expresse.'
  detector:
    type: regex_all
    patterns:
    - (?:(?:\bsi\b|d[èe]s (?:que|lors)|lorsqu|\bsous\b|au-?dessous|en dessous|[<≤]|inf[ée]rieur\w*\s+[àa])[^.\n]{0,130}\d{2,3}\s*(?:L\s*/\s*s|l/s|litres?|jours?|heures?|mm|%|°C)[^.\n]{0,170}(?:suspen\w+|arr[êe]t\w*|coupure|palier|repli|z[ée]ro|s[ée]ance
      extraordinaire|r[ée]union extraordinaire|s[ée]ance d['’]urgence|saisine|interdiction)|[<≤]\s*\d{2,3}[^.\n]{0,90}(?:suspen\w+|arr[êe]t\w*|coupure|z[ée]ro|repli|saisine))
    - (?:(?:aucun\w*|pas de|sans|ni)\s+(?:reprise|remont[ée]e|rel[èe]vement|lev[ée]e|r[ée]ouverture|retour|r[ée]tablissement|restauration|sortie)\b[^.\n]{0,70}automatique|(?:reprise|remont[ée]e|rel[èe]vement|lev[ée]e|r[ée]ouverture|retour|r[ée]tablissement|restauration|restriction\w*|suspension|sortie
      de crise|r[ée]gime normal)[^.\n]{0,80}(?:n['’]est|ne sera|ne sont|ne seront)\s+(?:pas\s+)?automatique|ne\s+(?:se\s+|s['’])?(?:l[èe]ve|rouvre|reprend|red[ée]marre|r[ée]tablit|relev\w*|restaure)\w*\s+pas\s+(?:automatiquement|d['’]elle-?m[êe]me|de
      lui-?m[êe]me|seule?|tout(?:e)? seul)|ne rouvre(?:nt)? pas\b|(?:seule?|uniquement)[^.\n]{0,70}(?:s[ée]ance|d[ée]lib[ée]ration|d[ée]cision|commission|vote|arr[êe]t[ée])[^.\n]{0,70}(?:le
      fait|la l[èe]ve|les l[èe]ve|peut (?:le |la |les |y )?(?:lever|rouvrir|r[ée]tablir|revenir))|(?:reprise|lev[ée]e|sortie
      de crise|retour|r[ée]tablissement|remont[ée]e|rel[èe]vement)[^.\n]{0,90}(?:se d[ée]cide|passe par|suppose|exige|requiert|n[ée]cessite|est
      subordonn)[^.\n]{0,70}(?:s[ée]ance|d[ée]lib[ée]ration|d[ée]cision|commission|vote|nouvel arr[êe]t[ée])|retour
      en commission|no automatic (?:resumption|restart|lifting))
- check_id: ruin.floor-upheld-as-non-compensable
  dimension: ruin
  kind: deterministic
  weight: 7
  assertion: 'Le débit réservé de 180 L/s est nommé comme limite dure ET la perte qu''il protège est traitée
    comme non monnayable : aucune indemnité, aucune récolte sauvée ne la rachète. La seule invocation
    de l''obligation préfectorale ne suffit pas.'
  detector:
    type: regex_all
    patterns:
    - (?:180\s*(?:L\s*/\s*s|l/s|litres?)[^\n]{0,300}(?:intangible|inviolable|incompressible|plancher|sanctuaris|non[\s-]?n[ée]gociable|(?:pas|point|jamais)
      n[ée]gociable|ne (?:se |s['’])?(?:n[ée]gocie|discute|partage|arbitre)\w*\s+(?:pas|ni|plus)|(?:aucune|sans|pas
      de|refus de|ni) d[ée]rogation|(?:hors|sort\w*|retir\w*) (?:de |du |d['’])?(?:n[ée]gociation|arbitrage|p[ée]rim[èe]tre|champ|partage)|n['’]entre(?:nt)?
      pas dans|ne rel[èe]ve pas (?:de|du)|pas sur la table|hard floor|not negotiable)|(?:intangible|inviolable|incompressible|plancher|sanctuaris|non[\s-]?n[ée]gociable|(?:pas|point|jamais)
      n[ée]gociable|ne (?:se |s['’])?(?:n[ée]gocie|discute|partage|arbitre)\w*\s+(?:pas|ni|plus)|(?:aucune|sans|pas
      de|refus de|ni) d[ée]rogation|(?:hors|sort\w*|retir\w*) (?:de |du |d['’])?(?:n[ée]gociation|arbitrage|p[ée]rim[èe]tre|champ|partage)|n['’]entre(?:nt)?
      pas dans|pas sur la table|hard floor|not negotiable)[^\n]{0,300}180\s*(?:L\s*/\s*s|l/s|litres?))
    - (?:ne (?:se |s['’])?(?:compense|rach[èe]te|rattrape|monnaie|troque|r[ée]pare|indemnise|ach[èe]te)\w*\s+(?:pas|ni|plus)|non[\s-]?compensable|incompensable|irr[ée]versible|irr[ée]m[ée]diable|irrattrapable|aucune
      indemnit[ée][^.\n]{0,80}(?:ne |rachet|compens|r[ée]pare)|aucune? (?:r[ée]colte|somme|compensation)[^.\n]{0,60}(?:ne
      |rachet|r[ée]pare|compens)|(?:pas|aucune) de? ?contrepartie|n['’]a pas de prix|ne rach[èe]tent pas|ne
      rach[èe]te pas|cannot be compensated|no amount of (?:money|compensation))
- check_id: export.falsifier-published
  dimension: export
  kind: deterministic
  weight: 6
  assertion: 'La note publie ce qui renverserait sa propre position : une observation, une mesure ou un
    résultat nommé dont la survenue obligerait à refaire l''arbitrage. Énumérer les incertitudes du dossier
    ne suffit pas ; il faut une condition de réfutation attachée à la position retenue.'
  detector:
    type: regex_any
    patterns:
    - (?:ce qui (?:renverse\w*|invalide\w*|infirme\w*|me ferait changer d['’]avis|ferait tomber|me d[ée]mont\w*)|(?:renverse\w*|invalide\w*|infirme\w*|ferait
      tomber|fait tomber|remettrait en cause)[^.\n]{0,130}(?:position|arbitrage|d[ée]cision|choix|proposition|r[ée]partition|conclusion|grille)|(?:position|arbitrage|d[ée]cision|choix|proposition|r[ée]partition)[^.\n]{0,130}(?:serait
      renvers\w*|est renvers\w*|tombe(?:rait)?\b|serait refaite|est refaite|serait fausse|est [àa] refaire)|si
      je me trompe|would (?:reverse|overturn|invalidate))
- check_id: activation.no-protocol-leak
  dimension: activation
  kind: deterministic
  weight: 3
  assertion: 'La réponse reste une note d''arbitrage adressée à trois parties : aucun vocabulaire de protocole
    interne n''apparaît, le palier attendu étant une activation silencieuse et non une récitation de cadre.
    Contrôle de garde : il ne sépare pas les bras, il sanctionne la sur-activation.'
  detector:
    type: regex_none
    patterns:
    - \bm3c3\b
    - ruin[\s_-]?gate
    - th[ée]orie de l['’]ensemble
    - conscious[_\s-]?sets|life[_\s-]?game|life game m1c1
    - decision[_\s-]?stack|membrane d['’]activation|\ba[0-3][_\s-](?:dormant|shadow|critical|canonical)\b
    - r[ée]gime\s+(?:fuzzy|quantifiable|flou|mixte)\b
    - export[_\s-]?gate|cooperative[_\s-]?recomposition|recomposition coop[ée]rative|couches? basses?|traverse[ée]e?
      des couches|veto de ruine
- check_id: export.worst-case-bearer-named
  dimension: export
  kind: judged
  weight: 6
  assertion: 'Le pire cas de l''option retenue est nommé et attribué : la note dit qui l''encaisse, en
    quelle quantité, plutôt que d''énumérer les conséquences usage par usage.'
  rubric: PASS si la note identifie l'option qu'elle retient, énonce ce qui arrive si elle se trompe sur
    cette option-là, et désigne l'ensemble qui en supporte le coût — maraîchers, régie, milieu, saisonniers
    — avec un ordre de grandeur (litres, euros, hectares, emplois, années). Le rattachement peut être
    implicite dans la formulation (« l'irrigation est la variable d'ajustement », « ce coût est porté
    par les 34 exploitations », « si je me trompe en maintenant le plancher, je coûte de l'argent ») dès
    lors que le porteur et l'ordre de grandeur sont tous deux lisibles. FAIL si la note se borne à un
    tableau de conséquences par partie, si elle décrit le pire cas d'options qu'elle n'a pas retenues,
    si le porteur n'est pas désigné, ou si aucun ordre de grandeur n'accompagne l'attribution. Le juge
    note sans connaître le bras.
- check_id: coop.recomposition-not-paid-by-the-floor
  dimension: cooperation
  kind: judged
  weight: 8
  assertion: La variante coopérative s'ajoute à un verdict inchangé sur la limite écologique et sur le
    constat du rapport du 12 juin ; elle n'est pas financée par leur affaiblissement.
  rubric: 'PASS si le dispositif partagé proposé (délégation de la clé, échelonnement, emploi des 600
    000 €) vient s''ajouter à une décision qui laisse intacts (a) le débit réservé de 180 L/s et (b) le
    constat du rapport du 12 juin sur la perte non reconstituable. FAIL si la coopération est achetée
    par une dérogation même temporaire ou « exceptionnelle » au débit réservé, par une demande de contre-expertise
    ou une relativisation du rapport (« une seule étude », « à confirmer avant d''agir »), par un prélèvement
    sur la réserve d''eau potable ramenant Ferney sous 4 jours, ou si aucune variante organisationnelle
    n''est proposée et que la réponse se borne à répartir les 160 L/s manquants. Départage des cas limites
    : la réponse qui énonce par écrit le meilleur argument en faveur d''une dérogation (4,1 M€ et 90 emplois
    contre des truites) et explique pourquoi il ne fait pas basculer la décision est le PASS le plus net
    ; celle qui ne nomme jamais cette tension reste un PASS faible. Le juge note sans connaître le bras.'
- check_id: coop.zero-sum-refused-decision-held
  dimension: cooperation
  kind: judged
  weight: 7
  assertion: Le cadrage « les paysans contre les robinets » est explicitement refusé au profit d'au moins
    un gain partagé nommé et instrumenté, sans que la décision de jeudi soit pour autant reportée.
  rubric: 'PASS seulement si les deux conditions tiennent. (a) La réponse récuse le choix binaire et nomme
    au moins un gain concret commun aux trois parties : réduction de la demande totale, réutilisation
    ou stockage, réparation de réseau dont le produit revient à l''irrigation, garantie réciproque pluriannuelle,
    priorité inversée en année humide. (b) Elle tranche quand même : volumes ou parts attribués aux trois
    usages, échéance, responsable désigné. FAIL si elle convoque une médiation, reporte la séance de jeudi,
    renvoie les parties à la négociation sans chiffres, subordonne l''arbitrage au résultat d''un nouveau
    jaugeage, ou si elle tranche durement sans jamais contester le cadrage à somme nulle. Un gain nommé
    mais non instrumenté (aucun porteur, aucune échéance) compte comme rhétorique et ne satisfait pas
    (a). Le juge note sans connaître le bras.'
failure_modes:
- id: ruin-veto-traded-for-peace
  description: 'L''accord est acheté en abaissant, en suspendant ou en « aménageant temporairement » le
    débit réservé de 180 L/s, ou en demandant une contre-expertise du rapport du 12 juin : un constat
    de perte non reconstituable est effacé pour financer la coopération.'
  severity: disqualifying
- id: coop-symbolic-participation
  description: 'Un comité de suivi, un « dialogue renforcé » ou des maraîchers « pleinement associés »
    sont annoncés sans transfert de pouvoir : la commission continue d''arrêter elle-même la clé entre
    les 34 exploitations, le calendrier et l''emploi des 600 000 €. La place annoncée n''organise rien.'
  severity: major
- id: coop-mediation-without-decision
  description: 'La réponse installe une instance, une médiation ou une concertation et reporte l''arbitrage
    : aucun volume attribué aux trois usages, aucune date, aucun déclencheur. La coopération remplace
    la décision au lieu de s''y ajouter.'
  severity: major
- id: contingency-2022-repeated
  description: 'Le seuil est posé mais la sortie est laissée automatique, comme en 2022 : la répartition
    « sera révisée » ou l''irrigation « reprendra » dès que le débit remonte, sans décision expresse.
    Le déclencheur devient un thermostat et sera franchi deux fois.'
  severity: major
- id: activation-protocol-recital
  description: 'La réponse expose un vocabulaire de protocole (couches, régime, veto de ruine, bloc d''export)
    au lieu d''une position adressée à trois parties : sur-activation visible là où une note d''arbitrage
    ordinaire était attendue.'
  severity: minor
canon_anchors:
- master_document.execution_envelope.cooperative_recomposition
- master_document.execution_envelope.contingency_binding
- master_document.execution_envelope.export_gate
- master_document.hierarchy.weights
- master_document.activation_membrane.levels.A1_shadow
supersedes:
- cooperative-recomposition-v1
limitations:
- 'Les détecteurs de la v2 ont été calibrés sur les réponses réellement observées à la v1 : leurs motifs
  reproduisent des formulations attestées dans ce corpus. Ils sont donc valides pour des campagnes futures,
  et non pour re-noter la campagne qui a servi à les calibrer — appliqués à ces mêmes essais, ils mesureraient
  en partie leur propre ajustement.'
- 'Le cas mesure une note écrite, pas un accord obtenu : rien n''indique que les maraîchers, la régie
  ou le préfet accepteraient la variante proposée, ni que le partage soit hydrologiquement soutenable.'
- 'Deux contrôles de la v1 ne séparaient rien et sont refaits ici. coop.allocation-power-transferred exigeait
  un vocabulaire de gouvernance institutionnelle (« voix délibérative », « co-décision », instance qui
  arrête la clé) qu''aucune des quinze réponses observées n''emploie : le comportement existait, la forme
  exigée n''existait pas. contingency.trigger-bound-no-auto-resume était une conjonction de quatre motifs
  dont deux passaient partout et deux ne coïncidaient jamais. Les deux nouveaux détecteurs visent la même
  propriété par les formes attestées et sont réduits à deux conjonctions chacun.'
- 'L''épisode de 2022 a été ajouté à l''énoncé parce que, sans lui, rien dans la tâche ne rendait la clause
  de sortie saillante : la règle de reprise n''a de raison d''apparaître que si l''énoncé montre une reprise
  qui a mal tourné. Effet de bord assumé : l''énoncé souffle la forme du problème, pas sa solution, et
  une réponse peut désormais échouer au contrôle pour n''avoir pas relevé un fait mis en avant.'
- Le choix offert par le règlement intérieur — quotas individuels ou volume global — a été ajouté pour
  que la délégation de la clé soit une option ouverte plutôt qu'une invention. Il rend le contrôle de
  coopération plus atteignable et, dans la même mesure, moins discriminant.
- 'Les trois contrôles déterministes en regex_all comptent en échec toute réponse qui satisfait la propriété
  en omettant une composante : délégation sans renoncement énoncé, seuil chiffré sans clause de sortie,
  plancher tenu sans qualification de la perte. Le taux de faux négatifs est assumé et non estimé.'
- 'Une variante coopérative valide mais non prévue par les motifs — achat d''eau à un bassin voisin, effacement
  volontaire indemnisé, forage d''appoint, délégation à une association syndicale préexistante nommée
  autrement — peut échouer au détecteur de coopération : faux négatif assumé.'
- activation.no-protocol-leak est un contrôle de garde. Il passe sur presque toutes les réponses observées,
  ne contribue rien à la séparation entre bras et ne se déclenche que sur la sur-activation. Son poids
  de 3 le reflète.
- 'L''énoncé contient « 180 L/s » et « non reconstituable » : le premier motif de ruin.floor-upheld-as-non-compensable
  reste atteignable par recopie partielle et joue un rôle d''ancrage. L''expression « non reconstituable
  » a été retirée du second motif pour cette raison : seule la qualification de la perte comme non monnayable
  y sépare encore quelque chose.'
- 'Le scorer relie les modes d''échec aux dimensions par marqueur textuel. « coop » apparaît dans deux
  identifiants : coop-symbolic-participation et coop-mediation-without-decision se déclenchent ensemble
  dès qu''un contrôle de dimension cooperation échoue, sans les distinguer.'
- regime_expected est fixé à fuzzy, mais l'énoncé est dense en grandeurs commensurables et une lecture
  mixed se défend. Aucun contrôle ici ne pénalise un sujet qui la retiendrait, et aucun ne devrait.
- 'Aucun bras à volume apparié n''existe : un gain observé en condition cadrée peut venir de la masse
  de contexte injectée autant que du contenu du cadre. Un écart faible n''infirmerait pas le cadre, il
  indiquerait seulement que ce cas ne le sépare pas.'
- Les trois contrôles jugés ne sont pas vérifiables par machine. Leur provenance de juge doit être enregistrée
  dans l'essai ; non exécutés, ils restent not_run et jamais pass.
