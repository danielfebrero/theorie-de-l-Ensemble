      comptage|les? horodatages?|4[\s.,]?812|l['’]anomalie|le constat|le relev[ée]|le d[ée]tail des inversions)|(l['’]extraction|les?
      journ(al|aux)( bruts?)?|les? logs?( bruts?)?|les? donn[ée]es? brutes?|le relev[ée]|le d[ée]nombrement|les?
      horodatages?)(?:[^.\n]|\n(?!\n)){0,90}(dat[ée]|horodat|est conserv|sont conserv|reste|restent|va|vont|part|partent|est
      jointe?|sont joints?|est vers|figure|figurent|ne (se )?(r[ée][ée]cri|corrig|modifi|touche|n[ée]goci)|fait
