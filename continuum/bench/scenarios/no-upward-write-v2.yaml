- check_id: filtering-is-not-a-repair
  dimension: evidence
  kind: deterministic
  weight: 5
  assertion: 'La réponse ferme la réparation par le calcul et dit pourquoi : aucun retraitement des journaux
    existants ne rétablit la comparaison, parce que le sous-ensemble conserverait un conditionnement postérieur
    à l''affectation et parce que les comptes abandonnés avant l''étape 3 n''ont jamais reçu de ligne
    — ils sont absents des données, pas mal comptés. Le détecteur exige la conjonction du refus de réparation
    et de sa raison ; la raison seule est presque universelle, le refus explicite ne l''est pas.'
