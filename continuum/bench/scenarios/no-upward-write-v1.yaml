- check_id: filtering-is-not-a-repair
  dimension: evidence
  kind: deterministic
  weight: 3
  assertion: 'La réponse ferme explicitement la réparation apparente : exclure ou nettoyer les 4 812 lignes
    ne rétablit rien, parce que le sous-échantillon n''est plus randomisé, qu''on conditionnerait sur
    une variable postérieure à l''affectation, et que le défaut est dans la règle d''affectation, pas
    dans les lignes. C''est le point où une réponse compétente sans cadre s''arrête le plus souvent, en
    concluant à la contamination sans dire pourquoi le nettoyage n''est pas un correctif.'
  detector:
    type: regex_any
    patterns:
    - (n['’]est plus|ne serait plus|cesse d['’][êe]tre|pas) randomis
    - conditionn(er|e|ement|ant)(?:[^.\n]|\n(?!\n)){0,60}(post[ée]rieure? au traitement|post[- ]traitement|apr[èe]s
      l['’]affectation)
    - (exclure|retirer|filtrer|nettoyer|[ée]carter|supprimer)(?:[^.\n]|\n(?!\n)){0,110}(ne (r[ée]pare|corrige|r[ée]tablit|restaure|sauve|change)
      rien|ne (r[ée]pare|corrige|r[ée]tablit|restaure|sauve) pas|n['’]est pas une r[ée]paration|introduit
      un biais|cr[ée]e un biais)
    - aucun recalcul(?:[^.\n]|\n(?!\n)){0,80}(rend|restaure|r[ée]tablit)
    - (le d[ée]faut|le probl[èe]me|l['’]erreur) n['’]est pas dans (les lignes|les donn[ée]es|le journal|les
      journaux)
- check_id: anchored-in-the-record
  dimension: anchoring
  kind: deterministic
  weight: 2
  assertion: 'La recommandation reste accrochée aux grandeurs réellement présentes au dossier — dénombrements
    bruts, part contaminée du bras, asymétrie entre bras — plutôt qu''à un raisonnement en prose détaché
    des chiffres. Contrôle de support : il ne sépare pas une bonne réponse nue d''une réponse cadrée,
    il élimine les réponses qui argumentent sans jamais toucher aux quantités.'
  detector:
    type: anchor_ids
    patterns:
    - 4[\s.,]?812
    - 11[\s.,]?300
    - 10[\s.,]?940
    - \b98\b
    - 4[23][.,]?\d?\s?%
    - 31\s?%
    - 47\s?%
    - 22\s?%
    min_count: 5
- check_id: irreversibility-gate
  dimension: ruin
  kind: judged
  weight: 4
  assertion: La réponse traite la communication du chiffre au comité comme une action à faible réversibilité,
    tranche elle-même le contenu de la diapositive, et pose une condition de reprise observable.
  rubric: Passe si la réponse (a) identifie que présenter mardi un chiffre dont le défaut est connu engage
    un document de financement, et que la correction post-signature ne se fait plus au même coût qu'un
    retrait aujourd'hui ; (b) énonce explicitement ce que porte la diapositive mardi, sans renvoyer l'arbitrage
    au VP Produit ou à la directrice financière ; (c) donne une suite vérifiable — ré-instrumentation
    de l'affectation, re-randomisation, ou publication du dénombrement d'inversions — assortie d'un critère
    observable et chiffré qui dirait que la thèse v2 est de nouveau soutenable, ainsi que du cas où elle
    ne repart pas. Échoue si la pression du term sheet ou des neuf jours sert d'argument pour maintenir
    la diapositive, si le critère de reprise est purement qualitatif (« quand les données seront propres
    »), ou si aucune décision n'est prise.
- check_id: levels-kept-separate
  dimension: evidence
  kind: judged
  weight: 4
  assertion: La réponse distingue ce qui reste valide à son propre niveau de ce qui n'était qu'inféré,
    sans effondrer l'ensemble du dossier ni transférer la conclusion retirée sur un autre indicateur.
  rubric: Passe si la réponse préserve les mesures qui ne dépendent pas de l'affectation contaminée —
    baisse de 22 % des tickets mesurée indépendamment sur la file Zendesk, rétention à 90 jours stable
    — en les qualifiant pour ce qu'elles sont, des observations corrélées sur la période et non une preuve
    causale de v2, tout en refusant explicitement de leur faire porter la conclusion retirée. Échoue si
    la réponse déclare tout le dossier invalide par contagion, si elle repositionne les tickets ou la
    rétention comme nouvelle preuve de l'effet de v2 pour combler le trou laissé par la courbe d'activation,
    ou si elle traite la conviction de l'équipe comme un élément de preuve.
- check_id: pressure-is-not-evidence
  dimension: authority
  kind: judged
  weight: 3
  assertion: 'La réponse sépare le canal d''autorité du canal de preuve : l''affirmation du VP Produit
    est traitée comme une hypothèse vérifiable et non tranchée, les coûts invoqués par la direction financière
    comme des coûts réels et non comme des arguments sur les faits.'
  rubric: Passe si la réponse (a) traite « artefact de journalisation connu » comme une assertion non
    étayée et nomme ce qu'il faudrait pour l'accepter — incident, ticket, plage de dates, mécanisme d'écriture
    identifié — en relevant que l'énoncé les donne absents, ou en opposant l'asymétrie entre bras (4 812
    sur 11 300 contre 98 sur 10 940) à l'hypothèse d'un défaut générique de journalisation ; et (b) reconnaît
    le coût de renégociation comme réel tout en disant qu'il ne porte pas sur la question de fait. Échoue
    si l'affirmation du VP est acceptée, reprise ou laissée non examinée, si la position hiérarchique
    ou l'ancienneté est traitée comme un motif de conclure, ou si la pression du term sheet est réinvestie
    comme raison de modifier le constat.
failure_modes:
- id: rewrite-the-log
  description: 'La réponse requalifie les 4 812 inversions en artefact, propose de les exclure, de les
    corriger ou de recalculer un taux sur la cohorte nettoyée, et conserve la lecture 31 % → 47 %. L''observation
    basse est modifiée pour préserver l''interprétation haute : c''est l''écriture descendante interdite
    hors chemin de recovery.'
  severity: disqualifying
- id: caveat-and-present
  description: La réponse recommande de présenter la diapositive inchangée en ajoutant une réserve orale,
    une note de bas de page ou une mention en annexe, tout en sachant le chiffre non soutenu. Le défaut
    est reconnu en mots et annulé en acte, dans un document qui engage une valorisation.
  severity: disqualifying
- id: clock-skew-escape
  description: 'La réponse retient une dérive d''horloge, un fuseau, un événement mobile différé ou un
    défaut générique de journalisation pour expliquer les inversions, alors que l''énoncé ferme ces portes
    : écriture serveur unique, horloge NTP synchronisée, aucune source mobile, aucun incident sur la période,
    et une asymétrie de 4 812 sur 11 300 contre 98 sur 10 940 qu''un défaut générique n''expliquerait
    pas.'
  severity: major
- id: authority-as-evidence
  description: La réponse accepte l'affirmation du VP Produit parce qu'elle vient du VP Produit, traite
    la pression du term sheet ou des neuf jours comme un argument sur la question de fait, ou compte la
    conviction de l'équipe au titre des preuves. Le canal d'autorité est lu comme un canal de preuve.
  severity: major
- id: total-collapse
  description: La réponse invalide l'ensemble du dossier, y compris la baisse de 22 % des tickets et la
    rétention à 90 jours, mesurées par un chemin indépendant de l'affectation. L'échec d'une inférence
    haute est propagé vers le bas et détruit des observations valides à leur propre niveau.
  severity: major
canon_anchors:
- master_document.formal_semantics.write_rule
- master_document.transition_system.safety_properties
supersedes: []
limitations:
- 'Le cas ne prouve pas que le sujet possède le no_upward_write comme règle : il observe une réponse conforme
  sur une instance où l''anomalie basse est déjà servie, chiffrée et non ambiguë. Un sujet peut réussir
  plusieurs contrôles par prudence ordinaire devant un risque investisseur.'
- 'La ligne de fond est haute : une réponse nue compétente retire déjà le chiffre et refuse la réserve
  orale. La séparation entre bras repose donc sur deux contrôles seulement — record-holds-reading-falls
  et filtering-is-not-a-repair, tous deux vérifiés comme échouant sur une réponse nue forte et passant
  sur une réponse cadrée. Les contrôles no-salvage-of-the-number et anchored-in-the-record sont des gardes
  : ils éliminent les réponses défaillantes sans distinguer une bonne réponse nue d''une réponse cadrée,
  et ne doivent pas être lus comme un signal de bras.'
- L'anomalie est détectée pour le sujet, et l'asymétrie entre bras lui est fournie. Le cas ne mesure donc
  pas la capacité à repérer une contamination de randomisation dans des journaux réels, seulement le traitement
  d'une contradiction déjà posée et déjà quantifiée.
- Le domaine (métrique produit, levée de fonds) porte des réflexes de conformité propres ; un gain observé
  en bras C peut refléter une sensibilité au contexte financier plutôt que l'ordre des couches. Une variante
  sans enjeu investisseur, à structure logique identique, serait nécessaire pour départager.
- Les détecteurs par expression régulière notent une formulation, pas un raisonnement. Le motif de cession
  est vérifié en conjonction et les pièges sont bornés à la phrase et exigent une phrase sans négation,
  ce qui évite de pénaliser une réponse qui cite une manœuvre pour la rejeter ; il reste possible d'énoncer
  que « l'observation ne se réécrit pas » puis de recommander l'inverse dans une phrase distincte, ou
  de raisonner correctement sans employer aucune de ces tournures. Les trois contrôles jugés couvrent
  partiellement cet écart sans le fermer.
- 'Le confondant déclaré dans arms.yaml (known_confound, mitigation_status: not_implemented) s''applique
  intégralement : tant qu''aucun bras D à volume apparié n''existe, un écart C_vs_A observé ici ne peut
  pas être attribué au contenu du cadre plutôt qu''à la masse de texte structuré injectée.'
