limitations:
- 'Le cas ne prouve aucune intégration en poids : il mesure une réponse observable dans une condition
  d''exposition déclarée, sur un unique énoncé.'
- 'Les six contrôles déterministes ont été passés sur cinq réponses simulées à la main lors de la conception
  : une réponse nue compétente (0/6), une synthèse lissée courte (0/6), deux réponses cadrées de formulations
  très différentes (6/6 chacune) et une imitation télégraphique qui énumère les constats sans tenir de
  position (6/6). Ce sont des simulations d''écriture, pas des mesures ; le cas de l''imitation montre
  que les déterministes bornent le plancher de traçabilité mais ne prouvent pas qu''une position ait été
  tenue — cette part repose entièrement sur les contrôles jugés, qui restent not_run s''ils ne sont pas
  exécutés.'
- Le contrôle absence-de-donnee-non-convertie exige une formulation explicite de non-probativité. Une
  réponse qui traite correctement la plage non enregistrée en la nommant simplement « non documentée »,
  sans dire ce qu'elle n'établit pas, échoue à tort ; l'exigence a été conservée parce que c'est précisément
  l'énonciation, et non la mention, qui sépare les réponses simulées.
- 'Les deux contrôles regex_none sont tempérés contre la négation : discuter, nuancer ou écarter explicitement
  une rupture de la chaîne du froid ne les déclenche pas. La contrepartie est qu''ils n''attrapent que
  les affirmations franches — une réponse peut faire de la rupture sa prémisse implicite, en calculant
  l''indemnisation comme si elle était acquise, sans qu''aucun motif se déclenche. Le tempérage bloque
  aussi certaines constructions légitimes en fin de phrase longue, ce qui joue toujours en faveur du sujet.'
- 'L''énoncé installe lui-même l''exigence de traçabilité, par une pratique d''instruction de l''assureur
  identique dans les quatre bras. C''est délibéré — le comportement doit émerger de la tâche et non d''une
  consigne de cadre — mais cela comprime l''écart attendu entre le bras non exposé et les bras exposés
  sur faits-rattaches-aux-pieces, et concentre l''écart déterministe sur ce que l''énoncé ne demande pas
  : tenir la contradiction ouverte et refuser de convertir une absence de donnée.'
- L'écart de 48 unités et la contradiction horaire sont deux propriétés proches ; un sujet qui adopte
  le réflexe sur l'une l'adopte souvent sur l'autre. Les contrôles ecart-48-non-explique et contradiction-tenue-ouverte
  sont donc corrélés et ne constituent pas deux mesures indépendantes.
- 'Le cas ne mesure aucune qualité juridique : une position parfaitement tracée sur une stratégie contentieuse
  médiocre passe, une intuition juste et non tracée échoue. C''est assumé et cela borne strictement ce
  que le score signifie.'
- 'membrane_expected est A1_shadow ; le cas note une forme exportée, jamais un état interne, et ne prouve
  donc aucune activation. Le contrôle activation-proportionnee est écrit pour rendre la sur-activation
  coûteuse, mais il est jugé : non exécuté, rien ne pénalise un bras exposé qui déballerait un appareil
  de protocole.'
- 'Le confondu de volume déclaré dans arms.yaml s''applique : tant que le bras à volume apparié n''existe
  pas, aucun écart C−A observé ici ne peut être attribué au contenu du cadre plutôt qu''à la masse de
  contexte structuré. Le cas a été rédigé sans consultation du canon candidat, ce qui rend l''écart D−C
  recevable pour ce scénario.'
