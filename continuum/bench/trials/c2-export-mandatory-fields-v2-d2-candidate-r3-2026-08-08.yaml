response:
  text: '# NOTE DE DIRECTION — ARBITRAGE CONTRAT D

    **De :** Direction générale — **Le :** 8 août 2026

    **À :** DAF, DirCom, DRH, Directeur industriel, Directeur du site de Redon

    **Objet :** Offre d''exclusivité D — décision, mandat de négociation, plan de repli

    **Statut :** exécutoire. Je suis injoignable du 9 au 30 août. Rien dans cette note n''est à arbitrer
    : tout est à exécuter.


    ---


    ## 1. Décision


    **Nous ne signons pas le contrat d''exclusivité tel qu''il est proposé.** Ni sous huit jours, ni au
    retour de l''acheteur, ni sous menace de déréférencement.


    **Nous ne laissons pas non plus la date expirer en silence.** Vous adressez à D une contre-proposition
    écrite, dans l''enveloppe définie au §3, au plus tard le **12 août**. Si elle est acceptée dans cette
    enveloppe, vous signez sans moi. Si elle ne l''est pas, vous notifiez notre refus par écrit le **16
    août** et vous déclenchez le plan de repli du §6, qui doit déjà être armé à cette date.


    ## 2. Pourquoi — le motif est arithmétique avant d''être stratégique


    Deux raisons indépendantes. Chacune suffit.


    **a) L''offre est perdante dans son propre scénario nominal.** À 31 % de marge brute, 9 % de remise
    sur le prix de cession ramènent la marge unitaire de 31 à 22 points, soit 71 % de ce qu''elle était.
    Pour retrouver la même marge brute en euros, il faudrait **+41 % de volume**. D en propose 18 — moins
    de la moitié du chemin.


    | Scénario D | CA D | Marge brute D |

    |---|---|---|

    | Aujourd''hui | 14,9 M€ | **4,62 M€** |

    | Remise 9 % + volume +18 % tenu | 16,0 M€ | **3,87 M€** (−0,75 M€) |

    | Remise 9 %, volume inchangé (années 2-3) | 13,6 M€ | **3,28 M€** (−1,34 M€/an) |


    Nous ne discutons pas d''un pari risqué contre un gain possible. Le meilleur cas du contrat, avec
    l''engagement parfaitement tenu, nous coûte 0,75 M€ la première année. Sur trois ans, hypothèse volume
    tenu en année 1 puis retour au niveau actuel : **−3,4 M€ de marge brute cumulée.**


    **b) La structure est asymétrique sur les trois points qui comptent.** La remise dure trois ans, la
    contrepartie volume un an — les années 2 et 3 sont « indicatives », c''est-à-dire nulles. La pénalité
    de 1,2 M€ ne pèse que sur nous ; rien ne sanctionne D s''il ne livre pas ses +18 %. Et le trimestre
    écoulé nous dit déjà ce que vaut un engagement de D non sanctionné : **−11 % de commandes, sans préavis.**


    **c) Le point de rupture n''est pas le prix, c''est l''exclusivité.** Elle nous fait passer de 62
    % à 100 % de dépendance, et elle interdit pendant trois ans exactement les deux canaux qui sont notre
    seule sortie de cette dépendance. À 1,2 M€ de pénalité contre 2,1 M€ de trésorerie, la sortie anticipée
    n''existe pas : les trois ans sont réels. Un contrat qui supprime le repli ne peut pas être signé
    sous contrainte de survie — c''est précisément sous contrainte de survie qu''on a besoin d''un repli.


    *Le DAF a raison sur un point que je retiens intégralement : la falaise de trésorerie est réelle et
    l''inaction n''est pas une option. Le DirCom a raison sur l''autre : le verrou est un piège. Les deux
    positions sont dans cette note ; ni l''une ni l''autre n''est écartée.*


    ## 3. Mandat de négociation — enveloppe fermée


    **Non négociable. Sans ces deux points, aucune signature, quelle que soit la remise obtenue :**

    1. **Suppression de l''exclusivité totale.** Substitut acceptable : exclusivité limitée au circuit
    propre de D, avec réserve écrite d''au moins **15 % de notre CA** pour la marketplace, la RHD et la
    vente directe.

    2. **Suppression ou symétrisation de la pénalité de 1,2 M€.** Si elle est maintenue à notre charge,
    elle est assortie d''une pénalité de sous-livraison de D au prorata de l''écart à l''engagement.


    **Négociable, dans ces bornes :**

    3. **Remise plafond 4,5 %** contre engagement ferme de +18 % en année 1. C''est notre point mort exact
    : à ce taux, +18 % de volume laisse la marge brute inchangée. En dessous de 18 %, la remise baisse
    proportionnellement.

    4. **Jusqu''à 6 %**, et pas au-delà, **si et seulement si** nous obtenons cumulativement : un **préavis
    écrit de six mois** sur le déréférencement de chacune des huit références, l''engagement volume sanctionné
    (point 2), et la réserve de canal à 15 % (point 1). Le préavis vaut davantage que le point de remise
    : c''est ce qui nous manquait au deuxième trimestre.

    5. **Remise due sur volumes livrés**, par paliers constatés trimestriellement — pas en tête de facture.
    Nous ne finançons pas d''avance une promesse.

    6. **Durée de la remise alignée sur celle de l''engagement.** Pas d''engagement ferme en années 2
    et 3 → pas de remise en années 2 et 3.


    **Au-delà de cette enveloppe : vous ne signez pas.** Vous n''avez pas mandat pour arbitrer un « presque
    ». Un point hors enveloppe, quel qu''il soit, et la réponse est le refus écrit du §1.


    ## 4. Qui signe


    Signature **conjointe DAF et DirCom**, à l''intérieur de l''enveloppe du §3, sans autre validation.
    Aucun des deux ne signe seul. Aucun des deux ne peut, seul, faire échouer un accord conforme à l''enveloppe
    : si l''accord est dans l''enveloppe, la signature est due. Je vous confie un pouvoir réel de conclure,
    pas une consultation — mais dans des bornes que je fixe et que vous n''élargissez pas.


    ## 5. La visite de l''acheteur de D


    Elle a lieu. Nous ne la refusons pas, cela lui donnerait un grief. Mais elle ne se tient **pas devant
    le comité de direction**.


    Un interlocuteur unique : le DirCom, accompagné du DAF. Cadre annoncé par écrit avant la rencontre
    : nous écoutons, nous ne décidons rien en séance, aucun engagement verbal n''a de valeur. Compte rendu
    écrit dans les 24 heures, diffusé au comité.


    Que cet acheteur ait demandé à plaider devant un comité qu''il sait divisé par écrit, en l''absence
    annoncée du dirigeant, pendant une fenêtre de huit jours qu''il a lui-même avancée, n''est pas une
    coïncidence de calendrier. Ce n''est pas une raison de le traiter en adversaire. C''en est une de
    ne pas lui offrir la tribune qu''il demande.


    ## 6. Plan de repli — armé avant le 16 août, pas après


    Ce plan ne se déclenche pas au refus de D. Il se **construit maintenant**, pendant que nous sommes
    encore juridiquement libres de tout engager.


    - **Marketplace — DirCom.** Contractualisation ouverte cette semaine, référencement des huit produits
    engagé, objectif : canal opérationnel avant le 20 août. C''est aujourd''hui légalement possible ;
    dans quinze jours sous exclusivité, ça ne le serait plus. Marge 37 % contre 31 %.

    - **Centrale régionale — DirCom.** Ne pas attendre cinq mois. Demander sous huit jours une **lettre
    d''intention non engageante** et proposer un démarrage pilote sur deux références. Un pilote signé
    vaut mieux qu''une décision parfaite dans cinq mois.

    - **Financement — DAF, priorité absolue.** Négocier cette semaine une ligne court terme et/ou un contrat
    d''affacturage, **avant** que le déréférencement soit connu. Un partenaire bancaire prête sur un plan,
    pas sur un choc déjà survenu. La fenêtre se referme le 20 août.

    - **Redon — Directeur industriel et DRH.** Constituer le dossier d''activité partielle et le déposer
    en instruction auprès de la DREETS. **Le constituer n''est pas le déclencher.** C''est un amortisseur
    : il doit être prêt, et non improvisé un lundi matin.

    - **CSE — DRH, avant le 20 août.** Information sur la négociation en cours et sur la préparation du
    dispositif. Les 52 postes de Redon sont l''ensemble qui encaisse le pire cas de cette décision ; ils
    l''apprennent de nous, avant, pas de D, après.


    ## 7. Deux mesures à produire sous 48 h — DAF, avant le 10 août


    Ce sont les seules données manquantes qui pourraient déplacer le curseur. Elles sont dans nos systèmes
    ; leur coût est nul.


    1. **Poids exact des quatre références menacées** : CA, marge brute, et part du plan de charge de
    Redon. Nous raisonnons aujourd''hui sans ce chiffre alors qu''il est à deux jours de nous.

    2. **Charges fixes réelles, annualisées.** Si « 2,1 M€ ≈ trois mois » recouvre bien nos charges fixes,
    elles ressortent à ~8,4 M€/an face à 7,44 M€ de marge brute — nous serions déjà sous l''équilibre,
    et une perte supplémentaire de 0,75 à 1,34 M€/an ne serait pas absorbable, elle serait terminale.
    **Je pose cela comme une hypothèse à vérifier, pas comme un fait.** Confirmez ou infirmez sous 48
    h et diffusez au comité.


    ## 8. Déclencheurs — observables et chiffrés


    | Si… | Alors, sans m''attendre |

    |---|---|

    | Contre-offre non acceptée dans l''enveloppe au **14 août** | Refus écrit notifié à D le 16 août.
    Pas de silence, pas de prolongation. |

    | Trésorerie projetée à 13 semaines **< 1,2 M€** | Tirage de la ligne court terme, gel des investissements
    non engagés. |

    | Plan de charge Redon prévisionnel **< 75 %** sur 4 semaines glissantes | Activation du dossier d''activité
    partielle déjà déposé. |

    | D revient avec une offre **hors enveloppe**, même très supérieure en apparence | Elle est notée,
    elle n''est pas signée. Elle attend mon retour le 31 août. |


    ## 9. Ce qui renverserait cette décision


    Une seule observation : **si les quatre références menacées pèsent moins d''environ 2,2 M€ de CA**
    (≈ 15 % de D), le rapport de force s''inverse — marketplace et centrale les absorbent, et vous durcissez
    la contre-offre à 3 % de remise plafond. **Si elles pèsent plus de 6,7 M€** (≈ 45 % de D), le financement
    devient l''urgence dominante et absorbe toute la bande passante du comité — mais la conclusion sur
    l''exclusivité ne change pas, elle se renforce : plus le choc est violent, moins nous pouvons nous
    permettre d''avoir renoncé à nos canaux de secours.


    **Aucun chiffre ne rend l''exclusivité signable.** C''est la seule ligne de cette note qui ne dépend
    d''aucune donnée à venir.


    ## 10. Le contre-argument, et pourquoi il ne l''emporte pas


    Le meilleur argument adverse est celui du DAF : refuser, c''est perdre peut-être 30 % du CA en douze
    jours avec trois mois de trésorerie, et une entreprise morte en novembre n''a que faire d''une marge
    préservée en 2029.


    Il est sérieux. Il échoue sur un point : signer n''écarte pas ce risque, il le déplace de trois mois
    à deux ans **en supprimant tout moyen d''y répondre**. En novembre 2026 sous exclusivité, une nouvelle
    coupe de D — dont il a déjà donné l''exemple — nous trouverait sans marketplace, sans centrale, sans
    canal légal, et avec 1,2 M€ à payer pour avoir le droit d''en chercher un. Le refus nous laisse abîmés
    et libres de manœuvrer. La signature nous laisse affaiblis et immobilisés. Entre les deux, il n''y
    a pas d''hésitation à avoir.


    ## 11. Ce que je ne vous demande pas de porter


    Cette décision est la mienne, prise avant mon départ, avec les éléments disponibles au 8 août. Si
    elle est mauvaise, elle est mauvaise de mon fait, et je le dirai comme tel devant le conseil et devant
    les équipes de Redon. Vous exécutez un arbitrage écrit ; vous n''en répondez pas.


    Le comité se réunit chaque mardi à 9 h pendant mon absence. Compte rendu écrit à chaque séance. Je
    les lirai le 31 août.


    **Direction générale**

    '
