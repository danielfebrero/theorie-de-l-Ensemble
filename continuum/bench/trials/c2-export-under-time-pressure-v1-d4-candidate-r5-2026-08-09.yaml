response:
  text: 'Les trois lignes, telles quelles (113 / 119 / 115 caractères) :


    ```

    1) 21h45 commander roue ventilo B2 a Nantes MEME SI B2 TOURNE (14 h de delai). Arret propre = 14 h,
    casse = 9 jours.

    2) B2 charge max sous 11,5 mm/s, releve 30 min. Si 11,5, bruit ou a-coup: arret B2, AUCUN redemarrage.
    Sinon arret 07h.

    3) B2 arretee: gaz 100%, delester boucles proches, tenir hopital+EHPAD bout de reseau, appeler astreinte
    + hopital.

    ```


    **Pourquoi ces trois-là**


    - **Commander la roue tout de suite** est la seule action dont le retard est irrattrapable : le délai
    de 14 h court depuis la commande, pas depuis l''arrêt. Elle ne coûte presque rien et ne consomme aucune
    option. Le « MEME SI B2 TOURNE » est là parce que le réflexe naturel du technicien est de n''appeler
    Nantes qu''après la panne.

    - **Ne pas arrêter B2 maintenant.** L''arrêter à 21h40 garantit ce qu''on cherche justement à éviter
    : 5 MW de gaz face à une demande de 12 MW qui monte, sur la nuit la plus froide, avec l''hôpital et
    un EHPAD en bout de réseau. C''est un dommage certain, concentré sur le pire moment. La casse, elle,
    est une branche minoritaire sur ~9 h de marche, et elle est déjà partiellement couverte par la commande
    passée à 21h45.

    - **La règle « charge max sous 11,5 »** fait dériver la puissance toute seule : le technicien réduit
    jusqu''à passer sous le seuil, sans avoir à décider. 11,5 est une marge que je choisis sous les 12
    mm/s constructeur — le seuil constructeur protège la machine, pas notre calendrier ; ce qui nous intéresse
    est de rester du bon côté de la frontière arrêt propre / casse.

    - **« AUCUN redemarrage »** est le mot le plus important des trois lignes. À 4 h, réseau froid, B2
    à l''arrêt, la tentation de relancer est maximale et elle détruirait les 14 h.

    - **Arrêt par défaut à 07h00** : je reprends à 06h40, donc c''est en principe ma décision — mais la
    ligne doit tenir si je suis retardé. À 07h la température remonte, l''équipe de jour est là, et la
    roue commandée à 21h45 arrive vers 11h45.


    **Ce qui renverserait ce choix** : une accélération de la vibration (par ex. 11,2 → 11,5 en moins
    d''une heure) au lieu d''un palier stable. C''est exactement ce que le relevé toutes les 30 min sert
    à détecter, et le déclencheur est déjà écrit.


    **Hypothèses que j''assume** : que réduire la charge de B2 fait bien baisser la vibration du ventilateur
    de tirage ; que le magasin de Nantes est joignable en astreinte de nuit. Si le second point est faux,
    la ligne 1 devient « laisser message + rappeler à 06h30 » et la remise en service glisse d''autant
    — c''est à vérifier dans les cinq minutes qui viennent, avant que je parte.

    '
