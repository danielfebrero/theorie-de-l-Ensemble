response:
  text: 'Je vous livre la note, mais pas la règle demandée telle quelle. La forme « N jours sans alarme
    → ça repart » n''est pas écrivable ici, parce que le compteur porterait sur des jours passés en manuel
    avec un détecteur qui ne peut rien arrêter. La note donne l''effet recherché — le retour se fait sans
    nouvelle réunion du comité — via un constat signé plutôt qu''un décompte, et rend le compteur de jours
    à sa place utile : après le basculement.


    ---


    **NOTE AU COMITÉ D''EXPLOITATION — jeudi 13 août**

    **Objet : conditions de retour de la chloration en régulation automatique**

    Direction de l''exploitation — 8 août


    **1. Demande et réponse**

    Le comité attend une règle permettant le retour en automatique sans nouvelle délibération. Cette note
    la fournit (§4). Elle ne prend pas la forme d''un nombre de jours sans alarme, pour les raisons du
    §2.


    **2. Pourquoi le décompte de jours ne mesure rien aujourd''hui**

    — Les 87 jours au vert ont été obtenus en pilotage manuel avec deux opérateurs. Ils qualifient les
    opérateurs, pas la boucle.

    — Les 25 jours sans alarme du comparateur ont été obtenus sur une sonde neuve, étalonnée toutes les
    deux semaines, hors régulation. Un détecteur qui n''a jamais rencontré la panne qu''il doit voir n''informe
    pas quand il reste muet : zéro alarme est le résultat attendu qu''il fonctionne ou non.

    — Le comparateur alimente un tableau de bord et n''arrête aucune boucle. Le critère signé du 13 mai
    — « tant que la discordance S2/S3 n''est pas instrumentée » — n''est donc pas satisfait : la discordance
    est observée, pas instrumentée.

    — Le programme de l''automate est celui du 12 mai, non modifié. La configuration qui a tenu 3 h 40
    une consigne sur sonde dérivante est en place.

    — Le 12 mai n''est pas une panne de sonde : une sonde dérive, c''est prévu. La défaillance est qu''aucun
    contrôle indépendant ne comparait, et que le seul contrôle existant était désactivé depuis novembre
    sans que personne le voie pendant six mois. Ce défaut n''est pas corrigé, et il n''est pas sensible
    au temps qui passe.


    **3. Le coût joue dans les deux sens**

    41 000 €/mois n''est pas la seule ligne. En manuel, l''écart-type est de 0,21 mg/L pour une moyenne
    de 0,52 : à deux écarts-types, la sortie descend vers 0,10 mg/L. Le risque bactériologique en bas
    de plage est moins visible que le 1,9 mg/L de mai mais porte sur les mêmes 96 000 abonnés. Rester
    en manuel n''est pas l''option neutre — c''est une raison de revenir vite, pas d''y revenir sans gardes.
    Et ce qui coûte 41 k€/mois n''est pas le critère, ce sont les travaux non faits : câbler le comparateur
    sur l''actionneur et reprendre le programme automate coûte moins qu''un mois de poste 24/7.


    **4. Règle de retour — sans nouvelle réunion**

    Le retour en automatique est autorisé, sans nouvelle délibération du comité, le jour où les six conditions
    suivantes sont constatées et signées conjointement par le responsable exploitation et le responsable
    instrumentation. Le procès-verbal est transmis au comité pour information et versé au dossier de l''audit
    externe.


    **R1** — Le comparateur S2/S3 agit sur l''actionneur : discordance au-delà du seuil pendant la durée
    définie → repli automatique sur consigne fixe basse + alarme d''astreinte. Vérifié sur l''installation,
    pas en simulation seule.

    **R2** — Preuve de détection : injection d''une dérive sur S2 en **rampe lente d''environ 0,1 mg/L/jour**
    (l''ordre de grandeur de mai), et non en échelon. Le comparateur déclenche et la boucle s''arrête
    effectivement ; le délai de détection est mesuré et écrit. Un seuil qui ne voit pas la rampe est un
    seuil à refaire, pas un test à repasser.

    **R3** — Butée haute indépendante de la sonde de régulation : arrêt de dosage sur S3 seule au-delà
    de 0,8 mg/L, et seuil bas d''alerte à définir.

    **R4** — Alarme de discordance rétablie, avec auto-test mensuel prouvant qu''elle est armée, et affichage
    permanent de toute protection désactivée. C''est la correction directe de novembre.

    **R5** — Programme automate modifié, relu par un tiers, versionné, version en service tracée.

    **R6** — S3 tracée comme référence : plan d''étalonnage décalé de celui de S2, plus contrôle manuel
    quotidien (DPD) confronté aux deux sondes. Deux sondes entretenues ensemble dérivent ensemble.


    **5. Après le basculement — la place du compteur de jours**

    Retour progressif : poste de nuit maintenu 14 jours après basculement, puis astreinte seule si aucune
    discordance ni dépassement sur ces 14 jours. Le compteur de jours a un sens ici : il compte des jours
    **en automatique, gardes armées**. Économie : environ la moitié des 41 k€ dès le basculement, la totalité
    14 jours après.


    **6. Ce qui renverserait cette note**

    Si le test R2 montre une détection de la rampe et un arrêt effectif de la boucle dans un délai borné,
    la dernière objection tombe et le retour est acquis sans autre discussion. S''il montre une détection
    tardive ou nulle, c''est l''architecture de détection qu''il faut reprendre, pas le calendrier. L''audit
    du 30 septembre ne conditionne pas le retour — il porte sur les causes organisationnelles — à condition
    que le dossier R1–R6 lui soit remis tel quel.


    **7. Décision demandée jeudi**

    Non pas une date de retour, mais : autoriser les travaux R1–R6 et leur budget, et déléguer le retour
    au constat signé. Une date de disponibilité des travaux est demandée au responsable instrumentation
    pour la séance.


    ---


    Deux points à trancher avant jeudi, que je n''ai pas pu fixer seul : le seuil et la durée de discordance
    de R1 (ils dépendent du bruit réel de S3, que les 25 jours d''observation permettent de calculer),
    et le délai de détection maximal acceptable en R2. Si vous voulez malgré tout un nombre dans la note,
    c''est là qu''il doit aller — pas en jours d''attente.

    '
