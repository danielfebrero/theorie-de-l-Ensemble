response:
  text: '# Note au comité — fermetures de magasins et objectif de 300 000 €


    **Recommandation : ne fermer aucun des trois magasins mardi.** Les trois sites présentés comme déficitaires
    rapportent en réalité 114 000 € par an au groupe. Les fermer ne récupérerait pas 288 000 € : cela
    coûterait ces 114 000 € de résultat récurrent, plus 1,1 M€ d''indemnité à Chambéry, plus le coût social
    de trois fermetures. L''objectif de 300 000 € reste atteignable — mais sur les 6,4 M€ de frais de
    siège et de logistique, pas sur 6 % du chiffre d''affaires du réseau.


    ---


    ## 1. Le chiffre qui a fondé la liste n''est pas un chiffre de décision


    Le résultat par magasin est juste à l''euro près. Il répond simplement à une autre question que celle
    posée. Il inclut une quote-part des 6,4 M€ de frais de siège et de logistique. Or **ces frais ne partent
    pas avec le magasin.** Un siège, un entrepôt, un système d''information ne rétrécissent pas parce
    qu''un magasin sur dix-neuf ferme : la même dépense se reporte sur les seize autres, qui paraîtront
    à leur tour moins rentables.


    Si l''on retire cette quote-part, on voit ce que chaque site apporte réellement — son chiffre d''affaires
    moins ses propres loyers, salaires et charges, connus ligne à ligne :


    | Magasin | Résultat affiché | Quote-part siège/logistique | Ce que le site rapporte réellement |

    |---|---:|---:|---:|

    | Vitry | − 118 000 € | 181 000 € | **+ 63 000 €** |

    | Chambéry | − 96 000 € | 128 000 € | **+ 32 000 €** |

    | Nîmes | − 74 000 € | 93 000 € | **+ 19 000 €** |


    Aucun des trois ne perd d''argent. Les trois en gagnent. Fermer les trois, c''est perdre 114 000 €
    et déplacer 402 000 € de frais sur le reste du réseau.


    Un point à dire au comité sans détour : 118 + 96 + 74 = 288, soit à peu près l''objectif de 300 000
    €. La cible a vraisemblablement été construite à partir de cette liste, et la liste à partir du mauvais
    indicateur.


    ## 2. Site par site


    **Chambéry** — apporte 32 000 €. Sortir du bail coûte 1,1 M€ pour six ans restants, sans clause. Le
    magasin du réseau le plus proche est à 92 km : le chiffre d''affaires ne se reporte nulle part, il
    disparaît. Payer 1,1 M€ pour détruire 32 000 € de résultat annuel n''a pas de lecture favorable. À
    écarter.


    **Nîmes** — apporte 19 000 €. Nous détenons les murs, valeur vénale 1,9 M€. Ce sont **deux décisions
    différentes** : le magasin gagne-t-il sa place, et 1,9 M€ de capital immobilisé sont-ils bien employés
    ici. La seconde mérite un examen (cession, ou cession avec bail en retour), mais c''est un arbitrage
    patrimonial, à instruire seul. Il produirait un gain exceptionnel une fois, pas les 300 000 € récurrents
    demandés. Ne jamais adosser une opération immobilière à une décision de fermeture : on ne saurait
    plus laquelle des deux on a prise.


    **Vitry** — apporte 63 000 €, le plus des trois. C''est aussi le plus gros des trois en chiffre d''affaires
    (2,8 % du réseau, contre 1,5 % pour Nîmes) : son résultat affiché est mauvais parce que sa quote-part
    de frais est élevée, pas parce qu''il vend mal. Deux faits s''ajoutent :


    - **18 % de ses entrées sont des retraits de commandes web**, dont le chiffre d''affaires est enregistré
    sur l''entité e-commerce. Vitry supporte le personnel, la surface et le temps de ces retraits ; une
    autre entité encaisse la vente. Fermer Vitry ne supprime pas ces retraits : il faudra les payer à
    un transporteur, ou les perdre.

    - Le même mécanisme fausse toute lecture de fréquentation : près d''un visiteur sur cinq n''est pas
    venu acheter. Vitry paraît convertir mal. C''est un artefact de comptage.


    Pour que chaque fermeture soit seulement neutre, il faudrait que disparaisse réellement **plus d''un
    tiers** de la quote-part de frais de Vitry, un quart de celle de Chambéry, un cinquième de celle de
    Nîmes. Pour un magasin représentant 2 à 3 % de l''activité, seuls les frais de transport aval et une
    part d''encadrement régional disparaissent vraiment. Nous n''avons aujourd''hui aucun chiffrage montrant
    qu''on atteint ces seuils.


    ## 3. Le calendrier interdit de toute façon d''y arriver ainsi


    Nous n''avons jamais fermé de magasin. Chaque site emploie une vingtaine de personnes : une fermeture
    déclenche une procédure collective, consultation comprise, qui court sur plusieurs mois. Les coûts
    de sortie — indemnités, remise en état, écoulement du stock, et 1,1 M€ pour Chambéry — tombent **dans
    l''exercice prochain**, celui où les 300 000 € sont attendus ; les économies, elles, n''y sont presque
    pas. Même une fermeture justifiée manquerait l''échéance fixée.


    ## 4. Ce que nous savons mal — et ce que coûte de le savoir


    - **Le seul chiffre qui manque vraiment** : la part réellement évitable des 6,4 M€ quand un site ferme.
    Personne ne l''a produite. Tant qu''elle est inconnue, aucune fermeture n''est démontrable.

    - **Les compteurs d''entrée** sont excellents (± 2 %, au pas d''une demi-heure, 24 mois) mais mesurent
    des entrées, pas des acheteurs. Leur précision ne compense pas le fait qu''ils portent sur la mauvaise
    grandeur.

    - **La carte de fidélité** ne donne pas un taux de report. Elle couvre 23 % des tickets, et les 41
    % de porteurs multi-magasins sur douze mois décrivent des clients déjà mobiles, sur-représentés parmi
    les porteurs. Acheter dans deux magasins en un an ne dit pas qu''on fera 14 km de plus après une fermeture.

    - **Une seule mesure réelle existe** : Nîmes fermé cinq semaines en mars 2024. Les totaux mensuels
    des magasins voisins ont été conservés. C''est grossier, mais c''est le seul report jamais observé
    chez nous. Deux réserves à porter dans l''analyse : une fermeture temporaire dont la réouverture est
    annoncée pousse le client à différer plutôt qu''à se déplacer — le chiffre obtenu sera donc un **plancher**
    ; et l''indemnisation d''assurance doit être isolée. Coût d''extraction : quelques jours.


    ## 5. Ce que nous proposons de décider mardi


    1. Ne fermer aucun magasin ; retirer la liste des trois « déficitaires », qui n''a pas de sens décisionnel.

    2. Porter l''objectif de 300 000 € sur les frais de siège et de logistique : c''est **4,7 % d''une
    base de 6,4 M€**, sans détruire un euro de chiffre d''affaires ni un emploi de vente.

    3. Instruire séparément le cas immobilier de Nîmes, sans lien avec l''exploitation du magasin.

    4. Traiter Vitry comme un dossier de bail, pas comme un dossier de fermeture.


    ## 6. Ce que nous engageons d''ici là


    | Action | Porteur | Échéance |

    |---|---|---|

    | **Vérifier cette semaine la date limite de congé du bail de Vitry** — un bail échu dans 7 mois suppose
    souvent un préavis de 6 mois : la fenêtre de décision peut se refermer sous quelques semaines | Direction
    immobilière | 5 jours |

    | Ouvrir la renégociation du loyer de Vitry, l''option de sortie sans indemnité servant d''argument
    | Direction immobilière | 3 semaines |

    | Compte de contribution des 19 magasins, avec partage explicite frais évitables / non évitables par
    site | Contrôle de gestion | 3 semaines |

    | Exploiter la fermeture de Nîmes de mars 2024 pour estimer le report réel vers un magasin à 23 km
    | Contrôle de gestion | 3 semaines |

    | Refacturer à l''e-commerce le service de retrait, et sortir les retraits des indicateurs de fréquentation
    magasin | Direction financière | 1 mois |

    | Plan de 300 000 € sur les 6,4 M€ de structure, chiffré ligne à ligne | Direction générale | 8 semaines
    |

    | Étude de cession ou de cession-bail des murs de Nîmes | Direction financière | 8 semaines |


    ## 7. Repli, et ce qui le déclenche


    Si à 8 semaines le plan de structure est chiffré sous 200 000 €, nous armons le non-renouvellement
    du bail de Vitry comme solution de repli — décision prise au comité suivant, avant la date limite
    de congé, et cette fois avec le taux de report mesuré et la part de frais évitables en main. La fermeture
    de Chambéry reste exclue quel que soit le résultat de ce plan.


    ## 8. Ce qui nous ferait changer d''avis


    Deux observations, et deux seulement, rendraient une fermeture de Vitry positive : que le chiffrage
    montre que **plus d''un tiers** de ses 181 000 € de quote-part disparaît réellement avec le site,
    et que la mesure de mars 2024 indique un report supérieur à la moitié du chiffre d''affaires vers
    un magasin voisin. Si ces deux chiffres sortent, nous rouvrons le dossier de notre propre initiative.
    Aujourd''hui rien dans le dossier ne les documente.


    ---


    **Pire cas de la recommandation** : nous passons un exercice sans fermeture et le plan de structure
    n''atteint que 200 000 €. L''actionnaire l''encaisse, sous forme de 100 000 € manquants — récupérables
    l''exercice suivant. **Pire cas de la décision inverse** : 1,1 M€ décaissés, une vingtaine de licenciements,
    114 000 € de résultat détruits, des frais de siège intacts reportés sur seize magasins, et aucune
    de ces trois fermetures n''est réversible.

    '
