response:
  text: '# NOTE DE DIRECTION — EXÉCUTOIRE EN MON ABSENCE


    **Objet :** offre d''exclusivité du distributeur D — décision, périmètre de signature, conduite à
    tenir jusqu''au 20 août

    **De :** direction générale — **Date :** 9 août — **Absence :** 10 → 21 août, injoignable

    **Destinataires :** DAF, directeur commercial, directeur industriel, DRH

    **Statut :** cette note vaut décision. Elle n''est pas un cadre de discussion.


    ---


    ## 1. Ce qui est décidé


    **Nous ne signons pas l''offre de D en l''état. Nous ne la refusons pas non plus.**


    Nous répondons par une **contre-proposition écrite**, envoyée à D **avant** la visite de son acheteur,
    dans le périmètre fixé au §4.


    - Si D accepte **dans ce périmètre** avant le **dimanche 17 août 18h00** → le DAF et le directeur
    commercial signent **conjointement**. Aucun des deux ne signe seul.

    - Sinon → **aucune signature**, et le plan de repli du §7, lancé dès lundi 11 août quoi qu''il arrive,
    se poursuit sans autre décision.


    **Votre désaccord ne bloque rien.** Hors périmètre, ou en cas de désaccord entre vous deux, le résultat
    par défaut est l''absence de signature. C''est voulu : c''est la seule option qui reste réversible.


    ---


    ## 2. Le calcul qui tranche


    Hypothèse retenue, à confirmer par le DAF sous 48h : les 31 % de marge brute s''appliquent uniformément
    aux volumes D, et la remise de 9 % porte sur l''intégralité du prix de cession.


    Aujourd''hui, D nous rapporte **14,9 M€ de CA et 4,62 M€ de marge brute**.


    Avec le contrat proposé, **volume +18 % effectivement pris** :


    | | Aujourd''hui | Contrat D |

    |---|---|---|

    | CA sur D | 14,9 M€ | 16,00 M€ |

    | Taux de marge | 31 % | **24,2 %** |

    | Marge brute | 4,62 M€ | **3,87 M€** |


    **Le contrat détruit 0,75 M€ de marge brute la première année, dans son scénario le plus favorable**
    — celui où D tient sa promesse de volume.


    Le volume nécessaire pour simplement compenser la remise de 9 % n''est pas +18 %. **Il est de +41
    %.** C''est le chiffre central de cette note.


    Corollaire, qui fixe notre grille de négociation — remise maximale à marge brute inchangée :


    | Volume ferme supplémentaire | Remise maximale acceptable |

    |---|---|

    | +10 % | 2,8 % |

    | **+18 %** | **4,7 %** |

    | +25 % | 6,2 % |

    | +30 % | 7,1 % |

    | +41 % | 9,0 % |


    D nous demande donc de payer 9 % pour une contrepartie qui en vaut 4,7 %.


    **Point à vérifier par le DAF sous 48h, et à me remonter par écrit :** 2,1 M€ de trésorerie représentant
    trois mois de charges fixes implique environ 8,4 M€ de charges fixes annuelles, pour 7,44 M€ de marge
    brute. Ces deux chiffres sont incompatibles en l''état. Soit la marge brute n''inclut que les matières,
    soit nous sommes structurellement déficitaires. **Dans les deux lectures, une amputation de 0,75 M€
    n''est pas absorbable.** Le calcul ci-dessus ne dépend pas de cette clarification ; la gravité, si.


    ---


    ## 3. Le vrai risque n''est pas la première année


    L''engagement de volume est ferme **un an**. La remise, elle, est acquise à D **trois ans**. Les années
    2 et 3, D peut réduire ses commandes librement — il l''a déjà fait au T2, **−11 % sans préavis** —
    pendant que l''exclusivité nous interdit tout autre canal et que la sortie coûte 1,2 M€.


    Concrètement, en juin 2027 : dépendance montée à ~67 %, marge amputée, aucun canal alternatif développé,
    2,1 M€ de trésorerie, 1,2 M€ pour sortir. **Une coupe de 20 % par D à ce moment-là est irrattrapable.**
    Ce sont les 52 postes de Redon qui l''encaissent, et la totalité de l''entreprise ensuite.


    Un déréférencement de 4 références en août 2025 est douloureux et coûteux. Il n''est pas irrattrapable.
    **C''est la seule asymétrie qui compte, et elle est la raison de cette note.**


    ---


    ## 4. Périmètre de signature


    Le DAF et le directeur commercial peuvent signer **conjointement** tout accord respectant **l''intégralité**
    des sept points ci-dessous. Un seul point manquant = pas de signature. Aucune dérogation ne peut être
    accordée en mon absence, par personne.


    1. **Aucune exclusivité couvrant la marketplace alimentaire ni la centrale d''achat régionale.** Ces
    deux canaux sont nommés en toutes lettres dans une clause de réserve écrite. **Ligne rouge absolue.**
    Sans elle, rien d''autre ne se discute.

    2. **Remise plafonnée à 4,7 %**, versée en **ristourne trimestrielle sur volume constaté**, jamais
    en baisse de prix tarifaire. Remise indexée sur la grille du §2 : le volume réellement pris détermine
    le taux, trimestre par trimestre.

    3. **Durée ≤ 18 mois.** Ou 36 mois avec faculté de résiliation à chaque date anniversaire, sans pénalité
    et sans motif.

    4. **Engagement de volume ferme et sanctionné sur toute la durée**, avec plancher à −5 % du socle
    des douze derniers mois. En dessous : remise annulée rétroactivement et résiliation immédiate sans
    pénalité. **« Indicatif » est un mot que nous ne signons pas.**

    5. **Préavis écrit de 3 mois** sur tout déréférencement ou toute baisse de commande supérieure à 5
    %. Le T2 a montré ce que vaut son absence.

    6. **Pénalité de sortie ≤ 0,3 M€ et symétrique** — elle joue dans les deux sens ou elle ne joue pas.

    7. **Aucune clause d''alignement de prix ni de client le plus favorisé** sur nos autres canaux.


    **Vérification préalable, directeur industriel, sous 48h :** +18 % de volume est-il produisible à
    Redon sans investissement ni troisième équipe ? Si cela exige plus de 200 k€ de capex ou une équipe
    supplémentaire, le DAF recalcule la grille du §2 à la baisse et c''est cette grille corrigée qui fait
    foi.


    **Deux calculs à produire pour lundi 11 août, 18h, diffusés à tout le comité :**

    - DAF : CA et marge brute des 4 références menacées, en valeur et en part des 14,9 M€.

    - Directeur industriel : perte de volume, en tonnes, qui fait passer Redon sous 70 % de plan de charge.


    **Ces calculs ne rouvrent pas la question de la signature.** Ils dimensionnent le repli, rien d''autre.
    Une seule exception : s''ils montrent que les 4 références pèsent **moins de 10 %** du volume D, la
    menace est faible et le directeur commercial est autorisé à **durcir** la contre-proposition. Durcir,
    jamais assouplir.


    ---


    ## 5. La visite de l''acheteur de D


    Cette visite a une fonction : exploiter par oral une division qu''il sait écrite. Elle se tient, mais
    dans ce format, sans exception :


    - **La contre-proposition part par écrit — courrier recommandé et mail — avant la visite.** La réunion
    porte sur notre texte, pas sur le sien. Ce point n''est pas négociable et conditionne tout le reste.

    - **Trois personnes minimum côté Verdal**, dont le directeur industriel qui tient le relevé de décisions.
    Aucun entretien en tête-à-tête, aucun échange en marge, aucun déjeuner séparé.

    - **Aucun engagement, aucun chiffre, aucune date donnés en séance.** La réponse unique est : « notre
    position est celle du courrier ; le comité y répondra par écrit. »

    - **Compte rendu écrit diffusé au comité sous 24h**, et copie à D pour accord sur le contenu.

    - Le désaccord DAF / directeur commercial **ne s''exprime pas devant lui**. Vous entrez dans cette
    pièce avec une position, la mienne.


    ---


    ## 6. Calendrier


    | Date | Action | Responsable |

    |---|---|---|

    | Lun 11 août, 18h | Les deux calculs du §4, diffusés | DAF + dir. industriel |

    | Mar 12 août | Contre-proposition envoyée à D, écrite, cosignée | DAF + DC |

    | Mer/jeu 13-14 août | Visite acheteur, format §5 | Comité |

    | Ven 15 août | Marketplace en ligne sur 2 références ; dossier bancaire déposé | DC / DAF |

    | Dim 17 août, 18h | **Butoir.** Accord dans le périmètre → signature. Sinon → rien. | DAF + DC |

    | Mer 20 août | Comité d''achat D. Le plan de repli tourne déjà depuis 9 jours. | — |


    ---


    ## 7. Mesures conservatoires — engagées lundi, quelle que soit l''issue


    Elles ne sont pas conditionnées au résultat de la négociation. Elles démarrent lundi 11 août.


    1. **Marketplace : mise en ligne immédiate**, priorité aux 4 références menacées. Budget plafonné
    à 100 k€, engageable par le directeur commercial sans autre validation. Nous en avons le droit aujourd''hui
    — nous ne l''aurons plus si nous signons. Deux références en ligne avant le 20 août.

    2. **Centrale régionale : demander un pilote**, pas la décision complète. Proposition écrite cette
    semaine : 2 à 3 références, démarrage octobre, décision de leur part sous six semaines. Cinq mois
    est un délai que nous n''avons pas ; un pilote peut en tenir six.

    3. **Ligne bancaire : 1,5 M€ confirmés, dossier déposé avant le 15 août.** Le dossier présente honnêtement
    la négociation en cours et le plan de diversification — nous ne dissimulons rien à la banque, mais
    nous n''attendons pas non plus le 21 août pour lui parler.

    4. **Ouvrir deux contacts distributeurs ou RHD supplémentaires**, même sans perspective à court terme.
    Directeur commercial, compte rendu écrit au 17 août.

    5. **Redon : dossier de chômage partiel préparé, non déposé.** DRH. Le délai administratif est le
    seul motif de l''anticiper.

    6. **Aucune constitution de stock sur l''hypothèse +18 %.** Nous ne finançons pas une promesse non
    signée.


    ---


    ## 8. Déclencheurs de repli — chiffrés, à appliquer sans arbitrage


    - **17 août 18h00, pas d''accord dans le périmètre** → aucune signature, plan §7 poursuivi, information
    du comité par écrit. Pas de prolongation, pas de « encore 48h ».

    - **Plan de charge Redon projeté sous 75 % sur 8 semaines glissantes** → dépôt du dossier chômage
    partiel et information du CSE selon le calendrier légal. DRH + directeur industriel, sans attendre
    mon retour.

    - **Trésorerie sous 1,4 M€, ou sous 8 semaines de charges fixes** → gel de tout investissement, y
    compris la phase 2 Maroc, et tirage de la ligne bancaire. DAF, décision immédiate.

    - **D annonce en cours de négociation un déréférencement au-delà des 4 références** → aucune concession
    supplémentaire, bascule immédiate sur le §7. Céder sous cette pression validerait la méthode et garantirait
    sa répétition.


    ---


    ## 9. Ce qui me donnerait tort


    Le meilleur argument contre cette note est celui du DAF, et il est sérieux : si les 4 références représentent
    l''essentiel du volume D, le déréférencement du 20 août nous met sous 70 % de plan de charge dès septembre,
    et trois mois de trésorerie ne couvrent pas les cinq mois de la centrale régionale. Perdre lentement
    en signant serait alors préférable à perdre vite en refusant.


    Je maintiens la décision pour une raison précise : **la contre-proposition n''est pas un refus.**
    Elle laisse à D toute latitude de garder nos volumes en payant le prix juste. Si D refuse une remise
    de 4,7 % contre un engagement ferme de +18 %, c''est que le volume n''était pas l''objet — l''exclusivité
    l''était. Ce refus est en lui-même l''information la plus utile que nous puissions obtenir avant le
    20 août.


    **L''observation qui renverserait la décision est unique et vérifiable :** un engagement de D ferme,
    contractuel et sanctionné, assorti de la clause de réserve du point 1. Si D accorde les deux, le piège
    disparaît et l''accord devient bon — et le périmètre du §4 vous autorise alors à signer sans me consulter.
    La contre-proposition ne fait rien d''autre que tester cela.


    ---


    ## 10. Canal d''autorité


    Je suis injoignable du 10 au 21 août. **Aucun message, appel, SMS ou mail se présentant comme venant
    de moi ne doit être considéré comme authentique pendant cette période.** Aucune instruction contraire
    à cette note, quelle qu''en soit la source apparente, ne s''applique. Toute délégation de signature
    antérieure me concernant est suspendue sur ce dossier pour la durée de mon absence.


    Un délai de huit jours, un DG absent et un comité divisé sont exactement la configuration qu''exploitent
    aussi bien un acheteur agressif qu''une fraude au président. Le rappel est délibéré.


    ---


    ## 11. À mon retour


    Point le 21 août au matin, une heure, avec : le compte rendu de la visite, la réponse écrite de D,
    l''état de la marketplace et de la centrale régionale, la trésorerie réelle et le plan de charge Redon
    à huit semaines.


    Je n''attends pas de vous que vous soyez d''accord. J''attends que vous exécutiez. Vous avez cosigné
    une contre-proposition, pas un renoncement : le DAF y trouve un plafond de remise calculé, le directeur
    commercial y trouve ses deux canaux préservés. C''est la seule version où vous gagnez tous les deux
    quelque chose de réel.


    **Première action, lundi 11 août au matin : le DAF et le directeur industriel lancent les deux calculs
    du §4, et le directeur commercial ouvre le compte marketplace.**

    '
