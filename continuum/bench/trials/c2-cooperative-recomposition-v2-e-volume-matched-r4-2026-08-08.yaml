response:
  text: '# Position écrite — Commission locale de l''eau du bassin de la Vèze

    ## Séance du jeudi — arbitrage d''étiage


    ---


    ## 1. Ce que je refuse de poser comme prémisse


    Le dossier m''est présenté comme une soustraction : 570 demandés, 410 disponibles, 160 à retirer à
    quelqu''un. Je ne voterai pas sur cette soustraction, parce que ses deux termes sont fragiles.


    **Le 410 repose sur un seul capteur, étalonné il y a trois ans.** Un biais de ±10 % — banal sur une
    mesure de débit non recalibrée — représente ±41 L/s, soit le quart du déficit que nous prétendons
    arbitrer. Nous nous apprêtons à détruire 4,1 M€ de récolte sur la foi d''un chiffre que personne n''a
    vérifié depuis 2023.


    **Pire : le débit réservé n''est mesuré nulle part.** L''arrêté préfectoral fixe 180 L/s *à l''aval*.
    Notre seule station mesure le débit *entrant au barrage*. Nous ne savons donc pas aujourd''hui si
    l''arrêté est respecté — nous le déduisons, sans tenir compte de l''évaporation de la retenue en août
    ni des pertes par infiltration. Nous pilotons à l''aveugle la seule contrainte irréversible du dossier.


    L''annexe opérationnelle jointe ne nous aide pas : les 34 stations du catalogue ne comprennent aucun
    point à Sarcelle, et surtout **aucun capteur de débit** — thermomètres, anémomètres, pluviomètres,
    baromètres, sondes de sol, mais pas un seul limnimètre ou débitmètre sur l''ensemble du réseau. Aucun
    recoupement externe n''est possible. En revanche les pluviomètres PL-1200 y sont nombreux : les données
    de pluie efficace existent, et serviront au point 6.


    **Le second chiffre fragile est le 150 L/s de la régie.** 150 L/s pour 9 200 habitants font 12 960
    m³/jour, soit **1 409 litres par habitant et par jour** — près de dix fois la consommation domestique
    française moyenne. Trois explications possibles, et trois seulement : la régie dessert un périmètre
    plus large que Ferney ; elle alimente des abonnés industriels ou agroalimentaires ; ou son rendement
    de réseau est catastrophique. Dans les trois cas, l''arbitrage change entièrement. Dans le troisième,
    les 160 L/s manquants sont peut-être déjà dans le sol sous Ferney.


    Tant que ces deux chiffres ne sont pas établis, nous ne partageons pas une ressource : nous partageons
    une incertitude, et nous la faisons payer aux maraîchers parce qu''ils sont les seuls dont la demande
    soit chiffrée honnêtement.


    ---


    ## 2. Les trois pertes ne sont pas de même nature


    C''est le cœur de ma position, et je demande qu''il figure au procès-verbal.


    | Usage | Perte en cas de défaut | Horizon de réparation | Instrument de compensation |

    |---|---|---|---|

    | Eau potable | Sanitaire, EHPAD, 4 jours de tampon | Jours | Citernage, interconnexion — coûteux
    mais existant |

    | Maraîchage | 4,1 M€, 90 emplois saisonniers | Une saison | Fonds, calamité agricole, assurance récolte,
    dégrèvement TFNB |

    | Débit réservé | Effondrement des truites, 2 frayères asséchées | **Une décennie, qualifié de non
    reconstituable** | **Aucun** |


    Deux de ces pertes sont graves et réparables. La troisième est définitive et n''a **aucun instrument
    de compensation** : aucun fonds départemental ne rachète une frayère.


    Et c''est la seule partie qui n''était pas dans la salle. Les maraîchers ont claqué la porte, la régie
    a posé ses conditions, la presse a compté deux camps. La rivière n''a pas d''avocat, pas de communiqué,
    pas de siège. **Le débit réservé n''est donc pas une variable de mon arbitrage : c''est sa borne.**
    Je ne le mets pas au vote, d''autant qu''il ne relève pas de nous — c''est un arrêté préfectoral,
    que notre règlement intérieur ne nous autorise pas à défaire.


    ---


    ## 3. Ce que je propose de voter : une règle, pas un chiffre


    Je propose une **répartition par volume global par usage**, et non des quotas individuels exploitation
    par exploitation. Motif : des quotas individuels différenciés supposeraient de connaître cultures,
    stades végétatifs et relevés de compteurs. Nous n''avons rien de tout cela. Toute différenciation
    que nous inventerions serait arbitraire — et juridiquement attaquable dès la première requête au tribunal
    administratif.


    La règle, applicable automatiquement sans nouvelle séance :


    1. **Le débit réservé, 180 L/s, est servi en premier et intégralement**, et mesuré à l''aval dès qu''une
    station y est installée.

    2. Une **marge métrologique de 5 % du débit mesuré** (20 L/s aujourd''hui) reste non attribuée tant
    que le jaugeage manuel n''a pas confirmé la lecture de la station.

    3. Le solde S est réparti : **potable = max(60 ; min(100 ; 0,48 × S))**, **maraîchage = S − potable**.

    4. **Plancher sanitaire intangible : 60 L/s**, garanti à tous les niveaux de crise, jamais arbitrable.


    Application au débit du jour (410 L/s) :


    | Réservé | Potable | Maraîchage | Marge |

    |---|---|---|---|

    | 180 | 100 | 110 | 20 |


    Et les paliers, publiés d''avance pour que personne ne les négocie dans la panique :


    | Débit entrant | Réservé | Potable | Maraîchage |

    |---|---|---|---|

    | 410 | 180 | 100 | 110 |

    | 380 | 180 | 87 | 94 |

    | 340 | 180 | 69 | 74 |

    | 300 | 180 | 60 | 45 |

    | **< 260** | **Saisine immédiate du préfet — la commission se dessaisit** | | |


    En dessous de 260 L/s, l''arrêté et le plancher sanitaire deviennent simultanément insatisfiables.
    Ce n''est plus une décision locale : c''est au préfet de choisir quelle norme il suspend, et de l''assumer.


    **Baisse de la potable étalée sur 10 jours**, financée par la marge métrologique et non par les maraîchers
    : 120 L/s les jours 1-5, 110 L/s les jours 6-10, 100 L/s ensuite. Le tampon de 4 jours de la régie
    n''est ainsi jamais sollicité.


    **Dans l''enveloppe maraîchère : 110 L/s au prorata des surfaces**, seule donnée vérifiable dont nous
    disposions, soit **0,177 L/s/ha, converti en 107 m³/ha/semaine**. Un volume hebdomadaire, pas un débit
    : chaque exploitation concentre sa dotation sur ses stades critiques, ce que nous serions incapables
    de calculer à sa place. **Transferts de volume autorisés entre exploitations**, déclarés à la commission,
    gratuits ou à prix plafonné, aucune ne pouvant dépasser 130 % de sa dotation initiale — cela restitue
    l''ajustement agronomique fin que nous n''avons pas les données pour opérer, sans permettre aux six
    grosses de racheter la campagne.


    Le prorata surfacique place mécaniquement 48 % de l''effort sur 6 exploitations qui représentent 18
    % des adhérents. C''est arithmétique, pas politique. **On ne règle pas une question sociale avec le
    robinet : l''eau se répartit selon une règle objective, l''argent selon la vulnérabilité.**


    ---


    ## 4. Sortir du piège de 2022


    Le dispositif de 2022 levait tout dès 48 h au-dessus du seuil. Le 9 août l''a réfuté sur pièces :
    520 L/s, reprise totale le 11, retour à 340 L/s en quatre jours. Une crue d''orage n''est pas une
    recharge — 48 h mesurent du ruissellement, pas une nappe.


    Je propose donc :

    - **Aucune levée sur débit instantané.** Remontée d''un palier seulement si : débit entrant ≥ seuil
    du palier + 60 L/s pendant **10 jours consécutifs**, ET débit aval ≥ 180 L/s sur toute la période,
    ET cumul de pluie efficace positif aux pluviomètres du secteur.

    - **Un palier tous les 10 jours au maximum. Jamais de levée totale en une fois.**

    - Levée complète : ≥ 700 L/s pendant 15 jours, ou 15 septembre (fin de campagne d''irrigation).

    - **Le durcissement, lui, est immédiat** — dès 3 jours sous le seuil. L''asymétrie est volontaire
    : on descend vite, on remonte lentement.

    - **Publication quotidienne** du débit entrant, du débit aval et des volumes consommés par usage,
    sur page publique. C''est le seul remède au procès en opacité qui nous est fait.


    ---


    ## 5. Les 600 000 € — l''essentiel ne va pas là où on l''attend


    | Poste | Montant |

    |---|---|

    | Métrologie d''urgence : jaugeages manuels, ré-étalonnage de la station du barrage, **station de
    contrôle du débit réservé à l''aval** | 70 k€ |

    | Compteurs télérelevés sur les prises d''irrigation + sectorisation et mesure de débit de nuit sur
    le réseau de la régie | 130 k€ |

    | Réparation immédiate des fuites identifiées | 100 k€ |

    | Aide de trésorerie aux maraîchers, pondérée vers les petites exploitations, conditionnée au respect
    des quotas et à l''acceptation du comptage | 280 k€ |

    | Réserve d''aléa | 20 k€ |


    Je le dis sans détour : **280 k€ contre 4,1 M€ annoncés, c''est 7 %.** Ce n''est pas une indemnisation,
    c''est un pont de trésorerie. L''instrument de la perte, c''est la calamité agricole, l''assurance
    récolte et le dégrèvement de taxe foncière sur le non-bâti — que je demande à la commission de saisir
    le préfet d''activer dès jeudi.


    Et je l''assume devant les maraîchers : **chaque euro dépensé sur les fuites du réseau leur rapporte
    plus que le même euro versé en indemnité.** Si le rendement de la régie est mauvais, la réparation
    peut libérer durablement plusieurs dizaines de L/s — davantage que tout ce que je peux leur donner
    en arbitrant.


    À explorer en parallèle sous 15 jours : interconnexion potable avec un réseau voisin ; REUT à partir
    de la station d''épuration de Ferney (~16 L/s théoriques, mais fortement restreinte réglementairement
    pour les légumes consommés crus, et à défalquer du débit aval si le rejet est situé en aval du barrage
    — ce n''est pas de l''eau gratuite).


    ---


    ## 6. Devant les trois parties


    **Aux maraîchers.** Votre demande de 240 L/s représente 3,3 mm/jour sur 620 ha : elle est agronomiquement
    crédible, et je ne l''ai jamais traitée comme gonflée. Mais votre affirmation « en dessous, la récolte
    est perdue » est un seuil binaire présenté sans une seule donnée parcellaire — et c''est vous qui
    détenez ces données. Vous avez quitté la salle avant le vote : la décision s''est prise sans vous,
    et c''est vous qui y avez perdu, pas nous. Ce qui reste ouvert jusqu''à jeudi : la clé de répartition
    interne, le mécanisme de transferts, la pondération de l''aide vers les petites exploitations, et
    les 20 L/s de marge métrologique qui vous reviendront intégralement — sous dix jours — si le jaugeage
    confirme la lecture de la station. Revenez les prendre.


    **À la régie.** Votre plancher sanitaire est garanti, chiffré, inconditionnel, et tenu à tous les
    niveaux de crise, y compris le plus dégradé. Vos 150 L/s ne le sont pas. Vous refusez de discuter
    tant que votre dotation n''est pas acquise : je retourne la réciprocité. 1 409 litres par habitant
    et par jour est un chiffre que vous devez expliquer, pas moi. Produisez sous 10 jours votre périmètre
    desservi, votre rendement de réseau, vos volumes par catégorie d''abonnés et vos débits de nuit. Si
    ces données démontrent que 100 L/s met en danger un usage vital, **je révise le quota à la hausse
    dans les 72 heures et je le prends sur la marge métrologique.** Tant qu''elles ne sont pas produites,
    la charge de la preuve vous incombe — pas aux 90 emplois saisonniers.


    **À la presse.** Le titre « les paysans ou les robinets » décrit un arbitrage qui n''existe pas. Le
    vrai dossier tient en trois lignes : 90 % du prélèvement potable est aujourd''hui inexpliqué ; 100
    % de la demande d''irrigation est invérifiable faute de compteurs ; et une seule des trois pertes
    possibles est définitive. Nous publierons les débits chaque jour. Comparez-les à ce que nous avons
    décidé.


    ---


    ## 7. Ce qui peut faire échouer cette proposition


    Je dois à la commission l''argument le plus fort contre moi.


    **Premier risque, le plus sérieux.** Je réduis d''un tiers un service public d''eau potable sur la
    base d''un ratio par habitant calculé à partir d''une ligne de note de synthèse, sans connaître le
    périmètre réellement desservi. Si la régie alimente en fait 40 000 personnes à l''échelle intercommunale,
    ou une industrie agroalimentaire, mon plancher provoque un incident sanitaire et j''en réponds personnellement.
    Mes trois parades : l''étalement sur 10 jours qui préserve le tampon, la fenêtre de contestation à
    72 heures sur pièces, et la marge de 20 L/s réaffectable à la potable plutôt qu''à l''irrigation.
    Elles réduisent le risque ; elles ne l''annulent pas.


    **Second risque.** Une irrigation déficitaire à 46 % peut détruire la récolte malgré tout. J''aurais
    alors les 4,1 M€ *et* le coût politique, sans rien avoir gagné par rapport à une coupure franche assortie
    d''une indemnisation pleine. Je n''ai pas les données pour trancher : c''est précisément pourquoi
    j''ouvre les transferts entre exploitations — elles connaissent leurs courbes de réponse, nous non.


    **Ce qui rendrait ma position indéfendable :** que les compteurs ne soient pas posés. Un quota sans
    mesure est une fiction, et une fiction appliquée est pire qu''une restriction assumée. Je conditionne
    donc l''éligibilité à l''aide départementale à l''acceptation du comptage télérelevé. C''est le seul
    levier qui fera poser des compteurs en une semaine.


    ---


    **En résumé.** Je propose de voter la règle automatique du §3, ses paliers, son plancher sanitaire
    à 60 L/s, sa clause de dessaisissement sous 260 L/s, le régime de levée par paliers du §4, l''affectation
    du fonds du §5, et la saisine du préfet aux fins d''activation de la calamité agricole. Je ne vote
    aucun chiffre définitif avant le jaugeage : le tableau du §3 est une règle qui produit des chiffres,
    pas un partage figé.


    Nous ne savons pas exactement combien d''eau il y a. Nous savons exactement laquelle des trois pertes
    ne se rattrape pas.

    '
