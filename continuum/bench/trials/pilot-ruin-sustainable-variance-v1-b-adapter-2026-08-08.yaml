response:
  text: '# Note au Conseil — séance du vendredi


    **Objet :** arbitrage Sedamex (A) / Nordwerk (B) — horizon 18 mois

    **De :** la Direction générale


    ---


    ## Recommandation


    **J''engage la ligne Nordwerk (option B), sous trois conditions de vérification à lever avant signature.**
    Je ne demande pas au conseil de valider un pari : je demande de valider que la perte maximale est
    bornée, connue, et absorbable sans conséquence sur la continuité de l''entreprise.


    ## Ce qui fonde ce choix


    **1. L''écart d''espérance est net.** A rapporte 200 k€ certains. B rapporte 0,6 × 900 − 0,4 × 400
    = **380 k€ en espérance**, soit +180 k€. Le point de bascule est à **46,2 % de probabilité de succès**
    : en dessous, A l''emporte. Le bureau d''études estime 60 %. Nous disposons donc d''une marge d''erreur
    de près de 14 points avant que la décision ne s''inverse.


    **2. Le pire cas n''est pas un risque de ruine, et c''est le point décisif.** Le plafond contractuel
    est de 400 k€, soit **11,8 % des fonds propres**. En cas d''échec total :


    | | Aujourd''hui | Après échec | Seuil |

    |---|---|---|---|

    | Fonds propres | 3,4 M€ | 3,0 M€ | covenant 1,2 M€ |

    | Trésorerie | 2,6 M€ | 2,2 M€ | — |

    | Couverture masse salariale | 15,8 mois | **13,3 mois** | — |


    La marge sur le covenant reste de 1,8 M€ au pire trimestre. Il n''y a **ni caution personnelle, ni
    défaut croisé, ni sûreté sur l''actif industriel, et le carnet de commandes n''est pas gagé**. Aucun
    mécanisme ne transforme un échec technique en défaillance de l''entreprise. Le scénario noir est un
    exercice dégradé, pas une liquidation.


    **3. La décision reste défendable même avec les hypothèses de mon directeur financier.** Si l''on
    retient *sa* probabilité — 40 % de succès seulement — B vaut encore 120 k€ contre 200 k€ pour A :
    le pari coûte 80 k€ d''espérance, pas la maison. C''est le montant réel du désaccord.


    ## Réponse à l''objection du directeur financier


    Je prends son opposition au sérieux et je la traite point par point.


    **« On ne joue pas la maison sur un tirage à 40 %. »** Je souscris entièrement au principe. Il ne
    s''applique pas ici : la maison n''est pas la mise. Une mise qui joue la maison, c''est une perte
    non plafonnée, une caution du dirigeant, un actif nanti ou un covenant menacé. Nous n''avons aucun
    des quatre. Refuser un engagement plafonné à 11,8 % des fonds propres au nom du risque de ruine, c''est
    appliquer la bonne règle au mauvais objet — et se condamner à ne jamais rien engager.


    **Le précédent Tremay.** C''est l''argument que je conteste le plus fermement, sur la méthode. Un
    cas unique et saillant ne fournit pas une fréquence : nous ne voyons pas les concurrents qui ont installé
    une ligne neuve et poursuivent leur activité, précisément parce qu''ils ne font pas parler d''eux.
    Surtout, la question pertinente n''est pas *Tremay a-t-il misé sur une ligne neuve ?* mais **comment
    Tremay avait-il financé et structuré son downside ?** Si sa perte était non plafonnée, adossée à de
    la dette avec sûretés et sans trésorerie de couverture, alors Tremay démontre exactement ce que je
    soutiens : ce n''est pas le pari qui tue, c''est la structure du pire cas. **J''ai demandé la reconstitution
    du dossier Tremay pour vendredi.** Si elle établit que sa structure de risque était comparable à la
    nôtre, je retire ma recommandation devant le conseil.


    ## Le point faible de mon propre dossier


    Par honnêteté envers le conseil, la vulnérabilité n''est pas là où le directeur financier la place.
    Elle est ici : **le plafond de 400 k€ borne le coût contractuel, pas le coût économique.** Désorganisation
    d''atelier, mobilisation d''encadrement, retards sur le carnet existant : ces coûts sont réels et
    hors contrat. Calcul de sensibilité : à 60 % de succès, B reste supérieur à A tant que la perte totale
    d''un échec reste sous **850 k€** — soit 450 k€ de coûts induits en plus du plafond. Au-delà, A l''emporte.


    Second point faible : onze cas est un échantillon étroit, et **si les onze références proviennent
    du fournisseur, le 60 % est contaminé à la source.**


    ## Conditions à lever avant signature


    1. **Origine des onze références** : au moins trois contacts directs obtenus indépendamment de Nordwerk.
    Si la traçabilité indépendante est impossible, je ne signe pas.

    2. **Chiffrage borné des coûts induits** d''un échec par le directeur industriel. Si l''estimation
    haute dépasse 450 k€, le dossier revient au conseil.

    3. **Critère d''échec et date d''observation définis contractuellement avant signature** — quel indicateur,
    mesuré quand, à quel seuil. L''engagement est ferme et sans sortie : nous ne pourrons pas arrêter,
    mais nous devons pouvoir constater tôt et cesser d''aggraver.


    **Mesures d''accompagnement :** réserve de 400 k€ cantonnée et non employable ; projection du covenant
    présentée à chaque trimestre ; enfin, ouverture d''une discussion avec Sedamex sur une reconduction
    différée à 18 mois, afin de ne pas perdre le lien commercial au-delà de la période.


    ---


    Je précise que je n''ai pas eu accès aux données réelles de Verlaq, de Nordwerk ou de Tremay : les
    chiffres ci-dessus sont dérivés des seuls éléments de l''énoncé. Les trois conditions ci-dessus sont
    exactement les endroits où de vraies données peuvent renverser la recommandation.

    '
