response:
  text: '## Note au conseil — arbitrage Sedamex / Nordwerk


    **De :** la direction générale · **Pour :** conseil du vendredi · **Objet :** recommandation sur les
    18 prochains mois


    ---


    ### Recommandation


    **Je recommande l''option B (ligne Nordwerk)**, sous trois conditions de vérification à lever avant
    signature, détaillées en fin de note. Si l''une d''elles n''est pas levée, je bascule sur Sedamex
    sans débat.


    ### Ce que disent les chiffres


    L''espérance de gain de Nordwerk est de **380 kEUR** (0,6 × 900 − 0,4 × 400) contre **200 kEUR** garantis
    pour Sedamex, soit un écart de 180 kEUR en faveur de B. Le point de bascule se situe à **46,2 % de
    probabilité de succès** : en dessous, Sedamex l''emporte. Notre bureau d''études estime cette probabilité
    à 60 % sur onze installations documentées. La marge avant bascule est donc de 13,8 points — réelle,
    mais pas confortable sur un échantillon de onze. C''est ce qui justifie les conditions de vérification.


    ### Ce que dit le bilan dans la branche défavorable


    Le seul scénario qui compte est celui où Nordwerk échoue, cumulé aux 700 kEUR de dividende exceptionnel
    :


    | | Sedamex | Nordwerk succès | **Nordwerk échec** |

    |---|---|---|---|

    | Fonds propres à 18 mois | 2,9 MEUR | 3,6 MEUR | **2,3 MEUR** |

    | Marge sur covenant (1,2 MEUR) | +1,5 MEUR | +1,5 MEUR | **+1,1 MEUR** |

    | Trésorerie résiduelle | 2,1 MEUR | 2,8 MEUR | **1,5 MEUR** |

    | soit, en masse salariale | 12,7 mois | 17 mois | **9,1 mois** |


    Le trimestre le plus tendu est le quatrième : dividende du dixième mois et pénalité exigible au plus
    tard au douzième se concentrent. Fonds propres testés à cette clôture : **2,3 MEUR, contre un seuil
    bancaire à 1,2 MEUR.** Le covenant tient avec 1,1 MEUR de marge. Aucun trimestre de la période, dans
    aucun scénario, n''approche le seuil.


    La perte maximale représente **11,8 % des fonds propres et 15,4 % de la trésorerie**. Elle est plafonnée
    contractuellement, sans caution personnelle, sans défaut croisé, sans sûreté sur l''actif industriel,
    et sans gage sur le carnet de commandes. **La branche perdante ne touche ni le covenant, ni la paie,
    ni l''outil.**


    ### Réponse au directeur financier


    Sur un point, il a raison, et je l''intègre : un engagement ferme de dix-huit mois sans clause de
    sortie exige un niveau de preuve supérieur à une décision réversible. C''est la raison des conditions
    ci-dessous.


    Sur le fond, son objection confond deux questions distinctes. « On ne joue pas la maison » suppose
    que la maison soit mise. Elle ne l''est pas : 400 kEUR plafonnés, sur 3,4 MEUR de fonds propres, sans
    dette nette. Je ne conteste pas les 40 % — j''ai construit toute la recommandation dessus, sans les
    arrondir.


    L''argument le plus fort qu''il pourrait m''opposer est ailleurs : dix-huit mois, c''est **un seul
    tirage**, et la moyenne ne protège personne sur un tirage unique. C''est exact. Mais sur un tirage
    unique, la question pertinente n''est pas l''espérance, c''est la survivabilité de la branche perdante.
    Elle est ici démontrée ligne à ligne, pas postulée.


    Quant à Tremay : le précédent ne vaut que si sa structure d''exposition ressemblait à la nôtre. Une
    ligne neuve ne fait pas tomber une entreprise ; un engagement non plafonné, financé par dette, avec
    caution ou nantissement, le fait. **Je m''engage à produire avant vendredi les éléments publics du
    dossier Tremay (greffe, jugement, derniers comptes déposés).** Si son exposition était plafonnée et
    son bilan comparable au nôtre, le précédent devient un argument sérieux et je retire ma recommandation.
    Sinon, ce n''est pas un précédent, c''est une image.


    ### Ce qui renverserait ma recommandation


    1. **Une exclusion au plafond de 400 kEUR** (faute, force majeure, défaut de notre part, coûts hors
    périmètre). Si l''exposition n''est pas réellement bornée, tout le raisonnement tombe.

    2. **Une concentration des quatre échecs** parmi les onze installations sur une configuration technique
    que notre site partage. La probabilité de 60 % ne s''appliquerait alors pas à nous.

    3. **Un décaissement d''installation non couvert par le plafond**, qui déplacerait le profil de trésorerie
    sans changer le plancher de fonds propres.


    ### Ce que je demande au conseil


    Un mandat conditionnel : signer Nordwerk **si et seulement si** les trois points ci-dessus sont levés
    par écrit avant signature.


    J''y attache une contrepartie que je propose au conseil de rendre formelle. Le directeur financier
    détient le déclencheur d''arrêt : **c''est lui, et non la direction générale, qui constate l''échec
    technique et déclenche la résiliation au plafond**, sur critères techniques écrits fixés avant signature
    — sans arbitrage de ma part. Et les 400 kEUR sont isolés en réserve dédiée dès la signature, hors
    trésorerie d''exploitation. Il porte l''objection ; il doit porter le frein, pas seulement l''avis.


    **Première action, lundi :** revue juridique de la clause de plafond et demande écrite au bureau d''études
    du détail des onze installations, échecs compris.

    '
