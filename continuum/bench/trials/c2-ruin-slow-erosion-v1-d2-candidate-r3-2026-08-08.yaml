response:
  text: '# Note au comité de direction


    **Objet — Plan d''économies du DAF : volet A adopté ; deux mesures du volet B écartées ; l''engagement
    porte sur la chaîne des signataires, pas sur la trésorerie.**


    ---


    ## 1. Une seule date décide de tout


    Le référentiel pose que tout changement de superviseur ramène l''exigence à douze mois sous le nouveau.
    Vidal est en formation sous Ferrand, qui part fin M8, et il lui reste six mois de pratique.


    Il en découle un test binaire, et un seul : **les six mois de crédit de Vidal doivent être acquis
    avant le dernier jour de Ferrand, fin M8.**


    - Si oui : agrément prononcé huit semaines après la dernière heure, soit fin M8 au plus tôt. Effectif
    agréé ≥ 3 sans discontinuité.

    - Si non : remise à zéro, douze mois sous Bouchard ou Nseka à partir de M9, dernière heure fin M20,
    agrément vers M22.


    Le calcul du crédit disponible : huit mois s''écoulent entre M1 et la sortie de Ferrand, six mois
    de crédit sont requis, un mois sous 100 h compte au prorata. Le seuil est donc **75 h/mois en moyenne
    sur huit mois**. En dessous, l''agrément est mécaniquement perdu — non pas probablement, mécaniquement.


    À noter : les heures au-delà de 100 ne créditent rien de plus. Les 120 h/mois actuelles n''accélèrent
    pas l''agrément ; elles ne constituent qu''une marge contre un mois d''absence.


    ## 2. Ce que le volet B fait à cette date


    **Variante 55 h/mois.** Crédit de 0,55 mois par mois. Fin M8 : 4,4 mois acquis sur 6. Remise à zéro.
    Agrément repoussé à ~M22.


    **Variante 70 h/mois.** Crédit de 0,7. Fin M8 : 5,6 mois acquis sur 6. **Manque 0,4 mois — environ
    douze jours.** Même remise à zéro, même report à M22. La variante « prudente » franchit exactement
    la même falaise.


    Et la mesure n''est pas réversible au sens où le plan l''affirme. Rétablir 120 h en trente jours ne
    restitue aucun crédit perdu. Le point de non-retour — instant après lequel aucun rétablissement ne
    permet plus d''atteindre 6,0 avant fin M8 — se situe **en cours de M5 dans la variante 55 h, en cours
    de M7 dans la variante 70 h**. Le comité croit disposer d''un levier mensuel ; il dispose en réalité
    d''une fenêtre de quatre mois, invisible tant que personne ne cumule le prorata.


    ## 3. Ce que la mesure rapporte réellement


    Sur la base d''un mois plein à 151 h :


    | Scénario | Heures de Ferrand rendues à la production, M1→M8 |

    |---|---|

    | Supervision 55 h/mois (plan DAF) | 768 h |

    | Supervision 70 h/mois (variante) | 648 h |

    | Supervision 100 h/mois puis production dès crédit acquis | 608 h |


    **L''écart entre le plan du DAF et l''option sans risque est de 160 heures sur huit mois — 20 heures
    par mois.** C''est le montant exact de ce que la mesure achète. Il est mis en balance avec 87 % du
    chiffre d''affaires.


    Je propose donc la variante suivante, qui n''est pas un refus du volet B mais sa version exécutable
    : **supervision plancher à 100 h/mois, suivi cumulé du crédit publié chaque mois au comité, et retour
    de Ferrand à temps plein en production dès que le crédit atteint 6,0** — attendu à M7. Elle rend au
    DAF environ quatre cinquièmes de la ressource visée sans déplacer d''un jour la date d''agrément,
    et conserve M7–M8 comme tampon si un mois passe sous 100 h.


    ## 4. La trésorerie ne contraint pas avant l''agrément


    | Hypothèse | Déficit mensuel | Autonomie sur 780 k€ |

    |---|---|---|

    | Aucune mesure | 61 k€ | 12,8 mois |

    | Volet A seul (24 k€) | 37 k€ | **21,1 mois** |

    | Plan complet (50 k€) | 11 k€ | 70,9 mois |


    Le volet A seul porte le laboratoire au-delà de M21. L''agrément de Vidal se joue à M8, la falaise
    Marchand à M14. **Aucune des deux échéances critiques ne tombe dans la zone où la trésorerie mord.**
    Il n''existe donc pas d''urgence de caisse justifiant de franchir la falaise d''accréditation. C''est
    le point sur lequel la note du DAF se trompe d''ordre : elle traite une contrainte à 21 mois avant
    une contrainte à 8.


    ## 5. M14 : la falaise que le plan ne traite pas


    Même dans le scénario favorable — Vidal agréée fin M8 — l''effectif tombe à **exactement trois** au
    départ de Marchand fin M14 : Bouchard, Nseka, Vidal. Zéro marge. Un arrêt maladie long, un départ,
    un litige, et la suspension court sous trente jours.


    Or le volet B gèle le poste de second apprenti signataire. Un apprenti recruté en M1 devient signataire
    vers M27 ; gelé, il n''y a **aucun quatrième signataire en vue avant M29 ou plus tard**. Le plan supprime
    la seule assurance contre une échéance qu''il ne traite pas.


    Le même gel condamne les deux contrats-cadres à 41 k€/mois. Ils exigent deux signataires dédiés en
    sus de l''activité courante à partir de M9 — donc cinq agréés au moins. À quatre jusqu''à M14 puis
    trois, l''engagement n''est pas tenable, et il l''est encore moins après M14. **Le volet B économise
    au mieux 26 k€/mois en fermant la porte à 41 k€/mois de revenu accrédité récurrent**, seul élément
    du dossier capable de résorber structurellement le déficit.


    ## 6. Si l''on passe outre : le pire cas et qui l''encaisse


    Suspension vers M15–M16. Le retour exige une accréditation initiale : 340 k€, quatorze à vingt mois,
    dossier recevable seulement avec trois signataires agréés en poste — soit M22 au plus tôt, pour une
    accréditation retrouvée entre M36 et M42. Entre-temps, 87 % du chiffre est inaccessible et la trésorerie
    ne finance pas six mois d''exploitation à ce niveau de perte.


    Ce n''est pas un mauvais tirage à absorber : c''est une branche sans retour. Elle est encaissée par
    les 31 salariés, non par les signataires du plan. À ce titre, je ne présente pas cette mesure comme
    arbitrable en séance.


    ## 7. Décisions proposées


    **Retenu**


    - Volet A dans son intégralité, 24 k€/mois, dès M1. La perte attendue est de 4 % du chiffre non accrédité,
    soit environ 0,5 % du chiffre d''affaires total — proportion acceptable. Réserve : les délais de 9
    à 14 jours seront suivis sur le carnet accrédité, pas seulement sur le carnet libre (déclencheur au
    § 8).

    - Volet B, non-remplacement du technicien.

    - Volet B, supervision de Vidal ramenée à **100 h/mois**, non 55 ni 70, avec retour de Ferrand en
    production dès crédit acquis.


    **Conditionné à vérification écrite préalable**


    - Internalisation de la maintenance métrologie. Elle touche la traçabilité métrologique, qui relève
    du périmètre d''accréditation. À confirmer auprès de l''organisme avant exécution ; à défaut de réponse
    sous vingt jours, mesure suspendue.


    **Écarté**


    - Supervision de Vidal à 55 ou 70 h/mois, sous l''une quelconque de ses formes.

    - Gel du poste de second apprenti signataire. Je propose au contraire de lancer le recrutement en
    M1.


    **Ajouté**


    - Recrutement d''un signataire déjà agréé, cible avant M12, sous réserve de la question 3 du § 9.
    C''est le seul levier capable de traiter simultanément la falaise M14 et la condition des contrats-cadres.

    - Négociation du contrat client sur un démarrage à M9 en volume échelonné, **conditionné contractuellement
    à l''arrivée du cinquième signataire**. Ne pas signer un engagement à deux signataires dédiés que
    la chaîne ne permet pas de tenir.


    Le DAF est invité à fournir la ventilation des 26 k€ mesure par mesure, absente du dossier : la règle
    d''arbitrage retenue est que toute mesure ne touchant pas la chaîne des signataires est adoptée, toute
    mesure y touchant est écartée.


    ## 8. Suivi et déclencheurs


    | Indicateur | Déclencheur | Action |

    |---|---|---|

    | Crédit cumulé de Vidal | < 1,0 × nombre de mois écoulés, à toute clôture mensuelle | Rétablissement
    immédiat à 120 h et information du comité sous 48 h |

    | Heures de supervision du mois | < 100 h | Rattrapage obligatoire le mois suivant |

    | Dossier d''agrément | non déposé à J+5 de la dernière heure | Escalade direction générale |

    | Prise de commandes accréditées | −10 % sur deux mois consécutifs | Réactivation de l''intérim préparation
    d''échantillons |

    | Effectif agréé | passage à 3 | Gel de toute mesure d''économie touchant le personnel technique |


    Le suivi du crédit cumulé est publié au comité chaque mois. Je propose que **Bouchard et Nseka disposent
    d''un droit d''opposition écrit sur toute mesure modifiant les heures de supervision** — un veto,
    non une consultation. C''est la contrepartie que je demande au titre de la responsabilité qu''ils
    portent seuls après M14.


    ## 9. Ce qui renverserait cette note


    Cinq questions à adresser à l''organisme d''accréditation cette semaine, réponse écrite demandée sous
    dix jours. Le coût est nul, l''enjeu est l''ensemble du raisonnement ci-dessus.


    1. Le calcul au prorata s''applique-t-il bien au mois, sans plafond de crédit au-delà de 100 h ?

    2. Un changement de superviseur postérieur à la dernière heure de pratique affecte-t-il un dossier
    déjà complet ? Le superviseur doit-il être en poste au prononcé ?

    3. L''agrément d''un signataire recruté à l''extérieur est-il transférable, ou doit-il être reconstitué
    sur notre périmètre ?

    4. Une pratique supervisée accomplie pendant une suspension est-elle comptabilisée ?

    5. L''internalisation de la maintenance métrologie modifie-t-elle le périmètre notifié ?


    Une réponse positive à la question 3 ouvrirait une voie plus rapide sur M14 et sur les contrats-cadres.
    Une réponse négative à la question 2 fragiliserait le scénario de base lui-même et imposerait de faire
    signer l''attestation de Ferrand avant son départ, et de déposer le dossier dans les cinq jours suivant
    la dernière heure.


    ## 10. Sur les deux arguments d''appui du dossier


    **Le benchmark.** Neuf laboratoires, sept sans perte d''accréditation. C''est un taux d''échec observé
    de 22 % sur un événement qui coûte 87 % du chiffre — cette statistique alarme, elle ne rassure pas.
    Le dossier ne dit rien des deux cas défavorables, ni de la présence chez les sept d''un départ de
    superviseur en cours de formation, qui est le mécanisme en cause ici. Surtout, nous n''avons pas besoin
    d''inférer : le référentiel produit le résultat par calcul.


    **Les cinq cosignatures sur sept.** Elles engagent le comité, elles ne modifient pas l''arithmétique
    du référentiel. Je les mentionne pour qu''il soit établi que la présente note leur est opposée en
    connaissance de cause.


    ---


    **Première action, cette semaine :** envoi des cinq questions à l''organisme ; ouverture du tableau
    de crédit cumulé de Vidal, première clôture à fin M1 ; notification écrite au DAF que les deux mesures
    écartées ne sont pas exécutées dans l''attente de la décision du comité.


    **Ce sur quoi j''engage le laboratoire :** l''agrément de Vidal avant le départ de Ferrand, et rien
    qui le retarde. Le reste du plan est arbitrable ; ce point ne l''est pas.

    '
