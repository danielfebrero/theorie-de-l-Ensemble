response:
  text: '# Avis — renouvellement du logiciel de réservation et des bornes de prêt


    *Pour la séance du 28. Chaque appréciation est numérotée et rattachée à la pièce qui la porte ; un
    point peut être écarté sans que les autres tombent.*


    ---


    ## A. Ce que le dossier établit, et ce qu''il n''établit pas


    **A1 — Le dossier mélange deux pannes distinctes, qui n''ont ni la même cause ni le même remède.**

    Pièce : export technique. 32 h d''indisponibilité sur 41 se concentrent sur Fontaine et Rive-Sud,
    les deux seuls sites équipés des bornes de 2015 — soit ~16 h par site contre ~1,8 h en moyenne sur
    les cinq autres. C''est un signal de vétusté matérielle, propre aux bornes.

    Le module de réservation, lui, est un problème logiciel remonté par l''enquête et les notes de sites.
    Rien dans le dossier ne relie les deux. Les traiter comme un seul dossier fait acheter un remède logiciel
    pour une panne matérielle.


    **A2 — La thèse « la mise à jour de mars est la cause » est plausible mais non établie.**

    Pièces : enquête (12 des 43 répondants situent le début après mars — soit moins de la moitié des ~26
    qui signalent des pertes) ; réclamations (71 sur 96 entre mars et juin) ; note de Rive-Sud (ressaisie
    depuis mars).

    Ce qui l''affaiblit : **en février, le lien fibre de Rive-Sud a été remplacé et le portail usagers
    a changé de version.** Le portail est commun au réseau ; un défaut introduit en février produit exactement
    la même courbe de réclamations au printemps. Le dossier ne permet pas de départager février et mars.


    **A3 — Fontaine contredit la lecture « panne centrale ».**

    Pièces : export technique + notes de sites. Fontaine a les mêmes bornes de 2015 et une part comparable
    de l''indisponibilité, mais **ne signale aucune perte de réservation**. Deux lectures possibles, exclusives
    : soit la perte est propre à Rive-Sud (et alors elle est locale, pas logicielle centrale), soit Fontaine
    ne remonte pas ses incidents. Dans les deux cas, on ne peut pas conclure aujourd''hui. Cette question
    se tranche en une journée.


    **A4 — La note de cadrage énonce trois affirmations qu''il faut séparer.**

    « La mise à jour de mars est la cause » : partiellement soutenue, confondue avec février (voir A2).
    « La v4 règle le problème » : **aucune pièce au dossier ne soutient cette affirmation**, et la v4
    ne traite en rien les 32 h de bornes. « Il faut signer avant le 30 » : confond l''échéance commerciale
    du 30 avec l''échéance contractuelle du 31 octobre — deux mois d''écart.

    Ce n''est pas une objection à l''auteur : c''est que deux membres du comité ont déjà lu un enchaînement
    causal dont un maillon n''a pas de pièce.


    **A5 — Le chiffrage de la v4 est incomplet, et il l''est du côté qui coûte cher.**

    Pièce : finances. 31 000 € en une fois, et compatibilité avec les bornes de 2015 « à l''étude » chez
    l''éditeur. Tant que cette étude n''est pas rendue par écrit, le prix réel de l''option 2 est « 31
    000 € + un montant inconnu de remplacement de bornes ». On ne vote pas un montant inconnu.


    **A6 — L''écart financier entre signer maintenant et signer dans deux mois n''est pas connu, et il
    est déterminant.**

    Pièce : finances + proposition commerciale. Si la remise de 12 % porte sur une base indexée, l''économie
    est de l''ordre de 5 800 € sur un an. Si elle gèle l''indexation +7 % sur trois ans, elle approche
    27 000 €. Le dossier ne dit pas laquelle. **C''est une question à poser, pas un arbitrage à rendre.**


    **A7 — Le coût que porte Rive-Sud est réel et n''est porté par personne d''autre.**

    Pièce : note de site. 5 h de ressaisie par semaine depuis mars, soit de l''ordre de 200 h sur l''année
    — comparable en ordre de grandeur à la remise que l''on discute. *Estimation, à confirmer par le site.*
    Quelle que soit l''option retenue, ce transfert de charge sur un seul site doit cesser d''être invisible.


    ---


    ## B. Les trois options


    | | Reconduire à l''identique | Reconduire + v4 | Basculer vers le libre |

    |---|---|---|---|

    | **Coût** | 48 000 €/an, +7 % | + 31 000 € une fois, **+ inconnu bornes (A5)** | ~33 600 €/an annoncé
    |

    | **Traite les 32 h de bornes ?** | non | non démontré (A1, A5) | non |

    | **Traite les pertes de réservation ?** | non | non démontré (A4) | inconnu |

    | **Réversibilité** | haute si engagement court | moyenne | **faible** |


    **B1 — L''option « libre » est écartée pour ce comité-ci, sur un fait de calendrier, pas sur ses mérites.**

    Pièces : équipe informatique de deux personnes dont une part en octobre ; réseau voisin, 2 sites sur
    5 encore au registre papier 14 mois après. Engager 7 sites dans une migration avec un agent informatique,
    c''est la seule branche du dossier dont l''échec ne se rattrape pas dans l''année. Elle reste examinable
    en 2027, avec un effectif reconstitué et le retour d''expérience du voisin documenté.


    **B2 — L''engagement de trois ans signé avant le 30 est la décision la plus difficile à défaire du
    dossier.** Elle serait prise deux jours après la séance, sur un diagnostic causal qui a un maillon
    sans pièce (A4), et deux mois avant que le contrat n''expire réellement.


    ---


    ## C. Recommandation


    **Ne rien signer de pluriannuel avant le 30. Reconduire à l''identique pour douze mois, et acheter
    d''ici là l''information qui manque.**


    La raison n''est pas la prudence de principe : c''est que le dossier ne permet pas aujourd''hui de
    choisir entre les options 1 et 2, et que l''information manquante coûte quelques jours de travail
    alors que l''erreur coûte trois ans. Le seul argument en faveur d''une signature immédiate est la
    remise — dont on ne connaît même pas l''assiette (A6).


    **Contre-argument, et pourquoi il ne l''emporte pas.** On peut soutenir que la remise est certaine,
    que la thèse de mars est la plus probable et que la v4 est de toute façon inévitable — donc autant
    signer. C''est défendable, et si la remise gèle l''indexation sur trois ans (27 000 €), l''écart devient
    sérieux. Mais cet argument suppose résolu ce qui ne l''est pas : que la v4 traite la panne, et qu''elle
    ne déclenche pas un remplacement de bornes. Si l''un des deux tombe, on a payé 31 000 € et verrouillé
    trois ans pour rien. Ce contre-argument redevient recevable dès que l''éditeur répond par écrit sur
    la compatibilité des bornes.


    ---


    ## D. Ce que j''engage dans les quinze jours


    | | Action | Qui | Échéance |

    |---|---|---|---|

    | **D1** | Demander au commercial de **prolonger la remise jusqu''au 30 septembre**, et de préciser
    par écrit si les 12 % portent sur une base indexée ou gèlent l''indexation (A6). | Direction | **J+2,
    avant le 30** |

    | **D2** | Demander à l''éditeur une **réponse écrite datée** sur la compatibilité v4 / bornes 2015,
    et le coût de remplacement si incompatible (A5). | Direction | J+3, réponse exigée à J+15 |

    | **D3** | Extraire les **journaux du module de réservation**, par site, de janvier à juin : réservations
    créées / honorées / disparues. Comparer Rive-Sud et Fontaine, et février contre mars (A2, A3). À faire
    **maintenant**, pendant que l''agent qui part en octobre est encore là. | Informatique | J+10 |

    | **D4** | Croiser les **dates des 41 h d''indisponibilité** avec le remplacement de la fibre et le
    changement de version du portail (A2). | Informatique | J+10 |

    | **D5** | Appeler **Fontaine** : pertes de réservation non détectées, ou non remontées ? (A3) | Chargé
    de mission | J+5 |

    | **D6** | Décharger Rive-Sud de la ressaisie : redéploiement temporaire à hauteur de 5 h/semaine,
    et le site co-définit le protocole de test D3 (A7). | Direction + Rive-Sud | J+7 |

    | **D7** | Le chargé de mission **conduit lui-même le test de sa thèse** (D3/D4) et en présente le
    résultat au comité, avec un critère de réussite déclaré à l''avance. | Chargé de mission | séance
    suivante |


    ---


    ## E. Ce qui renverserait cet avis


    - **D3 montre les pertes concentrées après mars, sur plusieurs sites, absentes en février** → la thèse
    de la note de cadrage tient ; la v4 redevient l''option de tête, sous réserve de D2.

    - **D3 montre les pertes présentes dès février, ou limitées à Rive-Sud** → ni la v4 ni le libre ne
    sont le sujet ; la correction est locale ou portail, et beaucoup moins chère.

    - **D2 répond « incompatible »** → la v4 est écartée : son prix réel n''est plus 31 000 €.

    - **D1 refusée sans explication** → la remise n''est pas une contrainte commerciale mais un levier
    de calendrier ; cela pèse contre l''engagement pluriannuel, pas pour.


    ## F. Repli


    Si aucune réponse écrite de l''éditeur n''est reçue au **J+15**, on ne reporte pas la décision : on
    notifie la reconduction à l''identique pour douze mois avant le 31 octobre, sans remise, et la v4
    est réexaminée au premier trimestre sur pièces. **Déclencheur observable : absence de courrier daté
    de l''éditeur au J+15.** Aucune reprise automatique de la négociation pluriannuelle sans passage en
    comité.


    **Première action, si le comité suit cet avis : l''appel D1 au commercial, dans les 48 heures.**

    '
