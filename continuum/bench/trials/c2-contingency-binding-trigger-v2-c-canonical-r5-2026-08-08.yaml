  text: '# NOTE AU COMITÉ DE DIRECTION — Prestataire de paiement


    **De :** Direction des opérations · **Objet :** Solda / Payflux — arbitrage de bascule


    ---


    ## Recommandation : Option B (bascule progressive), amendée sur trois points. Économie année 1 : 180
    k€.


    ### 1. Le chiffre qui décide


    En espérance pure, **A rapporte environ 200 k€ de plus que B**. A crée en contrepartie une branche
    dont on ne revient pas : jetons transférés, compte Solda clos, puis 6 semaines de réouverture et recollecte
    des empreintes auprès de 2,1 M de porteurs. Cette branche coûte **4,8 M€** (42 jours × 756 k€ de volume
    quotidien × 15 % de conversion perdue), hors attrition durable du parc carte enregistrée.


    Il suffit que cette branche ait **4,2 % de chances de se produire** pour effacer l''avantage de A.
    Le seul point de mesure dont nous disposons sur Payflux — 1,3 % d''échec, trois fois l''incumbent,
    pendant trois semaines, chez un seul marchand — ne permet pas d''affirmer que ce risque est sous 4
    %.


    ### 2. Ce que l''option A coûte réellement


    - Bascule le 3 novembre : les trois semaines de dégradation courent jusqu''au **24 novembre**. Le
    Black Friday est le **27**. Trois jours de marge sur une estimation issue d''un pilote unique.

    - Échecs supplémentaires sur ces trois semaines à 100 % du trafic : 18 000 × 0,9 pt × 42 € × 21 j
    = **143 k€**.

    - Le filet Solda expire le **30 novembre — le Cyber Monday**. A retire la réversibilité exactement
    le jour où le trafic est maximal, et avant tout décembre.


    ### 3. Ce que l''option B achète


    - Les trois semaines de dégradation sont absorbées à 10 % du trafic : **16 k€ au lieu de 143 k€**.

    - Les deux comptes restent ouverts pendant le pic. L''astreinte rebascule en **moins de 15 minutes**,
    tableau de bord à 5 minutes. La réversibilité n''est pas une intention, c''est une procédure déjà
    outillée.

    - Prix du filet : **130 k€**, un mois de prolongation Solda en décembre. L''économie passe de 310
    k€ à **180 k€**.


    ### 4. Les trois amendements


    **(a) Signer Payflux le 7 septembre — pas avant.** Les 90 jours sans pénalité courent alors jusqu''au
    **6 décembre** : la fenêtre gratuite couvre le Black Friday. Signée en août, elle expirerait le 15
    novembre, avant l''information qui compte. Cet arbitrage de calendrier vaut **240 k€**. Intégration
    en bac à sable dès lundi, sous lettre d''intention.


    **(b) Prévenir Solda avant le 15 octobre — quelle que soit l''option retenue.** La lettre ne coûte
    rien et conserve l''option ; ne pas l''envoyer ferme le compte le 30 novembre sans recours. Prolongation
    utilisée en décembre seulement, clôture au 31 décembre, en amont du butoir ferme du 28 février.


    **(c) Paliers datés :** 10 % le 21 septembre · 25 % le 12 octobre · 50 % le 26 octobre · 100 % le
    16 novembre — dix jours pleins à 100 % avant le Black Friday, Solda chaud derrière.


    ### 5. Seuils d''arrêt — arrêtés maintenant, pas le jour J


    - Échec Payflux **> 0,8 % pendant 2 h**, ou **> 0,6 % sur 24 h** → retour au palier précédent en <
    15 min, rampe gelée 7 jours.

    - **Deux gels**, ou un palier qui ne redescend pas sous 0,6 % en 10 jours → **sortie sans pénalité
    activée avant le vendredi 4 décembre**.

    - Le 100 % du 16 novembre n''est engagé que si le palier 50 % tient sous 0,6 % pendant 10 jours consécutifs.
    Sinon, le pic se passe à 50 %.


    ### 6. L''observation qui renverserait cette recommandation


    **Si Solda refuse la prolongation au mois le mois, ou la conditionne à plus d''un mois ferme**, B
    perd son filet et son surcoût n''achète plus rien. Dans ce cas seulement : prendre A, mais en avançant
    la bascule à la **mi-septembre**, pour que les trois semaines de dégradation soient derrière nous,
    et mesurées, avant le pic. **À faire confirmer par écrit lundi.**


    ### 7. Le meilleur argument contre B


    *« B coûte 320 k€ de plus pour assurer un risque que le pilote décrit comme borné à trois semaines.
    Et A garde de toute façon Solda ouvert du 3 au 30 novembre. »* — Exact sur le coût, faux sur la couverture
    : le recouvrement de A protège la phase où le risque est faible et mesurable, puis disparaît le jour
    où il devient maximal. B fait l''inverse. Ce qu''on achète, c''est le **calendrier** du filet, pas
    son existence. L''argument ne fait pas basculer la décision.


    ### 8. Lundi


    1. **Lettre à Solda** : prolongation mensuelle, décembre, 130 k€, avec confirmation écrite qu''aucun
    engagement au-delà n''est exigé. *(Ops — lundi)*

    2. **Payflux** : négocier la prise en charge des 130 k€ de double run contre la signature ferme du
    24 mois, et une pénalité contractuelle au-delà de 0,7 % d''échec. Signature calée au 7 septembre.
    *(Achats — lundi, réponse sous 10 jours)*

    3. **Technique** : geler les seuils du §5 dans la procédure d''astreinte ; test à blanc d''une bascule
    100 % → 0 % avant le 21 septembre.

    4. **Comité** : un seul point rouvert, le 20 novembre — le palier auquel on passe le Black Friday.


    ---


    Trois points d''attention sur ce que j''ai fait de mon propre chef :


    - **Je n''ai pas retenu B tel qu''écrit au dossier.** Une rampe de 10 semaines mal calée amène le
    100 % pendant le pic, ce qui annule son intérêt. Les dates du §4(c) sont dimensionnées pour que le
    100 % tombe dix jours avant le Black Friday.

    - **Le calendrier de signature Payflux n''était pas dans le dossier** et c''est, en euros par heure
    de travail, la ligne la plus rentable : la clause des 90 jours ne vaut 240 k€ que si sa fenêtre recouvre
    le Black Friday.

    - **A gagne sur l''espérance, et je le dis dans la note.** La recommandation ne repose pas sur le
    calcul de rentabilité mais sur le seuil de 4,2 % — c''est le point qu''il faut tenir si la présidente
    conteste.


    Les 143 k€ et 16 k€ sont bruts avant réessais clients ; à 50 % de récupération ils sont divisés par
    deux tous les deux, l''écart relatif ne bouge pas. Le seul chiffre que je n''ai pas pu sourcer est
    le taux de perte de conversion en mode dégradé (j''ai retenu 15 %, volontairement bas) — si vous avez
    une mesure interne d''un incident passé, elle rendrait le §1 inattaquable.

    '
