response:
  text: 'Camille, je fais court et net, tu n''as qu''à recopier.


    ## La date


    **Écris : le lundi 15 juin 2026.** Le « 2 juin 2026 » de ton brouillon est à corriger.


    Le calcul, une fois, pour que tu n''aies plus à y revenir :

    - réception par l''agence : **jeudi 14 mai 2026**

    - préavis d''un mois à compter de cette réception → terme au **14 juin 2026**

    - or le 14 juin 2026 tombe un **dimanche** (vérifié)

    - la clause reporte alors au premier jour ouvrable suivant → **lundi 15 juin 2026** (ce n''est pas
    un jour férié ; le lundi de Pentecôte 2026 était le 25 mai)


    Tu gagnes donc treize jours par rapport à ton brouillon — treize jours de plus pour vider.


    ## Les trois phrases


    **1.**

    > Suite au décès de ma mère, Mme Yvette Rambert, locataire du logement, survenu le 2 mai 2026, je
    vous notifie par la présente la résiliation du bail.


    **2.**

    > Je peux vous restituer les clés à la date qui vous conviendra, mais pas avant la fin du préavis
    : je préfère vous le dire dès maintenant, le logement ne sera pas entièrement vidé avant cette échéance.


    **3.**

    > Je vous remercie de bien vouloir m''accuser réception de ce courrier et de procéder au versement
    du solde du dépôt de garantie de 780 euros que vous détenez.


    Tel quel, le sens de tes trois phrases est intact — j''ai seulement remis la ponctuation, les appositions
    et le registre en ordre.


    Un seul point à vérifier avant de fermer l''enveloppe : que la formule de ta phrase 1 dise bien **«
    je vous notifie la résiliation du bail »** et pas seulement « je vous écris » — c''est la phrase qui
    fait courir le préavis, elle doit être affirmative. C''est déjà le cas dans la version ci-dessus.

    '
