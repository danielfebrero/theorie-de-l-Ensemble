response:
  text: '# L''essentiel


    **Le nœud du dossier n''est pas le partage de 160 L/s manquants. C''est que « 240 + 150 + 180 = 570
    » traite comme trois besoins de même rang un plancher légal irréversible et deux demandes qui contiennent
    de la marge.**


    **Ce que je propose : volume global par usage**, pas de quotas individuels — vous n''avez aucune donnée
    parcellaire, donc des quotas ne pourraient être calés que sur la surface déclarée, ce qui récompense
    la surdéclaration et attribue par construction 48 % du volume aux six exploitations qui tiennent 300
    ha sur 620. Et ce serait 34 actes attaquables au lieu d''un.


    | | J0 | J+15 | J+30 |

    |---|---|---|---|

    | Aval | **195** | 195 | 185 |

    | Régie | **120** | 105 | 95 |

    | Maraîchage | **95** | 110 | 130 |


    195 et non 180 : la station n''est pas étalonnée depuis 2023, et si 410 est en réalité 385, une répartition
    calée sur 180 exact fait passer l''aval sous le seuil sans que personne ne le voie. La marge est portée
    par l''aval **jusqu''au jaugeage**, puis rendue au maraîchage. Les maraîchers ont donc un intérêt
    chiffré à ce que la métrologie soit refaite.


    **Le calcul qui débloque tout : 150 L/s pour 9 200 habitants font 1 409 L/hab/jour**, contre ~150
    en consommation domestique française. Facteur 9. Ce n''est pas de l''eau bue — c''est du rendement
    de réseau, des usages d''août, peut-être un périmètre plus large. Je ne l''affirme pas, je l''exige
    sous 5 jours, avec application de la réduction sur présomption à défaut de réponse. En échange, la
    régie obtient **plus** que ce qu''elle réclame : 30 L/s de bloc sanitaire inconditionnel, premier
    servi même en crise. Aujourd''hui elle concourt, demain elle est prioritaire de droit — elle paie
    ça en transparence et en fuites.


    **Le fonds de 600 k€ n''indemnise pas, il achète des L/s** : 180 k€ de recherche-réparation de fuites
    (~12 000 €/(L/s), gain permanent), 300 k€ d''enchère inversée de gel de campagne, 40 k€ de métrologie,
    25 k€ de compteurs. L''enchère fait double office : elle libère de l''eau *et* elle teste les 4,1
    M€. À 6 600 €/ha annoncés, des offres de gel autour de 5 000 €/ha devraient être acceptées. Si personne
    ne gèle à ce prix, le chiffre était surestimé — et cette information vaut mieux qu''un débat d''estimations.
    Avec 80–100 ha gelés, les hectares restants passent de 40 % à 45–62 % de la demande initiale, plus
    compensation sur les hectares abandonnés.


    **Le seul point non amendable : les 180 L/s.** Non par préférence pour la truite, mais par asymétrie
    — une campagne perdue est grave et réparable, deux frayères asséchées sont qualifiées non reconstituables
    à dix ans. Et vous n''avez de toute façon pas compétence pour y toucher : c''est le préfet.


    **La correction de 2022** : quatre conditions cumulatives pour lever (moyenne glissante 10 j ≥ 550,
    station aval ≥ 200, cumul de pluie ≥ 20 mm sur 7 j — la preuve d''une recharge et non d''un ruissellement
    —, levée en deux temps). Sous cette règle, l''orage du 9 août n''aurait rien levé. C''est le test.


    **Trois choses que je signale comme fragiles :**

    - Ma lecture de la marge de la régie est une inférence arithmétique, pas un fait. Elle tombe si le
    rendement est ≥ 90 % — et alors la dotation agricole baisse encore et l''enveloppe de gel doit être
    relevée devant le département.

    - Le palier « < 285 L/s » est atteignable en trois semaines, et là la commission n''a plus de solution
    interne. Prévenez le préfet jeudi, pas le jour venu.

    - Vérifiez sous 48 h que le règlement du fonds autorise les **travaux** et pas seulement l''indemnisation.
    Toute la mécanique en dépend.


    La répartition est arrêtée pour trois semaines, pas huit : décider huit semaines sur un capteur non
    étalonné serait l''erreur de 2022 en miroir.

    '
