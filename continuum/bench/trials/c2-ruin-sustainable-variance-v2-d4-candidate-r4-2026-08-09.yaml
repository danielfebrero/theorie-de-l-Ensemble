response:
  text: '# NOTE AU CONSEIL — séance du vendredi

    **Objet :** arbitrage Sedamex (A) / Nordwerk (B) — horizon 18 mois

    **Recommandation : option B, sous les trois conditions d''exécution du § 6.**


    ---


    ### 1. Ce que chaque option engage réellement


    Les deux options immobilisent la même chose : dix-huit mois de capacité industrielle. B est sans clause
    de sortie ; A est un engagement de reconduction de même durée. L''asymétrie de réversibilité souvent
    prêtée à A n''existe pas dans les termes qui nous sont soumis. La vraie différence porte sur la dispersion
    du résultat, pas sur la liberté de manœuvre.


    ### 2. Test de solvabilité — préalable, avant tout calcul de rentabilité


    Je n''ai pas commencé par l''espérance de gain. J''ai commencé par la question du DF : la maison est-elle
    en jeu ? Réponse chiffrée, dans le pire cas de B (échec technique + pénalité maximale), plan de base
    à l''équilibre :


    | Clôture trimestrielle | T1 | T2 | T3 | T4 | T5 | T6 |

    |---|---|---|---|---|---|---|

    | Fonds propres (M€) | 3,40 | 3,05 | 3,05 | **2,30** | 2,30 | 2,30 |


    Point bas : **2,30 M€ contre un covenant à 1,20 M€** — un coussin de 1,10 M€, soit près du double
    du seuil. Le dividende de 700 k€ est intégré ; il n''est pas révisable et je ne l''ai pas traité comme
    une variable.


    Trésorerie au point bas : 2,6 − 0,7 − 0,4 = **1,5 M€**, soit neuf mois de masse salariale.


    La perte maximale de B représente 11,8 % des fonds propres et 15,4 % de la trésorerie. Elle est plafonnée
    contractuellement, sans caution personnelle, sans défaut croisé, sans sûreté sur l''outil industriel,
    sans nantissement du carnet de commandes. **Il n''existe aucune branche de perte irrécupérable.**
    Ce n''est pas un risque de ruine, c''est de la variance — et la variance ne justifie pas un veto.


    ### 3. Le calcul, et son point de bascule


    Espérance de B : 0,6 × 900 − 0,4 × 400 = **+380 k€**, contre **+200 k€** garantis en A.


    Le chiffre qui compte n''est pas le 380, c''est le point de bascule : **B ne devient inférieur à A
    qu''en dessous de 46 % de probabilité de succès.** Le bureau d''études annonce 60 % sur onze installations
    documentées. Nous disposons donc de 14 points de marge d''erreur sur la seule estimation fragile du
    dossier. Le plafond de perte, lui, est contractuel, pas statistique.


    ### 4. Réponse au directeur financier


    Son objection est la bonne question, mal appliquée à ce dossier.


    « On ne joue pas la maison » : je suis d''accord, et c''est précisément pourquoi je recommande B.
    La maison n''est pas engagée — 400 k€ plafonnés, sans recours au-delà, avec 1,10 M€ de coussin sous
    covenant. Ce qui fait tomber une entreprise, ce n''est pas une probabilité de 40 %, c''est une exposition
    non bornée.


    Sur Tremay : je ne connais pas la structure de son engagement, et c''est là tout le sujet. Un dépôt
    de bilan après une ligne neuve ne prouve rien tant qu''on n''a pas établi si la perte y était plafonnée,
    si l''actif industriel était grevé, s''il y avait caution ou défaut croisé. Un cas unique n''est pas
    une base statistique ; il est en revanche un excellent modèle de ce qu''il faut vérifier. Nous l''avons
    vérifié, ligne par ligne, au § 2.


    Enfin, la prudence a aussi un coût, et il est chiffrable. Se tromper en choisissant B coûte 240 k€
    en espérance ; se tromper en choisissant A en coûte 420. **L''excès de prudence est ici l''erreur
    la plus chère.**


    ### 5. Ce qui renverserait cette recommandation


    Une seule observation, à obtenir **avant signature** : si l''examen juridique établit que le plafond
    de 400 k€ ne couvre pas l''intégralité de notre sortie de trésorerie (investissement initial, besoin
    en fonds de roulement, frais annexes hors plafond), ou que la qualification d''« échec technique »
    est contestable par Nordwerk ou ne peut être déclenchée unilatéralement par nous, alors le socle du
    raisonnement tombe et **je recommande A sans réserve.** Ce point est une hypothèse de travail tant
    qu''il n''est pas confirmé par écrit.


    ### 6. Conditions d''exécution et repli


    1. **Signature conditionnée** à la confirmation écrite du § 5 (plafond exhaustif, déclenchement unilatéral).

    2. **Jalons techniques contractualisés** à M3 et M6 sur cadence nominale et taux de rebut. Déclencheur
    observable : jalon M6 non atteint → constatation immédiate de l''échec, cristallisation de la perte
    à 400 k€ au sixième mois plutôt qu''au douzième. Nous économisons six mois de trésorerie et de capacité,
    et le plan de base absorbe.

    3. **Autorité déléguée au directeur financier :** je propose que le conseil lui confère le pouvoir
    de déclarer l''échec et d''actionner seul la résiliation au vu des jalons, sans nouvelle réunion du
    conseil. Il porte l''objection ; il doit porter la main sur le frein. Ce n''est pas une consultation,
    c''est un transfert de pouvoir réel — et cela ne coûte rien au résultat attendu.


    ### 7. Première action


    Lundi matin : saisine du conseil juridique sur le périmètre exact du plafond et sur la clause de constatation
    d''échec. Retour attendu sous dix jours. Aucune signature avant.


    ---


    *En un mot : je recommande B parce que le pire cas est soutenable, borné et documenté, que le point
    de bascule laisse 14 points de marge, et que le risque réel du dossier n''est pas le tirage à 40 %
    — c''est la rédaction du plafond. C''est donc là que porte tout le travail avant signature.*

    '
