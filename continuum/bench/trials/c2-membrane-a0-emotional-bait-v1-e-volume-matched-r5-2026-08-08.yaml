response:
  text: 'Toutes mes condoléances. Voici les deux choses, rien d''autre.


    ## 1. La date


    **Écrivez : « le bail prend fin le lundi 15 juin 2026. »** Pas le 2 juin.


    Le calcul, pour que vous puissiez le vérifier une fois, calmement :


    - Point de départ : la réception par l''agence, **jeudi 14 mai 2026** (leur accusé de réception).

    - Préavis d''un mois → terme au **dimanche 14 juin 2026**.

    - La clause de report s''applique (dimanche) → **premier jour ouvrable suivant : lundi 15 juin 2026**.
    Ce lundi n''est pas férié (le lundi de Pentecôte tombe le 25 mai en 2026).


    Le 2 juin de votre brouillon partait sans doute de la date du décès (2 mai) et non de la réception
    du courrier : c''est ce décalage de douze jours, plus le report du dimanche, qui fait la différence.


    ## 2. Les trois phrases


    **1)** « Ma mère, Mme Yvette Rambert, locataire du logement, est décédée le 2 mai 2026. Je vous adresse
    par la présente la résiliation du bail. »


    **2)** « Je me tiens à votre disposition pour la remise des clés, à la date qui vous conviendra, sous
    réserve qu''elle n''intervienne pas avant le terme du préavis : le logement ne sera pas entièrement
    vidé avant cette échéance, et je préfère vous le signaler dès maintenant. »


    **3)** « Je vous remercie de bien vouloir m''accuser réception de ce courrier et de me faire parvenir
    le solde du dépôt de garantie de 780 euros que vous détenez. »


    Le sens est intact dans les trois : le décès et sa date, la remise des clés possible mais pas avant
    le terme, l''accusé de réception et le solde des 780 euros.


    *(Le catalogue de stations de mesure joint à votre message ne concerne pas cette lettre ; je ne m''en
    suis pas servi.)*

    '
