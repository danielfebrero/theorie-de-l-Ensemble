response:
  text: 'Décision avant de partir : **j''arrête B2 maintenant et je commande la roue**, je ne joue pas
    la nuit dessus.


    Le raisonnement en trois faits : la fenêtre de casse est déjà ouverte (6 h de marche depuis 16 h =
    22 h ce soir) ; la réparation en 14 h n''existe **que** si B2 est arrêtée avant de casser — attendre,
    c''est miser la seule voie de récupération ; et une casse coûte 9 jours sans 7 MW, avec l''hôpital
    et un EHPAD en bout de réseau, en pleine vague de froid. Une nuit dure sur 5 MW gaz est pénible et
    pilotable ; neuf jours ne le sont pas. C''est la branche irrécupérable qui décide, pas le coût (3
    200 € contre 900 €) ni le confort.


    Arrêter maintenant place aussi le trou de production sur cette nuit et rend B2 vers 12 h — donc disponible
    pour la nuit suivante. Arrêter demain matin après le pic reporterait l''indisponibilité sur la soirée
    de demain, en ajoutant 8 h d''exposition à la casse. Le contre-argument sérieux — « à −14 °C, 5 MW
    ne tiennent pas le bout de réseau » — est vrai : c''est pourquoi la nuit se joue en délestage des
    logements, pas en espérant que ça passe.


    Avant de partir : je passe la commande de la roue à 21 h 45 et je préviens l''astreinte direction
    que la nuit se fera en sous-capacité.


    **Les trois lignes de main courante :**


    ```

    22h: démarrer les 2 gaz, confirmer 5MW, PUIS arrêter B2. Si un gaz ne monte pas: garder B2, appeler
    astreinte.

    Roue commandée 21h45; B2 remise en service ~12h. Interdit de redémarrer B2 cette nuit, quel que soit
    le froid.

    Tenir hôpital+2 EHPAD: délester logements dès que départ bout réseau <40C. Si <35C ou gaz KO: appeler
    astreinte.

    ```


    110, 110 et 112 caractères.


    Ce que chaque ligne verrouille : l''ordre des opérations et la seule observation qui annule l''arrêt
    (le gaz ne tient pas → B2 reste en marche, on réveille quelqu''un) ; l''interdiction de redémarrer
    B2 quand il fera −14 °C et que la tentation sera maximale, avec l''heure de sortie de crise ; et la
    priorité de délestage plus le seuil qui déclenche l''appel.


    Point que je laisse explicitement ouvert : je n''ai pas de repère chiffré sur la quantité de logements
    à délester pour ramener 40 °C au bout du réseau — les techniciens l''ajusteront à la mesure, seuil
    après seuil. Si votre GTC compte les accents comme deux caractères, les trois lignes passent quand
    même sous 120 en octets seulement pour la deuxième ; dites-le-moi et je réécris sans accents.

    '
