    # Prestataire de paiement — recommandation pour le comité du vendredi 14 août


    **De :** Direction des opérations · **Pour :** Présidente du comité · **Objet :** Solda / Payflux


    ## Recommandation


    **Option B, bascule progressive, démarrage le 7 septembre, 100 % atteint le 2 novembre — trois semaines
    avant le Black Friday — avec le compte Solda maintenu ouvert jusqu''en janvier.**


    Je ne recommande pas l''option A. Ce n''est pas de la prudence de principe : le pas irréversible de
    A (transfert des 2,1 M de jetons puis fermeture du compte Solda) tombe à quinze jours du plus gros
    week-end de l''année, et le retour arrière, une fois franchi, coûte six semaines et la recollecte
    des empreintes auprès de 2,1 millions de clients.


    ## Les chiffres


    Le flux : 18 000 transactions/jour × 42 € = **756 k€ de GMV par jour**, 276 M€ par an.


    | | Option A | Option B |

    |---|---|---|

    | Économie année 1 (dossier) | 500 k€ | 310 k€ |

    | Mois Solda de décembre (130 k€) | sans objet | à acheter |

    | **Économie retenue au budget** | **500 k€** | **180 k€** |

    | Trafic exposé pendant les 3 semaines instables du pilote (1,3 %) | 100 % | 10 % puis 25 % |

    | GMV en échec sur ces 3 semaines | 3 402 tx = **143 k€** | 680 tx = **29 k€** |

    | Repli pendant le pic | fermeture Solda déjà actée | réglage de la répartition en < 15 min |


    Surcoût de B : **320 k€**, soit 0,12 % du GMV annuel, soit **3 h 20 d''arrêt total un jour de Black
    Friday** (à 3× le volume normal). C''est le prix d''une porte de sortie ouverte pendant les deux mois
    qui font l''année.


    ## Le contre-argument, et pourquoi il ne l''emporte pas


    **L''argument pour A est bon, je le donne en entier :** B coûte 320 k€ de plus et, dans le scénario
    attendu — le pilote se reproduit à l''identique — n''évite que 114 k€ de GMV en échec, une quinzaine
    de milliers d''euros de marge. Sur la seule espérance mathématique, A gagne largement.


    **Ce qui le renverse, c''est la forme de la perte, pas son espérance.** Sous A, le seul geste de repli
    consiste à ramener 100 % du chiffre d''affaires sur un rail que nous aurons décidé de fermer, en une
    fois, sur jugement, possiblement un vendredi soir de pic. Sous B, c''est un cran de molette, déjà
    actionné trois fois en conditions réelles avant le pic. Et la perte contre laquelle on s''assure n''est
    pas une ligne budgétaire : c''est la base des cartes enregistrées. Une recollecte forcée auprès de
    2,1 M de clients ne se récupère jamais intégralement, et chaque point de non-réinscription est une
    perte de conversion permanente. Aucune économie de 500 k€/an ne rend cette branche achetable — c''est
    la seule du dossier dont on ne peut pas racheter la sortie.


    À l''inverse, la pénalité Payflux de 240 k€ **n''est pas** un risque de cette nature : coût unique,
    inférieur à six mois d''économie, entièrement soutenable. Si elle est le prix d''une sortie propre,
    on la paie sans débat.


    ## Calendrier et portes de passage


    | Date | Action | Porte |

    |---|---|---|

    | Lun 17 août | Signature Payflux + notification écrite à Solda | — |

    | 31 août – 4 sept | Transfert de jetons en test sur sous-ensemble. **Aucune fermeture chez Solda.**
    | — |

    | Lun 7 sept | 10 % du trafic | — |

    | Lun 21 sept | 25 % | échec ≤ 0,6 % sur 7 j glissants |

    | Lun 5 oct | 50 % | échec ≤ 0,55 % sur 10 j |

    | Jeu 15 oct | Contrôle : notification Solda enregistrée | date couperet, aucun report |

    | Lun 2 nov | **95 % Payflux / 5 % Solda** — les 5 % gardent le rail chaud et la bascule éprouvée
    | échec ≤ 0,50 % à 50 % sur 14 j, zéro incident > 30 min |

    | Ven 20 nov | Gel de configuration jusqu''au 5 janvier. Décision sur le mois Solda de décembre. |
    par défaut : on l''achète |

    | Ven 27 nov | Black Friday à 95 % Payflux, compte Solda ouvert, astreinte armée | — |

    | Lun 4 janv | Clôture Solda si 30 jours consécutifs ≤ 0,5 % | mur dur : rien au-delà du 28 février
    |


    ## Déclencheurs de repli (tableau de bord, 5 min)


    1. Échec Payflux > échec Solda + 0,4 pp sur 30 minutes consécutives → l''astreinte redescend d''un
    palier en moins de 15 minutes, sans validation hiérarchique.

    2. Indisponibilité Payflux > 30 minutes → 100 % sur Solda immédiatement.

    3. Deux replis la même semaine, ou une porte échouée deux fois → gel au dernier palier stable, **le
    compte Solda n''est pas fermé**, dossier réouvert au comité de janvier.


    ## Ce que nous faisons lundi 17 août


    1. **Notifier Solda par écrit.** Gratuit, réversible, et le 15 octobre ne se rattrape pas. À faire
    lundi indépendamment du reste.

    2. **Signer Payflux avec deux amendements exigés :** (a) la fenêtre de sortie sans pénalité de 90
    jours court à compter du passage à 100 %, non de la signature — à défaut, prorogée au 31 janvier ;
    (b) aucune facturation majorée en palier partiel.

    3. **Obtenir de Solda par écrit** que la notification n''engage aucun nombre minimum de mois.

    4. **Demander à Payflux la contrepartie du 99,9 %** : 99,9 % autorise 8,8 h d''arrêt par an, plus
    qu''une matinée de Black Friday. Un engagement sans pénalité chiffrée est une intention.

    5. **Demander à la supervision le taux de récupération après relance.**


    ## Trois réserves à porter au procès-verbal


    - **Le taux de récupération après relance n''est pas au dossier et commande tout le raisonnement sur
    les taux d''échec.** Selon qu''un échec sur deux ou un sur dix est rattrapé, les montants ci-dessus
    varient d''un facteur trois. C''est le chiffre le plus utile à obtenir avant vendredi.

    - **Le régime permanent annoncé — 0,5 % contre 0,4 % — coûte 276 k€ de GMV en échecs supplémentaires
    par an, chaque année.** Plus de la moitié de l''économie, et cela vaut pour A comme pour B. Si l''écart
    se confirme sur notre trafic au palier de 50 %, la question devient « faut-il basculer », pas « comment
    » — d''où l''intérêt d''un dispositif qui permet encore de reculer en octobre.

    - **Le calcul de l''économie de B ne se reconstitue pas.** 500 k€ moins 10 semaines de double run
    à 45 k€/mois donne 395 k€, pas 310 k€. 85 k€ restent inexpliqués sur un écart total de 190 k€ qui
    est l''objet même du débat.


    *Montants exprimés en GMV, non en marge : la marge sur coûts variables n''est pas au dossier. Multiplicateur
    Black Friday posé à 3× à défaut d''historique fourni.*


    ---


    **Les trois endroits où je m''écarte du dossier tel que présenté :**


    1. **A et B ne sont pas la vraie question.** La variable décisive est la date de *fermeture* du compte
    Solda, pas la date de bascule. Le transfert de jetons est réversible tant que le compte reste ouvert
    ; c''est la fermeture qui crée le point de non-retour. J''ai donc découplé les deux, ce que ni A ni
    B ne font.

    2. **Le palier final est à 95 %, pas 100 %.** Un rail à 0 % de trafic pendant trois semaines n''est
    plus un repli fiable — le levier de 15 minutes de l''astreinte suppose un chemin encore emprunté.
    900 transactions/jour maintenues chez Solda coûtent presque rien et gardent la bascule prouvée.

    3. **Le mois de décembre chez Solda est budgété par défaut**, ce qui ramène l''économie de B à 180
    k€. Présenter 310 k€ au comité serait présenter un chiffre qu''on ne tiendra pas : au 20 novembre
    nous n''aurons que 18 jours de recul à 95 %, pas les 30 jours qui autorisent la fermeture.


    Si vous voulez, je peux produire une version à deux colonnes qui chiffre le scénario « on garde Solda
    et on renégocie » — il n''était pas sur la table mais 1,4 M€ contre un concurrent à 0,9 M€ est un
    levier que le comité pourrait vouloir constater avant de signer.

    '
