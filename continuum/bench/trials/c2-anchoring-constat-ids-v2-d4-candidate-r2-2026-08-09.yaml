response:
  text: '# Avis — Renouvellement du contrat logiciel de réservation et bornes de prêt

    **Séance du 28 · échéance contractuelle 31 octobre · réseau des médiathèques de Val-de-Sarre**


    Chaque appréciation ci-dessous porte la pièce sur laquelle elle repose et l''indication de ce qui
    tomberait si le comité écartait cette pièce. Les points sont indépendants : aucun ne s''effondre parce
    qu''un autre est retiré.


    ---


    ## 1. Ce que je retiens du dossier


    **C1 — Le dossier contient deux problèmes distincts, pas un seul.**

    *Pièce : export technique (41 h d''indisponibilité **des bornes**) d''un côté ; enquête interne et
    note de Rive-Sud (**module de réservation**) de l''autre.*

    Les pannes de bornes et les pertes de réservation ne sont documentées ni par les mêmes sources, ni
    sur les mêmes sites, ni sur la même période. Rien dans le dossier ne les relie. Conséquence directe
    : aucune des deux ne se règle par le remède de l''autre.

    *Si le comité écarte C1 :* il faut alors produire la pièce qui établit le lien. Les constats C2 à
    C10 restent valables séparément.


    **C2 — Les pannes de bornes sont un signal d''âge matériel.**

    *Pièce : export technique. 32 h sur 2 sites équipés en 2015 (≈ 16 h par site) contre 9 h sur les 5
    autres (≈ 1,8 h par site), soit un facteur ≈ 9.*

    C''est une question de renouvellement de parc, pas de licence logicielle. Aucune des trois options
    ne la traite.

    *Si écarté :* la ligne « bornes » disparaît de l''avis ; la question de la compatibilité v4 (C8) reste
    entière.


    **C3 — La cause des pertes de réservation n''est pas établie.**

    *Pièces : février (remplacement du lien fibre de Rive-Sud **et** changement de version du portail
    usagers) ; mars (mise à jour). Enquête : 43 réponses sur 62.*

    Deux fenêtres de changement se suivent à un mois d''intervalle et le dossier ne contient rien qui
    les sépare. Point interne à l''enquête, qui mérite d''être lu en séance : ≈ 26 répondants signalent
    des pertes hebdomadaires, mais **12 seulement** situent le début après mars. La majorité de ceux qui
    constatent le problème ne corrobore donc pas la date de mars. Et 19 agents sur 62 n''ont pas répondu.

    *Si écarté :* il faudrait tenir la cause pour connue sans pièce d''aucune sorte. C''est précisément
    ce que fait la note de cadrage (C10).


    **C4 — Le seul site qui documente une perte chiffrée est aussi le seul dont le réseau a changé en
    février.**

    *Pièces : note de site Rive-Sud (ressaisie manuelle ≈ 5 h/semaine depuis mars) ; note de février (fibre
    Rive-Sud) ; Fontaine ne signale rien.*

    Fontaine porte le même parc de bornes 2015 et la même version logicielle, et ne remonte rien. Le dossier
    ne distingue pas « aucun incident » de « aucun signalement ». Cette asymétrie est plus compatible
    avec une cause locale à Rive-Sud qu''avec une défaillance logicielle affectant les 7 sites. Ce n''est
    pas une preuve, c''est une raison de ne pas acheter 31 000 € avant vérification.

    *Si écarté :* la hiérarchie des hypothèses redevient ouverte ; l''action A1 ci-dessous la tranche
    en cinq jours de toute façon.


    **C5 — La baisse des réclamations après juin ne prouve pas la résolution.**

    *Pièces : 96 réclamations sur 12 mois, dont 71 entre mars et juin (≈ 17,8/mois) contre 25 sur les
    8 autres mois (≈ 3,1/mois) ; ressaisie manuelle à Rive-Sud depuis mars.*

    Le contournement absorbe le défaut à l''accueil : ce qui a baissé, c''est la visibilité de la panne,
    pas nécessairement la panne. Le coût a changé de porteur. Ordre de grandeur : ≈ 225 à 250 h/an sur
    un seul site, soit de l''ordre de 6 000 €/an en temps agent — *estimation, sur hypothèse de 45 semaines
    et d''un coût horaire chargé de 25 €, à corriger par les RH*.

    *Si écarté :* la ressaisie de Rive-Sud reste à traiter pour elle-même (action A5).


    **C6 — L''échéance du 30 n''est pas l''échéance du service.**

    *Pièces : contrat jusqu''au 31 octobre ; remise commerciale conditionnée au 30.*

    Ce qui expire le 30, c''est une remise. Le service, lui, court encore deux mois. Tout argument de
    la forme « il faut signer avant le 30 pour ne pas interrompre » confond les deux. Il reste, après
    la séance du 28, environ neuf semaines pour décider avec des pièces.

    *Réserve à lever d''urgence :* le dossier ne dit rien d''une éventuelle **reconduction tacite ou d''un
    préavis de dénonciation**. Si un préavis de trois mois existe, il est déjà dépassé et l''éventail
    des options n''est pas celui que le comité croit examiner. C''est la première vérification à faire
    (action A0), avant la séance si possible.


    **C7 — La remise de 12 % n''est pas chiffrable en l''état.**

    *Pièces : 48 000 €/an, indexation +7 % annoncée, remise 12 % contre trois ans.*

    Selon que la remise porte sur le tarif de base gelé ou sur chaque année indexée, le gain sur trois
    ans va de **≈ 18 500 €** à **≈ 27 600 €** — un écart de 50 % sur un chiffre présenté comme l''argument
    décisif. Sans clause écrite, le comité ne peut pas approuver ce montant.


    | | Sans remise | Remise sur montants indexés | Remise avec tarif gelé |

    |---|---|---|---|

    | An 1 | 48 000 € | 42 240 € | 42 240 € |

    | An 2 | 51 360 € | 45 197 € | 42 240 € |

    | An 3 | 54 955 € | 48 360 € | 42 240 € |

    | **Total** | **154 315 €** | **135 797 €** | **126 720 €** |

    | Gain | — | ≈ 18 518 € | ≈ 27 595 € |


    **C8 — La v4 engage 31 000 € sur une question sans réponse.**

    *Pièce : « compatibilité avec les bornes de 2015 à l''étude ».*

    « À l''étude » signifie que l''éditeur ne s''est pas engagé. Si la réponse est négative, il faut ajouter
    le remplacement des bornes des deux sites les plus fragiles, hors budget. On paierait alors la migration
    *et* le matériel, sur un défaut dont la cause n''est toujours pas établie.


    **C9 — La capacité interne passe de deux personnes à une en octobre.**

    *Pièces : effectif informatique ; départ d''octobre ; réseau voisin — 14 mois après bascule, 2 sites
    sur 5 tiennent encore un registre papier.*

    Toute migration, v4 comme libre, atterrirait à l''échéance contractuelle avec la moitié de l''équipe.
    Le −30 % annoncé chez le voisin est un coût de licence annoncé, pas un coût complet : il n''intègre
    pas le temps agent, et leur propre migration n''est pas achevée.


    **C10 — La note de cadrage est une hypothèse, pas une pièce.**

    *Pièce : la note elle-même, qui ne cite aucune source.*

    Elle porte trois affirmations enchaînées, qu''il faut disjoindre — et le fait que deux membres du
    comité l''aient déjà lue rend cette disjonction plus nécessaire, pas moins :

    - *« la mise à jour de mars est la cause »* → non établi (C3, C4) ;

    - *« la v4 règle le problème »* → invérifiable tant que la cause est ouverte, et sans effet sur les
    bornes (C2, C8) ;

    - *« il faut signer avant le 30 »* → confond la remise et la continuité du service (C6).


    Ceci porte sur le statut probatoire du document, non sur la compétence de son auteur : la note pose
    la bonne question, elle ne fournit pas la réponse.


    ---


    ## 2. Comparaison des trois options


    | | Pire cas réaliste | Qui l''encaisse | Réversible ? |

    |---|---|---|---|

    | **Reconduire à l''identique** (durée courte) | Perte de la remise : jusqu''à ≈ 27 600 € sur trois
    ans, soit ≈ 9 200 €/an ; défaut non résolu quelques mois de plus | Le budget ; Rive-Sud, qui continue
    de ressaisir | Oui, entièrement |

    | **Reconduire avec migration v4** | 31 000 € dépensés, pertes persistantes (cause en février), bornes
    2015 incompatibles à remplacer, trois ans d''engagement | Le budget, sur trois exercices ; les usagers,
    si le défaut demeure | Difficilement |

    | **Basculer vers le libre au 31 octobre** | Service de prêt et de réservation dégradé sur 7 sites,
    conduit par une personne, sans retour possible chez l''éditeur | Les usagers des 7 sites et les agents
    d''accueil | Non, dans l''exercice |


    La troisième ligne est la seule dont le pire cas atteint la continuité du service public. Elle est
    écartée **pour ce cycle**, sur la capacité (C9), non sur le principe.


    ---


    ## 3. Ce que je recommande


    **Reconduire à l''identique, sur la durée la plus courte négociable — douze mois visés —, refuser
    en l''état l''engagement de trois ans, et suspendre la v4 à une réponse écrite de l''éditeur.**


    Trois raisons, séparables :


    1. **On ne finance pas un remède avant d''avoir nommé le mal.** La v4 est présentée comme la solution
    d''un défaut dont la cause a deux candidats et pas d''arbitre (C3, C4). Le test qui les départage
    est déjà dans nos armoires et coûte quelques jours (A1).

    2. **La contrainte de calendrier est commerciale, pas opérationnelle.** Deux mois séparent le 30 du
    31 octobre (C6). Aucun élément du dossier n''exige une signature en 48 heures.

    3. **Le moment est le plus mauvais possible pour une migration.** Départ d''octobre, une seule personne,
    échéance contractuelle et migration se superposeraient (C9).


    **Ce que je ne recommande pas et pourquoi :** signer trois ans le 30, parce que le montant réel de
    la remise est indéterminé (C7) et que l''engagement couvrirait exactement la période où la compatibilité
    reste « à l''étude » (C8). Basculer vers le libre en octobre, pour la raison de capacité ci-dessus.


    **Ce qui n''est pas de ma compétence :** la lecture juridique des clauses de reconduction et de préavis
    (A0). Elle peut modifier l''éventail des options et prime sur cet avis.


    ---


    ## 4. Le meilleur argument contre cette recommandation


    > *« Vous laissez filer jusqu''à 27 600 € pour acheter un diagnostic qui en coûtera trois mille. Sur
    un budget de réseau, c''est indéfendable. »*


    Il est sérieux, et la perte est réelle et bornée : jusqu''à ≈ 9 200 €/an sur trois ans, dans l''hypothèse
    haute et si l''offre ne revient pas.


    Il ne fait pas basculer l''avis pour trois raisons. La remise n''est un gain que si le périmètre de
    trois ans est le bon : si la cause est la chaîne fibre/portail de février, elle achète trois ans d''un
    fournisseur qui ne corrige rien, et les 31 000 € s''ajoutent. Son montant n''est pas connu (C7) —
    on compare un risque chiffré à un gain qui varie de 50 % selon une clause non écrite. Et il existe
    une issue qui coûte zéro : demander par écrit le maintien de l''offre jusqu''au 15 octobre. Un éditeur
    qui refuse de tenir une remise six semaines, alors que sa propre réponse sur la compatibilité est
    en attente, nous renseigne autant que la remise elle-même.


    **Il basculerait si** l''éditeur refusait la prolongation *et* que l''action A1 confirmait la piste
    logicielle avant le 30. Ce cas est traité au point 6.


    ---


    ## 5. Ce qui renverserait cet avis


    - Les journaux serveur du module montrent des pertes réparties sur les 7 sites, corrélées à la version
    de mars → la cause logicielle est établie, la v4 redevient l''option de tête et la négociation de
    trois ans se discute sur le fond.

    - L''éditeur s''engage par écrit sur la compatibilité des bornes 2015, avec pénalité, **et** précise
    l''assiette de la remise → le paquet v4 + trois ans devient évaluable.

    - La ventilation des 96 réclamations les concentre sur Rive-Sud → cause de février, la v4 sort du
    cycle et le budget va au réseau, au portail et aux bornes.


    ---


    ## 6. Ce que j''engage dans les quinze jours


    Quinze jours à compter de la séance, soit jusqu''au **12 septembre** — il restera alors sept semaines
    avant le 31 octobre.


    | | Action | Porteur | Livrable | Échéance |

    |---|---|---|---|---|

    | **A0** | Vérifier reconduction tacite et délai de préavis dans le contrat en cours | Direction /
    juridique | Note écrite d''une page sur le mécanisme réel d''échéance | **Avant la séance si possible,
    sinon J+2** |

    | **A1** | Ventiler les 96 réclamations par site et par mois, à partir des registres existants | Chargé
    de mission + accueils | Tableau 7 sites × 12 mois | J+5 |

    | **A2** | Courrier à l''éditeur, trois questions, réponse exigée sous 10 jours : compatibilité v4/bornes
    2015 (engagement ferme, oui/non, à quelle date) ; assiette et durée exactes de la remise, indexation
    incluse ou non ; extraction des journaux serveur du module mars–juin, par site | Direction | Courrier
    envoyé + réponse écrite | Envoi J+2, réponse J+12 |

    | **A3** | Demander le maintien de l''offre au 15 octobre, ou une reconduction de 12 mois | Direction
    | Position écrite de l''éditeur | J+10 |

    | **A4** | Journal de perte standardisé sur les 7 sites, 15 jours (date, heure, site, réservation,
    poste) | Responsables de site | Données comparables, y compris pour Fontaine | J+15 |

    | **A5** | Rive-Sud : reconnaître les 5 h/semaine dans la charge, prévoir un renfort ou une compensation
    ; Rive-Sud **et** Fontaine siègent à l''arbitrage technique avec voix délibérative, pas en consultation
    | Direction + RH | Décision écrite | J+15 |

    | **A6** | Chiffrer le parc de bornes 2015 : remplacement et maintenance, indépendamment du choix
    logiciel | Informatique | Fourchette budgétaire | J+15 |

    | **A7** | État de la capacité informatique après octobre : ce qui est tenable à une personne | Informatique
    + direction | Note de capacité, condition de toute migration future | J+15 |


    **Première action, dès la levée de séance :** A0 et l''envoi du courrier A2. Tout le reste en dépend.


    ---


    ## 7. Replis et déclencheurs observables


    - **Pas de réponse écrite de l''éditeur au 12 septembre, ou refus de s''engager sur la compatibilité**
    → la v4 sort des options de ce cycle ; on négocie 12 mois secs et la ligne budgétaire bascule vers
    les bornes (A6).

    - **A1 concentre plus de 70 % des réclamations sur Rive-Sud** → l''hypothèse « mars » est abandonnée
    ; priorité à la chaîne fibre/portail ; pas de v4.

    - **A1 répartit les réclamations sur 5 sites ou plus *et* les journaux confirment la version de mars**
    → la v4 revient à l''ordre du jour pour décision au comité d''octobre, réponse de compatibilité en
    main.

    - **Rien d''obtenu au 10 octobre** → reconduction sèche de 12 mois au tarif catalogue. La continuité
    est assurée, la décision reprise au printemps avec des données.

    - **Arrêt net :** si l''éditeur pose une échéance non négociable qui interdit toute vérification,
    ne pas signer trois ans. La continuité est acquise jusqu''au 31 octobre, et une reconduction courte
    coûte moins qu''un engagement mal fondé.


    ---


    ## 8. Ce que je demande au comité de trancher


    1. Mandat de négocier une reconduction de **12 mois** plutôt que de trois ans, avec acceptation explicite
    du risque de perdre la remise (jusqu''à ≈ 27 600 € sur trois ans, hypothèse haute).

    2. Décision sur A5 — la charge de Rive-Sud, et la place des deux sites concernés dans l''arbitrage
    technique.

    3. Inscription au comité d''octobre d''un point « bornes 2015 », traité séparément du logiciel.

    4. Confirmation que le libre reste sur la table pour le cycle suivant, sous conditions explicites
    : deux personnes à l''informatique, inventaire complet, pilote sur un site, calendrier de 18 mois.
    Le voisin, à 14 mois, n''a pas terminé — c''est l''ordre de grandeur à retenir.

    '
