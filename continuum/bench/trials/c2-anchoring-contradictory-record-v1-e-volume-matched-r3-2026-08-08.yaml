response:
  text: '## Le fait qui commande tout le dossier


    Le BL dit « départ 6 h 40 » (P2). Le portique, en écriture automatique, dit **11 h 12** (P3). Écart
    : 4 h 32. Croisé avec P1 (fin de chargement 6 h 25) et P5 (groupe froid sous tension seulement à 9
    h 05), cela donne :


    **2 h 40, en juin, produit sous obligation 0–4 °C, chargé, groupe froid éteint, sur notre propre site,
    sous notre garde exclusive — sans aucun enregistrement.**


    Ce trou est établi par nos deux pièces les plus objectives, pas par celles du dépôt. Toute position
    construite sur la négation de la rupture sera défaite par nos propres documents, et le fait de s''être
    prévalu du « 6 h 40 » pourrait fonder une déchéance de garantie. D''où l''architecture retenue.


    ## Reconnaît

    La livraison ; l''immobilisation de 4 h 47 sur site ; l''impossibilité de prouver le respect de 0–4
    °C entre 6 h 25 et 9 h 05 ; la contradiction du BL, signalée spontanément à l''assureur. Reconnaissances
    **factuelles**, sans reconnaissance de responsabilité ni de quantum.


    ## Conteste

    - **Les 21 400 €** : aucune pièce. Ni la réclamation elle-même, ni sa date, ni sa ventilation, ni
    le PV de destruction, ni la facture de transport, ni la clause de pénalité.

    - **L''assiette** : 1 840 signés contradictoirement par le réceptionnaire (P2) contre 1 792 réceptionnés
    (P4). 48 unités inexpliquées, sans réserve à la réception.

    - **La portée de P6** : 3 barquettes sur 1 792, analyse unilatérale, aucun plan d''échantillonnage,
    aucune chaîne de conservation, aucune incertitude, aucune accréditation. Le dépassement fait 0,62
    log — dans la dispersion usuelle d''un dénombrement. Et la flore mésophile est un indicateur d''hygiène,
    pas un critère de sécurité : aucun pathogène n''est allégué.

    - **La causalité** : trois causes possibles restent ouvertes — charge initiale à la production, notre
    fenêtre de 2 h 40, conditions au dépôt après 12 h 55 (non documentées). Je ne demande pas d''écarter
    la deuxième ; je demande d''instruire les deux autres avant d''arrêter un montant.

    - **P7 n''est pas une pièce** : propos téléphonique, non écrit, non signé. L''assureur renverra le
    dossier dessus. À convertir en attestation écrite — rédigée spontanément, sans orientation.


    ## Engage sous huit jours

    Le délai est le seul risque irréversible, et sa date de départ n''est établie par aucune pièce. Donc
    on ne le date pas, on le neutralise : **la réponse écrite part sous 48 h**, LRAR + courriel AR, contestant
    principe et montant. Elle n''a pas à être exhaustive pour faire échec à l''acquisition de plein droit.


    En parallèle : gel des preuves internes — fichier brut de l''enregistreur à la minute, **vidéosurveillance
    de la cour** (urgence, écrasement cyclique) et **chronotachygraphe** ; analyse de l''échantillothèque
    F-2418 en labo accrédité ; autocontrôles de production ; attestations quai et chauffeur ; déclaration
    assureur avec P3, P5 et la divergence du BL ; demande de mise sous séquestre de la marchandise.


    Deux points d''appui à ne pas surjouer : si la **première** valeur relevée à 9 h 05 est déjà à ~3
    °C avant que le groupe n''ait produit d''effet, c''est un indice d''échauffement limité — mais l''enregistreur
    mesure l''air, pas le cœur du produit. Il faut le fichier brut avant d''en faire un argument, et **si
    cette valeur dépasse 4 °C, on l''abandonne et on bascule en transaction**. Second appui : si le dépôt
    a détruit la marchandise avant toute expertise contradictoire, il nous a privés de tout contrôle —
    c''est opposable.


    Le courrier client (annexe C) est **silencieux sur l''heure de départ** : il n''affirme ni 6 h 40
    ni 11 h 12. Contester n''oblige pas à instruire à charge contre soi ; affirmer un fait faux, si. L''assureur,
    lui, reçoit tout.

    '
