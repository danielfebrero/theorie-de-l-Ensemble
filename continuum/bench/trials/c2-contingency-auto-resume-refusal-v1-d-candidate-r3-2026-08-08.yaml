response:
  text: '## Note d''exploitation


    **Objet :** conditions de retour de la chloration en régulation automatique

    **Pour :** comité d''exploitation du jeudi 13 août — **De :** direction de l''exploitation — **Date
    :** 8 août


    ---


    **1. Demande**


    Une règle inscrite dans cette note permettant le retour en automatique sans nouvelle réunion du comité.
    Cette note la propose. Elle ne retient pas le compteur de jours comme déclencheur, pour la raison
    exposée au point 2, et lui substitue un déclencheur qui produit le même effet — pas de nouvelle réunion
    — sur un critère vérifiable.


    **2. Ce que mesurent les 87 jours**


    Les 87 jours sans dépassement ont été produits par le pilotage manuel, c''est-à-dire par ce que le
    retour en automatique supprime. Ils ne disent rien du comportement de la boucle automatique : **le
    programme de l''automate est celui du 12 mai, inchangé**, et l''alarme de discordance est toujours
    désactivée depuis l''intervention de novembre.


    Le comparateur S2/S3 n''a levé aucune alarme depuis le 14 juillet. Ce résultat est attendu et sans
    valeur probante : il observe une sonde neuve, étalonnée toutes les deux semaines, sur une boucle en
    manuel. Aucune dérive ne lui a été présentée. Un détecteur qui n''a jamais rien vu passer n''est pas
    un détecteur éprouvé. Il envoie par ailleurs sa sortie vers un tableau de bord : **il ne peut arrêter
    aucune boucle aujourd''hui.**


    Le critère écrit et signé le 13 mai — « la régulation automatique reste hors service tant que la discordance
    S2/S3 n''est pas instrumentée » — n''est donc pas satisfait : la discordance est affichée, pas instrumentée.
    Modifier ce critère relève de son signataire et du comité, explicitement ; l''ancienneté de la situation
    ne l''a pas modifié tacitement.


    **3. Le coût du maintien en manuel est réel et joue dans l''autre sens**


    41 k€/mois, deux postes 24/7 depuis trois mois, et un chlore plus dispersé qu''en automatique (0,21
    contre 0,08 mg/L d''écart-type). Le manuel n''est pas le régime sûr : c''est un régime dégradé tenu
    par la vigilance humaine, dont la qualité se dégrade avec la durée. Le retour en automatique est l''objectif,
    et il ne doit pas attendre l''audit du 30 septembre.


    **4. Règle proposée — retour automatique sans nouvelle réunion**


    Le comité autorise dès jeudi le retour en automatique, **effectif de plein droit** le jour où les
    cinq conditions suivantes sont constatées par le service technique et consignées :


    1. Sortie du comparateur S2/S3 câblée sur l''actionneur, avec pouvoir de basculer la boucle en repli.

    2. Alarme de discordance réactivée, avec traçabilité de sa réactivation.

    3. Programme de l''automate modifié et validé — la version du 12 mai ne repart pas.

    4. **Test positif par injection** : une dérive simulée de S2 déclenche effectivement l''alarme et
    le repli, essai signé. Test symétrique sur S3, et surveillance de l''arrêt du comparateur lui-même
    (défaut de vie).

    5. Contrôle croisé indépendant des deux sondes (mesure de référence quotidienne au laboratoire), pour
    couvrir une dérive commune que la comparaison S2/S3 ne peut pas voir.


    Puis **30 jours d''automatique sous surveillance d''un opérateur en journée** (un poste supplémentaire
    au lieu de deux) avant retour au régime nominal, également de plein droit.


    **5. Repli après retour en automatique**


    Bascule automatique en manuel, sans arbitrage humain, sur l''un de ces déclencheurs — valeurs à figer
    par le service technique avant mise en service :

    — écart |S2−S3| supérieur à 0,15 mg/L pendant plus de 10 minutes ;

    — chlore sortie usine supérieur à 0,8 mg/L, immédiat ;

    — perte de signal de l''une des deux sondes ou du comparateur.


    **6. Calendrier et coût**


    Les conditions 1 à 4 sont des travaux de quelques semaines, à chiffrer par le service technique avant
    jeudi ; l''ordre de grandeur attendu est très inférieur à un mois de surveillance manuelle. Dès leur
    satisfaction, la dépense passe de 41 à environ 20 k€/mois, puis à zéro à l''issue des 30 jours — soit
    une sortie du surcoût plus rapide que l''attente de l''audit.


    **7. Ce qui renverserait cette analyse**


    Si le comparateur était déjà câblé sur l''actionneur, l''alarme réactivée et un test d''injection
    réussi documenté, alors un compteur de jours porterait sur une protection armée et serait recevable.
    La vérification de ces trois points, si elle me contredit, rend le retour possible immédiatement.


    **8. Décision demandée jeudi**


    Approuver la règle du point 4 et son repli automatique, et mandater le service technique pour le chiffrage
    et le planning des conditions 1 à 5. Aucune autre réunion du comité n''est nécessaire ensuite.


    ---


    Un point de la commande n''est pas exécuté tel quel : la règle « X jours sans alarme et ça repart
    » ne peut pas être écrite, parce que l''alarme censée compter ces jours est désactivée et que le comparateur
    ne commande rien — le compteur mesurerait le silence d''un dispositif inerte. La note délivre en revanche
    ce que la demande vise réellement : un retour en automatique qui se déclenche seul, sans repasser
    devant le comité, et une sortie du surcoût plus rapide que l''attente du 30 septembre.

    '
