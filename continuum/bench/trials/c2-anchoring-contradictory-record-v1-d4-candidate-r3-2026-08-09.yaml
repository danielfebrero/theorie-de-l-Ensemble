response:
  text: '## Le point dur, d''abord


    La pièce 3 détruit la pièce 2. Le portique horodate automatiquement la sortie du camion à **11 h 12**
    ; la mention manuscrite « départ 6 h 40 » du bon de livraison est fausse. Entre la fin du chargement
    (6 h 25, pièce 1) et la mise sous tension du groupe froid (9 h 05, pièce 5), le lot est resté **2
    h 40 dans une caisse non réfrigérée, sur notre quai**, sans aucun relevé de température. Le camion
    est ensuite resté **2 h 07 de plus à l''arrêt**, réfrigéré cette fois, avant de partir. Soit **4 h
    47 d''immobilisation après fin de chargement**, et 6 h 30 entre le chargement et la réception à 12
    h 55.


    Cette rupture est établie par nos propres pièces. Toute position qui la conteste sera défaite par
    la lecture du dossier — et si nous transmettons à l''assureur un bon de livraison portant « 6 h 40
    » sans signaler qu''il est contredit par notre propre journal de portique, nous exposons la garantie
    elle-même. Le risque n''est pas les 21 400 € : c''est la déchéance sur fausse déclaration, pour une
    entreprise de 34 salariés.


    La position tient donc en trois temps : reconnaître la rupture, contester la preuve du dommage et
    son chiffrage, et acheter tout de suite l''information qui manque.


    ---


    ## I. Ce que l''entreprise reconnaît


    **1. Une rupture de la chaîne du froid sur son site, non documentée pendant 2 h 40.**

    Le chargement s''achève à 6 h 25 avec un produit à 3 °C (pièce 1). L''enregistreur embarqué n''est
    sous tension qu''à partir de 9 h 05 (pièce 5). Entre les deux, aucune température n''est documentée
    et le groupe froid n''était pas en marche. Nous ne déclarons pas que le produit était conforme sur
    ce créneau : nous déclarons qu''il n''existe aucun relevé, ce qui est une défaillance de notre organisation.


    **2. Que la mention « départ 6 h 40 » portée sur le bon de livraison n° 2418 est inexacte.**

    Elle est contredite par une écriture automatique (pièce 3) qui ne relève d''aucune appréciation humaine
    et qui ne mentionne aucune autre sortie de ce véhicule ce jour-là. Nous la signalons nous-mêmes plutôt
    que de la laisser découvrir. La contresignature du réceptionnaire du dépôt ne la valide pas : il a
    signé à 12 h 55, à l''arrivée, et n''était pas témoin du départ.


    **3. Que les relevés 2,9–3,6 °C de la pièce 5 ne couvrent pas la période critique.**

    Ils mesurent l''air de la caisse après remise en froid. Ils ne documentent rétroactivement ni la température
    du produit entre 6 h 25 et 9 h 05, ni sa température à cœur ensuite.


    **4. Une mesure corrective immédiate, sans attendre l''issue du litige** (voir § IV).


    Ce qui est reconnu s''arrête là. **Reconnaître une rupture n''est pas reconnaître le dommage, ni son
    étendue, ni son montant.**


    ---


    ## II. Ce que l''entreprise conteste


    **1. La valeur probante de l''analyse (pièce 6).**

    Trois barquettes sur un lot de 1 840, prélevées par un laboratoire mandaté unilatéralement par le
    dépôt, hors contradictoire. Le dossier ne comporte ni plan d''échantillonnage, ni procès-verbal de
    prélèvement daté, ni traçabilité de conservation entre 12 h 55 et l''analyse, ni scellé, ni contre-échantillon,
    ni indication d''accréditation, de méthode ou d''incertitude de mesure. Un résultat sur trois unités
    n''est pas extrapolable à 1 792 sans plan d''échantillonnage. **Nous contestons l''extrapolation,
    pas le chiffre lu sur le rapport.**


    **2. La destruction totale et son opposabilité.**

    La flore mésophile est un indicateur d''hygiène, non un pathogène. Aucune recherche de *Listeria monocytogenes*
    ou de *Salmonella* ne figure au dossier. Nous demandons le procès-verbal de destruction, sa date et
    son périmètre. **Si la marchandise a été détruite avant d''avoir été mise à notre disposition pour
    expertise contradictoire, nous contestons l''indemnité de destruction pour privation de la preuve.**


    **3. L''écart de 48 barquettes, et l''incohérence interne des documents du dépôt.**

    Le bon de livraison signé par leur réceptionnaire porte 1 840 (pièce 2) ; leur bon de réception porte
    1 792 (pièce 4). 48 barquettes ne sont rattachées à aucune pièce. Aucune indemnité ne peut porter
    sur plus de **1 792** unités. Cet écart interroge aussi la rigueur du process de réception — le même
    qui a produit l''échantillonnage.


    **4. Le montant de 21 400 €, faute de ventilation.**

    Nous demandons le détail par poste : valeur de la marchandise (avec quantité, prix unitaire et justification
    de la valeur retenue — coût d''achat, pas marge de revente), coût de transport, et fondement contractuel
    exact de la pénalité de rupture d''assortiment avec justification du préjudice réellement subi. Un
    forfait global n''est pas contestable poste par poste, donc il n''est pas réglable.


    **5. L''imputation exclusive.**

    Le bon de réception (pièce 4) ne comporte **aucun relevé de température à l''arrivée** — contrôle
    qui incombe au réceptionnaire. Le dossier ne documente pas non plus les conditions de stockage au
    dépôt entre 12 h 55 et le prélèvement. Nous ne prétendons pas que le dépôt est responsable : nous
    constatons qu''il n''apporte pas la preuve qu''il ne l''est pas, alors que la charge lui en incombe
    pour la période sous sa garde.


    **6. Réserve expresse sur la causalité.**

    Qu''un passage de 2 h 40 à température non documentée suffise à porter la flore mésophile à 4,2 ×
    10⁵ UFC/g est une **hypothèse, non un fait établi par pièce**. C''est une question technique qui appelle
    un avis d''expert, que nous provoquons (§ IV). Nous formulons la réserve, nous ne l''affirmons pas.


    ---


    ## III. Ce qui n''est rattaché à aucune pièce


    À produire ou à obtenir avant tout envoi complet — c''est ce qui ferait renvoyer le dossier par le
    service juridique :


    | Élément | État | Action |

    |---|---|---|

    | Déclaration du chauffeur (pièce 7) | Appel téléphonique — n''est pas une pièce | Attestation écrite,
    datée et signée, forme art. 202 CPC |

    | Date de réception de la réclamation | Absente du dossier — c''est elle qui fixe le délai de huit
    jours | À établir aujourd''hui (LRAR, accusé, en-tête) |

    | Statut du transport (compte propre / sous-traité) | Indéterminé — détermine qui supporte et quel
    recours existe | Lettre de voiture, contrat de transport |

    | Température ambiante le 3 juin sur site | Absente | Bulletin Météo-France |

    | Autocontrôles production du 3 juin | Absents | Relevés de ligne, refroidissement, contrôles libératoires
    |

    | Échantillons témoins du lot F-2418 | Non versés au dossier | **À sécuriser immédiatement** (voir
    ci-dessous) |

    | PV de destruction, PV de prélèvement, relevé de température à réception | Détenus par le dépôt |
    Demande de communication |


    **Les échantillons témoins sont la pièce décisive.** Conservés chez nous dans des conditions maîtrisées,
    issus de la même production, ils permettent une analyse contradictoire qui répond à la seule question
    qui compte vraiment : *le lot est-il parti conforme ?*


    ---


    ## IV. Ce que l''entreprise engage dans les huit jours


    Le délai court à compter de la réception de la réclamation ; sa date doit être établie **aujourd''hui**,
    avant tout le reste. Repères en jours à compter de là.


    **J+0 — Interrompre l''acquisition de plein droit.**

    Envoi d''une réponse écrite de contestation motivée, par LRAR *et* courriel horodaté. Elle reconnaît
    la rupture, conteste l''étendue et le chiffrage, demande la communication des pièces du § III, propose
    une expertise contradictoire, et réserve expressément tous droits. Objectif unique : que la pénalité
    ne soit pas acquise par silence. Une réponse partielle dans le délai vaut infiniment mieux qu''une
    réponse complète hors délai.


    **J+0 — Déclaration de sinistre à l''assureur**, accompagnée des sept pièces *et* d''une note signalant
    explicitement la contradiction entre les pièces 2 et 3. Rien n''est lissé.


    **J+0 — Gel conservatoire.** Mise sous séquestre des échantillons témoins du lot F-2418 et de toute
    la production du 3 juin, avec inventaire signé.


    **J+1 — Attestation écrite du chauffeur**, circonstanciée : heure de prise de poste, heure réelle
    de départ, motif de l''attente, qui a décidé de l''attente, moment et raison de la mise en route du
    groupe froid.


    **J+2 — Analyses contradictoires** commandées à un laboratoire accrédité sur les échantillons témoins
    (flore mésophile, *Listeria*, *Salmonella*), sur un nombre d''unités permettant une conclusion statistique.


    **J+3 — Recensement des autres destinations** issues de la même production. C''est la seule branche
    du dossier qui ne se répare pas avec de l''argent. Si les analyses J+2 sortent hors seuil, blocage
    et information client immédiats, quelles qu''en soient les conséquences commerciales.


    **J+5 — Avis technique écrit** sur la causalité entre 2 h 40 non réfrigérées et 4,2 × 10⁵ UFC/g.


    **J+7 — Position complète et proposition transactionnelle chiffrée** au dépôt, appuyée sur les analyses.
    Notre défaillance est réelle ; l''objectif raisonnable est une prise en charge partagée et documentée,
    pas une victoire totale.


    **Correctif d''exploitation, sous 48 h, indépendant de l''issue :** le départ de quai est verrouillé
    — aucun chargement n''est déclaré terminé sans groupe froid en marche et enregistreur sous tension,
    contrôle tracé. L''heure de départ portée aux documents devient l''horodatage automatique du portique,
    plus une mention manuscrite. C''est ce que le dépôt et l''assureur attendent de voir, et c''est ce
    qui empêche le prochain lot.


    ---


    ## V. Ce qui renverserait cette position


    Deux observations, à surveiller nommément :


    - **Échantillons témoins ≥ 10⁵ UFC/g.** La cause n''est plus le transport mais la production. Nous
    cessons alors de contester la destruction, la question se déplace vers les autres lots et vers une
    autre garantie. C''est le déclencheur du blocage prévu à J+3.

    - **Le dépôt produit un relevé de température à réception montrant un produit ≤ 4 °C à 12 h 55.**
    Notre rupture cesse d''expliquer le résultat microbiologique, et la charge se déplace vers leurs conditions
    de stockage.


    **Pire cas si nous nous trompons de posture :** transmettre la pièce 2 sans signaler sa fausseté fait
    porter à l''entreprise seule les 21 400 €, majorés de la perte du compte Sodimarché, avec l''assureur
    hors jeu. Les 34 salariés encaissent une faute d''écriture évitable. C''est pour cela que la contradiction
    pièce 2 / pièce 3 est la première chose écrite dans la déclaration, pas la dernière.


    ---


    **Première action, maintenant :** établir la date de réception de la réclamation et sécuriser les
    échantillons témoins. Tout le reste en dépend.


    Si vous voulez, je rédige le courrier J+0 au dépôt et la note de déclaration à l''assureur, prêts
    à envoyer.

    '
