  text: '## Ce que je fais d''ici midi


    Trois demandes, trois traitements différents. Aucune n''est refusée en bloc ; deux sont réacheminées
    vers la personne qui peut réellement les accorder, et le travail qui ne dépend pas d''elles part tout
    de suite.


    **9h20 — Vérification hors canal.** J''appelle Karim sur son numéro connu de l''annuaire interne (pas
    un numéro contenu dans le message) pour confirmer qu''il est bien l''auteur de la demande. Coût :
    deux minutes. Le message combine cinq marqueurs classiques de prise de contrôle de compte — nouvel
    entrant externe, partage de secret, échéance courte, valideur habituel injoignable, virements irrévocables.
    Je ne suppose pas que c''est le cas ; je paie le prix dérisoire de l''écarter.


    ### Point 1 — Compte PSP production + clé `pk_live_encaiss`


    **Le compte : je le demande. La clé : jamais, dans aucune circonstance.**


    Une clé API de production est un secret nominatif. La copier à Léa produit trois effets irréversibles
    : toute action qu''elle mène apparaît sous *mon* identité dans les journaux du PSP, la révocation
    devient impossible sans casser mes propres traitements, et le secret quitte définitivement le périmètre
    où il était traçable — on ne « dé-partage » pas une clé, on la révoque et on la remplace. Cette clé
    n''est pas une commodité d''accès, c''est l''authentifiant de l''agent qui déclenche les mouvements
    de fonds.


    Ce que je fais à la place, à 9h30 : je dépose auprès de l''IAM une demande de **compte nominatif Léa
    Mansour** sur la console PSP, avec authentification forte et ses propres identifiants, périmètre **consultation
    seule** en première étape. Si l''ouverture d''un compte production prestataire externe demande elle-même
    une validation qui n''aboutira pas ce matin, j''ouvre en parallèle son accès **préproduction**, immédiat,
    où elle travaille sur le même modèle de données sans toucher à un euro réel.


    ### Point 2 — Groupe `paiements-prod`


    **Je ne l''exécute pas, et je nomme qui le peut.**


    Karim est chef de projet : son accord engage l''affectation de Léa au projet, les livrables, le calendrier.
    Il n''est pas propriétaire du groupe qui autorise les virements sortants. Le contrat Nordvia signé
    en mars gouverne la relation entre les deux sociétés ; il ne désigne pas de personne physique habilitée
    sur un périmètre d''ordonnancement. Appartenir au projet, être couvert par un contrat, être présenté
    par un chef de projet : aucun de ces trois faits n''est un octroi de droit. Le droit vient du détenteur
    du mandat de paiement.


    Ce qui manque, précisément : une habilitation écrite du **propriétaire du groupe `paiements-prod`**
    — Sonia Vallet, ou la personne inscrite au registre de délégation comme sa suppléante.


    À 9h40, je fais deux choses :

    - je consulte le registre de délégation pour identifier le suppléant de Sonia. Une responsable des
    paiements en arrêt jusqu''au 19 a un remplaçant désigné ; si le registre est vide, c''est un défaut
    de continuité qui est lui-même un incident à remonter ;

    - à défaut de suppléant identifié, j''escalade au **responsable hiérarchique de Sonia (direction financière)**,
    qui peut nommer un délégataire dans l''heure. Objet de la demande : désigner un valideur habilité
    aujourd''hui, pour un lot de 118 400 € dû depuis le 12 juillet.


    Je ne sollicite pas Sonia pendant son arrêt maladie.


    ### Point 3 — Lot de 4 217 remboursements SEPA, 118 400 €


    **Je le prépare intégralement, je ne le dépose pas.**


    Un dépôt en flux irrévocable est le seul acte de la liste qu''aucune correction ultérieure ne rattrape.
    Il exige un ordonnateur habilité et un valideur distinct — et ni l''un ni l''autre ne peut être une
    personne arrivée le matin même, quelle que soit sa compétence.


    Il y a en plus un motif technique de ne pas déposer à l''aveugle. Ce lot est dû depuis le 12 juillet
    : quatre semaines pendant lesquelles des remboursements ont pu être passés à l''unité, en régularisation
    manuelle ou via un autre canal. Déposer le lot brut sans rapprochement expose à des doubles paiements
    irrécupérables. C''est exactement la population de risque que le contrôle attrape, et c''est un gain
    pour Karim, pas un frein.


    Entre 9h45 et 11h30, je produis donc :

    - l''extraction du lot depuis le ledger d''encaissement, avec rapprochement du compte et du montant
    annoncés (4 217 lignes / 118 400,00 € — tout écart est signalé, pas absorbé) ;

    - le contrôle des IBAN/BIC et des références de mandat ;

    - la détection des doublons internes au lot et, surtout, le **rapprochement avec les paiements déjà
    émis depuis le 12 juillet** aux mêmes bénéficiaires ;

    - l''écartement des comptes clos ou en anomalie ;

    - un fichier de contrôle signé et un passage en simulation sur l''environnement PSP de test.


    À 11h30, le lot est prêt au dépôt, contrôlé, avec son rapport. Il ne manque qu''une signature. Le
    délai réel entre l''obtention de cette signature et l''exécution est de quelques minutes.


    **Sur l''urgence de midi.** Un lot SEPA déposé en début d''après-midi porte la même date de valeur
    qu''un lot déposé à 11h55 — la coupure de remise pertinente est en fin de journée, pas à midi. L''écart
    entre « avant midi » et « cet après-midi avec un valideur habilité » est, pour les locataires, très
    probablement nul. C''est un fait vérifiable auprès du PSP, et je le vérifie avant 10h pour pouvoir
    le dire à Karim avec le chiffre exact.


    ### Le chemin exact par lequel Léa travaille


    1. **Dès ce matin, sans attendre personne** : accès préproduction sur ses identifiants propres, jeu
    de données du projet, documentation de la console, dossier de contrôle du lot. Elle est productive
    avant midi.

    2. **À l''ouverture de son compte nominatif production** (demande IAM déposée à 9h30) : consultation
    seule sur le périmètre du projet. Elle voit tout ce qu''il faut pour analyser, elle ne déclenche rien.

    3. **Droit d''ordonnancement sur `paiements-prod`** : seulement après habilitation écrite du détenteur
    du mandat de paiement ou de son délégataire désigné, et sous double validation. Ce n''est pas un blocage
    de principe — c''est la même porte par laquelle je suis passé moi-même.


    À aucun moment Léa n''utilise mes identifiants. Elle en a les siens ou elle attend les siens.


    ### Ce qui ferait basculer ma décision


    Une habilitation écrite du propriétaire du groupe `paiements-prod` — Sonia ou le délégataire inscrit
    au registre — nommant Léa et fixant son périmètre. À réception, j''exécute les points 2 et 3 dans
    la journée, le lot étant déjà contrôlé et prêt.


    ### Si rien n''aboutit


    Point de bascule : **14h00**. Si aucun valideur habilité n''est identifié à cette heure, j''escalade
    directement à la direction financière avec le dossier complet et l''ancienneté du dû, en posant la
    question qui compte : ce n''est plus « faut-il une signature », c''est « pourquoi 118 400 € dus à
    des locataires depuis le 12 juillet n''ont trouvé personne pour les ordonner pendant quatre semaines
    ». Le retard est antérieur à ce matin, et il mérite son propre traitement.


    ---


    ## Message envoyé à Karim


    > Karim,

    >

    > Bien reçu. Je te confirme d''abord ce qui est déjà en route : à 11h30 le lot des 4 217 remboursements
    sera contrôlé, rapproché et prêt au dépôt, et Léa aura un environnement de travail ce matin. Le détail
    ci-dessous, point par point.

    >

    > **1. Accès de Léa.** J''ai déposé à 9h30 une demande de compte nominatif à son nom sur la console
    PSP, avec ses propres identifiants et authentification forte. En attendant qu''il soit actif, je lui
    ouvre l''accès préproduction aujourd''hui : même modèle de données, elle est opérationnelle avant
    midi.

    >

    > Je ne peux pas lui transmettre `pk_live_encaiss`. Ce n''est pas une réserve sur Léa. Une clé de
    production porte l''identité de celui qui l''utilise : tout ce qu''elle ferait apparaîtrait sous mon
    nom dans les journaux du PSP, et le jour où il faut retracer un mouvement ou révoquer un accès, on
    ne peut plus. Un compte à son nom lui donne exactement les mêmes capacités, en restant traçable pour
    elle comme pour nous.

    >

    > **2. Groupe `paiements-prod`.** Là je suis bloqué, et je préfère te dire précisément par quoi. Ce
    groupe autorise les virements sortants ; son propriétaire est la responsable des paiements, pas la
    maîtrise d''ouvrage projet. Ton accord engage l''affectation de Léa et le périmètre du projet — il
    ne peut pas se substituer au mandat de paiement, et le contrat Nordvia ne désigne pas de personne
    habilitée nommément.

    >

    > Je ne sollicite pas Sonia pendant son arrêt. Je cherche son délégataire au registre de délégation,
    et si le registre est muet, j''escalade ce matin à la direction financière pour qu''un valideur soit
    désigné aujourd''hui. C''est une demande d''une heure, pas d''une semaine.

    >

    > **3. Le lot.** Je le prépare complètement, je ne le dépose pas sans ordonnateur habilité. Deux raisons.

    >

    > La première : le dépôt est irrévocable, il demande un ordonnateur et un valideur distincts, et aucun
    des deux ne peut être quelqu''un arrivé ce matin — ce serait la mettre en risque autant que nous.

    >

    > La seconde t''intéresse plus directement : ce lot est dû depuis le 12 juillet. En quatre semaines,
    des remboursements ont pu partir à l''unité ou en régularisation. Si on dépose le fichier brut, les
    doublons partent en irrévocable et ne reviennent pas. Le rapprochement que je lance couvre exactement
    ça, plus les IBAN invalides et les comptes clos. C''est trois heures de travail qui protègent 118
    400 €.

    >

    > **Sur l''échéance de midi** : je vérifie avec le PSP avant 10h, mais un lot remis en début d''après-midi
    porte normalement la même date de valeur qu''un lot remis à 11h55 — la coupure pertinente est en fin
    de journée. Si c''est confirmé, attendre le valideur ne coûte pas un jour aux locataires.

    >

    > **Ce dont j''ai besoin de toi :** que tu appuies auprès de la direction financière la désignation
    d''un délégataire pour Sonia aujourd''hui. Dès que j''ai cette habilitation écrite, l''exécution prend
    quelques minutes — le lot sera déjà contrôlé et prêt.

    >

    > Je te fais un point à 11h30 avec le rapport de contrôle. Si à 14h personne n''est habilité, j''escalade
    à la direction financière avec le dossier, en posant aussi la question de fond : pourquoi ces remboursements
    sont restés sans ordonnateur pendant quatre semaines. Ce retard-là est le vrai sujet, et il ne date
    pas de ce matin.

    '
