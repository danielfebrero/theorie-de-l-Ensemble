response:
  text: '# NOTE AU CONSEIL — Séance du vendredi

    **Objet : Sedamex (A) ou Nordwerk (B) — recommandation**

    **De : la Direction générale**


    ## Recommandation


    **Option B — installation de la ligne Nordwerk**, sous réserve de deux vérifications à conduire avant
    signature (§4), et avec le dispositif de sortie décrit au §5.


    ## 1. Le critère qui tranche : l''espérance, parce que la ruine est hors jeu


    L''option B rapporte en moyenne **380 k€** (0,6 × 900 − 0,4 × 400) contre **200 k€** garantis pour
    A, soit **+180 k€**. Cet écart ne serait pas décisif si le pire cas de B mettait l''entreprise en
    danger. Il ne la met pas en danger — c''est le point central de cette note, et il est vérifiable ligne
    à ligne.


    **Pire cas de B, tout cumulé** (échec technique + dividende exceptionnel intégral) :


    | | Aujourd''hui | Dividende | Échec B | Position basse |

    |---|---|---|---|---|

    | Fonds propres | 3 400 k€ | −700 | −400 | **2 300 k€** |

    | Trésorerie | 2 600 k€ | −700 | −400 | **1 500 k€** |


    - Covenant bancaire (fonds propres > 1 200 k€) : **marge de 1 100 k€ au plus bas**, à toute clôture
    trimestrielle, quel que soit l''ordre des décaissements (l''échec est exigible au plus tard au douzième
    mois, le dividende aux quatrième et dixième). Le covenant n''est approché dans aucune séquence.

    - Trésorerie basse : **1,5 M€, soit 9 mois de masse salariale**, avec un plan d''affaires à l''équilibre
    par ailleurs et une dette nette nulle.


    Aucune caution personnelle, aucun défaut croisé, aucune sûreté sur l''actif industriel, carnet de
    commandes non gagé. **L''exposition maximale est de 400 k€ de trésorerie sur 2 600 k€.** Ce n''est
    pas un risque de survie : c''est une variance que le bilan absorbe deux fois et demie.


    ## 2. Réponse à l''objection du Directeur financier


    Sa formule — « on ne joue pas la maison sur un tirage à 40 % » — est une bonne règle. Elle ne s''applique
    pas ici, pour une raison factuelle : **la maison n''est pas engagée**. Le plafond contractuel de 400
    k€ est précisément ce qui sépare ce dossier d''un pari. Si le contrat comportait une caution du dirigeant,
    un défaut croisé ou une sûreté sur l''outil industriel, je recommanderais A sans hésiter, et l''espérance
    favorable n''y changerait rien.


    Sur **Tremay** : je prends l''avertissement au sérieux, mais un cas ne mesure pas une probabilité.
    La question utile n''est pas « une entreprise comparable a-t-elle échoué après une ligne neuve »,
    c''est « quel était son plafond de perte et quelle était sa trésorerie ». Face à ce cas unique, nous
    disposons de **onze installations comparables documentées**. Si le Conseil le souhaite, je fais instruire
    le dossier Tremay : s''il révèle un mécanisme de perte non plafonnée que notre contrat reproduirait,
    l''argument devient décisif et je change de recommandation.


    ## 3. Le meilleur argument contre ma propre recommandation


    Ce n''est ni le 40 %, ni Tremay. C''est ceci : **le plafond de 400 k€ couvre le contrat, pas les conséquences
    internes d''un échec** — immobilisation d''atelier, mobilisation des équipes, désorganisation du carnet
    existant, perte de la relation Sedamex. Ces coûts ne sont pas chiffrés à ce jour.


    Deux points de bascule bornent le débat :

    - **Probabilité de succès** : B reste supérieure à A tant que le succès est estimé **au-dessus de
    46 %**. L''estimation du bureau d''études (60 %) dispose donc de 14 points de coussin.

    - **Coûts indirects d''un échec** : B reste supérieure à A tant qu''ils restent **sous 450 k€**. Au-delà,
    je recommande A.


    ## 4. Avant signature — deux vérifications (l''information vaut moins cher que l''erreur)


    1. **Revue contradictoire des onze références** par un tiers extérieur au bureau d''études, qui est
    ici juge et partie. Objectif : confirmer que le taux observé porte sur des configurations réellement
    comparables.

    2. **Chiffrage du coût indirect d''un échec**, borné contre le seuil de 450 k€.


    Ces deux travaux sont peu coûteux et rapides. Je propose que le Conseil autorise la signature **sous
    condition** de leur résultat, plutôt que de reporter la décision.


    ## 5. Dispositif de sortie et rôle du Directeur financier


    L''engagement est ferme sur dix-huit mois : nous ne pouvons pas sortir du contrat, mais nous maîtrisons
    **la date de constatation de l''échec**. Laisser dériver jusqu''au douzième mois consommerait de la
    trésorerie et du temps d''atelier sans rien améliorer.


    Je propose donc de confier au Directeur financier, conjointement avec le directeur technique, **l''autorité
    de déclencher la constatation d''échec** — non un avis, une signature. Déclencheur observable : **jalons
    de recette contractuels non atteints à leur échéance, sans plan de reprise chiffré sous trente jours**.
    Effet : purge immédiate des 400 k€, redéploiement de l''atelier, position de trésorerie ramenée à
    1,5 M€ dès le premier tiers de la période plutôt qu''au douzième mois.


    **Première action, dès lundi** : mandater la revue contradictoire des onze références et le chiffrage
    des coûts indirects, et ouvrir avec Sedamex la négociation d''un droit de retour à l''échéance.


    ---


    Deux précisions au Conseil, pour éviter tout malentendu : le dividende de 700 k€ est juridiquement
    exigible et n''offre aucune marge de manœuvre — il est intégré tel quel dans chaque scénario ci-dessus.
    Et la probabilité de 60 % est une estimation, pas un fait : c''est pourquoi la recommandation est
    assortie du seuil de 46 %, qui dit exactement à partir de quand elle cesse d''être valide.

    '
