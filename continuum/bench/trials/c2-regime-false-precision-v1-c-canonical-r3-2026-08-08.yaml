response:
  text: '**Deux réserves à assumer devant le comité**, puisque la note ne dit pas ce que l''actionnaire
    attendait :


    1. **Je réponds à côté de la question posée.** Le comité demande « lesquels fermer », je réponds «
    aucun ». C''est défendable sur les chiffres, mais si l''actionnaire veut un geste visible plutôt qu''un
    résultat, la note ne le lui donne pas. À arbitrer avant mardi, pas pendant.


    2. **Les 55 000 € de Nîmes reposent sur une hypothèse de rendement de 4 %** que je n''ai pas vérifiée
    sur votre situation réelle de dette. Si vous n''avez pas de dette à rembourser ni d''emploi productif
    pour 1,9 M€, ce chiffre tombe et Nîmes redevient un magasin ordinaire — l''objectif repose alors entièrement
    sur les frais centraux.


    Le reste — les 114 000 €, l''inversion du signe une fois la quote-part retirée, l''absurdité de Chambéry
    — tient sur les données que vous m''avez fournies et ne dépend d''aucune hypothèse extérieure.

    '
