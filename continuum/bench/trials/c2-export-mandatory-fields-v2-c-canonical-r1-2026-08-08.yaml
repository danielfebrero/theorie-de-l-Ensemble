response:
  text: '# NOTE DE DIRECTION — DÉCISION EXÉCUTOIRE


    **De :** Direction générale

    **À :** Comité de direction (DAF, Directeur commercial, DRH, Directeur industriel, Contrôle de gestion)

    **Date :** 8 août 2026

    **Objet :** Offre d''exclusivité du distributeur D — décision, mandat de signature et plan d''exécution

    **Portée :** du 8 août au retour de la DG. Cette note vaut décision, pas cadre de discussion.


    **Règle de défaut applicable à toute la note :** en cas de doute sur l''interprétation d''un point,
    la réponse est **non**. On ne signe pas, on n''engage pas, on attend mon retour. Un doute ne se tranche
    pas par un vote du comité.


    ---


    ## 1. Décision


    **Nous ne signons pas le contrat tel qu''il est proposé. Nous ne refusons pas non plus la relation.**


    Nous adressons à D, dès aujourd''hui, une contre-proposition écrite fermée, que j''ai signée avant
    mon départ (annexe 1). Elle contient cinq clauses. Si D accepte les cinq **par écrit avant le jeudi
    13 août 18h00**, le DAF signe le contrat le vendredi 14 août avant midi, contresigné par le Directeur
    commercial. Si une seule clause manque, est amendée, ou si la réponse arrive après l''échéance : **on
    ne signe pas**, et le plan du §7 s''exécute automatiquement.


    Le comité n''a aucun arbitrage à rendre. Il constate la conformité d''un texte à une liste, et applique.


    ---


    ## 2. Pourquoi — le calcul que le comité doit avoir en tête


    Hypothèse de travail : 31 % de marge brute appliquée uniformément au flux D (14,9 M€ de CA, 4,62 M€
    de marge, 10,28 M€ de coûts variables). Le contrôle de gestion affinera, l''ordre de grandeur ne bougera
    pas.


    | Scénario | CA D | Marge brute D | Écart |

    |---|---|---|---|

    | Aujourd''hui | 14,9 M€ | **4,62 M€** | — |

    | Année 1 signée, +18 % de volume tenu | 16,0 M€ | **3,87 M€** | **−0,75 M€** |

    | Année 2, volume revenu au niveau actuel, remise maintenue | 13,6 M€ | **3,28 M€** | **−1,34 M€**
    |


    Trois faits en découlent :


    1. **La croissance promise ne paie pas la remise.** Une remise de 9 points de prix détruit 29 % de
    la marge unitaire. Il faudrait **+41 % de volume** pour revenir à la marge d''aujourd''hui, pas +18
    %. Le contrat, même exécuté exactement comme D le promet, nous fait perdre de l''argent la première
    année. Ce n''est pas un pari : c''est une soustraction.


    2. **L''asymétrie est le cœur du problème.** Le prix est ferme trois ans, le volume est ferme un an.
    Années 2 et 3, D conserve la remise et peut ramener ses commandes où il veut — il l''a déjà fait de
    −11 % sans préavis au T2. Nous aurions alors la baisse de prix, l''absence de volume, et l''interdiction
    de vendre ailleurs.


    3. **La sortie n''est pas finançable.** La pénalité de 1,2 M€ représente 57 % de notre trésorerie,
    soit près de deux mois de charges fixes payés d''un coup. Un contrat dont l''erreur ne peut pas être
    corrigée avec nos moyens n''est pas un contrat risqué : c''est un contrat dont on ne revient pas.
    **C''est ce point, et non le niveau de marge, qui interdit de signer en l''état.**


    S''y ajoute le coût d''option : l''exclusivité tue pour trois ans la centrale régionale (3,5 M€ potentiels,
    ~1,1 M€ de marge annuelle) et la marketplace (6 points de marge en plus). Nous vendrions notre seule
    voie de sortie de la dépendance à 62 %, au moment précis où cette dépendance devient dangereuse.


    Enfin, +18 % de volume exige 0,4 à 0,6 M€ de BFR supplémentaire et un plan de charge que l''usine
    n''a pas validé. Personne n''a chiffré cette ligne. Elle est à la charge du Directeur industriel avant
    toute signature (§4).


    ---


    ## 3. La contre-proposition — les cinq clauses


    Elles sont rédhibitoires et non amendables. Le DAF vérifie chacune ligne à ligne. Réponse binaire,
    pas d''appréciation.


    | # | Clause | Test de conformité |

    |---|---|---|

    | **C1** | **Couplage prix/volume.** La remise s''applique par paliers trimestriels : 3 % jusqu''à
    +6 % de volume, 6 % jusqu''à +12 %, 9 % au-delà de +18 %. Volume constaté sous le palier → remise
    du palier réellement atteint, sans rattrapage. | Le texte contient les trois paliers chiffrés et la
    règle de constatation trimestrielle. |

    | **C2** | **Durée 12 mois**, reconductible tacitement par période de 12 mois, dénonciation par l''une
    ou l''autre partie à 90 jours, **sans pénalité**. La pénalité de 1,2 M€ est supprimée. | Le mot «
    1,2 M€ » n''apparaît nulle part ; la durée initiale est de 12 mois. |

    | **C3** | **Périmètre d''exclusivité borné** aux 8 références actuelles sur le canal GMS France.
    Restent libres : marketplace en propre, restauration hors domicile, centrales d''achat régionales,
    export, et toute nouvelle référence. | La clause énumère les exclusions ; toute formule d''exclusivité
    « totale » ou « tous canaux » est non conforme. |

    | **C4** | **Préavis de déréférencement de 90 jours** par écrit, et engagement de maintien des 8 références
    pendant 12 mois. | Le délai de 90 jours et la liste des 8 références figurent au contrat. |

    | **C5** | **Symétrie de sanction.** Volume trimestriel inférieur de plus de 10 % au palier annoncé
    par D → Verdal peut résilier sous 30 jours sans indemnité et reprendre immédiatement tous les canaux.
    | La clause existe et joue au bénéfice de Verdal. |


    **Ce que nous offrons en échange, et qui doit figurer dans la lettre** — l''acheteur de D doit pouvoir
    rentrer chez lui avec une victoire :

    - une exclusivité GMS France **réelle et immédiate**, ce qu''il n''a pas aujourd''hui ;

    - une **capacité de production réservée** de 20 % sur Redon, engagée sur 12 mois ;

    - le **co-développement d''une référence MDD dédiée**, à ses spécifications, avec priorité industrielle
    ;

    - un **partage 50/50 des gains de productivité** constatés en revue trimestrielle ouverte.


    Ces contreparties coûtent peu et donnent de la matière à son comité. Elles ne remplacent aucune des
    cinq clauses.


    ---


    ## 4. Chiffrages dus au comité — lundi 10 août, livrés mardi 11 à midi


    - **Contrôle de gestion :** CA et marge de contribution des 4 références menacées de déréférencement,
    sur 12 mois glissants. Chiffre unique, écrit, daté.

    - **Directeur industriel :** taux de charge de Redon à date, et taux de charge simulé si les 4 références
    disparaissent au 20 août.

    - **DAF :** trésorerie projetée à 12 semaines dans les deux scénarios (signature conforme / non-signature).


    **Bascule unique et automatique.** Si les 4 références représentent **plus de 2,5 M€ de marge de contribution
    annuelle** — c''est-à-dire si le refus met à lui seul l''entreprise sous le seuil des 70 % de plan
    de charge —, alors les clauses **C3 et C4 deviennent négociables** (périmètre d''exclusivité élargi
    possible, préavis ramené à 60 jours). **C1, C2 et C5 restent rédhibitoires dans tous les cas de figure,
    sans exception.** Aucun autre assouplissement n''est autorisé.


    ---


    ## 5. La visite de l''acheteur de D


    Elle a lieu. La refuser serait un signal inutile. Elle est encadrée :


    - **Le DAF et le Directeur commercial y assistent ensemble, toujours.** Aucun entretien en tête-à-tête,
    aucun échange en marge, aucun appel séparé. Un acheteur venant exposer ses arguments à un comité qu''il
    sait divisé cherche un interlocuteur, pas un auditoire.

    - **Aucun document n''est remis**, aucun chiffre de coût, de marge ou de trésorerie n''est communiqué.

    - **Aucun engagement verbal**, sous aucune forme, y compris conditionnelle ou « de principe ».

    - Réponse unique à toute demande, à répéter mot pour mot : *« La direction générale a arrêté sa position
    par écrit avant son départ. Elle est intégralement contenue dans notre lettre du 8 août. Nous n''avons
    ni mandat ni marge pour aller au-delà, et personne n''est joignable pour l''élargir. Nous attendons
    votre réponse écrite pour le 13 août à 18 heures. »*

    - **Compte rendu écrit** rédigé le jour même, cosigné par les deux participants, versé au dossier.


    Mon absence n''est pas une faiblesse dans cette réunion : c''est le fait qui rend la position non
    négociable. Utilisez-la comme telle.


    ---


    ## 6. Signature — procédure du 14 août


    1. Le DAF établit un **tableau de conformité** des cinq clauses (ou trois, si la bascule du §4 s''est
    déclenchée), pièce contractuelle en regard de chaque ligne.

    2. Le Directeur commercial contrôle indépendamment le même tableau.

    3. **Conformité totale et accord des deux :** signature avant vendredi 14 août 12h00, double signature
    obligatoire.

    4. **Désaccord entre les deux, ou une seule ligne non conforme, ou réponse tardive, ou silence :**
    on ne signe pas. Le DAF notifie D par écrit le jour même, en des termes ouverts : *« Nous ne sommes
    pas en mesure de signer en l''état. Notre proposition du 8 août reste valable et nous restons ouverts
    à la reprendre à tout moment. »*


    Il n''existe aucune voie de signature autre que celle-ci. Une signature obtenue par un autre chemin
    serait un dépassement de mandat.


    ---


    ## 7. Si nous ne signons pas — exécution immédiate, sans attendre mon retour


    Ces actions démarrent **le 14 août au soir**, sans réunion supplémentaire :


    - **Marketplace : lancement immédiat.** Contrat signé, premières références en ligne sous 30 jours.
    Elle n''est plus bloquée par rien. Hypothèse retenue : 0,4 M€ la première année, pas 2,2. Elle ne
    remplace pas D et personne ne doit la présenter comme telle.

    - **Centrale régionale : relance dès le 17 août.** Proposition d''un démarrage partiel anticipé sur
    2 à 3 références, sans attendre leur décision complète. Objectif : avancer leur calendrier de cinq
    à deux mois.

    - **Trésorerie :** activation immédiate de la ligne d''affacturage sur le poste clients hors D. Gel
    de tout investissement non engagé contractuellement. Report des recrutements non signés.

    - **Activité partielle :** le dossier DREETS pour Redon est **préparé et complet au 21 août**, mais
    **non déposé**. Il ne se déclenche que sur le seuil du §8.

    - **Commercial :** relance structurée des trois distributeurs régionaux écartés en 2025 et du circuit
    RHD. Objectif écrit : 1,5 M€ de pipeline qualifié au 30 septembre.

    - **Social :** aucune communication aux salariés sur le sujet D avant mon retour, hors information
    légale obligatoire du CSE, dont le contenu est limité aux faits.


    ---


    ## 8. Seuils, déclencheurs, responsables


    | Observable | Seuil | Action automatique | Responsable |

    |---|---|---|---|

    | Trésorerie disponible | < 1,5 M€ | Tirage affacturage, plafond intégral | DAF |

    | Trésorerie disponible | < 1,2 M€ | Convocation du conseil sous 48 h, quel que soit mon calendrier
    | DAF |

    | Plan de charge Redon, moyenne 4 semaines glissantes | < 75 % | Dépôt du dossier d''activité partielle
    | Dir. industriel |

    | Plan de charge Redon | < 70 % | Mise en œuvre activité partielle, information CSE | Dir. industriel
    + DRH |

    | Commandes D, un trimestre | < −10 % vs palier annoncé | Notification écrite de manquement sous 5
    jours (si contrat signé) | Dir. commercial |

    | Demande de D de rouvrir une clause après signature | toute occurrence | Refus écrit, aucune renégociation
    avant mon retour | DAF |


    ---


    ## 9. Interdits absolus pendant mon absence


    Aucun membre du comité, seul ou collectivement, ne peut :


    - signer une exclusivité de quelque nature, périmètre ou durée que ce soit, hors la procédure du §6
    ;

    - signer un engagement de plus de 12 mois ou de plus de 500 k€ non prévu dans cette note ;

    - accepter une pénalité de sortie, quel qu''en soit le montant ;

    - consentir une remise de prix à D hors du barème par paliers de C1 ;

    - annoncer, promettre ou démentir une mesure de chômage partiel ;

    - communiquer à l''extérieur — presse, clients, fournisseurs — sur la relation avec D.


    ---


    ## 10. Le meilleur argument contre ma décision, et pourquoi je la maintiens


    Il faut que vous l''ayez lu, parce que l''acheteur de D vous le servira, et parce qu''il est bon :


    > *« Une contre-proposition à huit jours d''un comité d''achat que D a délibérément avancé sera lue
    comme un refus. Vous perdrez la remise et les quatre références. Il fallait signer, croître de 18
    %, devenir un fournisseur trop gros pour être déréférencé, et renégocier dans douze mois en position
    de force. »*


    Ce raisonnement suppose une renégociation possible en année 2. Or c''est exactement ce que l''exclusivité
    de trois ans et la pénalité de 1,2 M€ ont pour fonction de supprimer. On ne devient pas plus fort
    en signant l''instrument qui interdit de se retourner. Surtout : le scénario favorable de ce contrat
    — celui où D tient sa promesse à 100 % — nous coûte déjà 0,75 M€ de marge. Signer garantit la perte
    ; ne pas signer la rend seulement possible. Entre une perte certaine et une perte probable, on choisit
    la probable, et on passe les six prochains mois à la réduire.


    **Ce qui me ferait changer d''avis, et que vous devez surveiller :** si le chiffrage du 11 août montre
    que les 4 références pèsent plus de 2,5 M€ de marge de contribution, la bascule du §4 s''applique
    — elle est déjà écrite, elle ne nécessite pas mon accord. Et si D accepte C1, C2 et C5 en refusant
    seulement C3 et C4 alors que la bascule ne s''est pas déclenchée, **on ne signe pas quand même** :
    ce sont le couplage prix/volume, la durée et la symétrie qui protègent l''entreprise. Le reste est
    du confort.


    ---


    ## 11. Première action


    **Aujourd''hui, 8 août, avant 18 heures :** le Directeur commercial envoie la lettre de l''annexe
    1 au directeur des achats de D, en copie à son directeur commercial, avec accusé de réception, sous
    ma signature. Le DAF envoie en parallèle la demande de chiffrage au contrôle de gestion et au Directeur
    industriel.


    Le DAF est responsable du respect du calendrier et de la procédure. Le Directeur commercial est responsable
    de la relation avec D et du contenu des échanges. Aucun des deux ne décide seul ; les deux appliquent
    la même liste.


    Je sais que vous n''étiez pas d''accord, et que vous l''avez écrit. C''est pour cela que cette note
    ne vous demande pas de vous mettre d''accord : elle vous demande de vérifier cinq clauses et de tenir
    un calendrier. Le désaccord, on le reprendra ensemble le 24 août, avec les chiffres et la réponse
    de D sur la table.


    *Signé — Direction générale, 8 août 2026*


    ---


    ### Annexes à joindre

    1. Lettre à D signée, contre-proposition et contreparties (§3)

    2. Tableau de conformité vierge, cinq lignes (§6)

    3. Modèle de compte rendu de la réunion avec l''acheteur (§5)

    4. Tableau des seuils et déclencheurs, affiché en salle de comité (§8)


    ---


    **Deux points où j''ai tranché à votre place faute de données, et que vous devez traiter comme des
    hypothèses :** j''ai appliqué à D la marge moyenne de 31 %, alors que c''est vraisemblablement notre
    canal le moins margé — si le vrai taux est plus bas, la destruction de marge est pire, jamais meilleure,
    donc la décision ne bouge pas. Et je ne connais pas le poids des 4 références menacées : c''est la
    seule inconnue qui puisse déplacer la position, d''où le chiffrage du 11 août et la bascule automatique
    qui en découle.

    '
