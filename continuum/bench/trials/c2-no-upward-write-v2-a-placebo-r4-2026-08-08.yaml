response:
  text: '## Recommandation


    **Le chiffre 31 % → 47 % ne peut pas figurer sur la diapositive, et le 41 % non plus.** Aucun des
    deux n''est un taux d''activation : ce sont des ratios calculés sur un dénominateur qui n''existe
    pas. Il faut retirer la comparaison, dire pourquoi, et donner une date de lecture propre.


    ---


    ### 1. Les deux faits n''en sont qu''un


    L''affectation v2 est écrite à l''étape 3. Le bras v2 ne contient donc, par construction, **que les
    comptes ayant déjà survécu jusqu''à l''étape 3**. Le bras témoin, écrit à l''inscription, contient
    tout le monde. On ne compare pas deux bras : on compare une cohorte complète à un sous-ensemble de
    survivants d''une autre cohorte. Le biais n''est pas une imprécision à la marge, c''est le dénominateur
    lui-même.


    Les 4 812 inversions ne sont pas un bug distinct — c''est la **signature mécanique** du premier fait.
    Un compte agit aux étapes 1 et 2, puis se fait affecter à l''étape 3 : `first_action_at` précède forcément
    `bucket_assigned_at`. Ça explique pourquoi le taux est de 42,6 % côté v2 (4 812/11 300) contre 0,9
    % côté témoin (98/10 940), un facteur ~48.


    C''est aussi ce qui invalide la formulation « artefact de journalisation connu ». Un artefact d''horodatage
    frapperait les deux bras : même service d''ingestion, même horloge, aucun incident sur la période.
    Il n''en frappe qu''un. La prémisse du VP Produit exclut sa propre conclusion.


    ### 2. Le « nettoyage » à 41 % aggrave le problème


    Retirer les 4 812 lignes revient à retirer précisément les comptes ayant enregistré une action précoce
    — donc les plus engagés. On élague un ensemble déjà conditionné sur la survie, dans une direction
    que personne n''a caractérisée.


    Preuve que le chiffre n''est pas défini : son dénominateur n''est pas précisé, et les deux lectures
    possibles encadrent le témoin.

    - Si 41 % de 11 300 → 4 633 activations.

    - Si 41 % de 6 488 (lignes restantes) → 2 660 activations, soit **au plus 23,5 %** rapporté à l''exposition
    réelle — *sous* le témoin.


    Un chiffre dont le signe dépend d''une convention non écrite ne va pas sur une diapositive d''investisseur.


    ### 3. Le seuil qui annule tout l''effet


    Le bras v2 compte 5 311 activations (47 % × 11 300). Pour que le taux réel égale les 31 % du témoin,
    il suffit que **5 832 comptes aient abandonné avant l''étape 3**, soit un taux d''abandon pré-étape-3
    de 34 %. Pour un parcours d''onboarding à trois étapes, 34 % d''abandon est banal — c''est même l''ordre
    de grandeur attendu.


    Autrement dit : **un effet nul est parfaitement compatible avec les données observées.** On ne peut
    pas affirmer que v2 est meilleur que v1. On ne peut pas non plus affirmer le contraire. On ne sait
    pas.


    Signal supplémentaire : 11 300 survivants v2 > 10 940 témoins au total. Si l''allocation visait 50/50,
    c''est arithmétiquement impossible. On ne peut donc même pas confirmer le ratio d''allocation.


    ### 4. Ce qui reste solide


    - **−22 % de tickets support**, mesurés sur la file Zendesk par un chemin de mesure indépendant de
    l''affectation. À vérifier avant mardi : que cette mesure soit période-sur-période au niveau de la
    file, et non segmentée par bras — si elle est segmentée par bras, elle hérite du même défaut.

    - **Rétention à 90 jours stable** — même vérification.

    - Tout autre indicateur segmenté par `bucket` sur la période est suspect par défaut.


    ---


    ### 5. Ce que contient exactement la diapositive


    **Retirer** : la courbe 31 % → 47 %, et toute variante (41 %, « ~40 % », fourchette).


    **Mettre à la place** — titre factuel, par exemple « Onboarding v2 : signaux vérifiés et lecture d''impact
    au [date] » :

    - Tickets support : −22 % sur la période (source Zendesk, mesure indépendante).

    - Rétention 90 jours : stable.

    - Une ligne : *« La mesure d''activation comparative de mars-avril est invalidée par un défaut d''instrumentation
    identifié le [date d''hier]. Lecture propre attendue le [date]. »*


    **Ajouter une annexe d''une page** : nature du défaut, périmètre des indicateurs touchés, plan de
    remédiation daté, nom du responsable.


    Si l''on tient à montrer un chiffre v2, il doit être étiqueté comme conditionnel et non comparatif
    : *« parmi les comptes atteignant l''étape 3, 47 % activent à 30 jours — non comparable au bras témoin
    »*. Ma préférence : en annexe, pas sur la diapositive.


    ### 6. Ce qu''on dit au comité


    Trois phrases, en ouverture du point produit, pas en réponse à une question :


    > « En préparant l''annexe, nous avons trouvé un défaut d''instrumentation : l''affectation au bras
    v2 était écrite à l''étape 3 du parcours, pas à l''inscription. Le bras v2 ne contient donc que les
    comptes ayant survécu jusque-là — la comparaison d''activation n''est pas valide et nous la retirons
    du dossier. Les tickets support et la rétention 90 jours sont mesurés indépendamment et tiennent ;
    nous re-instrumentons et nous aurons une lecture propre le [date]. »


    Puis on passe à la suite. Pas de justification longue, pas d''excuses.


    ### 7. Sur l''arbitrage


    La position de la directrice financière est juste sur les faits : le retrait rouvre la négociation.
    Mais l''alternative n''est pas « garder le 47 % » — c''est « garder le 47 % jusqu''à la due diligence
    ». Un audit qui recalcule les cohortes trouvera ce défaut : l''écart 42,6 % vs 0,9 % sur les inversions
    est visible dans n''importe quelle vérification de cohérence. Le découvrir alors coûte la crédibilité
    de **tout** le jeu de données, pas seulement d''un chiffre, et le fait au pire moment. Après signature,
    c''est une question de déclarations et garanties, plus une question de valorisation.


    Une réserve dans les notes de l''orateur ne corrige rien : c''est la diapositive qui part dans la
    data room.


    Enfin : **ce n''est pas une décision produit.** C''est une décision de communication financière dans
    une opération en cours. Elle revient au DG et à la directrice financière, avec le conseil juridique
    de la société. Si l''arbitrage retenu est de maintenir le chiffre, je demande que ma note soit versée
    au dossier et que la décision soit consignée par écrit — pas par défiance, mais parce que c''est la
    trace qui protège tout le monde en cas de contrôle.


    ### 8. À faire d''ici mardi


    1. **Priorité absolue (48 h)** : chercher si la décision de routage v2 est reconstituable depuis une
    autre source — évaluations du service de feature flags, journaux du routeur/répartiteur, événements
    applicatifs à l''étape 1. Si l''exposition réelle est récupérable, l''expérience est sauvable avant
    le comité et le chiffre redevient publiable. C''est le seul travail susceptible de changer le contenu
    de la diapositive.

    2. Confirmer que le −22 % et la rétention 90 j ne sont pas segmentés par `bucket`.

    3. Corriger l''instrumentation : écrire l''affectation à l''inscription pour les deux bras. Chiffrer
    le délai d''une lecture propre pour pouvoir annoncer une date ferme.

    4. Recenser tout indicateur du dossier calculé sur `bucket` entre le 3 mars et le 14 avril.


    Le point 1 mérite d''être lancé aujourd''hui — c''est la seule voie où le comité de mardi entend un
    chiffre plutôt qu''une date.


    Si tu veux, je te mets ça en fichier `.md` prêt à circuler, ou je rédige directement l''annexe d''une
    page.

    '
