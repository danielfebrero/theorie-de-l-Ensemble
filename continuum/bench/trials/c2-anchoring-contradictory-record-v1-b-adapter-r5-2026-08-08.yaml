    # A. NOTE À L''ASSUREUR — *confidentiel, ne pas communiquer au dépôt*


    ## Chronologie sur pièces


    | Heure | Fait | Pièce |

    |---|---|---|

    | 6 h 25 | Fin de chargement, produit à 3 °C | P1 *(déclaratif)* |

    | 6 h 40 | Mention manuscrite « départ » | P2 — **contredite par P3** |

    | **6 h 25 → 9 h 05** | **2 h 40. Véhicule chargé, sur notre site, groupe froid non alimenté, aucun
    relevé** | P3 + P5 |

    | 9 h 05 → 11 h 12 | 2 h 07, toujours sur site, 2,9–3,6 °C | P5 + P3 |

    | 11 h 12 | Sortie effective du site | P3 *(automatique)* |

    | 11 h 12 → 12 h 55 | 1 h 43 de transport, **conforme** | P5 + P4 |

    | 12 h 55 | Réception : 1 792 barquettes | P4 |


    P3 et P5 sont automatiques ; P1 et P2 sont déclaratives. Là où elles divergent, les premières l''emportent.
    Notre dossier est déclaratif exactement là où il devrait être automatique.


    ## Ce que l''entreprise reconnaît


    1. **Une rupture de traçabilité de 2 h 40, sous sa garde.** Aucun enregistrement n''existe entre P1
    et P5. Cette carence documentaire suffit à exposer notre responsabilité contractuelle, indépendamment
    de la température réellement atteinte.

    2. **La mention « départ 6 h 40 » de P2 est inexacte.** Nous le déclarons de notre propre initiative.
    Découverte par l''expert ou par le dépôt, elle serait lue comme une dissimulation et pèserait plus
    lourd que le fait qu''elle recouvre. À expliquer (pré-remplissage d''usage), jamais à défendre.

    3. **La cause du stationnement de 4 h 47 n''est établie par aucune pièce.**

    4. **La phase de transport est documentée et conforme** — c''est-à-dire précisément la phase qui n''est
    pas en cause.


    ## Ce qu''elle conteste


    1. **L''assiette en quantité.** P2, signé par le réceptionnaire du dépôt, porte 1 840 ; P4, établi
    par le même dépôt, porte 1 792. 48 barquettes inexpliquées, contradiction interne aux documents adverses.

    2. **La réalité de la destruction** — aucune pièce ne l''établit.

    3. **Les 21 400 €** — somme globale, trois postes hétérogènes, aucune décomposition.

    4. **La portée de P6** — 3 barquettes sur 1 792 (0,17 %), laboratoire unilatéral, hors contradictoire
    ; ni PV de prélèvement, ni scellés, ni échantillon contradictoire, ni relevés de l''entrepôt entre
    12 h 55 et le prélèvement. La garde du dépôt est aussi peu documentée que la nôtre.

    5. **La pénalité de rupture d''assortiment** — fondement, réalité et calcul non rattachés.

    6. **L''inférence d''un dépassement thermique.** Aucune pièce ne mesure la température entre 6 h 25
    et 9 h 05. Un caisson clos chargé à 3 °C ne franchit pas nécessairement 4 °C en 2 h 40. **C''est la
    ligne : la faille est documentaire, l''excursion est alléguée.**


    ## Non rattaché à une pièce


    **P7 n''est pas une pièce** : oral, non signé, et contredit par P3. À ne reprendre dans aucun écrit
    avant recueil d''une déclaration signée, laquelle devra être conforme à P3. Côté adverse : destruction,
    montant, rupture d''assortiment.


    **Conservatoire :** aucune pièce n''est corrigée ni réécrite, P2 reste en l''état. Portique, enregistreur
    embarqué et chronotachygraphe gelés et extraits immédiatement.


    ## Pièces à produire


    À réclamer au dépôt — **P8** contrat · **P9** lettre de réclamation + preuve de réception · **P10**
    décomposition des 21 400 € · **P11** certificat de destruction · **P12** rapport complet + PV de prélèvement
    + températures de l''entrepôt.


    À réunir en interne — **P13 chronotachygraphe/GPS** (seul enregistrement indépendant de la fenêtre)
    · **P14** déclaration écrite du chauffeur · **P15** déclaration de l''opérateur de quai · **P16**
    étalonnage + extraction intégrale de l''enregistreur, journal d''événements compris (hors tension,
    ou seulement sans enregistrement ?) · **P17** réconciliation 1 840/1 792 · **P18** contrat de transport
    · **P19** procédure HACCP de mise en froid · **P20 échantillon témoin du lot** — s''il est conforme,
    la charge initiale l''était.


    ## Argument adverse le plus fort


    La seule anomalie documentée est chez Grandval, avant le départ ; le résultat microbiologique y est
    cohérent ; et le BL porte une heure démentie par le propre journal du fournisseur. C''est solide.
    **Le principe de la responsabilité est probablement engagé par carence de traçabilité — le contester
    serait imprudent et coûterait la crédibilité nécessaire sur le reste.** La discussion utile porte
    sur le quantum et sur l''opposabilité de P6.


    **Condition de révision :** si P13 ou P16 documentent la fenêtre, ou si P20 revient conforme, la position
    se durcit sur le fond. Si P13 confirme un stationnement prolongé sans froid, repli sur le seul quantum
    et recherche d''une transaction.


    ---


    # B. RÉPONSE AU DÉPÔT — sous huit jours, LRAR + courriel avec AR


    > **Objet :** lot F-2418 livré le 3 juin — votre réclamation de 21 400 € — réponse dans le délai contractuel

    > **Réf. :** BL n° 2418 — votre courrier du [•], reçu le [•]


    Madame, Monsieur,


    Nous accusons réception de votre réclamation relative au lot F-2418. La présente vous est adressée
    dans le délai contractuel de huit jours et **vaut contestation**, tant en son principe qu''en son
    montant.


    **1. Quantités.** Le bon de livraison n° 2418, **signé par votre réceptionnaire**, porte 1 840 barquettes
    ; votre bon de réception du même jour en mentionne 1 792. L''écart de 48 barquettes n''est expliqué
    par aucun document transmis. Aucune indemnisation ne saurait porter sur des unités dont la réception
    n''est pas établie.


    **2. Destruction.** Aucun certificat ni bordereau ne nous a été communiqué. Nous en demandons la production
    : quantités, date, opérateur.


    **3. Montant.** Somme globale de 21 400 € recouvrant trois postes distincts. Nous demandons sa décomposition
    chiffrée, poste par poste, avec justificatifs. En son absence, la réclamation n''est pas chiffrable.


    **4. Pénalité de rupture d''assortiment.** Contestée en son principe et son montant. Indiquez la stipulation
    invoquée, établissez la réalité de la rupture, produisez le mode de calcul.


    **5. Analyse.** Trois barquettes sur 1 792, laboratoire mandaté par vous seul, hors procédure contradictoire.
    Nous demandons le rapport complet (méthode, incertitude), le PV de prélèvement (date, heure, opérateur,
    scellés), la confirmation qu''un échantillon contradictoire est conservé à notre disposition, et les
    relevés de température de votre entrepôt entre la réception à 12 h 55 et le prélèvement. **En l''état,
    ce résultat ne nous est pas opposable.**


    **6. Suite.** Nous proposons une **expertise contradictoire**, le cas échéant avec nos assureurs respectifs.
    Nous vous demandons de conserver en l''état marchandises non détruites, échantillons et enregistrements.


    Notre instruction est en cours ; nos observations complémentaires suivront. La présente ne vaut aucune
    reconnaissance de responsabilité et nous réservons l''ensemble de nos droits et moyens.


    *[Signature — Direction générale. PJ : copie du BL n° 2418.]*


    **Consigne :** ce courrier ne développe **aucun argument de température** — délibérément. Toute affirmation
    de conformité thermique ouvrirait la fenêtre 6 h 25 – 9 h 05, que nos pièces ne couvrent pas. Ne pas
    mentionner l''heure de départ, les propos du chauffeur, la mise sous tension du groupe, le journal
    du portique. Ne joindre ni P1 ni P5 à ce stade : ils seront produits dans le cadre contradictoire
    du § 6.


    ---


    # Ce qui s''engage dans les huit jours


    1. **Le courrier B part immédiatement**, LRAR + courriel avec AR. Le point de départ du délai n''est
    établi par aucune pièce (P9 manque) : retenir la date la plus défavorable — le refus du 3 juin — et
    ne pas attendre l''instruction interne. La sanction vise l''acquisition de plein droit de la **pénalité**
    ; seul un écrit daté et traçable la neutralise, quel que soit son contenu.

    2. **Déclaration du sinistre à l''assureur sans délai**, avec P1–P7 et la note A.

    3. **Demandes P8–P12** au dépôt ; **réunion de P13–P20** en interne, priorité au chronotachygraphe
    et à l''échantillon témoin.

    4. **Vérification d''extension** : contrôler portique et enregistreurs sur toutes les expéditions
    de la période pour savoir si le défaut de mise en froid préalable est isolé ou systémique. Si d''autres
    lots sont concernés, les obligations de retrait s''apprécient immédiatement et priment sur le contentieux.

    5. **Mesures correctives**, opposables à l''assureur comme au client : groupe froid sous tension avant
    chargement, avec vérification consignée ; interdiction de toute mention horaire manuscrite sur les
    BL ; report de l''horodatage automatique du portique ; enregistrement continu dès la fin du chargement.


    Le point le plus coûteux du dossier n''est pas les 2 h 40 — c''est la mention « 6 h 40 ». Déclarez-la
    vous-même, expliquez-la, supprimez la pratique. Défendue, elle transforme un manquement documentaire
    en question de sincérité.

