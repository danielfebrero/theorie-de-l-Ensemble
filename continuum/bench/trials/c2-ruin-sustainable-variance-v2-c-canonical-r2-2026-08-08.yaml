response:
  text: '# Note au conseil — Verlaq

    **Objet :** arbitrage Sedamex / Nordwerk, période 18 mois · **Séance du vendredi** · Direction générale


    ---


    ## 1. Recommandation


    **Option B — installation de la ligne Nordwerk**, sous trois conditions suspensives détaillées au
    § 5.


    ## 2. Ce qui fonde le choix


    **Le seuil de bascule est à 46,2 %.** Nordwerk devient préférable à Sedamex dès que la probabilité
    de succès dépasse ce seuil : `900p − 400(1−p) = 200 → p = 46,2 %`. L''estimation du bureau d''études
    est à 60 %. L''espérance de B ressort à **380 k€** contre **200 k€** garantis pour A, soit **+180
    k€**.


    **Le pire cas ne met pas l''entreprise en cause.** La perte est plafonnée contractuellement à 400
    k€, sans caution du dirigeant, sans défaut croisé, sans sûreté sur l''actif industriel, carnet de
    commandes non gagé. Elle représente **11,8 % des fonds propres**, 15,4 % de la trésorerie, **2,4 mois
    de masse salariale**.


    **Le covenant tient dans toutes les branches**, dividende exceptionnel intégré :


    | | Fonds propres | Trésorerie |

    |---|---|---|

    | Situation actuelle | 3 400 k€ | 2 600 k€ |

    | − dividende exceptionnel (M4 + M10) | −700 k€ | −700 k€ |

    | − échec Nordwerk (plafond, au plus tard M12) | −400 k€ | −400 k€ |

    | **Plancher, branche défavorable** | **2 300 k€** | **1 500 k€** |

    | Seuil bancaire | 1 200 k€ | — |

    | **Marge résiduelle** | **+1 100 k€** | 9 mois de salaires |


    Le trimestre le plus tendu est le quatrième (dividende de 350 k€ et pénalité de 400 k€ potentiellement
    concomitants) : 750 k€ de sortie sur un mois, absorbés sans recours au concours bancaire. **Il faudrait
    1,1 M€ de pertes imprévues supplémentaires pour approcher le covenant.**


    ## 3. Réponse au directeur financier


    Sur la forme de l''objection — « on ne joue pas la maison » — les chiffres ne la soutiennent pas :
    la maison, ce sont 3,4 M€ de fonds propres, 2,6 M€ de trésorerie et une dette nette nulle ; ce qui
    est exposé, c''est 400 k€ ring-fencés par contrat. Le précédent Tremay ne transpose pas : une ligne
    neuve ne tue pas une entreprise, un financement à effet de levier avec sûretés et défaut croisé la
    tue. Nous n''avons ni l''un ni l''autre. Retenir A pour cette raison, c''est renoncer à 180 k€ d''espérance
    contre un risque qui n''existe pas sous cette forme.


    **Sur le fond, il a raison sur un point que son argument ne dit pas.** La fragilité de l''option B
    n''est pas financière, elle est probatoire. Une estimation à 60 % assise sur onze cas porte une incertitude
    d''environ ±15 points : l''intervalle plausible va de 31 % à 89 % et **enjambe le seuil de 46,2 %**.
    Statistiquement, la supériorité de B n''est donc pas établie — elle est la meilleure lecture d''un
    échantillon trop court. C''est ce qui justifie les conditions ci-dessous plutôt qu''une signature
    en l''état. Je propose que le directeur financier soit désigné titulaire du déclencheur d''arrêt (§
    6) : le contrôle de l''abandon lui revient, pas seulement le droit d''objecter.


    ## 4. Ce que coûte l''option A


    Les 200 k€ sont acquis, mais dix-huit mois de sous-traitance reconduite laissent l''entreprise sans
    capacité propre nouvelle à l''échéance, avec le même profil de dépendance qu''aujourd''hui. Jugement
    de direction, non chiffré ici.


    ## 5. Conditions suspensives — avant signature, pas après


    1. **Audit des onze références** par un tiers, sur critères de comparabilité déclarés à l''avance
    (matière, cadence, intégration). Exiger également la liste des installations *non* documentées : une
    non-réponse est une information.

    2. **Jalon de recette technique contractuel au 6ᵉ mois**, opposable. Il ne modifie pas le plafond
    de 400 k€ mais transforme une incertitude de dix-huit mois en décision à six.

    3. **Priorité de réengagement Sedamex à 18 mois**, demandée par écrit avant de notifier le non-renouvellement.


    ## 6. Repli et déclencheur observable


    **Renversement du choix :** si l''audit ramène le sous-ensemble réellement comparable à **moins de
    6 succès sur 11**, la recommandation bascule sur Sedamex, sans nouveau débat.


    **Arrêt en cours d''exécution :** non-atteinte du jalon de recette au 6ᵉ mois, ou dérive de trésorerie
    portant le plancher projeté sous 1,0 M€ → constatation immédiate de l''échec, cristallisation de la
    pénalité au 6ᵉ mois plutôt qu''au 12ᵉ, reprise de charge en sous-traitance. Décision portée par le
    directeur financier, sans arbitrage de la direction générale.


    ## 7. Première action


    Mandater l''audit des onze références lundi, pour restitution sous trois semaines. Aucune signature
    Nordwerk ni notification à Sedamex avant cette restitution.


    ---


    **En un mot :** l''écart d''espérance est réel, la perte est bornée et non létale, le covenant tient
    avec 1,1 M€ de marge. Ce qui n''est pas encore solide, c''est la statistique du bureau d''études —
    et c''est cela, et non le risque de ruine, qu''il faut acheter avant de signer.

    '
