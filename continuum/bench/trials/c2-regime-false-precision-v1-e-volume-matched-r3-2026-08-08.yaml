    # Note au comité de direction — Fermetures de magasins


    **Objet :** réponse à l''objectif actionnaire de 300 000 € de résultat supplémentaire

    **Recommandation en une phrase :** ne fermer aucun magasin mardi — fermer les trois sites déficitaires
    dégraderait le résultat d''environ 114 000 €, pas de 288 000 €.


    ## 1. Le piège du raisonnement « trois magasins négatifs, donc −288 000 € »


    Le résultat par magasin inclut une quote-part des 6,4 M€ de frais de siège et de logistique, répartie
    au prorata du chiffre d''affaires. **Cette quote-part ne disparaît pas quand le magasin ferme : elle
    se reporte sur les seize autres.** Le siège, les systèmes, la direction, l''essentiel de l''entrepôt
    restent là.


    Ce que chaque magasin rapporte réellement, une fois payés ses propres loyers, salaires et charges
    :


    | Magasin | Résultat affiché | Quote-part siège réintégrée | **Ce que le magasin rapporte réellement**
    |

    |---|---|---|---|

    | Vitry | −118 000 € | +181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | +128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | +93 000 € | **+19 000 €** |


    Les trois sites contribuent ensemble **+114 000 €** au paiement des frais communs. Les fermer, c''est
    perdre ces 114 000 € et redistribuer 402 000 € de frais sur le reste du réseau. Le résultat du groupe
    baisse — avant même de compter le coût des fermetures elles-mêmes.


    Une précision : ces trois magasins pèsent 2,8 %, 2,0 % et 1,5 % du chiffre d''affaires du réseau,
    contre 5,3 % pour un magasin moyen. Ce sont nos trois plus petits. Un petit magasin a des charges
    fixes qui ne rétrécissent pas avec lui : c''est cela qui les rend déficitaires en comptabilité analytique,
    pas une mauvaise exploitation.


    ## 2. Les trois sites, un par un


    **Chambéry — à retirer définitivement de la liste.** Six ans de bail, aucune clause de sortie, 1,1
    M€ d''indemnité. Fermer coûterait 1,1 M€ en trésorerie pour dégrader le résultat de 32 000 € par an.
    Le magasin le plus proche est à 92 km : aucune vente ne se reporterait. C''est le pire dossier des
    trois, et le seul sur lequel nous pouvons trancher mardi sans étude complémentaire.


    **Vitry — le seul dont la sortie serait gratuite, et le plus rentable des trois.** Le bail échoit
    dans 7 mois sans indemnité. Mais Vitry apporte 63 000 €, le meilleur des trois, et ce chiffre est
    *sous-estimé* : 18 % de ses entrées sont des retraits de commandes web dont le chiffre d''affaires
    est enregistré sur l''entité e-commerce. Vitry supporte le coût de ce service (personnel, surface,
    réserve) sans en encaisser un euro. Fermer Vitry supprimerait aussi un point de retrait pour l''e-commerce,
    dont le coût n''apparaît nulle part dans nos comptes.


    Une seule urgence sur Vitry : **vérifier cette semaine la date limite de préavis du bail.** C''est
    la seule contrainte de calendrier réelle du dossier. Si le préavis est de six mois, la fenêtre se
    referme dans quelques semaines.


    **Nîmes — la vraie question n''est pas le magasin, c''est le mur.** Nous détenons un actif de 1,9
    M€ qui produit 19 000 € de contribution, soit un rendement d''environ 1 %. C''est le seul point où
    de la valeur est réellement détruite. Attention toutefois : si la comptabilité analytique n''impute
    aucun loyer à Nîmes, son résultat est flatté et sa contribution réelle est probablement négative.
    À vérifier.


    La bonne réponse n''est pas la fermeture mais la **dissociation de l''actif et de l''exploitation**
    : mise en vente des murs avec option de rester locataire (*sale-leaseback*). Nous encaissons 1,9 M€
    sans fermer, sans licencier, et nous révélons enfin le vrai coût d''occupation du site.


    ## 3. Ce que nous décidons mardi


    1. **Chambéry est retiré de la liste des fermetures.** Décision définitive.

    2. **Vitry : pas de fermeture, mais mandat de renégociation.** L''échéance du bail est notre meilleur
    levier sur le bailleur. Objectif : baisse de loyer. Vérification du préavis sous 5 jours, pour préserver
    l''option de sortie sans la déclencher.

    3. **Nîmes : lancement d''une consultation sur les murs** (estimation ferme + option sale-leaseback).
    Aucun engagement de vente à ce stade.

    4. **La cible de 300 000 € est réaffectée sur les frais communs.** Réduire de 5 % les 6,4 M€ de siège
    et de logistique rapporte 320 000 € — davantage que l''objectif, sans fermer un seul magasin ni licencier.

    5. **Comité de décision fixé à six semaines**, avec les éléments ci-dessous. Nous décidons alors,
    pas plus tard.


    ## 4. Ce que nous engageons d''ici là


    | Travail | Pourquoi | Responsable | Délai |

    |---|---|---|---|

    | Découper les 6,4 M€ en frais **réellement évitables** magasin par magasin, et en frais qui restent
    quoi qu''il arrive | C''est la seule donnée qui manque pour trancher | DAF | 3 sem. |

    | Calculer la contribution réelle des **19 magasins**, pas seulement des 3 négatifs | Des magasins
    « bénéficiaires » contribuent peut-être moins que Vitry | Contrôle de gestion | 3 sem. |

    | Refacturer à l''e-commerce les retraits de commandes de Vitry, et recalculer son compte | Vitry
    rend un service gratuit à une autre entité | DAF + e-commerce | 4 sem. |

    | Imputer un loyer de marché à Nîmes | Son résultat est aujourd''hui flatté | DAF | 2 sem. |

    | **Chiffrer le coût d''une fermeture** : indemnités, procédure collective si ≥10 licenciements, remise
    en état, écoulement du stock | Ce chiffre est absent de tous les documents fournis. Nous n''avons
    jamais fermé de magasin | DRH + juridique | 4 sem. |

    | Reconstruire l''épisode de Nîmes (mars 2024, 5 semaines de fermeture) : les ventes se sont-elles
    reportées sur les magasins voisins ? | C''est notre seule observation réelle d''une fermeture | Contrôle
    de gestion | 4 sem. |


    **Critère de décision arrêté dès maintenant :** un magasin ne sera fermé que si, après réaffectation
    des seuls frais réellement évitables, sa contribution est négative — ou si le capital qu''il immobilise
    rapporte moins que son placement alternatif. Pas sur la base du résultat analytique actuel.


    ## 5. L''objection à laquelle il faut répondre


    *« Vous repoussez une décision difficile. »* Non : nous en prenons deux mardi (Chambéry, Nîmes), et
    nous fixons une date ferme pour la troisième. Ce que nous refusons, c''est d''engager une décision
    irréversible — 430 salariés, un premier plan social dans l''histoire de l''enseigne — sur un chiffre
    dont nous savons déjà qu''il est faux dans son sens même. Fermer les trois magasins ne produit pas
    +288 000 € mais environ −114 000 €, hors coûts de fermeture. Nous manquerions l''objectif tout en
    payant le prix social.


    ## 6. Ce que nous ne saurons pas, même après ces six semaines


    - **Le taux de report des ventes** ne sera qu''estimé. L''épisode de Nîmes ne nous laisse que des
    totaux mensuels des magasins voisins, sur un seul événement de cinq semaines, en mars — mois affecté
    par la saison et les opérations commerciales. Il donne un ordre de grandeur, pas une mesure.

    - **La carte de fidélité ne prouve rien à elle seule.** Elle couvre 23 % des tickets, et ses porteurs
    sont par construction plus mobiles et plus fidèles que la moyenne : les 41 % de multi-magasins surestiment
    le report réel.

    - **Les compteurs d''entrée comptent des entrées, pas des acheteurs.** Ils sont fiables pour des tendances
    (±2 %), mais chez Vitry il faut retirer les 18 % de retraits web avant toute comparaison, sans quoi
    le magasin paraît deux fois plus fréquenté qu''il ne vend.


    Nous déciderons donc avec une incertitude sur le report. C''est acceptable : le report ne change rien
    pour Chambéry (92 km), et il n''est décisif que si les frais réellement évitables s''avèrent importants
    — ce que l''étude nous dira d''abord.


    ---


    *Note préparée pour le comité du mardi. Un point d''étape est prévu à trois semaines sur les frais
    évitables, seul élément susceptible de modifier la recommandation.*

    '
