response:
  text: '# Note au Conseil — Séance du vendredi


    **Objet : arbitrage Sedamex (option A) / Nordwerk (option B) — horizon 18 mois**

    **Recommandation : option B, sous les trois conditions de signature listées au § 4.**


    ---


    ## 1. Le chiffre qui décide


    | | Option A | Option B (succès, 60 %) | Option B (échec, 40 %) |

    |---|---|---|---|

    | Résultat sur 18 mois | **+200 k€** | +900 k€ | −400 k€ |


    Espérance de B : 0,6 × 900 − 0,4 × 400 = **+380 k€**, soit **+180 k€** par rapport à A.


    Le chiffre important n''est pas le 60 %, c''est le **seuil de bascule : 46 %**. En dessous de 46 %
    de probabilité de succès, A redevient préférable ; au-dessus, B l''emporte. Notre bureau d''études,
    sur onze installations comparables documentées, estime 60 %. Nous disposons donc de **14 points de
    marge d''erreur sur l''estimation** avant que la décision ne s''inverse. Un échantillon de onze cas
    ne donne pas une précision au point près — mais il ne faut pas qu''il soit faux de 14 points, ce qui
    est un tout autre ordre d''erreur.


    Et surtout : une erreur d''estimation ne dégrade pas le scénario du bas. Que la probabilité réelle
    soit 60 % ou 50 %, **la perte maximale reste 400 k€**. L''incertitude porte sur le gain espéré, pas
    sur l''exposition.


    ## 2. Le risque est borné, financé, et ne touche ni le covenant ni la paie


    Les deux mouvements imposés — dividende de 700 k€ (350 k€ au 4ᵉ mois, 350 k€ au 10ᵉ) — s''appliquent
    quelle que soit l''option. Scénario le plus défavorable de B : échec constaté et pénalité de 400 k€
    exigible dans le même trimestre que la seconde tranche de dividende.


    | Point bas (marges non comptées) | Option A | Option B, échec |

    |---|---|---|

    | Fonds propres | 2,70 M€ | **2,30 M€** |

    | Marge sur covenant (1,2 M€) | +1,50 M€ | **+1,10 M€** |

    | Trésorerie | 1,90 M€ | **1,50 M€** |

    | Couverture masse salariale (165 k€/mois) | 11,5 mois | **9,1 mois** |


    Dans le pire cas de B, nous restons **1,1 M€ au-dessus du covenant** et couvrons **plus de neuf mois
    de masse salariale en trésorerie**, dette nette nulle. La perte plafond représente 11,8 % des fonds
    propres. Aucun test trimestriel n''est menacé, y compris en cumulant les deux tranches de dividende
    et la pénalité.


    À cela s''ajoute la structure juridique du contrat : **pas de caution personnelle, pas de défaut croisé,
    aucune sûreté sur l''actif industriel, carnet de commandes non gagé.** L''échec de Nordwerk ne peut,
    par construction, se propager au reste de l''entreprise.


    ## 3. Réponse au directeur financier


    Sa règle est juste : **on ne joue pas la maison sur un tirage à 40 %.** Je la fais mienne, et je l''applique
    comme critère de décision. Elle conduit à B, parce que B ne met pas la maison en jeu.


    La distinction est entre **risque de perte** et **risque de ruine**. Une perte de 400 k€ est douloureuse
    ; elle laisse l''entreprise solvable, conforme à son covenant, capable de payer ses salaires pendant
    neuf mois et de se refinancer. La règle du DAF interdit les paris dont l''issue basse est la disparition.
    Ce n''est pas ce contrat.


    Sur Tremay : le précédent doit être examiné, pas invoqué. La question n''est pas « ils ont installé
    une ligne neuve et ont déposé le bilan », mais **par quel mécanisme la ligne a-t-elle emporté la société**.
    Les mécanismes usuels sont l''endettement du financement, l''absence de plafond de perte, une sûreté
    sur l''outil ou le poste clients, ou une trésorerie trop mince pour absorber le décalage. Verlaq n''en
    présente aucun : dette nette nulle, perte plafonnée contractuellement, aucune sûreté, 2,6 M€ de trésorerie.
    Si l''instruction du dossier Tremay révélait une structure comparable à la nôtre, je réviserais ma
    position — je demande qu''on la mène, mais je ne fais pas de la ressemblance de surface un argument.


    Ce que je concède au DAF : le raisonnement en espérance ne vaut **que parce que** la ruine est exclue.
    Si l''une des trois vérifications ci-dessous échoue, l''espérance cesse d''être le bon critère et
    je recommande A sans hésiter.


    ## 4. Conditions à lever avant signature


    1. **Étanchéité du plafond de 400 k€** : confirmation par le conseil juridique qu''il est global et
    couvre pénalité, remise en état du site, coûts de repli et frais annexes — sans poste exclu.

    2. **Jalons techniques contractualisés** — l''absence de clause de sortie n''interdit pas des points
    de contrôle. Une constatation d''échec au 6ᵉ mois plutôt qu''au 12ᵉ libère les équipes et la décision
    de réallocation, à perte identique.

    3. **Effet de la sortie de Sedamex au-delà des 200 k€** : la relation est-elle récupérable à l''échéance
    des 18 mois ? Si la perte du compte est définitive et structurante, sa valeur excède les 200 k€ affichés
    et doit être réintégrée dans l''arbitrage.


    **Décision demandée au Conseil :** autorisation de signer Nordwerk, sous condition suspensive des
    points 1 et 3, avec provisionnement dédié de 400 k€ en trésorerie non affectée sur toute la durée
    du contrat.

    '
