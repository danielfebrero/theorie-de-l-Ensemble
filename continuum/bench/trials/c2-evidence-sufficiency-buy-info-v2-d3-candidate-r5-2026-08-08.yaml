response:
  text: '## Ce que dit l''arithmétique avant d''écrire la note


    Le prix cellule n''est pas le coût. Le coût complet par chargeur = prix cellule + (taux de retour
    × 205 €). Le point mort est à **2,86 %** : les 3,20 € d''écart de prix achètent exactement 1,56 point
    de retours supplémentaires. La seule mesure indépendante existante dit 3,1 %. Voici la note.


    ---


    **NOTE AU COMITÉ DE DIRECTION**

    **Objet :** Contrat cellules 2027 — arbitrage Kelmar / Sinolux

    **De :** Direction des opérations — **Pour décision avant J+18**


    ### Décision proposée

    Réserver la capacité Kelmar à J+18 pour les 72 000 unités, **sauf si Sinolux signe avant J+14 la clause
    décrite au §5**. Retirer dès maintenant les 230 400 € du budget 2027.


    ### 1. L''économie annoncée n''existe qu''en dessous de 2,86 % de retours


    | Scénario | Cellules | Retours (205 €) | Coût complet | Écart /Kelmar |

    |---|---|---|---|---|

    | Kelmar 1,3 % | 1 872 000 € | 191 880 € | **2 063 880 €** | — |

    | Sinolux 1,1 % | 1 641 600 € | 162 360 € | 1 803 960 € | **+259 920 €** |

    | Sinolux 3,0 % (Ferro) | 1 641 600 € | 442 800 € | 2 084 400 € | **−20 520 €** |

    | Sinolux 3,1 % (audit) | 1 641 600 € | 457 560 € | 2 099 160 € | **−35 280 €** |


    Les 230 400 € inscrits au budget ne sont pas une économie : ce sont les gains d''un pari sur une variable
    que nous n''avons pas mesurée.


    ### 2. Nous n''avons pas trois estimations, nous en avons une

    - **Sinolux 1,1 %** — le fournisseur se note lui-même.

    - **Ferro « environ 3 % »** — sa note méthodologique indique qu''il travaille sur l''échantillon de
    l''audit de mars. Ce n''est pas une confirmation, c''est la même mesure relue.

    - **Audit sectoriel 3,1 %** — seule mesure indépendante disponible.


    Il n''y a donc pas de fourchette 1,1–3,1 à moyenner. Le nombre de travail est **3,1 %**, avec la réserve
    qu''il porte sur une ligne comparable et non sur la nôtre.


    ### 3. Le comportement de Sinolux est notre meilleure information

    Sinolux refuse toute clause indexée sur le taux de retour et offre le remplacement gratuit des cellules.
    À 3,1 %, ce remplacement vaut **~50 900 €** (2 232 cellules à 22,80 €). La prise en charge des 205
    € vaudrait **457 560 €**. Sinolux nous accorde 11 % du risque et refuse les 89 % restants. Un fournisseur
    convaincu de son 1,1 % signerait la clause indexée sans hésiter — elle ne lui coûterait presque rien.
    Son refus est lui-même une estimation, et elle ne dit pas 1,1 %.


    ### 4. Le test Vertex arrive 45 jours trop tard

    34 000 €, ±0,3 point : techniquement décisif. Mais le résultat tombe à J+63 et la réservation Kelmar
    meurt à J+18. Il ne peut pas éclairer la décision qu''il servirait à éclairer. **Je ne l''engage pas
    pour 2027.** Je propose de le lancer pour qualifier Sinolux en seconde source 2028 — décision séparée,
    à prendre avant J+30.


    ### 5. Les trois actions des 18 prochains jours

    - **J+14 — la vraie sortie.** Proposer à Sinolux : prise en charge de 205 € par chargeur retourné
    au-delà de 1,6 %, plafonnée à 400 000 € (couvre jusqu''à 4,3 % de retours). Avec cette clause, notre
    coût complet est plafonné à 26,08 €/chargeur, soit **186 000 € d''économie sécurisée au lieu de 230
    400 € pariés** — et je bascule sur Sinolux. S''il refuse, la question est tranchée. Coût de cette
    information : **zéro, et elle arrive à temps.**

    - **J+12 — le chiffre manquant.** Demander à Kelmar le coût d''une réservation partielle (40 000 unités)
    ou d''un droit de réservation. S''il existe, un partage 55/45 garde les deux sources vivantes et rend
    le test Vertex utile dès J+63.

    - **J+7.** Exiger de Sinolux les retours de la ligne auditée et les écarts documentés avec notre référence.


    ### 6. Pire cas, repli, déclencheur

    **Sinolux sans réservation, taux réel à 4 %** : 2 880 chargeurs repris, 168 000 € au-delà de Kelmar
    — et surtout aucune source alternative avant 2028, la ligne Kelmar étant vendue. Ce n''est pas une
    mauvaise année, c''est une année sans porte de sortie. L''encaissent : l''atelier, le budget garantie,
    et les exploitants de bornes chez qui les 2 880 pannes se produisent.

    **Kelmar, si Sinolux était bon** : 259 920 € laissés sur la table, récupérables en 2028 avec la mesure
    Vertex. Perte bornée et réversible.

    **Déclencheur**, si un volume Sinolux est engagé : taux de retour cumulé suivi sur les 5 000 premiers
    chargeurs livrés ; au-delà de 2,0 %, bascule du solde vers Kelmar. *Ce déclencheur n''a de valeur
    que si la capacité Kelmar est réservée — un repli sans fournisseur disponible n''est pas un repli.*

    **Ce qui renverse ma position** : la signature de la clause à 1,6 %, ou une mesure indépendante de
    notre référence exacte sous 2,5 %. Pas une note de plus fondée sur l''échantillon de mars.


    ### 7. Le meilleur argument contre moi

    L''audit de mars porte sur une ligne comparable, pas la nôtre ; 3,1 % peut être un mauvais lot. En
    refusant, nous payons 260 000 € de prime d''assurance contre un risque peut-être inexistant, et restons
    captifs d''un fournisseur unique qui le sait. Sur le fond, l''argument tient — c''est précisément
    pourquoi la clause du §5 est la sortie : elle nous donne le prix Sinolux sans le pari. Sur le calendrier,
    il ne tient pas : à J+18 nous choisissons entre un risque mesuré à 3,1 % et un risque mesuré à 1,3
    %, et seul le second nous laisse une manœuvre en 2027.


    **Ce que je demande au comité :** le retrait des 230 400 € du budget, et mandat de réserver Kelmar
    à J+18 en l''absence de clause signée.


    ---


    Deux points sur lesquels j''ai tranché et que vous pouvez vouloir rouvrir : j''ai considéré que les
    205 € « tout compris » incluent la cellule de remplacement, donc que la concession de Sinolux ne réduit
    pas notre coût unitaire de retour — si elle le réduit de 22,80 €, le point mort remonte à 3,22 % et
    le scénario 3,1 % devient neutre (+15 600 €) plutôt que négatif. Cela ne change pas la décision, cela
    renforce seulement l''urgence de clarifier ce périmètre avec l''atelier avant J+14. Et j''ai supposé
    que la réservation Kelmar engage le volume ferme : si un droit de réservation payant existe, la note
    change de forme et le test Vertex redevient décisif — d''où l''action J+12.

    '
