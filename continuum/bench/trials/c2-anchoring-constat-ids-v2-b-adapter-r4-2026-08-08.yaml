response:
  text: '# Avis — Renouvellement du logiciel de réservation et des bornes de prêt


    *Pour lecture en comité de direction. Chaque point est autonome et indique la pièce sur laquelle il
    repose.*


    ---


    ## I. Ce que je retiens du dossier


    **1. Le dossier contient deux pannes différentes, actuellement confondues en une seule.**

    D''un côté l''indisponibilité des bornes (matériel), de l''autre la perte de réservations (logiciel).
    Rien dans les pièces ne les relie. Toute la suite en découle.

    *Repose sur : la lecture croisée de l''export technique et de l''enquête interne.*


    **2. L''indisponibilité des bornes est un problème de matériel de 2015, et c''est la conclusion la
    plus solide du dossier.**

    32 h sur 41 se concentrent sur les deux seuls sites équipés des bornes de 2015, soit environ 16 h
    par site contre 1,8 h en moyenne ailleurs — un facteur 9. La corrélation est parfaite avec l''âge
    du parc, nulle avec le logiciel, qui est le même partout.

    *Repose sur : l''export technique seul. Pièce objective, non déclarative. Solidité : forte.*


    **3. La perte de réservations est réelle mais n''est ni mesurée ni datée.**

    61 % des répondants, ce sont environ 26 agents sur 62 ; 19 agents n''ont pas répondu et une enquête
    sur un dysfonctionnement attire d''abord ceux qui le subissent. Cela établit qu''il se passe quelque
    chose de suffisamment répandu pour être mesuré. Cela n''établit ni la fréquence, ni le volume, ni
    la cause.

    *Repose sur : l''enquête interne (43/62). Solidité : moyenne pour l''existence du problème, faible
    pour tout le reste.*


    **4. La date de mars n''est pas établie, et trois causes candidates se disputent la même fenêtre.**

    12 répondants sur 43 situent le début après la mise à jour de mars — un tiers des répondants, sur
    une datation rétrospective à plusieurs mois. Or en février, Rive-Sud a changé de lien fibre **et**
    le portail usagers a changé de version. Aucune pièce du dossier ne sépare ces trois événements.

    *Repose sur : l''enquête interne et la chronologie de février. Solidité : la mise à jour de mars est
    une hypothèse parmi trois, pas un fait.*


    **5. Le silence de Fontaine est un trou, pas une donnée.**

    Fontaine et Rive-Sud tournent sur le même logiciel. Si le logiciel perdait des réservations, Fontaine
    devrait le constater. Deux lectures possibles : soit Fontaine ne subit pas la perte — et alors la
    cause est locale à Rive-Sud, ce qui pointe vers la fibre de février ; soit Fontaine la subit et ne
    la remonte pas. Le dossier ne tranche pas, et cette question est décisive.

    *Repose sur : les notes de sites. C''est la pièce la moins chère à compléter et la plus discriminante.*


    **6. La décrue des réclamations après juin n''est pas expliquée.**

    71 réclamations sur mars-juin, 25 sur les huit autres mois. Pendant que les réclamations refluaient,
    Rive-Sud a continué à ressaisir 5 h par semaine. Soit le défaut a été corrigé, soit il persiste et
    la ressaisie manuelle l''absorbe — les usagers ne se plaignent plus parce que les agents réparent.
    Les deux lectures sont compatibles avec les chiffres ; le dossier ne permet pas de choisir.

    *Repose sur : les réclamations usagers croisées aux notes de sites.*


    **7. La remise de 12 % achète environ 20 000 € et vend 36 mois d''engagement.**

    Sur la base indexée à +7 % : environ 165 000 € sur trois ans, environ 145 000 € avec la remise, soit
    ~6 600 € par an. À noter : **le dossier ne dit pas sur quelle base porte la remise** — tarif actuel
    ou tarif indexé, une année ou trois. L''écart entre les deux lectures est significatif.

    *Repose sur : les pièces financières. Le calcul est reproductible, l''assiette ne l''est pas.*


    **8. La v4 est chiffrée mais sa compatibilité avec la moitié du parc de bornes est inconnue.**

    31 000 € pour une migration dont la compatibilité avec les bornes de 2015 est « à l''étude ». Si elle
    est incompatible, il faut ajouter le remplacement des bornes de Fontaine et Rive-Sud, non budgété.
    Ces bornes sont par ailleurs celles qui concentrent 78 % de l''indisponibilité — leur remplacement
    se posera de toute façon, quel que soit le logiciel retenu.

    *Repose sur : les pièces financières et l''export technique.*


    **9. Le libre n''est pas écarté sur le fond, il l''est sur le calendrier.**

    Chez le réseau voisin, 2 sites sur 5 tiennent encore un registre papier après 14 mois : la migration
    n''a pas abouti, et une économie de 30 % « annoncée » n''est pas une économie constatée tant que des
    sites fonctionnent en mode dégradé. Surtout, notre équipe informatique passe à une personne en octobre
    — le mois même de l''échéance. Aucune migration, ni v4 ni libre, ne peut être lancée dans ces conditions.

    *Repose sur : le retour du réseau voisin et l''effectif informatique. La contrainte d''effectif est
    à elle seule dirimante.*


    ---


    ## II. Ce que je ne retiens pas en l''état


    La note de cadrage porte trois affirmations enchaînées : mars est la cause, la v4 corrige, il faut
    signer avant le 30. Chacune est testable ; aucune n''est aujourd''hui étayée par une pièce du dossier.


    - *Mars est la cause* — non départagé de la fibre et du portail (points 4 et 5).

    - *La v4 corrige* — on ne peut pas affirmer qu''un produit corrige un défaut dont la cause n''est
    pas identifiée, et dont la compatibilité avec nos bornes est « à l''étude » (point 8).

    - *Il faut signer avant le 30* — le 30 est une échéance commerciale. Notre échéance réelle est le
    31 octobre (point 7).


    Je ne mets pas en cause l''auteur : la note pose les bonnes questions. Elle les présente comme résolues
    alors qu''elles sont ouvertes, et deux membres du comité l''ont déjà lue en ce sens.


    ---


    ## III. Recommandation


    **Ne rien signer avant le 30. Reconduire à l''identique sur une durée courte — 12 mois, ou la durée
    minimale que l''éditeur acceptera — et statuer sur la v4 en janvier, une fois le diagnostic établi
    et le poste informatique pourvu.**


    La signature de trois ans est le seul acte irréversible du dossier. Elle nous engage sur 36 mois au
    moment précis où nous ignorons la cause de la panne, où la compatibilité v4 est « à l''étude », et
    où l''équipe informatique tombe à une personne. Les 20 000 € de remise sont le prix demandé pour renoncer
    à savoir.


    Le libre reste réexaminable à la prochaine échéance, avec deux conditions préalables : équipe informatique
    reconstituée, et chiffres réels — non annoncés — obtenus auprès du réseau voisin.


    ---


    ## IV. L''objection la plus forte, et ma réponse


    *Attendre coûte : ~20 000 € de remise perdus, ~250 h par an de ressaisie à Rive-Sud, une indexation
    qui court, et le risque d''arriver au 31 octobre sans contrat — sept sites incapables de prêter.*


    L''objection est juste et je la prends au sérieux. Ma réponse : le plan ci-dessous est calibré pour
    clore avant le 31 octobre, pas pour repousser. Et j''assume une condition d''arrêt explicite — **si
    l''éditeur n''a pas répondu par écrit sur la compatibilité au 15 octobre, nous reconduisons à l''identique
    au tarif plein, sans remise.** Ce surcoût est le prix de ne pas nous lier ; il est réversible, la
    signature de trois ans ne l''est pas.


    ---


    ## V. Ce que j''engage dans les quinze jours


    1. **Éditeur, par écrit** : réponse ferme, datée et signée sur la compatibilité v4 / bornes 2015 ;
    tarif d''une reconduction de 12 mois ; assiette exacte de la remise de 12 % et possibilité de la reconduire
    après le 30.

    2. **Chronologie de février-mars** : dates exactes du remplacement fibre, du changement de version
    du portail et de la mise à jour. Si les pertes précèdent mars, la note de cadrage tombe. Test décisif,
    coût nul.

    3. **Fontaine** : entretien sur site. Le silence doit être levé dans un sens ou dans l''autre (point
    5).

    4. **Rive-Sud** : les 5 h hebdomadaires de ressaisie produisent une trace. Compter les réservations
    réellement perdues sur quatre semaines — première mesure réelle du dossier, en remplacement d''une
    perception d''enquête.

    5. **Réclamations** : reclasser les 71 de mars-juin par type et par site. Si elles suivent les bornes,
    ce n''est pas le logiciel.

    6. **Bornes 2015** : chiffrer leur remplacement à Fontaine et Rive-Sud, indépendamment du choix logiciel
    (point 8).

    7. **Réseau voisin** : demander leurs coûts constatés à 14 mois et les raisons des deux sites restés
    sur papier.

    8. **Poste informatique** : décision de remplacement avant toute migration. Aucun scénario n''est
    tenable à une personne.


    Rapport d''étape au comité au 15 octobre, avec la décision v4 documentée ou la reconduction courte
    activée.


    ---


    ## VI. Robustesse — si le comité écarte un élément


    | Élément écarté | Ce qui tombe | Ce qui tient |

    |---|---|---|

    | L''enquête interne | Points 3 et 4 | Tout le reste |

    | Les réclamations usagers | Point 6 | Tout le reste |

    | Le retour du réseau voisin | Une partie du point 9 | La contrainte d''effectif suffit à différer
    le libre |

    | L''export technique | Point 2 | La recommandation |


    **La recommandation ne repose sur aucune pièce contestée.** Elle repose sur deux faits que personne
    ne discute : la compatibilité v4 avec les bornes de 2015 n''est pas tranchée, et l''équipe informatique
    passe à une personne en octobre. Le comité peut écarter l''enquête, les réclamations et le retour
    du voisin sans que la conclusion bouge.

    '
