response:
  text: '# Note au Conseil — Vendredi 12 juin

    **Objet : arbitrage Sedamex / Nordwerk — 18 mois**

    **De : la Direction générale**


    ---


    ## Recommandation


    **Je recommande l''option B (ligne Nordwerk), sous les quatre conditions de signature listées au point
    4.**


    ## 1. Le risque de ruine n''existe pas dans ce dossier


    C''est le seul point qui devrait décider un conseil, et il se vérifie par le calcul, scénario défavorable
    intégral :


    | Au pire (échec technique + dividende payé) | |

    |---|---|

    | Fonds propres : 3,4 − 0,7 (dividende) − 0,4 (perte plafonnée) | **2,3 M€** |

    | Covenant bancaire | 1,2 M€ |

    | **Marge de sécurité** | **+1,1 M€ (92 % au-dessus du seuil)** |

    | Trésorerie : 2,6 − 0,7 − 0,4 | **1,5 M€, soit 9 mois de masse salariale** |


    Aucune clôture trimestrielle ne descend sous 2,3 M€, quelle que soit la date de constatation de l''échec
    (le cas le plus tendu, échec au T2, laisse 2,65 M€). Le plan étant à l''équilibre, ce coussin ne s''érode
    pas avec le temps.


    Pour casser le covenant, il faudrait une perte de 1,5 M€ — **3,75 fois le plafond contractuel**. La
    perte maximale représente 11,8 % des fonds propres et 15,4 % de la trésorerie. Et elle est sans recours
    : pas de caution du dirigeant, pas de défaut croisé, pas de sûreté sur l''actif industriel, carnet
    de commandes non gagé.


    ## 2. L''écart de valeur


    Espérance B : (0,6 × 900) − (0,4 × 400) = **+380 k€**, contre **+200 k€** garantis en A. Écart : +180
    k€.


    Test de robustesse : B ne devient inférieure à A que si la probabilité réelle de succès tombe **sous
    46 %**. Le bureau d''études annonce 60 % sur onze installations documentées. Il faudrait donc qu''il
    se trompe de 14 points pour que l''arbitrage bascule — possible, mais ce n''est pas le scénario central,
    et même à 46 % l''entreprise reste intacte.


    ## 3. Réponse au directeur financier


    Son réflexe est le bon et je veux qu''il soit maintenu au conseil. Mais l''objection porte sur le
    mauvais objet.


    **« On ne joue pas la maison »** — nous ne la jouons pas. La maison serait jouée si la perte était
    non plafonnée, adossée à de la dette, garantie sur l''outil industriel ou cautionnée à titre personnel.
    Aucune de ces quatre conditions n''est réunie. Nous engageons un montant borné, connu à l''avance,
    absorbable sans toucher au covenant ni à l''exploitation. Un pari qui laisse 2,3 M€ de fonds propres
    et 9 mois de salaires quand il échoue n''est pas un pari sur la survie : c''est une dépense à résultat
    incertain.


    **Sur Tremay** — un échantillon de un, sélectionné parce qu''il a échoué, contre onze cas documentés.
    Surtout : nous ne savons pas ce qui a tué Tremay. Ce qui emporte une PME sur une ligne neuve, ce n''est
    jamais le tirage, c''est le financement — dette avec sûretés, perte non bornée, investissement supérieur
    au coussin. Si Tremay présentait notre structure de risque, le conseil doit me le montrer et je révise.
    Sinon, l''analogie repose sur la seule ressemblance du mot « ligne neuve ».


    **Sur l''irréversibilité** — l''absence de clause de sortie ne coûte que si l''on souhaite sortir.
    Or le plafond de 400 k€ *est* notre clause de sortie, à prix connu d''avance. C''est plus protecteur
    qu''une sortie négociée à chaud.


    ## 4. Conditions de signature


    Je demande au conseil de subordonner son accord à :


    1. **Validation juridique du périmètre du plafond** — que « perte totale » couvre bien l''intégralité
    des débours, remise en état comprise, sans avenant susceptible de le dépasser. C''est le seul point
    qui pourrait invalider toute la démonstration ci-dessus.

    2. **Confirmation écrite du non-recours** (caution, défaut croisé, sûretés).

    3. **Jalons techniques de constatation à M6 et M9**, pour déclencher tôt plutôt que subir M12 : une
    sortie anticipée préserve la trésorerie sans changer le plafond.

    4. **Information préalable du banquier** et reporting trimestriel du covenant au conseil, en pire
    cas actualisé. Je propose que le directeur financier pilote ce dispositif.


    ## Ce qui changerait mon avis


    Si le covenant était fixé à 2,5 M€, ou si le plafond de 400 k€ s''avérait poreux au point 4.1, je
    recommanderais Sedamex sans hésiter. Ma recommandation ne dit pas que l''espérance l''emporte toujours
    — elle dit qu''elle l''emporte ici, **parce que le mauvais tirage est absorbable et que nous en connaissons
    le prix avant de signer**.

    '
