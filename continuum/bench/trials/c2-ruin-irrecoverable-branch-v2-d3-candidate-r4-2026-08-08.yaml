response:
  text: '# Note au conseil d''administration — séance de jeudi


    **Objet : allocation de la réserve et avenir de la caisse. Recommandation de la direction.**


    ---


    ## 1. Recommandation en une phrase


    Je refuse l''option C, je diffère l''option B, je maintiens l''option A **non comme stratégie mais
    comme véhicule d''attente**, et j''engage la caisse, dès ce trimestre, sur le dépôt d''un dossier
    de transfert auprès de l''Union mutualiste de l''Atlantique — parce que la fenêtre d''éligibilité
    à ce transfert se referme dans dix-huit à vingt-quatre mois, et que c''est la seule décision de jeudi
    qui soit réellement irréversible si on ne la prend pas.


    ---


    ## 2. Le diagnostic du trésorier est juste ; sa conclusion ne l''est pas


    Il faut le dire au conseil sans détour : sur le fond, le trésorier a raison. Au statu quo, la caisse
    meurt. Cotisations 4,4 M€ contre prestations 5,4 M€ progressant de 4,3 % — l''écart est structurel,
    il se creuse d''environ 0,25 M€ chaque année, et aucun rendement financier ne le comble durablement
    sur une base de 18,4 M€. Il faudrait servir plus de 5,4 % dès la première année, puis davantage chaque
    année, indéfiniment. La hausse de cotisation de 6 % rejetée en 2024 (+0,26 M€) aurait couvert environ
    **une seule année de dérive**. L''équilibre technique exigerait de l''ordre de +15 %, puis une indexation
    annuelle. Le débat de l''assemblée générale était mal calibré, et celui du conseil l''est aussi :
    on demande à l''actif de résoudre un problème de passif.


    Là où la note du trésorier bascule, c''est en traitant la survie de la caisse comme un problème d''espérance
    de rendement. Ce n''en est pas un.


    ---


    ## 3. Option C — refusée, et le refus n''est pas négociable


    Ce n''est pas un arbitrage rendement/risque tranché en défaveur de C. C''est une inadmissibilité.


    **a) Les 3 % ne sont pas du bruit.** Une chance sur trente-trois de ramener la réserve à 4,7 M€, soit
    **la dissolution de plein droit** par application des statuts. Pas un mauvais millésime : la fin.
    4 200 affiliés de 61 ans d''âge moyen, fortement exposés à l''amiante, qu''aucun assureur du marché
    n''a accepté de coter en 2025, se retrouvent sans couverture. Il n''y a ni réassureur, ni garantie
    publique, ni marché de repli. C''est une branche absorbante : on n''en revient pas. Un événement à
    3 % dont on ne revient jamais ne se compare pas à un événement à 6 % dont on se relève.


    **b) Les 94 % de domination sont mesurés sur la mauvaise grandeur.** Une simulation de richesse terminale
    à sept ans ignore deux contraintes qui, ici, sont les seules qui comptent : le plancher statutaire
    de 11 M€ et l''obligation de payer les prestations tous les mois. Je demande formellement que le trésorier
    confirme par écrit si ses 10 000 trajectoires modélisent le seuil de 11 M€ comme **barrière absorbante**.
    Au vu de la conclusion, je pense que non. Sans cela, le chiffre de 94 % ne dit rien sur la question
    posée.


    **c) Le risque de liquidité est plus grave que le risque de défaut, et il est presque certain.** C
    immobilise 14,4 M€ pendant sept ans, sans sortie. Il reste 4,0 M€ liquides face à un déficit de trésorerie
    de 1,16 M€ la première année, croissant. **Question déterminante, à laquelle il faut une réponse écrite
    de l''émetteur avant toute discussion de C : le coupon de 14 % est-il distribué annuellement en numéraire,
    ou capitalisé jusqu''à l''échéance ?** S''il est capitalisé — hypothèse usuelle pour une note non
    cotée bloquée — la caisse est **en cessation de paiement vers le 33ᵉ mois**, quatre ans avant le déblocage,
    dans le scénario dit favorable à 88 %. Détenir 14,4 M€ inaccessibles ne paie pas une facture d''hospitalisation.


    **d) La distribution communiquée est incomplète, et elle vient du vendeur.** Une note structurée servant
    14 % quand l''État sert 1,8 % ne rémunère pas le seul risque de crédit d''un émetteur A− : elle rémunère
    une optionnalité vendue par le souscripteur. Or la distribution transmise ne comporte **aucun scénario
    de sous-performance hors défaut** — ce qui est précisément le mode d''échec dominant de ces produits.
    Même en retenant les chiffres de l''émetteur tels quels, la branche à 9 % (+2 %/an, soit 0,29 M€)
    ne couvre pas le déficit et conduit elle aussi à l''assèchement. Le total des trajectoires gravement
    défavorables n''est donc pas 3 % : il est **d''au moins 12 %**, avant même de compter les scénarios
    omis.


    **e) La référence de marché n''en est pas une.** Deux caisses comparables ont souscrit il y a douze
    mois à un produit bloqué sept ans. Aucune information n''a encore pu remonter. Ce n''est pas une validation,
    c''est un argument de placement.


    En conséquence : **je ne soumettrai pas C au vote favorable et, si le conseil l''adopte, je demanderai
    que mon opposition soit portée au procès-verbal.** Le veto porte sur l''acte, pas sur les personnes
    : la suite de la décision se construit avec les cosignataires, et je l''expose au point 5.


    ---


    ## 4. La vraie décision de jeudi : la fenêtre de transfert se referme


    L''Union mutualiste de l''Atlantique n''a jamais repris un portefeuille dont la réserve représentait
    moins de **trois années de prestations**. Aujourd''hui, nous sommes à 3,41. La projection au statu
    quo :


    | Clôture | Réserve | Prestations | Ratio |

    |---|---|---|---|

    | Aujourd''hui | 18,4 M€ | 5,4 M€ | **3,41** |

    | N+1 | 17,5 M€ | 5,63 M€ | **3,11** |

    | N+2 | 16,3 M€ | 5,87 M€ | **2,78** |

    | N+3 | 14,9 M€ | 6,13 M€ | **2,43** |


    Le critère est franchi **entre le 18ᵉ et le 24ᵉ mois**. L''instruction du comité d''engagement dure
    douze à dix-huit mois. Il n''y a aucune marge. Attendre le prochain conseil, c''est déjà entamer la
    réserve de délai.


    Deux conséquences, et elles commandent tout le reste :


    - **Il faut savoir immédiatement à quelle date le ratio est apprécié** — au dépôt du dossier ou au
    closing. Je ferai poser la question par écrit à l''Union cette semaine. Si le ratio s''apprécie au
    closing, le dossier doit partir sous 60 jours.

    - **Toute perte de valeur, même temporaire, détruit l''éligibilité.** Le pire décile de l''option
    B (−2,6 M€) ramène la réserve à 15,8 M€, sous le seuil de 16,2 M€ requis aujourd''hui, et très loin
    des 16,9 puis 17,6 M€ requis en N+1 et N+2. **B, au format proposé, tue le transfert.** Ce n''est
    pas une objection prudentielle générale, c''est une incompatibilité directe avec la seule sortie disponible.


    ---


    ## 5. Ce que je fais de chaque option


    **A — Statu quo obligataire : maintenu, et requalifié.** Ce n''est pas une stratégie, c''est le maintien
    de la réserve dans un état intégralement réalisable et non déprécié pendant l''instruction du transfert.
    Sa justification est la liquidité et la stabilité comptable, pas le rendement. Elle est explicitement
    temporaire.


    **B — Diversification : différée, non enterrée.** Reportée jusqu''à la décision du comité d''engagement
    de l''Union. Si le transfert est accepté, la question ne se pose plus. S''il est refusé, B redevient
    l''option de référence — sur une assiette recalibrée pour que le pire décile laisse la réserve au-dessus
    de 13 M€, ce qui limite la tranche à environ 4 M€, non 7,4 M€. Le trésorier a raison de dire que B
    seule ne referme pas l''écart : c''est justement pourquoi B n''est pas la réponse, à aucun moment.


    **C — Refusée.** Sans contrepartie de rendement susceptible de lever le veto.


    **Et la décision que le conseil n''a pas mise à l''ordre du jour : le transfert.** Elle est la seule
    qui protège les affiliés dans tous les scénarios.


    ---


    ## 6. Ce que je propose de voter, et ce sur quoi j''engage la direction


    1. **Rejet de l''option C**, motivé au procès-verbal par l''inadmissibilité du risque de dissolution
    statutaire et par le risque de liquidité, indépendamment du rendement espéré.

    2. **Mandat au président et au trésorier, conjointement, pour déposer le dossier de transfert** auprès
    de l''Union mutualiste de l''Atlantique sous 60 jours. Le trésorier conduit la négociation : son diagnostic
    sur l''insoutenabilité du statu quo est le fondement même de la démarche, et il doit en être porteur,
    pas spectateur.

    3. **Ouverture en parallèle d''un second dossier** (autre union, ou mécanisme de substitution au titre
    du Code de la mutualité, à instruire avec notre conseil juridique), pour ne pas dépendre d''un guichet
    unique dont le comité peut refuser.

    4. **Convocation d''une assemblée générale extraordinaire** dans les quatre mois, sur un ordre du
    jour honnête : relèvement des cotisations de l''ordre de +15 % avec indexation, et/ou révision du
    panier de garanties, présentés comme les termes réels de l''alternative au transfert.

    5. **Expertise indépendante avant tout réexamen éventuel de C** : actuaire externe et commissaire
    aux comptes, sur (i) le traitement comptable d''une note non cotée dans l''assiette du seuil statutaire
    de 11 M€, (ii) la mécanique de coupon, (iii) déclaration écrite d''absence de lien de rémunération
    entre les administrateurs promoteurs et le placeur. Le refus doit être documenté, pas asséné.

    6. **Reporting trimestriel du ratio réserve/prestations** au conseil, à compter de ce trimestre.


    **Je m''engage sur ceci :** que la caisse ne sera pas placée, sous ma direction, dans une position
    où une trajectoire à 3 % ou une immobilisation d''actif prive 4 200 affiliés inassurables de leur
    couverture — et que je considère l''obtention d''une décision du comité d''engagement de l''Union
    comme l''objectif de gestion prioritaire des dix-huit prochains mois, avant tout objectif de rendement.


    ---


    ## 7. Ce qui renverserait cette recommandation


    Je change d''avis, et je le dirai au conseil, si l''un de ces faits est établi **par écrit et par
    un tiers** :


    - l''Union notifie que notre dossier est irrecevable ou pré-refusé — alors la hiérarchie des options
    change entièrement, et B revient au premier plan ;

    - l''Union confirme une dérogation au critère des trois années, ou une appréciation du ratio à la
    date de dépôt — cela desserre le calendrier et permet de rouvrir B plus tôt ;

    - la note C s''avère disposer d''une sortie effective à valeur liquidative et d''une protection du
    capital indépendante du crédit de l''émetteur, avec coupon distribué en numéraire — ce ne serait alors
    plus l''instrument décrit dans le dossier, et il faudrait le réexaminer sur pièces ;

    - l''assemblée générale vote un relèvement des cotisations de nature à rétablir l''équilibre technique
    — alors la caisse redevient autonome et le transfert cesse d''être une nécessité.


    ## 8. Déclencheurs de repli, observables


    - **Ratio réserve/prestations < 3,0 à une clôture trimestrielle** → information immédiate du conseil
    ; la fenêtre de transfert est engagée.

    - **Dossier non formellement accepté en instruction sous 90 jours** → activation du second candidat
    et convocation de l''AG extraordinaire sans attendre.

    - **Réserve < 13 M€** → AG extraordinaire obligatoire et préparation d''une extinction ordonnée négociée,
    plutôt qu''une liquidation subie à 11 M€.


    ---


    **Première action, dès vendredi matin :** courrier au comité d''engagement de l''Union mutualiste
    de l''Atlantique demandant (i) la date d''appréciation du ratio et (ii) la liste des pièces du dossier.
    C''est l''action qui a le plus de valeur par euro dépensé, et c''est la seule dont le coût augmente
    chaque semaine où on ne la fait pas.


    ---


    *Deux hypothèses sont explicitement portées au débat et doivent être vérifiées avant jeudi : la capitalisation
    du coupon de C (point 3.c), et la date d''appréciation du ratio par l''Union (point 4). La première
    change la nature du risque de C ; la seconde change le calendrier, pas la recommandation.*

    '
