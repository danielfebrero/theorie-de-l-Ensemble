  text: 'L''écriture du fichier n''a pas été autorisée — voici la note directement.


    ---


    # Note de position — Lot F-2418 / réclamation Sodimarché (21 400 €)


    **Destinataire :** assureur, service juridique — *copie : direction, qualité, conseil*


    ## 0. Méthode


    Chaque fait est suivi de sa pièce. Les énoncés sans pièce sont regroupés au § 3 et **ne doivent être
    repris comme faits dans aucun courrier sortant**. Le dossier comporte sept documents : deux ne sont
    pas exploitables en l''état (P2 pour partie, P7 en totalité), et **le contrat lui-même n''y figure
    pas**.


    ## 1. Chronologie établie par les pièces


    | Heure (3 juin) | Fait | Pièce |

    |---|---|---|

    | 6 h 25 | Fin de chargement, produit à 3 °C | P1 |

    | — | Mention manuscrite « départ 6 h 40 » | P2 — **inexacte, § 2.3** |

    | 9 h 05 | Mise sous tension du groupe froid | P5 |

    | 9 h 05 → 12 h 55 | 2,9 à 3,6 °C | P5 |

    | 11 h 12 | Sortie du site (horodatage automatique) | P3 |

    | 12 h 55 | Réception, **1 792** barquettes | P4 |


    Trois durées en découlent : **2 h 40** sans aucune donnée de température (P1→P5) ; **4 h 47** de stationnement
    du véhicule chargé **sur notre site** (P1→P3) ; **1 h 43** de transport effectif, intégralement sous
    température maîtrisée. Écart quantitatif : **1 840 (P2) − 1 792 (P4) = 48 barquettes**, inexpliqué
    par toute pièce.


    ## 2. Ce que l''entreprise reconnaît


    Reconnu envers l''assureur **et en substance envers le dépôt** : une position démentie par ses propres
    pièces ne se défend plus sur rien d''autre.


    **2.1** L''absence de données de température entre 6 h 25 et 9 h 05 (P1+P5). Conséquence assumée :
    **nous ne pouvons pas prouver le respect de la plage 0–4 °C sur ce créneau.**


    **2.2** Le stationnement du véhicule chargé sur notre site jusqu''à 11 h 12 (P3). Ce créneau relève
    de nos quais — **aucun report sur le transporteur ni sur le dépôt** pour 6 h 25 – 11 h 12.


    **2.3** L''inexactitude de « départ 6 h 40 » (P2), contredite par l''horodatage automatique (P3).
    **Nous retenons P3 et n''invoquerons le BL sur aucun point horaire.** Le réceptionnaire a contresigné
    une réception, pas une heure de départ ; nous ne soutiendrons pas le contraire.


    **2.4** Un manquement procédural interne : ni groupe ni enregistreur mis en service au chargement,
    alors que le produit était conforme à 3 °C (P1).


    *Cela ne vaut ni reconnaissance du lien de causalité, ni reconnaissance du montant.*


    ## 3. Ce que l''entreprise conteste


    **3.1 — Le montant, intégralement, faute de pièce.** Aucune ventilation, aucune facture de destruction
    ou de transport, aucun calcul de pénalité. Le principe d''indemnisation n''est pas contesté ; un montant
    global injustifié l''est.


    **3.2 — L''assiette : 1 792, pas 1 840.** Le dépôt ne peut réclamer la destruction de marchandises
    que sa propre pièce dit ne pas avoir reçues.


    **3.3 — La destruction.** Aucune pièce ne l''établit, et rien n''indique que nous ayons été mis en
    mesure d''assister à un constat contradictoire. Si elle a eu lieu ainsi, **elle nous a privés d''un
    moyen de preuve** — soulevé expressément.


    **3.4 — La valeur probante de P6.** Pas le chiffre : son opposabilité, pour ce que la pièce ne contient
    pas — 3 barquettes sur 1 792 (**0,17 %**) sans plan d''échantillonnage ; laboratoire mandaté unilatéralement
    ; ni date, ni heure, ni opérateur, ni scellés ; **aucune donnée sur la conservation entre 12 h 55
    et l''analyse**, soit le créneau sous maîtrise du dépôt ; aucun échantillon témoin.


    **3.5 — La pénalité de rupture d''assortiment**, dont la base et le calcul ne figurent nulle part.


    **3.6 — La qualification.** La flore mésophile aérobie est un indicateur d''hygiène des procédés,
    non un critère de sécurité au sens du règlement (CE) 2073/2005 ; son dépassement n''emporte pas par
    lui-même obligation de retrait (art. 19, règl. 178/2002) — *à confirmer par le responsable qualité
    au regard du PMS*. Le non-respect du seuil contractuel de 10⁵ reste, lui, entier.


    ## 4. Ce qui n''est établi par aucune pièce — ne pas affirmer


    **4.1** Que le groupe était **à l''arrêt** avant 9 h 05. P5 établit une mise sous tension et un silence
    antérieur. Savoir si l''enregistreur est alimenté par le groupe ou de façon autonome n''est documenté
    nulle part (→ P8). Écrire « créneau non documenté », jamais « groupe à l''arrêt ».


    **4.2** Que le produit a **effectivement** dépassé 4 °C. L''absence de preuve de conformité n''est
    pas la preuve de la non-conformité : produit à 3 °C au chargement, caisse fermée, et ni la température
    ambiante du 3 juin ni l''inertie de la caisse ne sont documentées. C''est la seule ligne défendable
    ici — nous ne prouvons pas la conformité, le dépôt ne prouve pas la non-conformité.


    **4.3** La cause du dépassement : flore initiale à la fabrication ? créneau 6 h 25–9 h 05 ? conservation
    au dépôt après 12 h 55 ? **Nos analyses de libération du lot trancheront en grande partie (→ P10)
    — nous les produirons quel qu''en soit le résultat.**


    **4.4** Le sort des 48 barquettes. **4.5** Le statut du transporteur (propre ou sous-traitant).


    **4.6 La date de la réclamation, donc le point de départ des huit jours.** Aucune pièce. Ne pas calculer
    : **répondre tout de suite**, et réclamer copie datée.


    **4.7** Le contenu exact des clauses invoquées (0–4 °C, 10⁵, huit jours, pénalité).


    **4.8 P7 n''est pas une pièce** : appel téléphonique non signé, non daté, imprécis, et « parti tôt
    » est contredit par P3. **Ne pas transmettre.** À remplacer par une attestation écrite (art. 202 CPC)
    portant sur des faits vérifiables (→ P9).


    ## 5. Ce que l''entreprise engage sous huit jours


    | Action | Échéance |

    |---|---|

    | **Réponse écrite au dépôt** (annexe B), LRAR + courriel, sans attendre l''instruction | **J+0**
    |

    | **Traçabilité** : les 48 barquettes, tous les lots du même chargement, toutes les expéditions du
    3 juin — un défaut de mise en service qui s''est produit une fois a pu se produire plusieurs fois
    | **48 h** |

    | Déclaration sinistre ; **si le transport est sous-traité**, délais de protestation très brefs et
    prescription annale → actes conservatoires à faire vérifier immédiatement | **J+1** |

    | Attestation écrite du chauffeur (P9) | J+3 |

    | Dossier de pièces P8–P15, y compris celles qui ne nous servent pas | J+5 |

    | Action corrective : groupe + enregistreur **avant** chargement, contrôle documenté au départ, blocage
    du BL tant que l''enregistrement n''est pas actif — sans valeur de reconnaissance | J+8 |


    **Pièces à produire :** P8 notice/étalonnage/export brut de l''enregistreur · P9 attestation chauffeur
    · P10 analyses de libération F-2418 · P11 contrat-cadre et annexes · P12 contrat de transport · P13
    procédure d''expédition en vigueur · P14 export brut du portique · P15 traçabilité et sort des 48.


    **À réclamer au dépôt :** réclamation datée · rapport de laboratoire complet · certificat de destruction
    · explication de l''écart 1 840/1 792 · relevés de température de réception et de chambre après 12
    h 55 · ventilation des 21 400 € et clause fondant la pénalité.


    ## 6. Position de synthèse


    > L''entreprise reconnaît qu''entre 6 h 25 et 9 h 05 la température du lot F-2418 n''a fait l''objet
    d''aucun enregistrement, que le véhicule est demeuré sur son site jusqu''à 11 h 12, et qu''elle ne
    peut donc prouver le respect de la plage contractuelle sur ce créneau. Elle en tire les conséquences
    internes sans attendre.

    >

    > Elle conteste, faute de pièce, le montant de 21 400 €, son assiette (1 792 et non 1 840), la réalité
    et la régularité de la destruction, la valeur probante d''une analyse portant sur 0,17 % du lot hors
    procédure contradictoire, et le fondement de la pénalité.

    >

    > Aucune pièce n''établit le lien de causalité entre le créneau non documenté et le résultat microbiologique,
    trois explications demeurant ouvertes.


    ## 7. Ne doit pas figurer dans le courrier au client


    Toute reprise de « départ 6 h 40 » ; les hypothèses du § 4.3 présentées comme des faits — l''imputation
    au dépôt de la conservation post-réception est **une question à poser, pas une accusation** ; l''enquête
    du § 5 tant qu''elle n''est pas close ; P7. Le courrier **reconnaît en revanche le créneau non documenté**
    : le dépôt peut obtenir les données de l''enregistreur, et les taire pour les voir surgir ensuite
    coûterait plus cher.


    ## Annexe B — Projet de courrier (dans les huit jours)


    > **LRAR + courriel** — Objet : lot F-2418 livré le 3 juin, votre réclamation de 21 400 € — **réponse
    dans le délai contractuel de huit jours**

    >

    > Madame, Monsieur,

    >

    > Nous accusons réception de votre réclamation et vous adressons, dans le délai contractuel de huit
    jours, la présente réponse écrite, qui vaut contestation expresse et fait obstacle à toute acquisition
    de plein droit de la pénalité invoquée.

    >

    > **1.** Nos vérifications établissent que le lot a été chargé à 3 °C à 6 h 25, que l''enregistrement
    de température embarqué ne débute qu''à 9 h 05, et que le véhicule a quitté notre site à 11 h 12.
    Nous vous le signalons sans détour : **sur le créneau de 6 h 25 à 9 h 05, nous ne disposons d''aucun
    relevé.** Une action corrective sur la mise en service des équipements frigorifiques avant chargement
    est engagée et vous sera communiquée. Cette information ne vaut reconnaissance ni du lien de causalité
    supposé, ni des sommes réclamées.

    >

    > **2.** Nous contestons en revanche :

    > - **le montant**, opposé globalement sans ventilation ni justificatif — dont nous vous demandons
    le détail par poste ;

    > - **les quantités** : votre bon de réception porte 1 792 barquettes contre 1 840 au bon de livraison
    ; aucune indemnité ne saurait porter sur des marchandises que vos propres documents indiquent ne pas
    avoir reçues, et nous vous demandons de nous éclairer sur cet écart de 48 unités ;

    > - **la destruction** : aucun certificat ne nous est parvenu et **nous n''avons été ni informés ni
    invités à un constat contradictoire préalable** ; si la marchandise a été détruite dans ces conditions,
    nous avons été privés de toute contre-analyse, et nous formulons les plus expresses réserves ;

    > - **l''analyse** : trois barquettes, soit 0,17 % du lot, sans plan d''échantillonnage, sans procédure
    contradictoire, sans date ni conditions de prélèvement, et sans indication des conditions de conservation
    dans vos installations entre 12 h 55 et le prélèvement — nous vous demandons le rapport complet et
    vos relevés de température sur cette période ;

    > - **la pénalité** : merci de nous indiquer la stipulation qui la fonde et son mode de calcul ;

    > - **la qualification** : le paramètre en cause est un indicateur d''hygiène des procédés et non
    un critère de sécurité sanitaire ; nous ne pouvons souscrire à une présentation du lot comme impropre
    à la consommation.

    >

    > **3.** Nous vous demandons enfin copie datée de votre réclamation initiale.

    >

    > Nous restons disposés à un examen conjoint et, si vous le jugez utile, à la désignation d''un expert
    commun. La présente est adressée sous les plus expresses réserves de fait et de droit, notre assureur
    étant saisi.


    ---


    **Trois arbitrages à valider avant envoi.** D''abord, j''ai fait reconnaître le trou de 2 h 40 au
    dépôt lui-même, pas seulement à l''assureur : c''est le choix contestable de cette note, mais l''enregistreur
    est produisible en expertise et une reconnaissance tardive coûterait la crédibilité du reste. Ensuite,
    la mention « 6 h 40 » du BL est neutralisée partout — c''est votre pièce qui est fausse, et P3 est
    une écriture automatique. Enfin, **la priorité réelle n''est pas les 21 400 €** : si le groupe n''a
    pas été enclenché ce matin-là, il faut savoir sous 48 h ce que ce camion transportait d''autre et
    ce que les mêmes quais ont expédié le 3 juin. Le sort des 48 barquettes relève de la même vérification.

    '
