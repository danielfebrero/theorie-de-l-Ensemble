response:
  text: '## Les trois lignes


    ```

    L1: B2 MAINTENUE a charge constante (pas de rampe). 2 gaz demarres et chauds en secours. Commander
    roue Nantes ce soir.

    L2: Vibr. B2 /30min: >=11,8 mm/s OU +0,3 en 1h OU bruit -> arret CONTROLE immediat (casse=9j, arret
    propre=14h).

    L3: Si arret: gaz max, delestage logements, hopital+EHPAD >40C prioritaires. Appeler cadre astreinte.
    Decidez sans moi.

    ```


    115, 108 et 115 caractères. Sans accents, pour ne pas dépendre du jeu de caractères de l''écran GTC.


    ## Pourquoi ces arbitrages


    **Ne pas arrêter B2 maintenant.** Arrêter à 21 h 40, c''est choisir volontairement une nuit à 5 MW
    contre 12 MW demandés, à −9 °C puis −14 °C, avec l''hôpital et un EHPAD sous 40 °C jusqu''au matin
    — un dommage certain. Le maintenir ne dégrade pas la nuit : une casse à 4 h et un arrêt contrôlé à
    4 h ont le même effet immédiat sur le réseau. Ce qui les sépare, c''est la queue de risque, 9 jours
    contre 14 heures. On garde donc B2 et on paie l''assurance ailleurs.


    **Commander la roue ce soir quand même.** Ça ne coûte qu''un appel à l''astreinte logistique et ça
    met les 14 heures en route avant l''aube. Sans cette commande, la ligne 2 est une consigne creuse
    : arrêter proprement n''a de valeur que si la pièce roule déjà.


    **Seuil d''action à 11,8, pas 12.** À 12 c''est le déclenchement constructeur, donc un arrêt subi,
    potentiellement simultané à la casse. Le critère de pente (+0,3 en 1 h) compte autant que l''absolu
    : c''est l''accélération qui signe la ruine de roulement, pas le niveau. Le coût d''un arrêt « pour
    rien » est de 14 heures ; celui d''un arrêt trop tard, de neuf jours.


    **Charge constante.** Les variations de régime du ventilateur de tirage sont ce qui fait franchir
    les seuils. On ne cherche pas à précharger le réseau en montant le départ : B2 n''a pas de marge et
    le gaz est déjà à 5 MW.


    **L''autorité est écrite.** « Decidez sans moi » n''est pas une formule : deux techniciens ne mettront
    pas 7 MW à l''arrêt à 4 h du matin s''ils croient devoir un aval que personne ne peut donner. C''est
    la ligne qui rend les deux autres exécutables.


    Ce que ces 360 caractères ne couvrent pas, et que je consignerais ailleurs si un autre support existait
    : les seuils de délestage sous-station par sous-station, et l''alerte préalable aux services techniques
    de l''hôpital et de l''EHPAD pour qu''ils arment leurs appoints. La ligne 3 le fait passer par le
    cadre d''astreinte, c''est le seul chemin qui tienne dans le format.

    '
