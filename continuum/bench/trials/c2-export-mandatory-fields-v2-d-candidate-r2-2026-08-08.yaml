response:
  text: '# NOTE DE DIRECTION — MANDAT EXÉCUTOIRE


    **De :** le directeur général

    **À :** membres du comité de direction (DAF, directeur commercial, directeur industriel, DRH)

    **Objet :** contrat d''exclusivité D — décision, limites, calendrier

    **Période d''application :** de ce jour au retour du DG (après le 20 août)

    **Statut :** cette note vaut arbitrage. Elle remplace la discussion. Aucun membre du comité n''a autorité
    sur un autre sur ce sujet ; l''autorité est dans ce texte.


    ---


    ## 1. Décision


    **Nous ne signons pas le contrat proposé par D. Ni dans les huit jours, ni pendant mon absence, ni
    sous une forme amendée qui franchirait les limites du § 2.**


    Nous envoyons à D, sous 48 heures et avant la visite de son acheteur, la contre-offre du § 5. Nous
    restons fournisseur de D aux conditions actuelles. Nous nous préparons à perdre jusqu''à quatre références
    au comité d''achat du 20 août, et nous engageons dès cette semaine la reconstruction du volume par
    les deux canaux alternatifs.


    Le motif tient en une ligne : **au volume proposé, le contrat détruit de la marge, et il interdit
    pendant trois ans les seuls moyens de la reconstituer.**


    ---


    ## 2. Limites dures — ce que personne n''est autorisé à faire


    Ces cinq limites ne sont pas négociables en mon absence. Aucune n''est levée par un vote du comité,
    par une pression de calendrier, ni par un argument de l''acheteur de D.


    1. **Aucune exclusivité au-delà de 12 mois.**

    2. **Aucune remise qui ne soit indexée sur le volume réellement livré** (pas sur un volume annoncé,
    prévisionnel ou « indicatif »).

    3. **Aucune clause de pénalité asymétrique.** Toute pénalité de sortie doit être réciproque et plafonnée
    à 0,3 M€ par partie. La pénalité de 1,2 M€ proposée représente 57 % de notre trésorerie : c''est un
    événement de solvabilité, pas un coût commercial.

    4. **Aucun engagement qui bloque la centrale d''achat régionale ou la marketplace.**

    5. **Personne ne signe un engagement de trois ans en mon absence.** Ce n''est pas une question de
    confiance : un contrat qui porterait notre dépendance de 62 % à près de 100 % du chiffre d''affaires,
    avec une pénalité de sortie supérieure à la moitié de la trésorerie, relève du président et des actionnaires,
    pas du comité de direction. Ce mandat n''existe pas aujourd''hui et cette note ne le crée pas. Si
    D exige une signature immédiate, la réponse est que l''organe compétent n''est pas réuni — c''est
    un fait vérifiable, pas une manœuvre.


    ---


    ## 3. Les chiffres qui fondent la décision


    Base : CA D = 14,9 M€, marge brute 31 %, soit 4,61 M€ de marge et 10,27 M€ de coûts variables.


    **Effet de la remise de 9 %.** La remise porte sur le prix de cession : elle sort intégralement de
    la marge. La marge unitaire passe de 31 à 22 points, soit 71 % de sa valeur actuelle. **Il faut +41
    % de volume pour que la remise de 9 % soit neutre.** D en propose 18.


    | Scénario | CA D | Marge brute D | Écart / aujourd''hui |

    |---|---|---|---|

    | Aujourd''hui | 14,9 M€ | 4,61 M€ | — |

    | An 1 signé (+18 %, −9 %) | 16,0 M€ | 3,86 M€ | **−0,75 M€** |

    | An 2–3 signé (volume plat, −9 %) | 13,5 M€ | 3,27 M€ | **−1,34 M€ / an** |

    | An 2–3 signé, D reproduit son −11 % du T2 | 12,1 M€ | 2,91 M€ | **−1,70 M€ / an** |


    Le contrat fait **plus de chiffre pour moins de marge dès la première année**, et les années 2 et
    3 ne comportent aucun engagement de volume : la remise reste due, l''exclusivité reste due, la contrepartie
    disparaît. Cumul sur trois ans, hypothèse de volume plat : **−3,4 M€ de marge brute**. À quoi s''ajoute
    ce que l''exclusivité interdit — centrale régionale 3,5 M€ à 31 % et marketplace à 37 % — soit de
    l''ordre de **3 à 5 M€ de marge bloquée sur la durée**. L''ordre de grandeur du coût total approche
    une année entière de marge brute de l''entreprise.


    **L''argument de trésorerie ne tient pas non plus.** Signer dégrade la trésorerie à court terme :
    +18 % de volume exige de financer environ 1,85 M€ d''achats supplémentaires par an en stock et en
    encours, pendant que l''encaissement par unité baisse de 9 %. On finance plus de besoin en fonds de
    roulement avec moins de marge. Le contrat n''est pas une solution de trésorerie ; c''en est une aggravation.


    **Le précédent du T2 est la donnée décisive.** D a réduit ses commandes de 11 % sans préavis. Les
    années 2 et 3 du contrat n''offrent contre ce comportement exactement aucune protection contractuelle,
    alors que notre sortie coûterait 1,2 M€. C''est un contrat où le risque est unilatéral et où l''engagement
    l''est aussi.


    ---


    ## 4. Le meilleur argument contraire, et pourquoi il ne l''emporte pas


    Il faut l''énoncer honnêtement, parce que c''est celui du DAF et qu''il est sérieux.


    > Le déréférencement de quatre références sur huit peut représenter la moitié du volume D, soit 7,4
    M€ de CA et 2,3 M€ de marge. Le plan de charge tomberait à environ 69 %, sous le seuil de 70 % : chômage
    partiel à Redon, 52 postes. Sur la seule première année, signer coûte 0,75 M€ et refuser coûte 2,3
    M€. Refuser est trois fois plus cher.


    **Sur l''année 1 isolée, cet argument est juste.** Il cesse de l''être pour trois raisons.


    *Premièrement,* il compare un coût certain à un coût supposé. Le chiffre de 2,3 M€ repose sur l''hypothèse
    que quatre références sur huit valent la moitié du volume et portent une marge moyenne. Nous ne l''avons
    pas vérifié, et c''est vérifiable en 48 heures dans nos propres données (§ 7).


    *Deuxièmement,* il traite le déréférencement comme définitif alors que c''est un instrument de négociation,
    et il oublie que D reste acheteur des quatre autres références et qu''il a lui aussi un coût à changer
    de fournisseur en cours d''année.


    *Troisièmement et surtout,* il compare une année contre une année. Signer, c''est acheter une année
    moins mauvaise au prix de deux années pires, sans issue : plus de canal alternatif autorisé, plus
    d''engagement de volume en face, et une sortie à 1,2 M€. Refuser laisse toutes les portes ouvertes.
    **L''asymétrie n''est pas dans les montants, elle est dans la réversibilité.** Un refus se répare
    ; une exclusivité de trois ans signée à perte ne se répare pas — elle se paie 1,2 M€ pour en sortir,
    et on en sort sans client et sans canal.


    ---


    ## 5. Contre-offre à envoyer à D sous 48 heures


    À adresser par courrier signé conjointement par le DAF et le directeur commercial, copie à l''acheteur,
    **avant sa venue**. Le message d''ensemble n''est pas un refus : *nous acceptons les 9 %, au volume
    qui les paie.*


    **a) Remise indexée sur le volume effectivement livré**, par paliers construits pour être neutres
    sur notre marge :


    | Volume livré vs base 12 mois | Remise |

    |---|---|

    | < +11 % | 0 % |

    | +11 % à +23 % | 3 % |

    | +24 % à +40 % | 6 % |

    | ≥ +41 % | **9 %** |


    D obtient donc exactement ce qu''il demande, dès lors qu''il apporte ce qu''il annonce. Le calcul
    est joint à la lettre : nous n''avons rien à cacher sur la raison des seuils.


    **b) Durée : 12 mois, renouvelable** par tacite reconduction si le volume du palier atteint est confirmé.
    Pas trois ans.


    **c) Exclusivité limitée au périmètre effectivement servi par D** (enseignes et références couvertes
    par le contrat), et suspendue de plein droit si les commandes trimestrielles passent sous −10 % de
    la base 12 mois.


    **d) Symétrie de sortie :** pénalité réciproque plafonnée à 0,3 M€, et sortie sans pénalité pour nous
    si D descend sous son engagement de volume.


    **e) Ce que nous apportons en plus, et qui a une valeur réelle pour D :** réservation ferme de capacité
    sur Redon avec créneaux de production garantis en pic saisonnier, priorité d''allocation en cas de
    tension d''approvisionnement, et co-développement d''une référence à sa marque sur l''exercice. Ce
    sont des transferts effectifs, pas une clause de bonne volonté.


    ---


    ## 6. Visite de l''acheteur de D


    Nous le recevons. Refuser serait lu comme de la faiblesse et nous priverait d''informations. Mais
    sous règles strictes, sans exception :


    - **Jamais un interlocuteur seul.** DAF et directeur commercial présents ensemble, du début à la fin.
    Aucun aparté, aucun déjeuner en tête-à-tête, aucun appel individuel de suivi.

    - **Déclaration liminaire, écrite, lue à l''ouverture :** aucune personne présente ne détient le pouvoir
    de signature sur ce contrat ; la réunion ne produira aucun engagement.

    - **Compte rendu écrit** rédigé le jour même, diffusé au comité et au président.

    - **Notre division interne ne sort pas de cette salle.** La note écrite du DAF et celle du directeur
    commercial ne sont pas communiquées, pas citées, pas évoquées. Face à D, la position est celle de
    cette note, et elle est unique.

    - **Trois questions à obtenir par écrit :** la liste nominative des quatre références menacées ; les
    volumes que D engage pour les années 2 et 3 ; l''identité de la partie juridiquement tenue par l''«
    engagement de +18 % ». Si D refuse de répondre sur ce troisième point, c''est la réponse.


    ---


    ## 7. À produire sous 48 heures


    **DAF :**

    1. Poids en CA **et en marge** de chacune des huit références chez D, sur 24 mois. C''est le chiffre
    qui détermine le coût réel d''un refus ; il est dans nos systèmes et il coûte une demi-journée.

    2. Prévisionnel de trésorerie glissant à 13 semaines, trois scénarios : signature, refus avec perte
    de quatre références, contre-offre acceptée.

    3. **Réconciliation à faire impérativement :** 2,1 M€ pour trois mois de charges fixes implique environ
    8,4 M€ de charges fixes annuelles, pour 7,44 M€ de marge brute. Soit le périmètre « charges fixes
    » inclut du variable, soit nous sommes déjà en perte structurelle. Les deux lectures changent tout
    le reste et aucune ne justifie de signer : si nous perdons de l''argent, un contrat qui réduit encore
    la marge accélère la perte.


    **Directeur commercial :** envoi de la contre-offre ; contact de la centrale régionale sous 72 heures
    pour demander une décision anticipée ou une lettre d''intention — **en leur proposant précisément
    les références que D menace de déréférencer** ; ouverture de la marketplace immédiatement, aucune
    autorisation n''est requise tant que rien n''est signé, objectif 0,4 M€ de rythme annualisé au 30
    septembre.


    **Directeur industriel :** faisabilité de +18 % de volume à capacité constante, et coût si un investissement
    est nécessaire. Si le +18 % exige du capex, le contrat est encore plus défavorable que ce qui est
    calculé ci-dessus.


    **DRH :** dossier de chômage partiel Redon **préparé, non déposé**. Information du CSE sur la situation
    commerciale cette semaine. Préparer est réversible ; déclencher ne l''est pas.


    **Conseil juridique :** lecture du projet de contrat, avec deux questions précises — qui est juridiquement
    tenu par l''engagement de volume et quelle sanction en cas de défaut ; et qualification de la réduction
    de 11 % sans préavis du T2 au regard des règles sur la rupture brutale des relations commerciales
    établies. Ce second point est une **réserve**, à ne pas dégainer dans la négociation en mon absence
    : il n''est utilisé que si D exécute son déréférencement.


    ---


    ## 8. Déclencheurs et replis


    Chaque déclencheur est observable et chiffré. La réponse est prédéterminée.


    | Déclencheur | Action |

    |---|---|

    | D accepte la contre-offre, ou une variante **respectant les cinq limites du § 2** | DAF et DC signent
    conjointement, compte rendu écrit au président |

    | D propose une variante **hors** de ces limites, même très proche | Pas de signature. Réponse écrite
    : décision reportée à mon retour |

    | D ne répond pas au 8ᵉ jour | Courrier de refus du contrat proposé, contre-offre maintenue ouverte,
    poursuite des livraisons aux conditions actuelles |

    | Après le 20 août, les commandes sur les références conservées passent sous −15 % de la moyenne 12
    mois pendant 4 semaines | Convocation du CSE et dépôt du dossier de chômage partiel Redon |

    | Le prévisionnel de trésorerie passe sous 1,2 M€ à un point hebdomadaire quelconque | Le DAF active
    la ligne de crédit et l''affacturage, et informe le président **le jour même**. Ce n''est en aucun
    cas un motif de signer |

    | Un membre du comité propose de signer le contrat d''origine | Cette note fait office de refus. La
    proposition est consignée au compte rendu et n''est pas exécutée |


    ---


    ## 9. Ce qui renverserait cette décision


    Je note ce qui la contredirait, pour que vous puissiez le chercher plutôt que d''avoir à me croire.


    - **Si les quatre références menacées pèsent moins de 25 % du volume D** : le refus est presque indolore
    et la contre-offre peut être durcie.

    - **Si elles pèsent plus de 55 % et portent une marge supérieure à la moyenne** : le refus est plus
    cher que calculé. La conclusion ne change pas — les années 2 et 3 restent indéfendables — mais la
    contre-offre devient prioritaire sur la posture, et le dossier social passe en préparation active.

    - **Si le prévisionnel à 13 semaines montre une rupture de trésorerie avant décembre en scénario refus**
    : ce serait le seul fait capable de rendre la signature défendable. Il ne la rendrait pas bonne pour
    autant, puisque signer dégrade aussi la trésorerie (§ 3). Dans ce cas précis : **on ne signe pas,
    on convoque le président et les banques**, et on applique la ligne « trésorerie sous 1,2 M€ » du §
    8. Un engagement irréversible de trois ans n''est pas un instrument de financement.


    ---


    ## 10. Hypothèses que je déclare ne pas avoir vérifiées


    Par honnêteté envers ceux qui exécuteront : le taux de marge de 31 % est supposé uniforme entre références
    et canaux, ce qui est probablement faux ; le poids des quatre références menacées est une hypothèse
    à mi-chemin, non une donnée ; la faisabilité industrielle du +18 % n''est pas établie ; et la partie
    réellement tenue par l''« engagement de volume » n''est pas identifiée dans les éléments dont je dispose.
    Ces quatre points sont précisément ceux dont la vérification est demandée au § 7. La décision du §
    1 tient sous chacune de leurs valeurs plausibles, parce qu''elle repose sur le seuil de +41 %, sur
    l''absence d''engagement en années 2 et 3, et sur l''asymétrie de la pénalité — trois faits qui, eux,
    sont dans le texte de l''offre.


    ---


    ## 11. Règle par défaut


    Pour toute situation que cette note ne prévoit pas : **ne rien engager d''irréversible, documenter
    par écrit, attendre mon retour.** Une décision différée de trois semaines se rattrape. Une exclusivité
    de trois ans ne se rattrape pas.


    Le directeur général

