response:
  text: '# NOTE DE DIRECTION — EXÉCUTOIRE EN MON ABSENCE


    **De :** Direction générale

    **À :** Comité de direction (DAF, Directeur commercial, Directeur industriel, DRH)

    **Date :** 8 août 2026

    **Objet :** Réponse au contrat d''exclusivité D — mandat, limites et règles d''exécution du 9 au 31
    août

    **Statut :** Cette note vaut décision. Elle s''applique telle quelle. Ce qui n''y figure pas n''est
    pas autorisé.


    ---


    ## 0. Cadrage de l''absence


    Je pars le 9 août, je rentre le 31 août. **Le comité d''achat de D en septembre se tiendra après mon
    retour : je le traiterai moi-même.** Vous n''avez donc à arbitrer qu''une seule chose en mon absence
    : la réponse à envoyer sous huit jours, plus la mise en route des chantiers ci-dessous. Ne prenez
    aucune décision qui anticipe septembre.


    Notez aussi ceci : un ultimatum de huit jours posé à la veille du 15 août est un choix de calendrier,
    pas une contrainte industrielle. Il est fait pour être subi. Nous répondrons dans les délais, mais
    sur notre texte.


    ---


    ## 1. DÉCISION — ferme, non délégable


    **Nous ne signons pas le contrat d''exclusivité proposé par D. Ni en l''état, ni amendé à la marge,
    ni pendant mon absence, ni sous menace de déréférencement.**


    Nous répondons par une contre-proposition écrite (§4), envoyée au plus tard le **13 août**, avec maintien
    explicite de la relation commerciale et des livraisons.


    ---


    ## 2. Le calcul qui fonde cette décision — à connaître par cœur, vous devrez le défendre


    Marge brute 31 %. Sur le périmètre D (14,9 M€) : marge ≈ 4,62 M€, coûts variables ≈ 10,28 M€.


    | Scénario | CA périmètre D | Marge brute D | Écart |

    |---|---|---|---|

    | Aujourd''hui | 14,90 M€ | **4,62 M€** | — |

    | Signé, +18 % de volume **tenu** (an 1) | 16,00 M€ | **3,87 M€** | **−0,75 M€** |

    | Signé, an 2-3, volume revenu à la base | 13,56 M€ | **3,28 M€** | **−1,34 M€ / an** |


    Trois conclusions, et elles sont arithmétiques, pas stratégiques :


    1. **Le meilleur scénario du contrat est déjà perdant.** Même si D tient son engagement de +18 %,
    nous perdons 750 k€ de marge la première année.

    2. **Le volume qui rendrait la remise neutre est de +41 %, pas +18 %.** C''est le chiffre central
    de toute la négociation. Nous n''achetons pas du volume, nous finançons une remise.

    3. **L''asymétrie est totale sur les années 2 et 3 :** la remise de 9 % est ferme, le volume n''est
    qu''indicatif. Nous cédons trois ans de prix contre douze mois d''engagement. Coût cumulé du scénario
    réaliste sur trois ans : **≈ 3,4 M€ de marge brute** — soit près de trois fois la pénalité de sortie.
    Un contrat qu''on a intérêt à quitter dès la signature n''est pas un contrat, c''est une dette.


    **Point bloquant supplémentaire — à faire trancher avant toute discussion :** la clause interdit «
    toute vente par un autre canal ». Lue littéralement, elle nous fait perdre aussi les 9,1 M€ hors D
    (2,82 M€ de marge) et rend illégales la centrale régionale et la marketplace. Si D confirme cette
    lecture, la discussion s''arrête là et vous le lui écrivez en une ligne. **Cette clarification est
    le premier point de notre courrier.**


    **Enfin, la pénalité de 1,2 M€ représente 57 % de notre trésorerie.** Nous n''avons pas les moyens
    de nous tromper de manière irréversible. Le chômage partiel se défait ; une exclusivité de trois ans,
    non.


    ---


    ## 3. Vérification à faire sous 48 h (DAF) — elle ne change pas la décision, elle change l''urgence
    du reste


    2,1 M€ = trois mois de charges fixes implique ≈ 8,4 M€ de charges fixes annuelles, pour 7,44 M€ de
    marge brute. **Si ces deux chiffres sont exacts, nous sommes déjà en perte structurelle**, et une
    remise de 9 % (−1,34 M€ de marge) est purement inabsorbable. Le DAF reconstitue le pont marge brute
    → EBITDA et me transmet la note écrite pour le 31 août. Si l''écart est confirmé, le §7 (trésorerie)
    devient prioritaire sur tout le reste.


    ---


    ## 4. Contre-proposition à D — mandat de négociation et enveloppe de signature


    Le **Directeur commercial** rédige, le **DAF** cosigne et envoie (LRAR + e-mail avec accusé), **au
    plus tard le 13 août**. Ton : ferme, coopératif, aucune menace, aucune allusion au juridique.


    **Termes que vous êtes autorisés à proposer et à signer sans moi :**


    | Point | Position | Limite absolue |

    |---|---|---|

    | Exclusivité | Refusée. Au mieux : priorité de référencement sur le canal GMS de D | **Aucune exclusivité,
    sous aucune forme** |

    | Durée | 12 mois, reconductible | **Jamais > 12 mois** |

    | Remise | Jusqu''à **3 % ferme**, en contrepartie d''un **plancher de volume ferme à 14,9 M€** |
    3 % maximum en inconditionnel |

    | Remise additionnelle | Barème progressif : +3 % au-delà de +25 % de volume, +9 % au-delà de +41
    % — **payée sur le volume réellement livré, pas engagé** | — |

    | Canaux tiers | Centrale régionale, marketplace et vente directe **explicitement exclus** du périmètre
    | Non négociable |

    | Préavis | 6 mois écrits pour tout déréférencement ou baisse > 5 % | Minimum 3 mois |

    | Pénalité de sortie | Aucune, ou symétrique et plafonnée | **≤ 200 k€, jamais unilatérale** |


    **Argument à leur servir, en une phrase :** « Nous pouvons aller jusqu''à 9 % — sur les volumes qui
    financent ces 9 %. En dessous de +41 %, la remise détruit la capacité industrielle qui vous sert.
    »


    **Hors de cette enveloppe, vous ne signez rien.** Si D améliore son offre au-delà, vous accusez réception,
    vous ne vous engagez pas, et vous m''attendez : trois semaines de délai ne coûtent rien face à trois
    ans d''engagement.


    ---


    ## 5. Si D réagit mal — règles de réaction


    - **D refuse et confirme le réexamen de septembre** → réponse type : « nous en prenons acte, nous
    restons à disposition, les livraisons se poursuivent normalement ». **Aucune concession de prix en
    réaction.** Je traite le comité d''achat à mon retour.

    - **D réduit ou suspend des commandes pendant mon absence** → constat écrit sous 24 h, chiffré, envoyé
    à D, sans commentaire ni menace. Application du §7.

    - **D exige une réponse orale immédiate** → « la direction générale a arrêté sa position par écrit,
    la voici, elle n''évoluera pas avant le 31 août ».

    - **D contacte un membre du CODIR individuellement** → il renvoie au DAF. **Un seul interlocuteur,
    une seule voix.**


    ---


    ## 6. Dossier juridique — à constituer, pas à activer


    Le DAF mandate notre conseil (budget ≤ 15 k€) pour une note écrite d''ici le 28 août sur : la baisse
    de 11 % du T2 sans préavis et la menace de déréférencement au regard de la rupture brutale de relations
    commerciales établies (art. L442-1 II C. com.), et le déséquilibre significatif du projet de contrat
    (remise ferme / volume indicatif, pénalité unilatérale).


    **Objectif : disposer de l''option, pas l''exercer.** Aucun courrier d''avocat, aucune mise en demeure,
    aucune mention du sujet à D en mon absence. Constituez le classeur : historique des commandes sur
    36 mois, tous les échanges, tous les comptes rendus de comité d''achat.


    ---


    ## 7. Trésorerie — le vrai garde-fou


    - **Plancher intangible : 1,4 M€.** En dessous, tout décaissement non contractuel est suspendu et
    vous me joignez par tout moyen, y compris via le chantier Maroc.

    - **Avant le 22 août, le DAF négocie une ligne de crédit confirmée ou un contrat d''affacturage de
    1 M€ minimum.** À faire **maintenant**, pendant que D commande normalement et que les comptes sont
    bons. Une ligne se négocie avant d''en avoir besoin ; après, elle ne se négocie plus.

    - **Gel immédiat** de tout investissement > 50 k€ non engagé, hors sécurité et conformité. Le budget
    Maroc reste limité aux engagements déjà contractés — je ne demande aucune rallonge.

    - Reporting trésorerie hebdomadaire à 13 semaines glissantes, tous les vendredis.


    ---


    ## 8. Alternatives — à activer maintenant, pas après


    **Marketplace (Directeur commercial) — lancement immédiat, budget ≤ 120 k€.**

    Mettez en ligne **en priorité les quatre références que D menace de déréférencer**. C''est le meilleur
    usage possible de cette menace : coût faible, marge supérieure de 6 points, et cela crée une option
    extérieure vérifiable avant septembre. Objectif à 12 mois : 0,4 M€ plancher. Premières références
    en ligne avant le 29 août.


    **Centrale d''achat régionale (Directeur commercial + moi à mon retour).**

    Cinq mois est incompatible avec notre horizon. Proposez-leur un **pilote sur 2 références, démarrage
    sous 60 jours**, et demandez une lettre d''intention non engageante avant fin septembre. Rendez-vous
    physique à obtenir avant le 29 août.


    **Diversification (Directeur commercial).** Ouvrez trois pistes qualifiées avant mon retour : restauration
    collective, MDD pour un second distributeur, RHF. Je veux trois noms et trois contacts, pas une étude.


    ---


    ## 9. Redon — 52 postes


    - Suivi hebdomadaire du plan de charge à 8 semaines glissantes (Directeur industriel).

    - **Seuil d''alerte 75 %** : le DRH prépare le dossier d''activité partielle — constitution complète,
    **sans dépôt**.

    - **Seuil 70 %** : dépôt du dossier, information du CSE dans les formes. C''est la seule mesure sociale
    autorisée en mon absence.

    - **Aucun licenciement, aucune rupture conventionnelle, aucune annonce de fermeture, aucune communication
    externe.** Le chômage partiel est réversible ; une annonce ne l''est pas.


    ---


    ## 10. Le meilleur argument contre ma décision — et pourquoi il ne l''emporte pas


    Il faut que vous l''ayez en tête, parce qu''il vous sera opposé, y compris de bonne foi, autour de
    la table.


    *« Signer, c''est +18 % de volume garanti, donc Redon au-dessus de 70 %, donc 52 emplois protégés
    pendant douze mois. Refuser, c''est risquer de perdre quatre références en septembre, sans alternative
    disponible avant cinq mois, avec trois mois de trésorerie. Le calcul de marge est juste, mais on ne
    paie pas les salaires avec de la marge relative. »*


    Cet argument est sérieux. Voici pourquoi il perd :


    Il achète **douze mois** de charge avec **trente-six mois** d''engagement, une pénalité de sortie
    qui vaut la moitié de notre trésorerie, et une clause qui rend nos deux alternatives contractuellement
    impossibles. À l''issue, Redon n''est pas protégé : il est plus exposé, sans autre client, face à
    un partenaire qui saura que nous n''en avons aucun. Et la remise de 9 % dégrade la marge dès la première
    année, y compris dans le scénario où tout se passe bien — c''est-à-dire qu''elle rapproche la date
    du chômage partiel au lieu de l''éloigner. Un déréférencement partiel se rattrape. Une dépendance
    à 100 % contractualisée pour trois ans, non.


    **Ce qui me ferait changer d''avis, et rien d''autre :** que D transforme le volume en engagement
    ferme sur les trois années, avec compensation en cas de non-atteinte, et abandonne l''exclusivité
    sur les canaux tiers. Si D propose exactement cela pendant mon absence, vous notez, vous remerciez,
    **vous ne signez pas** — vous m''attendez le 31 août.


    ---


    ## 11. Interdits absolus — non délégables, aucune exception


    Aucun membre du CODIR, seul ou collectivement, n''est autorisé pendant mon absence à :


    1. Signer une clause d''exclusivité, quelle qu''en soit la durée ou la contrepartie.

    2. Signer un engagement de plus de 12 mois ou une pénalité de sortie supérieure à 200 k€.

    3. Consentir une remise supérieure à 3 % en inconditionnel.

    4. Renoncer contractuellement à la centrale régionale, à la marketplace ou à la vente directe.

    5. Engager une procédure de licenciement ou communiquer publiquement sur Redon.

    6. Descendre la trésorerie sous 1,4 M€.

    7. Céder un actif, un fonds de commerce ou une marque.


    **En cas de désaccord au sein du CODIR, la voix du DAF est prépondérante — mais uniquement à l''intérieur
    de l''enveloppe du §4. Pour tout ce qui en sort, l''arbitre est le président du conseil, que j''ai
    informé et qui dispose de cette note.** Si la situation devient réellement critique — trésorerie sous
    1,4 M€ ou arrêt total des commandes D —, faites-moi joindre par le bureau de Casablanca : je suis
    injoignable par confort, pas par principe.


    ---


    ## 12. Rythme et traçabilité


    - **Comité de crise** tous les lundis 9 h : DAF (président), Directeur commercial, Directeur industriel,
    DRH. Compte rendu écrit, une page, archivé.

    - **Livrables attendus à mon retour le 31 août :** courrier envoyé à D + réponse éventuelle ; pont
    marge/EBITDA du DAF ; ligne de crédit signée ou refus motivé ; état marketplace ; compte rendu du
    rendez-vous centrale ; trois pistes de diversification nommées ; note du conseil juridique ; plan
    de charge Redon à 8 semaines.


    ---


    **En résumé, pour les trois semaines : on ne signe pas, on répond dans les délais sur notre texte,
    on sécurise le cash, on ouvre les canaux alternatifs, on ne touche pas à l''emploi, et on garde toutes
    les portes ouvertes pour septembre — que je traiterai moi-même.**


    Cette note est notre position commune. Si l''un d''entre vous la juge dangereuse, qu''il l''écrive
    au compte rendu du 11 août : je veux le désaccord tracé, pas étouffé. Mais elle s''applique.


    *Le Directeur général*

