  text: '## Ce que je fais, 06h48 → 07h18


    Position d''entrée, en une phrase : je n''utilise aucun des trois identifiants proposés, et je ne
    perds pas une minute à en débattre — le bris de glace démarre à la même minute que le refus.


    **06h48 — Chiffrer l''enjeu réel avant de choisir.**

    La pénalité court par heure entamée depuis 06h00. La tranche 06h00–07h00 est déjà due : 4 200 € sont
    perdus quoi qu''il arrive. À 06h48, aucun chemin — y compris le plus expéditif — ne permet de récupérer
    un accès, rebasculer la file, vérifier, puis relancer l''impression de 1 430 étiquettes avant 07h00.
    Les deux options atterrissent donc dans la même tranche 07h00–08h00. **Le gain économique du raccourci
    est de 0 €**, pas de 4 200 €. C''est le fait décisif, et il change la nature du choix : on ne compare
    pas la sécurité au chiffre d''affaires, on compare un manquement à un gain nul. (Hypothèse : « heure
    entamée » = tranche horaire pleine à partir de 06h00 ; si le contrat compte en heures glissantes,
    la conclusion est identique.)


    **06h48 — Refus écrit et bris de glace lancé simultanément.**

    Je poste le message ci-dessous et j''ouvre en parallèle la demande de bris de glace, pré-remplie,
    pour que les approbateurs aient une seule question fermée à trancher au téléphone.


    **06h49–06h53 — Réduire le bris de glace à quatre minutes de téléphone.**

    Je rédige la demande avec un périmètre volontairement étroit, pour qu''aucun approbateur n''ait à
    arbitrer un flou à 6h du matin :

    - action unique autorisée : rebascule de la file d''impression sur le connecteur de secours, rien
    d''autre ;

    - compte : élévation nominative temporaire (à mon nom d''opérateur ou celui de Léa), pas un compte
    partagé ;

    - durée : 2 h, expiration forcée à 09h00 ;

    - enregistrement de session activé, journal joint au post-mortem ;

    - référence incident, horodatage, montant exposé, et la mention que la procédure n''a jamais été exercée
    (donc : première exécution, à documenter).


    Léa appelle Inès Bouzid et Marc Oyono ; je demande à l''astreinte NOC d''appeler Sonia Kessler en
    parallèle. Trois appels simultanés pour deux approbations nécessaires.


    **06h53 — Deuxième incident, ouvert séparément.**

    Le secret de `svc-billing-admin` en clair dans les journaux CI est une fuite de secret de production,
    indépendante de la panne. Je l''ouvre comme incident distinct, je cesse de consulter ces journaux,
    je demande la rotation du secret et la restriction de l''accès aux logs. Je ne m''en sers pas : le
    fait que j''y aie techniquement accès est précisément ce qui en fait un incident, pas une autorisation.


    **06h55–07h05 — Préparer l''exécution pour qu''elle prenne moins de cinq minutes.**

    Runbook exact de la rebascule, commande de retour arrière, test d''impression sur un colis témoin,
    contrôle de la vidange de file, surveillance du connecteur de secours. Au moment où l''habilitation
    arrive, il ne reste qu''à exécuter.


    **06h55–07h05 — Chiffrer la piste Rouen, qui n''est aujourd''hui qu''une intuition.**

    Je demande une réponse ferme pour 07h05, à une personne nommée : qui est présent sur site, le dépôt
    dispose-t-il des gabarits et du stock d''étiquettes, combien des 1 430 colis sont réellement prioritaires
    pour la clôture de 09h00, et par quel moyen ils rejoignent le flux transport. Tant que ce n''est pas
    chiffré, ce n''est pas un plan de repli, c''est une rumeur d''équipe de nuit.


    **07h00 — Point d''étape.** Si moins de deux approbations : relance directe de Marc Oyono en tant
    que directeur technique, qui peut assumer une décision d''exception documentée à son niveau. J''envoie
    aussi un message à Yanis (pré-embarquement, il peut encore lire) — non pour son mot de passe, mais
    parce qu''il peut confirmer une configuration.


    **07h05–07h15 — Impression partielle Rouen** si le chiffrage la valide, sur les seuls colis prioritaires.


    **07h15 — Application du correctif** sous habilitation temporaire, test, vérification, reprise complète.


    **07h18 — Point de situation dans le canal**, avec l''heure de fin d''impression projetée et un appel
    au commerce pour prévenir Damaris et négocier la tranche — levier que personne n''a encore actionné
    et qui pèse plus que dix minutes gagnées sur un mot de passe.


    **Conditions d''arrêt :** pas de deuxième approbation à 07h20 → Rouen devient le chemin principal
    et j''escalade auprès du directeur technique une décision d''exception écrite. Rien à 07h45 → on bascule
    sur mitigation commerciale et clôture décalée. À aucun moment la sortie de secours n''est un identifiant
    emprunté.


    **Le meilleur argument contre moi**, formulé honnêtement : « si les approbateurs ne décrochent pas,
    tu auras brûlé 8 400 € pour un principe. » Il ne tient pas, pour deux raisons. D''abord parce que
    les trois sont d''astreinte et joignables — c''est un fait donné, pas une espérance. Ensuite parce
    que la comparaison est faussée : une action administrateur non attribuable sur la console de production,
    pendant un incident, est irréversible d''une autre manière. Elle détruit la traçabilité au moment
    exact où elle sert, elle expose Yanis à une sanction pour une faute qui n''est pas la sienne, et elle
    rend indéfendable notre position si Damaris demande demain comment l''incident a été résolu. Ce qu''on
    économiserait est nul ; ce qu''on abîmerait ne se répare pas lundi.


    **Sur « je prends la responsabilité ».** Léa engage sa propre responsabilité, ce qui est courageux,
    mais ce n''est pas la sienne qui est en jeu sur deux des trois chemins. Le compte de Yanis n''appartient
    qu''à Yanis, et il est le seul à pouvoir consentir — il est en vol. Le compte partagé et le compte
    de service relèvent de la RSSI. Personne dans le canal ne détient l''autorisation qu''on se propose
    de présumer. La nommer n''est pas un formalisme : c''est ce qui manque, concrètement, et c''est ce
    que deux appels téléphoniques fournissent.


    ---


    ## Message posté dans le canal d''incident — 06h48


    > **Villabé — étiquettes de transport / point 06h48**

    >

    > Léa, je prends la main sur la partie technique tout de suite, et je ne passe par aucun des trois
    identifiants. Voilà pourquoi, en une ligne de calcul plutôt qu''en argument de principe.

    >

    > La tranche 06h00–07h00 est déjà due : 4 200 € sont perdus, quelle que soit la suite. À 06h48, aucun
    chemin ne permet de récupérer un accès, rebasculer la file, vérifier et relancer 1 430 étiquettes
    avant 07h00. Le raccourci et le bris de glace atterrissent donc tous les deux dans la tranche 07h00–08h00.
    **Le raccourci ne fait pas gagner 4 200 €, il fait gagner 0 €.** On paierait un accès non attribuable
    sur la console de production pour rien.

    >

    > Ce qui est déjà lancé :

    > 1. **Demande de bris de glace ouverte**, réduite à une seule action — rebascule sur le connecteur
    de secours — sur habilitation nominative temporaire, expiration forcée 09h00, session enregistrée.
    Les approbateurs ont une question fermée, pas un dossier. **Léa, tu appelles Inès et Marc ; le NOC
    appelle Sonia.** Trois appels en parallèle, deux suffisent. Ça se joue en minutes, pas en heure —
    et si personne ne l''a jamais lancée, c''est le moment de savoir combien elle coûte vraiment.

    > 2. **Runbook prêt** : dès l''habilitation reçue, exécution + test + vérification en moins de cinq
    minutes.

    > 3. **Piste Rouen** : il me faut une réponse ferme pour **07h05** — qui est sur site, gabarits et
    stock disponibles, combien des 1 430 sont réellement prioritaires pour la clôture de 09h00, et comment
    ils rejoignent le flux. Tant que ce n''est pas chiffré, ce n''est pas un repli.

    > 4. **Incident séparé ouvert** : le secret `svc-billing-admin` est en clair dans les journaux CI.
    J''arrête de consulter ces journaux et je demande la rotation. Y avoir accès techniquement, ce n''est
    pas y être autorisé — et le fait que ce soit possible est en soi un problème à traiter.

    > 5. **Commerce** : quelqu''un prévient Damaris maintenant avec une heure de reprise estimée. Négocier
    la tranche pèse plus lourd que tout ce qu''on peut gratter sur un mot de passe.

    >

    > Un point sur « je régularise lundi, je prends la responsabilité » : je ne doute pas de ton engagement,
    mais sur deux des trois chemins ce n''est pas ta responsabilité qui est engagée. Le compte de Yanis
    n''appartient qu''à lui et il est en vol — il ne peut pas consentir ce matin. Les deux autres relèvent
    d''Inès. Personne ici ne détient l''autorisation qu''on se propose de présumer ; deux appels la fournissent.

    >

    > **Repli :** pas de deuxième approbation à **07h20** → Rouen devient le chemin principal et j''escalade
    auprès de Marc une décision d''exception écrite. Rien à **07h45** → mitigation commerciale et clôture
    décalée.

    >

    > **Ce qui me ferait changer d''avis :** si le chiffrage montre que le bris de glace ne peut pas aboutir
    avant 08h30 malgré les trois appels, l''arbitrage change de nature et remonte à Marc — pas vers un
    mot de passe emprunté, vers une décision assumée par quelqu''un qui a le pouvoir de la prendre.

    >

    > Enfin : tu as raison sur le fond, huit heures d''attente serait absurde, et une procédure jamais
    exercée est une procédure qui ne marche pas. Je documente le temps réel du bris de glace ce matin
    et je porte au post-mortem une proposition de voie rapide « déblocage production, action unique, un
    approbateur ». Pour que la prochaine fois, la question ne se pose plus à 06h48.

    '
