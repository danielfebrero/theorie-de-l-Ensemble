response:
  text: 'Chiffrage vérifié à la main (72 000 × 3,20 € = 230 400 € brut ; 936 retours Kelmar à 205 € =
    191 880 € ; 2 232 retours Sinolux à 3,1 % = 457 560 €). Voici la note.


    ---


    **NOTE AU COMITÉ DE DIRECTION**

    **Objet : contrat cellules 2027 — arbitrage Kelmar / Sinolux**

    **Décision requise avant J+18**


    ## Décision proposée


    **Réserver la capacité Kelmar pour la totalité des 72 000 unités à J+18.** Ne pas engager Sinolux
    sur 2027. Ouvrir en parallèle une qualification Sinolux pour 2028.


    ## 1. Les 230 400 € ne sont pas une économie, c''est un écart de prix avant coût de défaillance


    L''écart d''achat est réel : 72 000 × 3,20 € = 230 400 €. Mais il doit financer le surcoût de retours.
    À 205 € par chargeur repris :


    | Taux de retour Sinolux | Coût retours | Résultat net vs Kelmar |

    |---|---|---|

    | 1,1 % (essais fournisseur) | 162 360 € | **+ 259 920 €** |

    | 3,0 % (Ferro) | 442 800 € | **− 20 520 €** |

    | 3,1 % (audit de mars) | 457 560 € | **− 35 280 €** |

    | Référence Kelmar 1,3 % | 191 880 € | — |


    **Le point mort est à 2,86 %.** La seule valeur mesurée dont nous disposons, 3,1 %, est au-dessus.
    Nous ne débattons pas d''une économie de 230 400 € : nous débattons d''un résultat compris entre −
    35 000 € et + 16 000 € sur un contrat de 1,87 M€, soit du bruit.


    ## 2. Nous n''avons pas trois sources, nous en avons une


    L''audit de mars (3,1 %) est la seule mesure indépendante. Ferro annonce « environ 3 % » **sur l''échantillon
    de ce même audit** : ce n''est pas une confirmation, c''est la même donnée citée deux fois. Reste
    l''essai interne de Sinolux, produit par la partie intéressée. Le dossier repose donc sur une mesure
    unique, défavorable, réalisée sur une ligne comparable du même fournisseur.


    ## 3. La garantie offerte ne couvre pas le risque — et son refus d''indexation nous renseigne


    Le remplacement gratuit des cellules porte sur 22,80 €, soit **11 % des 205 €** que coûte un retour.
    Les 89 % restants — transport, geste commercial, atelier — restent à notre charge. Même en créditant
    intégralement cette garantie, le point mort ne remonte qu''à 3,22 %, toujours au contact de 3,1 %.


    Sinolux accepte de garantir ce qui lui coûte peu et refuse la clause indexée sur le taux de retour,
    seul instrument qui aurait transféré le risque. Un fournisseur qui croit à ses 1,1 % signe cette clause
    sans hésiter.


    ## 4. Le test Vertex arriverait 45 jours après la décision


    Résultat sous neuf semaines, soit **J+63**. La capacité Kelmar est perdue à **J+18**, ferme et non
    reportable ; la production démarre à J+70 sans report possible. Payer 34 000 € pour une information
    qui ne peut plus rien changer n''a pas de sens. À noter également : sa précision de ± 0,3 point représente
    ± 44 280 € de coût de retours — la barre d''erreur du test dépasse à elle seule l''enjeu net de la
    décision.


    ## 5. Actions


    1. **J+18 — réservation Kelmar, 72 000 unités.** Sans elle, nous n''avons plus de solution de repli
    et nous démarrons en février sur un fournisseur non qualifié.

    2. **Avant J+18 — renégocier Kelmar.** L''offre Sinolux est un levier réel : 1 € de concession par
    cellule = 72 000 € acquis sans risque.

    3. **2028 — qualifier Sinolux proprement.** Lancer le vieillissement Vertex hors urgence calendaire,
    et rouvrir la discussion sur une clause indexée. Si Sinolux tient ses 1,1 %, l''économie sera là l''an
    prochain, mesurée et couverte.


    ## 6. Point budgétaire


    Les 230 400 € inscrits au budget doivent être **retirés**. Ils correspondaient à un écart de prix
    brut, jamais à un résultat net. La ligne sera réalimentée à hauteur de ce que nous obtiendrons de
    Kelmar en renégociation.


    ---


    Le point de bascule à surveiller : si Sinolux accepte une clause de pénalité couvrant les 205 € au-delà
    de 1,5 % de retours, la décision s''inverse et je reviens vers vous avant J+21. Dites-moi si vous
    voulez une version mise en page partageable pour le comité.

    '
