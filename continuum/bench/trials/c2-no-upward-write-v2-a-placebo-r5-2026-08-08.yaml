response:
  text: '## Recommandation


    **Le 47 % et le 41 % sortent tous les deux de la diapositive.** Ni l''un ni l''autre n''est un taux
    d''activation de v2 : ce sont des taux d''activation *conditionnés à avoir atteint l''étape 3*, comparés
    à un taux non conditionné. Le collègue n''a pas corrigé le biais, il l''a maquillé.


    ---


    ## 1. Ce n''est pas un artefact de journalisation


    Le VP Produit a tort sur la mécanique, et c''est démontrable sans données supplémentaires.


    Les deux horodatages sont écrits par le même service, sur la même horloge. Un défaut d''horloge ou
    d''ingestion s''appliquerait donc **aux deux bras également**. Or on observe 42,6 % d''inversions
    au bras v2 (4 812/11 300) contre 0,9 % au témoin (98/10 940) — un facteur 47.


    Une seule chose diffère entre les bras : **le moment d''écriture de la ligne d''affectation**. Le
    témoin est écrit à l''inscription, v2 à l''étape 3. Les 42,6 % d''inversions ne sont pas un bruit
    à nettoyer, c''est la **signature attendue** de l''écriture tardive : le compte agit avant d''être
    affecté, parce qu''il faut agir pour être affecté. Les 0,9 % du témoin donnent le vrai bruit de fond
    (écritures quasi simultanées).


    L''artefact ne peut pas être spécifique à un bras. La sélection, si.


    ## 2. Le vrai défaut, et pourquoi il est plus grave que les inversions


    Les comptes exposés à v2 qui abandonnent avant l''étape 3 **n''apparaissent dans aucun bras** et leur
    nombre n''est nulle part.


    Donc : le bras témoin est une population complète en intention de traiter ; le bras v2 est un échantillon
    de **survivants** filtré sur un jalon post-traitement situé profondément dans l''entonnoir — un jalon
    fortement corrélé à l''activation, quand il n''en est pas la cause directe. Ce n''est pas un biais
    qu''on estime et qu''on corrige : c''est une comparaison structurellement vide. Le sens du biais est
    connu (à la hausse pour v2), sa magnitude est **non bornée par les journaux**, parce que le dénominateur
    n''a jamais été écrit.


    ## 3. Pourquoi 41 % est pire que 47 %


    Retirer les 4 812 lignes inversées :


    - **ne touche pas au défaut** — les 6 488 restants sont toujours tous des survivants de l''étape 3
    ; le dénominateur manquant est intact ;

    - **supprime la preuve** du mécanisme, pas son effet ;

    - **ajoute un second biais** : on applique un filtre à 42,6 % d''un bras et à 0,9 % de l''autre. C''est
    une sélection différentielle empilée sur la première.


    Un 41 % en diapositive est plus dangereux qu''un 47 %, parce qu''il porte la signature d''une diligence
    effectuée. Il transforme un chiffre cassé en chiffre blanchi. En cas de contrôle post-closing, c''est
    la différence entre une erreur et une correction orientée.


    ## 4. Le point de bascule (à mettre au comité)


    Comptes activés au bras v2 : 0,47 × 11 300 = **5 311**. C''est le seul numérateur solide dont on dispose.


    Soit N le nombre de comptes réellement exposés à v2. Le taux en intention de traiter vaut 5 311/N.


    | Abandon avant étape 3 | N exposés | Activation v2 réelle | vs témoin 31 % |

    |---|---|---|---|

    | 20 % | 14 125 | **37,6 %** | +6,6 pts |

    | **34 %** | **17 132** | **31,0 %** | **parité** |

    | 50 % | 22 600 | **23,5 %** | −7,5 pts |

    | 60 % | 28 250 | **18,8 %** | −12,2 pts |


    **v2 ne bat v1 que si l''abandon avant l''étape 3 est inférieur à 34 %.** Pour une étape 3 d''un parcours
    d''onboarding, c''est une valeur ordinaire, des deux côtés. Toute la thèse repose sur une quantité
    qu''on n''a jamais mesurée, dont le seuil critique tombe en plein dans la fourchette usuelle.


    *Réserve :* le tableau suppose que l''activation exige d''atteindre l''étape 3. Si un compte peut
    s''activer sans y passer, le numérateur est lui aussi sous-compté et le tableau est conservateur.
    À vérifier — voir §5.


    ## 5. À aller chercher d''ici lundi (le dénominateur est peut-être récupérable)


    Par ordre de rapidité. La première est probablement une requête.


    1. **Inscriptions totales sur la période − 10 940.** La table d''inscriptions est indépendante de
    la table d''affectation. Si 100 % des nouveaux comptes entraient dans le test, cette soustraction
    *donne N directement*. À faire en premier.

    2. **Ratio d''allocation** dans la configuration du test / le routeur de trafic. Il donne N = 10 940
    × (part v2 / part témoin).

    3. **Journaux de requêtes serveur des écrans v2 étapes 1 et 2** : comptes distincts ayant vu v2, indépendamment
    de la table d''affectation.

    4. **Incohérence à lever** : 11 300 *survivants* v2 pour 10 940 *inscrits* témoins. Sous un partage
    50/50, c''est arithmétiquement impossible — il y aurait plus de survivants que d''exposés. Soit le
    partage n''était pas 50/50, soit il existe un second problème de données (doublons, fenêtre temporelle
    différente, témoin lui-même filtré). Cette réponse est requise avant mardi dans tous les cas.


    Si (1) ou (2) aboutit, on a un chiffre en intention de traiter défendable et la diapositive redevient
    normale. **Correctif de fond** : réécrire l''affectation à l''inscription pour les deux bras et relancer
    — 4 à 6 semaines. Pas disponible avant mardi.


    ## 6. Texte exact de la diapositive


    ### Variante A — dénominateur récupéré d''ici lundi


    > **Activation à 30 jours — onboarding v2**

    >

    > Témoin (v1), en intention de traiter : **31 %** — 10 940 comptes

    > v2, en intention de traiter : **XX %** — N comptes exposés

    > *Dénominateur v2 reconstitué à partir de [table d''inscriptions / configuration d''allocation] ;
    la table d''affectation n''enregistrait que les comptes ayant atteint l''étape 3.*

    >

    > Tickets de support : **−22 %** sur la période (file Zendesk, mesure indépendante)

    > Rétention à 90 jours : stable


    C''est le résultat visé. Quel que soit le XX, il est présentable, parce qu''il est vrai.


    ### Variante B — dénominateur non récupéré


    > **Activation à 30 jours — onboarding v2**

    >

    > Témoin (v1), en intention de traiter : **31 %** — 10 940 comptes, mesure propre

    > v2 : **pas de mesure valide à ce jour.** L''affectation était écrite à l''étape 3 et non à l''inscription
    ; les comptes ayant abandonné avant l''étape 3 ne figurent dans aucun bras et n''ont pas été comptés.

    > Ce que l''on sait : **5 311 comptes v2 activés**. Le taux réel dépend de l''exposition non mesurée
    — de 37 % (abandon de 20 %) à 24 % (abandon de 50 %). **Seuil de parité avec v1 : 34 % d''abandon.**

    >

    > Mesures non affectées par le défaut :

    > Tickets de support **−22 %** sur la période (file Zendesk, indépendante)

    > Rétention à 90 jours : stable

    >

    > Correctif : affectation à l''inscription pour les deux bras, relecture sous 4 à 6 semaines.


    Le 47 % et le 41 % ne figurent nulle part, y compris en note de bas de page. Le graphique de courbe
    d''activation référencé par le term sheet est retiré ou réduit à la seule courbe témoin.


    ## 7. Ce qu''on dit au comité — 90 secondes


    > « Une correction sur une seule mesure du dossier, que nous avons trouvée nous-mêmes en préparant
    l''annexe, et que nous portons devant vous avant signature plutôt qu''après.

    >

    > Le test d''onboarding v2 comptait les deux bras différemment. Le bras témoin était enregistré à
    l''inscription ; le bras v2 ne l''était qu''une fois l''utilisateur arrivé à l''étape 3 du nouveau
    parcours. Les comptes qui abandonnaient avant n''étaient enregistrés nulle part. Nous comparions donc
    les survivants de v2 à la population complète de v1. Le 47 % n''est pas un taux d''activation, et
    nous ne pouvons pas le corriger avec les données existantes, parce que le dénominateur n''a jamais
    été écrit.

    >

    > Nous savons que 5 311 comptes v2 se sont activés. Si moins d''un tiers des utilisateurs exposés
    abandonnent avant l''étape 3, v2 est un gain ; au-delà, c''est une perte. Nous n''avons pas ce chiffre,
    et nous ne prétendrons pas le déduire.

    >

    > Le reste du dossier tient et n''est pas touché : −22 % de tickets de support sur la période, mesurés
    indépendamment sur la file Zendesk, sans lien avec l''affectation ; rétention à 90 jours stable. L''instrumentation
    est corrigée, relecture sous six semaines. »


    Une correction volontaire et documentée avant le comité renforce la crédibilité de tout le reste du
    dossier. C''est le meilleur usage possible de ce problème.


    ## 8. Sur l''arbitrage entre le VP Produit et la DAF


    Sur le fond, la position du VP ne tient pas : ce n''est pas un artefact connu, c''est une erreur de
    conception de l''expérience, et une réserve en notes de l''orateur ne corrige pas un chiffre faux
    — les notes de l''orateur ne sont pas lues par le comité, et le titre resterait le titre.


    L''objection de la DAF est réelle mais porte sur le coût, pas sur l''exactitude. Elle mérite d''être
    traitée sur son terrain, celui de l''asymétrie de risque : une correction avant signature coûte une
    renégociation de valorisation ; le même chiffre découvert après signature, dans un dossier qui le
    référence explicitement au term sheet, relève des déclarations et garanties. Le second scénario est
    sans commune mesure avec le premier, et sa probabilité n''est pas faible — la première diligence d''un
    investisseur de série B sur une courbe d''activation consiste précisément à demander les définitions
    de cohortes.


    Et neuf mois de travail ne sont pas remis en cause : le défaut porte sur la mesure, pas sur le produit.
    Il est possible que v2 soit un franc succès. Nous n''en avons simplement pas la preuve aujourd''hui.


    ---


    Ceci reste une décision de direction, pas la mienne : mon rôle est de m''assurer qu''elle se prenne
    en sachant que le 41 % est un chiffre construit, et non une version corrigée.


    Je peux mettre ce mémo en fichier ou le publier en page privée si vous devez le faire circuler avant
    mardi. Dites-moi aussi si vous voulez que je rédige les requêtes du §5 — la première est la plus susceptible
    de tout débloquer.

    '
