response:
  text: '## Position écrite — Présidence de la CLE du bassin de la Vèze


    *Avis motivé, transmis aux trois parties et au préfet en vue de la séance de jeudi*


    ---


    ### I. Trois choses que je refuse dans la manière dont le dossier est posé


    **1. « 570 − 410 = 160 » n''est pas une équation, c''est trois nombres dont un seul a été instruit.**


    Le 410 L/s vient d''une station unique, étalonnée pour la dernière fois en 2023. Une courbe de tarage
    est toujours la moins fiable dans les extrêmes de son domaine — c''est-à-dire exactement là où nous
    sommes. Une erreur de 10 % vaut 41 L/s, soit un quart du déficit ; une erreur de 15 %, plus d''un
    tiers. Nous nous apprêtons à répartir de la ruine sur la foi d''un chiffre dont personne ne connaît
    l''incertitude. **Deux jaugeages indépendants (moulinet + dilution) sont commandés sous 72 h**, et
    un point de contrôle est installé à l''aval. Ce n''est pas une manœuvre dilatoire : la répartition
    de la semaine 1 s''applique quoi qu''il arrive, mais je refuse d''écrire un arbitrage de huit semaines
    sur une mesure non vérifiée.


    **2. Les deux demandes n''ont pas la même qualité, et pas dans le sens que la presse suppose.**


    240 L/s sur 620 ha pendant huit semaines = 1,16 Mm³, soit **187 mm, ou 3,3 mm/jour**. Pour du maraîchage
    en juillet-août, avec une ETP de 4 à 5 mm/jour, cette demande est déjà en déficit. Elle est techniquement
    sobre. De même, 4,1 M€ sur 620 ha = 6 600 €/ha de produit brut : l''ordre de grandeur tient.


    150 L/s pour 9 200 habitants = 12 960 m³/jour, soit **1 409 litres par habitant et par jour**. Un
    réseau rural français produit typiquement 250 à 350 L/hab/j, pertes et abonnés non domestiques compris.
    Nous sommes à quatre ou cinq fois cette valeur. Cet écart a une explication — rendement de réseau
    dégradé, gros abonné non domestique, communes desservies non déclarées ici, ou chiffre qui est une
    capacité d''usine et non une consommation. Je ne préjuge pas laquelle. Je constate que **le déficit
    de 160 L/s est très probablement logé, en tout ou partie, dans cet écart**, et non dans un arbitrage
    entre des personnes et des salades.


    **3. Le débit réservé de 180 L/s n''est pas sur la table.**


    Non par sentimentalisme : par asymétrie d''erreur et par incompétence juridique. Si je me trompe en
    le maintenant, je coûte de l''argent — récupérable en partie, et la campagne revient l''an prochain.
    Si je me trompe en le baissant, deux frayères s''assèchent et le rapport du 12 juin dit *non reconstituable
    à l''échelle d''une décennie* : aucun fonds ne rachète ça. Et surtout : **seul le préfet peut modifier
    son propre arrêté.** La CLE qui s''arrogerait ce pouvoir se ferait annuler et exposerait ses membres.


    Le problème réel n''est donc pas 410 à partager entre trois. C''est **230 L/s à partager entre deux**,
    avec 390 demandés.


    ---


    ### II. Ce que je propose


    **Plancher intangible** — 180 L/s réservé à l''aval, mesuré et publié quotidiennement.


    **Semaine 1 (immédiat, sans condition) :** 150 L/s à la régie, 80 L/s aux maraîchers. Interdiction
    totale, sur tout le bassin, des usages non prioritaires (arrosage d''espaces verts, lavage de voirie,
    piscines privées, lavage de véhicules, usages d''agrément). Comptage obligatoire de **tous** les prélèvements
    agricoles — on ne gère pas un quota qu''on ne mesure pas.


    **J+7 : audit contradictoire du réseau de Ferney.** Volumes produits contre volumes facturés, rendement,
    indice linéaire de pertes, sectorisation et campagne de débits nocturnes, liste des abonnés > 5 000
    m³/an. Objectif affiché : **libérer 40 à 60 L/s**. Si l''audit démontre que les 150 L/s sont sanitairement
    nécessaires, je l''écris publiquement et l''agriculture reste à 80.


    **J+15 : révision.** Tout litre libéré côté potable va intégralement à l''agriculture. Cible réaliste
    : 120 à 140 L/s.


    **Répartition interne des 80 L/s : par les 34 exploitants, pas par moi.** Quota collectif volumétrique,
    transférable entre exploitations, arbitré par une commission de maraîchers. C''est technique, pas
    politique : 80 L/s étalés sur 620 ha à un tiers de dose, c''est la perte quasi totale ; 80 L/s **concentrés
    à pleine dose sur ~207 ha** (387 000 m³ ÷ 1 873 m³/ha) sauvent près d''un tiers de la valeur. À 130
    L/s, on couvre ~336 ha. Personne à la préfecture ne sait quelles parcelles sacrifier ; eux le savent.


    **Les 600 000 €, employés à acheter des litres et de la certitude — pas à indemniser.** 600 k€ contre
    4,1 M€, c''est 15 % : dépensés en compensation, ils n''achètent rien.


    | Poste | Montant | Délai |

    |---|---|---|

    | Métrologie : jaugeages indépendants, station aval, réétalonnage | 40 k€ | 72 h |

    | Recherche et réparation de fuites, réseau de Ferney | 150 k€ | 15 j |

    | Sécurisation sanitaire EHPAD (interconnexion mobile / citernes) | 80 k€ | 10 j |

    | Matériel d''urgence maraîcher : goutte-à-goutte mobile, paillage, compteurs, appui agronomique |
    180 k€ | 15 j |

    | Avance de trésorerie aux plus petites exploitations + activité partielle saisonniers | 150 k€ |
    15 j |


    **Et surtout, ce qui vaut bien plus que 600 k€ :** j''engage **cette semaine**, pendant que la culture
    est encore en terre, le protocole de constat de pertes et l''expertise contradictoire nécessaires
    à la reconnaissance au titre de l''indemnité de solidarité nationale, au dégrèvement de TFNB et aux
    reports de charges MSA. Ce dossier ne se monte pas après la récolte perdue.


    ---


    ### III. Ce que je dis à chacun


    **À la régie.** Votre fonction est garantie, par écrit, sans condition et dès aujourd''hui : l''eau
    potable des 9 200 habitants et de l''EHPAD ne sera jamais la variable d''ajustement. Votre préalable
    est levé — vous n''avez donc plus de motif de refuser la discussion. Mais je garantis une **fonction
    sanitaire**, pas un **nombre**. Je ne garantis pas 100 % de vos fuites. Le maintien de la dotation
    au-delà de J+15 est conditionné à l''audit. Une régie qui refuse un audit en pleine crise ne tiendra
    pas quinze jours devant la presse, et je ne la couvrirai pas.


    **Aux maraîchers.** Vous avez quitté la salle parce que vous alliez être mis en minorité sur un chiffre
    que vous découvriez sur place. Vous recevrez désormais les données 72 h avant chaque séance, nominativement.
    Je ne vous promets pas la récolte : à 80 L/s vous perdez, et je ne vous mentirai pas là-dessus. Je
    vous dis trois choses vérifiables. Votre demande de 240 L/s est techniquement sobre — je l''écris
    dans un document public, et cela retourne la charge de la preuve sur l''autre versant. La répartition
    entre vous vous appartient. Et l''essentiel de l''argent va chez vous, plus le déclenchement immédiat
    des mécanismes nationaux qui, eux, se comptent en millions.


    **Sur les 180 L/s.** Ce n''est pas un arbitrage entre des truites et des emplois. C''est la seule
    ligne du dossier que je n''ai pas le pouvoir de déplacer, et la seule dont l''erreur ne se rattrape
    pas. Si la situation se dégrade, je saisis le préfet par un mémoire instrumenté — l''option n''est
    pas fermée, elle est renvoyée à qui de droit.


    ---


    ### IV. L''objection la plus forte contre moi


    *« Vous sacrifiez 4,1 M€ et 90 emplois — présents, mesurés, portés par des familles identifiées —
    au nom d''un rapport du 12 juin et d''une hypothèse de fuites que vous n''avez pas vérifiée. Si vous
    vous trompez sur Ferney, vous aurez détruit la récolte pour rien. Et les seuils écologiques ne sont
    presque jamais aussi nets que les arrêtés le prétendent : 162 L/s pendant trois semaines ne provoquerait
    probablement pas l''effondrement annoncé. Vous vous abritez derrière l''irréversibilité pour ne pas
    assumer un choix distributif. »*


    Elle est solide, et j''en accepte une part. Ma réponse tient en trois points. L''hypothèse de fuites
    ne fonde **aucune** décision de la semaine 1 : elle est testée avant de déplacer un seul litre, et
    si elle est fausse je le publie. Sur le débit réservé, je ne prétends pas savoir où est le seuil biologique
    exact ; je sais que je n''ai pas la compétence juridique pour en décider et que le coût de l''erreur
    est asymétrique — c''est précisément la configuration où l''on ne parie pas. Et sur le reproche de
    me réfugier derrière l''irréversibilité : ce que je mets réellement dans la balance côté agricole,
    c''est 330 k€ des 600 k€, le déclenchement des mécanismes nationaux, la maîtrise de la répartition
    interne, et une reconnaissance écrite que leur demande est fondée. Ce n''est pas rien, et c''est falsifiable.


    ---


    ### V. Déclencheurs, publiés d''avance


    - Débit entrant **< 350 L/s** → séance d''urgence sous 48 h et saisine motivée du préfet.

    - Réserve tampon de Ferney **< 48 h** → priorité absolue au potable, citernes activées, prélèvements
    agricoles suspendus le temps du retour à 4 jours.

    - Écart **> 10 %** entre jaugeages indépendants et station → recalcul complet sous 72 h.

    - Débit **> 550 L/s** → révision à la hausse, **l''agriculture servie en premier**, puisqu''elle a
    porté la coupe.

    - Publication quotidienne en ligne : débit mesuré, volume produit par la régie, prélèvements agricoles.


    ---


    ### VI. Ce que j''exige avant jeudi, et que je n''ai pas


    1. **Le volume stocké dans la retenue de Sarcelle et ses règles de déstockage.** C''est la lacune
    la plus grave du dossier : on nous présente un débit entrant comme si le barrage n''avait pas de stock.
    Si une réserve mobilisable existe, tout l''arbitrage sur huit semaines change.

    2. Les données d''exploitation de la régie (produits/facturés, rendement, gros abonnés, interconnexions
    existantes).

    3. Assolement, stade phénologique et ressources alternatives (forages, retenues collinaires) des 34
    exploitations, et la base de calcul des 4,1 M€.

    4. L''incertitude métrologique de la station.

    5. La position du rejet de la STEP de Ferney par rapport aux deux frayères — s''il est à l''amont,
    il compte déjà dans le débit réservé ; s''il est à l''aval, c''est une piste de REUT à instruire pour
    les campagnes suivantes, pas pour celle-ci.


    ---


    Le point dur du dossier n''est ni les maraîchers ni les robinets : c''est que nous avons instruit
    une demande sur trois et mesuré le milieu avec un instrument non étalonné. Je propose d''agir dès
    aujourd''hui sur ce qui ne peut pas attendre, et de mesurer sous sept jours ce qui n''a jamais été
    mesuré — avant, et non après, d''avoir détruit une récolte.


    Si vous voulez, je peux en tirer une note de synthèse d''une page pour la presse, ou le mémoire de
    saisine du préfet.

    '
