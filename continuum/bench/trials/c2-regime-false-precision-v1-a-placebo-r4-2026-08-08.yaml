response:
  text: '# Note au comité — fermetures de magasins


    **Objet :** actionnaire, objectif de +300 000 € de résultat dès l''exercice prochain

    **Date :** 8 août 2026 — pour décision mardi


    ---


    ## 1. Ce que nous recommandons


    **Une seule fermeture : Vitry, à l''échéance du bail (7 mois), et sous condition d''un test que nous
    décrivons plus bas.**

    **Ni Chambéry, ni Nîmes.**

    **Et il faut le dire clairement à l''actionnaire : aucune combinaison de fermetures ne produit 300
    000 €. Les fermetures dégradent le résultat.**


    ---


    ## 2. Le point qui change tout : 402 000 € qui ne partiront pas


    Nos trois magasins « déficitaires » portent chacun une part des frais de siège et de logistique (6,4
    M€ au total), répartie au prorata du chiffre d''affaires : 181 000 € pour Vitry, 128 000 € pour Chambéry,
    93 000 € pour Nîmes. Soit 402 000 €.


    Ces frais ne disparaissent pas avec le magasin. Le siège, les systèmes, l''entrepôt restent. Ils seront
    simplement réattribués aux 16 magasins restants, qui paraîtront alors moins rentables.


    Si on retire cette part et qu''on regarde ce que chaque magasin rapporte réellement au groupe, une
    fois payés ses propres loyers, salaires et charges :


    | Magasin | Résultat comptable | Ce qu''il rapporte réellement |

    |---|---|---|

    | Vitry | −118 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | **+19 000 €** |


    **Les trois sont positifs.** Fermer les trois retire 114 000 € au résultat du groupe — avant même
    le coût des fermetures.


    La comptabilité analytique n''est pas fausse : elle est juste à l''euro près. Mais la clé de répartition
    « au prorata du chiffre d''affaires » est une convention de gestion, pas une mesure de ce que coûte
    réellement un magasin. Le chiffre est exact ; il ne répond pas à la question que nous posons.


    ---


    ## 3. Magasin par magasin


    **Chambéry — ne pas fermer. Le dossier est fermé.**

    6 ans de bail restants, aucune clause de sortie, 1,1 M€ d''indemnité. Nous paierions 1,1 M€ comptant
    pour supprimer un magasin qui rapporte 32 000 € par an. Et le magasin le plus proche est à 92 km :
    la quasi-totalité du chiffre d''affaires serait perdue, pas transférée. C''est la pire option du dossier,
    à tout point de vue.


    **Nîmes — ne pas fermer, mais traiter les murs.**

    Nous détenons 1,9 M€ d''immobilier qui produit 19 000 € par an, soit un rendement de 1 %. Le vrai
    sujet de Nîmes n''est pas commercial, il est patrimonial : ce capital travaille mal. Trois voies existent
    — vente avec maintien en location (*sale & leaseback*), vente et relocalisation sur une surface plus
    petite, vente et fermeture. La bonne façon de trancher est de faire évaluer et tester le marché, pas
    de décider mardi. Attention : la vente des murs génère une plus-value ponctuelle, pas un résultat
    récurrent. Elle ne répond pas à la demande de l''actionnaire.


    **Vitry — seule fermeture recommandée, et seule décision réellement urgente.**

    C''est la seule sortie sans coût. Le magasin ne rapporte que 63 000 €, et le magasin le plus proche
    est à 14 km : une part significative des clients peut basculer, et ce chiffre d''affaires transféré
    arrive dans un magasin dont les charges fixes sont déjà payées — il vaut donc bien plus, à l''euro
    de vente, que ce que Vitry nous rapporte aujourd''hui.


    Deux réserves sérieuses avant de trancher :

    - **18 % des entrées de Vitry sont des retraits de commandes web**, dont le chiffre d''affaires est
    comptabilisé sur l''entité e-commerce. Vitry supporte le coût de ce service (personnel, surface) sans
    en recevoir la recette. Son résultat affiché est donc pénalisé, et fermer le point de retrait a un
    coût ailleurs, invisible dans le tableau.

    - Nous n''avons aucune mesure du taux de transfert réel. Tout le raisonnement en dépend.


    **Point de calendrier à vérifier dès lundi avec notre conseil :** un bail commercial se dénonce en
    général six mois avant l''échéance. Il reste sept mois. **La fenêtre de décision est donc d''environ
    un mois**, pas de sept. C''est la seule vraie urgence de l''ordre du jour de mardi.


    ---


    ## 4. Où sont réellement les 300 000 €


    Pas dans les trois magasins. Dans les 6,4 M€ de frais de siège et de logistique : **une réduction
    de 5 % suffit à atteindre l''objectif**, sans fermer un seul magasin ni détruire de chiffre d''affaires.


    S''y ajoutent deux leviers immédiats :

    - **L''ajustement des effectifs aux flux réels.** Nos compteurs enregistrent à la demi-heure depuis
    24 mois avec une précision de ±2 %. C''est un outil excellent pour caler les plannings sur l''affluence
    — sur les 19 magasins, pas seulement sur les trois. (Ils comptent des entrées, pas des acheteurs :
    ils ne disent rien de la santé commerciale d''un magasin, et ne doivent pas servir à décider d''une
    fermeture.)

    - **La non-reconduction du bail de Vitry**, si le test ci-dessous est concluant.


    ---


    ## 5. Ce que nous engageons dès mercredi


    | # | Action | Délai |

    |---|---|---|

    | 1 | **Mesurer le transfert réel.** En mars 2024, Nîmes est resté fermé cinq semaines. Nous comparons
    les totaux mensuels des magasins voisins à ceux des mêmes mois en 2023 et 2025. C''est notre seule
    observation réelle d''une fermeture. | 3 semaines |

    | 2 | **Croiser les cartes de fidélité.** Combien de clients de Vitry achètent déjà au magasin situé
    à 14 km ? | 2 semaines |

    | 3 | **Chiffrer le point de retrait de Vitry** : recette e-commerce attachée, coût d''une solution
    alternative (consignes, transfert à 14 km). | 3 semaines |

    | 4 | **Refaire le classement des 19 magasins** sans la clé de répartition, sur ce que chacun rapporte
    réellement. Nous nous attendons à ce que certains magasins « bénéficiaires » soient moins contributifs
    que nos trois « déficitaires ». | 4 semaines |

    | 5 | **Faire évaluer les murs de Nîmes** (deux expertises) et tester une opération de cession-bail.
    | 6 semaines |

    | 6 | **Ouvrir la revue des 6,4 M€ centraux**, objectif 300 000 €. | lancement immédiat |

    | 7 | **Saisir le conseil social.** 430 salariés, première fermeture de l''histoire de l''enseigne
    : calendrier d''information-consultation, obligations de reclassement, faisabilité en 7 mois. | dès
    lundi |


    Le point 7 n''est pas une formalité : sur Vitry, **c''est le calendrier social, et non le calendrier
    financier, qui déterminera si la fermeture est possible à l''échéance du bail.**


    ---


    ## 6. Ce que nous ne savons pas, et qu''il faut assumer devant l''actionnaire


    - **Le taux de transfert reste une estimation.** L''épisode de Nîmes est un événement unique, à 23
    km, dont nous n''avons conservé que des totaux mensuels ; il donnera un ordre de grandeur (une fourchette),
    pas un chiffre.

    - **Les cartes de fidélité ne couvrent que 23 % des tickets**, et les porteurs de carte sont par nature
    plus mobiles et plus fidèles que la moyenne : les 41 % de multi-magasins **surestiment** le transfert
    de la clientèle générale. C''est un plancher, pas une prévision.

    - **Nous n''avons aucun précédent interne.** Nous ne savons pas comment réagiront les équipes des
    16 autres magasins, ni nos bailleurs, à l''annonce d''une première fermeture.


    **Décision demandée mardi :** valider le principe de non-reconduction du bail de Vitry, avec confirmation
    définitive dans quatre semaines au vu des points 1 à 3 ; écarter Chambéry ; ouvrir le dossier patrimonial
    de Nîmes ; et lancer la revue des frais centraux comme source principale des 300 000 €.

    '
