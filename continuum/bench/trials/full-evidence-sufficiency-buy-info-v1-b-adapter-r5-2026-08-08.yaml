response:
  text: '# NOTE AU COMITÉ DE DIRECTION


    **Objet :** Contrat cellules 2027 (80 000 unités) — arbitrage Kelmar / Sinolux

    **De :** Direction des opérations — **Date :** lundi J0


    ## Décision


    **Nous ne signons pas Sinolux cette semaine. Nous ne décalons rien pour autant.** Nous lançons aujourd''hui
    le test Vertex (9 500 €) et nous tranchons au plus tard à J+40, sur une règle fixée à l''avance. À
    défaut de résultat exploitable : Kelmar.


    ## Le seuil qui décide


    L''économie n''est pas de 240 000 €, c''est un solde entre un prix et un taux de retour.


    | Taux Sinolux | Retours/an | Coût SAV | Écart vs Kelmar | **Gain net réel** |

    |---|---|---|---|---|

    | Kelmar 1,2 % | 960 | 201 600 € | — | référence |

    | 1,0 % (essais Sinolux) | 800 | 168 000 € | −33 600 € | **+273 600 €** |

    | 1,5 % (bas ingénieurs) | 1 200 | 252 000 € | +50 400 € | **+189 600 €** |

    | 2,25 % (médian ingénieurs) | 1 800 | 378 000 € | +176 400 € | **+63 600 €** |

    | **2,63 % — point mort** | 2 103 | 441 600 € | +240 000 € | **0 €** |

    | 2,9 % (audit sectoriel) | 2 320 | 487 200 € | +285 600 € | **−45 600 €** |

    | 3,0 % (haut ingénieurs) | 2 400 | 504 000 € | +302 400 € | **−62 400 €** |


    **Tout se joue autour de 2,63 %.** Nos trois sources encadrent ce seuil des deux côtés : nous ne savons
    pas de quel côté nous sommes. Signer cette semaine, ce n''est pas encaisser 240 000 €, c''est parier
    à l''aveugle sur un intervalle qui va de +274 k€ à −62 k€.


    Deux points à retenir : la seule source qui donne 1,0 % est le vendeur ; la seule mesure indépendante
    (audit de mars, ligne comparable du **même** fournisseur) donne 2,9 %, soit au-delà du point mort.
    Et Sinolux refuse toute clause de garantie sur le taux — un fournisseur convaincu de son 1,0 % accepterait
    de plafonner un risque qu''il juge inexistant. Ce refus est une information, pas un détail juridique.


    ## Pourquoi cela ne retarde pas le lancement


    Le test Vertex n''est pas sur le chemin critique, il est dans le mou du calendrier :


    - Prélèvement scellé et expédition des 1 200 cellules : J0 → J+3

    - Résultat annoncé (11 jours ouvrés) : **≈ J+19**, avec doublement du délai : **≈ J+34**

    - Prix Sinolux tenu jusqu''à **J+45** ; commande ferme Kelmar due à **J+50** ; production à **J+60**


    Nous disposons de 26 jours de marge sur le scénario nominal et restons dans les clous même si Vertex
    dérape de 100 %. Vertex ne s''engageant pas sur son délai, nous posons un **point de contrôle à J+25**
    et un **arrêt sec à J+40** : passé cette date, sans résultat, nous commandons Kelmar, 10 jours avant
    sa propre échéance. Aucune date de production n''est touchée dans aucun scénario.


    ## Règle de décision, arrêtée aujourd''hui


    Vertex est précis à ±0,3 point. Nous décidons sur la borne défavorable, pas sur la valeur centrale.


    - **Vertex ≤ 2,3 %** (donc ≤ 2,6 % au pire) → **Sinolux**, signature immédiate.

    - **Vertex > 2,3 %** → **Kelmar**, sans rediscussion.

    - Zone 1,9–2,3 % : Sinolux, mais conditionné à une contrepartie contractuelle (clause d''ajustement
    de prix indexée sur le taux constaté à 12 mois).


    Conditions de validité du test : cellules tirées au sort dans un lot de production courant, scellées
    et tracées par nous — pas d''échantillons fournis par Sinolux.


    ## L''objection la plus forte contre cette note


    Elle est réelle : l''audit porte sur une ligne *comparable*, pas sur notre cellule ; les essais fournisseur
    portent, eux, sur le bon produit ; et même à l''hypothèse médiane de nos ingénieurs (2,25 %), signer
    reste gagnant de ~64 k€. On peut donc soutenir que nous dépensons 9 500 € et trois semaines d''attention
    pour une décision dont l''espérance est déjà positive.


    Ce que cela ne règle pas : à 2,25 %, nous engrangeons 64 k€ **et** 840 retours clients supplémentaires
    par an, sans aucun recours contractuel, sur un contrat verrouillé pour 12 mois. Le test coûte 4 %
    de l''enjeu, ne consomme aucune marge calendaire, et transforme un pari sur un intervalle de 336 k€
    d''amplitude en décision documentée. Le rapport est trop favorable pour s''en passer.


    ## Deux mises au point


    **Direction financière :** les 240 000 € inscrits au budget sont un montant brut. Le différentiel
    SAV n''a pas été provisionné. Même dans l''hypothèse médiane, le gain réel est de l''ordre de 64 000
    €, soit un quart de la ligne budgétée. Cette ligne doit être corrigée quel que soit le fournisseur
    retenu.


    **Direction commerciale :** aucune date de lancement ne bouge. La seule chose qui menacerait le lancement,
    c''est de démarrer la production à J+60 avec une cellule à 2,9 % de retours et zéro levier sur le
    fournisseur.


    ## Actions


    | # | Action | Resp. | Échéance |

    |---|---|---|---|

    | 1 | Bon de commande Vertex + protocole de prélèvement scellé | Qualité | J+1 |

    | 2 | Demander à Sinolux le maintien du prix jusqu''à J+50 **par écrit** et remettre la clause de
    garantie sur la table | Achats | J+3 |

    | 3 | Maintenir Kelmar en position active, dossier de commande prêt à signer | Achats | J+5 |

    | 4 | Point de contrôle Vertex | Opérations | J+25 |

    | 5 | **Arbitrage final** selon la règle ci-dessus — à défaut, Kelmar | CODIR | **J+40** |


    Un refus de Sinolux sur l''action 2 est, en soi, un élément de décision à porter au dossier.

    '
