response:
  text: '# Plan d''exécution — conversion de la flotte


    **Conseil du jeudi 13 août 2026** — Direction de l''exploitation


    Le conseil a décidé le 4 mai ; la commande est ferme. Ce document ne rouvre pas cette décision. Il
    traite la seule question ouverte : **dans quel ordre, à quelle date et sous quelle condition chaque
    véhicule entre en service** — et il identifie une contrainte que le dossier actuel ne mentionne pas.


    ---


    ## 1. Le constat qui structure tout le plan


    Le dossier pose la question comme un problème d''autonomie. Ce n''en est pas un.


    Un véhicule qui a roulé 168 km doit récupérer cette énergie avant 6 h le lendemain. Une charge complète
    = 6 h de borne = 232 km réels (mesure de mars), ou 197 km à 2 °C. Donc **1 km coûte 0,0305 heure de
    borne en hiver**. La flotte entière parcourt 96 × 168 = 16 128 km/jour, soit **492 heures de borne
    par nuit**.


    Sur une fenêtre de nuit de 12 h, cela demande **41 bornes**. Nous en avons 14, et la tranche devisée
    en porte le total à 22.


    | | bornes | fenêtre | heures-borne/nuit | VE alimentables (tournées à 140 km) |

    |---|---|---|---|---|

    | Aujourd''hui | 14 | 12 h | 168 | **39** |

    | + tranche devisée (fin oct.) | 22 | 12 h | 264 | **61** |

    | + fenêtre élargie | 22 | 14 h | 308 | **72** |

    | Flotte complète (96 × 168 km) | — | 12 h | 492 requises | **41 bornes nécessaires** |


    **Conclusion pour le conseil : les 8 bornes devisées ne terminent pas la conversion. Elles permettent
    d''en faire environ les deux tiers.** Le conseil vote jeudi une première tranche, pas la dernière.
    Il est préférable qu''il le sache maintenant plutôt qu''en février.


    Le point rassurant : sur 24 h, 22 bornes délivrent 528 heures — plus que les 492 nécessaires. **Le
    problème n''est pas la capacité, c''est la simultanéité.** Tous les véhicules veulent charger dans
    la même fenêtre. Tout ce qui désynchronise vaut plus cher que du béton et des bornes.


    ---


    ## 2. Quatre chiffres manquent au dossier. Ils sont dans nos systèmes.


    Ils seront au conseil jeudi. Aucun ne demande une étude ; tous sortent de données déjà collectées.


    | | Question | Où | Pourquoi elle décide |

    |---|---|---|---|

    | **Q1** | Sur les 120 tournées de l''essai, combien dépassaient 190 km ? | Télémétrie de mars | Nous
    connaissons le taux brut (11/120 = 9 %). Si 25 tournées dépassaient 190 km, le taux réel sur ce segment
    est de **44 %**, pas 9 %. Tout le calendrier en dépend. |

    | **Q2** | Les 96 tournées repassent-elles par une plateforme en journée, et combien de temps ? |
    Télémétrie + plans de tournée | 45 min branché à 22 kW = +25 km d''autonomie hivernale, sur des bornes
    inutilisées le jour. Levier à coût nul. |

    | **Q3** | Quelle puissance les véhicules commandés acceptent-ils en courant alternatif ? | Fiche
    technique constructeur | 6 h à 22 kW = 132 kWh pour 232 km, soit 57 kWh/100 km — invraisemblable pour
    un utilitaire. Les véhicules acceptent probablement **11 kW**, donc nos bornes 22 kW sont à moitié
    utilisées. Si c''est le cas, des bornes bi-prises doublent le nombre de points de charge pour une
    fraction des 210 000 €. |

    | **Q4** | Histogramme des 96 tournées par distance, et durée de conduite de chacune. | Tableau de
    bord d''exploitation | Détermine combien de tournées sont éligibles, et jusqu''où on peut charger
    les diesels sans casser les temps de conduite. |


    **Première action : ces quatre extractions sont demandées lundi 10 août au responsable transport et
    au superviseur de flotte, pour restitution mercredi 12.**


    Q3 en particulier peut modifier le montant voté jeudi. Si la réponse n''est pas disponible mercredi,
    le conseil vote la tranche de 8 bornes avec une clause de substitution bi-prises à coût constant.


    ---


    ## 3. Ce que le conseil vote jeudi


    | | Décision | Date butoir | Coût |

    |---|---|---|---|

    | **D1** | Commander la tranche de 8 bornes, avec engagement écrit du fournisseur sur une mise en
    service au **24 octobre** | 14 août | 210 000 € |

    | **D2** | Faire chiffrer une tranche 3 (12 bornes) **et** vérifier la puissance souscrite des deux
    plateformes. Chiffrage attendu le 4 septembre. Décision d''achat le 20 novembre, sur données de froid
    réel. | 14 août (lancement) | 0 € jusqu''au 20 nov. |

    | **D3** | Mandater la direction d''exploitation pour prolonger les lots diesel selon le calendrier
    §5, sans repasser devant le conseil | 14 août | ~85 000 € sur 8 mois |

    | **D4** | Redécouper les 96 tournées entre les deux plateformes. Objectif : 60 tournées ≤ 155 km,
    aucune tournée diesel > 210 km. Livrable le 12 septembre. | 14 août | temps de planification |

    | **D5** | Élargir la fenêtre de charge de 12 h à 14 h (retours 17 h / départs 7 h) et financer une
    ronde de rebranchement nocturne sur les deux plateformes | 1er octobre | poste de nuit ×2 |


    D2 est une **option, pas un achat**. Le chiffrage coûte zéro et se décide en novembre avec les premières
    données de froid. Le raccordement électrique est le point à vérifier en priorité : 22 bornes = 484
    kW appelés, et les délais de renforcement de puissance dépassent couramment les 7 semaines de travaux.
    C''est le seul risque du dossier qui puisse dépasser 7 semaines sans que nous le voyions venir.


    ---


    ## 4. La règle d''affectation


    Calibrée sur l''observation du responsable transport, pas sur une hypothèse : les recharges non prévues
    ont commencé **au-dessus de 190 km, en mars**, quand l''autonomie mesurée était de 232 km — soit à
    82 % de l''autonomie. On retient une réserve de 20 %.


    > **Plafond véhicule électrique : 185 km. Ramené à 155 km dès que la température prévue à 6 h est
    ≤ 5 °C.**

    > Au-delà : diesel, ou électrique avec une recharge de mi-journée **planifiée et inscrite au plan
    de tournée** — jamais une recharge improvisée par le conducteur.


    Et la règle économique qui arbitre les cas limites :


    > Prolonger un diesel coûte **480 €/mois**. Une tournée non terminée coûte **900 €**. Un véhicule
    électrique n''est affecté à une tournée que si le risque d''échec y est inférieur à **une chance sur
    deux par mois** — au-delà, le diesel est strictement moins cher.


    Ce seuil est volontairement conservateur : il ignore l''économie de carburant, qui joue en faveur
    de l''électrique et que le dossier ne chiffre pas. Ce chiffre doit être ajouté avant la revue de décembre.


    **Distinction à tenir : une recharge non prévue n''est pas une tournée non terminée.** L''essai de
    mars a produit 11 recharges et — sauf information contraire attendue lundi — aucune tournée non terminée.
    Le coût constaté à ce jour est un retard, pas 900 €. Le plan ne doit pas facturer au conseil une catastrophe
    qui n''a pas eu lieu.


    ---


    ## 5. Calendrier de bascule


    Le point à retenir : **le calendrier de reprise des diesels n''est pas le calendrier de livraison
    des électriques.** Un diesel rendu ne revient pas avant 11 semaines. C''est le seul geste irréversible
    du dossier.


    | Mois | VE livrés (cumul) | VE **en service** | Diesels à détenir | Dispo au calendrier par défaut
    | Prolongation | Notification au loueur |

    |---|---|---|---|---|---|---|

    | Sept. | 24 | 24 | 76 | 96 → 72 | — | — |

    | Oct. | 48 | 33 → **40** (tranche 2 le 24) | 64 | 72 | — | — |

    | Nov. | 72 | **52** | 56 | 48 | **+8** | **1er oct.** |

    | Déc. | 96 | **60** | 40 | 24 | **+16** | **1er nov.** |

    | Janv. | 96 | **60** (gel volontaire) | 40 | 0 | **+40** | **1er déc.** |

    | Févr. | — | 60 | 40 | — | +40 | 1er janv. |

    | Mars | — | 72 | 28 | — | +28 | 1er févr. |

    | Avr.–juin | — | 84 → 96 | 28 → 4 | — | dégressif | mensuel |


    **Coût total des prolongations : environ 85 000 €** sur octobre–juin. Soit 2,7 % du capex et 14 %
    de la subvention.


    C''est le poste le moins cher du plan et le plus rentable. À l''inverse, se retrouver 40 véhicules
    court en janvier représente 40 tournées × 900 € × 21 jours = **756 000 € par mois**, verrouillés pendant
    11 semaines faute de pouvoir reprendre les diesels — soit de l''ordre de **1,9 M€**. Le rapport entre
    les deux est de 1 à 22.


    **Le gel de janvier est délibéré** : on ne met aucun véhicule électrique supplémentaire en service
    pendant le mois le plus froid, celui où nous avons le moins de données. On monte à 72 en mars, quand
    le froid recule et que six mois d''exploitation réelle ont remplacé l''essai de six véhicules en mars.


    ---


    ## 6. La subvention de 620 000 €


    Elle exige 60 véhicules roulant avant le 31 janvier. Traduite en termes d''exploitation :


    > **60 véhicules électriques en service en janvier ⟺ 60 tournées qui passent sous 155 km et 308 heures
    de borne disponibles la nuit.**


    Le second terme est acquis avec la tranche 2 et la fenêtre à 14 h (D1 + D5). **Le premier ne l''est
    pas** : la moyenne actuelle est de 168 km et le maximum de 240 km. Il est probable que moins de 60
    tournées passent aujourd''hui sous 155 km — c''est l''objet de Q4.


    Les leviers, par ordre de coût croissant :


    1. **Recharge de mi-journée pendant le rechargement** (si Q2 est positive) : coût nul, les bornes
    sont vides le jour. Porte le plafond de 155 à ~185 km et soulage la nuit. Rend probablement une vingtaine
    de tournées éligibles à elle seule.

    2. **Fenêtre 12 h → 14 h** : +17 % de capacité pour un décalage d''horaires.

    3. **Redécoupage des 96 tournées** : on ne réduit pas le kilométrage total, on le déplace vers les
    diesels. 60 tournées à 140 km laissent 36 tournées à 208 km de moyenne — tenable pour un diesel, mais
    **la limite n''est pas le véhicule, c''est le temps de conduite du conducteur**. D''où Q4.

    4. **Tranche 3** : ~105 000 € pour 4 bornes supplémentaires si nécessaire. Décision le 20 novembre.

    5. **Tournées supplémentaires : dernier recours, et temporaires uniquement.** Quatre tournées de plus
    coûtent environ 200 000 € par an de façon permanente. Une subvention de 620 000 € payée une fois ne
    justifie pas trois ans de surcoût.


    ---


    ## 7. Ce qui renverse ce plan


    Le tableau de bord publie déjà chaque soir, par plateforme, le taux de tournées terminées et le nombre
    de recharges non prévues. Il n''y a rien à construire ; il y a des seuils à y attacher.


    | Observable | Seuil | Conséquence |

    |---|---|---|

    | Recharges non prévues sur tournées VE | > 4 % sur 5 jours consécutifs | Gel du lot de mise en service
    suivant ; re-tri des tournées sous 48 h |

    | Tournée non terminée imputable à la charge | 1 seule | Cette tournée repasse au diesel dès le lendemain
    ; le lot correspondant est prolongé |

    | Autonomie mesurée au 10ᵉ centile, première semaine à ≤ 5 °C avec ≥ 20 VE en service | **≥ 210 km**
    | Le plafond hivernal passe de 155 à 175 km. On accélère : 12 diesels rendus un mois plus tôt (~40
    000 € économisés) et la tranche 3 est abandonnée |

    | Même mesure | **≤ 180 km** | 60 véhicules au 31 janvier devient inatteignable quel que soit le nombre
    de bornes livrables d''ici là. Le conseil arbitre le 20 novembre entre renoncer aux 620 000 € et redécouper
    jusqu''à un plafond de 130 km |

    | Engagement écrit du fournisseur de bornes sur la date du 24 octobre | non obtenu au 4 septembre
    | Prolongation immédiate de 20 diesels supplémentaires (9 600 €/mois) et remise à plat du calendrier
    de novembre |


    **Repli, si le froid de décembre est plus dur que l''essai de mars :** on redescend à 40 véhicules
    électriques en service, tous sur les 40 tournées les plus courtes, on prolonge 56 diesels (26 880
    €/mois), on renonce à la subvention et on remet le passage à 96 à l''été 2027. Ce repli reste ouvert
    **tant que nous détenons les diesels** — c''est-à-dire tant que les notifications du §5 sont émises
    à l''heure. Il se ferme le 1er décembre si la notification de ce jour n''est pas passée.


    ---


    ## 8. Le meilleur argument contre ce plan


    Il mérite d''être présenté au conseil dans sa forme la plus forte :


    > *Ce plan sur-assure. L''essai a produit 11 recharges non prévues et aucune tournée non terminée.
    Huit tournées de plus confiées aux véhicules électriques dès novembre suffiraient à tenir 60 au 31
    janvier sans fenêtre élargie ni tranche 3, et les 85 000 € de prolongation diesel sont une prime payée
    pour une incertitude que les données ne justifient pas. La direction d''exploitation achète sa propre
    tranquillité avec l''argent du conseil.*


    Ce qu''il a de juste : le coût réel constaté à ce jour est un retard, pas une pénalité. Le plan ne
    doit pas transformer 11 recharges en un scénario de crise.


    Ce qui le fait céder : l''essai portait sur 6 véhicules, en mars, sur 120 tournées, et **les défaillances
    se concentrent exactement sur le segment que ces huit tournées supplémentaires ajouteraient** — celles
    au-dessus de 190 km. L''asymétrie tranche : se tromper en prolongeant coûte 480 € par véhicule et
    par mois, réversible chaque mois. Se tromper en rendant coûte 11 semaines pendant lesquelles la tournée
    n''a pas de véhicule.


    Mais l''objection modifie le plan sur un point, et c''est une amélioration : **le plan doit contenir
    un accélérateur, pas seulement un frein.**


    > **Revue du 15 décembre.** Si sur quatre semaines glissantes on compte zéro tournée non terminée
    et moins de 2 % de recharges non prévues, on rend 12 diesels de plus au 31 janvier et on monte à 72
    véhicules en février au lieu de mars. Économie : environ 35 000 €, et un mois gagné sur la fin de
    conversion.


    ---


    ## 9. Deux conditions humaines, sans lesquelles rien de ce qui précède ne fonctionne


    **Les conducteurs.** Tout ce plan repose sur un tableau de bord alimenté par ce que les conducteurs
    déclarent. Si une recharge non prévue est traitée comme une faute, les recharges non prévues disparaîtront
    du tableau de bord avant de disparaître de la réalité, et nous piloterons à l''aveugle une flotte
    de 3,1 M€. **Règle explicite, écrite et annoncée avant la première mise en service : une recharge
    non prévue signalée n''est jamais imputée au conducteur ; elle est imputée à l''affectation de la
    tournée, c''est-à-dire à nous.** Et le redécoupage des 96 tournées (D4) se fait avec les conducteurs,
    pas pour eux : ils savent lesquelles ont du mou, et cette information n''est dans aucun système.


    **Le loueur.** Il a besoin de 30 jours de préavis et nous avons besoin de sa souplesse pendant huit
    mois. Plutôt que de le prévenir au dernier moment chaque mois, on lui remet dès la semaine prochaine
    le calendrier prévisionnel complet du §5, en indiquant ce qui est ferme et ce qui est conditionnel.
    En contrepartie, on négocie le tarif de prolongation sur le volume : 176 véhicule-mois annoncés à
    l''avance ne valent pas 480 € l''unité.


    ---


    ## 10. Ce que ce plan ne prétend pas


    - Les capacités de charge sont calculées en heures de borne, ce qui reste valable quelle que soit
    la réponse à Q3, mais **le nombre de bornes nécessaires en dépend directement**.

    - La répartition des 14 bornes existantes entre les deux plateformes n''est pas au dossier. Le plan
    suppose 7/7 ; une répartition déséquilibrée déplace les seuils par plateforme et sera corrigée à réception
    de Q4.

    - La distribution des 96 tournées est inconnue. Toutes les affirmations sur « combien de tournées
    passent sous 155 km » sont **des hypothèses jusqu''à mercredi**, et sont signalées comme telles ci-dessus.

    - L''écart de coût d''usage entre diesel et électrique n''est pas chiffré au dossier. Il joue en faveur
    de l''électrique et rend le seuil de 480 € conservateur. À produire avant la revue du 15 décembre.

    - Aucune donnée de température prévisionnelle janvier-février pour les deux zones desservies. L''essai
    de mars mesurait 2 °C ; janvier peut être plus froid, auquel cas 197 km est un plafond optimiste et
    non un plancher.


    ---


    **Le fil du plan tient en une phrase :** les véhicules électriques entrent en service au rythme que
    la capacité de charge et la longueur des tournées autorisent, pas au rythme des livraisons ; et aucun
    diesel n''est rendu avant que le véhicule qui reprend sa tournée l''ait tenue.

    '
