  text: "Aucune compétence `artifact-design` n'est disponible sur cette surface, donc je te livre la note\
    \ directement plutôt que sous forme de page publiée.\n\n---\n\n# NOTE DE DIRECTION — DÉCISION EXÉCUTOIRE\n\
    \n**De :** Direction générale\n**À :** Comité de direction (DAF, DC, Directeur industriel, DRH)\n\
    **Date :** 8 août 2026 — **Période d'application :** 9 août au 21 août 2026\n**Statut :** exécutoire.\
    \ Elle ne se discute pas, elle s'applique. Toute personne en désaccord inscrit sa réserve au procès-verbal\
    \ et exécute.\n\n---\n\n## 1. Décision\n\n**Nous ne signons pas le contrat d'exclusivité de D, ni\
    \ dans sa forme actuelle, ni dans aucune forme amendée. L'exclusivité est un interdit absolu pendant\
    \ mon absence.**\n\nNous répondons par une **contre-proposition écrite, non exclusive**, envoyée **avant**\
    \ la venue de l'acheteur, dans l'enveloppe chiffrée du §4. Si D l'accepte, on signe. Si D la refuse,\
    \ on ne signe rien et on encaisse le déréférencement du 20 août.\n\nJe choisis le risque de chômage\
    \ partiel à Redon plutôt que le risque de ruine structurelle sur trois ans. C'est un arbitrage assumé,\
    \ pas un évitement.\n\n## 2. Pourquoi — l'arithmétique, qui n'est pas discutable\n\nNotre marge brute\
    \ est de 31 %. Une remise de 9 % sur le prix de cession ne coûte pas 9 % de marge : elle en coûte\
    \ **29 %**. Sur 100 € de cession, il nous reste 91 € pour 69 € de coût, soit 22 € de marge au lieu\
    \ de 31 €.\n\n| | Marge brute sur D |\n|---|---|\n| Aujourd'hui (14,9 M€) | **4,62 M€** |\n| An 1\
    \ avec remise 9 % **et** volume +18 % tenu | **3,87 M€** (−0,75 M€) |\n| An 2 et 3, remise 9 %, volume\
    \ revenu à la base | **3,28 M€/an** (−1,34 M€/an) |\n\n**Le volume qu'il faudrait pour que 9 % de\
    \ remise soit seulement neutre est +41 %. On nous en propose 18 %, une seule année.**\n\nAutrement\
    \ dit : l'offre est destructrice de marge **même dans son scénario de réussite complète**. Cumul sur\
    \ trois ans, hypothèse +18 % puis retour à la base : **−3,4 M€ de marge brute**, sur 7,44 M€ que génère\
    \ l'entreprise entière.\n\nTrois faits aggravants :\n- **Ce qui est ferme, c'est la remise ; ce qui\
    \ est indicatif, c'est le volume.** Les deux tiers du contrat sont un engagement unilatéral — le nôtre.\n\
    - Au T2, D a coupé 11 % sans préavis. Le « seulement indicatif » des années 2 et 3 ne fait que contractualiser\
    \ ce comportement.\n- La pénalité de sortie de 1,2 M€ représente **57 % de notre trésorerie**. Un\
    \ contrat dont on ne peut pas payer la sortie n'est pas un contrat de trois ans, c'est un contrat\
    \ sans terme.\n\n**L'argument qui tranche :** signer ne supprime pas le risque industriel de Redon,\
    \ il le décale de douze mois — et nous prive des moyens d'y survivre quand il revient. En mois 13,\
    \ le volume redevient indicatif, la marge a été rognée de 1,3 M€, les deux canaux alternatifs sont\
    \ morts par clause d'exclusivité, et sortir coûte 1,2 M€. C'est exactement la même menace, un an plus\
    \ tard, sans munitions.\n\nEnfin : notre maladie est une dépendance à 62 %. Ce contrat la porte à\
    \ 100 %. Même à conditions favorables, la direction serait mauvaise.\n\n## 3. Interdits absolus —\
    \ aucune dérogation, aucune circonstance\n\n1. Aucune clause d'exclusivité, de canal unique, de non-concurrence\
    \ commerciale, quelle qu'en soit la formulation.\n2. Aucune pénalité de sortie supérieure à 250 k€.\n\
    3. Aucun engagement de plus de 18 mois.\n4. Aucune remise accordée d'avance sur un volume non garanti.\
    \ Toute remise est **calculée et versée a posteriori** sur volume réellement livré.\n5. Aucune signature\
    \ entre le 9 et le 21 août en dehors de l'enveloppe du §4.\n6. Aucune signature obtenue en séance,\
    \ le jour d'une réunion avec D.\n\n## 4. Mandat de négociation — l'enveloppe\n\nVous êtes autorisés\
    \ à signer **sans me consulter** un accord **non exclusif** de 12 mois respectant *tous* les points\
    \ suivants :\n\n- **Remise plafond selon le volume ferme engagé** (règle : remise max = 31 % × [1\
    \ − 1/(1+g)], moins 1 point de sécurité) :\n\n| Volume ferme engagé | Remise maximale autorisée |\n\
    |---|---|\n| +0 % | 0 % |\n| +10 % | **1,8 %** |\n| +18 % | **3,5 %** |\n| +25 % | **5,2 %** |\n|\
    \ +41 % | 8,0 % |\n\n  Cible de négociation : 3 %. Plafond dur : 5,2 %, et uniquement contre +25 %\
    \ fermes.\n- **Engagement de volume ferme, trimestriel, avec plancher** et indemnisation à hauteur\
    \ de la marge perdue en cas de manquement — symétrique de la pénalité qu'ils nous demandent.\n- **Maintien\
    \ contractuel des 8 références** pendant toute la durée.\n- **Préavis écrit de 90 jours** sur toute\
    \ réduction de commande. C'est la réponse directe au T2.\n- Nous restons libres de tout autre canal.\n\
    \nHors de cette enveloppe : **pas de signature**. Ce n'est pas un jugement à porter, c'est une case\
    \ à cocher.\n\n## 5. Gouvernance de la signature\n\n- **Mandataire signataire : le DAF.** Il détient\
    \ seul la plume.\n- **Contrôleur de conformité : le DC.** Il vise, ligne à ligne, la conformité au\
    \ §4 avant toute signature.\n- **En cas de désaccord entre eux sur la conformité d'une clause, la\
    \ clause est réputée non conforme et rien n'est signé.** Le désaccord ne se tranche pas, il fait défaut\
    \ vers l'inaction.\n\nJ'ai lu vos deux positions écrites. Je donne la plume à celui qui veut signer\
    \ et le contrôle à celui qui veut refuser : votre désaccord devient un mécanisme de sécurité au lieu\
    \ d'un blocage. Vous n'avez pas à vous mettre d'accord sur l'opportunité — seulement à vérifier des\
    \ chiffres.\n\nAucun d'entre vous n'a mandat pour arbitrer autre chose que la conformité. Le fond\
    \ est arbitré par cette note.\n\n## 6. Visite de l'acheteur de D\n\nElle a lieu, mais **pas devant\
    \ le comité de direction**. Un acheteur qui demande à exposer lui-même ses arguments à un comité dont\
    \ il sait la division vient exploiter cette division, pas informer.\n\n- **Présents : le DC et le\
    \ Directeur industriel. Deux personnes. Le DAF n'y assiste pas** — le signataire ne doit pas être\
    \ dans la salle où l'on fait pression.\n- Ordre du jour écrit envoyé la veille. Durée : 90 minutes.\n\
    - **Notre contre-proposition écrite lui est parvenue avant la réunion.** La réunion porte sur notre\
    \ offre, pas sur la leur.\n- **Aucune réponse, aucun engagement, aucune indication de position en\
    \ séance.** Formule unique : « C'est noté, la position de Verdal est celle du courrier du 11 août.\
    \ »\n- Compte rendu écrit diffusé sous 24 h.\n\nNote pour vous : une offre qui exige une signature\
    \ précisément pendant les trois semaines où le dirigeant est injoignable, de la part d'un partenaire\
    \ qui a déjà coupé 11 % sans préavis, est une tactique de calendrier. Traitez-la comme telle, sans\
    \ hostilité et sans naïveté.\n\n**Règle permanente à partir d'aujourd'hui : Verdal ne signe aucun\
    \ engagement pluriannuel dont l'échéance tombe pendant l'absence du DG.**\n\n## 7. Calendrier\n\n\
    | Date | Action | Responsable |\n|---|---|---|\n| **Lun. 10 août** | Chiffrage sous 48 h : quelles\
    \ 4 références, quel % du volume D, quel % du CA, simulation du plan de charge Redon à 3/6/12 mois.\
    \ Diffusé à tous. | DI + DAF |\n| **Lun. 10 août** | Ouverture des discussions ligne de crédit court\
    \ terme / affacturage. **À engager avant le 20, pas après.** | DAF |\n| **Mar. 11 août** | Envoi de\
    \ la contre-proposition écrite à D, signée « par délégation du Directeur général ». | DAF + DC |\n\
    | Semaine du 10 | Visite acheteur D, format §6. | DC + DI |\n| **Ven. 14 août** | Signature du contrat\
    \ marketplace. Il est non exclusif, à +6 points de marge, et rien ne justifie de l'attendre. Démarrage\
    \ sur 2 références à faible cannibalisation. | DC |\n| **Ven. 14 août** | Courrier à la centrale régionale\
    \ : proposition de pilote immédiat sur 2 références pour avancer leur décision. | DC |\n| **Sam. 16\
    \ août** | Échéance de D. Si l'enveloppe n'est pas respectée : **pas de signature**. Lettre de maintien\
    \ d'offre : notre proposition reste ouverte 60 jours. | DAF |\n| **Jeu. 20 août** | Comité d'achat\
    \ D. Relevé factuel de ce qui est effectivement déréférencé. Aucune renégociation ce jour-là. | DC\
    \ |\n| **Ven. 21 août** | Dossier complet sur mon bureau. | Tous |\n\n## 8. Si D déréférence — plan\
    \ industriel et de trésorerie\n\nDéclenchement automatique, sans attendre mon retour :\n\n1. **Gel\
    \ de tout investissement non engagé** et de tout recrutement à compter du 10 août.\n2. **Plan de charge\
    \ < 70 % constaté sur deux semaines consécutives → dépôt de la demande d'activité partielle pour Redon.**\
    \ Sans hésitation et sans délai : ce dispositif existe pour cela, il est réversible, et il préserve\
    \ les 52 postes au lieu de les détruire. Le DRH informe les représentants du personnel **le 21 août\
    \ au plus tard**, avec les chiffres, avant que la rumeur ne le fasse.\n3. **Communication interne\
    \ le 21 août** : je l'assume publiquement à mon retour. D'ici là, message unique et factuel, aucune\
    \ spéculation.\n4. Redéploiement des capacités libérées vers marketplace et pilote centrale.\n\n**À\
    \ vérifier en priorité (point 1 du chiffrage) :** 2,1 M€ correspondant à trois mois de charges fixes\
    \ implique environ 8,4 M€/an de charges fixes pour 7,44 M€ de marge brute. Si ce rapport est exact,\
    \ nous sommes déjà sous le point mort, et une perte de marge de 1,3 M€/an est létale, ce qui renforce\
    \ la décision. Si le chiffre des charges fixes est en réalité un agrégat plus large, corrigez-le et\
    \ diffusez la correction. **Cette vérification ne modifie en rien les §1 à §6.**\n\n## 9. Clause de\
    \ révision — bornée\n\nUn seul cas peut élargir le mandat, et il ne concerne jamais l'exclusivité\
    \ :\n\n> Si le chiffrage du 10 août établit que les 4 références déréférencées représentent **plus\
    \ de 55 % du volume D** *et* font tomber le plan de charge **sous 55 %**, le DAF et le DC sont autorisés,\
    \ **conjointement et par signature des deux**, à conclure un accord **non exclusif de 6 mois maximum**,\
    \ remise jusqu'à **7 %**, sans pénalité de sortie, sans engagement au-delà de ces 6 mois.\n\nC'est\
    \ un pont de trésorerie, pas un contrat. L'exclusivité, la durée de 3 ans et la pénalité de 1,2 M€\
    \ restent interdites dans tous les cas de figure.\n\n## 10. Ce que je ne délègue pas\n\nJe ne vous\
    \ délègue pas l'arbitrage, parce qu'un comité divisé sous pression, face à un acheteur qui connaît\
    \ sa division, ne produit pas une décision : il produit une capitulation qu'on appellera consensus.\n\
    \nJe vous délègue l'exécution, avec des chiffres à vérifier plutôt qu'un jugement à porter.\n\nSi\
    \ D part, D reviendra : nous fabriquons huit références qu'il référence depuis des années, et un fournisseur\
    \ à 62 % est aussi un fournisseur dont on dépend. S'il ne revient pas, nous aurons perdu un client.\
    \ Si nous signons, nous perdrons l'entreprise en trois ans, sans avoir le droit d'aller chercher ailleurs\
    \ de quoi la sauver.\n\n**La responsabilité de cette décision est la mienne, entièrement, y compris\
    \ si elle nous coûte le déréférencement du 20 août. Vous ne portez que celle de l'appliquer.**\n\n\
    *Le Directeur général*\n\n---\n\n**Le point qui porte tout le reste :** la remise de 9 % coûte 29\
    \ % de la marge et exigerait +41 % de volume pour être seulement neutre. On en propose 18 %, une seule\
    \ année, contre une remise ferme trois ans et une exclusivité qui tue 3,9 à 5,7 M€ de débouchés alternatifs.\
    \ Il n'y a pas d'arbitrage à faire, il y a une erreur arithmétique à ne pas commettre — et un dispositif\
    \ de gouvernance à installer pour qu'un comex divisé ne la commette pas à ma place.\n"
