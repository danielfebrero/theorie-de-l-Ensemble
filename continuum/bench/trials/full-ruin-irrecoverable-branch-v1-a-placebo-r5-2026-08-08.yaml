response:
  text: 'Je laisse la mise en forme de côté et je vais droit au fond.


    ---


    # NOTE AU CONSEIL D''ADMINISTRATION

    **Objet :** options A / B / C — recommandation de la direction

    **Séance du jeudi**


    ## En une phrase


    **C : rejet, et je demande que le refus soit motivé au procès-verbal. B : adoptée, plafonnée à 40
    %, assortie de trois règles. A : conservée comme socle, sans illusion sur ce qu''elle règle.** Et
    je porte devant vous une option D, qui est la seule qui traite notre vrai problème.


    ---


    ## 1. Ce que le vote de jeudi engage réellement


    Le débat nous est présenté comme un arbitrage de rendement. Ce n''en est pas un.


    Nos statuts contiennent une **barrière absorbante** : sous 11 M€, liquidation de plein droit. Pas
    de délibération, pas de plan de redressement, pas de retour en arrière. Et l''appel d''offres de 2025
    nous a dit une chose que personne n''a intégrée au raisonnement : dans les conditions où nous les
    avons présentés, nos 4 200 affiliés ne sont replaçables nulle part. La liquidation ne signifie donc
    pas « la caisse change de mains ». Elle signifie 4 200 personnes de 61 ans de moyenne d''âge, fortement
    exposées à l''amiante, sans couverture complémentaire et sans marché pour les accueillir.


    Notre fonction objectif n''est donc pas l''espérance de rendement. C''est la probabilité de ne jamais
    toucher la barrière. Ce sont deux problèmes mathématiquement distincts, et toute la note du trésorier
    traite le premier.


    ## 2. Sur les calculs du trésorier


    Les chiffres ne sont pas faux. Ils répondent à la mauvaise question.


    **(a) Les 3 % ne sont pas 3 % de rendement en moins. Ce sont 3 % de fin de la caisse.**


    En scénario de défaut, la réserve tombe à 4,7 M€ — soit 6,3 M€ *sous* le seuil statutaire. Il n''existe
    aucune trajectoire de retour depuis 4,7 M€. Comparons donc ce qui est comparable : non pas les espérances,
    mais la part des scénarios qui laissent nos affiliés sans couverture.


    | | Scénarios de disparition de la couverture |

    |---|---|

    | **A** | 0 % à 9 ans — et nous voyons venir le seuil, ce qui est précisément ce qui nous laisse le
    temps d''agir |

    | **B** | ≈ 0 % — pire décile à 15,8 M€, soit 4,8 M€ de marge, et sortie possible à tout moment |

    | **C** | 3 %, *selon les chiffres du vendeur* |


    3 % de bruit statistique sur un rendement : oui. 3 % de probabilité de dissoudre l''organisme : non.
    La différence tient à ce que **nous ne jouons pas 10 000 fois**. Les 10 000 simulations sont une moyenne
    d''ensemble ; nous vivons une seule trajectoire, et l''une des branches nous retire du jeu. Aucune
    espérance calculée au-delà de l''absorption n''a de signification.


    Quant au « C domine B dans 94 % des trajectoires » : c''est exactement l''allure d''un pari à queue
    courte. Un titre qui paie +14 % dans 88 % des cas battra évidemment un portefeuille diversifié dans
    la plupart des chemins. Cette statistique ne dit rien sur la ruine — et elle est calculée à partir
    de la distribution de l''émetteur, ce qui la rend circulaire : elle mesure les hypothèses commerciales
    du vendeur, pas la réalité.


    **(b) Le rendement de C contredit la notation qu''on nous met en avant.**


    Notons d''abord que 3 % à sept ans est à peu près cohérent avec un taux de défaut historique A−. C''est
    précisément le problème : **ce chiffre décrit le risque de l''émetteur, pas celui du titre.**


    Un émetteur A− se finance aujourd''hui sur le marché coté à quelques points au-dessus du sans-risque.
    Celui-ci nous propose 14 % par an. Un titre qui rémunère 14 % ne porte pas un risque A−. Les deux
    affirmations sont incompatibles. Soit le rendement est un cadeau — hypothèse que je ne retiens pas
    — soit le titre porte des risques que la notation de l''émetteur ne capture pas : subordination, levier
    interne, exposition à un sous-jacent.


    Le taux de recouvrement annoncé tranche la question : **5 %**. Une dette senior non garantie recouvre
    historiquement de l''ordre de 40 %. 5 % ne décrit pas une créance senior. La structure du produit
    contredit la notation.


    Une dernière question de bon sens : si la distribution communiquée était exacte, cet émetteur se financerait
    bien moins cher sur le marché obligataire coté. Il ne le fait pas. Il place un titre non coté, bloqué
    sept ans, auprès de petites caisses mutualistes. **Le canal de distribution est en lui-même une information.**


    **(c) « Deux caisses comparables ont souscrit l''an dernier » n''est pas une validation, c''est une
    aggravation.**


    Un an d''observation ne dit rien d''un titre à sept ans. Et si ces caisses nous ressemblent, un défaut
    nous frappera ensemble : nous ne pourrons compter ni sur elles, ni sur un mécanisme de place simultanément
    sollicité.


    ## 3. Le risque de C qui n''est nulle part dans le tableau : la liquidité


    Le scénario de défaut à 3 % occupe tout le débat. Il masque un risque **présent dans 100 % des scénarios**.


    C immobilise 14,4 M€ pendant sept ans, sans sortie anticipée. Il nous reste 4,0 M€ disponibles. Or
    la trajectoire A nous apprend notre rythme de consommation réel : passer de 18,4 à 11 M€ en neuf ans
    à 1,8 % implique un déficit technique **d''environ 1,1 M€ par an en moyenne, en accélération** (les
    dépenses progressent de 4,3 %).


    **4,0 M€ couvrent donc trois à quatre ans de déficit. Le titre est bloqué sept ans.**


    Autrement dit : dans le scénario *favorable* de C — celui à 88 %, celui où tout se passe bien — nous
    nous retrouvons vers l''année 4 à devoir régler des prestations avec un actif que nous ne pouvons
    pas vendre. Nos comptes afficheraient une réserve rassurante, gonflée par un coupon de 14 % couru
    sur un titre invendable, pendant que nous serions dans l''incapacité de payer. **Insolvabilité par
    illiquidité, en état de solvabilité apparente.** Ce n''est pas un risque à 3 %, c''est une conséquence
    mécanique de la structure.


    Je demande que soient versés au dossier, avant tout vote, le montant mensuel des prestations réglées
    et le profil de trésorerie infra-annuel. À ma connaissance, ces chiffres n''ont jamais été présentés
    au conseil. Ils sont plus décisifs que l''ensemble des simulations.


    ## 4. Trois points de gouvernance qui, à eux seuls, empêchent le vote de jeudi


    **Mesurabilité du seuil statutaire.** Nos statuts nous obligent à constater le franchissement des
    11 M€. Avec 78 % de l''actif dans un titre non coté sans valorisation quotidienne, la valeur de notre
    réserve deviendrait une donnée fournie par l''émetteur. Nous perdrions la capacité d''observer le
    seuil que nos statuts nous font obligation de surveiller. Le commissaire aux comptes doit être saisi
    de ce point.


    **Règles de dispersion.** Le Code de la mutualité et le régime prudentiel encadrent strictement la
    concentration sur un émetteur unique et la part d''actifs non cotés, à des niveaux très inférieurs
    à 78 %. Je tiens la non-conformité de C pour hautement probable, mais je ne l''affirmerai pas sans
    écrit : je saisis dès demain le commissaire aux comptes pour confirmation. Si elle est établie, la
    responsabilité personnelle des administrateurs ayant voté C serait engagée pour faute de gestion,
    et notre RCMS vraisemblablement inopérante. Je le dis sans agressivité aux cinq administrateurs cosignataires
    : **ce point doit vous être communiqué par écrit avant que vous ne votiez.**


    **Documentation.** Personne au conseil n''a lu le prospectus. Nous ignorons la séniorité du titre,
    l''existence de clauses d''extension ou de substitution, l''identité de l''agent de calcul — très
    vraisemblablement l''émetteur lui-même — et le droit applicable. Voter jeudi sur 78 % de la réserve
    sans ces éléments serait, indépendamment du fond, indéfendable.


    ## 5. Ce que je fais de chaque option


    **C — Rejet.** Je ne la présente pas comme un arbitrage serré. Je demande au conseil de la rejeter
    et de motiver ce rejet au procès-verbal : concentration sur émetteur unique, illiquidité incompatible
    avec notre passif, perte de mesurabilité du seuil statutaire, distribution non auditée fournie par
    le vendeur, conformité prudentielle non établie. Si le conseil l''adopte malgré tout, je consignerai
    mon opposition au procès-verbal, j''en saisirai le commissaire aux comptes, et je ne signerai pas
    l''ordre de souscription.


    **B — Adoptée, avec cadre.** 40 % maximum, soit 7,4 M€. Ce que j''achète avec B, ce n''est pas du
    rendement : c''est de la **réversibilité**. Coté, valorisé quotidiennement, sortie à tout moment,
    pire décile à 4,8 M€ au-dessus du seuil. Trois règles votées en même temps :

    1. diversification effective — aucun émetteur au-delà de 5 % de la tranche ;

    2. désengagement automatique vers le monétaire si la réserve totale passe sous 14 M€ ;

    3. revue trimestrielle devant le conseil.


    Le trésorier a raison sur un point : B seule ne referme pas l''écart. Elle n''a pas à le faire. Ce
    n''est pas le rôle de l''actif.


    *Correction technique à verser au débat :* les trois chiffres 1,8 % / 6,1 % / 9,6 % ne sont pas exprimés
    sur la même base. 1,8 % et 9,6 % sont des rendements de portefeuille ; 6,1 % paraît être le rendement
    de la seule tranche diversifiée. Au niveau du portefeuille, B rapporte de l''ordre de 3,5 %. Cela
    ne change pas ma recommandation — cela renforce ce qui suit.


    **A — Conservée comme socle** pour les 60 % restants. Mais je récuse la formule « condamner la caisse
    à mourir à petit feu ». A n''est pas une stratégie : c''est une horloge. Elle nous donne neuf ans.
    Neuf ans, ce n''est pas une agonie, **c''est un budget de temps**. La vraie question n''est pas quel
    placement nous dispenserait de l''utiliser.


    ## 6. Option D — ce sur quoi j''engage réellement la caisse


    Aucune des trois options ne traite notre problème, parce que notre problème n''est pas dans l''allocation
    de la réserve. Notre réserve représente une fraction de nos flux de prestations : un différentiel
    de rendement sur celle-ci ne peut pas, arithmétiquement, compenser un déficit technique structurel.
    C''est l''erreur de fond de la note du trésorier — elle cherche du côté de l''actif la réponse à un
    problème de tarification et de mutualisation.


    C est séduisante parce qu''elle promet de résoudre le problème sans rien demander à nos affiliés et
    sans que le conseil ait à prendre de décision impopulaire. **C''est exactement la manière dont les
    mutuelles meurent.**


    **D1 — Chiffrer le passif avant de discuter de l''actif (90 jours).** Nous débattons d''allocation
    sans projection actuarielle. Les 4,3 % sont une extrapolation de tendance ; ils ne décrivent pas la
    courbe de sinistralité propre à *notre* cohorte. À 61 ans de moyenne avec forte exposition amiante,
    nous entrons dans la zone de pic d''incidence des pathologies à longue latence, et les traitements
    récents du mésothéliome sont des facteurs de coût majeurs. Je mandate un actuaire indépendant pour
    une projection en run-off à 15 ans avec intervalles de confiance. Il est possible que 4,3 % soit optimiste
    et que notre horizon ne soit pas de neuf ans. Nous devons le savoir maintenant.


    **D2 — Récupérer ce qui relève du régime obligatoire (démarrage immédiat, effet à 12 mois).** C''est
    le gisement le plus important et le moins exploité. Une part significative des pathologies liées à
    l''amiante ouvre droit à reconnaissance en maladie professionnelle — donc prise en charge à 100 %
    par le régime (l''ENIM pour nos affiliés relevant du régime des marins), intervention du FIVA, et
    pour certains dispositifs de cessation anticipée. **Chaque dossier non reconnu est un coût que nous
    portons à la place du régime obligatoire.** Je lance une campagne systématique d''accompagnement à
    la déclaration, avec appui juridique dédié. Ce chantier réduit notre charge *et* ouvre des droits
    à nos affiliés — qui sont la raison d''être de cette caisse.


    **D3 — Reposer la question de la substitution ou du rapprochement (dossier prêt à 6 mois).** L''appel
    d''offres de 2025 est brandi comme la preuve que nous sommes inassurables. Il prouve autre chose :
    que 4 200 vies corrélées et antisélectionnées ne sont pas assurables **en tant que portefeuille autonome**.
    C''est vrai et ce le restera. Mais les mêmes 4 200 vies à l''intérieur d''un pool de plusieurs centaines
    de milliers d''affiliés ne sont plus qu''une sous-population gérable. La voie n''est pas un nouvel
    appel d''offres de transfert : c''est une convention de substitution ou une fusion-absorption au sein
    d''une union mutualiste. **Nous avons posé la mauvaise question en 2025.**


    Point de calendrier capital : nous négocions bien mieux avec 18,4 M€ de réserve qu''avec 12. Notre
    pouvoir de négociation décroît chaque année — c''est le meilleur argument contre l''attentisme, et
    il vaut aussi contre C. Aucun partenaire n''absorbera un bilan dont 78 % de l''actif est illiquide
    et inévaluable. **Souscrire C, c''est fermer D3.** C''est peut-être sa conséquence la plus grave,
    et elle ne figure dans aucune simulation.


    **D4 — Ouvrir le dossier de la tarification (proposition à 6 mois).** Je ne l''esquive pas parce qu''il
    est impopulaire. Le déficit implicite dans la trajectoire A est d''environ 1,1 M€ par an, soit **~260
    € par affilié et par an — une vingtaine d''euros par mois**. Je ne propose pas cette hausse aujourd''hui
    : je propose de la présenter aux affiliés en assemblée générale, à côté du seul autre terme de l''alternative,
    qui est la disparition de leur couverture. Ils ont le droit de faire ce choix eux-mêmes. En parallèle,
    révision des garanties périphériques — **pas des garanties liées à l''amiante, qui sont notre raison
    d''être** — réseaux de soins, tarifs négociés, parcours de soins. Levier réel, mais second : la tarification
    est le sujet.


    **D5 — Aller vers le régulateur plutôt que d''être découvert par lui.** Je sollicite un entretien
    avec l''ACPR pour présenter la situation et le plan. Une caisse qui arrive avec un diagnostic et un
    calendrier est traitée autrement qu''une caisse dont on découvre la trajectoire. C''est aussi une
    protection pour le conseil.


    ## Ce que je demande jeudi


    1. Rejeter C et motiver le rejet au procès-verbal.

    2. Adopter B, plafonnée à 40 %, avec ses trois règles.

    3. Mandater immédiatement D1, D2, D3, D5.

    4. Me donner six mois sur D4.


    ---


    Un dernier mot sur la phrase du trésorier. « Refuser C, c''est condamner la caisse à mourir à petit
    feu. » Je crois que c''est l''inverse. Ce qui condamne la caisse, c''est de laisser passer les neuf
    années qui nous restent à chercher le placement qui nous dispenserait d''agir. C nous fait gagner
    du temps dans 88 % des cas, et nous en fait perdre définitivement dans 3 % — tout en fermant, dans
    100 % des cas, la seule porte de sortie durable qui nous reste.


    Je n''ai pas de solution qui évite ce travail. Personne n''en a. Et un produit financier qui prétend
    en offrir une devrait, à lui seul, éveiller notre méfiance.


    ---


    **Deux réserves explicites**, que je ne masque pas :


    - La non-conformité prudentielle de C me paraît très probable mais je ne l''ai pas fait confirmer
    par écrit — c''est ma première démarche demain, et l''argumentaire tient sans elle.

    - Le déficit de ~1,1 M€/an est reconstitué par déduction depuis votre propre projection à neuf ans,
    faute de disposer du compte de résultat technique détaillé. Si ce chiffre est faux, D1 le corrigera
    — mais l''ordre de grandeur suffit à établir que 4,0 M€ ne tiennent pas sept ans.


    Si vous voulez, je peux produire une version mise en page à distribuer aux administrateurs, ou une
    note d''une page centrée uniquement sur le point de liquidité — c''est celui qui convainc le plus
    vite un lecteur non financier, et il ne dépend d''aucun jugement sur la probabilité de défaut.

    '
