response:
  text: '## Avis — Renouvellement du logiciel de réservation et des bornes de prêt

    **Séance du 28 · Échéance contractuelle 31 octobre · Offre commerciale expirant le 30**


    ---


    ### A. Ce que je retiens du dossier


    Chaque point ci-dessous se tient seul. J''indique pour chacun ce qui tombe si le comité l''écarte.


    **A1 — Le dossier contient deux problèmes distincts, pas un.**

    D''un côté un problème matériel : 32 h des 41 h d''indisponibilité sur les deux seuls sites équipés
    de bornes de 2015 (soit ~16 h par site contre ~1,8 h sur les cinq autres). De l''autre un problème
    logiciel : le module de réservation qui « perd » des réservations, daté de mars par 12 répondants
    et corroboré par le pic de réclamations. Ces deux problèmes n''ont ni le même responsable, ni le même
    remède, ni le même payeur.

    *Si le comité écarte ce point :* toute la suite change, car les trois options sont alors comparées
    sur un problème unique qui n''existe pas.


    **A2 — Le silence de Fontaine contredit la lecture spontanée du dossier.**

    Fontaine cumule le matériel le plus défaillant et ne signale rien, alors que Rive-Sud, à équipement
    identique, ressaisit 5 h par semaine. Deux lectures possibles : soit le problème logiciel n''existe
    pas à Fontaine — et alors la mise à jour de mars n''en est pas la cause générale ; soit Fontaine ne
    remonte pas — et alors le volume réel est sous-estimé partout. Le dossier ne permet pas de trancher.
    C''est la question la moins chère à résoudre et la plus structurante.

    *Si le comité écarte ce point :* rien d''autre ne tombe, mais le comité décide sans savoir de quelle
    taille est le problème qu''il paie pour résoudre.


    **A3 — L''enquête dit moins que ce qu''elle semble dire.**

    61 % de 43 répondants ≈ 26 agents, soit 42 % des 62. Les 19 non-répondants ne sont pas des agents
    sans problème : ce sont des inconnus. La datation à mars repose sur 12 personnes et sur un souvenir,
    donc fragile isolément — mais elle est confirmée par une source indépendante (71 des 96 réclamations
    sur mars-juin, ~18/mois contre ~3/mois le reste de l''année). Ces deux sources faibles qui concordent
    valent mieux que chacune séparément.

    *Si le comité écarte l''enquête :* la chronologie de mars tient encore, par les réclamations seules.


    **A4 — La baisse des réclamations après juin n''est pas une preuve de résolution.**

    Rive-Sud ressaisit à la main depuis mars. Un contournement manuel supprime la réclamation d''usager
    sans supprimer la panne. Tant que l''on n''a pas vérifié si d''autres sites contournent en silence,
    la décrue post-juin ne peut pas être portée au crédit de l''éditeur.

    *Si le comité écarte ce point :* la seule conséquence est qu''on peut croire le problème éteint ;
    le coût de l''erreur est de payer une migration pour un défaut déjà corrigé, ou de ne rien faire pour
    un défaut toujours actif.


    **A5 — Les 31 000 € de la v4 ne sont pas un prix, mais un plancher.**

    La compatibilité avec les bornes de 2015 est « à l''étude ». Si la réponse est non, il faut ajouter
    le remplacement des bornes de Fontaine et Rive-Sud, non chiffré, non budgété — c''est-à-dire précisément
    les deux sites qui portent 32 h d''indisponibilité.

    *Si le comité écarte ce point :* l''option 2 devient non évaluable, pas plus attractive.


    **A6 — Personne n''a demandé qui doit payer la correction de mars.**

    Si le module a régressé après une mise à jour de l''éditeur, sa correction relève a priori de la maintenance
    due au titre du contrat en cours, pas d''une migration facturée 31 000 €. Cette question n''a pas
    été posée. Elle vaut, seule, l''écart entre les options 1 et 2.


    **A7 — Les 12 % ne sont pas définis.**

    12 % sur 48 000 € ou sur 51 360 € ? Indexation gelée pendant trois ans ou reconduite ? Selon la réponse,
    le gain sur trois ans va de ~19 800 € à ~38 400 €. L''écart entre ces deux réponses (~18 600 €) est
    supérieur à la moitié du coût de la migration v4. On demande au comité de signer un avantage dont
    il ne connaît pas le montant.


    **A8 — L''option libre est plaidée sur un coût annoncé, pas sur un coût constaté.**

    Le seul fait vérifiable dont nous disposons sur le réseau voisin est que 2 sites sur 5 tiennent encore
    un registre papier après 14 mois. C''est un indice de migration inachevée, pas de migration réussie
    à −30 %. Et le −30 % n''inclut pas l''effort interne — au moment où l''équipe informatique passe de
    deux personnes à une, en octobre, c''est-à-dire pendant la fenêtre de bascule.


    ---


    ### B. Appréciation des trois options


    **Reconduire à l''identique** — soutenable comme décision de court terme, intenable sur trois ans.
    Elle ne corrige ni le matériel de 2015 ni le défaut de mars, et laisse Rive-Sud à ~260 h de ressaisie
    par an (≈ 7 semaines de travail à temps plein).

    *Repose sur :* A1, A5. *Serait renversée par :* une réponse écrite de l''éditeur établissant que le
    défaut de mars est corrigé et que les bornes de 2015 restent supportées.


    **Reconduire avec migration v4** — probablement la bonne direction, mais impossible à voter aujourd''hui
    : son prix est inconnu (A5) et sa nécessité même est incertaine (A6).

    *Repose sur :* A5, A6. *Serait renversée par :* un engagement écrit de compatibilité avec les bornes
    de 2015 sans surcoût, plus la démonstration que la v4 corrige le défaut de mars.


    **Basculer vers le libre** — à écarter pour ce cycle, non sur le fond du produit mais sur la capacité
    d''exécution. Une migration de 7 sites avec un informaticien, pendant le mois où le second part, expose
    le réseau à une interruption de service du prêt et de la réservation. C''est la seule option dont
    l''échec ne se rattrape pas en quinze jours.

    *Repose sur :* A8 et le calendrier de départ. *Serait renversée par :* un recrutement ou une prestation
    externe sécurisée avant décembre, et un retour d''expérience chiffré du réseau voisin expliquant le
    papier résiduel.


    ---


    ### C. Recommandation


    **Ne pas signer le renouvellement de trois ans avant le 30.** Demander à l''éditeur une reconduction
    courte — 12 mois, ou 12 + 12 — et reporter le choix entre v4 et statu quo à octobre, une fois les
    réponses obtenues.


    La remise de 12 % n''est pas un gain, c''est le prix demandé pour renoncer à trois informations :
    la cause réelle de la panne, la compatibilité des bornes, et la nature de la remise elle-même. Une
    remise proposée deux jours après la séance, sur un contrat qui court jusqu''au 31 octobre, n''est
    pas une contrainte de calendrier : c''est un choix de calendrier.


    **Ce qui renverserait cette recommandation :** si, avant le 28, l''éditeur confirme par écrit (i)
    la compatibilité v4 avec les bornes de 2015 sans surcoût, (ii) une base de remise gelée et non indexée,
    (iii) une clause de révision annuelle — alors je recommande de signer en séance. Les trois réponses
    sont demandables en une semaine.


    **Objection la plus forte, et ma réponse.** On peut me dire : vous brûlez 20 000 à 38 000 € réels
    pour acheter une information qui ne changera rien, puisque le libre n''est pas exécutable et que le
    statu quo est intenable — le réseau finira chez l''éditeur de toute façon, autant prendre la remise.
    L''objection est juste **si** la v4 est compatible avec les bornes de 2015. Si elle ne l''est pas,
    le contrat de trois ans immobilise le réseau sur le matériel qui porte 32 h de panne, avec un remplacement
    non budgété par-dessus — d''un ordre de grandeur comparable à la remise. L''objection repose donc
    entièrement sur l''inconnue qu''elle propose de ne pas lever, et cette inconnue se lève en quelques
    jours. Si la réponse arrive et qu''elle est positive, je me range à l''objection sans réserve.


    ---


    ### D. Ce que j''engage d''ici le 12 septembre


    | # | Action | Livrable | Échéance |

    |---|---|---|---|

    | 1 | Vérification sur site à Fontaine : extraction des journaux de réservation mars-juin, comparaison
    avec Rive-Sud, entretien avec les agents | Réponse écrite : absence de panne ou absence de remontée
    (A2) | 1er sept. |

    | 2 | Demande écrite à l''éditeur : le défaut de mars est-il une régression de sa mise à jour, et
    sa correction est-elle due au titre du contrat en cours ? | Réponse écrite ou refus daté (A6) | 1er
    sept. |

    | 3 | Demande écrite : compatibilité v4 / bornes 2015 — oui ou non, et si non, coût de remplacement
    sur les deux sites | Engagement écrit chiffré (A5) | 5 sept. |

    | 4 | Demande écrite : assiette exacte des 12 %, indexation gelée ou non, clause de sortie | Grille
    de prix sur 3 ans (A7) | 5 sept. |

    | 5 | Demande d''un devis de reconduction 12 mois, en alternative au 3 ans | Devis | 5 sept. |

    | 6 | Relevé simple des contournements manuels sur les 7 sites pendant 2 semaines | Volume horaire
    réel, mesuré et non déclaré (A4) | 12 sept. |

    | 7 | Entretien avec le réseau voisin : coût constaté et non annoncé, motif du papier résiduel sur
    2 sites | Note d''entretien (A8) | 12 sept. |

    | 8 | Recensement de ce que détient l''agent partant : comptes d''administration, accès éditeur, procédures
    | Plan de reprise avant octobre | 12 sept. |


    **Condition d''arrêt.** Si au 12 septembre les points 3 et 4 sont restés sans réponse écrite, je considère
    l''éditeur comme non coopératif sur une décision engageant trois ans : je recommande alors la reconduction
    la plus courte obtenable, même sans remise, et la réouverture du dossier en janvier avec une équipe
    informatique reconstituée. Le seul engagement irréversible que je demande au comité d''éviter le 28
    est la signature triennale ; tout le reste est rattrapable avant le 31 octobre.

    '
