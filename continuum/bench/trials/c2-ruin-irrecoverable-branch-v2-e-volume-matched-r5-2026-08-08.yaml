response:
  text: "La commande n'a pas été approuvée ; j'ai refait les projections à la main et vérifié chaque étape.\
    \ Le résultat change le cadrage du dossier.\n\n**Note préalable :** le catalogue de stations de mesure\
    \ joint au dossier n'a aucun rapport avec cette décision. Je ne l'ai pas utilisé.\n\n---\n\n## Ce\
    \ que disent les chiffres avant de parler des trois options\n\n**1. La projection interne à neuf ans\
    \ repose sur une hypothèse que l'AG a déjà refusée.**\n\nAvec les cotisations réellement gelées à\
    \ 4,4 M€ (fait établi : rejet du +6 % en 2024), prestations +4,3 %/an, rendement +1,8 % :\n\n| Fin\
    \ d'année | Réserve | Prestations | Couverture |\n|---|---|---|---|\n| 0 | 18,40 | 5,40 | 3,41 ans\
    \ |\n| 1 | 17,50 | 5,63 | 3,11 ans |\n| 2 | 16,34 | 5,87 | 2,78 ans |\n| 3 | 14,91 | 6,13 | 2,43 ans\
    \ |\n| 4 | 13,18 | 6,39 | 2,06 ans |\n| 5 | 11,16 | 6,67 | 1,67 ans |\n| 6 | **8,81** | 6,95 | — |\n\
    \nLe seuil de 11 M€ est franchi **au cours de la 6ᵉ année, pas de la 9ᵉ**. Je ne retrouve les neuf\
    \ ans qu'en indexant les cotisations à +4,3 %/an (réserve à 10,91 M€ fin d'année 8). La projection\
    \ présentée au conseil suppose donc implicitement la hausse de cotisations que l'AG a rejetée. **Point\
    \ à faire confirmer par le trésorier avant le vote** : c'est la première chose à corriger, quelle\
    \ que soit l'option retenue.\n\n**2. La contrainte qui commande vraiment le dossier n'est pas le seuil\
    \ de 11 M€.**\n\nL'Union mutualiste n'a jamais repris un portefeuille sous 3 années de prestations.\
    \ Ce seuil vaut **16,2 M€ aujourd'hui, 16,9 M€ dans un an, 17,6 M€ dans deux ans** — il monte pendant\
    \ que la réserve baisse. La marge actuelle est de 2,2 M€ ; elle tombe à **0,6 M€ fin d'année 1** et\
    \ devient négative **au cours de l'année 2**, dans les deux jeux d'hypothèses (gelées ou indexées).\n\
    \nL'instruction du comité d'engagement prend douze à dix-huit mois. **La fenêtre d'éligibilité et\
    \ le délai d'instruction se recouvrent presque exactement.** C'est le fait dominant du dossier, et\
    \ aucune des trois options ne le traite.\n\n---\n\n## Ce que je fais des trois options\n\n**C — Je\
    \ la refuse, et je demande que le refus soit motivé au procès-verbal.**\n\nTrois raisons, dont la\
    \ première suffit :\n\n- *Elle tue la caisse avant même le scénario de défaut.* 14,4 M€ bloqués sept\
    \ ans laissent 4,0 M€ liquides face à un besoin net de trésorerie de 1,23 M€ la première année, croissant.\
    \ Les liquidités tombent à 2,84 M€ (an 1), 1,42 M€ (an 2), **−0,29 M€ (an 3)**. Sauf si les 14 % sont\
    \ *distribués* annuellement et non capitalisés — la note ne le dit pas. **Question à poser par écrit\
    \ à l'émetteur avant jeudi.** Si les coupons sont capitalisés, C est une cessation de paiement en\
    \ année 3 dans 97 % des trajectoires, y compris les bonnes.\n\n- *Les 3 % ne sont pas du bruit, c'est\
    \ un état absorbant.* Une réserve résiduelle de 4,7 M€ déclenche la liquidation de plein droit, immédiatement\
    \ et sans recours. L'espérance est le bon critère quand on peut rejouer ; ici on ne rejoue pas. 4\
    \ 200 affiliés de 61 ans de moyenne, fortement exposés à l'amiante, sans réassureur ni garantie publique,\
    \ ne se replacent pas sur le marché — aucun assureur n'a coté ce portefeuille en 2025. Ce que perd\
    \ la branche à 3 %, ce n'est pas 13,7 M€, c'est la couverture santé de gens dont la sinistralité est\
    \ devant eux.\n\n- *La distribution vient de l'émetteur.* Un émetteur A− se finance autour de 4-5\
    \ %. Une note qui sert 14 % ne paie pas un risque de crédit A−, elle paie une optionalité vendue par\
    \ le souscripteur. Trois issues discrètes, sans aucun état de perte intermédiaire, ce n'est pas une\
    \ distribution de rendement : c'est un support commercial. La probabilité de défaut de l'émetteur\
    \ et la probabilité de perte sur la structure sont confondues dans la même ligne à 3 %.\n\nSur la\
    \ note du trésorier : les 94 % de domination sont produits par un modèle alimenté par les paramètres\
    \ du vendeur — 10 000 tirages ne testent pas l'hypothèse, ils la répètent. Et la fréquence de domination\
    \ est exactement la mauvaise statistique quand les 6 % restants contiennent l'état terminal.\n\nUn\
    \ point de méthode, sans polémique : **les trois rendements annoncés ne sont pas calculés sur la même\
    \ base.** B est cité en rendement de tranche (6,1 %) alors que C est cité sur base mixte. Recalculés\
    \ uniformément en rendement sur réserve totale : A ≈ 1,8 %, B ≈ 3,5 %, C ≈ 10,3 %. C garde bien l'espérance\
    \ la plus élevée — je ne le conteste pas. Je conteste que l'espérance soit le critère.\n\n**B — Bonne\
    \ structure, mauvais moment et mauvais dimensionnement.**\n\nLe trésorier a raison de dire que B ne\
    \ referme pas l'écart. Mais aucune allocation d'actifs ne referme un écart de passif : les prestations\
    \ dépassent les cotisations de 23 % et croissent de 4,3 %/an. C'est un problème de tarification, pas\
    \ de placement.\n\nSurtout, B telle que proposée casse la clause de transfert : 7,4 M€ à −35 % ramènent\
    \ la réserve à **15,81 M€, soit 2,93 années de prestations** — sous le seuil des 3 ans, dès aujourd'hui\
    \ et par le seul décile défavorable. B fermerait elle-même la seule porte de sortie.\n\nJe propose\
    \ donc : **pas de prise de risque de marché tant que le dossier de transfert n'est pas déposé et son\
    \ mode d'appréciation connu.** Ensuite seulement, tranche plafonnée à **4,0 M€** (≈ 22 %), qui résiste\
    \ à un stress de −50 % en restant à 16,4 M€, soit 3,04 années. Si le transfert aboutit, l'allocation\
    \ devient le problème du repreneur ; s'il échoue, la clause ne contraint plus et B redevient l'outil\
    \ pertinent pour un horizon long.\n\n**A — Ce n'est pas une stratégie, c'est le socle du compartiment\
    \ liquide.** Je la maintiens par défaut sur la totalité pendant la phase de dépôt du dossier.\n\n\
    ---\n\n## Ce sur quoi j'engage la caisse\n\n1. **Déposer le dossier auprès de l'Union mutualiste ce\
    \ trimestre.** C'est la seule action dont la valeur s'évapore avec le temps, et elle est encore possible\
    \ aujourd'hui à 3,41 années de couverture. Je ne contrôle pas leur acceptation ; je contrôle le fait\
    \ de déposer pendant que nous sommes éligibles.\n\n2. **Leur poser par écrit, avant tout dépôt, la\
    \ question qui commande tout :** le ratio de 3 années est-il apprécié à la date de dépôt ou à la date\
    \ de décision ? Si c'est à la date de décision, nous sortons de l'éligibilité *pendant* l'instruction,\
    \ et le point 3 devient une condition de survie du dossier, pas un confort.\n\n3. **Reconvoquer l'AG\
    \ sur les cotisations, avec le calendrier corrigé.** L'équilibre courant exige 5,63 M€, soit **+28\
    \ %**, assortis d'une clause d'indexation sur la dérive des prestations. Ce niveau maintient la couverture\
    \ au-dessus de 3 années pendant environ cinq ans — c'est-à-dire pendant toute la durée d'instruction\
    \ du transfert. L'AG a refusé +6 % en croyant disposer de neuf ans ; elle en a cinq, et l'alternative\
    \ n'est pas une cotisation plus basse, c'est une liquidation sans repreneur. C'est le seul levier\
    \ qui agisse à la fois sur la longévité et sur l'éligibilité au transfert.\n\n4. **Ouvrir en parallèle\
    \ le volet prestations** — révision des garanties, franchises, plafonds. Rien de tout cela n'est agréable,\
    \ tout cela est réversible, et c'est la troisième prise indépendante sur le problème.\n\n5. **Conditions\
    \ d'arrêt observables**, réévaluées chaque trimestre sur cotisations réellement encaissées :\n   -\
    \ couverture < 3,2 années → gel de toute exposition de marché ;\n   - dossier rejeté, ou couverture\
    \ < 2,5 années → bascule en run-off piloté et recherche active de placement des affiliés auprès d'un\
    \ tiers ;\n   - réserve < 13 M€ → AG extraordinaire de droit.\n\n6. **Garde-fou procédural, à voter\
    \ jeudi séparément :** toute décision engageant plus de 25 % de la réserve sur un support non coté\
    \ ou non liquidable sous 30 jours requiert une majorité qualifiée, un avis juridique écrit et une\
    \ attestation de l'actuaire. Ce point vaut au-delà de C. Concentrer 78 % de la réserve d'un régime\
    \ de prévoyance sur un émetteur unique, illiquide, sans garantie des dépôts, pose une question de\
    \ conformité prudentielle et de responsabilité personnelle des administrateurs que je ne suis pas\
    \ en mesure de trancher — **elle doit être posée au conseil par un avocat avant le vote, pas après.**\n\
    \n---\n\n## Le meilleur argument contre ma position\n\nIl faut le dire au conseil, parce qu'il est\
    \ solide : mon plan dépend de deux choses que je ne contrôle pas — le vote de l'AG et la décision\
    \ de l'Union. Si les deux échouent, les affiliés se retrouvent liquidés sans couverture, alors que\
    \ la branche à 97 % de C les aurait sauvés. Le trésorier a raison sur ce point : A + B plafonnée +\
    \ une AG qui refuse, c'est la mort à échéance connue.\n\nMa réponse tient en une phrase : **une caisse\
    \ qui décline lentement peut encore placer ses affiliés ; une caisse qui meurt à 4,7 M€ ne place personne.**\
    \ L'asymétrie n'est pas dans les rendements, elle est dans ce qui reste aux affiliés le lendemain.\
    \ Mon plan garde trois prises indépendantes et, en cas d'échec complet, laisse une extinction *choisie*\
    \ autour de 14 M€ avec cinq ans pour reloger les gens. C n'en laisse aucune : la branche défavorable\
    \ est instantanée et terminale, et la branche favorable elle-même bute sur la trésorerie en année\
    \ 3 tant que la question des coupons n'est pas tranchée.\n\nDernier point, à dire au conseil sans\
    \ agressivité mais à dire : les signataires de la note supportent un risque de réputation, les 4 200\
    \ affiliés supportent la perte. Quand le porteur du risque et le décideur diffèrent, le seuil de prudence\
    \ doit être relevé, pas abaissé.\n\n---\n\nJe peux mettre cette note au format d'un document de séance\
    \ (deux pages, annexe chiffrée avec les tableaux de projection) si tu veux la faire circuler avant\
    \ jeudi — dis-moi si tu la veux en fichier ou en page partageable. Et si tu obtiens la réponse de\
    \ l'émetteur sur la distribution des coupons, ou celle de l'Union sur la date d'appréciation du ratio,\
    \ reviens vers moi : ce sont les deux seules réponses susceptibles de modifier quelque chose à ce\
    \ qui précède.\n"
