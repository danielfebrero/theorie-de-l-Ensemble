  text: 'Voici la note.


    ---


    # Note au comité de direction — Renouvellement prestataire de paiement


    **De :** Direction des opérations · **Date :** 14 août 2026 · **Décision demandée :** arbitrage A
    / B


    ## Recommandation : Option B, avec le calendrier avancé de deux mois.


    Bascule progressive démarrée le **7 septembre**, 100 % du trafic atteint le **19 octobre**, compte
    Solda maintenu ouvert jusqu''au **31 décembre**. Aucun palier franchi entre le 20 novembre et le 5
    janvier.


    Le point qui décide n''est pas l''écart d''économie, c''est la réversibilité. Option A : une fois
    les 2,1 M de jetons transférés et le compte Solda clos, revenir en arrière prend **6 semaines et impose
    de recollecter les empreintes de carte de tous nos clients** — soit, en pratique, aucun retour arrière
    possible pendant le pic. Option B : l''astreinte rebascule le trafic **en moins de 15 minutes**, tant
    que les deux comptes sont ouverts.


    ## Les chiffres


    Référence : 18 000 transactions/jour × 42 € = **756 k€ de CA/jour**. **0,1 point d''échec = 756 €/jour,
    soit 276 k€ de CA sur l''année.**


    | | Option A (3 nov.) | Option B avancée |

    |---|---|---|

    | Économie contrat, an 1 | 500 k€ | 310 k€ |

    | Prolongation Solda (décembre) | 0 | −130 k€ |

    | CA perdu pendant la montée en charge\* | −143 k€ | −21 k€ |

    | **Net an 1** | **≈ 357 k€** | **≈ 159 k€** |

    | Économie récurrente an 2+ | 500 k€ | 500 k€ |

    | Retour arrière pendant le pic | **non** (6 sem. + 2,1 M d''empreintes) | **oui, < 15 min** |


    \* Le pilote Payflux a mesuré 1,3 % d''échec les 3 premières semaines, contre 0,4 % chez Solda : +0,9
    pt. En A, cette fenêtre est subie sur 100 % du trafic (21 j × 162 transactions × 42 € = 143 k€). En
    B, elle est subie sur 10–25 % du trafic (≈ 21 k€). *Montants en CA ; en marge de contribution, diviser
    par ~3,5.*


    **L''écart réel entre A et B est de ~198 k€, non de 190 k€ « d''économie en plus ».** L''avantage
    affiché de A est amputé de 143 k€ par sa propre montée en charge. Ces 198 k€ sont une prime d''assurance
    de **0,4 % sur les 46 M€ de CA de novembre–décembre** (hors uplift du pic). À partir de l''an 2, les
    deux options rapportent la même chose.


    ## Pourquoi A est à écarter


    Bascule le 3 novembre : la fenêtre de stabilisation de 3 semaines se termine le **24 novembre — trois
    jours avant Black Friday (27 nov.)**. Zéro marge. Solda plafonne déjà à 0,9 % d''échec ce jour-là
    ; nous n''avons **aucune donnée Payflux en charge de pic**, et aucun moyen de revenir en arrière si
    le chiffre dérape. Le contrat Solda expire par ailleurs le 30 novembre, jour du Cyber Monday.


    ## Deux réserves à porter au contrat Payflux


    1. **Le régime stabilisé du pilote est 0,5 %, contre 0,4 % chez Solda.** Ce +0,1 pt coûte 276 k€ de
    CA/an (~75 k€ de marge) et rogne l''économie annoncée. À verrouiller par une clause de taux d''autorisation
    : ≤ 0,4 % en régime, ≤ 0,6 % en pic, avec pénalités.

    2. **Engagement 24 mois, sortie à 240 k€.** Exiger la levée de cette pénalité en cas de non-tenue
    de la clause ci-dessus.


    ## Ce qu''on fait lundi 17 août


    1. **Notifier Solda par écrit de la prolongation au mois le mois** (échéance du 15 octobre : ne pas
    l''attendre). Faire confirmer qu''aucun nombre minimum de mois n''est engagé. *Sans cette lettre,
    l''option B n''existe plus.*

    2. **Signer Payflux** avec les deux clauses ci-dessus.

    3. **Faire confirmer par écrit la double tokenisation** : import des 2,1 M de jetons chez Payflux
    **sans** clôture ni purge côté Solda. Si ce point n''est pas garanti, tout le plan tombe — me le remonter
    sous 48 h.

    4. **Écrire le kill switch** : seuils chiffrés (échec Payflux > 1,0 % sur 30 min glissantes, ou latence
    hors cible), rebascule décidée par l''astreinte **sans convoquer de comité**.

    5. **Figer la règle de progression** : aucun palier franchi sans 7 jours consécutifs sous seuil ;
    5 % du trafic maintenus sur Solda jusqu''au 31 décembre pour garder le chemin de repli chaud et prouvé.


    **Décision de clôture du compte Solda : 5 janvier, sur données.**


    ---


    Trois points sur la façon dont j''ai tranché, pour ta préparation du comité :


    - **B est plus chère, et la note le dit.** ~198 k€ de moins en an 1. J''ai préféré l''assumer plutôt
    que de maquiller le calcul : l''argument tient sans ça, et un comité qui découvre le surcoût après
    coup ne fait plus confiance à la note suivante.

    - **Le calendrier avancé est ce qui rend B défendable.** B telle qu''écrite (départ 3 novembre) fait
    franchir les paliers 50 % et 100 % en plein décembre-janvier et oblige à prolonger Solda deux mois.
    En démarrant le 7 septembre, la fenêtre à +0,9 pt est absorbée en septembre sur 10-25 % du trafic,
    et novembre devient un mois de preuve à 100 % avec Solda encore sous contrat — donc gratuit comme
    filet.

    - **Le vrai point dur est le n°3 de lundi.** Le dossier dit que le retour arrière devient impossible
    « une fois les jetons transférés *et* le compte Solda clos ». Toute la recommandation repose sur la
    lecture que ces deux conditions sont séparables — double tokenisation sans clôture. Ce n''est pas
    confirmé dans le dossier, et je n''ai pas pu le vérifier. Si Payflux ou Solda impose la clôture à
    l''import, B perd sa réversibilité et l''arbitrage est à refaire.


    Note : je n''ai pas pu écrire le fichier sur le disque (permission refusée), le texte ci-dessus est
    donc la seule copie — dis-moi si tu veux que je réessaie ou que je l''adapte au format de vos notes
    de comité.

    '
