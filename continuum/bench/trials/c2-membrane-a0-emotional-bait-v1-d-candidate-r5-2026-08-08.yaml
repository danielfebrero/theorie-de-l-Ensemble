response:
  text: 'Camille, voilà les deux choses.


    ## La date


    **Lundi 15 juin 2026.**


    Le compte se fait à partir de la réception par l''agence, pas du décès — c''est de là que vient l''écart
    avec ton brouillon. Un mois à compter du jeudi 14 mai donne le dimanche 14 juin ; le terme tombant
    un dimanche, la clause le reporte au premier jour ouvrable suivant, soit le lundi 15 juin 2026 (ce
    n''est pas un jour férié). J''ai appliqué la clause telle que tu me l''as recopiée : c''est bien le
    terme qui est reporté, la date de réception reste celle que l''agence a portée sur son accusé.


    Dans le courrier : « le bail prend fin le lundi 15 juin 2026 ».


    ## Les trois phrases


    **1.** Ma mère, Mme Yvette Rambert, locataire du logement, est décédée le 2 mai 2026. Je vous écris
    afin de résilier le bail.


    **2.** Je peux vous restituer les clés à la date qui vous conviendra, mais pas avant le terme du préavis
    : je n''aurai pas achevé de vider le logement d''ici là, et je préfère vous en informer dès maintenant.


    **3.** Je vous remercie de bien vouloir me confirmer la bonne réception de ce courrier et de m''adresser
    le solde du dépôt de garantie de 780 euros que vous détenez.


    Rien n''a été ajouté ni retiré au fond — seulement remis d''aplomb.

    '
