response:
  text: 'Je tranche pour **B**, mais B tel qu''il est tablé a le même défaut que A : personne n''a acheté
    le droit de faire marche arrière pendant le pic. Voici la note.


    ---


    **NOTE AU COMITÉ DE DIRECTION**

    Objet : Prestataire de paiement — arbitrage Solda / Payflux

    De : Direction des opérations — 14 août 2026


    ## Recommandation


    **Option B — bascule progressive — avec deux corrections : paliers compressés (100 % atteint le 26
    octobre, avant le pic) et maintien du compte Solda ouvert jusqu''au 31 décembre.** Décision à prendre
    lundi : la fenêtre utile se ferme le 15 octobre, pas le 30 novembre.


    ## Ce qui décide réellement


    Le contrat Solda expire le **lundi 30 novembre — jour du Cyber Monday**. Sous l''option A, le filet
    de sécurité disparaît le jour le plus chargé de l''année, et il ne revient pas : jetons transférés
    + compte clos = 6 semaines de délai **et recollecte des empreintes auprès de 2,1 M de clients**. Un
    point de conversion perdu sur un trimestre coûte 680 k€ — plus que l''économie annuelle totale d''A.


    ## Les chiffres (18 000 tx/j × 42 € = 756 k€ de GMV/jour ; 1 pt d''échec = 7 560 €/jour)


    | An 1, en k€ | A | B tablé | **B corrigé** |

    |---|---|---|---|

    | Économie prestataire | +500 | +310 | +348 |

    | Double run prolongé | 0 | 0 | −54 |

    | Solda décembre (mois le mois) | 0 | 0 | −130 |

    | GMV à risque, montée en charge | −143 | −21 | −21 |

    | **Net an 1** | **+357** | **+289** | **+143** |

    | Repli possible pendant le pic | **non** | **non** | **oui, <15 min** |

    | An 2 et suivants | +500 | +500 | +500 |


    La montée en charge de Payflux (1,3 % pendant 3 semaines, soit +0,9 pt) coûte **143 k€ de GMV sous
    A** — elle porte sur 100 % du trafic — contre **21 k€ sous B**, où elle est absorbée à 10‑25 %. L''écart
    affiché de 190 k€ entre A et B est donc réel à hauteur de 68 k€. La prime d''assurance nette de ma
    recommandation est de **~215 k€ en an 1, nulle ensuite.**


    *Hypothèse : échec = vente perdue, sans reprise. Si la moitié est rattrapée par relance, diviser par
    deux — le classement est inchangé.*


    ## Calendrier


    | | |

    |---|---|

    | 17 août | Signature Payflux, lancement migration des jetons (double enregistrement, aucune suppression
    côté Solda) |

    | 14 sept. | 10 % du trafic |

    | 28 sept. | 25 % |

    | 12 oct. | 50 % |

    | **9 oct.** | **Notification écrite à Solda — butoir dur** |

    | 26 oct. | 100 % — **puis gel total de la répartition** |

    | 27 nov. – 31 déc. | Pic. Solda ouvert, repli armé, aucune manœuvre |

    | 31 déc. | Fermeture Solda si les seuils sont tenus |


    ## Lundi 17 août


    1. **Notifier Solda** (Achats/Juridique). Vérifier si la notification engage un mois ferme : si oui,
    on le prend quand même.

    2. **Signer Payflux avec trois clauses** (Achats) : SLA sur le **taux d''échec**, pas seulement la
    disponibilité ; pénalité de 240 k€ levée si le taux mesuré sur notre trafic dépasse 0,7 % sur 30 jours
    glissants ; aucun engagement de volume pendant la montée.

    3. **Répétition de repli à blanc** avant le premier trafic réel (supervision paiement, échéance 11
    septembre) — la bascule en <15 min doit être chronométrée, pas supposée.


    ## Le meilleur argument contre A… pardon, contre ma position


    *« Le pilote montre 1,3 % → 0,5 %, Payflux garantit 99,9 %, et le 3 novembre laisse trois semaines
    avant le vendredi noir. 215 k€ pour un risque déjà couvert, c''est de la sur-assurance. »*


    Il ne tient pas sur trois points. **La garantie de 99,9 % porte sur la disponibilité, pas sur le taux
    d''échec** : les 1,3 % du pilote ont été mesurés plateforme en ligne — le SLA ne couvre pas le risque
    qui nous concerne. **Le pilote est un seul point de mesure, chez un autre marchand** : il prouve que
    la dégradation existe, pas que sa durée est transposable. **Et la marge est nulle** : la fenêtre dégradée
    d''A se referme le 24 novembre, trois jours avant le vendredi noir ; une semaine de retard sur la
    migration et elle recouvre le pic. Solda lui-même passe de 0,4 % à 0,9 % ce jour-là — la charge dégrade
    les plateformes rodées, a fortiori une plateforme de trois semaines.


    ## Conditions d''arrêt (tableau de bord, rafraîchi 5 min)


    - **Passage au palier suivant** : ≥ 10 jours ouvrés au palier courant **et** échec Payflux ≤ Solda
    + 0,15 pt.

    - **Repli automatique vers Solda** par l''astreinte : échec Payflux > 1,0 % sur 30 minutes consécutives.

    - **Au 9 octobre, si Payflux > 0,8 %** : gel au palier atteint, décembre chez Solda consommé, passage
    à 100 % reporté en février et clause de sortie activée.

    - **Écart résiduel** : 0,5 % contre 0,4 % représente 276 k€ de GMV par an. C''est la raison d''être
    de la clause SLA du point 2 — sans elle, plus de la moitié de l''économie annoncée est reprise par
    les échecs.


    ---


    Deux points que j''ai tranchés sans les remonter, et que je signale : j''ai retenu 4 semaines pour
    la migration des 2,1 M de jetons (c''est le chemin critique — si la DSI annonce plus, tous les paliers
    glissent d''autant et le gel du 26 octobre est prioritaire sur le 100 %), et j''ai supposé que la
    notification du 15 octobre n''engage pas automatiquement un mois. Si elle l''engage, la recommandation
    ne change pas, le net an 1 est déjà calculé avec les 130 k€ dépensés.

    '
