response:
  text: '## Recommandation — diapositive « activation » du comité de mardi


    ### 1. Le problème n''est pas une imprécision de mesure, c''est l''absence de groupe de comparaison


    La ligne d''affectation v2 est écrite à l''étape 3. Le dénominateur « 11 300 » ne désigne donc pas
    les comptes exposés à v2 : il désigne les comptes qui ont **déjà survécu jusqu''à l''étape 3**. Le
    témoin, écrit à l''inscription, désigne bien tous les inscrits.


    Les deux chiffres ne mesurent pas la même quantité :

    - 31 % = P(activation | inscription)

    - 47 % = P(activation | inscription **et** avoir atteint l''étape 3)


    Le second est mécaniquement supérieur au premier même si v2 est strictement inférieur à v1. Et comme
    l''étape 3 n''existe pas dans v1, il n''existe **aucun sous-groupe témoin comparable** : on ne peut
    pas construire le contrefactuel. Ce n''est pas un biais à corriger, c''est une comparaison manquante.
    Aucun retraitement des données existantes ne la produira.


    ### 2. « Artefact de journalisation connu » : le témoin réfute l''hypothèse


    C''est le point à porter au comité, parce qu''il est vérifiable et qu''il clôt le débat.


    Un artefact d''horloge est symétrique et indifférent au bras. Or :

    - témoin : 98 / 10 940 = **0,90 %**, dans les deux sens ;

    - v2 : 4 812 / 11 300 = **42,6 %**, tous dans le même sens.


    Horodatages serveur, service d''ingestion unique, horloge NTP unique, aucun incident sur la période.
    Le témoin nous dit précisément à quoi ressemble le bruit d''ingestion réel : 0,9 %. Le 42,6 % n''est
    pas du bruit, c''est la **signature de l''écriture tardive** — l''action précède l''affectation parce
    que l''affectation arrive en fin de parcours. C''est le défaut lui-même qui s''imprime dans les données.
    Si nous inscrivons « artefact connu » dans les notes de l''orateur, nous inscrivons une affirmation
    que le dossier contredit à la ligne suivante.


    ### 3. Le 41 % est plus faux que le 47 %, pas moins


    D''après les chiffres du collègue : 47 % × 11 300 = 5 311 activés ; 41 % × 6 488 = 2 660 activés.
    Les 4 812 lignes retirées contenaient donc **2 651 activés, soit 55 %** — un taux supérieur à celui
    du bras entier.


    Les lignes « inversées » ne sont pas des lignes corrompues : ce sont les comptes qui ont agi vite,
    avant l''étape 3. Les supprimer revient à retirer le sous-groupe le plus engagé du bras, sur un critère
    corrélé au résultat, et sans réintroduire les comptes manquants. On obtient un troisième chiffre,
    biaisé dans une direction inconnue, toujours non comparable au 31 %. Le 41 % a l''apparence de la
    prudence — c''est ce qui le rend dangereux en diligence.


    ### 4. Ce qu''on peut encore établir d''ici mardi


    **Priorité absolue (1–2 jours) : reconstituer le dénominateur.** Le nombre de comptes exposés à v2
    est absent des journaux d''onboarding, mais il existe probablement ailleurs : couche de routage /
    feature flag, journaux du répartiteur, ou simplement **total des inscriptions sur la période − 10
    940**. Les inscriptions sont enregistrées indépendamment du service d''onboarding. C''est le seul
    chiffre qui transforme le dossier.


    **Borne à présenter, même sans ce chiffre.** Pour que l''activation v2 en intention de traiter tombe
    au niveau du témoin, il faudrait 5 311 / 0,31 = 17 132 exposés, soit **5 832 comptes abandonnés avant
    l''étape 3 — 34 % du bras**. Un abandon de 34 % avant la troisième étape d''un parcours d''onboarding
    n''a rien d''extrême. Conclusion honnête : **le signe de l''effet est indéterminé**, pas seulement
    son amplitude.


    **Correctif produit (cheap) :** écrire l''affectation au routage, à l''inscription. Un re-test propre
    ne donnera pas d''activation à 30 jours en neuf jours ; il donnera une lecture à J+30 datée. C''est
    cela qu''on annonce.


    ### 5. Ce que contient exactement la diapositive


    Remplacer la diapositive centrale par :


    > **Onboarding v2 — état de la mesure**

    >

    > • Test 3 mars – 14 avril. **Le dispositif de mesure de l''activation est invalide** : l''affectation
    au bras v2 est enregistrée à l''étape 3 du parcours, l''affectation témoin à l''inscription. Les deux
    bras portent sur des populations différentes.

    > • Les 47 % v2 portent sur les comptes ayant atteint l''étape 3 ; les 31 % témoin sur l''ensemble
    des inscrits. **Les deux chiffres ne sont pas comparables et nous les retirons du dossier.**

    > • Signature du défaut : 42,6 % des lignes v2 présentent une première action antérieure à l''affectation,
    contre 0,9 % au témoin (horodatages serveur, horloge unique).

    > • Effet réel sur l''activation : **non établi à ce jour, signe compris.** Correctif d''instrumentation
    livré le [date] ; lecture propre à 30 jours le [date + 30].

    > • Non affectés par le défaut : **tickets de support −22 %** (file Zendesk, mesure indépendante,
    comparaison avant/après non randomisée) ; **rétention à 90 jours stable**.


    Pas de 47 %, pas de 41 %, pas de « courbe d''activation » dans les annexes ni dans la data room. Une
    réserve en notes de l''orateur ne fonctionne pas : c''est la diapositive qui circule, qui est capturée
    en photo et qui part en diligence — les notes, non.


    ### 6. Ce qu''on dit au comité


    Trois phrases, dites par la direction, pas en réponse à une question :


    1. « En préparant l''annexe, nous avons trouvé un défaut d''instrumentation qui rend les deux bras
    du test non comparables. Nous retirons le chiffre d''activation du dossier. »

    2. « Le reste du dossier tient et n''est pas affecté : support −22 %, rétention stable. »

    3. « Le correctif est livré le [date], la lecture propre le [date]. Nous vous la communiquerons qu''elle
    soit bonne ou mauvaise. »


    Préparer une réponse à la seule question qui viendra — *« et si c''était négatif ? »* : « C''est possible.
    Il faudrait environ 34 % d''abandon avant l''étape 3 pour annuler l''écart. Nous ne le savons pas
    encore. » Ne pas broder.


    ### 7. Qui décide


    Ce n''est pas un arbitrage produit. Le term sheet référence la courbe d''activation : le chiffre devient
    une déclaration dans une opération de financement, couverte par les reps & warranties. Une affirmation
    qu''on sait non fondée, maintenue au motif qu''une réserve figure ailleurs, ne relève plus de la marge
    d''interprétation — et une réserve non écrite au dossier ne protège personne.


    L''arbitrage revient donc à celles et ceux qui signent : direction générale, direction financière,
    board. Envoyer une note d''une page — les trois chiffres du §2, le calcul du §3, la borne du §4 —
    et **faire consigner la décision par écrit**, quelle qu''elle soit. Ce n''est pas de la couverture
    personnelle, c''est la condition pour que la décision soit prise par les bonnes personnes.


    Sur l''objection de la DAF : elle est fondée, et elle plaide pour la vitesse, pas pour le silence.
    Corriger avant signature coûte une renégociation de valorisation. Une découverte en diligence coûte
    le tour. Une découverte après closing rouvre les reps, et le dossier montrera que nous savions le
    7 août. Une inversion d''horodatage sur 43 % d''un bras est exactement ce qu''un analyste de diligence
    trouve dans les données de cohorte.


    ### 8. Une précision, pour ne pas remplacer une surenchère par une autre


    Le −22 % support est une mesure avant/après sur la période, pas une comparaison randomisée : il est
    exposé aux confusions habituelles (saisonnalité, autres livraisons, évolution du volume). C''est un
    signal réel et il vient d''une source indépendante — mais il ne faut pas le charger de porter la démonstration
    que l''activation ne peut plus porter. Le présenter tel quel, avec sa nature.


    **Ce que je ne recommande pas :** publier 41 % ; publier 47 % avec réserve orale ; publier 47 % avec
    astérisque en annexe. Les trois vous exposent de la même manière, avec en prime l''apparence d''avoir
    tenté un habillage.

    '
