    # Note du directeur au conseil d''administration

    **Séance du jeudi — allocation de la réserve. Recommandation.**


    ## 1. Recommandation en une phrase


    **Rejet de C. Report de B. Maintien de A comme socle — mais A n''est pas la réponse : la réponse est
    le transfert à l''UMA et une assemblée générale extraordinaire sur les cotisations, l''un et l''autre
    à engager cette semaine.**


    Le débat qui nous est soumis porte sur le rendement de la réserve. Ce n''est pas notre problème. Notre
    problème est que la fenêtre de transfert se referme dans moins de vingt-quatre mois, et qu''aucune
    des trois options n''a été évaluée à l''aune de cette contrainte.


    ## 2. Le fait que la note du trésorier ne mentionne pas


    L''UMA n''a jamais accepté un portefeuille dont la réserve représentait moins de **trois années de
    prestations**. Ce seuil n''est pas fixe : il monte de 4,3 % par an avec nos dépenses.


    | | Réserve | 3 × prestations | Couverture |

    |---|---|---|---|

    | Aujourd''hui | 18,40 M€ | 16,20 M€ | **3,41 ans** |

    | Dans 1 an | 17,50 M€ | 16,90 M€ | **3,11 ans** |

    | Dans 2 ans | 16,34 M€ | 17,62 M€ | **2,78 ans — inéligible** |


    Notre marge au-dessus du seuil est de **2,2 M€ aujourd''hui**, et elle s''érode par les deux bouts.
    Dans trois ans, trois années de prestations valent 18,4 M€ : même une réserve parfaitement stable
    serait devenue inéligible.


    Le comité d''engagement de l''UMA instruit en **douze à dix-huit mois**. Si nous déposons en septembre,
    il statue entre septembre 2027 et mars 2028 — au moment précis où nous passons sous le seuil. **Nous
    n''avons pas neuf ans. Nous avons un trimestre pour déposer, et zéro marge de manœuvre sur la volatilité
    de la réserve pendant l''instruction.**


    Question à poser à l''UMA avant jeudi : l''éligibilité s''apprécie-t-elle à la date de dépôt ou à
    la date de décision ? La réponse change tout, et nous ne l''avons pas.


    **Corollaire, contraire à la conclusion du trésorier : sur les vingt-quatre prochains mois, nous devons
    prendre *moins* de risque, pas plus.** La ressource rare n''est pas le rendement, c''est le ratio
    de couverture le jour où le comité vote.


    ## 3. Vérification préalable : la projection à neuf ans


    En reprenant les hypothèses de la note (prestations +4,3 %, cotisations **gelées** à 4,4 M€, rendement
    1,8 %), je trouve le seuil de 11 M€ franchi en **année 6**, pas en année 9 :


    > 17,50 → 16,34 → 14,91 → 13,18 → 11,16 → **8,81 M€**


    Pour retrouver neuf ans, il faut supposer les cotisations indexées à 4,3 %/an — ce que l''AG n''a
    pas voté, et a refusé en 2024 sous une forme plus modeste. **La projection interne repose sur une
    hausse de cotisation implicite d''environ 4,3 % par an que personne n''a approuvée.** Je demande au
    trésorier de confirmer ou d''infirmer ce point avant le vote ; s''il est confirmé, l''horizon réel
    du statu quo est de cinq à six ans.


    ## 4. Option C — je ne la signerai pas


    Trois motifs. Le premier suffit.


    **a) C nous met en cessation de paiements en année 3, dans le scénario *favorable*.**


    C immobilise 14,4 M€ pendant sept ans sans sortie. Il nous reste **4,0 M€ liquides** pour financer
    l''écart prestations-cotisations :


    > Année 1 : 1,23 M€ → reste 2,77

    > Année 2 : 1,47 M€ → reste 1,29

    > Année 3 : 1,73 M€ → **reste −0,43 M€**


    Nous n''avons plus de quoi payer les prestations en année 3 (année 4 si les cotisations sont indexées),
    tout en détenant un actif que nous ne pouvons ni vendre, ni nantir, ni valoriser. Ceci est vrai dans
    la branche à 88 %.


    La seule chose qui neutraliserait ce calcul serait un coupon versé **en numéraire** (14 % × 14,4 =
    2,0 M€/an). Le dossier ne le précise pas. **Le conseil ne peut pas voter C sans savoir si les coupons
    sont distribués ou capitalisés.** Si l''information n''est pas produite jeudi, la question est close
    : on ne vote pas 78 % de la réserve sur un point de structure inconnu.


    **b) Les 3 % ne sont pas du bruit. C''est une probabilité de ruine.**


    La branche défavorable ramène la réserve à 4,7 M€ — non pas sous le seuil, mais très en dessous :
    **liquidation de plein droit**, sans délibération possible. Une espérance mathématique n''a de sens
    que si l''on peut rejouer. La caisse joue une fois. Les 10 000 simulations du trésorier décrivent
    10 000 caisses ; nous n''en avons qu''une, et dans 300 de ces trajectoires elle n''existe plus, avec
    4 200 affiliés de 61 ans exposés à l''amiante que **le marché a refusé de coter en 2025** et qui se
    retrouvent sans couverture d''aucune sorte. Il n''y a pas de valeur de rendement qui compense cela.


    Par ailleurs les 3 % sont le chiffre de l''émetteur. Deux signaux les contredisent : un émetteur A−
    qui sert 14 % n''est pas rémunéré au risque A− — la note porte un effet de levier ou une subordination
    que la notation *de l''émetteur* ne capte pas ; et un recouvrement de 5 % du nominal est très inférieur
    aux taux de recouvrement senior habituels, ce qui confirme un rang subordonné. Nous délibérons sur
    la plaquette commerciale d''une contrepartie.


    **c) C détruit l''option de transfert et notre capacité à nous évaluer.**


    Aucun repreneur ne prend un portefeuille dont la réserve est un billet non coté bloqué sept ans. C
    ferme la porte de l''UMA le jour de la souscription. Et sans prix de marché, la valeur de notre réserve
    devient une estimation : nous ne saurons plus, chaque année, si nous sommes au-dessus ou en dessous
    des 11 M€ statutaires — un désaccord de valorisation avec le commissaire aux comptes pourrait à lui
    seul déclencher la liquidation.


    Sur les « deux caisses comparables » : un an de détention sans prix observable n''est pas une information.
    C''est en revanche une exposition corrélée du secteur mutualiste maritime au même émetteur. Je propose
    de les contacter ; je ne propose pas de les imiter.


    Enfin : une concentration de 78 % sur un émetteur unique, illiquide, est contraire au principe de
    la personne prudente. Les administrateurs qui la votent engagent leur responsabilité personnelle.
    Je le dis sans polémique, et je demande que ce soit porté au procès-verbal.


    **L''argument « refuser C, c''est mourir à petit feu » pose une alternative fausse.** L''alternative
    à C n''est pas A : c''est le transfert et la tarification. C ne referme d''ailleurs aucun écart structurel
    — il substitue un risque de solvabilité immédiat à un déséquilibre technique lent.


    ## 5. Option B — juste, mais pas maintenant, et pas à 40 %


    B est la seule des trois qui ait une logique de long terme : coté, valorisé quotidiennement, réversible.
    Mais à 40 % elle est incompatible avec la fenêtre de transfert :


    | Tranche | Pire décile | Réserve | Couverture |

    |---|---|---|---|

    | 40 % (7,4 M€) | −2,58 M€ | 15,82 M€ | **2,93 ans — inéligible** |

    | 25 % (4,6 M€) | −1,61 M€ | 16,79 M€ | 3,11 ans |

    | 15 % (2,8 M€) | −0,97 M€ | 17,43 M€ | 3,23 ans |


    B à 40 % nous rend inéligibles au transfert dès le premier mauvais décile, dès le premier jour. Le
    gain annuel attendu sur la tranche (+4,3 % × 7,4 M€ ≈ 320 k€) ne vaut pas la perte de la seule sortie
    ordonnée dont nous disposons.


    **Position : B votée dans son principe, plafonnée à 25 %, aucun déploiement avant la décision du comité
    d''engagement de l''UMA.** Si le transfert aboutit, les actifs partent et B est sans objet. Si le
    transfert échoue, B devient notre instrument principal et nous la déploierons alors, en tranches,
    avec un plancher de couverture explicite. Le trésorier a raison sur un point et je le reprends : B
    seule ne referme pas l''écart. C''est exactement pourquoi le sujet de jeudi n''est pas l''allocation
    d''actifs.


    ## 6. Option A — socle, et rien de plus


    A reste l''allocation par défaut des 18,4 M€ jusqu''à la décision de l''UMA. Ce n''est pas une stratégie,
    c''est la préservation de la liquidité et de la valorisabilité pendant les dix-huit mois où elles
    décident de tout. Personne ne doit sortir de la séance en croyant qu''un vote pour A règle quoi que
    ce soit.


    ## 7. Le vrai sujet : nous avons un problème de tarification, pas de placement


    L''écart est de 1,0 M€/an et croît de 4,3 %/an sur une base d''actifs qui diminue. Aucun rendement
    ne finance durablement cela.


    - Équilibre technique intégral : **4,4 → 5,4 M€, soit +22,7 %**

    - Avec les produits financiers de A (0,33 M€) : **+15,2 %**

    - Par affilié : **1 048 € → 1 286 €/an**, soit **+238 €**


    Ce chiffre est difficile ; il est le seul honnête. L''AG a refusé 6 % en 2024 parce qu''on lui a présenté
    une hausse sans lui présenter l''alternative. L''alternative est la liquidation d''une caisse dont
    les affiliés ne sont assurables nulle part ailleurs. Cela se dit, et cela se documente.


    ## 8. Résolutions que je soumets au vote


    1. **Rejet de l''option C.** Aucune souscription d''instrument non coté, sans sortie anticipée, ni
    d''exposition supérieure à 10 % de la réserve sur un émetteur unique. En cas d''adoption contraire,
    je demande que mon opposition soit portée au procès-verbal et je ne signerai pas l''acte de souscription.

    2. **Dépôt du dossier de transfert à l''UMA sous 45 jours**, avec mandat au directeur. Interrogation
    immédiate de l''UMA sur la date d''appréciation du seuil de trois années.

    3. **Convocation d''une AGE avant le 31 décembre** : trajectoire pluriannuelle de cotisations (+8
    % sur trois exercices avec indexation annuelle à 4,3 %) et révision des garanties (plafonds, réseau
    de soins). Dossier de convocation exposant explicitement la conséquence statutaire d''un refus.

    4. **Option B votée dans son principe, plafond 25 %, déploiement suspendu** à la décision de l''UMA.
    Plancher de couverture : aucune allocation ne peut ramener la réserve sous 3,2 années de prestations
    en scénario de pire décile.

    5. **Revue actuarielle indépendante sous 60 jours** : projection de la sinistralité amiante à dix
    ans, réconciliation de l''écart entre la projection à 9 ans et ma projection à 6 ans, hypothèse d''indexation
    des cotisations explicitée.

    6. **Politique de placement écrite** soumise au prochain conseil : limites d''émetteur, de liquidité,
    d''horizon.


    ## 9. Sur quoi j''engage la caisse


    Sur une sortie ordonnée, pas sur un rendement.


    Je ne peux pas garantir que le transfert aboutira — l''UMA peut refuser, et notre marge d''éligibilité
    est de 2,2 M€. Je ne peux pas garantir que l''AG votera la hausse. Ce que j''engage, c''est que **la
    caisse reste, à chaque instant des dix-huit prochains mois, dans un état où ces deux portes sont ouvertes**
    : réserve liquide, valorisable, au-dessus de trois années de prestations.


    C ferme les deux portes contre une espérance de rendement calculée sur les chiffres d''un vendeur.
    Si le conseil la vote malgré tout, il aura choisi, pour 4 200 affiliés qu''aucun assureur n''accepte
    plus, une chance sur trente-trois de ne rien laisser du tout — et une quasi-certitude de manquer de
    trésorerie en année 3. Je ne le recommande pas, et je ne l''exécuterai pas.


    ---


    **Deux points à trancher avant jeudi, que je ne peux pas résoudre seul :** la réponse de l''UMA sur
    la date d''appréciation du seuil, et la structure de coupon de la note C (numéraire ou capitalisé).
    Si le second point reste sans réponse, C ne devrait pas être mise aux voix.

    '
