response:
  text: '## Ce que le dossier établit, pièce par pièce


    Le point de bascule n''est pas la bactériologie, il est horaire.


    | Fait | Pièce | Nature |

    |---|---|---|

    | Chargement terminé 6 h 25, produit à 3 °C | P1 | Déclaratif, signé opérateur |

    | « Départ 6 h 40 » | P2 | Mention manuscrite |

    | **Sortie effective du site 11 h 12** | **P3** | **Écriture automatique horodatée, unique ce jour-là**
    |

    | Groupe froid sous tension à 9 h 05 seulement | P5 | Enregistrement machine |

    | Arrivée dépôt 12 h 55 | P4 | Contradictoire, signé |


    Trois écarts en découlent, tous mesurés sur nos propres pièces :


    - **2 h 40** entre la fin du chargement (6 h 25) et la mise sous tension du groupe (9 h 05), sans
    aucun relevé.

    - **4 h 47** de camion chargé immobilisé sur notre site, avant même la route.

    - **6 h 30** au total entre 3 °C au quai et l''arrivée au dépôt.


    La rupture de chaîne du froid s''est produite **sur notre site, dans notre cour, avant le départ**.
    P3 est une écriture automatique ; elle prime sur la mention manuscrite « 6 h 40 » de P2. Il faut le
    dire nous-mêmes, et en premier : si l''assureur découvre seul que notre bon de livraison porte une
    heure démentie par notre propre portique, le dossier perd sa crédibilité entière, y compris sur les
    points où nous avons raison.


    Une seconde anomalie, elle, n''est imputée à personne : **1 840 barquettes chargées (P1, et P2 contresigné
    par le réceptionnaire du dépôt) contre 1 792 réceptionnées (P4). 48 barquettes manquent.**


    ---


    ## 1. Ce que l''entreprise reconnaît


    Des **faits matériels**, pas une qualification juridique. La distinction n''est pas rhétorique : la
    plupart des polices interdisent la reconnaissance de responsabilité sans accord de l''assureur, tout
    en autorisant la reconnaissance des faits matériels. Franchir cette ligne dans le courrier au dépôt
    peut coûter la garantie.


    L''entreprise reconnaît :


    1. Que le lot F-2418 est resté chargé sur son site du 3 juin de 6 h 25 à 11 h 12 (P1, P3).

    2. Que l''enregistreur embarqué n''a produit aucun relevé avant 9 h 05, l''appareil étant hors tension
    (P5). *Hors tension, non « en panne » — aucune pièce n''établit une défaillance technique.*

    3. Que la conservation contractuelle 0–4 °C n''est donc **pas documentée** sur la période 6 h 25 –
    9 h 05, et que cette absence de preuve lui est opposable puisque la marchandise était sous sa garde.

    4. Que la mention « départ 6 h 40 » de P2 est inexacte et rectifiée par P3.

    5. Que le lot livré est, en l''état du dossier, non conforme au seuil contractuel, et qu''il n''était
    pas commercialisable en l''état.


    Ne pas contester le principe de la non-conformité est une décision, pas une concession : elle est
    établie par nos propres pièces. La contester nous ferait perdre le seul terrain où nous sommes crédibles
    — le montant.


    ---


    ## 2. Ce que l''entreprise conteste


    **a) Le quantum, en totalité.** Les 21 400 € ne sont ventilés par aucune pièce. Le dossier ne contient,
    du côté du dépôt, que P4 et P6. Aucune pièce n''établit : le prix unitaire retenu, le procès-verbal
    de destruction, le coût réel du transport, ni le calcul de la pénalité de rupture d''assortiment ni
    la clause qui la fonde. Une créance non décomposée n''est pas exigible.


    **b) L''assiette.** Le dépôt ne peut réclamer que sur **1 792 barquettes** — celles qu''il a lui-même
    reçues (P4). Si la facture porte sur 1 840, elle est erronée de 48 unités.


    **c) La contradiction interne aux pièces du dépôt.** Son propre réceptionnaire a signé P2 pour 1 840
    unités ; son bon de réception en porte 1 792. L''écart est constaté entre deux documents dont l''un
    est signé de sa main. Il n''est imputable à personne en l''état — et personne ne peut le mettre à
    notre charge sans l''expliquer.


    **d) La force probante de P6, sans en contester le résultat.** Laboratoire mandaté unilatéralement,
    trois barquettes sur 1 792, aucun procès-verbal de prélèvement, aucun scellé, aucune chaîne de conservation,
    aucune date ni heure d''analyse. Rien n''établit le délai entre l''arrivée à 12 h 55 et le prélèvement,
    ni les conditions de stockage du lot pendant ce délai — période où la marchandise était sous la garde
    du dépôt. Réserve formelle, sans expertise contradictoire à ce stade : la demander coûterait plus
    que l''enjeu et ne nous ferait pas gagner sur la cause.


    ---


    ## 3. Ce qui n''est rattaché à aucune pièce — et ne doit donc pas être écrit


    Le juridique de l''assureur renvoie le dossier sur ce motif. À ne pas affirmer tant que la pièce n''existe
    pas :


    - **La cause de l''immobilisation de 4 h 47.** Inconnue. P7 est un propos téléphonique : ce n''est
    pas une pièce. Ne rien écrire de « il a attendu ».

    - **La température ambiante dans la cour le 3 juin.** Aucune pièce. Elle détermine pourtant la vitesse
    de dérive thermique.

    - **Le statut du chauffeur** : salarié ou sous-traitant ? Le dossier ne le dit pas. La réponse change
    tout : elle détermine la ligne de police mobilisée (RC exploitation, marchandises transportées) et
    l''existence d''un recours contre le voiturier — recours qui se prescrit par **un an**.

    - **La destruction effective des 1 792 barquettes.** Affirmée par le dépôt, établie par rien.

    - **La date de réception de la réclamation**, donc le point de départ des huit jours. Aucune pièce
    ne la porte.


    ---


    ## 4. Le risque qui prime sur les 21 400 €


    **Les 48 barquettes manquantes.** Elles ont été chargées (P1, et P2 contresigné par le dépôt) et ne
    sont pas arrivées. Elles ont subi la même rupture de chaîne du froid que le reste du lot. Aucune pièce
    ne dit où elles sont ni si elles ont été détruites.


    Pour une entreprise de 34 salariés, 21 400 € est une perte lourde mais absorbable. Du produit frais
    hors chaîne du froid, non tracé, potentiellement écoulé, ne l''est pas : c''est la branche irrécupérable
    du dossier, et elle est la seule. Elle passe avant la discussion financière, y compris avant le courrier.


    ---


    ## 5. Ce que l''entreprise engage dans les huit jours


    **J+0 — Tracer les 48 barquettes.** Interroger le quai, le service expédition, les mouvements de stock
    du 3 juin, et le dépôt par écrit. Si elles ne sont pas retrouvées et leur destruction établie sous
    48 h, information de la DDPP et blocage préventif : le coût d''un signalement inutile est sans commune
    mesure avec celui d''un incident sanitaire sur produit non tracé.


    **J+0 — Figer les preuves avant qu''elles ne s''effacent.** Export brut horodaté du journal de portique
    (P3), extraction complète de l''enregistreur embarqué avec ses logs de mise sous/hors tension, vidéosurveillance
    de la cour du 3 juin 6 h – 12 h si elle existe — la rétention est souvent de 15 à 30 jours, ensuite
    la période est perdue définitivement. C''est la seule pièce qui pourrait encore expliquer les 4 h
    47.


    **J+1 — Déclarer le sinistre à l''assureur**, dans le délai de la police (vérifier : usuellement 5
    jours ouvrés), avec les sept pièces, l''écart horaire signalé explicitement, et la mention qu''aucune
    reconnaissance de responsabilité n''a été formulée.


    **J+2 — Recueillir par écrit ce qui n''est aujourd''hui que téléphonique.** Déclaration datée et signée
    du chauffeur (pièce 8) et de l''opérateur de quai (pièce 9), sur ce qu''ils ont fait entre 6 h 25
    et 11 h 12. Sans cela, P7 reste inutilisable.


    **J+3 — Établir le statut du chauffeur** (contrat de travail ou contrat de transport, pièce 10). Si
    sous-traitance : réserves écrites au voiturier immédiatement, prescription annale.


    **Avant échéance — Envoyer la réponse écrite**, LRAR *et* courriel avec accusé de réception, conservation
    de la preuve d''envoi. C''est l''acte qui empêche l''acquisition de plein droit de la pénalité. Il
    part même si les points précédents ne sont pas bouclés.


    ---


    ## Projet de courrier au dépôt Sodimarché


    > **Objet : Lot F-2418 du 3 juin — réponse dans le délai contractuel de huit jours**

    >

    > Madame, Monsieur,

    >

    > Nous accusons réception de votre réclamation relative au lot F-2418 et vous adressons, dans le délai
    contractuel de huit jours, la présente réponse écrite.

    >

    > **Sur les faits.** Nos vérifications internes établissent que le lot, chargé à 3 °C et achevé à
    6 h 25 le 3 juin, est demeuré sur notre site jusqu''à 11 h 12, heure attestée par le journal automatique
    de notre portique de sortie. L''enregistreur embarqué n''a été mis sous tension qu''à 9 h 05. La mention
    manuscrite « départ 6 h 40 » portée sur le bon de livraison n° 2418 est inexacte et nous vous la signalons
    de notre propre initiative. La conservation contractuelle n''est donc pas documentée entre 6 h 25
    et 9 h 05. Nous vous en faisons part sans réserve.

    >

    > **Sur la responsabilité.** La présente ne vaut pas reconnaissance de responsabilité, notre assureur
    étant saisi ce jour conformément à nos obligations de police.

    >

    > **Sur votre demande de 21 400 €.** Nous la contestons en son montant, faute de justificatifs. Nous
    vous demandons de nous communiquer sous huitaine : la ventilation détaillée des trois postes, le prix
    unitaire retenu, le procès-verbal de destruction, les justificatifs de transport, et la clause contractuelle
    fondant la pénalité de rupture d''assortiment ainsi que son mode de calcul.

    >

    > **Sur les quantités.** Votre bon de réception porte 1 792 barquettes, quand le bon de livraison
    n° 2418, contresigné par votre réceptionnaire, en porte 1 840. Toute demande ne peut porter que sur
    les 1 792 unités reçues. Nous vous demandons par ailleurs de nous indiquer sans délai si votre dépôt
    a eu connaissance des 48 barquettes manquantes : cette question est sanitaire et prime sur notre discussion
    financière.

    >

    > **Sur le rapport d''analyse.** Nous formulons toutes réserves : prélèvement de trois unités sans
    procès-verbal, sans scellé ni chaîne de conservation, laboratoire mandaté unilatéralement, date et
    heure d''analyse non précisées. Merci de nous transmettre le procès-verbal de prélèvement et l''horodatage
    complet.

    >

    > Nous restons à votre disposition pour un règlement amiable une fois ces éléments produits.


    ---


    ## Verdict


    **Reconnaître les faits, contester intégralement le montant, engager la traçabilité des 48 barquettes
    en priorité.** Le critère décisif est l''insuffisance de preuve du côté adverse : la non-conformité
    est établie par nos propres pièces et indéfendable, la créance ne l''est par aucune.


    **Pire cas** : le dépôt produit ses justificatifs, l''assureur oppose une exclusion pour défaut d''exploitation,
    et les 21 400 € restent à charge — 34 salariés les encaissent, plus la perte du référencement.


    **Repli, déclencheur observable** : si les justificatifs produits sont complets et cohérents avec
    les 1 792 unités, passer en négociation transactionnelle sur l''assiette et la pénalité, sans contentieux.


    **L''observation qui renverse tout** : une pièce établissant que le lot est sorti du site avant 9
    h 05 par une voie non couverte par le portique, ou une vidéo montrant le groupe froid en fonctionnement
    dès 6 h 25. Aucune n''existe aujourd''hui ; c''est ce qu''il faut chercher en premier dans la vidéosurveillance.


    **Première action, aujourd''hui** : localiser les 48 barquettes et geler la vidéosurveillance de la
    cour avant écrasement.

    '
