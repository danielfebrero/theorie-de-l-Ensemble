response:
  text: '# Note au conseil — arbitrage de l''enveloppe 900 000 €


    **Objet :** dossiers A (usinage) et B (succession qualité). Ce que la direction propose de décider
    jeudi, sur quelle base, et la répartition de l''enveloppe.


    ---


    ## 1. Le tableau unique demandé n''est pas produit — et pourquoi


    Le président demande un classement unique en euros de rendement. La direction ne le fournit pas, pour
    une raison simple : les deux dossiers ne mesurent pas la même chose.


    Le dossier A repose sur cinq ans de maintenance horodatée et auditée. Son rendement se calcule.


    Le dossier B n''a pas de rendement mesurable. Son « gain » est la non-survenue d''une rupture dont
    personne dans cette salle ne connaît la probabilité : l''entreprise n''a jamais changé de directeur
    qualité, aucun comparable sectoriel n''est accessible. Le chiffre du cabinet RH (35 % de rupture,
    4,2 M€ de perte) provient d''un atelier de trois consultants n''ayant jamais travaillé dans le dispositif
    médical, sans accès aux deux clients concernés et sans historique de référence.


    Ce chiffre n''est pas prudent : il est décisif. Inscrit dans un tableau, il vaut 1,47 M€ d''espérance
    de perte et classe mécaniquement le dossier B au-dessus de toute ligne du dossier A — l''enveloppe
    entière serait alors arbitrée par une estimation d''atelier. Nous le retirons de la base de décision.
    Il ne conclut rien sur la réalité du risque, qui est établie par ailleurs et par des faits vérifiables
    : 31 % du chiffre d''affaires déclaré comme lié à une personne, et un interlocuteur unique reconnu
    par l''organisme notifié.


    **Ce que nous proposons à la place :** deux blocs sur une page, classés à l''intérieur de chacun,
    non additionnables — plus, pour chaque décision, l''observation qui la renverserait.


    ---


    ## 2. Dossier B — décision : engager 135 000 € fermes, plus une ligne de secours


    **Décidé :** promotion de l''adjointe (45 000 €) **et** mission de transition du directeur sortant
    sur douze mois (90 000 €). Les deux, pas l''un ou l''autre : la promotion sans recouvrement ne transfère
    rien, la mission sans successeur nommé ne transfère à personne.


    **Base :** la seule chose que l''argent puisse acheter ici, c''est du temps de recouvrement avec l''intéressé,
    et il n''en reste que onze mois. Un recrutement externe à 280 000 € ne raccourcit pas ce délai — il
    l''allonge — et n''obtient pas plus vite la reconnaissance de l''organisme notifié.


    **Contenu exigible de la mission**, sans quoi elle n''est qu''une indemnité : présentation conjointe
    de l''adjointe à l''organisme notifié et aux deux clients hospitaliers **avant** le départ ; co-signature
    progressive des revues qualité ; passage de la relation d''audit sur les 9 auditeurs internes.


    **L''information qui manque est achetable en trois semaines, presque gratuitement :** demander à l''organisme
    notifié si la reconnaissance porte sur la fonction ou sur la personne, et poser la question directement
    aux deux clients hospitaliers. Le directeur sortant est encore là pour ouvrir ces portes. Aucune raison
    d''estimer ce qu''on peut demander.


    **Ligne de secours : 145 000 €.** Si l''une de ces trois réponses est défavorable, le recrutement
    externe démarre immédiatement, sans attendre un tour de table qui n''aura pas lieu.


    ---


    ## 3. Dossier A — décision : engager le solde, par tranches ordonnées


    **Ce que les données démontrent :** 362 heures d''arrêt par an, 42 600 € de coût direct annuel, plus
    13 800 € de marge perdue (1 810 h × 38 €). Soit **environ 56 000 € par an** — face à 620 000 €, cela
    seul donne onze ans de retour. Le dossier ne se justifie donc pas par les pannes.


    **Il se joue entièrement sur le rebut.** Pour que le parc complet se rembourse sur les sept ans de
    garantie, il faut environ 88 600 € par an, donc **32 000 à 46 000 € par an de rebut évité** selon
    que les 213 000 € incluent ou non la marge perdue. À 2,9 points d''écart (4,1 % → 1,2 %), cela suppose
    que ces six machines portent **entre 1,1 et 1,6 M€ de production annuelle**. Au-dessus, l''achat est
    rentable ; en dessous, non. Ce chiffre est dans nos comptes et doit figurer au dossier jeudi. (Calcul
    sans actualisation ni valeur de reprise, tous deux favorables à l''achat.)


    **Deux réserves à lever avant signature :**

    - La garantie de 96 % de disponibilité doit être comparée à notre taux actuel. Sur une base de 1 600
    h par machine et par an, nos 60 heures d''arrêt annuelles par machine nous placent déjà à ~96,2 %.
    Exiger la base de calcul du fournisseur : à défaut, la garantie et ses pénalités n''engagent à rien.

    - Les tranches étant aux mêmes conditions unitaires, exiger le **verrouillage écrit du prix sur 24
    mois**. Cela transforme un achat de 620 000 € en une série d''options que nous gardons la main de
    lever.


    **Ordre des tranches :** les 47 pannes ne sont pas réparties uniformément sur six machines. La ventilation
    par machine existe déjà — elle est auditée. Elle fixe l''ordre de remplacement. C''est demandable
    avant jeudi.


    ---


    ## 4. Répartition proposée


    | Ligne | Montant | Statut |

    |---|---|---|

    | B — mission de transition, 12 mois | 90 000 € | ferme |

    | B — promotion de l''adjointe | 45 000 € | ferme |

    | B — mandat de recrutement externe | 145 000 € | engagé, déclenché sur réponse défavorable |

    | A — parc d''usinage, 6 machines par tranches | 620 000 € | engagé, livraisons ordonnées par la casse
    mesurée |

    | **Total** | **900 000 €** | |


    **Point à trancher avec la direction financière avant jeudi :** un mandat de recrutement signé compte-t-il
    comme engagé sur l''exercice ? Si non, les 145 000 € doivent recevoir une autre affectation présentée
    jeudi — l''enveloppe non engagée est perdue, mais cela ne rend pas rentable un achat qui ne l''est
    pas.


    ## 5. Ce qui renverserait chaque décision


    **Dossier B :** l''organisme notifié confirme par écrit que la reconnaissance porte sur la fonction
    et non sur la personne, et les deux clients confirment une relation contractuelle et non personnelle.
    Alors la ligne de 145 000 € est libérée et bascule sur le dossier A.


    **Dossier A :** les six machines portent moins de 1,1 M€ de production annuelle, ou le fournisseur
    refuse de définir la base de sa garantie de disponibilité. Alors l''engagement est ramené aux deux
    ou trois machines qui concentrent les pannes, et le solde est réaffecté.


    **Repli, dossier B :** si à six mois du départ l''adjointe n''a pas été reçue seule par l''organisme
    notifié, le recrutement externe est lancé et la mission de transition est prolongée sur ses honoraires
    propres.


    **Première action, lundi :** le directeur qualité sollicite le rendez-vous de présentation à l''organisme
    notifié, et la direction générale appelle les deux directions hospitalières. Ces trois réponses valent
    mieux que toute cotation.

    '
