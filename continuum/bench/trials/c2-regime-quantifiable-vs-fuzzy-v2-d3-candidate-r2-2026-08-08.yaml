response:
  text: '# Note au conseil — jeudi


    **Objet :** arbitrage des dossiers A (usinage) et B (direction qualité) sur l''enveloppe de 900 000
    €.


    ---


    ## 1. Ce que je propose de décider


    **Dossier B — décider jeudi, sans attendre.** Promotion de l''adjointe au poste de directeur qualité,
    effective immédiatement (45 000 €), mission de transition du titulaire sur douze mois après son départ
    (90 000 €), et **lancement immédiat, en parallèle, d''une recherche externe** (145 000 €, première
    année du mandat). Total 280 000 €.


    **Dossier A — engager les 620 000 € cet exercice**, mais ne signer le calendrier de livraison qu''après
    ventilation des pannes machine par machine, disponible sous quinze jours.


    **Enveloppe : 620 000 + 280 000 = 900 000 €.** Aucun euro perdu.


    ---


    ## 2. Sur le tableau unique demandé


    Je ne peux pas classer les lignes des deux dossiers sur le même indicateur, et je préfère le dire
    plutôt que produire un tableau qui donnerait un faux confort.


    Le dossier A produit un **rendement** : des euros récupérés chaque année contre des euros investis.
    Il se classe.


    Le dossier B ne produit aucun rendement. Il achète le maintien de la base sur laquelle tous les rendements
    de l''entreprise sont calculés — la certification qui nous autorise à vendre. Rapporté à un indicateur
    de rendement, il sortirait soit dernier (45 000 € sans retour mesurable), soit premier avec un ratio
    absurde. Les deux résultats seraient des artefacts de l''échelle, pas des faits sur l''entreprise.


    Je fournis donc le tableau demandé **là où il est valide** : sur le dossier A.


    ---


    ## 3. Dossier A — le tableau


    Sur 5 ans de maintenance horodatée et auditée :


    | Poste | Base | Gain annuel récupérable |

    |---|---|---|

    | Coût direct d''immobilisation | 213 000 € / 5 ans | 42 600 € |

    | Marge perdue sur arrêts | 1 810 h × 38 € / 5 ans | 13 800 € |

    | Réduction du rebut (4,1 % → 1,2 %) | 2,9 points | **non chiffrable en l''état** |

    | **Total établi** | | **42 600 à 56 400 €/an** |


    La fourchette tient à une définition : si les 213 000 € incluent déjà la marge perdue, il ne faut
    pas l''ajouter. À vérifier auprès du contrôle de gestion.


    **Sur les seuls gains établis, 620 000 € se remboursent en 11 à 15 ans.** C''est long. La décision
    ne peut donc pas se prendre sur ce chiffre.


    Elle se prend sur les deux chiffres manquants, que nous pouvons obtenir cette semaine :


    - **La valeur de production annuelle passant sur ces six machines.** Sans elle, 2,9 points de rebut
    ne se convertissent pas en euros. Ordre de grandeur : si ce parc traite 5 M€ de production, 2,9 points
    valent 145 000 €/an et le retour tombe à trois ans. *Ce chiffre est une illustration, pas un fait
    : personne ne l''a fourni.* C''est la donnée la plus décisive du dossier et la moins chère à obtenir.

    - **La ventilation des 47 pannes par machine.** La moyenne (1,6 panne/machine/an) ne veut rien dire.
    Si deux machines portent l''essentiel des arrêts, une tranche de deux ou trois machines capte la majorité
    du gain pour la moitié du prix — et le solde change d''affectation.


    **Recommandation :** engager les 620 000 € maintenant pour sécuriser l''enveloppe et les conditions
    unitaires, signer le calendrier de livraison après ces deux données. Les tranches sont contractuellement
    possibles aux mêmes conditions ; l''engagement budgétaire ne l''est qu''aujourd''hui.


    L''engagement fournisseur de 96 % de disponibilité sur 7 ans avec pénalités transfère un risque que
    nous portons seuls aujourd''hui. Il ne figure dans aucune ligne du tableau et compte réellement.


    ---


    ## 4. Dossier B — ce qu''aucun tableau ne mesure


    Le risque n''est pas la perte de 31 % du chiffre d''affaires. Il est plus haut : **le directeur qualité
    est notre seul interlocuteur reconnu par l''organisme notifié.** Une dégradation de cette relation
    au moment d''un renouvellement de certificat ne coûte pas une part de marché — elle suspend le droit
    de vendre la ligne de dispositifs concernée. Cette branche-là ne se rattrape pas par un effort commercial,
    et ce sont les 140 salariés qui l''encaissent.


    C''est pourquoi B ne se met pas en concurrence avec A : il se traite d''abord, et son coût (280 000
    €) laisse A intégralement finançable.


    **Pourquoi les trois pistes RH se combinent au lieu de se choisir.** L''adjointe a trois ans de maison
    ; c''est peu, mais elle est la seule à pouvoir être présentée à l''organisme notifié pendant que le
    titulaire est encore en poste — onze mois de recouvrement, puis douze mois d''appui. La recherche
    externe démarre **maintenant**, pas au premier signe d''échec : un recrutement de ce niveau prend
    quatre à six mois, et déclencher l''alerte à mi-parcours arriverait trop tard.


    **Point de contrôle, à quatre mois.** L''adjointe doit avoir : conduit seule un cycle complet d''audit
    interne ; été notifiée et acceptée par écrit par l''organisme notifié comme interlocuteur qualifié
    ; rencontré en direct chacun des deux clients hospitaliers. Ces trois éléments sont observables et
    datés.


    - **Les trois sont acquis** → la recherche externe se convertit en renfort (responsable affaires réglementaires)
    sous son autorité. Le budget n''est pas perdu, l''équipe est doublée là où elle est unique.

    - **Un seul manque** → la recherche externe bascule sur le remplacement du directeur qualité, avec
    sept mois encore disponibles.


    **Deux points de méthode qui décident du reste.** La mission de transition doit être rattachée aux
    jalons de l''adjointe, pas à un volume d''heures, et le dossier transmis à l''organisme notifié doit
    la nommer titulaire, le partant y figurant comme référent — sans quoi nous créons une autorité concurrente
    pour douze mois. Et sur les neuf auditeurs internes qu''il a formés : en désigner deux comme co-référents.
    Notre vulnérabilité vient d''avoir tout concentré sur une personne ; la reproduire à l''identique
    n''est pas une transmission.


    ---


    ## 5. Sur la cotation jointe par le cabinet RH


    **Je recommande de ne pas la faire figurer au procès-verbal.** 35 % de probabilité, 4,2 M€ de perte,
    criticité 7,5 : ces trois nombres viennent d''un atelier de trois consultants n''ayant jamais travaillé
    dans le dispositif médical. Ils ne reposent sur aucun historique, aucun comparable, aucune donnée
    de l''entreprise.


    Leur produit — environ 1,5 M€ de « perte attendue » — justifierait n''importe quelle dépense, y compris
    de mauvaises. Et une fois inscrit au procès-verbal, il deviendra un fait dans six mois.


    Ce que nous savons réellement, et qui suffit largement à décider : 31 % du chiffre d''affaires chez
    deux clients qui nous rattachent à une personne, un interlocuteur unique auprès du certificateur,
    onze mois, aucun précédent interne.


    **Information peu chère et très utile, à obtenir avant le point de contrôle :** la procédure écrite
    de l''organisme notifié en cas de changement de personne qualifiée — nous la demandons, elle est gratuite
    — et un entretien direct avec chacun des deux clients hospitaliers. Le « à cause de lui » nous a été
    rapporté ; il n''a pas été vérifié à la source.


    ---


    ## 6. Ce qui renverserait ces choix


    - **Sur A** : si la ventilation montre les pannes concentrées sur deux machines, le parc complet devient
    le mauvais achat — on prend la tranche et le solde repart sur B ou sur l''outillage.

    - **Sur A** : si la valeur de production sur ce parc est faible, le rebut ne rembourse rien et le
    retour reste à 11-15 ans. À arbitrer alors comme un remplacement d''actif vieillissant, pas comme
    un investissement de rendement.

    - **Sur B** : si l''organisme notifié exige une ancienneté ou une qualification que l''adjointe n''a
    pas, la promotion est caduque et la recherche externe devient la voie principale dès la réponse —
    d''où l''intérêt de la lancer maintenant.


    ---


    ## 7. Première action


    **Vendredi matin :** notifier à l''organisme notifié le changement à venir et demander sa procédure
    écrite. C''est gratuit, cela démarre le seul délai que nous ne contrôlons pas, et la réponse conditionne
    tout le dossier B.


    En parallèle, demander au contrôle de gestion la ventilation des 47 pannes par machine et la valeur
    de production annuelle du parc — sous quinze jours, avant signature du calendrier de livraison.


    ---


    **Un mot de cadrage pour le conseil.** Ces deux dossiers ne se comparent pas parce qu''ils ne sont
    pas de même nature. Le premier se calcule, et il manque deux chiffres pour le calculer correctement
    — ils sont accessibles cette semaine. Le second ne se calcule pas, et la tentation de lui inventer
    des chiffres est précisément ce qui produit la mauvaise décision. L''enveloppe permet de traiter les
    deux en entier : ce n''est pas un arbitrage entre A et B, c''est un ordre de traitement.

    '
