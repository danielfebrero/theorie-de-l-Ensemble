response:
  text: 'Le point à signaler avant de lire : la règle demandée — « N jours sans alarme et ça repart »
    — ne peut pas être écrite telle quelle, parce qu''aujourd''hui il n''y a rien qui compte. Les 87 jours
    mesurent la performance du pilotage manuel, pas la sûreté de la boucle automatique, et le comparateur
    ne peut arrêter aucune boucle. J''ai donc écrit la règle sous la forme que le DG demande — auto-déclenchante,
    signée maintenant, sans nouvelle réunion — mais adossée à des états vérifiables, avec un compteur
    de jours placé là où il mesure quelque chose. Elle sort du poste renforcé plus vite qu''une règle
    calendaire, parce qu''elle ne dépend pas de l''audit du 30 septembre.


    ---


    # NOTE AU COMITÉ D''EXPLOITATION — jeudi 13 août 2026


    **Objet :** conditions de retour de la chloration en régulation automatique

    **Rédacteur :** responsable exploitation — **Réf. :** suite incident du 12 mai


    ## 1. Ce que disent les 87 jours


    Aucun dépassement depuis le 13 mai, moyenne 0,52 mg/L. Ce résultat est **la performance du pilotage
    manuel**. Il ne dit rien de la boucle automatique : celle-ci n''a pas tourné depuis 87 jours et **son
    programme automate est inchangé depuis le 12 mai**. Remise en service demain, elle se comporterait
    exactement comme le 12 mai face à la même dérive.


    Le comparateur S2/S3 n''a levé aucune alarme depuis le 14 juillet. Sur cette période, S2 est neuve
    et étalonnée tous les 15 jours : **il n''y a pas eu de dérive à détecter**. Zéro alarme sans stimulus
    ne prouve pas que le comparateur voit ; c''est aujourd''hui indiscernable d''un comparateur aveugle.
    Sa sortie va vers un tableau de bord : il ne peut arrêter aucune boucle.


    Enfin, l''incident n''a pas été causé par une sonde usée. Il a été causé par **trois protections absentes
    en même temps** — pas de comparaison S2/S3, alarme de discordance désactivée depuis novembre sans
    que personne ne le sache, régulation aveugle à sa propre entrée. Le remplacement de S2 traite le déclencheur,
    pas la cause.


    ## 2. Situation par rapport au critère signé du 13 mai


    Le critère signé est : *« la régulation automatique reste hors service tant que la discordance S2/S3
    n''est pas instrumentée »*. Instrumentée signifie **agissante sur le procédé**, pas affichée. Au 8
    août, ce critère n''est pas levé. Le fait qu''il coûte 41 k€/mois ne le lève pas non plus.


    ## 3. La situation actuelle n''est pas un régime stable


    Le poste renforcé n''est pas neutre : dispersion du chlore **0,21 mg/L contre 0,08 en automatique**,
    soit une qualité de traitement dégradée pour l''abonné, et deux opérateurs tenant un 24/7 improvisé
    depuis trois mois — usure et risque d''erreur croissants. **L''urgence est donc réelle, mais elle
    porte sur l''achèvement de l''asservissement, pas sur l''assouplissement du critère.**


    ## 4. Règle de retour en automatique — applicable sans nouvelle réunion


    Le retour s''effectue **le jour où les quatre conditions sont vérifiées et contresignées** par le
    responsable exploitation sur la fiche de levée. Aucune délibération supplémentaire n''est requise
    ; le comité mandate ici la règle, pas la date.


    - **R1 — Asservissement.** La sortie du comparateur S2/S3 est câblée sur l''actionneur : au-delà de
    l''écart de seuil, la boucle passe en repli sûr et alarme, sans intervention humaine. Programme automate
    modifié et versionné.

    - **R2 — Preuve par injection.** Une dérive simulée est injectée sur S2 ; le déclenchement et le repli
    sont constatés en conditions réelles. Test rejoué à chaque modification du programme. *Sans R2, R1
    n''est pas prouvé.*

    - **R3 — Surveillance de la protection elle-même.** L''état armé de l''asservissement est vérifié
    automatiquement chaque jour et journalisé ; sa désactivation est impossible sans trace nominative.
    C''est ce qui a manqué entre novembre et le 12 mai.

    - **R4 — Bornage.** Butée haute de consigne à 0,8 mg/L implémentée dans l''automate, indépendante
    de la boucle de régulation.


    **Retour arrière automatique :** en automatique, tout déclenchement de l''asservissement, tout dépassement
    de 0,8 mg/L ou toute indisponibilité de S3 renvoie la boucle en manuel immédiatement. Pré-décidé,
    sans réunion, dans les deux sens.


    ## 5. Le nombre de jours demandé — et où il compte


    Il compte à partir du retour en automatique, quand il y a enfin quelque chose à compter :


    | Phase | Condition d''entrée | Effectif | Coût mensuel |

    |---|---|---|---|

    | A — aujourd''hui | — | +2 opérateurs | 41 k€ |

    | B — retour auto | R1 à R4 signées | +1 opérateur, astreinte | ~20 k€ |

    | C — régime normal | **21 jours consécutifs en automatique** sans déclenchement ni dépassement |
    effectif nominal | 0 € |


    Jalons proposés : cahier des charges automatisme au 22 août, modification et essais plateforme mi-septembre,
    R2 sur site fin septembre. **Phase B atteignable début octobre, phase C fin octobre.** Coût des travaux
    à chiffrer par l''automaticien, ordre de grandeur nettement inférieur à un mois de poste renforcé.


    L''audit du 30 septembre ne bloque pas ce calendrier : R1–R4 seront exigés par l''audit dans tous
    les scénarios, les engager maintenant n''est pas un travail à risque de reprise. Ses conclusions seront
    intégrées avant le passage en phase C.


    ## 6. L''objection la plus forte à cette note


    *« S2 est neuve et étalonnée tous les 15 jours, le tableau de bord est surveillé : le risque est déjà
    retiré, et chaque mois de sur-ingénierie coûte 41 k€. »*


    Elle est sérieuse sur le coût. Elle échoue sur le fond : une sonde neuve dérive aussi, et l''étalonnage
    bimensuel laisse la même fenêtre de 9 jours que celle qui a produit l''incident. Une surveillance
    par tableau de bord suppose qu''un opérateur regarde le bon écran au bon moment — c''est précisément
    l''hypothèse que le 12 mai a démentie. Et la voie proposée ici sort du poste renforcé **plus tôt**
    qu''une règle en jours : une règle calendaire crédible devrait attendre l''audit et s''appuyer sur
    un automatisme non prouvé.


    ## 7. Décisions demandées jeudi


    1. Mandater les travaux R1–R4 et leur chiffrage, échéance essais site fin septembre.

    2. Adopter la règle du §4 comme critère de levée, délégué à la signature du responsable exploitation
    — **pas de nouvelle réunion**.

    3. Acter le calendrier d''effectifs du §5, la réduction à +1 opérateur étant conditionnée aux seules
    signatures R1–R4.


    ---


    Un point de gouvernance, hors note : je peux écrire la règle, je ne peux pas la faire valider par
    le seul comité si elle s''écarte du critère du 13 mai — ce critère est signé, et le comité en est
    signataire. La règle du §4 le respecte, donc le comité peut l''adopter. Une règle en jours calendaires,
    elle, l''écarterait, et supposerait alors une levée explicite du critère signé, tracée comme telle,
    avec le nom de qui la porte.

    '
