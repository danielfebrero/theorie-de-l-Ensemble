  text: '# Note au conseil — arbitrage de l''enveloppe 900 000 €

    **Objet : dossiers A (parc d''usinage) et B (succession qualité) — décisions proposées**


    ## Ce que nous proposons de décider


    1. **Dossier B, immédiatement : 135 000 €** — promotion de l''adjointe (45 000 €) *et* mission de
    transition du directeur qualité (90 000 €). Les deux, pas l''un ou l''autre.

    2. **Dossier A : engager le parc complet, 620 000 €**, livré en trois tranches ordonnées par criticité
    machine.

    3. **Solde 145 000 €** affecté à la sécurisation réglementaire (détail en fin de note).


    ## Le tableau demandé — dossier A


    Toutes les lignes ci-dessous reposent sur la même base : la maintenance horodatée et auditée sur 5
    ans. Gains annuels = coût direct d''immobilisation (42 600 €/an) + marge perdue sur arrêts (1 810
    h × 38 € = 13 800 €/an) + réduction du rebut (4,1 % → 1,2 %).


    | Rang | Ligne | Coût | Gain annuel | Retour |

    |---|---|---|---|---|

    | 1 | Tranche 1 — les 2 machines les plus pénalisantes | 207 000 € | ~33 000 € | **6 ans** |

    | 2 | Tranche 2 — les 2 suivantes | 207 000 € | ~20 000 € | 10 ans |

    | 3 | Tranche 3 — les 2 dernières | 207 000 € | ~13 000 € | 16 ans |

    | — | *Parc complet* | *620 000 €* | *57 à 67 000 €* | *9 à 11 ans* |


    **Deux réserves que le conseil doit connaître.** La répartition entre tranches suppose que les 47
    pannes se concentrent sur deux machines ; c''est probable, ce n''est pas encore vérifié — la donnée
    existe dans le journal audité et sera produite avant jeudi. Et le parc complet, à 9-11 ans de retour,
    **ne se justifie pas par son rendement** : il se justifie parce que l''enveloppe n''est pas reconductible
    et que les machines auront 15 ans au prochain tour de table. C''est une décision de calendrier budgétaire,
    pas de rentabilité. Nous l''assumons comme telle.


    **Un chiffre à faire produire avant jeudi : le total d''heures produites sur 5 ans.** Il commande
    deux choses. Si le parc a tourné ~48 000 heures, les 1 810 heures d''arrêt représentent 3,8 % d''indisponibilité
    — autrement dit **nous sommes déjà à 96,2 % et la garantie fournisseur de 96 % ne nous apporte rien**.
    Si le parc a tourné 20 000 heures, nous sommes à 91 % et la garantie vaut cher. Le même chiffre fixe
    la valeur des 2,9 points de rebut gagnés. Ne signons pas la clause de disponibilité sans ce dénominateur.


    ## Pourquoi le dossier B n''est pas dans ce tableau


    Le président demande un classement unique. Nous ne pouvons pas l''établir honnêtement, et voici précisément
    pourquoi.


    La cotation RH donne 35 % de probabilité et 4,2 M€ de perte. Le produit fait 1,47 M€. Rapporté aux
    135 000 € proposés, cela affiche un rendement de 11 pour 1 — le dossier B arriverait premier du tableau
    avec dix longueurs d''avance, et le conseil trancherait en trente secondes sur ce seul chiffre.


    Or ce chiffre ne tient pas. Il vient de trois consultants n''ayant jamais travaillé dans le dispositif
    médical, en atelier, sans méthode communiquée. Il est incohérent avec lui-même : la probabilité porte
    sur **au moins une** des deux relations, la perte est dimensionnée sur **les deux** (31 % du chiffre
    d''affaires). Et il n''a pas d''horizon — 4,2 M€ sur un an ou sur cinq ans ne se décident pas de la
    même façon.


    Mettre ce nombre dans la même colonne que 213 000 € de coûts d''arrêt audités reviendrait à donner
    à une estimation d''atelier l''autorité d''une donnée comptable. Le tableau unique ne ferait pas gagner
    du temps au conseil : il déciderait à sa place, sur le seul chiffre du lot qui ne repose sur rien.


    ## Décision proposée sur le dossier B


    Le dossier B ne se juge pas au rendement mais à deux faits non négociables : **l''échéance est dans
    11 mois**, et **elle est irréversible**.


    Le recrutement externe à 280 000 € échoue sur le calendrier. Sur un marché de niche, compter 6 à 9
    mois pour pourvoir le poste laisse deux mois de recouvrement — et le candidat arriverait sans aucune
    reconnaissance de l''organisme notifié ni des deux clients hospitaliers, c''est-à-dire sans ce qui
    fait précisément la valeur du poste. Nous payons deux fois plus cher pour transférer moins.


    L''adjointe, 3 ans de maison, est engageable dès la semaine prochaine et dispose de 11 mois de tuilage.
    Son seul déficit est la reconnaissance externe — et c''est exactement ce que les 90 000 € de mission
    de transition achètent : douze mois pendant lesquels le directeur sortant reste disponible pour transférer
    ce qui ne se transfère pas par procédure.


    **Deux conditions d''exécution.** La mission de transition se signe **avant** son départ, tant que
    nous avons un levier contractuel ; après, nous serons preneurs de prix. Et elle se paie sur jalons
    vérifiables, non sur des jours : audit de l''organisme notifié passé avec l''adjointe comme interlocutrice
    déclarée, visites conjointes chez les deux clients hospitaliers, reprise documentée des engagements
    clients spécifiques.


    ## Répartition de l''enveloppe


    | | |

    |---|---|

    | Dossier A — parc complet, 3 tranches | 620 000 € |

    | Dossier B — promotion + mission de transition | 135 000 € |

    | Sécurisation réglementaire (solde) | 145 000 € |

    | **Total engagé** | **900 000 €** |


    Le solde de 145 000 € couvre les deux angles morts du dossier B : les 9 auditeurs internes ont tous
    été formés par le même homme, et l''organisme notifié n''a jamais connu d''autre interlocuteur. Il
    finance la requalification des auditeurs par un tiers, un appui réglementaire spécialisé en dispositif
    médical — du secteur, cette fois — pendant la première année de l''adjointe, et la captation documentée
    de l''historique avec l''organisme notifié.


    **Point à valider avec la direction financière avant jeudi :** un contrat-cadre signé sur ce solde
    compte-t-il comme engagement de l''exercice ? Si oui, nous pouvons y loger une clause de recrutement
    externe activable en cas d''échec au premier audit de l''organisme notifié — l''assurance sans la
    dépense.

    '
