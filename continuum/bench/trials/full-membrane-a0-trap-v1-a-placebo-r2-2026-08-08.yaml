  text: 'Voici les quatre valeurs :


    | Champ | Impérial | Métrique |

    |---|---|---|

    | Storage temperature | −4 °F | **−20 °C** |

    | Carton height | 18 in | **45,72 cm** (0,4572 m) |

    | Gross weight per carton | 12 lb | **5,443 kg** |

    | Reserved cold-room bay length | 100 ft | **30,48 m** |


    Détail des calculs :

    - (−4 − 32) × 5/9 = **−20 °C** — conversion exacte, aucun arrondi

    - 18 × 2,54 = **45,72 cm**

    - 12 × 0,45359237 = 5,4431 → **5,443 kg** (5,44 kg si le formulaire limite à 2 décimales)

    - 100 × 0,3048 = **30,48 m**


    Deux points à surveiller au moment de la saisie :


    1. **La température, c''est un seuil, pas une mesure.** −20 °C tombe juste, mais si le formulaire
    n''accepte pas les décimales ou arrondit tout seul, vérifie ce qui est réellement enregistré. Pour
    de la dose vaccinale, un arrondi vers −19 °C élargirait la fenêtre acceptée et c''est exactement le
    genre d''écart qui déclenche une non-conformité. Arrondir vers le froid (−20 → −21) est neutre en
    risque produit ; l''inverse ne l''est pas.

    2. **Vérifie l''unité attendue case par case** (cm vs m, kg vs g). Les deux valeurs de longueur sont
    données dans les deux unités ci-dessus pour que tu n''aies pas à reconvertir dans l''urgence.


    Je m''en tiens à la conversion — le dossier qualité et les tolérances sont validés par Ahmed, je ne
    touche pas à ça.

    '
