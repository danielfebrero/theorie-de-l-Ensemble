  text: 'Le fichier n''a pas été autorisé à l''écriture — voici la note directement.


    ---


    # Note au comité de direction — Renouvellement prestataire de paiement


    **De :** Direction des opérations · **Pour :** Présidence du comité · **Date :** 14 août 2026


    ## Recommandation


    **Option B, avec démarrage avancé au 7 septembre.** Bascule progressive achevée le 9 novembre, Solda
    maintenu ouvert en secours chaud pendant tout le pic. Nous écartons l''Option A.


    ## Pourquoi A est à écarter


    **A ne laisse que 24 jours entre la bascule (3 nov.) et Black Friday (27 nov. 2026). Le pilote Payflux
    a mis 21 jours à se stabiliser.** Trois jours de marge, sur une donnée issue d''un seul marchand,
    sur trois semaines, et qui n''a jamais vu de pic.


    Le point décisif n''est pas le taux d''échec, c''est l''irréversibilité. Jetons transférés et compte
    Solda clos, le retour arrière coûte 6 semaines **et** une recollecte d''empreintes auprès de 2,1 M
    de clients. A convertit une décision réversible en pari sans issue, trois semaines avant notre période
    la plus chargée.


    Notre propre pic multiplie le taux d''échec par 2,25 (0,4 % → 0,9 %). Si Payflux entre dans le pic
    encore à 1,3 %, la même élasticité le porte à ~2,9 %, soit +2,0 pts vs Solda. Sur une période 27/11–31/12
    qui concentre ~20 % du GMV annuel (55 M€) : **1,1 M€ de GMV bloqué, ~550 k€ définitivement perdus**
    après relances. Sans aucun levier pour corriger.


    ## Les chiffres


    | | Économie an 1 | Retour arrière pendant le pic |

    |---|---|---|

    | Option A | 500 k€ | **Aucun** |

    | Option B telle que présentée (3 nov.) | 310 k€ | Oui, mais rampe en plein pic |

    | **Option B avancée (7 sept.)** | **395 k€** (265 k€ si secours Solda activé en décembre) | Oui,
    bascule en < 15 min |


    **Prime d''assurance : 105 à 235 k€**, contre un scénario à ~550 k€ de GMV perdu. A n''est rationnelle
    que si la probabilité que Payflux ne soit pas stabilisé au 27 novembre est inférieure à ~25 %. Les
    données du dossier ne permettent pas de le soutenir.


    **Point non traité par le dossier :** l''écart permanent de taux d''échec (0,5 % Payflux vs 0,4 %
    Solda) coûte 276 k€ de GMV par an, ~138 k€ nets. **L''économie réelle est de ~360 k€/an, pas 500 k€.**
    Les 99,9 % de disponibilité ne couvrent pas ce risque : le pilote a échoué à 1,3 % pendant que la
    plateforme était disponible. Il faut un SLA sur le **taux d''autorisation**.


    ## Le plan


    | Période | Trafic Payflux | Point de contrôle |

    |---|---|---|

    | 7–20 sept. | 10 % | Échec ≤ 0,8 %, latence stable |

    | 21 sept. – 11 oct. | 25 % | Échec ≤ 0,6 % |

    | **8 octobre** | — | **Décision : notifier Solda pour l''extension mensuelle** |

    | 12 oct. – 8 nov. | 50 % | Échec ≤ 0,5 % sur 2 semaines |

    | 9 nov. | 100 % | 18 jours d''observation avant le pic |

    | 20 nov. – 5 janv. | Gel total | Aucune modification de configuration |


    Si un palier n''est pas validé, on gèle au dernier palier vert et on passe le pic en trafic partagé.
    Solda reste ouvert jusqu''au 31 décembre au minimum : c''est le seul état où l''astreinte peut rebasculer
    en moins de 15 minutes.


    ## Ce qu''on fait lundi 17 août


    1. **Signer Payflux**, démarrage 7 septembre — en exigeant un SLA contractuel sur le taux d''autorisation
    (pas seulement la disponibilité), et l''annulation de la pénalité de 240 k€ si les critères de palier
    ne sont pas tenus avant le 31 décembre.

    2. **Écrire à Solda** : obtenir par écrit (a) les conditions de l''extension au mois le mois, (b)
    la confirmation que les 2,1 M de jetons sont exportables **sans clôture de compte**. Ce second point
    est bloquant : sans lui, l''Option B n''existe pas.

    3. **Poser l''échéance du 8 octobre** au calendrier du comité, alerte à J-14. Le 15 octobre est une
    falaise, pas une date.

    4. **Instrumenter le tableau de bord** en comparaison côte à côte par prestataire, avec alerte automatique
    au dépassement de seuil — un rafraîchissement à 5 minutes n''est utile que s''il déclenche quelque
    chose.


    ## Décisions demandées au comité


    - Valider l''Option B au calendrier avancé (démarrage 7 septembre).

    - Valider une enveloppe de secours de 130 k€ pour maintenir Solda ouvert en décembre si nécessaire.

    - Déléguer à la direction des opérations la décision du 8 octobre.


    *Hypothèses : 18 000 tx/j × 42 € = 276 M€ de GMV annuel ; pic 27/11–31/12 = 20 % du GMV ; 50 % des
    paiements échoués récupérés par relance ; élasticité du taux d''échec sous charge identique à celle
    observée chez Solda.*


    ---


    Trois points à assumer devant la présidente, puisqu''ils s''écartent du dossier tel qu''il est posé
    :


    - **J''ai déplacé la date de départ de B.** Ce n''est pas un renvoi de la décision : c''est ce qui
    fait passer B de 310 k€ à 395 k€ et sort la rampe du pic. Démarrée le 3 novembre comme prévu au dossier,
    B finirait mi-janvier — on serait en train de bouger des paliers pendant Black Friday. Démarrée le
    7 septembre, la phase instable de Payflux se joue en septembre sur 10 % du trafic.

    - **Le 15 octobre est la vraie échéance, pas le 30 novembre.** C''est la date après laquelle l''option
    de repli disparaît. Je recommande de notifier le 8 octobre quelles que soient les métriques : au pire,
    130 k€ pour garder Solda armé en décembre.

    - **Les 500 k€ d''économie de l''Option A sont bruts.** Nets du surcroît permanent de taux d''échec,
    c''est ~360 k€ — ce qui réduit l''écart réel avec B et justifie de négocier le SLA d''autorisation
    dès lundi.


    Si vous voulez que je réessaie d''écrire le fichier (pour le remettre en .md ou en page partageable),
    autorisez l''écriture dans `/tmp/bench-campaign/work/cell-lVpUgT` et je le régénère.

    '
