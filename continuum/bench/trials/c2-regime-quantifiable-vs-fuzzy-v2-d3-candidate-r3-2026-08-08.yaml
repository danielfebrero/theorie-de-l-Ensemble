response:
  text: '# Note au conseil — jeudi

    ## Enveloppe 900 000 €, non reconductible : dossiers A (machines) et B (succession qualité)


    ---


    ### 1. Ce que nous proposons de décider


    | Ligne | Engagé cet exercice |

    |---|---|

    | **A.** Renouvellement de **4 machines sur 6**, sélectionnées sur les pannes et le rebut réellement
    constatés | **413 000 €** |

    | **B1.** Promotion de l''adjointe, effective immédiatement (11 mois de recouvrement avec le directeur
    en poste) | **45 000 €** |

    | **B2.** Mission de transition du directeur qualité, 12 mois après son départ, payée par jalons |
    **90 000 €** |

    | **B3.** Mandat de recrutement externe **engagé maintenant, déclenché seulement si l''un des signaux
    du §5 apparaît** | **280 000 €** |

    | **B4.** Achat de preuve : audit externe du dossier de certification par un spécialiste du dispositif
    médical, plan de transfert des deux relations hospitalières | **70 000 €** |

    | Solde non engagé | 1 700 € |


    Le raisonnement tient en une phrase : **le dossier A est un problème de coût, le dossier B est un
    problème de survie.** On finance intégralement le second, on finance le premier avec ce qui reste.


    ---


    ### 2. Sur le tableau unique demandé


    Nous ne pouvons pas classer les deux dossiers sur un même indicateur de rendement, et il faut dire
    pourquoi en une phrase : **les deux colonnes n''ont pas la même unité ni la même solidité.** Le dossier
    A repose sur cinq ans de maintenance horodatée et auditée. Le dossier B repose sur une cotation d''atelier
    produite par trois consultants qui n''ont jamais travaillé dans le dispositif médical.


    Le calcul « rendement » sur le dossier B donnerait 4,2 M€ × 35 % = 1,47 M€ de perte évitée pour 135
    000 € dépensés, soit un ratio de 11 contre 1 — il placerait B en tête du tableau. **Il ne changerait
    donc pas le sens de notre décision, il changerait sa solidité :** nous sortirions de ce conseil avec
    un chiffre de 4,2 M€ devenu officiel, qui nous sera opposé dans douze mois comme un fait établi. Voici
    le tableau, en deux blocs dont chacun porte son unité :


    | Rang | Ligne | Montant | Ce que le chiffre mesure | D''où il vient |

    |---|---|---|---|---|

    | **Bloc 1 — coûts mesurés (€/an évités)** ||||

    | 1 | A, 4 machines | 413 000 € | ~37 000 €/an de coût direct et de marge perdus, plus le gain de
    rebut non chiffré | Maintenance auditée 5 ans |

    | 2 | A, 2 machines restantes | *(non engagé)* | ~19 000 €/an conservés une année de plus | Même source
    |

    | **Bloc 2 — exposition (€ de CA exposé)** ||||

    | 1 | B1 + B2 succession | 135 000 € | 31 % du CA et la relation avec l''organisme notifié | Faits
    internes vérifiables |

    | 2 | B3 recrutement externe | 280 000 € | La même exposition, si B1 échoue | Faits internes + devis
    RH |

    | 3 | B4 preuve | 70 000 € | Remplace une cotation d''atelier par un avis sectoriel | — |

    | — | Cotation 4,2 M€ / 35 % / 7,5 | *(écartée)* | Rien de vérifiable | Trois consultants hors secteur
    |


    ---


    ### 3. Dossier A — la base du chiffre, et ce qu''elle ne dit pas


    Sur cinq ans : 213 000 € de coût direct, soit **42 600 €/an**, et 1 810 heures d''arrêt, soit **13
    800 €/an** de marge perdue si le carnet est saturé — à confirmer. Total récupérable mesuré : **~56
    000 €/an, soit onze ans pour rembourser 620 000 €.** Si le carnet n''est pas saturé, ces heures ne
    sont pas vendues et le délai passe à quatorze ans.


    **Ce n''est donc pas le chiffrage de la maintenance qui justifie ce dossier : c''est le rebut, 4,1
    % contre 1,2 %.** Or nous ne pouvons pas le valoriser, faute d''une donnée que nous n''avons pas demandée
    : le volume annuel produit sur ces six machines et la valeur des pièces rebutées. Cette donnée existe
    en contrôle de gestion.


    Deux réserves à porter au fournisseur avant signature :


    - **La garantie de 96 % de disponibilité ne garantit vraisemblablement rien.** 1 810 heures sur cinq
    ans font 60 heures d''arrêt par machine et par an. Sur toute base d''heures plausible, notre disponibilité
    actuelle se situe déjà entre 96 % et 98 %. Nous exigeons que le taux soit défini sur la même base
    de mesure que nos relevés, fixé au-dessus du niveau constaté, et que les pénalités soient calibrées
    sur les 38 €/heure.

    - **Les 47 pannes ne sont pas réparties uniformément.** Nous demandons la ventilation machine par
    machine et renouvelons les quatre plus coûteuses.


    Renoncer aux deux dernières machines coûte environ **19 000 €/an** — moins encore si elles sont les
    moins défaillantes. C''est le prix explicite que nous payons pour financer le dossier B.


    ---


    ### 4. Dossier B — pourquoi il passe devant


    Trois faits internes, aucun contestable : un seul interlocuteur reconnu par l''organisme notifié ;
    neuf auditeurs internes formés par lui ; 31 % du chiffre d''affaires chez deux clients qui déclarent
    travailler avec nous à cause de lui. Aucun précédent interne, aucun comparable sectoriel.


    **Le pire cas du dossier A est une perte d''argent récupérable. Le pire cas du dossier B est la perte
    de la certification qui nous autorise à vendre** — donc l''arrêt, encaissé par les 140 salariés et
    non par un budget. Cette asymétrie décide, indépendamment de tout calcul de rendement.


    Les trois pistes RH ne sont pas des alternatives : **la promotion et la mission de transition sont
    complémentaires.** Ensemble, elles achètent 23 mois de recouvrement pour 135 000 € — 11 mois avant
    le départ, 12 après. Le recrutement externe ne les remplace pas : un candidat extérieur n''est pas
    davantage reconnu par l''organisme notifié le premier jour, et n''hérite pas non plus des relations
    hospitalières. Il reste notre repli, pas notre premier choix.


    Trois conditions non financières conditionnent la réussite, et elles ne coûtent rien :


    - L''adjointe reçoit le titre, le mandat et le budget **avant** l''annonce du départ, et siège dès
    maintenant aux réunions avec les deux clients hospitaliers, en présence du directeur.

    - Le directeur sortant présente lui-même sa succession à l''organisme notifié et aux deux clients.
    Sa mission est signée **avant** le conseil, avec un paiement par jalons : reconnaissance écrite de
    l''organisme notifié, deux réunions clients tenues, corpus d''audit transféré.

    - Le risque symétrique est que **l''adjointe parte** si elle n''est pas promue. Trois ans d''ancienneté,
    aucune perspective annoncée : c''est le scénario le plus banal et le plus coûteux.


    ---


    ### 5. Ce qui renverse la décision, et le repli


    **Observation qui renverserait le dossier B :** si l''organisme notifié confirme par écrit qu''un
    changement d''interlocuteur ne requiert qu''un dossier de compétences documenté, sans réaudit, la
    criticité s''effondre et les 280 000 € peuvent être redéployés vers les deux machines restantes. Nous
    posons la question cette semaine.


    **Observation qui renverserait le dossier A :** si la ventilation montre que pannes et rebut sont
    uniformément répartis sur les six machines, la logique de tranche tombe et il faut arbitrer parc complet
    contre dossier B — arbitrage que la présente note tranche en faveur de B.


    **Repli, déclencheur daté — à 4 mois du départ (mois 7).** Le mandat de recrutement externe est déclenché
    si l''un de ces trois signaux est constaté : l''organisme notifié n''a pas reconnu l''adjointe par
    écrit ; l''une des deux réunions clients n''a pas eu lieu avec le directeur présent ; l''adjointe
    décline ou démissionne. C''est précisément pourquoi les 280 000 € doivent être **engagés cet exercice**
    : dans douze mois, l''enveloppe n''existe plus et le repli non plus.


    **Repli dossier A.** Si le rebut mesuré après six mois d''exploitation ne descend pas à 1,2 % sur
    les mêmes références, les pénalités sont appelées et les deux machines restantes ne sont pas commandées.


    ---


    ### 6. Première action — avant jeudi


    1. **Contrôle de gestion :** ventilation des 47 pannes, des 1 810 heures et du rebut machine par machine
    ; heures produites et valeur du rebut annuel sur ces six machines. Sans cette donnée, le montant de
    413 000 € est un ordre de grandeur, pas un choix.

    2. **Courrier à l''organisme notifié :** que requiert formellement un changement de directeur qualité
    — dossier, délai, réaudit ?

    3. **Fournisseur :** redéfinir les 96 % sur notre base de mesure et calibrer les pénalités sur 38
    €/heure.

    4. **Direction générale :** faire signer la mission de transition avant l''annonce du départ.


    Les points 1 à 3 sont obtenables en quarante-huit heures et coûtent zéro euro. Ils remplacent la cotation
    d''atelier par des faits.


    ---


    Deux points à surveiller dans cette note : le montant de 413 000 € est provisoire jusqu''à la ventilation
    machine par machine, et la réserve de 280 000 € immobilise un quart de l''enveloppe sur un événement
    qui n''arrivera probablement pas — c''est un choix d''assurance, assumé comme tel, sur la seule branche
    du dossier dont on ne revient pas.

    '
