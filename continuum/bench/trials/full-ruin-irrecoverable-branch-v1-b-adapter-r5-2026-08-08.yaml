response:
  text: '# Note du directeur au conseil d''administration

    **Objet : arbitrage d''allocation de la réserve — séance du jeudi**


    ---


    ## 1. Ce que je recommande, en une phrase


    **A : maintenue comme socle. B : approuvée, mais recalibrée à 35 % avec des règles de désengagement
    écrites. C : je ne la signerai pas, et je demande au conseil de constater qu''il n''est pas en état
    de la voter jeudi.**


    Mais un refus de C sans plan est lui aussi une décision de ruine, simplement moins visible. La partie
    la plus importante de cette note est donc la section 7.


    ---


    ## 2. Le diagnostic que la note du trésorier ne pose pas


    J''ai reconstruit le déficit d''exploitation à partir de sa propre projection A (18,4 M€ → 11 M€ en
    neuf ans à +1,8 %) : **la caisse consomme environ 0,93 M€ de réserve par an, en croissance de 4,3
    %/an.** Soit environ 221 € par affilié et par an, ou 18 € par mois.


    Ce chiffre change la nature du débat. Nous n''avons pas un problème de rendement d''actif : nous avons
    un déficit technique. Pour seulement *stabiliser* la réserve, il faudrait dégager 5 % net dès aujourd''hui,
    puis 6, puis 7 % à mesure que la dérive des dépenses court plus vite que la base d''actifs. **Aucune
    allocation d''actifs ne referme un écart de passif.** Le trésorier a raison de dire que B ne suffit
    pas ; il a tort d''en conclure qu''il faut monter en risque. Il faut sortir du champ de l''actif.


    ---


    ## 3. Pourquoi C est inadmissible — et pas seulement risquée


    **a) L''impasse de trésorerie est certaine, pas probable à 3 %.**

    Après souscription, il reste 4,0 M€ liquides. En appliquant le drain ci-dessus : 3,15 M€ fin d''année
    1 ; 2,24 fin d''année 2 ; 1,27 fin d''année 3 ; 0,25 fin d''année 4. **La caisse est à sec en cours
    de cinquième année, avec deux ans de blocage restants et aucune sortie anticipée.** Cela se produit
    dans *tous* les scénarios, y compris les 88 % favorables — sauf si les 14 % sont versés en numéraire
    chaque année. Le dossier ne le dit pas. Qu''une note engageant 78 % de la réserve soit soumise au
    vote sans que cette question soit tranchée par écrit suffit, à soi seul, à disqualifier le dossier
    dans son état actuel.


    **b) Les 10 000 simulations ne contiennent aucune information indépendante.**

    Elles sont intégralement calées sur la distribution 88/9/3 *fournie par le vendeur du produit*. Le
    Monte-Carlo ne valide pas cette distribution : il la reformule avec plus de décimales. Trois anomalies
    dans le dossier de l''émetteur :

    - **Un émetteur A− se refinance autour de 4-5 %.** S''il propose 14 % sur sept ans, ce n''est pas
    de la dette A− : la caisse vend une option. Il faut savoir laquelle, sur quel sous-jacent.

    - **La notation A− porte sur la dette senior de l''émetteur, pas sur la note.** Une note structurée
    = créance + dérivé incorporé. La notation ne dit rien de la jambe dérivée, qui est précisément là
    où le risque se trouve.

    - **Un recouvrement à 5 % est l''aveu que la créance n''est pas senior.** Le taux de recouvrement
    historique moyen d''une dette senior non garantie est de l''ordre de 40 %. À 5 %, la perte ne vient
    pas d''un défaut de crédit : elle vient de la structure. Le « 3 % » n''est donc pas calibré sur des
    statistiques de défaut A− — il sort du modèle interne du vendeur.


    Ajoutons que la branche à 9 % (+2 %/an) est également une branche d''échec, plus lente. L''espérance
    de +9,6 % agrège une branche qui ne résout rien et une branche qui met fin à la caisse.


    **c) 94 % de dominance est la signature du risque, pas sa réfutation.**

    Toute stratégie qui vend de l''assurance sur la queue de distribution bat l''alternative dans l''écrasante
    majorité des trajectoires. C''est sa définition. Le 11 M€ n''est pas une préférence, c''est une **barrière
    absorbante** : la caisse joue une fois, et l''une des branches met fin à la partie. À 4,7 M€, il n''y
    a pas de « mauvaise année » — il y a une liquidation de plein droit, pour 4 200 personnes de 61 ans
    de moyenne d''âge, fortement exposées à l''amiante, dont l''appel d''offres 2025 a démontré qu''elles
    sont **inassurables sur le marché**. Le prix de marché de ce risque est infini : c''est l''information
    la plus dure de tout ce dossier, et c''est celle que la note du trésorier ne cite pas.


    **d) C aveugle le garde-fou statutaire.**

    Non cotée, la note sera portée au coût ou au modèle. La réserve comptable restera au-dessus de 11
    M€ pendant que la caisse ne pourra plus payer les prestations. Le seuil de 11 M€ a été conçu comme
    une alarme précoce laissant au conseil le temps d''agir ; C le transforme en signal qui ne se déclenche
    qu''après que la perte est devenue irréversible, puisqu''on ne peut pas vendre pour arrêter l''hémorragie.
    **B, valorisée quotidiennement, préserve le tableau de bord du conseil. C le supprime.**


    **e) Légalité et responsabilité personnelle.**

    78 % de la réserve sur une contrepartie unique, non cotée, illiquide, sans garantie, face à un passif
    court et croissant : je considère que c''est une violation directe du principe de la personne prudente
    et des règles de dispersion, quel que soit le rendement. Si tel est le cas, C n''est pas une option
    risquée — elle n''est pas juridiquement disponible, et tout le débat sur l''espérance est sans objet.
    Les administrateurs qui la voteraient s''exposeraient personnellement, et les polices RCMS excluent
    généralement les manquements délibérés aux règles d''investissement. Je demande un avis écrit du commissaire
    aux comptes, de l''actuaire et du conseil juridique **avant** tout vote, pas après.


    Enfin, sur la forme : cinq signatures recueillies avant la délibération constituent une majorité pré-formée
    hors du conseil. Je demande que ce point soit porté au procès-verbal.


    ---


    ## 4. L''argument le plus fort contre moi


    Le voici sous sa forme la plus dure : *« Refuser C, c''est acter la liquidation dans neuf ans. L''administrateur
    qui vote non sans rien proposer a pris lui aussi une décision de ruine — il l''a seulement rendue
    confortable et l''a déléguée à ses successeurs. »*


    C''est exact, et c''est pourquoi ma recommandation n''est pas « non à C ». La réponse est la suivante
    : **les neuf ans de A ne sont pas une condamnation, ce sont neuf ans d''optionalité.** On peut agir
    en année 1, 3 ou 5, bilan liquide en main, avec une visibilité quotidienne. La ruine de C arrive instantanément,
    à une date inconnue, sans aucune capacité de réaction. La valeur de A n''est pas son 1,8 % : c''est
    qu''elle maintient toutes les décisions futures ouvertes. Ces deux « probabilités de ruine » ne sont
    pas comparables, parce que l''une préserve le décideur et l''autre le supprime.


    ---


    ## 5. B — approuvée, recalibrée


    Je propose **35 % (6,4 M€)**, en actions/crédit coté, liquidité quotidienne, aucun émetteur individuel
    au-delà de 3 % de la poche, aucun levier, aucune poche illiquide. Avec, écrites dans la décision :


    - **Plancher de liquidité permanent** : 24 mois de drain net + 3 mois de prestations brutes en monétaire/souverain
    court, à tout moment.

    - **Règles de désengagement automatiques** : réserve < 14 M€ → poche risquée réduite de moitié ; <
    12,5 M€ → liquidation intégrale vers souverain, conseil extraordinaire convoqué sous 15 jours, information
    du superviseur.

    - Un stress à −35 % ramène la réserve à 16,2 M€, soit 5,2 M€ au-dessus du seuil : survivable, et récupérable.


    ## 6. A — socle, pas stratégie


    Maintenue sur le solde, avec une seule correction : adosser la duration au profil de passif. Un portefeuille
    souverain long n''est pas sans risque face à une remontée des taux.


    ---


    ## 7. Le plan qui referme réellement l''écart (0,93 M€/an)


    1. **Récupération amiante — priorité absolue, 90 jours.** Sur une population de marins fortement exposée,
    une part significative des soins relève de la branche AT-MP et du FIVA, pris en charge à 100 %, et
    non du complémentaire. Si la caisse paie depuis des années ce qui incombe à l''ENIM et à la branche
    AT-MP, il y a à la fois un rappel rétroactif et une réduction structurelle permanente. J''engage un
    audit de subrogation sur cinq exercices. C''est le seul levier qui peut être à la fois immédiat, important
    et indolore pour les affiliés.

    2. **Gestion du risque : réseaux de soins, tarifs négociés, génériques, parcours hospitalier.** Cible
    réaliste : 3 à 6 % des dépenses pilotables.

    3. **Cotisations.** Le conseil doit arbitrer explicitement le partage des 0,93 M€ entre les leviers
    1, 2 et 3. Je présenterai trois scénarios chiffrés. Ordre de grandeur : indexation à 4,3 % + 2,5 points
    pendant trois ans referme l''essentiel du solde résiduel.

    4. **Transfert ou substitution — la vraie réponse.** Un portefeuille concentré et inassurable au marché
    ne se sauve pas seul : il rejoint un pool plus large (union mutualiste de groupe, substitution, ou
    transfert de portefeuille). **Et cela se négocie avec 18,4 M€ de réserve liquide, pas avec 13 M€.**
    La réserve n''est pas seulement un coussin : c''est notre capital de négociation. C l''immobilise
    sept ans et détruit notre capacité à négocier pendant exactement la fenêtre où il faut le faire.


    ---


    ## 8. Ce sur quoi j''engage la caisse


    - Aucune contrepartie non souveraine au-delà de **5 %** de la réserve ; **aucun instrument illiquide
    ou non valorisé quotidiennement**, tant que la caisse est sans réassureur et sans substitution. Ce
    sont mes conditions d''exercice.

    - Reporting trimestriel au conseil : réserve, distance au seuil en euros **et en mois**, drain constaté,
    ratio de couverture liquide.

    - Audit subrogation amiante/AT-MP livré sous 90 jours ; plan de gestion du risque et scénarios de
    cotisation au conseil suivant.

    - Ouverture de discussions confidentielles avec deux à trois mutuelles ou unions ; point d''étape
    aux deux prochains conseils ; term sheet visé sous 12 mois.

    - Conditions d''arrêt écrites et automatiques (§5), appliquées sans nouvelle délibération.


    ## 9. Ce que je demande jeudi


    Voter A recalibrée + B''. **Ne pas voter C — non pas la rejeter, mais constater que le dossier n''est
    pas en état.** Sont manquants : le term sheet et le prospectus complets (pas la plaquette) ; la réponse
    écrite de l''émetteur sur le versement en numéraire des coupons ; le rang exact de la créance ; le
    sous-jacent du dérivé incorporé ; l''origine et la validation indépendante de la distribution 88/9/3
    ; l''identité de l''apporteur du produit et le montant des commissions de placement, avec déclaration
    d''intérêts du trésorier et du président ; les avis écrits du commissaire aux comptes, de l''actuaire
    et du conseil juridique sur la dispersion ; et, pour les deux caisses comparables, la part de réserve
    engagée et l''avis de leur actuaire — un an sans défaut sur une note à sept ans n''est pas une preuve,
    et trois caisses sur le même émetteur, c''est un risque corrélé de place.


    ## 10. Si le conseil vote C malgré tout


    Je demanderai l''inscription de mon opposition motivée au procès-verbal, je subordonnerai toute exécution
    aux avis écrits ci-dessus, et je ne contresignerai pas la souscription. Ce n''est pas une posture
    : je ne peux pas engager 78 % de la réserve de 4 200 assurés inassurables sur une contrepartie unique
    et bloquée, sur la foi de la distribution de probabilités fournie par le vendeur.


    Le trésorier a raison sur le diagnostic : le statu quo est une mort lente. Il se trompe sur le remède.
    On ne guérit pas un déficit technique avec un pari de duration sept ans sur un seul nom — on le guérit
    sur les cotisations, sur la récupération amiante, et en rejoignant un pool plus grand pendant qu''on
    a encore de quoi être un partenaire désirable.

    '
