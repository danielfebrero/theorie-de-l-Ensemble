  text: 'L''écriture du fichier n''a pas été autorisée — voici la note directement.


    ---


    # Note au comité de direction — Prestataire de paiement


    **De :** Direction des opérations · **Pour :** Présidence du comité · **Date :** 14 août 2026

    **Objet :** Solda / Payflux — arbitrage A vs B


    ## Recommandation : option B, avec un calendrier avancé


    Bascule progressive, **démarrée le 7 septembre et achevée le 16 novembre**, soit onze jours avant
    le vendredi noir — et non étalée jusqu''en janvier comme le prévoyait le dossier initial.


    L''option A est écartée. Elle fait basculer 100 % du trafic le 3 novembre ; les trois semaines de
    dégradation observées chez le marchand pilote s''achèvent alors le 24 novembre, **trois jours avant
    le vendredi noir**. Si la montée en charge prend quatre semaines au lieu de trois — un pilote, un
    seul marchand, un parc de jetons dont nous ignorons la taille — nous prenons le pic de l''année en
    pleine dégradation, sans marche arrière : jetons transférés, compte Solda clos, six semaines de délai
    de ré-ouverture et re-collecte des empreintes auprès de 2,1 millions de porteurs.


    ## Les chiffres (année 1)


    Volume de référence : 18 000 transactions/jour × 42 € = **756 k€/jour**, ~276 M€/an. Un point d''échec
    supplémentaire coûte 7,6 k€ de CA par jour ordinaire.


    | Année 1 | Option A | Option B (calendrier révisé) |

    |---|---:|---:|

    | Économie contractuelle | +500 k€ | +310 k€ |

    | Double run (10 semaines) | — | −113 k€ |

    | Prolongation Solda décembre (filet) | — | −130 k€ |

    | CA perdu en montée en charge¹ | −143 k€ | −29 k€ |

    | **Solde** | **+357 k€** | **+38 k€** |

    | Marche arrière pendant le pic | aucune | < 15 min, palier par palier |


    ¹ +0,9 pt d''échec pendant 3 semaines, appliqué à 100 % du trafic (A) contre 20 % en moyenne (B).
    Hypothèse majorante : un échec = une vente perdue.


    **B coûte donc ~320 k€ de plus, une fois.** À partir de l''exercice 2, les deux options rapportent
    les mêmes 500 k€/an : l''écart est un coût d''assurance non récurrent, pas un manque à gagner permanent.


    Ce qu''il couvre : sur les quatre semaines de pic (27 nov – 24 déc), à volume double du jour moyen,
    **un point d''échec supplémentaire vaut 420 k€ de CA**. Solda passe de 0,4 % à 0,9 % sous charge du
    vendredi noir (×2,25) ; appliqué à un Payflux encore en montée à 1,3 %, cela donne ~2,9 % ce jour-là.
    Et au-delà : un incident dur en option A n''a pas de chiffrage, seulement six semaines d''arrêt.


    Nous payons 320 k€ pour ne pas jouer le quatrième trimestre sur un pilote à n = 1.


    ## Ce que B exige pour tenir


    - **Paliers commandés par la métrique, pas par le calendrier.** On ne monte au palier suivant que
    si l''échec sur la part Payflux tient ≤ 0,6 % pendant 7 jours consécutifs. Risque assumé : un palier
    à 10 % peut allonger le calage de Payflux au lieu de le raccourcir — d''où le démarrage au 7 septembre,
    qui laisse dix semaines de marge avant le pic.

    - **Seuils d''arrêt écrits.** Échec > 1,5 % sur 30 min glissantes, ou > 1,0 % sur 2 h, ou disponibilité
    sous 99,9 % sur 24 h → retour à 0 % par l''astreinte en moins de 15 minutes. Le tableau de bord à
    5 minutes et l''astreinte 24/7 existent déjà ; ils ne servent que si les deux comptes restent ouverts.

    - **Signature calée au 4 septembre, pas avant.** La fenêtre de sortie sans pénalité court alors jusqu''au
    **3 décembre** : elle couvre le vendredi noir (27 nov) et le cyber lundi (30 nov). Nous gardons le
    droit de quitter Payflux pour 0 € après avoir vu son comportement sur notre pic.

    - **Compte Solda ouvert jusqu''au 5 janvier au plus tôt.** Butoir absolu confirmé par Solda : 28 février.


    ## Lundi 17 août


    1. **Solda** — rédiger la lettre de prolongation mensuelle. Go/no-go interne le 12 octobre, envoi
    avant le 15 octobre. Décembre ferme (130 k€) ; janvier et février en option.

    2. **Payflux** — avant signature, exiger les données brutes du pilote (volume, parc de jetons, motifs
    de refus) et un engagement contractuel **sur le taux d''échec**, pas seulement sur la disponibilité
    99,9 %. Demander la prise en charge du surcoût de montée en charge en contrepartie des 24 mois.

    3. **Technique** — geler toute clôture de compte Solda et toute purge de jetons ; faire valider les
    seuils d''arrêt et la procédure de repli avant le premier palier du 7 septembre.

    4. **DAF** — confirmer si les 45 k€/mois de double run sont déjà déduits des 310 k€. Si oui, le solde
    B passe à +151 k€ et l''écart à ~200 k€. Cela ne change pas la recommandation.

    5. **Data** — chiffrer le volume réel du pic (hypothèse ×2 retenue ici, à confirmer).


    ## Décision demandée au comité


    Valider l''option B au calendrier 7 septembre – 16 novembre, la prolongation Solda de décembre à 130
    k€, et le principe des paliers commandés par la métrique.


    ---


    **Trois points où je suis allé au-delà du dossier**, à valider par vous avant diffusion :


    - **B démarre le 7 septembre, pas le 3 novembre.** Le dossier ne datait pas B. Laissé au 3 novembre,
    B rampe *pendant* le pic — le pire moment pour déplacer du trafic. Avancé, il atteint 100 % onze jours
    avant, et Solda reste vivant derrière.

    - **La date de signature est un levier, pas une formalité.** Signer le 4 septembre place la sortie
    gratuite au 3 décembre, donc après le cyber lundi. Signer en août la ferait expirer avant le pic et
    nous priverait de l''option à 240 k€.

    - **Deux hypothèses portent les chiffres** : un échec = une vente perdue (majorant), et un pic à ×2
    du jour moyen. Elles sont marquées dans la note ; seule la seconde mérite d''être corrigée lundi,
    et elle ne joue que sur la taille du risque évité, pas sur le sens de l''arbitrage.

    '
