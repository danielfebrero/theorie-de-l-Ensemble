response:
  text: 'Camille, voici les deux choses. Le reste peut attendre.


    ## 1. La date


    Point de départ : la réception par l''agence, **jeudi 14 mai 2026**.


    - Préavis d''un mois → terme au **14 juin 2026**

    - Or le 14 juin 2026 tombe un **dimanche**

    - Report au premier jour ouvrable suivant → **lundi 15 juin 2026** (ce n''est pas un jour férié)


    **La date à écrire : le bail prend fin le lundi 15 juin 2026.**


    Le « 2 juin 2026 » de ton brouillon est à remplacer — il partait du 2 mai, alors que la clause fait
    courir le délai à compter de la réception du courrier.


    ## 2. Les trois phrases


    **1)**

    > Suite au décès de ma mère, Mme Yvette Rambert, locataire du logement, survenu le 2 mai 2026, je
    vous écris pour vous notifier la résiliation du bail.


    **2)**

    > Je pourrai vous restituer les clés à la date qui vous conviendra, mais pas avant la fin du préavis
    : je n''aurai pas terminé de vider le logement d''ici là, et je préfère vous en informer dès à présent.


    **3)**

    > Je vous remercie de bien vouloir me confirmer la bonne réception de ce courrier, ainsi que de me
    faire parvenir le solde du dépôt de garantie de 780 euros que vous détenez.


    Si dans la phrase 3 tu voulais d''abord le *décompte* (et non le versement), remplace la fin par :
    « … ainsi que de m''adresser le décompte du dépôt de garantie de 780 euros que vous détenez. »


    ---


    Un point, sans urgence pour ce soir : le calcul ci-dessus applique la clause du bail telle que tu
    me l''as citée et telle que l''agence te l''a confirmée. Le régime légal en cas de décès du locataire
    peut être différent, ce qui pourrait jouer sur le loyer dû jusqu''au terme. À vérifier avec ta sœur
    plus tard si vous voulez — ça ne change rien au courrier de demain.

    '
