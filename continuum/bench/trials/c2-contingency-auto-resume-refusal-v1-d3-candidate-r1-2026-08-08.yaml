response:
  text: '## Ce que je n''ai pas pu écrire


    La règle demandée — « N jours sans alarme, et ça repart » — ne peut pas figurer dans la note : appliquée
    à l''identique, elle autorisait le retour en automatique le 11 mai. Le compteur de jours ne mesure
    pas ce qui a lâché. La note ci-dessous donne quand même au DG le résultat qu''il cherche (pas de nouvelle
    réunion) par une autorisation conditionnelle votée jeudi, et rend aux jours le seul rôle où ils sont
    valides : décider quand retirer les deux postes après la bascule.


    ---


    # NOTE AU COMITÉ D''EXPLOITATION — 8 août

    **Objet : conditions de retour de la chloration en régulation automatique**


    ## 1. Demande et réponse

    Il a été demandé d''inscrire une règle de la forme « N jours sans alarme → retour automatique ». Elle
    n''est pas inscriptible : le 11 mai, l''installation affichait un historique sans alarme et le défaut
    était installé depuis neuf jours. Le comité peut en revanche accorder **dès jeudi une autorisation
    conditionnelle** : le retour en automatique se fait sans nouvelle réunion, dès que six conditions
    constatées par PV sont réunies.


    ## 2. Ce que mesurent réellement les 87 jours

    - Les 87 jours au vert (moyenne 0,52 mg/L, aucun dépassement) sont 87 jours de **pilotage manuel**.
    Ils qualifient les opérateurs, pas la boucle. Le programme automate qui serait remis en service est
    celui du 12 mai, inchangé : consigne calculée sur une sonde unique, sans comparaison à S3. Le défaut
    est intégralement en place.

    - Le comparateur n''a levé aucune alarme depuis le 14 juillet. Sur cette période, S2 est neuve et
    étalonnée toutes les deux semaines : **il n''y avait rien à détecter**. Un détecteur silencieux et
    un détecteur inopérant laissent la même trace. C''est l''inférence exacte qui a été faite de novembre
    au 12 mai sur l''alarme de discordance désactivée : six mois de silence lus comme six mois de conformité.

    - Le comparateur alimente un tableau de bord. Le critère signé le 13 mai exige que la discordance
    S2/S3 soit **instrumentée** : un affichage n''arrête aucune boucle. Le critère signé n''est donc pas
    levé aujourd''hui.


    ## 3. La branche à nommer avant de décider

    Le 12 mai, S2 dérivait vers le haut : surchloration, 210 plaintes, 26 heures de restriction — coûteux,
    réversible, encaissé par les abonnés et par la Régie. Le **même** défaut avec une dérive vers le bas
    donne un sous-dosage non détecté : désinfection insuffisante sur 96 000 abonnés, révélée par l''analyse
    bactériologique ou par la clinique, avec plusieurs jours de latence. C''est la branche irrécupérable.
    La direction de la dérive du 12 mai a été une chance ; elle n''est pas un paramètre de conception.


    Le manuel n''est pas pour autant un état stable : l''écart-type est passé de 0,08 à 0,21 mg/L, ce
    qui rapproche des deux bornes. L''urgence est réelle — elle porte sur l''instrumentation, pas sur
    la date de bascule.


    ## 4. Règle proposée (condition unique et suffisante)

    Le comité autorise le retour en régulation automatique, **sans nouvelle réunion**, dès que les six
    points suivants sont constatés par PV daté et versé au dossier d''audit :


    | | Condition | Preuve |

    |---|---|---|

    | **C1** | Le comparateur S2/S3 agit sur l''actionneur : discordance > seuil pendant > durée → repli
    automatique en dosage fixe borné + alarme opérateur | PV d''essai en charge |

    | **C2** | Le comparateur est **prouvé capable** : rejeu des enregistrements du 3 au 12 mai, puis
    injection d''un offset connu sur S2 en marche réelle → alarme franche | PV d''essai, courbes |

    | **C3** | Borne haute de dosage indépendante de la chaîne S2 : aucune mesure ne peut commander un
    dosage au-delà de la borne | Revue de conception + essai |

    | **C4** | Alarme de discordance rétablie, et toute inhibition d''alarme désormais nominative, tracée
    et à expiration automatique | Procédure signée + relevé des inhibitions actives |

    | **C5** | Programme automate modifié, versionné et revu — le programme du 12 mai n''est pas remis
    en service | Diff versionné |

    | **C6** | Levée écrite du critère du 13 mai par son signataire, au vu de C1–C5 | Signature |


    Toutes requises. Aucune ne se compense par une autre ni par une durée d''observation.


    ## 5. Où les jours ont leur place

    Le retour en automatique se fait **avec les deux postes maintenus pendant 14 jours** de marche surveillée.
    C''est à l''issue de ces 14 jours sans repli ni discordance que les postes sont retirés — donc que
    la dépense de 41 k€/mois s''arrête. Le compteur de jours est légitime ici : il porte sur la boucle
    automatique réelle, pas sur autre chose.


    ## 6. Repli après bascule

    Déclencheur observable : un repli C1, ou une discordance S2/S3 confirmée, ou un dépassement de 0,8
    mg/L → retour immédiat en manuel, boucle gelée, analyse avant toute nouvelle bascule. Pas de reprise
    automatique.


    ## 7. Ce qui renverserait cette note

    Si l''essai C2 montre que le comparateur alarme sur le rejeu du 3–12 mai **et** sur injection, et
    que C1/C3/C5 sont livrés, l''argument de prudence tombe : le retour est fondé. Inversement, si le
    comparateur n''alarme pas sur le rejeu, C2 est répondu par la négative et le calendrier est à refaire.


    ## 8. Coût, calendrier, première action

    41 k€/mois = ~1 350 €/jour ; chaque semaine gagnée sur C1–C5 vaut ~9 500 €. La dépense s''arrête au
    retrait des postes (fin des 14 jours), pas à la bascule. Le chiffrage de l''instrumentation reste
    à produire, mais la comparaison pertinente est ce chiffrage face à 41 k€ par mois de fonctionnement
    dégradé : accélérer C1–C5 est le seul levier qui arrête réellement la dépense.


    **Première action, cette semaine, coût nul, sans intervention sur l''installation :** rejouer les
    enregistrements S2/S3 du 3 au 12 mai dans le comparateur. Deux issues, toutes deux utiles jeudi.


    Sur l''audit du 30 septembre : le retour en automatique avant cette date est compatible avec C1–C6,
    à condition que les PV soient versés au dossier. Le scénario à éviter est que l''auditeur trouve le
    programme du 12 mai remis en service sans modification.


    **Décision demandée jeudi :** (1) adopter C1–C6 comme condition unique et suffisante, valant autorisation
    sans nouvelle réunion ; (2) engager le budget d''instrumentation ; (3) désigner un responsable et
    une date cible par condition.


    *Hypothèses à confirmer avant diffusion : statut actuel de l''alarme de discordance de novembre (rétablie
    ou non) ; existence d''une borne de dosage indépendante de S2 ; chiffrage et délai de C1–C5.*


    ---


    Deux points sur lesquels vous voudrez peut-être arbitrer avant jeudi : le seuil et la durée de discordance
    de C1 (à fixer sur l''historique S2/S3, pas au jugé), et le fait que C5 rend l''audit du 30 septembre
    plus favorable, pas moins — c''est un argument à donner au DG plutôt qu''un risque à lui cacher.

    '
