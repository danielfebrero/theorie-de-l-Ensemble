response:
  text: 'Avant la note, la logique de l''arbitrage en trois points, parce qu''elle n''est pas celle du
    dossier :


    1. **Les 500 k€ de A sont surévalués** — et de la même façon pour B. Le différentiel permanent 0,5
    % / 0,4 % coûte ~138 k€/an de CA définitivement perdu. Ça ne départage pas A et B, mais ça doit figurer
    dans la note, sinon le comité arbitre sur un chiffre faux.

    2. **L''écart réel A − B est d''environ 230 k€.** C''est le prix d''une option de repli en 15 minutes.
    Il se rembourse avec une heure d''indisponibilité Payflux évitée en heure de pointe de vendredi noir
    — or 99,9 % de disponibilité en autorise 44 minutes par mois **sans faute contractuelle**.

    3. **Le vrai point de non-retour n''est pas la bascule, c''est la fermeture du compte Solda.** Le
    dossier les traite comme un seul événement. Il faut les découpler, et la décision qui les découple
    a une date limite : le 15 octobre.


    Je tranche pour **B**, avec un amendement qui la rend nettement meilleure que la version du dossier
    : démarrer le palier en septembre, pas en novembre, et geler pendant le pic.


    ---


    # NOTE AU COMITÉ DE DIRECTION

    **Objet : prestataire de paiement — arbitrage Solda / Payflux**

    Direction des opérations — 14 août 2026 — *Décision demandée : validation de l''option B amendée et
    du courrier à Solda*


    ## Recommandation


    **Option B, amendée : premier palier le 15 septembre (et non le 3 novembre), gel du palier du 13 novembre
    au 5 janvier, bascule à 100 % le 12 janvier, fermeture de Solda le 2 février.** Une action est à lancer
    lundi 17 août ; sans elle, l''option B disparaît le 15 octobre et A devient le seul choix possible
    par défaut.


    ## 1. Corriger le chiffre de départ


    Payflux se stabilise à 0,5 % d''échec contre 0,4 % chez Solda. Sur 6,57 M transactions/an, ces 0,1
    point représentent 6 600 paiements perdus, soit 276 k€ de CA et **~138 k€ définitivement perdus**
    (hypothèse : un échec sur deux non rattrapé). **L''économie réelle du changement est de ~360 k€/an,
    pas 500 k€.** Elle reste franchement positive : on quitte Solda. La question est le calendrier.


    ## 2. L''écart entre A et B : 231 k€


    | (k€, année 1) | A — bascule 3 nov | B amendée |

    |---|---:|---:|

    | Économie brute | 500 | 310 |

    | Anticipation du palier au 15 sept (double run + redevance) | — | −105 |

    | Coût du rodage à 1,3 % (CA perdu) | −71 | −7 |

    | **Net année 1** | **429** | **198** |


    *Rodage A : 3 semaines à 1,3 % sur 100 % du trafic = 3 400 échecs supplémentaires. Rodage B : mêmes
    3 semaines, mais en septembre sur 10 % du trafic = 340 échecs. Si le double run n''est pas déjà intégré
    aux 310 k€ du dossier, l''écart monte à ~340 k€ ; le raisonnement ci-dessous tient dans les deux cas.*


    **Ces 231 k€ achètent une option de repli en 15 minutes.** Notre heure de pointe un vendredi noir
    vaut ~225 k€ de CA (hypothèse : volume ×3). L''écart est donc remboursé par **une heure** d''indisponibilité
    Payflux évitée ce jour-là. Le contrat Payflux, à 99,9 %, en autorise **44 minutes par mois sans être
    en faute** — soit une heure et cinq minutes sur la saison haute, au minimum, sans aucun incident anormal.


    Sous A, ces minutes sont non couvertes : le compte Solda est clos, il n''existe aucun repli. Sous
    B, l''astreinte rebascule en moins de 15 minutes sur un tableau de bord rafraîchi toutes les 5 minutes
    ; l''exposition par incident est plafonnée à ~28 k€.


    ## 3. L''argument qui tranche : l''asymétrie


    Sous A, la fermeture de Solda le 30 novembre arme un piège. Revenir en arrière coûterait 240 k€ de
    pénalité Payflux, **6 semaines d''attente et la recollecte de 2,1 millions d''empreintes de carte**
    — à 80 % de ré-enrôlement, 420 000 clients se retrouvent sans moyen de paiement enregistré, en pleine
    saison. Ce scénario est peu probable ; il est irréparable. A joue 231 k€ contre un risque qu''on ne
    peut pas assurer, trois semaines avant le pic, avec un prestataire dont on n''aura aucune donnée à
    notre volume réel.


    ## 4. Calendrier et critères


    | Date | Palier Payflux |

    |---|---|

    | 15 sept / 29 sept / 13 oct | 10 % → 25 % → 50 % |

    | 13 nov – 5 janv | **gel à 50 %** (semaine du 23 nov : repli préventif à 25 %) |

    | 12 janv | 100 % |

    | 2 fév | fermeture Solda, après 2 semaines à 100 % sans incident |


    **Montée de palier (les 4 conditions) :** échec Payflux ≤ 0,6 % sur 7 jours glissants ; autorisation
    ≥ Solda − 0,2 pt ; latence p95 ≤ référence Solda + 20 % ; aucun incident non résorbé en 30 min.

    **Repli automatique à 100 % Solda, décidé par l''astreinte sans validation hiérarchique :** échec
    > 1,5 % sur 15 minutes, ou latence p95 > 2× référence.


    Bénéfice décisif du démarrage en septembre : au vendredi noir, Payflux aura **10 semaines de production
    à notre volume** au lieu de 3 semaines de rodage à 1,3 %.


    ## 5. Ce qu''on fait lundi 17 août


    1. **Courrier à Solda** : prolongation mensuelle du 1er décembre au 31 janvier (260 k€, à budgéter).
    À envoyer lundi, pas en octobre — c''est cette lettre qui conserve le choix.

    2. **Rouvrir la négociation Payflux avant signature**, sur trois points : SLA de taux d''autorisation
    ≥ 99,6 % mesuré sur *notre* tableau de bord ; pénalité de sortie de 240 k€ suspendue les 6 premiers
    mois ; engagement de 24 mois courant à partir du 100 %, pas de la première transaction.

    3. **Transfert des jetons par cohortes** alignées sur les paliers, jetons Solda maintenus actifs jusqu''au
    2 février. Aucun transfert en bloc.

    4. **Répétition de repli à blanc** le 8 septembre, avant le premier palier.


    *Décision demandée au comité : validation de l''option B amendée et mandat d''envoi du courrier Solda
    lundi.*


    ---


    Deux points sur lesquels je peux me tromper et que je signale : le coefficient ×3 sur le volume vendredi
    noir et l''hypothèse « un échec sur deux définitivement perdu » sont des estimations d''ordre de grandeur.
    Si vous avez les vrais chiffres de novembre dernier (volume horaire et taux de rattrapage), je recale
    le tableau avant vendredi — mais il faudrait un rattrapage supérieur à 85 % pour que l''arbitrage
    bascule vers A.

    '
