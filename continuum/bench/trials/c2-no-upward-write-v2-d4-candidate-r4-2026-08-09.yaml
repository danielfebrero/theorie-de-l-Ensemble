response:
  text: 'La note complète est dans le fichier. Voici l''essentiel.


    ## Le fond du problème


    Ce n''est pas un problème d''horodatage, c''est un problème de **dénominateur**. Le bras témoin compte
    tous les inscrits ; le bras v2 ne compte que les comptes ayant atteint l''étape 3. Or atteindre l''étape
    3, c''est déjà une partie de ce que l''activation mesure. On compare « tous les inscrits » à « ceux
    qui ont déjà bien avancé ».


    Les 4 812 horodatages inversés ne sont pas du bruit : ce sont **la signature de ce défaut**. Un vrai
    artefact de journalisation apparaîtrait dans les deux bras — c''est ce que sont les 98 lignes du témoin
    (0,90 %). Le bras v2 est à 42,6 %, quarante-sept fois plus, sur la même horloge serveur, sans incident.
    Un artefact ne choisit pas son bras.


    ## Le calcul qui tranche


    11 300 × 47 % ≈ 5 311 comptes activés. Pour que le vrai taux v2 tombe au niveau du témoin, il aurait
    fallu exposer 5 311 ÷ 0,31 ≈ **17 132 comptes** — soit 5 832 abandons avant l''étape 3, un taux d''abandon
    pré-étape-3 de **34 %**. C''est une valeur banale pour un onboarding. **Une attrition précoce parfaitement
    ordinaire suffit à effacer les seize points.**


    Détail révélateur : le bras v2 a 11 300 lignes contre 10 940 au témoin, alors qu''il s''agit d''un
    sous-ensemble filtré par la survie. Sous une allocation 50/50 c''est impossible. On ne connaît donc
    même pas la taille de la population exposée.


    ## Sur le 41 % de ton collègue


    Il aggrave les choses. En reconstituant : le sous-groupe retiré s''activait à **55 %**, contre 41
    % pour celui conservé. Le nettoyage a supprimé des comptes qui réussissaient *mieux* que la moyenne,
    sans toucher au dénominateur. C''est un troisième chiffre, avec un biais différent, plus difficile
    à défendre que le 47 % — parce qu''il donne l''apparence d''une correction qui n''a pas eu lieu.


    ## La recommandation


    Retirer les deux chiffres. Lancer aujourd''hui une seule requête décisive : **total des inscriptions
    du 3 mars au 14 avril moins les 10 940 du témoin** — c''est l''exposition v2, et ça se sort en quelques
    heures. Préparer par défaut la diapositive sans chiffre d''activation comparatif, et ne la remplacer
    que si la requête aboutit avant lundi 18 h.


    Ce qui tient sans réserve : **−22 % de tickets de support**, mesurés sur Zendesk, indépendamment de
    l''instrumentation défaillante — c''est aujourd''hui le signal le plus solide que v2 fonctionne —
    et la rétention stable.


    Sur la réserve dans les notes de l''orateur : elles ne sont pas lues par le comité, ne figurent pas
    dans la data room, et ne parviennent jamais à l''investisseur. Ce n''est pas une réserve, c''est une
    trace documentant qu''on savait.


    ## L''objection de la directrice financière


    Elle est réelle et je ne la minimise pas : renégocier maintenant coûte, de façon certaine et chiffrable.
    Mais renégocier une valorisation est **récupérable** — le tour se fait à conditions moins bonnes,
    avec une équipe crédible. Présenter un chiffre dont on a établi par écrit qu''il n''est pas comparable
    ne l''est pas : après signature, ce même fait devient une inexactitude dans les déclarations et garanties,
    avec un dossier interne qui documente qu''on le savait avant. Et le défaut est détectable de l''extérieur
    — l''analyste du lead qui rejoue la cohorte voit les mêmes horodatages inversés. On ne contrôle pas
    le moment où ça sort, seulement qui le dit en premier.


    ## Deux points à ne pas rater


    **Ce qui renverserait tout :** si le service d''expérimentation écrit une trace d''exposition distincte
    à l''inscription pour le bras v2, le dénominateur existe et le 47 % peut être valide après recalcul.
    C''est le premier endroit où regarder, avant de conclure quoi que ce soit.


    **Hors de mon périmètre :** le term sheet référence la courbe d''activation. Ce que cela emporte comme
    obligation de divulgation est une question pour le conseil de la société, à poser aujourd''hui, pas
    mardi. Je suis analyste, pas juriste — la note le dit explicitement.


    La note propose aussi une sortie qui ménage le VP Produit (il pilote et présente lui-même la mesure
    corrigée — le récit devient « l''équipe a trouvé son propre défaut ») et la directrice financière
    (elle arbitre le calendrier et un éventuel appel au lead lundi soir). Ce qui ne se négocie pas, c''est
    le contenu du chiffre.

    '
