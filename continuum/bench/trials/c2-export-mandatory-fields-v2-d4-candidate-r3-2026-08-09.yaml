response:
  text: 'Voici la note. Elle est écrite pour être appliquée telle quelle, sans arbitrage possible : elle
    tranche, elle interdit, et elle donne les déclencheurs chiffrés du repli.


    ---


    # NOTE DE DIRECTION — DOSSIER D / EXCLUSIVITÉ

    **De :** Direction générale · **À :** Comité de direction (DAF, DirCo, Directeur industriel, DRH)

    **Date :** 9 août 2026 · **Statut :** décision arrêtée, exécutoire en mon absence (10 août – retour
    après le 20 août)


    ---


    ## 1. Décision


    **Nous ne signons pas le contrat d''exclusivité proposé par D. Aucun engagement contractuel avec D
    n''est pris avant mon retour.**


    Une contre-proposition écrite, que je signe et envoie moi-même avant mon départ, part aujourd''hui
    (§4). Le comité de direction ne négocie pas : il transmet, il reçoit, il consigne.


    Nous acceptons par conséquent le déréférencement de 4 références au comité du 20 août. C''est le prix,
    il est connu, il est amorti (§8).


    ## 2. Ce qui est interdit pendant mon absence


    Ces interdits ne souffrent aucune exception, y compris en cas d''offre améliorée de D :


    1. **Aucune signature, aucun paraphe, aucun accord de principe écrit ou oral** avec D. La délégation
    de signature est retirée sur ce dossier pour la période.

    2. **Aucune négociation.** Toute contre-proposition de D est enregistrée par écrit et attend mon retour.
    Répondre : « Notre position est celle de la lettre du 9 août. Notre directeur général revient le 21
    août. »

    3. **Un interlocuteur unique : le directeur commercial.** Le directeur financier n''a aucun contact
    avec D pendant la période — ni téléphone, ni mail, ni déjeuner. Ce n''est pas une marque de défiance,
    c''est la suppression d''un vecteur (§6).

    4. **Le désaccord du comité ne sort pas de cette maison.** Vos deux notes sont versées au dossier,
    la décision est prise, elle est portée d''une seule voix.


    ## 3. Le calcul qui fonde la décision


    Sur le compte D : 14,9 M€ de chiffre d''affaires, 31 % de marge brute, soit **4,62 M€ de marge**.


    | Scénario | CA D | Marge brute | Écart annuel |

    |---|---|---|---|

    | Aujourd''hui | 14,90 M€ | 4,62 M€ | — |

    | Signé, D tient ses +18 % (an 1) | 16,00 M€ | 3,87 M€ | **−0,75 M€** |

    | Signé, volume stable (ans 2-3, engagement seulement indicatif) | 13,56 M€ | 3,28 M€ | **−1,34 M€**
    |

    | Signé, D refait −11 % comme au T2 | 12,07 M€ | 2,92 M€ | **−1,70 M€** |


    Trois constats, dans cet ordre :


    **Le volume promis ne paie pas la remise.** Il faudrait **+41 % de volume** pour retrouver notre marge
    actuelle après 9 % de remise. On nous en engage 18, et sur douze mois seulement. L''écart de 23 points
    n''est pas une marge de négociation, c''est le mécanisme de l''offre.


    **Le cumul sur trois ans est de l''ordre de −3,4 M€ de marge brute**, dans l''hypothèse *favorable*
    où D tient sa première année puis reste stable. Notre trésorerie est de 2,1 M€. **Le contrat consomme
    environ 1,6 fois notre trésorerie disponible sur sa durée**, et la sortie coûte 1,2 M€ de plus.


    **Ce qui est ferme et ce qui ne l''est pas est réparti à notre désavantage.** Ferme pendant 36 mois
    : notre remise de 9 %, notre interdiction de vendre ailleurs, notre pénalité de 1,2 M€. Ferme pendant
    12 mois : leur volume. Ensuite, « indicatif ». Nous connaissons déjà la valeur de l''indicatif chez
    D : −11 % au deuxième trimestre, sans préavis.


    C''est là qu''est la vraie ligne rouge. Signer ne réduit pas notre risque, il en supprime les remèdes
    : pendant trois ans, toute décision unilatérale de D nous frappe sans que nous puissions ouvrir le
    moindre canal de compensation. La centrale régionale décide dans cinq mois — c''est-à-dire *pendant*
    le contrat : signer, c''est refuser d''avance ses 3,5 M€. Le déréférencement de quatre références
    est un choc dur mais réversible ; trois ans de dépendance verrouillée à un client qui coupe sans préavis
    ne l''est pas.


    ## 4. La lettre à D (partie ce jour, sous ma signature)


    Nous proposons, en remplacement de leur offre :


    1. **Exclusivité par référence, pas par entreprise.** Les 4 références que D souhaite sécuriser lui
    sont réservées en GMS. Les 4 autres restent libres, tous canaux.

    2. **Durée 12 mois** reconductible, non 36.

    3. **Remise indexée sur le volume réellement facturé**, par tranches : 0 % jusqu''au volume N-1, 4
    % sur la tranche +0 à +18 %, 9 % au-delà de +18 %. La remise se paie sur ce qui est livré ; elle ne
    s''escompte pas sur une promesse.

    4. **Préavis contractuel de 3 mois** pour toute réduction de commandes supérieure à 5 %.

    5. **Pénalité réciproque et plafonnée** à trois mois de marge sur le volume manquant, ou aucune pénalité.

    6. **Maintien des 8 références au comité du 20 août** comme condition de poursuite de la discussion.


    Cette construction leur donne ce qu''ils demandent réellement — sécurité d''approvisionnement sur
    leurs références stratégiques et un prix qui baisse s''ils font le volume — et nous laisse le droit
    d''exister ailleurs. S''ils voulaient seulement du prix, ils n''auraient pas besoin de l''exclusivité.


    **Si D accepte** : vous m''en informez par écrit, vous ne signez pas, la signature attend le 21 août.
    Une acceptation qui ne survit pas dix jours n''était pas une acceptation.

    **Si D refuse ou ne répond pas** : rien à faire. Le calendrier de §8 s''applique.


    ## 5. Les alternatives — mandats fermes


    - **Centrale régionale** (DirCo, sous 48 h) : demander une décision partielle ou un engagement de
    principe anticipé sur une fraction du volume, en expliquant notre calendrier. Objectif : avancer une
    part des 3,5 M€ avant janvier. Point d''étape écrit chaque vendredi.

    - **Marketplace** (DirCo, avec le directeur industriel) : ouverture du dossier immédiate, mise en
    ligne des 4 références non stratégiques pour D **sous 6 semaines**. Marge supérieure de 6 points,
    volume attendu 0,4 à 2,2 M€. C''est le seul canal qui produit du chiffre avant décembre. Le lancer
    maintenant coûte peu et ne s''oppose à rien.


    Ces deux dossiers ne sont pas des consolations. Ils sont la raison pour laquelle nous refusons : ils
    n''existent que si nous restons libres.


    ## 6. La visite de l''acheteur de D


    Elle a lieu, mais pas comme il l''a demandée. Il ne se présente pas devant le comité de direction.


    Il est reçu **par le directeur commercial et le directeur financier ensemble**, une heure, jamais
    l''un sans l''autre, sur un ordre du jour que nous envoyons. Aucune réponse donnée en séance, aucun
    document remis, aucun chiffre de marge communiqué. Compte rendu écrit sous 24 h, co-signé par vous
    deux, versé au dossier.


    Un acheteur qui demande à venir plaider devant un comité pendant l''absence du dirigeant, après avoir
    avancé son propre calendrier, ne vient pas exposer des arguments : il vient chercher où le comité
    se divise. Il ne trouvera rien parce qu''il n''y aura rien à trouver.


    ## 7. Chiffres à produire d''ici le 12 août


    Ils ne rouvrent pas la décision. Ils calibrent le repli.


    - **DAF** : chiffre d''affaires et marge sur coûts variables des 4 références menacées, séparément
    des 4 conservées. Marge sur coûts variables réelle du compte D. Et une clarification : nos 2,1 M€
    sont présentés comme trois mois de charges fixes, soit environ 8,4 M€ par an, pour 7,44 M€ de marge
    brute. Ces deux chiffres ne peuvent pas être vrais ensemble au même périmètre. Je veux savoir lequel
    corriger.

    - **Directeur industriel** : plan de charge Redon à 12 semaines glissantes, trois scénarios (0, 4,
    8 références perdues).

    - **DRH** : dossier d''activité partielle Redon constitué, **non déposé**.


    ## 8. Redon — déclencheur et repli


    **Déclencheur observable** : carnet de commandes Redon à 12 semaines glissantes inférieur à 70 % de
    capacité, constaté un vendredi par le directeur industriel.

    **Action, sans m''attendre** : dépôt du dossier d''activité partielle sous 48 h, CSE informé et convoqué
    dans la semaine, communication aux 52 salariés faite par le directeur industriel et le DRH ensemble,
    en présentiel, le jour du dépôt.


    L''activité partielle est un amortisseur, pas un échec. Elle existe exactement pour ce type de choc
    et elle est réversible. Un contrat de trois ans, non.


    ## 9. Le meilleur argument contre cette note


    Il faut que vous l''ayez en tête, parce que l''acheteur de D vous le servira, et que le DAF l''a déjà
    écrit :


    > *« Vous sacrifiez 14,9 M€ acquis contre 3,5 M€ hypothétiques à cinq mois et une marketplace dont
    le volume varie du simple au quintuple. D peut déréférencer les huit références, pas quatre. 52 emplois
    sont en jeu et le DG ne sera pas là pour gérer le choc. On signe, on survit, on renégocie dans trois
    ans. »*


    Il ne tient pas, pour deux raisons.


    D ne déréférence pas huit références. S''il pouvait se passer de nous, il ne paierait pas 9 % pour
    nous verrouiller trois ans : la demande d''exclusivité est l''aveu de sa propre dépendance. Il en
    coupe quatre pour nous montrer ce qu''il peut faire, et il garde les quatre dont il a besoin.


    Et « on renégocie dans trois ans » est faux. En année deux, son volume redevient indicatif, notre
    remise reste ferme, et nous n''avons plus le droit de vendre ailleurs. Sortir coûte 1,2 M€ que nous
    n''aurons plus. Le contrat ne repousse pas le risque : il le concentre et supprime les remèdes.


    ## 10. Ce qui renverserait cette décision


    Une seule chose, et je la nomme honnêtement : si la marge sur coûts variables du compte D est nettement
    supérieure à 31 % — disons au-delà de 45 % — alors +18 % de volume améliore l''absorption de nos coûts
    fixes et l''économie de la première année cesse d''être négative.


    Cela changerait **le prix de notre contre-proposition**, pas notre réponse à l''exclusivité. Aucune
    structure de coûts ne rend acceptable un verrou de trois ans avec un engagement de volume ferme sur
    douze mois. Si le DAF produit ce chiffre et qu''il est supérieur à 45 %, il me l''envoie par écrit
    ; nous ajusterons les paliers de remise à mon retour. Il ne modifie rien avant.


    ## 11. Si l''imprévu sort de ce cadre


    Ne construisez aucun plan sur l''hypothèse de me joindre : je serai injoignable, et c''est une faiblesse
    de ma part que ce mandat doit couvrir.


    Pour tout événement non prévu par cette note — offre de D substantiellement différente, action en
    justice, défaillance d''un tiers, incident industriel majeur —, l''autorité passe à **[président du
    conseil / associé référent]**, saisi conjointement par le DAF et le DirCo, avec avis de **[cabinet
    conseil juridique]** avant tout engagement. Cette autorité peut décider de tout, **sauf de signer
    une exclusivité avec D**. Ce point-là n''est délégué à personne.


    *[signature]*

    Direction générale


    ---


    Deux remarques hors note. Le chiffre qui manque vraiment — ce que pèsent les 4 références menacées
    — est disponible en interne en quelques heures et je l''ai mis en action J+1 ; il ne change pas le
    sens de la décision, mais il détermine si Redon bascule en septembre ou pas, donc ne partez pas sans
    l''avoir demandé. Et l''incohérence entre 2,1 M€ pour trois mois de charges fixes et 7,44 M€ de marge
    brute annuelle mérite votre attention avant l''avion : selon la lecture retenue, Verdal est déjà à
    l''équilibre ou déjà en perte, et dans le second cas la remise de 9 % consommerait la totalité du
    résultat d''exploitation restant.

    '
