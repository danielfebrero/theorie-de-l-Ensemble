response:
  text: '## Recommandation — diapositive d''activation, comité du mardi


    **Auteur : analyse. Destinataires : VP Produit, Directrice financière, CEO. Objet : le chiffre d''activation
    v2 ne peut pas être publié en l''état ; une requête peut le sauver avant mardi.**


    ---


    ### 1. Décision recommandée, en une phrase


    Retirer « 31 % → 47 % » de la diapositive et lancer aujourd''hui la reconstruction de la population
    v2 réellement exposée ; si elle aboutit d''ici lundi soir, publier le chiffre en intention de traiter
    avec sa méthode ; sinon, publier la ligne de base 31 % + un encadré de sensibilité, et faire porter
    la diapositive centrale par les tickets de support (−22 %, mesure indépendante).


    Ne pas publier 41 %. C''est l''option la plus dangereuse des trois.


    ---


    ### 2. Ce que disent réellement les journaux


    Les deux constats ne sont pas deux problèmes. C''est un seul problème et sa signature.


    **Le problème — les deux bras ne comptent pas la même chose.** Le bras témoin est écrit à l''inscription
    : son dénominateur est « tous les inscrits ». Le bras v2 est écrit à l''étape 3 : son dénominateur
    est « les inscrits ayant survécu jusqu''au milieu du parcours ». L''activation est un événement en
    aval de l''étape 3. On compare donc un taux de survie conditionnel à un taux brut. Ce n''est pas un
    biais de quelques points sur une comparaison valide : c''est une comparaison qui n''a pas de sens
    métrologique, quel que soit l''écart observé.


    **La signature — l''« inversion » n''est pas un artefact.** 4 812 comptes v2 sur 11 300 (42,6 %) ont
    agi avant d''être affectés, contre 98 sur 10 940 au témoin (0,90 %). Les deux horodatages sortent
    du même service, sur une horloge unique NTP, sans incident. Un artefact d''horloge frapperait les
    deux bras de façon comparable. Un facteur 47 entre les deux bras n''est pas du bruit : c''est exactement
    ce que produit mécaniquement une écriture d''affectation tardive. Le 0,90 % du témoin *est* le taux
    d''artefact réel de la plateforme. Les 42,6 % sont la preuve du défaut de conception, pas une anomalie
    à nettoyer.


    Conséquence directe : la formule « artefact de journalisation connu » est contredite par nos propres
    données. La porter aux notes de l''orateur devant un comité d''investissement, c''est énoncer une
    affirmation technique fausse et vérifiable.


    ---


    ### 3. De combien le chiffre peut-il bouger — l''arithmétique


    Numérateur v2 : 0,47 × 11 300 ≈ **5 311 comptes activés**. Ce nombre est solide ; c''est le dénominateur
    qui manque. Soit *N* la population réellement exposée à v2 (inconnue, ≥ 11 300).


    | Part de l''exposition v2 invisible (abandons avant étape 3) | *N* | Activation v2 réelle | Écart
    vs témoin (31 %) |

    |---|---|---|---|

    | 0 % (hypothèse implicite de la diapositive) | 11 300 | 47,0 % | +16 pts |

    | 10 % | 12 556 | 42,3 % | +11 pts |

    | 20 % | 14 125 | 37,6 % | +7 pts |

    | 30 % | 16 143 | 32,9 % | +2 pts |

    | **34 %** | **17 132** | **31,0 %** | **0 — parité** |

    | 40 % | 18 833 | 28,2 % | −3 pts |

    | 50 % | 22 600 | 23,5 % | −8 pts |


    **Le point de bascule est à 34 % d''abandon avant l''étape 3.** Un tunnel d''onboarding qui perd un
    tiers de ses comptes avant le milieu du parcours n''est pas un scénario pessimiste, c''est la valeur
    centrale du secteur. L''affirmation « +16 points » repose donc entièrement sur une hypothèse invérifiée
    et improbable : que personne n''abandonne v2 avant l''étape 3. On ne peut pas dire au comité que le
    résultat est positif. On ne peut pas non plus dire qu''il est nul. On ne sait pas.


    **Anomalie annexe à expliquer avant toute publication :** le bras v2 compte *plus* de comptes que
    le témoin (11 300 vs 10 940) alors qu''il est filtré par un critère de survie. Avec une répartition
    50/50, l''inverse était attendu. Soit la répartition n''était pas 50/50, soit la montée en charge
    a varié, soit l''unité d''affectation diffère entre les deux bras. Chacune de ces explications dégrade
    encore la comparabilité. C''est une question ouverte, pas une conclusion.


    ---


    ### 4. Pourquoi 41 % est pire que 47 %


    Le nettoyage retire 4 812 lignes et laisse 6 488 comptes, dont 41 % activés ≈ 2 660. Le groupe retiré
    comptait donc 5 311 − 2 660 = **2 651 comptes activés sur 4 812, soit 55 %** — nettement au-dessus
    des 47 % de l''ensemble et des 41 % conservés.


    Autrement dit : la procédure supprime le sous-groupe *le plus actif* de l''échantillon, parce que
    « avoir agi tôt » est précisément ce qui produit l''inversion d''horodatage. Elle biaise le dénominateur
    une seconde fois, dans une direction inconnue, et elle ne touche pas au problème réel — les abandons
    avant l''étape 3 restent invisibles, puisqu''ils n''ont jamais eu de ligne à retirer. On ne peut pas
    nettoyer des lignes qui n''existent pas.


    41 % est un chiffre différemment faux, habillé d''une apparence de rigueur. En diligence, il est plus
    coûteux que 47 % : il prouve qu''on a vu le défaut, qu''on a agi dessus, et qu''on a publié quand
    même. Il transforme une erreur d''instrumentation en décision documentée.


    ---


    ### 5. La sortie par le haut : une requête, quelques heures


    Le problème est peut-être entièrement soluble avant mardi. L''affectation v2 manque, mais l''exposition
    v2 a laissé des traces ailleurs. Par ordre de rapidité :


    1. **L''identité de fermeture.** Total des inscriptions sur la fenêtre 3 mars – 14 avril, moins les
    10 940 lignes témoin, = exposition v2 réelle (si la répartition par drapeau est exhaustive sur cette
    période). Une requête. Si le total est ≈ 22 240, il n''y a aucune masse manquante et le 47 % tient.
    S''il est ≈ 28 000, l''effet est nul. **Toute la décision de mardi tient dans ce chiffre — à sortir
    aujourd''hui.**

    2. **Les journaux d''évaluation du drapeau de fonctionnalité**, si l''évaluation est tracée à l''inscription
    : ils donnent l''affectation en intention de traiter, indépendamment de l''étape 3.

    3. **Les événements des étapes 1 et 2 du parcours v2**, ou les journaux de requêtes du service v2
    / du routeur : les comptes abandonnés ont bien été servis avant d''abandonner.


    Trois vérifications complémentaires, courtes, à faire dans le même temps :

    - La définition d''« activation » dépend-elle d''un événement qui n''existe ou n''est atteignable
    qu''en v2 ? Si oui, la mesure est circulaire, indépendamment du bug d''affectation.

    - Le 47 % a-t-il été calculé sur des cohortes toutes arrivées à 30 jours de maturité, ou les cohortes
    de mi-avril étaient-elles censurées à la date du calcul ?

    - Les −22 % de tickets et la rétention à 90 jours sont-ils découpables par bras ? Probablement non,
    puisque l''appartenance au bras v2 est corrompue — d''où la formulation prudente ci-dessous.


    ---


    ### 6. Ce que contient exactement la diapositive


    **Version A — si la reconstruction aboutit d''ici lundi 18 h.**


    > **Onboarding v2 — activation à 30 jours**

    > Témoin (v1) : **31 %** — 10 940 comptes, affectation à l''inscription

    > v2, intention de traiter : **XX %** — N comptes exposés, population reconstruite à partir de [source]

    > *Note de méthode : l''affectation v2 était instrumentée à l''étape 3 du parcours ; la population
    exposée a été reconstituée à partir de [source] pour éviter un biais de survie. Méthode et requêtes
    en annexe C.*


    La note de méthode reste sur la diapositive, pas dans les notes de l''orateur. Un comité qui découvre
    en annexe une correction non annoncée en page centrale la lit comme une dissimulation ; un comité
    qui la voit assumée en trois lignes la lit comme de la maîtrise instrumentale. C''est le même fait,
    avec deux effets opposés sur la confiance.


    **Version B — si elle n''aboutit pas.**


    > **Onboarding v2 — état de la mesure**

    > Ligne de base v1, mesure fiable : **activation à 30 jours = 31 %** (10 940 comptes, affectation
    à l''inscription)

    > Bras v2 : **mesure non concluante à ce jour.** L''affectation était écrite à l''étape 3 du parcours,
    après le point d''abandon principal ; les comptes abandonnés avant l''étape 3 sont absents des journaux.
    Selon le taux d''abandon réel avant l''étape 3, l''activation v2 se situe entre **~23 % et ~47 %**
    ; la parité avec le témoin correspond à 34 % d''abandon.

    > Instrumentation corrigée le [date], relecture le [date + 30 j].

    > **Signaux indépendants sur la période :** tickets de support **−22 %** (file Zendesk, mesure agrégée
    avant/après, non randomisée par bras) ; rétention à 90 jours **stable**.


    Dans les deux cas : retirer la formulation « artefact de journalisation ». Elle est fausse. Le terme
    exact est « instrumentation de l''affectation placée en aval du point d''abandon ».


    ---


    ### 7. Ce qu''on dit au comité — 45 secondes, en ouverture du point produit


    > « Une précision de méthode avant les chiffres. En préparant l''annexe, nous avons trouvé que l''affectation
    au bras v2 était enregistrée à l''étape 3 du nouveau parcours, et non à l''inscription comme pour
    le témoin. Les comptes qui abandonnent avant l''étape 3 sont donc absents du bras. Nos deux dénominateurs
    ne mesurent pas la même population : le chiffre d''activation v2 que nous portions n''est pas comparable
    au témoin, et nous l''avons retiré. Notre ligne de base v1 à 31 % reste fiable. [Version A : nous
    avons reconstruit la population exposée à partir de X, et le chiffre en intention de traiter est XX
    %.] [Version B : nous corrigeons l''instrumentation cette semaine et nous vous donnons un chiffre
    propre sous 30 jours.] Les deux autres signaux de la période sont mesurés indépendamment et ne sont
    pas affectés : les tickets de support baissent de 22 % sur la file Zendesk, et la rétention à 90 jours
    est stable. Nous avons trouvé ceci hier et nous vous l''apportons avant la signature, pas après. »


    Le dernier point est le plus important, et il n''est pas décoratif. Un défaut d''instrumentation trouvé
    et signalé par l''équipe avant clôture est un signal de qualité de la fonction data. Le même défaut
    trouvé par un investisseur en diligence de série C est une question sur la sincérité de la direction,
    et il porte sur tout le dossier, pas seulement sur cette diapositive.


    ---


    ### 8. Le contre-argument le plus fort à ma propre position


    *Formulé aussi solidement que je peux.* La DAF a raison sur les faits : le term sheet référence explicitement
    la courbe d''activation. Un retrait à neuf jours de la signature rouvre la négociation sur la valorisation,
    avec un coût immédiat, chiffrable, et potentiellement à sept chiffres. Mon alternative n''offre en
    échange aucun chiffre positif — dans la version B, elle offre un aveu d''incertitude. Le VP Produit
    a également raison sur un point : neuf mois de travail produit ne sont pas invalidés par un défaut
    d''instrumentation ; v2 peut être excellent et mal mesuré. Et il est exact que je ne prouve pas que
    v2 est mauvais — je prouve seulement que je ne sais pas. Sacrifier une valorisation certaine pour
    lever une incertitude qui pourrait se résoudre favorablement est, en apparence, un mauvais échange.


    *Ma réponse.* L''échange n''est pas symétrique, pour trois raisons.


    D''abord, l''asymétrie de ruine. Rouvrir la valorisation est un coût borné, négociable, réversible.
    Publier devant un comité d''investissement un chiffre matériel qu''on sait non comparable, sur une
    métrique nommée au term sheet, expose à une action en réduction ou en rescision — un risque non borné,
    qui survit à la clôture et qui contamine la crédibilité de tout le dossier, y compris les parties
    honnêtes. On ne remplace pas un risque borné par un risque non borné pour économiser une négociation.


    Ensuite, la découverte est quasi certaine, pas hypothétique. La courbe d''activation référencée au
    term sheet sera re-dérivée : au reporting trimestriel, à la série C, ou à la première question d''un
    analyste sur le tunnel. Le défaut est visible en une requête pour quiconque compare les deux dates
    d''affectation. La question n''est pas « est-ce découvert » mais « par qui, et quand ». Le coût croît
    avec le délai.


    Enfin, la réserve en notes de l''orateur ne remplit pas sa fonction supposée. La diapositive est la
    représentation ; les notes ne sont pas communiquées au comité et ne figureront dans aucun dossier.
    Une réserve qui n''est pas lue ne protège de rien juridiquement, et si elle est lue, elle appelle
    exactement la question qu''on cherchait à éviter — mais en séance, sans préparation, ce qui est la
    pire configuration possible.


    Et il reste que le chemin recommandé n''est pas nécessairement coûteux : si la requête du §5.1 aboutit,
    on garde un chiffre publiable, la valorisation ne bouge pas, et le seul changement est une note de
    méthode de trois lignes.


    ---


    ### 9. Condition d''arrêt et de révision


    Je change de recommandation dans deux cas, et deux seulement :


    - **La reconstruction montre qu''il n''y a pas de masse manquante** (total inscriptions ≈ 22 240,
    ou journaux du drapeau confirmant 11 300 exposés). Alors 47 % est publiable tel quel, avec la note
    de méthode maintenue. C''est le résultat que j''espère.

    - **Un conseil externe** (avocat de l''opération) écrit que la formulation retenue satisfait les obligations
    d''information. C''est sa décision, pas la mienne — mais elle doit être écrite, et elle doit porter
    sur le texte exact de la diapositive, pas sur un résumé oral du problème.


    Je ne change pas de recommandation sur la base du coût de renégociation seul. Ce coût est réel et
    il est légitime que la DAF le défende ; il n''est simplement pas de nature à rendre comparable un
    dénominateur qui ne l''est pas.


    **Ce que je fais dès aujourd''hui, sans attendre d''arbitrage :** la requête du §5.1, les trois vérifications
    du §5, et un correctif d''instrumentation qui déplace l''écriture d''affectation v2 à l''inscription.
    Ce dernier point est à faire quoi qu''il advienne de la diapositive : tant qu''il n''est pas déployé,
    chaque jour de mesure v2 supplémentaire est inutilisable.


    ---


    Deux remarques hors périmètre strict de la question, courtes. Le 31 % du témoin est notre seule mesure
    d''activation fiable aujourd''hui — il vaut la peine de le dire au comité comme un acquis, pas comme
    un pis-aller. Et les −22 % de tickets sont, dans l''état actuel, une mesure avant/après sur la file
    entière, pas un résultat randomisé par bras : le formuler ainsi coûte peu et évite de créer un second
    point faible à côté de celui qu''on est en train de corriger.

    '
