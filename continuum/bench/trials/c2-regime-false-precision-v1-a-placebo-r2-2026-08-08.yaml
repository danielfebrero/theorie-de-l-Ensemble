response:
  text: '# NOTE AU COMITÉ

    **Objet : fermetures de magasins — ce que disent réellement les chiffres**

    **Date : 8 août 2026 — Décision demandée : mardi**


    ---


    ## 1. En résumé


    Fermer Vitry, Chambéry et Nîmes ne rapporterait pas 288 000 €. **Cela coûterait environ 114 000 €
    par an**, plus les indemnités de sortie.


    La raison tient en une phrase : le résultat par magasin inclut une quote-part des frais de siège et
    de logistique **qui ne disparaît pas quand le magasin ferme**. Elle se reporte simplement sur les
    18 autres.


    | Magasin | Résultat affiché | Dont frais de siège refacturés | Ce que le magasin apporte réellement
    |

    |---|---:|---:|---:|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |

    | **Total** | **−288 000 €** | **402 000 €** | **+114 000 €** |


    Les trois magasins « déficitaires » paient tous leurs propres murs, salaires et charges, **et contribuent
    en plus aux frais du siège**. La comptabilité analytique est juste à l''euro près — mais elle répond
    à la question « combien ce magasin coûte-t-il au réseau ? », pas à la question « que se passe-t-il
    si je le ferme ? ». Ce sont deux questions différentes.


    Conséquence à retenir : **fermer un magasin fabrique le prochain magasin déficitaire.** Les 6,4 M€
    de frais de siège se répartissent alors sur moins de sites, et des magasins aujourd''hui positifs
    basculeront dans le rouge l''an prochain. C''est un engrenage, pas un plan.


    ---


    ## 2. Ce que je recommande mardi


    **Ne fermer aucun magasin. Ne prendre aucune décision irréversible.** Voici le détail par site.


    **Chambéry — exclure définitivement.** 1,1 M€ d''indemnité de résiliation pour supprimer une contribution
    de +32 000 € par an : il faudrait 34 ans pour rentabiliser la sortie. Le magasin voisin est à 92 km
    : le chiffre d''affaires ne se reporterait quasiment pas, il serait perdu. Le sujet à Chambéry est
    le coût d''exploitation, pas l''existence du magasin.


    **Vitry — c''est là que se joue le calendrier.** Le bail échoit dans 7 mois sans indemnité : c''est
    la seule porte de sortie gratuite du dossier, et elle se referme. Mais Vitry est aussi le meilleur
    des trois (+63 000 €), et sa contribution est **sous-estimée** : 18 % de ses entrées sont des retraits
    de commandes web dont le chiffre d''affaires est enregistré sur l''entité e-commerce. Vitry porte
    des coûts pour un chiffre d''affaires comptabilisé ailleurs. La bonne utilisation de l''échéance n''est
    pas de partir, c''est d''**ouvrir dès maintenant une négociation de loyer** — l''échéance est notre
    levier, pas notre sortie.


    **Nîmes — la vraie question n''est pas le magasin, c''est le capital.** Les murs valent 1,9 M€ et
    ne portent aucun loyer dans les comptes ; l''exploitation dégage +19 000 €. Autrement dit, 1,9 M€
    immobilisés rapportent 1 %. C''est un sujet d''arbitrage patrimonial, à instruire séparément et sans
    urgence. Attention au raccourci : une cession-bail (vendre les murs et rester locataire) transformerait
    Nîmes en magasin réellement déficitaire, le loyer de marché dépassant largement 19 000 €.


    ---


    ## 3. Les 300 000 € : où ils sont vraiment


    L''objectif est atteignable, mais pas par les fermetures. Trois gisements, par ordre de rendement
    :


    1. **Les 6,4 M€ de frais de siège et de logistique.** C''est le seul poste dont la réduction crée
    du résultat au lieu de le déplacer. −4,7 % suffisent à couvrir l''objectif. C''est le chantier principal,
    et il n''a jamais été instruit parce que ces coûts sont répartis sur les magasins au lieu d''être
    pilotés là où ils sont engagés.

    2. **Les horaires et le dimensionnement des équipes.** Nous disposons de 24 mois de comptages à la
    demi-heure. C''est exactement l''outil pour ajuster amplitudes horaires et plannings sur les sites
    les plus fragiles. Gain modeste par site, réversible, sans impact social lourd.

    3. **La refacturation du service de retrait web aux magasins.** Elle ne crée pas de résultat groupe,
    mais elle corrige la base de décision : sans elle, nous continuerons à croire que nos magasins-relais
    sont déficitaires alors qu''ils portent le e-commerce.


    ---


    ## 4. Ce que j''engage d''ici trois semaines


    - **Reconstruire les trois comptes en « coûts réellement évitables »** : ce qui disparaît effectivement
    le jour de la fermeture, ligne à ligne. C''est le test décisif, et il est chiffrable : pour que fermer
    Vitry rapporte, il faudrait que **plus de 35 %** de sa quote-part de frais de siège soit réellement
    supprimable (25 % pour Chambéry, 20 % pour Nîmes). Sur des coûts de siège — salaires, systèmes, marketing
    — c''est très improbable, mais je veux la démonstration écrite avant de conclure.

    - **Estimer le taux de report de clientèle** pour Vitry (14 km) et Nîmes (23 km). Nous avons une occasion
    rare : la fermeture de Nîmes pendant cinq semaines en mars 2024. Les ventes des magasins voisins pendant
    cette période nous disent ce que les clients font quand un magasin disparaît. Réserve à énoncer d''emblée
    : seuls les totaux mensuels ont été conservés, la mesure sera un ordre de grandeur, pas un chiffre.

    - **Ouvrir la négociation du bail de Vitry**, avec un point de décision au 4ᵉ mois — avant que l''échéance
    ne devienne subie.

    - **Lancer le plan de réduction des frais de siège**, cible −5 %, arbitrages présentés au comité d''octobre.

    - **Mandater une expertise sur les murs de Nîmes**, dossier distinct du sujet commercial.


    ---


    ## 5. Trois précautions sur les données


    - **Les compteurs comptent des entrées, pas des acheteurs.** Aucune conclusion sur la « performance
    par visiteur » n''est solide, particulièrement à Vitry où près d''une entrée sur cinq est un retrait
    web sans achat en magasin.

    - **La carte de fidélité ne couvre que 23 % des tickets.** Les 41 % de porteurs multi-magasins décrivent
    nos clients les plus fidèles et les plus mobiles ; ce chiffre surestime le report réel de l''ensemble
    de la clientèle.

    - **Nous n''avons jamais fermé de magasin.** Les coûts d''une première fermeture — procédure d''information-consultation,
    accompagnement des équipes, remise en état, effet sur les 16 autres sites — ne figurent nulle part
    dans les 288 000 €. Ils sont réels et ils sont significatifs.


    ---


    **Décision demandée mardi :** valider qu''aucune fermeture n''est décidée à ce stade, et acter le
    plan ci-dessus, y compris l''ouverture immédiate de la négociation du bail de Vitry. Je reviens devant
    vous en octobre avec les coûts évitables chiffrés, l''estimation du report de clientèle, et le plan
    de réduction des frais de siège.


    ---


    Si vous voulez, je peux produire cette note en document formaté (Word/PDF) ou y ajouter une annexe
    d''une page avec le détail du calcul des coûts évitables pour les trois sites.

    '
