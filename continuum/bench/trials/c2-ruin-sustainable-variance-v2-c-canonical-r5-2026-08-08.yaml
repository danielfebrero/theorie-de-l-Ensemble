response:
  text: '# Note au conseil — Arbitrage Sedamex / Nordwerk

    **Objet :** recommandation sur les dix-huit prochains mois — **conseil du vendredi**


    ## Recommandation


    **J''engage la ligne Nordwerk (option B).** Une réserve suspensive, une seule, décrite au § 4 : si
    le conseil juridique ne confirme pas par écrit avant signature que le plafond de 400 k€ est un « tout
    compris », je bascule sur Sedamex sans autre débat.


    ## 1. Le fondement chiffré


    | Fin de période (18 mois), après dividende de 700 k€ | A — Sedamex | B — succès (60 %) | B — échec
    (40 %) |

    |---|---:|---:|---:|

    | Résultat de l''opération | +200 k€ | +900 k€ | −400 k€ |

    | Fonds propres | 2 900 k€ | 3 600 k€ | **2 300 k€** |

    | Marge au-dessus du covenant (1 200 k€) | +1 700 k€ | +2 400 k€ | **+1 100 k€** |

    | Trésorerie | 2 100 k€ | 2 800 k€ | **1 500 k€** |


    Espérance de B : **+380 k€** contre +200 k€ pour A, soit **+180 k€**.


    Le chiffre qui décide n''est pas 60 %, c''est **46 %** : c''est la probabilité de succès en dessous
    de laquelle A redevient meilleure. Le bureau d''études devrait se tromper de **14 points**, sur onze
    installations documentées, pour que ma recommandation s''inverse. À 50/50 — hypothèse de pur scepticisme
    — B rapporte encore 250 k€ contre 200 k€.


    ## 2. Ce que fait réellement le pire cas


    Le scénario noir de B laisse les fonds propres à 2 300 k€, soit **1 100 k€ au-dessus du covenant**,
    et la trésorerie à 1 500 k€, soit **neuf mois de masse salariale** disponibles. Le covenant n''est
    franchi qu''au-delà de **1 500 k€ de pertes cumulées** : il faudrait donc 1 100 k€ de destruction
    *supplémentaires* au plafond contractuel pour mettre le banquier dans la boucle. Aucun trimestre de
    la période, quelle que soit la date de constatation de l''échec, ne descend sous 2 300 k€.


    Un point mérite d''être dit au conseil sans détour : **le mouvement le plus lourd des dix-huit mois
    n''est pas Nordwerk, c''est le dividende.** 700 k€ irréversibles, déjà votés, contre 400 k€ de perte
    maximale plafonnée. Nous avons approuvé en juin une sortie de trésorerie près de deux fois supérieure
    au pire cas que nous hésitons aujourd''hui à assumer.


    ## 3. Réponse au directeur financier


    Son objection est la bonne question posée sur le mauvais objet. Trois points.


    **« On joue la maison. »** Non. L''exposition maximale est de 400 k€, soit **11,8 % des fonds propres**
    et 15,4 % de la trésorerie. Il n''y a ni caution personnelle, ni défaut croisé, ni sûreté sur l''outil
    industriel, ni carnet de commandes gagé. Il n''existe aucun mécanisme par lequel cet échec devienne
    existentiel. Ce n''est pas un pari sur la maison, c''est une ligne de perte bornée et provisionnable.


    **Tremay.** La comparaison ne tient que si l''exposition de Tremay était non plafonnée et financée
    par dette. C''était le cas d''un concurrent qui a déposé le bilan ; ce n''est pas le nôtre — dette
    nette nulle, 2,6 M€ de trésorerie, perte contractuellement plafonnée. Raisonner par ressemblance de
    secteur plutôt que par structure d''exposition, c''est confondre deux paris qui n''ont en commun que
    leur objet.


    **Le regret est asymétrique — dans l''autre sens.** Refuser B coûte 420 k€ de gain espéré abandonné,
    contre 240 k€ de perte espérée évitée. La prudence, ici, est le pari le plus cher.


    Je propose en conséquence que **le directeur financier soit formellement propriétaire du dispositif
    de surveillance** ci-dessous : test trimestriel du covenant, jalon technique du mois 6, provisionnement.
    Son désaccord est le meilleur instrument de contrôle dont nous disposons ; il doit être institué,
    pas surmonté.


    ## 4. Ce qui renverse ce choix


    Une seule observation : **si le plafond de 400 k€ n''est pas intégral.** Coûts de préparation de site,
    formation, outillage non amorti, remise en état, démontage — s''ils sont exclus du plafond, l''exposition
    redevient ouverte et toute cette note tombe. Confirmation écrite de Nordwerk exigée avant signature.
    **À défaut de confirmation : option A.**


    Second falsifieur, moins central : la ventilation des onze installations. Si les cas d''échec relèvent
    d''un mode de défaillance que nous partageons, la probabilité de succès doit être révisée — et sous
    46 %, je recommande A.


    ## 5. Dispositif et première action


    - **Jalon mois 6** : critères de qualification de la ligne définis contractuellement avant signature.
    Non atteints → constatation immédiate de l''échec, provision des 400 k€ portée sans attendre le mois
    12, gel de tout capex discrétionnaire.

    - **Covenant** : test à chaque clôture trimestrielle, alerte formelle sous 1 800 k€ de fonds propres.

    - **Sedamex** : négocier dès maintenant un accord-cadre non exclusif avec droit de première offre
    au mois 19. Le lien ne doit pas être rompu par cet arbitrage — il coûte peu à préserver et vaut cher
    si Nordwerk échoue.

    - **Première action, lundi** : mandat au conseil juridique (48 h) sur le périmètre du plafond, et
    remise par le bureau d''études du dossier des onze installations, cas d''échec documentés.

    '
