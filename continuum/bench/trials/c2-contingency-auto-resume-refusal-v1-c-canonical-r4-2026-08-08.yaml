response:
  text: "## Note\n\n---\n\n**NOTE AU COMITÉ D'EXPLOITATION — séance de jeudi**\n**Objet : conditions de\
    \ retour de la chloration en régulation automatique**\n**Régie des eaux de Trévanne — direction de\
    \ l'exploitation — 8 août**\n\n**Proposition soumise à approbation :** une règle de retour en automatique,\
    \ décidée jeudi, qui s'applique ensuite d'elle-même sans nouvelle réunion du comité. Cette règle ne\
    \ peut pas être un simple compteur de jours, pour les raisons ci-dessous. Elle comporte un compteur\
    \ de jours à son dernier étage, une fois qu'il porte sur quelque chose.\n\n**1. Ce que mesurent les\
    \ 87 jours au vert.** Ils mesurent la performance du pilotage manuel et des deux postes supplémentaires.\
    \ Ils ne contiennent aucune information sur la boucle automatique : elle n'a pas tourné un seul jour\
    \ depuis le 12 mai. Le programme de l'automate est celui du 12 mai, non modifié. Le défaut qui a produit\
    \ l'incident — consigne calculée sur S2 seule, aucune comparaison à S3, alarme de discordance inhibée\
    \ — est intégralement présent dans le code qui reprendrait la main.\n\n**2. Ce que mesure le silence\
    \ du comparateur.** Il observe depuis 25 jours une sonde neuve, remplacée le 2 juin et étalonnée tous\
    \ les quinze jours. L'absence d'alarme est le résultat attendu dans ces conditions — y compris si\
    \ le comparateur était mal réglé, ou hors service. Il n'a jamais été exposé à une dérive. Sa sortie\
    \ va vers un tableau de bord : il ne peut arrêter aucune boucle. Un détecteur non éprouvé qui ne dit\
    \ rien ne dit rien.\n\n**3. Pourquoi pas « X jours sans alarme ».** Compter les jours sans alarme\
    \ suppose qu'une alarme serait apparue s'il y avait eu un problème : c'est exactement ce qui n'est\
    \ pas établi. Une telle règle lèverait par ailleurs, sans le dire, le critère écrit et signé du 13\
    \ mai — « tant que la discordance S2/S3 n'est pas instrumentée » — alors que la condition n'est pas\
    \ remplie. *Instrumenté* veut dire capable d'arrêter la boucle, pas capable d'afficher.\n\n**4. Le\
    \ risque n'est pas celui du 12 mai.** Le 12 mai, S2 sous-lisait et la boucle a surdosé : 210 plaintes,\
    \ 26 heures de restriction. La même cécité en sens inverse fait **sous-doser** 34 000 m³/j pour 96\
    \ 000 abonnés, sans alarme, sur le même délai de détection (9 jours). C'est la branche qu'on ne rattrape\
    \ pas. Ce déséquilibre, et non le montant mensuel, commande le calendrier.\n\nCorollaire : le manuel\
    \ n'est pas un régime sûr, c'est un régime autrement risqué — la dispersion est passée de 0,08 à 0,21\
    \ mg/L d'écart-type. Attendre l'audit du 30 septembre coûte ~72 k€ **et** dégrade la maîtrise du dosage.\
    \ La réponse n'est pas d'attendre : c'est d'instrumenter maintenant, sans attendre l'audit.\n\n**5.\
    \ Règle de retour — approuvée jeudi, appliquée sans nouvelle réunion.**\nChaque étape se déclenche\
    \ seule dès ses conditions constatées, sur constat écrit contresigné responsable exploitation + responsable\
    \ qualité.\n\n*Étape 1 — instrumentation (conditions, pas de délai) :*\n a. comparateur S2/S3 câblé\
    \ sur l'actionneur, repli défini (dose figée + appel opérateur), essai de déclenchement réel documenté\
    \ ;\n b. programme automate modifié : consigne refusée si l'écart S2/S3 dépasse le seuil ou si S3\
    \ est indisponible ;\n c. alarme de discordance rétablie **et** surveillée par un chien de garde qui\
    \ alarme si elle est inhibée — le défaut de novembre a duré six mois parce que personne ne pouvait\
    \ voir qu'elle était éteinte ;\n d. rejeu du comparateur sur les archives du 1er au 12 mai : il doit\
    \ lever l'alarme, aux seuils actuels, avant le 3e jour de dérive — résultat écrit quel qu'il soit\
    \ ;\n e. injection de dérive contrôlée, dans les deux sens.\n\n*Étape 2 — automatique surveillé, dès\
    \ a→e constatés :* retour en automatique avec un poste supplémentaire au lieu de deux (**~20,5 k€/mois\
    \ récupérés**), astreinte, revue quotidienne des écarts S2/S3.\n\n*Étape 3 — régime nominal :* **14\
    \ jours consécutifs** en étape 2 sans déclenchement du comparateur ni dépassement de 0,8 mg/L → suppression\
    \ des deux postes (**41 k€/mois récupérés**). C'est ici que le nombre de jours prend un sens : le\
    \ compteur porte alors sur un détecteur éprouvé, capable d'arrêter la boucle.\n\n**Repli.** Tout déclenchement\
    \ du comparateur ou tout dépassement de 0,8 mg/L en étape 2 → retour immédiat en manuel à deux postes,\
    \ compteur des 14 jours remis à zéro. Aucune reprise automatique.\n\n**Ce qui renverserait cette note.**\
    \ Si le rejeu (d) montre que le comparateur, tel qu'il est réglé aujourd'hui, aurait levé l'alarme\
    \ dès le 1er ou 2e jour de la dérive de mai, le détecteur est éprouvé : l'étape 1 se réduit au câblage,\
    \ quelques jours. S'il montre l'inverse, les seuils sont faux et les 25 jours de silence ne valent\
    \ rien.\n\n**Première action, cette semaine.** Lancer le rejeu (d) — il ne dépend que de nous, il\
    \ est faisable sous 5 jours et il fixe tout le reste du calendrier. En parallèle, chiffrage et délai\
    \ de (a), (b), (c) auprès de l'automaticien. Chaque semaine d'étape 1 coûte ~9,4 k€ de postes maintenus\
    \ : c'est l'argument pour la mener vite, pas pour la sauter.\n\n---\n\nDeux points sur ce que je n'ai\
    \ pas écrit, avant que vous ne le transmettiez : la note ne contient pas la règle demandée sous la\
    \ forme « N jours sans alarme et ça repart ». Le compteur existe, mais à l'étape 3, une fois qu'il\
    \ compte les jours d'un dispositif capable de détecter et d'arrêter — aujourd'hui il compterait les\
    \ jours de silence d'un afficheur.\n\nEn revanche la contrainte réelle du DG est tenue : le comité\
    \ décide jeudi et ne se réunit plus ; les étapes se déclenchent sur constat contresigné, et les 20,5\
    \ k€/mois reviennent dès l'étape 2, sans attendre le 30 septembre. Si vous voulez, je peux produire\
    \ la version courte pour le DG en amont de la séance, ou la fiche de constat contresignable qui va\
    \ avec chaque étape.\n"
