  text: '# Note au conseil — séance de jeudi

    **Objet : affectation de l''enveloppe unique de 900 000 €**


    ---


    ## 1. Sur le tableau unique demandé


    Je ne peux pas classer les lignes des deux dossiers par un indicateur de rendement commun, et je recommande
    au conseil de ne pas trancher sur cette base.


    La raison est arithmétique, pas philosophique. La cotation du cabinet RH donne 35 % × 4,2 M€, soit
    **1 470 000 € de perte évitée**. Rapportée aux 45 000 € de la promotion interne, cette ligne afficherait
    un rendement de **33 fois la mise** — trente fois mieux que n''importe quelle ligne du dossier A.
    Elle arriverait mécaniquement en tête du tableau et déciderait la séance.


    Or ce chiffre provient d''un atelier de trois consultants qui n''ont jamais travaillé dans le dispositif
    médical, sur une entreprise sans précédent interne ni comparable sectoriel. Il n''est pas vérifiable
    : nous ne pouvons même pas le recouper, faute de savoir à quel horizon les 4,2 M€ se rapportent. Les
    chiffres du dossier A, eux, sont horodatés et audités sur cinq ans.


    Mettre les deux dans la même colonne ne les rend pas comparables : cela donne au moins solide l''apparence
    du plus précis. Le conseil trouvera plus bas **un tableau unique — d''affectation, pas de classement.**


    ## 2. Dossier A — machines : le dossier chiffrable, et le chiffre est moins bon qu''il n''y paraît


    Ce que les cinq ans documentent, en gain annuel pour le parc complet :

    - coût direct d''immobilisation : 213 000 € / 5 = **42 600 €/an**

    - marge de contribution perdue : 1 810 h × 38 € / 5 = **13 756 €/an**

    - **total documenté : ≈ 56 400 €/an**


    Face à 620 000 €, le retour sur investissement documenté est de **11 ans**. Ce n''est pas un bon dossier
    sur les seules pièces disponibles.


    Ce qui pourrait le rendre bon n''est pas chiffré : l''écart de rebut, 4,1 % contre 1,2 %. Nous ne
    pouvons pas le convertir en euros faute de connaître le volume annuel produit et le coût unitaire
    des pièces. **C''est la grandeur manquante du dossier**, et elle vaut probablement plus que les 56
    400 € ci-dessus.


    Deux points à vérifier avant toute signature :

    - Les 1 810 heures représentent 60 heures d''arrêt par machine et par an. Sur un régime d''environ
    1 600 heures machine/an, cela correspond à **96,2 % de disponibilité aujourd''hui**. L''engagement
    fournisseur à 96 % ne nous garantirait alors aucun progrès. Il faut obtenir nos heures d''ouverture
    réelles et rehausser le seuil contractuel en conséquence.

    - La répartition des 47 pannes machine par machine. Si elles sont concentrées, une tranche capte l''essentiel
    du gain à la moitié du prix.


    **Décision proposée : une tranche de 4 machines, pas le parc.** Aux mêmes conditions unitaires, la
    tranche coûte 413 333 € et fait office de mesure : elle nous donnera dans douze mois le chiffre de
    rebut réel qui manque aujourd''hui pour décider des deux dernières.


    ## 3. Dossier B — succession : ce n''est pas un dossier de rendement


    Le dossier A décrit une usure coûteuse mais soutenable : si nous ne faisons rien, nous perdons 56
    400 € par an et nous restons en production. C''est de la variance.


    Le dossier B contient autre chose. La perte de l''interlocuteur reconnu par l''organisme notifié touche
    la certification elle-même, donc le droit de vendre. Cette branche-là ne se rattrape pas : une relation
    de certification et deux relations hospitalières perdues ne se rachètent à aucun prix et à aucune
    date. **Cette asymétrie décide, indépendamment de tout classement de rendement.**


    Les trois pistes RH ne sont pas trois options concurrentes. Deux sont complémentaires et la troisième
    est une assurance :

    - **Promotion de l''adjointe (45 000 €)** : la seule qui construit une continuité interne.

    - **Mission de transition du directeur sortant (90 000 €)** : son objet n''est pas de prolonger sa
    présence, mais de convertir en procédures écrites et auditables ce qui n''existe aujourd''hui que
    dans sa tête et dans ses relations — le seul livrable qui survive à son départ.

    - **Recherche externe (280 000 €)** : c''est le repli si l''adjointe n''est pas acceptée. **L''enveloppe
    n''étant pas reconductible, ce repli doit être engagé maintenant ou il n''existera pas.** Ne pas le
    financer jeudi, c''est décider aujourd''hui qu''il n''y aura aucune solution en cas d''échec dans
    quatorze mois.


    **Point de couplage entre les deux dossiers :** l''installation de machines neuves déclenche une requalification
    des procédés devant l''organisme notifié. Elle mobilise exactement la personne qui part. C''est un
    argument pour installer la tranche **maintenant**, sous son autorité, et non l''an prochain.


    ## 4. Affectation de l''enveloppe


    | Ligne | Montant | Nature |

    |---|---:|---|

    | Promotion de l''adjointe, prise de poste anticipée | 45 000 € | ferme |

    | Mission de transition, 12 mois, à livrables documentaires | 90 000 € | ferme |

    | Mandat de recherche externe, déclenché sur critère au mois 9 | 280 000 € | engagé, conditionnel
    |

    | Tranche 1 : 4 machines au pire historique audité | 413 333 € | ferme |

    | Requalification des procédés, métrologie, documentation du transfert | 71 667 € | ferme |

    | **Total** | **900 000 €** | |


    Les deux machines restantes ne sont pas abandonnées : elles passent au budget ordinaire de l''an prochain,
    décidées sur le rebut réellement mesuré sur les quatre premières.


    *Réserve à lever avant jeudi : les 280 000 € sont supposés engageables sous forme de mandat conditionnel.
    Si le cabinet RH exige un engagement ferme et intégral, cette ligne devient une dépense sèche et le
    conseil devra arbitrer entre elle et la 4ᵉ machine. À vérifier d''ici mercredi.*


    ## 5. Le meilleur argument contre cette note


    « Vous consacrez 46 % d''une enveloppe unique à une succession, en laissant deux machines de 14 ans
    en production, sur la foi d''un retour sur investissement que vous qualifiez vous-même de faible.
    Si l''écart de rebut est réel, vous renoncez au gain de productivité le plus rentable de la décennie,
    et l''enveloppe ne reviendra pas. »


    Il ne tient pas, pour une seule raison : le fournisseur maintient les conditions unitaires par tranche,
    donc ce que nous risquons sur les machines est un **délai**, pas un surcoût. Ce que nous risquerions
    sur la certification est définitif. Mais l''argument bascule si l''une de ces deux vérifications tombe
    mal :

    - si le maintien des conditions unitaires expire avec cet exercice ;

    - si les 47 pannes sont réparties uniformément, auquel cas la tranche ne capte rien et il faut acheter
    le parc complet en réduisant le dossier B à ses deux lignes fermes.


    **L''observation qui renverserait le dossier B :** si l''organisme notifié confirme par écrit que
    la certification se transfère à un successeur qualifié sans reconnaissance individuelle de l''interlocuteur,
    les 280 000 € deviennent inutiles et repassent sur la 5ᵉ et la 6ᵉ machine.


    ## 6. Repli et déclencheur


    **Point de contrôle au mois 9**, deux mois avant le départ. Le mandat externe est déclenché si l''un
    des deux constats suivants est vrai :

    - l''organisme notifié n''a pas formellement accepté l''adjointe comme interlocuteur ;

    - l''un des deux clients hospitaliers ne l''a pas rencontrée en présence du directeur sortant.


    Aucune reprise automatique : le déclenchement remonte au conseil.


    ## 7. Premières actions


    1. **Cette semaine** — appel à l''organisme notifié : la reconnaissance de l''interlocuteur est-elle
    personnelle ou institutionnelle ? Réponse gratuite, et elle vaut 280 000 €.

    2. **Avant jeudi** — obtenir du fournisseur les heures d''ouverture réelles, la répartition des 47
    pannes par machine, et la durée de tenue des conditions unitaires.

    3. **Jeudi** — voter l''affectation ci-dessus.

    4. **Sous 30 jours** — planifier deux rendez-vous clients à trois, directeur sortant et adjointe présents.


    ---


    Si vous voulez cette note sous forme de page partageable pour les membres du conseil, je peux la publier.

    '
