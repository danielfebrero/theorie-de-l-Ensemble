response:
  text: '# NOTE AU CONSEIL — Séance de jeudi

    ## Affectation de l''enveloppe de 900 000 €


    ---


    ## 1. Ce que nous proposons de décider


    **Trois lignes, 900 000 € engagés, rien de perdu.**


    | | Montant | Nature de l''engagement |

    |---|---|---|

    | **A — Six machines** | 620 000 € | Bon de commande ferme, livraisons échelonnées |

    | **B — Socle succession** | 135 000 € | Promotion de l''adjointe (45 000) + mission de transition
    (90 000) |

    | **B — Ligne de sécurité** | 145 000 € | Mandat de recrutement externe signé, démarrage conditionnel
    |


    ---


    ## 2. Pourquoi il n''y aura pas de tableau unique


    Le tableau demandé classerait toutes les lignes par le même indicateur en euros. Il en existe un pour
    le dossier A : cinq ans de maintenance horodatée et auditée. Il n''en existe pas pour le dossier B.


    Le seul chiffre disponible pour B — 35 % de rupture, 4,2 M€, criticité 7,5 — vient d''un atelier de
    trois consultants qui n''ont jamais travaillé dans le dispositif médical, sur une entreprise qui n''a
    jamais changé de directeur qualité et pour laquelle aucun comparable sectoriel n''existe. Ce n''est
    pas une mesure, c''est une opinion mise en forme numérique.


    Or si on le fait entrer dans le tableau, il écrase tout : 1,47 M€ de perte attendue contre 620 000
    € d''investissement. Chaque ligne du dossier B passerait devant chaque ligne du dossier A, et le classement
    du conseil serait entièrement déterminé par le chiffre le moins fiable du dossier. **Le tableau unique
    ne ferait pas trancher le conseil : il ferait trancher les trois consultants.**


    Nous rejetons le chiffre, pas le risque. Le risque, lui, repose sur des faits vérifiables : un seul
    interlocuteur reconnu par l''organisme notifié, 9 auditeurs internes formés par lui, deux clients
    hospitaliers à 31 % du chiffre d''affaires.


    ---


    ## 3. Dossier A — ce que disent les données


    | Sur 5 ans, données auditées | |

    |---|---|

    | Coût direct d''immobilisation | 213 000 € |

    | Marge perdue (1 810 h × 38 €) | 68 780 € |

    | **Total mesuré** | **281 780 €, soit ~56 000 €/an** |

    | Investissement parc complet | 620 000 € |

    | **Retour sur les seuls coûts mesurés** | **~11 ans** |


    Onze ans, c''est mauvais. Mais ce calcul ignore le rebut, qui passe de 4,1 % à 1,2 % garanti — et
    que nous ne pouvons pas chiffrer ici, faute de connaître la valeur de production annuelle passant
    sur ce parc. **La règle est simple : chaque million d''euros de production sur ces machines vaut 29
    000 € de rebut évité par an.** À 2 M€ de production, le retour tombe sous six ans et le dossier devient
    bon. À 500 000 €, il reste médiocre. Le conseil dispose de ce chiffre ; il doit l''appliquer lui-même
    avant de voter.


    Deuxième point : les 47 pannes ne sont pas réparties également entre six machines. Le journal de maintenance
    est déjà audité et permet de les classer. **C''est pourquoi nous engageons les six machines mais échelonnons
    les livraisons dans l''ordre de ce classement** — l''argent est engagé cet exercice, les pires machines
    partent en premier, et si le parc se révèle très inégal nous en tirerons les conséquences sur la dernière
    tranche.


    ---


    ## 4. Dossier B — pourquoi il passe en premier dans le temps


    Le dossier A se dégrade lentement : différer douze mois coûte environ 56 000 € plus le rebut. Le dossier
    B a une date. Dans onze mois, la personne part, et l''enveloppe n''est pas reconductible.


    **Ce que nous achetons n''est pas une compétence, c''est une présentation.** L''organisme notifié
    et les deux hôpitaux ne reconnaissent pas un diplôme, ils reconnaissent une personne. Le seul actif
    transférable est l''introduction faite par le partant lui-même, tant qu''il est encore en poste. C''est
    ce que finance la mission de transition, et rien d''autre ne l''achète.


    **Contre-argument, et il est sérieux :** promouvoir une adjointe entrée il y a trois ans dans un poste
    où l''organisme ne reconnaît qu''une seule personne, c''est le choix fragile ; les 280 000 € du recrutement
    externe existent précisément parce que 45 000 € n''achètent pas un interlocuteur reconnu. **Notre
    réponse :** 280 000 € non plus. Un recrutement externe arrive après quatre à six mois de recherche
    — il reste alors cinq mois de recouvrement au lieu de onze — il est tout aussi inconnu de l''organisme
    le premier jour, et il n''a aucune relation avec les deux hôpitaux. Le recrutement externe achète
    du CV ; la combinaison achète du transfert.


    **Trois conditions à la promotion**, sans lesquelles elle ne vaut rien :

    - L''adjointe est nommée directrice qualité avec pouvoir de signature **au troisième mois**, pas au
    onzième. Le partant intervient en appui sous sa signature, pas en direction de l''ombre.

    - Une partie de ses 90 000 € est indexée sur l''enregistrement formel de la successeure par l''organisme
    notifié. Il doit être payé pour réussir le transfert, pas pour rester indispensable.

    - Calendrier de requalification des 9 auditeurs internes sous sa responsabilité.


    ---


    ## 5. Repli, et ce qui le déclenche


    **Point de contrôle au sixième mois** (cinq mois avant le départ). Le repli s''arme si l''un des deux
    faits suivants est constaté :

    - l''adjointe n''a pas conduit, sous son propre nom, au moins un échange documenté avec l''organisme
    notifié ;

    - l''un des deux clients hospitaliers n''a pas été rencontré par elle en présence du partant.


    Déclenchement : la ligne de 145 000 € lance le recrutement externe, avec cinq mois de recouvrement
    restants. C''est cette ligne qui transforme un pari en test.


    **Observation qui renverserait notre recommandation dès jeudi :** une réserve écrite de l''organisme
    notifié sur la succession, ou un client hospitalier confirmant par écrit que la relation est attachée
    à la personne. Dans ce cas le recrutement externe démarre immédiatement et la troisième tranche machines
    est sacrifiée.


    **Pire cas de l''option retenue :** la promotion échoue, le recrutement démarre au sixième mois, et
    nous traversons l''audit de surveillance suivant avec un interlocuteur non encore établi — dégradé,
    mais rattrapable. **Qui l''encaisse : nous, pas un tiers.**


    **Le vrai scénario sans retour, c''est l''autre :** mettre les 900 000 € sur les machines, laisser
    partir le directeur qualité sans successeur présenté, et n''avoir aucun financement disponible pendant
    douze mois. Un défaut de certification n''arrête pas une ligne de production, il arrête les ventes.
    Aucun gain d''usinage ne le compense. C''est ce scénario que le tableau unique produirait mécaniquement
    — ou son symétrique, 900 000 € sur la succession et un parc à 15 ans d''âge.


    ---


    ## 6. Point à valider avant la séance


    La ligne de sécurité de 145 000 € ne compte comme engagée sur l''exercice que si le mandat est signé
    ferme avec clause d''arrêt. **À confirmer par la direction financière avant jeudi.** Si ce montage
    n''est pas possible, la ligne bascule sur la mission de transition étendue, et le conseil doit en
    être informé en séance.

    '
