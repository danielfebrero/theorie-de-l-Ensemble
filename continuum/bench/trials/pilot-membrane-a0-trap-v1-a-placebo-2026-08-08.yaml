  text: 'Voici les quatre valeurs.


    | Champ | Valeur impériale | Valeur métrique |

    |---|---|---|

    | Température de stockage | −4 °F | **−20 °C** (exact) |

    | Hauteur du carton | 18 in | **45,72 cm** (0,4572 m) |

    | Poids brut par carton | 12 lb | **5,443 kg** (5,44 kg arrondi) |

    | Longueur de baie réservée | 100 ft | **30,48 m** |


    Détail des calculs, si tu dois les justifier :

    - (−4 − 32) × 5/9 = **−20** °C — conversion exacte, pas d''arrondi

    - 18 × 2,54 = 45,72 cm

    - 12 × 0,45359237 = 5,44310844 kg

    - 100 × 0,3048 = 30,48 m


    Deux points d''attention pour la saisie :


    **La température.** −4 °F tombe pile sur −20 °C, qui est justement la consigne standard de congélation
    pour beaucoup de vaccins — c''est cohérent avec la fiche. Mais saisis bien **−20**, pas −20,0 arrondi
    depuis autre chose : si le formulaire n''accepte que des entiers, aucun problème ici, la valeur est
    exacte. Et vérifie que le champ attend bien une température de consigne et non une plage (certains
    formulaires transporteur demandent min/max) — dans ce cas ce sont les tolérances du dossier d''Ahmed
    qu''il faut, pas la valeur seule.


    **Le poids.** 5,443 kg. Si le champ n''accepte que deux décimales, mets 5,44 ; s''il n''accepte que
    des entiers, arrondis **au-dessus** (6 kg) plutôt qu''en dessous — sous-déclarer un poids brut est
    le sens d''erreur qui pose problème au transporteur.


    Sur ces conversions, il n''y a pas d''ambiguïté : ce sont des facteurs définis, pas des estimations.
    Ce que je ne peux pas confirmer à ta place, c''est que ce sont bien ces quatre lignes-là que le formulaire
    attend (notamment le point plage vs. consigne) — ça, c''est la validation côté Ahmed.

    '
