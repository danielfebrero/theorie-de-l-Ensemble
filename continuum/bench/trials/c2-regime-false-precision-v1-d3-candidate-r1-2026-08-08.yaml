response:
  text: 'Avant la note : l''analyse retourne l''énoncé. Les trois magasins « négatifs » sont en réalité
    les trois qui rapportent de l''argent une fois retirée la quote-part de siège qu''aucune fermeture
    n''économise. La note dit donc pourquoi on ne ferme pas sur cette base, quelle est la seule fermeture
    réellement décidable, et où sont les 300 000 €.


    ---


    # NOTE AU COMITÉ DE DIRECTION — séance de mardi

    **Objet : fermetures de magasins et objectif de 300 000 € de résultat**


    ## 1. Ce que nous recommandons de décider mardi


    Ne fermer aucun magasin sur la base du résultat analytique par site. Décider une seule chose : lancer
    sous cinq jours la mesure qui rendra la décision de Vitry possible avant l''échéance de son bail,
    et ouvrir le chantier qui porte réellement les 300 000 €.


    ## 2. Les trois magasins « en perte » ne perdent pas d''argent


    Le résultat par magasin inclut une part des 6,4 M€ de frais de siège et de logistique, répartie au
    prorata du chiffre d''affaires. **Ces frais ne disparaissent pas si le magasin ferme** : ils se reportent
    sur les autres.


    | | Résultat affiché | Part de siège incluse | Ce que le magasin apporte réellement |

    |---|---|---|---|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |


    Fermer les trois retire **114 000 € par an** au résultat du groupe, avant même le premier euro de
    coût de fermeture. Et les 6,4 M€ se répartissent alors sur 16 magasins au lieu de 19 : deux ou trois
    sites aujourd''hui positifs deviendront négatifs sur le papier, et le même raisonnement reviendra
    l''an prochain. C''est une spirale, pas un redressement.


    **Réserve à lever avant mardi.** Ce raisonnement tient si les 6,4 M€ sont réellement non évitables.
    Nous demandons à la DAF de scinder ce montant en trois : central véritablement fixe / semi-variable
    avec le nombre de magasins / directement imputable à un site (tournée logistique dédiée, par exemple).
    Ce document existe déjà dans le système ; c''est la pièce la plus décisive du dossier.


    ## 3. Ce que coûterait chaque fermeture


    **Chambéry — non.** 1,1 M€ d''indemnité, six ans restants, aucune clause de sortie. Le magasin du
    réseau le plus proche est à 92 km : le chiffre d''affaires ne se reporte pas, il se perd. Payer 1,1
    M€ pour supprimer un apport de +32 000 €/an n''est pas un arbitrage, c''est une destruction. Aucune
    mesure complémentaire ne changera cela.


    **Nîmes — pas sur son compte d''exploitation.** Le problème de Nîmes n''est pas son résultat, c''est
    le capital immobilisé : +19 000 €/an sur des murs valant 1,9 M€. Voir §6.


    **Vitry — seule sortie sans coût immobilier.** Bail échu dans 7 mois, sortie sans indemnité. Mais
    c''est le plus gros contributeur des trois, et **18 % de ses entrées sont des retraits de commandes
    web dont le chiffre d''affaires est enregistré sur l''entité e-commerce** : Vitry travaille pour le
    e-commerce sans en être crédité. Son +63 000 € est sous-estimé, et à sa fermeture ce travail de retrait
    migre ailleurs — le coût ne disparaît pas.


    **Pour les trois, un point commun.** L''enseigne n''a jamais fermé de magasin. Avec 430 salariés,
    une fermeture déclenche un plan de sauvegarde de l''emploi : plusieurs mois de procédure, des indemnités
    et des coûts de process qui tombent **l''exercice prochain**, alors que les économies arrivent après.
    Une fermeture décidée maintenant dégrade le résultat de l''exercice visé.


    ## 4. Vitry : la seule décision réellement ouverte, et son test


    Règle de décision : fermer Vitry n''améliore le résultat que si

    **(taux de report des ventes) × (marge brute de Vitry) > 63 000 € + coût récurrent de reprise du click
    & collect ailleurs.**


    Le magasin voisin est à 14 km et absorbe les ventes reportées sans loyer supplémentaire : ce qui se
    reporte arrive presque en totalité en marge. La marge brute de Vitry est connue au siège. **Le taux
    de report est la seule inconnue — et il est mesurable.**


    En mars 2024, Nîmes est resté fermé cinq semaines. Les totaux mensuels des voisins sont trop grossiers
    pour conclure. Mais la carte de fidélité est nominative : nous pouvons suivre les porteurs rattachés
    à Nîmes (23 % des tickets) et observer s''ils ont acheté au magasin situé à 23 km en mars-avril 2024.
    C''est un taux de report **observé sur des clients réels**, pas une hypothèse.


    Limite à énoncer au comité : les porteurs de carte sont plus fidèles que la moyenne — 41 % achètent
    déjà dans deux magasins. Ce que nous mesurerons est donc un **plafond**. Si même le plafond est sous
    le seuil, personne ne se reporte et Vitry reste ouvert. Coût du test : un analyste, une semaine.


    **L''échéance n''est pas mardi, c''est la date de congé du bail.** Le juridique doit confirmer cette
    date d''ici vendredi. Si la fenêtre se referme avant le résultat du test, on renouvelle — en renégociant.


    ## 5. Ne pas confondre le compteur et le client


    Les compteurs (±2 %) comptent des entrées, pas des acheteurs, et 18 % de celles de Vitry sont des
    retraits web. Toute comparaison de fréquentation brute entre Vitry et un autre magasin est fausse.
    À corriger avant tout usage. Refacturer le e-commerce pour le service de retrait corrigera le diagnostic
    — mais pas le résultat du groupe : c''est un transfert entre entités, pas une économie.


    ## 6. L''option qui atteint le chiffre — et pourquoi nous ne la portons pas seuls


    Vendre les murs de Nîmes. 1,9 M€. Selon la valeur nette comptable, la seule plus-value peut dépasser
    300 000 € dès l''exercice prochain. **C''est le seul chemin qui atteint littéralement l''objectif
    de l''actionnaire dans le délai fixé.**


    C''est aussi une vente irréversible, une sortie définitive d''un marché, la perte d''un magasin contributeur
    — pour un gain qui ne se produit qu''une fois. L''an prochain, les 300 000 € ont disparu et le magasin
    aussi. Si le comité veut cette option, qu''il la vote explicitement comme un arbitrage de patrimoine,
    et non comme une amélioration d''exploitation. **Nous ne la recommandons pas.**


    Corollaire : une cession-bail (vendre les murs et rester) ajouterait un loyer de l''ordre de 95 000
    à 130 000 €/an à un magasin qui apporte 19 000 €. À écarter.


    ## 7. Où sont réellement les 300 000 €


    300 000 €, c''est **4,7 % des 6,4 M€** de siège et logistique — la seule masse de coûts qui n''est
    attachée à aucun client. Nous demandons mandat pour revenir sous six semaines avec : une cible ligne
    à ligne sur ces 6,4 M€, la renégociation du loyer de Vitry (notre levier est maximal à 7 mois de l''échéance,
    que l''on ferme ou non), et un plan de coûts par site.


    **Le contre-argument, énoncé franchement :** « le conseil refuse de couper, c''est la réponse habituelle
    ». La forme honnête est celle-ci — les fermetures ne produisent pas 300 000 € l''an prochain ; elles
    en produisent en année 2 ou 3, après les avoir payés. Si l''actionnaire veut l''argent sur l''exercice
    prochain, la source est le coût central ou une cession d''actif. C''est ce choix-là qu''il faut poser
    sur la table, pas la liste des magasins.


    ## 8. Ce qu''on engage d''ici là


    | Action | Qui | Quand |

    |---|---|---|

    | Scinder les 6,4 M€ : fixe central / semi-variable / imputable à un site | DAF | mardi |

    | Date de congé et procédure du bail de Vitry | Juridique | vendredi |

    | Taux de report mesuré sur les porteurs de carte de Nîmes, mars-avril 2024 | Data | 10 jours |

    | Marge brute € de Vitry + coût de reprise du click & collect | DAF | 10 jours |

    | Plan de redressement contractualisé Chambéry et Nîmes : les équipes obtiennent la main sur leurs
    propres lignes de coûts et un seuil écrit à atteindre — pas une consultation | DRH + directeurs |
    3 semaines |

    | Garantie écrite de mutation au magasin de 14 km pour les salariés de Vitry, remise avant toute annonce
    | DRH | avec la décision |


    ## 9. Ce qui renverserait cette note


    - Si une part significative des 6,4 M€ est réellement évitable par site, les apports du §2 baissent
    d''autant et peuvent passer sous zéro : le dossier se rouvre entièrement.

    - Si le report mesuré dépasse le seuil du §4, on ferme Vitry à l''échéance du bail, sans indemnité.

    - Rien de mesurable ne justifiera Chambéry : 1,1 M€ et 92 km ne sont pas une question de données.


    **Repli.** Si la ventilation des 6,4 M€ n''est pas livrée sous deux semaines, ou si elle révèle moins
    de 200 000 € atteignables, nous revenons sous quinze jours avec l''arbitrage patrimonial de Nîmes
    chiffré, pour un vote explicite du comité.


    ---


    Deux points d''honnêteté sur la note elle-même : les apports du §2 supposent que les 6,4 M€ sont intégralement
    non évitables — c''est l''hypothèse que la première ligne du §8 est faite pour tester, et la seule
    qui puisse invalider l''ensemble. Et le coût du PSE, les indemnités et la valeur nette comptable des
    murs de Nîmes ne sont pas chiffrés ici : ils ne figurent pas dans les éléments transmis.

    '
