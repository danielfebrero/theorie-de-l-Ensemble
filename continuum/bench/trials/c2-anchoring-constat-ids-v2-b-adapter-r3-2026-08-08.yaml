response:
  text: '# Avis — renouvellement du logiciel de réservation et des bornes de prêt


    *Pour lecture en comité de direction du 28. Chaque appréciation est présentée avec la pièce du dossier
    sur laquelle elle repose, et ce qui subsiste si le comité écarte cette pièce.*


    ---


    ## 1. Le point de calendrier, d''abord


    L''échéance opérationnelle est le **31 octobre**. La date du **30** n''est pas une échéance de service
    : c''est la date de validité d''une offre commerciale. Entre le 28 août et le 31 octobre, le comité
    dispose de **neuf semaines** pour décider. Il lui est proposé de ramener ce délai à **deux jours**.


    Ce que coûte l''attente : au pire la remise de 12 %, soit environ **19 800 €** sur trois ans (~6 600
    €/an — voir §3). Ce que coûte une décision fausse : **31 000 €** de migration engagés immédiatement
    sur une hypothèse technique non vérifiée, plus un verrouillage contractuel jusqu''en 2029.


    L''asymétrie est nette et elle ne dépend d''aucune appréciation technique. **C''est le seul point
    de cet avis que je vous demande de trancher avant tout le reste.**


    *Repose sur :* les dates du dossier (échéance 31 octobre, remise avant le 30) et l''arithmétique du
    §3.

    *Si le comité l''écarte :* il faut alors démontrer qu''un renoncement à signer le 30 provoque une
    rupture de service — rien au dossier ne l''établit.


    ---


    ## 2. Ce que le dossier établit, et ce qu''il n''établit pas


    **2.1 — Deux problèmes distincts sont traités comme un seul.**

    Les **41 h d''indisponibilité** concernent les **bornes de prêt** (matériel). Les **« pertes de réservations
    »** concernent le **module de réservation** (logiciel). Le dossier ne produit aucune pièce reliant
    les deux.

    *Repose sur :* l''export technique et l''enquête interne, qui portent sur des objets différents.

    *Si écarté :* la recommandation ne change pas, mais l''utilité de la v4 devient encore plus difficile
    à évaluer.


    **2.2 — L''indisponibilité des bornes est un problème de matériel, concentré.**

    32 h sur 41 (78 %) sur Fontaine et Rive-Sud, **seuls sites équipés des bornes de 2015**. Les cinq
    autres sites totalisent 9 h sur douze mois, soit moins de 2 h chacun. La corrélation avec l''âge du
    matériel est franche ; aucune pièce ne rattache ces heures au logiciel.

    *Repose sur :* l''export technique.

    *Conséquence directe :* la compatibilité v4 ↔ bornes 2015 est « **à l''étude** ». On propose donc
    31 000 € pour une migration dont l''effet sur 78 % du problème constaté est, de l''aveu de l''éditeur,
    indéterminé.


    **2.3 — Le lien de causalité avec la mise à jour de mars n''est pas démontré.**

    Sur 62 agents, 43 ont répondu. 61 % signalent des pertes hebdomadaires (~26 agents). **12 personnes**
    situent le début *après* mars — soit au plus 28 % des répondants et 19 % des agents. Le dossier ne
    précise pas si ces 12 font partie des 26.


    Trois réserves, chacune indépendante :

    - « après mars » n''est pas « à cause de mars » ;

    - **février** a vu deux changements — remplacement du lien fibre de Rive-Sud et changement de version
    du portail usagers — antérieurs à mars et absents de l''analyse ;

    - un agent interrogé après qu''une note attribue les pertes à mars tend à dater le début sur mars.


    *Repose sur :* l''enquête interne et la chronologie de février.

    *Si le comité écarte l''enquête :* la thèse de mars perd sa seule pièce et il ne reste rien pour la
    soutenir.

    *Si le comité écarte février :* la thèse de mars reste possible mais toujours non testée, faute de
    mesure.


    **2.4 — La répartition entre sites contredit une cause réseau.**

    **Rive-Sud** ressaisit à la main depuis mars, ~5 h/semaine. **Fontaine**, même logiciel, même version,
    mêmes bornes de 2015, **ne signale rien**. Un défaut logiciel réseau devrait frapper les deux. Une
    cause locale à Rive-Sud — fibre remplacée en février, portail — expliquerait mieux l''écart.


    Deux lectures possibles, et le dossier ne permet pas de choisir : soit Fontaine n''a pas le problème,
    soit Fontaine ne le remonte pas. **Les deux se vérifient en quelques jours** et l''une des deux invalide
    la note de cadrage.

    *Repose sur :* les notes de sites.

    *Si écarté :* la piste février tombe, mais la thèse de mars n''est pas pour autant établie.


    **2.5 — Le coût réel est ailleurs que là où porte la discussion.**

    5 h/semaine à Rive-Sud depuis mars ≈ **130 h déjà consommées**, ~225 h en année pleine. C''est **plus
    d''heures que l''ensemble des indisponibilités du réseau** (41 h). Le poste de coût principal est
    un contournement manuel dont on ignore la cause.

    *Repose sur :* les notes de sites et l''export technique.


    **2.6 — Les 96 réclamations ne sont pas exploitées.**

    71 sur 96 entre mars et juin. Le dossier ne dit pas si elles nomment un site, ni si le canal de réclamation
    a changé sur la période. Une hausse des signalements n''est pas une hausse des incidents. **Ventilées
    par site et par semaine, ces 96 réclamations trancheraient sans doute le débat à elles seules** —
    c''est la pièce la plus informative du dossier et la moins utilisée.


    ---


    ## 3. Chiffrage


    Base 48 000 €, indexation +7 % :


    | | 3 ans plein tarif | avec 12 % |

    |---|---|---|

    | Indexation dès l''an 1 | 165 100 € | 145 300 € |

    | Indexation à partir de l''an 2 | 154 300 € | 135 800 € |


    Économie de la remise : **~18 500 à 19 800 €**, soit ~6 600 €/an. Le résultat est stable quelle que
    soit l''hypothèse d''indexation retenue.


    **La remise ne couvre pas la migration** (31 000 €). Signer les deux ensemble revient à dépenser 31
    000 € pour en économiser 20 000, en échange d''un verrouillage de trois ans.


    *Réserve :* je n''ai pas les clauses. L''assiette de la remise, son application aux trois années et
    le mode d''indexation doivent être confirmés par écrit avant tout engagement.


    ---


    ## 4. Les trois options


    **Reconduire à l''identique.** Ne résout rien mais n''engage rien de faux. Seule option compatible
    avec un service informatique qui passe de deux agents à un en octobre.


    **Reconduire avec la v4.** 31 000 € pour corriger un défaut logiciel non démontré (§2.3), sans garantie
    sur les bornes qui produisent 78 % des indisponibilités (§2.2). **Prématuré, pas déraisonnable :**
    si les mesures du §6 confirment une cause logicielle réseau, cette option redevient la bonne — en
    octobre, pas le 30 août.


    **Basculer vers le libre.** Le réseau voisin annonce −30 %, mais **2 de ses 5 sites tiennent encore
    un registre papier après quatorze mois**. Cette information contredit le chiffre : un coût annoncé
    qui exclut le coût de l''échec n''est pas un coût. Une telle migration serait engagée au moment précis
    où notre capacité informatique est divisée par deux. **Option à instruire sérieusement pour 2027-2028,
    à écarter pour cette échéance** — pour raison de capacité, non de principe.


    ---


    ## 5. Recommandation


    **Ne pas signer d''engagement de trois ans le 30. Rechercher une prolongation courte du contrat actuel
    (4 à 6 mois) à conditions inchangées, et décider en octobre sur pièces.**


    Si aucune prolongation n''est juridiquement ou commercialement possible — ce point doit être établi
    sous 48 h, il conditionne tout — alors : **reconduction de trois ans à l''identique avec la remise,
    sans la v4**, assortie de trois clauses : engagement de disponibilité chiffré, prix de la v4 garanti
    et tenu ouvert 18 mois, clause de réversibilité des données. Cette solution capte les 20 000 € sans
    acheter les 31 000 € non justifiés.


    **Sur la note de cadrage.** Ses trois affirmations sont plausibles et aucune n''est étayée : la cause
    de mars repose sur 12 témoignages rétrospectifs sans examen de février ; « la v4 règle le problème
    » est contredit par le « à l''étude » de l''éditeur sur les bornes de 2015 ; l''urgence du 30 est
    commerciale. Je ne demande pas au comité de la rejeter, mais de **différer de sept semaines une décision
    que ces mesures trancheront**.


    ---


    ## 6. Ce que j''engage


    **Avant le 30 (48 h)**


    | Action | Portage |

    |---|---|

    | Demander par écrit à l''éditeur si la remise reste acquise après le 30, et à quelles conditions
    | Direction |

    | Vérifier la possibilité juridique d''une prolongation de 4 à 6 mois, et si ce contrat relève de
    la commande publique — auquel cas une reconduction de 3 ans par simple signature n''est pas acquise
    | Achats / juridique |

    | Demander à l''éditeur un engagement écrit et daté sur la compatibilité v4 ↔ bornes 2015 | Chargé
    de mission numérique |


    **Sous quinze jours (au 12 septembre)**


    | Action | Portage |

    |---|---|

    | Extraire du module, par site et par semaine de janvier à août, les réservations créées / confirmées
    / perdues | Informatique |

    | Poser à Fontaine la même question qu''à Rive-Sud, de façon directe et mesurée | Direction de site
    |

    | Ventiler les 96 réclamations par site et par semaine ; vérifier si le canal a changé | Chargé de
    mission numérique |

    | Dater précisément les trois événements : fibre Rive-Sud, version portail, mise à jour de mars —
    et les superposer aux courbes | Informatique |

    | Chiffrer le remplacement des bornes de 2015 (ordre de grandeur, horizon) | Informatique + achats
    |

    | Arbitrer le remplacement du poste informatique partant en octobre | Direction |


    Les cinq premières lignes sont de l''extraction de données déjà détenues. Elles ne demandent pas de
    crédits et restent réalisables avec l''effectif actuel avant son départ.


    ---


    ## 7. Ce qui ferait changer cet avis


    - **Courbe de pertes homogène sur les sept sites démarrant en mars** → cause logicielle établie, la
    v4 devient l''option de référence, à condition que l''éditeur ait répondu sur les bornes.

    - **Pertes concentrées sur Rive-Sud démarrant en février** → problème local, ni la v4 ni le libre
    ne sont la réponse, et 31 000 € sont économisés.

    - **Prolongation impossible et remise perdue au 30** → bascule sur le repli du §5, reconduction à
    l''identique clausée.

    - **Fontaine signale le même volume de pertes que Rive-Sud** → la lecture du §2.4 tombe, et je le
    dirai au comité sans réserve.


    *Cet avis est construit à partir des seules pièces du dossier. Les §2.4 et 2.5 sont des hypothèses
    de travail, pas des constats : elles sont formulées pour être testées, et les mesures du §6 sont conçues
    pour pouvoir les infirmer.*

    '
