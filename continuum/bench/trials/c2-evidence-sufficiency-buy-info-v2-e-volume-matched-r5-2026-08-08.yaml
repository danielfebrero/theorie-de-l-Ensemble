response:
  text: '# NOTE AU COMITÉ DE DIRECTION


    **Objet :** Contrat cellules 2027 — arbitrage Kelmar / Sinolux

    **Décision demandée :** réservation de capacité Kelmar avant J+18

    **Recommandation : réserver Kelmar. Ne pas engager Sinolux sur 2027.**


    ---


    ## 1. Les 230 400 € ne sont pas une économie


    C''est un écart de prix d''achat brut, avant coût qualité. Le coût complet dépend du taux de retour
    (205 €/chargeur repris, identique quel que soit le fournisseur) :


    | Scénario | Cellules | Retours | Coût retours | **Total** | vs Kelmar |

    |---|---|---|---|---|---|

    | Kelmar — 1,3 % (mesuré, 4 ans) | 1 872 000 € | 936 | 191 880 € | **2 063 880 €** | référence |

    | Sinolux — 1,1 % (essais fournisseur) | 1 641 600 € | 792 | 162 360 € | **1 803 960 €** | −259 920
    € |

    | Sinolux — **2,86 % (seuil d''équilibre)** | 1 641 600 € | 2 060 | 422 280 € | **2 063 880 €** |
    0 € |

    | Sinolux — 3,1 % (audit de mars) | 1 641 600 € | 2 232 | 457 560 € | **2 099 160 €** | +35 280 €
    |

    | Sinolux — 4,0 % | 1 641 600 € | 2 880 | 590 400 € | **2 232 000 €** | +168 120 € |


    **Le gain disparaît à 2,86 % de retours.** La seule mesure indépendante disponible est à 3,1 % — au-dessus
    du seuil.


    *Sensibilité à vérifier avant J+18 :* si les 205 € incluent l''achat d''une cellule de remplacement,
    la garantie Sinolux en récupère 22,80 € et le seuil monte à 3,22 %. À clarifier par écrit avec Sinolux.
    Cela ne change pas la recommandation : 3,1 % reste dans la bande d''incertitude des deux seuils.


    ## 2. Nous avons deux sources, pas trois


    L''audit sectoriel (3,1 %) est la seule mesure indépendante. La note Ferro (« environ 3 % ») travaille
    sur **l''échantillon de ce même audit** : ce n''est pas une confirmation, c''est une relecture. Face
    à elle : les essais internes du fournisseur (1,1 %), produits par la partie intéressée.


    **Sinolux refuse l''indexation sur le taux de retour** — la seule clause qui transférerait le risque.
    Il propose le remplacement gratuit des cellules : cela couvre ~22,80 € d''un événement à 205 €, soit
    environ 11 % de l''exposition. Un fournisseur qui croit à ses 1,1 % accepte l''indexation. Le refus
    est en soi une information.


    ## 3. L''information n''est pas achetable dans la fenêtre


    Le test Vertex (34 000 €, ±0,3 pt) rend son résultat à **J+63**. La capacité Kelmar se ferme à **J+18**,
    le prix Sinolux tombe à **J+21**. Le résultat arrive après la fermeture des deux portes. **Payer 34
    000 € ne réduit aucune incertitude utile à la décision 2027.**


    ## 4. Ce qui rend l''erreur irrattrapable


    À J+18, la ligne Kelmar 2027 est vendue. Si le taux réel se révèle à 3 %, nous le découvrons en production,
    sans clause d''indexation, sans fournisseur alternatif pour l''année, et sans report de lancement
    possible. La perte modélisée (35 à 168 k€) n''intègre ni la charge atelier d''un volume de retours
    multiplié par 2,4, ni l''effet commercial de pannes terrain sur un produit de charge rapide.


    **Contre-argument, à son maximum :** si le taux réel est à 1,1–1,5 %, Kelmar nous coûte ~260 k€ de
    trop, et la ligne auditée n''est peut-être pas représentative de notre configuration. La perte maximale
    modélisée côté Sinolux à 3,1 % (35 k€) est faible devant ce gain — un raisonnement en espérance prend
    Sinolux. **Réponse :** cette espérance repose sur un chiffre produit par le vendeur, que le vendeur
    refuse d''inscrire au contrat ; la distribution n''a pas de borne haute mesurée au-delà de 3,1 % ;
    et le pari n''est pas répétable — il n''y a pas de sortie avant 12 mois.


    ## 5. Décisions


    1. **J+18 — réserver la capacité Kelmar** pour 72 000 unités. Retirer les 230 400 € du budget 2027
    (poste sans fondement économique établi).

    2. **Avant J+14 — une seule contre-proposition à Sinolux**, deux options : (a) clause indexée remboursant
    205 €/unité au-delà de 1,5 % de retours ; ou (b) tranche de qualification de 10 à 15 000 unités en
    2027 à 22,80 €, sous réserve que Kelmar accepte un volume partiel **au même prix unitaire**. Sans
    accord écrit à J+14, le dossier 2027 est clos.

    3. **Test Vertex — reporté au budget qualification 2028**, pas au dossier 2027. À lancer si Sinolux
    s''engage par écrit sur un prix 2028.


    **Conditions d''arrêt observables :**

    - Kelmar : suivi mensuel du taux de retour ; alerte formelle si > 1,6 % sur deux mois consécutifs.

    - Sinolux : si le test Vertex mesure ≤ 2,5 % (0,3 pt de marge sous le seuil), ouverture de la négociation
    2028 en double source. Au-dessus, dossier fermé.


    ---


    Le point à retenir pour le comité : nous ne choisissons pas entre 26,00 € et 22,80 €. Nous choisissons
    entre un taux de retour mesuré sur quatre ans et un taux de retour que le fournisseur refuse de garantir,
    sur une décision qui ne se rouvre pas avant 2028.

    '
