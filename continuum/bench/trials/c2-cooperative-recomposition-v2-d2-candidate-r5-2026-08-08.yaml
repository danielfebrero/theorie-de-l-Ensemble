response:
  text: '## Position de la présidence — bassin de la Vèze


    ### 1. Le verdict, en une phrase


    Je ne propose pas un partage des 410 L/s : je propose de **suspendre la délibération sur le chiffre
    lui-même pendant 72 heures**, d''arrêter dès jeudi les deux planchers non arbitrables, de basculer
    sur des **quotas individuels conditionnés au comptage**, et d''utiliser les 600 000 € non pas à indemniser
    la perte — ils en couvrent 15 % — mais à **racheter l''eau que les petites exploitations ne pourront
    de toute façon pas valoriser**, pour la concentrer sur les hectares encore sauvables.


    ---


    ### 2. Le chiffre sur lequel on s''apprête à voter n''est plus le bon


    L''énoncé du dossier pose 570 − 410 = 160. Or la dernière valeur mesurée après la décrue de l''orage
    du 9 août est **340 L/s**, en tendance descendante, sans pluie annoncée avant trois semaines. À 340
    L/s :


    > débit réservé (180) + prélèvement actuel de la régie (150) = **330 L/s**. Il reste **10 L/s** pour
    620 hectares.


    Le déficit réel n''est pas de 160 L/s, il est de l''ordre de **230 L/s**. Délibérer jeudi sur 160
    revient à voter une répartition qui sera fausse le lendemain.


    S''ajoute une incertitude que personne n''a chiffrée : **une seule station, étalonnée en 2023**, qui
    travaille aujourd''hui à un tiers de son débit moyen, c''est-à-dire dans la zone où sa courbe de tarage
    est extrapolée, pas mesurée. Une erreur de 10 % à ce niveau, c''est ±34 L/s — soit l''équivalent de
    toute la marge de manœuvre. **Tant que ce chiffre n''est pas contrôlé, il n''y a pas de décision sérieuse
    à prendre, seulement une décision à faire semblant de prendre.**


    Trois données décident du dossier plus que n''importe quel débat en séance, et les trois sont obtenables
    en 72 heures :


    1. **Le volume utile stocké dans la retenue de Sarcelle** et la courbe de niveau depuis le 1er juin.
    Nous délibérons sur un débit entrant sans savoir ce qu''il y a derrière le barrage. Si la retenue
    contient 450 000 m³ mobilisables, cela représente 160 L/s pendant un mois et change tout. Si c''est
    un ouvrage au fil de l''eau, l''arithmétique du point ci-dessus s''impose intégralement.

    2. **Un contre-jaugeage indépendant** à Sarcelle, plus le ré-étalonnage de la station.

    3. **Le rendement du réseau de Ferney** : volume mis en distribution, volume facturé, débit de nuit
    par secteur.


    ---


    ### 3. Ce qui n''est pas arbitrable, et qu''il faut dire clairement à la presse


    Deux des trois usages ne sont pas dans notre main :


    - **Le débit réservé de 180 L/s est fixé par arrêté préfectoral.** La commission n''a aucune compétence
    pour l''abaisser. Et le rapport du 12 juin documente en dessous une perte qualifiée de non reconstituable
    à l''échelle d''une décennie : ce n''est pas un mauvais tirage qu''on encaisse, c''est une branche
    sans retour. Elle est hors table.

    - **L''alimentation en eau potable** d''une population de 9 200 habitants dont un EHPAD de 110 lits,
    avec 4 jours de réserve, relève de la salubrité publique. Son **noyau vital** est garanti sans condition.


    Il en résulte que le titre « les paysans ou les robinets » décrit mal la séance : **le seul arbitrage
    qui nous appartienne porte sur la fraction non vitale du prélèvement de la régie et sur l''irrigation.**
    Je le dirai en ces termes.


    ---


    ### 4. Le seul gisement d''eau qui n''a pas été ouvert : les 150 L/s de la régie


    150 L/s pour 9 200 habitants font **12 960 m³/jour, soit 1 409 litres par habitant et par jour**.
    L''ordre de grandeur d''un service rural français, pertes et usages non domestiques compris, se situe
    entre 200 et 350 L/hab/j. Nous sommes 4 à 7 fois au-dessus.


    Ce calcul est une arithmétique directe sur les chiffres du dossier ; l''explication, elle, reste une
    **hypothèse à vérifier** : soit la régie dessert bien au-delà de Ferney, soit le chiffre est un prélèvement
    autorisé et non consommé, soit — et c''est le cas le plus probable — le rendement du réseau est très
    dégradé. À 65 % de rendement, ce sont plus de 50 L/s qui partent dans le sol, c''est-à-dire le tiers
    du déficit annoncé.


    Je serai honnête sur ce qu''on peut en tirer en trois semaines : on ne refait pas un réseau. Mais
    une campagne de recherche de fuites nocturne par secteur, la réparation des deux ou trois casses principales,
    la fermeture des fontaines et arrosages publics et l''interdiction des usages non essentiels sur le
    réseau permettent raisonnablement de récupérer **10 à 25 L/s**, pas 50. C''est partiel, différé, et
    c''est pourtant le seul litre qui ne soit pris à personne.


    **Ce que j''arrête donc :** un plafond de prélèvement opposable à la régie, dégressif — 150 aujourd''hui,
    135 L/s au 1er septembre, 120 L/s au 15 septembre — assorti de la garantie écrite d''un noyau vital
    jamais entamé et d''un plan de citernage de l''EHPAD financé par le fonds. La régie obtient la sécurité
    absolue qu''elle réclame ; elle la paie en transparence et en trajectoire, pas en risque sanitaire.


    ---


    ### 5. Quotas individuels, et non volume global


    Le règlement offre les deux. Le volume global par usage est ici **inapplicable** : sans compteurs,
    un volume collectif n''est ni réparti ni contrôlable, et il produit exactement ce qui s''est produit
    le 11 août — une course au pompage où celui qui respecte l''accord finance celui qui ne le respecte
    pas. C''est la sanction du dispositif 2022, et elle est documentée.


    Mais les quotas individuels supposent des données que la commission n''a pas : ni cultures, ni stades,
    ni relevés. **Le comptage devient donc la condition d''accès à l''eau, pas un contrôle a posteriori**
    : compteur scellé et relevé hebdomadaire, ou quota nul. Environ 34 dispositifs à poser, de l''ordre
    de 85 000 € — c''est ce que le fonds doit acheter en premier.


    ---


    ### 6. Le cœur du dispositif : concentrer l''eau, compenser l''abandon


    La demande des maraîchers, 240 L/s pour 620 ha, correspond à **3,3 mm/jour** — ils demandent déjà
    une irrigation déficitaire, ce qui donne l''étalon. Sur le résidu réellement disponible (de l''ordre
    de 40 L/s si la régie tient sa trajectoire), on irrigue **environ 100 hectares** à ce même standard.
    Pas 620.


    Il faut le dire sans détour : **il n''existe aucune répartition qui sauve la sole maraîchère.** Une
    coupe proportionnelle à la surface donnerait à chacun 0,54 mm/jour, c''est-à-dire une perte totale
    pour tout le monde, plus le coût du pompage. Elle protégerait mécaniquement les 6 exploitations qui
    détiennent 300 ha et laminerait les 28 autres, qui se partagent 320 ha — 11 ha en moyenne, et c''est
    là que se trouve le vrai risque de ruine : pour ces exploitations, une saison perdue n''est pas une
    mauvaise année, c''est la fin.


    Je propose donc de **dissocier les deux instruments** :


    - **L''eau est allouée à l''agronomie, pas à la propriété.** Un technicien procède au classement des
    parcelles par valeur sauvable au m³ et par proximité de récolte. Les ~100 ha irrigués sont ceux qui
    rendent quelque chose, quel qu''en soit l''exploitant.

    - **L''argent est alloué à la viabilité, pas à la surface.** Chaque exploitation reçoit un quota individuel
    nominatif ; celles dont les parcelles ne sont pas retenues **cèdent leur quota au pool contre paiement
    du fonds**, à prix uniforme au L/s, avec plafond par exploitation. Cession au pool uniquement — **pas
    de marché de gré à gré**, faute de quoi les 6 grandes rachètent les 28 petites au comptant.


    L''abandon cesse alors d''être une défaite subie : il devient une transaction, et il rapporte à ceux
    qui ne pouvaient de toute façon rien produire avec leur part.


    ---


    ### 7. Les 600 000 € : ce qu''ils font, et ce qu''ils ne feront pas


    | Poste | Montant | Effet |

    |---|---|---|

    | Compteurs scellés (34), ré-étalonnage station, contre-jaugeages | ~100 000 € | rend la décision
    contrôlable |

    | Recherche de fuites + réparations d''urgence réseau Ferney | ~150 000 € | 10 à 25 L/s repris à personne
    |

    | Rachat de quotas / maintien de viabilité, plafonné, dégressif | ~300 000 € | transforme la faillite
    en perte de saison |

    | Citernage EHPAD, réserve d''aléa | ~50 000 € | garantit le noyau vital |


    Il faut le dire en séance plutôt que le laisser découvrir : **600 000 € contre 4,1 M€, c''est 15 %**.
    Environ 580 €/ha face à une perte de 6 600 €/ha. Ce fonds n''indemnise pas, il évite des liquidations.
    La demande de reconnaissance au titre des calamités agricoles et la saisine du niveau départemental
    et régional doivent partir **le premier jour**, pas en septembre, parce que le délai administratif
    est plus long que la sécheresse.


    Un argument à donner aux maraîchers, et qui n''est pas de la consolation : **c''est l''arrêté de restriction
    qui ouvre leurs droits** — assurance récolte, calamités, dégrèvement de taxe foncière. Prendre la
    mesure tôt et par écrit sert leur dossier ; l''absence de décision, non.


    ---


    ### 8. Corriger la faute de 2022


    La clause de levée automatique après 48 h au-dessus du seuil est la cause directe de l''épisode du
    11 août : elle a rendu à la ressource un orage, et pris quatre jours pour le perdre. **Je propose
    son abrogation explicite** et son remplacement par un dispositif asymétrique :


    - l''indicateur devient la **moyenne glissante 7 jours** du débit corrigé, jamais la valeur instantanée
    ;

    - **le durcissement est rapide** (48 h sous seuil) ;

    - **la levée est lente et non automatique** : 10 jours consécutifs au-dessus du seuil, **et** tendance
    7 jours non décroissante, **et** niveau de retenue reconstitué, **et** délibération de la commission.
    Un seul palier levé par fenêtre de 10 jours ;

    - l''incertitude de mesure est utilisée dans un seul sens : **borne basse pour allouer, borne haute
    pour lever**.


    **Déclencheurs de repli, observables et chiffrés :**


    | Si | Alors |

    |---|---|

    | Moyenne 7 j < 300 L/s | irrigation suspendue en totalité, régie ramenée au noyau vital, commission
    sous 24 h |

    | Moyenne 7 j < 210 L/s | le respect simultané du réservé et du vital devient physiquement impossible
    → saisine préfectorale immédiate ; ce n''est plus notre décision |

    | Réserve tampon de Ferney < 48 h | plan de citernage déclenché, EHPAD prioritaire |

    | Écart > 10 % entre station et contre-jaugeage | tout est recalculé sur la valeur basse jusqu''à
    résolution |

    | Pompage sans compteur scellé | quota ramené à zéro pour la campagne, procès-verbal |

    | Volume de retenue et rendement réseau non produits sous 10 jours | passage par défaut à la répartition
    la plus conservatrice — **une donnée retenue doit coûter à celui qui la retient, pas à la rivière**
    |


    ---


    ### 9. Ce que je dis à chaque partie — et ce que je leur donne réellement


    Les maraîchers sont partis avant le vote et la régie refuse de discuter : ces deux blocages ont la
    même structure. Chacun protège la chose qu''il croit sur le point de perdre absolument. On ne les
    fait pas revenir avec un appel au sens des responsabilités ; on les fait revenir en garantissant cette
    chose-là.


    - **À la régie** : votre noyau vital est garanti par écrit, sans condition, avec citernage de l''EHPAD
    financé. En contrepartie, vous publiez votre rendement et vous acceptez un plafond opposable et dégressif
    sur la part non vitale. Vous n''êtes plus le service qu''on soupçonne : vous êtes celui qui apporte
    25 L/s au bassin.

    - **Aux maraîchers** : vous avez raison de ne pas signer un partage calculé sur une station étalonnée
    en 2023. Je vous donne donc un pouvoir réel, pas une consultation — **le droit de déclencher deux
    contre-jaugeages indépendants à la charge du fonds**, et la désignation du technicien qui classe les
    parcelles, avec co-signature du protocole de comptage. Vous pouvez faire réviser le chiffre sur lequel
    repose tout le dispositif. Et tout relèvement du débit corrigé relève automatiquement vos quotas.

    - **À la presse** : le débit réservé n''est pas dans le champ de la commission, il relève du préfet.
    Ce qui est arbitré ici, c''est la part non vitale d''un réseau et la répartition d''un résidu. Le
    titre exact n''est pas « les paysans ou les robinets » ; c''est « 1 409 litres par habitant et par
    jour ».


    ---


    ### 10. Le meilleur argument contre ma position


    > *Vous détruisez 4,1 M€ et 90 emplois, de manière certaine, sur la foi d''une station non étalonnée
    en décrue, pour protéger un plancher de 180 L/s dont rien ne prouve qu''il sauvera encore des frayères
    déjà compromises. Vous échangez une perte certaine contre un bénéfice hypothétique.*


    Il tient en partie, et il modifie le **calendrier**, pas le verdict. Il ne le renverse pas pour trois
    raisons : le plancher de 180 n''est pas notre arbitrage mais un arrêté que nous ne pouvons pas abaisser
    ; le chiffre contesté est précisément ce que j''achète en 72 heures, avant tout arbitrage définitif
    sur l''irrigation ; et la branche économique est traitée en parallèle dès le premier jour, pas troquée.


    Mais il impose une chose : **je n''annonce pas jeudi l''abandon de 520 hectares comme définitif.**
    J''annonce les planchers, le plafond de la régie, l''achat de la mesure, le mécanisme de rachat —
    et une **date de révision au 10e jour**, avec révision automatique à la hausse si le débit corrigé
    est supérieur.


    ---


    ### 11. Ce qui renverserait ma position, et la première action


    **L''observation qui me ferait changer d''avis** : un volume utile mobilisable en retenue **≥ 450
    000 m³** (soit 160 L/s pendant un mois) ou un débit corrigé **≥ 520 L/s** tenu 10 jours. Dans l''un
    ou l''autre cas, la demande de 240 L/s redevient discutable et le triage devient inutile.


    **Première action, demain matin, avant la séance** — le fonds étant mobilisable sous quinze jours,
    ces commandes partent sur lettre d''engagement et non sur trésorerie :


    1. Demande écrite à l''exploitant du barrage : volume utile et courbe de niveau depuis le 1er juin,
    réponse sous 48 h.

    2. Demande écrite à la régie : volumes mis en distribution et facturés, débits de nuit par secteur,
    réponse sous 48 h.

    3. Commande d''un contre-jaugeage indépendant à Sarcelle pour lundi, et du ré-étalonnage de la station
    (~40 000 €, première tranche).

    4. Dépôt de la demande de reconnaissance calamité agricole et saisine du département.


    Le reste — la répartition exacte des litres — se décide au 10e jour, sur des chiffres qu''on aura
    vérifiés plutôt que reconduits.


    ---


    Si vous voulez, je peux le mettre en forme comme note officielle prête à diffuser aux trois collèges
    (version courte 2 pages + annexe de calcul), ou rédiger séparément le projet de délibération et la
    grille de quotas.

