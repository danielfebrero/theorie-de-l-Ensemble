response:
  text: '## Recommandation en une ligne


    La diapositive ne porte **aucun chiffre d''activation comparatif** — ni 47 %, ni 41 %. Elle porte
    les deux résultats réellement mesurés (support, rétention), la nature exacte du défaut, et la date
    du chiffre corrigé. On le dit au comité en ouverture, pas en note d''orateur.


    Ce n''est pas de la prudence morale. C''est que le chiffre n''existe pas : il n''y a pas de mesure
    biaisée à corriger, il y a une mesure qui n''a jamais eu lieu.


    ---


    ## 1. Les deux faits n''en sont qu''un


    **Le défaut structurel.** L''affectation v2 est écrite à l''étape 3 ; le témoin est écrit à l''inscription.
    Les deux bras n''ont donc pas le même dénominateur : le témoin compte tous les inscrits, v2 ne compte
    que les survivants de l''étape 3. Les 11 300 « comptes v2 » ne sont pas un échantillon des comptes
    exposés à v2 — c''est le sous-ensemble de ceux qui sont allés assez loin pour être enregistrés. On
    compare un taux d''activation à un taux d''activation *conditionnel à une progression déjà réussie*.
    Le nombre d''abandons avant l''étape 3 n''est nulle part : ce n''est pas un chiffre imprécis, c''est
    un chiffre absent.


    **Les 4 812 inversions ne sont pas un second problème.** Elles sont la signature du premier. Horodatages
    serveur, service unique, horloge NTP unique, aucun incident : l''hypothèse « artefact de journalisation
    » est réfutée par l''infra elle-même. `first_action_at < bucket_assigned_at` parce que le compte agit
    *avant* que le service ne l''affecte — exactement ce que produit une affectation à l''étape 3. Le
    témoin donne le vrai plancher de bruit : 0,9 %. Le bras v2 est à 42,6 %. Ce n''est pas le même phénomène
    à une autre échelle, c''est un autre phénomène.


    Un détail à ne pas laisser passer : **11 300 > 10 940**. Le bras v2, *après* avoir perdu tous ses
    abandons précoces, est plus gros que le témoin complet. La répartition n''était donc pas 50/50 — v2
    a reçu une part plus large. C''est gênant pour la lecture, mais c''est aussi la clé de la récupération
    (§5).


    ## 2. Pourquoi 41 % est le pire des trois chiffres


    Retirer les 4 812 lignes, c''est supprimer précisément les comptes dont le comportement *prouve* que
    l''affectation est post-traitement. Le défaut reste, la preuve du défaut disparaît. Et on conditionne
    une deuxième fois, sur une variable elle-même post-traitement : le sens du biais résiduel devient
    inconnu — 41 % n''est pas « plus conservateur », il est *différemment faux, sans direction connue*.


    Surtout : 47 % est une erreur, 41 % est une correction. Un chiffre corrigé atteste que l''équipe a
    vu l''anomalie et a choisi la réponse qui préserve le résultat. En diligence confirmatoire, c''est
    la différence entre une négligence et un dossier.


    ## 3. L''ampleur : le seuil est banal


    5 311 activations observées au bras v2 (47 % × 11 300). Si les abandons avant l''étape 3 n''activent
    quasiment jamais — hypothèse raisonnable, et défavorable à v2 dans le sens où elle *sous*-estime le
    numérateur corrigé — le vrai taux dépend uniquement du nombre manquant :


    | Abandon avant étape 3 | Exposés réels | Activation v2 réelle |

    |---|---|---|

    | 0 % | 11 300 | **47,0 %** |

    | 10 % | 12 556 | 42,3 % |

    | 20 % | 14 125 | 37,6 % |

    | 30 % | 16 143 | 32,9 % |

    | **34 %** | **17 132** | **31,0 % — parité avec le témoin** |

    | 40 % | 18 833 | 28,2 % |


    **Tout l''écart annoncé disparaît à 34 % d''abandon avant l''étape 3.** Un tiers d''abandon dans les
    trois premières étapes d''un onboarding n''est pas un scénario pessimiste, c''est le cas ordinaire.
    Et 13 % d''abandon suffisent déjà à effacer la différence entre 47 % et le 41 % « nettoyé ».


    Un effet réel est parfaitement possible. Il n''est simplement pas démontré, et la valeur nulle est
    dans le domaine plausible.


    ## 4. La diapositive, mot pour mot


    > ### Onboarding v2 — résultats mesurés (3 mars – 14 avril)

    >

    > **Tickets de support : −22 %**

    > Mesure indépendante, file Zendesk. Non affectée par le défaut ci-dessous.

    >

    > **Rétention à 90 jours : stable**

    >

    > **Activation à 30 jours : mesure en cours de reconstruction**

    > Le test A/B affecte le bras v2 à l''étape 3 du parcours, et le bras témoin à l''inscription. Les
    deux bras n''ont donc pas la même population de départ, et les comptes v2 ayant abandonné avant l''étape
    3 ne sont enregistrés nulle part. **Aucun taux d''activation comparatif n''est présentable à partir
    de ce test.**

    > Fait mesuré et exact : parmi les comptes v2 atteignant l''étape 3, 47 % activent à 30 jours. Ce
    chiffre n''est pas comparable au témoin et ne constitue pas un écart.

    > Reconstruction du dénominateur d''exposition en cours — chiffre corrigé attendu le **[date, ≤ 3
    semaines]**.


    Un seul bloc, rien en note d''orateur. Les notes d''orateur ne sont pas dans la data room, ne sont
    pas dans le dossier de diligence, et n''atteignent aucun investisseur qui lit le deck. Une réserve
    qui n''est pas dans le document n''est pas une réserve.


    ## 5. Ce qu''on lance aujourd''hui — le chiffre est peut-être récupérable avant mardi


    Par ordre de coût croissant :


    1. **Le ratio d''allocation dans la config du test.** C''est un paramètre écrit quelque part. Le témoin
    étant complet dès l''inscription, `exposés_v2 = 10 940 × (part_v2 / part_témoin)` donne le dénominateur
    directement. Requête de quelques heures. À faire ce soir.

    2. **Les logs d''évaluation du feature flag.** La plupart des systèmes de flag journalisent chaque
    évaluation à l''inscription, indépendamment du service d''onboarding. Si ces logs existent, le vrai
    dénominateur est récupérable à la ligne près et l''analyse se refait proprement.

    3. **Le compte des inscriptions côté auth/facturation** sur la période, ventilé par parcours servi.
    Immunisé au défaut, puisqu''il ne dépend pas du service d''onboarding.

    4. **À défaut : agrégat produit.** Toutes les inscriptions de la période → activation à 30 j, ventilées
    par phase de déploiement. Plus grossier, sensible aux effets de calendrier, mais son dénominateur
    est complet par construction.


    Si (1) ou (2) tombe avant lundi soir et que l''écart survit, la diapositive peut porter un écart corrigé
    mardi, avec une note de méthode. C''est le meilleur résultat accessible — et il ne s''obtient qu''en
    commençant maintenant.


    ## 6. Ce qu''on dit au comité


    En ouverture du point produit, avant la diapositive, ~40 secondes :


    > « Une correction sur le chiffre d''activation avant d''entrer dans le dossier. En préparant l''annexe,
    nous avons trouvé que le test A/B enregistre les deux bras à des moments différents du parcours :
    le témoin à l''inscription, v2 à l''étape 3. Les comptes v2 qui abandonnent avant l''étape 3 ne sont
    comptés dans aucun bras. Les 47 % ne mesurent donc pas ce que la diapositive annonçait ; selon le
    taux d''abandon précoce, l''écart réel va de significatif à nul. Nous ne le saurons pas avant [date].
    Nous retirons le chiffre plutôt que de le corriger approximativement. Ce qui n''est pas affecté :
    la baisse de 22 % des tickets de support, mesurée indépendamment sur Zendesk, et la rétention à 90
    jours. Nous revenons vers vous avec le chiffre reconstruit. »


    Puis on laisse les questions venir. Ne pas défendre, ne pas anticiper la valorisation dans la même
    prise de parole.


    ## 7. Le meilleur contre-argument, et où il mène


    **Le plus fort qu''on puisse opposer :** neuf jours avant signature, le biais n''est pas *prouvé*
    fatal — il est seulement possible qu''il le soit. Soulever cela mardi sans chiffre corrigé transforme
    une issue probablement bonne en renégociation certaine. Mieux vaudrait faire la requête d''abord,
    et ne parler que du résultat.


    **Il tient sur l''urgence, pas sur le contenu.** Il rend la récupération du §5 prioritaire dès ce
    soir — c''est un vrai gain, je l''intègre. Mais il ne rend présentable ni 47 % ni 41 %. Si la requête
    n''aboutit pas d''ici lundi, l''alternative n''est pas « présenter le chiffre en attendant », elle
    est « présenter ce qu''on sait ». Le contre-argument change ce qu''on espère montrer mardi ; il ne
    change pas ce qu''on a le droit de montrer.


    **Sur le fond de la position du VP Produit :** il a raison sur un point qui mérite d''être dit au
    comité. Neuf mois de travail ne sont pas invalidés — c''est la *mesure* qui l''est, pas le produit.
    La baisse de 22 % des tickets est une corroboration indépendante que v2 aide réellement. Cette distinction
    doit être portée explicitement, c''est ce qui empêche la correction d''être lue comme un aveu d''échec
    produit.


    **Sur la position de la DAF :** le term sheet référence la courbe d''activation, donc le sujet se
    rouvrira — la seule question est de savoir *qui l''ouvre*. Ouvert par nous, c''est un point de méthode
    et un signal de rigueur, avec un dossier qui tient par ailleurs. Ouvert par la diligence confirmatoire
    — et un fonds de série B obtient très souvent l''accès aux logs d''événements — c''est une déclaration
    inexacte sur une métrique nommée au contrat, découverte après qu''on l''a défendue.


    ## 8. Pire cas, repli, et ce qui renverserait tout


    **Pire cas si l''on présente 47 % ou 41 % :** découverte en diligence confirmatoire ou après closing.
    Rupture de déclaration et garantie, repricing subi ou tour annulé, exposition personnelle des signataires.
    Encaissé par les fondateurs et la DAF qui signent les *reps*, par les 42 salariés qui détiennent les
    BSPCE, et par quiconque a vu les journaux sans parler. Branche non récupérable.


    **Pire cas si l''on présente la version honnête :** repricing ou décalage du tour. Douloureux, négociable,
    réversible.


    L''asymétrie tranche seule : on n''échange pas une perte récupérable contre une perte qui ne l''est
    pas, même à probabilité plus faible.


    **L''observation qui renverserait ma recommandation :** la config du test ou les logs de flag montrent
    que l''exposition v2 réelle est proche de 11 300, c''est-à-dire un abandon avant étape 3 sous ~5 %,
    corroboré par un décompte d''inscriptions indépendant. Dans ce cas les 47 % tiennent en substance
    et la diapositive porte l''écart avec une note de méthode. C''est un test, pas une figure de style
    : lancez-le.


    **Repli et déclencheur :** si le dénominateur n''est pas reconstruit et vérifié à lundi 18 h, la diapositive
    part dans la forme du §4, sans écart. Pas de reprise automatique, pas d''arbitrage de dernière minute
    mardi matin.


    **Première action, ce soir :** demander à l''équipe data le ratio d''allocation du test et l''existence
    de logs d''évaluation du flag sur la période. Une requête, deux réponses possibles, et le reste en
    découle.

    '
