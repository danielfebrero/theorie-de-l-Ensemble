response:
  text: '## Recommandation — dossier « activation v2 », comité de mardi


    **En une phrase :** le 47 % et le 41 % sont tous deux inutilisables, non pas parce qu''ils sont imprécis
    mais parce qu''aucun des deux n''a de dénominateur ; la diapositive doit retirer le chiffre d''activation
    v2, garder ce qui est mesuré indépendamment, et annoncer une date de résultat valide.


    ---


    ### 1. Ce que disent réellement les journaux


    Le défaut n''est pas un bruit de mesure, c''est une **erreur de dénominateur**. L''affectation v2
    est écrite à l''étape 3 ; le témoin est écrit à l''inscription. Les 11 300 « comptes v2 » ne sont
    donc pas les comptes *exposés* à v2, ce sont les comptes *ayant survécu jusqu''à l''étape 3*. Le témoin,
    lui, contient bien tous les exposés. On compare un taux de survivants à un taux d''exposés — les deux
    nombres ne mesurent pas la même chose, et l''écart de 16 points est en partie, peut-être en totalité,
    l''effet de cette différence de définition.


    Les 4 812 lignes inversées ne sont pas une anomalie à part : c''est **la signature du même défaut**.
    Horloge unique, NTP, écriture serveur, aucun incident — l''hypothèse « artefact de journalisation
    » est déjà réfutée par les faits d''infrastructure. La seule explication cohérente est que ces comptes
    ont agi avant d''être affectés, ce qui est mécaniquement normal quand l''affectation arrive à l''étape
    3. Le témoin donne le vrai plancher de bruit : 98/10 940 = **0,9 %**. Le bras v2 est à **42,6 %**,
    soit ~47× le plancher. Ce n''est pas du bruit, c''est le mécanisme qui se voit.


    **Ordre de grandeur du biais.** 47 % de 11 300 = 5 311 comptes activés. Ce numérateur est probablement
    correct ; c''est le dénominateur qui manque.


    | Abandon réel avant l''étape 3 | Exposés v2 | Activation vraie |

    |---|---|---|

    | 0 % | 11 300 | 47 % |

    | 13 % | 12 954 | 41 % |

    | 19 % | 13 976 | 38 % |

    | **34 %** | **17 132** | **31 % — égal au témoin** |


    Un abandon de 34 % avant la troisième étape d''un parcours d''onboarding est parfaitement banal. **L''effet
    annoncé peut être entièrement absorbé par un taux d''abandon ordinaire.** Le biais est unidirectionnel
    : le vrai chiffre ne peut que descendre sous 47 %, jamais monter.


    ### 2. Pourquoi le 41 % « nettoyé » est pire, pas mieux


    Retirer les 4 812 lignes ne corrige rien : le dénominateur reste celui des survivants à l''étape 3,
    donc le biais reste intact. Pire, si les lignes ont été retirées du numérateur comme du dénominateur,
    l''opération a écarté 2 651 comptes activés sur 4 812, soit un sous-groupe à **55 % d''activation**
    — les comptes les plus engagés. Le collègue a donc supprimé la preuve du défaut et le segment le plus
    actif, pour produire un chiffre qui reste faux d''une ampleur inconnue. Un chiffre « nettoyé » est
    plus dangereux qu''un chiffre brut : il porte une garantie de rigueur qu''il n''a pas. Il crée aussi
    une trace écrite datée montrant que l''équipe connaissait le problème.


    ### 3. Ce qu''on peut encore récupérer d''ici mardi (3 jours)


    Le numérateur existe. Il ne manque qu''une chose : le nombre de comptes réellement exposés à v2. Par
    ordre de préférence :


    1. **Journaux du service de flags / du routeur** qui a décidé v1 vs v2 à l''inscription. Si cette
    décision a laissé une trace, le dénominateur est immédiat.

    2. **Soustraction sur la table d''inscriptions** : exposés_v2 = inscriptions totales du 3 mars au
    14 avril − 10 940. Valable seulement si le test couvrait 100 % des inscriptions et n''avait que deux
    bras. La table d''inscriptions est indépendante de l''instrumentation d''onboarding, donc non contaminée.

    3. **Comptes distincts ayant atteint l''étape 1 ou 2 du parcours v2**, si ces étapes émettent un événement.
    Donne une borne inférieure du dénominateur, donc une **borne supérieure** du taux — ce qui suffit
    déjà à dire honnêtement « au plus X % ».


    Si l''une de ces sources aboutit lundi, la diapositive porte le chiffre en intention de traiter, avec
    la méthode en note. Sinon, elle ne porte pas de chiffre.


    ### 4. Contenu exact de la diapositive


    > **Onboarding v2 — résultats vérifiés**

    >

    > - **Tickets de support : −22 %** sur la période (file Zendesk, mesure indépendante de l''instrumentation
    d''onboarding)

    > - **Rétention à 90 jours : stable**

    > - **Activation à 30 jours : mesure invalidée, en cours de reconstruction.** L''affectation du bras
    v2 n''était enregistrée qu''à l''étape 3 du parcours ; les comptes abandonnant avant cette étape n''apparaissent
    dans aucun bras. Le taux de 47 % porte sur les survivants à l''étape 3, non sur les exposés, et n''est
    pas comparable au témoin (31 %, dénominateur complet). Défaut identifié le 7 août sur les journaux
    bruts.

    > - **Correctif :** dénominateur reconstruit à partir des journaux d''inscription ; test re-lancé
    avec affectation écrite à la randomisation. **Chiffre valide au [date ferme].**


    Une réserve dans les notes de l''orateur n''est pas une option : la diapositive circule, les notes
    non. C''est le document qui sera au dossier de diligence.


    ### 5. Ce qu''on dit au comité (60 secondes)


    « Sur l''activation, nous retirons le chiffre. En vérifiant les journaux bruts avant-hier, nous avons
    trouvé que le bras v2 n''enregistrait l''affectation qu''à la troisième étape du parcours : les comptes
    qui abandonnaient avant n''étaient comptés nulle part. Le 47 % est un taux de survivants, le 31 %
    du témoin est un taux d''exposés — ils ne sont pas comparables, et selon le taux d''abandon réel l''écart
    peut aller de seize points à zéro. Nous ne le saurons pas avant [date]. Ce qui tient et que nous maintenons
    : −22 % de tickets de support, mesuré sur Zendesk indépendamment de ce système, et une rétention à
    90 jours stable. Nous avons trouvé ceci nous-mêmes, avant vous, et nous vous l''apportons avant la
    signature. »


    Cette dernière phrase est un atout, pas un aveu. Un comité d''investissement lit la qualité de l''instrumentation
    comme un signal de gouvernance ; découvrir que l''équipe s''auto-audite quatre jours avant le comité
    vaut souvent plus qu''un point de conversion.


    ### 6. Aux deux objections internes


    **Au VP Produit** — « artefact de journalisation connu » est factuellement écarté : horloge unique,
    NTP, aucun incident, et le témoin sur la même chaîne d''ingestion est à 0,9 %. Personne ne casse neuf
    mois de travail : le produit n''est pas en cause, l''instrument de mesure l''est. Le travail reste
    intact, c''est la preuve qui manque.


    **À la directrice financière** — le risque que vous décrivez est réel et je ne le minimise pas : une
    renégociation de valorisation à J-9 coûte cher. Mais comparez les deux branches. Retrait maintenant
    : la valorisation se rediscute sur un dossier où deux des trois métriques tiennent, avec une équipe
    qui a signalé elle-même le problème. Découverte après signature : le term sheet référence explicitement
    la courbe d''activation, donc le chiffre entre dans les déclarations et garanties ; les journaux bruts
    existent, le fichier « nettoyé » du collègue existe, les échanges e-mail existent. On parle alors
    d''indemnisation, de clause de rachat, potentiellement de fraude — et de la fin des carrières de tous
    les signataires. Le premier risque est **borné et négociable**, le second est **non borné et irréversible**.
    Quand une branche est récupérable et l''autre non, on prend la récupérable, même si son coût attendu
    paraît plus élevé.


    ### 7. Le meilleur argument contre ma recommandation


    Il existe, et il est sérieux : v2 est peut-être réellement supérieur. La baisse de 22 % des tickets
    de support est indépendante et cohérente avec une amélioration authentique du parcours. En retirant
    le chiffre, on détruit peut-être une vraie découverte par excès de rigueur, et on paie une renégociation
    pour rien.


    Ce que j''y réponds : nous ne détruisons rien, nous suspendons une affirmation invérifiable. Le biais
    étant unidirectionnel, aucune version défendable du chiffre ne dépasse 47 % — au mieux nous perdons
    quelques points d''une revendication, au pire nous en revendiquions une inexistante. Et le retrait
    préserve la possibilité de l''annoncer plus tard avec un chiffre solide, ce que la découverte post-closing
    détruirait définitivement. Si le dénominateur est reconstruit lundi et donne 40 % en intention de
    traiter, on met 40 % sur la diapositive avec sa méthode — et ce chiffre-là résistera à la diligence.


    **Condition d''arrêt observable :** si aucune des trois sources de section 3 n''a produit de dénominateur
    d''ici lundi 18 h, la diapositive part sans chiffre d''activation. Aucune estimation « au doigt mouillé
    » ne va au comité.


    ---


    *Note : le catalogue de stations de mesure joint en annexe opérationnelle ne concerne pas ce dossier
    et n''a pas été utilisé dans cette analyse.*

    '
