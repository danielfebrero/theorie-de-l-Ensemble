response:
  text: '# Plan d''exécution — conversion de la flotte à l''électrique

    **Note à l''attention du conseil — séance du jeudi 13 août 2026**

    **Direction de l''exploitation**


    ---


    ## 1. Décisions demandées jeudi


    | # | Décision | Coût | Réversibilité |

    |---|---|---|---|

    | **A** | Commander les 8 bornes devisées, ordre de service **vendredi 14 août** | 210 000 € | engagée
    |

    | **B** | Notifier au loueur la **prolongation de la totalité des 96 diesels**, avec libération par
    lots conditionnés | ~155 k€ sur 10 mois | 30 j de préavis pour chaque lot |

    | **C** | Ouvrir sous 5 jours l''**étude de raccordement électrique** des deux plateformes et la consultation
    pour une seconde tranche de bornes | étude : à chiffrer | nulle |


    Le conseil n''a pas à rouvrir le principe de la conversion. Ces trois décisions sont ce qui permet
    de l''exécuter dans le calendrier voté et de sécuriser les 620 000 € de subvention.


    ---


    ## 2. Les trois faits qui commandent le plan


    ### 2.1 La recharge, et non les véhicules, est le point de blocage


    Le besoin de recharge quotidien ne dépend pas de la répartition des tournées : il ne dépend que du
    kilométrage total. La flotte parcourt **96 × 168 = 16 128 km par jour**. Le dossier donne l''équivalence
    : 6 h de borne = une charge complète.


    | Hypothèse d''autonomie | Origine | Heures de borne / nuit | Points de charge nécessaires (fenêtre
    13 h) |

    |---|---|---|---|

    | 260 km | annoncée constructeur | 372 h | **29** |

    | 232 km | mesurée, essai de mars | 417 h | **33** |

    | 197 km | mesurée à 2 °C avec chauffage | 491 h | **38** |


    Nous disposons de **14 bornes**. Le devis en ajoute 8, soit **22**. Aucune des trois hypothèses —
    y compris celle du constructeur, que notre propre essai a déjà démentie — ne tient avec 22 bornes.


    Ce n''est pas un problème d''ordonnancement. Aucun logiciel de pilotage de charge ne crée d''énergie
    : 286 heures de borne disponibles (22 × 13 h) contre 491 heures nécessaires en janvier, c''est un
    déficit de 42 %.


    ### 2.2 La tournée la plus longue n''est pas électrifiable


    240 km dépasse l''autonomie mesurée par temps doux (232 km) et de 22 % l''autonomie mesurée à 2 °C
    (197 km). Ce n''est pas un risque, c''est une certitude arithmétique. Il en va de même, en janvier,
    de toute tournée au-delà d''environ 180 km si l''on conserve une réserve d''exploitation de 10 %.


    La note du responsable transport le confirme par la mesure : **11 recharges non prévues sur 120 tournées,
    toutes au-delà de 190 km**, dans les conditions de mars. Janvier est plus froid que mars et n''a pas
    été testé. C''est la donnée manquante centrale du dossier.


    ### 2.3 La flotte diesel est le seul repli du programme


    Elle couvre indistinctement le retard de bornes, le retard de raccordement, le déficit d''autonomie
    hivernal et un éventuel glissement de livraison. Or :


    - prolonger un diesel coûte **480 € par mois** et se défait en 30 jours ;

    - le rendre trop tôt est **irréversible pendant 11 semaines** ; si la tournée correspondante échoue
    chaque jour de ce blocage, elle coûte 77 jours ouvrés × 900 € = **69 300 €**.


    Le rapport est de 1 à 58. Rendre les diesels au rythme des livraisons revient à détruire le seul filet
    du programme avant que les risques qu''il couvre soient levés.


    ---


    ## 3. Décision A — Bornes


    **Tranche 1 : les 8 bornes devisées, ordre de service vendredi 14 août.**


    Elles sont nécessaires dans tous les scénarios : c''est une décision sans regret, qui ne demande aucune
    analyse supplémentaire. Elle est en revanche **sans marge de calendrier**. 7 semaines de travaux à
    compter du 14 août mènent au 2 octobre. Or dès fin octobre, 48 véhicules seront livrés, ce que les
    14 bornes actuelles ne peuvent pas alimenter. Une semaine de dérive et nous sommes en retard.


    En conséquence, à exiger de l''installateur avant signature : **date de mise sous tension ferme, pénalité
    de retard, et confirmation que le devis inclut la puissance de raccordement disponible pour une extension
    ultérieure.** Si le devis ne fait que consommer la réserve de puissance existante, la tranche 2 relève
    d''un autre ordre de grandeur.


    **Tranche 2 : environ 16 bornes supplémentaires, pour atteindre ~38 points.**


    Décision à prendre début novembre au plus tard (7 semaines de travaux → mise en service fin décembre),
    sur la base de l''étude de raccordement. Ordre de grandeur, en extrapolant le prix unitaire du devis
    (26 250 € par borne, travaux inclus) : **≈ 420 000 €**.


    **Ce que le conseil doit entendre clairement : le programme voté à 3,1 M€ appelle une infrastructure
    de recharge d''environ 630 000 €, dont 210 000 € seulement sont aujourd''hui devisés.** Cette information
    doit être portée maintenant et non découverte en décembre.


    **Levier immédiat et réversible : une équipe de rebranchement de nuit.** Sans rotation des prises,
    une borne ne sert que 2 véhicules par nuit en hiver (5,1 h de charge chacun) — 22 bornes ne couvrent
    alors que 44 véhicules. Avec deux rebranchements par nuit et un tri des véhicules par besoin de charge,
    la même installation en couvre 56 à 62. Deux agents de nuit par plateforme achètent l''équivalent
    de 6 bornes, se mettent en place en deux semaines au lieu de sept, et se défont si la tranche 2 arrive.
    **À armer dès novembre.**


    ---


    ## 4. Décision B — Location diesel


    **Principe : prolonger la totalité, libérer par lots, chaque libération étant conditionnée à une preuve
    mesurée.**


    Contrainte structurante : le préavis de 30 jours signifie que **chaque décision de libération se prend
    un mois avant l''échéance, sur les données disponibles à cette date**. Les conditions ci-dessous sont
    donc évaluées à la date de préavis, pas à la date de reprise.


    | Lot | Préavis | Reprise | Volume | Condition évaluée à la date de préavis |

    |---|---|---|---|---|

    | A | 15 oct. | 15 nov. | 24 | ≥ 24 VE en service depuis 3 semaines ; taux d''achèvement ≥ 98 % ;
    ≤ 2 recharges non prévues/jour |

    | B | 15 nov. | 15 déc. | 24 | 48 VE en service ; 22 bornes sous tension et exploitées |

    | C | 15 janv. | 15 févr. | 18 | 60 VE roulants (subvention acquise) ; données de froid de janvier
    validant le seuil kilométrique |

    | D | 15 mars | 15 avr. | 15 | tranche 2 sous tension ; ≥ 85 VE roulants |

    | Réserve | — | — | **15** | conservés jusqu''à traitement de la queue longue ; revue au conseil de
    mars |


    Aucune condition remplie = pas de préavis ce mois-là. Le lot glisse d''un mois. Le coût de la glissade
    est de 480 € par véhicule ; le coût de l''erreur inverse est de 900 € par tournée manquée, sans recours
    pendant 11 semaines.


    **Coût de la prolongation, par rapport à une restitution au rythme des livraisons : environ 155 000
    € sur dix mois**, dont 104 000 € sur la fenêtre critique septembre–janvier. À comparer aux 620 000
    € de subvention et à une exposition de l''ordre de 200 000 € par mois si une douzaine de tournées
    échouent quotidiennement.


    **Autorité opérationnelle : le responsable transport dispose du pouvoir de geler un préavis de libération**,
    par décision écrite motivée par les indicateurs. Il n''est pas consulté, il décide. C''est lui qui
    détient la mesure ; c''est à lui que doit revenir la main sur la seule décision irréversible du programme.


    ---


    ## 5. Décision C — Affectation des tournées


    **Règle d''affectation, applicable dès la première livraison :**


    - Tournée ≤ **175 km** : véhicule électrique.

    - Tournée > 175 km : diesel, jusqu''à validation par les données de janvier.

    - Le seuil est révisable **à la baisse** par le responsable transport sur déclencheur mesuré ; sa
    remontée exige une décision de direction sur trois semaines de données de froid.


    Les véhicules électriques prennent les tournées les plus courtes en priorité — ce n''est pas un détail
    de confort : c''est ce qui permet aux 22 bornes de couvrir 60 véhicules plutôt que 44, et donc ce
    qui sécurise la subvention.


    **Donnée manquante n° 1, à produire pour lundi :** l''**histogramme des 96 tournées par tranche de
    10 km**. Nous disposons de la moyenne (168 km), du maximum (240 km) et d''un point issu de l''essai
    (au moins 9 % au-delà de 190 km). Nous n''avons pas la distribution, et c''est elle qui détermine
    combien de véhicules électriques les 22 bornes alimenteront réellement. C''est une requête sur des
    données que le superviseur de flotte détient déjà.


    **Si moins de 60 tournées sont à 175 km ou moins**, l''affectation seule ne suffira pas à atteindre
    le seuil de subvention. Deux options à instruire en parallèle, sans décision jeudi :

    - redécoupage de la queue longue (coût : environ 5 tournées et 5 conducteurs supplémentaires, à chiffrer)
    ;

    - 2 bornes rapides en courant continu par plateforme pour un appoint de mi-journée sur les tournées
    longues (ordre de grandeur 250 k€, à comparer aux 86 400 €/an que coûtent 15 diesels permanents).


    ---


    ## 6. Calendrier


    | Échéance | Événement | Véhicules électriques roulants | Diesels conservés |

    |---|---|---|---|

    | 14 août | Ordre de service bornes T1 ; préavis de prolongation totale | 0 | 96 |

    | 15 août | Ouverture étude de raccordement | 0 | 96 |

    | 30 sept. | 24 VE livrés | 24 | 72 |

    | 2 oct. | Mise sous tension des 22 bornes — **jalon sans marge** | 24 | 72 |

    | 15 oct. | Préavis lot A, sous condition | 24 | 72 |

    | 31 oct. | 48 VE livrés | 48 | 48 |

    | début nov. | **Décision tranche 2** sur étude de raccordement | 48 | 48 |

    | 30 nov. | 72 VE livrés ; 60 roulants (capacité de charge) | 60 | 36 |

    | 31 déc. | 96 VE livrés ; tranche 2 sous tension | 60 → 85 | 36 → 15 |

    | 31 janv. | **Seuil subvention : 60 roulants** — atteint avec marge | ≥ 60 | 36 |


    ---


    ## 7. Pilotage et déclencheurs de repli


    Les instruments existent : remontée d''état de charge et de kilométrage toutes les 10 minutes, publication
    quotidienne par plateforme du taux d''achèvement et des recharges non prévues. À y ajouter, sans développement
    lourd : état de charge au retour au dépôt, et taux d''occupation des bornes.


    | Déclencheur observable | Action, sous 24 h |

    |---|---|

    | > 2 recharges non prévues par jour et par plateforme, sur 5 jours glissants | seuil kilométrique
    abaissé de 15 km ; préavis de libération suivant gelé |

    | Taux d''achèvement des tournées électriques < 98 % sur 5 jours glissants | tournées concernées repassées
    en diesel ; préavis gelé ; revue de direction |

    | État de charge médian au retour < 15 % sur 5 jours | seuil abaissé de 15 km |

    | Bornes T1 non sous tension au 15 octobre | lot A annulé ; 12 diesels supplémentaires maintenus |

    | Livraison mensuelle en retard de plus de 10 véhicules | préavis du mois suspendu ; mise en demeure
    du fournisseur |


    Aucune reprise automatique : la remontée d''un seuil est une décision explicite, documentée, prise
    sur trois semaines de données.


    ---


    ## 8. Coûts


    | Poste | Montant | Statut |

    |---|---|---|

    | Véhicules | 3 100 000 € | engagé |

    | Subvention régionale | − 620 000 € | conditionnelle au 31 janvier |

    | Bornes tranche 1 | 210 000 € | à décider jeudi |

    | Bornes tranche 2 (~16) | ≈ 420 000 € | à décider début novembre |

    | Raccordement électrique | **non chiffré** | étude à lancer lundi |

    | Prolongation location diesel | ≈ 155 000 € | à décider jeudi |

    | Équipe de nuit, nov.–févr. | ≈ 55 000 € | à armer en novembre |

    | **Total hors raccordement** | **≈ 3 320 000 €** net de subvention | |


    ---


    ## 9. Ce qui renverserait ce plan


    **L''histogramme des tournées.** Si plus de 70 tournées sont à 160 km ou moins, la charge de nuit
    se densifie, la tranche 2 peut être réduite et le volume de diesels conservés baisse d''un tiers.
    Si au contraire la distribution est étalée avec une queue épaisse au-delà de 190 km, la question n''est
    plus le nombre de bornes mais le découpage des tournées, et il faut l''ouvrir en septembre et non
    en mars.


    **L''étude de raccordement.** 38 points à 22 kW représentent environ 840 kW, soit près de 420 kW par
    plateforme, contre 154 kW installés aujourd''hui. Si un nouveau raccordement est nécessaire, son délai
    — plusieurs mois, hors de notre contrôle — devient le chemin critique du programme, devant les véhicules
    et devant les travaux de bornes. **C''est l''inconnue la plus dangereuse du dossier, et c''est celle
    qui coûte le moins cher à lever : une consultation du gestionnaire de réseau, lundi.** Je la présente
    ici comme une hypothèse à confirmer, pas comme un fait établi : le dossier ne mentionne pas la puissance
    souscrite des sites.


    **Les données de froid de janvier.** Le chiffre de 197 km a été relevé à 2 °C avec chauffage sur six
    véhicules en mars. Il peut être un pire cas plutôt qu''une moyenne d''hiver. Nous le saurons en décembre
    grâce aux 24 premiers véhicules — à condition de les affecter délibérément aux tournées longues lors
    du premier épisode de froid, sous surveillance, avec un diesel de secours positionné. Ce test ne coûte
    presque rien et il conditionne le lot C.


    ---


    ## 10. Le meilleur argument contre ce plan


    *« L''essai de mars montre que seules les tournées de plus de 190 km ont posé problème, soit 9 %.
    La tournée moyenne fait 168 km, largement dans les 197 km d''autonomie hivernale. La direction extrapole
    une crise de recharge à partir d''une moyenne, alors que les véhicules ne rentrent pas à vide et que
    beaucoup n''ont besoin que de deux ou trois heures. Avec une affectation triée, 22 bornes suffisent.
    On demande 420 000 € de bornes et 155 000 € de diesel sur un calcul de moyenne. »*


    **Il ne tient pas, pour une raison précise.** Le total d''heures de borne nécessaires est indépendant
    de la distribution : il vaut 16 128 km × 6 h / autonomie. C''est une somme, pas une moyenne. Le tri
    des tournées améliore le taux de remplissage des bornes — il vaut 25 à 40 % de capacité, et c''est
    précisément pourquoi je recommande l''équipe de nuit. Il ne crée aucune énergie. 286 heures disponibles
    contre 491 nécessaires : un déficit de 42 % qu''aucune affectation ne comble.


    **Là où il porte, en revanche :** ce même calcul montre que 22 bornes suffisent probablement à alimenter
    **60 véhicules affectés aux tournées les plus courtes**, et donc à sécuriser la subvention. Le plan
    ci-dessus intègre cette correction — c''est pourquoi je ne demande pas la tranche 2 jeudi, mais début
    novembre, après l''étude de raccordement. Le contre-argument déplace l''urgence sans annuler le besoin.


    ---


    ## 11. Ce qu''il faut négocier, et non absorber


    Trois ensembles portent le coût de cette transition sans avoir voté la commande. Les traiter maintenant
    coûte moins cher que les indemniser plus tard.


    - **Les conducteurs.** Un conducteur peut refuser une affectation électrique si l''état de charge
    projeté au retour est inférieur à 20 %, avec réaffectation immédiate et sans pénalité. C''est un pouvoir
    réel donné à la personne qui voit la route, pas une procédure de remontée.

    - **Le personnel des plateformes.** Le rebranchement de nuit est un travail nouveau. Il se négocie
    avec les représentants du personnel avant novembre, pas au moment où il devient urgent.

    - **Les clients des tournées longues.** Sur les tournées identifiées à risque, obtenir en septembre
    un élargissement négocié des créneaux de livraison. Un créneau élargi coûte une visite commerciale
    ; une tournée manquée coûte 900 € et un client.


    ---


    ## 12. Première action


    **Lundi 10 août, avant la séance :**

    1. Histogramme des 96 tournées par tranche de 10 km — superviseur de flotte.

    2. Puissance souscrite des deux plateformes et saisine du gestionnaire de réseau pour un devis de
    raccordement à 420 kW par site.

    3. Confirmation écrite de l''installateur : date ferme de mise sous tension des 8 bornes, et réserve
    de puissance disponible au-delà.

    4. Projet de courrier de prolongation au loueur, prêt à signature jeudi soir.


    Le point 4 est le seul dont le calendrier ne pardonne pas : le préavis de 30 jours doit courir avant
    les premières reprises de septembre.


    ---


