response:
  text: '## Recommandation


    **Verdict : le chiffre 31 % → 47 % ne peut pas figurer sur la diapositive, sous aucune forme, ni avec
    réserve orale.** Ce n''est pas un artefact de journalisation. Le mécanisme qui produit l''inversion
    est le même que celui qui produit l''écart mesuré.


    ---


    ## 1. Pourquoi l''hypothèse « artefact connu » est déjà réfutée


    Un artefact d''horodatage frapperait les deux bras de façon comparable : même service d''ingestion,
    même horloge, même NTP, aucune source mobile, aucun incident infra. Or :


    | | inversions | taux |

    |---|---|---|

    | bras v2 | 4 812 / 11 300 | **42,6 %** |

    | bras témoin | 98 / 10 940 | **0,9 %** |


    Un facteur ~47 entre deux bras qui partagent toute leur chaîne d''écriture n''est pas du bruit. Le
    témoin à 0,9 % est probablement le vrai artefact de journalisation (course d''écriture intra-session)
    — et il donne l''ordre de grandeur de ce qu''un artefact produit ici : environ un pour cent.


    Les 42,6 % s''expliquent entièrement par le code poussé le 2 mars : **v2 s''applique à la deuxième
    session, le témoin dès la première.** L''anomalie n''est pas à expliquer, elle est prédite par le
    design.


    ## 2. Les deux biais, tous deux dans le sens qui flatte v2


    **Numérateur contaminé.** 42,6 % du bras v2 ont posé leur première action clé *avant d''avoir vu v2*.
    Ces activations sont produites par l''ancien onboarding et comptées au crédit du nouveau. Sur les
    47 % affichés, environ 42,6 points sont antérieurs à l''exposition : **il reste au plus ~4,4 points
    attribuables à quoi que ce soit survenu après exposition à v2**, contre ~31 points post-affectation
    côté témoin. (À confirmer : que la définition d''« activation à 30 jours » repose bien sur `first_action_at`.)


    **Dénominateur filtré.** Le bras v2 ne peut contenir que des comptes revenus une seconde fois. Le
    bras témoin contient tout le monde, y compris les comptes one-and-done. On compare une population
    survivante à une population complète, sur une métrique — l''activation — que le fait de revenir prédit
    presque par définition.


    **Troisième point à vérifier avant mardi :** le test court du 3 mars au 14 avril, soit 42 jours, pour
    une fenêtre d''activation de 30 jours. Les cohortes tardives sont censurées, et v2 s''inscrit structurellement
    plus tard. Cela tire v2 vers le *bas* — donc les biais 1 et 2 sont encore plus grands qu''ils n''apparaissent.
    C''est exactement le type de détail qu''un analyste de due diligence trouve dans la data room.


    ## 3. Ce qui tient encore


    - **-22 % de tickets support**, mesurés sur Zendesk indépendamment du bucketing. Solide dans son périmètre,
    à présenter comme comparaison de périodes, pas comme effet causal isolé (aucun contrefactuel : autres
    livraisons, saisonnalité).

    - **Rétention à 90 jours stable.** Utile : elle exclut l''hypothèse d''une régression.

    - Rien dans ce dossier ne dit que v2 est un mauvais produit. Le test ne le mesure pas, dans un sens
    **ni dans l''autre**. Ne pas surcorriger en annonçant que v2 sous-performe : ce serait la même erreur
    en miroir.


    ## 4. Le diagnostic à lancer aujourd''hui (quelques heures)


    Une seule question détermine si un chiffre corrigé est disponible mardi :


    > L''affectation au bras est-elle **déterministe à t=0** (hash de `user_id`, simplement *écrite* en
    session 2), ou n''est-elle **décidée** qu''en session 2 ?


    - **Déterministe** → on recalcule l''affectation pour les 100 % d''inscrits, y compris les one-and-done,
    on ré-ancre les deux bras sur le même événement index (début de 2ᵉ session) et on ne compte que les
    activations postérieures à l''exposition. Une estimation défendable existe mardi.

    - **Décidée en session 2** → aucune réanalyse de ce test ne produit d''estimation comparable. Il faut
    un nouveau test.


    Requête décisive : les comptes à session unique ont-ils un enregistrement de bucket v2 ? Plus lecture
    du diff du 2 mars.


    **Ce que le diagnostic ne change pas :** dans les deux branches, l''exposition à v2 commence en session
    2, donc les 42,6 % d''activations pré-exposition restent non attribuables. **La diapositive actuelle
    est indéfendable quel que soit le résultat.** On peut donc trancher aujourd''hui sans attendre.


    ## 5. Ce que contient exactement la diapositive


    **Titre :** « Activation — mesure révisée » (plus « v2 fait passer l''activation de 31 % à 47 % »).


    **Si le diagnostic aboutit avant mardi :** le chiffre corrigé, quel qu''il soit, avec les deux bras
    ancrés sur le même événement, n de chaque bras, intervalle de confiance, et une ligne en pied de diapositive
    : *« Analyse révisée le [date] : la version initiale confondait exposition et affectation (application
    de v2 en 2ᵉ session). Méthode et code en annexe C. »*


    **Sinon :** la case activation porte **« en cours de re-mesure — résultat le [date ferme] »**, et
    la diapositive s''appuie sur les tickets support et la rétention 90 jours, chacun avec son périmètre
    écrit. Aucun chiffre d''activation.


    **Dans les deux cas :** l''annexe contient les 4 812 / 42,6 % vs 98 / 0,9 %, le mécanisme, et la méthode
    corrigée. Et la data room est mise à jour en même temps que le deck — pas après.


    ## 6. Ce qu''on dit au comité


    En ouverture, pas en fin de deck, 45 secondes, sans dramatisation :


    > « Un point avant d''entrer dans les chiffres. En préparant l''annexe, nous avons identifié un défaut
    d''instrumentation dans le test d''activation : le nouvel onboarding ne s''applique qu''à la deuxième
    session, l''ancien dès la première. Résultat, le bras traité exclut les utilisateurs qui ne reviennent
    pas et comptabilise des activations antérieures à l''exposition. Le chiffre de 47 % que vous avez
    vu dans les échanges préliminaires n''est pas exploitable. Nous le retirons, nous le re-mesurons proprement,
    et vous aurez le résultat le [date]. Ce qui reste mesuré indépendamment du test : -22 % de tickets
    support et une rétention à 90 jours stable. Nous préférons vous le dire nous-mêmes maintenant plutôt
    que vous le laisser découvrir en due diligence. »


    Puis on répond aux questions. Ne pas promettre que le chiffre corrigé sera bon.


    ## 7. Les deux objections internes


    **VP Produit — « artefact connu, réserve dans les notes de l''orateur ».** Les notes de l''orateur
    ne sont ni dans le deck que lit le comité, ni dans la data room, ni dans le term sheet. Ce n''est
    pas une divulgation, c''est une trace destinée à prouver qu''on savait. Elle aggrave la position juridique
    au lieu de la protéger. Sur le fond : « artefact connu » est une hypothèse testable, et l''écart 42,6
    % / 0,9 % la réfute. Rien ici ne dit que neuf mois de travail sont perdus — le travail produit est
    intact, c''est sa mesure qui est cassée, et le -22 % de tickets appartient à cette équipe.


    **DAF — le term sheet référence la courbe d''activation.** Exact, et c''est précisément l''argument
    le plus fort *pour* corriger avant signature. Une métrique référencée contractuellement et connue
    comme fausse au moment de la signature ne se règle plus par une renégociation de valorisation : elle
    ouvre les représentations et garanties du SPA, un risque de rescision, et une exposition personnelle
    pour les signataires. Renégocier coûte de la dilution. Signer avec ce chiffre crée une créance.


    **Le meilleur contre-argument, et pourquoi il ne va pas jusqu''au bout.** Si l''affectation était
    décidée à t=0 et seulement enregistrée tardivement, la randomisation serait intacte et l''on s''infligerait
    une décote pour un faux problème. Mais l''énoncé décrit un *basculement* du compte vers v2 en 2ᵉ session
    : l''exposition, pas seulement le log, commence tard. La contamination du numérateur survit à l''interprétation
    bénigne. Le contre-argument déplace la question de « peut-on réanalyser ? » — pas de « peut-on présenter
    ? ».


    ---


    **Pire cas de l''option recommandée** : la valorisation est rouverte, le tour glisse au-delà de neuf
    jours, éventuellement un bridge. Douloureux, réversible, encaissé par la table de capitalisation.
    **Pire cas de l''option « réserve orale »** : découverte en diligence ou post-closing, effondrement
    de la crédibilité de l''ensemble du jeu de données, action en garantie ou en dol, exposition personnelle
    des signataires — encaissé par les fondateurs, le board, et toi. Irréversible. C''est ce qui tranche
    : le premier risque est de la variance, le second est une branche sans retour.


    **Ce qui renverserait ma recommandation** : (a) les comptes à session unique possèdent bien un enregistrement
    de bucket v2 — le biais de dénominateur tombe ; (b) l''« activation à 30 jours » repose sur un événement
    distinct de `first_action_at` — l''arithmétique des 42,6 points est à refaire. Ni l''un ni l''autre
    ne sauve la diapositive telle qu''elle est.


    **Repli** : si le diagnostic ne rend pas de résultat exploitable d''ici lundi 12 h, la case activation
    passe en « re-mesure en cours » sans négociation supplémentaire.


    **Première action, aujourd''hui** : envoyer ce mémo par écrit à CEO, DAF, VP Produit et au conseil
    juridique de la société — la décision de modifier un document remis à un comité d''investissement
    n''est pas la tienne, mais la traçabilité de l''alerte l''est. En parallèle, lancer la requête sur
    les comptes à session unique et sortir le diff du 2 mars.


    Je peux te le mettre en mémo formaté (fichier ou page partageable) si tu veux l''envoyer tel quel.

    '
