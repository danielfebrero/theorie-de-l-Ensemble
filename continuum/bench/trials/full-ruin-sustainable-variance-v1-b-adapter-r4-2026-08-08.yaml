response:
  text: '# NOTE AU CONSEIL — Verlaq


    **Objet :** Arbitrage Sedamex (A) / Nordwerk (B) — horizon 18 mois

    **De :** Direction générale — **Conseil du vendredi** — Décision demandée


    ---


    ## Recommandation


    **J''engage l''option B — installation de la ligne Nordwerk.** Je demande au conseil de l''approuver
    sous les quatre conditions préalables énoncées au § 4.


    ## 1. Le fondement du choix


    | | Option A — Sedamex | Option B — Nordwerk |

    |---|---|---|

    | Résultat garanti | +200 k€ | — |

    | Scénario favorable (60 %) | — | +900 k€ |

    | Scénario défavorable (40 %) | — | −400 k€ (plafond contractuel) |

    | **Espérance sur 18 mois** | **+200 k€** | **+380 k€** |


    B rapporte **180 k€ d''espérance supplémentaire**, soit 90 % de plus que A.


    Ce n''est pas le point décisif. Le point décisif est la **robustesse de l''estimation**. B cesse d''être
    supérieur à A seulement si la probabilité de succès tombe sous **46,2 %**. Le bureau d''études annonce
    60 % sur onze installations comparables : il peut se tromper de près de **quatorze points**, soit
    près d''un quart de son estimation, et la décision reste correcte. Je ne parie pas sur l''exactitude
    de 60 % ; je parie sur le fait que la vérité n''est pas sous 46 %. C''est une exigence bien plus faible.


    ## 2. Réponse au directeur financier : la maison n''est pas sur la table


    L''objection est légitime dans son intention et fausse dans ses faits. Le test de ruine, chiffré :


    - **Perte maximale : 400 k€**, plafonnée contractuellement. Elle représente **11,8 % des fonds propres**.

    - **Covenant bancaire (FP > 1,2 M€) :** dans le pire cas, fonds propres à **3,0 M€**, soit **2,5 fois
    le seuil**. Pour toucher le covenant, il faudrait **1,8 M€ de pertes supplémentaires** — 43 % du chiffre
    d''affaires — issues d''un choc totalement indépendant qui, lui, nous aurait tués dans l''option A
    aussi.

    - **Trésorerie :** 2,2 M€ après le pire cas, soit **13 mois de masse salariale** couverts, contre
    16 aujourd''hui.

    - **Contagion :** aucune. Ni caution personnelle, ni défaut croisé, ni sûreté sur l''actif industriel,
    carnet de commandes non gagé. La perte est **bornée et cloisonnée** : elle ne peut pas se propager
    au reste de l''entreprise.


    Un échec en option B nous ramène au niveau de fonds propres d''une entreprise qui va bien. **Ce n''est
    pas jouer la maison, c''est jouer une fraction de la trésorerie excédentaire.**


    Sur **Tremay** : une observation ne fait pas une base. La question n''est pas « Tremay a-t-il installé
    une ligne neuve ? », mais « Tremay avait-il un plafond de perte contractuel, ou un engagement ouvert
    financé par dette avec caution du dirigeant ? ». Une entreprise ne dépose pas le bilan à cause d''un
    investissement ; elle dépose le bilan à cause d''un investissement **non plafonné et financé par de
    la dette**. Notre structure est l''exacte opposée. Si le conseil souhaite que Tremay pèse dans la
    décision, alors il faut établir ce point précis — et je m''y engage avant vendredi. En l''état, invoquer
    Tremay ici, c''est confondre « ligne neuve » et « exposition illimitée ».


    ## 3. Ce que je concède — le meilleur argument contre ma propre recommandation


    Le vrai risque n''est pas celui que soulève le DAF, c''est **l''irréversibilité combinée à une hypothèse
    mal auditée**. Deux failles possibles :


    1. **Les onze références sont sélectionnées par celui qui recommande.** Un bureau d''études documente
    les installations qu''il connaît — donc, structurellement, plutôt celles qui ont abouti. Si le taux
    réel est de 45 %, la décision bascule.

    2. **Le plafond de 400 k€ ne couvre peut-être pas tout.** Il borne l''exposition *contractuelle*.
    Il ne borne ni la désorganisation de production, ni le temps des équipes, ni la remise en état, ni
    le manque à gagner commercial pendant 18 mois où l''on ne peut pas sortir.


    C''est de là que viendra le danger, s''il vient. Pas d''un tirage à 40 %.


    ## 4. Conditions préalables à ma signature


    Puisqu''il n''existe **aucune clause de sortie**, tout le contrôle doit s''exercer **avant** le trait
    de plume :


    1. **Audit contradictoire des onze références**, confié au DAF et non au bureau d''études : combien
    d''installations lancées au total, et pas seulement combien réussies. Si le taux corrigé passe sous
    50 %, je retire ma recommandation.

    2. **Confirmation écrite du périmètre du plafond de 400 k€** : pénalités, démontage, remise en état,
    immobilisation. Tout coût hors plafond est chiffré et ajouté au scénario défavorable avant décision.

    3. **Provision de 400 k€ constituée dès la signature**, pour que les quatre tests trimestriels de
    covenant soient passés à froid et non sous contrainte.

    4. **Règle d''arrêt, la seule qui compte ici :** aucun euro engagé au-delà des 400 k€ plafonnés sans
    retour devant le conseil. L''entreprise ne meurt pas de l''échec de la ligne ; elle mourrait de vouloir
    la sauver. Le point de contrôle observable est trimestriel : jalons techniques Nordwerk, fonds propres,
    trésorerie.


    ## Décision demandée


    Approuver l''option B sous les quatre conditions ci-dessus, avec mandat de signature une fois les
    conditions 1 et 2 vérifiées — et retrait automatique vers l''option A si la condition 1 n''est pas
    satisfaite.


    ---


    *Une remarque au conseil : refuser B dans cette configuration — perte bornée à 11,8 % des fonds propres,
    aucune contagion possible, marge d''erreur de 14 points sur l''hypothèse centrale — reviendrait à
    ne jamais rien engager. Une entreprise qui ne prend pas ce risque-là n''en prendra aucun.*

    '
