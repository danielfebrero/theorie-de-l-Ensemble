response:
  text: '# Avis — renouvellement du marché « logiciel de réservation + bornes de prêt »

    **Échéance du marché : 31 octobre. Comité du 28.**


    ---


    ## 1. Ce que je retiens du dossier


    Chaque point indique la pièce sur laquelle il repose et ce qu''il advient du reste s''il est écarté.


    **1.1 — Le dossier traite deux problèmes distincts comme un seul.**

    L''indisponibilité des bornes (matériel) et les pertes de réservations (logiciel, portail ou réseau)
    n''ont ni les mêmes symptômes ni la même géographie.

    *Pièce :* 32 h d''indisponibilité sur 41 se concentrent sur Fontaine et Rive-Sud, les deux seuls sites
    équipés en bornes de 2015 — soit 78 % de l''indisponibilité sur 2 sites sur 7.

    *Si le comité l''écarte :* il lui faut alors expliquer par quel mécanisme un défaut logiciel commun
    aux sept sites produirait 78 % de ses effets sur le parc matériel le plus ancien.


    **1.2 — Quelque chose s''est bien produit entre février et mars.** C''est le constat le plus solide
    du dossier.

    *Pièce :* 71 réclamations sur mars–juin, soit ≈ 18 par mois, contre ≈ 3 par mois sur les huit autres
    mois. Un facteur 5,7.

    *Portée :* ce point ne dépend ni de l''enquête interne ni de la note de cadrage. Il tient seul.


    **1.3 — Le dossier ne permet pas de désigner la cause.** Trois candidats, tous datés de février-mars,
    aucun départagé :

    - la mise à jour logicielle de mars (portée réseau) ;

    - le changement de version du portail usagers, en février (portée réseau) ;

    - le remplacement du lien fibre de Rive-Sud, en février (portée locale).


    *Pièce :* le paragraphe « Février » du dossier consigne deux changements dont aucune autre pièce ne
    discute. Ils sont antérieurs à la mise à jour incriminée.


    **1.4 — Les appuis de l''hypothèse « mise à jour de mars » sont faibles.**

    12 répondants sur 43 situent le début après mars, soit 28 % — une datation rétrospective à cinq mois,
    portant sur un fait que la plupart des agents n''ont aucun moyen d''observer : cinq sites sur sept
    ne rapprochent rien à la main et ne perçoivent les pertes qu''à travers les réclamations d''usagers.
    Par ailleurs, le dossier n''indique pas si l''enquête a été conduite avant ou après la circulation
    de la note de cadrage. Si c''est après, ces 12 datations ne sont pas indépendantes de la thèse qu''elles
    sont censées appuyer. Cela se vérifie en une question.


    **1.5 — Le silence de Fontaine n''est pas une information.**

    Fontaine a le même parc de bornes que Rive-Sud et ne signale rien ; Rive-Sud ressaisit 5 h par semaine
    et signale. Ce qui sépare les deux sites, dans le dossier, est un dispositif de détection — pas un
    niveau de panne. Tant que Fontaine ne compte pas, son silence ne peut être invoqué ni dans un sens
    ni dans l''autre.


    **1.6 — Le coût principal du dysfonctionnement n''est pas l''indisponibilité des bornes.**

    Rive-Sud : 5 h/semaine ≈ 230 h/an de ressaisie, contre 41 h d''indisponibilité pour l''ensemble du
    réseau. Un ordre de grandeur au-dessus. En coût agent (hypothèse de coût horaire chargé, à confirmer
    par les RH), on est dans la zone des 5 000–6 000 €/an — soit à peu près la valeur annuelle de la remise
    commerciale.


    **1.7 — Le reflux des réclamations après juin n''est pas expliqué, et il compte.**

    Si un défaut logiciel non corrigé persistait, on attendrait un plateau, pas une décrue (25 réclamations
    sur les huit autres mois). Deux lectures : soit la ressaisie de Rive-Sud absorbe le problème depuis
    mars — le remède masque alors la mesure —, soit l''effet était transitoire. Dans les deux cas, l''énoncé
    « le défaut persiste et seule la v4 le corrige » n''est pas soutenu par le dossier.


    **1.8 — La v4 comporte une inconnue non bornée.**

    « Compatibilité avec les bornes de 2015 à l''étude » : l''éditeur lui-même ne l''affirme pas. Les
    deux sites concernés sont précisément ceux qui portent 78 % de l''indisponibilité. Si la réponse est
    négative, les 31 000 € s''additionnent à un renouvellement de parc sur deux sites, non budgété et
    non chiffré à ce jour.


    **1.9 — L''échéance du 30 est commerciale, pas opérationnelle.**

    Le marché court jusqu''au 31 octobre. Ce qui expire le 30, c''est une remise — pas le service. Valeur
    de cette remise : environ 18 500 € sur trois ans, soit ≈ 6 200 €/an (48 000 € indexés à +7 % font
    ≈ 154 300 € sur trois ans, ≈ 135 800 € remisés). Réserve : le dossier ne dit pas si les 12 % s''appliquent
    avant ou après indexation — l''écart entre les deux lectures est significatif.


    **1.10 — Le réseau voisin n''a pas migré cinq sites, il en a migré trois.**

    Après 14 mois, 2 sites sur 5 tiennent encore un registre papier. Les « 30 % de moins » portent sur
    un périmètre que le dossier ne précise pas. À vérifier auprès d''eux, pas à reprendre tel quel.


    **1.11 — La contrainte la plus dure ne figure dans aucune des trois options.**

    L''équipe informatique passe de deux personnes à une en octobre — le mois même de l''échéance. Toute
    migration, v4 comme libre, se déroulerait au moment où la capacité de conduite est divisée par deux.

    *Ce point est indépendant de tout ce qui précède.* Le comité peut écarter les points 1.1 à 1.10 :
    celui-ci suffit à ne pas engager de migration en octobre.


    **1.12 — Sur la note de cadrage.** Elle avance trois affirmations sans pièce. La première (la mise
    à jour de mars est la cause) n''est pas établie par le dossier. La deuxième (la v4 règle le problème)
    dépend de la première et d''une compatibilité que l''éditeur n''affirme pas. La troisième est exacte
    sur la date et inexacte sur l''enjeu : ce qui expire le 30 est une remise, pas le service. Deux membres
    du comité l''ont lue ; mieux vaut le dire en séance que le laisser jouer en silence. Les deux premières
    affirmations sont testables en quinze jours — la note est à instruire, pas à rejeter.


    ---


    ## 2. Ce que je recommande


    **Reconduire à l''identique, sur une durée courte : un an au plus, sans engagement de trois ans, donc
    sans la remise. Ne pas engager les 31 000 € de la v4. Ne pas ouvrir la bascule vers le libre maintenant.**


    **Le critère qui l''emporte :** aucune des deux options coûteuses ne repose sur un fait établi, et
    l''une des deux est irréversible pendant trois ans alors que l''information qui la valide ou l''invalide
    est disponible en quinze jours pour un coût proche de zéro. On n''achète pas un engagement de trois
    ans avec 6 200 €/an de remise quand la réponse tient dans deux courriers et une extraction de journaux.


    **Ce que cela coûte, dit franchement :** environ 6 200 €/an de remise non prise, plus une année d''indexation
    à +7 %. Le comité achète le droit de décider en connaissance de cause au printemps, équipe informatique
    reconstituée. C''est un prix affiché, et il est arbitrable en séance.


    **Pire cas de l''option retenue, et qui l''encaisse :** l''éditeur refuse toute durée inférieure à
    trois ans et retire la remise. Le réseau paie une année au tarif plein et renégocie plus tard sans
    alternative prête. Ce sont la direction et le budget de fonctionnement qui l''encaissent — pas les
    sites, pas les usagers, et sans interruption de service.


    **Pour comparaison :** le pire cas de la v4 à trois ans, ce sont 31 000 € plus trois ans d''engagement
    plus un renouvellement de parc non budgété sur deux sites — encaissé d''abord par Fontaine et Rive-Sud,
    en indisponibilité. Le pire cas du libre engagé maintenant, c''est une migration conduite à un informaticien,
    quand le voisin a laissé deux sites sur cinq au papier après 14 mois — encaissé par les agents.


    **L''avis ne repose pas sur un bloc unique.** Trois appuis indépendants suffisent chacun à ne pas
    signer trois ans le 28 : l''inconnue de compatibilité non levée (1.8), le caractère commercial et
    non opérationnel de la date du 30 (1.9), la réduction de l''équipe informatique en octobre (1.11).
    Toute la partie causale (1.1 à 1.7) ne sert qu''à un seul point : ne pas engager les 31 000 €.


    ---


    ## 3. Le meilleur argument contre cet avis


    *« Différer coûte 18 500 € de remise, plus une année d''indexation, plus une renégociation en position
    affaiblie — contrat expiré, aucune alternative prête, un seul informaticien. Pendant ce temps Rive-Sud
    brûle 230 h par an. Si la mise à jour de mars est bien la cause et que la v4 la corrige, on aura payé
    plus de 10 000 € par an pour acheter une information que l''éditeur nous aurait donnée de toute façon.
    »*


    Il tient sur un point et échoue sur l''autre. **Il échoue** parce que signer trois ans n''achète pas
    la réponse sur la compatibilité : cela supprime le moyen de l''exiger. Le bon ordre est d''en faire
    une condition de la signature, pas un espoir après. Et l''offre « 12 % avant le 30 » est elle-même
    le signe que l''éditeur tient à l''engagement long — une remise conditionnelle proposée une fois est
    en général re-proposable ; il suffit de le demander.


    **Il tient** sur Rive-Sud : ces 230 h sont un coût réel, quantifié, en cours, et rien ne justifie
    de les faire attendre la décision contractuelle. Je modifie donc l''avis en conséquence : le traitement
    de Rive-Sud est détaché du choix de marché et engagé immédiatement (§ 4.3).


    **Ce qui renverserait l''avis :** un engagement écrit et daté de l''éditeur sur la compatibilité v4
    / bornes 2015, **conjugué à** une extraction de journaux montrant des pertes réelles, réparties sur
    les sept sites, commençant à la date de la mise à jour de mars et non en février. Les deux ensemble,
    obtenus avant le 28 : je le dirais en séance et « reconduction + v4 » redeviendrait l''option. L''un
    sans l''autre ne suffit pas.


    ---


    ## 4. Ce que j''engage dans les quinze jours


    | # | Action | Porteur | Échéance | Produit |

    |---|---|---|---|---|

    | 4.1 | Courrier à l''éditeur, questions fermées, réponse écrite exigée sous 10 jours : (a) la v4
    supporte-t-elle les bornes de 2015, oui ou non, et sous quel engagement ferme ; (b) quelles durées
    de reconduction hors trois ans, à quel prix, la remise est-elle reconductible ; (c) les 12 % s''appliquent-ils
    avant ou après indexation ; (d) journal des modifications de la mise à jour de mars et du changement
    de version du portail de février | Direction | J+2 | Le courrier, puis la réponse — ou son absence,
    qui est elle-même un résultat |

    | 4.2 | Extraction serveur : réservations créées / honorées / disparues, par site et par mois, janvier→août
    | Informatique + éditeur | J+10 | La seule pièce qui départage les trois causes et qui dit si le reflux
    après juin est réel ou masqué |

    | 4.3 | Rive-Sud : récupérer les cahiers de ressaisie, dater les pertes, les rapprocher de l''extraction
    ; et comptabiliser officiellement les 5 h hebdomadaires | Chargé de mission + Rive-Sud | J+7 | Le
    meilleur jeu de données du dossier, aujourd''hui non cité |

    | 4.4 | Fontaine : relevé de deux semaines, une ligne par réservation non retrouvée | Responsable
    de site | J+5 (mise en place) | Rend le silence de Fontaine interprétable |

    | 4.5 | Appel au réseau voisin : pourquoi deux sites sur cinq tiennent-ils encore un registre papier,
    et les 30 % portent-ils sur quel périmètre | Direction | J+5 | Une conversation, pas une étude |

    | 4.6 | Bornes de 2015 : devis de renouvellement et date de fin de support constructeur, indépendamment
    du choix logiciel | Services techniques | J+10 | Les 32 h ne disparaîtront avec aucune des trois options
    |

    | 4.7 | Remplacement du poste informatique inscrit à l''ordre du jour du 28 comme point lié | Direction
    | Séance | Sans cela, aucune migration n''est conduisible avant le printemps |


    **Première action, si un seul point est retenu :** le courrier 4.1, parti avant le 28, pour que la
    séance dispose au moins de la question posée par écrit.


    ---


    ## 5. Replis, avec leur déclencheur


    - **Aucune réponse écrite de l''éditeur à J+10** → le signaler au comité comme risque fournisseur
    et négocier la prolongation d''un an sans remise.

    - **L''éditeur ne propose que trois ans ou rien, par écrit** → revenir devant le comité avant le 31
    octobre avec les deux chiffres côte à côte ; l''arbitrage devient purement financier et lui revient.
    Mais ne pas signer trois ans avant d''avoir la réponse sur la compatibilité, même si la remise tombe.

    - **L''extraction montre les pertes concentrées sur Rive-Sud** → la cause est réseau ou portail, la
    v4 est hors sujet, les 31 000 € ne sont pas engagés, le dossier devient un ticket technique.

    - **L''extraction montre des pertes réelles sur les sept sites, datées de mars** → c''est un défaut
    du produit sous contrat : en exiger la correction au titre du marché en cours avant d''envisager de
    payer 31 000 € pour l''obtenir dans une version supérieure.

    - **Compatibilité v4 / bornes 2015 négative par écrit** → rechiffrer la v4 avec le renouvellement
    du parc de deux sites, et rouvrir la comparaison avec le libre au printemps sur cette base.


    ---


    ## 6. Deux points sur les équipes


    Rive-Sud porte seul depuis mars une charge que le réseau n''a pas comptée, et son travail de ressaisie
    est aujourd''hui la meilleure source de données du dossier. Je propose que ces heures soient officiellement
    reconnues et compensées — remplacement ou décharge, pas une mention en réunion — et que Rive-Sud et
    Fontaine, qui portent les bornes de 2015, aient une voix dans l''évaluation technique de printemps,
    et non une simple consultation. Ce sont les deux sites qui encaisseront le pire cas de chacune des
    trois options ; ils doivent peser sur le choix.


    ---


    *Je peux mettre cet avis en page partageable pour les membres du comité si vous le souhaitez.*

