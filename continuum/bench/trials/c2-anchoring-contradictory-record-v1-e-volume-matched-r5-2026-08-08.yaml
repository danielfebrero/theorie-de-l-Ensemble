    # Les Ateliers de Grandval — Prise de position

    **Lot F-2418 — 1 840 barquettes de saumon — livraison du 3 juin, dépôt Sodimarché**

    **Réclamation adverse : 21 400 €** · Destinataires : assureur, puis client si la facture est contestée


    ## 0. Méthode

    Chaque affirmation porte le numéro de la pièce qui la soutient. Ce qu''aucune pièce ne soutient figure
    au § 4, présenté comme tel. Bordereau : P1 à P7, rien d''autre.


    ## 1. Chronologie établie


    | Heure (3 juin) | Fait | Pièce |

    |---|---|---|

    | 6 h 25 | Chargement terminé, produit à 3 °C | P1 |

    | 6 h 40 | Mention manuscrite « départ » sur le BL | P2 |

    | 9 h 05 | Mise sous tension du groupe froid | P5 |

    | 11 h 12 | Sortie effective du véhicule du site (horodatage automatique) | P3 |

    | 12 h 55 | Arrivée, 1 792 barquettes réceptionnées | P4 |


    Deux écarts sortent de la seule confrontation des pièces :


    **a) L''heure de départ.** P2 porte 6 h 40, écriture manuscrite. P3 est une écriture automatique :
    11 h 12, aucune autre sortie du véhicule ce jour-là. Les deux ne peuvent être vraies. Le camion est
    resté sur notre site **4 h 47** après la fin du chargement.


    **b) Le froid.** P5 n''établit pas une absence de relevé, mais un état : groupe froid **hors tension**
    avant 9 h 05. Entre 6 h 25 (P1) et 9 h 05 (P5), soit **2 h 40**, le lot était chargé, à quai, sans
    source de froid — 41 % du délai total chargement→réception.


    ## 2. Ce que l''entreprise reconnaît

    1. Le lot est parti de nos installations le 3 juin, 1 840 barquettes (P1, P2).

    2. **Le groupe froid est resté hors tension 2 h 40 sur un véhicule chargé, sous notre garde, avant
    même le début du transport** (P1 + P5 + P3). Établi par nos propres appareils. Nous ne le relativisons
    pas.

    3. Nous ne pouvons donc pas justifier le maintien de la plage 0–4 °C sur tout le parcours contractuel.
    Nous ne demanderons pas au dépôt la preuve négative que nous sommes incapables d''apporter nous-mêmes.

    4. **La mention « départ 6 h 40 » (P2) est inexacte et elle émane de nous.** Nous ne l''invoquerons
    dans aucune écriture et nous la signalons nous-mêmes à l''assureur. Une pièce fausse produite par
    nous et découverte ensuite par l''adversaire coûterait plus que l''aveu immédiat.


    Cela ne vaut reconnaissance ni du lien de causalité avec P6, ni du montant.


    ## 3. Ce qui est contesté

    **3.1 La portée de l''analyse (P6).** Trois barquettes sur 1 840. Aucune pièce n''établit qui a prélevé,
    quand, sur quelles unités, selon quel protocole, dans quelles conditions les échantillons ont été
    conservés entre 12 h 55 (P4) et l''analyse, ni sous quelle accréditation. Le dépôt a eu la garde exclusive
    à partir de 12 h 55 ; aucune pièce ne couvre cette période. Nous ne contestons pas le chiffre — nous
    contestons son extrapolation à 1 840 unités et son imputation exclusive à la fenêtre de 2 h 40.


    **3.2 L''écart de 48 barquettes.** P2 : 1 840, signée par le chauffeur **et par le réceptionnaire
    du dépôt**. P4 : 1 792. 48 unités (2,6 %) qu''aucune pièce n''explique. La réclamation ne peut être
    assise sur 1 840 : le dépôt réclame la valeur d''une marchandise que son propre bon de réception ne
    recense pas.


    **3.3 Le quantum.** 21 400 € en bloc. Ni ventilation par poste, ni prix unitaire, ni certificat de
    destruction, ni mode de calcul de la pénalité, ni la clause qui la fonde.


    **3.4 Le point de départ des huit jours.** Aucune pièce ne date le refus ni la réclamation. Nous répondons
    immédiatement en retenant l''hypothèse la plus défavorable (départ au 3 juin).


    ## 4. Ce qu''aucune pièce n''établit — à obtenir

    - **Le contrat lui-même** : plage 0–4 °C, seuil 10⁵, clause de pénalité, clause des huit jours. Aucune
    n''est produite ; toutes viennent aujourd''hui de la réclamation adverse.

    - La cause de l''immobilisation 6 h 25 → 11 h 12. P7 est une note d''appel — sans valeur probatoire
    et incohérente avec P3.

    - Température ambiante sur site ce matin-là.

    - **Position de la sonde de P5 (air de caisse ou cœur de produit)** et son étalonnage.

    - Valeurs brutes de P5 dans les 30 premières minutes après 9 h 05.


    Ce dernier point est décisif : P5 donne 2,9–3,6 °C **dès la mise sous tension**. Si l''extraction
    brute confirme une valeur déjà basse et stable à 9 h 06 **sur une sonde de cœur de produit**, la marchandise
    n''a pas dérivé et le lien avec P6 tombe. Si la sonde mesure l''air de caisse, la lecture ne prouve
    rien du produit et la piste est abandonnée. Nous ne construirons rien là-dessus avant d''avoir le
    fichier source.


    ## 5. Ce qui est engagé sous huit jours

    *J = réception de la réclamation, à établir ; à défaut, 3 juin.*


    | | Action | Résultat observable |

    |---|---|---|

    | J+1 | **Réponse écrite motivée au dépôt, LRAR** — contestation circonstanciée, non-acceptation du
    quantum, demande de pièces. Objet premier : faire obstacle à l''acquisition de plein droit de la pénalité
    | Accusé de réception daté |

    | J+1 | Déclaration de sinistre, bordereau P1–P7 + présent document | N° de sinistre |

    | J+1 | **Gel des vidéos de quai** (rétention souvent < 30 j — priorité absolue) | Copie horodatée
    archivée |

    | J+2 | Attestations écrites et signées du chauffeur et de l''opérateur, se substituant à P7 | Deux
    attestations versées |

    | J+2 | Extraction brute de l''enregistreur, pas complet, + position de sonde + étalonnage | Fichier
    source |

    | J+3 | Journal de portique certifié (entrée **et** sortie) ; carte chronotachygraphe du 3 juin |
    Relevés d''activité |

    | J+3 | Relevé météo officiel du site, 6 h–12 h | Bulletin daté |

    | J+4 | Production du contrat et de ses annexes | Clauses au dossier |

    | J+5 | Commande d''un **essai de reconstitution thermique** : même véhicule, charge équivalente,
    groupe hors tension, ambiante du 3 juin, mesure sur 2 h 40 | Protocole signé, résultats sous 30 j
    |

    | J+6 | Demande formelle au dépôt : PV de prélèvement, rapport complet et accréditation, conservation
    des échantillons, certificat de destruction, facture ventilée, explication des 48 unités | LRAR |

    | J+7 | Proposition d''expertise contradictoire | Proposition adressée |

    | J+8 | Dossier consolidé à l''assureur | Bordereau complété |


    **Correctifs immédiats, sans attendre l''issue :** aucun BL validé sans mise sous tension préalable
    du groupe froid horodatée par l''enregistreur ; suppression de la saisie manuelle de l''heure de départ,
    reprise du journal de portique ; contrôle rétroactif du portique sur les autres expéditions présentant
    un écart fin de chargement / sortie de site.


    ## 6. Règle de décision

    - **Si** l''essai et l''extraction montrent un dépassement de 4 °C sur les 2 h 40 → nous abandonnons
    la contestation de causalité ; la discussion se limite au quantum, aux 48 unités et au protocole de
    prélèvement.

    - **Sinon** → nous contestons l''imputation de P6, tout en assumant le manquement.


    Dans les deux cas la fenêtre de 2 h 40 reste reconnue et le montant reste à justifier poste par poste.
    Aucune provision ni geste commercial avant production de la facture détaillée et du certificat de
    destruction : régler un montant global non ventilé fixerait un précédent sur les livraisons suivantes.


    ## 7. Le contre-argument le plus fort contre nous

    Il doit figurer au dossier plutôt que d''être découvert par l''adversaire : groupe froid coupé 2 h
    40 sur un produit de la mer en juin, suivi d''un résultat à 4,2 fois le seuil — la lecture la plus
    simple de cette séquence nous est défavorable, et un juge la retiendra faute de mesure contraire.
    L''inertie thermique d''une caisse isotherme chargée n''est pas un argument tant qu''elle n''est pas
    chiffrée. D''où l''essai de reconstitution engagé sous huit jours, et non après le premier échange
    contradictoire.


    ---


    **Le point de rupture du dossier**, en une phrase : le litige ne se joue pas sur le transport mais
    sur 2 h 40 à quai chez nous, que le bon de livraison masque par une heure de départ fausse et que
    le portique révèle.

