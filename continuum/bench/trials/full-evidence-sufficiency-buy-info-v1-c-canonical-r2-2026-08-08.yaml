response:
  text: '## Note — Comité de direction, lundi


    **Objet : contrat cellules 2027 (80 000 unités) — arbitrage Kelmar / Sinolux**

    **Décision : nous ne signons pas Sinolux cette semaine. Nous lançons le test Vertex mardi et nous
    tranchons au plus tard à J+35, sans décaler la production.**


    ### 1. Le chiffre qui décide : 2,63 %


    L''économie d''achat est de 240 000 €. Le coût SAV est de 210 € par retour, soit **168 000 € par point
    de taux de retour** sur 80 000 unités (16 800 € par dixième de point).


    | Taux de retour Sinolux | Surcoût SAV vs Kelmar | Gain net annuel |

    |---|---|---|

    | 1,0 % (essais Sinolux) | −33 600 € | **+273 600 €** |

    | 1,5 % (bas de fourchette interne) | +50 400 € | **+189 600 €** |

    | **2,63 % (point mort)** | +240 000 € | **0 €** |

    | 2,9 % (audit sectoriel) | +285 600 € | **−45 600 €** |

    | 3,0 % (haut de fourchette interne) | +302 400 € | **−62 400 €** |


    Kelmar coûte 201 600 € de SAV par an, stable depuis trois ans. **Le point mort à 2,63 % tombe à l''intérieur
    de la fourchette de nos propres ingénieurs (1,5–3 %).** Nous ne savons donc pas, aujourd''hui, de
    quel côté du zéro nous sommes.


    ### 2. Ce que valent les trois sources


    Elles ne se contredisent pas également : les essais à 1,0 % sont produits par la partie qui vend et
    n''engagent personne ; l''audit à 2,9 % est indépendant, publié, mesuré sur une ligne comparable du
    même fournisseur — c''est la source la plus lourde, même si la ligne n''est pas la nôtre ; la fourchette
    1,5–3 % de nos ingénieurs recouvre l''audit et exclut le chiffre du fournisseur. **Le refus de toute
    clause de garantie est lui-même une information** : Sinolux ne veut pas porter le risque du chiffre
    qu''il avance.


    ### 3. Ce que nous achetons pour 9 500 €


    Le test Vertex coûte **4 % de l''économie en jeu** et **15 % de la perte du pire cas documenté**.
    Il déplace une décision à pile ou face sur 300 000 € d''écart (de +273 600 à −62 400) vers une décision
    informée. Aucune autre dépense de la semaine n''a ce rendement.


    **Règle de décision, fixée à l''avance** (précision historique de Vertex : ±0,3 point) :

    - résultat **≤ 2,3 %** → Sinolux (2,3 + 0,3 = 2,6, sous le point mort) ;

    - résultat **> 2,3 %** → Kelmar. Entre 2,3 et 2,6 le gain espéré est nul et nous n''avons aucune garantie
    contractuelle pour absorber l''erreur : le doute va à Kelmar.


    ### 4. Le calendrier n''est pas la contrainte


    11 jours ouvrés ≈ 15 jours calendaires. Test lancé à J+1 → résultat vers **J+16**, soit **29 jours
    de marge** avant l''expiration du prix Sinolux (J+45), 34 avant la commande ferme Kelmar (J+50), 44
    avant le démarrage production (J+60). Vertex ne s''engage pas sur son délai : il faudrait qu''il double
    son temps habituel pour nous gêner. **Attendre le test ne retarde le lancement d''aucun jour.**


    ### 5. Repli et déclencheur


    **Si aucun résultat Vertex à J+35** → commande ferme Kelmar immédiate (15 jours avant sa date limite),
    test payé et perdu. Coût du repli : 9 500 €.


    ### 6. Ce qui renverserait cette note


    Un résultat Vertex ≤ 2,3 %, ou l''acceptation par Sinolux d''un mécanisme financier remplaçant la
    garantie qu''il refuse : **séquestre de 3 €/cellule sur 12 mois, libéré au taux de retour constaté**
    (grille : restitution intégrale sous 1,5 %, retenue proportionnelle au-delà). Ce mécanisme ne lui
    coûte rien s''il a raison. **S''il refuse aussi cela, il nous dit qu''il ne croit pas à ses 1,0 %
    — et le test devient une confirmation, pas une question.**


    ### 7. Deux points à écarter du débat


    Les 240 000 € sont **inscrits au budget, pas encaissés** : une ligne budgétaire n''est pas une preuve
    de taux de retour, et un point de retour en plus efface l''économie aux deux tiers. Par ailleurs,
    les 210 € couvrent l''échange, le transport et le geste commercial — **ils ne couvrent ni le préjudice
    de marque ni l''escalade garantie** si le mode de défaillance se révèle systémique sur un chargeur
    rapide. À 2,9 %, nous ne perdons pas seulement 45 600 €.


    ### 8. Actions cette semaine


    1. Bon de commande Vertex signé **mardi** (9 500 €), 1 200 cellules du lot de production réel, pas
    d''échantillon fourni par Sinolux.

    2. Lettre à Sinolux : prolongation du prix à J+50 + proposition de séquestre — réponse demandée sous
    10 jours.

    3. Kelmar prévenu que la commande peut arriver jusqu''à J+50, conditions maintenues.

    4. Point de décision calé au **J+35**, ordre du jour fermé : résultat Vertex, réponse Sinolux, signature.


    ---


    Deux réserves que j''assume et que le comité doit connaître : 1 200 cellules en vieillissement accéléré,
    c''est un échantillon mince pour mesurer un phénomène à 1–3 % (une vingtaine d''événements attendus),
    et le ±0,3 point de Vertex est un historique, pas un engagement. Le test réduit l''incertitude, il
    ne la supprime pas — c''est pourquoi le séquestre reste demandé même si le résultat est bon.

    '
