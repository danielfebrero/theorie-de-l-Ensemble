response:
  text: '# Note au conseil d''administration — séance de jeudi


    **Objet : allocation de la réserve et avenir de la caisse**

    **Position : A retenue à titre transitoire et sous condition, B différée, C refusée.**


    ---


    ## 1. Le verdict, d''abord


    Je ne présenterai pas C au vote comme une option d''allocation. Je demande au conseil de la rejeter
    par une délibération expresse et motivée, et je n''apposerai pas ma signature sur son exécution si
    elle était néanmoins votée.


    Ce refus ne repose pas sur une aversion au risque ni sur un désaccord avec l''espérance calculée par
    le trésorier. Il repose sur deux constats arithmétiques tirés de sa propre note, et sur un troisième
    qui n''y figure pas.


    Mais je partage son diagnostic : **A seule est une mort différée.** Une note qui se contenterait de
    refuser C perdrait le vote et mériterait de le perdre. La suite est donc une alternative, pas une
    objection.


    ---


    ## 2. Ce qui ne va pas dans C


    ### 2.1 C fait défaut sur les prestations avant même de pouvoir réussir


    C immobilise 14,4 M€ pendant sept ans sans sortie. Il reste 4,0 M€ liquides. Or la caisse consomme
    structurellement de la trésorerie : 5,4 M€ versés contre 4,4 M€ encaissés, soit −1,0 M€ la première
    année, et l''écart s''élargit de 4,3 %/an côté prestations.


    | Fin d''année | Déficit annuel | Poche liquide restante (placée à +1,8 %) |

    |---|---|---|

    | 1 | 1,00 M€ | 3,07 M€ |

    | 2 | 1,23 M€ | 1,90 M€ |

    | 3 | 1,47 M€ | 0,46 M€ |

    | 4 | 1,73 M€ | **épuisée en cours d''année** |


    La caisse cesse de pouvoir payer ses affiliés vers le quarantième mois. La note se débloque au quatre-vingt-quatrième.
    **Il manque trois ans de moyens de paiement dans la branche à 88 %, celle où tout se passe bien.**
    Les 10 000 simulations du trésorier mesurent une richesse terminale ; elles ne mesurent pas la capacité
    à payer 5,4 M€ chaque année d''ici là. C n''échoue pas dans 3 % des trajectoires : il échoue dans
    la quasi-totalité, et dans 3 % il échoue en emportant tout.


    *Réserve d''interprétation, à lever avant tout débat :* le « +14 %/an » est-il distribué en numéraire
    chaque année, ou capitalisé à l''échéance ? Le dossier ne le dit pas. S''il est capitalisé — hypothèse
    normale pour une note bloquée sans sortie — le calcul ci-dessus est définitif. S''il est distribué,
    il apporte 2,0 M€/an, mais ce flux s''interrompt précisément dans le scénario où la caisse en a besoin.
    Dans les deux branches, la conclusion tient.


    ### 2.2 Le coupon contredit la probabilité annoncée


    Un émetteur A− se refinance aujourd''hui à quelques points au-dessus du sans-risque. Celui-ci promet
    14 % avec une récupération de 5 % du nominal en cas de défaut. Un taux de récupération de 5 % n''est
    pas celui d''une dette senior — c''est celui d''un instrument profondément subordonné ou à payoff
    structuré. L''écart de rendement, rapporté à cette récupération, implique un risque annuel de l''ordre
    de 10 %, soit un défaut cumulé à sept ans très au-delà de 3 %, même en concédant plusieurs points
    de prime d''illiquidité.


    Je présente ce chiffre comme une inférence, pas comme un spread coté — la note n''est pas cotée, c''est
    précisément le problème. Mais il pose une question à laquelle le conseil doit obtenir une réponse
    écrite avant de délibérer : **la distribution 88/9/3 décrit le défaut de l''émetteur ; elle ne décrit
    pas le risque du produit.** Elle est par ailleurs communiquée par le vendeur, et n''a été auditée
    par personne.


    Enfin, « deux caisses comparables ont souscrit l''an dernier » n''est pas un résultat. À un an sur
    sept, avec blocage, aucune de ces deux caisses ne sait ce qu''elle a acheté. Si c''est le même émetteur,
    ce n''est pas une validation, c''est une concentration du sinistre.


    ### 2.3 Le pire cas n''est pas une perte, c''est la disparition d''une couverture irremplaçable


    Dans la branche à 3 %, la réserve tombe à 4,7 M€, sous le seuil statutaire de 11 M€ : liquidation
    de plein droit. Ce que perdent alors 4 200 affiliés de 61 ans d''âge moyen fortement exposés à l''amiante,
    ce n''est pas un capital — c''est leur seule couverture, dans un marché où **aucun assureur n''a accepté
    de coter ce portefeuille en 2025.** Il n''existe pas de solution de repli achetable.


    Une perte reconstituable est de la variance, et la variance ne justifie pas un veto. Une perte que
    personne ne peut réparer, sur des tiers qui n''ont pas voté, en est un. C''est la seule ligne que
    je tiens sans négociation.


    ---


    ## 3. Le fait que le dossier ne dit pas : le compte à rebours est de dix-huit mois, pas de neuf ans


    L''Union mutualiste de l''Atlantique n''a jamais repris un portefeuille couvrant moins de trois années
    de prestations. Aujourd''hui : 18,4 / 5,4 = **3,41 années. Nous sommes éligibles.**


    En reprenant les paramètres du dossier (réserve à +1,8 %, prestations +4,3 %, cotisations stables)
    :


    | Fin d''année | Réserve | Prestations | Couverture |

    |---|---|---|---|

    | 0 | 18,40 M€ | 5,40 M€ | **3,41 ans** |

    | 1 | 17,73 M€ | 5,63 M€ | 3,15 ans |

    | 2 | 16,82 M€ | 5,87 M€ | **2,86 ans — sous le critère** |

    | 3 | 15,65 M€ | 6,13 M€ | 2,55 ans |


    Le comité d''engagement instruit en douze à dix-huit mois. **La fenêtre d''éligibilité se referme
    pendant l''instruction si le dossier n''est pas déposé dans les prochaines semaines.** C''est le seul
    actif réellement périssable de la caisse, et il ne figure dans aucune des trois options soumises au
    vote.


    Le même calcul donne un franchissement du seuil de liquidation à **environ six ans**, non neuf. L''écart
    s''explique si la projection interne a figé le déficit à 1,0 M€/an au lieu d''y appliquer la dérive
    de 4,3 % qu''elle affiche par ailleurs. Je demande que l''actuaire confirme ou infirme ce point par
    écrit sous vingt et un jours. Si j''ai raison, le conseil délibère depuis deux ans sur un horizon
    faux de trois ans, ce qui explique en partie le rejet de la hausse de 6 % en 2024.


    ---


    ## 4. Ce que je fais des trois options


    **C — refusée**, définitivement, quelle que soit la révision de ses paramètres. Je demande en outre
    au conseil d''inscrire dans la charte de placement un plafond de 5 % de la réserve par émetteur et
    l''obligation de conserver en permanence vingt-quatre mois de décaissements nets en actifs liquides.
    Cela ferme le sujet sans avoir à le rejuger.


    **B — différée, pas rejetée.** Son décile défavorable ramène la réserve à 15,8 M€, soit 2,93 années
    de prestations : au-dessus du seuil de liquidation, mais **sous le critère de reprise**. B dans son
    dimensionnement actuel ne ruine pas la caisse, elle détruit sa seule sortie. J''ajoute que « pire
    décile historique » n''est pas un pire cas : 2008 a fait davantage sur ce type de tranche.


    B redevient la bonne réponse dans une seule branche : celle où le transfert échoue. La caisse devra
    alors jouer une partie longue de son propre chef, et le critère des trois années ne protégera plus
    rien. **Le bon dimensionnement de B est donc conditionnel à une décision qui n''est pas encore tombée.**
    Si le conseil veut agir dès jeudi, le plafond compatible avec la fenêtre est de l''ordre de 2 M€ (≈
    11 %), en instruments diversifiés à valorisation quotidienne — sans illusion : cela ne referme pas
    l''écart, et le trésorier a raison de le dire.


    **A — retenue comme contenant, pas comme stratégie.** Duration raccourcie, disponibilité intégrale,
    le temps de l''instruction. Aucun mérite propre : c''est la forme d''attente qui ne détruit pas l''option.


    **Et surtout : l''option qui manquait au dossier.** Aucun rendement d''actif ne referme un écart de
    cette forme. Combler 1,0 M€ sur 18,4 M€ exige 5,4 % nets dès aujourd''hui, plus de 13 % dans cinq
    ans sur une base qui rétrécit : la performance requise diverge. Le problème n''est pas un problème
    de placement, c''est un problème de passif. Les seules issues réelles sont le transfert, la cotisation,
    ou la structure des prestations.


    ---


    ## 5. Ce sur quoi j''engage la caisse


    1. **Dépôt du dossier de reprise auprès de l''Union mutualiste de l''Atlantique sous 60 jours.** C''est
    la résolution principale de jeudi. Tout le reste s''y subordonne, y compris l''allocation.

    2. **Gel de l''allocation** jusqu''à l''avis du comité d''engagement, hors raccourcissement de duration.

    3. **Convocation d''une assemblée générale extraordinaire** avant la fin du trimestre, avec la projection
    corrigée et la date de franchissement du seuil. L''AG a rejeté 6 % en 2024 sans disposer de cette
    date. Je m''engage à ce que l''AG arbitre elle-même entre relèvement de cotisation et ajustement des
    garanties, et à ce que le conseil applique son choix sans le rediscuter.

    4. **Audit de récupérabilité des sinistres amiante sous 90 jours** : part des prestations relevant
    de la reconnaissance en maladie professionnelle ou d''une prise en charge par le fonds d''indemnisation,
    et donc opposable ailleurs qu''à la caisse. Je pose cela comme hypothèse, non comme économie acquise
    : le dossier chiffre les rendements au dixième de point et ne dit rien de la composition des 5,4 M€.
    C''est la grandeur manquante du dossier.

    5. **Mandat au trésorier** : présidence du comité actif-passif et qualité de rapporteur du dossier
    de transfert, avec accès direct au comité d''engagement et signature du rapport soumis au conseil.
    Son diagnostic est juste et sa capacité d''analyse est le meilleur atout de la caisse ; c''est son
    remède que je refuse, pas son constat, et je ne veux pas d''une victoire de séance qui nous en priverait.

    6. **Délégation d''affiliés** associée à l''instruction du transfert, avec voix consultative écrite
    au dossier remis au comité.


    ---


    ## 6. Le meilleur argument contre ma recommandation


    Le voici, honnêtement formulé : *si l''Union refuse, j''aurai consommé dix-huit mois et la fenêtre
    de rendement avec, et la caisse se retrouvera en 2027 avec 2,8 années de couverture, sans transfert
    et sans avoir rien tenté. C aurait au moins offert 88 % de chances de reconstituer une réserve.*


    Il ne fait pas basculer la décision, pour une raison de forme : l''échec du transfert laisse la caisse
    vivante et libre de tenter B en 2027 sur une réserve de 16,8 M€, tandis que l''échec de C la supprime
    sans recours. On peut revenir d''un refus de l''Union. On ne revient pas d''une liquidation d''un
    portefeuille que personne ne veut coter. Entre deux stratégies dont l''une seule autorise une seconde
    tentative, l''ordre de passage n''est pas discutable.


    Il modifie en revanche le calendrier : le dossier doit partir en semaines, pas en trimestres, et un
    second repreneur doit être approché en parallèle dès jeudi.


    ---


    ## 7. Repli et déclencheurs observables


    | Déclencheur | Action |

    |---|---|

    | Avis négatif informel de l''Union sous 90 jours | Ouverture immédiate avec un second consolidateur
    ; B relevée à 30–35 % ; AG avancée |

    | Couverture < 2,8 années avant décision du comité | Le transfert est mort : bascule en extinction
    organisée et négociée, jamais en liquidation subie |

    | Liquidités < 24 mois de décaissements nets | Suspension de tout placement non quotidien, conseil
    convoqué sous 15 jours |

    | Actuaire confirmant le franchissement du seuil à 6 ans | Reprise intégrale du plan devant le conseil
    sous 30 jours |


    **Ce qui renverserait ma position sur C :** un prospectus indépendant établissant le rang senior de
    la note, une notation A− portant sur l''instrument lui-même et non sur l''émetteur, une garantie de
    rachat contractuelle, et un coupon distribué en numéraire couvrant le déficit — c''est-à-dire un autre
    produit. **Ce qui renverserait ma position sur le transfert :** un critère écrit de l''Union montrant
    que le seuil de trois années s''apprécie au dépôt et non à la décision, ce qui desserrerait le calendrier
    sans changer la direction.


    ---


    ## 8. Une remarque de procédure


    Le président et quatre administrateurs sur neuf ont cosigné la note du trésorier. Le vote de jeudi
    peut donc porter C. Je demande que cette note soit annexée au procès-verbal, que le commissaire aux
    comptes et l''actuaire soient invités à se prononcer par écrit sous 72 heures sur la conformité d''une
    exposition de 78 % de la réserve à un émetteur unique non coté au regard des règles de dispersion
    et de liquidité applicables à la caisse, et que le sens du vote de chaque administrateur soit nominativement
    consigné.


    Je l''écris sans intention polémique : sur une décision de cette nature, la traçabilité protège les
    administrateurs autant que les affiliés. Elle protège en particulier ceux qui voteront C de bonne
    foi sur la base d''une espérance mathématique correctement calculée pour la mauvaise question.


    **Première action, jeudi, résolution n° 1 : mandat de dépôt du dossier de reprise sous 60 jours.**
    Le reste de l''ordre du jour en découle.

    '
