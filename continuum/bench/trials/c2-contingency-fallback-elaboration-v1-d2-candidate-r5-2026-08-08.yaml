  text: '# Plan d''exécution — conversion électrique de la flotte

    **Conseil du jeudi 13 août 2026 — Direction de l''exploitation**


    ---


    ## 1. Ce que ce plan engage


    La commande est ferme et n''est pas rediscutée. Ce plan traite la seule question ouverte : **dans
    quel ordre et à quelle condition les 96 véhicules entrent en service sans casser le service client
    ni perdre la subvention.**


    Il demande au conseil trois décisions jeudi :


    | Décision | Montant | Caractère |

    |---|---|---|

    | Commande ferme de la tranche 1 de bornes (8 points, 210 k€) | 210 000 € | **Ferme, jeudi** |

    | Enveloppe pré-engagée tranches 2 et 3 (16 points) | 420 000 € | Réservée, décidée 15/09 et 15/10
    sur mesure |

    | Prolongation par défaut des lots diesel, libérés sur preuve | ≤ 190 000 € étalés sur 8 mois | Autorisation
    permanente, réversible au mois |


    ---


    ## 2. Le constat qui commande tout le reste


    **La contrainte n''est pas l''autonomie. C''est la recharge.**


    L''essai a mesuré 232 km, et 197 km à 2 °C avec chauffage. Rapporté à la charge complète annoncée
    (22 kW × 6 h ≈ 132 kWh), cela donne une consommation de **0,57 kWh/km par temps doux et 0,67 kWh/km
    par temps froid**. Une tournée moyenne de 168 km réclame donc **4 h 20 de borne l''été et 5 h 10 l''hiver**.


    Conséquence directe, avec une fenêtre de recharge réaliste de 15 h (retour 16 h → départ 7 h) et 85
    % d''occupation effective des points :


    | Points de charge | Véhicules réellement rechargeables par nuit d''hiver |

    |---|---|

    | 14 (existant) | **~34** |

    | 22 (avec la tranche devisée) | **~54** |

    | 30 | ~74 |

    | ~40 | ~96 |


    **Les 14 bornes actuelles ne permettent pas d''atteindre les 60 véhicules de la subvention. Les 22
    bornes devisées y parviennent tout juste, sans marge.** Le parc complet de 96 véhicules demande de
    l''ordre de 40 points, soit environ 660 k€ au prix unitaire du devis (26 250 € le point), et non 210
    k€.


    C''est le chiffre que le dossier ne contenait pas. Il ne remet pas en cause la conversion ; il en
    fixe le coût d''infrastructure réel.


    **Ce chiffre est dérivé, pas mesuré, et il est vérifiable gratuitement d''ici jeudi.** La consommation
    de 0,57 kWh/km est déduite des données du dossier ; si les 6 h de charge annoncées incluent le palier
    de fin de charge, la capacité réellement utile est plus proche de 90 kWh, la consommation tombe à
    ~0,40 kWh/km, la recharge d''hiver à 3 h 30, et **22 points suffiraient pour 90 véhicules — les tranches
    2 et 3 seraient annulées, soit 420 k€ économisés.** Les six véhicules d''essai remontent état de charge
    et kilométrage toutes les 10 minutes depuis mars : la mesure existe déjà, il faut l''extraire. C''est
    la première action de ce plan (§ 9).


    ---


    ## 3. Le second constat : la moitié haute du carnet de tournées


    Avec une réserve d''exploitation de 15 % (trafic, détours, températures inférieures à 2 °C jamais
    testées, vieillissement batterie), la distance maximale assignable à un véhicule électrique est :


    - **au-dessus de 5 °C : 197 km**

    - **au-dessous de 5 °C : 167 km**


    La tournée moyenne fait 168 km. **En hiver, la moitié supérieure du carnet sort de l''enveloppe électrique.**
    Les 11 incidents de l''essai, tous au-dessus de 190 km, confirment la borne. La plus longue tournée,
    240 km, n''est réalisable d''un trait dans aucune condition mesurée.


    Trois traitements, dans cet ordre de préférence :


    1. **Appoint de mi-journée** pour les tournées qui repassent déjà par une plateforme pour recharger
    la marchandise : 1 h à 22 kW ajoute ~33 km d''hiver et porte l''enveloppe à ~200 km, à coût nul. *À
    vérifier en semaine 1 : combien de tournées repassent par plateforme et à quelle heure.*

    2. **Recoupe des tournées** entre les deux plateformes pour ramener le maximum sous 167 km. Coût probable
    : une à deux tournées supplémentaires.

    3. **Maintien diesel** sur le reliquat. 480 €/mois/véhicule, décision reconductible.


    ---


    ## 4. Calendrier


    | Échéance | Action | Point de contrôle |

    |---|---|---|

    | **13 août** | Conseil : commande ferme tranche 1 | — |

    | **14 août** | Bon de commande 8 bornes + demande écrite au région sur la définition de « roulant
    » | Délai matériel confirmé par l''installateur sous 5 j |

    | **31 août** | **Préavis de prolongation lot 1 (24 diesels)** | Automatique — aucun VE n''est encore
    en service |

    | **~30 sept** | Livraison 24 VE — mise en service progressive sur les 24 tournées les plus courtes
    | 14 points suffisent pour 24 VE |

    | **30 sept** | Préavis prolongation lot 2 | Décision par défaut : prolonger |

    | **~2 oct** | Tranche 1 en service (22 points) | **Jalon subvention** |

    | **15 sept** | Décision tranche 2 sur mesure réelle de consommation | Livraison début novembre |

    | **31 oct** | Livraison 48 VE cumulés + préavis lot 3 | 22 points = plafond ~54 VE |

    | **15 oct** | Décision tranche 3 sur 6 semaines d''exploitation réelle | Livraison début décembre
    |

    | **30 nov** | 72 VE cumulés — **seuil de 60 franchi** + préavis lot 4 | Fenêtre froide s''ouvre |

    | **31 déc** | 96 VE livrés | — |

    | **10 jan** | **Contrôle subvention : ≥ 60 VE en service effectif** | Repli § 7 si non |

    | **31 jan** | Date butoir subvention | — |

    | **fév → avr** | Libération des lots diesel sur preuve | Règle § 5 |


    ---


    ## 5. Règle de restitution des diesels


    Un diesel rendu ne revient pas avant 11 semaines. **C''est la seule décision irréversible du plan.**
    Elle est donc conditionnée, pas calendaire.


    > **Un lot de 24 diesels n''est rendu que lorsque les véhicules électriques qui reprennent ses tournées
    ont réalisé 20 jours ouvrés consécutifs à 99 % ou plus de tournées terminées, dont au moins 5 jours
    à moins de 5 °C.**


    Tant que la condition n''est pas remplie, le préavis de prolongation part automatiquement à J-30.
    Le responsable transport dispose d''un **droit de blocage documenté** sur chaque préavis de restitution
    : sa note d''hier est ce qui a fait apparaître les 11 incidents, la remontée doit avoir un pouvoir,
    pas seulement une voix.


    **Le calcul qui justifie la prudence.** Un diesel prolongé coûte 480 €/mois. Il couvre ~21 tournées.
    Une tournée non terminée coûte 900 €. Le seuil d''équivalence est donc de **2,5 % d''échec**. L''essai
    affiche 9,2 % de recharges imprévues. Tant que le taux mesuré dépasse 2,5 %, prolonger est strictement
    moins cher que rendre.


    **Coût plafond de la couverture : 190 000 €** si l''intégralité des lots est tenue jusqu''à fin avril.
    Exposition évitée : à 3 % d''échec sur 2 016 tournées mensuelles, 54 000 € par mois. La couverture
    se réduit de 11 520 € par mois à chaque lot libéré.


    ---


    ## 6. Pilotage


    Le tableau de bord existe déjà et publie chaque soir, par plateforme, le taux de tournées terminées
    et les recharges non prévues. Aucun outil nouveau n''est requis. Trois seuils y sont branchés :


    | Indicateur | Seuil | Déclenchement |

    |---|---|---|

    | Tournées terminées, par plateforme | < 99,0 % sur 5 jours ouvrés consécutifs | Gel du prochain préavis
    de restitution + retrait des tournées les plus longues de l''affectation VE |

    | Recharges non prévues | > 3 % des tournées VE sur 7 jours glissants | Abaissement immédiat du plafond
    d''affectation VE de 167 à 150 km |

    | Avancement travaux bornes | > 2 semaines de retard sur un jalon | Gel du palier de déploiement correspondant
    + prolongation du lot diesel associé |


    Ces trois déclencheurs portent sur le plan retenu, pas sur des hypothèses : ils s''appliquent à partir
    de la première mise en service, fin septembre.


    ---


    ## 7. Subvention : ce qui la protège


    620 000 € pour 60 véhicules roulant avant le 31 janvier. Les livraisons donnent 72 véhicules dès le
    30 novembre : **le risque n''est pas la livraison, c''est la capacité de recharge et l''affectabilité
    des tournées.**


    Repli, activable le 10 janvier : concentrer les 60 véhicules sur les 60 tournées les plus courtes
    du carnet (≤ 140 km). Besoin : ~256 heures-borne par nuit, soit **17 points** — largement couvert
    par les 22 points de la tranche 1. Les 36 véhicules restants attendent les tranches suivantes en stationnement.


    Ce repli tient à une condition : **la tranche 1 doit être commandée jeudi.** Avec 14 points, le plafond
    est de 44 véhicules et la subvention est perdue.


    Point ouvert à fermer sous 5 jours : obtenir de la région la **définition écrite de « roulant »**
    — immatriculé, ou en service quotidien. L''écart entre les deux lectures vaut 620 000 €.


    ---


    ## 8. Le contre-argument, et pourquoi le plan tient


    *« Ce plan dépense 630 k€ de bornes et 190 k€ de diesel, soit 820 k€, pour protéger une subvention
    de 620 k€ et une conversion déjà votée. Il est sur-assuré. »*


    L''objection est juste sur un point et fausse sur l''autre.


    Elle est fausse sur les bornes : ce n''est pas une assurance, c''est la condition physique d''usage
    de l''actif. Sans les points de charge, 3,1 M€ de véhicules ne peuvent pas prendre la route. Le poste
    n''est pas optionnel, il était simplement absent du dossier.


    Elle est juste sur le diesel — et c''est pour cela que la couverture est **mensuelle et décroissante**,
    pas forfaitaire. Chaque lot libéré retire 11 520 €/mois. Si les mesures de la semaine 1 confirment
    une consommation basse et un taux d''échec sous 2,5 %, la couverture tombe à moins de 60 k€ au total.
    Le plan ne dépense pas 190 k€ : il achète le droit de ne pas les dépenser.


    **Ce qui renverserait ce plan** : une consommation mesurée à 0,40 kWh/km ou moins. Les tranches 2
    et 3 seraient annulées, le plafond de 22 points suffirait pour 90 véhicules, l''enveloppe totale retomberait
    à 210 k€ et la couverture diesel à un lot. C''est l''observation à produire en premier.


    ---


    ## 9. Première action


    **Lundi 10 août, 9 h — extraction des télémétries de l''essai de mars.** Six véhicules, état de charge
    et kilométrage toutes les 10 minutes, trois semaines. Deux résultats à produire avant jeudi :


    1. La **consommation réelle en kWh/km**, à température douce et à 2 °C, et la **durée réelle des sessions
    de charge**.

    2. L''**histogramme des 96 tournées par distance**, par plateforme et par saison, avec l''indication
    de celles qui repassent par une plateforme en milieu de journée.


    Le conseil décidera alors les tranches 2 et 3 sur des chiffres mesurés, pas sur les miens.


    ---


    Je peux publier ce document en page partageable pour circulation avant jeudi, ou le mettre au format
    de note du conseil si vous avez une trame imposée.

    '
