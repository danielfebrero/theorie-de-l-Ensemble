response:
  text: 'Une réserve, puis la note.


    La règle demandée — « N jours sans alarme et ça repart » — est le seul critère que l''incident du
    12 mai a déjà mis en défaut : la boucle était au vert pendant les 9 jours de dérive de S2. Un compteur
    de jours sans alarme était vert tout du long. Je ne peux pas mettre dans une note signée un critère
    dont l''incident a démontré l''aveuglement. En revanche, la demande de fond du DG — repasser en automatique
    sans reconvoquer le comité — est légitime et réalisable : la note ci-dessous la satisfait, en conditionnant
    la reprise à un état vérifiable plutôt qu''à une durée. Le comité pré-autorise jeudi ; la reprise
    se fait ensuite sans nouvelle réunion.


    ---


    **RÉGIE DES EAUX DE TRÉVANNE — Note au comité d''exploitation**

    **Objet : conditions de reprise de la régulation automatique de chloration**

    **Date : 8 août 2026 — Émetteur : responsable d''exploitation**


    **1. Situation**


    87 jours sans dépassement de 0,8 mg/L, moyenne 0,52 mg/L, S2 remplacée le 2 juin. Le surcoût du pilotage
    manuel est de 41 k€/mois, soit environ 9,5 k€ par semaine de retard sur la remise en service. La reprise
    de l''automatique est un objectif d''exploitation, pas une option.


    **2. Ce que les 87 jours mesurent**


    Ils mesurent la performance du pilotage manuel. La boucle automatique n''a fonctionné aucun de ces
    87 jours : le programme de l''automate est inchangé depuis le 12 mai. Les 87 jours ne portent donc
    aucune information sur le mécanisme qui a produit l''incident.


    Le comparateur S2/S3 n''a levé aucune alarme depuis le 14 juillet. Trois raisons de ne pas en tirer
    de conclusion : il observe une boucle en manuel, S2 est neuve et réétalonnée toutes les deux semaines
    (l''étalonnage corrige la dérive avant qu''elle ne soit détectable), et sa sortie va vers un tableau
    de bord — il ne peut arrêter aucune boucle. Un détecteur qui n''a jamais déclenché n''a pas été démontré
    capable de déclencher.


    **3. Le risque de rester en manuel**


    Il n''est pas nul et il joue dans l''autre sens. L''écart-type actuel est de 0,21 mg/L contre 0,08
    mg/L en automatique. Cette dispersion place des points bas à un niveau qui interroge le résiduel de
    désinfection en extrémité de réseau — à vérifier sur les relevés réseau depuis le 13 mai, et à faire
    figurer au dossier. Le pilotage manuel prolongé n''est pas la position sûre par défaut : c''est un
    régime dégradé qui coûte cher et déplace le risque.


    **4. Critère de reprise proposé**


    Le critère signé du 13 mai — « la régulation automatique reste hors service tant que la discordance
    S2/S3 n''est pas instrumentée » — n''est pas rouvert. Il est clos par démonstration, sur les cinq
    conditions suivantes :


    - **C1 — Chaîne d''arrêt raccordée.** Le comparateur agit sur l''actionneur : discordance S2/S3 persistante
    au-delà du seuil retenu déclenche le repli sans intervention humaine. Seuil et temporisation arrêtés
    par le service instrumentation (proposition : 0,15 mg/L pendant 10 min).

    - **C2 — Butée indépendante.** Chlore sortie > 0,8 mg/L pendant plus de 5 minutes déclenche le repli,
    indépendamment du comparateur. Deux chemins d''arrêt distincts, pour que la défaillance du détecteur
    ne soit pas la défaillance de la sécurité.

    - **C3 — Alarme de discordance réactivée et verrouillée.** Sa désactivation exige une trace nominative,
    un motif et une date de remise en service. C''est le point organisationnel de novembre.

    - **C4 — Test de provocation documenté.** Injection d''un biais connu sur S2, deux amplitudes, deux
    essais chacune, prouvant que la chaîne détecte **et** arrête. Sans ce test, C1 et C2 ne sont pas acquises.

    - **C5 — Revue du programme automate.** Revue et versionnage de la branche de régulation, diff tracé
    par rapport à la version du 12 mai.


    **5. Reprise sans nouvelle réunion**


    Dès que C1 à C5 sont constatées et signées conjointement par le responsable d''exploitation et le
    responsable instrumentation, la reprise est autorisée par ce seul fait. Le comité en est informé,
    il n''est pas reconvoqué.


    La reprise se fait en automatique supervisé pendant **14 jours**, poste 24/7 maintenu, avec critères
    de remise en manuel définis à l''avance. C''est la seule durée qui ait un sens ici : elle compte des
    jours dans le régime que l''on valide. À l''issue, retour à l''effectif normal et fin du surcoût.


    **6. Audit externe**


    La reprise n''a pas à attendre le 30 septembre. L''auditeur est informé du calendrier et son avis
    préliminaire sur C1–C5 est sollicité avant mise en service.


    **Décision demandée jeudi :** validation du critère C1–C5 comme condition unique et suffisante de
    reprise ; engagement d''une date de livraison de C1–C4 par le service instrumentation ; information
    de l''ARS sur le calendrier de retour en automatique, à confirmer avec le service qualité.


    ---


    Deux points à compléter avant jeudi, que je ne peux pas trancher seul : la date d''engagement du service
    instrumentation sur C1–C4 (le chiffrage des 9,5 k€/semaine est là pour cadrer cet arbitrage), et les
    relevés de chlore réseau depuis le 13 mai pour étayer ou retirer le §3. Dis-moi si tu veux la note
    en fichier, ou une version raccourcie qui garde §4 et §5 seulement.

    '
