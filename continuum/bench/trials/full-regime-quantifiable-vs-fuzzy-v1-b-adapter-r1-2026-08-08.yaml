response:
  text: '# Note à la direction — Conseil du jeudi


    **Objet :** affectation de l''enveloppe unique de 900 000 €, dossiers A (parc machines) et B (succession
    qualité)


    ---


    ## Décision proposée


    | Poste | Montant | Nature |

    |---|---|---|

    | B — Promotion de l''adjointe, effective immédiatement | 45 000 € | Engagé |

    | B — Mission de transition du directeur sortant, 12 mois | 90 000 € | Engagé |

    | B — Mandat de recherche externe, activable | 70 000 € | Engagé, déclenchable |

    | A — Commande ferme des 6 machines, livraison en 3 tranches | 620 000 € | Engagé |

    | A — Provision de re-validation des procédés et outillage de transfert | 75 000 € | Engagé |

    | **Total** | **900 000 €** | |


    L''enveloppe est intégralement engagée. **Engagement n''est pas livraison** : la commande des six
    machines est signée cet exercice, les installations sont échelonnées. C''est ce qui permet de tout
    sécuriser sans tout subir en même temps.


    ---


    ## Les deux dossiers ne sont pas indépendants


    Nous fabriquons des dispositifs médicaux. Remplacer une machine d''usinage impose de re-valider le
    procédé et d''en informer l''organisme notifié. Remplacer les six d''un coup, c''est concentrer cette
    charge de validation exactement sur les mois où notre direction qualité est la plus fragile — et où
    l''organisme notifié perd son seul interlocuteur reconnu.


    D''où le séquencement : **les deux premières tranches sont validées pendant que le directeur qualité
    est encore en poste et signe avec l''organisme notifié.** Nous utilisons l''actif pendant qu''il existe.
    La troisième tranche est livrée après l''installation de sa remplaçante.


    ---


    ## Dossier A — ce que dit vraiment l''historique


    L''historique audité sur 5 ans, rapporté à l''année : 9,4 pannes, 362 heures d''arrêt, 42 600 € de
    coût direct, plus 13 800 € de marge perdue (1 810 h × 38 €). **Soit environ 56 400 € par an de coût
    documenté.**


    Contre 620 000 € d''investissement, cela donne un retour sur **onze ans** — et ce, dans l''hypothèse
    la plus favorable où le neuf supprime 100 % du problème. Sur ces seuls chiffres, le dossier ne se
    justifie pas.


    Il se justifie pour deux raisons que les chiffres fournis ne couvrent pas :


    1. **Le rebut.** L''écart est de 2,9 points (4,1 % contre 1,2 %). C''est probablement le premier poste
    de coût du dossier, et il est absent du chiffrage. Sur un flux de 3 M€ passant par ces machines, il
    représente à lui seul ~87 000 €/an et ramène le retour à sept ans. *Demande au conseil : ce chiffre
    doit être produit avant la signature. Il est disponible en 48 heures.*

    2. **La dégradation d''un parc de 14 ans n''est pas linéaire.** Les 56 400 €/an sont une moyenne rétrospective,
    pas une prévision.


    **Deux réserves à lever avant signature :**


    - **La garantie de 96 % ne nous engage à rien.** 1 810 heures d''arrêt sur cinq ans, rapportées à
    un fonctionnement en une équipe (≈ 48 000 heures-machine sur la période), représentent 3,8 % d''indisponibilité
    : nous sommes déjà à 96,2 %. En deux équipes, l''écart se creuse encore en notre défaveur. Le fournisseur
    nous garantit contractuellement notre situation actuelle. **Exiger une clause reformulée en heures
    d''arrêt maximales par an, avec pénalités calibrées à 38 €/h plus coût direct.**

    - **Les 47 pannes ne sont pas réparties uniformément sur six machines.** Réclamer la ventilation par
    machine. Si deux ou trois concentrent l''essentiel, l''ordre des tranches en découle — et, si l''écart
    est fort, la question de commander six machines au lieu de quatre se repose.


    ---


    ## Dossier B — le seul risque de ruine du conseil


    Le dossier A porte sur un coût. Le dossier B porte sur la capacité à vendre : perdre la relation avec
    l''organisme notifié, c''est perdre la certification ; 31 % du chiffre d''affaires est adossé à une
    personne. Aucune des trois pistes RH ne peut être évaluée sur un rendement — elles s''évaluent sur
    ce qu''elles préservent.


    Ce que nous achetons réellement n''est ni un profil ni un salaire : **c''est du recouvrement**. Vingt-deux
    ans de capital relationnel ne se recrutent pas, ils se transmettent, et uniquement en présence des
    deux personnes.


    - Promotion immédiate + mission de transition = **23 mois de recouvrement** (11 mois avec le titulaire
    en poste, 12 mois après), pour 135 000 €.

    - Recrutement externe = 8 mois de recouvrement au mieux, délai de recherche déduit, pour 280 000 €,
    et sans transfert garanti de la reconnaissance auprès de l''organisme notifié, qui est personnelle.


    **Le contre-argument, et il est sérieux :** trois ans d''ancienneté, c''est mince pour ce poste, nous
    n''avons aucun précédent interne et aucun comparable sectoriel. Si l''adjointe échoue au neuvième
    mois, nous lançons un recrutement externe alors que le titulaire est parti — sans aucun recouvrement.


    **C''est pourquoi les 70 000 € de mandat externe sont engagés maintenant et non plus tard.** L''enveloppe
    n''est pas reconductible : l''option de secours ne peut être achetée qu''aujourd''hui. Le cabinet
    construit dès à présent une liste courte tenue à jour, activable en quelques semaines.


    **Points d''arrêt observables, à examiner au conseil du 6e mois :**

    1. L''adjointe conduit le prochain audit de l''organisme notifié, sous supervision, et est présentée
    nommément comme l''interlocutrice successeur.

    2. Les 9 auditeurs internes sont re-qualifiés sous son autorité.

    3. Visites conjointes réalisées auprès des deux clients hospitaliers, le titulaire présentant sa remplaçante.


    Si deux de ces trois points ne sont pas tenus au 6e mois, le mandat externe est activé — il reste
    alors cinq mois de recouvrement.


    **Une réserve à porter au procès-verbal :** les deux clients hospitaliers déclarent travailler avec
    nous « à cause de lui ». Cette affirmation doit être testée sous 90 jours, pas gérée par la seule
    voie RH. Si la dépendance est confirmée comme réellement personnelle et non transférable, c''est un
    fait commercial qui dépasse le cadre de cette enveloppe et appelle une décision distincte du conseil.

    '
