response:
  text: '# Position de la présidence — séance de jeudi


    ## 1. Je conteste trois éléments de l''énoncé avant d''arbitrer


    **a) « 570 − 410 = 160 » est probablement la mauvaise équation.**

    Sarcelle est un **barrage**, pas une prise au fil de l''eau. 410 L/s est un *débit entrant* ; ce qui
    est distribuable, c''est entrant + déstockage. Le dossier ne mentionne nulle part le volume utile
    en réserve ni la courbe de marnage. C''est la donnée la plus déterminante du dossier et elle est absente
    du débat. Ordre de grandeur : 160 L/s pendant 40 jours = 550 000 m³. Si la retenue dispose de cette
    réserve mobilisable, le déficit instantané se referme — au prix d''un transfert de risque vers septembre-octobre.
    Ce transfert doit être borné explicitement, pas subi : **une réserve AEP intangible, calculée pour
    tenir 6 semaines au-delà de l''horizon de prévision, est prélevée en premier sur le stock ; le solde
    seul est mobilisable pour l''irrigation.**


    **b) Le 410 L/s est un chiffre unique, non redondé, sur une courbe de tarage de 2023.**

    C''est en étiage que les courbes de tarage dérivent le plus (végétalisation du lit, atterrissements).
    L''incertitude réaliste est de ±15 à 25 %, soit une fourchette 310–510 L/s. Toute la séance se dispute
    des dixièmes sur un nombre dont on ignore la deuxième décimale. Conséquence opérationnelle immédiate
    : **on ne vise pas un seuil-falaise avec un instrument flou.** Tant que le jaugeage contradictoire
    n''est pas fait, la cible de restitution est 195 L/s, pas 180 — sinon on a une chance sur deux d''être
    en réalité sous le seuil en croyant le respecter. Ces 15 L/s sont le prix de l''incertitude, et le
    jaugeage les rend aux maraîchers.


    **c) Les 150 L/s de la régie sont un prélèvement déclaré, pas un besoin démontré.**

    150 L/s = 12 960 m³/j pour 9 200 habitants, soit **1 409 L/habitant/jour**. La consommation domestique
    française est de l''ordre de 150 L/hab/j. Même avec un rendement de réseau médiocre (60 %) et l''EHPAD,
    le besoin domestique reste autour de **25 à 35 L/s**. Le facteur est de 4 à 9.


    Trois explications possibles : le périmètre desservi dépasse largement Ferney ; il existe un ou plusieurs
    gros abonnés non domestiques ; le rendement du réseau est très dégradé. Dans les trois cas la donnée
    est détenue par la régie, et dans les trois cas elle change entièrement l''arbitrage.


    **C''est le point central de ma position.** Le conflit réel n''oppose pas « les paysans et les robinets
    ». Il oppose la récolte aux pertes du réseau. Si le besoin AEP réel est de 50 L/s, l''irrigation dispose
    de 410 − 195 − 50 = **165 L/s**, et avec les gains d''efficience ci-dessous la récolte est très majoritairement
    sauvée, sans toucher au débit réservé. Si la régie maintient 150 L/s sans justification, l''irrigation
    tombe à 65 L/s et la récolte est perdue. **Le refus de la régie d''ouvrir ses données n''est pas une
    posture de négociation : c''est ce qui détruit les 4,1 M€.** Je le dirai en ces termes.


    ## 2. Ce que je mets au vote jeudi


    **Pas la répartition.** Les maraîchers ont quitté la salle ; un vote de répartition en leur absence
    sera juridiquement fragile, politiquement contesté et opérationnellement inapplicable. Et la CLE n''a
    de toute façon pas le pouvoir de répartir : elle propose, le préfet arrête.


    Je mets au vote **un protocole**, qui n''exige de concession de personne :


    1. Jaugeage contradictoire par un opérateur indépendant + point de contrôle secondaire à l''aval de
    la restitution, sous 72 h.

    2. Relevé thermique et oxymétrique quotidien sur le tronçon et les deux frayères, à compter de demain.

    3. Transmission par la régie, sous 72 h, du bilan volumétrique (périmètre desservi, volumes domestiques
    / non domestiques / gros abonnés, rendement, indice linéaire de pertes).

    4. Déclaration par chaque exploitation des surfaces, cultures, stades phénologiques et modes d''apport.

    5. Publication quotidienne des débits aux trois parties, même source, même heure.

    6. Révision hebdomadaire de l''allocation. **Je ne garantirai pas 8 semaines avec 3 semaines de visibilité.**
    Je garantis une *règle* sur 8 semaines, pas un volume.


    Un vote de protocole passe. Un vote de répartition, non.


    ## 3. La règle d''allocation


    Ordre lexicographique, seuils explicites :


    1. **Continuité vitale AEP** (foyers, EHPAD, défense incendie) : garantie inconditionnelle, par écrit,
    dès jeudi. Le *volume*, lui, est plafonné au besoin démontré + 20 % de marge.

    2. **Débit réservé 180 L/s** : plancher légal (art. L.214-18 c. env. ; 180 L/s correspond vraisemblablement
    au 1/10 du module — à vérifier). La CLE ne peut pas le baisser. Le présenter comme négociable a pollué
    le débat pendant six semaines. Cible opérationnelle 195 L/s jusqu''au jaugeage.

    3. **Irrigation** : le solde, **distribué par tour d''eau sectorisé, pas par réduction uniforme.**
    La réponse des cultures à l''eau n''est pas une falaise, sauf sur les fenêtres critiques (floraison,
    nouaison, grossissement). Un abattement uniforme de 30 % détruit plus de valeur qu''une concentration
    des apports sur les stades critiques assortie d''un abandon assumé de 20 à 25 % des surfaces.

    4. **Le stock du barrage** ne peut alimenter l''irrigation qu''au-delà de la réserve AEP intangible.


    Trois gains d''efficience à mobiliser immédiatement, avant tout arbitrage douloureux :


    - **Irrigation nocturne exclusive (21 h–7 h), aspersion interdite par vent > 20 km/h.** Récupère 15
    à 25 % d''eau utile. Coût nul, délai 48 h, équivalent à **~40 L/s** sur une demande de 240.

    - **Recherche et réparation de fuites sur Ferney** + suspension des usages municipaux et non domestiques
    sur eau potable, substitution eau brute pour arrosage et nettoiement. Gisement plausible : **30 à
    60 L/s**.

    - **Renoncement volontaire indemnisé** sur 120–150 ha : **~45 L/s**.


    Total : 115 à 145 L/s des 160 manquants, sans franchir le débit réservé. **Le déficit de 160 L/s n''est
    pas un déficit de ressource. C''est un déficit d''information et d''efficience.**


    Un point d''honnêteté envers les maraîchers : leur demande de 240 L/s représente 3,3 mm/j sur 620
    ha, soit déjà en dessous de l''ETP de saison. Elle n''est pas gonflée. En revanche l''affirmation
    « en dessous, perte totale » est agronomiquement fausse comme énoncé général — et c''est précisément
    ce qui rend la sortie possible.


    ## 4. Emploi des 600 000 €


    Je refuse la répartition uniforme en indemnisation : 600 k€ pour 4,1 M€ de perte, c''est 14,6 % —
    cela ne sauve aucune récolte et ne rend personne indemne. **Ce fonds achète de l''eau et de l''information,
    pas du réconfort.**


    | Poste | Montant |

    |---|---|

    | Métrologie : jaugeage, station secondaire, télétransmission, thermie/oxymétrie | 45 k€ |

    | Diagnostic et réparation de fuites, sectorisation réseau Ferney | 180 k€ |

    | Sécurisation AEP : interconnexion provisoire, citernes EHPAD, substitution eau brute | 90 k€ |

    | Rachat de renoncement sur surfaces volontairement abandonnées (~150 ha) | 220 k€ |

    | Mesures refuge frayères, entretien granulométrique, pêche de sauvegarde | 35 k€ |

    | Réserve de gestion | 30 k€ |


    Le rachat de renoncement (~1 500 €/ha) ne couvre pas la marge perdue et je ne prétendrai pas le contraire.
    **La compensation des 4,1 M€ ne relève pas de ce fonds** : elle relève du fonds de solidarité nationale
    (risques climatiques agricoles), de l''assurance récolte subventionnée et du dégrèvement de TFNB.
    Je saisis le préfet et la DDT dès jeudi sur ces trois canaux, et je le mentionne dans la position
    écrite pour que personne ne confonde les 600 k€ avec une indemnisation. Priorité de service aux exploitations
    qui maintiennent l''emploi saisonnier.


    ## 5. Ce que je dis à chacun


    **Aux maraîchers.** Revenez, parce que la sortie de la salle vous coûte cher. Si la CLE ne propose
    rien, le préfet prendra un arrêté de crise, et en crise l''irrigation agricole est interdite, pas
    réduite. Votre alternative n''est pas 240 ou 150 : c''est 150–170 négociés, ou zéro imposé. Votre
    demande n''est pas excessive et je le dirai publiquement. Mais votre eau ne viendra pas de la rivière
    — elle viendra du réseau de Ferney et de vos propres pertes à l''aspersion. C''est de ce côté-là que
    je me bats pour vous.


    **À la régie.** Je vous garantis par écrit, ce jeudi, la continuité de l''alimentation des foyers
    et de l''EHPAD, sans condition et en toute circonstance. Je ne vous garantis pas 150 L/s, parce que
    ce nombre représente 1 400 litres par habitant et par jour et que personne dans cette salle ne peut
    le défendre en l''état. Votre refus de discuter ne protège pas vos abonnés : il transfère 4,1 M€ de
    perte à vos voisins pour couvrir une donnée que vous n''avez pas produite. Produisez-la sous 72 h
    et l''arbitrage se fera sur des faits.


    **Sur le débit réservé.** Il n''y a rien à négocier : la CLE n''a pas ce pouvoir. Le rapport du 12
    juin documente une perte non reconstituable à l''échelle de la décennie, c''est-à-dire une perte qu''aucun
    fonds ne rachète. Une récolte perdue est une catastrophe d''une saison ; les exploitations existent
    encore l''an prochain. Deux frayères asséchées, non.


    **À la presse.** Ce dossier n''oppose pas les paysans et les robinets. Il oppose la récolte aux fuites
    du réseau, et une saison à une décennie.


    ## 6. L''objection la plus forte contre ma position


    *« Vous exigez un jaugeage contradictoire sur le débit, mais vous prenez le rapport hydrobiologique
    du 12 juin pour argent comptant. Vous sacrifiez 4,1 M€ et 90 emplois réels au seuil de 180 L/s sans
    avoir vérifié d''où il sort ni s''il est encore pertinent. »*


    Elle est juste, et j''y réponds en appliquant la même exigence : le seuil de 180 est-il issu d''une
    mesure locale de débit minimum biologique, ou transposé de la règle générique du 1/10 du module ?
    Existe-t-il un potentiel de recolonisation depuis les affluents amont ?


    Et surtout — **la thermie**. La mortalité estivale de la truite fario est pilotée autant par la température
    que par le débit ; au-delà de 25 °C, la population est condamnée quel que soit le débit. Si le tronçon
    est déjà au-dessus du seuil létal, maintenir 180 L/s ne sauve rien et sacrifie la récolte pour rien.
    C''est pourquoi le relevé thermique est dans le protocole voté jeudi et non en annexe.


    **Ce qui me ferait changer d''avis :** trois jours consécutifs au-dessus du seuil létal sur le tronçon,
    ou l''absence de fondement local documenté au seuil de 180. Dans ce cas je rouvre l''arbitrage écologique
    en séance et je demande au préfet un examen du débit réservé — pas avant, et jamais sur la base d''une
    pression politique.


    ## 7. Seuils d''arrêt observables


    - Débit entrant **< 340 L/s** → irrigation suspendue, régie en régime d''urgence.

    - Débit entrant **< 250 L/s** → aucun prélèvement compatible avec le débit réservé : saisine préfectorale
    pour arrêté de crise + pêche de sauvegarde sur les deux frayères.

    - Réserve tampon régie **< 2 jours** → priorité absolue, citernage EHPAD activé.

    - Réserve utile du barrage atteignant le seuil AEP intangible → arrêt immédiat du déstockage agricole.

    - Température **> seuil létal 3 jours consécutifs** → réouverture de l''arbitrage écologique.

    - Revue hebdomadaire de la CLE, publication quotidienne des débits.


    ---


    **En une phrase pour la séance :** je ne demande à personne de renoncer jeudi ; je demande à chacun
    d''ouvrir ses compteurs sous 72 heures, parce que les 160 L/s manquants sont très probablement déjà
    dans le bassin — dans la retenue, dans le réseau de Ferney et dans l''évaporation diurne des asperseurs
    — et qu''il serait absurde de détruire une décennie de rivière ou une saison de récolte avant d''être
    allé les chercher.

    '
