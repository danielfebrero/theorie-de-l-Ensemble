response:
  text: '# Avis — Renouvellement du marché logiciel de réservation et bornes de prêt

    **Comité de direction du 28 août 2026 — échéance contractuelle 31 octobre 2026**


    *Note de lecture : chaque appréciation ci-dessous porte la pièce sur laquelle elle repose, et ce qui
    tombe si le comité écarte cette pièce. Aucun point n''est solidaire des autres.*


    ---


    ## I. Ce que le dossier établit


    **C1 — Le dossier ne contient aucune réservation perdue.**

    Il contient 26 agents sur 62 qui déclarent des pertes hebdomadaires, 12 qui les datent d''après mars,
    96 réclamations et 5 h de ressaisie par semaine à Rive-Sud. Il ne contient pas un seul événement daté
    et identifié : une réservation créée, non honorée, avec son horodatage. Ce que les agents observent,
    c''est une réservation absente ; que le module l''ait « perdue » est une interprétation, pas un relevé.

    *Repose sur : enquête interne, notes de sites, réclamations — par ce qu''ils ne contiennent pas.*

    *Si le comité écarte ce point : toute la section II tombe, et la note de cadrage redevient recevable.*


    **C2 — L''indisponibilité matérielle se concentre sur les deux sites équipés en 2015.**

    32 h sur 41 h, soit 78 % des pannes, sur les deux seuls sites portant les bornes de 2015 ; 9 h réparties
    sur les cinq autres. C''est la corrélation la plus nette du dossier : une variable, une séparation
    parfaite.

    *Repose sur : export technique.*

    *Réserve : deux sites, ce n''est pas une démonstration, et l''export ne dit pas comment les 32 h se
    répartissent entre Fontaine et Rive-Sud. Si l''essentiel est à Rive-Sud, l''âge des bornes n''est
    plus le meilleur candidat — c''est le lien fibre (C4).*


    **C3 — L''indisponibilité des bornes et la perte de réservations sont deux dossiers, pas un.**

    Une borne de prêt hors service est un incident matériel visible et daté ; une réservation absente
    est un incident logiciel invisible et non compté. Le dossier les additionne parce qu''ils viennent
    du même fournisseur. Aucune pièce ne les relie.

    *Repose sur : export technique + enquête interne, lus séparément.*

    *Si le comité écarte ce point : la v4 peut être présentée comme réponse unique aux deux problèmes.*


    **C4 — Rive-Sud a connu, en février, deux changements que le dossier n''exploite pas.**

    Remplacement du lien fibre et changement de version du portail usagers — un mois avant le début supposé
    des pertes, et sur le site précisément qui ressaisit à la main. La mise à jour de mars, elle, a touché
    les sept sites. Fontaine, même logiciel, même mise à jour, mêmes bornes de 2015, ne signale rien.

    *Repose sur : note de février + notes de sites.*

    *C''est le constat central : une cause commune aux sept sites n''explique pas un symptôme concentré
    sur un site.*


    **C5 — Le pic de réclamations s''est éteint alors que le symptôme persiste.**

    71 réclamations entre mars et juin, 25 sur les huit autres mois — environ 18 par mois pendant le pic,
    3 par mois hors pic. Mais Rive-Sud ressaisit toujours 5 h par semaine. Deux lectures s''opposent :
    soit la ressaisie absorbe le défaut et le cache aux usagers, soit le défaut s''est résorbé et la ressaisie
    est devenue une habitude. Les deux conduisent à des décisions opposées, et les départager coûte deux
    semaines de comptage.

    *Repose sur : réclamations usagers + notes de sites.*


    **C6 — Rive-Sud paie seul un défaut réseau depuis cinq mois.**

    5 h par semaine ≈ 220 h par an, l''équivalent de six semaines de travail d''un agent à temps plein.
    *Chiffre que je pose et que le dossier ne donne pas : au coût employeur d''un agent, l''ordre de grandeur
    est de 5 000 à 7 000 € par an* — comparable à la remise commerciale mise en avant. Cette charge n''apparaît
    dans aucune ligne budgétaire.

    *Repose sur : notes de sites.*


    ---


    ## II. Ce que le dossier n''établit pas


    La note de cadrage enchaîne trois affirmations. Elles n''ont pas le même statut et le comité peut
    en écarter une sans écarter les autres.


    | Affirmation | Statut |

    |---|---|

    | « La mise à jour de mars est la cause des pertes » | **Non établie, et contredite par C4** : douze
    déclarations rétrospectives, contre une asymétrie Fontaine/Rive-Sud que la thèse logicielle n''explique
    pas. Mars est l''événement que tout le monde connaît ; février, personne. L''attribution suit la notoriété
    de l''événement, pas la preuve. |

    | « La v4 règle le problème » | **Invérifiable en l''état** : on ne peut pas savoir si un correctif
    corrige une cause non identifiée. S''y ajoute que sa compatibilité avec les bornes de 2015 est « à
    l''étude » — c''est-à-dire non acquise, sur les deux sites qui portent 78 % des pannes. |

    | « Il faut signer avant le 30 pour ne pas perdre la remise » | **Exacte sur le fait, trompeuse sur
    l''enjeu** : c''est une échéance commerciale, pas une échéance de service. Le service est couvert
    jusqu''au 31 octobre. Perdre la remise est une perte chiffrable et rattrapable ; signer trois ans
    sur un diagnostic faux ne l''est pas. |


    La note ne cite aucune pièce et a déjà été lue par deux membres du comité. Je ne mets pas en cause
    son auteur : elle formule l''hypothèse la plus naturelle. Je demande seulement qu''elle soit traitée
    comme une hypothèse.


    **Sur la remise elle-même.** 12 % sur 48 000 € = 5 760 € la première année. Sur trois ans avec indexation
    à 7 %, si la remise s''applique chaque année : ≈ 18 500 € ; si elle ne porte que sur la première :
    5 760 €. **Le dossier ne le dit pas.** L''écart entre les deux lectures est de 12 700 € : on ne peut
    pas arbitrer une signature sans cette réponse écrite.


    ---


    ## III. Les trois options


    **Reconduire à l''identique.** Coût connu, indexation subie, aucun des deux problèmes traité. Réversible.


    **Reconduire avec migration v4 (31 000 €).** Engage 31 000 € immédiats plus ≈ 136 000 € sur trois
    ans, sur une cause non établie, avec un risque de devoir remplacer en plus les bornes de Fontaine
    et Rive-Sud. Pire cas : les pertes persistent après la v4 parce que la cause était ailleurs — le réseau
    a payé, s''est lié trois ans, et n''a plus aucun levier. *Qui l''encaisse : le budget d''investissement,
    et Rive-Sud qui continue de ressaisir.*


    **Basculer vers le libre.** Le voisin annonce 30 % de moins — coût de fonctionnement annoncé, hors
    migration et hors temps interne, donc non comparable à nos 48 000 €. Surtout : après 14 mois, 2 de
    ses 5 sites tiennent encore un registre papier. Nous lancerions la même opération avec une équipe
    informatique de deux personnes dont une part en octobre, pendant la fenêtre d''expiration du contrat.
    Pire cas : sept sites sans système de réservation au 1er novembre, avec le papier pour seul repli.
    *Qui l''encaisse : les usagers des sept sites, et les 62 agents.*


    Cette dernière branche est la seule dont l''échec n''est pas rattrapable dans l''exercice. Elle n''est
    pas écartée sur le fond — elle est écartée **maintenant**, avec **ce calendrier** et **cet effectif**.


    ---


    ## IV. Recommandation


    **Reconduire, mais court, et refuser la signature de trois ans avant le 30.**


    Le comité n''a pas à choisir un fournisseur le 28 : il a à choisir qui fixe le calendrier. Aujourd''hui
    c''est une échéance commerciale placée deux jours après la séance, sur un dossier où personne n''a
    encore compté une seule réservation perdue.


    Ce que je propose de décider le 28, et qui est entièrement réversible :


    1. **Ne pas signer le renouvellement de trois ans avant le 30.** Prix assumé : 5 760 à 18 500 €. C''est
    le coût du diagnostic, et il est inférieur aux 31 000 € de la v4 comme au risque de trois ans mal
    engagés.

    2. **Mandater une reconduction courte** — prolongation technique de 3 à 6 mois, ou reconduction d''un
    an — pour couvrir le 31 octobre sans se lier.

    3. **Ne pas engager les 31 000 € de la v4** tant que la cause n''est pas établie et que la compatibilité
    avec les bornes de 2015 n''est pas confirmée par écrit.

    4. **Ouvrir un dossier « bornes 2015 » distinct du dossier logiciel** (C2, C3) : 78 % des pannes s''y
    trouvent, et leur traitement ne dépend d''aucun arbitrage sur l''éditeur.

    5. **Reconnaître la charge portée par Rive-Sud** (C6) et prévoir un appui d''ici la fin du diagnostic.


    **Proposition à faire à l''éditeur, qui le sert aussi.** Un an au taux remisé, contre un engagement
    écrit sur la compatibilité des bornes de 2015 et une analyse conjointe des journaux mars-juin ; si
    la cause logicielle est confirmée et la compatibilité acquise, le réseau s''engage sur trois ans à
    la fenêtre suivante. L''éditeur garde le client et ouvre la voie à la v4 ; le réseau obtient son diagnostic.
    Un commercial qui refuse toute forme courte nous apprend quelque chose d''utile sur la suite.


    ---


    ## V. Le meilleur contre-argument, et pourquoi je maintiens


    *« Vous dépensez jusqu''à 18 500 € de remise pour acheter une information que le diagnostic ne donnera
    peut-être pas. Si les journaux sont inexploitables ou si l''éditeur traîne, vous aurez perdu la remise
    et vous signerez quand même en octobre, sans rien savoir de plus. »*


    Il tient en partie, et c''est le risque réel de ma recommandation. Deux raisons de maintenir. D''abord
    l''asymétrie : la remise perdue est une somme connue et bornée ; un engagement de trois ans avec 31
    000 € sur une cause fausse est une somme quatre à huit fois supérieure, sans porte de sortie. Ensuite,
    l''information ne dépend pas entièrement de l''éditeur : le comptage à Rive-Sud, la vérification à
    Fontaine et le journal d''incidents de l''opérateur fibre sont à notre main et suffisent à trancher
    entre C4 et la thèse logicielle.


    Il ferait basculer ma recommandation si l''éditeur refusait toute prolongation courte **et** que le
    réseau se retrouvait sans continuité de service au 1er novembre. C''est pourquoi la première démarche
    ci-dessous est celle-là, et pas une autre.


    ---


    ## VI. Ce que j''engage dans les quinze jours


    *Je compte les quinze jours à partir de la séance, soit jusqu''au 12 septembre. Les deux premières
    démarches ne peuvent pas attendre le 28 : je les engage cette semaine et j''apporte leurs réponses
    en séance.*


    **Avant la séance**


    1. **Demande écrite à l''éditeur des conditions d''une prolongation de 3 à 6 mois ou d''une reconduction
    d''un an**, et de l''assiette exacte de la remise de 12 % (une année ou trois, avant ou après indexation).
    Réponse attendue pour le 25 août. *C''est la démarche critique : sans elle, le comité délibère sans
    savoir si l''option courte existe.*

    2. **Question écrite à l''éditeur sur la v4 et les bornes de 2015** : compatible oui/non, à quelle
    date, et à la charge de qui si non. Une réponse « à l''étude » au moment de signer vaut « non » pour
    la décision.


    **Dans les quinze jours suivant la séance**


    3. **Comptage à Rive-Sud, deux semaines** : chaque réservation ressaisie, avec date, heure, canal
    (portail ou sur place). Départage les deux lectures de C5 et produit enfin des événements datés (C1).

    4. **Journal d''incidents du lien fibre de Rive-Sud depuis février**, demandé à l''opérateur, et relevé
    du changement de version du portail usagers. Teste C4 directement.

    5. **Vérification à Fontaine** : même mise à jour, même version de portail, mêmes usages ? Un site
    qui ne signale rien peut n''avoir rien à signaler, ou n''avoir personne à qui le signaler. À demander
    sans mise en cause.

    6. **Répartition des 32 h de panne entre Fontaine et Rive-Sud**, demandée à l''éditeur avec l''export
    détaillé. Réponse courte, effet important sur C2.

    7. **Journaux de réservation mars-juin ventilés par site**, demandés à l''éditeur. S''il les fournit
    et qu''ils montrent un taux de perte uniforme sur les sept sites démarrant à la date de la mise à
    jour, la thèse logicielle est établie et la v4 redevient l''option de tête.

    8. **Reclassement des 96 réclamations** par site, par type (réservation absente / borne indisponible
    / autre) et par mois. Deux demi-journées.

    9. **Relance de l''enquête** auprès des 19 non-répondants, et demande aux 26 déclarants d''une date
    et d''un site. Transforme une opinion en série datée.

    10. **Appel au réseau voisin** : ce que recouvrent les 2 sites restés au papier, et le coût complet
    réel de la migration, temps interne compris. Une heure, forte valeur d''information.

    11. **Point avec la direction des ressources humaines** sur le remplacement du poste informatique
    libéré en octobre. Aucune décision de migration, libre ou v4, ne tient sans cette réponse.


    ---


    ## VII. Ce qui renverserait cet avis


    - **Journaux montrant une perte uniforme sur les sept sites démarrant à la date de mars** → cause
    logicielle établie, la v4 passe en tête, sous réserve de la compatibilité bornes.

    - **Journaux ou incidents réseau montrant une concentration sur Rive-Sud corrélée à février** → la
    v4 ne corrige rien ; on reconduit et on traite le réseau, pour un coût sans commune mesure avec 31
    000 €.

    - **Comptage à Rive-Sud proche de zéro sur deux semaines** → le défaut s''est résorbé ; le dossier
    redevient un dossier de bornes vieillissantes, et seulement cela.

    - **Refus de l''éditeur de fournir les journaux ou toute forme courte** → le problème n''est plus
    technique mais contractuel, et la préparation d''une sortie devient prioritaire — avec un calendrier
    et un effectif réels, ce qui n''est pas le cas cet automne.


    ## VIII. Repli et déclencheur


    **Si, au 15 septembre, l''éditeur n''a pas confirmé par écrit une prolongation ou une reconduction
    courte**, je saisis le comité sans attendre la séance suivante et j''engage la recherche d''une solution
    de continuité pour le 1er novembre — second éditeur consulté et prise de contact opérationnelle avec
    le réseau voisin. Aucune reprise du calendrier initial sans décision expresse du comité.


    **Si le comptage de Rive-Sud est interrompu ou ne produit rien au 12 septembre**, je le signale comme
    tel plutôt que de conclure : une mesure non faite n''est pas une mesure rassurante.


    ---


    **En une phrase pour la séance :** le dossier documente sérieusement des pannes de bornes, et documente
    mal une perte de réservations que personne n''a comptée ; il faut donc acheter neuf semaines et refuser
    une signature de trois ans calée sur une remise qui expire deux jours après cette réunion.

    '
