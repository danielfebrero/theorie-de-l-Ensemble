    # Note au comité de direction — Contrat cellules 2027


    **De :** Direction des opérations · **Objet :** Choix fournisseur cellules (72 000 unités) · **Décision
    requise avant J+18**


    ## Décision proposée


    **Réserver la capacité 2027 chez Kelmar, volume complet, avant J+18.** Ne pas commander la campagne
    Vertex pour cette décision. Retirer les 230 400 € du budget 2027.


    Motif en une phrase : à 205 € par reprise, l''économie de 230 400 € est effacée dès que le taux de
    retour Sinolux dépasse **2,86 %** — et la seule mesure indépendante dont nous disposons l''établit
    à **3,1 %**.


    ## Le calcul


    | Taux de retour Sinolux | Reprises/an | Coût reprises | Avantage net vs Kelmar |

    |---|---|---|---|

    | Kelmar — 1,3 % (référence) | 936 | 191 880 € | — |

    | 1,1 % (essais Sinolux) | 792 | 162 360 € | **+259 920 €** |

    | **2,86 % (point mort)** | 2 060 | 422 280 € | **0 €** |

    | 3,1 % (audit de mars) | 2 232 | 457 560 € | **−35 280 €** |

    | 3,4 % (3,1 % + marge d''erreur) | 2 448 | 501 840 € | **−79 560 €** |


    L''économie d''achat achète 1 124 reprises supplémentaires, soit 1,56 point de taux de retour. C''est
    toute notre marge.


    **La garantie Sinolux ne comble pas l''écart.** Le remplacement gratuit couvre la cellule (22,80 €),
    pas les 89 % restants des 205 € — transport, échange, atelier, geste commercial. Même en créditant
    l''intégralité de la valeur cellule, le point mort ne remonte qu''à 3,22 %, soit 0,12 point au-dessus
    de la mesure disponible. Nous jouerions le contrat sur une marge inférieure à l''incertitude de mesure.


    ## Ce que valent réellement nos trois éléments


    Nous n''avons pas trois sources, nous en avons **deux**, dont une seule indépendante.


    - **Ferro n''est pas une confirmation.** Sa note méthodologique le dit : il travaille sur l''échantillon
    de l''audit de mars. « Environ 3 % » et « 3,1 % » sont la même mesure sur deux papiers à en-tête différents.

    - **Les 1,1 % viennent du vendeur**, sur son propre banc, sans réplication.

    - **Les 1,3 % de Kelmar sont notre propre historique**, sur notre ligne, sur quatre ans. C''est la
    donnée la plus solide du dossier, et elle porte sur l''option que nous proposons de retenir.


    **Le refus de clause est lui-même une information.** Sinolux refuse toute clause indexée sur le taux
    de retour, mais accepte de remplacer les cellules gratuitement. Il assure les 22,80 € et refuse d''assurer
    les 182,20 €. Un fournisseur convaincu de tenir 1,1 % signe une clause à 1,5 % sans hésiter : elle
    ne lui coûterait rien. Ce refus contredit son propre chiffre plus sûrement que n''importe quel audit.


    ## Pourquoi ne pas financer le test Vertex


    Le résultat Vertex arrive à J+63. La réservation Kelmar est ferme et non reportable à **J+18**. L''information
    arriverait **45 jours après** que l''option Kelmar a disparu : nous paierions 34 000 € pour apprendre,
    sans recours, ce que nous aurions dû décider. Une mesure qui ne peut modifier aucune action n''a pas
    de valeur.


    Second motif, indépendant du calendrier : la précision annoncée est de ±0,3 point, pour un écart à
    trancher de 0,24 point entre le point mort et la mesure connue. Le test ne départagerait pas les deux
    hypothèses même s''il arrivait à l''heure.


    ## L''argument contraire, dans sa version la plus forte


    L''audit de mars porte sur « une ligne comparable », pas sur la nôtre : profil de charge, cadence
    et cellule peuvent différer, et 3,1 % pourrait ne pas nous concerner. En refusant, nous renonçons
    à 230 400 € et reconduisons un fournisseur unique, ce qui dégrade durablement notre position de négociation.


    C''est réel, et c''est pourquoi je propose une qualification Sinolux en 2028 plutôt qu''un rejet définitif.
    Mais l''asymétrie tranche pour 2027 : le gain est plafonné à 260 000 €, la perte ne l''est pas — à
    4 %, elle atteint 168 000 €, et les 205 € eux-mêmes sont calibrés sur 936 reprises annuelles, pas
    sur 2 900. Au-delà, la capacité d''atelier, le stock d''échange et la charge SAV cèdent avant le budget.
    Nous ne pouvons pas observer le taux réel avant le point de non-retour ; la seule décision réversible
    est celle qui préserve la ligne Kelmar.


    ## Actions et jalons


    | Échéance | Action |

    |---|---|

    | J+3 | Dernière offre à Sinolux : prise en charge de 205 € par reprise au-delà de 1,5 %, plafonnée.
    Un refus clôt le dossier 2027 sans autre analyse. |

    | J+5 | Rencontre Kelmar. Le devis à 22,80 € est sur la table : nous demandons une contrepartie prix
    2027 et un engagement de mise en concurrence 2028. |

    | J+16 | Arbitrage final. En l''absence de clause signée : Kelmar, 72 000 unités. |

    | **J+18** | **Réservation ferme Kelmar.** |

    | J+30 | Lancement du programme de qualification seconde source pour 2028 : volume pilote négocié
    hors contrat, données terrain réelles, décision à échéance calme. |


    **Point d''arrêt observable :** suivi mensuel du taux de retour Kelmar. Au-delà de 1,8 % sur deux
    mois consécutifs, la comparaison est rouverte immédiatement.


    ## Point budgétaire


    Les 230 400 € ont été inscrits au budget avant que la décision ne soit prise. Cette inscription n''est
    pas un élément de preuve, et l''urgence qu''elle crée n''est pas une urgence industrielle. Je demande
    sa reprise. Le calendrier contraignant est celui de Kelmar à J+18 ; la semaine réclamée par la direction
    financière n''ajoute rien.


    ---


    Trois points sur lesquels je peux détailler si le comité les conteste : le point mort de 2,86 % (dérivé
    de 230 400 € ÷ 205 € = 1 124 reprises, soit 1,56 pt au-dessus des 1,3 % de Kelmar), le traitement
    de Ferro comme non-indépendant, et l''hypothèse que les 205 € restent valables à fort volume de reprises
    — je pense qu''ils ne le sont pas, ce qui rend le scénario Sinolux plus mauvais que le tableau ne
    l''indique.

    '
