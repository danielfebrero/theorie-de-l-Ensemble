  text: '---


    # NOTE AU COMITÉ DE DIRECTION

    **Migration du prestataire de paiement — recommandation**

    Direction des opérations · Vireo · 14 août 2026


    > **Je recommande l''option B — bascule progressive — mais pas le calendrier B du dossier.** Le B
    présenté place les paliers 50 % et 100 % en plein pic de décembre, ce qui annule son seul intérêt.
    Calendrier corrigé : 10 % du trafic au 3 novembre, **gel absolu pendant tout le pic**, décision définitive
    le 9 janvier, montée en janvier–février, clôture Solda le 28 février.


    ### Ce que coûte cette recommandation

    Écart affiché A / B la première année : **190 k€** (500 vs 310). À partir de l''an 2, les deux options
    rapportent 500 k€/an. Nous achetons une assurance ponctuelle, pas une perte structurelle.


    **À confirmer par la DAF avant vendredi :** les 310 k€ intègrent-ils la prolongation Solda (130 k€/mois
    × 3 = **390 k€**) ? Si non, B est à −80 k€ la première année et l''écart réel monte à 580 k€. Cela
    ne change pas la recommandation, mais le comité doit voter sur le bon chiffre.


    ### Pourquoi pas A

    Le rodage nominal ne disqualifie pas A. Sur la base du pilote (1,3 % d''échec trois semaines, contre
    0,4 % chez Solda) : 0,9 pt × 21 j × 756 k€ de flux quotidien = **143 k€ de GMV échouée, ~71 k€ nets**
    après retentative. C''est moins que les 190 k€ d''écart. **En scénario nominal, A gagne.** Je le dis
    clairement.


    A perd sur le non-nominal, et sur un point unique : l''irréversibilité.


    | Événement | Sous A | Sous B (10 %) |

    |---|---:|---:|

    | Panne de 4 h le vendredi noir | ~190 k€ nets | ~19 k€ nets |

    | Délai de réaction disponible | aucun | < 15 min |

    | Surcoût de rodage | ~71 k€ | ~7 k€ |

    | **Perte maximale bornée ?** | **non** | **oui** |


    Une panne de quatre heures est **contractuellement autorisée** : 99,9 % de disponibilité laisse 8
    h 45 d''indisponibilité par an, sans faute ni compensation. Une seule occurrence au mauvais moment
    efface tout l''avantage d''A. Et sous A, la réponse est : aucune. Compte Solda clos, retour à six
    semaines, recollecte des empreintes de 2,1 millions de clients. Le mode de défaillance maximal n''est
    plus en centaines de milliers d''euros mais en **millions**.


    Nous payons jusqu''à 580 k€ pour conserver, sur la seule saison qui compte, un droit de retrait que
    A détruit le 3 novembre.


    ### Le meilleur argument contre moi

    « B dépense 190 à 580 k€ certains pour couvrir un risque d''espérance plus faible. » Juste en logique
    d''espérance — et faux ici : l''espérance vaut pour un pari répétable. Le pic arrive une fois, l''erreur
    n''est pas rattrapable dans la saison. Second argument : « B étale l''exposition sur dix semaines
    au lieu de trois. » Exact, mais sur 10 % du trafic et hors pic.


    ### Ce qu''on fait lundi 17 août

    1. **Notifier Solda par écrit** l''activation de la prolongation mois le mois. Sans cette lettre avant
    le 15 octobre, le compte ferme au 30 novembre et B devient impossible : **seule décision du dossier
    qui devient irréversible par simple inaction.** Négocier un préavis mensuel de 30 j.

    2. **Rouvrir la négociation Payflux** : (a) faire courir la fenêtre de sortie sans pénalité *à compter
    de la mise en production* et la porter à 120 jours — sinon les 90 jours expirent avant que nous ayons
    vu Payflux tenir un pic ; (b) engagement sur un taux d''échec ≤ 0,45 % après rodage, sortie sans pénalité
    à défaut. Cette clause vaut ~138 k€ nets **par an** (0,1 pt = 276 k€ de GMV annuelle).

    3. **Transférer les jetons en copie, pas en migration destructive.** Confirmer auprès de Solda que
    le compte reste ouvert après transfert.

    4. **Câbler les seuils de rebascule** dans le tableau de bord et le protocole d''astreinte.


    ### Calendrier

    | | |

    |---|---|

    | 3 novembre | 10 % du trafic sur Payflux |

    | 20 nov – 5 janvier | **Gel de tout palier, sans exception.** Observation du pic à 10 % |

    | 9 janvier | **Go / no-go**, avant expiration de la fenêtre sans pénalité |

    | 12 janv → 9 févr | Si go : 25 %, 50 %, 100 % |

    | 28 février | Clôture Solda. Limite écrite, non reconductible |


    No-go le 9 janvier : sortie Payflux sans pénalité, Solda jusqu''au 28 février, appel d''offres relancé
    le jour même. Fenêtre étroite — c''est le prix du plan, et il est assumé.


    ### Seuils d''arrêt observables

    - **Rebascule immédiate à 100 % Solda par l''astreinte, sans validation hiérarchique** si : échec
    Payflux > 1,5 % sur 30 min glissantes, *ou* indisponibilité > 10 min, *ou* latence > 2× la référence
    Solda sur 30 min.

    - **Palier suivant** seulement si, sur 7 jours pleins : échec ≤ 0,6 %, aucun incident > 15 min, réconciliation
    à 100 %. Validation nominative : directeur des opérations.

    - **Limite de mesure assumée :** à 1 800 transactions/jour, une dérive au-delà de 1 % est visible
    en 48 h, mais un écart de 0,1 pt demande ~trois semaines. Le palier 10 % détecte les défaillances
    ; il ne mesure pas finement la performance — cela viendra au palier 50 %, en janvier.


    *Hypothèses : 756 k€ de flux quotidien, ~276 M€ annuels ; 50 % des paiements échoués récupérés par
    retentative ; vendredi noir estimé à 3× une journée moyenne. Chiffres de rodage issus du pilote Payflux
    — non mesuré en période de pic.*


    ---


    Trois points sur lesquels j''ai tranché à votre place, à corriger si vous n''êtes pas d''accord :


    - **Le taux de récupération par retentative (50 %)** conditionne tous les montants nets. Si votre
    supervision a la vraie valeur, elle prime sur mon hypothèse — mais elle devrait déplacer A et B dans
    le même sens, pas changer le classement.

    - **Le calendrier B du dossier est défectueux**, pas seulement sous-optimal : tel qu''écrit, il fait
    monter à 50 % et 100 % pendant le pic, c''est-à-dire qu''il paie le double run sans acheter la protection.
    J''ai réécrit plutôt que rejeté.

    - **La fenêtre de 90 jours est probablement déjà perdue** si l''intégration Payflux demande six semaines
    : signature vers le 20 septembre = gratuité jusqu''au 19 décembre, avant la fin du pic. D''où le point
    2 des actions de lundi — c''est le vrai point de négociation, et sans lui le repli de janvier coûte
    240 k€ au lieu de zéro.

    '
