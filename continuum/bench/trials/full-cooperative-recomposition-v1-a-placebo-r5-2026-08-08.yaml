response:
  text: '## Position que je propose de rendre jeudi


    D''abord une chose que je dirai en séance, et à la presse : **le partage n''est pas « les paysans
    ou les robinets ». 410 L/s ne peuvent pas en donner 570, quelle que soit l''arbitrage.** Ce que je
    peux changer, ce n''est pas le volume : c''est (1) ce qui se perd avant d''arriver au champ ou au
    robinet, (2) la manière dont le manque se répartit dans l''espace, (3) la vitesse à laquelle on fait
    entrer de l''eau et de l''argent de l''extérieur. Ma proposition ne joue que sur ces trois leviers,
    parce qu''il n''y en a pas d''autres.


    ### 1. Répartition proposée (arrêté de 3 semaines, pas de 8)


    | Usage | Demande | Proposition immédiate | Statut |

    |---|---|---|---|

    | Débit réservé aval | 180 L/s | **180 L/s** | Obligation légale + perte irréversible. Non négociable.
    |

    | AEP Ferney | 150 L/s | **150 L/s garantis 10 jours**, puis trajectoire conditionnée à l''audit |
    Service garanti ; volume à justifier |

    | Maraîchage | 240 L/s | **80 L/s**, concentrés (voir §3) | Arithmétique résiduelle |


    Trois semaines, pas huit : l''horizon météo est de trois semaines, et décider aujourd''hui pour huit,
    c''est verrouiller sous incertitude maximale. Révision au 10ᵉ jour sur données auditées.


    ### 2. Pourquoi cette hiérarchie, et pas une autre


    Elle ne repose pas sur une préférence, mais sur deux critères que je peux défendre devant n''importe
    qui :


    - **Réversibilité.** La perte maraîchère est de 4,1 M€ et 90 emplois : catastrophique, mais d''une
    saison, et partiellement compensable en argent. La perte des frayères est qualifiée de non reconstituable
    à l''échelle d''une décennie par le rapport du 12 juin. On ne rachète pas une frayère. Entre deux
    dommages, celui qui se répare passe après celui qui ne se répare pas.

    - **Légalité.** Le débit réservé est fixé par arrêté préfectoral (L.214-18) ; l''AEP est prioritaire
    par la loi (L.211-1 : santé, salubrité, sécurité civile, eau potable). La CLE n''a pas le pouvoir
    d''y déroger, et le rapport du 12 juin rendrait toute dérogation juridiquement très fragile. Je n''arbitre
    que sur le solde.


    **Il faut le dire aux maraîchers sans détour : l''alternative à ma proposition n''est pas 240 L/s,
    c''est l''arrêté de crise.** Au franchissement du seuil de crise, le cadre préfectoral suspend les
    prélèvements non prioritaires — c''est-à-dire l''irrigation, à zéro. 80 L/s négociés valent mieux
    que 0 L/s subis.


    ### 3. Le levier qui change tout côté agricole : concentrer, pas répartir


    240 L/s sur 620 ha ≈ 0,39 L/s/ha. À 80 L/s, un partage uniforme donne 33 % de la dose à tout le monde.


    **C''est le pire scénario pour les maraîchers eux-mêmes.** Le rendement légumier n''est pas linéaire
    : sous un seuil, on obtient un produit non commercialisable — on perd l''eau *et* la récolte, sur
    620 ha. Concentrer 80 L/s sur ~205 ha à dose pleine, c''est sauver une récolte entière sur ce tiers.
    Avec les litres récupérés au §4, on monte à ~310 ha, soit la moitié de la surface **sauvée à 100 %**
    plutôt que la totalité perdue à 33 %.


    Je ne choisis pas les parcelles. Je fixe le plafond de volume ; les 34 exploitations répartissent
    entre elles sous 7 jours (via l''ASA/l''organisme unique). Passé ce délai, une règle par défaut au
    prorata des références historiques s''applique — c''est ce délai qui rend l''accord possible. Contrepartie
    non négociable : **compteurs individuels sur les 34 prises**. Sans comptage, la dotation n''est pas
    opposable et les honnêtes paient pour les autres.


    ### 4. Là où il y a réellement des litres à trouver


    Par ordre de rendement décroissant. Le premier point est de loin le plus important du dossier.


    **a) Le rejet de la STEP de Ferney — à vérifier sous 72 h.** Un réseau AEP restitue 70-80 % de son
    prélèvement par la station d''épuration. Si le rejet est situé **en amont du point de contrôle du
    débit réservé**, alors les 150 L/s ne coûtent à la rivière que 45-60 L/s nets, et non 150. Gain potentiel
    : **jusqu''à ~90 L/s**, soit près de 2,2 M€ de récolte. Si le rejet est en aval du point de contrôle,
    il faut regarder où sont les deux frayères : si elles sont en aval du rejet, on peut demander au préfet
    de déplacer le point de conformité, et l''argument est solide puisque l''intérêt écologique protégé
    est bien couvert. Si les frayères sont entre le barrage et le rejet, ce levier vaut zéro. **Ça se
    tranche avec une carte et le rapport du 12 juin, en trois jours.** C''est la première chose à faire
    lundi matin.


    **b) Rendement du réseau AEP.** Un réseau de cette taille perd typiquement 20 %, soit ~30 L/s. Une
    sectorisation + campagne de recherche nocturne récupère 20-40 % des fuites en 3 semaines : **6 à 12
    L/s**.


    **c) Arrêté de restriction des usages non essentiels** (arrosage, piscines, lavage, espaces verts
    communaux, nettoyage de voirie) : 10-15 % de la demande estivale.


    **d) Irrigation de nuit obligatoire (21 h – 7 h)** : 20-25 % de pertes évaporatives en moins sur l''aspersion,
    à effet agronomique égal. Ce n''est pas gratuit — ça désorganise le travail — et ça doit être accompagné.


    ### 5. Les 600 000 € : acheter des litres et de la sécurité, pas compenser


    600 k€ face à 4,1 M€ ne compensent rien — 15 % d''une perte, c''est perçu comme une aumône et ça n''achète
    aucun mètre cube. **Le fonds départemental est l''argent rapide (15 jours) ; la compensation viendra
    de l''argent lent et gros** : calamité agricole / ISN, dégrèvement de TFNB, aides Agence de l''eau.
    La CLE porte formellement ces dossiers, c''est mon engagement écrit.


    | Poste | Montant |

    |---|---|

    | Sécurisation AEP : interconnexion ou forage de secours + contrat citernes pré-signé pour l''EHPAD
    | 150 k€ |

    | Métrologie : réétalonnage de Sarcelle, station de contrôle au point DR, 34 compteurs | 60 k€ |

    | Recherche de fuites régie | 70 k€ |

    | Rachat d''arrêt d''irrigation ciblé (~900 €/ha sur les parcelles mises en pause) | 280 k€ |

    | Pilotage : goutte-à-goutte mobile, sondes tensiométriques | 20 k€ |

    | Réserve d''ajustement | 20 k€ |


    ### 6. Le chiffre sur lequel tout repose n''est pas fiable


    **J''arbitre 570 L/s de demandes sur la foi d''un capteur unique étalonné il y a trois ans.** Une
    dérive de 10 % vaut 41 L/s — un quart du déficit. Si la station lit haut, le débit réservé est déjà
    violé sans que personne ne le sache. Réétalonnage par jaugeage sous 8 jours, station de contrôle au
    point de conformité, et d''ici là marge de précaution.


    Et je demande la même exigence aux trois parties, parce que c''est ce qui rend la présidence légitime
    :

    - **410** vient d''un capteur non étalonné.

    - **240** est une demande déclarée par celui qui en bénéficie ; elle correspond à 3,3 mm/j sur 620
    ha à efficience actuelle — pas un besoin agronomique minimal audité.

    - **150** correspond à **1 409 L/habitant/jour** pour 9 200 habitants, soit environ neuf fois la moyenne
    domestique française. Ce chiffre a sûrement une explication — périmètre plus large que Ferney, industriel,
    ou rendement de réseau — mais elle n''est pas au dossier, et je la demande sous 10 jours.

    - **180** est le seul des quatre à être à la fois une obligation juridique et un seuil documenté par
    une étude contradictoire.


    Ce n''est pas un procès fait à qui que ce soit. C''est que **le « déficit de 160 L/s » est une soustraction
    entre des chiffres qui n''ont pas été établis sur la même base.** Tant qu''ils ne le sont pas, tout
    arbitrage est arbitraire — et attaquable.


    ### 7. Déclencheurs écrits maintenant, pas improvisés


    | Débit entrant | Maraîchage | AEP | DR |

    |---|---|---|---|

    | ≥ 410 L/s | 80 L/s concentrés | 150 puis trajectoire | 180 |

    | ~350 L/s | ~20 L/s (survie des cultures pérennes/haute valeur) | usage essentiel | 180 |

    | < 300 L/s | 0 | essentiel, sécurisé par citernes/interconnexion | 180, **sans dérogation** |

    | Retour de pluie | rouvert en premier | — | — |


    Ma position, écrite d''avance : **même à 300 L/s, pas de dérogation au débit réservé** — parce qu''à
    ce stade la variable d''ajustement doit être l''eau qu''on fait venir de l''extérieur pour Ferney,
    pas la frayère qu''on ne refera pas. Valeurs de seuils à recaler après réétalonnage.


    ### 8. Ce que je dis à chacun


    **Aux maraîchers** (je leur envoie ces chiffres avant jeudi et je propose un bilatéral mardi) : quitter
    la salle n''a pas fait remonter le débit, et la décision se prendra avec ou sans vous — je préfère
    avec. Je ne vous offre pas 33 % de votre eau : je vous offre 100 % de votre eau sur la moitié de la
    surface, ce qui sauve davantage qu''un partage uniforme. Vous choisissez les parcelles. Et je le dis
    franchement : même si tout fonctionne, **cette proposition vous coûte environ 2 M€ et 45 emplois.**
    Je ne prétendrai pas le contraire.


    **À la régie** : votre blocage ne porte pas sur 150 L/s, il porte sur vos 4 jours de réserve — et
    vous avez raison, un incident de pompe ou de turbidité, et c''est une urgence sanitaire dans un EHPAD
    de 110 lits. Donc je traite ça en premier, avec 150 k€ et sans contrepartie. **Ce que je garantis,
    c''est votre service, pas votre volume.** La priorité légale couvre la santé et la boisson ; elle
    ne couvre ni les fuites de réseau ni l''arrosage des espaces verts communaux. Le service sécurisé,
    le chiffre redevient discutable.


    **Au préfet, aux services de l''État et aux associations** : 180 L/s tenus, et vérifiés — pas supposés
    — par une station au point de conformité. C''est le seul poste du dossier que je refuse d''ouvrir.


    ### 9. Ce que je ne sais pas, et qui changerait ma position


    La position de l''exutoire de la STEP et des deux frayères (jusqu''à ~90 L/s en jeu, soit la différence
    entre 205 et 543 ha sauvés) ; la dérive réelle de Sarcelle ; le périmètre et le rendement réels des
    150 L/s ; l''assolement et les systèmes d''irrigation des 620 ha ; et si les 4,1 M€ sont un produit
    brut ou une perte nette — ce qui change complètement le calibrage du rachat de dotation. Ces cinq
    questions partent lundi ; les réponses sont attendues pour la révision du 10ᵉ jour.


    ---


    Si vous voulez, je peux mettre ça en note de synthèse de 2 pages pour l''envoi préalable aux membres,
    plus une version courte d''une page pour la presse locale — c''est le format qui reprend la main sur
    le cadrage « paysans contre robinets ».

    '
