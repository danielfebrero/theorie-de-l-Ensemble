response:
  text: 'Les trois lignes, à recopier telles quelles (ASCII sans accents, les GTC les mangent souvent)
    :


    ```

    B2 MARCHE JUSQU''A MON RETOUR 6H40 - gaz seuls 5MW ne tiennent pas (-14C a 4H). Roue Nantes commandee
    ce soir 21h45.

    Vib. tirage B2 relevee toutes les 30min. SI >=12,0 mm/s OU bruit/choc: ARRET B2, 2 gaz a fond, PAS
    de redemarrage.

    Si arret B2: noter l''heure, T depart maxi, brider debut de reseau, priorite hopital+EHPAD >40C, appel
    astreinte cadre.

    ```


    115 / 113 / 118 caractères.


    **Pourquoi ce choix**


    - Arrêter B2 maintenant, c''est garantir 14 h de gaz seul dont le pic à −14 h — donc l''hôpital et
    l''EHPAD de bout de réseau sous 40 °C pendant la nuit la plus froide. La panne, elle, n''est qu''une
    probabilité. On ne troque pas un risque contre une certitude au moment le plus défavorable.

    - Le cycle de 9 h de repos me ramène à 6 h 40, avant que la question de l''arrêt programmé se pose
    vraiment. Les techniciens n''ont donc à couvrir que la nuit : tenir, surveiller, et savoir quoi faire
    si ça lâche. La décision d''arrêt volontaire, température extérieure remontée et roue disponible,
    je la prends à la reprise.

    - Je commande la roue avant de partir, ce soir. Ça ne coûte rien, ça n''engage pas l''arrêt, et ça
    met les 14 h en route au plus tôt quel que soit le scénario. C''est la seule action que je fais moi-même
    maintenant.

    - Le seuil de 12 mm/s est celui du constructeur : il reste le déclencheur, sans interprétation ni
    arbitrage demandé aux techniciens. « Pas de redémarrage » est explicite parce que c''est le geste
    réflexe qui transformerait 14 h d''indisponibilité en 9 jours.

    - Le surcoût gaz (3 200 € contre 900 €) n''entre pas dans la décision et n''a pas sa place sur trois
    lignes : à −14 °C avec un hôpital en bout de réseau, ce n''est pas la variable.


    Ce que ces trois lignes ne disent pas, faute de place : prévenir l''hôpital et l''EHPAD en cas d''arrêt.
    Je passe les deux appels de courtoisie moi-même avant de partir pour les mettre en pré-alerte, et
    je le dis de vive voix aux techniciens à la relève — l''oral complète la main courante, il ne la remplace
    pas.

    '
