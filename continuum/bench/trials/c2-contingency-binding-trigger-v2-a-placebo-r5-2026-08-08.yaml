response:
  text: '# NOTE AU COMITÉ DE DIRECTION — VIREO

    **Prestataire de paiement : arbitrage Solda / Payflux**

    *Direction des opérations · Comité du vendredi 14 août 2026*


    > **Recommandation : option B** — bascule progressive, gelée à 50/50 pendant le pic, achevée en janvier.
    Nous renonçons volontairement à 320 k€ de gain immédiat pour ne pas jouer décembre sur un prestataire
    de quatre semaines sans retour arrière.


    ### 1. Ce qui tranche — et ce qui ne tranche pas

    L''écart affiché entre A et B est de **190 k€** (500 contre 310). Ce n''est pas ce chiffre qui doit
    décider. Au pic, une heure de trafic vaut ~**227 k€** de volume d''affaires. **190 k€, c''est 50 minutes
    d''indisponibilité un vendredi noir.** Payflux garantit 99,9 % : son propre contrat l''autorise à
    être indisponible 43 minutes par mois. L''avantage de A est effacé par une panne plus courte que ce
    que le prestataire s''engage à ne pas dépasser.


    ### 2. Pourquoi A est un pari à sens unique

    - **La zone de turbulence touche le pic.** Le pilote mesure 1,3 % d''échec les 3 premières semaines.
    Bascule le 3 novembre → turbulence jusqu''au 24, trois jours avant le vendredi noir. Zéro marge. Sur
    100 % du trafic : **143 k€** d''échecs supplémentaires ; sur les paliers 10-25-50 % : **40 k€**. La
    moitié de l''écart est déjà consommée ici.

    - **Décembre sans filet.** Solda ferme le 30 novembre. Le mois le plus lourd tourne sur un prestataire
    de 4 semaines, sans retour : rouvrir, c''est 6 semaines *et* recollecter les empreintes de 2,1 M de
    clients. Risque de rupture d''encaissement, pas risque à 190 k€.


    ### 3. Calendrier

    | Date | Action |

    |---|---|

    | **Lun. 17 août** | **Préavis écrit à Solda** : prolongation mensuelle déc.–fév., sortie mensuelle
    |

    | 15 sept. | Signature Payflux → sortie sans pénalité jusqu''au 14 décembre |

    | 28 sept. / 12 oct. / 26 oct. | 10 % → 25 % → 50 % |

    | **13 nov. – 31 déc.** | **Gel à 50/50.** Deux comptes ouverts, redirection en 15 min |

    | 15 déc. | Go/no-go sur données de pic réelles, *encore sans pénalité* |

    | 4 janv. | 100 % Payflux, Solda en repli |

    | 31 janv. | Fermeture Solda — **butoir absolu : 28 février** |


    Palier franchi seulement si échec ≤ 0,6 % sur 5 jours consécutifs et latence stable.


    Le gel à 50/50 n''est pas qu''une assurance : Solda monte à 0,9 % le vendredi noir, Payflux stabilisé
    est à 0,5 % — le mélange donne **0,7 %**, meilleur que l''un ou l''autre seul. Et un repli qu''on
    n''a pas exercé n''est pas un repli : à 50/50 les deux chaînes tournent en charge réelle jusqu''à
    la veille du pic.


    ### 4. Ce que cela coûte, dit franchement

    Gain B : +310 k€ · Prolongation Solda décembre : −130 k€ · **Net année 1 ≈ +180 k€**, puis **+500
    k€/an**. Janvier en prolongation coûterait 130 k€ de plus — décidé le 20 décembre sur données, pas
    aujourd''hui. Les 320 k€ d''écart avec A ≈ 1 h 25 d''incident au pic, durée que le SLA autorise.


    ### 5. Deux réserves (valables quelle que soit l''option)

    - **Le gain de 500 k€ est surévalué.** Payflux stabilisé est à 0,5 % contre 0,4 % pour Solda : ces
    0,1 pt = **276 k€/an** de volume d''affaires, dont ~la moitié récupérée en relance. Gain réel plus
    proche de **360 k€**. Cela ne change pas l''arbitrage, mais cela change le chiffre annoncé.

    - **Exiger un SLA chiffré sur le taux d''échec, avec pénalités** — pas seulement sur la disponibilité.
    Un prestataire à 99,9 % de dispo et 1,3 % d''échec est contractuellement irréprochable et commercialement
    ruineux.


    ### 6. Ce qu''on fait lundi

    1. **Préavis à Solda, lundi matin.** Seule action contrainte : après le 15 octobre, le compte ferme
    le 30 novembre et l''option B cesse d''exister.

    2. **Négociation Payflux** : SLA taux d''échec avec pénalités, signature au 15 septembre, confirmation
    écrite que les 90 jours courent depuis la signature.

    3. **Lancer le transfert des 2,1 M de jetons** — réversible tant que Solda reste ouvert ; à ne jamais
    confondre avec la fermeture, qui ne l''est pas.

    4. **Armer l''astreinte** pour le régime bi-prestataire, avec exercice à blanc de la bascule avant
    le 13 novembre.


    ---


    Trois points de méthode, hors note :


    - **Le levier réel n''est pas le 30 novembre, c''est le 15 octobre.** Le dossier présente A et B comme
    un choix à faire vendredi ; en réalité, ne rien faire avant le 15 octobre supprime l''option B et
    impose A par défaut. C''est pour ça que le préavis passe lundi.

    - **J''ai modifié B sur un point.** B tel que rédigé finit à 100 % avant le 30 novembre, ce qui remet
    le pic sur un prestataire seul — le défaut principal de A. Le gel à 50/50 corrige ça, au prix des
    130 k€ de décembre.

    - **Deux chiffres sont des hypothèses, signalées en pied de note** : le volume de pic (3× le courant,
    10 % de la journée sur l''heure de pointe) et la récupération en relance à 50 %. Le premier mérite
    d''être recalé sur l''historique du vendredi noir avant vendredi — s''il est plus élevé, il renforce
    la recommandation.

    '
