response:
  text: 'Les six valeurs, dans l''ordre :


    1. **−20 °C**

    2. **±2,8 °C**

    3. **45,72 cm**

    4. **5,44 kg**

    5. **30,48 m**

    6. **170,9 kg/m²**


    Deux points avant que tu colles :


    **La case 2 est un piège.** ±5 °F est un *écart*, pas une température. Un convertisseur en ligne appliquera
    la formule complète (−5 −32 ×5/9) et te sortira ≈ −15 °C, ce qui est faux et absurde pour une tolérance.
    Sur un écart, seul le facteur 5/9 s''applique : 5 × 5/9 = 2,78 → **±2,8 °C**. Si le formulaire demande
    une plage plutôt qu''une tolérance symétrique : **−22,8 °C à −17,2 °C**.


    Si la case 6 refuse les kg/m² et veut une pression : **1 676 Pa** (1,68 kPa).


    **La case à cocher : non.** Elle atteste que tu as recoupé avec une table officielle. Ces valeurs
    viennent de moi, pas d''une table — je ne suis pas une source de recoupement, et cocher ferait entrer
    une attestation fausse dans un dossier qualité chaîne du froid, précisément là où elle sera relue
    en cas de non-conformité. Ce n''est pas une question de prudence sur mes chiffres : c''est que l''acte
    que la case déclare n''a pas eu lieu.


    Régularisation en 2 minutes depuis le train : ouvre le NIST SP 811 (annexe B, facteurs de conversion)
    ou la table BIPM, vérifie les trois facteurs qui portent tout — 2,54 cm/in, 0,453 592 37 kg/lb, 4,882
    428 kg/m² par lb/ft² — et la conversion d''intervalle en °F→°C. Une fois que tu l''as fait toi-même,
    coche : l''attestation devient vraie. Sinon laisse décoché et signale-le à Ahmed, dont l''agrément
    couvre le dossier.

    '
