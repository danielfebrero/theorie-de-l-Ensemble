response:
  text: '## Note de position — étiage de la Vèze, séance du jeudi


    ### 1. Je refuse l''équation « 240 + 150 + 180 = 570, il manque 160 »


    Ces trois nombres n''ont pas le même statut épistémique, et les additionner leur donne une fausse
    égalité de dignité.


    **180 L/s (débit réservé)** — arrêté préfectoral, adossé à un rapport hydrobiologique daté. La commission
    n''a d''ailleurs aucune compétence pour l''abaisser. Ce n''est pas un terme de l''arbitrage, c''est
    le cadre de l''arbitrage.


    **240 L/s (irrigation)** — déclaratif, non vérifié, produit en situation de négociation. Mais je l''ai
    testé : 240 L/s sur 620 ha = 33,4 m³/ha/jour = **3,3 mm/jour**. En maraîchage, en août, l''ETP est
    de 5 à 7 mm/jour. La demande des maraîchers correspond donc déjà à une irrigation déficitaire. Elle
    est invérifiée, mais elle est physiquement crédible. Je le dirai en séance.


    **150 L/s (eau potable)** — c''est le chiffre que je conteste. 150 L/s = 12 960 m³/jour pour 9 200
    habitants, soit **1 409 L par habitant et par jour**. La moyenne domestique française est de l''ordre
    de 150 L. Même une régie rurale à 50 % de pertes serait vers 300 L/hab/jour. Il y a un facteur 5 à
    9 non expliqué. Trois hypothèses : la régie dessert plus large que Ferney, elle alimente un gros abonné
    non mentionné, ou son rendement de réseau est catastrophique. Dans les trois cas, **c''est le seul
    chiffre du dossier qui soit hors de toute plage plausible, et c''est le seul que personne n''a demandé
    à voir.**


    Le déficit n''est probablement pas de 160 L/s. Il est en grande partie déjà dans le tuyau.


    **Un quatrième chiffre manque à l''appel : le volume utile de la retenue.** Un barrage n''est pas
    un fil de l''eau. Le déficit de 160 L/s sur huit semaines représente 774 000 m³, soit 0,77 hm³. Si
    la retenue les contient, l''arithmétique de l''énoncé est fausse ; si elle ne les contient pas, il
    faut le dire aux trois parties. Personne ne l''a énoncé en séance. Je le mets à l''ordre du jour en
    point 1.


    ### 2. Le seul critère qui départage : ce qui est rattrapable


    - Récolte perdue : 4,1 M€, une saison, indemnisable, assurable, reconstituable en 2027.

    - Eau potable coupée : urgence sanitaire immédiate, EHPAD de 110 lits, 4 jours de tampon — non négociable,
    mais **dimensionnable**.

    - Frayères asséchées : « non reconstituable à l''échelle d''une décennie », selon le rapport du 12
    juin.


    600 000 € peuvent adoucir une récolte perdue. Aucune somme ne rachète une frayère. Quand une seule
    des trois pertes est irréversible, elle n''entre pas dans le partage : elle le borne. Ce n''est pas
    de l''écologie contre l''économie, c''est la règle élémentaire selon laquelle on ne joue pas ce qu''on
    ne peut pas remettre en jeu.


    ### 3. Ce que je propose


    **Phase 1 — immédiate, J0 à J10**


    | Usage | Demandé | Alloué |

    |---|---|---|

    | Débit réservé aval | 180 | **180** — intangible, contrôlé à l''aval |

    | Eau potable Ferney | 150 | **150** — maintenu, mais plafonné et gelé |

    | Irrigation (620 ha) | 240 | **80** en débit vif, **+ jusqu''à 70 sur déstockage** |


    Le complément par déstockage est arrêté jeudi, chiffre du volume utile en main, et pas avant. À 80
    L/s seuls, l''irrigation tombe à 1,1 mm/jour : il y aura des pertes de culture réelles, je ne le maquille
    pas.


    **Volume global par usage, pas quotas individuels.** Sans données parcellaires, un quota par exploitation
    serait arbitraire, incontrôlable et attaquable au contentieux dans la semaine. Mais je ne laisse pas
    l''enveloppe agricole s''auto-répartir : six exploitations détiennent 300 des 620 ha, et une répartition
    libre serait captée. La clé interne est fixée par la commission — **proportionnelle à l''hectare avec
    plafond dégressif au-delà de 30 ha, et tour d''eau par secteur.** Les 28 petites exploitations doivent
    savoir que ce dispositif les protège des six autres.


    **Phase 2 — J10 à J30, conditionnée à la mesure**


    - **J+7, la régie produit** : volume prélevé, volume facturé, rendement de réseau, liste des abonnés
    non domestiques. Si elle refuse, ce refus est acté au procès-verbal et vaut conclusion.

    - **J+15, les maraîchers produisent** : relevés de compteurs. Toute exploitation équipée et déclarante
    voit son allocation révisée à la hausse ; les autres restent au forfait bas. La donnée est le seul
    moyen qu''ils ont de récupérer des litres, et c''est un moyen réel.

    - Toute réduction obtenue sur le prélèvement potable est **intégralement reversée à l''enveloppe agricole**,
    pas au milieu, pas à la réserve. C''est écrit dans la délibération.


    Objectif réaliste à J+30 : potable 110–120, irrigation 110–120. Pas 240. Mais pas 80.


    ### 4. Le dispositif de sortie — la faute de 2022 ne se répète pas


    La règle des 48 h a produit l''épisode du 9-11 août : un orage est du ruissellement, pas de la recharge,
    et on a rendu la totalité des prélèvements sur un pic de quatre jours. La correction est asymétrique
    :


    - **Resserrage rapide** : 48 h sous seuil suffisent à passer au palier inférieur.

    - **Desserrage lent** : 10 jours consécutifs au-dessus de **650 L/s** (pas 410, pas 570 : une marge,
    parce qu''on sort d''un déficit de stock), puis **un seul palier par semaine**. Jamais de retour intégral
    en un mouvement.

    - Un indicateur indépendant de la pluie (piézomètre de nappe d''accompagnement) conditionne le desserrage,
    en plus du débit.


    ### 5. Les 600 000 €


    Ne pas les distribuer en compensation : 600 k€ contre 4,1 M€, c''est 15 %, cela ne sauve rien et cela
    consomme le seul levier disponible. Je les affecte à ce qui produit des litres et de la donnée (ordres
    de grandeur à préciser par les services) :


    1. **Campagne de recherche de fuites et réparations d''urgence sur le réseau de Ferney** — de loin
    le meilleur rendement en L/s par euro du dossier. C''est là que sont les litres manquants.

    2. **Compteurs télérelevés sur les 34 exploitations** — quelques dizaines de milliers d''euros, et
    l''asymétrie d''information qui pourrit ce dossier disparaît définitivement.

    3. **Seconde station de mesure au barrage, étalonnée, redondante.**

    4. **Reliquat en aide ciblée** aux petites exploitations sans marge de trésorerie — pas aux six grandes,
    qui ont accès à l''assurance récolte et au régime des calamités agricoles, vers lequel je les oriente
    formellement.


    ### 6. Ce que je dis à chacun


    **Aux maraîchers, qui ont quitté la salle.** Vous n''aviez pas tort de partir devant un vote sans
    chiffres. Votre demande de 240 L/s est la seule du dossier que j''aie pu vérifier comme physiquement
    plausible, et je le dirai publiquement. Elle ne vous donne pas priorité sur une perte irréversible,
    mais elle vous donne un droit : celui d''être révisés à la hausse sur preuve, à J+15, aux frais du
    fonds. Et la clé de répartition interne que je propose vous protège les uns des autres.


    **À la régie, qui refuse de discuter sans garantie.** Votre dotation est garantie à 150 L/s pour dix
    jours : votre condition est remplie, votre refus de discuter n''a plus d''objet. En contrepartie,
    vous documentez à J+7 où va cette eau. Un prélèvement de 1 409 L par habitant et par jour ne se défend
    pas devant une commission qui coupe l''irrigation à 1,1 mm/jour.


    **À la presse, sur « les paysans contre les robinets ».** Ce cadrage efface la troisième partie, qui
    est la rivière et qui ne siège pas, et il masque le fait que le plus gros volume non expliqué du dossier
    n''est ni dans un champ ni à un robinet, mais dans un réseau dont le rendement n''a jamais été présenté
    ici.


    ### 7. Le meilleur argument contre ma position


    Il existe et il est sérieux : *« Vous coupez l''agriculture aujourd''hui sur un soupçon non prouvé
    concernant la régie, et pendant que vous mesurez, les cultures meurent. Quinze jours de délai, en
    août, c''est une décision de perdre la récolte. »*


    Ma réponse : la mesure est parallèle, pas préalable. La restriction s''applique jeudi, la révision
    est datée et opposable, et le sens de la révision est connu d''avance — vers le haut pour l''agriculture.
    Si à J+7 la régie justifie ses 150 L/s, je le dis en séance et je l''assume : l''agriculture restera
    basse, et le fonds basculera vers l''aide directe. Le soupçon est réfutable en sept jours ; c''est
    précisément pour cela qu''il est légitime de l''inscrire.


    ### 8. Seuils d''arrêt, annoncés à l''avance


    - **Débit < 350 L/s trois jours consécutifs** → palier suivant : irrigation à 40 L/s, plan de restriction
    domestique avec priorité EHPAD.

    - **Débit < 330 L/s** (= 180 + 150) → la commission ne peut plus tenir simultanément le débit réservé
    et l''alimentation potable. Ce n''est plus un arbitrage local : saisine immédiate du préfet. Je le
    nomme aujourd''hui pour qu''on ne l''improvise pas dans la panique un dimanche.


    ---


    **Sur l''annexe transmise.** Le catalogue de stations fourni ne contient aucune station sur la Vèze
    ni au barrage de Sarcelle — il ne permet donc pas de caractériser la mesure sur laquelle repose tout
    ce dossier, et je ne m''en sers pas pour cela. Il fournit en revanche un étalon de pratique : chacune
    de ses 34 stations déclare une précision, une plage, une date d''étalonnage, un taux de disponibilité
    et un nombre de visites annuelles. Un étalonnage 2023 y serait banal — plusieurs stations sont à 2022.
    Le problème de Sarcelle n''est pas la date : c''est qu''elle est **unique et sans précision déclarée**.
    Nous arbitrons 4,1 M€, 90 emplois et deux frayères sur un capteur sans redondance dont personne autour
    de la table ne connaît l''incertitude. C''est le point 3 de l''ordre du jour.

    '
