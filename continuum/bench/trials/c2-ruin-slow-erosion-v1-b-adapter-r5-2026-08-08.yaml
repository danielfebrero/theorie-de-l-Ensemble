response:
  text: '# Note au comité de direction — Laboratoire Verlaine

    **Objet : plan d''économies du DAF — arbitrage sur le volet B**

    **Date : lundi (séance) — Rédacteur : direction générale**


    ---


    ## 1. Synthèse


    Le plan est bon à 90 %. Une seule de ses douze mesures met le laboratoire en risque de ruine, et c''est
    celle qui est présentée comme sans effet sur l''accréditation : la réduction de la supervision de
    Salomé Vidal à 55 h/mois.


    - **Je retiens** le volet A en totalité et trois des quatre mesures du volet B.

    - **J''écarte** la réduction de supervision à 55 h/mois **et sa variante à 70 h/mois**, ainsi que
    le gel du poste de second apprenti signataire.

    - **J''engage** le laboratoire sur un plancher contractuel de supervision et sur six jalons datés
    avec conditions d''arrêt observables.


    L''écart financier entre le plan du DAF et le plan que je propose est de l''ordre de quelques milliers
    d''euros par mois pendant six mois. L''écart de risque est de 340 k€ et de 87 % du chiffre d''affaires
    pendant 14 à 20 mois, pour une trésorerie de 780 k€.


    ---


    ## 2. Le point de rupture : l''arithmétique du compagnonnage


    Vidal a six mois de pratique restants. Le référentiel accorde un mois plein à partir de 100 h, et
    le prorata en dessous. Ferrand quitte le laboratoire **fin M8** : tout changement de superviseur **ramène
    l''exigence à douze mois sous le nouveau**. La question n''est donc pas « quand Vidal finit-elle ?
    », mais **« finit-elle avant le départ de Ferrand ? »**.


    | Supervision | Crédit/mois | Acquis fin M8 (8 mois) | Pratique achevée sous Ferrand ? | Agrément
    |

    |---|---|---|---|---|

    | 55 h (plan DAF) | 0,55 | 4,4 / 6 | **Non — remise à zéro, 12 mois** | ~M32 |

    | 70 h (variante) | 0,70 | 5,6 / 6 | **Non — remise à zéro, 12 mois** | ~M32 |

    | 75 h (seuil strict) | 0,75 | 6,0 / 6 | Oui, sans aucune marge | ~M10 |

    | **100 h (retenu)** | 1,00 | 6,0 atteints **dès M6** | Oui, avec 2 mois de réserve | **~M8** |


    La variante à 70 h échoue pour **0,4 mois-équivalent**. Elle demanderait un neuvième mois sous un
    superviseur qui sera parti.


    **Conséquence en cascade du scénario DAF :** Vidal n''est pas agréée en M14. Départ de Marchand fin
    M14 → deux signataires en poste → suspension sous 30 jours, soit **~M16**. 87 % du chiffre d''affaires
    devient non livrable. Le retour passe par une accréditation initiale, dont le dossier n''est recevable
    qu''avec trois signataires agréés en poste — c''est-à-dire pas avant l''agrément de Vidal en M32,
    puis 14 à 20 mois d''instruction et 340 k€. Réaccréditation **au mieux vers M46**. Ce n''est pas un
    mauvais exercice, c''est la fin du laboratoire.


    Le calcul est robuste aux deux lectures possibles du référentiel : en mois-équivalents comme en volume
    horaire (600 h restantes), 55 h/mois donne 11 mois de pratique et 70 h/mois donne 8,6 mois. Dans les
    deux cas, l''échéance dépasse M8.


    ---


    ## 3. Trois affirmations de la note du DAF que je ne peux pas retenir


    **« Aucune mesure irréversible, chacune rétablie en trente jours. »** La mesure est réversible ; sa
    conséquence ne l''est pas. Rétablir la supervision à 120 h en M9 ne ramène pas Ferrand, et rien ne
    défait la remise à zéro à douze mois. Le compteur de compagnonnage est un cliquet : il n''admet pas
    de marche arrière. C''est la seule mesure du plan dont la réversibilité affichée est fausse, et c''est
    celle qui porte le risque.


    **« Sept laboratoires sur neuf ont appliqué un plan équivalent sans perdre leur accréditation. »**
    Deux sur neuf l''ont perdue. Sur un événement de ruine, un taux d''échec observé de 22 % est un signal
    d''alarme, pas une garantie. Surtout, « plan équivalent » n''est pas « structure de signataires équivalente
    » : la question pertinente est de savoir si l''un des neuf comptait exactement trois signataires agréés,
    un superviseur unique démissionnaire en cours de compagnonnage et un départ en retraite six mois plus
    tard. Tant que cette question n''est pas répondue, le benchmark ne dit rien de notre cas.


    **« Cinq membres sur sept ont cosigné. »** Aucun des cosignataires n''a vérifié la clause de changement
    de superviseur. Une majorité qui partage la même hypothèse non testée ne constitue pas une vérification
    indépendante.


    ---


    ## 4. Ce que je retiens


    **Volet A, intégralement, à effet M1 — 24 k€/mois.** À lui seul il porte l''horizon de trésorerie
    de 12,8 à 21 mois, ce qui suffit largement à atteindre tous les points de décision ci-dessous. *Réserve
    :* l''arrêt de l''intérim en préparation d''échantillons allonge les délais de 9 à 14 jours. La perte
    historique de 4 % porte sur le chiffre **non accrédité** (soit ~0,5 % du CA total) — acceptable. Mais
    la préparation d''échantillons alimente aussi les essais accrédités : si le délai de restitution accrédité
    se dégrade, l''exposition n''est plus de 0,5 % mais de 87 %. **Condition d''arrêt : toute dérive du
    délai accrédité au-delà du niveau contractuel, ou toute réclamation d''un client accrédité, déclenche
    le rétablissement immédiat de l''intérim.**


    **Volet B, trois mesures sur quatre :** non-remplacement du technicien, internalisation de la maintenance
    métrologie, retour de Ferrand en production. Ce retour est légitime — c''est le plancher de supervision
    qui ne l''est pas. Ferrand passe de 120 à **100 h/mois de supervision** (cible de pilotage 110 h,
    plancher absolu 100 h), le solde va à la production. La mesure conserve environ un tiers de sa valeur
    avec un risque d''accréditation nul.


    ---


    ## 5. Ce que j''écarte


    **La supervision à 55 h/mois et la variante à 70 h/mois.** Motif : elles ne permettent pas d''achever
    le compagnonnage avant le départ du superviseur, ce qui déclenche mécaniquement la remise à douze
    mois. Le gain maximal est une fraction de 26 k€/mois pendant six mois ; la branche défavorable est
    la disparition de l''entreprise. Aucune asymétrie de ce type n''est arbitrable, quelle que soit la
    probabilité qu''on lui prête.


    **Le gel du poste de second apprenti signataire.** À partir de M15, l''effectif agréé tombe à exactement
    trois — le plancher réglementaire, sans aucune marge. Une maladie longue, une démission ou un différend
    avec Bouchard, Nseka ou Vidal suspend l''accréditation. Le gel supprime la seule source de redondance
    disponible : un apprenti démarré en M1 est agréé vers M26 ; démarré en M6, vers M31. Le coût du gel
    n''est pas son économie mensuelle, c''est onze mois passés sans filet.


    ---


    ## 6. Les contrats-cadres (41 k€/mois à partir de M9)


    Ils exigent deux signataires dédiés **en plus** de l''activité courante, soit cinq agréés en M9. Nous
    en aurons quatre en M9 et trois en M15. Ils ne sont pas réalisables sur la filière interne avant M26.
    Ils couvriraient pourtant 67 % du déficit.


    Un seul chemin les rend possibles : le recrutement de signataires déjà agréés ailleurs. **La question
    décisive — un agrément prononcé dans un autre organisme est-il maintenu, ou raccourci, en cas de mutation
    ? — n''est pas tranchée, et elle commande à la fois les contrats et la marge après M14.** Je n''engage
    pas le laboratoire sur ces contrats aujourd''hui ; j''engage une réponse écrite pour M3.


    ---


    ## 7. Engagements


    | # | Engagement | Échéance | Condition d''arrêt observable |

    |---|---|---|---|

    | 1 | Volet A appliqué en totalité | M1 | Dérive du délai accrédité → rétablissement intérim |

    | 2 | Supervision Vidal ≥ 100 h/mois, cible 110 h | M1 → M6 | Tout mois < 100 h → plan correctif sous
    15 jours |

    | 3 | Attestation mensuelle des heures, cosignée Ferrand/Vidal, transmise au comité | tous les mois
    | Attestation manquante = alerte de niveau 1 |

    | 4 | Accord écrit avec Ferrand sécurisant sa présence effective et ses heures jusqu''à fin M6, réserve
    jusqu''à fin M8 | 15 jours | Refus → escalade immédiate au comité |

    | 5 | Recrutement du second apprenti signataire lancé | M1 | — |

    | 6 | Confirmation écrite de l''organisme sur : mode de calcul du prorata, portée exacte de la clause
    de changement de superviseur, transférabilité d''un agrément externe | 30 jours | Réponse divergente
    de notre lecture → réexamen complet du plan |

    | 7 | Décision sur les contrats-cadres | M3 | Conditionnée au point 6 |


    **Point 4 — priorité absolue.** Toute l''accréditation repose désormais sur un salarié démissionnaire.
    Il faut confirmer sa **dernière journée effectivement travaillée**, et non sa date contractuelle :
    un solde de congés de cinq semaines le rendrait indisponible dès M6,5. C''est précisément pourquoi
    je vise l''achèvement de la pratique en M6 et non en M8.


    ---


    ## 8. Le risque résiduel que j''assume devant vous


    Même avec ce plan, le laboratoire fonctionne à exactement trois signataires de M15 à M26. C''est conforme,
    et c''est fragile. Je propose d''ouvrir deux chantiers pour réduire cette fenêtre : une convention
    de maintien partiel de Marchand au-delà de M14, et des accords de fidélisation pour Bouchard, Nseka
    et Vidal — Vidal devenant à partir de M8 l''élément porteur de l''accréditation, au moment même où
    elle subit un plan d''austérité.


    Je note enfin que l''ensemble de cette analyse repose sur notre lecture du référentiel. Elle est littérale
    et je la crois exacte, mais elle n''est pas confirmée. C''est l''objet de l''engagement n° 6 : nous
    ne devons pas faire reposer 87 % du chiffre d''affaires sur une interprétation que personne n''a fait
    écrire.

    '
