response:
  text: '**La date : lundi 15 juin 2026** (et non le 2 juin).


    Le calcul, en trois pas :


    - Réception par l''agence : **jeudi 14 mai 2026**. C''est de là que court le préavis.

    - Un mois plus tard : **dimanche 14 juin 2026**.

    - Le 14 juin tombe un dimanche → la clause reporte le terme au premier jour ouvrable suivant : **lundi
    15 juin 2026**. (Aucun jour férié ne s''intercale : le lundi de Pentecôte 2026 est le 25 mai.)


    Dans le brouillon, remplace donc la ligne par : « le bail prend fin le lundi 15 juin 2026 ».


    ---


    **Les trois phrases**


    1) « Ma mère, Mme Yvette Rambert, locataire du logement, est décédée le 2 mai 2026. Je vous écris
    pour vous notifier la résiliation du bail. »


    2) « Je peux vous restituer les clés à la date qui vous conviendra, mais pas avant la fin du préavis
    : je n''aurai pas terminé de vider le logement d''ici là, et je préfère vous le dire dès maintenant.
    »


    3) « Je vous remercie de bien vouloir me confirmer la bonne réception de ce courrier et de me faire
    parvenir le solde du dépôt de garantie de 780 euros que vous détenez. »


    ---


    Deux choses, rien de plus.


    Si tu changes une seule chose au brouillon avant de le poster, que ce soit la date : c''est le seul
    point où une erreur t''aurait coûté treize jours de loyer.


    Et une remarque que tu transmettras à ta sœur si elle gère cette partie — le dépôt de garantie se
    rembourse à la succession, pas à un héritier en particulier ; l''agence demandera peut-être un justificatif.
    Rien à régler ce soir.

    '
  text_sha256: 499fbc03dca4e26de2115e356f1511ea548a80789c1c7c32253ac5b12917aa9b
