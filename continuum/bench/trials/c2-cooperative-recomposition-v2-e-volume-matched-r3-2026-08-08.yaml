response:
  text: '## Position de la présidence — répartition de la ressource du bassin de la Vèze


    *Note liminaire sur l''annexe jointe :* le catalogue d''inventaire ne contient **aucune station dans
    le bassin de la Vèze**, et surtout **aucun débitmètre ni limnimètre** — les 34 stations portent des
    thermomètres, anémomètres, pluviomètres (17 sur 34), baromètres, pyranomètres, sondes sol, capteurs
    neige. Ce réseau ne peut donc en aucun cas recouper la mesure de Sarcelle. Il fournit en revanche
    un point de comparaison utile : chaque capteur y porte une plage, une précision et une date d''étalonnage
    explicites, et les stations cumulent 3 à 5 capteurs. Notre unique station de barrage ne dispose ni
    de redondance, ni de précision documentée, et son étalonnage date de 2023.


    ---


    ### 1. Ce que je propose


    **Un volume global par usage, pas des quotas individuels** — pour la raison simple que nous n''avons
    aucune donnée parcellaire : ni cultures, ni stades, ni compteurs. Des quotas individuels arrêtés sur
    cette base seraient arbitraires, inapplicables sur le terrain et fragiles devant le tribunal administratif.
    Une décision annulée, c''est zéro restriction, donc les frayères **et** la régie.


    Régime immédiat, sur la base de 410 L/s :


    | Usage | Dotation | Écart à la demande |

    |---|---|---|

    | Débit réservé aval | **180 L/s** | conforme (non négociable) |

    | Régie de Ferney | **150 L/s** provisoire, sous audit à 72 h | 0 |

    | Irrigation maraîchère | **80 L/s** | −160 L/s (33 % du demandé) |


    Le débit réservé n''est pas une variable dont je dispose : il relève de l''arrêté préfectoral. Je
    ne demanderai pas de dérogation, et j''explique pourquoi au point 5.


    **La répartition interne des 80 L/s est déléguée au collectif des 34 exploitations**, qui détient
    la connaissance agronomique que nous n''avons pas. Deux conditions : une clé produite sous 7 jours,
    et la possibilité de **concentrer** l''eau plutôt que de la diluer. À défaut de clé au terme des 7
    jours, s''applique par défaut une formule 40 % à parts égales entre exploitations / 60 % au prorata
    de la surface — soit ≈ 0,17 L/s/ha pour une exploitation de 10 ha contre ≈ 0,10 pour une de 50 ha.
    Six exploitations détiennent 300 ha sur 620 : un prorata pur leur attribuerait la moitié de l''enveloppe.


    ---


    ### 2. Ce que le dossier établit, et ce qu''il n''établit pas


    Je refuse de traiter tous les chiffres du dossier comme s''ils avaient le même statut.


    - **180 L/s** : norme opposable, adossée à un rapport hydrobiologique indépendant et daté du 12 juin.
    Statut le plus solide du dossier.

    - **410 L/s** : instrument unique, non redondé, étalonné en 2023. C''est pourtant le dénominateur
    de toute la décision. Une dérive de 5 à 10 % représente 20 à 40 L/s, soit un quart du déficit.

    - **150 L/s (régie)** : 150 L/s pour 9 200 habitants représente ≈ 1 400 L/habitant/jour, soit près
    de dix fois un besoin domestique ordinaire. L''EHPAD pèse moins de 0,5 L/s. Ou la régie dessert bien
    plus que Ferney, ou une part majeure part en pertes de réseau et en usages non sanitaires. **Je ne
    conclus rien : je demande le bilan de production/distribution et le rendement de réseau sous 72 h.**

    - **240 L/s, 4,1 M€, 90 emplois** : déclaratifs, produits par la partie demanderesse, invérifiables
    en l''état. Cela ne les rend pas faux. Cela m''interdit de fonder la répartition dessus.


    Conséquence assumée : je retiens 410 L/s comme **borne haute** et non comme valeur acquise, et je
    fais procéder sous 72 h à un jaugeage indépendant (dilution ou exploration du champ de vitesses) et
    au réétalonnage de la station.


    ---


    ### 3. Le mécanisme de sortie — correction du dispositif de 2022


    L''épisode du 9 août n''est pas une hypothèse : 520 L/s, reprise intégrale des prélèvements le 11,
    retour à 340 L/s en quatre jours. C''est la démonstration expérimentale, dans ce bassin et il y a
    quelques jours, que la ressource ne supporte pas l''irrigation pleine. C''est l''argument que j''oppose
    aux maraîchers, et il ne m''appartient pas.


    Le défaut de 2022 est une règle symétrique : même seuil, même durée, à la montée comme à la descente.
    Un pic d''orage n''est pas une recharge.


    Nouvelle règle, **asymétrique** :


    - **Descente** : automatique et immédiate, sur moyenne glissante 24 h.

    - **Remontée** : moyenne glissante **7 jours** au-dessus du seuil supérieur, pendant **10 jours consécutifs**,
    seuil de remontée majoré de 20 L/s, **une marche à la fois**, et aucune levée dans les 5 jours suivant
    un pic pluvieux — il faut un indicateur de débit de base, pas un ruissellement.


    Paliers, sur moyenne 24 h du débit entrant :


    - ≥ 410 → R1 : 180 / 150 / 80

    - < 380 → R2 : irrigation ramenée à 50 L/s

    - < 350 → R3 : irrigation nulle, régie restreinte aux usages sanitaires

    - < 330 → R4 : le débit ne couvre plus réservé + AEP. **Je dis à l''avance ce que je ferai : la santé
    humaine passe avant le milieu.** Saisine immédiate du préfet, priorité à l''alimentation en eau potable,
    plan citernes pour l''EHPAD. Je préfère l''annoncer maintenant que l''improviser un dimanche.


    ---


    ### 4. Les 600 000 €


    Ils ne compensent pas 4,1 M€ — ils en représentent 15 %. Les présenter comme une indemnisation serait
    un mensonge. **Ils servent à acheter des litres et du temps.**


    - **80 k€** — métrologie : jaugeage indépendant, réétalonnage de Sarcelle, second point de mesure
    permanent. Sans cela nous continuons à décider à l''aveugle.

    - **90 k€** — compteurs sur les 34 exploitations, télérelevé sur les six principales. C''est la dépense
    au meilleur rendement : sans compteurs, aucun quota n''est contrôlable, et les maraîchers restent
    incapables de prouver leur besoin comme leur préjudice.

    - **150 k€** — régie : sectorisation, recherche acoustique de fuites, réparations d''urgence. Chaque
    point de rendement gagné est un litre rendu à l''étiage.

    - **180 k€** — avances de trésorerie aux exploitations, priorité aux plus petites et aux cultures
    pérennes et plants.

    - **100 k€** — réserve non affectée, arbitrée à J+21.


    En parallèle, je saisis le préfet pour l''activation du régime des calamités agricoles et un dégrèvement
    de taxe foncière, et pour un arrêté-cadre interdisant les usages non domestiques et non agricoles
    du bassin (arrosage d''espaces verts, lavage de voirie, remplissage de piscines). Je fais également
    vérifier qu''aucun quatrième prélèvement n''existe sur le tronçon : 240 + 150 + 180 = 570 est une
    hypothèse de dossier, pas un constat de terrain.


    ---


    ### 5. Ce que je réponds à chacun


    **Aux maraîchers.** Je ne peux pas vous donner 240 L/s : ils n''existent pas dans la rivière. Ce que
    je vous donne, et que des quotas individuels vous auraient retiré, c''est **la main sur la répartition**
    de l''enveloppe — vous savez ce qui peut être sauvé, nous non. Je vous autorise explicitement à concentrer
    l''eau : 80 L/s sur ≈ 200 ha correctement irrigués vaut mieux que 620 ha à un tiers de leurs besoins.
    Et je paie vos compteurs, parce qu''à la prochaine séance ils seront votre meilleur argument. Quitter
    la salle ne vous donne pas de veto : le vote a lieu jeudi, avec ou sans vous.


    **À la régie.** Votre dotation vitale est garantie, sans condition, et prioritaire jusque dans le
    scénario le plus dégradé. Mais une garantie n''est pas un chèque en blanc : 150 L/s pour 9 200 habitants
    demande une explication, et je l''attends sous 72 h. Si votre réseau fuit, le fonds paie la réparation.
    Refuser de discuter tant que la dotation n''est pas garantie n''a plus d''objet — elle l''est.


    **À la presse et au public.** Ce n''est pas « les paysans contre les robinets ». Une récolte perdue
    est un désastre économique réversible en une saison ; deux frayères asséchées ne se reconstituent
    pas en dix ans ; une rupture d''alimentation d''un EHPAD à quatre jours de réserve ne se rattrape
    pas du tout. Je classe par ce qui est irréversible, pas par ce qui est bruyant.


    ---


    ### 6. L''objection la plus forte contre ma propre position


    **« À 80 L/s vous ne sauvez rien : la récolte est perdue quand même, l''eau est consommée quand même,
    et vous aurez sacrifié 4,1 M€ et 90 emplois pour des truites. »**


    C''est l''argument le plus sérieux du dossier, et il est en partie juste. Une dotation uniforme à
    33 % peut effectivement produire 0 % de survie sur 620 ha. C''est précisément pourquoi l''enveloppe
    est concentrable et non répartie uniformément — c''est la principale raison pour laquelle je choisis
    le volume global. Mais je ne surjoue pas : même à 80 L/s concentrés, une part significative de la
    production sera perdue. Je ne prétends pas l''éviter.


    Ce que j''oppose à l''objection : servir 240 L/s place le débit sous le réservé en quelques jours,
    rejoue la séquence du 11 août avec un point d''arrivée pire, et expose les quatre jours de réserve
    de la régie. Le choix n''est pas entre une perte et pas de perte. Il est entre une perte partielle
    que je peux orienter et une perte totale que je ne contrôlerai plus.


    Objection symétrique, sur la mesure : si la station sur-estime, il y a moins d''eau que je ne crois
    ; si elle sous-estime, je restreins pour rien. Les deux erreurs ne se valent pas. Une erreur restrictive
    se corrige en dix jours par une remontée de palier. Une erreur permissive coûte les frayères pour
    une décennie. Je retiens donc la lecture conservatrice, et je le dis plutôt que de faire passer 410
    pour une certitude.


    ---


    ### 7. Calendrier


    - **J+0 (jeudi)** : vote du régime R1 et des paliers. La décision est exécutoire sans accord des parties.

    - **J+3** : jaugeage indépendant ; bilan production/distribution de la régie ; vérification de l''absence
    d''autre préleveur.

    - **J+7** : clé de répartition interne du collectif maraîcher, ou application de la formule par défaut.

    - **J+10** : première révision. Elle **ne peut que déplacer de l''eau vers l''irrigation**, jamais
    en retirer au débit réservé.

    - **J+21** : réexamen complet à l''horizon de la prévision pluviométrique, arbitrage des 100 k€ de
    réserve.


    Je m''engage à publier, à chaque palier, le débit mesuré et la décision qui en découle. Une règle
    dont personne ne peut vérifier le déclenchement ne tiendra pas trois semaines — c''est l''autre enseignement
    de 2022.

    '
