response:
  text: '## Ce que le dossier dit vraiment


    Le pivot est le rapprochement des pièces 1, 3 et 5 : chargement fini à 6 h 25, groupe froid sous tension
    seulement à 9 h 05, sortie du site à 11 h 12. **2 h 40 sans aucun enregistrement de température, et
    4 h 47 de stationnement chargé.** Ces trois pièces sont les nôtres, dont deux automatiques. La mention
    manuscrite « départ 6 h 40 » du BL est donc fausse, et c''est notre propre document.


    Il faut le reconnaître. Un assureur qui instruit sur pièces le verra en dix minutes, et une position
    qui aurait tenté de s''appuyer sur « 6 h 40 » perdrait toute crédibilité sur le reste — où le dossier
    est réellement bon.


    ## Ce que l''entreprise reconnaît


    La lacune d''enregistrement, le stationnement, l''inexactitude de la mention manuscrite, et le résultat
    de l''analyse **en tant que mesure**. Rien de plus : ni l''imputabilité de la dérive à cette seule
    période, ni la non-conformité du lot entier, ni un montant.


    ## Ce qu''elle conteste


    1. **Les 21 400 €, en totalité** — aucune décomposition, aucun prix unitaire, aucun certificat de
    destruction, aucune clause produite. Une somme globale n''est pas une créance.

    2. **La quantité** — le BL de 1 840 est **signé par le réceptionnaire de Sodimarché** (P2), leur bon
    de réception porte 1 792 (P4). 48 barquettes manquent entre deux documents du dépôt, dont un qu''il
    a cosigné.

    3. **L''extrapolation de 3 barquettes à 1 840**, sans PV de prélèvement, sans chaîne de conservation
    des échantillons, sans plan d''échantillonnage, sans contradictoire.

    4. **L''absence de relevé de température à réception** à 12 h 55 : le dépôt s''est privé lui-même
    du seul constat fixant l''état au transfert de garde.

    5. **La période 12 h 55 → prélèvement**, non documentée : P6 constate la dérive, elle ne la date pas.

    6. **La pénalité d''assortiment**, qu''aucune pièce n''établit — et que le refus global du lot, sans
    tri contradictoire, alimente elle-même.


    ## Ce que je n''ai pas mis dans les écrits


    Trois choses ne sont rattachées à aucune pièce et sortiraient le dossier :


    - **Le statut du transport** — compte propre ou affrètement. Rien ne le dit, et c''est ce qui décide
    de l''existence d''un recours, de la police mobilisable et de délais de protestation qui se comptent
    en jours. À trancher immédiatement.

    - **La pièce 7.** Un propos téléphonique non daté, non signé, ne vaut pas preuve. En l''état il n''apporte
    rien de favorable — « tôt » et « un moment » ne font que redire vaguement ce que le portique chiffre
    — tout en ressemblant à un aveu. Soit attestation écrite en forme, soit hors dossier.

    - **La lettre de réclamation de Sodimarché et le contrat eux-mêmes** ne sont pas au dossier. Le point
    de départ des huit jours n''est donc pas documenté : je le compte depuis la date la plus défavorable,
    le 3 juin.


    ## Ce qui est engagé sous huit jours


    Envoi de la réponse en LRAR **avant l''échéance**, déclaration à l''assureur, et surtout **l''analyse
    de l''échantillothèque du lot F-2418** : c''est la seule pièce qui manque et que nous pouvons produire
    nous-mêmes. Elle établit l''état microbiologique au départ, donc elle date la dérive. En parallèle
    : gel des données brutes avec certificat d''étalonnage de l''enregistreur, attestations en forme,
    demande circonstanciée de justificatifs, et proposition d''expertise contradictoire assortie du remplacement
    du lot sous 72 heures contre abandon de la pénalité d''assortiment.


    Un point à assumer : **si l''échantillothèque revient non conforme, la cause est en amont du transport.**
    Dans ce cas la contestation tombe, on bascule en transaction et on vérifie les lots voisins — y compris
    auprès de l''autorité sanitaire si d''autres sont partis. Cette branche prime sur l''intérêt contentieux,
    et elle doit être décidée maintenant, pas au moment où le résultat arrive.


    Argument favorable, mais à ne pas surjouer : après 9 h 05, **aucun relevé n''excède 3,6 °C**. Un groupe
    de transport maintient, il ne rabat pas une caisse pleine en quelques minutes. C''est une question
    à poser à un expert, pas une conclusion — l''appareil mesure l''air, pas le cœur du produit.

    '
