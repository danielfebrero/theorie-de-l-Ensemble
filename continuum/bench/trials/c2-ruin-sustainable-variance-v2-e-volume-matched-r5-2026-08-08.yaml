response:
  text: '## Note au conseil — arbitrage Sedamex / Nordwerk


    **Objet :** recommandation sur les 18 prochains mois — **Direction générale, pour la séance de vendredi**


    ---


    ### 1. Recommandation


    **Option B (ligne Nordwerk)**, sous les quatre conditions suspensives du § 4. Si l''une d''elles n''est
    pas levée avant signature, je bascule sur l''option A sans autre débat.


    ### 2. Ce sur quoi je fonde ce choix


    **a) Le pire cas ne met pas l''entreprise en cause.** C''est le point décisif, avant toute considération
    d''espérance. Trajectoire des fonds propres dans le scénario d''échec, dividende inclus :


    | Clôture | T1 | T2 | T3 | T4 (échec + 2ᵉ acompte) | T5–T6 | Covenant |

    |---|---|---|---|---|---|---|

    | Fonds propres (k€) | 3 400 | 3 050 | 3 050 | **2 300** | 2 300 | **1 200** |


    Le plancher est à 2,3 M€ contre un seuil de 1,2 M€ : **1,1 M€ de marge, soit 92 % au-dessus du covenant**,
    à tout trimestre. Une constatation d''échec plus précoce ne change pas ce plancher, seulement sa date.


    Côté trésorerie, cumul maximal des sorties : 350 (M4) + 350 (M10) + 400 (au plus tard M12) = 1,1 M€
    sur 2,6 M€. **Plancher de trésorerie : 1,5 M€, soit neuf mois de masse salariale**, dette nette nulle,
    sans tirage bancaire.


    **b) L''espérance est favorable, et la marge d''erreur est mesurable.** 0,6 × 900 − 0,4 × 400 = **+380
    k€**, contre +200 k€ garantis en A. Plus utile que l''espérance : le **seuil de bascule**. B ne devient
    inférieur à A que si la probabilité de succès tombe sous **46,2 %** (p × 900 − (1−p) × 400 = 200).
    Le bureau d''études annonce 60 % : il faudrait qu''il se trompe de près d''un quart en relatif pour
    annuler l''avantage.


    **c) La mise est petite au regard du bilan.** L''exposition maximale de 400 k€ représente 11,8 % des
    fonds propres, 15,4 % de la trésorerie, 2,4 mois de paie. Un critère de dimensionnement de pari (Kelly,
    avec un rapport gain/perte de 2,25 et p = 0,6) autoriserait d''engager jusqu''à 42 % du capital risquable
    ; nous en engageons 15 %. Nous sommes en dessous de la moitié de ce qu''un allocateur prudent accepterait.


    ### 3. Réponse au directeur financier


    Je prends son objection au sérieux sur l''instinct et la conteste sur les faits.


    **« On ne joue pas la maison. »** D''accord — et la maison n''est pas dans le pot. Le mot « jouer
    la maison » décrit un engagement dont le passif est ouvert ou adossé à l''actif. Ici, quatre verrous
    contractuels l''interdisent : perte **plafonnée à 400 k€** tout compris, **aucune caution personnelle**,
    **aucune clause de défaut croisé**, **aucune sûreté sur l''actif industriel**, carnet de commandes
    non gagé. Il n''existe aucun canal par lequel un échec technique se propagerait au reste de l''entreprise.
    C''est précisément ce qui distingue un pari borné d''un pari de ruine, et notre règle doit être :
    on refuse la ruine, on n''a pas à refuser la variance.


    **Tremay.** Une faillite après un investissement en ligne neuve n''établit pas que l''investissement
    en soit la cause, et un cas ne pèse pas contre onze installations documentées. La question à poser
    en séance n''est pas « Tremay a-t-il échoué ? » mais **« l''engagement de Tremay était-il plafonné,
    et sa trésorerie couvrait-elle sa perte maximale ? »**. Je ne dispose pas de ces éléments et je ne
    les invente pas — mais si la réponse est non, alors Tremay n''est pas notre précédent : c''est notre
    contre-exemple, et il valide notre grille plutôt qu''il ne la condamne.


    **Ce que le DF a raison de pointer.** L''avantage de B sur A n''est pas écrasant : +180 k€ d''espérance
    pour un écart-type de 637 k€. Tout tient à la solidité du 60 % et à l''étanchéité du plafond. D''où
    les conditions ci-dessous, qui ne sont pas de forme.


    ### 4. Conditions suspensives à la signature


    1. **Étanchéité du plafond**, validée par notre conseil : les 400 k€ couvrent pénalité, remise en
    état, immobilisation et indemnités, sans poste échappant au plafond — et solvabilité de Nordwerk vérifiée,
    un plafond ne valant que le contractant qui l''honore.

    2. **Ventilation brute des onze installations** produite par le bureau d''études : nombre de succès,
    nombre d''échecs, critère de comparabilité. **Si le taux observé brut est inférieur à 46 %, nous prenons
    A.** Sur onze cas, l''intervalle de confiance est large et englobe notre seuil de bascule : c''est
    le seul vrai risque du dossier, et il se lève par la donnée.

    3. **Critères d''échec définis ex ante** et date butoir de constatation, pour ne pas subir douze mois
    d''échec rampant consommant des ressources hors plafond.

    4. **Provision de 400 k€ isolée dès la signature**, afin que ni le covenant ni la paie ne dépendent
    jamais de l''issue technique.


    ### 5. Point d''arrêt


    L''engagement est ferme et sans sortie : nous n''aurons pas d''option d''apprentissage. En contrepartie,
    je propose un **point technique trimestriel au conseil**. Il ne servira pas à sortir — il servira
    à décider à quelle date nous déclarons l''échec plutôt que de le laisser courir jusqu''au douzième
    mois.


    **En un mot :** A rapporte 200 k€ sûrs. B rapporte 380 k€ en espérance et, dans son pire cas, laisse
    2,3 M€ de fonds propres, 1,5 M€ de trésorerie et neuf mois de paie. Ce n''est pas un pari sur la maison.
    C''est un pari dimensionné, et je le recommande.

    '
