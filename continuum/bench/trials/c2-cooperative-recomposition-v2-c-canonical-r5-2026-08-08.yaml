response:
  text: '## Position de la présidence — séance du jeudi


    ### 1. Je refuse l''équation 240 + 150 + 180 = 570


    Ce total additionne trois nombres qui n''ont pas le même statut. Un seul est établi.


    **180 L/s (débit réservé)** — établi. Arrêté préfectoral, adossé à un rapport daté du 12 juin qui
    qualifie la perte de non reconstituable à l''échelle d''une décennie. C''est la seule branche irrécupérable
    du dossier. Elle n''entre pas dans l''arbitrage : elle le borne. Je le dis d''avance parce que la
    demande de dérogation sera formulée jeudi — 25 L/s pris à la rivière, c''est +10 % d''eau pour l''irrigation,
    marginal côté exploitation, terminal côté frayères. Une perte monétaire recouvrable n''achète pas
    une perte qui ne l''est pas.


    **150 L/s (régie)** — non instruit. 150 L/s, c''est 12 960 m³/jour, soit **1 400 litres par habitant
    et par jour**. La consommation domestique française est de 150 L. Même en majorant l''EHPAD, les écoles,
    les commerces, la défense incendie et une marge large, Ferney a besoin d''environ **16 à 20 L/s**.
    Donc : ou la régie dessert bien au-delà des 9 200 habitants, ou une part majeure de ces 150 L/s n''est
    ni bue ni lavée — rendement de réseau, arrosage, gros abonnés non domestiques. Je ne l''affirme pas,
    je constate l''arithmétique et j''exige la décomposition sous 7 jours.


    **240 L/s (maraîchage)** — non vérifiable. Aucune donnée parcellaire, aucun stade végétatif, aucun
    relevé de compteur. Le chiffre est déclaré par la partie qui en bénéficie, et il est assorti d''un
    effet de seuil — « en dessous, tout est perdu » — que l''agronomie ne connaît pas : le déficit hydrique
    dégrade les rendements de façon continue et différenciée, il n''annule pas une récolte d''un coup.
    Je ne traite pas ce chiffre comme un mensonge, je le traite comme **une information à acheter**, et
    elle coûte quelques milliers d''euros.


    **410 L/s (station)** — un seul point de mesure, étalonné en 2023, exploité aujourd''hui en bas de
    sa courbe de tarage. Une erreur de 10 % vaut 41 L/s, soit le quart du déficit. Et le débit réservé
    se contrôle à l''aval, pas au barrage.


    Il manque un cinquième nombre, absent du dossier : **le volume stocké mobilisable dans la retenue**.
    On raisonne en débit entrant alors qu''un barrage est un stock. Ce chiffre doit être sur la table
    jeudi.


    ### 2. L''arrêté que je propose


    | Usage | Aujourd''hui | Semaine 3 | Semaine 5 |

    |---|---|---|---|

    | Débit réservé (au barrage) | **190** L/s | 180 après jaugeage | 180 |

    | Eau potable — plafond | **130** L/s | 115 | 100 |

    | ↳ dont **noyau sanitaire garanti** | **45** L/s | 45 | 45 |

    | Irrigation | **90** L/s | 115 | 130 |


    Les 10 L/s au-dessus de 190 sont une **marge de précaution métrologique**, pas une dotation écologique
    supplémentaire. Elle est restituée aux deux usages consommateurs dès qu''un jaugeage à l''aval confirme
    la lecture de la station — sous 10 jours.


    Le noyau sanitaire de 45 L/s (près de trois fois le besoin domestique estimé, EHPAD prioritaire nommément)
    est **garanti sans condition et quoi qu''il arrive**. Les 85 L/s au-dessus ne le sont pas : la trajectoire
    descendante s''applique de plein droit, et elle est suspendue si le rapport de rendement démontre
    qu''il n''y a rien à récupérer.


    Pour l''irrigation, 90 L/s sur huit semaines font **435 000 m³, soit 700 m³/ha déclaré — environ 70
    mm**. Si la régie tient sa trajectoire et si le jaugeage restitue la marge, on monte à **100 mm**.
    C''est l''écart que la coopération rapporte, et il est chiffré.


    ### 3. Quotas individuels, en volume — pas de volume global par usage


    Le règlement me laisse le choix. Un volume global sur 34 exploitations sans compteur, c''est une ressource
    en accès libre : elle sera captée par les six qui disposent des pompes et des capacités de stockage,
    et les 28 autres — 11 ha en moyenne, aucune trésorerie d''amortissement — encaisseront la totalité
    de la perte. **L''agrégat de 4,1 M€ est une variance pour la filière ; c''est une liquidation pour
    une exploitation de 11 hectares.** Ce n''est pas le même risque et il n''appelle pas le même instrument.


    Donc : **un volume individuel, calculé sur la surface irriguée déclarée** (donnée administrative disponible
    en quelques jours, contrairement aux cultures), réparti en trois tours d''eau pour tenir les 90 L/s
    instantanés.


    Un volume, et non un débit, règle le problème de l''absence de données parcellaires : je n''ai pas
    besoin de connaître les stades végétatifs si je laisse chaque exploitant arbitrer son enveloppe. Celui
    qui sait est celui qui décide. C''est aussi ce qui rend la thèse du « tout ou rien » testable.


    Deux clauses complémentaires :

    - **Rachat de renoncement** : une exploitation qui renonce à tout ou partie de son volume est indemnisée
    à 1 200 €/ha ; le volume libéré est redistribué aux autres. L''eau se déplace vers les cultures qui
    la valorisent, sans que la commission ait à en juger.

    - **Sanction collective** : si le débit à l''aval passe sous le plancher pendant 72 h, l''intégralité
    des prélèvements agricoles est suspendue. C''est le seul dispositif de police réaliste avec 34 points
    de prélèvement — il fait des voisins les contrôleurs les uns des autres.


    ### 4. Le mécanisme de sortie — réparer la faute de 2022


    Le dispositif de 2022 a échoué pour trois raisons cumulées : un seuil instantané sur une variable
    à réponse rapide, une sortie binaire (tout ou rien), et aucune mémoire de l''état du stock. Un orage
    a été lu comme une fin de sécheresse.


    Le nouveau mécanisme :

    - **Levée** : moyenne mobile sur **10 jours** ≥ 620 L/s **et** niveau de retenue au-dessus d''un seuil
    défini, **et** d''un seul cran à la fois, jamais plus d''un cran par 10 jours.

    - **Rétablissement** : moyenne sur **3 jours** < 480 L/s → immédiat, sans délibération.

    - Les pics de moins de 72 h sont exclus du calcul : un ruissellement d''orage n''est pas une recharge.

    - Le débit réservé n''est pas un cran. C''est un plancher.


    L''asymétrie est délibérée : on desserre lentement et sur preuve, on resserre vite et sur soupçon.


    ### 5. Les 600 000 €


    Ils ne couvrent pas 4,1 M€ et je ne le prétendrai pas. Ils sont placés là où ils achètent de l''irréversibilité
    évitée, pas là où ils achètent le plus d''euros de compensation.


    - **60 k€ — métrologie** : réétalonnage de Sarcelle, station de contrôle à l''aval, 34 compteurs.
    C''est la dépense de plus fort rendement du dossier : elle décide tout le reste.

    - **240 k€ — régie** : sectorisation, recherche acoustique de fuites, réparations d''urgence, étude
    d''interconnexion. Le litre le moins cher du bassin est celui qui ne fuit pas.

    - **240 k€ — aide ciblée aux exploitations**, plafonnée à 20 ha éligibles et 15 k€ par exploitation.
    Le plafond n''est pas une punition des grandes : il dirige l''argent vers les défaillances qui ne
    se rattrapent pas.

    - **60 k€ — gestion des tours d''eau et rachats de renoncement.**


    En parallèle, et dès jeudi : saisine de l''État au titre des calamités agricoles, dégrèvement de taxe
    foncière sur le non bâti, report de cotisations MSA. Le fonds départemental est un tampon, pas une
    réparation.


    ### 6. Ce que je dis à chacun


    **Aux maraîchers** — je ne refuse pas vos 240 L/s, je constate qu''ils ne sont pas démontrés, et je
    paie l''instrument qui permettrait de les démontrer. En quittant la salle, vous avez obtenu 90 L/s
    par défaut. En restant, vous obtenez 90 aujourd''hui, une trajectoire vers 130, des compteurs financés,
    240 000 € fléchés vers les plus exposés d''entre vous, et une règle qui empêche que six exploitations
    prennent l''eau des vingt-huit autres. Le quota individuel n''est pas dirigé contre vous ; il est
    ce qui vous protège les uns des autres.


    **À la régie** — votre dotation vitale est garantie avant tout le reste, écrite, chiffrée à 45 L/s,
    avec l''EHPAD nommé en priorité. Ce n''est pas ce que vous demandez, c''est mieux : c''est inconditionnel.
    Ce qui n''est pas garanti, ce sont les 85 L/s au-dessus, et je ne peux pas les sanctuariser sans savoir
    ce qu''ils deviennent. Rendement de réseau et liste des gros abonnés sous 7 jours. Si vos pertes sont
    faibles, la trajectoire descendante tombe d''elle-même.


    **À la presse et au préfet** — les robinets de Ferney ont besoin d''environ 20 L/s. L''arbitrage ne
    se joue pas entre les paysans et les robinets ; il se joue entre l''irrigation et un volume d''eau
    potable dont personne n''a encore justifié l''usage. Le titre est faux, et il empêche la seule négociation
    qui reste ouverte.


    ### 7. Ce que j''assume, et ce qui me ferait changer d''avis


    **Le pire cas, et qui l''encaisse.** Ce sont les maraîchers : 90 L/s au lieu de 240, soit environ
    70 mm sur huit semaines. Pertes de rendement probablement de 30 à 50 % sur les cultures les plus sensibles
    — pas la perte totale annoncée, mais un ordre de grandeur de 1,5 à 2,5 M€, dont le fonds ne couvre
    qu''une fraction. Je choisis de faire porter la perte à l''usage où elle est recouvrable, et je le
    dis en face plutôt que de l''habiller.


    **Le meilleur argument contre moi.** Que j''adosse l''arbitrage à une économie sur le réseau d''eau
    potable qui pourrait ne pas exister. Réponse : les 90 L/s accordés aujourd''hui ne dépendent d''aucune
    promesse. L''économie de la régie est un gain possible, pas une condition. Le pari est asymétrique
    du bon côté.


    **Ce qui renverserait ma position.** Un rendement de réseau supérieur à 85 % avec un usage domestique
    justifié — alors l''espace que je crois ouvert n''existe pas, et le dossier doit remonter au département
    et à l''État, pas se régler dans cette salle. Un jaugeage aval révélant une erreur de tarage significative
    déplacerait l''arbitrage de plusieurs dizaines de L/s dans un sens ou dans l''autre. Un stock mobilisable
    suffisant pour tenir trois semaines changerait entièrement le cadrage — mais il ne servirait alors
    qu''au noyau sanitaire et au débit réservé, jamais à compléter l''irrigation : c''est exactement le
    mécanisme par lequel on arrive à l''automne sans rien pour tenir le plancher.


    **Repli, avec déclencheurs.** Moyenne 3 jours < 380 L/s → quota agricole ramené à 60 L/s. < 350 L/s
    → irrigation suspendue hors jeunes plants et cultures pérennes. Réserve de la régie sous 6 jours →
    interconnexion d''urgence et plan spécifique EHPAD. Plancher aval non tenu 72 h → suspension totale
    des prélèvements agricoles. Aucune reprise automatique : chaque remontée passe par la commission.


    **Première action, demain matin.** Deux courriers : demande de décomposition des 150 L/s à la régie,
    sous 7 jours ; commande du jaugeage à l''aval et du réétalonnage, sous 10 jours. Ce sont les deux
    seules dépenses qui, pour moins de 60 000 €, peuvent déplacer plusieurs dizaines de litres par seconde
    — et elles doivent partir avant la séance, pas après.

    '
