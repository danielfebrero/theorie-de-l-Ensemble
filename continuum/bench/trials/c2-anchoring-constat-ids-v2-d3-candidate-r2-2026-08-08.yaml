response:
  text: '## Avis pour le comité de direction — renouvellement du logiciel de réservation et des bornes
    (échéance 31 octobre)


    ---


    ### 1. Ce que je retiens du dossier


    Chaque constat est autonome : le comité peut en écarter un sans que les autres tombent. La colonne
    « repose sur » indique la pièce unique qui le porte.


    | # | Constat | Repose sur |

    |---|---|---|

    | C1 | Le dossier contient **deux problèmes distincts**, aujourd''hui confondus : l''indisponibilité
    des bornes (matériel) et les pertes de réservations (logiciel). Aucune pièce ne les relie. | Export
    technique d''une part, enquête interne et réclamations d''autre part |

    | C2 | L''indisponibilité est **concentrée sur le matériel de 2015** : 32 h sur 41 h (78 %) sur les
    deux seuls sites équipés de bornes 2015, contre 9 h répartis sur les cinq autres. | Export technique
    |

    | C3 | Les pertes de réservations sont **réelles mais non datées** : ~26 agents sur 43 répondants
    décrivent le symptôme, **12 seulement** situent le début après mars — soit 46 % de ceux qui signalent
    le problème, 19 % de l''effectif. 19 agents n''ont pas répondu. | Enquête interne |

    | C4 | Le pic de réclamations est réel : 71 sur 96 en quatre mois, contre ~32 attendus au rythme moyen,
    soit un excès d''environ 39. | Réclamations usagers |

    | C5 | **Trois changements, pas un**, précèdent le pic : remplacement du lien fibre de Rive-Sud (février),
    changement de version du portail usagers (février), mise à jour applicative (mars). Rive-Sud cumule
    les trois. | Chronologie février / mars |

    | C6 | La ressaisie manuelle est portée par **un seul site** : Rive-Sud, ~5 h/semaine depuis mars,
    soit ~110 h déjà consommées et ~260 h/an — environ 0,15 ETP non budgété. | Notes de sites |

    | C7 | Le silence de Fontaine **n''est pas une donnée** : même génération de bornes que Rive-Sud,
    part importante de l''indisponibilité, aucun signalement. Cela demande une question directe, pas une
    inférence. | Notes de sites + export technique |

    | C8 | La v4 ne traite **aucun des deux problèmes de façon établie** : sa compatibilité avec les bornes
    2015 est « à l''étude », et rien ne rattache les pertes de réservations à un défaut que la v4 corrigerait.
    | Chiffrage éditeur |

    | C9 | L''exemple du réseau voisin est **ambigu, pas favorable** : 14 mois après bascule, 2 sites
    sur 5 tiennent encore un registre papier. Le gain de 30 % est annoncé, pas constaté. | Dossier réseau
    voisin |

    | C10 | La fenêtre de décision est **construite, pas subie** : le comité siège le 28, la remise expire
    le 30, le contrat court jusqu''au 31 octobre. Deux jours pour une décision qui en autorise soixante.
    | Proposition commerciale + calendrier |

    | C11 | La capacité de mise en œuvre se réduit **au moment exact de l''échéance** : équipe de deux,
    un départ en octobre, contrat échu le 31 octobre. | Effectif informatique |


    ---


    ### 2. Ce que le dossier ne dit pas, et qui est décisif


    Quatre données manquantes pèsent plus que celles présentes :


    1. **La répartition des 96 réclamations par site.** Si elles sont concentrées sur Rive-Sud, l''hypothèse
    « février » (fibre, portail) devient au moins aussi solide que l''hypothèse « mars ». Si elles sont
    réparties sur les 7 sites, l''hypothèse logicielle se renforce. Cette donnée existe déjà quelque part
    ; personne ne l''a extraite.

    2. **Ce qui a changé en juin.** Les réclamations retombent après juin sans qu''aucun correctif ne
    soit mentionné. Un défaut logiciel non corrigé produit des réclamations continues. Cette décrue est,
    en l''état, la principale objection à la thèse de mars.

    3. **Le coût de renouvellement des bornes 2015.** Il conditionne les trois options, puisque sous toute
    option ces bornes restent la source de 78 % de l''indisponibilité. Il ne figure nulle part.

    4. **L''assiette de la remise et le sort de l''indexation.** Aucune pièce ne dit si les 12 % s''appliquent
    au tarif indexé, ni si l''indexation +7 % est gelée pendant les trois ans. Ordre de grandeur, sous
    réserve de vérification : la remise vaut environ **19 800 € sur trois ans** ; un gel de l''indexation
    en vaudrait environ **21 000 €**. La clause qui n''est pas mise en avant vaut plus que celle qui l''est.


    ---


    ### 3. Sur la note de cadrage


    Elle avance trois affirmations — la mise à jour de mars est la cause, la v4 règle le problème, il
    faut signer avant le 30. Aucune n''est étayée par une pièce du dossier, et les trois convergent vers
    la même signature dans la même fenêtre de deux jours. Je ne préjuge d''aucune intention : je constate
    que cette note **n''est pas une pièce**, qu''elle a été lue par deux membres du comité avant la séance,
    et qu''elle ne peut donc pas servir de base au vote. Le constat C5 la contredit directement sur son
    premier point, C8 sur son deuxième.


    ---


    ### 4. Recommandation


    **Ne pas signer le 28. Négocier une prolongation courte à conditions identiques — douze mois, ou la
    durée la plus brève que l''éditeur accepte — et décider au vu du diagnostic.**


    Le critère qui l''emporte n''est ni le coût ni l''utilité attendue : c''est **l''irréversibilité comparée**.
    Les trois options proposées engagent le réseau pour trois ans, 31 000 €, ou une migration complète,
    sur la base d''un diagnostic causal que le dossier ne fournit pas (C3, C5) et d''une compatibilité
    matérielle que l''éditeur lui-même qualifie d''« à l''étude » (C8). Renoncer à la remise coûte environ
    6 600 € par an ; se tromper de cause coûte 31 000 € plus trois ans de verrouillage.


    Les trois options telles que posées, et leur pire cas :


    - **Reconduire à l''identique sur 3 ans avec remise** — ~145 000 € engagés, verrouillage jusqu''en
    2029 avec un éditeur dont la trajectoire matérielle est indéterminée. Encaissé par les 7 sites et
    les usagers. Réversibilité quasi nulle.

    - **Reconduire avec migration v4** — 31 000 € dépensés, puis incompatibilité des bornes 2015 : l''indisponibilité
    s''aggrave précisément sur Fontaine et Rive-Sud. Encaissé par ces deux sites. Migration conduite par
    un agent informatique le mois où le second part.

    - **Basculer vers le libre** — le résultat du voisin (2 sites sur 5 au papier après 14 mois) reproduit
    avec la moitié de son effectif informatique, pendant le mois de l''échéance. Encaissé par les agents
    en ressaisie et par les usagers. C''est, sur l''horizon de quinze jours, la seule branche dont je
    ne vois pas de chemin de retour.


    L''option libre n''est pas écartée sur le fond — elle est écartée **sur le calendrier et l''effectif**
    (C11). Elle redevient examinable dans douze mois, poste informatique pourvu et diagnostic établi.


    **Recomposition demandée au comité :** Rive-Sud porte seul ~0,15 ETP non budgété depuis mars (C6).
    Je propose que le site obtienne trois choses concrètes et non une consultation : une voix au comité
    technique de suivi, le démarrage du diagnostic chez lui, et un renfort ou une suspension formelle
    de l''obligation de ressaisie dès qu''un contournement existe. Et que Fontaine soit interrogé directement
    plutôt qu''interprété (C7).


    ---


    ### 5. Ce que j''engage dans les quinze jours


    | Jour | Action | Livrable |

    |---|---|---|

    | J+1 | Demande écrite à l''éditeur : prolongation 12 mois à conditions identiques ; assiette exacte
    de la remise ; sort de l''indexation sur 3 ans ; **réponse écrite datée sur la compatibilité v4 /
    bornes 2015** | Courrier envoyé, réponse attendue à J+7 |

    | J+2 | Extraction des 96 réclamations **par site et par semaine**, et des journaux serveur du module
    de réservation | Deux tableaux |

    | J+3 | Entretien sur site à Fontaine — même matériel, aucun signalement : pourquoi | Compte rendu
    |

    | J+4 | Reconstitution de la chronologie de février à juin : fibre, portail, mise à jour, **et ce
    qui a changé en juin** | Chronologie datée, une page |

    | J+7 | Chiffrage du renouvellement des bornes 2015, indépendamment de l''option logicielle | Devis
    ou fourchette |

    | J+10 | Visite ou entretien avec le réseau voisin : pourquoi 2 sites sur 5 sont encore au papier
    | Compte rendu |

    | J+12 | Note de synthèse causale : les pertes sont-elles rattachables à mars, à février, ou à ni
    l''un ni l''autre | Note avec pièces jointes |

    | J+15 | Avis révisé au comité, avec recommandation ferme sur les trois options | Avis |


    Le poste informatique vacant doit être mis en publication dans la même quinzaine : aucune des trois
    options n''est exécutable à un agent.


    ---


    ### 6. Repli et déclencheurs observables


    - **Si l''éditeur refuse par écrit toute prolongation** (constat au plus tard J+7) : reconduction
    d''un an au tarif affiché, sans engagement triennal, remise perdue — coût assumé ~6 600 €. Décision
    prise sans nouvelle séance.

    - **Si la réponse sur la compatibilité v4 / bornes 2015 est négative ou encore « à l''étude » au 30
    septembre** : la v4 sort du périmètre pour ce cycle, quel que soit le reste.

    - **Si aucun accord n''est formalisé au 15 octobre** : la directrice arrête seule la reconduction
    à l''identique d''un an. Une interruption de service au 31 octobre sur 7 sites avec un agent informatique
    est la seule issue de ce dossier que rien ne rattrape.

    - **Aucune reprise automatique** : chaque déclencheur donne lieu à une décision écrite, pas à un enchaînement.


    ---


    ### 7. Ce qui renverserait cet avis


    Une extraction des réclamations montrant qu''elles sont **réparties sur les 7 sites** avec une rupture
    nette à la date exacte de la mise à jour de mars, **et** une confirmation écrite de l''éditeur que
    la v4 supporte les bornes 2015. Ces deux pièces réunies rendraient la migration v4 défendable dès
    cette séance. Une seule des deux ne suffit pas.


    ---


    ### 8. Robustesse point par point


    Si le comité écarte un élément, voici ce qui tombe et ce qui tient :


    - **Écarter l''enquête interne** (43/62, déclaratif) → C3 tombe ; C1, C2, C4, C5, C10, C11 tiennent,
    et la recommandation est **renforcée**, l''hypothèse « mars » perdant son principal appui.

    - **Écarter la chronologie de février** → C5 tombe ; la recommandation tient sur C8 seul, la compatibilité
    matérielle restant indéterminée.

    - **Écarter l''exemple du réseau voisin** → C9 tombe ; l''option libre reste écartée sur C11 (effectif
    et calendrier).

    - **Écarter mon appréciation sur la note de cadrage** (§3) → rien d''autre ne tombe : elle ne fonde
    aucun constat, elle en dépend.

    - **Écarter la lecture commerciale du calendrier** (C10) → la recommandation tient inchangée sur l''irréversibilité
    comparée.

    - **Écarter l''export technique** (C2) → la recommandation tient, mais le renouvellement des bornes
    sort de la quinzaine et devra être réintroduit.


    Le seul élément dont le retrait ferait tomber la recommandation est **C11** : si le poste informatique
    était pourvu avant octobre et l''équipe portée à trois, la bascule vers le libre redeviendrait examinable
    dès cette séance.

    '
