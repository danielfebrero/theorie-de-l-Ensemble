  text: 'Voici la note. Elle est construite autour d''un point structurant : **votre retour (≈ 29 août)
    précède le comité d''achat de septembre.** Aucune décision irréversible n''a donc à être prise en
    votre absence — la contrainte des 8 jours est une contrainte de forme, pas de fond.


    ---


    # NOTE DE DIRECTION — DÉCISION EXÉCUTOIRE


    **Objet :** Contrat d''exclusivité proposé par le distributeur D — décision, mandat de négociation
    et plan d''exécution

    **Date :** 8 août 2026

    **De :** Direction générale

    **À :** DAF, Directeur commercial, Directeur industriel, DRH — comité de direction

    **Portée :** Cette note vaut instruction. Elle s''applique du 9 août au retour de la DG (≈ 29 août).
    Elle prime sur toute décision antérieure sur ce dossier.


    ---


    ## 1. Décision


    **Nous ne signons pas le contrat proposé par D, dans aucune de ses versions actuelles.**


    Nous répondons dans le délai de huit jours par une **contre-proposition écrite, ferme et unique**
    (§3), et nous engageons immédiatement le plan de résilience (§6), que D accepte ou non.


    Cette décision n''est pas rediscutable en mon absence. Le mandat de négociation du comité est borné
    au §4. Hors de cette enveloppe, la réponse est non — sans exception, sans arbitrage, sans « accord
    de principe ».


    ## 2. Le raisonnement — à opposer mot pour mot à D


    Le contrat proposé détruit de la marge même si D tient ses engagements de volume.


    - Marge brute actuelle sur D : 14,9 M€ × 31 % = **4,62 M€**

    - Avec 9 % de remise et +18 % de volume : 4,62 M€ → **3,87 M€**, soit **−0,75 M€ (−16 %)**

    - **Une remise de 9 % exige +41 % de volume pour être neutre.** On nous en propose 18, et seulement
    la première année.

    - Années 2 et 3 : la remise est contractuelle, le volume seulement indicatif. À volume plat, la perte
    est de **−1,34 M€ par an**. Sur trois ans, l''exposition cumulée atteint **≈ 3,4 M€**, soit près de
    la moitié d''une année entière de marge brute — plus 1,2 M€ si nous voulons sortir.

    - Pendant ce temps, l''exclusivité nous interdit la centrale régionale (3,5 M€) et la marketplace
    (+6 points de marge), c''est-à-dire précisément les deux seuls leviers capables de réduire notre dépendance.


    Nous ne refusons donc pas par principe : nous refusons parce que ce contrat nous ferait payer 3,4
    M€ pour renoncer au droit de nous diversifier. Tenez cette phrase. Elle est vérifiable, et elle est
    notre position.


    ## 3. Ce que vous envoyez à D — au plus tard le 14 août


    Lettre signée conjointement DAF + Directeur commercial, adressée au directeur des achats, copie à
    son directeur général. Ton : partenarial, ferme, non défensif. Nous voulons le volume, pas le conflit.


    Contenu impératif :


    1. **Remise conditionnelle et incrémentale.** 9 % — le taux qu''ils demandent — mais appliqués **uniquement
    aux volumes livrés au-delà de 105 % du volume de référence des douze derniers mois**, versés en ristourne
    trimestrielle sur volume constaté, jamais en remise sur facture. Sur la base de leur propre engagement
    de +18 %, cela leur rapporte l''essentiel de ce qu''ils réclament et nous laisse **+0,6 M€ de marge**
    au lieu de −0,75. C''est le cœur de l''offre : la remise récompense la croissance, elle ne la préfinance
    pas.

    2. **Durée 12 mois**, reconductible par accord exprès, au lieu de 36.

    3. **Pas d''exclusivité de canal.** Nous proposons à la place une **exclusivité produit sur les quatre
    références socle, limitée à la GMS nationale**, excluant explicitement la vente directe numérique,
    la restauration hors foyer et les centrales régionales.

    4. **Symétrie des engagements.** Préavis de déréférencement de 6 mois. Pénalité de sortie plafonnée
    à 0,3 M€, réciproque, et annulée si D descend de plus de 10 % sous son engagement — nous rappellerons
    factuellement la baisse de 11 % constatée au deuxième trimestre.

    5. **Contreparties sans coût de marge**, à offrir largement : priorité de production sur leurs commandes,
    engagement de taux de service à 98 %, deux innovations en primeur par an, co-développement d''une
    référence dédiée.

    6. **Validité de l''offre : 30 septembre.** Nous proposons une réunion de closing à mon retour, dans
    la semaine du 31 août — avant leur comité d''achat.


    ## 4. Enveloppe de négociation — limites impératives


    Le comité peut ajuster, à double signature DAF + Directeur commercial, **dans ces bornes seulement**
    :


    | Paramètre | Marge de manœuvre autorisée |

    |---|---|

    | Seuil de déclenchement de la ristourne | de 105 % à 102 % du volume de référence |

    | Taux sur l''incrémental | jusqu''à 11 % |

    | Durée | jusqu''à 18 mois |

    | Pénalité de sortie | jusqu''à 0,4 M€, à condition qu''elle reste réciproque |

    | Contreparties de service | libres |


    **Lignes rouges — refus automatique, sans consultation :**


    - toute remise portant sur le volume de base ;

    - toute exclusivité couvrant la vente directe numérique ou les centrales régionales ;

    - toute pénalité non réciproque ou supérieure à 0,4 M€ ;

    - toute durée supérieure à 18 mois ;

    - tout engagement de volume asymétrique (ferme pour nous, indicatif pour eux) ;

    - toute lettre d''intention, « accord de principe » ou courriel valant engagement.


    Si D exige de sortir de cette enveloppe : réponse écrite « nous en discuterons à la réunion du 31
    août ». Rien d''autre.


    ## 5. Scénarios


    - **D accepte ou négocie dans l''enveloppe** → signature possible, double signature, notification
    immédiate au conseil.

    - **D refuse et maintient sa menace** → nous maintenons notre offre jusqu''au 30 septembre et n''ajoutons
    rien. Poursuite du §6.

    - **D durcit ou avance son comité d''achat** → ne cédez pas. Activez le §9 et informez le conseil
    sous 24 h.

    - **D déréférence effectivement** → application immédiate du plan Redon (§8) et du volet juridique
    (§9). Cette hypothèse ne peut matériellement se produire qu''après mon retour.


    ## 6. À exécuter dès le 10 août, quel que soit D


    Ces actions ne sont pas conditionnées à l''issue de la négociation. Elles constituent notre rapport
    de force.


    **a) Chiffrage des quatre références menacées — Directeur commercial, sous 48 h.** Poids exact en
    CA, en marge et en heures de production. C''est la donnée qui manque à ce dossier et elle conditionne
    tout : si les quatre références pèsent moins de 25 % du volume D, notre position est confortable ;
    au-delà de 40 %, appliquez d''emblée le §8 en préventif. Résultat communiqué à l''ensemble du comité
    et consigné.


    **b) Marketplace — lancement sous 15 jours, Directeur commercial.** Nous sommes libres de tout engagement
    : c''est maintenant ou jamais. Budget plafonné à 120 k€, deux références non menacées par D pour éviter
    le conflit frontal. Objectif : 0,4 M€ facturés d''ici décembre. Même l''hypothèse basse valide le
    canal et nous donne un précédent.


    **c) Centrale régionale — accélération, Directeur commercial.** Sollicitez une **commande pilote avant
    fin septembre** plutôt que d''attendre leur décision à cinq mois. Vous pouvez consentir jusqu''à 4
    % de remise contre un engagement ferme de volume. Ne mentionnez jamais la négociation en cours avec
    D.


    **d) Financement préventif — DAF, sous 10 jours.** Négociez une ligne de crédit court terme de 1,5
    M€ **pendant que nos comptes sont bons**. Ne la tirez pas. Une banque prête à une entreprise saine,
    pas à une entreprise en difficulté visible. Gel simultané de tout capex non engagé au-delà de 50 k€.


    ## 7. Trésorerie — seuils et gouvernance


    Point hebdomadaire du DAF, tous les vendredis, diffusé au comité et archivé.


    - **En dessous de 1,7 M€** : gel de tous les recrutements et achats non contractuels.

    - **En dessous de 1,5 M€** : tirage de la ligne de crédit, information du conseil sous 24 h.

    - **En dessous de 1,2 M€** : le DAF convoque le conseil d''administration, qui se substitue à moi.


    ## 8. Redon — préparation sans déclenchement


    Directeur industriel et DRH, sous 15 jours : **dossier d''activité partielle constitué, chiffré, prêt
    à déposer — mais non déposé.** En parallèle, plan de charge alternatif : prospection de co-packing
    et de MDD tierce pour combler jusqu''à 15 % de plan de charge sous 60 jours.


    **Aucune communication interne sur le chômage partiel avant mon retour.** Si la question est posée
    : « la direction étudie plusieurs scénarios commerciaux, aucune décision sociale n''est envisagée.
    » C''est exact. Une rumeur à Redon nous coûterait des compétences que nous ne remplacerons pas.


    ## 9. Volet juridique — constituer, ne pas dégainer


    DAF, sous 10 jours : mandatez un avocat en droit de la distribution pour une **note confidentielle**
    sur (i) la rupture brutale de relations commerciales établies au regard de notre dépendance de 62
    % et de la baisse de 11 % sans préavis du T2, et (ii) l''exclusivité proposée sous l''angle de l''abus
    de dépendance économique.


    Constituez le dossier probatoire : historique de commandes sur cinq ans, échanges relatifs à la baisse
    du T2, comptes rendus des réunions avec D.


    **Cette note reste interne. Aucune mise en demeure, aucune allusion juridique à D en mon absence.**
    Nous préparons un levier ; nous ne l''utilisons pas tant que D n''a pas déréférencé.


    ## 10. Gouvernance et calendrier


    Le **DAF coordonne** ce dossier et arbitre les désaccords du comité dans les bornes de cette note.
    Comité restreint tous les mardis, 45 minutes, relevé de décisions écrit.


    | Échéance | Action | Responsable |

    |---|---|---|

    | 10 août | Chiffrage des 4 références | Dir. commercial |

    | 14 août | Contre-proposition envoyée à D | DAF + Dir. commercial |

    | 18 août | Ligne de crédit engagée ; mandat avocat | DAF |

    | 25 août | Marketplace en ligne ; dossier Redon prêt | Dir. commercial / Dir. industriel |

    | Sem. du 31 août | Réunion de closing avec D | DG |


    ## 11. Interdictions formelles en mon absence


    1. Signer, parapher ou confirmer par écrit tout engagement hors de l''enveloppe du §4.

    2. Accorder à D la moindre remise sur le volume de base, sous quelque forme que ce soit.

    3. Suspendre ou différer le lancement de la marketplace ou l''approche de la centrale régionale, y
    compris à la demande de D.

    4. Communiquer en interne ou en externe sur un risque social à Redon.

    5. Adresser à D toute correspondance juridique.

    6. Céder à une accélération de calendrier imposée par D. Le calendrier est le nôtre.


    ---


    **Un dernier point, à l''attention du comité.** La véritable question posée par ce dossier n''est
    pas la remise de 9 % : c''est que 62 % de notre activité dépend d''un client qui a démontré au deuxième
    trimestre qu''il pouvait nous couper 11 % sans préavis. Signer trois ans d''exclusivité contre 1,2
    M€ de pénalité, ce serait transformer une dépendance en verrou. Les trois semaines qui viennent doivent
    servir à faire exactement l''inverse. Si vous hésitez sur un arbitrage que cette note ne couvre pas,
    tranchez systématiquement dans le sens qui **préserve nos options** — c''est la seule instruction
    générale que je vous laisse.


    *Signé — Direction générale, 8 août 2026*


    ---


    Deux points d''attention sur ce que j''ai dû supposer : le poids exact des quatre références menacées
    est inconnu et conditionne l''ampleur du risque industriel — d''où le chiffrage à 48 h placé en tête
    du plan. Et j''ai retenu une marge brute uniforme de 31 % sur le périmètre D ; si le mix D est moins
    margé que la moyenne, l''arithmétique du §2 est encore plus défavorable au contrat, jamais l''inverse.


    Si vous voulez, je peux en tirer une version d''une page pour le conseil, ou le projet de lettre à
    D prêt à signer.

    '
