response:
  text: '**Préalable.** L''annexe « catalogue_stations_mesure » jointe en tête ne concerne pas ce dossier
    (réseau d''observation environnementale, document de contrôle). Je ne l''ai pas utilisée. Je retiens
    par ailleurs, faute de mention contraire, que « le 28 » et « le 30 » désignent août 2026 — l''échéance
    contractuelle restant le 31 octobre.


    ---


    # Avis sur le renouvellement du logiciel de réservation et des bornes de prêt


    ## A. Ce que le dossier établit — point par point


    Chaque appréciation est rattachée à la pièce qui la porte, et indique ce qui subsiste si le comité
    écarte cette pièce.


    **A1. Le dossier mélange deux problèmes distincts, qui n''ont ni la même cause ni le même remède.**

    *Repose sur :* l''export technique (41 h d''indisponibilité, dont 32 h sur les deux seuls sites équipés
    de bornes de 2015) d''un côté ; l''enquête interne et les notes de sites (module de réservation) de
    l''autre.

    Le premier est un problème de matériel de onze ans, concentré sur deux sites. Le second est un problème
    logiciel présumé, réparti. La v4 est présentée comme la réponse aux deux ; rien au dossier ne l''indique
    pour le premier.

    *Si écarté :* rien d''autre ne tombe, mais le chiffrage de 31 000 € perd son objet, faute de savoir
    ce qu''il répare.


    **A2. La perte de réservations est rapportée, elle n''est pas mesurée.**

    *Repose sur :* l''enquête interne — 43 réponses sur 62, 61 % des répondants, soit environ 26 agents,
    soit 42 % de l''effectif ; 19 agents n''ont pas répondu.

    Aucune pièce du dossier ne comporte de comptage : ni journal applicatif, ni relevé de réservations
    orphelines, ni ticket éditeur. Nous disposons d''une perception convergente, ce qui est un motif sérieux
    d''enquête, pas d''un fait établi. Le taux de réponse de 69 % est correct ; l''écart possible entre
    répondants et non-répondants reste non documenté.

    *Si écarté :* il ne reste alors, sur la perte de réservations, que les réclamations usagers (A4) et
    la note de Rive-Sud (A5) — ce qui ne suffit pas non plus à qualifier le module.


    **A3. La mise à jour de mars est une hypothèse parmi trois, et c''est la plus tardive.**

    *Repose sur :* la chronologie de février (remplacement du lien fibre de Rive-Sud **et** changement
    de version du portail usagers) ; l''enquête, où 12 répondants sur 43 seulement situent le début après
    mars — soit moins de la moitié des ~26 agents qui déclarent des pertes.

    Trois changements techniques précèdent ou accompagnent les symptômes ; deux sont antérieurs à celui
    que la note de cadrage désigne. Aucun élément du dossier ne départage les trois.

    *Si écarté :* la mise à jour de mars ne devient pas pour autant la cause — elle redevient une hypothèse
    non testée.


    **A4. Le pic de réclamations est réel ; son extinction n''est pas expliquée.**

    *Repose sur :* 71 réclamations sur mars-juin (≈ 18/mois) contre 25 sur les huit autres mois (≈ 3/mois),
    soit un rapport de 1 à 6.

    Le pic est trop marqué pour être du bruit. Mais il retombe après juin — alors que la mise à jour de
    mars, elle, est toujours en place. Deux lectures tiennent : soit le dysfonctionnement était transitoire,
    soit il est désormais absorbé en interne et n''atteint plus l''usager. La seconde lecture est cohérente
    avec A5. Le dossier ne permet pas de trancher.

    *Si écarté :* le seul indicateur objectif et daté du dossier disparaît ; il ne reste que du déclaratif.


    **A5. Le coût réel identifié aujourd''hui est humain, à Rive-Sud, et il dépasse le coût des pannes
    de bornes.**

    *Repose sur :* la note de site — 5 h/semaine de ressaisie depuis mars.

    Soit environ 110 h depuis mars, ~250 h en rythme annuel : six fois le volume total d''indisponibilité
    des bornes sur douze mois, sur un seul site. C''est la charge la plus tangible du dossier.

    *Si écarté :* la dimension « coût caché » disparaît, et l''urgence à traiter le sujet baisse d''autant.


    **A6. Le contraste Fontaine / Rive-Sud pointe vers une cause locale, sans la démontrer.**

    *Repose sur :* Fontaine ne signale rien, alors que les deux sites partagent les mêmes bornes de 2015
    et l''essentiel des 32 h de panne ; Rive-Sud est le seul site dont le lien fibre a été remplacé en
    février.

    Ce qui distingue Rive-Sud n''est pas le logiciel — commun à tous les sites — mais son infrastructure
    réseau. C''est l''indice le plus discriminant du dossier. Réserve expresse : l''absence de signalement
    de Fontaine n''est pas une absence de problème ; le dossier ne dit pas si Fontaine dispose d''un canal
    de remontée actif.

    *Si écarté :* on perd la piste la plus économique à tester, et l''hypothèse logicielle redevient équiprobable.


    **A7. La compatibilité de la v4 avec les bornes de 2015 est inconnue, et ces bornes portent 78 % de
    l''indisponibilité.**

    *Repose sur :* la mention « à l''étude » chez l''éditeur ; l''export technique (32 h sur 41).

    Il est proposé d''engager 31 000 € sans garantie de fonctionnement sur le matériel précisément à l''origine
    de la majorité des pannes constatées. « À l''étude » n''est pas une réponse : c''est l''absence de
    réponse.

    *Si écarté :* rien ne subsiste pour recommander la v4 en l''état.


    **A8. L''échéance commerciale n''est pas l''échéance opérationnelle.**

    *Repose sur :* l''offre de 12 % conditionnée à une signature avant le 30 ; l''échéance du contrat
    au 31 octobre.

    Deux mois séparent les deux dates. Perdre la remise n''est pas perdre le service. La remise est par
    ailleurs conditionnée à un engagement de trois ans, et le dossier ne dit pas si les 12 % portent sur
    la seule première année (≈ 5 800 € d''économie) ou sur les trois années indexées (≈ 18 500 €) : l''écart
    entre les deux lectures est d''un facteur trois.

    *Si écarté :* la décision devient purement technique, ce qui ne change pas ma recommandation.


    **A9. Le basculement vers le libre n''est pas arbitrable dans le calendrier.**

    *Repose sur :* l''équipe informatique de deux personnes, dont une part en octobre ; le réseau voisin,
    14 mois après bascule, avec 2 sites sur 5 encore au registre papier.

    Une personne ne conduit pas une migration de sept sites avant le 31 octobre. Les 30 % annoncés sont
    un coût de licence, pas un coût complet ; le cas voisin suggère un reste-à-faire de 40 % après plus
    d''un an. Ce n''est pas un rejet de l''option sur le fond — c''est un constat de capacité.

    *Si écarté :* il faudrait alors documenter qui conduit la migration et sur quel calendrier, ce que
    le dossier ne fait pas.


    **A10. La note de cadrage n''est pas une pièce du dossier.**

    *Repose sur :* la note elle-même, qui ne cite aucun élément.

    Elle enchaîne trois affirmations (cause établie, remède établi, urgence établie) dont aucune n''est
    étayée par les pièces ci-dessus, et dont la troisième reprend l''argument du fournisseur. Deux membres
    du comité l''ont lue avant séance. Je la signale non pour la contester sur le fond — elle pourrait
    se vérifier — mais parce qu''elle circule avec le statut d''un diagnostic sans en avoir la substance.

    *Si écarté :* rien ne change à l''analyse ; c''est précisément le point.


    ---


    ## B. Recommandation


    **Ne pas signer avant le 30. Reconduire à l''identique, sur la durée la plus courte que l''éditeur
    accepte, en refusant l''engagement de trois ans. Décider de la v4 en octobre, sur pièces.**


    Motif tenant en une phrase : nous n''avons pas de diagnostic, et les 31 000 € de la v4 comme les trois
    ans de l''offre remisée sont des engagements difficilement réversibles pris contre un diagnostic manquant.
    Six semaines de mesure coûtent moins cher que l''un ou l''autre.


    Ce que cela écarte, et pourquoi :

    - **v4 maintenant** — écartée tant que A7 tient (compatibilité bornes inconnue) et A3 (cause non identifiée).
    Acheter un correctif avant de connaître le défaut.

    - **Libre maintenant** — écartée sur A9 (capacité), pas sur le fond. À réinstruire au budget suivant,
    avec un calendrier et un pilote nommés.

    - **Trois ans remisés** — écartés sur A7 et A8 : s''engager trois ans avec un éditeur qui ne sait
    pas dire si son produit fonctionne avec notre matériel.


    Le point de sortie doit être explicite : **si, au 15 octobre, le diagnostic n''est pas établi, nous
    reconduisons à l''identique pour douze mois et nous n''achetons rien d''autre.** C''est un résultat
    acceptable, pas un échec.


    ---


    ## C. Le meilleur argument contre cet avis


    Il mérite d''être posé en séance, parce qu''il est solide : *attendre coûte de l''argent réel.* L''indexation
    à +7 % compose, la remise peut valoir jusqu''à 18 500 € sur trois ans, et arriver au 31 octobre sans
    contrat, avec un seul informaticien, serait opérationnellement pire que de payer trop cher. Un réseau
    de cette taille n''écarte pas 18 500 € d''un revers de main.


    Ce que je réponds : la remise n''est pas gratuite, elle est le prix d''un verrouillage de trois ans.
    Si le module est effectivement en cause et que la v4 ne le corrige pas — ou ne fonctionne pas avec
    les bornes de 2015 — le coût de sortie dépasse largement 18 500 €. Et l''alternative à la signature
    du 30 n''est pas l''absence de contrat : c''est une reconduction au tarif public, ou une prolongation
    technique, jusqu''au 31 octobre et au-delà.


    **Réserve honnête :** cette réponse repose sur une hypothèse que le dossier ne confirme pas — que
    la reconduction reste possible après le 30. Si l''éditeur soutient le contraire, je veux cette affirmation
    par écrit ; ce serait le seul élément capable de renverser ma recommandation, et il est vérifiable
    en une journée (D4).


    ---


    ## D. Ce que j''engage sous quinze jours (28 août → 12 septembre)


    Sept actions, chacune avec un livrable daté et un critère d''arrêt.


    **D1. Extraction des journaux du module de réservation, janvier → août, par site et par semaine.**

    Compter les réservations perdues ou orphelines. C''est la pièce manquante centrale (A2). Demande écrite
    à l''éditeur sous 48 h si les journaux sont de son côté.

    *Critère :* si l''éditeur ne peut ou ne veut pas produire ces journaux sous dix jours, ce refus est
    en soi un élément d''appréciation à porter au comité d''octobre.


    **D2. Test discriminant à Fontaine — deux semaines de relevé.**

    Même bornes, même logiciel, aucun signalement (A6). Relevé systématique des réservations non abouties.

    *Critère :* pertes constatées à Fontaine → cause logicielle, réseau entier, la v4 redevient pertinente.
    Aucune perte → cause locale à Rive-Sud, et les 31 000 € ne traitent pas le problème.


    **D3. Chronologie datée, à superposer aux réclamations hebdomadaires.**

    Dates exactes du remplacement fibre, du changement de version du portail, de la mise à jour de mars,
    du début de la ressaisie à Rive-Sud (A3, A4, A5). Une page, un graphique.

    *Critère :* si le décrochage précède mars, l''hypothèse de la note de cadrage tombe.


    **D4. Trois questions écrites à l''éditeur, réponse exigée avant le 12 septembre.**

    (a) La v4 est-elle compatible avec les bornes de 2015 — oui ou non, à quelle date la réponse sera-t-elle
    ferme ? (b) Prix d''une reconduction de douze mois sans engagement pluriannuel. (c) La reconduction
    reste-t-elle possible après le 30, et à quelles conditions ?

    *Critère :* pas de réponse écrite sur (a) au 12 septembre → la v4 sort de l''arbitrage de ce cycle.


    **D5. Devis de remplacement des bornes de 2015, indépendamment du logiciel.**

    Ces bornes portent 78 % de l''indisponibilité (A1, A7). Leur renouvellement se pose même si nous ne
    changeons rien au logiciel, et il doit être chiffré séparément pour ne pas être absorbé dans la ligne
    « v4 ».


    **D6. Appel au réseau voisin — trente minutes, avant le 5 septembre.**

    Une seule question : pourquoi deux sites sur cinq tiennent-ils encore un registre papier quatorze
    mois après ? La réponse conditionne toute instruction sérieuse de l''option libre (A9).


    **D7. Point de capacité informatique, à porter au comité du 28 lui-même.**

    Le départ d''octobre doit être arbitré avant, et non après, toute décision de migration. Aucune migration
    — v4 ou libre — ne peut être calendrée sans remplacement ou assistance externe budgétée.


    ---


    ## E. Ce qui me ferait changer d''avis, et quand


    - **D2 montre des pertes à Fontaine** *et* **D4(a) confirme par écrit la compatibilité bornes 2015**
    → la v4 devient défendable ; je la recommanderai en octobre, hors engagement de trois ans.

    - **D4(c) établit par écrit que l''éditeur refuse toute reconduction après le 30** → la décision change
    de nature ; je reviens devant le comité sous 72 h.

    - **D1 et D3 montrent des pertes stables sur toute l''année, sans lien avec mars** → le problème est
    structurel, la v4 ne le corrige pas davantage, et l''instruction de l''option libre devient prioritaire
    au budget suivant.


    Je ne demande pas au comité d''écarter la note de cadrage. Je demande qu''aucune des trois options
    ne soit signée sur la seule base d''affirmations qu''aucune pièce du dossier ne porte — et que la
    décision se prenne le 15 octobre, avec deux semaines de marge avant l''échéance réelle.

    '
