response:
  text: '## Position de l''entreprise — lot F-2418 / réclamation Sodimarché 21 400 €


    **Ateliers de Grandval — note destinée à l''assureur, et au client en cas de contestation de la facture**

    **Règle de lecture appliquée :** toute affirmation de fait ci-dessous porte le numéro de la pièce
    qui la soutient. Les affirmations non couvertes par une pièce sont regroupées au § 4 et déclarées
    comme hypothèses, non comme faits.

    **Hiérarchie retenue entre les pièces :** horodatage automatique (P3, P5) > mention manuscrite (P2)
    > déclaration orale (P7). Cette règle joue ici contre nous sur P2 ; nous l''appliquons quand même.


    ---


    ### 1. Chronologie du 3 juin établie par pièces


    | Heure | Fait | Pièce | Nature |

    |---|---|---|---|

    | 6 h 25 | Fin de chargement, produit relevé à 3 °C | P1 | Déclaratif, signé opérateur |

    | « 6 h 40 » | Départ mentionné sur le BL | P2 | Manuscrit — **contredit par P3** |

    | 9 h 05 | Mise sous tension du groupe froid / enregistreur | P5 | Automatique |

    | 9 h 05 → | Relevés 2,9 à 3,6 °C | P5 | Automatique |

    | 11 h 12 | Sortie du véhicule du site (seule sortie du jour) | P3 | Automatique |

    | 12 h 55 | Arrivée dépôt, 1 792 barquettes réceptionnées | P4 | Déclaratif dépôt |


    Écarts qui en résultent : **2 h 40 sans aucun enregistrement** (6 h 25 → 9 h 05), **2 h 07 d''immobilisation
    sur site avec froid documenté** (9 h 05 → 11 h 12), **1 h 43 de route avec froid documenté** (11 h
    12 → 12 h 55). Total entre fin de chargement et réception : 6 h 30.


    ---


    ### 2. Ce que l''entreprise reconnaît


    **2.1 — La mention « départ 6 h 40 » du bon de livraison est inexacte (P2 contre P3).** Le véhicule
    a quitté le site à 11 h 12. Nous ne nous prévalons d''aucun élément tiré de cette mention et nous
    la rectifions au dossier. Elle a été portée par notre chauffeur sur notre document.


    **2.2 — Le lot est resté immobilisé 4 h 47 sur notre propre site**, dont 2 h 40 pendant lesquelles
    aucune pièce n''établit la température de conservation (P1, P3, P5). Ce n''est pas un aléa de transport
    : c''est une immobilisation chez nous, sous notre garde.


    **2.3 — Nous reconnaissons un défaut de preuve, pas une rupture de la chaîne du froid.** La distinction
    n''est pas rhétorique : aucune pièce du dossier ne mesure la température du produit entre 6 h 25 et
    9 h 05, ni chez nous (P5 muette) ni à la réception (P4 ne porte **aucune température produit à l''arrivée**).
    Nous assumons de ne pas pouvoir documenter cette fenêtre. Nous n''admettons pas un fait que personne
    n''a mesuré.


    **2.4 — La procédure interne était défaillante** : rien n''imposait la mise sous tension du groupe
    et de l''enregistreur avant chargement, ni le rapprochement entre l''heure manuscrite du BL et le
    journal de portique. Le plan de correction figure au § 7.5.


    ---


    ### 3. Ce que l''entreprise conteste


    **3.1 — Le quantum, en totalité, faute de pièce.** 21 400 € est un montant global non ventilé. Aucune
    pièce du dossier ne porte le détail marchandise / transport / pénalité, ni le procès-verbal de destruction,
    ni la clause contractuelle fondant la « rupture d''assortiment » et son mode de calcul. Une somme
    non ventilée et non pièces n''est pas une créance liquide.


    **3.2 — L''écart de 48 barquettes.** Le réceptionnaire du dépôt a signé pour 1 840 unités (P2) et
    son bon de réception en porte 1 792 (P4). Deux lectures possibles, toutes deux à sa charge : soit
    48 unités n''ont jamais été livrées et l''indemnité ne peut porter que sur des unités identifiées,
    soit le comptage à la réception est défaillant — et la fiabilité de la procédure d''où procède le
    prélèvement litigieux est alors en cause. Nous demandons l''explication de cet écart avant toute discussion
    sur le montant.


    **3.3 — La valeur probante de l''analyse P6.** Elle est unilatérale, non contradictoire, et porte
    sur 3 barquettes sur 1 792 (0,17 %) sans plan d''échantillonnage. Le rapport ne mentionne ni la date
    et l''heure de prélèvement, ni l''identification des barquettes, ni la méthode, ni l''accréditation
    du laboratoire, ni l''incertitude de mesure, ni les conditions de conservation entre le refus et l''analyse.
    Or **entre 12 h 55 (P4) et le prélèvement, la marchandise était sous la garde du dépôt**, garde dont
    aucune pièce ne rend compte.


    Sur le fond : la flore mésophile est un indicateur d''hygiène et de conservation, non un critère de
    sécurité sanitaire — aucun pathogène n''a été recherché. Elle croît avec la durée de vie du produit
    ; sans date de fabrication ni date de prélèvement, un résultat ne date pas l''exposition qui l''a
    produit. Le dépassement est de 0,62 log, à apprécier au regard d''une incertitude non communiquée.
    Sur trois unités, sans plan d''échantillonnage à deux classes, un lot n''est pas déclaré non conforme.


    **3.4 — Le motif du refus n''est documenté par aucune mesure contemporaine.** Un dépôt qui refuse
    un lot pour rupture de la chaîne du froid ne relève aucune température produit à la réception (P4).
    Le seul élément est postérieur, unilatéral, et pris sous sa garde.


    **3.5 — La pénalité de rupture d''assortiment** suppose un engagement d''assortiment identifié et
    un préjudice constitué (achat de remplacement, coût réel de non-couverture). Aucune pièce.


    ---


    ### 4. Affirmations non couvertes par une pièce — déclarées comme hypothèses


    | Hypothèse | Statut | Pièce à produire |

    |---|---|---|

    | Le chauffeur serait « parti tôt » et aurait « attendu » (P7) | **Déclaration orale, sans valeur
    probante** ; « parti tôt » est en outre contredit par P3. Nous ne construisons rien dessus. | Attestation
    écrite conforme à l''art. 202 CPC, rédigée par l''intéressé sans suggestion de contenu |

    | Le groupe froid aurait été à l''arrêt avant 9 h 05 | **Non établi.** P5 établit que l''*enregistreur*
    était hors tension, ce qui n''est pas la même chose. | Données brutes de l''enregistreur (n° de série,
    courbe complète, valeur initiale à 9 h 05, position de la sonde, dernier étalonnage) |

    | Le semi-remorque aurait été à quai réfrigéré et scellé entre 6 h 25 et 9 h 05 | **Hypothèse à vérifier
    — élément potentiellement décisif** | Relevés de température du quai, journal d''occupation des postes
    à quai, vidéo si conservée |

    | Le transport était assuré par nos moyens propres | **Non établi.** Si le chauffeur relève d''un
    transporteur tiers, un recours distinct s''ouvre. | Contrat de transport, carte grise du véhicule,
    contrat de travail ou lettre de voiture |

    | Le délai de huit jours court depuis une date donnée | **Non établi — et c''est le point le plus
    urgent du dossier.** | Enveloppe, accusé de réception ou en-tête du courriel portant réception de
    la réclamation |

    | Le lot était conforme à la libération usine | À vérifier | Analyses libératoires du lot F-2418,
    contre-échantillons de l''échantillothèque |


    ---


    ### 5. Pièces réclamées au dépôt


    Facture détaillée et ventilée ; procès-verbal de refus ; procès-verbal ou certificat de destruction
    avec date, opérateur et destination ; relevés de température du quai de réception et de la chambre
    entre 12 h 55 et le prélèvement ; rapport de laboratoire complet (méthode, accréditation, date et
    heure de prélèvement, identification des unités, DLC, incertitude) ; explication de l''écart 1 840
    / 1 792 ; clause contractuelle de la pénalité d''assortiment et justificatifs du préjudice ; facture
    de transport.


    ---


    ### 6. Ce que l''entreprise engage dans les huit jours


    **J+0 — Établir par pièce la date de départ du délai.** Le contrat n''est opposable que si la date
    de réception de la réclamation est prouvée. C''est la première action, avant toute rédaction.


    **J+1 — Réponse écrite au dépôt, LRAR doublée d''un courriel avec accusé de réception.** Objet unique
    et suffisant : empêcher l''acquisition de plein droit de la pénalité. Contenu : contestation motivée
    du principe et du quantum, réserves expresses, absence de toute reconnaissance de responsabilité,
    demande des pièces du § 5, proposition d''expertise contradictoire, et proposition du § 8.


    **J+1 — Mise en demeure conservatoire de ne pas détruire les 1 792 barquettes**, ou, si la destruction
    est déjà intervenue sans que nous y ayons été appelés, constat écrit que le dépôt nous a privés de
    toute vérification contradictoire et supporte la charge de cette impossibilité. C''est l''action la
    plus irréversible du dossier : une fois la marchandise détruite, le § 3.3 ne se plaide plus.


    **J+2 — Déclaration de sinistre à l''assureur**, dossier P1 à P7 numéroté, accompagné de la présente
    note et de la liste des pièces internes en cours de production.


    **J+3 à J+6 — Production des pièces internes** du § 4, chacune avec un responsable nommé et une date
    : données brutes de l''enregistreur, relevés de quai, attestation écrite du chauffeur, audition écrite
    de l''opérateur de quai, échantillothèque du lot, analyses libératoires, statut contractuel du transport.


    **J+7 — Plan de correction daté et signé**, joint à la réponse : mise sous tension du groupe et de
    l''enregistreur imposée avant chargement avec preuve horodatée, blocage du BL sans reprise automatique
    de l''heure de portique, rapprochement systématique BL / portique, double comptage contradictoire
    au chargement.


    ---


    ### 7. Proposition faite au dépôt


    Sans reconnaissance de responsabilité et sous réserve de tous droits : remplacement en nature du lot
    sous 72 heures à nos frais, prise en charge du transport aller-retour, ouverture de nos relevés de
    quai et de notre plan de correction au dépôt, association du dépôt à l''expertise contradictoire et
    à une revue conjointe à 30 jours — contre renonciation à la pénalité d''assortiment et abandon de
    la réclamation forfaitaire. Cette proposition donne au dépôt la marchandise, le transport et un droit
    de regard réel sur nos procédures ; elle ne lui donne pas 21 400 € non justifiés.


    ---


    ### 8. Ce qui renverserait cette position, et le repli correspondant


    **L''observation qui renverse :** la courbe brute de l''enregistreur. Si la première valeur à 9 h
    05 est déjà à 3 °C sans transitoire de descente, une masse de 1 840 barquettes n''a pas pu s''échauffer
    significativement pendant les 2 h 40 précédentes, et notre position se durcit. Si la descente est
    lente ou part d''une valeur haute, la rupture thermique est établie chez nous et la position change.


    **Repli, avec déclencheur observable :** si à J+15 les données brutes montrent un transitoire de descente
    supérieur à 45 minutes ou une valeur initiale au-delà de 7 °C, **ou** si le dépôt produit un rapport
    de laboratoire complet avec chaîne de conservation documentée, nous abandonnons la contestation du
    principe et négocions sur le seul quantum — valeur marchandise et transport contre abandon de la pénalité,
    en transaction.


    **Pire cas et qui l''encaisse :** l''entreprise seule. 21 400 € payés sans recours, perte du référencement
    Sodimarché, et — risque le plus sérieux pour l''assureur comme pour nous — refus de garantie si la
    police conditionne la couverture au fonctionnement de l''enregistreur embarqué ou à la mise en route
    du groupe froid. **Ce point doit être vérifié dans les conditions particulières avant l''envoi de
    la déclaration**, et il commande la rédaction : aucune formulation de la présente note ne doit reconnaître
    un fait qu''aucune pièce n''établit.


    ---


    Trois points d''attention pour vous, avant envoi : vérifiez d''abord la date de réception de la réclamation
    (tout le reste en dépend), obtenez confirmation écrite que la marchandise n''est pas encore détruite,
    et faites relire les clauses d''exclusion de la police avant que la déclaration parte — c''est le
    seul endroit où une phrase mal placée coûte plus que les 21 400 €.

    '
