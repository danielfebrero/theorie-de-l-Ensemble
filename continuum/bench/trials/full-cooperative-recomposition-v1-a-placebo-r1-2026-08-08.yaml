response:
  text: 'Le publish n''est pas passé (autorisation refusée). La note complète est écrite dans le fichier
    ; voici la position et son raisonnement.


    **Fichier :** `.../scratchpad/note-position-cle-veze.md`


    ---


    ## Le point de départ : l''addition 570 est fausse méthodologiquement


    Elle aligne trois grandeurs incomparables. Les **180 L/s** sont un plancher légal (arrêté préfectoral,
    L.214-18) — hors de ma compétence, et adossés à la seule expertise datée du dossier. Les **150 L/s**
    sont une priorité de droit (L.211-1). Les **240 L/s** sont une *demande déclarée, jamais instruite*
    — le seul terme élastique.


    Appliquer la règle sans rien faire donne : 410 − 180 − 150 = **80 L/s pour l''irrigation, soit 33
    % de la demande**. C''est le scénario par défaut de jeudi. Tout mon travail consiste à faire mieux
    que ces 80 L/s étalés à l''aveugle.


    ## L''anomalie que personne ne regarde


    **150 L/s pour 9 200 habitants = 1 409 L/hab/jour.** La référence domestique est de 150 L/hab/j ;
    même avec un réseau à 60 % de rendement, il faudrait ~27 L/s. Il reste **~120 L/s non expliqués —
    75 % du déficit du bassin.**


    Trois explications possibles, aux conséquences très différentes : prélèvement autorisé ≠ réel (le
    déficit est en partie fictif) ; pertes de réseau massives (10-20 % récupérables en 3 semaines) ; ou
    des abonnés non domestiques — et dans ce cas **la priorité L.211-1 ne couvre pas cette part**, qui
    protège l''eau potable de la population, pas l''eau industrielle transitant par un réseau potable.
    Données exigées sous 72 h.


    À quoi s''ajoute que le **410 lui-même** est une mesure unique, tarage 2023 : à l''étiage l''incertitude
    usuelle de ±10-15 % vaut 40-60 L/s — l''ordre de grandeur de la dispute. Et le stock de la retenue
    est simplement absent du dossier.


    ## La proposition


    **Une formule, pas une négociation :** `Irrigation = Q₇ⱼ − 180 − D_AEP vérifié`. Elle est automatique
    (plus de renégociation à chaque baisse), et surtout **chaque litre économisé par la régie tombe directement
    chez les maraîchers**. C''est le levier politique central : ça transforme un jeu à somme nulle en
    jeu coopératif, et ça donne à la régie une raison d''ouvrir ses données comme aux maraîchers une raison
    d''arrêter de la traiter en adversaire.


    **Ne pas étaler.** 80 L/s sur 620 ha = 1,1 mm/j : pas un tiers de récolte partout, mais un échec quasi
    général avec huit semaines de charges engagées à perte. Les mêmes 80 L/s à pleine dose couvrent ~205
    ha. Je concentre selon la valeur sauvée par m³ (stade phénologique compris), j''indemnise le renoncement
    déclaré, j''impose l''irrigation nocturne — seul litre gratuit du dossier. **Et je délègue la répartition
    nominative entre les 34 exploitations au syndicat**, contre déclaration culturale et compteurs télérelevés.


    **Les 600 k€ :** 90 k métrologie, 110 k recherche de fuites régie, **360 k rachat d''hectares** (~880
    €/ha, versés *avant* la perte, en acompte sur l''ISN), 40 k suivi + réserve. Répartis uniformément
    ils feraient 15 % du préjudice annoncé : rien acheté, aucun litre récupéré.


    **Seuils fixés d''avance**, pas dans la panique : 380 → 50 L/s, 350 → 20, **≤ 330 → suspension totale**,
    et en dessous je saisis le préfet en le disant publiquement, parce que AEP contre débit réservé n''est
    pas mon arbitrage.


    ## Les trois justifications


    - **Maraîchers** : vous n''aurez pas 240, cette eau n''existe pas. Mais je refuse l''équirépartition
    qui vous aurait tout fait perdre, je mets 360 k€ de trésorerie sous 15 jours, je vous rends l''arbitrage
    entre vous, et les économies de Ferney vous reviennent mécaniquement. Vos 4,1 M€ devront être documentés
    — ce qui vous sert s''ils sont exacts. Et une chaise vide ne suspend pas l''écriture de la règle.

    - **Régie** : votre dotation n''a jamais été menacée, elle est en dur dans la formule — vous n''avez
    donc rien à gagner à ne pas parler. Mais je garantis un *besoin*, pas un *prélèvement*, et l''écart
    de 1 409 L/hab/j sera posé jeudi, par moi ou plus brutalement par d''autres. Ce qui menace votre robinet,
    ce ne sont pas les maraîchers : c''est 410 L/s, 4 jours de tampon et 3 semaines sans pluie.

    - **Milieu** : les 180 tiennent — non par générosité, mais parce que la CLE n''a pas le pouvoir d''y
    toucher, parce qu''une récolte est une perte 2026 quand deux frayères sont une décennie, et parce
    que c''est la seule donnée instruite du dossier. La seule question que j''ouvre est le *point de conformité*
    de l''arrêté : s''il vise un point aval avec apports intermédiaires, le lâcher au barrage peut légalement
    être inférieur.


    ## Deux points de méthode


    Cette note est un **avis, opposable à personne** : je demande mandat pour la faire transcrire en arrêté
    de crise (L.211-3). Sans arrêté ni comptage, seuls les usagers de bonne foi paient.


    Et je conteste le cadrage « paysans contre robinets » : le bassin a distribué **570 L/s de droits
    sur une ressource qui en délivre 410 en année sèche**. Le déficit est structurel, l''étiage n''a fait
    que le révéler. D''où la révision des volumes prélevables du SAGE, à l''ordre du jour de septembre
    — sinon nous rejouons cette séance chaque été.


    ---


    Je ne propose pas une solution : il manque 160 L/s et rien là-dedans ne les crée. Je propose la répartition
    la moins destructrice d''une pénurie qui ne se répartit pas bien. Les maraîchers perdront de l''argent
    — l''alternative leur en ferait perdre davantage, et les deux autres pertes possibles ne sont ni réparables
    ni indemnisables.


    Si vous voulez, je peux publier la note en page partageable (il faudra approuver l''upload), ou la
    décliner en trois courriers séparés aux parties.

    '
