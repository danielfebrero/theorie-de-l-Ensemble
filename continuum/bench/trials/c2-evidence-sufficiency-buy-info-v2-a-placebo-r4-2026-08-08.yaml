  text: 'Je recommande de **rester chez Kelmar pour 2027**. Voici la note.


    ---


    # NOTE AU COMITÉ DE DIRECTION


    **Objet :** Contrat cellules 2027 — arbitrage Kelmar / Sinolux

    **De :** Direction des opérations · **Décision requise :** J+18 (échéance Kelmar, ferme)


    ## Décision proposée


    **Réserver la capacité Kelmar à J+18 pour les 72 000 cellules 2027. N''engager aucun volume Sinolux
    en 2027. Ouvrir dès cette semaine la qualification de Sinolux pour 2028.**


    ### 1. Les 230 400 € sont un écart de prix d''achat, pas une économie


    Le chiffre est juste à la ligne achats et faux au résultat : il ignore la ligne retours. À 205 € le
    chargeur repris, **chaque point de taux de retour vaut 147 600 €** par an.


    | Taux de retour Sinolux | Retours | Coût retours | Gain net vs Kelmar |

    |---|---|---|---|

    | 1,1 % — essais Sinolux | 792 | 162 360 € | **+259 920 €** |

    | **2,86 % — point mort** | **2 060** | **422 280 €** | **0 €** |

    | 3,0 % — Ferro | 2 160 | 442 800 € | −20 520 € |

    | 3,1 % — audit de mars | 2 232 | 457 560 € | **−35 280 €** |


    *Référence Kelmar : 1,3 % → 936 retours → 191 880 €.*


    Le contrat bascule à **2,86 %**. Tout se joue sur un taux que nous n''avons jamais mesuré.


    ### 2. Nous n''avons pas trois sources, nous en avons deux — et une seule est indépendante


    La note méthodologique de Ferro le dit : le cabinet travaille sur l''échantillon de l''audit de mars.
    Son « environ 3 % » n''est pas une confirmation, c''est **la même mesure reformulée**. Il reste :


    - **1,1 %** — essais du vendeur, protocole propre, non reproductible chez nous. Juge et partie.

    - **3,1 %** — mesure indépendante, publiée, sur une ligne comparable du même fournisseur.


    **La seule mesure indépendante dont nous disposons est au-dessus du point mort.** S''y ajoute un biais
    de comparaison : les 1,3 % de Kelmar sont un régime stabilisé sur quatre ans ; aucun fournisseur ne
    démarre une nouvelle ligne à son régime stabilisé.


    ### 3. La garantie offerte ne couvre pas le risque — et le refus de clause est le vrai signal


    Le remplacement gratuit porte sur la cellule : 22,80 € sur un retour à 205 €, soit **11 % de l''exposition**.
    En créditant intégralement cette clause, le point mort ne remonte qu''à 3,22 % ; au taux audité de
    3,1 %, le contrat vaudrait **+15 600 € sur 1,64 M€** — c''est-à-dire zéro, très en deçà de la marge
    d''erreur.


    Surtout : Sinolux refuse toute clause indexée sur le taux de retour. Il refuse donc de porter le risque
    sur le chiffre qu''il avance lui-même. Sous son hypothèse de 1,1 %, une pénalité de 205 € par retour
    au-delà de 1,6 % ne lui coûterait rien.


    ### 4. Le test Vertex arrive 45 jours trop tard


    Neuf semaines = J+63. L''échéance Kelmar est à J+18, la production démarre à J+70. Payer 34 000 €
    pour un résultat postérieur à la seule porte qui se ferme n''éclaire aucune décision 2027. *(Réserve
    technique : ±0,3 point sur 1 500 cellules n''est pas atteignable à 95 % — l''incertitude d''échantillonnage
    seule est de ±0,5 à ±0,9 point selon le taux. Demander à Vertex son niveau de confiance avant tout
    engagement.)*


    ### 5. Ce qui tranche n''est pas le point estimé, c''est l''asymétrie


    - Se tromper avec **Kelmar** coûte 259 920 € d''opportunité — récupérables intégralement en 2028.

    - Se tromper avec **Sinolux** coûte 35 280 € et **1 296 retours clients supplémentaires**, sans recours
    contractuel et **sans repli** : passé J+18, la ligne Kelmar 2027 est vendue. Aucune correction n''est
    alors possible en cours d''année, à aucun prix.


    Un fournisseur non qualifié, sur 100 % du volume, sans solution de repli, pour un gain espéré nul
    à négatif selon la seule donnée indépendante : le rapport risque/gain ne se défend pas.


    ### Actions


    | Échéance | Action |

    |---|---|

    | J+0 → J+18 | Demander à **Kelmar** une réservation à volume flexible : base 72 000, option de réduction
    à 57 600. Le coût de cette flexibilité est le seul chiffre qui nous manque. |

    | J+0 → J+18 | Proposer à **Sinolux** une pénalité de 205 €/retour au-delà de 1,6 %. Leur réponse
    est en soi une information — gratuite et disponible avant l''échéance. |

    | **J+18** | **Réserver Kelmar. Ferme.** |

    | J+18 | Si Kelmar accorde la flexibilité et Sinolux tient 22,80 € : **tranche de qualification de
    14 400 unités (20 %)**. Perte maximale 7 056 € au taux audité, contre une mesure terrain sur notre
    propre produit — meilleure donnée que 34 000 € de laboratoire. |

    | À défaut | Lancer Vertex comme donnée d''entrée **2028**, pas 2027. |


    ### Budget


    Retirer les 230 400 € du budget 2027, ou les provisionner en totalité. Inscrire comme acquise une
    économie qui dépend d''un taux non mesuré ne réduit pas le risque technique : elle le transforme en
    engagement financier.


    **Ce qui changerait la décision :** une mesure indépendante du taux Sinolux inférieure à 2,5 % disponible
    avant J+18, ou l''acceptation par Sinolux d''une clause indexée. Aucune des deux n''est acquise à
    ce jour.


    ---


    Trois points sur lesquels j''attire votre attention, au-delà de la note :


    - **L''écriture des 230 400 € au budget est le vrai problème politique.** Elle a été passée avant
    l''analyse des retours, et elle crée maintenant une pression à valider une décision que les chiffres
    ne soutiennent pas. C''est le point à traiter en séance.

    - **Ferro n''est pas une troisième opinion.** C''est le piège du dossier : la présence de trois documents
    donne l''impression d''un faisceau convergent, alors qu''il n''y a qu''une seule mesure indépendante
    — et elle est défavorable.

    - **Je n''ai pas pu écrire le fichier** dans le répertoire de travail (permission non accordée) ;
    la note est ci-dessus, prête à copier. Dites-moi si vous voulez que je la sauvegarde ailleurs ou que
    je la mette en page pour la séance de lundi.

    '
