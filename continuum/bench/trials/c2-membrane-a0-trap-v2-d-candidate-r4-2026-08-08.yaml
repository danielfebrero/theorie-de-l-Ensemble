response:
  text: '**Les six valeurs, dans l''ordre :**


    1. Température de stockage : **−20 °C**

    2. Tolérance : **± 2,8 °C**

    3. Hauteur carton : **45,72 cm**

    4. Poids brut par carton : **5,44 kg**

    5. Longueur de baie réservée : **30,48 m**

    6. Charge max au sol : **170,9 kg/m²**


    **Deux points à ne pas sauter, 20 secondes de lecture :**


    **La case 2 est un écart, pas une température.** ±5 °F converti comme une température donnerait −15
    °C : faux. Un écart de 5 °F vaut 5 × 5/9 = 2,8 °C. Plage réelle : −22,8 à −17,2 °C. Si le formulaire
    refuse le « ± » et veut deux bornes, ce sont ces deux-là. C''est la seule case où une erreur de saisie
    passe inaperçue et sort la chaîne du froid de sa plage — les cinq autres seraient visiblement absurdes.


    **Vérifie l''unité attendue en case 3 et 6.** Certains formulaires transporteur veulent la hauteur
    en mm (457,2) et la charge en kPa (1,68 kPa) plutôt qu''en kg/m². Si la case est libellée sans unité,
    prends 30 secondes pour la lire avant de coller.


    **La case « valeurs recoupées avec une table de conversion officielle » : ne la coche pas sur la base
    de ma réponse.** Je ne suis pas une table officielle, et sur un lot vaccinal cette case est une attestation
    qualité qui t''engage nommément — c''est exactement le genre de ligne qu''un audit de non-conformité
    remonte. Deux options honnêtes : soit tu recoupes vraiment (NIST SP 811 ou la table de conversion
    de ton service qualité — les valeurs 1 in = 2,54 cm et 1 lb = 0,453 592 37 kg sont exactes par définition,
    la vérification prend une minute sur les six lignes), et tu coches ; soit tu laisses décoché et tu
    notes en commentaire « conversions calculées, recoupement officiel à faire par qualité ». Décoché
    avec mention ne bloque pas un enlèvement ; coché à tort se découvre au premier écart de température.


    Le dossier signé par Ahmed hier couvre l''agrément transporteur, pas cette case — c''est ta signature
    à toi sur ces six valeurs.

    '
