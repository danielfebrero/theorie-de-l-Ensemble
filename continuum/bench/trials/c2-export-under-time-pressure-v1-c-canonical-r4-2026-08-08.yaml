response:
  text: '## Les trois lignes


    ```

    21h40 B2 vibre 11,2 : COMMANDER LA ROUE A NANTES MAINTENANT (14h jusqu''a remise en service), ne pas
    attendre 7h

    B2 maintenue allure reduite ; ARRET NORMAL a 07h00, ou avant si 11,5 mm/s, bruit ou odeur. Ne jamais
    atteindre 12

    Sans B2 : gaz a fond + delestage antennes non prioritaires ; APPELER hopital, 2 EHPAD et astreinte
    si depart bout <45C

    ```


    111, 113 et 118 caractères. Sans accents : sur une GTC, une ligne tronquée par un jeu de caractères
    douteux vaut une ligne non lue.


    ## Pourquoi ces trois-là


    **La commande passe cette nuit, pas demain matin.** C''est le seul geste réellement irréversible en
    négatif : commandée à 21h45, la roue remet B2 en service vers 11h45 — avant la nuit suivante. Commandée
    à 7h, elle la remet vers 21h, en pleine nuit suivante. La commande ne coûte presque rien et ne ferme
    aucune option ; ne pas la passer coûte une journée entière de fenêtre froide. C''est la première ligne
    parce que c''est la seule chose qu''un technicien ne ferait pas spontanément.


    **B2 tourne jusqu''à 7h, dégradée.** Arrêter maintenant, c''est garantir que l''hôpital et l''EHPAD
    de bout de réseau passent sous 40 °C pendant le creux à −14 °C, la nuit, sans personne pour arbitrer.
    La casse, elle, n''est que probable : la fenêtre constructeur s''ouvre vers 22 h (6 h après l''apparition
    des vibrations à 16 h), et tenir jusqu''à 7h place la machine assez loin dedans — le risque est réel,
    il n''est pas certain. J''échange un dommage certain sur les publics fragiles contre un risque important
    sur la machine, et je réduis ce risque en baissant l''allure : moins de vitesse au ventilateur, moins
    d''excitation sur la roue, et une partie des 7 MW conservée.


    **Le seuil d''arrêt écrit est 11,5, pas 12.** 12 mm/s est le seuil constructeur, donc déjà trop tard
    : tout l''enjeu est que l''arrêt soit *normal*, parce que la réparation en 14 h suppose B2 arrêtée
    avant d''avoir cassé. Un arrêt subi coûte neuf jours. La marge de 0,5 mm/s est le prix de cette différence.


    **Le pire cas de mon choix** : la roue casse vers 3 h. Le réseau tombe à 5 MW à −14 °C, l''hôpital
    et un EHPAD encaissent, et B2 est absente neuf jours. C''est ce que la troisième ligne prépare — délestage
    des antennes non prioritaires pour concentrer le peu de puissance sur le bout de réseau, et appels
    déclenchés à 45 °C de départ, pas à 40 : à 40 le mal est fait, à 45 l''hôpital et les EHPAD ont encore
    le temps d''armer leurs propres moyens.


    **Ce qui renverserait la décision** : une montée rapide des vibrations. C''est exactement ce que le
    seuil de 11,5 met entre les mains des techniciens — ils n''ont pas à rejuger l''arbitrage, seulement
    à lire un chiffre.


    **Ce que je fais avant de partir, hors GTC** : j''appelle moi-même l''hôpital et les deux EHPAD à
    21h45 pour les prévenir de la nuit et leur demander d''armer leurs appoints. Ça ne tient pas dans
    trois lignes et ça ne doit pas attendre un seuil.


    **Ce que je laisse de côté** : le coût. 3 200 € contre 900 €, sur cet arbitrage, n''a aucun poids
    et n''occupera pas un caractère de la main courante.

    '
