response:
  text: 'Voici la note. Un point d''assurance d''abord : tout repose sur un calcul de marge que j''ai
    fait à partir des seuls chiffres de l''énoncé, en supposant le coût de revient entièrement variable.
    J''ai testé la sensibilité à cette hypothèse (§3) et la conclusion tient, mais la note charge le DAF
    de refaire le calcul avec la vraie structure de coûts — et prévoit explicitement ce qui se passe si
    le résultat me contredit.


    ---


    # NOTE DE DIRECTION — MANDAT D''EXÉCUTION EN L''ABSENCE DU DG


    **De :** Direction générale

    **À :** Comité de direction (DAF, DC, DRH, Direction industrielle, Direction des opérations)

    **Date :** 8 août 2026

    **Objet :** Offre d''exclusivité du distributeur D — décision, enveloppe de signature, plan de repli

    **Portée :** du 9 août au retour du DG. Exécutoire. Non soumis à délibération.


    ---


    ## 1. Ce que ce mandat autorise et interdit


    Le comité **n''arbitre pas** l''offre de D : elle est arbitrée ci-dessous. Le comité exécute, transmet,
    et ne peut signer qu''à l''intérieur de l''enveloppe du §5. Hors de cette enveloppe, la réponse est
    non — sans réunion, sans vote, sans nouvelle note.


    **En l''absence d''accord clair, rien n''est signé.** Le silence, l''urgence, l''échéance du 20 août
    ou un désaccord interne ne valent jamais signature.


    Les positions écrites du DAF et du DC sont réputées versées au dossier et closes. Aucune position
    interne, aucun document interne, aucune mention d''un désaccord au comité ne sort de l''entreprise.
    Vis-à-vis de D, il n''existe qu''un texte : la contre-proposition du §4.


    ---


    ## 2. Décision


    1. **Nous ne signons pas l''offre présentée.**

    2. **Nous transmettons à D, lundi 10 août avant 12h, une contre-proposition que j''ai signée avant
    mon départ** (§4). C''est notre réponse dans le délai de huit jours.

    3. **Nous armons dès le 10 août le plan de repli du §7, sans attendre la réponse de D** — y compris
    si D accepte.


    ---


    ## 3. Le fait qui décide


    Ce n''est pas un choix de tempérament entre prudence et audace. C''est de l''arithmétique.


    Marge brute actuelle sur D : 14,9 M€ × 31 % = **4,62 M€**.


    Une remise de 9 % sur le prix de cession ne coûte pas 9 % de marge : elle coûte 9 points de prix sur
    une marge de 31 points, soit **29 % de la marge unitaire**. Il faut donc bien plus de 18 % de volume
    pour la compenser.


    | Scénario | CA D | Marge brute | Écart annuel |

    |---|---|---|---|

    | Aujourd''hui | 14,9 M€ | 4,62 M€ | référence |

    | Signature, +18 % tenu | 16,00 M€ | 3,87 M€ | **−0,75 M€** |

    | Signature, volume revenu au niveau actuel (an 2) | 13,56 M€ | 3,28 M€ | **−1,34 M€** |

    | Signature, an 2 à −11 % (comme au T2) | 12,07 M€ | 2,92 M€ | **−1,70 M€** |


    **Volume nécessaire pour qu''une remise de 9 % soit neutre : +41 %.** En supposant 20 % de charges
    fixes dans le coût de revient — hypothèse favorable à la signature — le seuil descend à **+25 %**.
    Dans les deux cas, au-dessus des 18 % proposés.


    **L''offre détruit de la marge même si D honore intégralement son engagement.** Le meilleur cas de
    D est un cas négatif pour nous.


    À quoi s''ajoute ce que l''exclusivité ferme pendant trois ans : la centrale régionale (3,5 M€, soit
    1,08 M€ de marge annuelle) et la marketplace (0,4 à 2,2 M€ à +6 points, soit 0,15 à 0,81 M€). Ces
    options ne sont pas certaines, mais elles sont réelles et elles sont gratuites tant qu''on ne signe
    pas.


    **Règle générale, à appliquer sans moi.** Une remise de *d* points de prix est neutre si le volume
    ferme *v* satisfait :


    > **d ≤ 31 % × v / (1 + v)**


    → v = +10 % : d ≤ 2,8 % · v = +18 % : d ≤ 4,7 % · v = +25 % : d ≤ 6,2 % · v = +41 % : d ≤ 9 %


    Cette formule permet au comité d''évaluer n''importe quelle variante que D proposera, sans m''appeler.


    ---


    ## 4. Contre-proposition transmise à D (texte pré-signé, joint à cette note)


    Nous acceptons le principe d''un partenariat renforcé, aux conditions suivantes :


    - **Remise 4 %** sur le prix de cession, applicable dès le premier euro, **sur engagement ferme de
    +18 % de volume**. Au-delà de +25 %, la remise passe à 6 % sur les volumes incrémentaux.

    - **Durée : 12 mois fermes**, reconductibles par accord exprès.

    - **Symétrie de l''engagement.** Le volume est calendaire et mensualisé. Deux mois consécutifs sous
    90 % du calendrier convenu : l''exclusivité tombe de plein droit et la remise revient à zéro le mois
    suivant, sans indemnité ni préavis.

    - **Exclusivité limitée** au canal magasins de D sur son territoire. Carve-out explicite pour la vente
    en ligne directe et les plateformes alimentaires.

    - **Indemnité de rupture symétrique, plafonnée à 0,3 M€** de part et d''autre. L''indemnité de 1,2
    M€ à sens unique représente 57 % de notre trésorerie disponible : elle n''est pas discutable.

    - **Maintien des huit références** pendant les 12 mois.


    Motif communicable à D, à reprendre tel quel : *« Une remise de 9 % contre un engagement d''un an
    ne se finance pas. Nous vous proposons la même sécurité de volume, à un prix que nous pouvons tenir
    trois ans plutôt qu''un. »*


    ---


    ## 5. Enveloppe de signature — ce que le comité peut accepter sans moi


    Toute signature exige **la co-signature du DAF et du DC** et le respect des six planchers suivants.
    Un seul plancher franchi : c''est non.


    1. Remise ≤ 4 % si le volume ferme est de +18 %. Au-delà, appliquer strictement la formule du §3 avec
    une marge de sécurité de 1 point pour absorber le coût industriel de la montée en cadence.

    2. Exclusivité ≤ 12 mois fermes.

    3. Engagement de volume **ferme et sanctionné sur toute la durée de l''exclusivité**. Un volume «
    indicatif » ne compte pas comme un engagement : c''est un zéro dans le calcul.

    4. Clause de libération automatique en cas de sous-consommation (§4).

    5. Indemnité de sortie symétrique et ≤ 0,3 M€.

    6. Carve-out écrit pour la vente en ligne directe et les plateformes.


    Aucune contrepartie non chiffrée — promesse d''animation commerciale, de mise en avant, de « discussion
    à venir sur les volumes » — ne compense le franchissement d''un plancher. Ce qui n''est pas dans le
    contrat n''existe pas.


    **Délai de réflexion obligatoire : 24 heures pleines entre toute réunion avec D et toute signature.**
    Aucune signature en séance, jamais.


    ---


    ## 6. Visite de l''acheteur de D


    Elle est acceptée, **après** transmission de notre contre-proposition, jamais avant. Elle porte sur
    notre texte.


    - Présents : DAF et DC uniquement. Le DAF présente le calcul de marge du §3 ; le DC traite le volet
    commercial. Aucun des deux ne sort du texte transmis.

    - Toute question hors du texte reçoit une seule réponse : *« Nous vous répondrons par écrit. »*

    - Aucune concession, aucun chiffre nouveau, aucune ouverture de principe donnée en séance.

    - Procès-verbal écrit dans les deux heures, diffusé au comité, versé au dossier.


    Que D ait avancé son comité d''achat, fixé huit jours et annoncé quatre déréférencements simultanément
    est un dispositif de pression cohérent, adressé à un comité de direction dont il sait le DG absent.
    Nous ne parions pas que c''est du bluff — nous n''en avons pas les moyens. Mais nous n''accélérons
    pas non plus notre décision au rythme qu''il a choisi.


    ---


    ## 7. Plan de repli — armé dès le 10 août, quelle que soit la réponse de D


    Ces six actions ne sont conditionnées à rien. Elles s''exécutent même si D accepte notre contre-proposition.


    | # | Action | Responsable | Échéance |

    |---|---|---|---|

    | 1 | Chiffrer le poids exact en CA et en marge des 4 références menacées ; obtenir de D par écrit
    lesquelles | DC | 11 août |

    | 2 | Refaire le calcul du §3 avec la répartition réelle fixe/variable du coût de revient, validée
    par l''expert-comptable | DAF | 12 août |

    | 3 | Sécuriser une ligne de crédit confirmée ou un affacturage d''au moins 1,5 M€ | DAF | **avant
    le 20 août** |

    | 4 | Ouvrir le compte marketplace et référencer 3 produits | DC | 20 août |

    | 5 | Demander à la centrale régionale un référencement pilote sur 2 références avant leur décision
    plénière ; obtenir un signal écrit | DC | 31 août |

    | 6 | Préparer le dossier d''activité partielle Redon et informer le CSE de la situation | DRH | 18
    août |


    **L''action 3 est la plus urgente et la plus sous-estimée.** Une banque tarife sur la situation qu''elle
    connaît. Après le 20 août, si les déréférencements ont lieu, le même dossier coûte plus cher ou n''est
    plus accordé. Une ligne non tirée ne coûte presque rien ; une ligne refusée en septembre coûte l''entreprise.
    Elle se négocie **maintenant**, pendant que la relation avec D paraît normale.


    **Gel immédiat** de tout investissement non engagé et de tout recrutement hors remplacement critique,
    jusqu''à mon retour.


    ---


    ## 8. Après le 20 août — deux branches, aucune décision à prendre


    **Branche A — D accepte, ou accepte dans l''enveloppe du §5.** Co-signature DAF + DC après le délai
    de 24 h. Le plan de repli du §7 continue intégralement : la contre-proposition a été construite pour
    le permettre.


    **Branche B — D refuse et déréférence quatre références.**


    - Aucune renégociation dans les dix jours qui suivent. Aucune contre-contre-proposition. Nous laissons
    le prix d''un fournisseur retiré se manifester chez eux.

    - Si les 4 références représentent **plus de 25 % du CA total** (6 M€) : dépôt du dossier d''activité
    partielle Redon le 21 août, consultation CSE engagée le même jour.

    - Si elles représentent **moins de 15 %** : pas de dispositif social, redéploiement des volumes sur
    marketplace et centrale.

    - Entre les deux : le DAF projette la trésorerie à 90 jours ; sous 1,2 M€ de disponible projeté au
    30 septembre, le dossier est déposé.

    - Communication interne le 21 août, portée par la DRH et le DC ensemble, sur un texte unique. Les
    52 postes de Redon apprennent la situation par nous, pas par un client ou par la presse professionnelle.


    ---


    ## 9. Ce qui renverserait cette décision


    Je m''engage sur ces trois basculements. Ils sont exécutoires sans moi.


    1. **Si D accepte un engagement de volume ferme et sanctionné de +41 % sur trois ans**, alors la remise
    de 9 % devient neutre et le contrat se signe tel quel. Le problème n''est pas la remise, c''est qu''elle
    n''est adossée à rien après douze mois.

    2. **Si le recalcul du DAF (action 2), validé par l''expert-comptable, montre un seuil de neutralité
    inférieur à +18 %**, ma décision est fausse et le comité est autorisé à signer l''offre d''origine,
    à la double condition du maintien des huit références et d''une indemnité de sortie ramenée à 0,3
    M€. La validation externe est obligatoire — je ne veux pas d''un calcul qui cherche son résultat.

    3. **Si la centrale régionale donne un accord écrit avant le 20 août**, la contre-proposition est
    retirée et remplacée par un simple accord-cadre annuel sans exclusivité d''aucune sorte.


    ---


    ## 10. Le meilleur argument contre cette note


    Le dossier du DAF est sérieux et je veux qu''il soit lu, pas écarté.


    *62 % de notre chiffre d''affaires vient de démontrer au T2 qu''il peut reculer de 11 % unilatéralement.
    Refuser l''offre transforme une dépendance en conflit ouvert avec celui qui la détient, avec trois
    mois de trésorerie et aucune alternative avant cinq mois. Quatre déréférencements au 20 août sont
    une perte certaine et immédiate ; la perte de marge liée à la signature est étalée et partiellement
    hypothétique. Une entreprise meurt de trésorerie, pas de taux de marge. Et les +18 % de volume chargent
    l''usine, maintiennent Redon au-dessus de 70 % et protègent 52 postes dès cette année.*


    Cet argument est juste sur un point décisif : refuser a un coût de trésorerie immédiat, et j''aurais
    tort de le minimiser. C''est pourquoi les actions 3 et 6 du §7 sont non conditionnelles.


    Mais il échoue sur sa propre logique. Ce qu''il invoque pour signer — le −11 % unilatéral du T2 —
    est exactement ce contre quoi les années 2 et 3 ne sont pas protégées, puisque le volume y est « indicatif
    ». L''argument achète douze mois de charge d''usine au prix de trente-six mois de marge dégradée et
    de zéro option. Pour les 52 postes de Redon, il échange une exposition en 2026 avec des leviers contre
    une exposition en 2027 sans aucun levier légal — la marketplace et la centrale nous étant alors interdites.
    Ce n''est pas une protection, c''est un report à conditions aggravées.


    Poussé jusqu''au bout, le raisonnement du DAF réclame un engagement de volume ferme et pluriannuel.
    C''est précisément l''objet du §4. Sa position et celle du DC convergent dans la contre-proposition
    : l''une fournit le plancher chiffré, l''autre le refus de l''exclusivité sèche.


    ---


    ## 11. Signatures et journal


    Cette note est signée par moi le 8 août 2026 et vaut instruction jusqu''à mon retour. La contre-proposition
    du §4 est signée de ma main et jointe : le comité la transmet, il ne la rédige pas.


    Le DAF tient un journal daté de toute décision, de tout échange avec D et de toute action du §7, transmis
    au comité chaque vendredi. Aucune décision n''est prise oralement.


    Si un fait matériellement nouveau et non prévu ici survient — dépôt de bilan de D, offre de rachat,
    contrôle, sinistre industriel — la règle est : **on ne signe rien, on documente, on attend mon retour.**
    Un fait nouveau élève le niveau de prudence ; il ne l''abaisse jamais.


    Vous avez, avec le §3 et le §5, de quoi juger toute variante que D présentera. Vous n''avez besoin
    de mon accord pour rien de ce qui est prévu ici.


    *Le Directeur général*


    ---


    **Le chiffre à obtenir en premier** : le poids en CA des quatre références menacées. C''est la seule
    donnée manquante qui change l''ampleur du repli — pas le sens de la décision — et elle est disponible
    en interne en 48 h.

    '
