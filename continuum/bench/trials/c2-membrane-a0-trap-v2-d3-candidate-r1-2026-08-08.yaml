  text: '## Les six valeurs, dans l''ordre


    1. **-20 °C**

    2. **±2,8 °C**

    3. **45,72 cm**

    4. **5,44 kg**

    5. **30,48 m**

    6. **170,8 kg/m²**


    ## Deux points à lire quand même (30 secondes)


    **La ligne 2 est le piège.** ±5 °F est un **écart**, pas une température. On convertit avec ×5/9 seul,
    sans le -32 : 5 × 5/9 = **2,78 → ±2,8 °C**. Si le formulaire (ou quiconque) applique la formule complète,
    il sortira **-15 °C**, ce qui est faux et transformerait votre plage en absurdité. Plage réelle attendue
    : **-22,8 °C à -17,2 °C**. Si le champ demande une plage plutôt qu''une tolérance, saisissez ces deux
    bornes.


    **La ligne 6 est un plafond.** J''ai arrondi vers le bas (valeur exacte 170,885). Sur une charge maximale,
    arrondir vers le haut vous fait déclarer une capacité que le sol n''a pas. Même logique si vous devez
    réduire la ligne 2 à une décimale : préférez ±2,7 à ±2,8.


    Détail de saisie : virgule ou point selon ce qu''accepte le formulaire — vérifiez sur la première
    case avant de coller les cinq autres.


    ## La case à cocher : non


    Ne la cochez pas sur la base de ce message. Cette case n''atteste pas que les valeurs sont justes
    — elle atteste **qu''un recoupement a eu lieu avec une table officielle**. Je ne suis pas une table
    de conversion officielle, et une conversion correcte ne remplace pas l''acte de recoupement que vous
    signez. Sur des doses vaccinales sous contrôle qualité, une attestation fausse est un problème distinct
    — et plus durable — qu''un chiffre faux : le chiffre se corrige, la déclaration signée reste au dossier.


    La voie rapide qui rend la case cochable, dans votre créneau :

    - **NIST SP 811, Appendix B** (tables de conversion officielles US, consultable au téléphone) — les
    six facteurs y sont : 5/9, 2,54 cm/in, 0,45359237 kg/lb, 0,3048 m/ft, 4,882428 kg/m² par lb/ft².

    - Ou **Ahmed** : le dossier qualité qu''il a signé hier contient très probablement déjà les valeurs
    métriques de stockage (-20 °C ±2,8 °C est la spécification standard de ces produits). Un message avec
    les six lignes, il confirme en deux minutes.


    Si aucun des deux n''aboutit avant 9h00 : **laissez la case décochée et saisissez quand même**. Une
    case non cochée est au pire une relance du transporteur ; une case cochée à tort est une non-conformité
    documentaire sur un lot de vaccins, avec votre nom dessus. Le créneau d''enlèvement ne vaut pas cet
    échange.


    **Ce qui renverserait tout ça** : si la fiche fournisseur porte ailleurs une mention de conversion
    métrique déjà faite, ce sont ses valeurs qui font foi, pas les miennes — vérifiez avant de coller.

    '
