response:
  text: '# Position de la présidence — CLE du bassin de la Vèze

    ## Séance du jeudi


    ---


    ## 1. Ce que je ne mets pas au vote


    Deux points ne relèvent pas d''un arbitrage de la commission, et je le dis d''entrée pour que la discussion
    porte sur ce qui est réellement discutable.


    **L''alimentation en eau potable.** La priorité santé/salubrité/AEP est fixée par la loi, pas par
    nous. Un EHPAD de 110 lits sur une réserve de 4 jours est un risque de sécurité civile. Le *volume*
    de 150 L/s est en revanche pleinement discutable — j''y reviens, c''est le cœur du dossier.


    **Le débit réservé de 180 L/s.** Il résulte d''un arrêté préfectoral : la CLE n''a pas compétence
    pour y déroger, seul le préfet le peut. Mais je ne demanderai pas cette dérogation, et pour une raison
    qui n''est pas juridique : c''est la seule perte du dossier que l''argent ne rachète pas. 4,1 M€ de
    récolte sont un préjudice monétaire, partiellement indemnisable et reconstituable en une saison. Des
    frayères asséchées et un effondrement qualifié de non reconstituable à l''échelle d''une décennie
    ne le sont pas. Les 600 000 € ne rachètent pas un substrat de frayère.


    ---


    ## 2. Le déficit de 160 L/s est une affirmation, pas une mesure


    C''est le point central de ma position. Les trois termes de l''équation `410 − 570 = −160` sont fragiles,
    et aucun n''a été audité.


    **Le 410 L/s.** Il provient d''une station unique, dernier étalonnage 2023. Une dérive de courbe de
    tarage de 10 % — ordinaire à cette échéance, surtout en bas de gamme de débit où la précision est
    la plus mauvaise — représente ±41 L/s, soit un quart du déficit annoncé. Nous nous apprêtons à arbitrer
    4,1 M€ et une population de truites sur un nombre que personne n''a vérifié depuis trois ans.


    **Le 150 L/s de la régie.** 150 L/s = 12 960 m³/jour pour 9 200 habitants, soit **1 409 L/habitant/jour**.
    La moyenne française du besoin domestique est de l''ordre de 150 L/hab/jour. Nous sommes à un facteur
    9. Trois explications possibles : la régie dessert bien plus que Ferney, elle alimente un gros client
    industriel, ou le rendement du réseau est catastrophique. Dans les trois cas, le chiffre est négociable
    — et c''est précisément la discussion que la régie refuse d''ouvrir. Un rendement porté de 55 % à
    70 %, objectif atteignable par sectorisation et réparation des fuites principales en trois semaines,
    libérerait plusieurs dizaines de L/s.


    **Le bilan est calculé en prélèvements bruts, pas en consommation nette.** L''eau potable revient
    à la rivière via la STEP à hauteur de 60–70 %. L''irrigation ne restitue que 10–20 %. Si l''exutoire
    de la STEP se situe en amont de la section de contrôle du débit réservé, une part du 180 est auto-alimentée
    par ce retour, et l''addition `240 + 150 + 180` compte deux fois la même eau. Personne n''a produit
    ce bilan.


    **Par symétrie, j''audite aussi le troisième chiffre.** Je demande à l''hydrobiologiste une note complémentaire
    sous huit jours : le seuil de 180 est-il une falaise ou un gradient ? Existe-t-il une bande d''excursion
    documentée et une durée maximale ? Il serait malhonnête d''auditer les nombres des maraîchers et de
    la régie sans auditer celui qui porte tout l''arbitrage.


    En revanche, la demande agricole tient l''examen : 240 L/s sur 620 ha pendant 56 jours = 3,3 mm/jour,
    soit 187 mm sur la campagne. C''est un besoin de maraîchage sobre, pas une demande gonflée. **Je le
    dirai publiquement.** Le levier côté agricole n''est pas « vous demandez trop », il est ailleurs.


    ---


    ## 3. Ce que je propose


    ### 3.1 Allocation intérimaire, applicable dès vendredi


    De l''eau est prélevée aujourd''hui : je ne diffère pas la décision.


    | Usage | Dotation | Statut |

    |---|---|---|

    | AEP Ferney | 150 L/s | **Provisoire, sous audit à 15 jours** |

    | Débit réservé | 180 L/s | **Ferme, non négociable** |

    | Irrigation | 80 L/s | Plancher garanti, révisable **à la hausse uniquement** |


    **Tout mètre cube libéré par la recalibration ou l''audit du réseau AEP va à l''irrigation, en priorité
    et sans nouveau vote.** Je m''y engage par écrit. C''est la contrepartie que je dois aux maraîchers
    en échange du plancher.


    ### 3.2 La règle qui change tout pour les maraîchers : concentrer, ne pas diluer


    80 L/s répartis uniformément sur 620 ha, c''est 33 % du besoin en pleine chaleur — soit la perte totale
    annoncée, effectivement. Mais 80 L/s **concentrés** irriguent pleinement **207 hectares**. Un hectare
    correctement irrigué produit ; trois hectares au tiers de leur besoin ne produisent rien.


    J''inscris donc dans l''arrêté de répartition :

    - une dotation individuelle en **volume** (m³ sur la période), pas en débit instantané, laissant chacun
    libre de son calendrier ;

    - le **droit de céder, mutualiser ou échanger** sa dotation entre les 34 exploitations, avec compensation
    par le fonds pour celles qui choisissent de mettre en jachère ;

    - un tour d''eau de nuit obligatoire (20 h–8 h) pour l''aspersion.


    Ordre de grandeur : **1,4 à 2 M€ de production préservés** au lieu de zéro sous rationnement uniforme,
    et une part significative des 90 emplois saisonniers maintenue. Si l''audit AEP libère 50 L/s, on
    passe à 336 ha — 54 % de la surface.


    ### 3.3 Emploi des 600 000 €


    | Poste | Montant | Délai |

    |---|---|---|

    | Campagne hydrométrique : re-jaugeage de Sarcelle + 2 points de contrôle amont/aval + bilan net des
    retours STEP | 30 k€ | J+7 |

    | Réseau AEP : sectorisation, mesure des débits nocturnes, réparation d''urgence des fuites majeures
    | 150 k€ | J+21 |

    | Secours AEP pré-contracté (citernes, interconnexion) pour l''EHPAD | 60 k€ | J+5, contrat dormant
    |

    | Fonds agricole **ciblé** : trésorerie des exploitations dont la survie est en jeu + cofinancement
    goutte-à-goutte et sondes tensiométriques | 300 k€ | J+15 |

    | Réserve de gestion non affectée | 60 k€ | — |


    Je refuse la répartition à plat des 600 k€ entre 34 exploitations : 17 600 € chacune face à un préjudice
    de 4,1 M€ n''achètent rien et n''évitent aucune faillite.


    **Point plus lourd que le fonds lui-même :** le régime d''indemnisation des pertes de récolte (assurance
    multirisque climatique / solidarité nationale) couvre une fraction substantielle de ce préjudice.
    Je mandate la CLE pour appuyer le dossier auprès de la DDT dès cette semaine et faire constater les
    pertes contradictoirement. L''enjeu s''y compte en millions, pas en centaines de milliers.


    ### 3.4 Ce que je soumets au vote jeudi


    Pas l''allocation définitive — la voter avec un dénominateur non audité et une partie absente produirait
    une décision sans légitimité et un recours sous quinzaine. Je soumets au vote : **le protocole de
    mesure, l''audit du réseau AEP, la première tranche du fonds, et les paliers de dégradation ci-dessous.**
    L''allocation définitive est votée en séance extraordinaire à J+15, sur chiffres vérifiés.


    ---


    ## 4. Conditions d''arrêt et de révision — annoncées maintenant


    Publication quotidienne des débits mesurés, en accès libre. C''est la seule chose qui tienne une coalition
    dont deux parties ont déjà quitté la table.


    | Déclencheur observable | Effet automatique |

    |---|---|

    | Débit entrant < 380 L/s | Irrigation → 50 L/s |

    | Débit entrant < 350 L/s | Irrigation suspendue |

    | Réserve AEP < 3 jours | Activation du secours pré-contracté |

    | Débit réservé < 180 en section de contrôle, 24 h | Suspension immédiate de tout prélèvement agricole
    |

    | Débit entrant > 500 L/s, 5 jours consécutifs | Réexamen — sans restauration automatique (déficit
    des sols) |


    ---


    ## 5. Ce que je dis à chacun


    **Aux maraîchers.** Votre besoin de 240 L/s est justifié techniquement et je le dirai en séance. Je
    ne peux pas vous le donner. Ce que je vous donne : un plancher garanti, la priorité absolue sur toute
    eau libérée, une règle qui transforme 80 L/s en récolte réelle sur 207 ha au lieu d''un échec uniforme,
    la liberté de mutualiser entre vous, et l''appui de la commission sur l''indemnisation. En quittant
    la salle, vous avez perdu l''occasion d''exiger l''audit du chiffre de la régie — c''est votre meilleur
    allié dans ce dossier, et je le porte à votre place.


    **À la régie.** Votre dotation est garantie ; la santé publique n''est pas un objet de marchandage
    et je ne l''utiliserai pas comme levier. Mais 1 409 L/habitant/jour est un chiffre que je ne peux
    pas défendre devant les autres parties sans explication. Je vous demande sous huit jours : volumes
    produits et facturés, rendement, part industrielle, point de rejet de la STEP. Refuser cet examen,
    c''est faire porter à 34 exploitations le coût de fuites que 150 000 € répareraient.


    **À l''autorité environnementale et au préfet.** Je ne sollicite aucune dérogation au débit réservé,
    et je demande une note complémentaire sur la forme du seuil. Je tiens 180 non par déférence à l''arrêté,
    mais parce que c''est le seul poste du bilan dont la perte est définitive.


    ---


    ## 6. Le meilleur argument contre ma position


    Il faut l''énoncer, il est sérieux : *« Vous sacrifiez 90 emplois et 4,1 M€ réels, aujourd''hui, pour
    une population de truites dont l''effondrement est affirmé par un seul rapport, et dont le caractère
    non reconstituable est une projection. Les milieux se recolonisent, l''alevinage existe. Une exploitation
    en faillite, elle, ne se recolonise pas : la terre part au bailleur, le savoir-faire disparaît, et
    34 fermes sont un système alimentaire local. Vous avez inversé le test d''irréversibilité. »*


    Ma réponse. Repeupler une population n''est pas restaurer une frayère : la contrainte liante est le
    substrat et l''hydromorphologie, et c''est exactement ce que le rapport documente comme perdu. Mais
    **le point sur la faillite agricole est juste et je le retiens** — c''est la raison pour laquelle
    les 300 k€ vont à la survie des exploitations les plus fragiles plutôt qu''à un saupoudrage, et pourquoi
    le dossier d''indemnisation est ma première priorité opérationnelle.


    Reste la question honnête : les 30 L/s supplémentaires qu''on pourrait prendre à la rivière achètent
    78 hectares de plus. Contre une perte irréversible documentée. Je juge que non. **Ce qui me ferait
    changer d''avis :** si la note hydrobiologique établit un gradient avec une bande d''excursion et
    une durée sûres, *et* si l''audit AEP est achevé et clos — alors une excursion temporaire, surveillée
    et autorisée par le préfet devient discutable. Pas avant, et pas dans cet ordre inverse.


    ---


    **En résumé :** l''affaire n''est pas « les paysans contre les robinets ». C''est un déficit de 160
    L/s affirmé sur trois chiffres dont aucun n''a été vérifié, un chiffre AEP invraisemblable que personne
    n''a le droit d''examiner, et une règle de rationnement qui garantit la perte totale là où une règle
    de concentration sauverait un tiers de la récolte. Je propose de tenir fermement le seul plancher
    irréversible, de payer pour rendre les chiffres vrais, et de rendre aux maraîchers tout ce que cette
    vérité libérera.

    '
