response:
  text: '## Note au conseil — Verlaq — Arbitrage Sedamex / Nordwerk


    **Objet :** recommandation sur les deux options exclusives, horizon 18 mois

    **De :** la direction générale — **Pour :** conseil du vendredi


    ---


    ### Recommandation


    **J''engage la ligne Nordwerk (option B)**, sous trois conditions préalables à la signature, énoncées
    au point 4.


    ### 1. Le pire cas n''est pas la maison


    C''est le point qui commande tout le reste. En cas d''échec technique, la perte totale est **plafonnée
    contractuellement à 400 k€**, pénalité de résiliation comprise. Il n''y a ni caution du dirigeant,
    ni défaut croisé, ni sûreté sur l''actif industriel, et le carnet de commandes n''est gagé dans aucune
    des deux options.


    Position au terme des 18 mois, dividende exceptionnel de 700 k€ déduit dans tous les cas :


    | | Fonds propres | Trésorerie |

    |---|---|---|

    | Option A | 2,9 M€ | 2,1 M€ |

    | Option B — succès (60 %) | 3,6 M€ | 2,8 M€ |

    | **Option B — échec (40 %)** | **2,3 M€** | **1,5 M€** |


    Le covenant bancaire exige 1,2 M€ de fonds propres à chaque clôture trimestrielle. Après dividende,
    nous disposons de **1,5 M€ de marge avant rupture** : il faudrait une perte de 1,5 M€ pour toucher
    le covenant, soit **3,75 fois le plafond contractuel**. Dans le scénario d''échec, la trésorerie résiduelle
    couvre encore **neuf mois de masse salariale**, dividende intégralement payé. Le trimestre le plus
    tendu reste celui du douzième mois, où pénalité et second acompte de dividende se cumulent : fonds
    propres 2,3 M€, covenant testé à 1,2 M€. Aucun trimestre ne passe sous la barre.


    Ce n''est donc pas un risque de ruine. C''est de la variance, et la variance ne justifie pas un veto.


    ### 2. Ce que rapporte l''arbitrage


    Espérance de l''option B : 0,6 × 900 − 0,4 × 400 = **+380 k€**, contre **+200 k€** garantis en A.
    L''écart d''espérance est de 180 k€ sur la période.


    Surtout : **B ne devient perdante que si la probabilité réelle de succès tombe sous 46 %.** Notre
    estimation est de 60 %. Nous disposons donc de quatorze points de marge avant que l''arbitrage ne
    bascule.


    ### 3. Réponse au directeur financier


    Sur le fond de la formule — « on ne joue pas la maison sur un tirage à 40 % » — nous ne jouons pas
    la maison : nous exposons 400 k€ plafonnés, soit 12 % des fonds propres et 15 % de la trésorerie,
    sans recours sur le patrimoine du dirigeant ni sur l''outil industriel.


    Sur Tremay : le dépôt de bilan d''un concurrent n''est pas transposable sans vérifier ce qui l''a
    tué. Une ligne neuve ne fait pas tomber une entreprise ; c''est un engagement non plafonné, financé
    par dette, ou adossé à des sûretés, qui la fait tomber. Nous sommes à dette nette nulle et sous plafond
    contractuel. **Si l''analyse de la structure d''engagement de Tremay montre qu''il était, lui aussi,
    plafonné et non endetté, l''analogie devient pertinente et je révise ma recommandation.** C''est une
    vérification à faire, pas un argument à écarter.


    En revanche, le directeur financier a raison sur un point que sa formule masque : **le 60 % vient
    de notre propre bureau d''études, sur onze installations — un échantillon dont l''intervalle de confiance
    contient le seuil de bascule de 46 %.** C''est la seule faiblesse réelle du dossier, et elle se traite.


    ### 4. Conditions préalables à la signature


    1. **Vérification externe des onze installations** avant signature : contact direct des exploitants,
    taux de succès réel, et surtout mode de défaillance des cas d''échec — la question étant si notre
    configuration ressemble aux succès ou aux échecs.

    2. **Chiffrage du coût non contractuel d''un échec** (perturbation des lignes existantes, mobilisation
    d''équipes, effet sur les clients en cours) : le plafond de 400 k€ ne le couvre pas.

    3. **Clarification avec Sedamex** de ce qu''un non-renouvellement coûte au-delà des 18 mois — et négociation
    d''une priorité de retour.


    ### 5. Repli et déclencheur


    Le contrat n''a pas de clause de sortie, mais nous maîtrisons **la date de constatation de l''échec**.
    Si au sixième mois la ligne n''a pas atteint les critères de recette du cahier des charges, **l''échec
    est constaté à ce moment-là et non attendu jusqu''au douzième** : la perte est verrouillée à 400 k€,
    la trésorerie est préservée six mois plus tôt, et douze mois sont libérés pour redéployer.


    **Le déclenchement de cette constatation relève du directeur financier**, pas de la direction industrielle
    — c''est lui qui tient le coup d''arrêt. Et aucun euro au-delà du plafond de 400 k€ ne sera engagé
    sur Nordwerk sans un nouveau vote du conseil.


    ### 6. Ce qui renverserait cette recommandation


    - La vérification externe donne moins de six succès sur onze en configuration comparable, ou fait
    apparaître que les échecs se concentrent sur une caractéristique que nous partageons ;

    - ou le coût non contractuel d''un échec porte l''exposition réelle au-delà de 800 k€ ;

    - ou Tremay était structuré comme nous — plafonné et sans dette.


    Dans l''un de ces trois cas, je recommande l''option A.


    ### Première action


    Lancer dès lundi la vérification des onze installations, sous mandat du directeur financier, avec
    restitution au conseil avant signature.


    ---


    **Deux remarques sur la note elle-même**, hors du texte destiné au conseil : le seuil de six succès
    sur onze au point 6 est un seuil de prudence que je fixe, pas un calcul — il place la barre juste
    au-dessus du point de bascule de 46 %, à vous de le durcir si vous le souhaitez. Et la condition n°
    1 n''a de sens que si Sedamex laisse quelques jours après vendredi ; si Sedamex exige une réponse
    le même jour, la recommandation reste B — les 14 points de marge tiennent — mais elle se prend alors
    sans le filet de la vérification, et le conseil doit le savoir en votant.

    '
