response:
  text: '# Plan d''exécution — conversion de la flotte de livraison

    **Direction de l''exploitation — conseil du jeudi 13 août 2026**


    ---


    ## 1. Ce que ce document demande au conseil


    La conversion est engagée et ce plan la met en œuvre. Il ne rouvre pas la décision du 4 mai.


    Il établit un point que le dossier initial ne portait pas : **la contrainte du projet n''est pas l''autonomie
    des véhicules, c''est la capacité de recharge.** L''autonomie se gère par une règle d''affectation
    qui ne coûte presque rien. La recharge, elle, appelle un investissement supplémentaire dont l''ordre
    de grandeur n''est pas encore au budget, et une décision de calendrier qui doit être prise cette semaine
    sous peine d''être perdue pour la saison.


    Trois votes sont demandés jeudi, pour un total de **321 000 €**, qui sécurisent les **620 000 €**
    de subvention régionale :


    | Décision | Montant | Pourquoi jeudi |

    |---|---|---|

    | **D1** — Tranche 2 : 8 bornes supplémentaires | 210 000 € | 7 semaines de travaux ; signature sous
    48 h ou la tranche d''octobre est immobilisée |

    | **D2** — Prolongation de la location diesel, enveloppe septembre–janvier | 140 000 € | Préavis de
    30 j ; un véhicule rendu est indisponible 11 semaines |

    | **D3** — Mandat d''instruction pour la capacité de recharge cible, décision le 15 octobre | 0 €
    (études) | La mesure se fait sur les 24 véhicules de septembre ; elle n''existe pas plus tard |


    Une action a été engagée avant le conseil et lui est soumise à ratification : voir §4.


    ---


    ## 2. Le constat chiffré


    ### 2.1 L''autonomie : un problème borné, et déjà quantifié


    L''autonomie annoncée (260 km) n''est pas la donnée pertinente. Les essais de mars donnent 232 km
    en conditions douces et 197 km à 2 °C avec chauffage, soit **une perte de 15 % en hiver**.


    La note du responsable transport est le renseignement le plus utile du dossier : 11 tournées sur 120
    ont exigé une recharge non prévue, **et toutes dépassaient 190 km**. En dessous de ce seuil, aucun
    incident sur trois semaines. Le risque n''est donc pas diffus : il est concentré sur une classe de
    tournées identifiable à l''avance.


    Ce seuil de 190 km a été observé en mars, en conditions douces. Transposé à l''hiver au prorata des
    autonomies mesurées (197 / 232), il tombe à **161 km**. C''est le chiffre qui structure l''affectation
    :


    | Température au départ | Tournée maximale confiée à un électrique |

    |---|---|

    | ≥ 10 °C | 185 km |

    | 5 à 10 °C | 172 km |

    | < 5 °C | **158 km** |


    Conséquence directe à retenir : la tournée la plus longue du réseau, **240 km, est structurellement
    hors de portée** — elle dépasse même l''autonomie mesurée par temps doux. Elle restera en diesel jusqu''à
    un redécoupage. Le nombre exact de tournées dans ce cas fait partie des données à produire sous cinq
    jours (§8).


    ### 2.2 La recharge : la vraie contrainte, et elle est sévère


    Une charge complète prend 6 h et restitue 232 km par temps doux, **197 km par temps froid — soit 33
    km d''autonomie par heure de borne en hiver.**


    Le réseau parcourt 96 × 168 = **16 128 km par jour**. Le besoin hivernal est donc de **492 heures-bornes
    par nuit**, indépendamment de la façon dont ces kilomètres sont répartis entre les tournées.


    Sur une fenêtre nocturne de 12 h (18 h – 6 h) :


    | Bornes | Véhicules électriques exploitables la nuit |

    |---|---|

    | 14 (aujourd''hui) | ~28 |

    | 22 (après tranche 2) | **~60, sans aucune marge** |

    | ~41 | 96 |


    **La flotte complète de 96 véhicules demande environ 41 bornes, pas 22.** Le devis de 210 000 € couvre
    l''atteinte du seuil de subvention, pas la cible. L''écart, en bornes 22 kW au prix unitaire du devis
    actuel, représente de l''ordre de 500 000 € supplémentaires, hors renforcement de raccordement.


    Point à souligner, car il est contre-intuitif : **redécouper les tournées ne résout pas ce problème.**
    Le besoin en heures-bornes dépend du kilométrage total, pas de sa distribution. Redécouper règle l''autonomie
    ; cela ne libère pas une seule heure de borne.


    ### 2.3 Le levier qui change l''équation


    Le calcul ci-dessus suppose une fenêtre de charge de 12 h, parce que les 96 tournées partent aujourd''hui
    en une seule vague matinale. **Si les départs sont étalés en deux vagues** (par exemple 5 h et 9 h
    30), la fenêtre d''utilisation des bornes passe à 18–20 h par jour et le besoin tombe à **25–27 bornes**
    — soit 3 à 5 bornes au-delà de la tranche 2, contre 19.


    L''écart entre les deux trajectoires est de l''ordre de **350 000 à 400 000 €**. C''est le principal
    enjeu financier restant du projet, et il se joue sur une décision d''organisation, non sur du matériel.


    Ce levier n''est pas gratuit pour autant : il suppose qu''une part significative des clients accepte
    une livraison d''après-midi, et il touche aux horaires des conducteurs. Ces deux points sont à instruire
    (§7), pas à décréter.


    ---


    ## 3. Calendrier de déploiement


    | Période | Livrés (cumul) | **En service** | Diesels conservés | Capacité de charge |

    |---|---|---|---|---|

    | Septembre | 24 | 24 | 72 | 14 bornes → 28 ✅ |

    | Octobre | 48 | 44 | 52 | 22 bornes (mise en service visée le 5/10) → 44 ✅ |

    | Novembre | 72 | 60 | 36 | 22 bornes, saturées |

    | Décembre | 96 | 60–66 | 30–36 | 22 bornes + étalement pilote |

    | Janvier | 96 | **66 (cible)** | 30 | seuil subvention sécurisé avec marge |

    | Février–avril | 96 | 96 | 0 | selon décision du 15 octobre |


    Les 24 véhicules de septembre entrent dans la capacité existante : **la tranche 2 n''est pas nécessaire
    pour démarrer, elle est nécessaire pour ne pas s''arrêter en octobre.** C''est ce qui rend son vote
    urgent sans le rendre bloquant pour la mise en route.


    **La cible de janvier est fixée à 66 véhicules et non 60.** À 60 exactement, la subvention de 620
    000 € dépend d''une immobilisation de véhicule ou d''une nuit de charge dégradée. Les six véhicules
    de marge sont obtenus par un pilote d''étalement des départs sur une seule plateforme en novembre
    — ce qui a le double effet de sécuriser la subvention et de mesurer en réel le levier du §2.3 avant
    la décision d''investissement.


    ---


    ## 4. Restitution des diesels : la décision irréversible du dossier


    C''est le seul point du plan où une erreur ne se rattrape pas dans la saison.


    - Prolonger un véhicule : **480 € par mois**, réversible chaque mois.

    - Le rendre trop tôt : **11 semaines** avant de pouvoir le reprendre.

    - Une tournée non terminée : **900 €**.


    **Une seule tournée manquée dans le mois coûte davantage que la prolongation du diesel pendant ce
    mois entier.** Sur les tournées longues, le taux d''incident observé en mars n''est pas marginal :
    les 11 défaillances se concentrent toutes sur les tournées > 190 km, ce qui donne un taux d''échec
    conditionnel élevé sur ce segment. À 20 % seulement, un véhicule affecté à une tournée longue génère
    environ 4 défaillances par mois, soit 3 900 € — huit fois le coût du diesel qu''il remplace.


    **Règle de restitution (D2) :** un lot de diesels n''est notifié à la reprise que lorsque les véhicules
    électriques qui les remplacent ont réalisé **15 jours ouvrés consécutifs à 99 % ou plus de tournées
    terminées** sur les tournées qui leur sont affectées. Le préavis de 30 jours part de cette validation,
    jamais de la date de livraison des électriques.


    **Action engagée le 10 août, soumise à ratification :** notification au loueur d''une prolongation
    mensuelle couvrant l''ensemble des quatre lots, afin de préserver le préavis de 30 jours sur le premier
    lot de reprise de septembre. Le coût d''option est de 480 € par véhicule et par mois, entièrement
    réversible ; l''absence de notification, elle, aurait été irréversible pendant onze semaines. J''ai
    considéré que cette asymétrie ne permettait pas d''attendre jeudi. Si le conseil en décide autrement,
    la notification peut être levée sur les lots 3 et 4 sans pénalité.


    Enveloppe demandée :


    | | Sept. | Oct. | Nov. | Déc. | Janv. | Total |

    |---|---|---|---|---|---|---|

    | Diesels conservés | 72 | 52 | 36 | 36 | 30 | |

    | Coût | 34 560 € | 24 960 € | 17 280 € | 17 280 € | 14 400 € | **108 480 €** |


    **Enveloppe sollicitée : 140 000 €**, incluant une réserve pour un mois de décalage sur la tranche
    2.


    À comparer : un déploiement non filtré, plaçant des électriques sur les tournées longues, produirait
    de l''ordre de **100 000 € de défaillances par mois**. Le budget de prolongation de cinq mois équivaut
    à un mois d''imprudence.


    ---


    ## 5. Règle d''affectation des véhicules


    Elle est simple et se dérive automatiquement des données déjà collectées.


    1. **Classement des 96 tournées par longueur croissante.** Les véhicules électriques sont affectés
    en partant du bas de la liste. Cette règle résout deux problèmes à la fois : elle écarte le risque
    d''autonomie *et* elle minimise la consommation d''heures-bornes, donc maximise le nombre de véhicules
    qu''un parc de bornes donné peut soutenir.

    2. **Plafond glissant selon la température prévue au départ** (§2.1). Le plafond s''applique la veille
    au soir, à l''établissement du plan de charge.

    3. **Contrôle de départ :** aucun véhicule ne part avec un état de charge inférieur à 100 %, ni sur
    une tournée dont la longueur dépasse 85 % de l''autonomie du jour.

    4. **Les tournées > 190 km restent en diesel** jusqu''à nouvel ordre, quelle que soit la saison.


    Aucune de ces règles ne demande d''outil nouveau : la télémétrie à 10 minutes et le tableau de bord
    du soir fournissent déjà tout ce qu''elles exigent.


    ---


    ## 6. Pilotage : indicateurs, seuils et conditions d''arrêt


    Le tableau de bord publie déjà, chaque soir et par plateforme, le taux de tournées terminées et le
    nombre de recharges non prévues. Trois indicateurs sont ajoutés à partir du relevé télémétrique :
    l''état de charge au retour, la durée réelle de charge, et la consommation au kilomètre corrélée à
    la température.


    Seuils d''arrêt — **une seule règle : quand un seuil est franchi, la tranche suivante est gelée, elle
    n''est pas discutée.**


    | Signal | Seuil | Action automatique |

    |---|---|---|

    | Taux de tournées terminées | < 99 % sur 2 jours consécutifs, une plateforme | Gel de la mise en
    service de la tranche suivante |

    | Recharges non prévues | > 2 par jour et par plateforme | Abaissement du plafond d''affectation de
    15 km |

    | Véhicules non chargés à 100 % au départ | > 3 par nuit | Arrêt de tout ajout de véhicule sur cette
    plateforme |

    | Consommation mesurée | > 0,72 kWh/km sur une semaine froide | Révision du plafond hivernal et du
    dimensionnement de la tranche 3 |


    Reprise : deux semaines consécutives sous les seuils, sur la plateforme concernée.


    **Septembre est un essai grandeur réelle, pas une simple montée en charge.** Les 24 premiers véhicules
    doivent produire, avant le 10 octobre : la consommation réelle par tranche de température, la durée
    de charge effective à 22 kW, l''état de charge au retour par longueur de tournée, et le taux d''occupation
    horaire des 14 bornes. C''est ce jeu de mesures — et non une extrapolation des essais de mars — qui
    fondera la décision du 15 octobre.


    ---


    ## 7. Décision du 15 octobre (D3) : dimensionnement cible


    Trois options seront présentées, chiffrées sur les mesures de septembre :


    - **A — Étalement des départs en deux vagues.** Besoin ramené à 25–27 bornes, soit une tranche 3 de
    4 à 6 bornes (≈ 105 000 à 160 000 €). Suppose la part de clients acceptant une livraison d''après-midi
    et un accord sur les horaires conducteurs.

    - **B — Tranche 3 pleine à parc de bornes lentes.** ~19 bornes supplémentaires, de l''ordre de 500
    000 €, plus renforcement de raccordement, plus 7 semaines de travaux.

    - **C — Mixte, avec 2 à 4 bornes rapides par plateforme** en ressource de retournement, permettant
    en outre de récupérer une partie des tournées longues.


    Trois instructions à lancer dès jeudi, sans coût de décision :


    1. **Puissance souscrite disponible sur chaque plateforme.** 22 bornes représentent 484 kW, ~242 kW
    par site. Si le raccordement existant ne le permet pas, le délai du gestionnaire de réseau devient
    le chemin critique du projet et il se compte en mois. **À vérifier sous 5 jours** — c''est le risque
    de calendrier le plus sérieux du dossier, et le seul dont nous ne maîtrisons pas le délai.

    2. **Part des clients acceptant un créneau d''après-midi**, par plateforme. Détermine la faisabilité
    de l''option A.

    3. **Organisation du branchement de nuit.** 60 véhicules sur 22 bornes impose environ 40 opérations
    de branchement par nuit, réparties sur deux plateformes. À dimensionner et à budgéter en novembre.


    Une quatrième étude, à rendre le 15 novembre : **redécoupage des tournées sous un plafond de 158 km**.
    Elle ne réduit pas le besoin de bornes, mais elle conditionne l''électrification des tournées longues,
    dont la plus longue à 240 km.


    ---


    ## 8. Données manquantes, à produire avant le 15 août


    Le plan est robuste aux six inconnues ci-dessous, mais deux d''entre elles peuvent en déplacer le
    calendrier.


    | Donnée | Pourquoi elle compte |

    |---|---|

    | **Distribution des 96 longueurs de tournée** (nous n''avons que la moyenne 168 et le maximum 240)
    | Détermine combien de tournées passent le seuil de 158 km, donc si 60 véhicules électriques ont bien
    60 tournées éligibles. **Point de vérification n° 1 du plan.** |

    | **Puissance souscrite par plateforme** | Peut rendre la tranche 2 inexploitable malgré sa livraison.
    Délai réseau non maîtrisé. |

    | **Nombre de tournées > 190 km dans l''essai de 120** | Transforme le taux global de 9 % en taux
    conditionnel réel et permet de calibrer précisément le seuil |

    | **Date exacte de reprise du premier lot de diesels** | Fixe la date limite réelle du préavis |

    | **Répartition des 14 bornes entre les deux plateformes** | Une répartition déséquilibrée décale
    la trajectoire d''une plateforme |

    | **Rédaction exacte de la clause de subvention** — « roulent » signifie-t-il immatriculés ou en exploitation,
    et quelle preuve la région exige-t-elle | 620 000 €. Notre télémétrie peut produire un relevé kilométrique
    par véhicule ; **faire confirmer par écrit avant le 30 septembre que ce relevé constitue une preuve
    recevable.** |


    *Note : l''annexe transmise avec le dossier — catalogue des stations de mesure environnementale EMS-1000
    à EMS-1033 — ne contient aucune donnée exploitable pour ce plan. Elle n''a pas été utilisée.*


    ---


    ## 9. L''objection la plus sérieuse à ce plan


    Elle mérite d''être formulée sans complaisance, car c''est celle que le conseil aura en tête.


    **« Ce plan immobilise du capital et ralentit une décision déjà prise. »** Fin décembre, 96 véhicules
    auront été payés — 3,1 M€ — et 30 à 36 d''entre eux, soit environ 1,1 M€, ne rouleront pas. Dans le
    même temps nous continuerons à payer une flotte diesel que la conversion devait supprimer. Un observateur
    peut y lire une direction de l''exploitation qui exécute à contrecœur la décision de son conseil.


    Ce que je réponds : **le plafond n''est pas de la prudence, c''est un mur physique.** 22 bornes ne
    peuvent pas recharger davantage que ~60 véhicules par nuit, quel que soit le volontarisme qu''on y
    met. Les véhicules au-delà de ce nombre ne seraient pas « déployés plus vite » : ils partiraient chaque
    matin avec une charge partielle, sur des tournées de 168 km de moyenne, et alimenteraient un flux
    de défaillances à 900 € l''unité tout en dégradant le service client — au moment précis où la région
    observe notre capacité à faire rouler 60 véhicules.


    Ce que le plan doit assumer, en revanche, c''est que **le calendrier de livraison des véhicules a
    été construit sans le calendrier des bornes.** Les 96 véhicules arrivent en quatre mois ; l''infrastructure
    qui les fait rouler demande sept semaines de travaux par tranche et un investissement complémentaire
    de 100 000 à 500 000 € selon l''option retenue. Le décalage est structurel et il est déjà acquis.
    Ce plan ne le crée pas : il le rend visible, le chiffre, et propose le chemin le plus court pour le
    refermer — étalement des départs plutôt que surinvestissement en bornes, arbitré le 15 octobre sur
    des mesures réelles et non sur des hypothèses.


    **Horizon de flotte complète : mars-avril 2027 en option A, mai-juin 2027 en option B**, la différence
    tenant au délai de travaux et de raccordement, non à la disponibilité des véhicules.


    ---


    ## 10. Récapitulatif financier


    | Poste | Montant | Statut |

    |---|---|---|

    | Commande de véhicules | 3 100 000 € | Engagé, ferme |

    | Tranche 2 — 8 bornes | 210 000 € | **Vote jeudi (D1)** |

    | Prolongation location diesel, sept.–janv. | 140 000 € (dépense estimée 108 500 €) | **Vote jeudi
    (D2)** |

    | Tranche 3 | 105 000 à 500 000 € selon option | Décision 15 octobre (D3) |

    | **Subvention régionale** | **(620 000 €)** | Sécurisée par les votes D1 et D2 |

    | Coût évité — défaillances d''exploitation | ~100 000 €/mois | Sans objet si le plan est appliqué
    |


    **Les deux votes de jeudi engagent 350 000 € d''autorisation, pour une dépense probable de 318 500
    €, et sécurisent 620 000 €.**


    ---


    Je reste à disposition pour les points 1, 2 et 6 du §8, dont les réponses seront disponibles avant
    la séance.

    '
