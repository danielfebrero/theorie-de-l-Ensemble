response:
  text: '## Note au comité de direction — approvisionnement cellules 2027


    **Objet :** contrat cellules 72 000 unités — décision avant J+18

    **De :** direction des opérations


    ---


    ### Décision proposée


    **Réserver la capacité Kelmar à J+18 pour l''essentiel du volume 2027.** Ouvrir Sinolux par une tranche
    de qualification bornée (~15 000 unités), et seulement si Kelmar confirme son prix à volume réduit.
    À défaut de cette confirmation : Kelmar sur 100 % du volume.


    L''économie de 230 400 € inscrite au budget n''existe pas. Elle disparaît intégralement dans le coût
    des retours dès que le taux Sinolux dépasse 2,86 %.


    ### Le calcul


    Coût complet sur 72 000 unités (achat + retours à 205 €) :


    | Scénario | Taux retour | Achat | Retours | Total | vs Kelmar |

    |---|---|---|---|---|---|

    | Kelmar (4 ans de données) | 1,30 % | 1 872 000 € | 191 880 € | **2 063 880 €** | — |

    | Sinolux — essais Sinolux | 1,10 % | 1 641 600 € | 162 360 € | 1 803 960 € | +259 920 € |

    | **Sinolux — seuil d''équilibre** | **2,86 %** | 1 641 600 € | 422 280 € | 2 063 880 € | **0 €**
    |

    | Sinolux — audit de mars | 3,10 % | 1 641 600 € | 457 560 € | 2 099 160 € | −35 280 € |

    | Sinolux — audit +0,3 pt | 3,40 % | 1 641 600 € | 501 840 € | 2 143 440 € | −79 560 € |


    La garantie de remplacement gratuit ne change pas ce tableau de façon décisive : elle couvre la cellule
    (22,80 €) sur une défaillance qui nous coûte 205 €, soit 11 % du coût. Créditée au maximum, elle déplace
    le seuil d''équilibre de 2,86 % à 3,22 % — c''est-à-dire toujours à l''intérieur de la fourchette
    où se situe la meilleure mesure indépendante disponible. Sinolux nous offre gratuitement la partie
    la moins chère du problème et refuse d''indexer sur la partie chère.


    ### L''état réel des preuves


    Nous n''avons **pas trois sources, mais deux** — et une seule est indépendante.


    - Sinolux annonce 1,1 % : mesure du vendeur sur son propre produit, non auditée.

    - L''audit sectoriel de mars mesure 3,1 % sur une ligne comparable du même fournisseur : source indépendante.

    - Ferro retient « environ 3 % » **en travaillant sur l''échantillon de l''audit de mars** (sa propre
    note méthodologique le dit). Ce n''est pas une confirmation, c''est la même mesure relue. La compter
    comme un second avis serait un double comptage.


    Nous disposons donc d''une mesure indépendante unique, à 3,1 %, soit au-dessus du seuil d''équilibre.


    Élément non chiffré mais décisif : **Sinolux refuse une clause indexée sur le taux de retour tout
    en affirmant 1,1 %.** Si leur chiffre était le bon, cette clause ne leur coûterait rien. Leur refus
    est la seule information que nous ayons sur ce qu''ils croient eux-mêmes.


    ### Pourquoi le test Vertex ne résout pas la décision


    Le résultat tombe à J+63. La ligne Kelmar 2027 est vendue à J+18, ferme et non reportable ; le prix
    Sinolux expire à J+21. Le test arrive **45 jours après** la disparition de notre seule alternative,
    pour un démarrage de production fixé à J+70 que la direction commerciale ne reporte pas.


    Acheter l''information reviendrait donc à attendre en ayant déjà perdu l''option de repli — et à se
    retrouver mono-source sur un fournisseur non qualifié, sans capacité de secours avant fin d''année.
    C''est la branche qu''il faut exclure quel que soit le gain espéré : elle n''a pas de sortie.


    S''ajoute une limite technique : à ±0,3 point autour d''une valeur attendue proche de 3 %, le test
    chevauche le seuil d''équilibre et ne trancherait probablement pas. Et un vieillissement accéléré
    mesure une défaillance cellule, pas un taux de retour terrain, qui intègre pose, manutention et comportement
    client. **Recommandation : ne pas engager les 34 000 €** pour cette décision.


    ### La tranche de qualification


    Plutôt que d''exclure Sinolux ou de lui confier l''année, leur ouvrir ~15 000 unités (21 % du volume)
    :


    - économie sur la tranche : 48 000 € ;

    - pire cas à 3,4 % de retours : surcoût ≈ 64 600 €, soit **une perte plafonnée à ~17 000 €** ;

    - en échange, nous obtenons la seule mesure qui compte — un taux de retour terrain sur nos propres
    chargeurs — avant la négociation 2028.


    Nous payons au plus 17 000 € pour une donnée réelle et exploitable, là où le laboratoire demande 34
    000 € pour une donnée indirecte qui arrive trop tard. Sinolux obtient une entrée réelle et un chemin
    vers le volume complet, ce qui est une contrepartie tangible à leur refus de clause indexée.


    ### Ce qui manque avant J+18 — première action


    **D''ici J+10, obtenir de Kelmar par écrit :** (1) le prix unitaire à 57 000 unités au lieu de 72
    000, (2) la tolérance de volume admise sur la réservation ferme.


    Si le prix Kelmar dérape au-delà d''environ 26,60 € à volume réduit, la tranche Sinolux est financée
    par un surcoût Kelmar supérieur à son gain : dans ce cas, **100 % Kelmar**, sans tranche. Ce point
    conditionne la recommandation et n''est pas arbitré à ce jour.


    Demander en parallèle à Sinolux (a) le maintien de son prix au-delà de J+21 sur la tranche, (b) une
    compensation forfaitaire par retour couvrant le coût réel de 205 € et non la seule cellule. Un accord
    sur (b) changerait entièrement l''analyse et justifierait de réexaminer le volume complet.


    ### Déclencheur de repli


    Sur la tranche : si le taux de retour cumulé Sinolux dépasse **2,0 % sur les 5 000 premiers chargeurs
    livrés**, arrêt de toute extension de volume et retour à Kelmar pour 2028. Seuil observable, mesuré
    mensuellement par l''atelier, sans décision discrétionnaire.


    ### Ce qui renverserait cette recommandation


    Une mesure du taux de retour **issue d''un échantillon distinct de l''audit de mars** établissant
    un taux ≤ 2,0 %. Ou l''acceptation par Sinolux d''une compensation par retour au coût complet. En
    l''absence de l''un ou l''autre avant J+18, la recommandation ci-dessus tient.


    ### Le contre-argument, et pourquoi il ne l''emporte pas


    *« L''audit de mars porte sur une autre ligne ; le procès d''intention sur le refus de clause n''est
    pas une mesure ; nous renonçons à 230 000 € sur une seule observation. »* C''est juste sur le fond
    : notre preuve est mince. Mais la mince preuve dont nous disposons pointe au-dessus du seuil d''équilibre,
    celle qui pointe en dessous vient du vendeur, et le calendrier interdit d''en acquérir une meilleure
    à temps. Renoncer à un gain incertain plafonné autour de zéro est réversible ; perdre la ligne Kelmar
    à J+18 sans qualification ne l''est pas.


    ---


    **Point d''attention pour le comité :** les 230 400 € figurant au budget doivent être retirés dès
    à présent, indépendamment du choix de fournisseur. Aucun scénario de taux de retour crédible ne les
    produit.

    '
