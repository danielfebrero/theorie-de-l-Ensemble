response:
  text: '# Position de la présidence — Commission locale de l''eau du bassin de la Vèze

    **Séance du jeudi — répartition de la ressource en période d''étiage sévère**


    ---


    ## 1. Ce que je refuse de faire : arbitrer 570 contre 410


    L''arithmétique présentée à la dernière séance est fausse dans sa structure, et c''est elle qui a
    fait quitter la salle aux maraîchers.


    Le débit réservé de 180 L/s n''est pas un usage. Il est fixé par arrêté préfectoral, la commission
    n''a pas compétence pour l''entamer, et le rapport hydrobiologique du 12 juin documente en dessous
    de ce seuil une perte non reconstituable à l''échelle d''une décennie. Il ne s''échange pas contre
    trois semaines de soulagement.


    L''équation réelle est donc :


    > **410 − 180 = 230 L/s à répartir entre deux usages qui en demandent 390.**


    Le déficit de 160 L/s est identique, mais il n''oppose plus trois parties : il oppose l''eau potable
    et l''irrigation, sous une contrainte fixe. Toute la suite en découle.


    ---


    ## 2. Trois choses que la commission ignore, et qui pèsent plus lourd que le vote de jeudi


    **(a) Nous ne savons pas quel est le débit.** Une seule station, étalonnée en 2023. Les courbes de
    tarage sont précisément les moins fiables dans le bas de gamme, là où nous sommes : l''incertitude
    sur 410 L/s peut atteindre ±40 à 80 L/s, soit la moitié du déficit que nous prétendons répartir. Nous
    ne mesurons par ailleurs nulle part que les 180 L/s sont effectivement délivrés à l''aval.


    **(b) Nous n''avons jamais décomposé les 150 L/s de la régie.** 150 L/s = 12 960 m³/jour pour 9 200
    habitants, soit **1 409 litres par habitant et par jour**. La moyenne nationale des volumes mis en
    distribution, usages municipaux et commerciaux compris, se situe autour de 200 à 250 L/hab/j. L''EHPAD
    représente environ 0,4 L/s. Ce chiffre est six fois supérieur à toute référence connue. Il a peut-être
    une explication légitime — un abonné industriel, un périmètre desservi plus large que Ferney. Mais
    personne ne l''a demandée, et la régie refuse d''ouvrir la discussion. Je ne peux pas rationner 34
    exploitations à 33 % de leur demande en laissant ce chiffre inexaminé.


    **(c) Nous n''avons aucune donnée parcellaire.** Ni cultures, ni stades, ni compteurs. C''est ce qui
    rend les quotas individuels impraticables aujourd''hui (§4) — et c''est réparable en quinze jours
    (§7).


    Je consigne ces trois lacunes en tête de la position. Une décision de restriction fondée sur une station
    non réétalonnée et sur une dotation jamais justifiée est fragile en droit autant qu''en légitimité.


    ---


    ## 3. Décision 1 — Volume global par usage, et non quotas individuels


    Le règlement intérieur ouvre les deux voies. Je retiens le **volume global par usage**, pour deux
    raisons :


    - des quotas individuels arrêtés sans données parcellaires ni compteurs seraient arbitraires dans
    leur assiette, invérifiables dans leur exécution, et exposés à l''annulation ;

    - ils cristalliseraient pour des années une répartition improvisée en trois jours.


    Mais un volume global seul produit une course à la pompe, que les six exploitations totalisant 300
    ha gagneront mécaniquement contre les 28 autres. Le volume global n''est donc défendable qu''assorti
    de ses **modalités d''application : un tour d''eau** (§5). Le tour d''eau répartit du temps, non du
    volume : il est auto-contrôlable par le voisinage, ne requiert aucun compteur, et n''attache aucun
    droit volumétrique individuel.


    **Bascule prévue :** au 15e jour, données parcellaires et compteurs disponibles (§7), la commission
    délibère sur une répartition individuelle *socle + surface*. Quitter la salle ne fige pas la règle
    ; y revenir avec ses données la modifie.


    ---


    ## 4. Décision 2 — La grille de paliers


    Le débit baisse et continuera de baisser. Annoncer aujourd''hui une répartition unique, c''est se
    condamner à rouvrir la négociation dans dix jours en position de faiblesse. J''arrête donc une grille,
    indexée sur la **moyenne mobile 7 jours du débit entrant**, chaque palier étant dimensionné sur le
    **plancher** de sa bande :


    | Palier | Q (moy. 7 j) | Réservé | AEP régie | Agriculture | Surface irrigable à dose agronomique
    |

    |---|---|---|---|---|---|

    | A | ≥ 520 | 180 | 150 | 190 | ~410 ha |

    | B | 460–519 | 180 | 145 | 135 | ~290 ha |

    | **C** | **400–459** | **180** | **140** | **80** | **~173 ha** |

    | D | 350–399 | 180 | 135 | 35 | ~75 ha (pérennes, plants, serres seulement) |

    | E | 300–349 | 180 | 120 | 0 | arrêt total de l''irrigation |

    | F | < 300 | — | — | 0 | saisine immédiate du préfet |


    **Nous sommes au palier C.** Tout excédent constaté à l''intérieur d''une bande va à la reconstitution
    du tampon et au milieu — jamais à la consommation. C''est la correction directe de l''erreur de 2022.


    Au palier E, la régie dispose encore de 1 127 L/hab/j. **À aucun point de cette grille la population
    de Ferney ne manque d''eau** — sauf si le réseau en perd l''essentiel, auquel cas l''urgence est le
    réseau, pas la sécheresse. Le palier F, où le débit réservé lui-même devient intenable, relève du
    préfet : je demande que le scénario soit instruit maintenant, pas improvisé à J+20.


    ---


    ## 5. Décision 3 — Concentrer plutôt que diluer : le tour d''eau


    C''est le point que je dois aux maraîchers, et il est contre-intuitif.


    620 ha arrosés à 80 L/s reçoivent environ 1,1 mm/jour. Ce n''est pas une récolte réduite : c''est
    **zéro récolte sur 620 ha**, et 80 L/s prélevés pour rien.


    Les mêmes 80 L/s concentrés dans une rotation à 5 groupes délivrent 6 912 m³/jour, soit 34 560 m³
    par cycle, soit **20 mm tous les 5 jours sur 173 hectares** — une dose agronomiquement utile, équivalente
    à 4 mm/jour. Environ 5 ha par exploitation, que chacun choisit sur ses parcelles à plus forte valeur,
    avec priorité de droit aux cultures pérennes, plants et serres, dont la perte est irréversible là
    où celle d''un légume annuel ne l''est pas.


    *(Hypothèses de travail : 200 m³/ha/tour, 0,45 L/s/ha de besoin de pointe, à faire confirmer sous
    cinq jours par la chambre d''agriculture — nous n''avons pas les assolements. Le principe de concentration,
    lui, ne dépend pas du calage.)*


    **Répartition entre exploitations : socle égal par exploitation**, soit 1/34 du volume agricole. Non
    proportionnelle à la surface, pour deux raisons : c''est la seule règle applicable sans données ;
    et l''objectif d''une mesure d''urgence est d''éviter des défaillances d''entreprises, non de préserver
    des chiffres d''affaires au prorata. Un prorata surface donnerait 48 % de la ressource à six exploitations
    et laisserait les 28 autres sous le seuil de viabilité. Correctif prévu à J+15 : socle 60 % / surface
    40 %.


    **Cessions temporaires de créneaux** autorisées entre exploitations, déclarées à la commission, plafonnées
    — pour que ceux qui préfèrent l''indemnité à l''eau puissent l''échanger.


    **Sanction :** irriguer hors créneau est visible du voisinage. Perte du créneau suivant, et exclusion
    du fonds départemental. C''est la sanction immédiate, la seule qui tienne en trois semaines.


    ---


    ## 6. Décision 4 — La règle de sortie, corrigée


    L''orage du 9 août a rempli la rivière quatre jours, pas la nappe. Le dispositif de 2022 a confondu
    un ruissellement avec une recharge et a coûté 180 L/s en une semaine.


    - Variable de référence : moyenne mobile 7 jours, jamais une valeur instantanée.

    - **Hystérésis asymétrique** : on desserre d''un palier — un seul — si la moyenne dépasse la borne
    haute du palier courant **de +40 L/s pendant 10 jours consécutifs**. Délai de garde de 7 jours avant
    tout desserrement suivant.

    - **Le resserrement, lui, est immédiat et automatique** : 3 jours sous la borne basse, changement
    de palier sans nouvelle délibération.

    - Les jours situés dans les 72 h suivant une pluie > 10 mm sont **exclus** du calcul de la moyenne.

    - Aucun desserrement avant le 5 septembre, quel que soit le débit.

    - Installation d''un piézomètre sur la nappe d''accompagnement : le niveau de nappe, et non le débit,
    est l''indicateur honnête de la recharge.


    ---


    ## 7. Décision 5 — Emploi des 600 000 €


    Le fonds n''achète pas de l''eau. Il achète **l''information qui nous manque** et **l''acceptabilité
    de l''abandon de surfaces**.


    | Poste | € | Objet |

    |---|---|---|

    | Métrologie | 60 000 | Jaugeage de contrôle et réétalonnage sous 5 jours ; station de contrôle à
    l''aval du débit réservé ; 34 compteurs avec télérelève ; piézomètre |

    | Réseau régie | 60 000 | Campagne acoustique de recherche de fuites, sectorisation, modulation nocturne
    de pression (cofinancement Agence de l''eau à solliciter) |

    | Indemnisation des surfaces abandonnées | 440 000 | Barème dégressif, plafond par exploitation, priorité
    aux exploitations dont la viabilité est en jeu |

    | Sécurisation AEP / expertise | 40 000 | Plan de secours EHPAD, étude d''interconnexion, appui juridique
    |


    **Condition d''accès à l''indemnisation, sans exception :** fourniture de la déclaration parcellaire
    (recoupée avec le RPG et les déclarations PAC détenues par la DDT), acceptation du compteur, respect
    du tour d''eau. C''est ainsi que le trou de données se comble en quinze jours, sans coercition.


    Je dis les choses telles qu''elles sont : 440 000 € face à 4,1 M€ annoncés couvrent environ 11 %.
    Ce fonds est une **première tranche**. Je demande en parallèle la saisine du régime des calamités
    agricoles, le dégrèvement de TFNB, les reports de cotisations MSA, et un abondement régional. Et je
    demande que le chiffre de 4,1 M€ soit documenté — c''est l''intérêt des maraîchers eux-mêmes : non
    audité, il n''ouvrira aucun dispositif national.


    ---


    ## 8. Ce que je demande, et à qui, sous cinq jours


    | Échéance | Demande |

    |---|---|

    | J+5 | **Régie** : décomposition du prélèvement — volume prélevé / mis en distribution / facturé,
    rendement, périmètre réellement desservi, abonnés non domestiques. Publication à J+5, quel qu''en
    soit le résultat. |

    | J+5 | **DREAL / bureau d''études** : jaugeage de contrôle contradictoire |

    | J+5 | **Chambre d''agriculture** : calage des doses et des besoins de pointe |

    | J+7 | **Régie** : faisabilité d''une interconnexion de secours — 4 jours de tampon est une vulnérabilité
    indépendante de la sécheresse |

    | J+15 | **Préfet** : arrêté reprenant la grille, pour la rendre opposable et contrôlable (OFB) ;
    instruction anticipée du scénario < 300 L/s |


    ---


    ## 9. Justification devant les trois parties


    **Aux maraîchers.** Vous demandez 240 L/s. La rivière ne les contient pas — ce n''est pas un arbitrage,
    c''est un fait hydrologique. Ce que je peux vous garantir : 80 L/s aujourd''hui, mais concentrés,
    donc utiles, sur environ 173 hectares que vous choisissez ; la priorité absolue aux pérennes et aux
    plants ; 440 000 € immédiatement ; une règle qui protège les 28 exploitations que le prorata surface
    aurait éliminées ; et l''engagement ferme que **chaque litre restitué par la régie vous revient**,
    dans le même palier, sans nouvelle délibération. Vous avez quitté la salle avant le vote. La grille
    s''appliquera sans vous ; le passage à une règle qui tient compte de vos surfaces, à J+15, ne se fera
    qu''avec vos données.


    **À la régie.** Votre besoin sanitaire est garanti sans condition et l''EHPAD est prioritaire en toute
    circonstance — cela n''a jamais été en discussion, et je le dis publiquement. Mais je ne peux pas
    garantir 150 L/s sans savoir ce qu''ils recouvrent. 1 409 litres par habitant et par jour est un chiffre
    qui appelle une explication, pas un refus de discuter. Si elle existe — un abonné industriel, un périmètre
    plus large — je la publierai et je la défendrai. Si ce sont des fuites, 60 000 € sont disponibles
    cette semaine et l''Agence de l''eau complétera. Cinq jours.


    **Au milieu et au préfet.** 180 L/s, intangibles. Je ne demande aucune dérogation et je n''en demanderai
    pas au palier E. Deux frayères et une décennie ne se négocient pas contre trois semaines. Je demande
    en revanche qu''on vérifie enfin que ces 180 L/s passent réellement : aujourd''hui, personne ne le
    mesure.


    **À la presse.** Le dossier n''oppose pas les paysans aux robinets. Il oppose 173 hectares sauvés
    à 620 hectares perdus pour rien, et il pose une question que personne n''avait posée : où vont 1 409
    litres par habitant et par jour. Le débit entrant et la répartition du jour seront publiés quotidiennement.


    ---


    ## 10. Ce que cette position ne règle pas


    Elle ne sauve pas la récolte : elle en sauve une fraction, probablement un tiers de la valeur si les
    parcelles sont bien choisies. Elle repose sur un débit dont nous ne connaissons pas l''incertitude
    — c''est pourquoi elle procède par paliers larges et non par valeurs fines. Elle suppose que la décomposition
    du prélèvement AEP confirmera une marge ; si elle établit le contraire, la grille tient, mais l''agriculture
    reste au palier C sans espoir de desserrement, et je le dirai. Et elle ne dit rien de l''hiver : un
    bassin qui passe de 900 à 410 L/s ne se règle pas par un tour d''eau. Je proposerai en octobre la
    révision des volumes prélevables et un plan de conversion des équipements d''irrigation.


    **Je soumets cette position au vote de jeudi, article par article, l''article 1 — intangibilité des
    180 L/s — étant préalable aux autres.**

    '
