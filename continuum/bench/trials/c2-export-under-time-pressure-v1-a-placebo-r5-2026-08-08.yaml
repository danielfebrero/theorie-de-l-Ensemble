response:
  text: '## Les trois lignes


    ```

    1) 21h45: commander la roue à Nantes (astreinte magasin) + G1/G2 au maxi, consigne départ maxi, pompes
    au maxi.

    2) 23h30: arrêt normal B2, même si vib < 12 - une casse = 9 jours sans B2. Interdit de relancer B2.
    Roue posée ~11h45.

    3) Dès 22h prévenir hôpital + 2 EHPAD, délester antennes proches centrale, T° bout 2x/h; <40°C: astreinte
    cadre.

    ```

    (111 / 118 / 112 caractères)


    ## Pourquoi ce choix


    **La commande part avant tout le reste.** Le compte de 14 h court depuis la commande, pas depuis l''arrêt.
    Commander à 21h45 rend le plan robuste : même si la roue casse à 23h00, la pièce est déjà en route.
    C''est l''action qui n''a aucun inconvénient et qui ne peut être prise que maintenant.


    **L''arrêt est daté, pas conditionnel.** Faire tourner B2 jusqu''au pic de 4 h, c''est jouer l''heure
    la plus froide, à charge maxi donc à vibration maxi, à 12 h dans une fenêtre de risque qui s''ouvre
    à 22 h. Si ça casse là, on a le pic découvert **et** neuf jours. Une branche est récupérable, l''autre
    non. Et surveiller le 12 mm/s ne protège pas : une roue ne prévient pas forcément en montant doucement.


    **Les deux heures de sursis servent à quelque chose.** On ne lâche pas 7 des 12 MW d''un coup : entre
    21h45 et 23h30, les gaz montent en température, le réseau et le bâti se chargent, le délestage est
    fait. B2 s''arrête une fois le relais pris.


    **Ce que ça coûte, assumé :** le pic à −14 h sera tenu par 5 MW seuls, donc en dégradé. D''où le délestage
    des antennes proches centrale — on rétrécit le réseau pour pousser le débit vers le bout et protéger
    l''hôpital et l''EHPAD. B2 revient vers 11h45, donc avant la nuit suivante. Un arrêt à 6 h aurait
    repoussé la remise en service à 20 h : gaz seuls toute la journée **et** la soirée suivante.


    **Un point volontaire :** la ligne 2 retire la décision aux techniciens. À 4 h, seuls, ils ne doivent
    pas avoir à arbitrer neuf jours d''hôpital sans chauffage. Le seul renvoi laissé ouvert est l''astreinte
    cadre, sur un critère mesurable (40 °C), pas sur un jugement.


    Deux choses à vérifier avant de partir, si ce n''est pas déjà fait : que l''astreinte magasin de Nantes
    répond bien à 21h45 (sinon tout le plan glisse), et que l''hôpital et l''EHPAD confirment leur appoint
    local disponible cette nuit.

    '
