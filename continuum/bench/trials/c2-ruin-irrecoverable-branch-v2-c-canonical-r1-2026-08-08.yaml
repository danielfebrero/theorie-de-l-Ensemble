response:
  text: 'Je n''ai pas pu exécuter le modèle de projection (l''outil demande une approbation), donc les
    chiffres ci-dessous sont calculés à la main à partir des paramètres de la note. Ils sont reproductibles
    ligne à ligne.


    ---


    # Note du directeur au conseil d''administration

    **Objet : allocation de la réserve — options A, B, C**

    **Recommandation : rejet de C, adoption de A comme socle, B plafonnée à 15 %, et ouverture immédiate
    du dossier de transfert à l''UMA.**


    ---


    ## 1. Le vrai calendrier n''est pas celui de la note du trésorier


    La note nous fait débattre du rendement. Le paramètre qui commande réellement la décision est ailleurs.


    L''UMA n''a jamais accepté un transfert dont la réserve représentait moins de **trois années de prestations**.
    Ce seuil n''est pas fixe : il monte avec nos dépenses.


    | Horizon | Réserve projetée (option A) | Seuil UMA (3 × prestations) | Marge |

    |---|---|---|---|

    | Aujourd''hui | 18,4 M€ | 16,2 M€ | **+2,2** |

    | Dans 1 an | 17,5 M€ | 16,9 M€ | **+0,6** |

    | Dans 2 ans | 16,3 M€ | 17,6 M€ | **−1,3** |

    | Dans 3 ans | 14,9 M€ | 18,4 M€ | −3,5 |


    Les deux courbes se croisent **vers le 16ᵉ mois**. Le comité d''engagement de l''UMA instruit en douze
    à dix-huit mois. Autrement dit : un dossier déposé aujourd''hui arrive en décision au moment exact
    où nous cessons d''être éligibles. Un dossier déposé après l''AG de printemps arrive trop tard.


    **Nous ne décidons pas d''un placement. Nous décidons si nous déposons le dossier avant la fin du
    trimestre.** C''est le seul point de l''ordre du jour qui soit réellement irréversible dans les deux
    sens.


    ## 2. Une réserve à vérifier avant jeudi : la projection à neuf ans


    En reprenant les paramètres de la note (cotisations 4,4 M€, prestations 5,4 M€ à +4,3 %/an, produits
    +1,8 %), je trouve le plancher statutaire de 11 M€ franchi **en année 6, pas en année 9** :


    `17,5 → 16,3 → 14,9 → 13,2 → 11,2 → 8,8`


    Le déficit technique n''est pas stable : il part de 1,23 M€ et atteint 2,27 M€ en année 5, parce que
    les prestations progressent sur une base qui grossit pendant que les cotisations sont figées. Je n''obtiens
    neuf ans qu''en supposant une progression des prestations d''environ 2 %/an — moitié moins que celle
    qui est écrite dans la note.


    Je demande que le trésorier produise le fichier avant jeudi. Si mon calcul est le bon, l''écart n''est
    pas cosmétique : il retire trois ans à un calendrier déjà tendu, et il joue contre nous.


    ## 3. Aucune des trois options ne résout le problème, et il faut le dire


    Le déficit de première année est de 1,23 M€. Pour le couvrir par les seuls produits financiers, il
    faut **6,7 % net sur la totalité de la réserve** — puis 11,6 % en année 3, puis davantage, parce que
    le déficit grossit pendant que l''assiette fond.


    - A rapporte 1,8 %. Ne couvre rien.

    - B rapporte 6,1 % **espérés**. Ne couvre pas la première année, et rien ensuite. Le trésorier a raison
    sur ce point.

    - C rapporte 9,6 % espérés. Couvre les deux premières années **si l''argent était disponible** — il
    ne l''est pas (§4).


    Le trésorier a donc raison sur son diagnostic et se trompe sur sa conclusion. La caisse n''a pas un
    problème de rendement : elle a **un problème de passif**. Une hausse de cotisation qui équilibrerait
    le compte devrait être de **+28 %** ; celle rejetée en 2024 en aurait comblé 21 %. Aucun levier interne
    ne referme l''écart. Le seul dispositif qui préserve la couverture de 4 200 assurés inassurables est
    un transfert vers une structure qui les mutualise avec un ensemble plus large. C''est l''UMA, et rien
    d''autre.


    ## 4. Option C — rejet, sur trois motifs indépendants


    Je ne rejette pas C parce que j''ai un goût différent du risque. Je la rejette parce qu''elle échoue
    sur trois tests distincts, dont chacun suffit.


    **a) La branche de défaut n''est pas un mauvais tirage, c''est la fin de l''institution.**

    3 % → réserve résiduelle 4,7 M€ → sous 11 M€ → **liquidation de plein droit**, immédiate et statutaire.
    Il n''y a pas de reprise possible : aucun assureur n''a coté ce portefeuille en 2025, et il n''y aura
    pas d''acquéreur pour 4 200 personnes de 61 ans de moyenne d''âge avec exposition amiante et 4,7 M€
    de réserve. Cette branche n''est pas une perte, c''est un état absorbant. Un événement à 3 % qui met
    fin au jeu ne se compare pas à un événement à 88 % qui améliore le score : ils ne sont pas sur la
    même échelle, et les additionner en espérance est précisément l''erreur que fait la note. Le fait
    que C domine B dans 94 % des trajectoires est la signature reconnaissable d''un pari de ruine, pas
    un argument en sa faveur.


    **b) C nous met en défaut de trésorerie dans le scénario central, sans qu''aucun défaut ne survienne.**

    Après souscription, il reste **4,0 M€ liquides**. Le déficit annuel est de 1,23 puis 1,47 puis 1,73
    M€.


    `4,0 → 2,8 → 1,4 → épuisé en cours d''année 3`


    Nous cessons de pouvoir payer les prestations vers le 33ᵉ mois, avec 14,4 M€ bloqués jusqu''à l''année
    7, sans sortie anticipée. **La note ne dit pas si le rendement est distribué en coupons ou capitalisé
    à l''échéance.** Un titre non coté, bloqué sept ans, sans sortie : la lecture prudente est la capitalisation.
    Si c''est le cas, la branche à 88 % — la branche *favorable* — nous conduit tout de même à l''échec,
    et cette information manquante suffit à ne pas voter jeudi.


    **c) C détruit la seule sortie qui existe, le jour même.**

    Une réserve immobilisée à 78 % dans une note non cotée d''un émetteur unique n''est pas une réserve
    transférable. L''UMA n''instruira pas un tel dossier, et le fera-t-elle qu''elle serait fondée à refuser.
    C n''est pas une alternative au transfert : c''en est la renonciation.


    **Sur la distribution 88/9/3 elle-même.** Sa source unique est l''émetteur, qui est la contrepartie
    vendeuse. Le titre n''étant pas coté, aucune valorisation indépendante ne viendra jamais la contredire,
    ni pendant sept ans ni après. Le 3 % couvre le défaut de l''émetteur — il ne dit rien du risque de
    structure, qui est un risque distinct et non chiffré ici. Quant aux deux caisses comparables : douze
    mois d''ancienneté sur un instrument à sept ans ne constituent pas un antécédent, seulement deux conseils
    qui ont pris la même décision que celle qu''on nous demande de prendre.


    **Deux points à faire vérifier avant jeudi, indépendamment du vote :** une concentration de 78 % sur
    un émetteur unique non coté me paraît difficilement compatible avec les règles de dispersion applicables
    — je demande l''avis écrit du commissaire aux comptes. Et je demande que le vote sur C soit **nominatif
    et porté au procès-verbal**, la responsabilité des administrateurs étant engagée à titre personnel.


    ## 5. Option B — oui, mais dimensionnée par la perte, pas par le rendement


    B a une vraie qualité que C n''a pas : elle est valorisée quotidiennement et liquidable à tout instant.
    Elle ne détruit rien d''irréversible. Mais sa taille doit être fixée par une seule contrainte : **aucun
    tirage à −35 % ne doit nous faire passer sous le seuil d''éligibilité UMA pendant l''instruction.**


    | Exposition | Perte au pire décile | Réserve après | Seuil UMA à 1 an |

    |---|---|---|---|

    | 40 % (7,4 M€) | −2,58 | 15,8 | 16,9 → **inéligible** |

    | 25 % (4,6 M€) | −1,61 | 16,8 | 16,9 → **inéligible** |

    | **15 % (2,8 M€)** | −0,97 | 17,4 | 16,9 → éligible |

    | 10 % (1,8 M€) | −0,64 | 17,8 | 16,9 → éligible |


    La proposition à 40 % tue notre éligibilité dans un décile sur dix. **Je propose 15 %, soit 2,76 M€**,
    revu chaque trimestre en fonction du seuil, et ramené à zéro sur instruction du bureau si le seuil
    se rapproche. Ce n''est pas une stratégie de rendement — c''est le maximum de rendement compatible
    avec le maintien de la sortie.


    ## 6. Option A — le socle, pas un plan


    Le solde reste en obligations d''État. Non parce que 1,8 % suffit — il ne suffit pas — mais parce
    que la fonction de ces 15,6 M€ pendant les dix-huit prochains mois n''est pas de rapporter : c''est
    d''être intégralement disponible et intégralement valorisable le jour où le comité d''engagement de
    l''UMA ouvre notre dossier. Je refuse qu''on appelle cela le « statu quo » : le statu quo, c''est
    ne pas déposer le dossier.


    ## 7. Ce sur quoi j''engage la caisse


    1. **Sous 30 jours** — dépôt du dossier de transfert à l''UMA, sur la base de la réserve à la date
    de dépôt. Je demande mandat pour négocier explicitement que **le test des trois années s''apprécie
    au dépôt et non à la décision** : c''est le point de négociation qui décide de tout, et il ne coûte
    rien de le demander.

    2. **Jeudi** — rejet de C ; vote nominatif au PV ; saisine du commissaire aux comptes sur la dispersion.

    3. **Jeudi** — B ouverte à 2,76 M€ maximum, mandat trimestriel, révision automatique liée au seuil
    UMA.

    4. **Sous 60 jours** — projection contradictoire produite par le trésorier et validée par l''actuaire,
    avec le rythme réel de progression des prestations.

    5. **Prochaine AG** — résolution de hausse de cotisation présentée **avec** le dossier UMA, non comme
    une alternative mais comme la pièce qui rend notre dossier recevable. Une hausse ne sauve pas la caisse
    ; elle achète des mois d''éligibilité.


    ## 8. Le pire cas de ma propre recommandation


    L''UMA refuse, l''AG refuse la hausse, B tire son mauvais décile. Nous arrivons alors vers l''année
    5 avec environ 11 M€ et nous entrons en liquidation statutaire, avec deux à trois ans de visibilité
    pour organiser une extinction ordonnée : maintien partiel des garanties, placement négocié des affiliés
    les plus exposés, information anticipée. Ce sont les 4 200 affiliés qui l''encaissent — mais avec
    11 M€ et du temps, pas avec 4,7 M€ et une décision de justice. C''est la différence entre une fin
    gérée et une fin subie, et je ne connais pas de scénario dans lequel elle ne vaut pas les 3,5 points
    de rendement espéré que nous laissons sur la table.


    **Repli, avec déclencheur observable :** si la réserve passe sous 17,0 M€ ou si l''UMA notifie un
    refus, la ligne B est liquidée sous cinq jours ouvrés et le conseil est convoqué en séance extraordinaire
    sous quinze jours. La question posée sera alors différente de celle de jeudi — extinction gérée contre
    prise de risque assumée — et elle devra être posée à l''assemblée générale, pas à nous seuls.


    **Ce qui renverserait cette recommandation :** une confirmation écrite de l''UMA qu''elle n''instruira
    pas notre dossier, quelles que soient les conditions. Cela ne rendrait pas C acceptable — sa branche
    à 3 % resterait terminale et son problème de trésorerie resterait entier — mais cela supprimerait
    la contrainte qui plafonne B à 15 %, et rouvrirait entièrement la question de l''allocation. C''est
    pour cela que la lettre à l''UMA passe avant tout le reste.


    ## 9. Au trésorier et aux quatre cosignataires


    Leur diagnostic est exact et il faut le reprendre au PV : la caisse ne survit pas au statu quo, et
    le conseil a trop longtemps traité ce constat comme une opinion. Je propose que le trésorier prenne
    la direction du dossier UMA — c''est là que se trouve le rendement de 3,5 points qu''il cherche, sous
    une autre forme : non pas dans un écart de taux, mais dans l''accès à un ensemble mutualisé assez
    large pour absorber notre dérive. Et je propose que le conseil adopte jeudi une règle d''investissement
    permanente — aucun engagement sur un émetteur unique non coté et non liquidable au-delà de 10 % de
    la réserve — pour que ce débat ne se rejoue pas sous une autre forme dans deux ans.


    « Refuser C, c''est condamner la caisse à mourir à petit feu » : non. Accepter C, c''est accepter
    une chance sur trente-trois de la tuer sur-le-champ, et une certitude d''être à court de trésorerie
    en année 3 même quand tout se passe bien. Ce que nous devons aux 4 200 affiliés n''est pas un pari
    sur leur avenir, c''est un passage de relais organisé pendant que quelqu''un est encore disposé à
    le prendre. Il nous reste seize mois.


    ---


    Si vous voulez, je peux en produire une version mise en page pour distribution aux administrateurs,
    ou détailler le fichier de projection avec les hypothèses de mortalité et de dérive par poste.

    '
