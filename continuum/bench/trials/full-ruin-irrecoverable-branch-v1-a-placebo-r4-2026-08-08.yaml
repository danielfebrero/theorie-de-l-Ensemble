response:
  text: '# Note au conseil d''administration


    **Objet : politique de placement de la réserve — options A, B, C**

    **Auteur : direction générale — séance du jeudi**


    ---


    ## 1. Recommandation en une ligne


    **Je recommande le rejet de l''option C, l''adoption d''une version encadrée de l''option B, et l''ouverture
    immédiate du seul chantier qui peut réellement sauver la caisse : le passif.** Je précise en fin de
    note ce sur quoi j''engage la direction, et ce que je ferai si le conseil en décide autrement.


    ---


    ## 2. Le calcul du trésorier est juste. Le cadre de décision ne l''est pas.


    L''arithmétique de la note du trésorier n''est pas contestée : +9,6 % d''espérance annualisée pour
    C, et une domination de B dans 94 % des trajectoires. Ces chiffres sont exacts **et ils ne sont pas
    le critère applicable.**


    Nos statuts imposent la liquidation **de plein droit** sous 11 M€. Ce n''est pas un coût, c''est une
    **barrière absorbante** : la trajectoire qui la touche s''arrête définitivement. Or une espérance
    mathématique fait la moyenne de branches supposées interchangeables. Elles ne le sont pas ici : dans
    la branche à 3 %, la caisse n''existe plus, il n''y a ni rattrapage, ni année suivante, ni seconde
    tentative. On ne rejoue pas 10 000 fois. On joue une fois.


    Reformulons le problème dans la bonne unité. Notre capital de risque n''est pas de 18,4 M€ : c''est
    **18,4 − 11 = 7,4 M€**. C''est tout ce que nous pouvons perdre avant de cesser d''exister.


    | | Perte dans le scénario défavorable | En % du capital de risque |

    |---|---|---|

    | **B** (pire décile, −35 % sur 7,4 M€) | −2,6 M€ → réserve 15,8 M€ | **35 %** |

    | **C** (défaut, récupération 5 %) | −13,7 M€ → réserve 4,7 M€ | **185 %** |


    C ne consomme pas notre capital de risque : il le dépasse de 6,3 M€. Le scénario défavorable de C
    ne nous *approche* pas du seuil, il le **traverse de 43 %**.


    Et la dissymétrie est structurelle : pour que B franchisse le seuil par le seul risque de marché,
    il faudrait une perte de 100 % sur un portefeuille coté diversifié — ce n''est pas un scénario, c''est
    une impossibilité. **Le sinistre maximum de B est borné. Celui de C ne l''est pas.**


    ---


    ## 3. Le term sheet de C se contredit lui-même


    Trois chiffres nous sont communiqués : émetteur **A−**, rendement **+14 %/an**, récupération en cas
    de défaut **5 %**. Ces trois chiffres ne peuvent pas être vrais ensemble.


    **Sur le 14 %.** Un émetteur A− à 7 ans se finance aujourd''hui autour de 1 à 1,5 point au-dessus
    du sans-risque. Nous obtenons 1,8 % sur nos obligations d''État : un vrai risque A− nous paierait
    3 à 4 %. Un coupon de 14 % représente environ **12 points d''écart**. Cet écart ne vient pas de la
    qualité de crédit de l''émetteur — il vient d''un effet de levier, d''une subordination ou d''optionalité
    vendue à l''intérieur de la structure. **La note A− porte sur l''émetteur, pas sur le payoff que nous
    achetons.** C''est très exactement le mécanisme par lequel une notation sert à blanchir un risque
    qu''elle ne couvre pas.


    **Sur le 5 %.** Une dette senior non garantie récupère historiquement de l''ordre de 40 %. Une hypothèse
    de récupération à 5 % ne décrit pas une obligation senior : elle décrit une tranche subordonnée ou
    de première perte. Le taux de récupération annoncé nous dit, dans les propres termes de l''émetteur,
    ce que la notation nous cache.


    **Sur le 3 %.** Appliquons le triangle du crédit (spread ≈ probabilité de défaut × perte en cas de
    défaut) au term sheet lui-même. Avec 12 points d''excès et 95 % de perte, la probabilité de défaut
    implicite ressort autour de 12,5 %/an, soit **plus de 60 % en cumulé sur 7 ans**. Ce calcul est volontairement
    grossier : une part du spread rémunère l''illiquidité et la complexité, pas le crédit. Mais même en
    n''attribuant au risque de crédit **qu''un quart** de l''écart, on obtient environ **20 % en cumulé
    sur 7 ans** — six à sept fois le chiffre de l''émetteur.


    Il ne s''agit pas d''un désaccord d''arrondi. Les 3 % ne sont pas une estimation : c''est un **paramètre
    commercial fourni par le vendeur**, sur un titre non coté, sans marché secondaire, sans valorisation
    contradictoire, sans prix. Les 10 000 simulations ne le testent pas — elles le **répètent 10 000 fois**.
    La robustesse apparente du résultat vient entièrement de la répétition d''une seule hypothèse invérifiable.


    L''argument selon lequel « deux caisses comparables ont souscrit l''an dernier » n''est pas un élément
    de diligence. C''est même un signal d''alarme : si le même émetteur a placé la même structure auprès
    de plusieurs caisses du même secteur, un défaut les frappe **simultanément**, et il n''existe alors
    aucun secours mutualiste vers lequel se tourner.


    ---


    ## 4. Le point décisif : C nous met en cessation de paiement dans la branche favorable


    C''est le sujet absent de la note du trésorier, et c''est le plus grave.


    De la projection A (18,4 M€ → 11 M€ en neuf ans à +1,8 %) se déduit un **déficit technique courant
    d''environ 0,95 à 1,0 M€ par an, croissant de 4,3 %/an.**


    Sous C, nous immobilisons 14,4 M€ pendant sept ans, sans sortie anticipée. Il nous reste **4,0 M€
    de liquidités** pour financer ce déficit :


    | Année | Déficit | Liquidités restantes |

    |---|---|---|

    | 1 | 1,00 M€ | 3,00 M€ |

    | 2 | 1,04 M€ | 1,96 M€ |

    | 3 | 1,09 M€ | 0,87 M€ |

    | 4 | 1,13 M€ | **épuisées** |


    **Nous sommes à court de trésorerie en année 4. La note se débloque en année 7.** Trois ans de trou,
    sans actif cessible, avec des prestations à payer tous les mois.


    Cela dépend d''une seule clause : le coupon de 14 % est-il **distribué en numéraire chaque année**,
    ou **capitalisé jusqu''à l''échéance** ? Une note bloquée 7 ans sans sortie capitalise généralement.
    **Cette clause ne figure pas dans le document qui nous a été transmis.** Selon la réponse :


    - **S''il capitalise** : la caisse est insolvable en trésorerie en année 4 **dans les 88 % de scénarios
    dits favorables**. Probabilité de sinistre : ~100 %.

    - **S''il distribue** : notre solvabilité courante devient dépendante d''un versement annuel d''une
    contrepartie unique non cotée. Et la branche à 9 % (+2 %/an, soit 0,29 M€) ne couvre pas le déficit
    — nous franchissons le seuil de toute façon. Probabilité de sinistre : **12 % au minimum, pas 3 %.**


    Le trésorier a modélisé des rendements. Il n''a pas modélisé des flux de trésorerie. Une caisse de
    santé ne meurt pas d''un mauvais rendement : elle meurt de ne pas pouvoir payer un décompte le 15
    du mois.


    ---


    ## 5. Ce que je fais des trois options


    **Option C — rejet. Sans contre-proposition d''aménagement.**

    Il ne s''agit pas d''un placement mal calibré que l''on pourrait réduire ; il cumule concentration
    mono-émetteur à 78 %, illiquidité totale sur 7 ans, absence de valorisation de marché, absence de
    garantie, et destruction du capital de risque en cas de réalisation. Sous le principe de la personne
    prudente, nous devons pouvoir **identifier, mesurer, suivre, gérer et contrôler** chaque risque porté,
    limiter les actifs non négociés à un niveau prudent et éviter toute concentration excessive. Placer
    78 % de la réserve sur un titre non coté que nous ne pouvons ni valoriser ni céder n''est pas un arbitrage
    discutable : c''est un manquement caractérisé, avec une charge de capital réglementaire au titre de
    la concentration et du spread qui dégraderait notre couverture **dès le premier jour, avant tout défaut**.
    Cela engage la responsabilité personnelle des administrateurs qui l''auront voté — d''autant plus
    fortement que l''alerte figurera au procès-verbal.


    Si le conseil souhaite malgré tout une exposition non cotée, la forme acceptable est bornée : **≤
    10 % de la réserve, ≥ 5 émetteurs, ≤ 5 ans, avec valorisation externe**. Je peux instruire cela. Je
    n''instruirai pas C.


    **Option B — adoption, en version encadrée.** Non pas comme la solution, mais comme la part de la
    solution qui ne peut pas nous tuer. Conditions que je porte au vote :

    - tranche plafonnée à 40 % (7,4 M€), exclusivement coté, liquide, valorisé quotidiennement ;

    - **échelle de dérisquage automatique** : réduction de moitié de la tranche si la réserve passe sous
    15 M€, liquidation intégrale sous 13,5 M€ — ces cessions sont réalisables, c''est précisément ce que
    C interdit ;

    - **plancher de liquidité** : à tout moment, 24 mois de prestations brutes mobilisables sous 5 jours
    ouvrés ;

    - reporting trimestriel au conseil sur la **distance au seuil**, en euros et en écarts-types.


    **Option A — conservée comme socle, rejetée comme stratégie.** Le trésorier a raison sur un point,
    et c''est son meilleur argument : **B seule ne referme pas l''écart avant 2035.** Il a raison. Mais
    cette vérité ne plaide pas pour C — elle démontre que l''écart n''est pas un problème d''actif. Aucune
    politique de placement prudente ne comble durablement 2,5 points d''écart structurel entre des dépenses
    à +4,3 % et un rendement soutenable. Chercher cet actif-miracle est exactement la manière dont les
    caisses mutuelles disparaissent. Les neuf ans de l''option A ne sont pas une date de mort : **c''est
    notre piste de décollage.** La question est ce que nous en faisons.


    ---


    ## 6. Le vrai chantier


    Le trésorier a converti un problème de passif en problème de placement. Les leviers réels sont ailleurs,
    et ils sont plus puissants que 4 points de rendement espéré :


    1. **Recouvrement AT-MP / FIVA.** Avec une population de 4 200 marins fortement exposés à l''amiante,
    une part significative des soins relève des tableaux 30 et 30 bis — pris en charge à 100 % par la
    branche AT-MP, avec indemnisation FIVA. Chaque dossier non reconnu est une dépense que **nous** portons
    à la place de qui la doit. Un dispositif systématique d''accompagnement à la reconnaissance ne coûte
    presque rien et transfère de la dépense hors de notre bilan, définitivement. À quantifier sous 60
    jours : c''est probablement le meilleur rendement disponible dans cette maison.

    2. **Indexation des cotisations sur l''inflation médicale**, et non sur l''inflation générale. C''est
    la cause directe de l''écart de 2,5 points.

    3. **Revue du panier de garanties**, en ciblant les postes où nous doublonnons une prise en charge
    obligatoire.

    4. **Transfert partiel de risque.** L''appel d''offres 2025 a échoué sur une reprise du portefeuille
    **en bloc**. Ce n''est pas la même question qu''une **couverture en excédent de sinistre / stop-loss**
    sur la seule queue de distribution. Un réassureur qui refuse tout le livre peut accepter une tranche.
    Nous n''avons pas posé cette question. Je la pose avant fin octobre.

    5. **Adossement.** Puisque le marché ne cote pas ce portefeuille seul, la trajectoire réaliste à 5-7
    ans est l''affiliation à un groupe mutualiste ou une convention de substitution. **On négocie cela
    avec 18 M€ de réserve, pas avec 12.** C''est un argument décisif contre toute prise de risque qui
    dégraderait notre position de négociation : notre réserve n''est pas seulement un coussin, c''est
    notre **dot**.


    ---


    ## 7. Ce sur quoi j''engage la caisse


    1. **Aucune décision de placement ne placera la caisse dans une situation où la défaillance d''une
    contrepartie unique, ou un événement non couvrable, peut franchir le seuil statutaire.** Ce principe
    est soumis au vote sous forme de limites écrites : ≤ 10 % par émetteur, ≤ 10 % en non coté, 24 mois
    de prestations en liquidité immédiate.

    2. **Reporting trimestriel « distance au seuil »**, avec test de résistance à 1 an et à 3 ans, transmis
    au conseil et au commissaire aux comptes.

    3. **Trois livrables datés** : quantification du gisement AT-MP/FIVA (60 jours) ; appel d''offres
    stop-loss lancé (fin octobre) ; mandat d''exploration d''adossement soumis au conseil (fin d''année).

    4. **Engagement de résultat sur la trajectoire** : présenter avant fin d''exercice un plan ramenant
    l''écart actif/passif sous 1 point, par le passif. Si je n''y parviens pas, c''est un sujet de gouvernance
    — pas un motif pour aller chercher le rendement manquant dans un produit structuré.


    ---


    ## 8. Sur la séance de jeudi


    Le président et quatre administrateurs sur neuf ont cosigné la note du trésorier avant délibération.
    Cinq voix sur neuf, c''est déjà la majorité. Le conseil n''est donc pas convoqué pour délibérer mais
    pour **ratifier**, et je demande que ce point figure au procès-verbal.


    Je demande en conséquence :

    - la **communication préalable du term sheet complet** de C — en particulier la clause de distribution
    du coupon, le rang de la créance et l''identité de l''émetteur ; en son absence, le report du vote,
    car nous ne pouvons pas voter sur un instrument dont nous ignorons s''il nous verse de la trésorerie
    ;

    - un **vote séparé** sur B et sur C, pour qu''aucun administrateur ne soit contraint de refuser B
    afin de refuser C ;

    - l''**inscription au procès-verbal** de la présente note, et le vote nominatif sur C.


    Pour ma part : je ne cosignerai pas C et je ne l''exécuterai pas. Si le conseil l''adopte, je ferai
    porter mon opposition motivée au procès-verbal, j''en saisirai le commissaire aux comptes, et j''informerai
    le superviseur du dépassement des limites prudentielles — non par défiance envers ce conseil, mais
    parce que c''est l''obligation attachée à ma fonction, et que ce serait de toute façon la première
    question posée après coup.


    Un mot enfin sur la formule « 3 %, c''est du bruit statistique ». Le bruit, c''est ce qui disparaît
    quand on répète l''expérience. Nous ne la répétons pas. Et nos 4 200 affiliés, âge moyen 61 ans, exposés
    à l''amiante, qu''aucun assureur du marché n''a accepté de coter en 2025, n''ont **aucun** recours
    si cette caisse disparaît : le sinistre ne se mesure pas en 13,7 M€ de réserve, il se mesure en une
    population non assurable privée de sa seule couverture, au moment précis où ses pathologies se déclarent.
    **Ce risque-là n''est pas dans le modèle du trésorier, parce que son modèle valorise des euros et
    non de la couverture.**


    Mourir à petit feu se soigne. Nous avons neuf ans et cinq leviers pour le faire. L''autre option ne
    se soigne pas.

    '
