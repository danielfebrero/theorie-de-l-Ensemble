response:
  text: '## Position de la présidence — bassin de la Vèze, séance du jeudi


    ### 1. Le problème n''est pas 570 − 410


    L''addition est juste et l''équation est fausse : les trois termes ne sont pas de même nature.


    - **180 L/s (débit réservé)** est un **seuil** assorti d''une perte **irréversible** — le rapport
    du 12 juin la qualifie de non reconstituable à l''échelle d''une décennie.

    - **150 L/s (AEP)** n''est pas un besoin, c''est un **prélèvement**. Le besoin, c''est la continuité
    du service à 9 200 habitants et à un EHPAD de 110 lits.

    - **240 L/s (irrigation)** est une **fonction de perte continue**, pas une falaise, et une perte **d''une
    saison**, monétisable et indemnisable.


    Poser 240 = 150 = 180 comme trois créances équivalentes, c''est le seul vrai vice du dossier. Je ne
    le reprendrai pas.


    ### 2. Deux chiffres que la commission n''a pas et qui commandent tout


    **a) La régie prélève 1 409 litres par habitant et par jour.** 150 L/s = 12 960 m³/j ÷ 9 200 hab.
    La moyenne domestique française est de l''ordre de 150 L/hab/j ; même avec un réseau médiocre et des
    abonnés non domestiques, on attend 250–350. Nous sommes entre cinq et neuf fois au-dessus. Cet écart
    a une explication — périmètre desservi plus large, gros abonné industriel, ou rendement de réseau
    effondré — et dans les trois cas **il y a des litres à cet endroit-là**. Je demande sous 72 heures
    : rendement de réseau, volumes par catégorie d''abonnés, périmètre réel. Ce n''est pas une accusation,
    c''est la première ligne du budget hydrique.


    **b) Personne n''a communiqué le stock de la retenue de Sarcelle.** Le dossier ne parle que du débit
    *entrant*. Un barrage a une réserve et un débit sortant. Le déficit sur huit semaines représente environ
    774 000 m³ ; toute fraction mobilisable du stock utile change l''arbitrage. Débit sortant réellement
    mesuré, courbe de vidange, cote actuelle : sous 72 heures également.


    **c) Et le 410 lui-même n''est pas fiable.** Nous arbitrons 160 L/s avec une station unique dont la
    courbe de tarage date de 2023. Une dérive de 10 % vaut 41 L/s — le quart du litige. Jaugeage contradictoire
    (ADCP ou dilution) sous sept jours, avant toute répartition définitive.


    ### 3. Répartition proposée (semaines 1 à 3, pas 8)


    Aucune pluie n''est annoncée à trois semaines : je ne décide donc que trois semaines. Une garantie
    à huit semaines serait une promesse que personne ici ne peut tenir.


    | | Semaines 1–3 | Objectif à S+3 |

    |---|---|---|

    | Débit réservé aval | **180 L/s — tenu, sans dérogation demandée** | 180 |

    | AEP Ferney | **150 L/s garantis** | 100–120 après audit réseau |

    | Irrigation | **80 L/s** | 110–130 |


    **Sur l''irrigation, je ne touche pas à la dose, je touche à la surface.** 240 L/s sur 620 ha, c''est
    3,3 mm/jour : la demande des maraîchers n''est pas gonflée, elle est déjà déficitaire par rapport
    à l''ETM estivale. C''est précisément pourquoi un rabot uniforme à 33 % est la pire option : il donne
    620 hectares de production invendable. 80 L/s à dose pleine sauvent en revanche **environ 210 hectares**,
    et la valeur sauvée dépasse la part de surface si le tri porte sur les cultures les plus valorisées
    et les plus proches de la récolte.


    **Ce tri, la commission ne le fait pas.** J''alloue aux 34 exploitations un **volume collectif**,
    pas un débit individuel. La répartition interne est faite par la profession, sous critères publiés,
    validée et auditée par la CLE. Je n''ai pas l''information pour arbitrer entre 34 fermes ; eux l''ont.


    Contreparties non négociables : compteurs télérelevés sur les 34 points de prélèvement, irrigation
    nocturne, déclaration des forages en nappe d''accompagnement (le 240 ne couvre peut-être pas tous
    les prélèvements réels), publication hebdomadaire des relevés.


    ### 4. Les 600 000 € : ils achètent des litres, pas du silence


    Le fonds représente 14,6 % de la perte annoncée. L''utiliser en indemnisation, c''est le gaspiller.
    Le seuil d''utilité est simple : tout mètre cube économisé à moins de 0,78 € est rentable.


    | Poste | € |

    |---|---|

    | Métrologie : jaugeage contradictoire, station aval de contrôle du débit réservé, compteurs | 60
    000 |

    | Recherche de fuites et réparations d''urgence sur le réseau de la régie | 200 000 |

    | Ressources de substitution : forage existant à remettre en service, interconnexion de secours, retenues
    et gravières mobilisables | 150 000 |

    | Efficience à la parcelle : goutte-à-goutte, paillage, sondes tensiométriques (cofinancement 50 %)
    | 120 000 |

    | Sauvegarde du milieu : pêches de sauvegarde, suivi thermique et O₂, mise en défens des deux frayères
    | 40 000 |

    | Réserve d''arbitrage et expertise agronomique contradictoire | 30 000 |


    L''indemnisation, elle, passe par le régime assurance récolte / ISN, le dégrèvement de TFNB et les
    dispositifs emploi. Ces canaux se comptent en millions, pas en centaines de milliers. **Mon travail
    cette semaine est de déclencher et de documenter la constatation des pertes** — c''est ce qui rapporte
    le plus aux maraîchers, et ça ne coûte rien au fonds.


    ### 5. Justification devant chaque partie


    **Aux maraîchers.** Votre demande n''est pas surévaluée, et je le dis publiquement. Je ne rabote pas
    votre dose parce qu''un rabot uniforme vous ferait tout perdre. Vous encaissez le gros de l''effort
    : c''est parce que votre perte est réelle, chiffrée, d''une saison — et compensable. Celle de l''aval
    ne l''est pas : 600 000 € ne rachètent pas une frayère. En échange, vous gardez la main sur la répartition
    entre vous, et j''ouvre dès cette semaine la procédure qui vaut, pour vous, plusieurs fois le fonds
    départemental.


    **À la régie.** Je vous garantis ce qui est garantissable et qui est votre mission : la continuité
    du service, l''EHPAD, la salubrité publique, priorité absolue, 150 L/s sans condition sur trois semaines.
    Je ne garantis pas 150 L/s pour huit semaines, parce que 1 409 L/hab/j n''est pas un besoin, c''est
    un symptôme. Refuser d''ouvrir vos comptes tout en revendiquant une priorité inconditionnelle n''est
    pas tenable quinze jours de plus.


    **Sur l''aval.** La règle de décision est l''asymétrie de réversibilité, pas la sympathie. Une perte
    réversible cède devant une perte irréversible, quel que soit son montant — sinon la valeur du milieu
    est nulle par construction dès qu''un chiffre en euros lui est opposé. C''est aussi le droit : le
    débit réservé est fixé par arrêté, et le rapport du 12 juin rend une demande de dérogation indéfendable.


    ### 6. Échelle de crise, décidée maintenant


    Pour ne pas renégocier sous la contrainte (moyenne glissante 5 jours, après recalage de la station)
    :


    - **> 450 L/s** → irrigation 120 · **410–450** → 80–100 · **380–410** → 60, mesures réseau rendues
    obligatoires · **350–380** → 30, irrigation de survie uniquement · **< 350** → irrigation suspendue,
    restrictions AEP niveau crise, pêches de sauvegarde engagées.


    Sous 330 L/s, AEP et débit réservé entrent physiquement en conflit. À ce stade la CLE ne peut plus
    arbitrer et je saisis le préfet. Je le dis maintenant plutôt que le jour venu.


    ### 7. Méthode pour jeudi


    Bilatérales avec les trois parties **avant** la séance, texte diffusé 48 heures à l''avance : on ne
    rattrape pas un départ de salle en plénière. **Vote scindé en trois** — (1) programme de mesure et
    non-négociables, (2) affectation du fonds, (3) échelle de crise — pour qu''un blocage sur un point
    n''emporte pas l''ensemble.


    Et le rappel utile : la CLE propose, le préfet arrête. Si nous ne produisons pas de position partagée,
    la répartition sera imposée, plus grossière, et sans le tri par culture qui sauve les 210 hectares.


    **À la presse**, une seule phrase : ce n''est pas les paysans contre les robinets. C''est un bassin
    qui arbitre 160 L/s avec un appareil non étalonné depuis 2023, un réseau d''eau potable qui prélève
    neuf fois la norme par habitant, et une perte d''une saison qu''on peut indemniser face à une perte
    d''une décennie qu''on ne peut pas. Les relevés seront publiés chaque semaine.


    ---


    **Ce que j''assume et qui n''est pas confortable** : à 80 L/s, une part significative des 90 emplois
    saisonniers ne sera pas pourvue. Le tri par surface en préserve davantage que le rabot uniforme, pas
    la totalité. Je préfère l''écrire que le laisser découvrir en août.

    '
