response:
  text: '## 1. Le point qui tranche : « artefact de journalisation » est déjà réfuté par tes propres données


    Un artefact de journalisation frappe les deux bras de la même façon. Ici :


    | | Inversions `first_action_at < bucket_assigned_at` |

    |---|---|

    | Bras v2 | 4 812 / 11 300 — **42,6 %** |

    | Bras témoin | 98 / 10 940 — **0,90 %** |


    Facteur **47×**. Et les 0,90 % du témoin sont précisément ce à quoi ressemble un vrai bruit d''écriture
    (courses, écritures à la même seconde) : c''est ton plancher de bruit mesuré.


    Les trois explications techniques habituelles sont fermées par les faits que tu as déjà : horloge
    unique NTP, même service d''ingestion, écriture côté serveur, aucune source mobile, aucun incident
    infra sur la période. Il ne reste qu''une cause, et elle est écrite dans le code du 2 mars : **v2
    n''affecte le compte qu''à la deuxième session, le témoin dès la première.** L''inversion n''est pas
    un bug d''horodatage, c''est le comportement nominal du code de bucketing.


    La conséquence est structurelle et pas cosmétique : le bras v2 ne contient que des utilisateurs **revenus**,
    le bras témoin contient tout le monde. On ne compare pas v1 à v2 — on compare « les gens qui reviennent
    » à « tout le monde ». Or revenir en session 2 est à peu près le meilleur prédicteur d''activation
    qui existe. Le biais a un signe connu : **il gonfle v2.**


    ## 2. Ce que le chiffre vaut réellement


    En reprenant les taux annoncés (et en posant que « première action clé » *est* l''événement d''activation
    — à confirmer, mais ça ne change pas la structure) :


    - v2 : 11 300 × 47 % ≈ **5 311 activations**

    - dont **4 812 survenues avant toute exposition à v2**

    - soit **90,6 % des activations créditées à v2 ont eu lieu avant que l''utilisateur ait vu v2**


    Activation strictement post-exposition : 499 / 11 300 = **4,4 %**, contre 30,1 % au témoin.


    Ce second chiffre est tout aussi faux que le premier — les dénominateurs ne sont pas comparables non
    plus. C''est exactement le point à faire passer : **la mesure n''est pas biaisée d''un montant qu''on
    pourrait corriger, elle est ininterprétable en l''état.** Ni 47 %, ni 4,4 %. Aucun retraitement arithmétique
    ne sauve ce read-out.


    Contrôle à faire en passant : 11 300 vs 10 940 alors que v2 a une porte d''entrée plus restrictive.
    Sous un filtre « session 2 », le bras v2 devrait être nettement plus petit. La quasi-parité implique
    soit un re-remplissage du bras, soit un dénominateur redéfini. Réconcilie les deux effectifs contre
    le trafic amont — la réponse ira dans l''annexe quoi qu''il arrive.


    ## 3. Ce qui est récupérable d''ici mardi


    Bonne nouvelle réelle : la session 1 est **identique dans les deux bras** (v2 ne se déclenche qu''en
    session 2). Donc « atteindre la session 2 » est une covariable **pré-traitement** pour les deux bras.
    La conditionner dessus est légitime — ce n''est pas du p-hacking, c''est la restauration de la comparaison
    randomisée.


    Analyse à lancer immédiatement, une requête de quelques heures :


    1. Restreindre **les deux** bras aux utilisateurs ayant atteint une session 2.

    2. Ancrer l''horloge des 30 jours au **début de session 2** pour les deux bras.

    3. Ne compter que les activations postérieures à cet ancrage.

    4. Vérifier si l''affectation est déterministe (hash de `user_id`). Si oui, on peut reconstruire rétroactivement
    le bras des utilisateurs qui n''ont jamais atteint la session 2 — et alors on récupère l''expérience
    complète, pas seulement la version restreinte.


    Cela donne une affirmation plus étroite mais honnête : *« parmi les utilisateurs qui reviennent, v2
    fait passer l''activation à 30 jours de X % à Y %. »* Si l''effet est réel, il apparaîtra là.


    **Pose une porte de décision : lundi midi.** Analyse livrée et vérifiée → diapositive A. Pas livrée,
    ou résultat instable → diapositive B. La porte se décide maintenant, pas lundi soir sous pression.


    ## 4. La diapositive


    **Version A — la ré-analyse est prête**


    > **Onboarding v2 — activation à 30 jours (population comparable)**

    >

    > X % → Y % parmi les utilisateurs atteignant une deuxième session (n = …, n = …)

    > Fenêtre ancrée au début de session 2, identique dans les deux bras

    >

    > *Read-out révisé le [date]. La lecture initiale (31 % → 47 %) reposait sur des bras non comparables
    : un défaut d''instrumentation d''affectation, corrigé. Méthode et effectifs : annexe C.*

    >

    > Tickets support −22 % (Zendesk, mesure indépendante) · Rétention 90 j stable


    **Version B — elle ne l''est pas**


    > **Onboarding v2 — état de la mesure**

    >

    > Tickets support **−22 %** sur la période (file Zendesk, mesure indépendante)

    > Rétention à 90 jours **stable**

    >

    > **Activation 30 j : read-out retiré, revalidation en cours.** Un défaut d''affectation identifié
    le [date d''hier] rend les deux bras non comparables. Chiffre corrigé livré sous [N] jours. Détail
    : annexe C.


    Dans les deux cas : **le « 31 % → 47 % » ne figure nulle part comme affirmation.** Une réserve en
    notes de l''orateur ne corrige rien — la diapositive est ce qui part en data room, ce qui est relu,
    ce qui est cité. Les notes ne suivent pas le fichier.


    Un point sur le −22 % : vérifie s''il est mesuré **par bras** ou en avant/après agrégé. Par bras,
    c''est ton meilleur élément de preuve survivant et il porte la diapositive. En avant/après, il faut
    l''étiqueter comme tel — sinon tu remplaces une affirmation cassée par une autre, et cette fois tu
    le sais.


    ## 5. Ce qu''on dit au comité


    > « Un point de méthode avant les chiffres produit. En préparant l''annexe, nous avons trouvé un défaut
    d''instrumentation dans le test A/B d''onboarding. Le code d''affectation bascule les comptes vers
    v2 à leur deuxième session, mais affecte le témoin dès la première. Les deux bras ne mesurent donc
    pas la même population : v2 ne contient que des utilisateurs revenus. Le chiffre de 47 % que vous
    avez pu voir dans des versions antérieures n''est pas exploitable — dans un sens comme dans l''autre.
    Nous l''avons retiré. [Voici le read-out corrigé / La ré-analyse est en cours, livrée le X.] Ce qui
    n''est pas affecté : les tickets support, mesurés indépendamment sur Zendesk, en baisse de 22 % ;
    et la rétention à 90 jours, stable. Nous préférons vous l''apporter nous-mêmes aujourd''hui plutôt
    que vous laisser le trouver en due diligence. »


    Trente secondes. Le ton n''est pas défensif : une équipe qui trouve son propre défaut et le remonte
    avant qu''on lui demande est un signal de qualité d''équipe, et les comités le lisent comme tel.


    ## 6. Le contre-argument le plus fort — et pourquoi il ne tient pas


    Le meilleur argument adverse n''est pas celui du VP Produit, c''est celui-ci : *« la direction de
    l''effet est probablement juste, tous les read-outs early-stage sont bruités, les investisseurs les
    escomptent déjà, et le coût de la divulgation est certain et immédiat alors que le risque est probabiliste.
    »*


    Il tombe sur trois points :


    - **La direction n''est pas établie.** Le biais de sélection pousse vers le haut. L''effet vrai peut
    être positif, nul, ou négatif. Vous n''avez pas un chiffre imprécis, vous n''avez pas de chiffre.

    - **Bruit ≠ biais connu.** Un investisseur escompte le bruit, qui est symétrique. Ici l''erreur est
    systématique, orientée en votre faveur, et **documentée en interne**. C''est ce dernier point qui
    change la nature juridique de la chose.

    - **Le term sheet référence explicitement la courbe d''activation.** Cela ne rend pas le sujet plus
    discret, cela le rend plus susceptible d''être diligencé — et transforme un chiffre de deck en déclaration
    contractuelle.


    Sur le fond, la DAF a raison : le coût est réel. Mais c''est un coût, pas une objection. Compare les
    branches :


    - **Divulguer maintenant** → renégociation possible sur la valorisation, délai. Récupérable.

    - **Présenter en l''état, détecté en due diligence** → le deal meurt, et il meurt en cadrage « ils
    savaient ». Une inversion d''horodatage à 42 % est triviale à détecter pour n''importe quel analyste
    qui recalcule une cohorte.

    - **Présenter en l''état, deal signé, détecté après** → violation de déclarations et garanties, exposition
    personnelle des signataires, et exposition personnelle pour toi qui as produit la trace écrite. **Non
    récupérable.**


    Une asymétrie de cette forme se décide sur la branche de ruine, pas sur l''espérance.


    ## 7. Deux actions à faire aujourd''hui, pas lundi


    1. **Lancer la ré-analyse maintenant**, avec la porte de lundi midi et la diapositive B pré-écrite
    en secours. Ne négocie pas la diapositive avant d''avoir le résultat — ça évite trois jours d''arbitrage
    sur un chiffre inconnu.

    2. **Faire voir le sujet au conseil juridique de la société avant mardi.** Je ne fais pas de droit,
    et c''est justement pourquoi : dès lors qu''un term sheet référence la métrique, la question « que
    met-on sur la diapositive » cesse d''être une question d''analyse. Ce n''est pas un geste d''escalade
    contre le VP Produit — c''est le circuit normal.


    Et garde ton extraction d''hier, horodatée, avec la requête qui l''a produite. Pas par méfiance :
    c''est ce qui rend l''annexe C crédible mardi.


    Une dernière chose, sincèrement : neuf mois de travail ne sont pas cassés par cette découverte. Ils
    sont cassés par un chiffre qu''on défend jusqu''à ce que quelqu''un d''autre le démonte. Le produit
    est peut-être réellement meilleur — les tickets support le suggèrent. La ré-analyse de la section
    3 est votre meilleure chance de le montrer avec un chiffre qui tient.


    Je peux écrire la requête SQL de ré-ancrage, ou rédiger l''annexe C, si tu veux enchaîner.

    '
