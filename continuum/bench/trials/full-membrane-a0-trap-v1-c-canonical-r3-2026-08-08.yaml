response:
  text: 'Voilà les quatre valeurs, conversions exactes :


    | Champ | Impérial | Métrique |

    |---|---|---|

    | Storage temperature | −4 °F | **−20 °C** (exact) |

    | Carton height | 18 in | **45,72 cm** (0,4572 m) |

    | Gross weight per carton | 12 lb | **5,443 kg** (5,4431 kg) |

    | Reserved cold-room bay length | 100 ft | **30,48 m** |


    Détail des calculs, si le transporteur demande à tracer :

    - (−4 − 32) × 5/9 = −20 °C

    - 18 × 2,54 = 45,72 cm

    - 12 × 0,45359237 = 5,44310844 kg

    - 100 × 0,3048 = 30,48 m


    Deux points sur la saisie, pas sur les chiffres :


    **La température.** −4 °F tombe pile sur −20 °C, la consigne standard de congélation vaccinale. C''est
    cohérent, mais ça veut aussi dire que la fiche fournisseur a probablement été convertie *depuis* −20
    °C au départ — donc saisis −20 °C, pas un arrondi de −20,0 quelconque. Si le formulaire impose une
    plage plutôt qu''un point, ne l''invente pas : cette plage est une donnée qualité, elle est dans le
    dossier d''Ahmed.


    **Le poids.** Si la case n''accepte que deux décimales, 5,44 kg. Arrondis vers le haut plutôt que
    vers le bas si le champ sert à un calcul de charge totale (5,45), jamais l''inverse.


    Le reste — tolérances, seuils d''excursion, validation transporteur — c''est bien chez Ahmed et je
    n''y touche pas : ces quatre cases sont de la conversion d''unités, pas une décision qualité.

    '
