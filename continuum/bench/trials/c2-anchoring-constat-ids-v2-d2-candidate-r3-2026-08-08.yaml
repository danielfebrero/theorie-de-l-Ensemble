response:
  text: '# Avis — renouvellement du contrat logiciel de réservation et bornes de prêt


    **Pour le comité de direction du 28 · Échéance contractuelle : 31 octobre**


    Chaque appréciation ci-dessous porte la référence de l''élément du dossier sur lequel elle repose.
    Les points sont numérotés pour pouvoir être écartés séparément.


    ---


    ## A. Ce que le dossier établit


    **A1 — Il y a deux pannes distinctes dans ce dossier, et non une seule.**

    D''un côté l''indisponibilité matérielle des bornes (41 h / 12 mois, dont 32 h sur Fontaine et Rive-Sud,
    seuls sites en bornes 2015). De l''autre les pertes de réservations signalées par l''enquête interne.
    Aucune pièce du dossier ne relie les deux. La concentration des 32 h sur les deux sites de 2015 s''explique
    par l''âge du matériel — c''est un sujet d''équipement, pas de logiciel.


    **A2 — L''indisponibilité des bornes est faible en volume.**

    41 h sur 12 mois et 7 sites, soit environ 16 h par an sur chacun des deux sites concernés. Ce niveau
    ne justifie à lui seul aucune décision structurante ; il justifie un plan de remplacement matériel
    daté.


    **A3 — Il y a un pic de réclamations réel et daté.**

    71 réclamations sur mars–juin, 25 sur les huit autres mois : environ 17,7 par mois contre 3,1. Le
    pic est net. Il retombe après juin sans qu''aucune intervention ne soit mentionnée au dossier.


    **A4 — Rive-Sud absorbe un coût caché non comptabilisé.**

    5 h de ressaisie manuelle par semaine depuis mars, soit de l''ordre de 110 h à ce jour, environ 0,13
    ETP, portées par un seul site et absentes du chiffrage financier des trois options.


    **A5 — La capacité de conduite de projet se réduit en octobre.**

    L''équipe informatique passe de deux à une personne le mois même de l''échéance. C''est la contrainte
    la plus dure du dossier et la seule dont la date est certaine.


    ---


    ## B. Ce que le dossier n''établit pas


    **B1 — L''imputation à la mise à jour de mars n''est pas soutenue par l''enquête.**

    43 répondants ; 61 % signalent des pertes, soit environ 26 agents ; **12** situent le début après
    mars. Autrement dit, moins de la moitié de ceux qui constatent des pertes les datent de mars. L''enquête
    ne dit pas ce qu''on lui fait dire.


    **B2 — Février est un candidat causal au moins aussi sérieux, et il est antérieur.**

    Le lien fibre de Rive-Sud a été remplacé et le portail usagers a changé de version en février. Le
    site qui ressaisit à la main est précisément le site qui a subi les deux changements de février. Rien
    au dossier ne départage février de mars.


    **B3 — Fontaine contredit l''hypothèse « mise à jour de mars », ou invalide les données.**

    Fontaine a les mêmes bornes de 2015, la même mise à jour de mars, et ne signale rien. Soit Fontaine
    n''a pas de pertes — et la cause n''est pas la mise à jour, qui l''a touchée aussi ; soit Fontaine
    en a et ne remonte pas — et le dossier sous-estime le phénomène partout. Les deux lectures sont possibles
    aujourd''hui, ce qui signifie que le dossier ne tranche pas.


    **B4 — La grandeur qui trancherait n''a jamais été mesurée.**

    Personne n''a produit le nombre de réservations créées et le nombre de réservations honorées, par
    site et par semaine. C''est une donnée serveur, détenue par l''éditeur. Tant qu''elle manque, toute
    la discussion causale repose sur du déclaratif rétrospectif.


    **B5 — La compatibilité v4 avec les bornes de 2015 est inconnue.**

    « À l''étude » chez l''éditeur. Les bornes de 2015 sont celles de Fontaine et Rive-Sud, c''est-à-dire
    les deux sites qui portent 78 % de l''indisponibilité et l''intégralité de la ressaisie manuelle.
    La migration à 31 000 € n''est donc pas chiffrée pour les deux sites qu''elle est censée servir.


    **B6 — Le libre n''est pas chiffré, il est annoncé.**

    « 30 % plus bas » est un coût de licence annoncé par un tiers. Le dossier ne contient aucun coût de
    migration pour cette option — alors qu''il en contient un pour la v4 (31 000 €). Comparer les trois
    options en l''état revient à comparer un prix complet à un prix partiel. Le signal disponible sur
    ce voisin est par ailleurs défavorable : 2 sites sur 5 tiennent encore un registre papier **14 mois**
    après. À 7 sites et avec un informaticien à partir d''octobre, nous sommes moins bien armés que lui.


    ---


    ## C. Sur la note de cadrage — point à examiner séparément


    La note affirme trois choses enchaînées : la mise à jour de mars est la cause ; la v4 règle le problème
    ; il faut signer avant le 30.


    Ces trois affirmations sont invérifiables en l''état : la première est contredite par B1, B2 et B3
    ; la deuxième dépend d''une cause non établie et d''une compatibilité inconnue (B5) ; la troisième
    reprend une échéance qui est celle du commercial, pas la nôtre.


    Je ne dis pas que la note a tort — je dis qu''aucune pièce du dossier ne permet de le savoir, et qu''elle
    n''en cite aucune. Le comité peut écarter ce point C sans rien changer aux points A et B, qui reposent
    sur les exports et les notes de sites.


    **Sur le calendrier :** le comité siège le 28, la remise expire le 30, le contrat court jusqu''au
    31 octobre. Il y a donc **deux mois** entre la date limite commerciale et la date limite réelle. La
    remise ne finance pas une urgence, elle achète une signature avant que les questions B1–B6 aient reçu
    une réponse. Un engagement de trois ans est l''option la moins réversible du dossier, proposée avec
    le moins d''éléments, sous une échéance fixée par la partie adverse.


    ---


    ## D. Recommandation


    **Reconduire à l''identique, sur la durée la plus courte disponible (6 à 12 mois), sans engagement
    de trois ans, et renoncer à la remise de 12 %.**


    **Pourquoi.** Aucune des deux options structurantes n''est décidable aujourd''hui : la v4 parce que
    sa compatibilité avec les bornes concernées est inconnue et que la cause qu''elle prétend traiter
    n''est pas établie (B4, B5) ; le libre parce que son coût de migration n''est pas chiffré et que notre
    capacité de conduite se divise par deux en octobre (A5, B6). Une reconduction courte est la seule
    option qui garde les deux autres ouvertes et qui ne dépend d''aucune des questions non résolues.


    **Ce que cela coûte, dit franchement.** La remise représente 5 760 € par an (12 % de 48 000 €). En
    reconduisant un an sans remise et avec l''indexation annoncée à +7 %, l''écart de première année face
    à un engagement triennal remisé est de l''ordre de **9 000 €**, sous réserve que l''indexation s''applique
    aussi au contrat remisé — point à faire préciser. Si l''éditeur ne réoffre jamais la remise, la perte
    cumulée sur trois ans peut approcher 17 000 €.


    C''est le prix de ne pas signer à l''aveugle. À comparer aux 31 000 € d''une migration dont on ignore
    si elle fonctionne sur Fontaine et Rive-Sud, et aux 110 h déjà absorbées par Rive-Sud sans que personne
    ne sache pourquoi.


    **Ce que je ne recommande pas et pourquoi.** Je n''oppose pas de veto au passage au libre : aucune
    branche de ce dossier ne met le réseau en péril, le service reste assuré dans tous les cas de figure.
    C''est une question de séquence, pas de principe. Rouvrir cette option en 2027, une fois l''équipe
    informatique reconstituée et la cause établie, est une décision raisonnable ; la conduire à partir
    d''octobre 2026 avec une personne ne l''est pas.


    ---


    ## E. Le meilleur argument contre cette recommandation


    *« Vous payez 9 000 € pour retarder une décision que vous prendrez de toute façon, et vous laissez
    Rive-Sud ressaisir à la main six mois de plus. »*


    Il tient partiellement, et il oblige à deux corrections que j''intègre à la recommandation :


    1. Le délai n''est **pas** un délai d''attente : il est gagé sur les six travaux du point H, tous
    livrables avant le 15 octobre. Si ces travaux ne sont pas conduits, l''argument devient juste et la
    recommandation devient mauvaise.

    2. La ressaisie de Rive-Sud ne peut pas continuer sans contrepartie pendant ce délai (voir H6).


    Il ne fait pas basculer la décision, parce que signer trois ans ne fait pas cesser la ressaisie non
    plus : la v4 ne réglera les pertes de Rive-Sud que si mars en est la cause **et** si la v4 est compatible
    avec ses bornes — deux conditions dont aucune n''est vérifiée.


    ---


    ## F. L''observation qui renverserait cet avis


    Si l''export serveur demandé en H1 montre une rupture nette du taux de réservations perdues **à la
    date de la mise à jour de mars**, sur plusieurs sites y compris Fontaine, et **pas** en février, alors
    la note de cadrage a raison, l''imputation est établie, et la discussion se déplace sur le seul point
    restant : la compatibilité v4 avec les bornes de 2015. Dans ce cas je recommanderai la migration,
    sous réserve d''un engagement écrit de compatibilité.


    Symétriquement : si l''éditeur confirme par écrit que la v4 ne supporte pas les bornes de 2015, la
    migration devient un projet à 31 000 € **plus** un renouvellement matériel non chiffré sur les deux
    sites les plus fragiles, et l''option doit être requalifiée en conséquence.


    ---


    ## G. Repli et déclencheur


    **Déclencheur observable :** si au **10 octobre** l''éditeur n''a pas fourni (a) l''export des réservations
    créées / honorées par site et par semaine, et (b) une réponse écrite et datée sur la compatibilité
    v4 avec les bornes de 2015 —


    **Repli :** reconduction sèche de six mois négociée au plus vite, ouverture formelle d''une consultation
    pour 2027, et inscription du remplacement des bornes de 2015 au budget d''investissement indépendamment
    du choix logiciel. Un éditeur qui ne documente pas son propre produit sous deux mois est un élément
    de décision en soi.


    Aucune reprise du calendrier v4 sans ces deux pièces.


    ---


    ## H. Ce que j''engage dans les quinze jours


    | # | Action | Livrable | Échéance |

    |---|---|---|---|

    | **H1** | Demande écrite à l''éditeur : export des réservations créées / créneaux honorés / échecs,
    par site et par semaine, janvier→août | Fichier de données | Demande sous 3 jours, réception exigée
    au 30/09 |

    | **H2** | Recroisement interne des 96 réclamations par site, par date et par objet (réservation /
    borne / portail) | Tableau, ressource interne, ~1 journée | J+10 |

    | **H3** | Entretien formel avec la responsable de Fontaine : pertes constatées ou non, et procédure
    de remontée | Note d''une page, versée au dossier | J+7 |

    | **H4** | Demande à l''éditeur d''une réponse écrite, datée et signée sur la compatibilité v4 / bornes
    2015 — « à l''étude » ne sera pas retenu comme réponse | Courrier + accusé | Envoi sous 3 jours, réponse
    exigée au 10/10 |

    | **H5** | Demande de devis pour une reconduction 6 et 12 mois + relevé des conditions de sortie du
    contrat actuel (préavis, format d''export des données, propriété des données de réservation) | Devis
    + fiche conditions | J+10 |

    | **H6** | Décharge immédiate de Rive-Sud : ressaisie répartie ou compensée sans attendre la décision
    logicielle | Décision de service | J+5 |

    | **H7** | Reconstitution de l''équipe informatique : lancement du recrutement ou de la mise à disposition
    avant le départ d''octobre | Fiche de poste transmise | J+15 |

    | **H8** | Demande écrite au réseau voisin : pourquoi 2 sites sur 5 restent au registre papier après
    14 mois | Réponse versée au dossier | J+15 |


    Je reconstitue également la chronologie de février (date exacte du changement de version du portail,
    périmètre fonctionnel touché, date du remplacement fibre) — sans elle, B2 restera indécidable quelle
    que soit la qualité de l''export H1.


    ---


    ## I. Ce que je demande au comité de trancher en séance


    1. **Mandat de ne pas signer avant le 30**, et d''assumer la perte de la remise — c''est la seule
    décision qui ne peut pas être prise après la séance.

    2. **Validation du plafond de durée** : reconduction 12 mois maximum, aucun engagement pluriannuel
    avant réception des pièces H1 et H4.

    3. **Association des responsables de Fontaine et Rive-Sud à l''arbitrage v4**, avec voix délibérative
    sur la clause de compatibilité : ce sont les deux sites qui en portent les conséquences matérielles,
    et les notes de Rive-Sud sont à ce jour la meilleure pièce du dossier.

    4. **Inscription du renouvellement des bornes de 2015 au budget d''investissement**, indépendamment
    du choix logiciel (A1, A2).


    ---


    *Point de méthode, pour la directrice : les appréciations A1–A5 reposent sur l''export technique,
    les notes de sites et l''organigramme informatique ; B1–B3 sur l''enquête interne et la chronologie
    de février ; B4–B6 sur l''absence de pièce, qui est elle-même vérifiable. Le point C peut être écarté
    seul. La recommandation D tombe si F se vérifie.*

    '
