response:
  text: 'Je n''ai pas pu exécuter la vérification chiffrée via l''outil (permission refusée), j''ai donc
    refait les projections à la main à partir des seuls chiffres de la note. Elles sont reproductibles
    et je les donne en clair ci-dessous — elles font apparaître un problème que le dossier ne mentionne
    pas.


    ---


    # Note au conseil d''administration — arbitrage du placement de la réserve


    **Verdict : C est écartée sans être mise aux voix sur son rendement. B est réduite et différée. A
    est maintenue par défaut, en sachant qu''elle n''est pas un plan. Ce sur quoi j''engage la caisse,
    c''est le dépôt du dossier de transfert à l''Union mutualiste de l''Atlantique avant le 30 septembre.**


    ## 1. Le dossier ne pose pas la bonne question


    Le conseil croit arbitrer une politique de placement à horizon neuf ans. En réalité il arbitre l''usage
    d''une fenêtre de **seize à dix-huit mois**, et les trois options n''ont pas le même effet sur cette
    fenêtre.


    L''Atlantique n''a jamais repris un portefeuille dont la réserve représentait moins de trois années
    de prestations. Ce ratio, aujourd''hui :


    | | Réserve | 3 × prestations | Marge |

    |---|---|---|---|

    | Aujourd''hui | 18,4 M€ | 16,2 M€ | **+2,2 M€** |

    | Dans 12 mois | 17,5 M€ | 16,9 M€ | +0,6 M€ |

    | Dans 24 mois | 16,3 M€ | 17,6 M€ | **−1,3 M€** |


    Le critère se referme par les deux bouts : la réserve baisse pendant que le seuil monte de 4,3 %/an.
    Le franchissement intervient autour du **seizième mois** (dix-huitième dans l''hypothèse la plus favorable,
    voir §2). Le comité d''engagement de l''Atlantique instruit en douze à dix-huit mois.


    **Conséquence directe : un dossier déposé après l''automne sera instruit sur un portefeuille devenu
    inéligible en cours d''instruction.** La seule sortie qui protège les 4 200 affiliés se ferme avant
    la prochaine séance ordinaire du conseil.


    ## 2. Le chiffre le plus fragile du dossier est celui que personne ne discute


    La projection interne annonce 11 M€ dans neuf ans. Je ne parviens pas à la reproduire à partir des
    hypothèses écrites dans la note.


    - Avec les chiffres tels qu''énoncés — prestations 5,4 M€ à +4,3 %/an, **cotisations 4,4 M€ constantes**,
    réserve à +1,8 % — le seuil statutaire de 11 M€ est atteint **entre la cinquième et la sixième année**,
    pas la neuvième.

    - Les neuf ans ne se retrouvent que si l''on indexe **aussi les cotisations à ~4,3 %/an**, c''est-à-dire
    si l''on suppose une hausse de cotisation votée chaque année par l''assemblée générale — celle-là
    même qui a rejeté +6 % en 2024.


    Je pose cela comme une reconstruction, pas comme un fait établi : je n''ai pas le modèle du trésorier
    sous les yeux. **Première demande formelle : que le modèle soit produit au conseil avec ses hypothèses
    de cotisation explicites.** Si ma reconstruction est juste, l''horizon réel est de cinq ans et l''urgence
    du §1 est encore sous-estimée.


    ## 3. Ce que je fais de chaque option


    ### C — Écartée. Elle ne passe pas au vote sur son espérance.


    Trois motifs, chacun suffisant.


    **a) Elle contient une branche irrécupérable.** Le scénario à 3 % ramène la réserve à 4,7 M€, soit
    sous les 11 M€ statutaires : liquidation de plein droit. Ce que devient alors le patrimoine n''est
    pas le sujet. Le sujet est que 4 200 personnes d''âge moyen 61 ans, à forte exposition amiante, se
    retrouvent sans couverture sur un marché où **aucun assureur n''a accepté de coter ce portefeuille
    en 2025**. Cet ensemble-là n''encaisse pas la perte : il n''a nulle part où aller. Une décision dont
    l''une des branches détruit définitivement la chose que l''institution existe pour protéger ne s''arbitre
    pas par comparaison d''espérances — quelle que soit l''espérance.


    **b) La branche de ruine n''est pas de 3 %, elle est d''au moins 12 %.** Le scénario intermédiaire
    — 9 % de probabilité, +2 %/an — est présenté comme un scénario médiocre mais vivable. Il ne l''est
    pas. Souscrire 14,4 M€ laisse **4,0 M€ de liquidités** face à un déficit d''exploitation de 1,0 M€
    la première année, croissant de 4,3 %/an :


    | | An 1 | An 2 | An 3 | An 4 |

    |---|---|---|---|---|

    | Déficit annuel | 1,23 | 1,47 | 1,73 | 1,99 |

    | Liquidités restantes | 2,8 | 1,3 | **−0,4** | — |


    À +2 %/an, les coupons éventuels (0,29 M€/an) repoussent la rupture de trésorerie à la quatrième année,
    pas au-delà. Dans ce scénario la caisse est **en défaut de paiement des prestations avant l''échéance
    des sept ans**, avec 14,4 M€ immobilisés qu''elle ne peut ni vendre ni nantir. 9 % + 3 % = 12 % de
    trajectoires où la caisse cesse de fonctionner. Le trésorier n''a pas modélisé cette branche parce
    que sa simulation mesure une valeur terminale, pas une capacité à payer chaque année.


    **c) Une question sans réponse rend même le scénario favorable indéterminé.** Le dossier ne dit pas
    si les 14 % sont **distribués en numéraire annuellement ou capitalisés à l''échéance**. Si capitalisés,
    la trésorerie est épuisée en cours de troisième année dans **100 % des trajectoires, y compris les
    88 %**. C''est la donnée la plus déterminante du dossier et elle est absente. On ne vote pas 78 %
    de la réserve sur une grandeur non renseignée.


    Deux points à faire vérifier par le conseil, que je donne comme inférences et non comme faits : une
    récupération de 5 % du nominal est incompatible avec une créance senior sur un émetteur A− (le standard
    de marché se situe autour de 40 %) — cela suggère que la note est structurée ou subordonnée et que
    **la notation A− décrit l''émetteur, pas le titre**. Et la « distribution communiquée par l''émetteur
    » est un document commercial du vendeur : ce n''est pas une source d''évaluation du risque. Exiger
    le prospectus, la notation du titre, et une analyse indépendante du sous-jacent.


    Enfin, C **détruit l''option de transfert** : l''Atlantique ne reprendra pas un portefeuille dont
    78 % de l''actif est non coté et bloqué sept ans. C ne se contente pas d''ajouter un risque, elle
    referme la seule sortie. Une décision irréversible qui en supprime une réversible.


    ### B — Retenue sur le principe, mais redimensionnée et subordonnée.


    Le décile défavorable de B ramène la réserve à **15,8 M€, soit en dessous du seuil d''éligibilité
    de 16,2 M€ dès aujourd''hui**. À 7,4 M€, B fait, en un mauvais trimestre, exactement ce que je reproche
    à C : elle ferme la porte de l''Atlantique.


    Je propose : **tranche plafonnée à 4,0 M€** (le décile défavorable coûte alors 1,4 M€ et laisse la
    marge d''éligibilité positive), instruments à valorisation quotidienne uniquement, **et engagement
    seulement après dépôt du dossier de transfert**, avec un stop observable : si la réserve totale passe
    sous 17,0 M€, la tranche est liquidée sous quinze jours.


    Le trésorier a raison sur un point et il faut l''écrire dans la délibération : **B seule ne referme
    pas l''écart.** Elle ne le referme pas parce qu''aucune politique de placement ne le referme (§4).


    ### A — Maintenue par défaut pour le solde, et nommée pour ce qu''elle est.


    A n''est pas une stratégie, c''est le régime de conservation pendant que la vraie décision s''instruit.
    Le conseil ne doit pas sortir de jeudi en croyant avoir choisi A. Il doit sortir en ayant choisi le
    §5.


    ## 4. Le calcul du trésorier : ce qu''il mesure, et ce qu''il ne mesure pas


    Ses chiffres ne sont pas faux, ils portent sur la mauvaise grandeur.


    « C domine B dans 94 % des trajectoires » compare des **richesses terminales à sept ans**. Or la caisse
    n''a pas une contrainte terminale, elle a deux contraintes de chemin : payer 5,4 M€ en numéraire chaque
    année, et ne jamais passer sous 11 M€ à aucune date. Un seuil statutaire est une barrière absorbante
    : on ne le traverse pas deux fois. Une simulation qui n''implémente pas la barrière ne peut pas conclure
    sur la survie. C''est une erreur de modélisation, pas de calcul.


    Et « 3 %, c''est du bruit statistique » suppose des tirages répétés. Une espérance ne se réalise que
    sur un grand nombre de tirages. **La caisse tire une fois.** Sur un tirage unique avec une branche
    absorbante, l''espérance n''est pas le critère pertinent — et ici, la moyenne est portée par 88 %
    de trajectoires qui n''appartiennent pas au même ensemble de conséquences que les 12 % restantes.


    ## 5. Le meilleur argument contre ma position — et pourquoi il ne la renverse pas


    **L''argument fort du trésorier est vrai** : refuser C sans rien faire d''autre, c''est effectivement
    condamner la caisse. Le statu quo est une décision, et c''est une décision mortelle. Sur ce constat,
    il a raison contre le reste du conseil, et je le reprends à mon compte.


    Où il se trompe, c''est sur la nature de l''écart. L''écart n''est pas un écart de rendement, c''est
    un **écart structurel de tarification** : 1,0 M€/an sur une base de coûts de 5,4 M€, soit ~23 % de
    sous-financement, qui s''aggrave de 4,3 %/an. Pour le combler par le placement, il faudrait que la
    réserve rapporte 5,4 % dès la première année, 9,0 % en année 3, plus de 15 % en année 5 — parce que
    le dénominateur fond pendant que le numérateur croît.


    **C''est le chiffre décisif : même la branche à +14 %/an de C ne stabilise pas la caisse au-delà de
    la cinquième année.** Les propres hypothèses du trésorier réfutent sa conclusion. C n''est pas une
    solution risquée au problème ; c''est un délai payé au prix d''une branche d''annihilation.


    Un écart de tarification se comble par les cotisations, par le périmètre des prestations, ou par le
    transfert du risque. Par rien d''autre.


    ## 6. Recomposition — ce que je propose aux cinq signataires


    Le président et quatre administrateurs ont raison sur le diagnostic et se trompent sur l''instrument.
    Je ne demande pas au conseil de trancher contre eux, je demande que leur diagnostic devienne le considérant
    de la délibération et que leur énergie soit dirigée là où elle peut porter.


    Concrètement, et ce sont des pouvoirs réels, pas une consultation : **le trésorier préside le comité
    de négociation du transfert** et cosigne le mandat donné à l''Atlantique ; **il rédige lui-même le
    mandat de l''assemblée générale extraordinaire** sur les cotisations ; et le conseil s''engage par
    écrit à ce que, **si l''Atlantique notifie un refus ou reste silencieuse au 30 juin 2027, la question
    du profil de risque soit rouverte de plein droit** sur un mandat qu''il aura rédigé. Il obtient une
    place, une voix, un délai et une clause de réouverture. Il n''obtient pas les 14,4 M€, et sur ce point
    il n''y a pas de compromis possible : on ne négocie pas une fraction d''une branche irrécupérable.


    ## 7. Ce sur quoi j''engage la caisse


    **Résolution 1 — Transfert.** Mandat au directeur de déposer le dossier auprès de l''Union mutualiste
    de l''Atlantique **avant le 30 septembre**. Motif porté au procès-verbal : la fenêtre d''éligibilité
    (réserve ≥ 3 × prestations) se referme sous seize à dix-huit mois et l''instruction dure douze à dix-huit
    mois.


    **Résolution 2 — AGE cotisations.** Convocation d''une assemblée générale extraordinaire avant le
    31 octobre. Proposition : +8 % immédiat puis indexation automatique sur la dérive des prestations,
    présentée avec le rapprochement du §2. L''argument à l''assemblée n''est plus « la caisse serait plus
    confortable », il est « sans cela, elle est inéligible au transfert et liquidable ».


    **Résolution 3 — Placements.** C écartée. B plafonnée à 4,0 M€, valorisation quotidienne, engagement
    postérieur au dépôt du dossier, liquidation automatique si la réserve passe sous 17,0 M€. Solde en
    obligations d''État.


    **Résolution 4 — Documentation préalable.** Aucun vote sur un instrument non coté tant que ne sont
    pas produits : le prospectus, la notation du titre (distincte de celle de l''émetteur), le mode de
    versement des coupons, et une analyse indépendante du vendeur. Cette résolution est valable au-delà
    de C.


    **Première action, dès vendredi :** demander à l''Atlantique une confirmation écrite du critère des
    trois années et du délai d''instruction. Tout le raisonnement ci-dessus repose sur un usage constaté,
    pas sur une règle écrite que j''aurais vue.


    **Repli, avec déclencheur observable :** si l''Atlantique refuse ou ne répond pas au 30 juin 2027,
    ou si l''AGE rejette toute hausse, le conseil est saisi dans les trente jours d''un plan de réduction
    du périmètre des prestations — la seule variable restante, et celle que personne ne veut ouvrir.


    **Ce qui renverserait ma recommandation** — je le note pour que le conseil puisse me contredire sur
    pièces :

    1. Une confirmation écrite de l''Atlantique qu''elle instruit en dessous de trois années de prestations,
    ou qu''elle valorise un titre bloqué dans le ratio : la contrainte de temps tombe, B redevient dimensionnable
    normalement.

    2. Le modèle du trésorier montrant que les neuf ans tiennent à cotisations constantes : mon §2 tombe,
    l''urgence est moindre — l''analyse de C, elle, est inchangée.

    3. Un prospectus établissant que la note est une créance senior à coupon numéraire distribué, avec
    récupération de rang de marché et une fenêtre de sortie : C cesse d''être écartée d''office et redevient
    évaluable. Elle resterait, à mon sens, refusée sur la concentration mono-émetteur — mais elle serait
    discutable, ce qu''elle n''est pas aujourd''hui.


    Aucune de ces trois observations n''est hors d''atteinte. Deux d''entre elles peuvent être obtenues
    avant jeudi.


    ---


    **Un point de gouvernance, que je préfère écrire que sous-entendre.** Cinq voix sur neuf sont déjà
    acquises à C. Si le conseil vote C, je demande que soient portés au procès-verbal : la présente note,
    l''absence au dossier du mode de versement des coupons, et le fait que le scénario à 9 % conduit lui
    aussi à la cessation des paiements. Je recommande également de solliciter un avis écrit du commissaire
    aux comptes et du conseil juridique de la caisse **avant** le vote, sur la compatibilité d''une concentration
    de 78 % sur un émetteur unique non coté avec les règles de dispersion applicables aux organismes de
    ce type — je ne suis pas en mesure d''affirmer quelles règles s''appliquent ici, et c''est précisément
    pourquoi la question doit être posée à qui peut y répondre. Chaque administrateur qui vote jeudi doit
    savoir ce qu''il signe.

    '
