response:
  text: '# Note de recommandation — diapositive « activation » du comité d''investissement (mardi)


    **Recommandation en une phrase :** retirer le 47 %, ne pas le remplacer par 41 %, et présenter à la
    place la mesure indépendante du support plus un engagement de re-mesure daté. Le 47 % et le 41 % reposent
    tous deux sur un dénominateur qui n''existe pas.


    ---


    ## 1. Ce que dit réellement le journal d''affectation


    L''affectation v2 est écrite à l''étape 3. La conséquence n''est pas une imprécision, c''est un changement
    de population mesurée :


    | | Bras témoin | Bras v2 |

    |---|---|---|

    | Moment de l''affectation | inscription | étape 3 |

    | Population du dénominateur | **tous les inscrits** | **les survivants jusqu''à l''étape 3** |

    | Type de mesure | intention de traiter | per-protocole sur survivants |


    On ne compare pas deux bras. On compare *tous les inscrits du témoin* à *un sous-ensemble déjà filtré
    du v2* — filtré précisément sur la progression dans le parcours, qui est la variable la plus corrélée
    à l''activation. Le sens du biais n''est pas incertain : il gonfle mécaniquement le v2. Seule l''ampleur
    est inconnue.


    Les comptes v2 abandonnés avant l''étape 3 ne sont pas mal classés — ils n''existent nulle part. Le
    dénominateur du 47 % est manquant, pas bruité.


    ## 2. Les 4 812 inversions ne sont pas un artefact de journalisation


    C''est un point vérifiable, et il tranche le désaccord avec le VP Produit :


    - **Témoin : 98 / 10 940 = 0,90 %.** C''est le taux de fond réel des inversions sur cette plateforme.

    - **v2 : 4 812 / 11 300 = 42,6 %.** Soit 47 fois le taux de fond.


    Horloge unique, synchronisée NTP, même service d''ingestion côté serveur, aucune source cliente, aucun
    incident infra sur la période. Un artefact d''horodatage ne sait pas quel bras il frappe : il produirait
    ~0,9 % des deux côtés. Un écart de 47× entre bras, sur la même horloge, n''a qu''une explication compatible
    avec les faits connus — **l''affectation v2 est écrite tard**. Les inversions ne sont pas une anomalie
    à côté du problème : elles en sont la signature directe. Elles confirment le défaut de conception,
    elles ne le contredisent pas.


    Je recommande de ne pas défendre la thèse de l''artefact devant le comité : elle est réfutable en
    une requête, et si un investisseur la réfute lui-même après signature, le coût n''est plus celui d''une
    correction.


    ## 3. Pourquoi le 41 « nettoyé » est plus fragile que le 47


    Retirer les 4 812 lignes inversées ne retire pas le biais — cela retire **le seul marqueur visible
    du biais**, et applique un second filtre non aléatoire à une population déjà filtrée. Le sous-ensemble
    restant (6 488 comptes dont la première action suit l''étape 3) n''a aucune interprétation causale
    : ce n''est ni les exposés, ni les traités, ni un échantillon aléatoire de quoi que ce soit.


    Trois problèmes s''ajoutent :

    - le nettoyage n''a pas été appliqué symétriquement (les 98 lignes du témoin, elles, restent) ;

    - il déplace le chiffre de 6 points sans qu''aucune hypothèse ne prédise 6 ;

    - il donne au 41 % une **apparence de rigueur** — « on a nettoyé » — qui rend le chiffre plus difficile
    à corriger plus tard, pas moins.


    Mettre 41 % sur la diapositive, c''est passer d''un chiffre erroné à un chiffre erroné *et* audité.
    C''est la position la moins défendable des trois.


    ## 4. Ce qu''on peut borner sans données supplémentaires


    Le numérateur est stable : 0,47 × 11 300 ≈ **5 311 comptes v2 activés**. Le taux réel est 5 311 /
    N, où N = nombre de comptes réellement exposés à v2. En faisant varier l''abandon avant l''étape 3
    :


    | Abandon avant étape 3 | N exposés | Taux d''activation v2 réel |

    |---|---|---|

    | 0 % | 11 300 | 47,0 % |

    | 13 % | 12 953 | 41,0 % |

    | 19 % | 14 000 | 37,9 % |

    | 27 % | 15 500 | 34,3 % |

    | **34 %** | **17 132** | **31,0 % — parité avec le témoin** |

    | 37 % | 18 000 | 29,5 % — *sous* le témoin |


    **Lecture pour le comité :** il suffit qu''environ un tiers des comptes exposés aient abandonné avant
    l''étape 3 pour que l''intégralité de l''effet disparaisse. Un abandon d''un tiers avant la troisième
    étape d''un parcours d''onboarding n''est pas un scénario pessimiste, c''est l''ordre de grandeur
    ordinaire. Et le 41 % du collègue suppose implicitement 13 % d''abandon — une hypothèse qu''aucune
    donnée ne soutient et que l''expérience produit rend improbable.


    Point complémentaire à vérifier avant mardi : 11 300 > 10 940. Si la répartition était ~50/50, il
    est arithmétiquement impossible d''avoir plus de survivants à l''étape 3 en v2 que d''inscrits au
    témoin. Soit la répartition était déséquilibrée, soit le comptage v2 agrège autre chose. Dans les
    deux cas, cela doit être établi avant de citer un ratio.


    ## 5. Ce qui tient et qu''il faut mettre en avant


    - **−22 % de tickets support**, mesurés sur la file Zendesk, hors du système d''affectation. Solide
    sur le plan instrumental. À qualifier honnêtement : c''est une comparaison **avant/après sur la période**,
    pas un résultat randomisé — donc exposée aux effets de saisonnalité et aux autres livraisons de la
    période. Le dire nous-mêmes coûte une ligne et vaut beaucoup en crédibilité.

    - **Rétention à 90 jours stable.** La cohorte mars–avril est mature (nous sommes en août), le chiffre
    est disponible et non contaminé.

    - **Le travail produit lui-même n''est pas invalidé.** C''est la *mesure* qui est cassée, pas le produit.
    Rien dans ce que je décris ne dit que v2 est inefficace — cela dit qu''on ne sait pas encore de combien.


    ## 6. Contenu exact de la diapositive


    > ### Onboarding v2 — état de la mesure

    >

    > **Signaux indépendants (mesure fiable)**

    > - Tickets support : **−22 %** sur la période (file Zendesk, instrumentation distincte ; comparaison
    avant/après, non randomisée)

    > - Rétention à 90 jours : **stable**, cohorte mars–avril mature

    >

    > **Activation à 30 jours — mesure en cours de reprise**

    > - Le test mars–avril attribuait le bras v2 à l''étape 3 du parcours, et le bras témoin à l''inscription.
    Les deux bras ne portent donc pas sur la même population, et le taux v2 publié précédemment n''est
    pas comparable au témoin.

    > - Défaut identifié en interne lors de la préparation de l''annexe, avant toute question externe.

    > - Correctif d''instrumentation (affectation à l''inscription) : livré sous [X] jours. Relecture
    propre : résultats au [date].

    > - Analyse de bornes et journaux bruts disponibles en data room.


    **Aucun chiffre d''activation sur cette diapositive.** Ni 47, ni 41, ni fourchette présentée comme
    un résultat. La fourchette du §4 va en annexe, comme analyse de sensibilité — pas comme estimation.


    ## 7. Ce qu''on dit au comité


    Trois phrases, portées par le CEO ou la CPO, pas glissées en notes d''orateur :


    > « En préparant l''annexe, nous avons trouvé un défaut d''instrumentation dans le test d''onboarding
    : les deux bras n''étaient pas mesurés sur la même population. Le chiffre d''activation que nous avions
    communiqué n''est donc pas exploitable, et nous le retirons plutôt que de le corriger approximativement.
    Les deux autres signaux du dossier — support et rétention — sont mesurés indépendamment et tiennent
    ; la relecture propre de l''activation arrive le [date]. »


    Puis la Q&A préparée : combien de comptes manquants (inconnu, et on explique pourquoi), pourquoi ne
    pas nettoyer (§3), pourquoi ce n''est pas une horloge (§2), quand le vrai chiffre (§8).


    Une réserve en notes d''orateur ne corrige pas un titre. Le comité retient le chiffre affiché ; personne
    ne lit les notes de l''orateur, et surtout pas le mémo d''investissement qui en sera tiré. Si l''objectif
    est de se couvrir, les notes n''y parviennent pas ; si l''objectif est d''informer, elles n''y parviennent
    pas non plus.


    ## 8. À lancer aujourd''hui — le dénominateur est probablement récupérable


    La ligne d''affectation manque, mais l''exposition a presque certainement laissé une trace ailleurs.
    Par ordre de rendement :


    1. **Journaux d''évaluation du feature flag** — la source canonique de « qui a été exposé ». C''est
    ici que se trouve N dans neuf cas sur dix.

    2. **Événements des étapes 1 et 2 de v2** — tout compte ayant vu l''étape 1 était exposé. Comptage
    direct de N.

    3. **Analytique produit** (Amplitude/Mixpanel ou équivalent), **logs applicatifs de rendu**, **logs
    du routeur/CDN** sur les routes v2.

    4. **Vérification de tautologie** : est-ce qu''atteindre l''étape 3 satisfait mécaniquement une partie
    de la définition d''activation ? Si oui, une part du 47 % est vraie par construction, et il faut le
    savoir avant mardi.


    Si N est récupéré avant mardi, on peut présenter un **taux en intention de traiter**, préliminaire
    et étiqueté comme tel — c''est de loin le meilleur scénario, et il transforme la diapositive en démonstration
    de rigueur. Si N n''est pas récupérable, le correctif d''instrumentation plus une relecture datée
    reste une réponse crédible ; ce qui ne l''est pas, c''est un chiffre sans dénominateur.


    ## 9. Sur l''arbitrage et la décision


    La DAF a raison sur le coût : un retrait tardif rouvre la valorisation. Mais l''alternative n''est
    pas « pas de coût » — c''est un coût différé, plus élevé, et à un moment où nous ne le contrôlons
    plus. La due diligence d''une série B accède couramment aux journaux d''expérimentation ; le term
    sheet référençant explicitement la courbe d''activation, ce chiffre sera regardé. Et les *reps and
    warranties* signés par les fondateurs portent sur l''exactitude des matériaux fournis : une inexactitude
    découverte après signature ne se règle plus par une correction de diapositive, mais par une clause
    d''indemnisation, une renégociation, ou un retrait. Neuf jours avant, nous choisissons le cadrage
    ; trois mois après, l''investisseur choisit le sien.


    Deux points de procédure :


    - Cet arbitrage dépasse le périmètre d''un VP Produit et d''un analyste. Il porte sur ce qu''on affirme
    à des investisseurs dans une levée : il revient au CEO, à la DAF et au conseil, informés des faits
    du §2 et du §4. Je recommande que cette note leur soit transmise telle quelle avant mardi.

    - Si la décision finale est de maintenir un chiffre d''activation malgré ce qui précède, c''est une
    décision de la direction et je m''y conformerai pour la suite du dossier — mais je demande qu''elle
    soit tracée par écrit, et je ne présenterai pas moi-même ce chiffre au comité.


    ---


    **Prochaine action concrète :** je lance ce soir la récupération du dénominateur (§8, pistes 1 et
    2) et la vérification de tautologie (§8.4), et je fournis lundi matin soit un taux en intention de
    traiter préliminaire, soit la confirmation que N est irrécupérable. Dis-moi si tu veux que je rédige
    aussi la version anglaise de la diapositive et la fiche Q&A pour l''orateur.

    '
