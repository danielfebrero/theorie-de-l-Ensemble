response:
  text: '# Position de la présidence — répartition de la ressource en période d''étiage


    *Note remise avant la séance de jeudi. Elle engage ma voix, pas celle de la commission.*


    ---


    ## 1. Un préalable qui conditionne tout le reste


    Le dossier contient deux valeurs de débit incompatibles : **410 L/s** donné comme débit entrant actuel,
    et **340 L/s** atteint quatre jours après l''orage du 9 août. L''un des deux est périmé ou faux. Ce
    n''est pas un détail de rédaction : entre 410 et 340, la part attribuable au maraîchage passe de 85
    à 15 L/s. Nous ne pouvons pas délibérer sur un chiffre que nous ne savons pas dater.


    S''y ajoute que ce chiffre, quel qu''il soit, vient d''**une seule station, étalonnée pour la dernière
    fois en 2023**. À 400 L/s, une dérive de 10 % représente 40 L/s — le quart du déficit que nous prétendons
    arbitrer. Tout notre dispositif repose sur un capteur unique dont personne ici ne peut affirmer l''exactitude.


    **Je propose donc que la délibération ne porte pas sur un nombre, mais sur une règle appliquée au
    débit mesuré.** C''est la seule forme qui survit à l''incertitude actuelle.


    ---


    ## 2. Le dispositif proposé


    **Volume global par usage**, et non quotas individuels — pour une raison que je détaille au §4 : sans
    compteurs, un quota individuel n''est ni vérifiable ni défendable devant un tribunal.


    Priorité d''affectation, dans l''ordre, sur le débit entrant Q (moyenne glissante 10 jours) :


    1. **Débit réservé aval : 180 L/s, ferme.** Non négociable, et pas par choix de ma part : c''est un
    arrêté préfectoral. La commission n''a pas le pouvoir de l''abaisser. Le rapport du 12 juin ajoute
    la raison de fond — en dessous, la perte est qualifiée de non reconstituable à l''échelle d''une décennie.
    C''est la seule perte du dossier qu''aucun fonds ne rachète.

    2. **Eau potable : min(145 L/s ; Q − 180).** Soit 5 L/s de moins que le prélèvement actuel, gage d''un
    effort de sobriété sur les usages non essentiels.

    3. **Maraîchage : le solde.**


    | Débit entrant Q | Réservé | Potable | Maraîchage | Surface équivalente à besoin plein |

    |---|---|---|---|---|

    | ≥ 565 | 180 | 145 | 240 | 620 ha |

    | 500 | 180 | 145 | 175 | ~450 ha |

    | 450 | 180 | 145 | 125 | ~320 ha |

    | **410** | 180 | 145 | **85** | **~220 ha** |

    | 380 | 180 | 145 | 55 | ~140 ha |

    | 340 | 180 | 145 | 15 | ~40 ha |

    | < 325 | — | contraint | 0 | saisine préfectorale immédiate |


    Je dis la conséquence sans l''habiller : **à 410 L/s, 85 L/s ne sauvent pas 620 hectares, ils en soutiennent
    environ 220 à besoin plein.** Le plan n''étale pas une couche mince sur tout le parcellaire ; il oblige
    chaque exploitation à choisir les parcelles qu''elle sauve. Ce choix lui appartient, pas à moi.


    Deux mesures d''efficacité, sans coût : **irrigation en créneau 21 h – 7 h uniquement** (les pertes
    par évaporation en journée sont la seule ressource qu''on peut récupérer sans la prendre à personne),
    et **tour d''eau** organisé par les 34, sur calendrier déposé.


    ---


    ## 3. Deux leviers non exploités, à vérifier sous 48 h


    Ils peuvent modifier substantiellement le tableau ci-dessus. Je les présente comme des hypothèses,
    pas comme des acquis.


    **a) Le point de restitution de la station d''épuration de Ferney.** L''eau potable est un usage très
    peu consommateur : l''essentiel du prélèvement revient à la rivière par la STEP. Si le rejet se situe
    **entre le barrage et le point de contrôle du débit réservé**, alors une part importante des 145 L/s
    participe déjà au respect des 180 L/s aval, et le solde disponible en amont augmente d''autant. Si
    le rejet est en aval du point de contrôle, le gain est nul. Personne dans ce dossier n''a posé la
    question. Elle se règle par un appel et un relevé.


    **b) Le stock du barrage.** Nous raisonnons sur un débit *entrant*. Un barrage a une retenue. Le déficit
    de 160 L/s représente 13 800 m³/jour, soit environ 290 000 m³ sur les trois semaines annoncées sans
    pluie. Le volume utile mobilisable de Sarcelle ne figure nulle part dans le dossier. C''est une information
    gratuite et immédiate.


    Si (a) se confirme favorablement, l''enveloppe maraîchère peut passer de 85 à un ordre de 150–185
    L/s. **Je ne le promets pas. Je m''engage à le vérifier avant le 8ᵉ jour et à réviser la délibération
    le cas échéant.**


    ---


    ## 4. Le vrai conflit n''est pas celui que la presse décrit


    « Les paysans contre les robinets » est un cadrage faux. Le conflit décisif est **entre 6 exploitations
    et 28 autres**.


    Six exploitations cultivent 300 des 620 hectares. Une répartition au prorata des surfaces leur attribue
    48 % de l''enveloppe. Un volume global sans clé de répartition revient au même en pire : il délègue
    le partage au rapport de force, et ce sont les 28 plus petites qui absorbent l''ajustement.


    **Clé proposée : une base égale par exploitation, puis le solde au prorata des surfaces.** À 85 L/s
    : 34 L/s répartis en parts égales (1 L/s par exploitation), 51 L/s au prorata (0,082 L/s/ha).


    - Une exploitation de 5 ha : **1,41 L/s** au lieu de 0,69 au prorata pur.

    - Une exploitation de 50 ha : **5,11 L/s** au lieu de 6,85.

    - Les six plus grandes cèdent ensemble environ 10,5 L/s aux vingt-huit autres.


    C''est un choix de répartition, et je l''assume comme tel : la base égale protège l''unité qui peut
    disparaître — l''exploitation — tandis que les hectares au-delà relèvent d''une perte de revenu, grave
    mais rattrapable. Le prorata pur n''est pas plus neutre ; il fait le choix inverse en silence.


    **Contrepartie explicite aux six plus grandes :** priorité de premier rang sur la tranche de soutien
    du fonds, à hauteur des litres cédés par rapport au prorata, et une voix délibérative sur le calendrier
    du tour d''eau.


    **Et surtout : les 34 peuvent me substituer leur propre clé.** S''ils déposent avant le 8ᵉ jour une
    répartition adoptée à la majorité qualifiée entre eux, je l''applique telle quelle. L''enveloppe totale
    n''est pas négociable ; sa répartition interne leur revient s''ils s''en saisissent. C''est un transfert
    de pouvoir réel, pas une consultation.


    ---


    ## 5. Les seuils de sortie — pourquoi 2022 a échoué


    Le dispositif de 2022 levait les restrictions après 48 h au-dessus du seuil. Le 9 août, un orage porte
    le débit à 520 L/s ; les prélèvements reprennent en totalité le 11 ; quatre jours plus tard on est
    à 340. **Le critère mesurait la pluie, pas la ressource.** Un pic de ruissellement n''est pas une
    reconstitution de nappe, et une reprise simultanée à 100 % ne laisse aucune marge.


    Nouveau critère, **trois conditions cumulatives** :


    1. Moyenne glissante **sur 10 jours** ≥ 600 L/s — jamais un pic instantané ;

    2. Maintien **au moins 5 jours après la fin de l''épisode pluvieux**, pour exclure le ruissellement
    ;

    3. Stock de la retenue reconstitué au-dessus d''un seuil à fixer avec l''exploitant.


    **Levée en trois paliers de 7 jours** (un tiers de la restriction par palier). Le cliquet est asymétrique
    et assumé : on restreint en 24 h, on relâche en 21 jours.


    **Replis, à déclencheurs observables :**


    | Observation | Action |

    |---|---|

    | Débit aval < 180 L/s sur 24 h | Suspension totale et immédiate du prélèvement d''irrigation |

    | Q < 350 L/s trois jours consécutifs | Enveloppe maraîchère ramenée à 50 L/s |

    | Q < 325 L/s | La dotation potable elle-même est contrainte : saisine préfectorale, l''arbitrage
    sort de nos compétences |

    | Réserve tampon de Ferney < 2 jours | Irrigation suspendue, plan de continuité EHPAD activé |

    | Jaugeage de contrôle s''écartant de > 10 % de la station | Tous les seuils chiffrés suspendus et
    recalculés ; plancher conservateur appliqué dans l''intervalle |

    | Dépassement de quota constaté au compteur | Part suspendue pour la période restante et redistribuée
    aux autres |


    Aucune reprise automatique après un repli : elle passe par une délibération.


    ---


    ## 6. Les 600 000 € — proposition au département


    Le fonds couvre environ 9 % des 4,1 M€ annoncés. **Le présenter comme une compensation serait mentir,
    et c''est ainsi qu''on perd une salle.** Il doit acheter ce qui manque structurellement :


    - **Compteurs et télérelève, 34 exploitations : ~120 k€.** Sans eux, aucun quota individuel n''est
    opposable — ni cette année, ni la suivante. C''est la dépense qui change le régime.

    - **Jaugeage contradictoire, réétalonnage, seconde station : ~35 k€.** Nous arbitrons 4,1 M€ et une
    population de truites sur un capteur non vérifié depuis 2023.

    - **Soutien d''urgence ciblé : ~380 k€**, pondéré par l''écart entre la part attribuée et la part
    au prorata, plafonné par exploitation, versé sur justificatifs.

    - **Ferney : ~65 k€** pour l''étude d''interconnexion de secours et la campagne de sobriété. Quatre
    jours de tampon pour 9 200 habitants et un EHPAD, c''est la vulnérabilité la plus sous-traitée du
    dossier.


    ---


    ## 7. Ce qui n''est pas en mon pouvoir


    Notre délibération ne crée aucune des autorisations suivantes, et je refuse de laisser croire qu''elle
    les emporte :


    - **Abaisser le débit réservé** relève du préfet. Si la situation l''exige, il faut une demande de
    dérogation motivée — je propose de la préparer dès maintenant plutôt que de la découvrir à 330 L/s.

    - **Attribuer le fonds départemental** relève du conseil départemental. Nous proposons une ventilation
    ; nous ne l''allouons pas.

    - **Restreindre les usages domestiques non essentiels** relève de l''autorité de police compétente,
    pas de nous.

    - Je ne préjuge pas du détail de ces répartitions de compétences ; ce que j''affirme, c''est qu''**aucune
    de ces décisions n''est acquise du fait de notre vote**, et que présumer le contraire est la manière
    la plus rapide de faire annuler l''ensemble.


    ---


    ## 8. Le meilleur argument contre ma position


    Le voici, je ne l''affaiblis pas : *en tenant les 180 L/s de façon rigide, vous détruisez avec certitude
    un appareil productif et 90 emplois, au bénéfice d''un gain écologique lui-même incertain — car avec
    une station non étalonnée, le débit aval réel est peut-être déjà sous 180, les frayères peut-être
    déjà perdues. Vous sacrifiez du certain pour de l''hypothétique.*


    Cet argument est solide et il **modifie l''ordre de mes actions** : on mesure avant de répartir. Il
    ne modifie pas la répartition. Si le jaugeage révèle que l''aval est déjà sous 180, la conclusion
    n''est pas de donner l''eau à l''irrigation — c''est que nous sommes en infraction avec un arrêté
    et qu''il faut saisir le préfet le jour même.


    Second argument, dirigé contre moi : *la base égale par exploitation est une redistribution que vous
    opérez sans mandat et sans données sur la viabilité des fermes.* Exact. C''est pourquoi les 34 peuvent
    la remplacer par la leur (§4).


    ---


    ## 9. Ce qui me ferait changer d''avis


    - **Un jaugeage contradictoire donnant un débit réel supérieur à 500 L/s** : le déficit se réduit
    fortement, l''arbitrage change de nature.

    - **Une restitution STEP confirmée en amont du point de contrôle** : l''enveloppe maraîchère double.

    - **Les données parcellaires.** La commission ne détient ni cultures, ni stades végétatifs, ni relevés.
    Les 4,1 M€ et les 90 emplois sont une estimation produite par la partie qui demande l''eau, et je
    ne peux ni la vérifier ni la contester. Je ne l''écarte pas — je la traite comme non établie. Qu''on
    m''apporte le parcellaire sous 8 jours : s''il montre qu''un tour d''eau à 85 L/s sauve l''essentiel
    de la valeur, ou au contraire que la perte est concentrée sur quelques exploitations, je révise le
    dispositif et le ciblage du soutien. **Le dépôt de ces données conditionne la tranche de soutien.**


    ---


    ## 10. Aux trois parties


    **Aux maraîchers.** Je ne peux pas vous donner 240 L/s : ils n''existent pas dans la rivière, et les
    180 L/s aval ne m''appartiennent pas. Ce que je vous propose et que vous n''aviez pas : une enveloppe
    indexée sur une mesure vérifiée et non sur un chiffre contesté ; une clé qui protège les vingt-huit
    plus petites d''entre vous ; le droit de la remplacer par la vôtre ; des compteurs payés — sans lesquels
    aucune règle ne protégera jamais personne parmi vous ; et un chemin chiffré vers 150–185 L/s si les
    deux vérifications du §3 aboutissent. Quitter la salle avant le vote vous a coûté précisément le mécanisme
    qui vous départage entre vous. Revenez avec le parcellaire : c''est un argument, pas une formalité.


    **À la régie.** Vous obtenez la priorité, en droit et en fait, et un plancher qui ne cède qu''en dessous
    de 325 L/s. Vous n''obtenez pas de chèque en blanc : la dotation garantie est 145 et non 150, et les
    5 L/s d''écart sont votre part d''effort. Refuser d''ouvrir la discussion tant que la dotation n''est
    pas garantie n''est pas tenable une seconde séance. J''ai besoin de deux choses sous 48 h : le point
    de rejet et le débit de votre STEP, et l''état exact de votre tampon. Vos quatre jours de réserve
    sont, à mes yeux, le risque le plus mal couvert de ce dossier.


    **Sur le troisième usage.** Il n''a envoyé personne, il ne quittera pas la salle et il n''aura pas
    la parole jeudi. C''est aussi le seul dont la perte, documentée le 12 juin, ne se rachète ni avec
    600 000 € ni avec dix ans. Je n''échange pas les 180 L/s, et je n''en ai pas le pouvoir même si je
    le voulais.


    ---


    ## 11. Première action


    **Dès demain matin, avant toute autre chose :** commande d''un jaugeage contradictoire au barrage
    sous 72 h, et demande écrite à la régie du point de rejet et du débit de la STEP, ainsi qu''à l''exploitant
    du volume utile de la retenue.


    Le tableau du §2 sera présenté jeudi avec la valeur de Q datée et vérifiée. Si elle n''est pas disponible,
    je proposerai de délibérer sur la règle et de suspendre l''application du barème jusqu''à la mesure
    — pas de délibérer sur 410 parce que c''est le chiffre qui circule.

    '
