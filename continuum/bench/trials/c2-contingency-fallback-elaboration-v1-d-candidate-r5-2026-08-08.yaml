  text: '# PLAN D''EXÉCUTION — CONVERSION ÉLECTRIQUE DE LA FLOTTE

    **Conseil du jeudi 13 août 2026 — Direction de l''exploitation**


    ---


    ## 1. Ce que ce plan traite, et ce qu''il ne traite pas


    La commande est ferme, signée, et n''est pas rediscutée ici. Les 96 véhicules arriveront entre septembre
    et décembre. Le plan porte sur la seule variable encore ouverte : **la capacité de recharge**, qui
    détermine combien de ces véhicules peuvent réellement rouler chaque jour, et sur le rythme de restitution
    des diesels, qui est la seule décision irréversible du calendrier.


    ---


    ## 2. Le fait qui gouverne tout le reste


    La contrainte n''est pas le nombre de véhicules. C''est le nombre de **borne-heures** disponibles
    chaque nuit.


    Calcul à partir des chiffres du dossier :


    | Grandeur | Valeur | Source |

    |---|---|---|

    | Kilomètres flotte / jour | 96 × 168 = **16 128 km** | dossier |

    | Charge pleine | 6 h à 22 kW = 132 kWh | dossier |

    | Rendement mi-saison | 232 km / 6 h = **38,7 km par borne-heure** | essai mars |

    | Rendement hiver (2 °C, chauffage) | 197 km / 6 h = **32,8 km par borne-heure** | essai mars |


    Hypothèses déclarées, à confirmer lundi : fenêtre de branchement 13 h (18 h–7 h), taux d''occupation
    réel des bornes 85 %. Soit **11 h utiles par borne et par nuit**.


    | Parc de bornes | Borne-heures utiles | km électrifiables / jour (hiver) | Part des 16 128 km |

    |---|---|---|---|

    | 14 (aujourd''hui) | 155 | 5 080 | 31 % |

    | 22 (après travaux devisés) | 243 | 7 970 | **49 %** |

    | 26 (variante recommandée) | 287 | 9 420 | 58 % |

    | ~45 | 495 | 16 128 | 100 % |


    **Conséquence à énoncer clairement au conseil : avec 22 bornes, moins de la moitié du kilométrage
    quotidien est électrifiable en hiver. Ajouter des véhicules n''ajoute aucune capacité — seules des
    borne-heures en ajoutent.** L''électrification complète des 96 tournées suppose de l''ordre de 45
    bornes de 22 kW, soit un investissement d''infrastructure d''un ordre de grandeur non couvert par
    les 210 000 € devisés. Ce n''est pas un motif de revenir sur la commande ; c''est la deuxième tranche
    à décider, et je la propose au § 8.


    ---


    ## 3. Les trois décisions demandées jeudi


    **Décision 1 — Lancer les travaux de bornes immédiatement, en variante 12 bornes plutôt que 8.**

    7 semaines de travaux commandés le 14 août ⇒ mise en service fin octobre. Commandés en octobre « après
    avoir vu comment ça se passe » ⇒ mise en service en décembre ou janvier, et la subvention est perdue.
    C''est l''item à plus long délai du dossier : il ne supporte aucune attente.

    La variante à 12 bornes (26 au total, ~315 000 € au prorata du devis — à faire chiffrer) se réalise
    dans la même tranchée et le même raccordement. Son coût marginal est très inférieur à celui d''une
    tranche ultérieure, et c''est elle qui sécurise les 60 véhicules du 31 janvier (§ 5). **210 000 €
    engagés pour sécuriser 620 000 € acquis** est le rapport à retenir ; 315 000 € le sécurisent avec
    de la marge.


    **Décision 2 — Indexer la restitution des diesels sur la capacité de recharge, non sur le rythme de
    livraison.**

    Un diesel rendu n''est pas récupérable avant 11 semaines. Une erreur de restitution commise en octobre
    n''est réparable qu''en janvier — au pire moment. La prolongation coûte 480 €/véhicule/mois ; une
    tournée non terminée coûte 900 €. **Un mois de prolongation est payé par une seule tournée sauvée
    tous les deux mois.** L''asymétrie ne justifie aucune économie sur ce poste.


    **Décision 3 — Mandat de pilotage mensuel.** L''exploitation décide chaque mois du lot restitué, sur
    données du tableau de bord, dans l''enveloppe budgétaire du § 7, sans repasser devant le conseil.
    Le préavis de 30 jours impose une décision au 31 août, puis le dernier jour de chaque mois.


    ---


    ## 4. Règle d''affectation des tournées


    1. **Les véhicules électriques prennent les tournées les plus courtes**, par ordre croissant de kilométrage.
    Cette règle sert deux objectifs à la fois : elle protège l''autonomie et elle multiplie le nombre
    de véhicules qu''un parc de bornes donné peut servir.

    2. **Plafond d''affectation : 165 km par tournée sous 5 °C, 190 km au-dessus.** Fondé sur l''observation
    du responsable transport : les 11 recharges non prévues sur 120 tournées se sont toutes produites
    au-delà de 190 km, en conditions de mars. En janvier, la marge se réduit d''environ 15 %.

    3. **Les tournées de plus de 190 km restent diesel pendant tout l''hiver.** Aucune n''est réalisable
    en électrique à 2 °C : 240 km contre 197 km d''autonomie mesurée, et une recharge intermédiaire à
    22 kW ne rend que 33 km par heure d''arrêt — sans effet utile en cours de tournée.

    4. Aucune tournée n''est scindée sans accord préalable du client concerné sur les créneaux de livraison.


    ---


    ## 5. Le point à vérifier avant jeudi, et qui décide de la subvention


    Le dossier ne contient pas **la distribution des 96 tournées par kilométrage**. Le superviseur de
    flotte l''enregistre déjà toutes les 10 minutes : la donnée est disponible en une demi-journée, à
    coût nul.


    Elle décide de tout :


    - 60 véhicules électriques en hiver consomment 60 × (km moyen) / 32,8 borne-heures.

    - Avec 22 bornes (243 borne-heures) : le seuil des 60 n''est tenu que si les **60 tournées les plus
    courtes font 133 km de moyenne au maximum**.

    - Avec 26 bornes (287 borne-heures) : le seuil est tenu jusqu''à **157 km de moyenne**, ce qui est
    très probable pour la moitié basse d''une flotte à 168 km de moyenne.


    **Observation qui renverse ce plan :** si l''extraction montre 60 tournées à moins de 133 km de moyenne,
    les 8 bornes devisées suffisent et la variante à 12 est une dépense évitable de ~105 000 €. Si elle
    montre moins de 45 tournées sous 160 km, alors même 26 bornes ne permettront pas d''atteindre 60 véhicules
    en janvier, et il faudra arbitrer entre l''achat d''une recharge rapide en courant continu et la perte
    de la subvention. Je demande l''extraction lundi et la restitue mercredi.


    Deux autres vérifications, même échéance :

    - **La rédaction exacte de la convention régionale.** « 60 véhicules roulent » : immatriculés et affectés,
    ou 60 en service quotidien effectif ? 620 000 € dépendent d''une définition que nous n''avons pas
    lue.

    - **La puissance de raccordement des deux plateformes.** 26 bornes appellent 572 kW, 45 bornes près
    d''un mégawatt. Si un renforcement Enedis est nécessaire, son délai est de 6 à 12 mois — plus long
    que tout le reste du programme, et absent du dossier. À faire confirmer par l''installateur avec le
    chiffrage de la variante.


    ---


    ## 6. Calendrier de restitution des diesels


    Préavis à donner le dernier jour du mois précédent. Effectif en service = diesels conservés + électriques
    affectés ; la flotte est volontairement tenue au-dessus de 96 pendant la transition.


    | Fin de mois | VE livrés | VE en service | Diesels conservés | Lot restitué | Préavis à donner le
    |

    |---|---|---|---|---|---|

    | Septembre | 24 | 20 | 78 | 18 | **31 août** |

    | Octobre | 48 | 42 | 58 | 20 | 30 septembre |

    | Novembre | 72 | 60 | 40 | 18 | 31 octobre |

    | Décembre | 96 | 62 | 38 | 2 | 30 novembre |

    | Janvier | 96 | 62 | 38 | 0 | — |

    | Février–mars | 96 | 62 | 38 | 0 | — |


    Le décalage entre 24 véhicules livrés et 20 mis en service le premier mois couvre la prise en main,
    l''immatriculation et les aléas de livraison. Le plancher de 38 diesels à partir de janvier n''est
    pas une prudence : c''est le nombre de tournées que 26 bornes ne peuvent pas alimenter en hiver, plus
    les tournées longues qu''aucun véhicule électrique de ce parc ne peut faire.


    **Règle qui prime sur ce tableau : aucun diesel n''est restitué tant que le véhicule électrique qui
    le remplace n''a pas à la fois un créneau de recharge et une tournée affectée conforme au plafond
    du § 4.** Si les deux objectifs entrent en conflit, la continuité de service passe avant la subvention.
    Un diesel rendu à tort se récupère en 11 semaines ; un client perdu ne se récupère pas.


    ---


    ## 7. Coûts du plan


    | Poste | Montant |

    |---|---|

    | Bornes, variante 12 unités (à confirmer) | ~315 000 € — 210 000 € en variante 8 |

    | Prolongations de location au-delà du rythme naturel, oct.→mars | ~70 000 € |

    | Prolongations à partir d''avril, jusqu''à la tranche 2 | 18 240 €/mois (38 × 480 €) |

    | Rotation de rebranchement nocturne, 2 plateformes | ~90 000 €/an |

    | **Subvention sécurisée** | **− 620 000 €** |


    La rotation nocturne n''est pas un confort : le taux d''occupation de 85 % qui fonde tous les calculs
    du § 2 suppose qu''un véhicule chargé à 1 h du matin libère sa borne. Sans elle, tabler sur 65 % et
    retirer environ 5 véhicules électriques du service — soit 5 diesels de plus à prolonger.


    **Coût de l''écart d''infrastructure** : à partir de janvier, 34 véhicules électriques livrés et payés
    resteront immobilisés faute de bornes, soit environ 1,1 M€ d''actifs inemployés, garanties courantes.
    C''est ce chiffre, et non le loyer des diesels, qui justifie de décider la tranche 2 en décembre.


    ---


    ## 8. Suivi et déclencheurs de repli


    Les indicateurs existent déjà — taux de tournées terminées et recharges non prévues, publiés chaque
    soir par plateforme. Aucun outil nouveau n''est à construire.


    | Déclencheur observable | Action immédiate |

    |---|---|

    | Recharges non prévues > 5 % des tournées électriques sur 7 jours glissants | Gel du lot de restitution
    suivant ; abaissement du plafond d''affectation de 15 km |

    | Taux de tournées terminées < 98 % sur une plateforme, 3 jours consécutifs | Gel du lot ; retour
    des tournées concernées au diesel sous 24 h |

    | Travaux de bornes non réceptionnés au 15 novembre | Préavis immédiat de prolongation de 24 diesels
    supplémentaires jusqu''en mars ; arbitrage recharge rapide mobile vs. renoncement à la subvention,
    tranché au conseil de décembre |

    | Occupation moyenne des bornes > 90 % sur une semaine | Plafonnement du nombre de VE affectés au
    niveau atteint |


    Aucune reprise automatique après déclenchement : la remise en service se décide sur deux semaines
    pleines d''indicateurs revenus au vert.


    ---


    ## 9. Le meilleur argument contre ce plan


    **« Vous surprovisionnez. L''essai n''a montré que 11 échecs sur 120, tous sur les tournées longues.
    Excluez les tournées longues, mettez les 96 véhicules en service, et un pilotage de charge intelligent
    absorbera le reste. Vous dépensez 70 000 € de diesels et 105 000 € de bornes en trop. »**


    Il ne tient pas sur l''arithmétique : 16 128 km par jour à 32,8 km par borne-heure appellent 492 borne-heures,
    contre 243 disponibles avec 22 bornes. Aucun pilotage ne comble un facteur 2. Même en supposant une
    fenêtre de branchement de 16 h et une occupation parfaite, 22 bornes plafonnent à 352 borne-heures.


    Il tient sur un point, et j''en tiens compte : le taux d''échec de l''essai est un taux **par tournée
    longue**, pas un taux général. Rien dans les données ne suggère un problème sur les tournées courtes,
    et c''est précisément pourquoi la règle d''affectation du § 4 est la mesure de sécurité principale
    — pas la réserve diesel, qui n''est là que pour les kilomètres que les bornes ne peuvent pas servir.
    Si l''extraction de lundi révèle une flotte très concentrée sur les courtes distances, la variante
    à 12 bornes devient effectivement injustifiée et je le dirai jeudi.


    ---


    ## 10. Ce qui est négocié en parallèle


    **Avec le loueur.** Le mois-le-mois à 480 € nous convient mais lui donne zéro visibilité. Je propose
    de lui garantir un plancher de 38 véhicules jusqu''au 31 mars en échange d''un préavis ramené à 15
    jours au-dessus de ce plancher, ou d''un tarif dégressif. Il gagne une planification, nous gagnons
    de la réversibilité au moment où elle vaut le plus cher.


    **Avec les conducteurs.** Les recharges non prévues seront remontées par eux avant d''apparaître au
    tableau de bord. Deux engagements : les règles d''affectation sont présentées et discutées en réunion
    de plateforme avant le 1er septembre, et le signalement d''un incident d''autonomie ne donne lieu
    à aucune mise en cause individuelle. Les six conducteurs de l''essai de mars sont associés à la définition
    des plafonds kilométriques — ils sont les seuls à avoir conduit ces véhicules chargés, en froid.


    ---


    ## 11. Première action


    **Lundi 10 août, avant midi :** extraction auprès du superviseur de flotte de la distribution des
    96 tournées par kilométrage sur les 90 derniers jours, et de l''heure moyenne de retour et de départ
    par plateforme (la fenêtre de branchement réelle est la donnée la moins chère et la plus décisive
    du dossier).


    **Lundi, en parallèle :** demande à l''installateur d''un chiffrage à 8 et à 12 bornes et de l''état
    du raccordement ; demande à la direction financière de la rédaction exacte de la clause des 60 véhicules
    ; préparation du préavis de restitution des 18 diesels, à signer le 31 août.


    Résultats consolidés mercredi soir, présentés jeudi. La décision 1 est prise jeudi quelle que soit
    l''issue de l''extraction — seul le nombre de bornes en dépend.

    '
