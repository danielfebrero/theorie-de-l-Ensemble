response:
  text: '# Note au comité de direction


    **Objet :** Plan d''économies du DAF — validation partielle, refus motivé de deux mesures, engagements

    **Date :** lundi — décision demandée en séance

    **Auteur :** direction générale


    ---


    ## 1. Le point qui décide de tout


    Le plan repose sur une phrase du DAF : *« trois signataires restent en poste jusqu''à M14 et Vidal
    sera agréée d''ici là. »* La première partie est exacte. **La seconde est fausse dès lors qu''on applique
    le volet B.**


    Le calcul, à partir du référentiel :


    - Vidal a **6 mois de pratique restants**, sous Ferrand, à 120 h/mois.

    - Un mois sous 100 h compte **au prorata**. À 55 h/mois, un mois calendaire ne vaut que 0,55 mois
    d''ancienneté.

    - Ferrand part **fin M8**. Vidal dispose donc de **8 mois calendaires** pour acquérir 6 mois de crédit.


    | Régime de supervision | Crédit acquis à fin M8 (sur 6 requis) | Résultat |

    |---|---|---|

    | 120 h/mois (actuel) | 6,0 atteints **dès fin M6** | Pratique achevée, agrément prononcé **fin M8**
    |

    | 70 h/mois (variante) | 5,6 | **Échec** — il manque ~3 semaines |

    | 55 h/mois (volet B) | 4,4 | **Échec** — il manque 1,6 mois |


    En cas d''échec, le départ de Ferrand constitue un **changement de superviseur**, qui « ramène l''exigence
    à douze mois sous le nouveau ». Le crédit accumulé est perdu. Vidal repart de zéro pour 12 mois pleins,
    à compter de M9 :


    - à 55 h/mois : 12 / 0,55 = 21,8 mois → dernière heure ~M30, agrément **~M33** ;

    - à 70 h/mois : 12 / 0,70 = 17,1 mois → dernière heure ~M26, agrément **~M28**.


    Or Marchand part **fin M14**. À partir de M15 nous serions à **deux** signataires agréés. L''organisme
    suspend sous 30 jours, soit **~M16**. Le retour passe par une accréditation initiale — 14 à 20 mois,
    340 k€ — dont le dossier n''est recevable qu''avec trois agréés en poste, c''est-à-dire pas avant
    M28-M33. Réaccréditation effective : **M42 au mieux**. 87 % du chiffre d''affaires est adossé à cette
    accréditation.


    **La variante à 70 h/mois n''est pas un compromis.** Elle échoue pour environ trois semaines d''heures
    supervisées et produit exactement la même issue que 55 h. C''est le pire profil possible : elle a
    l''apparence de la prudence et la conséquence de l''imprudence.


    **Le seuil arithmétique est de 75 h/mois** (6 mois de crédit en 8 mois calendaires, avec Ferrand présent
    jusqu''au dernier jour). Il ne laisse aucune tolérance : un mois à 70 h, un arrêt maladie, un départ
    anticipé de Ferrand, et la mesure devient irréversible.


    ---


    ## 2. Sur la réversibilité


    Le DAF écrit qu''aucune mesure n''est irréversible et que chacune est rétablie en trente jours. **C''est
    vrai pour dix des douze mesures.** Ce n''est pas vrai pour deux d''entre elles, et pour une raison
    qui n''est pas budgétaire :


    - **Les heures non effectuées ne se rattrapent pas.** On peut rétablir un budget salons en trente
    jours ; on ne peut pas rétablir rétroactivement des heures de pratique supervisée sous un superviseur
    qui a quitté l''entreprise.

    - **Le changement de superviseur est définitif.** Réembaucher Ferrand ne réinitialise pas la clause
    des douze mois.

    - **La suspension elle-même est irréversible** au sens du plan : le retour ne se fait pas par levée,
    mais par accréditation initiale.


    La mesure « supervision à 55 h » n''est donc pas une économie de trésorerie mensuelle. C''est l''achat
    d''une option dont le prix d''exercice est de 340 k€ plus 14 à 20 mois sans 87 % du chiffre d''affaires.


    **Ordre de grandeur du gain contesté :** maintenir Vidal à 120 h au lieu de 55 h mobilise 65 h/mois
    de Ferrand pendant 6 mois, soit 390 heures — de l''ordre de 40 à 50 k€ de marge de production sur
    la période *(à confirmer par le DAF)*. Rapport au risque encouru : environ 1 à 7 sur les seuls frais
    de réaccréditation, avant même de compter la perte de chiffre.


    ---


    ## 3. Sur les éléments d''appui du dossier


    Deux arguments figurent dans la note et ne portent pas la conclusion :


    - **Le benchmark (7 laboratoires sur 9).** Il ne dit pas si l''un d''eux a réduit les heures de supervision
    d''un signataire en formation dont le superviseur partait avant l''échéance. C''est la seule question
    pertinente. Par ailleurs, un taux d''échec de 2 sur 9 sur un événement à 340 k€ et 14-20 mois n''est
    pas un argument rassurant : c''est une probabilité de ruine de 22 %.

    - **Les cinq cosignatures sur sept.** C''est un fait de gouvernance, pas un élément de preuve. Le
    référentiel n''est pas soumis à délibération.


    Je ne remets en cause ni la compétence ni la bonne foi du DAF. Le plan est solide sur onze douzièmes
    de son périmètre. L''erreur porte sur un point unique : le prorata et la clause de changement de superviseur
    n''ont pas été appliqués au calendrier de Ferrand.


    ---


    ## 4. Ce que je retiens


    **Volet A intégralement — 24 k€/mois.** Arrêt des salons, report ERP, sous-location des 240 m², fin
    de l''intérim en préparation d''échantillons. La perte historique de 4 % du chiffre non accrédité
    représente environ 0,5 % du chiffre total : coût accepté.

    *Réserve de vérification :* je demande confirmation sous 48 h que le flux de préparation d''échantillons
    n''est pas mutualisé avec les prestations accréditées. Si un allongement de 9 à 14 jours touche les
    livrables accrédités, l''exposition change de nature et cette mesure sera rediscutée.


    **Volet B, deux mesures sur quatre :** non-remplacement du technicien, internalisation de la maintenance
    métrologie.


    **Retour de Ferrand en production, en version réduite.** Ferrand reprend la production pour le solde
    de son temps, supervision de Vidal maintenue. À partir de M7, une fois la pratique achevée, Ferrand
    passe à 100 % production jusqu''à son départ fin M8.


    **Gel du poste de second apprenti signataire — maintenu jusqu''à M4 seulement.** Cette mesure-là est
    réellement réversible : sa réouverture ne coûte qu''un décalage dans un cycle de 26 mois, sans effet
    dans notre horizon de décision. Réouverture au jalon M4.


    ---


    ## 5. Ce que j''écarte


    **La réduction de la supervision de Vidal à 55 h/mois. Écartée.**


    **La variante à 70 h/mois. Écartée également** — pour la raison exposée en section 1 : elle échoue
    de trois semaines et produit le même résultat.


    Conséquence assumée : le volet B ne délivrera pas 26 k€/mois. J''estime le rendement des mesures retenues
    à **13-16 k€/mois** *(chiffrage à confirmer par le DAF pour lundi)*, soit un manque à gagner de 10
    à 13 k€/mois par rapport au plan présenté. Ce manque est couvert en section 6.


    ---


    ## 6. Ce sur quoi j''engage le laboratoire


    **6.1 — Vidal reste à 120 h/mois sous Ferrand jusqu''à l''achèvement de sa pratique.** Plancher contractuel
    : 100 h/mois, jamais en dessous, aucune exception. Achèvement visé fin M6, agrément prononcé fin M8.
    Cela laisse deux mois de marge sur le départ de Ferrand et cinq mois sur celui de Marchand.


    **6.2 — Sécurisation de Ferrand.** Ferrand est démissionnaire et constitue aujourd''hui le point de
    défaillance unique de notre accréditation. Je propose une prime d''achèvement, conditionnée à la délivrance
    effective des heures de supervision jusqu''à fin M6, d''un montant de l''ordre de 20 k€. À rapporter
    aux 340 k€ de réaccréditation.


    **6.3 — Recrutement d''un signataire déjà agréé, sans condition, arrivée visée M7-M8.** À partir de
    M15, l''effectif retombe à trois agréés exactement : Bouchard, Nseka, Vidal. Un arrêt maladie long,
    un départ, et nous sommes suspendus. Ce recrutement n''est pas une dépense de croissance, c''est la
    prime d''assurance sur 87 % du chiffre d''affaires. Coût estimé : 8 k€/mois chargé. C''est le seul
    levier qui ajoute un signataire en moins de 26 mois.


    **6.4 — Les contrats-cadres deviennent l''axe central du redressement, pas une opportunité annexe.**
    41 k€/mois couvrent 67 % du déficit courant. Combinés au volet A, ils placent le laboratoire à l''équilibre
    dès M9. Ils exigent deux signataires dédiés *en sus de l''activité courante*, soit cinq agréés au
    total ; nous en aurons quatre en M9 et trois en M15. Je mandate donc la négociation d''une signature
    ferme avant **M4**, et je conditionne à cette signature un second recrutement de signataire agréé.


    Il faut nommer la contradiction : le gel du poste d''apprenti signataire et la réduction de la supervision
    étaient précisément les deux mesures qui rendaient ces 41 k€/mois inatteignables. Le plan économisait
    26 k€/mois en détruisant 41 k€/mois.


    **6.5 — Ouverture d''une discussion avec Marchand** sur un maintien à temps partiel au-delà de M14.
    Sans engagement, mais tout mois gagné est un mois de marge sur le plancher réglementaire.


    **6.6 — Règle permanente de gouvernance.** Aucune mesure touchant aux heures de supervision, à l''effectif
    signataire ou au pipeline d''apprentis ne peut être portée au comité sans une vérification écrite
    contre le référentiel, annexée à la proposition. Le référentiel est une contrainte binaire, pas une
    ligne budgétaire arbitrable.


    ---


    ## 7. Trésorerie


    | Scénario | Déficit mensuel | Épuisement des 780 k€ |

    |---|---|---|

    | Sans plan | 61 k€ | ~M13 |

    | Volet A seul | 37 k€ | ~M21 |

    | Plan DAF intégral (A + B) | 11 k€ | *sans objet* — suspension à ~M16, effondrement de 87 % du CA
    |

    | **Plan retenu (A + B partiel + recrutement)** | **~29-32 k€** | **~M24-M27** |

    | **Plan retenu + contrats à partir de M9** | **excédent dès M9** | **sans objet** |


    Le plan retenu est plus coûteux de 10 à 13 k€/mois que celui du DAF sur les huit premiers mois. Il
    achète avec cela la conservation de l''accréditation et l''accès aux 41 k€/mois. La banque ayant fermé
    le découvert en janvier, la trésorerie est notre seule ressource : elle doit financer un chemin vers
    l''équilibre, pas seulement un ralentissement de la chute.


    ---


    ## 8. Jalons de contrôle


    | Échéance | Point de contrôle | Décision si manqué |

    |---|---|---|

    | **Hebdomadaire** | Heures de supervision Vidal (relevé signé Ferrand) | Tout mois < 100 h : escalade
    immédiate au comité |

    | **M4** | Signature ferme des contrats-cadres | Si non signés : réouverture du poste d''apprenti,
    second recrutement suspendu, revue approfondie du périmètre volet A |

    | **Fin M6** | Achèvement de la pratique de Vidal — attestation écrite | Point d''arrêt critique |

    | **M7-M8** | Arrivée du signataire agréé recruté | Si non pourvu : recours à un cabinet spécialisé,
    budget déplafonné |

    | **Fin M8** | Agrément de Vidal prononcé | Vérification auprès de l''organisme |

    | **M12** | Revue de l''effectif signataire avant le départ de Marchand | — |


    ---


    ## 9. Demandes au comité, lundi


    1. Validation du volet A intégral et du volet B amputé de la mesure de supervision.

    2. Rejet formel, porté au procès-verbal, des deux options 55 h et 70 h.

    3. Autorisation du recrutement d''un signataire agréé, sans condition préalable.

    4. Mandat de négociation des contrats-cadres avec échéance de signature à M4.

    5. Adoption de la règle de vérification préalable (§6.6).

    6. Rechiffrage du volet B amputé, présenté en séance par le DAF.


    Le déficit est réel et le plan doit être exécuté. Mais on ne finance pas huit mois de trésorerie en
    vendant l''actif qui produit 87 % du chiffre d''affaires — surtout quand cette vente se joue à trois
    semaines d''heures supervisées près.


    ---


    **Deux chiffres restent à confirmer par le DAF avant la séance :** le rendement exact du volet B amputé
    (estimé 13-16 k€/mois) et la valorisation des 390 heures de production de Ferrand mobilisées par le
    maintien de la supervision (estimée 40-50 k€). Ils ne changent pas la conclusion, mais ils doivent
    figurer au dossier plutôt que mes estimations.

    '
