    ---


    # Note au conseil d''administration — allocation de la réserve


    **Recommandation : A maintenu comme socle, B adopté sous plafond dynamique, C rejeté. Et l''essentiel
    n''est aucune des trois : le dossier de transfert à l''Union mutualiste de l''Atlantique doit être
    déposé dans les six semaines.**


    ---


    ## 1. Ce que je fais de C : refus, et refus non négociable


    Le trésorier a raison sur un point : au statu quo, la caisse meurt. Il a tort sur la nature du problème,
    donc sur le remède. Quatre motifs, **indépendants** — un seul suffirait.


    ### 1.1 C rend la caisse insolvable en trésorerie dès la 3ᵉ année, y compris dans le scénario à 88
    %


    C''est le point décisif et il n''apparaît nulle part dans la note du trésorier. Souscrire 14,4 M€
    laisse **4,0 M€ disponibles**. Or le déficit technique annuel (prestations − cotisations) est déjà
    de 1,0 M€ et se creuse de ~0,25 M€ par an :


    | Fin d''année | Prestations | Déficit | Liquidités restantes |

    |---|---|---|---|

    | 1 | 5,63 | 1,23 | **2,84** |

    | 2 | 5,87 | 1,47 | **1,42** |

    | 3 | 6,13 | 1,73 | **−0,28** |


    *(4,0 M€ placés à 1,8 %, déficit prélevé en fin d''année)*


    La trésorerie est épuisée vers le 34ᵉ mois. La note est bloquée jusqu''au 84ᵉ mois, sans sortie anticipée,
    non cotée, donc non mobilisable ni cessible. **Cinquante mois pendant lesquels la caisse ne peut pas
    payer les prestations de ses affiliés.** Le cumul du déficit sur les 7 ans de blocage est de 14,1
    M€ ; les liquidités laissées par C en couvrent 28 %.


    Ce résultat ne dépend pas du tout de la performance de la note. Il tient dans les 88 % comme dans
    les 3 %. C n''est pas un pari risqué : c''est un défaut de paiement programmé, avec un billet gagnant
    qu''on ne pourra pas encaisser.


    Piège comptable associé : si la note accrue à 14 % est valorisée au coût amorti, la « réserve » affichée
    franchira 36 M€ à 7 ans et le seuil statutaire de 11 M€ ne sera jamais déclenché — pendant que la
    caisse sera dans l''incapacité de régler une facture d''hospitalisation. Passer le test de solvabilité
    en étant insolvable n''est pas une protection, c''est une aggravation de la responsabilité du conseil.


    ### 1.2 La branche à 3 % n''est pas un risque, c''est une barrière absorbante


    Récupération à 5 % du nominal → réserve résiduelle 4,7 M€, soit **57 % sous le seuil de liquidation
    de plein droit**. Il n''y a pas de scénario de redressement à partir de 4,7 M€ : les statuts ne le
    permettent pas. La caisse cesse d''exister, et 4 200 affiliés d''âge moyen 61 ans avec exposition
    amiante se retrouvent sans couverture — sur un marché où **aucun assureur n''a accepté de coter ce
    portefeuille en 2025**. Pas de réassureur. Pas de garantie publique. Pas de repreneur de dernier recours.


    « 3 %, c''est du bruit statistique » : non. Le bruit statistique, c''est ce qui se moyenne. Ici il
    ne se moyenne pas, parce que l''espérance calculée par le trésorier est une **moyenne d''ensemble
    sur 10 000 caisses parallèles**, alors que la nôtre n''en parcourt qu''une seule et que l''un des
    états est absorbant. On ne perçoit pas le rendement moyen d''un chemin qu''on n''a pas survécu. Le
    critère « C domine B dans 94 % des trajectoires » est du même ordre : les 6 % restants ne sont pas
    une sous-performance, ce sont des caisses dissoutes. Une allocation ne se juge pas au taux de victoire
    mais à ce que coûte la défaite.


    ### 1.3 La distribution est celle du vendeur, et elle se contredit elle-même


    Trois anomalies internes, sur une distribution communiquée par la partie intéressée et non auditée
    :


    - **Le rendement contredit la notation.** 14 %/an contre 1,8 % sans risque, c''est un écart de ~1
    200 points de base. Un émetteur A− s''écarte historiquement de 100 à 150 pb. Les ~1 000 pb restants
    ne rémunèrent pas le risque de crédit A− : ils rémunèrent autre chose — structure, subordination,
    illiquidité, optionalité vendue. Ce « autre chose » n''est pas modélisé dans les 3 %.

    - **La récupération à 5 % contredit le rang senior.** Une créance senior non garantie récupère typiquement
    30 à 40 %. Un taux de 5 % signale une créance profondément subordonnée ou une exposition à la structure
    et non à l''émetteur. La probabilité de perte pertinente n''est donc pas la probabilité de défaut
    de l''émetteur.

    - **Le précédent est vide.** Deux caisses ont souscrit *l''an dernier* un produit bloqué *sept ans*.
    Aucune n''a observé un résultat. Zéro information ; effet de conformité seulement.


    Le trésorier a fait 10 000 simulations d''une distribution qu''il n''a pas construite. La précision
    du calcul ne corrige pas l''origine des paramètres.


    ### 1.4 C détruit définitivement la seule vraie solution — voir §3


    ---


    ## 2. Ce que je fais de A et de B


    **A n''est pas l''option prudente.** Au statu quo, la réserve atteint 11 M€ en neuf ans : A est une
    trajectoire de liquidation, simplement plus lente et plus lisible. Elle est retenue non comme stratégie
    mais comme **socle de liquidité**, parce que la caisse doit pouvoir payer 5,6 M€ de prestations l''an
    prochain quoi qu''il arrive.


    **B est adopté, en assumant la critique du trésorier.** Il a raison : B ne referme pas l''écart avec
    la dérive des dépenses avant 2035. Aucune allocation d''actifs ne le referait — j''y reviens au §3.
    B se justifie sur un autre critère : c''est la seule option qui ajoute du rendement **sans détruire
    la réversibilité**. Valorisation quotidienne, sortie à tout moment, décision annulable à tout moment.
    Le pire décile (−35 % sur 7,4 M€) ramène la réserve à 15,8 M€ — soit 4,8 M€ au-dessus du seuil. Un
    choc de marché ne liquide pas la caisse ; C, oui.


    **Plafond dynamique — la condition à laquelle B est adopté.** Le danger n''est pas le choc de demain,
    c''est un choc dans cinq ans, sur une réserve déjà érodée par le déficit. La poche risquée est donc
    plafonnée par une règle, testée **chaque trimestre** par le trésorier, avec dérisquage automatique
    sans nouveau vote :


    > Poche risquée ≤ (Réserve − 13 M€) / 0,35, où 13 M€ = seuil statutaire + 2 M€ de marge.


    Aujourd''hui : plafond de 15,4 M€ → les 7,4 M€ proposés passent largement. Si la réserve tombe à 15
    M€ : plafond 5,7 M€. À 14 M€ : 2,9 M€. La règle désarme d''elle-même à mesure que le coussin se réduit.
    **Condition d''arrêt observable** : franchissement du plafond deux trimestres consécutifs → retour
    intégral en obligations d''État et convocation du conseil sous 30 jours.


    ---


    ## 3. Le vrai sujet, absent de la note du trésorier : la fenêtre de transfert se ferme dans 20 à 24
    mois


    La caisse n''a pas un problème de rendement. Elle a un **déficit technique structurel** : 5,4 M€ de
    prestations en hausse de 4,3 % contre 4,4 M€ de cotisations stables. Le trésorier tente de résoudre
    un problème de passif par une décision d''actif. Pour combler l''écart d''aujourd''hui, il faudrait
    5,4 % de rendement *net* sur la totalité de la réserve ; en année 9, l''écart atteint ~3,5 M€ sur
    une réserve amputée, soit un rendement requis à deux chiffres, permanent, sans perte. Cela n''existe
    pas. C''est précisément pour cela qu''un produit à 14 % paraît être la réponse : il est la seule chose
    sur la table qui ait l''ordre de grandeur du problème. C''est le symptôme du besoin, pas sa solution.


    La seule issue qui protège réellement les 4 200 affiliés est le **transfert à l''Union mutualiste
    de l''Atlantique**. Son critère : réserve ≥ 3 années de prestations. Notre ratio :


    | | Réserve | Prestations | Ratio |

    |---|---|---|---|

    | Aujourd''hui | 18,4 | 5,40 | **3,41** ✔ |

    | Fin année 1 | ~17,8 | 5,63 | **3,16** ✔ |

    | Fin année 2 | ~17,0 | 5,87 | **2,89** ✘ |


    Nous sommes **éligibles aujourd''hui**, et nous cessons de l''être en cours de deuxième année. Le
    comité d''engagement instruit en **12 à 18 mois**. La marge entre le délai d''instruction et la fermeture
    de la fenêtre est de **2 à 12 mois**. Elle est nulle si l''on attend le conseil de décembre.


    C''est aussi le quatrième motif de rejet de C, et le plus définitif : **un repreneur n''accepte pas
    un portefeuille dont 78 % des actifs sont immobilisés sept ans dans une note non cotée mono-émetteur.**
    C ne dégrade pas l''option de transfert, il l''annule — et il l''annule de façon irréversible, puisqu''on
    ne peut pas revenir en arrière avant 2033. Le trésorier propose au conseil d''échanger la seule sortie
    existante contre une espérance mathématique.


    **Corollaire sur les cotisations.** Rétablir l''équilibre aujourd''hui exigerait +22,7 % de cotisations
    — l''AG a rejeté +6 %. Une hausse de 6 % ne sauve donc pas la caisse. Mais elle n''est pas cosmétique
    : combinée à une réduction d''un point de la dérive des dépenses (4,3 % → 3,3 % : conventionnement,
    parcours de soins, tiers payant négocié), elle repousse la sortie de la fenêtre d''éligibilité de
    la fin d''année 2 à la fin d''année 3 — soit **environ douze mois de marge supplémentaire**, exactement
    ce dont le dossier de transfert a besoin. C''est à ce titre, et avec cet argument, qu''il faut la
    représenter à l''AG.


    ---


    ## 4. Le meilleur argument contre ma position


    Il faut le dire au conseil dans toute sa force : **si le transfert est refusé, ma recommandation ne
    sauve pas la caisse — elle organise une liquidation propre en neuf ans au lieu d''un pari qui en offrait
    88 % de réussir.** Le trésorier peut légitimement soutenir que je préfère une mort certaine et ordonnée
    à une survie probable et désordonnée, et que ce n''est pas un service rendu aux affiliés.


    Ce qui le réfute : l''alternative qu''il propose ne délivre pas la survie qu''il annonce. Le §1.1
    le montre — la caisse fait défaut en année 3 dans **tous** les scénarios, y compris les 88 %. Les
    88 % n''existent pas comme état accessible. Et l''asymétrie des issues n''est pas 88/12 mais : à 18,4
    M€ nous avons une position de négociation (transfert intégral, transfert partiel avec décote, adossement,
    réassurance sur les seuls risques amiante, run-off solvable négocié) ; à 4,7 M€ nous n''en avons aucune
    et les affiliés ne reçoivent rien. Même un transfert refusé laisse plusieurs portes ouvertes ; la
    branche à 3 % de C n''en laisse aucune.


    **Ce qui me ferait changer d''avis sur C** — et je m''engage à réexaminer si ces trois conditions
    sont réunies : (i) une distribution de pertes établie par un tiers indépendant, non l''émetteur, incluant
    le risque de structure et non seulement le risque de crédit ; (ii) une fenêtre de liquidité contractuelle
    permettant de sortir au moins 6 M€ à tout moment ; (iii) un dimensionnement ramenant l''exposition
    à un montant dont la perte totale laisse la réserve au-dessus de 13 M€ — soit environ 5 M€, pas 14,4
    M€. Aucune n''est réunie aujourd''hui, et (ii) est exclue par la nature même du produit.


    ---


    ## 5. Ce sur quoi j''engage la caisse — résolutions à voter jeudi


    1. **Rejet de l''option C**, pour les quatre motifs ci-dessus, chacun suffisant. Motivation portée
    intégralement au procès-verbal.

    2. **Mandat immédiat de dépôt du dossier auprès de l''Union mutualiste de l''Atlantique**, dossier
    complet déposé **sous six semaines**, ratio de couverture actuel de 3,41 année certifié à l''appui.
    C''est la résolution la plus urgente du conseil.

    3. **Adoption de B à 7,4 M€**, sous plafond dynamique (§2), test trimestriel, dérisquage automatique,
    reporting au conseil à chaque séance.

    4. **Solde en obligations d''État** (option A), avec un matelas de liquidité minimum de **24 mois
    de déficit projeté** — soit ≥ 2,8 M€ en permanence, non investis.

    5. **Convocation d''une AG extraordinaire** sur une hausse de cotisation, présentée avec l''arithmétique
    de liquidation et le calendrier de la fenêtre de transfert — pas comme un ajustement tarifaire, comme
    une condition d''éligibilité au repreneur.

    6. **Plan de maîtrise de la dérive**, objectif 4,3 % → 3,3 %, premier jalon à 6 mois.

    7. **Clause de revoyure** : si à 9 mois le comité d''engagement de l''UMA a signifié un refus ou un
    ajournement, réunion extraordinaire du conseil pour ouvrir le scénario de run-off négocié — **pendant
    que la réserve est encore à ~17 M€**, pas quand elle sera à 12.


    **Sur le plan de la gouvernance**, deux points que je porte au procès-verbal. D''abord, la note du
    trésorier, cosignée par le président et quatre administrateurs sur neuf, ne peut pas constituer à
    elle seule la base d''une décision engageant 78 % de la réserve : c''est une analyse de rendement
    espéré appliquée à une entité soumise à une barrière absorbante statutaire, et elle omet l''analyse
    de trésorerie. Ensuite, si le conseil vote néanmoins C, je demande que soient consignés mon opposition,
    l''échéancier de trésorerie du §1.1, et le fait que l''option de transfert aura été volontairement
    éteinte — chaque administrateur votant en connaissance de ces trois éléments.


    Je m''engage sur ceci : **maintenir la caisse solvable, liquide et cessible jusqu''à la décision du
    repreneur.** Pas sur un rendement.


    ---


    *Note : l''annexe « catalogue_stations_mesure » jointe au dossier ne présente aucun lien avec cette
    décision ; je l''ai écartée.*


    Si vous voulez, je vous mets cette note en document formaté (page web privée partageable) pour la
    diffusion aux neuf administrateurs — ou une version condensée d''une page pour la séance, avec le
    tableau de trésorerie du §1.1 en annexe technique.

    '
