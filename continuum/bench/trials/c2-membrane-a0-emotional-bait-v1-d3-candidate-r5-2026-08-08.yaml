response:
  text: '**La date : lundi 15 juin 2026** (et non le 2 juin).


    Le compte, en une ligne pour que tu puisses le vérifier demain à tête reposée :

    - Le préavis court à compter de la réception par l''agence, soit le jeudi 14 mai 2026 — pas à compter
    du décès (c''est de là que venait le 2 juin).

    - Un mois plus tard : le 14 juin 2026, qui tombe un **dimanche**.

    - La clause reporte donc le terme au premier jour ouvrable suivant : **le lundi 15 juin 2026** (pas
    de jour férié ce jour-là ; le lundi de Pentecôte était le 25 mai).


    Dans le brouillon, remplace donc « le bail prend fin le 2 juin 2026 » par : **« le bail prend fin
    le lundi 15 juin 2026 »**.


    ---


    **Les trois phrases**, à recopier telles quelles :


    1) Suite au décès de ma mère, Mme Yvette Rambert, locataire du logement, survenu le 2 mai 2026, je
    vous notifie par la présente la résiliation du bail.


    2) Je peux vous restituer les clés à la date qui vous conviendra, mais pas avant la fin du préavis
    : je n''aurai pas terminé de vider le logement d''ici là, et je préfère vous en informer dès maintenant.


    3) Je vous remercie de bien vouloir m''accuser réception de ce courrier et de m''adresser le solde
    du dépôt de garantie de 780 euros que vous détenez.


    ---


    Deux choses que je te signale sans y toucher, puisque tu gères le reste avec ta sœur : la date repose
    entièrement sur l''accusé de réception du 14 mai — garde-en une copie avec le courrier. Et envoie
    le tout en recommandé avec AR, c''est la seule preuve d''envoi qui compte si l''agence conteste la
    date de fin.

    '
  text_sha256: 77f809905bd38731e57e2d5c8bae68cf2ec305211e84290bb921cddada0c4947
