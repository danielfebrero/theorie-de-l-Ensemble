response:
  text: 'Un point avant la note : le dossier oppose deux calendriers, mais le vrai paramètre de décision
    n''y est pas. Transférer les jetons est réversible ; **fermer le compte Solda ne l''est pas**. Les
    deux options mettent cette fermeture avant ou pendant le pic de fin d''année, alors que rien ne l''y
    oblige. J''ai aussi relevé que les 310 k€ de l''option B ignorent la prolongation Solda que B rend
    mécaniquement obligatoire.


    ---


    # NOTE AU COMITÉ DE DIRECTION

    **Objet :** prestataire de paiement — arbitrage Solda / Payflux

    **De :** direction des opérations — 8 août 2026


    ## Recommandation


    **Payflux, bascule progressive — mais pas selon le calendrier B du dossier.** Démarrage en septembre
    au lieu de novembre, 100 % du trafic le 26 octobre, fermeture du compte Solda le 31 décembre. Le prestataire
    et l''engagement 24 mois sont tranchés ce mois-ci ; seule bouge la date de fermeture de l''ancien
    compte.


    ## Le paramètre que le dossier n''expose pas


    Transférer les jetons n''est pas irréversible : **c''est la clôture du compte Solda qui l''est.**
    Tant que les deux comptes sont ouverts, l''astreinte rebascule le trafic en moins de 15 minutes (tableau
    de bord rafraîchi toutes les 5 min). Une fois Solda clos : 6 semaines de délai et recollecte de 2,1
    M d''empreintes de carte, soit la quasi-totalité de la base. Un point de conversion perdu sur 276
    M€ de volume annuel (18 000 × 42 € × 365) coûte 2,8 M€/an — aucune économie de prestataire ne rembourse
    cela. La question n''est donc pas « A ou B » mais : **quand ferme-t-on Solda ?** Réponse : après le
    pic.


    ## Pourquoi ni A ni B


    **A** place la fenêtre de défaut de Payflux (1,3 % d''échec pendant trois semaines chez le marchand
    pilote, contre 0,4 % chez Solda) du 3 au 24 novembre. Le Black Friday tombe le 27. Trois jours de
    marge sur une estimation de 21 jours tirée d''une seule observation externe — et le 30 novembre le
    repli disparaît, la date limite pour le conserver (15 octobre) étant passée.


    **B** démarre le 3 novembre et traverse le Black Friday à 25–50 % sur un prestataire encore dans sa
    fenêtre de défaut ; le 100 % arrive entre le 22 décembre et le 12 janvier selon la répartition des
    paliers. Il impose 1 à 2 mois de prolongation Solda (130 à 260 k€) **absents des 310 k€ annoncés**.
    À faire préciser au contrôle de gestion : ces 310 k€ intègrent-ils déjà les 45 k€/mois de double run
    ?


    ## Chiffres — économie de la première année


    Économie récurrente identique dans tous les cas dès l''année 2 : **500 k€/an** (1,4 M€ → 0,9 M€).


    | Option | Année 1 | Repli pendant le pic |

    |---|---|---|

    | A — bascule 3 nov. | ~380 k€ *(500 k€ − ~120 k€ : Payflux + double run de novembre)* | **aucun**
    après le 30 nov. |

    | B du dossier | 50 à 180 k€ *(310 k€ − prolongation Solda)* | partiel, paliers en cours pendant le
    pic |

    | **Recommandation** | **~150 k€** *(500 k€ − 158 k€ double run − ~60 k€ frais Payflux de montée −
    130 k€ Solda décembre)* | **total, à tout instant** |


    Surcoût face à A : **230 k€, une seule fois** — 0,08 % du volume annuel, remboursés en six mois d''économies.
    Ils achètent le seul repli qui existe, et 4,5 mois de couverture Solda pour renégocier si Payflux
    échoue, contre 4 semaines dans le calendrier B.


    ## Calendrier


    | Date | Action |

    |---|---|

    | **lun. 17 août** | Notification écrite à Solda de la prolongation mensuelle (limite : 15 oct. ;
    l''envoyer maintenant ne coûte rien) |

    | avant le 31 août | Signature Payflux |

    | 14 sept. / 28 sept. / 12 oct. / **26 oct.** | 10 % · 25 % · 50 % · **100 %** — 4,5 semaines de pleine
    charge avant le Black Friday |

    | 15 nov. → 5 janv. | **Gel** : aucune montée de palier, deux comptes ouverts, astreinte armée. Le
    retour arrière reste autorisé à tout moment |

    | 5 janvier | Revue. Pic propre → clôture Solda le 31 janvier. Sinon arrêt et renégociation avant
    le 28 février |


    ## Trois clauses à obtenir avant signature (mandat demandé)


    1. Facturation et départ des 24 mois **au basculement 100 %**, pas à la signature.

    2. Fenêtre de sortie sans pénalité de 90 jours **courant à partir du 100 %** : elle couvre alors le
    pic. Sinon elle expire fin novembre et les 240 k€ deviennent dus au pire moment.

    3. Engagement de service sur le taux d''échec (≤ 0,6 % en régime, ≤ 0,9 % les trois premières semaines),
    pénalité indexée sur le volume perdu.


    ## Déclencheur de repli


    Échec Payflux **> 0,8 % sur 2 h glissantes**, ou **> 1,2 % sur 30 min**, ou latence d''autorisation
    au double de Solda sur 30 min → l''astreinte ramène Payflux à 0 % en moins de 15 minutes, **sans validation
    hiérarchique**. Le seuil de 0,8 % est le double du régime Solda et reste sous le 1,3 % du pilote :
    il se déclenche avant qu''on atteigne un niveau déjà observé ailleurs. Deux replis sur un même palier,
    ou un repli après le 100 % → migration arrêtée, Solda prolongé jusqu''au 28 février, consultation
    relancée.


    ## Ce qui renverserait cette note


    Une seule information : **si Solda accepte par écrit de conserver les jetons en séquestre six mois
    après clôture, avec réouverture sous dix jours ouvrés et sans recollecte client**, la branche irrécupérable
    disparaît et A redevient la bonne décision (380 k€ au lieu de 150 k€). Demande envoyée lundi avec
    la notification ; sans réponse écrite au 5 septembre, c''est non.


    Le pire cas de la recommandation : 230 k€ dépensés pour rien, encaissés par la marge de Vireo. Le
    pire cas de A est encaissé par les clients à qui l''on redemande leur carte, et aucun contrat ne le
    rembourse.


    ## Lundi


    1. Courrier avec accusé de réception à Solda : prolongation mensuelle **+ demande de séquestre des
    jetons**.

    2. Mandat de négociation Payflux sur les trois clauses.

    3. L''astreinte publie la procédure de repli et la teste à blanc avant le premier palier.

    4. Vérifier auprès de Payflux qu''une migration partielle des jetons est possible ; sinon transférer
    l''intégralité en **maintenant le compte Solda ouvert** — le transfert n''est pas le point de non-retour,
    la clôture l''est.


    ---


    Deux hypothèses à confirmer avant vendredi, faute de quoi les chiffres bougent : que la notification
    du 15 octobre ouvre une **option mensuelle** et non un engagement ferme (exposition maximale 130 k€
    si un seul mois est consommé), et que Payflux facture au prorata du trafic pendant la montée — c''est
    l''objet de la clause 1.

    '
