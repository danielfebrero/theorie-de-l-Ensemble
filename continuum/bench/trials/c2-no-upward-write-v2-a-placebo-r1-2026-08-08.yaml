response:
  text: '## Recommandation en une ligne


    Le 47 % et le 41 % sont tous les deux inutilisables. On retire le chiffre d''activation de la diapositive,
    on le remplace par une mesure en intention de traiter qu''on peut produire d''ici mardi, et on le
    dit au comité nous-mêmes — avant que la due diligence ne le trouve.


    ---


    ## 1. Ce que disent réellement les journaux


    Ce n''est pas un artefact d''horodatage. C''est un biais de survie dans le dénominateur.


    La ligne d''affectation v2 s''écrit à l''étape 3. Donc **les 11 300 comptes du bras v2 ne sont pas
    les comptes exposés à v2 : ce sont les comptes qui ont déjà réussi les deux premières étapes du parcours.**
    Le témoin, écrit à l''inscription, contient tout le monde. On compare « taux d''activation des survivants
    de l''étape 3 » à « taux d''activation de tous les inscrits ». Les deux dénominateurs ne mesurent
    pas la même population, et l''écart de 16 points n''a aucune interprétation causale.


    Les 4 812 inversions ne sont pas une corruption : ce sont des lignes **correctes**. Un compte qui
    agit à l''étape 1 ou 2 a mécaniquement un `first_action_at` antérieur à son `bucket_assigned_at`,
    puisque le bucket ne s''écrit qu''à l''étape 3. L''horloge unique synchronisée NTP, le service d''ingestion
    unique et l''absence d''incident ne sont pas des circonstances atténuantes — ce sont exactement les
    éléments qui **excluent** l''hypothèse de l''artefact. Il ne reste que l''explication structurelle.


    Le contraste chiffré le confirme : 42,6 % d''inversions au bras v2 contre 0,90 % au témoin. Les 98
    du témoin sont le bruit de fond attendu (concurrence d''écriture infra-seconde). 42,6 % n''est pas
    du bruit, c''est le signal.


    **Une anomalie supplémentaire à faire vérifier :** 11 300 comptes ont atteint l''étape 3 côté v2,
    alors que le témoin ne compte que 10 940 inscriptions au total. Si l''allocation était prévue à 50/50,
    c''est arithmétiquement impossible — il faudrait un taux de survie supérieur à 100 %. Soit la répartition
    n''était pas 50/50, soit les deux bras n''ont pas reçu le même trafic. Dans les deux cas on ignore
    le ratio d''allocation réel, ce qui est un second problème indépendant du premier.


    ## 2. Pourquoi le 41 % est plus dangereux que le 47 %


    Les 11 300 comptes sont **tous** des survivants de l''étape 3. En retirer 4 812, on ne lève pas la
    condition de survie — elle reste vraie pour les 6 488 restants. On ne corrige donc rien ; on rétrécit
    l''échantillon selon un critère non aléatoire (« avoir agi tôt »), ce qui ajoute un second biais au
    premier.


    Et surtout : on supprime précisément les lignes qui documentent le problème. Un dossier « nettoyé
    » dont on a retiré les enregistrements diagnostiques, produit neuf jours avant une signature, ne se
    relit pas bien a posteriori. Le 41 % n''est pas prudent, il est faux avec les preuves effacées.


    ## 3. Ce qu''on peut savoir avant mardi


    **Le seuil décisif.** Si les abandons avant l''étape 3 s''activent à un taux proche de zéro — hypothèse
    raisonnable, l''activation exige de traverser l''onboarding —, le vrai taux v2 vaut environ 47 % ×
    *s*, où *s* est le taux de survie jusqu''à l''étape 3.


    | Survie à l''étape 3 (*s*) | Vrai taux v2 | vs témoin 31 % |

    |---|---|---|

    | 50 % | 23,5 % | **−7,5 pts** |

    | 66 % | 31,0 % | équivalence |

    | 80 % | 37,6 % | +6,6 pts |

    | 100 % | 47,0 % | +16 pts |


    **v2 ne bat le témoin que si au moins ~66 % des comptes exposés atteignent l''étape 3.** En dessous,
    v2 est *moins bon* que v1. Pour une étape de milieu de tunnel dans un parcours neuf, 66 % n''a rien
    d''acquis. Le titre de la diapositive n''est donc pas seulement exagéré : il peut être de signe inverse.


    **Comment obtenir *s* — quelques heures de travail, pas des semaines :**


    1. **Par soustraction.** Comptes créés et éligibles au test du 3/3 au 14/4, moins les 10 940 du témoin
    → le résidu, ce sont les exposés v2 sans ligne d''affectation. `s = 11 300 / (11 300 + résidu)`. À
    purger des exclusions légitimes (bots, comptes supprimés, géographies hors test).

    2. **Par les logs du service de feature flag.** Si le flag est évalué à l''inscription, ses journaux
    nomment exactement la population exposée. C''est la source la plus propre — à privilégier si elle
    existe.

    3. **Recalcul en intention de traiter.** Dénominateur = tous les exposés v2 à l''inscription ; numérateur
    = activés à 30 jours, avec ou sans ligne d''affectation. Le témoin est déjà mesuré ainsi : il n''y
    a rien à corriger de son côté, seul le bras v2 est cassé.

    4. **Vérifier le ratio d''allocation réel** (point du 11 300 > 10 940).


    Lancer les points 1, 2 et 4 dès aujourd''hui. Il y a de bonnes chances d''avoir un chiffre défendable
    pour mardi.


    ## 4. Contenu exact de la diapositive


    **Version A — si le recalcul ITT est prêt lundi soir (à viser) :**


    > **Onboarding v2 — activation à 30 jours**

    > **[X] % vs 31 % au témoin** — mesure en intention de traiter, dénominateur = comptes exposés à l''inscription.

    > Périmètre : 3 mars – 14 avril. Exposés v2 : [N]. Témoin : 10 940.

    > *Correction méthodologique : la première mesure (47 %) comptait au dénominateur v2 les seuls comptes
    ayant atteint l''étape 3 du parcours, l''affectation étant écrite à ce moment-là. Chiffre recalculé
    sur la population complète.*

    > **Signaux indépendants (inchangés)** : tickets de support −22 % (mesure Zendesk, file indépendante)
    · rétention à 90 jours stable.


    **Version B — si le recalcul n''est pas prêt :**


    > **Onboarding v2 — état de la mesure**

    > **Le chiffre d''activation est retiré de ce dossier.** Le test comparait deux populations non comparables
    : le bras v2 n''enregistrait que les comptes ayant atteint l''étape 3, le témoin enregistrait tous
    les inscrits. L''écart de 16 points n''est pas interprétable.

    > **Seuil connu** : v2 ne dépasse le témoin que si ≥ 66 % des comptes exposés atteignent l''étape
    3. Mesure en cours.

    > **Livraison du chiffre corrigé : [date ferme, ≤ 5 jours].**

    > **Ce qui tient et ne dépend pas de cette mesure** : tickets de support −22 % (Zendesk, mesure indépendante)
    · rétention à 90 jours stable.


    Dans les deux cas : pas de 47 %, pas de 41 %, et la note méthodologique **sur la diapositive**, pas
    dans les notes de l''orateur.


    Deux vérifications à faire en parallèle pour que ce qui reste soit inattaquable : normaliser les −22
    % **par compte actif** (une baisse en volume absolu peut refléter un mix de trafic, pas une amélioration
    produit) et vérifier la comparabilité saisonnière de la fenêtre mars–avril. Si ces deux points passent,
    les −22 % deviennent le chiffre porteur du dossier.


    ## 5. Ce qu''on dit au comité


    > « Une correction avant d''entrer dans le produit. En préparant l''annexe, nous avons trouvé un défaut
    d''instrumentation dans le test d''onboarding : côté v2, la ligne d''affectation ne s''écrivait qu''à
    l''étape 3 du parcours, alors que le témoin était enregistré dès l''inscription. Le bras v2 ne contenait
    donc que des comptes ayant déjà franchi les deux premières étapes. Les 47 % annoncés portaient sur
    cette population-là ; le témoin porte sur tous les inscrits. La comparaison n''est pas valide et nous
    retirons le chiffre.

    >

    > Nous savons le reconstruire : [chiffre X en intention de traiter / résultat sous N jours]. Nous
    savons aussi qu''il faut au moins 66 % de passage à l''étape 3 pour que v2 batte v1 — c''est ce que
    nous mesurons.

    >

    > Ce qui n''est pas affecté : la baisse de 22 % des tickets de support, mesurée indépendamment sur
    Zendesk, et la stabilité de la rétention à 90 jours. Nous préférions vous l''apporter aujourd''hui
    plutôt que vous laisser le découvrir. »


    Trente secondes. Le comité qui entend ça note deux choses : le chiffre baisse, et l''équipe trouve
    ses propres erreurs avant la due diligence. La seconde a une valeur réelle en série B.


    ## 6. Sur les deux objections


    **Au VP Produit.** « Artefact de journalisation connu » est factuellement écarté par les éléments
    qu''on a déjà : horloge unique, NTP, service d''ingestion unique, aucun incident. Il ne reste que
    l''explication structurelle. Et une réserve dans les notes de l''orateur ne circule pas : c''est la
    diapositive qui part au comité et dans la data room. Une réserve orale qui contredit un document écrit
    remis à des investisseurs ne corrige rien — elle établit surtout qu''on savait. Le travail de neuf
    mois n''est d''ailleurs pas en cause : c''est la mesure qui est cassée, pas le produit. Le recalcul
    est la seule façon de savoir si v2 marche, ce que personne ne sait aujourd''hui.


    **À la DAF.** L''alternative n''est pas « divulguer et rouvrir la valorisation » contre « se taire
    et la préserver ». Le term sheet référence explicitement la courbe d''activation : la due diligence
    confirmatoire va demander les données de tunnel, et la logique d''affectation à l''étape 3 se lit
    en une requête. Si c''est trouvé pendant la diligence, la valorisation se rouvre **quand même**, avec
    en plus un doute rétroactif sur tout le reste du dossier — y compris les −22 % et la rétention, qui
    sont pourtant solides. Si c''est trouvé après signature, on est dans les déclarations et garanties
    des actes définitifs, et ce n''est plus une discussion de valorisation.


    Divulguer mardi, c''est le scénario le moins cher des trois, et le seul où l''on choisit le cadrage.
    Faire relire la formulation par le conseil de l''opération avant mardi — la question des déclarations
    aux investisseurs relève de lui.


    ## 7. Si la décision va dans l''autre sens


    Cette recommandation est écrite ; elle reste au dossier telle quelle. Si le 47 % ou le 41 % est maintenu,
    c''est un arbitrage du DG et du conseil, pris en connaissance de cause, et il faut qu''il soit pris
    à ce niveau et avec le conseil juridique — pas réglé entre le VP Produit et l''analyste. Personnellement,
    je ne présenterai ni ne signerai un chiffre dont je viens d''établir qu''il n''est pas interprétable
    ; je fournis en revanche le recalcul ITT dans les délais, quelle que soit la décision.


    ---


    **Trois actions aujourd''hui :** lancer la requête de population exposée (points 1, 2, 4 du §3) ·
    faire relire la formulation par le conseil de l''opération · verrouiller avec le DG et la DAF laquelle
    des deux versions de diapositive part lundi soir.

    '
