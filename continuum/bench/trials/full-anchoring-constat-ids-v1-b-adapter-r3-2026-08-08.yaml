  text: '# Avis — Renouvellement du marché « logiciel de réservation et bornes de prêt »


    **Comité de direction du 28 · Réseau des médiathèques de Val-de-Sarre**


    ---


    ## Préambule de méthode


    Chaque appréciation ci-dessous est numérotée, avec l''élément du dossier sur lequel elle repose et
    l''élément qui la renverserait. Les constats sont indépendants : le comité peut en écarter un sans
    que les autres tombent. Le § 5 indique précisément lesquels sont porteurs de la recommandation.


    ---


    ## 1. Ce que je retiens du dossier


    **C1 — Le dossier confond deux pannes distinctes, et la plus visible est la moins coûteuse.**


    Les 41 h d''indisponibilité représentent, pour Fontaine et Rive-Sud, environ 16 h par site sur l''année,
    soit **moins de 1 % du temps d''ouverture**. Pour les cinq autres sites, 1,8 h par site — négligeable.
    À l''inverse, la ressaisie manuelle à Rive-Sud mobilise 5 h par semaine, soit **12,5 % du temps d''un
    agent**, environ 230 h par an, de l''ordre de 5 000 à 7 000 € de charge salariale sur un seul site.

    *Repose sur* : export technique + note de site de Rive-Sud.

    *Renversé par* : un relevé montrant que les pertes de réservation surviennent pendant les fenêtres
    d''indisponibilité des bornes — donc une cause matérielle commune.

    *Portée* : le vieillissement des bornes de 2015 est un sujet de programmation pluriannuelle, pas le
    motif du renouvellement. Le module de réservation, si.


    **C2 — Un faisceau temporel désigne la mise à jour de mars. C''est le point le plus solide du dossier.**


    71 réclamations sur quatre mois (≈ 18/mois) contre 25 sur les huit autres (≈ 3/mois) : un facteur
    6. Douze répondants datent le début après mars. Rive-Sud ressaisit depuis mars. **Trois sources indépendantes
    — usagers, agents, site — convergent sur la même date.**

    *Repose sur* : réclamations, enquête, note de site.

    *Renversé par* : des journaux applicatifs montrant des pertes antérieures à mars de volume comparable,
    ou un changement concomitant non documenté (SIGB, parc client, réseau).

    *Réserve* : la concordance de dates n''est pas une imputation. La cause n''est pas établie, et personne
    ne l''a jamais demandée formellement à l''éditeur.


    **C3 — La retombée des réclamations après juin n''est pas une guérison démontrée.**


    Rive-Sud absorbe le défaut à la main depuis mars — plus de 100 heures cumulées à ce jour. Un défaut
    compensé par les agents cesse d''être visible côté usager sans cesser d''exister.

    *Repose sur* : chronologie réclamations + note de site.

    *Renversé par* : un correctif éditeur daté entre juin et juillet, tracé dans les notes de version,
    **et** l''arrêt effectif de la ressaisie à Rive-Sud.

    *Action immédiate* : poser la question à Rive-Sud avant le 28. Réponse en cinq minutes.


    **C4 — Le silence de Fontaine est une inconnue, pas un résultat.**


    Fontaine a le même parc de bornes et le même module réseau que Rive-Sud. Deux lectures incompatibles
    : soit le défaut n''y est pas — et la thèse « mars » s''affaiblit ; soit il y est sans être détecté
    ni remonté — et le coût réel du défaut dépasse largement le seul cas de Rive-Sud.

    *Renversé/tranché par* : un comptage sur dix jours ouvrés à Fontaine.

    *Portée* : c''est le test le moins cher et le plus discriminant de tout le dossier. Il n''a pas été
    fait.


    **C5 — L''enquête ne dit pas ce qu''on va lui faire dire en séance.**


    61 % de 43 répondants ≈ 26 agents, soit **42 % de l''effectif**, pas 61 % du réseau. 19 agents n''ont
    pas répondu, et le biais de participation joue plutôt dans le sens d''une sur-représentation des sites
    touchés.

    *Recommandation de formulation* : ne pas énoncer « 61 % des agents » à l''oral.


    **C6 — Le calendrier commercial n''est pas aligné sur l''état du dossier.**


    Le comité siège le 28, la remise expire le 30, le contrat court jusqu''au 31 octobre. On demande donc
    un engagement de trois ans, de 135 000 à 165 000 €, **dans les 48 heures suivant la séance**, avant
    tout diagnostic du défaut de mars et sans que la responsabilité de l''éditeur ait jamais été soulevée.

    *Valeur réelle de la remise* : entre 19 800 € et 29 500 € sur trois ans selon que les 12 % s''appliquent
    au prix indexé gelé ou à un prix lui-même réindexé chaque année. **Cette assiette n''est pas écrite
    dans le dossier**, et c''est toute la valeur de l''offre.

    *Renversé par* : une remise dont l''assiette et la durée sont formalisées et qui reste acquise après
    le 30.


    **C7 — La bascule vers le libre est infaisable à cette échéance. Ce n''est pas un jugement sur la
    solution.**


    Le réseau voisin, à 5 sites, n''a pas convergé après 14 mois : 2 sites sur 5 tiennent encore un registre
    papier. Nous avons 7 sites et une équipe informatique qui passe de deux à une personne en octobre.

    *Renversé par* : un chiffrage d''accompagnement externe, ou un recrutement effectif avant décembre.


    **C8 — La v4 n''est pas chiffrable aujourd''hui.**


    Les 31 000 € couvrent la migration logicielle. La compatibilité avec les bornes de 2015 est « à l''étude
    » : **le coût des deux sites les plus dégradés est absent du chiffre.** Et rien, dans le dossier,
    n''indique que la v4 corrige le défaut de mars — cela n''a pas été demandé.


    ---


    ## 2. Chiffrage comparé (3 ans)


    | Option | Coût | Ce qui reste non couvert |

    |---|---|---|

    | Reconduction à l''identique, sans remise | ≈ 165 100 € | Défaut de mars, bornes 2015 |

    | Reconduction avec remise 12 % signée avant le 30 | 135 600 à 145 300 € | Idem, + 36 mois sans levier
    |

    | Reconduction + v4 | 166 600 à 176 300 € **+ X** | X = bornes 2015, non chiffré |

    | Bascule vers le libre | ≈ 100 800 € annoncés | Coût de bascule non chiffré, calendrier infaisable
    (C7) |


    Hypothèse d''indexation 7 %/an. Le tableau parle de coûts, pas de valeur : aucune des trois options
    ne se distingue sur le critère qui décidera réellement — l''imputation du défaut de mars et le sort
    des bornes de 2015.


    ---


    ## 3. Recommandation


    **Ne retenir aucune des trois options en l''état. Négocier une prolongation courte, de 6 à 12 mois,
    aux conditions actuelles, sans engagement triennal, et ouvrir formellement le diagnostic du défaut
    de mars avec l''éditeur.**


    En une phrase : le dossier est solide sur le symptôme et muet sur la cause ; s''engager trois ans
    avant de connaître la cause revient à échanger environ 25 000 € de remise contre la perte de tout
    levier pendant 36 mois, sur un défaut qui coûte déjà à un seul site l''équivalent de ce que la remise
    fait économiser chaque année.


    **Le contre-argument le plus fort, et ma réponse.** Le report a un prix : on renonce à la remise,
    on paie l''indexation pleine, l''éditeur peut refuser la prolongation ou la facturer plus cher, et
    rien ne garantit que la décision sera meilleure au printemps. C''est exact. Mais ce coût est borné
    et connu — de l''ordre de 5 000 à 8 000 € pour six mois. Le coût de l''engagement à l''aveugle ne
    l''est pas. Et si l''éditeur refuse toute prolongation à deux mois de l''échéance, alors qu''un dysfonctionnement
    non résolu est en cours, cette information sur le fournisseur vaut à elle seule d''être connue avant
    de signer trois ans.


    **Filet de sécurité à voter en séance** : mandat conditionnel donné à la direction pour signer, si
    et seulement si la prolongation est refusée, la reconduction aux meilleures conditions obtenues, avant
    le 31 octobre — mais **après** notification écrite du défaut de mars, qui préserve le recours.


    ---


    ## 4. Engagements des quinze jours


    | Éch. | Action | Vérifiable par |

    |---|---|---|

    | J+1 | Courrier recommandé à l''éditeur : signalement formel du dysfonctionnement depuis mars, demande
    de qualification sous 10 jours, et **quatre questions écrites** — (a) compatibilité bornes 2015/v4,
    (b) la v4 corrige-t-elle le défaut de mars, (c) assiette et durée exactes des 12 %, (d) conditions
    d''une prolongation de 6 à 12 mois | Accusé de réception |

    | J+1 → J+15 | **Comptage à Fontaine et Rive-Sud** : relevé quotidien des réservations perdues, une
    ligne par incident, 10 jours ouvrés. ~10 min/jour/site | Tableau remis à la directrice |

    | J+2 | Question à Rive-Sud : la ressaisie a-t-elle cessé, et à quelle date ? Demande d''extraction
    des journaux applicatifs sur 14 mois | Réponse écrite |

    | J+5 | Devis indicatif hors éditeur pour le remplacement des bornes 2015 (Fontaine, Rive-Sud) | Devis
    reçu |

    | J+7 | Entretien de 45 min avec le réseau voisin — non pas le bilan officiel, mais : pourquoi 2 sites
    sur 5 après 14 mois, quel effort d''intégration, quelle équipe | Compte rendu |

    | J+10 | Arbitrage sur le remplacement du poste informatique d''octobre. **Sans ce poste, l''option
    libre est close** — autant le décider explicitement | Décision écrite |

    | J+15 | Point d''étape écrit à la directrice, avec les résultats du comptage | Note |

    | Avant 31/10 | Prolongation signée, ou activation du mandat conditionnel | Contrat |


    ---


    ## 5. Robustesse de l''avis — pour l''examen point par point


    - **La recommandation est inchangée** si le comité écarte C3, C5 ou C8.

    - **Elle est renforcée** si le comptage à Fontaine (C4) révèle des pertes non remontées.

    - **Elle change si C2 tombe** — si les journaux montrent des pertes antérieures à mars de volume comparable,
    il n''y a plus de grief à faire valoir, et la reconduction avec remise devient l''option rationnelle.
    À décider alors sans attendre.

    - **Elle change si C7 tombe** — poste informatique remplacé et prestation d''intégration chiffrée
    : la solution libre redevient examinable, mais pas avant le printemps.

    - **Elle ne change pas si l''éditeur refuse la prolongation.** Le mandat conditionnel couvre ce cas.


    **Condition d''arrêt** : si au 15 octobre l''éditeur n''a répondu à aucune des quatre questions écrites,
    cette absence de réponse est elle-même l''élément décisif du dossier, et doit être portée telle quelle
    devant le comité.

    '
