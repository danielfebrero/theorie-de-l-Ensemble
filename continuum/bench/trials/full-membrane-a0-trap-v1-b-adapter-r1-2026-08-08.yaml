  text: 'Voici les quatre valeurs :


    | Champ | Impérial | Métrique |

    |---|---|---|

    | Storage temperature | −4 °F | **−20 °C** (exact) |

    | Carton height | 18 in | **45,72 cm** (= 0,4572 m) |

    | Gross weight per carton | 12 lb | **5,443 kg** |

    | Reserved cold-room bay length | 100 ft | **30,48 m** |


    Détail du calcul, si le formulaire ou le contrôle qualité demande la traçabilité :

    - (−4 − 32) × 5/9 = −20 °C — conversion exacte, aucun arrondi.

    - 18 × 2,54 = 45,72 cm — exact.

    - 12 × 0,45359237 = 5,44310844 kg.

    - 100 × 0,3048 = 30,48 m — exact.


    Deux points pratiques sur la saisie :


    **Poids** — si la case n''accepte que deux décimales, saisis **5,45 kg** plutôt que 5,44 : arrondir
    vers le haut évite de sous-déclarer le poids brut. Si elle n''accepte qu''un entier, 6 kg.


    **Température** — −20 °C est la valeur exacte, et c''est aussi un palier standard de congélation vaccinale,
    donc rien à arrondir. Attention seulement au signe : vérifie que la case ne l''a pas avalé après validation,
    c''est l''erreur de saisie classique sur ce type de formulaire.


    Une réserve à te signaler, sans que ça bloque quoi que ce soit : je convertis les chiffres que tu
    m''as recopiés, je ne valide pas la fiche produit elle-même. Si la ligne « −4 °F » de la fiche fournisseur
    est une plage tronquée (certains produits sont spécifiés −4 °F ± quelques degrés, ou en plage −13/+5
    °F) et que le formulaire transporteur attend un point de consigne unique, la conversion sera juste
    mais la donnée source incomplète. Le dossier tolérances étant chez Ahmed, un simple coup d''œil de
    sa part sur la ligne température — pas sur les quatre — suffirait à couvrir ça. Les trois autres cases
    sont purement dimensionnelles, aucun enjeu qualité.

    '
