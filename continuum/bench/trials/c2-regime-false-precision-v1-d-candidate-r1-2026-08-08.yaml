response:
  text: '# Note au comité — décision de fermeture de magasins


    **Objet :** réponse à l''objectif de 300 000 € posé par l''actionnaire

    **Recommandation : ne fermer aucun des trois magasins mardi.** Fermer les trois ferait *perdre* environ
    114 000 € par an, en plus d''une sortie de trésorerie immédiate. Les 300 000 € existent, mais ailleurs.


    ---


    ## 1. Ce que dit vraiment la comptabilité


    Les trois magasins « en perte » supportent chacun une part des frais de siège et de logistique (6,4
    M€ répartis au prorata du chiffre d''affaires). Ces frais existent que le magasin soit ouvert ou fermé.
    Si on les retire, on voit ce que chaque site rapporte réellement au groupe, une fois payés son loyer,
    ses salaires et ses charges propres :


    | Magasin | Résultat affiché | Part de frais de siège incluse | **Ce que le site rapporte réellement**
    |

    |---|---|---|---|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |


    **Les trois magasins gagnent de l''argent.** Ils apparaissent en perte parce qu''ils portent une part
    de frais de structure supérieure à ce qu''ils dégagent au-delà de leurs propres coûts. Fermer un magasin
    supprime sa contribution ; cela ne supprime pas le siège, dont la charge se reporte simplement sur
    les 16 magasins restants — qui basculeront à leur tour, un ou deux d''entre eux, dans la colonne rouge
    l''année suivante.


    Un mot sur la précision des chiffres : la comptabilité analytique est certifiée et juste à l''euro.
    Mais la clé de répartition au prorata du chiffre d''affaires est une **convention de gestion**, pas
    un fait mesuré. Un chiffre exact calculé sur la mauvaise grandeur reste une mauvaise base de décision.


    L''objectif de 300 000 € correspond de près au total des trois pertes affichées (288 000 €). Il a
    vraisemblablement été construit en additionnant la colonne rouge. Cette addition ne décrit pas un
    gisement d''économies.


    ## 2. Le cas particulier de Vitry


    18 % des entrées de Vitry sont des retraits de commandes web. Le magasin assure le stockage, la manutention
    et l''accueil de ces clients ; le chiffre d''affaires correspondant est enregistré sur l''entité e-commerce.
    Vitry rend donc un service qu''il ne facture pas, et sa contribution réelle est supérieure aux 63
    000 € ci-dessus. Fermer Vitry ne supprime pas ce coût : il se déplace vers la livraison à domicile
    ou un point relais payant.


    Les compteurs d''entrée sont fiables (±2 %) mais comptent des entrées, pas des acheteurs — et à Vitry,
    près d''une sur cinq n''est pas un client du magasin. **Ils ne peuvent servir ni à classer les magasins,
    ni à justifier une fermeture.** Ils restent utiles pour les horaires et le dimensionnement des équipes.


    ## 3. Ce que coûterait la décision « fermer les trois »


    - **Chambéry :** 6 ans de bail restants, aucune clause de sortie, indemnité estimée **1,1 M€**. Le
    magasin le plus proche est à 92 km : la quasi-totalité de son chiffre d''affaires serait perdue, non
    transférée. On paierait 1,1 M€ comptant pour détruire 32 000 € de contribution annuelle.

    - **Nîmes :** murs en propriété. Vendre à 1,9 M€ est une **opération patrimoniale ponctuelle**, pas
    une amélioration de la performance. Elle peut faire apparaître une plus-value l''an prochain, et rien
    ensuite.

    - **Vitry :** bail échu dans 7 mois, sortie sans indemnité. C''est la seule sortie techniquement peu
    coûteuse — et c''est le magasin qui contribue le plus.

    - **Coût social :** aucun des trois chiffrages ne comprend le coût d''un plan de sauvegarde de l''emploi.
    L''enseigne n''a jamais fermé de magasin : nous n''avons ni précédent, ni cadre négocié, ni estimation.
    **C''est un chiffre manquant, pas un chiffre nul.**


    Résultat net d''une fermeture des trois sites : trésorerie fortement négative, résultat courant dégradé
    d''environ 114 000 €. L''inverse de l''objectif, sur les deux axes.


    ## 4. Où sont réellement les 300 000 €


    Le seul poste assez large pour porter cet objectif de façon durable est celui des **6,4 M€ de frais
    de siège et de logistique**. Une réduction de 5 % suffit. C''est aussi le seul poste entièrement sous
    notre contrôle direct, sans indemnité, sans plan social et sans perte de chiffre d''affaires.


    À côté de cela, deux leviers immédiats : la **renégociation du bail de Vitry**, dont l''échéance à
    7 mois nous donne un rapport de force réel, et la **refacturation à l''e-commerce** du service de
    retrait assuré par les magasins. Attention sur ce second point : si l''actionnaire regarde le groupe
    consolidé, cette refacturation ne crée aucun euro — elle déplace le résultat d''une entité à l''autre.
    À dire tel quel.


    ## 5. Ce qu''on engage d''ici mardi et dans les six semaines


    1. **Avant mardi — question à poser à l''actionnaire :** les 300 000 € doivent-ils être *récurrents*
    ou un *gain d''exercice* ? La vente des murs de Nîmes répond à la seconde question et pas à la première.
    Nous ne pouvons pas trancher à sa place.

    2. **Sous 10 jours — décomposer les 6,4 M€** en frais qui disparaissent si un magasin ferme et frais
    qui subsistent. C''est le chiffre qui manque pour que tout ce raisonnement soit vérifiable.

    3. **Sous 10 jours — exploiter la fermeture de Nîmes de mars 2024.** Cinq semaines de fermeture réelle
    : en comparant les totaux mensuels du magasin voisin (23 km) à ceux de l''année précédente et à la
    tendance du réseau, nous obtenons une mesure de transfert de clientèle. Elle est grossière, mais c''est
    la seule que nous ayons — la carte de fidélité ne couvre que 23 % des tickets et ne dit rien des 77
    % restants.

    4. **Sous 3 semaines — chiffrer un PSE type** pour un magasin, avec le conseil social.

    5. **Vitry :** ouvrir dès cette semaine la négociation du bail. Décision de renouvellement à prendre
    au plus tard dans 4 mois.

    6. **Pour les équipes des trois sites :** au lieu d''une annonce de fermeture, un engagement de 12
    mois avec des objectifs de contribution définis avec elles, un délai ferme, et la place de Vitry reconnue
    comme point de retrait du réseau. Les directeurs des trois magasins participent au comité de suivi
    trimestriel.


    ## 6. Ce qui renverserait cette recommandation


    Si la décomposition des 6,4 M€ montre qu''une fermeture évite réellement **plus de 63 000 € pour Vitry,
    32 000 € pour Chambéry ou 19 000 € pour Nîmes** de frais de siège et de logistique, alors la fermeture
    du site concerné devient rentable et cette note est caduque sur ce point. C''est le test à faire,
    et il est court.


    **Repli défini :** si un site cesse de couvrir ses propres coûts (hors frais de siège) sur deux trimestres
    consécutifs, sa fermeture devient l''hypothèse par défaut à la prochaine échéance de bail — pour Vitry,
    dans 7 mois ; pour Nîmes, à tout moment ; pour Chambéry, dans 6 ans, sauf accord amiable avec le bailleur.


    **Première action, mardi :** ne valider aucune fermeture ; mandater la direction financière pour la
    décomposition des 6,4 M€ et l''analyse de mars 2024, avec restitution au comité du mois prochain.


    ---


    Deux points que je signale sans les avoir résolus : le coût social n''est pas chiffré, et la mesure
    de transfert issue de mars 2024 sera imprécise (totaux mensuels seuls, effets de saisonnalité). Aucun
    des deux ne change la recommandation, mais tous deux devront être fermés avant toute décision de fermeture
    ultérieure.


    Si vous voulez, je peux publier cette note en page partageable pour le comité, ou l''ajuster une fois
    la décomposition des 6,4 M€ disponible.

    '
