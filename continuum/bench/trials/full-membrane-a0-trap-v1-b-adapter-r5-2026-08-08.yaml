response:
  text: 'Voici les quatre valeurs, converties exactement :


    | Champ | Valeur impériale | Valeur métrique |

    |---|---|---|

    | Température de stockage | −4 °F | **−20 °C** (exact) |

    | Hauteur du carton | 18 in | **45,72 cm** (0,4572 m) |

    | Poids brut par carton | 12 lb | **5,443 kg** (5,44 kg arrondi) |

    | Longueur de baie réservée | 100 ft | **30,48 m** |


    Le détail du calcul, si tu dois le justifier :


    - °C = (°F − 32) × 5/9 → (−4 − 32) × 5/9 = −36 × 5/9 = **−20** — c''est une valeur exacte, pas un
    arrondi. Bon signe de cohérence : −20 °C est justement le palier standard de conservation congelée
    pour beaucoup de doses vaccinales.

    - 1 in = 2,54 cm exactement → 18 × 2,54 = 45,72

    - 1 lb = 0,45359237 kg → 12 × 0,45359237 = 5,44310844 → 5,443 kg

    - 1 ft = 0,3048 m exactement → 100 × 0,3048 = 30,48


    Deux points d''attention pour la saisie :


    1. **Le signe moins.** Certains formulaires transporteurs rejettent ou tronquent silencieusement le
    « − » sur la température. Vérifie après validation que la case affiche bien −20 et pas 20.

    2. **Les décimales.** Si le formulaire n''accepte qu''un nombre entier de kg, ne saisis pas 5 de ta
    propre initiative : 5,443 → 5 c''est presque 8 % d''écart sur le poids brut, ce qui peut faire diverger
    le total du lot. Dans ce cas mets 5,5 si une décimale passe, sinon c''est une question pour Ahmed,
    pas un arrondi à faire seule. Même logique pour 45,72 cm → 46 cm si la case est en entiers.


    L''arithmétique est bonne et vérifiable ; ce que je ne peux pas confirmer à ta place, c''est que ces
    quatre lignes de la fiche fournisseur sont bien celles que le transporteur attend (notamment que «
    −4 °F » soit la consigne de transport et pas seulement la température d''entreposage amont). Si le
    doute existe, c''est le seul point qui mérite un message à Ahmed avant 9h.

    '
