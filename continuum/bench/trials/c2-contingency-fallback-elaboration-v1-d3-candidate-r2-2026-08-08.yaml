response:
  text: '# Plan d''exécution — conversion électrique de la flotte

    **Note de la direction de l''exploitation au conseil — séance de jeudi**


    La commande est ferme, les livraisons sont calées, la subvention est atteignable. Ce document ne revient
    pas là-dessus. Il traite le seul point qui peut faire échouer la mise en œuvre : **entre septembre
    et mars, nous aurons les véhicules avant d''avoir l''électricité et les tournées compatibles.** Le
    plan ci-dessous sécurise les 620 000 € et protège le service pendant cet écart.


    ---


    ## 1. Les cinq décisions attendues jeudi


    | # | Décision | Montant | Pourquoi jeudi |

    |---|---|---|---|

    | 1 | Prolonger la totalité des 96 diesels jusqu''au 31 janvier | 115 200 € | Le préavis de 30 j sur
    le lot de septembre expire fin août. Passé ce point, un véhicule rendu est indisponible 11 semaines.
    |

    | 2 | Commander la tranche 1 de bornes (8 unités, déjà devisée) | 210 000 € | 7 semaines de travaux
    : commande cette semaine = mise en service ~1er octobre. |

    | 3 | Commander une tranche 2a de 8 bornes supplémentaires | ~210 000 € | Sans elle, la capacité de
    charge, pas les livraisons, devient le facteur limitant de la subvention. |

    | 4 | Lancer l''étude de raccordement des deux plateformes | ~15 000 € | Délai le plus long et le
    seul inconnu structurant du dossier. |

    | 5 | Provisionner la tranche 2b (11 bornes) et la prolongation diesel février–juin | ~390 000 € |
    Engagement conditionné aux mesures d''octobre–novembre. |


    **Engagement ferme demandé : 550 000 €. Provision : 390 000 €.**


    ---


    ## 2. Le point dur n''est pas l''autonomie, c''est la puissance de charge


    Ce calcul ne dépend d''aucune hypothèse d''essai. Il ne dépend que de trois chiffres du dossier :
    22 kW, 6 h de charge complète, 168 km de tournée moyenne.


    Une borne de 22 kW restitue en une heure de branchement :

    - **38,7 km** en mi-saison (232 km rendus en 6 h)

    - **32,8 km** par 2 °C avec chauffage (197 km rendus en 6 h)


    Le besoin quotidien de la flotte convertie est de **96 × 168 = 16 128 km**. En fenêtre de charge de
    12 h (retour dépôt 18 h → départ 6 h), la capacité est :


    | Bornes | Capacité par 2 °C | Tournées de 168 km couvertes |

    |---|---|---|

    | **14 (aujourd''hui)** | 5 510 km/j | **33** |

    | **22 (avec tranche 1)** | 8 659 km/j | **52** |

    | **30 (avec tranche 2a)** | 11 808 km/j | **70** |

    | **41 (cible)** | 16 138 km/j | **96** |


    **Conclusion : la conversion complète exige environ 41 bornes de 22 kW, contre 22 prévues.** Les huit
    bornes devisées sont nécessaires et insuffisantes. Avec 22 bornes en janvier, nous plafonnons à ~52
    tournées électriques par jour : les 60 véhicules exigés par la Région seraient immatriculés mais pas
    tous utilisables. La tranche 2a n''est pas du confort, c''est l''assurance de la subvention.


    Deux leviers réduisent la facture et doivent être testés dès octobre :

    - **Élargir la fenêtre de charge** en échelonnant les retours (12 h → 15 h) fait passer la cible de
    41 à ~33 bornes. C''est le levier le moins cher du dossier.

    - **Plafonner la charge à 80 %** sur les tournées courtes accélère la rotation des bornes ; charge
    à 100 % réservée aux tournées longues.


    **À vérifier avant tout engagement de tranche 2b : la puissance souscrite des deux plateformes.**
    41 bornes appellent 902 kW. Si un renforcement de raccordement est nécessaire, son délai — plusieurs
    mois — commande tout le calendrier. C''est la raison de la décision n° 4.


    ---


    ## 3. La queue longue des tournées


    L''essai est clair : les 11 recharges non prévues sur 120 tournées sont **toutes** au-delà de 190
    km. Rapporté à l''autonomie mesurée de 232 km en mars, le point de rupture observé se situe à 82 %
    de l''autonomie du jour. Appliqué aux 197 km mesurés par 2 °C, **le seuil hivernal d''éligibilité
    tombe à environ 160 km — soit en dessous de la tournée moyenne de 168 km.**


    Règle d''affectation retenue :


    | Période | Tournée éligible électrique | Réserve exigée au retour |

    |---|---|---|

    | Sept–oct (> 12 °C) | ≤ 190 km | ≥ 25 % SoC |

    | Nov, mars (5–12 °C) | ≤ 175 km | ≥ 25 % SoC |

    | Déc–févr (< 5 °C) | ≤ 160 km | ≥ 25 % SoC |


    La tournée de 240 km n''est éligible dans aucune configuration. Elle reste diesel ou elle est recoupée.


    **Ce que je ne sais pas encore, et que je saurai avant jeudi :** la distribution réelle des 96 tournées
    par kilométrage. Le superviseur de flotte et le tableau de bord la produisent en 48 h sur l''historique
    diesel. Elle est le pivot du plan : elle dit combien de tournées passent sous 160 km, donc combien
    de diesels doivent rester. Je la présenterai en séance.


    Sur le recoupage : ramener toutes les tournées sous 150 km exigerait de passer de 96 à ~108 tournées
    quotidiennes, soit 12 conducteurs supplémentaires (~540 k€/an). Ce n''est pas la bonne réponse. En
    revanche, **recouper les 10 tournées les plus longues en 15** coûte 5 conducteurs (~225 k€/an) et
    supprime la partie du problème que les bornes ne résolvent pas. À arbitrer en octobre, sur la distribution
    réelle.


    ---


    ## 4. Le levier de réversibilité : le contrat de location


    C''est la seule décision de ce dossier qui n''est pas rattrapable. **Un diesel rendu ne revient pas
    avant 11 semaines** — soit, pour le lot de septembre, une indisponibilité couvrant décembre et janvier.


    L''arbitrage est sans ambiguïté :

    - Prolongation : **480 € par véhicule et par mois**

    - Tournée non terminée : **900 €**


    Un véhicule conservé est amorti dès qu''il évite **une** tournée manquée tous les deux mois. Même
    en lecture prudente de l''essai — en supposant qu''une recharge non prévue sur deux seulement se solde
    par une tournée perdue, soit 4,4 tournées/jour à pleine conversion — le coût du risque est de ~88
    000 €/mois contre 23 000 €/mois d''assurance pour 48 véhicules.


    **Calendrier des préavis (l''épine dorsale du plan) :**


    | Échéance de préavis | Lot concerné | Décision par défaut | Coût |

    |---|---|---|---|

    | **31 août** | Lot 1 (24 véh., reprise fin sept.) | Prolonger 4 mois | 46 080 € |

    | 30 septembre | Lot 2 (reprise fin oct.) | Prolonger 3 mois | 34 560 € |

    | 31 octobre | Lot 3 (reprise fin nov.) | Prolonger 2 mois | 23 040 € |

    | 30 novembre | Lot 4 (reprise fin déc.) | Prolonger 1 mois | 11 520 € |

    | **Total au 31 janvier** | | | **115 200 €** |


    Chaque échéance est un point de sortie : si les mesures sont bonnes, on rend. Si elles sont mauvaises,
    on garde. Le coût du doute est de 480 € ; le coût de l''erreur est de 11 semaines sans véhicule en
    plein hiver.


    *Hypothèse à confirmer avec le loueur avant jeudi : que le calendrier de reprise épouse bien celui
    des livraisons, lot pour lot.*

    *Point à vérifier auprès de la Région avant jeudi : que le texte de la subvention exige 60 véhicules
    électriques en service, et non la restitution des diesels. Si la seconde lecture était la bonne, tout
    l''équilibre du plan change.*


    ---


    ## 5. Déploiement mois par mois


    **Septembre — 24 véhicules, instrumentation.** Réception, immatriculation, formation conducteurs (2
    semaines). Affectation aux 24 tournées les plus courtes. 14 bornes suffisent largement (capacité 39
    tournées en mi-saison). Objectif du mois : construire la courbe consommation/température, pas maximiser
    le déploiement.


    **Octobre — 48 véhicules, tranche 1 en service.** Mise en service des 8 bornes (~1er oct.). Mesure
    des temps de charge réels au retour dépôt. Test de la fenêtre élargie et du plafonnement à 80 %. Arbitrage
    du recoupage des tournées longues. Réponse de l''étude de raccordement : go/no-go tranche 2b.


    **Novembre — 72 véhicules, tranche 2a en service (~15 nov.).** Premières mesures par temps froid :
    le seuil des 160 km est validé ou abaissé. Constitution du dossier de subvention dès que 60 véhicules
    tournent effectivement.


    **Décembre — 96 véhicules livrés, ~70 exploitables.** Le pic de froid arrive avec la flotte complète
    et une capacité de charge encore partielle. C''est le mois le plus exposé : les 96 diesels sont conservés,
    la bascule est pilotée à la tournée, pas au lot.


    **Janvier — dossier de subvention déposé.** Aucune restitution de diesel avant une semaine complète
    de froid validée.


    **Février–juin — décroissance du parc diesel** au rythme des tranches de bornes, un lot rendu par
    mise en service confirmée.


    ---


    ## 6. Pilotage : ce qu''on mesure et ce qui déclenche le repli


    Les données existent déjà — remontée toutes les 10 minutes, tableau de bord publié chaque soir. Trois
    indicateurs sont ajoutés au tableau existant, par plateforme :


    1. **SoC minimum observé** sur chaque tournée électrique (marge résiduelle réelle)

    2. **Taux d''occupation des bornes** par créneau

    3. **Écart entre consommation prévue par le modèle et consommée réelle**, par tranche de température


    **Déclencheurs de repli, armés sur l''option retenue :**


    | Signal observable | Action, sous 24 h |

    |---|---|

    | Taux de tournées électriques terminées < 98 % sur 3 jours consécutifs, ou > 3 recharges non prévues/jour
    | Abaisser le seuil kilométrique de 20 km ; les tournées marginales repassent au diesel |

    | SoC médian au retour < 15 % sur une semaine | Idem, et recalcul de la courbe |

    | Disponibilité des bornes < 90 % | Activation du contrat de charge de secours (à négocier en octobre,
    site partenaire) |

    | Délai de raccordement annoncé > 6 mois | Tranche 2b suspendue ; retour au conseil avec solution
    tampon ou maintien diesel sur la queue longue |

    | **Au 15 décembre, moins de 45 véhicules chargeables par nuit** | **Gel total des restitutions diesel
    et information de la Région** |


    Le repli n''existe que parce que les diesels sont là. C''est le sens de la décision n° 1.


    ---


    ## 7. Gouvernance : qui décide du seuil


    La note du responsable transport est arrivée hier, sur un dossier voté le 4 mai. Elle est l''information
    la plus utile du dossier. Le plan est perdu si ce type de signal continue de remonter avec trois mois
    de retard.


    Je propose un **comité hebdomadaire d''affectation** — responsable transport, deux représentants des
    conducteurs, responsable de plateforme — doté d''un pouvoir réel et non consultatif : **il fixe le
    seuil kilométrique de la semaine et peut basculer une tournée du électrique vers le diesel sans arbitrage
    de ma part.** Le recoupage des tournées modifie les horaires et les rémunérations ; il ne se décidera
    pas contre ceux qui les conduisent. Coût : nul. Contrepartie : le comité rend compte de chaque bascule
    au tableau de bord du soir.


    ---


    ## 8. Le meilleur argument contre ce plan


    *« Vous engagez 550 000 € sur la foi d''un essai de six véhicules pendant trois semaines. Les 197
    km sont une mesure unique. Une gestion disciplinée de la charge et un recoupage des tournées absorberaient
    l''essentiel sans seconde tranche de bornes. Vous surassurez et vous détruisez le cas économique voté
    par le conseil. »*


    Il est partiellement fondé, et voici où il s''arrête.


    Ce qui est effectivement incertain, c''est **la courbe d''autonomie** : six véhicules, trois semaines,
    une mesure de froid. Toute la partie « seuil à 160 km » et une part de la prolongation diesel reposent
    dessus, et se dégonfleront si les mesures sont bonnes. C''est pourquoi la prolongation est structurée
    en préavis mensuels et non en engagement ferme.


    Ce qui n''est **pas** incertain, c''est **l''arithmétique de charge** : 14 bornes × 12 h × 32,8 km
    ne peuvent pas produire 16 128 km. Le rapport est de 1 à 3, il ne dépend d''aucun essai, et aucune
    discipline d''exploitation ne le comble. Sur ce point l''argument ne tient pas.


    Où il mord réellement : je ne dois pas engager la tranche 2b avant la réponse de l''étude de raccordement
    et avant le test de la fenêtre élargie, qui peut ramener la cible de 41 à 33 bornes. C''est exactement
    pourquoi elle est en provision et non en engagement.


    **L''observation qui renverserait ce plan :** si les mesures d''octobre–novembre établissent une autonomie
    réelle en charge ≥ 220 km à 5 °C, le seuil remonte vers 185 km, la grande majorité des tournées devient
    éligible, et la tranche 2b comme les deux tiers de la prolongation diesel deviennent inutiles. Symétriquement,
    une autonomie mesurée < 180 km à 5 °C fait tomber le seuil sous 150 km et impose de maintenir un parc
    diesel significatif jusqu''en 2027 — auquel cas je reviendrai devant le conseil avec un plan révisé,
    pas avec un dépassement.


    ---


    ## 9. Ce que ça coûte, ce que ça protège


    | Poste | Montant | Statut |

    |---|---|---|

    | Bornes tranche 1 (8) | 210 000 € | Ferme |

    | Bornes tranche 2a (8) | ~210 000 € | Ferme |

    | Étude de raccordement | ~15 000 € | Ferme |

    | Prolongation diesel au 31 janvier | 115 200 € | Ferme, sortie mensuelle possible |

    | **Sous-total engagé** | **~550 000 €** | |

    | Bornes tranche 2b (11) | ~290 000 € | Provision, conditionnée |

    | Prolongation diesel févr.–juin | ~100 000 € | Provision, décroissante |

    | **Total plafond** | **~940 000 €** | |


    En regard : **620 000 € de subvention sécurisés**, et un risque de service évité de l''ordre de **90
    000 € par mois** en lecture prudente de l''essai, au-delà de 800 000 € par mois si la totalité des
    tournées non couvertes échouait.


    **Le pire cas de ce plan** : nous dépensons ~200 000 € d''assurance diesel qui se révèle inutile parce
    que les véhicules tiennent mieux que mesuré. Il est encaissé par le compte d''exploitation, il est
    visible, il est borné, et il se referme mois par mois.


    **Le pire cas du plan sans assurance** : en janvier, 96 véhicules livrés, 22 bornes, un seuil à 160
    km, et aucun diesel récupérable avant onze semaines. Il est encaissé par nos clients, et ce n''est
    pas une ligne du compte d''exploitation qu''on rouvre au printemps.


    ---


    ## 10. Première action


    **Lundi matin, avant toute autre chose : notification écrite au loueur de la prolongation du lot de
    septembre.** Le préavis de 30 jours court, la décision est réversible au mois suivant pour 11 520
    €, et c''est la seule action du plan dont le report a un coût irrattrapable.


    En parallèle, d''ici jeudi : distribution kilométrique réelle des 96 tournées (48 h, données existantes),
    confirmation du calendrier de reprise auprès du loueur, et lecture exacte du texte de la subvention
    régionale. Ces trois éléments seront joints en séance.


    ---


    *Si vous le souhaitez, je peux mettre ce plan en page dans un document partageable pour la diffusion
    aux administrateurs, et produire la distribution kilométrique sous forme d''histogramme dès que les
    données du superviseur sont extraites.*

    '
