response:
  text: '# Note au conseil — séance de jeudi


    **Recommandation : A maintenu à titre conservatoire, B ajournée, C rejetée. Et surtout : la vraie
    décision de jeudi n''est aucune des trois.**


    ---


    ## 1. Le point qui déclasse tout le reste : la fenêtre de transfert se ferme dans ~18 mois, pas dans
    9 ans


    L''Union mutualiste de l''Atlantique n''accepte pas de dossier dont la réserve est inférieure à **trois
    années de prestations**. Aujourd''hui : 5,4 × 3 = **16,2 M€** exigés, réserve **18,4 M€**, soit un
    ratio de **3,41 années**. Nous sommes éligibles — de justesse.


    Projection de ce ratio, prestations à +4,3 %/an, réserve placée à +1,8 % :


    | Fin d''année | Réserve | Prestations | Ratio |

    |---|---|---|---|

    | 0 (aujourd''hui) | 18,4 | 5,4 | **3,41** |

    | 1 | 17,7 | 5,63 | **3,15** |

    | 2 | 16,8 | 5,87 | **2,86** ❌ |

    | 3 | 15,6 | 6,13 | 2,55 |


    **Nous sortons du critère d''éligibilité au cours de la deuxième année.** Or le comité d''engagement
    de l''Union instruit en **12 à 18 mois**.


    Conclusion arithmétique, pas d''opinion : si le dossier n''est pas déposé dans les prochaines semaines,
    l''option de transfert n''existera plus — quelle que soit l''option de placement retenue jeudi. Le
    seul actif réellement stratégique de cette caisse n''est pas son rendement, c''est **son ticket de
    sortie ordonnée**, et il est périssable.


    **Question à poser à l''Union dès lundi, par écrit :** le critère des trois années s''apprécie-t-il
    au dépôt ou à la clôture ? Si c''est à la clôture, nous sommes déjà hors des clous à l''horizon d''instruction,
    et cela change la nature de toute la séance. Je ne connais pas la réponse ; c''est l''information
    la moins chère et la plus décisive que nous puissions acheter cette semaine.


    ## 2. La projection interne à 9 ans repose sur une hausse de cotisations que l''AG a refusée


    J''ai refait le calcul. Avec des cotisations **effectivement figées à 4,4 M€** (ce qu''est le statu
    quo, puisque l''AG a rejeté les +6 % en 2024), la réserve franchit 11 M€ **en année 6**, pas en année
    9.


    Les 9 ans ne se retrouvent qu''en supposant les cotisations indexées à +4,3 %/an — c''est-à-dire en
    supposant acquise, chaque année, une hausse comparable à celle qui a été refusée. **La projection
    « statu quo » n''est pas un statu quo.** Elle a été présentée au conseil comme le scénario de référence
    ; elle est le scénario favorable.


    Je demande la note actuarielle et ses hypothèses avant le vote. Si ma lecture est confirmée, le conseil
    délibère depuis deux ans sur un horizon surestimé de 50 %.


    ## 3. Le diagnostic que le trésorier pose est juste ; le remède est un contresens


    Le trésorier a raison sur un point capital, et il faut le dire au conseil : **B seule ne referme pas
    l''écart.** Il en tire que le pari doit être plus gros. La conclusion correcte est l''inverse : **aucune
    allocation d''actifs ne referme cet écart**, parce que l''écart n''est pas un problème de rendement.


    Cotisations 4,4 M€ contre prestations 5,4 M€ croissant de 4,3 %/an : c''est un déficit d''exploitation
    de 1,0 M€ qui atteint 2,3 M€ en année 6. Combler cela par le rendement d''une base de 18,4 M€ exige
    5,4 % net dès l''an prochain, sur une base qui décroît pendant que le besoin croît. C''est une course
    perdue par construction. **Nous n''avons pas un problème de placement, nous avons un problème de tarification
    et de périmètre.** Chercher la solution du côté de l''actif, c''est traiter une insuffisance de cotisation
    par un levier de marché — le mécanisme classique par lequel une mutuelle sous-tarifée se liquide plus
    vite qu''elle n''aurait dérivé.


    ---


    ## 4. Traitement de chacune des trois options


    ### C — Rejet. Ce n''est pas un arbitrage rendement/risque, c''est une erreur de nature.


    **a) C provoque une rupture de liquidité quasi certaine, indépendamment de la performance de la note.**

    14,4 M€ bloqués 7 ans laissent **4,0 M€ disponibles**. Le déficit cumulé sur les quatre premières
    années est de 1,0 + 1,23 + 1,47 + 1,73 = **5,4 M€**. Les liquidités sont épuisées **en cours d''année
    4**, sans sortie anticipée possible. Nous serions alors incapables de payer les prestations tout en
    affichant un actif de 14 M€ inaccessible.


    Cela ne vaut que si la note capitalise. Si elle distribue un coupon en numéraire (14 % × 14,4 = 2,0
    M€/an), le déficit est couvert jusqu''à ce que les prestations dépassent 6,4 M€, soit **l''année 5**
    — après quoi le problème réapparaît, toujours sans possibilité de sortie. **Cette ambiguïté n''a pas
    été levée dans la note du trésorier, et elle détermine si l''option est mauvaise ou catastrophique.**
    Un conseil ne vote pas 78 % de sa réserve sur un instrument dont il n''a pas établi s''il verse des
    flux.


    **b) Les 3 % ne mesurent pas ce que le conseil croit qu''ils mesurent.**

    3 % est la probabilité de **défaut de l''émetteur**, communiquée par l''émetteur. Une note structurée
    peut perdre l''essentiel de son capital **sans aucun défaut**, par le seul jeu de son sous-jacent
    et de ses barrières, l''émetteur restant A−. Un rendement affiché de 14 % sur signature A− n''est
    pas une prime de crédit — c''est la rémunération d''un risque de marché intégré, qui ne figure nulle
    part dans la distribution présentée. La table à trois branches qu''on nous soumet omet le risque principal
    de l''instrument. Je ne peux pas chiffrer la vraie queue ; je peux affirmer qu''elle est supérieure
    à 3 % et qu''elle n''est pas documentée.


    **c) « Deux caisses comparables ont souscrit l''an dernier » n''est pas une preuve.**

    Sur une note à 7 ans détenue depuis un an, aucun résultat n''a été observé. Cet argument n''apporte
    aucune information sur l''issue — il apporte en revanche une information sur le **risque de corrélation**
    : si la note échoue, elle échoue simultanément chez trois mutuelles de même profil, ce qui supprime
    aussi tout secours confraternel.


    **d) La branche à 3 % n''est pas un mauvais tirage, c''est une absorption.**

    Récupération à 5 % du nominal → réserve résiduelle **4,7 M€**, liquidités déjà consommées → **liquidation
    de plein droit**, automatique, non discrétionnaire. Le conseil ne peut pas la piloter, il la subit.
    Et derrière la liquidation : 4 200 affiliés, 61 ans de moyenne d''âge, forte exposition amiante, **qu''aucun
    assureur du marché n''a accepté de coter en 2025**. Ils ne se réassurent nulle part. Ils ne se recouvrent
    pas.


    C''est là que le raisonnement du trésorier se rompt. « C domine B dans 94 % des trajectoires » est
    vrai et hors sujet : la métrique de dominance moyenne suppose que le joueur reste à la table dans
    toutes les branches. Ici, une branche **retire le joueur définitivement**. Une espérance ne s''additionne
    pas à travers un état absorbant. Un pari à 1 chance sur 33 de priver 4 200 personnes malades de la
    seule couverture qu''elles puissent obtenir n''est pas « du bruit statistique » : c''est le seul chiffre
    de la note qui compte, et il est probablement sous-estimé.


    **e) Un point de droit à trancher avant le vote, pas après.**

    Souscrire 78 % de la réserve sur un émetteur unique, non coté et illiquide se heurte presque certainement
    à une limite de dispersion et de liquidité, statutaire ou prudentielle. **Je demande un avis écrit
    du conseiller juridique avant la séance.** Si la limite existe, le débat de jeudi est sans objet et
    le vote serait irrégulier.


    ### B — Ajournée, pas rejetée sur le fond.


    B ne menace pas la survie de la caisse : le pire décile ramène la réserve à 15,8 M€, très au-dessus
    du seuil de 11 M€. Ce n''est pas de la ruine, c''est de la variance, et la variance ne mérite pas
    un veto.


    Mais elle détruit exactement ce que la section 1 identifie comme notre seul actif stratégique : **15,8
    M€ = 2,93 années de prestations**, soit **sous le critère d''éligibilité de l''Union**. B, dans son
    décile défavorable, ne nous coûte pas 2,6 M€ : elle nous coûte l''option de transfert, au moment précis
    où le dossier est en instruction.


    D''où la position : **pas de diversification tant que le dossier de transfert est ouvert.** B redevient
    discutable — et probablement souhaitable — dès que l''Union a répondu, dans un sens ou dans l''autre.
    Ce n''est pas un refus de principe du risque, c''est un ordre de séquence.


    ### A — Retenue par défaut, mais reformulée honnêtement.


    A n''est pas une stratégie. C''est un **régime de conservation à 12–18 mois**, dont le seul but est
    de maintenir la réserve liquide et au-dessus de 16,2 M€ pendant l''instruction du transfert. Présentée
    comme une stratégie à 9 ans, A est effectivement une mort lente ; présentée comme la préservation
    d''un ticket de sortie qui expire, c''est la seule option compatible avec la décision réelle.


    Je ne demande pas au conseil de choisir A. Je lui demande de ne pas dépenser la réserve pendant les
    18 mois où elle sert de prix d''entrée.


    ---


    ## 5. Ce sur quoi j''engage la caisse


    1. **Cette semaine** — Prise de contact écrite avec l''Union mutualiste de l''Atlantique : confirmation
    du critère des trois années (au dépôt ou à la clôture ?), liste des pièces, calendrier réel du comité
    d''engagement. Dépôt du dossier sous 60 jours, mandat au directeur avec compte rendu à chaque conseil.

    2. **Avant jeudi** — Production de la note actuarielle et de ses hypothèses de cotisations. Communication
    au conseil de l''horizon à cotisations réellement figées (≈ 6 ans), à côté des 9 ans.

    3. **Avant jeudi** — Avis juridique écrit sur la licéité d''une exposition de 78 % à un émetteur unique
    non coté ; et, si C reste au vote, obtention du prospectus complet de la note, du sous-jacent et des
    barrières de capital. Aucun vote sur une distribution communiquée par le vendeur.

    4. **Plancher de réserve opposable** — Décision de conseil : aucune allocation susceptible de porter
    la réserve sous **3 années de prestations glissantes** (16,2 M€ aujourd''hui, réévalué chaque année)
    tant que le dossier de transfert est ouvert. Déclencheur observable, vérifiable en séance, qui interdit
    mécaniquement C et suspend B.

    5. **AG extraordinaire dans les 90 jours** — Et sur un mandat différent de 2024. L''AG a refusé +6
    % parce qu''on lui a demandé un effort sans lui montrer l''alternative. Je propose de lui présenter
    le franchissement du seuil de liquidation à 6 ans, l''impossibilité de se recouvrir ailleurs, et la
    fenêtre de transfert. Résorber l''écart suppose à terme **+23 %** de cotisations ; en un seul vote,
    c''est un refus assuré. Je propose un dispositif progressif : indexation automatique sur la dérive
    des prestations, rattrapage échelonné sur trois exercices, **modulation selon les revenus** pour que
    l''effort ne tombe pas sur les affiliés les plus fragiles, et — c''est la contrepartie qui doit être
    réelle — **deux sièges d''affiliés avec voix délibérative au comité de suivi du transfert**, plus
    un engagement de restitution si le transfert aboutit à des conditions meilleures que prévu. On ne
    demande pas un sacrifice sans transférer un pouvoir effectif ; une simple consultation ne suffira
    pas et ne mérite pas de passer.

    6. **Placements** — Maintien intégral en obligations d''État, échéancier calé sur les décaissements.
    Revue de l''allocation dans 18 mois ou à la réponse de l''Union, selon le premier des deux.


    ## 6. Ce qui me ferait changer d''avis


    - **L''Union confirme par écrit que le critère des trois années n''est pas ferme, ou qu''elle refuse
    le dossier.** Alors l''option de sortie ordonnée n''existe pas, la contrainte de liquidité tombe,
    et B redevient immédiatement recevable — voire nécessaire.

    - **Le prospectus établit que la note verse un coupon en numéraire, qu''elle est cessible ou collatéralisée,
    et qu''aucune barrière ne peut entamer le capital hors défaut.** Cela ferait passer C de « défaillance
    de trésorerie programmée » à « risque de concentration ordinaire ». Mon avis resterait négatif — 78
    % sur un émetteur unique reste indéfendable pour une caisse sans réassureur — mais l''argument changerait
    de registre.

    - **Un rapport indépendant montrant que la vraie queue de perte de l''instrument est bien de 3 %,
    tous mécanismes confondus.** Je n''y crois pas, mais c''est réfutable et c''est à l''émetteur d''en
    faire la démonstration.


    ## 7. Le meilleur argument contre ma position


    Le voici, sans l''affaiblir : *« Vous refusez le seul scénario qui referme l''écart et vous le remplacez
    par une demande à l''Union qui peut être refusée et une hausse de cotisations que l''AG a déjà rejetée.
    Dans 18 mois, si les deux échouent, la réserve sera à 16,8 M€ et toutes les options seront pires.
    Vous n''avez pas de plan, vous avez deux espoirs. »*


    C''est exact sur les faits et je ne le conteste pas. Ma réponse tient en deux points.


    D''abord, ces 18 mois ne sont pas passifs : ils **achètent l''information qui manque à la décision**.
    Nous ignorons aujourd''hui si l''Union prend le dossier et si l''AG peut être retournée face à un
    horizon de 6 ans. Ces deux réponses coûtent peu, arrivent vite, et déterminent entièrement le bon
    choix. Engager 78 % de la réserve avant de les avoir, c''est décider en se privant volontairement
    de ce qui aurait tranché.


    Ensuite, les deux chemins n''échouent pas de la même façon. Le mien échoue sur une caisse plus petite,
    encore liquide, qui négocie une reprise dégradée ou organise une extinction ordonnée en prévenant
    ses affiliés à temps. C échoue sur 4 200 personnes exposées à l''amiante, sans couverture, sans préavis,
    et sans marché où se réassurer. Quand les issues d''un pari sont asymétriques à ce point, la question
    n''est pas laquelle a la meilleure espérance : c''est laquelle nous avons le droit de faire courir
    à des gens qui ne l''ont pas choisie et ne peuvent pas s''en relever.


    ## 8. Ce que je demande au conseil de consigner au procès-verbal


    Que le vote sur C, quel qu''en soit le sens, soit **nominatif**, et qu''y figure la mention explicite
    qu''aucun assureur du marché n''a accepté de coter ce portefeuille en 2025 — c''est-à-dire qu''en
    cas de liquidation, les affiliés n''ont aucun recours de couverture. Les administrateurs d''une mutuelle
    engagent la santé d''autrui, pas leur propre patrimoine. Le procès-verbal doit refléter qu''ils en
    ont été informés avant de voter.


    Je précise une chose au conseil sans détour : **si C est adoptée jeudi, je demande que mon opposition
    soit portée au procès-verbal.**

    '
