response:
  text: '# NOTE AU COMITÉ DE DIRECTION


    **Objet :** fermetures de magasins — recommandation · **Séance :** mardi


    ## En une phrase


    **Nous ne fermons aucun magasin mardi.** Les trois magasins « en perte » rapportent en réalité **114
    000 € par an** au groupe : les fermer nous éloignerait de l''objectif de 300 000 € au lieu de nous
    en rapprocher. Une seule décision est urgente — le congé du bail de Vitry — et elle doit être prise
    sous 30 jours, sur la base d''un chiffrage que nous n''avons pas encore.


    ## 1. Les trois magasins ne perdent pas d''argent


    Le résultat par magasin inclut une quote-part des frais de siège et de logistique, répartie au prorata
    du chiffre d''affaires. Cette quote-part n''est pas une dépense du magasin : c''est une part d''une
    facture de 6,4 M€ que le groupe paie de toute façon. **Si le magasin ferme, la facture reste** — elle
    est simplement répartie sur les autres.


    | Magasin | Résultat affiché | Dont quote-part de siège | Ce que le magasin rapporte réellement |

    |---|---:|---:|---:|

    | Vitry | − 118 000 € | 181 000 € | **+ 63 000 €** |

    | Chambéry | − 96 000 € | 128 000 € | **+ 32 000 €** |

    | Nîmes | − 74 000 € | 93 000 € | **+ 19 000 €** |

    | **Total** | **− 288 000 €** | **402 000 €** | **+ 114 000 €** |


    Chacun des trois couvre son loyer, ses salaires et ses charges propres, et laisse encore de l''argent
    pour payer le siège. Vitry, le « pire » magasin du réseau, est celui qui contribue le plus des trois.


    ## 2. Ce que coûterait la fermeture des trois


    L''addition tentante : − 288 000 € supprimés, soit presque les 300 000 € demandés. C''est une illusion
    d''écriture comptable. Le coût réel, première année :


    - **− 114 000 €** de résultat (la contribution qu''on supprime), hors report de ventes ;

    - **1,1 M€** d''indemnité de résiliation à Chambéry, en trésorerie ;

    - le coût d''un **premier plan social** sur 50 à 60 personnes, aujourd''hui non chiffré.


    Et un effet différé qu''il faut nommer : les **402 000 €** de frais de siège se reportent sur les
    16 magasins restants, soit environ **25 000 € de charge supplémentaire chacun**. Tout magasin gagnant
    aujourd''hui moins de 25 000 € basculera en négatif. Le prochain comité aura une nouvelle liste de
    magasins « en perte ». C''est un engrenage, pas un plan.


    ## 3. Le seul critère qui rendrait une fermeture rentable


    Une fermeture crée de la valeur uniquement si les frais de siège affectés **disparaissent réellement**
    avec le magasin. Les seuils sont calculables :


    - **Vitry** : il faudrait que plus de **35 %** des 181 000 € s''évaporent avec le magasin ;

    - **Chambéry** : plus de **25 %** des 128 000 € — sans rembourser pour autant les 1,1 M€ ;

    - **Nîmes** : plus de **20 %** des 93 000 €.


    Personne dans l''entreprise ne sait répondre à cette question aujourd''hui. C''est le premier chantier.


    ## 4. Où sont réellement les 300 000 €


    Pas dans les magasins. Trois gisements, tous plus grands que les fermetures envisagées :


    - **Les 6,4 M€ de siège et de logistique.** L''objectif y représente 4,7 %.

    - **Le e-commerce.** 18 % des entrées de Vitry sont des retraits web : le magasin paie le personnel,
    le mètre carré et le temps d''attente, l''entité e-commerce encaisse le chiffre d''affaires. Transfert
    interne jamais facturé. Chiffrable en 30 jours.

    - **Les murs de Nîmes.** 1,9 M€ immobilisés qui produisent 19 000 € par an, soit 1 % de rendement.
    C''est le vrai sujet de Nîmes — immobilier, pas commercial.


    ## 5. Les trois dossiers


    **Vitry** — + 63 000 €, sortie sans indemnité à l''échéance, magasin du réseau à 14 km. Seul dossier
    où une fermeture peut être défendable : elle ne coûte rien et un report de ventes est physiquement
    possible. **Urgence :** un congé de bail se donne généralement six mois avant l''échéance. Si c''est
    notre cas, la fenêtre se referme dans un mois, pas dans sept. Vérification juridique cette semaine,
    et en parallèle négociation d''un bail court avec clause de sortie : cela conserve les deux options
    au lieu d''en perdre une par défaut.


    **Chambéry** — + 32 000 €, indemnité 1,1 M€, magasin le plus proche à 92 km : aucun report, la clientèle
    est perdue. Payer 1,1 M€ pour supprimer 32 000 € de contribution. **À écarter.** Le levier est le
    loyer, pas la porte.


    **Nîmes** — + 19 000 €, murs en propriété. Instruire la question immobilière séparément et sans engagement
    : un magasin peut être médiocre et l''actif excellent. Les 1,9 M€ sont une estimation, pas une offre.


    ## 6. Ce qu''on n''utilisera pas pour décider


    **Les compteurs d''entrée.** Fiables (± 2 %, pas de trente minutes, 24 mois) mais ils comptent des
    entrées, pas des acheteurs — et à Vitry 18 % sont des retraits web sans chiffre d''affaires magasin.
    Tout classement au « chiffre d''affaires par visiteur » pénalise Vitry mécaniquement. À corriger avant
    tout usage.


    ## 7. Ce que nous engageons dès mardi


    | Échéance | Chantier | Responsable |

    |---|---|---|

    | **J+7** | Vitry : délai de congé, conclusion juridique ferme | Juridique |

    | **J+15** | Répartition des 6,4 M€ en **évitable / non évitable**, par magasin | DAF |

    | **J+30** | Chiffrage du transfert e-commerce → magasins, facturation interne | DAF + e-commerce
    |

    | **J+30** | Estimation du report de ventes via mars 2024 (Nîmes fermé 5 semaines) | Contrôle de gestion
    |

    | **J+30** | **Comité : décision Vitry** | Comité |

    | **J+45** | Croisement carte de fidélité Vitry ↔ magasin à 14 km | Marketing |

    | **J+45** | Test de marché des murs de Nîmes, mandat exploratoire | Immobilier |

    | **J+90** | **Comité : décision Nîmes + plan de 300 000 € documenté** | Comité |


    Deux réserves à garder en tête en lisant les résultats. **Mars 2024** est la seule fermeture jamais
    observée : seuls les totaux mensuels des voisins ont été conservés, l''estimation sera grossière,
    et une fermeture temporaire annoncée fait patienter les clients là où une fermeture définitive les
    déplace — le chiffre obtenu est un **plancher**. **La carte de fidélité** ne couvre que 23 % des tickets
    et ses porteurs sont les clients les plus mobiles (41 % multi-magasins) : elle donne un **maximum**
    de report, pas une prévision.


    ## 8. L''objection la plus forte


    > « Vous repoussez. L''actionnaire veut 300 000 € l''an prochain, les plans d''économies de siège
    échouent toujours, une fermeture est certaine et visible. »


    Une fermeture est effectivement certaine — certainement négative : − 114 000 € de résultat dès la
    première année et 1,1 M€ de trésorerie. Nous ne proposons pas d''attendre : 90 jours pour trois chiffrages
    qui n''existent pas, dont deux livrés en 30 jours, et une décision Vitry rendue avant que sa fenêtre
    se referme.


    ## Ce qui nous ferait changer d''avis


    Si le chantier J+15 établit que **plus de 35 %** des frais de siège affectés à Vitry disparaissent
    réellement avec le magasin, et que le site à 14 km peut absorber une part significative des ventes,
    **alors Vitry ferme** — à l''échéance du bail, sans indemnité, avec un report organisé. Nous le saurons
    à temps. Aucun autre scénario de fermeture ne passe ce test en l''état.


    ---


    Deux points sur lesquels je n''ai pas pu trancher, et que la note assume explicitement : le **délai
    de congé du bail de Vitry** (j''ai retenu l''hypothèse standard de six mois, ce qui rendrait le dossier
    urgent — à faire confirmer avant mardi, c''est le seul élément qui peut périmer), et la **part réellement
    évitable des 6,4 M€**, qui est l''inconnue dont dépend toute la décision. Le fichier de la note vous
    a été transmis.

    '
