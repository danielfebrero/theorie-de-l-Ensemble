  text: 'Ma décision tient dans un chiffre : à +18 % de volume, la remise de 9 % **détruit** de la marge.
    Le point mort est à +41 % de volume, ou à 4,7 % de remise. Le reste de la note en découle.


    ---


    # NOTE DE DIRECTION GÉNÉRALE — MANDAT EXÉCUTOIRE


    **De :** Direction générale

    **À :** Comité de direction (DAF, DC, DI, DRH)

    **Date :** 8 août 2026

    **Objet :** Offre d''exclusivité du distributeur D — décision, enveloppe de signature et plan d''exécution
    jusqu''au 31 août


    **Portée.** Je suis injoignable du 9 au 30 août. Cette note n''est pas un avis, c''est un mandat.
    Elle définit ce que vous êtes autorisés à signer, ce que vous ne l''êtes pas, et ce qui se passe si
    vous n''êtes pas d''accord entre vous. Aucune décision hors de cette enveloppe n''engage l''entreprise.
    En cas de doute d''interprétation, la clause applicable est celle qui ne signe pas.


    ---


    ## 1. Décision


    **Nous ne signons pas l''offre telle qu''elle est présentée.**

    **Nous adressons à D, dès le lundi 10 août, une contre-proposition signable avant le 16 août.**


    Ce n''est pas un refus de D. C''est un refus de ces termes-là. La différence doit être visible dans
    chacun de nos écrits.


    ## 2. Les chiffres qui fondent cette décision


    Périmètre D actuel : 14,9 M€ de CA, 31 % de marge brute, soit **4,62 M€ de marge brute** et 10,28
    M€ de coûts variables.


    | Scénario | CA D | Coûts variables | Marge brute | Écart |

    |---|---|---|---|---|

    | Aujourd''hui | 14,90 M€ | 10,28 M€ | **4,62 M€** | — |

    | Offre D (+18 % volume, −9 % prix) | 16,00 M€ | 12,13 M€ | **3,87 M€** | **−0,75 M€/an** |

    | Neutralité à −9 % de remise | 19,12 M€ | 14,50 M€ | 4,62 M€ | 0 (exige **+41 %** de volume) |

    | Neutralité à +18 % de volume | 16,75 M€ | 12,13 M€ | 4,62 M€ | 0 (exige remise **≤ 4,7 %**) |


    Trois conséquences à retenir et à opposer à quiconque nous parlera de croissance :


    1. **Le CA monte de 1,1 M€ et la marge brute baisse de 0,75 M€.** Le taux passe de 31 % à 24,2 %.
    Nous produirions 18 % de volume en plus pour gagner moins.

    2. **Le +18 % consomme du cash avant d''en rapporter** : de l''ordre de 0,3 à 0,4 M€ de BFR supplémentaire,
    à financer sur 2,1 M€ de trésorerie.

    3. **DAF, avant le 12 août** : établir le résultat d''exploitation réel. Si 2,1 M€ représentent bien
    trois mois de l''intégralité de nos charges de structure, nous sommes déjà autour de −1 M€ de résultat
    d''exploitation annuel. Dans cette hypothèse, notre problème n''est pas un problème de volume, c''est
    un problème de marge, et signer l''aggrave. Le chiffre est joint au dossier avant tout échange avec
    D.


    **L''asymétrie du contrat, en une phrase :** nous concédons 9 % et l''exclusivité pendant 36 mois,
    D s''engage sur les volumes pendant 12. Les mois 13 à 36 sont un chèque en blanc signé au bénéfice
    d''un partenaire qui a réduit ses commandes de 11 % sans préavis il y a trois mois. À ce moment-là,
    D revenu à ses volumes antérieurs nous laisse à 3,28 M€ de marge brute (−1,34 M€/an), sans aucun autre
    canal légalement accessible et avec 1,2 M€ à payer pour sortir — plus de la moitié de notre trésorerie.


    **Ce que l''exclusivité détruit par ailleurs :** la centrale régionale (3,5 M€, soit ~1,08 M€ de marge
    brute annuelle) devient impossible à accepter dans cinq mois, et la marketplace (0,4 à 2,2 M€ à +6
    points) devient impossible à lancer. Coût d''option abandonné : de l''ordre de 1,5 M€ de marge brute
    par an, pendant trois ans.


    ## 3. Enveloppe de signature — ce que vous POUVEZ signer


    Vous êtes autorisés à signer, sans me consulter, tout accord respectant **simultanément** les huit
    points suivants :


    1. **Durée** ≤ 24 mois, reconductible par accord écrit exprès.

    2. **Remise** : 4 % ferme sur le prix de cession + jusqu''à 5 % de bonus versé semestriellement **sur
    les volumes effectivement livrés au-delà de +18 %**. Le point mort de 4,7 % est communiqué à D : c''est
    notre argument, pas notre secret.

    3. **Exclusivité limitée** aux 4 références concernées et au seul canal GMS enseignes nationales.
    Sont explicitement hors périmètre : e-commerce et marketplaces, restauration hors domicile, centrales
    régionales indépendantes. Réserve de capacité industrielle de 20 % pour ces canaux.

    4. **Symétrie de l''engagement** : plancher de volume ferme et chiffré sur toute la durée, pas seulement
    l''année 1.

    5. **Clause de défaillance** : sous −5 % du plancher sur un trimestre, la remise tombe à zéro rétroactivement
    sur le trimestre et l''exclusivité est suspendue de plein droit, sans indemnité.

    6. **Préavis de déréférencement** de 6 mois écrits, pour toute référence, pendant toute la durée.

    7. **Pénalité de sortie** réciproque et plafonnée à 0,3 M€ de part et d''autre, nulle en cas de manquement
    de l''autre partie.

    8. **Paiement à 30 jours** date de facture pendant les douze premiers mois, pour financer la montée
    en charge. Clause d''indexation matières premières.


    Contrôle final avant signature : calcul contradictoire DAF/DC démontrant une marge brute prévisionnelle
    sur le périmètre D **≥ 4,6 M€ par an au volume engagé**. Le calcul est daté, signé des deux, et versé
    au dossier. Sans ce document, pas de signature.


    ## 4. Lignes rouges — ce que vous NE pouvez PAS signer


    Un seul de ces points suffit à interdire la signature, quels que soient les arguments avancés :


    - Durée supérieure à 24 mois.

    - Exclusivité portant sur plus de 4 références, ou couvrant l''e-commerce, la RHF ou les centrales
    régionales.

    - Remise ferme supérieure à 5 % non indexée aux volumes livrés.

    - Absence d''engagement de volume ferme et chiffré sur toute la durée.

    - Pénalité de sortie supérieure à 0,4 M€, ou non réciproque.

    - Préavis de déréférencement inférieur à 6 mois.

    - Toute clause interdisant, retardant ou conditionnant un accord avec la centrale régionale.

    - Marge brute prévisionnelle sur périmètre D inférieure à 4,6 M€/an.


    Sont également interdits : tout accord verbal, tout « accord de principe », toute lettre d''intention,
    tout courriel susceptible d''être lu comme une acceptation. Tous les échanges avec D sont écrits,
    avec DAF et DC en copie systématique.


    ## 5. Règle de départage — le point le plus important de cette note


    Le comité est divisé et l''a écrit. Je ne veux pas que cette division soit arbitrée par celui qui
    parlera le plus fort le jour où l''acheteur sera dans la salle.


    **La signature exige la signature conjointe du DAF et du DC. En cas de désaccord entre eux, il n''y
    a pas de signature.**


    Raison, à assumer devant D si nécessaire : ne pas signer est réversible — D peut revenir, une référence
    déréférencée peut être re-référencée, aucun cash ne sort. Signer trois ans ne l''est pas : la sortie
    coûte 1,2 M€ et l''accès au marché est perdu jusqu''en 2029. Quand deux branches sont incertaines,
    on garde celle dont on peut revenir. Ce n''est pas de la prudence, c''est la seule règle applicable
    par un comité qui ne peut pas me joindre.


    ## 6. Calendrier d''exécution


    | Date | Action | Responsable |

    |---|---|---|

    | **Lun. 10 août** | Contre-proposition écrite envoyée à D (LRAR + mail). | DC + DAF |

    | **Lun. 10 août** | Courrier de l''avocat à D : demande de confirmation écrite des 4 références visées
    et de la date d''effet, rappel des obligations de préavis en matière de rupture de relations commerciales
    établies (art. L.442-1 II c. com.). Ton factuel, pas comminatoire. | DG adj. / conseil |

    | **Mer. 12 août** | Réunion avec l''acheteur de D — après l''envoi de la contre-proposition, jamais
    avant. | DC (préside) |

    | **Ven. 14 août** | Ligne de crédit confirmée de 1,5 M€ ou contrat d''affacturage signé. À obtenir
    **avant** le choc, pas après. | DAF |

    | **Sam. 16 août** | Date butoir. Si la réponse de D entre dans l''enveloppe du §3 → signature conjointe.
    Sinon → courrier de non-signature maintenant explicitement notre offre ouverte au-delà du 20 août.
    | DAF + DC |

    | **20 août** | Comité d''achat D. Prendre acte par écrit de la décision, quelle qu''elle soit. Aucune
    réaction publique. | DC |

    | **À partir du 21** | Plan §8 si déréférencement. | Comité |


    ## 7. La réunion du 12 août avec l''acheteur de D


    Vous l''acceptez. Vous la cadrez.


    - Le DC préside. Ordre du jour envoyé la veille, compte rendu écrit signé des deux parties en fin
    de séance.

    - **Aucune décision, aucun engagement, aucun chiffre nouveau concédé en séance.** Notre seule réponse
    est la contre-proposition déjà envoyée le 10.

    - Le comité parle d''une seule voix, y compris ceux qui étaient d''un autre avis. Les divergences
    internes ne franchissent pas la porte. Un partenaire qui demande à s''adresser directement à un comité
    qu''il sait divisé, en l''absence du dirigeant, sous une échéance qu''il vient lui-même d''avancer,
    cherche une signature obtenue dans la salle. Ne la lui donnez pas — cela ne préjuge d''ailleurs pas
    de sa bonne foi, seulement de la façon dont nous devons nous organiser.

    - Question à poser en séance, et à faire figurer au compte rendu : *« Quel volume ferme D est-il prêt
    à engager sur les mois 13 à 36 ? »* La réponse à cette seule question nous dit tout ce qu''il faut
    savoir.


    ## 8. À lancer immédiatement, sans attendre D


    Ces cinq chantiers ne dépendent d''aucune réponse de D. Ils démarrent le 10 août.


    1. **Marketplace** : mise en ligne des 4 références non menacées avant le 31 août. Budget plafonné
    à 60 k€ jusqu''à mon retour. C''est notre seul canal à marge supérieure et il ne coûte presque rien
    à ouvrir.

    2. **Centrale régionale** : rendez-vous demandé cette semaine pour accélérer leur instruction. Objectif
    : ramener leur décision de cinq à trois mois. Leur signaler que nous sommes sollicités pour une exclusivité
    et que nous l''avons écartée pour rester disponibles — c''est vrai, et c''est un argument.

    3. **Trésorerie** : ligne de crédit ou affacturage (§6). Gel de tout capex non engagé jusqu''à mon
    retour.

    4. **Redon** : le directeur industriel établit d''ici le 14 août le plan de charge à 6, 10 et 14 semaines,
    sous les deux hypothèses (avec et sans les 4 références), et prépare le dossier d''activité partielle
    **sans le déposer**.

    5. **CSE** : le DRH informe les représentants du personnel de la négociation en cours et de son calendrier,
    le 12 août. Ils l''apprendront de toute façon ; qu''ils l''apprennent de nous.


    ## 9. Si D déréférence les 4 références le 20 août


    C''est le pire cas de l''option que je retiens, et je l''assume : jusqu''à environ 7 M€ de CA annualisé
    perdus, le plan de charge de Redon sous les 70 %, et 52 postes exposés à l''activité partielle. **Ceux
    qui l''encaissent en premier sont les salariés de Redon, puis l''actionnaire.** Je le dis clairement
    parce que la branche « signer » expose exactement les mêmes 52 postes en année 2, mais sans droit
    de sortie sous 1,2 M€ et sans aucun canal de repli.


    Déclencheurs observables, à appliquer sans m''attendre :


    - **Plan de charge Redon < 70 % du nominal sur deux semaines consécutives en carnet ferme à 6 semaines**
    → dépôt du dossier d''activité partielle, information CSE sous 48 h. Priorité au lissage de production
    et à la constitution de stock sur les références marketplace avant toute mesure sociale.

    - **Trésorerie disponible < 1,4 M€** → tirage de la ligne de crédit, gel de tous les engagements non
    contractés, réunion de crise convoquée le jour même.

    - **Trésorerie disponible < 0,9 M€** → vous arrêtez d''exécuter cette note et vous convoquez l''actionnaire.
    Ce seuil est le seul point où mon mandat cesse.


    Il n''y a **aucune reprise automatique** de la négociation avec D après le 20 août sans compte rendu
    écrit au comité complet.


    ## 10. Ce qui renverserait ma décision — et ce qui ne la renverse pas


    **Renverse la décision :** si le DAF établit, chiffres à l''appui et contresignés par le DI, que la
    perte des 4 références fait passer le plan de charge de Redon **sous 55 %** et la trésorerie **sous
    1,2 M€ avant le 31 décembre**. Dans ce cas seulement, et seulement dans ce cas, vous êtes autorisés
    à monter la remise ferme à 5,5 % et à porter la durée à 24 mois — **jamais à 36 mois, jamais sans
    engagement de volume ferme sur toute la durée**. Aucune tension de trésorerie ne se répare en s''interdisant
    trois ans de vendre ailleurs.


    **Ne renverse pas la décision :** la qualité des arguments de l''acheteur en séance ; un tableau montrant
    une progression du chiffre d''affaires (le CA n''est pas la marge — voir §2) ; le fait que l''échéance
    approche ; le fait que le comité soit fatigué de la discussion. La pression du calendrier est un paramètre
    de la négociation, pas une donnée du problème.


    ---


    **Délégation.** Le DAF et le DC reçoivent délégation conjointe de signature dans les limites strictes
    du §3, expirant le 31 août 2026. Toute question hors de ces limites attend mon retour. Si l''attente
    coûte l''affaire, alors l''affaire ne valait pas ce qu''on nous demandait de payer pour elle.


    Je vous fais confiance pour tenir la ligne ensemble, y compris ceux d''entre vous qui auraient décidé
    autrement. C''est précisément parce que vous n''êtes pas d''accord que la règle du §5 existe.


    *Le Directeur général*

