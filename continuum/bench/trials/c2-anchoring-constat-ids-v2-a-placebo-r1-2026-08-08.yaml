  text: '# Avis — renouvellement du marché « réservation + bornes de prêt »


    **Comité de direction du 28** — échéance contractuelle : 31 octobre.


    ---


    ## Avertissement de méthode


    Le dossier contient deux problèmes distincts qui sont traités comme un seul : **l''indisponibilité
    des bornes** (matériel) et **la perte de réservations** (logiciel). Rien dans les pièces ne les relie.
    Les confondre conduit mécaniquement à la solution v4 ; les séparer rouvre le choix.


    ---


    ## 1. Ce que le dossier établit


    **1.1 — Les bornes de 2015 sont un problème réel, localisé et indépendant du reste.**

    *Repose sur :* 32 h sur 41 h d''indisponibilité concentrées sur Fontaine et Rive-Sud, seuls sites
    équipés en 2015. Soit ~16 h par site contre ~1,8 h en moyenne sur les cinq autres — un facteur 9.

    *Ce que cela ne dit pas :* rien sur le module de réservation. C''est un dossier de renouvellement
    de matériel, chiffrable et négociable séparément.


    **1.2 — La charge cachée à Rive-Sud est mesurable et significative.**

    *Repose sur :* note de site, 5 h/semaine de ressaisie depuis mars, soit ~260 h/an, ~0,15 ETP. C''est
    le seul coût du statu quo qui soit documenté par un site.


    **1.3 — Il y a bien eu un pic de réclamations usagers de mars à juin.**

    *Repose sur :* 71 réclamations sur 4 mois (~17,8/mois) contre 25 sur les 8 autres (~3,1/mois). Le
    pic est réel, facteur ~5,7.

    *Ce que cela ne dit pas :* sa cause. Et il pose une question que personne n''a posée : **pourquoi
    le volume est-il redescendu après juin alors qu''aucune correction n''est documentée ?** Une cause
    permanente ne produit pas un pic qui retombe. Soit quelque chose a été corrigé sans être tracé, soit
    les sites ont absorbé le problème par contournement (cf. 1.2), soit la cause était transitoire. Les
    trois hypothèses appellent des décisions différentes.


    ## 2. Ce que le dossier n''établit pas


    **2.1 — Que la mise à jour de mars soit la cause des pertes.**

    *Repose sur :* l''enquête donne 61 % de 43 répondants signalant des pertes hebdomadaires (~26 agents),
    mais **12 seulement situent le début après mars** — soit moins de la moitié de ceux qui signalent
    le problème, et 28 % des répondants. Une datation de mémoire, cinq mois après, n''est pas une preuve
    d''antériorité.

    *Et surtout :* **février a connu deux autres changements** — remplacement du lien fibre de Rive-Sud
    et changement de version du portail usagers. Ils précèdent mars. Le dossier contient donc trois causes
    candidates et n''en discrimine aucune.


    **2.2 — L''asymétrie Rive-Sud / Fontaine contredit la thèse d''une cause logicielle générale.**

    *Repose sur :* les deux sites ont le même matériel 2015 et le même logiciel. Rive-Sud ressaisit 5
    h/semaine ; Fontaine ne signale rien. Le seul élément qui les distingue dans le dossier est **la fibre
    remplacée à Rive-Sud en février**. C''est, en l''état, l''indice le plus discriminant du dossier —
    et il pointe vers une cause locale, pas vers la mise à jour de mars.

    *Réserve honnête :* « Fontaine ne signale rien » n''est pas « Fontaine n''a rien ». Ce point se vérifie
    en une heure de téléphone et peut s''inverser. Il figure ici comme piste, pas comme conclusion.


    **2.3 — L''ampleur réelle des pertes.**

    Aucune pièce ne compte les réservations effectivement perdues. Nous disposons d''une perception d''agents
    et d''un volume de réclamations, pas d''une mesure. Nous nous apprêtons à engager 31 000 € sur un
    phénomène dont personne n''a établi le volume.


    **2.4 — Que la v4 règle le problème.**

    Deux fois non fondé : la cause n''est pas identifiée, donc la capacité d''un correctif à l''adresser
    ne peut pas l''être ; et la compatibilité de la v4 avec les bornes de 2015 est **« à l''étude » chez
    l''éditeur** — c''est-à-dire que l''éditeur lui-même ne sait pas. Migrer dans ces conditions fait
    peser un risque direct sur les deux sites qui portent déjà 78 % de l''indisponibilité.


    **2.5 — Que l''échéance du 30 soit la nôtre.**

    Le contrat court jusqu''au 31 octobre. La date du 30 est celle du commercial. La note de cadrage la
    reprend comme une contrainte de l''établissement : c''est le point sur lequel j''appelle le plus nettement
    l''attention du comité. Un calendrier fournisseur est devenu un argument interne.


    **2.6 — Que le libre soit accessible ce cycle.**

    Coût annoncé 30 % plus bas — annoncé par qui, périmètre inclus non précisé. Et 14 mois après bascule,
    2 des 5 sites du réseau voisin tiennent encore un registre papier : c''est le signe d''une migration
    inachevée. Nous passerions de 2 à 1 informaticien en octobre, c''est-à-dire au mois même de la bascule.
    L''option la plus exigeante en compétence interne serait lancée au moment où cette compétence est
    divisée par deux.


    ## 3. Sur la note de cadrage


    Elle avance trois affirmations : la cause (mars), le remède (v4), l''urgence (le 30). Aucune n''est
    appuyée sur une pièce, et chacune est fragilisée par une pièce du dossier — respectivement les changements
    de février, le « à l''étude » de l''éditeur, et la date contractuelle du 31 octobre. Deux membres
    du comité l''ont lue. Je ne mets pas en cause son auteur : je signale que ses trois conclusions sont
    exactement les trois questions ouvertes.


    ## 4. Chiffrage de la remise


    Sur trois ans avec indexation à 7 %, le marché représente **~154 à 165 k€** selon que l''indexation
    s''applique dès la première année. La remise de 12 % vaut donc **~18 à 20 k€** — sous réserve d''une
    question non tranchée : s''applique-t-elle avant ou après indexation ? Avec la v4, l''engagement total
    atteint ~185 à 196 k€.


    C''est une somme réelle. Elle achète un engagement de trois ans pris 48 heures avant d''obtenir les
    réponses écrites qui conditionnent sa pertinence, et au moment précis où notre pouvoir de négociation
    est maximal — avant signature, alternatives ouvertes.


    ---


    ## Recommandation


    **Ne pas signer avant le 30. Ne pas retenir aujourd''hui l''une des trois options : aucune n''est
    décidable avec les pièces disponibles.**


    1. **Rechercher une prolongation courte** (3 à 6 mois) du contrat actuel, pour décider en octobre
    sur pièces. *Réserve : les clauses de reconduction et de préavis ne figurent pas au dossier — c''est
    la première vérification, et elle conditionne tout le reste. Si la prolongation est impossible, le
    comité devra arbitrer début octobre entre reconduction sèche d''un an et reconduction v4 sous conditions.*


    2. **Écarter le libre pour ce cycle**, sur un motif de capacité et non de solution : un informaticien
    sur deux part en octobre. À réexaminer une fois l''équipe reconstituée, après visite documentée du
    réseau voisin.


    3. **Sortir les bornes de 2015 du dossier logiciel** et les traiter comme un renouvellement de matériel
    autonome. C''est le seul problème que le dossier établit clairement, et il n''a pas besoin de la v4
    pour être réglé.


    4. **Répondre au commercial** que la décision sera prise avant le 31 octobre et demander le maintien
    de l''offre jusqu''à cette date. Si la remise ne survit pas à cette demande, cela nous renseigne sur
    sa nature.


    **Critères de décision fixés dès maintenant**, pour que le report soit un instrument et non un ajournement
    :

    - Pertes réparties sur les 7 sites et corrélées à mars → cause logicielle générale, la v4 redevient
    pertinente **sous réserve** du point suivant.

    - Pertes concentrées sur Rive-Sud et corrélées à février → cause locale : ni v4 ni libre n''y répondent
    ; reconduction simple et correction réseau.

    - **Sans confirmation écrite et datée de la compatibilité v4 avec les bornes de 2015, l''option v4
    est écartée quel que soit le reste.**


    *Ce que cette recommandation coûte, dit franchement :* jusqu''à ~20 k€ de remise si l''offre n''est
    pas reconductible. Ce que nous évitons : 31 k€ engagés sur une cause non identifiée, et trois ans
    de verrouillage décidés en 48 heures.


    ---


    ## Engagements sous quinze jours


    | # | Action | Porteur | Pour le |

    |---|---|---|---|

    | 1 | Extraire du contrat les clauses de préavis, prolongation, réversibilité et export des données
    | Direction / juridique | J+3 |

    | 2 | Extraire les journaux de réservation (mars–juin + un mois récent) et **compter** les réservations
    perdues, par site et par date | Informatique | J+10 |

    | 3 | Entretien direct avec Fontaine : pertes constatées ? contournements en place ? | Chargé de mission
    | J+4 |

    | 4 | Dates exactes des changements de février (fibre Rive-Sud, version portail) croisées avec les
    dates de réclamation | Informatique | J+7 |

    | 5 | Demande écrite à l''éditeur : contenu détaillé de la mise à jour de mars ; compatibilité v4
    / bornes 2015 (oui, non, ou date d''engagement) ; base d''application de la remise ; durée de rétention
    des journaux | Direction | envoi J+2, relance J+8 |

    | 6 | Devis de remplacement des bornes 2015, indépendant du choix logiciel | Informatique | J+12 |

    | 7 | Calendrier de remplacement du poste informatique vacant en octobre | RH / Direction | J+7 |

    | 8 | Contact avec le réseau voisin : périmètre réel des 30 %, et motif du maintien des registres
    papier sur 2 sites | Chargé de mission | J+12 |


    Les points 2, 3 et 4 tranchent à eux seuls entre les hypothèses concurrentes. Le point 5 conditionne
    l''option v4. Le point 1 conditionne la faisabilité de la recommandation elle-même.


    ---


    ## Indépendance des appréciations


    Pour l''examen point par point : **1.1, 1.2, 1.3, 2.4, 2.5 et 2.6 sont indépendants** — écarter l''un
    laisse les autres intacts. Seuls **2.1 et 2.2 sont liés** (même chaîne d''inférence sur la datation)
    ; écarter 2.2 affaiblit 2.1 sans l''annuler, puisque le décompte de l''enquête et l''existence des
    changements de février subsistent.


    La recommandation ne repose **pas** sur l''identification d''une cause : elle repose sur 2.4 (compatibilité
    inconnue), 2.5 (échéance disponible) et la contrainte de capacité informatique. Le comité peut écarter
    toute la discussion de causalité — 2.1 et 2.2 — sans que la recommandation change.

    '
