response:
  text: '**Recommandation : Option B.** Le chiffre qui tranche n''est pas l''écart de 190 k€ entre les
    deux options — c''est le fait que la bascule intégrale laisse décembre, notre meilleur mois, sur un
    rail dont la seule mesure disponible affiche 1,3 % d''échec, avec pour seul recours une manœuvre jamais
    répétée. J''ai testé la version renforcée de A (bascule + prolongation Solda en décembre, 370 k€ d''économie,
    soit 60 k€ de mieux que B) et je l''écarte quand même : la note explique pourquoi.


    Deux réserves déclarées, qui ne changent pas la conclusion mais que la présidente doit voir : le dossier
    ne donne pas le taux de rattrapage des paiements échoués (tous mes montants d''exposition sont donc
    des majorants), et il n''est pas clair que les 310 k€ de B intègrent la prolongation Solda à 130 k€/mois.


    ---


    # NOTE AU COMITÉ DE DIRECTION — Prestataire de paiement

    **De :** Direction des opérations · 8 août 2026 · **Décision :** vendredi


    **Recommandation : Option B**, avec trois amendements qui la rendent plus courte et plus sûre que
    la version du dossier — et une action à engager lundi, valable quelle que soit la décision.


    ### 1. La question réelle

    Elle n''est pas « A ou B ». Elle est : quelle part du chiffre d''affaires de décembre accepte-t-on
    de faire passer par un rail dont la seule mesure disponible affiche 1,3 % d''échec ? A répond 100
    %. B répond 25 %. Les 190 k€ d''écart sont le prix de cette différence.


    ### 2. Les chiffres

    18 000 transactions/jour × 42 € = **756 k€ de volume par jour** ; un point d''échec = 7 560 €/jour.

    - Sur-échec Payflux les 3 premières semaines (1,3 % vs 0,4 %) : **143 k€ de volume exposé** si tout
    le trafic y passe (A), **~26 k€** à 10–25 % (B).

    - Écart permanent stabilisé (0,5 % vs 0,4 %) : **276 k€/an** — identique dans les deux options.


    Ces montants sont du volume, pas de la marge, et une part inconnue des échecs aboutit à une seconde
    tentative réussie. **Ce taux de rattrapage est la grandeur manquante du dossier.** Par ailleurs, si
    les 310 k€ de B n''intègrent pas la prolongation Solda (130 k€/mois), l''économie réelle de l''année
    1 peut approcher zéro. Cela ne change rien : le contrat Payflux court sur 24 mois, les 500 k€ sont
    acquis dès l''année 2. **L''année 1 paie la sécurité de la bascule.**


    ### 3. Pourquoi pas A, même renforcée

    Sous A, le compte Solda reste ouvert jusqu''au 30 novembre — mais il ne porte plus aucun trafic depuis
    trois semaines. Le repli consiste alors à basculer 100 % du trafic, en pleine journée du Black Friday,
    vers un rail refroidi, par une manœuvre que nous n''aurons jamais exécutée à cette échelle. **Une
    issue de secours jamais empruntée n''est pas une issue de secours.**


    Sous B, au même moment, Solda porte encore 75 % du trafic. Le repli est un changement de pondération
    que l''astreinte aura fait des dizaines de fois. Même opération : d''un côté une routine, de l''autre
    un pari.


    ### 4. La branche interdite

    Jetons transférés **et** compte Solda fermé = 6 semaines de délai et re-collecte des empreintes auprès
    de 2,1 millions de clients. Ce n''est pas de la variance : c''est un actif que Vireo ne peut pas reconstituer
    seule.


    Hypothèse volontairement basse : si 20 % ne ré-enregistrent jamais leur carte (420 000 clients) et
    ne perdent qu''un achat chacun, c''est 17,6 M€ de volume. **B se justifie dès que la probabilité de
    devoir quitter Payflux dépasse ~3 %.** La seule mesure dont nous disposons montre Payflux à trois
    fois le taux d''échec de Solda pendant trois semaines. Soutenir un risque inférieur à 3 % n''est pas
    défendable.


    ### 5. Les trois amendements

    - **Palier gelé pendant le pic** : 25 % au 20 novembre, gelé jusqu''au 5 janvier. On ne monte pas
    une rampe pendant décembre.

    - **Reprise rapide** : 50 % le 5 janvier, 100 % le 26 janvier. Le double run coûte 45 k€/mois — aucune
    raison de le faire traîner.

    - **Fermeture de Solda le 15 février**, après 4 semaines à 100 % sous 0,5 % d''échec : 13 jours de
    marge avant le mur du 28 février.


    ### 6. Repli — déclencheurs armés à l''avance

    - Échec Payflux **> 1,0 % sur 30 minutes** (6 rafraîchissements), **ou** taux d''autorisation inférieur
    de 0,5 pt à Solda à heure comparable → l''astreinte ramène 100 % du trafic sur Solda, **sans escalade
    ni justification a posteriori**. Ce pouvoir lui est délégué formellement : à 3 h du matin le 27 novembre,
    personne ne doit attendre un arbitrage.

    - Deux replis en 7 jours, ou échec > 0,6 % au 15 décembre → on ne passe pas à 50 %.

    - **Décision d''abandon : 15 décembre au plus tard** — après Cyber Monday, avant la fin de la fenêtre
    de sortie gratuite, assez tôt pour sécuriser un prestataire avant le 28 février.


    ### 7. Ce qui renverserait cette recommandation

    Le journal d''incidents du pilote Payflux chez le marchand comparable. Si les 1,3 % ont une cause
    identifiée, corrigée et non reproductible chez nous, l''écart de risque se réduit fortement et A redevient
    discutable. C''est l''information la moins chère et la plus décisive du dossier.


    ### 8. Lundi

    1. **Notifier Solda** — maintenant, pas en octobre. Obtenir par écrit : que la notification crée une
    **option** et non une obligation de payer ; **et qu''un renouvellement ferme de 12 mois reste accessible
    jusqu''au 15 décembre**. Le dossier dit que la prolongation mensuelle s''arrête au 28 février ; il
    ne dit pas qu''un renouvellement complet est fermé. Si c''est le cas, notre date d''abandon remonte
    — à savoir avant toute signature.

    2. **Payflux, clause à obtenir** : la fenêtre de sortie sans pénalité de 90 jours court à partir du
    **premier trafic en production**, pas de la signature. Vaut 240 k€ et conditionne tout le calendrier
    ci-dessus.

    3. **Répétition du repli à blanc** avec l''astreinte, avant tout trafic réel. Si la bascule ne tient
    pas en 15 minutes en exercice, le chiffre du dossier est faux et le calendrier change.

    4. **Demander à Solda un prix ferme sur 12 mois**, réponse avant le 15 octobre. Coût nul ; si Solda
    descend à 1,0 M€, le sujet disparaît. Sans effet sur la recommandation ci-dessus.


    **Sans le point 1, A comme B nous laissent sans repli pendant tout le mois de décembre.** C''est le
    seul point de cette note qui ne souffre aucun débat.

    '
