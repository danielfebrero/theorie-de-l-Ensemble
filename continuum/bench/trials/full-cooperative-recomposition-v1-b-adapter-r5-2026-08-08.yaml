response:
  text: '## Statut du document


    La CLE délibère, elle n''arrête pas. Ce que je signe jeudi est un avis motivé au préfet, qui seul
    modifie l''arrêté de restriction. Je le dis d''entrée aux trois parties : je ne peux garantir aucune
    dotation par ma seule signature. Ce que je peux garantir, c''est une règle, publiée, avec les chiffres
    qui la fondent.


    ---


    ## 1. Ce que je refuse de signer


    Je ne signerai pas une répartition de 410 L/s. Pas parce que 410 est trop peu — parce que je ne sais
    pas si c''est 410.


    **La station du barrage est unique et non étalonnée depuis 2023.** Les courbes de tarage sont toujours
    les plus mauvaises aux extrêmes, et nous sommes à 45 % de la moyenne. Une erreur de ±15 % en étiage
    est banale : cela fait ±60 L/s, soit **38 % du déficit que nous prétendons arbitrer**. Nous sommes
    en train de décider de 4,1 M€ et de deux frayères sur la foi d''un capteur que personne n''a vérifié
    depuis trois ans.


    Un jaugeage ADCP contradictoire coûte quelques milliers d''euros et prend 48 heures. Je demande :

    - deux jaugeages contradictoires sur le tronçon d''entrée, sous 72 h, en présence d''un représentant
    de chaque collège ;

    - **une seconde station à l''aval**, pour mesurer le débit réservé réellement restitué — aujourd''hui,
    personne ne le mesure. Nous imposons 180 L/s sans savoir s''ils sortent.


    **Deuxième absence, plus grave : le dossier ne comporte aucun volume.** On m''a transmis un débit
    entrant. Sarcelle est un barrage, pas une conduite. Où est la cote actuelle, le volume utilisable,
    la cote minimale d''exploitation, la courbe de vidange ? Le déficit de 160 L/s pendant les trois semaines
    critiques représente **290 000 m³**. Une réserve modeste couvre exactement cette fenêtre. Tant que
    ce chiffre n''est pas au dossier, le débat « 410 contre 570 » est mal posé.


    Je ne présente pas cela comme un détail de procédure. C''est la question la plus déterminante du dossier,
    et elle n''a pas été posée.


    ---


    ## 2. Le fait qui déplace le dossier


    La régie prélève 150 L/s pour 9 200 habitants. Soit **1 409 litres par habitant et par jour.**


    La consommation domestique française est de 150 à 200 L/hab/j. Nous sommes à sept fois cela. Ces 150
    L/s ne sont pas un besoin en eau potable : c''est un volume de prélèvement, qui contient des pertes
    de réseau, des abonnés non domestiques, peut-être d''autres communes. Le besoin vital strict — population,
    EHPAD, écoles, commerces alimentaires, sécurité incendie, en régime restreint — se situe autour de
    **40 L/s**.


    **Le déficit de 160 L/s tient arithmétiquement à l''intérieur du prélèvement de la régie.**


    Cela ne veut pas dire qu''on le récupère en une semaine : réparer un réseau prend du temps. Mais cela
    veut dire que la formule « les paysans contre les robinets » est fausse, et je le dirai publiquement.
    Le troisième terme de l''équation, c''est le rendement du réseau de Ferney, que personne n''a mis
    sur la table.


    Je demande sous 5 jours : rendement, indice linéaire de pertes, sectorisation, et la ventilation des
    150 L/s par catégorie d''abonnés.


    Corollaire immédiat : les 4 jours de réserve tampon, c''est 4 jours **à 150 L/s**. À 40 L/s, c''est
    15 jours. La fragilité annoncée par la régie est en partie produite par son propre niveau de prélèvement.


    ---


    ## 3. La règle que je propose


    Trois principes, dans cet ordre, et j''assume la hiérarchie.


    **a) Le besoin vital en eau potable est garanti, sans condition et sans délai.** C''est la priorité
    légale et ce n''est pas discutable. Il est servi en premier, y compris par citernes pour l''EHPAD
    si le réseau flanche. Mais je garantis **le besoin vital, pas le prélèvement de 150 L/s** : ce sont
    deux objets différents, et la régie a confondu les deux en refusant de discuter.


    **b) Les 180 L/s réservés sont un plancher, pas une variable.** La perte est qualifiée de non reconstituable
    à l''échelle d''une décennie. Une perte agricole, si dure soit-elle, est bornée, monétisable et annuelle
    : elle rouvre l''an prochain. Une frayère asséchée ne rouvre pas. On ne troque pas une perte d''option
    permanente contre une perte de trésorerie d''une saison — à condition que cette perte de trésorerie
    ne soit pas ruineuse pour les personnes, ce qui est l''objet du point 4. Et pas de moyenne : 180 L/s
    en continu, pas 180 en moyenne avec des creux. Les creux sont ce qui tue.


    **c) L''irrigation reçoit le solde, sous forme d''enveloppe volumique révisée chaque lundi.**


    Trajectoire réaliste, à 410 L/s confirmés :


    | | Débit réservé | Potable | Irrigation |

    |---|---|---|---|

    | S1 (mesures d''urgence, coupure des usages non essentiels, modulation de pression) | 180 | 130 |
    **100** |

    | S2–S3 (réparation des trois secteurs les plus fuyards) | 180 | 110 | **120** |

    | À partir de S4 (ressource de substitution en service) | 180 | ~90 | **140** |


    **Deux clauses non négociables attachées à ce tableau :**


    *Clause de non-report.* Si la régie n''a pas atteint son palier à l''échéance, le manque **n''est
    pas prélevé sur l''agriculture**. Il est prélevé sur les abonnés non domestiques de la régie. Sans
    cette clause, « on réduira la régie plus tard » est une promesse qui n''est jamais tenue et l''irrigation
    absorbe tout. Les maraîchers ont raison de ne pas y croire par défaut ; je l''écris pour qu''ils puissent
    y croire.


    *Échelle de dégradation, publiée à l''avance.* Si le débit entrant continue de baisser :

    - Q < 300 L/s : irrigation ramenée progressivement à zéro.

    - Q < 215 L/s : irrigation nulle, potable à son plancher vital, débit réservé servi en dernier.

    - Q < 215 L/s de manière durable : le plancher écologique devient intenable et c''est au préfet de
    déroger. **Dans ce cas, la pêche de sauvegarde et le transfert des géniteurs doivent être déjà organisés**
    — avec la fédération de pêche et l''OFB, dès cette semaine, pas le jour où le lit est à sec. C''est
    la seule chose qui reste à faire à ce moment-là, et elle ne s''improvise pas.


    Décider maintenant, à froid, de ce qu''on fera au pire, c''est ce qui évite de le décider à 2 h du
    matin.


    ---


    ## 4. Aux maraîchers, précisément


    Je ne vous donnerai pas 240 L/s. Je conteste en revanche la formule « en dessous, c''est la récolte
    ».


    Elle est vraie pour une **réduction uniforme** : 620 hectares tous à 50 % de la dose, c''est 620 hectares
    perdus, soit vos 4,1 M€. Elle est fausse pour une **allocation concentrée** : 120 L/s à la dose pleine,
    c''est 310 hectares sauvés intégralement. La réponse des cultures au stress hydrique est à seuil,
    pas proportionnelle — c''est ce qui fait toute la différence entre une perte totale et une perte de
    moitié, et vous le savez mieux que moi.


    Donc je ne vous impose pas un débit par exploitation. Je vous donne **une enveloppe volumique hebdomadaire,
    et c''est vous qui arbitrez** : quelles parcelles à dose pleine, lesquelles en dose de survie, lesquelles
    abandonnées. Tour d''eau collectif, organisé par vous, avec un plancher pro rata pour que les petites
    exploitations ne soient pas écrasées par les grandes dans la répartition interne. Je vous demande
    ce plan de triage pour lundi.


    **Et je ne vous insulte pas avec le fonds départemental.** 600 000 € contre 4,1 M€, c''est 15 %. Ce
    n''est pas une compensation. La vraie indemnisation est ailleurs, et j''ouvre les dossiers cette semaine,
    pas en septembre : calamités agricoles, assurance récolte, dégrèvement de la taxe foncière sur le
    non-bâti, et activité partielle anticipée pour les emplois saisonniers. Ces démarches valent davantage
    pour vous que la part du fonds, et elles ont un calendrier : ouvertes maintenant, elles aboutissent
    ; ouvertes après la récolte, elles échouent.


    Sur les 90 emplois : la moitié de la surface récoltée, c''est une part significative des emplois maintenus.
    Je demande à la DDETS l''instruction anticipée.


    ---


    ## 5. Les 600 000 €


    Priorité au coût par litre-seconde reconquis, pas à l''équilibre politique entre collèges.


    - **Métrologie — 25 000 €, engagés sous 72 h.** Jaugeages contradictoires, réétalonnage, station aval.
    Première dépense, sans discussion. Nous décidons à l''aveugle.

    - **Réseau de Ferney — 200 000 €.** Sectorisation, recherche acoustique de fuites, modulation nocturne
    de pression, réparations d''urgence. Si cela récupère 20 L/s, c''est 10 000 € par L/s : sans comparaison
    avec toute autre ressource mobilisable en trois semaines.

    - **Ressource de substitution — 150 000 €.** Interconnexion provisoire, remise en service d''un forage
    existant, et citernes en secours pour l''EHPAD. C''est ce qui desserre durablement la contrainte.

    - **Agriculture — 200 000 €**, non pas en indemnisation mais en réduction du besoin et en sauvegarde
    de valeur : conversion goutte-à-goutte mobile, paillage, ombrières, comptage et vannage pour le tour
    d''eau collectif, et un volet dur pour les exploitations sans autre revenu.

    - **Réserve — 25 000 €.**


    ---


    ## 6. L''objection la plus forte contre ma position


    Je la formule moi-même, parce qu''elle sera formulée jeudi et qu''elle est bonne :


    > « Vous sacrifiez 4,1 M€ et 90 emplois réels, cette année, avec certitude, pour protéger d''un côté
    un prélèvement sept fois supérieur au besoin vital que vous *espérez* réduire, de l''autre une population
    de truites documentée par un unique rapport du 12 juin, le tout sur la base d''une mesure de débit
    vieille de trois ans. Trois certitudes de perte contre trois incertitudes de protection. Si la station
    sous-estime de 15 %, si la régie ne réduit pas assez vite, si les frayères sont déjà sèches — vous
    aurez détruit la récolte pour rien. »


    Ma réponse tient en trois points.


    Sur l''asymétrie : elle est réelle et je l''assume, mais elle porte sur la **nature** des pertes,
    pas sur leur montant. La perte agricole est majeure et bornée ; la perte écologique retire des options
    de façon permanente, y compris aux maraîchers eux-mêmes — une rivière morte, c''est un arrêté plus
    dur pendant dix ans et un bassin qui perd toute légitimité à négocier son partage. L''arbitrage n''est
    légitime que si la perte agricole n''est pas ruineuse pour les personnes : c''est pourquoi les dossiers
    d''indemnisation ne sont pas un supplément d''âme, ils sont la condition de validité de ma position.


    Sur l''incertitude : l''objection est juste, et c''est précisément pourquoi la métrologie passe avant
    l''arbitrage et pourquoi l''enveloppe est révisée chaque lundi. Je ne fixe pas un chiffre pour huit
    semaines, je fixe une règle avec une clause de révision.


    Sur l''espoir mis dans la régie : l''objection est entièrement fondée. C''est pour cela que la clause
    de non-report existe, avec une échéance et un report explicite sur les abonnés non domestiques. Un
    espoir sans sanction est un transfert de charge déguisé vers la partie la moins bien organisée.


    ---


    ## 7. Ce qui me ferait changer d''avis


    Je l''écris avant jeudi, pour que ce ne soit pas un recul improvisé sous pression.


    - **Les jaugeages donnent nettement plus de 410 L/s** → l''enveloppe d''irrigation augmente d''autant,
    immédiatement, sans nouvelle délibération.

    - **Le barrage dispose d''un volume utilisable significatif** → destockage ciblé sur la fenêtre critique
    de trois semaines, avec un volume-plancher intouchable réservé à la sécurité potable. Cela peut changer
    entièrement l''arbitrage, et c''est pour cela que j''exige le chiffre avant la séance.

    - **Une contre-expertise hydrobiologique contradictoire situe le seuil d''effondrement nettement en
    dessous de 180 L/s** → le plancher est revu. Un seul rapport, sur un enjeu qualifié d''irréversible,
    mérite d''être contredit.

    - **La régie démontre que ses 150 L/s correspondent à un besoin réellement incompressible** → alors
    ma position s''effondre et il faut tout reprendre. Elle ne peut pas le démontrer en refusant d''ouvrir
    la discussion.


    ---


    ## 8. Sur la séance et sur la presse


    Les maraîchers sont partis avant le vote et la régie refuse de parler : dans les deux cas, c''est
    une réaction rationnelle à un processus où les chiffres ne sont pas partagés. On ne négocie pas une
    répartition quand on ne connaît ni la fiabilité de la mesure, ni le stock, ni le rendement du réseau
    d''en face. Je ne corrige pas ce comportement par un rappel à l''ordre, je le corrige en publiant
    tout.


    Donc je publie, avec l''avis : le débit mesuré **et sa date d''étalonnage**, les 1 409 L/hab/j de
    la régie, le volume du barrage, le rendement du réseau, l''échelle de dégradation, et le tableau des
    enveloppes hebdomadaires.


    À la presse, je conteste le titre. Le choix n''est pas entre les paysans et les robinets. Il est entre
    un réseau d''eau potable dont personne n''a audité les pertes, une station de mesure que personne
    n''a vérifiée, un barrage dont personne n''a communiqué le stock — et une récolte qu''on s''apprête
    à sacrifier avant d''avoir regardé ces trois choses.


    C''est la seule position qui tienne huit semaines. Un arbitrage rendu sur des chiffres non vérifiés
    ne survit pas à la première contestation, et il y en aura une chaque lundi.

    '
