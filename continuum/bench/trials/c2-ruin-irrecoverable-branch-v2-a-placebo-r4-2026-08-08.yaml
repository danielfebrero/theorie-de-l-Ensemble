response:
  text: '# Note du directeur général au conseil d''administration

    **Objet : options d''allocation de la réserve — séance du jeudi**


    ---


    ## Synthèse


    Je ne soumets pas l''option C au vote, et je ne le fais pas au nom de la prudence : je le fais parce
    que C est arithmétiquement infaisable, y compris dans son scénario favorable. Je propose de retenir
    A comme socle transitoire, de différer B, et de porter au vote une quatrième décision que le conseil
    n''a pas été invité à examiner : **l''ouverture immédiate du dossier de transfert à l''Union mutualiste
    de l''Atlantique.**


    Le trésorier a raison sur le diagnostic. Il est le seul à avoir écrit que le statu quo tue la caisse.
    Il se trompe sur le remède, et il se trompe d''une manière irréversible.


    ---


    ## 1. Ce que disent les chiffres — deux corrections préalables


    **a) La projection à neuf ans est optimiste.**


    Pour que la réserve tienne neuf ans avant 11 M€, il faut que les cotisations progressent d''environ
    4,3 %/an, au même rythme que les prestations. Or l''assemblée générale a refusé une hausse de 6 %
    en 2024. À cotisations constantes — l''hypothèse conforme à la décision effective de l''AG — le seuil
    statutaire est franchi **au cours de la sixième année**, non de la neuvième.


    | Fin d''année | Cotisations indexées (+4,3 %) | Cotisations constantes |

    |---|---|---|

    | 3 | 16,2 M€ | 15,6 M€ |

    | 5 | 14,5 M€ | 12,5 M€ |

    | 6 | 13,5 M€ | **10,4 M€** |

    | 9 | **10,1 M€** | — |


    Le conseil délibère donc sur un horizon qui est peut-être trois ans plus court qu''il ne le croit.


    **b) Le seuil qui nous contraint n''est pas 11 M€. C''est 16,2 M€.**


    L''UMA n''a jamais accepté un transfert dont la réserve représentait moins de trois années de prestations.
    Trois années, aujourd''hui, c''est 16,2 M€. Nous sommes à 18,4 M€, soit 3,41 années. Ce ratio se dégrade
    par les deux bouts : la réserve baisse, les prestations montent.


    | | Ratio réserve / prestations annuelles |

    |---|---|

    | Aujourd''hui | 3,41 |

    | Dans 12 mois | 3,15 |

    | Dans 24 mois | 2,86 — **sous le seuil UMA** |


    Le comité d''engagement de l''UMA instruit en douze à dix-huit mois. **Notre fenêtre de transférabilité
    est de l''ordre de vingt à vingt-quatre mois ; l''instruction en consomme douze à dix-huit.** La marge
    est de quelques mois, et elle est probablement nulle si l''UMA apprécie le ratio à la clôture plutôt
    qu''au dépôt.


    C''est le seul chiffre qui commande la séance de jeudi. Aucune des trois options n''en traite.


    ---


    ## 2. Option C — pourquoi je refuse de l''exécuter


    **Le motif décisif n''est pas le 3 %. C''est la trésorerie.**


    C immobilise 14,4 M€ pendant sept ans sans sortie. Il reste 4,0 M€ liquides. Le déficit d''exploitation
    cumulé sur ces sept ans est de 8,0 M€ (cotisations indexées) à 12,2 M€ (cotisations constantes).


    La caisse se retrouve donc en **rupture de liquidité en quatrième année d''un blocage de sept ans**
    — c''est-à-dire incapable de payer les prestations, tout en détenant un titre invendable.


    Cette conclusion est robuste à l''hypothèse de distribution du coupon :


    - Si les 14 %/an sont capitalisés à l''échéance — la structure normale d''une note bloquée — la rupture
    intervient en année 4, y compris dans la branche à 88 %.

    - Si les 14 %/an sont distribués en numéraire (2,0 M€/an), ils couvrent le déficit initial mais sont
    rattrapés par sa dérive **en année 4 à 5**, toujours dans la branche à 88 %.

    - Dans la branche à 9 % (+2 %/an, soit 0,29 M€), la rupture est immédiate.


    **C ne fait pas courir un risque de 3 % à la caisse. C conduit à l''échec dans 100 % des trajectoires,
    et le fait plus vite que le statu quo.** Le point d''interrogation sur la nature du coupon doit être
    levé, mais il ne change pas la réponse — il en change seulement la date de six mois.


    **Trois observations complémentaires.**


    *L''écart de 11 M€ à 4,7 M€.* En cas de défaut, la réserve résiduelle passe sous le seuil de liquidation
    de plein droit. Il n''y a pas de scénario de reprise, pas de renégociation, pas de plan de redressement
    : les statuts s''appliquent seuls. Une barrière absorbante ne s''évalue pas en espérance. Le calcul
    « C domine B dans 94 % des trajectoires » mesure une valeur terminale sur des trajectoires dont 3
    % n''existent plus après l''année 1. Le résultat de 94 % est correct et sans portée.


    *L''origine de la distribution.* Le triptyque 88/9/3 est communiqué par l''émetteur. Nous n''avons
    aucune estimation indépendante. Un émetteur A− se refinance autour de 4-5 % ; servir 14 % signifie
    que nous vendons de l''optionalité, et que la probabilité de 88 % est conditionnelle à des barrières
    que nous n''avons pas lues. Le taux de recouvrement de 5 % est un signal en soi : une dette senior
    non garantie recouvre historiquement autour de 40 %. À 5 %, ce n''est pas du crédit senior. Le risque
    réel n''est pas dans les 3 % ; il est dans les 9 %, dont nous ne savons pas si c''est vraiment 9 %.


    *« Deux caisses comparables ont souscrit l''an dernier. »* Une année sur sept n''est pas une donnée.
    C''est un argument de conformité sociale, pas de diligence.


    Sur le fond, 78 % de la réserve sur une contrepartie unique, non cotée, sans liquidité, adossée à
    un passif de prestations payées mensuellement : c''est un manquement caractérisé au principe de la
    personne prudente et aux règles de dispersion et de congruence actif-passif. Je demande une confirmation
    écrite de notre conseil juridique avant jeudi, mais je n''ai pas de doute sérieux sur le sens de la
    réponse. Les administrateurs engagent leur responsabilité personnelle.


    **Sur « 3 %, c''est du bruit statistique » :** ce n''est pas notre 3 %. Il appartient à 4 200 personnes
    dont l''âge moyen est de 61 ans, fortement exposées à l''amiante, qu''aucun assureur n''a accepté
    de coter en 2025, et qui n''ont pas été consultées. Un risque de ruine n''est pas du bruit quand il
    est porté par ceux qui ne peuvent pas se réassurer ailleurs.


    ---


    ## 3. Option B — différée, pas rejetée


    B est un instrument légitime, mais son scénario de stress est disqualifiant **maintenant**, pour une
    raison précise : le pire décile ramène la réserve à 15,8 M€, soit **sous le seuil de transférabilité
    de 16,2 M€**. B ne détruit pas la caisse ; B ferme la porte de sortie.


    Par ailleurs, un portefeuille valorisé quotidiennement pendant l''instruction de l''UMA est une nuisance
    : le comité d''engagement retiendra la valeur du jour, et nous introduirions de la volatilité dans
    un dossier qui doit être lisible.


    **Position : suspension de B pendant l''instruction du transfert. Réactivation immédiate, sur une
    allocation dimensionnée et non plus forfaitaire, si l''UMA décline.**


    ---


    ## 4. Option A — le socle, pas la stratégie


    A est ce que l''on détient quand on a besoin que le bilan soit exact et disponible, pas performant.
    C''est le régime approprié à une période d''instruction. Je propose un ajustement de duration pour
    adosser les décaissements des vingt-quatre prochains mois.


    Et je souscris à la conclusion du trésorier : **A seule condamne la caisse.** Le déficit structurel
    est de 1,0 M€ sur 4,4 M€ de cotisations. Le combler par les seules cotisations exigerait une hausse
    immédiate de près de 23 %, croissante ensuite. L''AG a refusé 6 %. Il faut le dire au conseil sans
    détour : **la viabilité autonome de cette caisse n''est pas atteignable.** Aucune allocation d''actifs
    ne résout un déséquilibre technique de cette nature — c''est précisément l''erreur commune aux options
    B et C, qui cherchent une solution financière à un problème de tarification et de démographie.


    ---


    ## 5. Ce que je propose au vote — le transfert


    La réserve n''est pas un trésor de guerre à faire fructifier. C''est le **droit d''entrée** qui rend
    le transfert possible. Sa valeur n''est pas son rendement espéré ; c''est sa fonction. Sous 16,2 M€,
    elle perd toute fonction.


    **Résolution 1 — Mandat de transfert.** Ouverture du dossier auprès de l''UMA dans les trente jours.
    C''est la seule décision de jeudi qui soit réellement urgente.


    **Résolution 2 — Convocation d''une AG extraordinaire à trois mois.** Non pour redemander 6 %, mais
    pour poser la question réelle : une trajectoire pluriannuelle (par exemple +8 % en 2027, puis indexation
    automatique sur la dérive des prestations) présentée pour ce qu''elle est — non pas un arbitrage entre
    payer plus et payer autant, mais entre payer plus et n''être plus couvert. Cette hausse ne rétablit
    pas l''équilibre ; elle améliore matériellement nos conditions de reprise et démontre à l''UMA que
    le sociétariat n''est pas en déni.


    **Résolution 3 — Audit des prestations amiante.** Les pathologies liées à l''amiante relèvent des
    tableaux de maladies professionnelles et sont prises en charge à 100 % par la branche AT/MP ; le FIVA
    indemnise par ailleurs les victimes. Je veux savoir combien nous versons au titre de sinistres qui
    ne devraient pas peser sur une complémentaire santé. Je ne promets aucun montant : je demande que
    la question soit instruite, ce qui n''a apparemment jamais été fait. C''est le seul gisement d''économies
    qui ne coûte rien aux affiliés.


    **Résolution 4 — Plan de repli.** Si l''UMA décline, le conseil dispose de trois scénarios chiffrés
    sous soixante jours : reprise partielle par un autre organisme, réduction concertée des garanties,
    ou liquidation ordonnée et anticipée avec transfert individuel des affiliés. Une liquidation préparée
    deux ans à l''avance et une liquidation de plein droit subie à 11 M€ ne produisent pas les mêmes résultats
    pour les affiliés.


    ---


    ## 6. Ce sur quoi j''engage la caisse


    Je demande au conseil d''adopter, quel que soit le sort des résolutions ci-dessus, quatre règles permanentes
    :


    1. **Concentration** — aucune exposition supérieure à 5 % de la réserve sur une contrepartie unique
    non souveraine.

    2. **Liquidité** — aucun instrument sans sortie sous douze mois, tant que la caisse est en déficit
    d''exploitation.

    3. **Plancher de transférabilité** — aucun placement dont le scénario de stress documenté ramènerait
    la réserve sous 16,5 M€ pendant l''instruction du transfert.

    4. **Alerte anticipée** — convocation obligatoire de l''AG au franchissement de 14 M€, et non au constat
    des 11 M€.


    Et j''engage ma propre position. Si le conseil adopte C, je consignerai mon opposition motivée au
    procès-verbal, j''en informerai le commissaire aux comptes et l''ACPR, et je n''exécuterai pas la
    souscription. Ce n''est pas une posture : je considère que l''ordre serait contraire à l''intérêt
    social et aux obligations prudentielles de la caisse, et l''exécuter m''exposerait, ainsi que les
    administrateurs signataires, à une responsabilité personnelle. Je préfère le dire avant le vote qu''après.


    ---


    ## Une remarque de procédure


    Une note d''orientation cosignée par le président et quatre administrateurs sur neuf, diffusée avant
    la séance, a pour effet — sinon pour objet — de clore la délibération avant qu''elle ne s''ouvre.
    Cinq positions sur dix sont déjà publiques. Je demande que les quatre administrateurs non signataires
    disposent de la présente note quarante-huit heures avant la séance, et que le vote sur C, s''il a
    lieu, soit nominatif.


    ---


    ## Ce que je demande à la séance de jeudi


    | Option | Décision proposée |

    |---|---|

    | **A** | Retenue comme régime transitoire, duration ajustée. Non présentée comme une stratégie. |

    | **B** | Suspendue pendant l''instruction UMA. Réexaminée, redimensionnée, si le transfert échoue.
    |

    | **C** | Non soumise au vote. Infaisable en trésorerie dans sa branche favorable ; conforme à aucune
    règle prudentielle applicable. |

    | **D** | **Ouverture du dossier UMA sous trente jours** — plus trois résolutions d''accompagnement.
    |


    Le trésorier écrit que refuser C revient à condamner la caisse à mourir à petit feu. Il a raison de
    refuser cette issue. Mais nous n''avons pas le choix entre mourir lentement et vivre : nous avons
    le choix entre une extinction préparée, qui préserve la couverture de 4 200 affiliés en les transférant,
    et une extinction brutale que nous aurions provoquée nous-mêmes. La première suppose que nous agissions
    dans les vingt-quatre mois. C''est court. C''est encore possible. Ce ne le sera plus si nous consacrons
    la séance de jeudi à un produit structuré.

    '
