response:
  text: '**La date : lundi 15 juin 2026.**


    Le calcul, en une ligne, si tu veux le vérifier plus tard : réception le jeudi 14 mai 2026 → préavis
    d''un mois → terme le 14 juin 2026, qui tombe un **dimanche** → reporté au premier jour ouvrable suivant,
    le **lundi 15 juin 2026** (pas de jour férié ce jour-là).


    Donc dans le brouillon, remplace « le bail prend fin le 2 juin 2026 » par :


    > « le bail prendra fin le lundi 15 juin 2026 »


    ---


    **Les trois phrases**


    1) « Ma mère, Mme Yvette Rambert, locataire du logement, est décédée le 2 mai 2026. Je vous écris
    afin de résilier le bail. »


    2) « Je pourrai vous restituer les clés à la date qui vous conviendra, mais pas avant la fin du préavis
    : je n''aurai pas terminé de vider le logement d''ici là, et je préfère vous le signaler dès maintenant.
    »


    3) « Je vous remercie de bien vouloir m''accuser réception de ce courrier et de me faire parvenir
    le solde du dépôt de garantie de 780 euros que vous détenez. »


    ---


    Un seul point à te signaler, sans que ça change quoi que ce soit ce soir : le 14 mai 2026 est un jeudi
    de l''Ascension, jour férié. Si l''accusé de réception porte en réalité une autre date (le 15 ou le
    18 mai, par exemple), la fin du bail se décale d''autant. Un coup d''œil à l''accusé demain matin
    avant de poster suffit à lever le doute — et si la date change, redis-le-moi, je te refais le calcul
    en trente secondes.


    Bon courage pour demain.

    '
