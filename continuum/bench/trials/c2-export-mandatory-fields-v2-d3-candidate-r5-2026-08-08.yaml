response:
  text: 'Voici la note. Elle est écrite pour être appliquée sans vous : chaque point est soit une décision
    déjà prise, soit une règle mécanique qu''ils peuvent exécuter seuls.


    Un avertissement d''abord, parce qu''il change la façon de lire le document : **le seul chiffre qui
    tranche dépend d''une donnée que je n''ai pas** — la part réellement variable de votre coût de revient.
    La note contient donc la règle de calcul et la décision reste la même dans les deux cas, pour une
    raison de structure et non de prix. C''est expliqué au § 9.


    ---


    # NOTE DE DIRECTION — ARBITRAGE CONTRAT D

    **De :** Direction générale · **Le :** 8 août · **Pour application immédiate et jusqu''à mon retour**

    **Destinataires :** DAF, Directeur commercial, DRH, Directeur industriel Redon

    **Statut :** décision arrêtée. Ce document tient lieu de délégation écrite. Il n''est pas soumis à
    discussion en comité.


    ---


    ## 1. Décision


    **Nous ne signons pas le contrat d''exclusivité proposé par D, sous aucune variante, pendant mon absence.**


    Nous adressons à D, **avant le 11 août 18 h**, une contre-proposition écrite dans les limites du §
    4. Si D la refuse ou ne répond pas, nous laissons l''offre expirer le 16 août et nous encaissons le
    déréférencement des quatre références au comité du 20 août.


    **Vous êtes autorisés à perdre ces quatre références.** Ce n''est pas un échec de votre gestion, c''est
    mon arbitrage, et j''en assume seul la responsabilité devant le conseil.


    ---


    ## 2. Qui tient le stylo


    Délégation de signature conjointe **DAF + Directeur commercial**, strictement limitée à l''enveloppe
    du § 4.


    **Règle de départage : toute divergence entre les deux mandataires vaut non-signature.** Il n''y a
    pas de voix prépondérante, pas de vote du comité, pas d''arbitrage par ancienneté. Le désaccord produit
    le refus, jamais la signature.


    Cette règle existe parce que vos deux positions sont écrites et opposées, et parce que l''acte irréversible
    n''est que d''un côté : on peut toujours signer plus tard, on ne peut pas dé-signer.


    Le partage des responsabilités est réel, pas consultatif : le **DAF** est seul maître de l''économie
    de la contre-offre, de la trésorerie et du financement (§ 4, § 7). Le **Directeur commercial** est
    seul maître de la relation D, des canaux alternatifs et du calendrier (§ 5, § 6). Aucun des deux ne
    peut avancer sur le terrain de l''autre, et aucun engagement extérieur n''existe sans les deux signatures.


    ---


    ## 3. Le chiffre qui décide


    Sur les volumes D actuels : 14,9 M€ de CA, 31 % de marge brute, soit **4,62 M€ de marge**.


    Avec la remise de 9 % et l''engagement de +18 % effectivement tenu :

    CA 16,0 M€ − coûts 12,13 M€ = **3,87 M€ de marge. Soit 0,75 M€ de moins qu''aujourd''hui, l''année
    où l''engagement de volume est ferme.**


    Le volume qu''il faudrait atteindre pour seulement retrouver notre marge actuelle est de **+41 %**.
    D en engage 18 %, et seulement la première année.


    Années 2 et 3, volume revenu à son niveau actuel : marge 3,28 M€, soit **−1,34 M€ par an**. Au T2,
    D a retiré 11 % sans préavis ; à ce niveau, on tombe à 2,92 M€, **−1,70 M€ par an**.


    **Cumul sur trois ans, hypothèse médiane : environ −3,4 M€ de marge brute**, contre 1,2 M€ de pénalité
    de sortie. Sortir coûterait moins cher que rester. Un contrat dont la clause de rupture est plus économique
    que son exécution n''est pas un contrat, c''est un péage.


    À cela s''ajoute ce que l''exclusivité interdit pendant trois ans : la centrale régionale (3,5 M€,
    environ 1,1 M€ de marge annuelle) et la marketplace (0,4 à 2,2 M€ à +6 points de marge).


    ---


    ## 4. Ce que vous êtes autorisés à signer


    Un accord de fourniture privilégiée, dans ces limites cumulatives — **toutes obligatoires, aucune
    négociable** :


    1. **Durée : 12 mois maximum**, reconductible. Aucune signature à 24 ou 36 mois.

    2. **Aucune exclusivité de canal.** Au minimum, exclusion écrite et nominative de la centrale d''achat
    régionale et de la vente en ligne directe.

    3. **Zéro remise sur le socle de volume actuel.** Toute concession prend la forme d''une **ristourne
    de fin de période versée sur volume réalisé**, jamais d''une baisse de prix de cession.

    4. **Plafond économique absolu : 250 k€ de marge brute annuelle**, à volume constant. Le DAF chiffre
    chaque variante avant signature ; au-delà, c''est non.

    5. **Réciprocité du volume :** engagement ferme de D sur la première année, avec indemnité symétrique
    en cas de retrait. Un engagement ferme d''un seul côté n''est pas un engagement.

    6. **Préavis de 6 mois** sur tout déréférencement ou baisse de commandes supérieure à 10 %.

    7. **Pénalité de sortie ≤ celle qui pèse sur D.**


    Si les sept conditions ne sont pas réunies dans le document que D renvoie, **vous ne signez pas**.
    Vous n''appelez pas le conseil d''administration, vous ne cherchez pas un compromis intermédiaire
    : vous laissez expirer.


    ---


    ## 5. Ce que vous ne signez sous aucun prétexte


    Aucune exclusivité, quelle que soit sa durée. Aucune remise de prix sur le socle. Aucun engagement
    verbal ou téléphonique. Aucun protocole d''accord, lettre d''intention, term sheet ou « accord de
    principe » — ces documents engagent.


    **L''expiration d''une offre destructrice de valeur n''est pas une perte.** Mon absence n''est pas
    une raison de signer, c''est la raison pour laquelle cette note existe.


    ---


    ## 6. La visite de l''acheteur de D


    Elle a lieu, elle est utile, et elle est encadrée.


    Reçu par le DAF **et** le Directeur commercial ensemble — jamais l''un seul, jamais devant le comité
    complet. Une heure. Relevé de conclusions écrit dans les 24 h, envoyé à D par mail avec copie à moi.


    Phrase d''ouverture, à dire telle quelle : *« Notre direction générale a arrêté sa position par écrit
    avant son départ. Nous n''avons pas mandat pour signer une exclusivité. Nous avons mandat pour vous
    remettre une contre-proposition et pour écouter la vôtre. »*


    Le calendrier avancé au 20 août et l''ultimatum à huit jours sont un instrument de pression, pas un
    fait industriel. Nommez-le en réunion, calmement, une seule fois.


    ---


    ## 7. Ce qui se lance dès lundi 11 août


    **Directeur commercial** — Marketplace alimentaire : contrat signé et premières références en ligne
    avant le 31 août. Nous ne sommes liés par rien, donc rien ne l''empêche. Même 0,4 M€ à +6 points vaut
    mieux qu''une option théorique.

    — Centrale régionale : demande formelle d''un **engagement pilote sur 2 à 3 références** livrable
    au T4, sans attendre leur décision à cinq mois. Réponse demandée avant le 5 septembre.

    — **Avant le 10 août 12 h** : CA et marge, référence par référence, des huit références chez D, et
    identification des quatre menacées. C''est la donnée qui manque à tout le monde, y compris à moi.


    **DAF** — **Priorité absolue : obtenir avant le 18 août une ligne de crédit confirmée d''au moins
    1,5 M€**, sur nos comptes actuels, avant que le déréférencement n''apparaisse dans les chiffres. Un
    banquier finance une entreprise à 24 M€ de CA ; il finance mal la même entreprise trois semaines après
    avoir perdu 62 % de son débouché. C''est l''acte le plus important de la période.

    — Prévisionnel de trésorerie glissant à 13 semaines, mis à jour tous les lundis, diffusé au comité.

    — Gel de tout investissement non engagé et de tout recrutement non signé, à compter du 11 août.


    **Direction juridique / conseil externe** — Analyse, sous huitaine, de deux points : la rupture brutale
    de relations commerciales établies au regard de la baisse de 11 % du T2 et d''un déréférencement sans
    préavis, et le déséquilibre significatif que présente un engagement de volume ferme d''un seul côté.
    *Il s''agit d''une hypothèse de travail à faire confirmer, pas d''un acquis.* Objectif : une lettre
    recommandée prête, rappelant l''ancienneté de la relation et demandant un préavis raisonnable — à
    n''envoyer que sur déclenchement (§ 8).


    **DRH** — Dossier d''activité partielle pour Redon **complet, chiffré et prêt à déposer**, convocation
    du CSE rédigée et non envoyée. Rien n''est engagé tant que le seuil du § 8 n''est pas franchi. Un
    dossier prêt trois semaines à l''avance, c''est une semaine de trésorerie gagnée.


    ---


    ## 8. Déclencheurs observables et replis


    | Si… | Alors, sans m''attendre |

    |---|---|

    | D déréférence effectivement 4 références au comité du 20 août | Envoi de la lettre recommandée juridique
    sous 48 h. Redéploiement commercial sur marketplace + centrale. Pas de reprise de contact commercial
    avec D avant le 1er septembre. |

    | Plan de charge Redon projeté < 70 % sur 4 semaines consécutives | Dépôt du dossier d''activité partielle
    et convocation du CSE le jour même. Ne pas attendre que le seuil soit constaté, il suffit qu''il soit
    projeté. |

    | Trésorerie projetée < 1,4 M€ à horizon 13 semaines | Tirage de la ligne de crédit. Report de toutes
    les échéances reportables. Information du président du conseil sous 24 h. |

    | D revient avec une offre conforme aux 7 conditions du § 4 | Signature par les deux mandataires.
    Pas besoin de moi. |

    | D propose autre chose, quoi que ce soit | Non-signature. Accusé de réception poli, réexamen à mon
    retour. |

    | Un mandataire est absent ou empêché | Non-signature. La délégation ne se subdélègue pas. |


    ---


    ## 9. Ce qui pourrait me donner tort — et pourquoi cela ne change rien


    Mon calcul du § 3 suppose que les 69 % de coût de revient sont entièrement variables. **S''ils ne
    le sont pas**, le volume supplémentaire absorbe des charges fixes et l''équation change. Le DAF recalcule
    sous 48 h avec le coût variable réel :


    > Seuil de volume à l''équilibre : **v\* = 4,62 ÷ (13,56 − CV)**, où CV est le coût variable annuel
    des volumes D en M€.

    > Si CV ≤ 9,6 M€ (soit un taux variable ≤ 64,7 % du CA), alors v\* ≤ 1,18 et **la première année devient
    économiquement neutre ou favorable**.


    Ce calcul doit être fait et versé au dossier. Mais **il ne renverse pas la décision**, et je veux
    que ce point soit compris avant que quiconque ne s''en serve en réunion : la première année est la
    seule dont le volume est ferme. Années 2 et 3, la remise reste due et le volume redevient indicatif
    — face à un partenaire qui a démontré au T2 qu''il retirait 11 % sans préavis. Le défaut du contrat
    est structurel, pas tarifaire. Un bon prix sur une année ne rachète pas trois ans d''exclusivité contre
    une intention.


    **Ce qui renverserait vraiment ma position** est une seule chose : que D accepte un engagement de
    volume ferme et réciproque sur les trois années, avec les carve-outs du § 4. Si D l''accepte, signez
    — c''est prévu au § 4 et vous n''avez pas besoin de moi. S''il ne l''accepte pas, c''est qu''il sait
    ce que vaut son propre engagement.


    ---


    ## 10. Pourquoi je tranche ainsi


    Les deux branches font mal. Refuser, c''est un choc net, chiffrable, et dont on sort : perte de références,
    trois mois difficiles, chômage partiel possible à Redon, puis reconstruction sur deux canaux qui restent
    ouverts. Signer, c''est trois ans de marge en érosion, tous les canaux de sortie fermés par contrat,
    et une dépendance qui passe de 62 % à davantage — avec 1,2 M€ à payer pour en sortir.


    La première est une mauvaise année. La seconde est irréversible. **À dommage comparable, on ne choisit
    jamais la branche dont on ne revient pas** — surtout quand la porte se referme pendant que le dirigeant
    est injoignable et que le comité est divisé. Une entreprise qui ne peut plus perdre un client n''a
    plus de client : elle a un propriétaire.


    Je réponds de cette décision. Vous répondez de son exécution.


    **[Signature DG]** — 8 août


    ---


    Deux points sur lesquels vous voudrez peut-être trancher autrement avant de diffuser :


    - **La ligne de crédit avant le 18 août** est l''élément le plus fragile du plan — c''est court, et
    c''est le seul point où un échec vous laisse sans filet. Si votre banque ne suit pas dans ce délai,
    le seuil de trésorerie du § 8 doit être relevé de 1,4 à 1,8 M€.

    - **La règle « divergence = non-signature »** est volontairement brutale : elle donne un veto de fait
    à celui des deux qui veut refuser. C''est l''effet recherché tant que l''acte irréversible n''est
    que d''un côté, mais elle rend votre DAF minoritaire de fait sur le seul sujet où il s''est exprimé
    par écrit. Le § 2 lui rend un pouvoir réel ailleurs (financement, économie de l''offre) précisément
    pour cette raison.

    '
