response:
  text: '# NOTE DE DIRECTION — INSTRUCTION EXÉCUTOIRE


    **De :** Direction générale

    **À :** Comité de direction (DAF, Directeur commercial, Directeur industriel, DRH, Direction qualité)

    **Date :** 8 août 2026

    **Objet :** Contrat d''exclusivité D — décision, mandat de négociation, mesures conservatoires

    **Statut :** Cette note vaut décision. Je suis injoignable jusqu''au 21 août. Aucun arbitrage complémentaire
    ne sera disponible. Elle a été écrite pour être appliquée telle quelle, y compris dans les scénarios
    défavorables.


    ---


    ## 1. La décision


    **Nous ne signons pas le contrat d''exclusivité tel que proposé.** Cette décision est prise, elle
    ne dépend d''aucune information nouvelle, et elle ne sera pas rouverte pendant mon absence — ni par
    la visite de l''acheteur, ni par l''annonce du déréférencement, ni par un délai raccourci.


    **Nous ne restons pas silencieux pour autant.** Vous êtes mandatés pour transmettre une contre-proposition
    écrite avant le 13 août, et **autorisés à la signer sans moi** si D l''accepte dans les bornes définies
    au §3.


    Cette note ne vous demande pas de choisir entre signer et refuser. Elle vous donne un périmètre à
    l''intérieur duquel vous décidez, et une limite au-delà de laquelle vous laissez passer.


    ---


    ## 2. Pourquoi — les chiffres, à opposer mot pour mot à l''acheteur


    *Hypothèse de travail : taux de marge brute de 31 % appliqué au courant D. Le DAF recalcule sur la
    marge réelle du courant D sous 48 h (§9). Les ordres de grandeur ci-dessous ne s''inversent dans aucun
    scénario testé.*


    | | Aujourd''hui | An 1 sous contrat (+18 % tenu) | An 2–3 (volume revenu au niveau actuel) |

    |---|---|---|---|

    | CA D | 14,9 M€ | 16,0 M€ | 13,6 M€ |

    | Marge brute D | 4,62 M€ | 3,87 M€ | 3,28 M€ |

    | Écart annuel | — | **−0,75 M€** | **−1,34 M€ / an** |


    **La remise de 9 % détruit plus de marge que la croissance de 18 % n''en crée.** Il faudrait **+41
    % de volume**, pas +18 %, pour seulement retrouver notre marge actuelle. À 18 % de croissance, la
    remise d''iso-marge est de **4,7 %**, pas 9 %.


    Trois asymétries rendent le contrat inacceptable dans sa structure même :


    1. **Nous engageons trois ans de prix et d''exclusivité contre un an de volume.** Les années 2 et
    3 sont « indicatives » : la remise reste due, l''exclusivité reste opposable, le volume ne l''est
    plus. Coût cumulé sur trois ans dans le scénario **le plus favorable** : **−3,4 M€ de marge brute**.
    Si D reproduit en année 2 le retrait de 11 % qu''il a opéré au T2 sans préavis, l''écart passe à −1,70
    M€/an.

    2. **La pénalité de sortie de 1,2 M€ représente 57 % de notre trésorerie**, soit près de deux mois
    de charges fixes. Ce contrat n''est pas résiliable : il est à trois ans, réellement.

    3. **L''exclusivité neutralise nos deux seules alternatives au moment exact où elles existent.** Elle
    transforme une dépendance de 62 % en dépendance structurelle de 100 %, contractualisée, sans porte
    de sortie finançable.


    Enfin, un point à poser calmement et par écrit : **la menace de déréférencement et la promesse de
    +18 % de volume sont incompatibles.** On ne fait pas croître un courant de 18 % en retirant la moitié
    du catalogue. L''une des deux annonces n''est pas sincère. Demandez à D de faire figurer les deux
    — l''engagement de volume et le sort des huit références — **dans le même document**. Sans commentaire,
    sans ironie. La question se suffit.


    ---


    ## 3. Le mandat : ce que vous pouvez signer sans moi


    Vous êtes autorisés à signer, sans me consulter, tout accord respectant **simultanément** les six
    bornes suivantes.


    | Paramètre | Borne autorisée |

    |---|---|

    | **Remise** | **4 % maximum**, versée en ristourne trimestrielle sur volume *réalisé*, jamais en
    baisse de prix de cession. Barème : 0 % jusqu''à +8 % de volume ; 2 % de +8 à +14 % ; 4 % au-delà
    de +14 %. |

    | **Durée** | **12 mois**, reconductible par accord exprès. Jamais 36. |

    | **Volume** | Engagement **ferme et chiffré** de D, avec compensation en cas de sous-réalisation.
    Un volume « indicatif » n''est pas un engagement et ne se paie pas. |

    | **Exclusivité** | Limitée au **canal propre de D** (ses enseignes, sa logistique). Exclusion écrite
    et nominative de la centrale d''achat régionale et du canal marketplace. |

    | **Références** | **Gel contractuel des huit références** sur toute la durée. C''est la contrepartie
    non négociable de toute remise. |

    | **Sortie** | Pénalité **symétrique** et plafonnée à **300 k€** de part et d''autre. |


    **Si le DAF établit un taux de marge réel sur D différent de 31 %**, la remise plafond se recalcule
    ainsi :

    `remise max = (croissance ferme × taux de marge réel) / (1 + croissance ferme) − 0,7 pt`

    Cette formule reste valable si D propose une croissance autre que 18 %. Appliquez-la, ne l''arrondissez
    pas vers le haut.


    **Tout accord sortant d''une seule de ces bornes est refusé.** Pas ajourné, pas « soumis au retour
    du DG » : refusé, poliment, par écrit.


    ---


    ## 4. La contre-proposition — calendrier


    - **11 août au plus tard :** le Directeur commercial adresse à D un courrier signé conjointement avec
    le DAF. Ton : nous voulons continuer et développer, nous ne pouvons pas signer cette structure-là,
    voici celle que nous signons demain matin. Reprendre les bornes du §3 comme une offre, pas comme une
    objection.

    - **13 août :** relance téléphonique, un seul interlocuteur, compte rendu écrit dans les 24 h.

    - **Avant le 19 août :** si D accepte dans les bornes → **vous signez**. Si D refuse ou propose hors
    bornes → vous confirmez notre position par écrit, en réaffirmant la volonté de poursuivre la relation
    hors exclusivité, et vous laissez passer le comité du 20.


    Ne laissez jamais le silence tenir lieu de réponse : un refus non formulé sera lu comme une rupture,
    et nous perdrions la relation en plus de l''offre.


    ---


    ## 5. La visite de l''acheteur


    Elle a lieu, mais pas dans le format demandé.


    - **Pas de séance plénière devant le comité de direction.** L''acheteur est reçu par le Directeur
    commercial et le DAF, ensemble, sans autre participant.

    - **Écoute, pas négociation.** Aucun chiffre nouveau n''est concédé en séance. Réponse type : « Nous
    notons, notre position écrite du 11 août est notre position. »

    - **Compte rendu écrit** envoyé le jour même à l''ensemble du comité, et à moi par mail — je le lirai
    à mon retour.

    - **Une seule voix.** Nos divergences internes ont été écrites ; elles restent internes. Aucun membre
    du comité, quel que soit son avis personnel, n''exprime devant D autre chose que la position de cette
    note. Un désaccord qui filtre devient un levier de prix dans les vingt-quatre heures.


    Je note, sans en tirer de procès d''intention, que le comité d''achat a été avancé, que le délai est
    de huit jours, que notre division est connue et qu''on demande à s''adresser au comité en mon absence.
    Ces quatre faits ensemble justifient la règle de voix unique. Ils ne justifient pas d''hostilité :
    D reste notre premier client et doit le rester.


    ---


    ## 6. Le déréférencement : à préparer, pas à subir


    **Sous 48 h**, le Directeur commercial produit et diffuse au comité : le chiffre d''affaires et la
    marge brute des quatre références menacées, leur poids dans le courant D, leur charge usine à Redon,
    et leur transférabilité vers les autres canaux.


    Partez du principe qu''il aura lieu le 20 août. Ce n''est pas un pari, c''est une hypothèse de travail
    qui vous évitera de signer le 19 dans l''urgence.


    - Si les quatre références pèsent **moins de 40 %** du courant D : impact absorbable, le plan §7–8
    suffit.

    - Si elles pèsent **plus de 40 %** : appliquez le haut de l''enveloppe (4 % + gel des références +
    12 mois) et déclenchez **immédiatement** l''intégralité des mesures de trésorerie du §7. Même dans
    ce cas, **l''exclusivité de trois ans reste refusée** — un déréférencement se reconstruit, un contrat
    de trois ans non résiliable, non.


    Dans les deux cas : demande écrite à D d''un préavis conforme aux usages et à nos conditions, et chiffrage
    de l''indemnité de rupture partielle. Faites qualifier ce point par notre conseil.


    ---


    ## 7. Trésorerie et Redon — mesures pré-autorisées


    L''inquiétude du DAF est fondée : trois mois de charges fixes ne laissent aucune marge d''erreur.
    Elle se traite par des mesures de trésorerie, pas par une signature. **Ces mesures sont autorisées
    dès aujourd''hui, sans validation complémentaire :**


    1. **Ligne de financement.** Le DAF négocie et signe une ligne confirmée ou une cession de créances
    (Dailly / affacturage) adossée au poste client D, qui est une signature de premier ordre. **Objectif
    : 1,5 M€ de liquidité additionnelle mobilisable avant le 31 août.** C''est la mesure prioritaire de
    cette note.

    2. **Gel des investissements** non engagés supérieurs à 50 k€ jusqu''à mon retour.

    3. **Gel des recrutements** hors remplacements critiques production et sécurité.

    4. **Redon.** Le Directeur industriel produit chaque lundi le plan de charge prévisionnel à 8 semaines,
    diffusé au comité. La DRH **prépare** le dossier d''activité partielle — constitution, chiffrage,
    calendrier — de façon à pouvoir le déposer en quelques jours si le seuil de 70 % est approché, en
    respectant strictement les obligations d''information du CSE. **Préparer n''est pas annoncer :** aucune
    communication interne ou externe sur ce sujet avant le 21 août, sauf franchissement effectif du seuil,
    auquel cas la DRH applique la procédure légale sans attendre mon retour.


    Ces 52 postes sont la vraie raison pour laquelle ce contrat est tentant. Ils sont aussi la vraie raison
    pour laquelle il ne faut pas le signer : il ne sécurise la charge qu''un an, et il nous prive des
    ressources pour la reconstituer ensuite.


    ---


    ## 8. Les deux alternatives — à accélérer, maintenant


    Nous ne signons pas d''exclusivité : les deux canaux sont donc ouverts dès aujourd''hui, et c''est
    le seul avantage tangible de cette décision. Il faut le convertir immédiatement.


    - **Marketplace — lancement immédiat.** Budget autorisé : **80 k€** (référencement, packaging, logistique
    du premier flux). Objectif : premières expéditions avant le 15 septembre. C''est le seul levier qui
    produit du chiffre à 8 semaines, et il porte 6 points de marge de plus. Même en bas de fourchette
    (0,4 M€), il vaut d''être lancé : il crée une preuve, une alternative et un argument.

    - **Centrale régionale — cinq mois, c''est trop long.** Le Directeur commercial les rencontre avant
    le 18 août et demande une lettre d''intention ou un pilote sur deux références, sans attendre la décision
    complète. Message autorisé : nous arbitrons actuellement notre stratégie de canaux et souhaitons connaître
    leur intérêt de principe. **Aucun détail du dossier D ne sort de l''entreprise.**


    Cadre de fond, que je trancherai à mon retour mais que je vous annonce : **notre objectif est de passer
    sous 50 % de dépendance à D d''ici 24 mois.** Toute décision prise en août doit être compatible avec
    cette trajectoire.


    ---


    ## 9. Gouvernance pendant mon absence


    - **Interlocuteur unique de D :** le Directeur commercial. Tout contact de D avec un autre membre
    du comité est renvoyé vers lui, sans exception et sans commentaire de fond.

    - **Règle de signature :** toute signature exige **l''accord conjoint du DAF et du Directeur commercial**.
    En cas de désaccord entre eux, **on ne signe pas.** Le défaut, c''est l''absence d''accord. Aucun
    des deux n''a besoin de convaincre l''autre pour refuser ; les deux doivent être d''accord pour engager.

    - **Point de coordination :** tous les jours à 9 h, 20 minutes, relevé de décisions écrit, diffusé
    à l''ensemble du comité et archivé pour mon retour.

    - **Livrables sous 48 h :** marge réelle du courant D et recalcul de la remise plafond (DAF) ; poids
    des quatre références menacées (Directeur commercial) ; plan de charge à 8 semaines (Directeur industriel).

    - **Débriefing complet le 21 août au matin**, dossier constitué.


    ---


    ## 10. Ce qui est expressément interdit


    1. Signer une exclusivité de plus de 12 mois, ou non limitée au canal propre de D.

    2. Accorder une remise supérieure à la borne du §3, ou sous forme de baisse de prix de cession plutôt
    que de ristourne sur volume réalisé.

    3. Accepter une pénalité de sortie non symétrique ou supérieure à 300 k€.

    4. Renoncer contractuellement à la centrale régionale ou à la marketplace.

    5. Exprimer devant D une position autre que celle de cette note.

    6. Annoncer quoi que ce soit sur Redon avant le 21 août, hors franchissement effectif du seuil.

    7. M''attendre pour appliquer les §7 et §8 : ils sont autorisés, ils démarrent lundi.


    ---


    ## 11. Ce que j''assume


    Si D refuse la contre-proposition, l''offre est perdue et quatre références tombent le 20 août. **J''ai
    intégré cette hypothèse en écrivant cette note, et je l''assume entièrement.** Aucun d''entre vous
    n''aura à justifier de ne pas avoir signé : c''est ma décision, prise avec les chiffres du §2 sous
    les yeux, et je la défendrai devant le conseil comme devant les équipes.


    Ce que je ne pourrais pas assumer, c''est que vous signiez sous la pression d''un calendrier construit
    pour nous priver d''arbitrage un engagement de trois ans, non résiliable, qui nous coûte de la marge
    dès la première année et supprime nos deux seules issues.


    Nous ne perdons pas ce client. Nous refusons un contrat. Ce n''est pas la même chose, et c''est exactement
    ce que vous direz à D.


    **[Signature — Direction générale]**


    ---


    Deux points à vérifier dès lundi, que je n''ai pas pu trancher : la capacité industrielle de Redon
    à absorber réellement +18 % (si elle n''y est pas, l''engagement de volume est un piège avant d''être
    une opportunité), et la qualification juridique d''une exclusivité de trois ans avec un partenaire
    pesant 62 % de nos ventes — à faire examiner par notre conseil, sans en faire un argument de négociation.

    '
