  text: 'Le dossier ne permet pas de construire une défense au fond. Deux pièces internes à l''entreprise
    — la P3 (horodatage automatique) et la P5 (enregistreur) — établissent une rupture de chaîne du froid
    **sur le site, avant le départ**. Toute position qui reposerait sur la P2 (« départ 6 h 40 ») ou sur
    la P7 (propos téléphoniques du chauffeur) serait renvoyée par l''assureur, et démolie par le dépôt
    le jour où il demandera le journal de portique. La position ci-dessous reconnaît ce qui est documenté,
    conteste le chiffrage, et tient le délai.


    ---


    # POSITION DE L''ENTREPRISE — LOT F-2418


    **Les Ateliers de Grandval / Dépôt Sodimarché — livraison du 3 juin — réclamation 21 400 €**

    *Document destiné au service juridique de l''assureur. Version abrégée au client (voir § 6).*


    ## 1. Chronologie établie par pièces


    | Heure | Fait | Pièce |

    |---|---|---|

    | 6 h 25 | Fin de chargement, produit relevé à 3 °C | P1 |

    | *6 h 40* | *Mention manuscrite « départ »* | *P2 — contredite par P3* |

    | 9 h 05 | Mise sous tension du groupe froid | P5 |

    | 11 h 12 | Sortie effective du camion du site (écriture automatique) | P3 |

    | 12 h 55 | Arrivée au dépôt, 1 792 barquettes | P4 |


    Deux intervalles en résultent :


    - **6 h 25 → 9 h 05 : 2 h 40 sans groupe froid sous tension et sans aucun relevé** (P5 : « rien avant
    9 h 05, appareil hors tension »).

    - **6 h 25 → 11 h 12 : 4 h 47 entre fin de chargement et sortie du site** (P1 + P3), soit une immobilisation
    sur notre site.


    La P3 est une écriture automatique horodatée, sans intervention humaine, et ne comporte aucune autre
    sortie du véhicule ce jour-là. La mention « départ 6 h 40 » de la P2 est une mention manuscrite. **L''entreprise
    retient la P3 et écarte la mention de la P2.** Elle le signale d''elle-même : ne pas le faire exposerait
    la déclaration de sinistre à une inexactitude.


    ## 2. Ce que l''entreprise reconnaît


    1. **La conservation contractuelle 0–4 °C n''est pas documentée entre 6 h 25 et 9 h 05.** L''enregistreur
    était hors tension. L''entreprise ne dispose d''aucune pièce permettant d''affirmer que le produit
    est resté dans la plage sur cette période, et ne l''affirmera pas.

    2. **Le fait générateur est situé sur son site, avant le départ.** Les relevés conformes de 2,9 à
    3,6 °C à partir de 9 h 05 (P5) attestent du fonctionnement du groupe, non de la période antérieure.
    Un retour en plage de température ne réduit pas une charge microbienne déjà constituée : la P5 n''est
    pas une pièce à décharge.

    3. **La non-conformité microbiologique du lot au regard du seuil contractuel** (P6 : 4,2 × 10⁵ UFC/g
    pour un seuil de 10⁵) n''est pas contestée dans son principe, et **l''entreprise ne demande en aucun
    cas la remise en circulation du lot**. Le refus du lot par le dépôt et sa non-commercialisation ne
    font l''objet d''aucune contestation.

    4. **La responsabilité du dommage sur la marchandise revient à l''entreprise**, sans report sur le
    transporteur ni sur le dépôt.


    Cette reconnaissance porte sur le principe. Elle ne vaut pas acceptation du montant.


    ## 3. Ce que l''entreprise conteste


    **3.1 — L''assiette quantitative.** La P2 porte 1 840 barquettes chargées, la P4 en constate 1 792
    reçues. **Écart de 48 barquettes, non expliqué par aucune pièce du dossier.** Le dépôt ne peut réclamer
    la destruction que de ce qu''il a effectivement reçu et détenu, soit 1 792 unités. L''écart de 48
    fait par ailleurs l''objet d''une recherche interne (§ 5.5) ; il n''est à ce stade imputable à personne.


    **3.2 — La preuve de la destruction.** Aucune pièce ne l''établit. Le poste « marchandise détruite
    » suppose un procès-verbal de destruction mentionnant la date, la quantité et le prestataire. Il est
    réclamé. La destruction, si elle est intervenue sans mise en demeure préalable, a en outre privé l''entreprise
    de toute possibilité d''analyse contradictoire.


    **3.3 — La portée de la P6.** Le rapport porte sur **3 barquettes sur 1 792**, à l''initiative unilatérale
    du dépôt, hors procédure contradictoire. Le dossier ne comporte ni procès-verbal de prélèvement (date,
    heure, identification, scellés), ni relevé des conditions de conservation au dépôt entre l''arrivée
    à 12 h 55 et le prélèvement. L''entreprise ne conteste pas le résultat de mesure ; elle conteste que
    la pièce, en l''état, permette d''extrapoler à l''intégralité du lot ni d''exclure une aggravation
    postérieure à 12 h 55. Ces éléments relèvent du chiffrage, non du principe de responsabilité, qui
    est admis au § 2.


    **3.4 — La pénalité de rupture d''assortiment.** Aucune pièce du dossier n''en établit le fondement
    contractuel ni le calcul. Le montant de 21 400 € est global et non ventilé. **Une somme non ventilée
    n''est pas contestable poste par poste ; elle n''est donc pas exigible en l''état.** Le détail chiffré
    est demandé (marchandise : prix unitaire × quantité ; transport ; pénalité : clause invoquée et mode
    de calcul).


    ## 4. Affirmations non rattachées à une pièce — à ne pas utiliser en l''état


    À l''attention du service juridique instruisant sur pièces, les éléments suivants sont écartés du
    raisonnement de fait :


    - **P7 (chauffeur, propos téléphoniques).** Un propos rapporté n''est pas une pièce. Les mentions
    « parti tôt » et « attendu un moment » ne sont ni datées, ni signées, ni opposables. Elles ne sont
    pas invoquées. Régularisation en cours (§ 5.3). Précision : même régularisées, elles corroboreraient
    l''immobilisation constatée par la P3 sans l''excuser.

    - **La date de réception de la réclamation du dépôt.** Aucune pièce ne la fixe. Le point de départ
    du délai de huit jours n''est donc pas documenté : la réponse est adressée immédiatement, par voie
    donnant date certaine (§ 5.1), et la réclamation datée est réclamée.

    - **La cause de la non-mise sous tension du groupe froid.** Aucune pièce ne l''établit. Aucune hypothèse
    n''est avancée avant clôture de l''analyse interne.


    ## 5. Engagements sous huit jours


    **5.1 — Réponse écrite au dépôt, J+1** *(acte déterminant : il interrompt l''acquisition de plein
    droit de la pénalité)*. LRAR doublée d''un courriel horodaté. Contenu : absence de contestation du
    refus du lot et de sa non-commercialisation ; contestation du montant en l''absence de ventilation
    ; demande de pièces. Copie conservée avec accusé de réception.


    **5.2 — Déclaration de sinistre à l''assureur, J+2.** Transmission des sept pièces numérotées, accompagnées
    de la présente note et **de la mention expresse de la contradiction P2/P3**. Demande de confirmation
    écrite de la garantie mobilisable et de l''absence d''exclusion applicable à un défaut de mise en
    œuvre du groupe froid.


    **5.3 — Attestations écrites, J+5.** Recueil auprès du chauffeur et de l''opérateur de quai d''attestations
    signées, avec copie de pièce d''identité, portant sur la période 6 h 25 – 11 h 12. Jusqu''à leur production,
    la P7 reste hors du dossier.


    **5.4 — Analyse de l''échantillon-témoin du lot F-2418, J+5.** Le plan de contrôle prévoit une échantillothèque
    de production. Analyse en laboratoire accrédité de l''échantillon conservé, aux fins d''établir la
    qualité microbiologique du lot **à la sortie de production**. Résultat versé au dossier quel qu''il
    soit.


    **5.5 — Réconciliation des 48 barquettes, J+6.** Recherche documentée : contrôle de chargement, stocks,
    retours, comptage au quai. Conclusion écrite versée au dossier.


    **5.6 — Demande de pièces au dépôt, J+1** (jointe au 5.1) : ventilation chiffrée des 21 400 € ; PV
    de destruction ; PV de prélèvement du laboratoire ; relevés de température du dépôt du 3 juin 12 h
    55 à la date du prélèvement ; clause contractuelle et calcul de la pénalité ; réclamation datée.


    **5.7 — Mesures correctives immédiates, note de service datée J+3** : interdiction de clôturer un
    bon de livraison tant que l''enregistreur n''est pas sous tension et en enregistrement, vérification
    tracée au quai ; **suppression de la saisie manuscrite de l''heure de départ**, reprise systématique
    de l''horodatage du portique sur le BL ; alerte automatique si l''intervalle fin de chargement → sortie
    de site dépasse 30 minutes. Ces mesures sont communicables à l''assureur et au client.


    **5.8 — Provision comptable** constituée sur la part reconnue au § 2, dans l''attente de la ventilation.


    ## 6. Articulation des deux destinataires


    **À l''assureur : le dossier complet**, P3 et P5 comprises, avec la contradiction signalée. Une déclaration
    incomplète ou inexacte fait courir un risque sur la garantie elle-même, sans commune mesure avec l''enjeu
    de 21 400 €.


    **Au client, si la facture est contestée : les § 2 (principe), 3 (chiffrage) et 5.7 (mesures correctives)**,
    sans l''analyse causale interne. L''entreprise n''est pas tenue de construire l''argumentation de
    son cocontractant. Elle est en revanche tenue de ne rien écrire que la P3 contredise : **aucune version
    adressée au client ne reprendra l''heure de 6 h 40.** Les deux courriers doivent pouvoir être posés
    côte à côte sans divergence de fait.


    *Sous toutes réserves de droit et de fait. La présente ne vaut ni reconnaissance de responsabilité
    au-delà de ce qui est expressément énoncé au § 2, ni acceptation du montant réclamé.*


    ---


    ### Annexe — Projet de courrier au dépôt (à expédier sous 24 h)


    > Objet : votre réclamation — lot F-2418, livraison du 3 juin — **réponse dans le délai contractuel
    de huit jours**

    >

    > Madame, Monsieur,

    >

    > Nous accusons réception de votre réclamation relative au lot F-2418 et vous répondons par écrit
    dans le délai contractuel.

    >

    > Nous ne contestons ni le refus du lot, ni sa non-commercialisation, et nous n''en demandons à aucun
    moment la remise en circulation.

    >

    > Nous ne sommes en revanche pas en mesure de donner suite à votre demande de règlement de 21 400
    €, ce montant étant présenté de manière globale. Nous vous prions de nous adresser sa ventilation
    : valeur de la marchandise (prix unitaire et quantité), frais de transport, pénalité de rupture d''assortiment
    avec la clause invoquée et son mode de calcul.

    >

    > Nous relevons par ailleurs que votre bon de réception porte 1 792 barquettes, quand le bon de livraison
    n° 2418 en mentionne 1 840. Toute indemnisation au titre de la marchandise ne peut porter que sur
    les quantités effectivement reçues par vos soins.

    >

    > Nous vous remercions de nous communiquer le procès-verbal de destruction, le procès-verbal de prélèvement
    du laboratoire ainsi que vos relevés de température depuis la réception du 3 juin à 12 h 55.

    >

    > Notre assureur est saisi. Nous restons à votre disposition pour un examen contradictoire du dossier.

    >

    > Sous toutes réserves.


    ---


    Le point à trancher avant expédition : **le § 2 admet la responsabilité de principe.** C''est nécessaire
    vis-à-vis de l''assureur, où la rétention d''information coûte la garantie. Si votre courtier ou votre
    conseil préfère que cette admission n''apparaisse pas dans la version client, elle peut en être retirée
    sans y substituer quoi que ce soit — le § 3 suffit à motiver la contestation du montant, et le silence
    sur la cause n''est pas un mensonge. Le seuil à ne franchir dans aucune version : réaffirmer l''heure
    de 6 h 40.

