response:
  text: '# NOTE DE DIRECTION — MANDAT D''EXÉCUTION


    **Objet :** contrat d''exclusivité proposé par le distributeur D — décision, mandat de négociation,
    plan de continuité

    **Destinataires :** DAF, Directeur commercial, Directeur industriel, DRH

    **Période couverte :** J+1 à J+21

    **Statut :** exécutoire. Aucun arbitrage complémentaire ne sera disponible pendant cette période.


    ---


    ## 0. Ce que vous n''aurez pas à porter


    Je pars demain et je serai injoignable trois semaines. Cette note est écrite pour que vous n''ayez
    à deviner aucune de mes intentions. Elle tranche, elle borne, et elle prévoit les cas défavorables.


    Si D déréférence quatre de nos références en septembre, la responsabilité de ce scénario est la mienne,
    prise ici, par écrit, en connaissance de cause. Vous exécutez un mandat ; vous ne prenez pas le risque
    à ma place.


    ---


    ## 1. La décision


    **1.1 — Le contrat d''exclusivité tel que proposé par D n''est pas signé.** Cette décision n''est
    pas déléguée et n''est pas révisable par le comité.


    Le calcul, que chacun doit pouvoir refaire :


    Notre marge brute est de 31 %. Une remise de 9 % sur le prix de cession supprime **29 % de la marge
    unitaire** (9 / 31). Pour que + 18 % de volume compense exactement cette remise, il faudrait une marge
    brute sur le périmètre D de **59 %**. Aucune de nos références n''en approche, ni chez nous ni dans
    ce métier.


    Conséquence, à marge 31 % sur les 14,9 M€ réalisés avec D :


    | Scénario | Marge brute D | Écart annuel |

    |---|---|---|

    | Aujourd''hui, sans contrat | 4,62 M€ | référence |

    | Année 1, engagement de + 18 % tenu | 3,87 M€ | **– 0,75 M€** |

    | Années 2 et 3, volume revenu au niveau actuel | 3,28 M€ | **– 1,34 M€ / an** |

    | Années 2 et 3, D reproduit sa coupe du T2 (– 11 %) | 2,92 M€ | **– 1,70 M€ / an** |


    Cumul sur trois ans, hypothèse médiane : **– 3,4 M€ de marge brute**, pour une trésorerie de 2,1 M€
    et une pénalité de sortie de 1,2 M€.


    **1.2 — Le point structurant n''est pas le prix, c''est la durée asymétrique.** L''engagement de volume
    porte sur un an. La remise et l''exclusivité portent sur trois ans. Dès le treizième mois, D peut
    réduire ses commandes comme il l''a fait au deuxième trimestre — sans préavis, sans recours de notre
    part — tout en conservant les 9 %. Nous aurions alors payé la remise sans contrepartie, avec 1,2 M€
    à débourser pour en sortir.


    **1.3 — Et pendant ces trois ans, l''exclusivité nous interdit contractuellement de construire la
    sortie.** Elle ferme la centrale régionale (3,5 M€ de potentiel) et la marketplace (marge supérieure
    de 6 points). Le seul argument sérieux en faveur de la signature — « cela nous donne douze mois d''oxygène
    pour nous diversifier » — est annulé par la clause d''exclusivité elle-même. Ce n''est pas de l''oxygène
    : c''est du volume à marge dégradée qui consomme du besoin en fonds de roulement dès le premier trimestre.


    **1.4 — Nous ne rompons pas avec D.** Nous répondons dans les huit jours par une contre-proposition
    écrite, signable par le comité dans les bornes du § 2.


    ---


    ## 2. Mandat de négociation — ce que le comité peut signer sans moi


    ### 2.1 Contre-proposition à remettre à D


    **Remise indexée sur volume réellement constaté, versée trimestriellement à terme échu, jamais par
    anticipation.** Chaque palier est calé pour que le volume additionnel couvre exactement la dilution
    de marge : nous pouvons le démontrer à D, ce qui rend la proposition défendable et non arbitraire.


    | Remise | Seuil de volume sur 12 mois glissants |

    |---|---|

    | 0 % | en deçà de + 7 % |

    | 2 % | à partir de + 7 % |

    | 4 % | à partir de + 18 % |

    | 6 % | à partir de + 32 % |


    **Autres termes proposés :**

    - **Durée :** 18 mois, clause de revoyure à 9 mois.

    - **Exclusivité :** de référence, sur les 8 SKU actuellement référencées, **circuit GMS uniquement**.
    Vente libre hors GMS : marketplace, restauration hors foyer, centrales régionales, export.

    - **Volume plancher ferme :** 90 % du volume 2025 sur 12 mois glissants. En dessous, la remise tombe
    à zéro rétroactivement et l''exclusivité s''éteint de plein droit.

    - **Sortie :** aucune pénalité, ou pénalité symétrique plafonnée à 150 k€ de part et d''autre.

    - **Tarif de base :** inchangé. La remise est le seul levier concédé.


    ### 2.2 Bornes du mandat


    Le comité peut signer, **à l''unanimité des quatre membres et sur procès-verbal écrit**, tout accord
    respectant l''ensemble des bornes suivantes :


    | Paramètre | Borne maximale acceptable |

    |---|---|

    | Remise | 6 %, exclusivement conditionnée à un volume constaté |

    | Durée | 24 mois |

    | Exclusivité | GMS uniquement, jamais tous canaux |

    | Volume plancher | présent et opposable, ≥ 85 % du volume 2025 |

    | Pénalité de sortie | 150 k€, symétrique |


    ### 2.3 Interdits absolus


    Aucune de ces clauses ne peut être signée, quel que soit le contexte, quelle que soit la pression
    :


    - exclusivité tous canaux ;

    - durée supérieure à 24 mois ;

    - remise non conditionnée à un volume constaté ;

    - remise supérieure à 6 % ;

    - pénalité de sortie asymétrique ou supérieure à 150 k€ ;

    - clause de non-concurrence, droit de regard de D sur notre gamme, ou approbation préalable de nos
    autres clients.


    ### 2.4 Règle de défaut


    **En cas de doute sur l''interprétation d''une borne, on ne signe pas.** Le refus est réversible ;
    la signature ne l''est pas. Un dossier non conclu à mon retour est un résultat acceptable. Un contrat
    signé hors mandat ne l''est pas.


    Le dépassement de mandat ne peut être autorisé que par le président du conseil, par écrit, sur saisine
    motivée du DAF. **Mon absence ne transfère pas ce pouvoir au comité.**


    ---


    ## 3. Si D refuse et déréférence


    Hypothèse retenue : comité d''achat de septembre, 4 références sur 8 sorties. Si ces 4 pèsent la moitié
    du volume D — à confirmer au J+1 —, l''impact est de – 7,4 M€ de chiffre d''affaires et – 2,3 M€ de
    marge, avec passage de Redon sous 70 % de plan de charge.


    **Nous acceptons ce pire cas en connaissance de cause, parce qu''il est réversible.** Un référencement
    se reconquiert. Une exclusivité de trois ans ne se déchire pas à moins de 1,2 M€, et elle nous prive
    entre-temps de tout moyen de reconstruire.


    **Séquence, sans attendre septembre :**


    | Échéance | Action | Responsable |

    |---|---|---|

    | J+1 | Poids exact en CA et en marge des 8 références chez D, dont les 4 menacées | Dir. commercial
    + DAF |

    | J+2 | Contre-proposition remise en main propre, au directeur des achats **et** à son n+1 le même
    jour. Ton : partenariat, jamais ultimatum | Dir. commercial |

    | J+3 | Centrale régionale : proposition de référencement partiel anticipé sur 2 références, livrable
    sous 60 jours, sans attendre leur décision globale. Objectif 0,8 M€ engagés avant fin octobre | Dir.
    commercial |

    | J+3 | Marketplace : ouverture opérationnelle sur les 4 références menacées uniquement. Budget de
    lancement plafonné à 120 k€ | DAF |

    | J+10 | Si D n''a pas répondu : une relance écrite, unique, sans concession nouvelle | Dir. commercial
    |

    | Septembre | Si déréférencement confirmé : **aucune renégociation dans l''urgence.** Application
    directe du § 4 | Comité |


    Ne pas ouvrir la marketplace sur les 4 références non menacées : nous ne donnons pas à D un motif
    de représailles sur le périmètre qu''il ne conteste pas.


    ---


    ## 4. Trésorerie et Redon — déclencheurs automatiques


    Ces mesures s''appliquent **sans réunion et sans arbitrage**, dès que le seuil observable est franchi.


    | Déclencheur | Action | Responsable |

    |---|---|---|

    | J+1 | Gel de tout investissement non engagé juridiquement. Gel des embauches hors remplacement de
    production | DAF |

    | J+2 | Négocier et signer une ligne d''affacturage ou de découvert confirmée de 1,5 M€ — **même si
    nous ne l''utilisons pas**. Mandat plafonné à 1,5 M€ et 24 mois | DAF |

    | Trésorerie < 1,6 M€ | Étalement fournisseurs à 60 jours, priorité aux règlements production. Information
    du conseil sous 48 h | DAF |

    | Trésorerie < 1,2 M€ | Saisine du président du conseil. Plus aucune dépense nouvelle > 25 k€ | DAF
    |

    | Plan de charge Redon < 78 % sur 3 semaines glissantes | Dossier d''activité partielle **déposé,
    non déclenché**. Préparation, pas annonce | DRH + Dir. industriel |

    | Plan de charge Redon < 70 % sur 3 semaines glissantes | Activité partielle déclenchée sur les postes
    concernés, durée initiale 6 semaines, **non renouvelable sans mon retour** | DRH + Dir. industriel
    |


    **Interdits pendant mon absence, sans exception :** tout licenciement, toute rupture conventionnelle,
    toute annonce de fermeture ou de réduction de site, toute communication externe sur Redon.


    ---


    ## 5. Communication


    - **Vers D :** une seule voix, le directeur commercial. Aucun autre membre du comité ne commente le
    dossier, y compris oralement. Si ma disponibilité est évoquée, la réponse est que le comité est mandaté
    pour conclure — ce qui est exact.

    - **Vers Redon :** rien avant le seuil de 78 %. Aucune rumeur de fermeture ne doit naître d''une fuite
    du comité. Le message factuel du directeur industriel et de la DRH est rédigé dès J+5 et conservé,
    prêt, non diffusé.

    - **Vers les canaux alternatifs :** nous communiquons une ouverture de capacité, jamais une difficulté
    commerciale. La centrale régionale ne doit pas apprendre que nous sommes sous pression avant d''avoir
    décidé.


    ---


    ## 6. Gouvernance en mon absence


    1. Le comité décide **à l''unanimité des quatre membres** sur tout point relevant du § 2. Trois voix
    sur quatre ne suffisent pas.

    2. Chaque décision fait l''objet d''un procès-verbal d''une page : fait déclencheur, borne appliquée,
    décision, quatre signatures.

    3. Le DAF est dépositaire du pouvoir de signature dans les bornes du § 2, et de rien d''autre.

    4. Aucun engagement supérieur à 24 mois ou à 500 k€ ne peut être pris pendant mon absence, quel qu''en
    soit le motif.

    5. **En cas de désaccord persistant : on ne fait rien.** L''inaction est la position par défaut et
    elle est explicitement autorisée. Personne n''aura à se justifier de n''avoir pas signé.


    ---


    ## 7. Ce qui renverserait cette décision — et ce qui ne la renverse pas


    Une seule observation justifierait de reconsidérer, et je la nomme précisément pour que personne n''ait
    à en juger :


    > **Si la marge brute réelle sur le périmètre D, calculée en coûts variables complets par le DAF au
    J+1, dépasse 55 %**, alors l''arithmétique du § 1.1 s''inverse et le contrat redevient discutable.
    Dans ce cas seul, le comité transmet le calcul au président du conseil et n''agit que sur son instruction
    écrite.


    Tout le reste est déjà prévu et **ne rouvre pas le débat** : durcissement du discours de D, extension
    de la menace aux 8 références, amélioration de la seule remise, promesse verbale de volume sur trois
    ans, délai raccourci, appel direct à un membre du comité. Ces événements sont attendus. Ils confirment
    le diagnostic ; ils ne le contredisent pas.


    ---


    ## 8. Première action


    **Aujourd''hui avant 18 heures :** le directeur commercial et le DAF produisent conjointement le tableau
    du poids en chiffre d''affaires et en marge des 8 références chez D, dont les 4 menacées.


    Ce tableau conditionne tout le reste et constitue la pièce jointe n° 1 du premier procès-verbal.


    *Le Directeur général*


    ---


    Trois remarques hors note, pour vous seul :


    **Le verdict est robuste à l''incertitude comptable.** Le seuil de neutralité de 59 % n''est pas une
    estimation : c''est une identité arithmétique (`m / (m − 0,09) = 1,18`). Même si la marge réelle sur
    D est de 24 % ou de 40 %, le contrat détruit de la marge dès l''année 1. C''est pourquoi le § 7 ne
    laisse qu''une seule porte de sortie, très haut placée, et qu''elle ne s''ouvrira pas.


    **Le meilleur contre-argument, et pourquoi il ne tient pas.** « Refuser déclenche le déréférencement,
    Redon tombe, on brûle 2,1 M€ avant que la centrale réponde dans cinq mois ; signer achète douze mois.
    » Il échoue sur deux points : les douze mois achetés sont contractuellement stériles (l''exclusivité
    interdit d''en faire quoi que ce soit), et ils sont payés cash en marge et en BFR dès le premier trimestre.
    On paierait pour perdre du temps.


    **J''ai voulu écrire cette note sans vous, faute de mieux.** Trois semaines d''injoignabilité sur
    une décision à 1,2 M€ de pénalité est le vrai point faible du dispositif — pas le contrat de D. Si
    vous pouvez tenir une fenêtre de contact unique, même de trente minutes à date fixe, réservée exclusivement
    à un dépassement de mandat, elle vaut plus que n''importe quelle clause ci-dessus. Le § 6.5 est conçu
    pour que son absence ne soit pas fatale, pas pour qu''elle soit souhaitable.

    '
