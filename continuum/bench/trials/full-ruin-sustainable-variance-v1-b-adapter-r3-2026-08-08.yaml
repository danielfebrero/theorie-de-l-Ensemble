response:
  text: '# NOTE AU CONSEIL — Séance du vendredi


    **Objet :** Arbitrage Sedamex (A) / Nordwerk (B) — horizon 18 mois

    **Recommandation : Option B, sous les trois conditions suspensives du § 5.**


    ---


    ## 1. Le chiffrage


    | | Fonds propres à 18 mois | Probabilité |

    |---|---|---|

    | **A — Sedamex** | 3,6 M€ | 100 % |

    | **B — échec** | 3,0 M€ | 40 % |

    | **B — succès** | 4,3 M€ | 60 % |


    Espérance de B : (0,6 × 900) − (0,4 × 400) = **+380 k€**, contre +200 k€ pour A. Écart : **+180 k€**
    en faveur de B.


    ## 2. Le point décisif n''est pas l''espérance, c''est le plancher


    L''écart d''espérance (180 k€) est trop faible pour emporter seul la décision. Ce qui l''emporte,
    c''est la **forme de la perte** : elle est plafonnée par contrat à 400 k€, sans caution du dirigeant,
    sans défaut croisé, sans sûreté sur l''actif industriel, sans nantissement du carnet de commandes.


    400 k€ représentent **11,8 % des fonds propres, 15,4 % de la trésorerie, 2,4 mois de masse salariale**.
    Après échec, les fonds propres tiennent à 3,0 M€, soit **2,5 fois le covenant** de 1,2 M€ ; il faudrait
    2,2 M€ de pertes cumulées pour le briser. Le covenant trimestriel n''est menacé dans aucun scénario.


    Le pire cas de B est donc un mauvais exercice, pas une question de survie. La condition de légitimité
    d''un pari à espérance positive — pouvoir encaisser la perte et continuer — est remplie.


    ## 3. Marge d''erreur sur l''estimation à 60 %


    B cesse d''être supérieure à A en dessous de **46,2 %** de probabilité de succès. Le bureau d''études
    peut donc se tromper de près de **14 points** sans invalider la recommandation. C''est une marge de
    sécurité substantielle sur une estimation adossée à onze installations documentées.


    ## 4. Réponse au directeur financier


    **« On ne joue pas la maison. »** Je suis d''accord avec le principe. Je conteste le fait : la maison
    n''est pas sur la table. Le plafond contractuel, l''absence de caution personnelle et l''absence de
    sûreté font précisément que l''actif industriel, l''emploi et la continuité ne sont pas exposés. L''objection
    serait décisive contre un engagement à perte ouverte ou financé par dette garantie. Ce n''est pas
    notre cas.


    **Tremay.** Un dépôt de bilan chez un concurrent est une observation, pas une base statistique — et
    la question n''est pas « ont-ils acheté une ligne ? » mais « comment était structurée leur exposition
    ? ». Je propose que nous versions au dossier ce que nous savons de leur financement et de leurs garanties.
    Si Tremay a engagé la ligne sur dette garantie sans plafond de perte, l''exemple confirme ma lecture
    au lieu de l''infirmer. Si Tremay avait notre structure de risque et a coulé quand même, je retire
    ma recommandation.


    Je relève enfin que **A n''est pas sans risque non plus** : reconduire pour 18 mois, c''est prolonger
    notre dépendance à un donneur d''ordre unique et rester sur une position de sous-traitance sans capacité
    propre à l''échéance.


    ## 5. Ce que le plafond ne couvre pas — et les conditions que je pose


    Le plafond de 400 k€ couvre l''exposition envers Nordwerk. Il ne couvre pas les **coûts indirects**
    d''un échec : désorganisation de la production existante, mobilisation de l''encadrement, clients
    perdus. C''est le seul risque réellement non borné du dossier. Je subordonne donc ma recommandation
    à :


    1. **Validation juridique écrite** que les 400 k€ constituent un plafond « tout compris » — pénalité
    de résiliation, remise en état, enlèvement de la ligne, obligations accessoires. *Si le plafond n''est
    pas étanche, je bascule sur A.*

    2. **Cloisonnement opérationnel** : la ligne Nordwerk ne mobilise ni la capacité ni les équipes affectées
    à la production actuelle. Budget de désorganisation provisionné à 100 k€, porté au suivi.

    3. **Vérification de la réversibilité commerciale** avec Sedamex : sommes-nous en mesure de revenir
    vers eux à 18 mois ? À défaut, le coût d''option de la rupture doit être chiffré avant signature.


    ## 6. Points de contrôle


    Contrat irréversible sur 18 mois : les jalons ne permettent pas de sortir, ils permettent d''agir
    tôt. **Trois jalons techniques à M+3, M+6, M+9**, avec critères d''acceptation définis avant signature.
    Test de covenant *pro forma* à chaque clôture trimestrielle sous hypothèse d''échec complet. Un jalon
    manqué déclenche non pas un arrêt — impossible — mais un plan de repli commercial immédiat, seul levier
    restant sur les coûts indirects.


    ---


    **Vote demandé :** autorisation de signer l''option B sous réserve de la levée des trois conditions
    du § 5, la condition n° 1 étant rédhibitoire.

    '
