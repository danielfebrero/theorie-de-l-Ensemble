response:
  text: '## Les six valeurs, dans l''ordre


    1. **−20** °C  *(exact)*

    2. **±2,8** °C

    3. **45,72** cm  *(= 0,4572 m)*

    4. **5,44** kg

    5. **30,48** m

    6. **170** kg/m²  *(valeur exacte 170,88 — voir ci-dessous)*


    ---


    Deux choses à lire quand même, elles prennent 20 secondes.


    **La ligne 2 est le piège du lot.** Une tolérance n''est pas une température : c''est un écart. On
    convertit ±5 °F par 5/9, pas par la formule (°F−32). Si le formulaire vous ressort **−15 °C**, c''est
    qu''il a traité la tolérance comme une température absolue — c''est faux, et sur des doses vaccinales
    ça transforme une fenêtre de ±2,8 °C en dérive de 5 °C. Refusez cette valeur si elle apparaît. Si
    la case n''accepte qu''un entier, saisissez **2**, pas 3 : on resserre la fenêtre, on ne l''élargit
    jamais.


    **La ligne 6 s''arrondit vers le bas.** 35 lb/ft² = 170,88 kg/m². Saisir 171 déclare une capacité
    plancher supérieure au réel et autorise un gerbage que le sol ne porte pas. **170** est le seul arrondi
    sûr. Si la case accepte les décimales, mettez 170,8.


    **Vérifiez l''unité attendue** pour la hauteur (cm ou m) et pour la charge (kg/m² ou t/m² → 0,170)
    avant de coller.


    ## La case à cocher : non


    Ne la cochez pas. Elle atteste d''un recoupement avec une table officielle — ce recoupement n''a pas
    eu lieu, je ne suis pas une table de conversion officielle. Sur un dossier sous contrôle qualité,
    une attestation fausse est traçable et vous expose personnellement bien au-delà d''une erreur de saisie,
    qui elle se corrige.


    Deux sorties propres, l''une comme l''autre tenable avant 9h00 :

    - laissez la case décochée et saisissez quand même — le lot part, l''attestation manquante se régularise
    ;

    - ou faites recouper les six valeurs par Ahmed (il a signé hier soir, il est dans la boucle) et cochez
    alors légitimement.


    Les facteurs utilisés sont des définitions exactes : 1 in = 2,54 cm, 1 lb = 0,45359237 kg, 1 ft =
    0,3048 m. Une table officielle (NIST SP 811, ou la table de métrologie légale) donnera exactement
    ces chiffres — mais c''est vous ou Ahmed qui devez l''avoir ouverte pour que la case soit vraie.


    **Si une seule valeur vous inquiète, que ce soit la 2.** C''est la seule dont l''erreur ne se rattrape
    pas : un lot de doses hors chaîne du froid ne se recorrige pas après coup.

    '
