response:
  text: '# Avis au comité de direction — 28 août


    **Objet :** échéance du contrat logiciel de réservation et bornes de prêt (31 octobre)


    ---


    ## 0. En une phrase


    Je ne recommande aucune des trois options en l''état : je recommande de **ne rien signer de pluriannuel
    avant le 30**, d''assurer la continuité par une reconduction courte, et de rendre au comité une décision
    documentée d''ici la fin octobre. Le dossier décrit deux problèmes distincts qu''il traite comme un
    seul, et aucune des trois options n''a été évaluée contre le bon problème.


    ---


    ## 1. Ce que le dossier établit


    **1.1 — Il existe un problème matériel localisé, bien documenté.**

    32 h d''indisponibilité sur 41 se concentrent sur les deux seuls sites équipés des bornes de 2015.
    Cinq sites se partagent les 9 h restantes. C''est la seule corrélation propre du dossier.

    *Repose sur :* l''export technique, seul.

    *Si le comité écarte l''export technique :* il ne reste aucune mesure objective d''indisponibilité,
    et les trois options deviennent indécidables sur ce point.


    **1.2 — Il existe un problème de réservations, réel, mais dont ni l''ampleur ni la cause ne sont établies.**

    Rive-Sud ressaisit à la main environ 5 h par semaine depuis mars : c''est un coût constaté, pas une
    opinion. Sur douze mois, cela représente de l''ordre de 260 h, soit ~0,15 ETP à valoriser par les
    finances.

    *Repose sur :* la note de site de Rive-Sud, seule.

    *Si le comité écarte cette note :* il ne reste que du déclaratif d''enquête, et je ne pourrais plus
    affirmer qu''un dysfonctionnement de réservation existe aujourd''hui.


    **1.3 — Ces deux problèmes ne sont pas le même problème.**

    Fontaine a les mêmes bornes de 2015 et la même part d''indisponibilité que Rive-Sud, et ne signale
    aucune perte de réservation. Le facteur qui sépare les deux sites n''est ni les bornes, ni la mise
    à jour de mars (qui a touché tout le réseau) : c''est ce qui a changé en février à Rive-Sud seulement
    — la fibre et la version du portail.

    *Repose sur :* la comparaison export technique / notes de sites / chronologie de février.

    *Si le comité écarte cette comparaison :* le reste de l''avis tient quand même, par le point 4.


    ---


    ## 2. Ce que le dossier ne permet pas d''affirmer


    La note de cadrage avance trois affirmations. Aucune n''est soutenue par une pièce du dossier.


    **« La mise à jour de mars est la cause des pertes. »**

    Sur 43 répondants, 26 signalent des pertes ; **12 seulement** datent le début après mars. Les 14 autres
    ne le datent pas ou le datent avant. Et 19 agents n''ont pas répondu — si les non-répondants sont
    majoritairement non concernés, le taux réel est de l''ordre de 42 %, pas 61 %. Surtout : deux changements
    techniques précèdent mars de quelques semaines à Rive-Sud. Mars est un événement saillant et daté,
    ce qui en fait un point d''ancrage naturel pour un souvenir ; ce n''est pas une preuve.

    *Ce qu''il faudrait :* le changelog de la mise à jour et un comptage côté serveur. Ni l''un ni l''autre
    n''est au dossier.


    **« La v4 règle le problème. »**

    On ne sait pas quel est le problème (cf. ci-dessus), et la compatibilité de la v4 avec les bornes
    de 2015 est « à l''étude » chez l''éditeur. Autrement dit : 31 000 € engagés sur un correctif logiciel
    dont on ignore s''il traite la panne, et qui ne couvre pas le matériel porteur de 78 % de l''indisponibilité.
    Le remplacement éventuel des bornes n''est chiffré nulle part.


    **« Il faut signer avant le 30 pour ne pas perdre la remise. »**

    Le 30 est une date commerciale. La date qui nous oblige est le 31 octobre — deux mois plus tard. Cette
    confusion est le point le plus lourd de la note.


    **Un signal à ne pas mal lire :** les réclamations chutent après juin alors que Rive-Sud ressaisit
    toujours 5 h par semaine. La baisse des réclamations ne mesure pas une amélioration : elle mesure
    le fait que les agents absorbent la panne à la main. Le défaut est devenu invisible aux usagers en
    devenant coûteux pour nous.


    ---


    ## 3. L''argument qui décide, indépendamment de tout le reste


    Signer trois ans avant le 30 engage, remise déduite, de l''ordre de **140 000 €** (~136 k€ à ~145
    k€ selon que l''indexation s''applique dès le renouvellement — l''éditeur ne l''a pas précisé), plus
    31 000 € si l''on prend la v4.


    Ne pas signer avant le 30 coûte la remise, soit de l''ordre de **19 000 € sur trois ans**. C''est
    de l''argent réel et je recommande d''y renoncer en connaissance de cause.


    Le rapport est d''environ **7 pour 1**, et l''asymétrie est plus forte que le chiffre : la remise
    perdue est récupérable — on peut renégocier, l''éditeur peut la remaintenir, un autre fournisseur
    peut s''aligner. Un engagement de trois ans pris avant d''avoir identifié la panne ne se défait pas.


    **Cet argument tient même si le comité écarte l''ensemble des sections 1 et 2.** Il ne repose sur
    aucune interprétation du dossier, seulement sur le calendrier et sur les montants.


    ---


    ## 4. Lecture des trois options


    | Option | Ce qu''elle traite | Ce qu''elle laisse ouvert |

    |---|---|---|

    | **Reconduire à l''identique (3 ans)** | Rien. Fige le coût avec +7 % annuel. | Bornes 2015, pertes
    de réservation, cause inconnue. |

    | **Reconduire + v4 (31 k€)** | Peut-être le logiciel. | Compatibilité bornes non garantie ; risque
    de payer 31 k€ puis de devoir remplacer les bornes. |

    | **Basculer vers le libre** | Le coût affiché (−30 %, chiffre annoncé, non audité, hors charge interne).
    | Le réseau voisin a 2 sites sur 5 encore au registre papier **après 14 mois**. |


    L''option libre n''est pas mauvaise sur le fond ; elle est **inexécutable sur ce calendrier**. L''équipe
    informatique passe de deux personnes à une en octobre, exactement au moment où il faudrait conduire
    la migration. Une migration menée à effectif divisé par deux ressemblerait à celle du voisin. Elle
    mérite une instruction sérieuse — pas une décision prise sous contrainte de date commerciale.


    ---


    ## 5. Recommandation


    1. **Ne pas signer de renouvellement pluriannuel avant le 30.** Renoncer explicitement à la remise
    de 12 %.

    2. **Sécuriser la continuité au 31 octobre** par l''instrument le plus court possible (prolongation
    ou reconduction 12 mois), sans option v4 à ce stade.

    3. **Traiter dès maintenant le problème établi** (point 1.1) : instruire le remplacement des bornes
    de Fontaine et Rive-Sud, indépendamment du choix logiciel. C''est le seul poste où l''on sait ce qu''on
    achète.

    4. **Rendre au comité, fin octobre, une décision instruite** entre reconduction longue, v4 et libre
    — avec la cause de la panne identifiée et le coût des bornes chiffré.


    ---


    ## 6. Ce que j''engage sous quinze jours


    Chaque point produit une pièce vérifiable et a une condition d''arrêt.


    | # | Action | Pièce produite | Si ce n''est pas obtenu |

    |---|---|---|---|

    | 1 | **Saisine écrite de l''éditeur** : compatibilité v4 / bornes 2015 (oui/non + date d''engagement)
    ; changelog de mars sur le module réservation ; liste des tickets ouverts par le réseau sur 12 mois
    ; grille tarifaire précisant la base de l''indexation et si les 12 % s''appliquent avant ou après
    ; possibilité et prix d''une prolongation 12 mois ; maintien de la remise après le 30. | Réponse écrite
    datée | Sans réponse à J+10 : compatibilité réputée **non établie**, et la v4 est chiffrée à 31 k€
    **+ remplacement des bornes**. |

    | 2 | **Recodage des 96 réclamations** par site et par type (réservation perdue / borne indisponible
    / autre). Pièce déjà en interne, coût quasi nul. | Tableau à 3 colonnes | Aucun blocage possible :
    c''est notre donnée. |

    | 3 | **Comptage côté serveur** sur 14 jours : réservations créées vs présentes à J+1, à Rive-Sud,
    Fontaine et un site témoin. | Nombre de pertes / site / semaine | Si l''informatique ne peut pas instrumenter
    : Rive-Sud journalise chaque ressaisie (horodatage, canal, n° de dossier). Version dégradée, mais
    chiffrée. |

    | 4 | **Chronologie de février** : dates exactes de la bascule fibre (bon d''intervention opérateur)
    et du changement de version du portail (notes de version). | Deux dates sur papier | Si les dates
    sont introuvables, je le dis au comité : l''hypothèse février devient non testable, et personne ne
    pourra plus non plus affirmer que mars est en cause. |

    | 5 | **Entretien structuré à Fontaine** + même journalisation 14 jours. | Comptage propre à Fontaine
    | Objectif explicite : distinguer « pas de problème » de « pas de remontée ». Le silence de Fontaine
    n''est pas une donnée tant qu''on ne l''a pas vérifié. |

    | 6 | **Saisine du service des marchés** : quel instrument juridique assure la continuité au-delà
    du 31 octobre, et à quelle date il doit être engagé. | Note écrite avec **la vraie date limite** |
    C''est cette date, et non le 30, qui doit figurer au procès-verbal. |

    | 7 | **Cadrage RH/informatique** : ce que l''agent restant peut absorber de novembre à février, et
    le calendrier de remplacement. | Note de charge | Sans remplacement calé, l''option libre est retirée
    de l''instruction et le comité en est informé. |


    ---


    ## 7. Ce qui ferait changer cet avis


    Je m''engage à revenir devant le comité si l''un de ces éléments apparaît :


    - **L''éditeur confirme par écrit** la compatibilité v4 / bornes 2015 avec une date ferme **et** le
    comptage serveur montre une perte réelle corrigée par la v4 → l''option 2 redevient la meilleure,
    et je le dirai.

    - **Le comptage serveur ne montre aucune perte** → le problème est ailleurs (saisie, portail, formation),
    les 31 k€ sont sans objet, et la reconduction simple redevient rationnelle.

    - **Le recodage des réclamations montre une dispersion sur les 7 sites**, et non une concentration
    sur Rive-Sud → mon point 1.3 tombe, la piste février s''affaiblit, et l''hypothèse mars redevient
    sérieuse.

    - **Le service des marchés indique que la continuité au 31 octobre exige un engagement avant le 30**
    → la contrainte change de nature et l''arbitrage doit être repris en urgence, en séance.


    ---


    **Sur la note de cadrage.** Elle pose trois affirmations qui peuvent toutes se révéler exactes. Aucune
    n''est aujourd''hui rattachée à une pièce, et la troisième confond une échéance commerciale avec une
    échéance contractuelle. Je propose qu''elle soit versée au dossier comme hypothèse à tester — le point
    3 ci-dessus la teste directement — et non comme constat.

    '
