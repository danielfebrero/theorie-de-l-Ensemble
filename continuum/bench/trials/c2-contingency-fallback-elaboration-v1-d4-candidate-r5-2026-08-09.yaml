response:
  text: '# Plan d''exécution — conversion électrique de la flotte

    **Note pour le conseil du jeudi — direction de l''exploitation**


    ---


    ## 1. Ce que le conseil décide jeudi


    | # | Décision | Montant | Pourquoi jeudi et pas plus tard |

    |---|---|---|---|

    | **D1** | Commander les 8 bornes supplémentaires | 210 000 € | 7 semaines de travaux. C''est la condition
    matérielle des 60 véhicules roulants au 31 janvier, donc des 620 000 € |

    | **D2** | Instruction permanente au loueur : **prolongation par défaut**, préavis envoyé 35 j avant
    chaque reprise, sauf décision contraire | enveloppe 160 000 € | Le premier préavis tombe le **31 août**.
    Le conseil ne resiège pas d''ici là |

    | **D3** | Rééquilibrage du plan de tournées : 60 tournées ≤ 150 km / 36 tournées à ~198 km | 0 €
    | Sans lui, il n''y a pas 60 tournées qu''un VE puisse tenir en janvier |

    | **D4** | Commander l''étude de puissance raccordée et le devis de la 3ᵉ tranche de bornes | à devis
    | Un renforcement Enedis se compte en 6 à 12 mois. Si le besoin existe, il faut le savoir en juillet,
    pas en mars |

    | **D5** | Prendre acte : les 22 bornes financées ne permettent pas d''exploiter 96 VE | ~420 000
    € à voter ultérieurement | Point traité en §5 |


    Solde des décisions D1+D2 : **–370 000 € contre +620 000 € acquis**, avant tout coût de tournée évité.


    ---


    ## 2. Les trois constats qui structurent le plan


    **Le problème n''est pas l''autonomie moyenne, c''est la queue de distribution.** L''essai donne 232
    km en moyenne, 197 km à 2 °C avec chauffage. La tournée la plus longue fait 240 km : elle est hors
    de portée d''un VE **en toute saison**, pas seulement l''hiver. Et les 11 recharges non prévues de
    l''essai sont toutes au-dessus de 190 km — soit 96 % de l''autonomie froid. Il n''y a aucune marge
    à cet endroit.


    **La contrainte dure est la recharge, pas le véhicule.** Une tournée consomme 6 h de borne × (km /
    autonomie du jour), soit 1,83 min/km par 2 °C. Sur une fenêtre de nuit garantie de 12 h (18 h–6 h)
    :


    | Parc de bornes | Heures-borne / nuit | VE rechargeables (tournées ≤ 150 km, hiver) |

    |---|---|---|

    | 14 (actuel) | 168 | **36** |

    | 22 (avec D1) | 264 | **57**, et 67 en utilisant les retours 15 h–18 h |

    | Besoin pour 96 VE à 168 km | 491 | **35 à 41 bornes** |


    Les 14 bornes actuelles plafonnent la flotte électrique à 36 véhicules. Les 8 bornes de D1 sont ce
    qui rend l''objectif de subvention atteignable — pas un confort.


    **Rendre un diesel est irréversible ; le garder coûte 480 €.** Onze semaines pour récupérer un véhicule
    rendu. Une tournée non terminée coûte 900 €. Garder un diesel un mois entier coûte moins que **deux**
    tournées ratées. C''est l''asymétrie qui commande tout le calendrier.


    ---


    ## 3. Le plan


    ### 3.1 Règle d''affectation


    Un VE ne prend une tournée que si sa longueur planifiée est sous le **plafond du jour** :


    - **1ᵉʳ novembre – 31 mars : 150 km** (76 % de l''autonomie froid mesurée)

    - **Reste de l''année : 180 km** (78 % de l''autonomie tempérée mesurée)


    La réserve de ~24 % couvre les détours, le trafic, les jours plus froids que 2 °C, le vieillissement
    batterie et l''usage réel du chauffage. Elle n''est pas négociable en cours de journée par le régulateur.


    Le chauffage n''est pas rationné. Les véhicules **préchauffent sur borne** avant départ : la dépense
    passe sur le réseau, pas sur la batterie, et le confort cabine est préservé. C''est la seule façon
    de tenir le plafond sans le faire porter aux conducteurs.


    ### 3.2 Rééquilibrage des tournées (D3)


    Volume quotidien : 96 tournées × 168 km = **16 128 km**. On ne change ni le nombre de tournées, ni
    le service client — on déplace des points de livraison des tournées courtes vers les tournées longues,
    pour concentrer le kilométrage sur celles qui resteront diesel :


    - **60 tournées à ≤ 150 km** → 9 000 km → électriques

    - **36 tournées à ~198 km** (max 240) → 7 128 km → diesel


    Aucune tournée supplémentaire, aucun conducteur supplémentaire. Les 36 tournées diesel restent sous
    le maximum déjà pratiqué aujourd''hui.


    ### 3.3 Rétention diesel


    Le nombre de diesels conservés n''est pas un chiffre fixe, c''est une **formule** publiée chaque mois
    :


    > diesels conservés = nombre de tournées au-dessus du plafond VE du mois + 6 de réserve


    Soit **42 aujourd''hui** (36 + 6). Le chiffre baisse mécaniquement quand le plafond monte au 1ᵉʳ avril,
    et quand la 3ᵉ tranche de bornes est livrée.


    | Fin de mois | VE livrés cumulés | Diesels rendus | Diesels restants | Parc total |

    |---|---|---|---|---|

    | Septembre | 24 | 24 | 72 | 96 |

    | Octobre | 48 | 24 | 48 | 96 |

    | Novembre | 72 | 6 | 42 | 114 |

    | Décembre | 96 | 0 | 42 | 138 |

    | Avril | 96 | 12 | 30 | 126 |

    | Juin | 96 | 20 | 10 | 106 |


    Le surcoût de location ne démarre qu''en décembre (avant, les diesels ne sont pas encore dus). **~110
    000 € de décembre à juin**, enveloppe demandée à 160 000 € si la 3ᵉ tranche glisse.


    ### 3.4 Calendrier des préavis (D2) — le point le plus fragile du dossier


    Le préavis de 30 jours doit être **envoyé pour prolonger**. Une prolongation oubliée devient un véhicule
    rendu, récupérable dans 11 semaines seulement. On inverse donc le défaut : **le préavis part systématiquement**,
    et on l''annule si le tableau de bord dit qu''on peut.


    | Lot | Reprise prévue | Préavis à envoyer |

    |---|---|---|

    | Septembre | 30 sept. | **26 août** |

    | Octobre | 31 oct. | 26 sept. |

    | Novembre | 30 nov. | 26 oct. |

    | Décembre | 31 déc. | 26 nov. |


    Chaque envoi est précédé d''une revue de 20 minutes avec les deux chefs de plateforme et deux représentants
    conducteurs, qui arrête le chiffre du mois. Le compte rendu part au conseil le jour même.


    ### 3.5 Bornes (D1)


    Commande vendredi, travaux sur 7 semaines, **mise en service fin août** — avant la première livraison.
    La date butoir réelle est le **15 décembre** : au-delà, les 60 VE ne peuvent pas être rechargés avant
    le 31 janvier et la subvention tombe. Nous avons donc ~14 semaines de marge sur un chantier de 7.
    Si le chantier glisse malgré tout, la flotte électrique en service est plafonnée à 36 et les lots
    diesel correspondants sont prolongés — sans coût autre que les 480 €/véhicule déjà prévus.


    ### 3.6 Formation


    96 conducteurs, une demi-journée chacun, au rythme des livraisons (24/mois). À caler dès septembre
    : un véhicule livré, immatriculé et rechargeable mais confié à un conducteur non formé ne « roule
    » pas au sens de la région.


    ---


    ## 4. Ce qu''on surveille et ce qu''on fait


    Le tableau de bord publie déjà chaque soir, par plateforme, le taux de tournées terminées et le nombre
    de recharges non prévues. Trois déclencheurs, aucune interprétation :


    | Observation | Action, sans validation supplémentaire |

    |---|---|

    | Recharges non prévues sur tournées VE > 2 % sur une semaine glissante | Plafond abaissé de 15 km
    le lundi suivant ; le nombre de diesels conservés suit la formule |

    | Taux de tournées terminées VE < 99 % trois jours de suite sur une plateforme | Gel des nouvelles
    affectations VE ; tournées concernées repassées diesel dès le lendemain |

    | Lot de livraison de septembre non confirmé expédié au 15 septembre | Escalade constructeur + information
    de la région sur le risque de calendrier |


    **Ce qui renverserait le plan.** Le P10 d''autonomie froid, calculé sur les relevés de l''essai (6
    véhicules, télémétrie aux 10 minutes — la donnée existe, elle n''a simplement jamais été extraite).
    Si ce P10 ressort **≥ 215 km**, le plafond hiver monte à 170 km, la rétention tombe à ~20 véhicules
    et nous économisons 10 000 €/mois. S''il ressort **< 175 km**, le plafond descend à 135 km, la rétention
    dépasse 50 et le rééquilibrage des tournées doit être plus profond. Je demande cette extraction pour
    **vendredi** : elle ne coûte rien et elle déplace le chiffre le plus structurant du plan.


    **Le pire cas et qui l''encaisse.** Si nous nous trompons en conservant trop de diesels : ~10 000
    €/mois de location inutile, encaissés par le compte d''exploitation, récupérables au mois suivant.
    Si nous nous trompons en en conservant trop peu : 22 tournées longues par jour confiées à des VE qui
    ne les tiennent pas. Au taux observé à l''essai — 11 recharges non prévues sur les tournées de plus
    de 190 km — cela représente plusieurs dizaines de milliers d''euros par mois, encaissés par **les
    clients** sous forme de retards de livraison, et ce préjudice-là ne se rattrape pas en un mois. Le
    point d''indifférence est à 0,8 tournée ratée par jour ; l''essai indique un niveau très au-dessus.
    La rétention par défaut est le seul côté de l''erreur qui soit réversible.


    **Contre-argument le plus sérieux, et pourquoi il ne fait pas basculer.** On peut soutenir que l''essai
    de mars, sur 6 véhicules et 120 tournées, est un échantillon trop mince pour immobiliser 42 diesels
    pendant un semestre, et que des véhicules neufs, mieux conduits, feront mieux que 197 km. C''est possible.
    Mais le plan ne parie pas contre : il conserve les diesels un mois à la fois, à 480 €, avec une sortie
    mensuelle et un déclencheur chiffré qui la commande. Si les véhicules font mieux qu''annoncé, nous
    le verrons sur le tableau de bord dès la deuxième semaine d''octobre et la flotte diesel fondra en
    conséquence. Le pari inverse — rendre les diesels et découvrir en janvier qu''on avait tort — coûte
    11 semaines pendant lesquelles rien ne peut être corrigé.


    ---


    ## 5. Ce que je dois signaler au conseil (D5)


    **Les 22 bornes financées ne suffisent pas pour 96 véhicules.** À 168 km de moyenne par 2 °C, les
    96 VE demandent 491 heures-borne par nuit ; 22 bornes en fournissent 264 à 308. Il manque **13 à 19
    bornes**, soit de l''ordre de **420 000 €** au prix unitaire du devis actuel — montant non budgété.
    La commande de 3,1 M€ achète des véhicules que l''installation prévue ne peut pas recharger intégralement.


    **Et le raccordement électrique n''est pas vérifié.** Une installation cible de ~40 bornes représente
    ~900 kW de puissance appelée. Le devis de 210 000 € porte sur les bornes, pas sur un éventuel renforcement
    de puissance souscrite, dont les délais (6 à 12 mois) dépasseraient tout le reste du calendrier. C''est
    l''objet de D4 et c''est, à ce stade, le seul risque du dossier qu''aucune décision de jeudi ne couvre.


    Ni l''un ni l''autre ne met en cause le plan présenté ici : il tient l''objectif de subvention et
    le service client avec ce qui est déjà financé. Ils déterminent la date à laquelle le dernier diesel
    part — que je situe aujourd''hui à l''automne 2027, et non au 31 décembre 2026.


    ---


    ## 6. Première semaine


    1. **Vendredi** — signature du bon de commande des 8 bornes ; ordre de service au lendemain.

    2. **Vendredi** — extraction du P10 d''autonomie froid et du dénominateur des tournées > 190 km sur
    le journal d''essai. Plafond révisé lundi si nécessaire.

    3. **Lundi** — lancement de l''étude de puissance raccordée et de la consultation pour la 3ᵉ tranche.

    4. **Lundi** — courrier au loueur : calendrier indicatif des prolongations sur 3 mois glissants, et
    demande d''une remise sur volume en contrepartie de cette visibilité.

    5. **Dans la semaine** — le service exploitation rend le plan de tournées rééquilibré (60 / 36), soumis
    aux chefs de plateforme et aux représentants conducteurs avant application.

    6. **Dans la semaine** — ajout au tableau de bord du soir des trois indicateurs de déclenchement,
    avec seuil affiché.


    **Première action, à prendre jeudi en séance : D1.** Tout le reste du calendrier en dépend, et c''est
    la seule décision dont le délai de réalisation est incompressible.

    '
