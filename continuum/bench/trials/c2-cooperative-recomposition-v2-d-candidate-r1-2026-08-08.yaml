response:
  text: '# Position de la présidence — répartition de la ressource d''étiage

    **Bassin de la Vèze — séance du jeudi**


    ---


    ## 1. Ce que je propose


    **Un volume global par usage, pas des quotas individuels — mais pour deux semaines seulement, et assorti
    de la collecte qui rendra les quotas individuels possibles ensuite.**


    Répartition des 410 L/s mesurés :


    | Poste | L/s | Statut |

    |---|---|---|

    | Débit réservé aval | 180 | Hors de notre compétence — fixé par arrêté préfectoral |

    | Eau potable (régie de Ferney) | 150 | Garanti 10 jours ; noyau vital garanti sans condition ni terme
    |

    | Agriculture | 70 | Volume global, réparti en interne par le collège des 34 |

    | Marge de mesure | 10 | Reversée à l''agriculture sous 48 h après jaugeage conforme |


    Je n''arrête pas de quotas individuels jeudi parce que je n''ai rien pour les fonder : sans cultures,
    sans stades, sans compteurs, une répartition exploitation par exploitation serait arbitraire, et un
    arrêté arbitraire tombe au premier recours en emportant tout le dispositif avec lui. Je n''y renonce
    pas non plus : je propose de la préparer en dix jours.


    **Échelle de descente, décidée maintenant et à froid** — parce que sans pluie avant trois semaines,
    410 L/s n''est pas un plancher mais un point sur une courbe :


    - ≥ 410 L/s → 70 à l''agriculture

    - 380 → 50

    - 350 → 20

    - < 330 → agriculture à 0, et saisine immédiate du préfet : en dessous de 330, potable et débit réservé
    entrent en conflit direct et je n''ai plus de solution dans mon champ de compétence. Cette saisine,
    je la rédige cette semaine, pas le jour où elle se déclenche.


    L''intérêt de publier l''échelle maintenant : les maraîchers peuvent décider quels blocs abandonner
    tôt, plutôt que de le découvrir semaine après semaine. Un abandon précoce économise l''eau *et* les
    intrants.


    ---


    ## 2. Le déficit n''est pas là où le débat le situe


    Trois chiffres de la note ne sont pas de même nature, et les traiter comme équivalents est la première
    erreur à corriger.


    **Les 180 L/s sont documentés et hors de portée.** Le rapport hydrobiologique du 12 juin est daté,
    écrit, et qualifie la perte de non reconstituable à l''échelle d''une décennie. Surtout : la commission
    n''a pas compétence pour abaisser un débit réservé préfectoral. Qui veut le déplacer doit le demander
    au préfet, par une demande motivée. Je le dirai à ceux qui le proposeront en séance — ce n''est pas
    un refus de discuter, c''est une question d''autorité : personne autour de cette table ne détient
    ce pouvoir.


    **Les 4,1 M€ sont déclarés, non documentés, et portent sur la mauvaise grandeur.** Ils mesurent la
    perte en l''absence totale d''irrigation. Ils ne disent rien de la perte à 70 L/s. La grandeur qui
    manque — celle dont dépend toute la décision — c''est la courbe rendement-eau par culture et par stade.
    Une tomate à la nouaison et un poireau tout juste planté ne réagissent pas au même déficit. L''annonce
    d''une perte totale « en dessous de 240 » décrit une falaise ; l''agronomie décrit une pente. Je demande
    donc que les 4,1 M€ soient étayés exploitation par exploitation — c''est de toute façon la condition
    pour toucher le fonds.


    **Les 150 L/s de la régie n''ont jamais été examinés.** À 150 L/s pour 9 200 habitants, le prélèvement
    est de 1 400 litres par habitant et par jour, soit environ cinq fois ce que prélève un réseau domestique
    comparable, pertes de réseau comprises. Le besoin vital — boisson, hygiène, hôpital, EHPAD, défense
    incendie — est de l''ordre de 20 à 30 L/s. L''EHPAD, qui structure tout l''argument, pèse environ
    0,3 L/s.


    L''écart entre 150 et le besoin vital est donc de l''ordre de 120 L/s : les trois quarts du déficit
    que nous nous épuisons à répartir.


    Trois explications possibles, aux conséquences très différentes : le périmètre de la régie dépasse
    Ferney ; le réseau fuit massivement ; ou le prélèvement remplit un stock. **Si c''est la première,
    tout ce raisonnement tombe** — d''où la question, posée avant la conclusion et non après. Je demande
    à la régie un bilan de nuit sectorisé sous dix jours. Ce n''est pas une accusation, et la dotation
    vitale est garantie quelle que soit la réponse. Mais je ne peux pas demander à 34 exploitations de
    renoncer à 70 % de leur eau sans avoir posé cette question-là.


    ---


    ## 3. Les données prétendument absentes existent — ailleurs


    « Aucune donnée parcellaire » est vrai de la commission, pas de l''administration. Existent déjà,
    et sont mobilisables en quelques jours : le registre parcellaire graphique (cultures déclarées, à
    la DDT), les déclarations de redevance à l''agence de l''eau (volumes annuels par point de prélèvement),
    les déclarations MSA (emploi réel par exploitation), les arrêtés d''autorisation de prélèvement. Je
    les demande lundi.


    C''est ce qui rend les quotas individuels possibles à l''échéance de deux semaines, et c''est aussi
    ce qui permettra de vérifier une hypothèse que je fais et que j''assume comme telle : que les 90 emplois
    saisonniers ne sont pas répartis proportionnellement aux hectares. Le maraîchage diversifié est plus
    intensif en main-d''œuvre à l''hectare que les grandes surfaces. Si c''est exact, répartir l''eau
    au prorata des surfaces détruit plus d''emplois par litre que ne le ferait une autre clé. Les déclarations
    MSA trancheront.


    ---


    ## 4. La répartition interne appartient aux 34


    Le volume agricole global n''est pas laissé à la course à la pompe — ce serait remettre l''arbitrage
    aux six exploitations les mieux équipées, qui détiennent déjà 48 % des surfaces.


    Clé par défaut : **un plancher égal par exploitation (34 L/s, soit 1 L/s chacune) + le solde au prorata
    des surfaces en stade critique déclaré.** Le plancher permet à chacune des 34 de sauver un bloc de
    cœur d''exploitation d''environ 2,5 ha ; le prorata reconnaît la taille. Ce n''est pas neutre et je
    ne le présente pas comme tel : cela corrige en faveur des petites, pour une raison précise — pour
    une petite exploitation, une saison perdue est une liquidation, pour une grande c''est un exercice
    dégradé. Ce n''est pas le même risque, et je refuse de traiter une variance et une ruine avec la même
    règle.


    **Le collège des maraîchers peut modifier cette clé**, à condition d''un accord des deux tiers en
    nombre d''exploitations — une exploitation, une voix — et du respect du volume global. C''est un pouvoir
    réel, pas une consultation : ils décident du partage interne. Trois conditions le bornent : compteur
    télérelevé posé, tour d''eau nocturne par secteurs (moins d''évaporation, et une pompe qui tourne
    à 14 h devient un manquement visible), et extension de la restriction à la nappe d''accompagnement
    — sinon les exploitations sur forage prélèvent le même stock en échappant à la règle, et celles qui
    respectent l''arrêté paient pour les autres.


    ---


    ## 5. Le fonds de 600 000 € — répartition indicative


    - Jaugeage ADCP, réétalonnage de la station, deux piézomètres : **40 k€**

    - 34 compteurs télérelevés : **90 k€**

    - Régie : campagne de nuit sectorisée + réparations urgentes : **120 k€**

    - Compensation ciblée sur les exploitations dont la survie est en jeu : **300 k€**

    - Réserve : **50 k€**


    600 000 € contre 4,1 M€, c''est 15 %. Étalé à l''hectare, c''est un geste symbolique dont la moitié
    part vers six exploitations. Concentré sur les dix ou douze dont la solvabilité est menacée, c''est
    décisif. La compensation est conditionnée au compteur posé et au quota respecté : c''est le seul levier
    qui agit plus vite qu''un tribunal administratif.


    Deux réserves. Le fonds ne doit pas doubler ce que couvrent déjà l''assurance récolte, les calamités
    agricoles, le dégrèvement de taxe foncière et l''activité partielle — une partie des 90 emplois est
    probablement préservable par ce dernier canal, et cela ne coûte rien au fonds. Et une part doit aller
    directement aux saisonniers, non à leurs employeurs : ils sont la partie dont on invoque le sort sans
    qu''aucune voix les représente.


    ---


    ## 6. Le mécanisme de levée — ce qui a échoué en 2022


    Le dispositif de 2022 lisait un pic, pas un stock. Le 9 août l''a démontré : 520 L/s mesurés, levée
    totale, retour à 340 en quatre jours. Un orage ruisselle, il ne recharge pas la nappe.


    Règle de remplacement, à trois verrous :

    1. **Dix jours consécutifs** au-dessus du seuil de palier, pas 48 heures.

    2. **Un indicateur de stock** — niveau piézométrique stable ou en hausse — en plus du débit. Aucune
    levée sur le seul débit.

    3. **Un palier à la fois**, sept jours minimum à chaque palier, et resserrement immédiat dès un seul
    jour sous le seuil. La règle est délibérément asymétrique : on descend vite, on remonte lentement.


    ---


    ## 7. Le meilleur argument contre ma position


    *« Vous pariez la récolte sur un réétalonnage qui confirmera peut-être 410, et sur des fuites qui
    n''existent peut-être pas. Si les deux reviennent négatifs, vous aurez fait attendre dix jours pour
    arriver à 70 L/s. Mieux valait donner 130 tout de suite en descendant le réservé à 130 : les truites
    sont menacées de toute façon si la sécheresse continue, et une décennie de truites vaut moins que
    90 emplois et 4,1 M€. »*


    Il ne tient pas, pour trois raisons — mais il faut le dire, pas l''écarter.


    D''abord, les 180 ne sont pas à moi. Une commission qui délibère hors de sa compétence produit une
    décision qui s''effondre au premier recours, et l''ensemble du plan tombe avec elle. Ensuite, l''asymétrie
    des preuves : la perte écologique est documentée, datée et irréversible ; la perte économique est
    déclarée, non étayée, partiellement compensable et réitérable l''an prochain. Ces deux affirmations
    n''ont pas le même poids et je ne les traiterai pas comme si elles l''avaient. Enfin, les dix jours
    ne sont pas une attente : les 70 L/s coulent dès vendredi. Le jaugeage décide seulement s''ils deviennent
    80 ou s''ils redescendent.


    Second contre-argument, sur la régie : *« conditionner ses 150 L/s à un audit met 9 200 personnes
    en danger. »* Non — le noyau vital est inconditionnel et sans terme, l''audit ne porte que sur l''écart
    entre 150 et ce noyau, et aucune réduction ne prend effet avant que l''audit soit rendu.


    ---


    ## 8. Ce qui renverserait cette position


    - **Le jaugeage montre une sous-estimation de plus de 10 %** → le débit réel dépasse 450 L/s, la part
    agricole est révisée à la hausse sous 48 h. Les 10 L/s de marge sont déjà réservés à cela : ils appartiennent
    aux maraîchers et ce sont trois ans sans étalonnage qui les retiennent.

    - **Le jaugeage montre une surestimation** → on descend d''un palier immédiatement et le préfet est
    saisi.

    - **Le bilan de nuit montre des pertes inférieures à 10 % et un périmètre dépassant Ferney** → les
    150 L/s sont confirmés incompressibles, le levier se referme, et l''arbitrage devient effectivement
    un partage à somme nulle. Je le dirai aussi clairement que je pose la question aujourd''hui.

    - **Les déclarations MSA montrent l''emploi proportionnel aux surfaces** → la clé plancher/prorata
    perd sa justification et doit revenir vers le prorata pur.


    ---


    ## 9. Aux trois parties


    **Aux maraîchers**, qui ont quitté la salle : la répartition interne de votre volume vous revient,
    avec une voix par exploitation. Je ne vous demande pas votre confiance, je vous demande vos compteurs
    et vos chiffres — et ce sont vos chiffres qui déclenchent le fonds et qui peuvent faire remonter votre
    dotation. Il n''y a pas de scénario où je vous donne 240 L/s.


    **À la régie** : votre dotation vitale est garantie, sans condition, sans terme, dès aujourd''hui.
    La discussion est donc ouverte, et sa contrepartie est votre bilan de nuit sous dix jours.


    **Au milieu aquatique** : c''est la seule partie qui perd irréversiblement, et la seule qui n''a personne
    dans la salle. Je propose d''inviter la fédération de pêche et l''OFB au comité hebdomadaire de révision,
    avec voix délibérative — comme les saisonniers, qu''on invoque sans les entendre.


    **À la presse** : le titre « les paysans contre les robinets » décrit un partage à deux termes. Il
    y en a trois, dont un est fixé par l''État et n''est pas dans nos mains, et les trois quarts du déficit
    se trouvent peut-être dans un réseau que personne n''a mesuré depuis longtemps.


    ---


    ## Première action


    **Lundi matin, avant toute chose : commande du jaugeage ADCP et du réétalonnage de la station de Sarcelle.**
    Toute cette délibération repose sur un seul appareil non étalonné depuis 2023. Une dérive de 10 %
    — banale sur une courbe de tarage après trois ans — représente 40 L/s, soit plus de la moitié de la
    part agricole que nous discutons. Nous arbitrons 4,1 M€ et une perte écologique décennale sur un chiffre
    que personne n''a vérifié, alors que le vérifier coûte quelques milliers d''euros et soixante-douze
    heures.


    Simultanément lundi : demande écrite du RPG, des déclarations de redevance et des données MSA à la
    DDT et à l''agence de l''eau ; demande du bilan de nuit à la régie ; commande des compteurs.


    Jeudi, la commission vote le cadre. Les chiffres, eux, arrivent la semaine suivante — et le cadre
    est construit pour les accueillir.

    '
