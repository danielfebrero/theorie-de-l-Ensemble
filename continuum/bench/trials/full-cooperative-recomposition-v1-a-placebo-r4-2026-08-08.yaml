response:
  text: 'Voici ma position. Le cœur : **je ne propose pas de répartition définitive jeudi**, parce que
    sur les cinq chiffres du dossier, un seul est étayé — et ce n''est pas celui qu''on croit.


    ## 1. Les chiffres ne tiennent pas


    **410 L/s** — station unique, étalonnée en 2023. Une courbe de tarage est par construction la moins
    fiable en extrême bas débit : nous sommes probablement hors plage jaugée. ±15 %, ordinaire, vaut ±60
    L/s, soit **38 % du déficit annoncé**. Et le volume utile stocké dans la retenue — seule variable
    capable d''amortir un pic — n''est pas au dossier.


    **150 L/s pour l''AEP** — c''est 12 960 m³/jour pour 9 200 habitants, soit **1 409 litres par habitant
    et par jour**. La moyenne nationale est de ~150 L. Même avec un rendement de réseau médiocre et une
    consommation généreuse, on attendrait 40 à 50 L/s. Écart d''un facteur neuf, non documenté. Les pièces
    existent déjà : RPQS, index de production, volumes facturés, SISPEA.


    **240 L/s** — une demande en débit continu, pas un besoin agronomique : 3,3 mm/jour sur 620 ha appliqués
    24 h/24. Plausible, non justifié. Manquent l''assolement, la surface réellement irriguée, la technique
    d''application (aspersion ≈ 65 % d''efficience contre 90 % en goutte-à-goutte).


    **4,1 M€ / 90 emplois** — déclaratif, produit par une partie qui a quitté la salle. Audité au même
    titre que le reste.


    **180 L/s** — le seul chiffre reposant sur un acte opposable *et* sur une étude datée, signée, non
    contestée. C''est aussi le seul dont la partie concernée ne siège pas.


    ## 2. Le critère d''arbitrage : la réversibilité, pas la valeur


    Continuité de l''eau potable → atteintes aux personnes, irréparables. Frayères → non reconstituable
    à l''échelle d''une décennie. Récolte → 4,1 M€, une saison, et **la seule des trois pertes dont l''argent
    soit un substitut réel**.


    Donc oui, les maraîchers sont la variable d''ajustement — non parce que leur perte est la plus légère
    (en euros c''est la plus lourde), mais parce qu''elle est la seule réparable, et que la réparer est
    mon travail.


    Sur l''option que personne n''écrit et que tout le monde a en tête : abaisser le débit réservé est
    la solution la moins coûteuse à court terme *précisément parce que* la rivière n''envoie pas de communiqué,
    ne quitte pas la salle et ne chiffre pas son préjudice. C''est la raison de s''en méfier, pas de la
    retenir.


    ## 3. Les quatre décisions


    **D1 — Je garantis la continuité de l''alimentation, pas les 150 L/s.** La régie confond deux engagements.
    Le premier, je le prends par écrit et sans condition. Plus : arrêté de restriction des usages non
    essentiels (15–25 % de la demande estivale), plan de continuité autonome pour l''EHPAD — un établissement
    où l''interruption tue ne doit pas dépendre d''une réserve de 4 jours — et campagne de recherche de
    fuites sous 8 jours.


    **D2 — 180 L/s maintenus, aucune dérogation.** Plus travaux ciblés sur les deux frayères, et une station
    de contrôle à l''aval indépendante de celle du barrage.


    **D3 — Allocation en volume, pas en débit.** C''est la décision la plus importante et elle ne coûte
    pas un litre. Sur les 80 L/s du scénario provisoire :


    - étalés sur 620 ha → 1,1 mm/jour, ~33 % de l''ETM : la réponse des cultures légumières s''effondre,
    c''est le scénario à 4,1 M€ ;

    - concentrés à pleine dose sur **~207 ha** → besoin couvert, récolte préservée sur un tiers de la
    surface. **Même eau, ~1,3 M€ de produit sauvé.**


    Je fixe le volume ; les 34 exploitations organisent le tour d''eau. Elles connaissent leurs stades
    critiques, pas moi. Plancher garanti sur 8 semaines (l''horizon météo de 3 semaines ne justifie pas
    un engagement ferme sur 8, mais sans plancher aucune planification n''est possible) + révision à la
    hausse tous les 10 jours.


    **D4 — Les 600 000 € n''indemnisent pas, ils achètent du débit.** 15 % de 4,1 M€, soit 968 €/ha si
    on les saupoudre : symbolique et inutile. Donc : ~100 k€ de métrologie et de fuites (les euros qui
    rapportent des litres), ~450 k€ de **rachat de jachère à prix publié dès jeudi soir** (~70–90 ha,
    ~35 L/s libérés). Point critique : la valeur d''une décision d''abandon décroît vers zéro — une parcelle
    abandonnée en semaine 1 économise huit semaines d''eau, en semaine 5 elle n''économise plus rien et
    la récolte est perdue quand même. La compensation réelle, elle, est ailleurs : ISN, dégrèvement TFNB,
    activité partielle, année blanche MSA — dossiers ouverts lundi. Les 600 k€ sont le pont, pas la destination,
    et dire l''inverse serait mentir aux maraîchers.


    ## 4. Ce que je dis à chacun


    **Aux maraîchers** : vos 240 L/s sont audités, mais les 150 de la régie et les 410 du barrage aussi.
    Vous n''êtes pas la seule partie dont on met les chiffres en doute — vous êtes la seule à qui on l''avait
    dit. À chiffres constants vous obtenez 80 L/s ; si l''audit confirme ce que l''arithmétique suggère,
    130 à 170. Ces dix jours sont votre meilleur actif, pas une manœuvre contre vous.


    **À la régie** : je vous donne une garantie plus forte que celle demandée — la continuité, sans condition,
    par écrit. Pas les 150 L/s, parce que 1 409 L/hab/jour n''est pas un besoin mais un chiffre en attente
    d''explication. Si c''est le rendement du réseau, ce n''est pas une faute que je retiendrai : c''est
    un problème que je financerai. Mais je ne prendrai pas aux maraîchers l''eau que votre réseau perd
    sans avoir regardé.


    **À la presse** : « les paysans et les robinets » a une fonction — effacer le troisième usager et
    masquer que personne n''a vérifié les nombres. Je publierai les trois expertises quel qu''en soit
    le résultat, y compris celle qui porte sur les chiffres des maraîchers.


    ## 5. Ce que j''assume ne pas savoir


    Je ne connais pas le débit à mieux que ±15 %, ni le stock de la retenue, ni si les 150 L/s sont un
    besoin ou une fuite, ni si les 4,1 M€ sont un brut ou une marge nette. Et si l''expertise révèle que
    la régie perd 50 L/s dans ses canalisations, j''aurai fait des maraîchers la variable d''ajustement
    d''une fuite. C''est le risque que j''assume pendant dix jours — et la raison pour laquelle ces dix
    jours ne sont négociables ni dans leur objet ni dans leur durée.


    ---


    Un point de vigilance sur lequel je ne peux pas trancher à votre place : le plancher provisoire de
    80 L/s suppose que la régie continue à prélever 150 pendant l''audit. Si vous jugez politiquement
    intenable de servir intégralement une dotation que vous contestez publiquement, l''alternative est
    de plafonner la régie à un provisoire (60–80 L/s) couvert par sa réserve tampon et les restrictions
    — mais avec 4 jours de tampon seulement, cela vous expose à une rupture si l''audit dérape. Je recommande
    de ne pas le faire : la garantie inconditionnelle de continuité est ce qui vous permet d''exiger l''ouverture
    des livres.

    '
