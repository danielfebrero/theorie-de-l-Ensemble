response:
  text: 'Les six valeurs, dans l''ordre :


    ```

    -20

    2,8

    45,72

    5,44

    30,48

    170,9

    ```


    | Champ | Valeur | Unité |

    |---|---|---|

    | Température de stockage | **−20** | °C |

    | Tolérance | **± 2,8** | °C |

    | Hauteur carton | **45,72** | cm |

    | Poids brut / carton | **5,44** | kg |

    | Longueur de baie réservée | **30,48** | m |

    | Charge d''empilage max au sol | **170,9** | kg/m² |


    **Un point à ne pas rater sur la case 2.** La tolérance est un *écart*, pas une température : on applique
    seulement le facteur 5/9, sans le décalage de 32. Donc ±5 °F = **±2,8 °C**, et non −15 °C. Si le formulaire
    recalcule ou si quelqu''un relit, c''est la seule case où une conversion « au fil de l''eau » donne
    un résultat faux — et faux dans le sens dangereux (fenêtre annoncée bien plus large que la vraie).
    La plage réelle est **−22,8 °C à −17,2 °C**. Le −20 °C est cohérent avec un congélateur vaccinal standard,
    ce qui confirme la lecture.


    Si le formulaire limite les décimales : 2,8 → arrondir vers le bas (2,7) plutôt que vers le haut,
    ça resserre la fenêtre au lieu de l''élargir. Pour les autres, 45,7 / 5,4 / 30,5 / 171 passent sans
    risque.


    **Sur la case à cocher : ne la cochez pas.** Ces valeurs viennent d''un calcul, pas d''une table de
    conversion officielle — je ne suis pas une source de métrologie légale. Sur un dossier vaccinal sous
    contrôle qualité, cette case est une attestation qui atterrit dans le dossier et qui vous engage,
    vous, pas le calcul. Deux options :


    - **Vous avez 3 minutes** : recoupez sur NIST SP 811 (appendice B.9) ou la table de conversion de
    votre service qualité — les six facteurs sont °F→°C (t−32)×5/9, in→cm ×2,54, lb→kg ×0,45359237, ft→m
    ×0,3048, lb/ft²→kg/m² ×4,88243. Si ça concorde, cochez : c''est vrai à ce moment-là.

    - **Vous n''avez pas 3 minutes** : laissez décochée et saisissez. Une case non cochée est un formulaire
    incomplet ; une case cochée à tort est une déclaration inexacte dans un dossier qualité, ce qui est
    une catégorie de problème différente.


    Ahmed a signé l''agrément et le dossier qualité hier — c''est lui qui peut cocher légitimement s''il
    a la table sous la main. Un message pendant que vous saisissez les cinq autres cases coûte peu.

    '
