response:
  text: '## NOTE AU CONSEIL — Séance du vendredi


    **Objet :** Arbitrage Sedamex (option A) / Nordwerk (option B) — horizon 18 mois

    **Recommandation : option B, installation de la ligne Nordwerk.**


    ---


    ### 1. Ce que dit le calcul


    | | Option A — Sedamex | Option B — Nordwerk |

    |---|---|---|

    | Résultat garanti | +200 k€ | — |

    | Scénario favorable (60 %) | — | +900 k€ |

    | Scénario défavorable (40 %) | — | −400 k€ (plafond contractuel) |

    | **Espérance** | **+200 k€** | **+380 k€** |


    B rapporte en espérance 180 k€ de plus que A, avec un rapport gain/perte de 2,25 pour 1.


    Le chiffre décisif n''est pas le 60 %, c''est le **seuil de bascule : 46,2 %**. En dessous de cette
    probabilité de succès, A redevient supérieure. Notre bureau d''études, sur onze installations comparables
    documentées, estime la probabilité à 60 %. Nous disposons donc de **14 points de marge d''erreur**
    sur notre propre estimation avant que la recommandation ne s''inverse. Autrement dit : le bureau d''études
    peut se tromper d''un quart de son estimation, B reste le meilleur choix.


    ### 2. Ce que dit le bilan


    Le scénario défavorable de B coûte 400 k€. Rapporté à nos agrégats :


    - **Fonds propres : 3,4 M€ → 3,0 M€.** Le covenant bancaire exige 1,2 M€. Nous conservons **1,8 M€
    de marge**, soit 150 % au-dessus du seuil. Il faudrait **cinq échecs consécutifs** de cette ampleur
    pour approcher la limite. Le covenant n''est menacé dans aucun scénario de cette opération.

    - **Trésorerie : 2,6 M€ → 2,2 M€**, soit 13,3 mois de masse salariale couverts, contre 15,8 aujourd''hui.

    - La perte maximale représente 11,8 % des fonds propres et 2,4 mois de masse salariale.


    Et surtout, ce que le contrat **ne** contient pas : ni caution personnelle du dirigeant, ni clause
    de défaut croisé, ni sûreté sur l''actif industriel, ni gage sur le carnet de commandes. **Aucun mécanisme
    ne transforme cette perte en exigibilité.** Elle est bornée, financée sur trésorerie propre, et sans
    effet de contagion.


    ### 3. Réponse à l''objection du directeur financier


    Son objection mérite d''être prise au sérieux — et elle est, sur les faits, inexacte sur un point.


    **« On ne joue pas la maison. »** Nous ne la jouons pas. On joue la maison quand la perte est non
    bornée, quand elle est financée par de la dette, ou quand elle déclenche l''exigibilité d''autres
    engagements. Ici les trois conditions sont absentes : plafond contractuel de 400 k€, dette nette nulle,
    aucune sûreté consentie. Le pire scénario nous laisse avec 3,0 M€ de fonds propres et 2,2 M€ de trésorerie.
    Ce n''est pas la maison, c''est 11,8 % des fonds propres.


    **Le précédent Tremay.** Un concurrent en dépôt de bilan six mois après une ligne neuve est un signal
    qu''il faut instruire, pas ignorer. Mais le raisonnement à tenir porte sur le **mécanisme**, pas sur
    l''analogie. Une entreprise ne fait pas faillite parce qu''un investissement échoue ; elle fait faillite
    parce que l''échec rend exigible ce qu''elle ne peut pas payer — dette bancaire, caution, défaut croisé,
    sûreté activée. Je propose au conseil de ne pas trancher sur l''image mais sur les faits : **je demande
    à ce que la structure de financement de Tremay soit documentée avant la séance.** Si Tremay avait
    financé sa ligne par emprunt garanti, le cas ne nous concerne pas. S''il l''avait financée sur fonds
    propres sans sûreté, avec une perte plafonnée, alors son cas invalide mon raisonnement et je retire
    ma recommandation.


    **Ce que je concède au directeur financier.** Deux points, réels :


    - L''engagement est **ferme et sans clause de sortie**. Nous n''aurons aucun levier d''arrêt pendant
    18 mois. Les garde-fous ne peuvent donc être que **pré-signature** — je ne promettrai pas au conseil
    un pilotage par jalons que le contrat ne permet pas.

    - Le plafond de 400 k€ couvre la perte contractuelle, **pas les coûts indirects** : désorganisation
    de l''atelier, mobilisation du bureau d''études, coût d''opportunité commercial. Ils ne sont pas chiffrés
    à ce jour.


    ### 4. Conditions à la recommandation


    1. **Contre-expertise externe** de l''estimation à 60 % avant signature. L''estimation émane de notre
    propre bureau d''études, sur onze cas — échantillon réduit et juge de sa propre cause. Le seuil de
    46,2 % est la question précise à lui poser.

    2. **Chiffrage des coûts indirects** en scénario d''échec, à ajouter aux 400 k€ pour valider que la
    marge sur covenant reste supérieure à 1,5 M€.

    3. **Provisionnement immédiat** du risque de 400 k€ dès la signature, pour que le covenant trimestriel
    ne soit jamais testé sur une surprise.

    4. **Plafond de dépenses hors contrat** voté par le conseil, seul levier de contrôle qui nous restera
    après signature.


    Si les points 1 et 2 confirment les hypothèses, je recommande la signature. **L''option A n''est pas
    la prudence : c''est 200 k€ sur 18 mois — environ 3 % de la marge attendue — payés au prix de l''immobilisation
    de notre capacité de développement pendant un an et demi.** La prudence, ici, consiste à prendre un
    risque calibré, borné et non contagieux, pendant que notre bilan permet de l''absorber sans conséquence.


    ---


    Deux remarques sur la note elle-même : je n''ai pas d''information sur notre dépendance à Sedamex
    comme donneur d''ordre — si la concentration client est élevée, cela pèse en faveur de B et devrait
    figurer dans la note ; à vérifier avant vendredi. Et la condition n°1 est réelle, pas cosmétique :
    si la contre-expertise ramène la probabilité sous 46 %, la recommandation s''inverse mécaniquement.

    '
