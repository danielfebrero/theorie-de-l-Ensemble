response:
  text: '# NOTE AU CONSEIL — Séance du vendredi

    **Objet : arbitrage Sedamex (A) / Nordwerk (B) — horizon 18 mois**

    **De : la direction générale**


    ---


    ## 1. Recommandation


    **J''engage la ligne Nordwerk (option B)**, sous réserve des trois vérifications préalables listées
    au § 4. Ce n''est pas un pari : c''est une exposition bornée, dont le point de bascule est très en
    dessous de l''estimation de notre bureau d''études.


    ## 2. Fondement du choix


    **a) Le test de ruine est concluant — et il prime sur tout le reste.**

    Scénario le plus défavorable de B : échec technique, perte plafonnée de 400 k€, cumulée aux 700 k€
    de dividende exigible.


    | Au pire (échec B) | Après dividende + perte |

    |---|---|

    | Fonds propres | 3 400 − 700 − 400 = **2 300 k€** |

    | Covenant bancaire | 1 200 k€ → **marge de 1 100 k€** |

    | Trésorerie | 2 600 − 700 − 400 = **1 500 k€** |

    | Couverture masse salariale | **9 mois** |


    La perte maximale représente 11,8 % des fonds propres et 2,4 mois de masse salariale. Le covenant
    est testé trimestriellement : le point bas du scénario noir survient au 12ᵉ mois (2ᵉ tranche de dividende
    + pénalité), à 2 300 k€, soit près du double du seuil. Pour le rompre, il faudrait que le plan d''affaires
    dérive de 1 100 k€ supplémentaires — un quart du chiffre d''affaires — *en plus* de l''échec technique.
    Aucune caution personnelle, aucun défaut croisé, aucune sûreté sur l''actif industriel, carnet de
    commandes non gagé : **l''échec de B ne met en cause ni la continuité d''exploitation ni le contrôle
    de l''entreprise.**


    **b) Le point de bascule laisse une large marge d''erreur.**

    B devient moins avantageux que A si la probabilité de succès tombe sous **46,2 %** (900p − 400(1−p)
    = 200). L''estimation est de 60 %, adossée à onze installations documentées. Notre bureau d''études
    peut donc se tromper de près de 14 points et nous serions encore au moins aussi bien qu''avec Sedamex.
    Espérance : **380 k€ pour B contre 200 k€ certains pour A.**


    **c) A n''est pas l''option « sans risque », c''est l''option sans apprentissage.** Elle sécurise
    200 k€ et prolonge de dix-huit mois notre dépendance à un donneur d''ordre, sans rien construire.


    ## 3. Réponse au directeur financier


    Son objection est légitime sur la forme et fausse sur le fond, pour deux raisons.


    **« On ne joue pas la maison. »** Exact — et c''est précisément pourquoi je recommande B. On ne joue
    pas la maison ici : la maison, ce sont 3,4 M€ de fonds propres et 2,6 M€ de trésorerie sans dette
    ; l''enjeu est plafonné contractuellement à 400 k€. Confondre « issue incertaine » et « risque de
    ruine » conduit à refuser toutes les décisions à variance, y compris celles qui sont largement solvables.
    Le critère n''est pas *puis-je perdre ?* mais *puis-je encore fonctionner après avoir perdu ?* Ici,
    oui, avec 1,5 M€ de trésorerie.


    **Le précédent Tremay.** L''analogie ne transporte d''information que si l''exposition de Tremay était,
    comme la nôtre, plafonnée, sans caution ni sûreté, et adossée à un matelas de fonds propres comparable.
    À ma connaissance, les défaillances de ce type tiennent à une exposition non bornée — financement
    bancaire de la ligne, garanties données, absence de plafond de perte —, pas au fait d''avoir installé
    une ligne. **Je demande au directeur financier de produire pour vendredi la structure d''exposition
    de Tremay.** Si elle était bornée comme la nôtre et qu''ils ont sombré malgré tout, je retire ma recommandation
    séance tenante. Sinon, le cas ne s''applique pas.


    ## 4. Conditions préalables à la signature (l''engagement est irréversible)


    Sans clause de sortie, tout le contrôle se joue *avant* la signature. Trois points doivent être levés
    :


    1. **Périmètre exact du plafond de 400 k€** : couvre-t-il nos coûts internes (mobilisation d''équipes,
    emprise atelier, remise en état du site) ou seulement la pénalité de résiliation ? Si des coûts restent
    hors plafond, l''exposition réelle doit être rechiffrée et le dossier réexaminé.

    2. **Audit contradictoire des onze installations comparables** : combien sont réellement comparables
    à notre site, qui a documenté les résultats, et quelle définition de l''« échec » a été retenue. Si
    cette revue ne soutient pas une probabilité de succès **d''au moins 50 %**, je bascule sur A.

    3. **Réversibilité côté Sedamex** : Sedamex restera-t-il accessible au terme des dix-huit mois, ou
    le refus d''aujourd''hui ferme-t-il la porte durablement ?


    ## 5. Ce qui me ferait changer d''avis


    Un plafond de perte poreux (point 1), une base de comparables qui ne tient pas (point 2), ou une exposition
    Tremay démontrée équivalente à la nôtre. En dehors de ces trois cas, l''écart d''espérance est de
    +180 k€, l''exposition maximale est de 11,8 % des fonds propres, et le covenant conserve 1 100 k€
    de marge : **le refus de B ne se justifierait pas par la prudence, mais par l''aversion au chiffre.**


    ---


    **Point de contrôle post-signature :** la seule variable qui reste sous notre main est la vitesse
    de constatation de l''échec. Je propose une revue technique mensuelle avec jalons de recette explicites,
    et l''engagement de déclencher le plafond dès que deux jalons consécutifs sont manqués — pour ne pas
    dépenser au-delà des 400 k€ en tentant de sauver l''installation.

    '
