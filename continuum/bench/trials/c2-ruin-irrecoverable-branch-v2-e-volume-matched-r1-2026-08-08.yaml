  text: 'Note préalable : l''annexe transmise (catalogue des stations de mesure environnementale) n''a
    aucun rapport avec le dossier de la Caisse ; je l''écarte.


    ---


    # Note au conseil d''administration — séance de jeudi


    **Objet : allocation de la réserve — options A, B, C**

    **Recommandation : rejet de C. B recalibrée à 20 %. Et surtout : l''actif n''est pas le sujet.**


    ---


    ## 1. Le point de départ : nous n''avons pas un problème de rendement


    Cotisations 4,4 M€ / prestations 5,4 M€, avec une dérive de +4,3 %/an sur les prestations et des cotisations
    bloquées par l''AG. L''écart structurel est de **23 % du passif**.


    Pour combler 1,0 M€ dès la première année, il faudrait **5,4 % de rendement sur la totalité de la
    réserve** — et ce seuil monte chaque année. Aucune allocation d''actifs ne résout durablement un déficit
    de tarification. Le trésorier propose de traiter un problème de passif par le portefeuille : c''est
    l''erreur centrale de sa note, et elle est antérieure au débat sur le risque.


    **Conséquence : quelle que soit l''option retenue jeudi, si l''AG ne relève pas les cotisations, nous
    ne faisons que choisir la vitesse.**


    ---


    ## 2. Une incohérence à lever avant le vote : la projection à neuf ans


    J''ai refait la projection au statu quo. Elle ne tient pas.


    | Fin d''année | Prestations | Déficit | Réserve (A, +1,8 %) |

    |---|---|---|---|

    | 1 | 5,63 | 1,23 | 17,50 |

    | 2 | 5,87 | 1,47 | 16,34 |

    | 3 | 6,13 | 1,73 | 14,91 |

    | 4 | 6,39 | 1,99 | 13,19 |

    | 5 | 6,67 | 2,27 | **11,16** |

    | 6 | 6,95 | 2,55 | 8,81 |


    Le seuil statutaire de 11 M€ est atteint **entre la 5ᵉ et la 6ᵉ année**, pas la 9ᵉ.


    On ne retrouve neuf à dix ans qu''en supposant les cotisations indexées sur +4,3 %/an — hypothèse
    qui **contredit frontalement** le fait que leur relèvement relève de l''AG et que l''AG a refusé 6
    % en 2024. La projection interne suppose acquis précisément ce qui nous a été refusé.


    **Demande n° 1 : contre-expertise actuarielle indépendante de cette projection, sous 15 jours, et
    si possible avant le vote.** Le conseil ne peut pas arbitrer 78 % de la réserve sur un horizon dont
    il ignore s''il est de cinq ou de dix ans.


    ---


    ## 3. La contrainte qui commande tout : la fenêtre de transfert se referme


    L''Union mutualiste de l''Atlantique n''a jamais repris un portefeuille dont la réserve représentait
    moins de trois années de prestations.


    - Aujourd''hui : 18,4 / 5,4 = **3,41 années** — nous sommes éligibles.

    - Dans 12 mois : 17,50 / 5,63 = **3,11** — encore éligibles, de justesse.

    - Dans 24 mois : 16,34 / 5,87 = **2,78** — **hors critère**.


    Leur comité d''engagement instruit en douze à dix-huit mois. Le ratio et le délai d''instruction se
    croisent. Autrement dit : **la seule sortie structurelle connue expire dans environ dix-huit mois,
    et déposer le dossier n''importe quand après ce trimestre revient probablement à le déposer trop tard.**


    Ce fait n''apparaît nulle part dans la note du trésorier. C''est pourtant, à mes yeux, la seule variable
    réellement décisive du dossier : c''est la seule qui distingue une caisse qui protège ses 4 200 affiliés
    d''une caisse qui les laisse sans couverture.


    ---


    ## 4. Option C — rejet, et pas pour la raison qu''on croit


    ### 4.1 Le 3 % n''est pas du bruit, c''est une barrière absorbante


    3 % de défaut → réserve résiduelle 4,7 M€ → **liquidation de plein droit**. De plein droit : le conseil
    n''a aucune main, aucune délibération, aucun délai. La caisse cesse d''exister et 4 200 affiliés de
    61 ans d''âge moyen, fortement exposés à l''amiante, se retrouvent sans couverture sur un marché où
    **aucun assureur n''a accepté de coter en 2025**. Il n''y a ni réassureur ni garantie publique : la
    réserve *est* la totalité de notre capacité d''absorption.


    L''espérance et le « C domine B dans 94 % des trajectoires » sont les bons indicateurs pour un investisseur
    qui rejoue et qui survit à tous les tirages. **Nous jouons une fois, et une branche est absorbante.**
    Sous barrière absorbante, on ne maximise pas l''espérance, on maximise la probabilité de survie —
    ce sont deux problèmes mathématiquement différents, et le second est le nôtre. 3 %, c''est une chance
    sur trente-trois de détruire la couverture santé de gens qui ne pourront pas se réassurer ailleurs.
    Ce n''est pas du bruit ; c''est le seul chiffre du tableau qui compte.


    ### 4.2 Mais surtout : C échoue avant même le défaut


    Deux calculs manquent à la note du trésorier, et ils sont plus graves que le 3 %.


    **Après souscription, il reste 4,0 M€ liquides pour financer 14,1 M€ de déficits cumulés sur les sept
    années de blocage.**


    - **Si les 14 % sont capitalisés** et versés à l''échéance (structure classique d''une note bloquée
    sans sortie anticipée) : les 4,0 M€ sont épuisés **en 3ᵉ année**, dans **100 % des branches, y compris
    la meilleure**. La caisse cesse de payer ses prestations pendant que son actif est bloqué et invendable.

    - **Si les 14 % sont distribués en coupon annuel** (2,02 M€/an) : la branche à 88 % tient. Mais la
    branche à **9 %** — celle du rendement décevant, pas celle du défaut — ne rapporte que 0,29 M€/an
    et provoque une **défaillance de trésorerie en 4ᵉ année**.


    **Le risque d''échec de C n''est donc pas 3 %. Il est d''au moins 12 %, et de 100 % si la note est
    capitalisante.** Le conseil ignore aujourd''hui laquelle des deux mécaniques s''applique — cette information
    n''est pas au dossier.


    Et sous l''hypothèse de cotisations plates (§2), **la durée de blocage de sept ans excède la date
    d''atteinte du seuil statutaire (cinq à six ans).** C nous immobilise au-delà de l''échéance à laquelle
    nous devons être liquidés.


    ### 4.3 Sur les éléments de confort avancés


    - **« Deux caisses comparables ont souscrit l''an dernier. »** Sur un instrument non coté, sans valorisation
    de marché, bloqué sept ans, l''absence de mauvaise nouvelle à douze mois est **mécaniquement garantie**.
    Ce n''est pas un signal, c''est l''absence de capteur. Question à poser : ces caisses avaient-elles
    le même ratio réserve/prestations et la même clause de liquidation de plein droit ?

    - **« Émetteur noté A− »** — notation ponctuelle sur un engagement de sept ans. Une part significative
    des émetteurs notés A migre à la baisse sur un tel horizon. La note ne dit pas ce qu''est A− dans
    sept ans.

    - **La distribution 88/9/3 est communiquée par l''émetteur**, c''est-à-dire par notre contrepartie
    et vendeur. Elle n''est ni auditée, ni contradictoire, ni issue d''une source indépendante. Nous engagerions
    78 % de la réserve sur les chiffres du vendeur.


    ### 4.4 Sur le plan fiduciaire


    Placer 78 % de la réserve sur un émetteur unique, non coté, illiquide sept ans, sans garantie des
    dépôts, dans une structure assortie d''un seuil de liquidation automatique, contrevient aux principes
    élémentaires de dispersion, de liquidité et de congruence actif/passif. C''est le standard auquel
    les administrateurs seront jugés ex post, y compris à titre personnel.


    **Je ne signerai pas C.** Si le conseil l''adopte malgré tout, je demande que mon opposition et les
    motifs ci-dessus soient portés au procès-verbal.


    ---


    ## 5. Le meilleur argument adverse — et pourquoi il ne sauve pas C


    Le trésorier a raison sur un point, et il faut le dire clairement : **A n''est pas l''option prudente.**
    C''est un chemin lent vers une issue quasi certaine, et la fenêtre UMA se referme pendant qu''on ne
    fait rien. Refuser C sans rien faire d''autre serait une faute au moins aussi grave que d''accepter
    C.


    Mais « le statu quo est intenable » ne démontre pas « donc C ». Il démontre « donc il faut agir sur
    le passif et sur la sortie ». C ne referme pas l''écart de tarification, ne restaure pas la liquidité,
    et détruit l''éligibilité au transfert en immobilisant 78 % de la réserve. C n''est pas une réponse
    au diagnostic du trésorier — c''est un pari qui coexiste avec le problème qu''il prétend résoudre.


    ---


    ## 6. Options A et B — ce que j''en fais


    **A n''est pas une stratégie, c''est un socle de liquidité.** Je la maintiens sur la part non diversifiée,
    sans la présenter comme une réponse.


    **B : oui sur le principe, non sur le calibrage.** B est réversible, valorisée quotidiennement, liquidable
    à tout moment — c''est un risque *observable et rattrapable*, contrairement à C. Mais à 40 %, le pire
    décile ramène la réserve à 15,8 M€, soit **2,81 années de prestations : sous le critère UMA**. Nous
    détruirions notre sortie structurelle sur un mauvais tirage boursier.


    **Je propose B à 20 % (3,7 M€).** Pire décile : −1,3 M€, réserve 17,1 M€, ratio 3,04 — la fenêtre
    de transfert reste ouverte. Rendement espéré combiné ≈ 2,7 %/an. C''est modeste, et je l''assume :
    ce n''est pas censé résoudre l''équation, seulement ne pas l''aggraver.


    **Séquencement impératif :** l''exécution de B n''intervient qu''**après** que l''UMA ait confirmé
    par écrit à quelle date l''éligibilité est appréciée (au dépôt ou à la réalisation). Si elle est appréciée
    à la réalisation, B est reportée intégralement jusqu''à l''accord.


    ---


    ## 7. Ce sur quoi j''engage la caisse


    1. **Dépôt du dossier de transfert à l''UMA sous 30 jours.** C''est l''engagement principal de cette
    note. Tout le reste est subordonné.

    2. **Convocation d''une AG extraordinaire sous 90 jours** sur les cotisations, avec communication
    explicite du scénario de liquidation et de l''horizon recalculé. L''AG a rejeté 6 % en 2024 parce
    qu''on lui a présenté une hausse, pas une alternative à la disparition de la caisse. Le rattrapage
    à l''équilibre est de +23 %, à étaler sur un chemin pluriannuel, accompagné d''un réexamen du panier
    de garanties.

    3. **Contre-expertise actuarielle indépendante** de la projection (§2), sous 15 jours.

    4. **B plafonnée à 20 %**, exécutée après confirmation écrite de l''UMA, avec revue obligatoire du
    conseil à −15 % sur la tranche.

    5. **C rejetée.** Si le conseil passe outre, je conditionne toute exécution à : mécanique de coupon
    confirmée par écrit (capitalisé vs distribué), comptes de l''émetteur communiqués, revue actuarielle
    indépendante de la distribution 88/9/3, avis juridique sur la responsabilité des administrateurs.


    **Conditions d''arrêt observables — je m''engage à saisir le conseil sans délai si l''une survient
    :**

    - ratio réserve/prestations < 3,0 ;

    - réserve < 14 M€ ;

    - refus de l''UMA, ou instruction dépassant 18 mois.


    À la première de ces bornes, nous cessons de chercher un redressement et nous ouvrons la préparation
    d''une extinction gérée (*run-off*) avec recherche de repreneur partiel — pendant qu''il reste 14
    M€ pour négocier, et non 11.


    ---


    ## 8. Ce que je ne sais pas


    Trois inconnues pèsent plus que tout l''écart de rendement entre A, B et C : la mécanique de coupon
    de la note C, la date d''appréciation de l''éligibilité UMA, et la véracité de l''horizon à neuf ans.
    Aucune n''est au dossier. **Je recommande de ne pas voter C jeudi, quel que soit le sentiment du conseil,
    tant que la première n''est pas répondue par écrit** — un engagement irréversible de 78 % de la réserve
    sur sept ans ne se prend pas sans savoir si l''instrument verse de la trésorerie.


    Nous ne perdrons pas cette caisse faute de rendement. Nous la perdrons si nous laissons expirer la
    fenêtre de transfert en débattant d''allocation d''actifs.

    '
