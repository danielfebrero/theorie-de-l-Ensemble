    # NOTE — Prestataire de paiement : recommandation


    **À** la présidente du comité de direction · **De** la direction des opérations · **Vendredi 14 août
    2026**


    ## Recommandation


    **Option B — bascule progressive, démarrage le 1ᵉʳ septembre, 100 % du trafic le 9 novembre, et prolongation
    Solda au mois le mois jusqu''au 31 décembre.**


    Économie année 1 : **180 k€** (310 k€ de B moins 130 k€ d''un mois de Solda), puis **500 k€/an**.
    Sur les 24 mois d''engagement : **680 k€**.


    Nous renonçons à 320 k€ la première année par rapport à l''option A. C''est le prix d''une seule chose,
    et je l''assume : ne jamais être sur un prestataire non éprouvé, sans repli, pendant le pic de fin
    d''année.


    ## Le chiffre qui décide


    756 k€ de flux par jour. **Chaque point de taux d''échec coûte 7 560 € par jour normal, 30 k€ le vendredi
    noir.**


    Le pilote Payflux a mesuré 1,3 % d''échec pendant trois semaines contre 0,4 % chez Solda — 0,9 point
    d''écart. Ce n''est pas une hypothèse, c''est une mesure.


    | | Trafic exposé au rodage | Flux exposé | Le rodage finit… |

    |---|---|---|---|

    | **A** — bascule le 3 novembre | 378 000 transactions | **143 k€** | le 24 novembre, soit 3 jours
    avant le vendredi noir |

    | **B** — 10 % le 1ᵉʳ septembre | 12 600 transactions | **14 k€** | le 21 septembre, soit 9 semaines
    avant le pic |


    Même travail de réglage, dix fois moins d''exposition, et il est terminé avant que le chiffre d''affaires
    ne soit en jeu.


    ## La branche qui ne se rattrape pas


    Une fois les 2,1 millions de jetons transférés **et le compte Solda clos**, revenir coûte six semaines
    et la recollecte des empreintes auprès de 2,1 millions de clients. Ce n''est pas un délai technique
    : c''est une perte de conversion sur toute la base de retour, pendant des mois.


    **Règle à graver : le compte Solda reste ouvert tant que le pic n''est pas passé.** C''est la notification
    du 15 octobre qui commande cette possibilité, et elle ne se rattrape pas.


    **Pire cas de B : 400 k€ d''économie non réalisée. Pire cas de A : la base clients.** L''un se paie
    en euros, l''autre en clients.


    ## Le meilleur argument contre moi — et pourquoi il ne tient pas


    On peut soutenir : « A + prolongation Solda en décembre = 370 k€ d''économie avec un repli chaud,
    soit 190 k€ de mieux que B. Le tableau de bord voit en 5 minutes, l''astreinte rebascule en 15 minutes
    : l''exposition de A n''est pas de trois semaines mais de quelques heures. »


    Cet argument est juste **contre une panne**. Il est faux contre ce que le pilote a mesuré. 1,3 % pendant
    trois semaines n''est pas une panne : c''est un déficit d''acceptation qui se corrige par réglage
    — tokenisation, 3DS, routage, acceptation des émetteurs — sur plusieurs semaines. **On ne rebascule
    pas pour corriger cela, on le traverse.** La seule question est de savoir si on le traverse à 10 %
    du trafic en septembre ou à 100 % en novembre. Les 15 minutes d''astreinte restent notre couverture
    panne ; elles ne couvrent pas le rodage.


    ## Ce que nous exigeons de Payflux


    Leur engagement porte sur 99,9 % de disponibilité — **métrique non pertinente : 99,9 % de disponibilité
    est parfaitement compatible avec 1,3 % d''échec.** Le contrat doit porter :


    1. un **engagement sur le taux d''autorisation** — échec ≤ 0,6 % en moyenne glissante sur 4 semaines
    dès le palier 50 % — avec avoir sur commissions au-delà ;

    2. une **fenêtre de sortie sans pénalité portée à 120 jours**. À défaut, signature le 1ᵉʳ septembre
    : les 90 jours courent alors jusqu''au 30 novembre et couvrent l''intégralité de la montée en charge.
    Si les chiffres ne sont pas au rendez-vous, nous sortons à zéro euro.


    ## Repli et déclencheurs — chiffrés, lus au tableau de bord


    | Observation | Action |

    |---|---|

    | Échec Payflux > 0,8 % sur 2 h à un palier | Retour au palier précédent, réglage, nouvelle tentative
    à +7 jours |

    | Échec > 1,5 % sur 30 min, ou indisponibilité > 15 min | Bascule 100 % Solda par l''astreinte |

    | Au 15 octobre, échec > 0,6 % en moyenne 4 semaines au palier 50 % | Prolongation Solda ferme jusqu''au
    28 février, montée à 100 % reportée à janvier |

    | Au 30 novembre, échec > 0,6 % à 100 % du trafic | Sortie Payflux sans pénalité, retour Solda, appel
    d''offres relancé |


    **L''observation qui renverserait cette note :** si Payflux tient ≤ 0,5 % dès le palier 25 % (constat
    vers le 21 septembre) *et* documente que le 1,3 % du pilote venait d''une cause identifiée et corrigée,
    le rodage n''existe plus. Nous comprimons alors les paliers restants et je reviens rendre une partie
    des 320 k€.


    **Le mur du 28 février.** Solda a écrit qu''aucune prolongation n''ira au-delà. Si Payflux échoue,
    nous n''avons pas trois mois pour trouver un troisième prestataire : nous en avons trois pour l''avoir
    installé. Je lance donc dès septembre, sans engagement, la qualification d''un troisième acteur. Coût
    : du temps d''équipe, zéro euro.


    ## Lundi 17 août


    1. **Lettre à Solda** demandant la prolongation au mois le mois — envoyée lundi, pas le 14 octobre.
    Elle exige la confirmation écrite que la notification du 15 octobre *réserve l''option sans engager
    de durée minimale*. Enjeu : 130 k€/mois.

    2. **Ouverture de la négociation Payflux** sur les trois points ci-dessus. Signature visée le 1ᵉʳ
    septembre, pas avant.

    3. **Lancement technique** : jetons transférés en réplication (sans clôture Solda), répartiteur configuré,
    et **répétition en conditions réelles de la bascule 100 % → Solda avec l''astreinte avant le 28 août**.
    Un repli jamais répété n''est pas un repli.

    4. **Finance** : justifier les 86 k€ d''écart non documentés entre A et B (l''écart de 190 k€ contient
    104 k€ de double run ; le solde n''est pas dans le dossier). Réponse mercredi 19. Cela ne change pas
    la recommandation.


    *Décision demandée : validation de l''option B datée au 1ᵉʳ septembre et de l''envoi de la lettre
    Solda lundi 17 août.*


    ---


    **Trois points de méthode, hors note :**


    Le dossier présente B comme une bascule de 10 semaines sans date de départ. C''est le vrai levier
    : lancée le 1ᵉʳ septembre, elle atteint 100 % le 9 novembre, laisse trois semaines d''observation
    à pleine charge **avec Solda encore ouvert**, et place le vendredi noir (27 novembre 2026) derrière
    un repli fonctionnel. Lancée en octobre, elle finirait la montée en charge en plein pic et deviendrait
    pire que A.


    J''ai ajouté un coût que le dossier ne chiffrait pas — les 130 k€ de décembre — parce que B tel qu''écrit
    laisse décembre sans repli, et décembre pèse 35 M€ de flux. C''est la seule dépense que je vous demande
    d''approuver au-delà des deux options présentées.


    Deux chiffres sont à confirmer et je ne les ai pas inventés : les 86 k€ d''écart non documentés (point
    4), et le fait que la notification du 15 octobre réserve l''option sans engager de durée (point 1).
    Le second est le plus important : s''il oblige à prendre décembre, janvier et février, l''économie
    année 1 passe de 180 k€ à −80 k€. La recommandation tient quand même — la sortie Payflux reste gratuite
    jusqu''au 30 novembre — mais le comité doit le savoir avant de voter.

    '
