response:
  text: '# NOTE DE DIRECTION — CONTRAT D / DÉCISION EXÉCUTOIRE


    **De :** Direction générale

    **À :** Comité de direction (DAF, Directeur commercial, Directeur industriel, DRH)

    **Objet :** Réponse au contrat d''exclusivité D — décision, mandat et conduite à tenir du 9 août au
    30 août

    **Statut :** Exécutoire. Cette note vaut instruction. Aucun arbitrage complémentaire ne sera disponible.


    ---


    ## 1. DÉCISION


    **Nous ne signons pas le contrat d''exclusivité tel que proposé. Ni cette semaine, ni pendant mon
    absence, ni sous aucune version modifiée à la marge.**


    Nous répondons à D par une **contre-proposition ferme, envoyée demain 9 août**, que je signe avant
    mon départ (annexe 1, prête à expédier).


    Le comité dispose d''un **mandat de signature encadré** (§4) pour conclure sans moi si D accepte la
    contre-proposition ou en propose une variante restant dans la zone autorisée. **En dehors de cette
    zone : on ne signe pas, on maintient le statu quo commercial, on attend mon retour le 30 août.** Un
    référencement perdu se regagne. Une exclusivité de trois ans, non.


    ---


    ## 2. POURQUOI — LE CALCUL QUI FONDE LA DÉCISION


    Ce n''est pas un jugement, c''est de l''arithmétique. Je veux que vous puissiez la refaire devant
    D.


    Une remise de 9 points sur le prix de cession ne coûte pas 9 % : elle est prélevée intégralement sur
    la marge. Sur les 14,9 M€ réalisés avec D à 31 % de marge brute, notre marge unitaire passe de 31
    points à 22 points.


    **Volume supplémentaire nécessaire pour seulement compenser la remise : +41 %.**

    D en offre 18 %, et seulement la première année.


    Formule à opposer à leurs acheteurs : le seuil de neutralité est `m / (m − 9)`. Pour que +18 % suffise,
    il faudrait une marge brute de **59 %** sur leur activité. Aucune référence de plats préparés surgelés
    ne s''en approche. **Le calcul ne dépend d''aucune hypothèse discutable : quel que soit le taux de
    marge réel sur D, +18 % ne compense jamais 9 points.**


    Chiffrage de l''offre telle quelle :


    | | Marge brute D |

    |---|---|

    | Aujourd''hui | 4,62 M€ |

    | Année 1 avec +18 % réalisé | 3,87 M€ **(−0,75 M€)** |

    | Années 2 et 3, volume revenu au niveau actuel | 3,28 M€/an **(−1,34 M€/an)** |

    | **Cumul 3 ans** | **−3,4 M€ de marge brute** |


    À quoi s''ajoute le renoncement contraint aux deux alternatives (centrale régionale et marketplace,
    interdites par la clause d''exclusivité) : environ **2 à 3 M€ de marge brute** supplémentaires sur
    la période.


    **Nous perdrions de l''ordre de 6 M€ de marge brute sur trois ans pour une trésorerie de 2,1 M€.**
    Signer, c''est le seul scénario où nous ne survivons pas.


    Trois asymétries à retenir, à énoncer telles quelles si on vous les conteste :


    1. **La remise court 36 mois, l''engagement de volume 12.** Nous payons trois ans un engagement d''un
    an.

    2. **L''exclusivité fait passer notre dépendance de 62 % à 100 %**, au moment précis où nous cherchons
    à la réduire. Elle transforme un risque en certitude.

    3. **La menace et la demande sont contradictoires.** On ne verse pas 9 points de remise pendant trois
    ans pour verrouiller un fournisseur qu''on envisage de déréférencer. La baisse de commandes de 11
    % au T2 et l''ordre du jour du comité d''achat de septembre sont une séquence de pression construite.
    Cela ne veut pas dire qu''elle est creuse — cela veut dire qu''elle est négociable.


    ---


    ## 3. CALENDRIER — CE QUE VOUS FAITES, JOUR PAR JOUR


    **Samedi 8 août (aujourd''hui, avant mon départ)**

    - Je signe la lettre de contre-proposition (annexe 1) et la **délégation de pouvoirs écrite** au DAF
    et au Directeur commercial, agissant conjointement, plafonnée aux limites du §4. Sans ce document,
    rien de ce que vous signerez n''engagera valablement la société. C''est la première chose à sécuriser.


    **Dimanche 9 août** — Le Directeur commercial envoie la contre-proposition à D, par écrit, avec accusé
    de réception, et sollicite un rendez-vous physique sous 72 h. Ton : constructif, volontariste, jamais
    défensif. Nous voulons ce contrat — à des conditions qui tiennent.


    **Du 10 au 16 août** — Négociation. Le DAF est présent à chaque échange. **Aucune réunion en tête-à-tête,
    aucun accord oral, tout est confirmé par écrit le jour même.**


    **16 août** — Échéance des huit jours posée par D. Si nous sommes dans la zone autorisée : vous signez.
    Sinon : voir §5.


    **En parallèle, sans attendre D** — Le plan du §6 démarre lundi 10. Il ne dépend d''aucune issue de
    la négociation.


    ---


    ## 4. MANDAT DE SIGNATURE


    Vous pouvez signer **sans moi** un accord réunissant **la totalité** des conditions suivantes. Aucune
    n''est un objectif de négociation : ce sont des conditions cumulatives.


    **Zone autorisée**


    - **Remise :** 9 % applicables **uniquement aux volumes incrémentaux** au-delà de 14,9 M€ de base
    annuelle. Sur la base historique : **4 % maximum**. Toute autre structure : refus.

    - **Durée :** **12 mois**, reconductible par avenant sur engagement ferme. Pas 36.

    - **Engagement de volume :** **ferme, chiffré, avec plancher trimestriel** et pénalité à la charge
    de D en cas de non-atteinte. Le mot « indicatif » ne figure nulle part.

    - **Exclusivité :** limitée au **canal grande distribution alimentaire physique**. Sont **explicitement
    exclus par écrit** : la vente en ligne directe et marketplaces, la restauration hors domicile, les
    centrales régionales indépendantes, l''export. Cette exclusion est la condition la moins négociable
    de toutes.

    - **Référencement :** maintien contractuel des **huit références** pendant toute la durée, avec préavis
    de **six mois** sur tout retrait — en réponse directe à la baisse non annoncée du T2.

    - **Pénalité de sortie :** **symétrique** et **dégressive**. Si D descend sous le plancher trimestriel,
    D paie. Plafond acceptable côté Verdal : **400 k€**, jamais 1,2 M€.


    **Zone rouge — refus automatique, sans consultation, sans délai de réflexion**


    - Exclusivité tous canaux, sous quelque rédaction que ce soit

    - Durée supérieure à 18 mois

    - Remise supérieure à 4 % sur la base historique

    - Engagement de volume qualifié d''indicatif, de prévisionnel ou de « meilleurs efforts »

    - Pénalité de sortie asymétrique

    - Toute clause de dernier mot, d''alignement de prix automatique, ou d''audit de nos coûts

    - Toute demande d''exclusivité de production ou de capacité réservée


    **Règle par défaut, sans exception :** face à toute situation non prévue par cette note — nouvelle
    proposition, ultimatum, offre « valable ce soir seulement », changement d''interlocuteur — **la réponse
    est : « notre directeur général est en déplacement jusqu''au 30 août, nous reprendrons ce point à
    son retour. »** Ne rien signer n''est jamais une faute. Signer hors mandat en est une.


    ---


    ## 5. SI D REFUSE ET DÉRÉFÉRENCE


    Scénario à traiter comme probable, pas comme accident.


    - **On ne cède pas dans les huit jours.** L''échéance est un instrument de pression, pas une contrainte
    physique. Un déréférencement décidé en comité d''achat de septembre produit ses effets au T4 au plus
    tôt, généralement avec préavis contractuel. Nous avons du temps ; eux ont un trou de gamme à combler
    avant les fêtes.

    - **Le Directeur commercial maintient la relation opérationnelle intacte.** Livraisons, qualité, service
    : irréprochables. On ne punit jamais un client d''une négociation.

    - **Impact maximal estimé** si les 4 références tombent (hypothèse haute, ~50 % du volume D) : −7,4
    M€ de CA, −2,3 M€ de marge brute en année pleine, soit environ 190 k€ de marge par mois. Notre trésorerie
    absorbe ce choc jusqu''à la décision de la centrale régionale. C''est précisément pour cela que nous
    avons 2,1 M€.

    - **Le DAF met en place dès le 10 août un suivi de trésorerie hebdomadaire à 13 semaines**, diffusé
    au comité chaque vendredi.


    ---


    ## 6. PLAN PARALLÈLE — À LANCER LUNDI 10, QUOI QU''IL ARRIVE


    C''est la partie de la note qui compte le plus à long terme. Notre problème n''est pas ce contrat
    : c''est que 62 % de notre chiffre d''affaires dépend d''un interlocuteur qui le sait.


    **Marketplace alimentaire — ouverture immédiate.** Directeur commercial, budget 60 k€ autorisé. Objectif
    : premières ventes avant le 30 septembre. Marge supérieure de 6 points. **Ouvrir ce canal avant toute
    signature est délibéré** : cela nous protège d''une clause d''antériorité et crée un fait accompli
    commercial. Même à 0,4 M€, ce canal a une valeur stratégique sans rapport avec son volume — il prouve
    que nous avons une sortie.


    **Centrale régionale — accélération.** Directeur commercial : demander une réunion sous quinze jours
    et proposer un **pilote restreint démarrant en octobre**, sans attendre la décision globale. Une décision
    partielle anticipée vaut mieux qu''une décision complète dans cinq mois. Offre autorisée : conditions
    d''entrée équivalentes à celles de D aujourd''hui, sans remise supplémentaire.


    **Troisième piste.** Directeur commercial : approcher deux distributeurs ou enseignes régionales concurrents
    de D avant fin août. Objectif : un rendez-vous programmé à mon retour. Aucun engagement pris.


    ---


    ## 7. REDON — PLAN DE CHARGE ET VOLET SOCIAL


    - **Le dossier d''activité partielle est préparé et instruit dès la semaine du 10 août — sans être
    déposé.** DRH et Directeur industriel. Être prêt n''est pas déclencher.

    - **Déclenchement :** le seuil de 70 % doit être **constaté sur deux mois consécutifs de carnet ferme**,
    pas anticipé sur une prévision. Cette décision **ne peut pas être prise en mon absence**, sauf si
    le seuil est franchi de façon effective et documentée — auquel cas DRH et Directeur industriel décident
    conjointement et consignent la décision par écrit.

    - **Avant toute mesure sociale**, on épuise ces leviers dans l''ordre : arrêt de l''intérim, non-remplacement
    des départs, soldes de congés, report des investissements non engagés, transferts de charge entre
    lignes.

    - **Information du CSE :** DRH, réunion d''information avant le 20 août. Message factuel : négociation
    commerciale en cours, aucune décision d''effectif prise, point complet début septembre. **Aucun engagement,
    aucune date, aucun chiffre communiqué.** Les rumeurs coûtent plus cher que l''information.

    - **Gel des dépenses non engagées** supérieures à 25 k€ jusqu''à mon retour. Le chantier Maroc est
    maintenu — c''est notre diversification à trois ans, et l''arrêter enverrait un signal désastreux
    à D comme aux salariés.


    ---


    ## 8. GOUVERNANCE PENDANT MON ABSENCE


    - **Décision commerciale sur D :** DAF et Directeur commercial, **conjointement et par écrit**. Un
    désaccord entre eux = statu quo, aucune signature.

    - **Interlocuteur unique de D :** le Directeur commercial. Toute sollicitation de D adressée à un
    autre membre du comité, ou directement à moi, est renvoyée vers lui. C''est une technique connue ;
    ne la laissez pas fonctionner.

    - **Comité de direction :** tous les lundis 9 h, en présentiel, compte rendu écrit d''une page. Sans
    exception, y compris s''il ne se passe rien.

    - Si une fenêtre de communication devient possible depuis le Maroc, elle servira à **vous informer,
    pas à arbitrer**. Ne construisez aucun plan autour de ma disponibilité.


    ---


    ## 9. HYPOTHÈSES ET LIMITES — CE QUE JE N''AI PAS PU TRANCHER


    Je préfère les nommer plutôt que de vous laisser les découvrir.


    1. **Taux de marge réel sur D.** J''ai retenu 31 %, notre moyenne. Il est probablement inférieur sur
    un compte de ce volume — ce qui **renforce** la décision : plus la marge sur D est basse, plus le
    seuil de compensation monte.

    2. **Poids exact des 4 références menacées.** J''ai raisonné sur une hypothèse haute (50 % du volume
    D). **DAF : chiffrez-le précisément avant le 12 août.** Si ces références pèsent moins de 25 % du
    volume D, la menace est faible et vous pouvez durcir la négociation.

    3. **Capacité industrielle à absorber +18 %.** Non vérifiée. **Directeur industriel : réponse écrite
    avant le 12 août.** Si cela suppose un investissement, l''offre de D est encore plus défavorable qu''écrit
    ci-dessus.

    4. **Cohérence marge brute / charges fixes.** 2,1 M€ représentant trois mois de charges fixes implique
    environ 8,4 M€ de charges fixes annuelles, à comparer à 7,44 M€ de marge brute. **DAF : vérifiez et
    corrigez avant le 12 août.** Si ce rapport est exact, notre situation est plus tendue que la présente
    note ne le suppose et le refus de signer devient encore plus impératif : nous n''aurions alors aucune
    capacité à absorber une perte de marge.


    Aucun de ces points ne modifie la décision du §1. Tous peuvent élargir la marge de négociation en
    notre faveur.


    ---


    ## 10. CE QUE JE VOUS DEMANDE DE TENIR


    Ce contrat ne nous est pas proposé parce que nous sommes précieux à D. Il nous est proposé parce que
    notre dépendance est visible et qu''elle a une valeur marchande. La bonne réponse n''est pas de mieux
    négocier une exclusivité : c''est de faire baisser cette dépendance, ce qui commence lundi 10 avec
    la marketplace et la centrale.


    Nous pouvons perdre quatre références. Nous ne pouvons pas perdre notre liberté de vendre pendant
    trois ans.


    Si vous devez retenir une seule ligne : **en cas de doute, ne signez pas.** J''assume par écrit toutes
    les conséquences de cette instruction, y compris un déréférencement en septembre et le passage de
    Redon en activité partielle. Ces décisions sont les miennes, prises aujourd''hui, en connaissance
    des chiffres ci-dessus. Aucun d''entre vous n''aura à en répondre.


    Merci de me confirmer par retour, avant 18 h ce soir, votre lecture de cette note et votre accord
    sur la répartition des responsabilités du §8.


    *Direction générale — 8 août 2026*


    ---


