response:
  text: '## NOTE AU COMITÉ DE DIRECTION


    **Objet :** Contrat cellules 2027 — 72 000 unités

    **De :** Direction des opérations · **Date :** lundi (J+0) · **Décision demandée :** oui, avant J+18


    ---


    ### Décision proposée


    **Réserver la capacité Kelmar à J+16, au prix de 26,00 €**, sauf si Sinolux accepte d''ici J+12 une
    clause indexée sur le taux de retour. L''économie de 230 400 € inscrite au budget n''existe pas :
    c''est un écart de prix d''achat, pas une marge. Une fois les retours pris en compte, la meilleure
    estimation disponible donne un résultat **compris entre −35 000 € et +4 000 €**.


    ### Pourquoi les 230 400 € ne sont pas une économie


    Chaque point de taux de retour coûte 147 600 € par an (720 chargeurs × 205 €). L''écart de prix Kelmar/Sinolux
    en vaut **1,56 point**.


    Kelmar retourne à 1,3 % de façon stable depuis quatre ans. Le **point mort de Sinolux se situe donc
    à 2,86 %** — ou 3,03 % si l''on crédite au maximum la clause de remplacement gratuit (voir annexe).
    Au-delà, la cellule la moins chère nous coûte plus cher.


    La seule mesure indépendante dont nous disposons annonce **3,1 %**.


    ### Nous n''avons pas trois sources, nous en avons deux


    - Sinolux, essais internes : **1,1 %**. Partie intéressée, non contradictoire.

    - Audit sectoriel de mars : **3,1 %**, ligne comparable du même fournisseur. Indépendant.

    - Cabinet Ferro, « environ 3 % » : sa note méthodologique indique qu''il travaille **sur l''échantillon
    de l''audit de mars**. Ce n''est pas une confirmation, c''est la même donnée relue.


    Aucune des deux ne mesure la cellule que nous achèterions : c''est la limite honnête de ce dossier.
    Mais l''une est produite par le vendeur, l''autre non.


    ### Le signal décisif : le refus d''indexation


    Sinolux refuse toute clause indexée sur le taux de retour, et accepte de remplacer gratuitement les
    cellules défectueuses. Cette combinaison est l''information la plus fiable du dossier : **le fournisseur
    prend à sa charge le seul poste qui ne figure pas dans nos 205 €** (la cellule, 22,80 €) et refuse
    celui qui les compose intégralement (échange, transport, geste commercial, atelier).


    Un fournisseur qui croit à ses 1,1 % ne perd rien à s''engager sur 1,3 %. Sinolux valorise lui-même
    son propre chiffre en refusant de le garantir.


    ### Le test Vertex est hors calendrier


    34 000 €, résultat sous neuf semaines, soit **J+63** : 45 jours après l''échéance ferme de Kelmar,
    42 jours après l''expiration du prix Sinolux. Il ne peut pas informer la décision 2027. Je ne le commande
    pas pour ce contrat.


    Je propose en revanche de le commander **pour le contrat 2028**, comme condition de qualification
    de Sinolux, financé pour moitié par lui. Réserve à connaître : à ±0,3 point, un résultat autour de
    3 % encadrerait encore le point mort et ne trancherait pas ; le test n''est décisif que s''il tombe
    sous 2,5 %.


    ### Ce qui renverserait cette décision


    Une seule observation, disponible avant J+12 : **Sinolux signe une clause lui faisant supporter 205
    € par chargeur retourné au-delà de 1,3 %**. Le risque bascule alors sur lui, les 230 400 € deviennent
    réels et je recommande Sinolux immédiatement.


    ### Contre-argument, et pourquoi il ne l''emporte pas


    Le taux de retour dépend aussi de notre assemblage, pas seulement de la cellule ; l''audit porte sur
    une autre ligne, peut-être plus ancienne ; et un entrant sans historique peut refuser toute indexation
    par simple politique commerciale. Si le vrai taux était de 1,8 %, nous gagnerions 156 000 €.


    C''est possible. Mais aucune donnée ne soutient cette hypothèse, l''engagement porte sur 72 000 unités
    en une fois, sans sortie possible, et la clause proposée en § précédent lèverait l''objection sans
    nous coûter un euro. Nous ne renonçons pas à Sinolux : nous refusons de l''acheter sans mesure.


    ### Actions et calendrier


    | Échéance | Action | Responsable |

    |---|---|---|

    | **J+1** | Lettre à Sinolux : clause 205 €/retour au-delà de 1,3 %, réponse exigée à J+12 | Achats
    |

    | **J+1** | Ouverture d''une renégociation Kelmar, devis Sinolux à l''appui (1 €/cellule = 72 000
    €) | Achats |

    | **J+12** | Point d''arbitrage : réponse Sinolux | CODIR restreint |

    | **J+16** | Réservation capacité Kelmar (marge de 2 jours sur l''échéance ferme) | Opérations |

    | **J+21** | Proposition de qualification 2028 à Sinolux : tranche pilote + test Vertex cofinancé
    | Opérations |


    **Pire cas assumé :** nous payons 230 400 € de plus qu''un scénario Sinolux à 1,1 % qui n''est attesté
    par personne. Ce coût est porté par la marge 2027 et il est intégralement réversible sur le contrat
    2028.

    **Pire cas évité :** 35 280 € de perte sèche et **1 296 clients supplémentaires en incident** sur
    l''année, non chiffrés ici et non réversibles, eux.


    **Demande au CODIR :** retirer les 230 400 € du budget 2027 dès aujourd''hui. Les maintenir jusqu''à
    la signature reviendrait à financer autre chose avec une économie qui n''a jamais existé.


    ---


    ### Annexe — le calcul


    | | Kelmar 1,3 % | Sinolux 1,1 % | Sinolux 3,0 % | Sinolux 3,1 % |

    |---|---|---|---|---|

    | Cellules | 1 872 000 € | 1 641 600 € | 1 641 600 € | 1 641 600 € |

    | Retours (unités) | 936 | 792 | 2 160 | 2 232 |

    | Coût retours (205 €) | 191 880 € | 162 360 € | 442 800 € | 457 560 € |

    | **Total** | **2 063 880 €** | **1 803 960 €** | **2 084 400 €** | **2 099 160 €** |

    | **Écart vs Kelmar** | — | **+259 920 €** | **−20 520 €** | **−35 280 €** |


    **Point mort :** 230 400 € / 205 € = 1 124 retours supplémentaires tolérables = 1,56 point → **2,86
    %**.


    **Sensibilité, clause de remplacement gratuit :** les 205 € sont décrits comme complets et indépendants
    du fournisseur — le prix de la cellule n''y figure donc pas, et la gratuité vaut zéro sur notre exposition.
    Si l''on retient malgré tout l''hypothèse inverse (cellule de remplacement facturée en sus, 26 € chez
    Kelmar, 0 € chez Sinolux), le point mort monte à **3,03 %** et le scénario 3,1 % ressort à −10 944
    €. **Négatif dans les deux lectures.**

    '
