response:
  text: '## Note


    **À :** Présidente du comité de direction

    **De :** Direction des opérations

    **Date :** 14 août 2026

    **Objet :** Prestataire de paiement — arbitrage A / B et décision d''exécution


    ---


    ### Recommandation : **Option B**, avec un calendrier avancé à octobre.


    Ne pas basculer le 3 novembre. Démarrer la montée en charge le **5 octobre**, à l''intérieur du contrat
    Solda déjà payé jusqu''au 30 novembre, et passer à 100 % le **1er décembre** avec Solda maintenu ouvert
    en repli tout le mois.


    ### Les trois chiffres qui tranchent


    **1. L''écart entre A et B est de 175 k€ sur 24 mois, pas de 190 k€ sur un an.** Le contrat Payflux
    est un engagement de 24 mois. B re-séquencé (ci-dessous) économise **325 k€** en année 1 et 500 k€
    en année 2, soit 825 k€, contre 1 000 k€ pour A. L''écart représente **6 % d''une base Solda de 2,8
    M€ sur deux ans**. Ce n''est pas un chiffre qui doit dicter une décision irréversible.


    **2. Le coût d''une dégradation ordinaire est faible ; le coût d''une erreur irréversible ne l''est
    pas.** Un point de taux d''échec vaut 7 560 € de chiffre par jour (18 000 × 42 €). Les trois semaines
    d''instabilité observées chez le marchand pilote, appliquées à 100 % du trafic, exposent **143 k€**
    de chiffre — dont une partie est récupérée en réessai. Ce n''est pas le sujet. Le sujet est ce qui
    se passe si Payflux ne se stabilise pas : jetons transférés, compte Solda clos, **6 semaines de délai
    et re-collecte des empreintes auprès de 2,1 millions de porteurs**, en pleine saison. Une perte de
    conversion de 5 % sur six semaines de décembre-janvier dépasse **1,5 M€**.


    **3. A ne l''emporte que si le risque d''incident majeur en période de pic est inférieur à 12 %**
    (175 k€ / 1,5 M€). Les données du dossier ne permettent pas de le soutenir : un pilote unique, chez
    un autre marchand, à volume inconnu, jamais testé au pic de Vireo. Les 99,9 % contractuels portent
    sur la disponibilité, pas sur le taux d''autorisation — et autorisent 43 minutes d''indisponibilité
    par mois sans manquement, soit ~68 k€ un jour de pic à 100 % du trafic.


    ### Pourquoi A échoue au test décisif


    La bascule du 3 novembre place la fin des trois semaines d''instabilité au 24 novembre : **trois jours
    avant le Black Friday, sans marge**. Surtout, elle rend inutilisable la clause de sortie gratuite
    à 90 jours : juridiquement ouverte, opérationnellement morte dès que Solda est clos. A échange une
    option réelle contre 175 k€.


    ### Calendrier


    | Date | Action |

    |---|---|

    | 21 août | Préavis de prolongation à Solda (échéance dure : 15 octobre) |

    | 11–25 sept. | Signature Payflux → fenêtre de sortie gratuite jusqu''au 10-24 déc. |

    | 14 sept.–2 oct. | Transfert des jetons **en double**, compte Solda maintenu ouvert |

    | 5 / 12 / 19 oct. | 10 % → 25 % → 50 % du trafic |

    | 26 oct.–22 nov. | Gel à 50 %, test de charge au pic |

    | 23–29 nov. | Semaine Black Friday : **repli délibéré à 25 % Payflux / 75 % Solda** |

    | 1er déc. | 100 % Payflux, Solda ouvert en repli chaud (130 k€) |

    | 20 déc. | Décision : fermeture Solda au 31 déc., ou prolongation janvier (130 k€) |

    | 28 fév. | Plancher absolu — Solda ne prolongera pas au-delà |


    **Année 1 :** Payflux 900 k€ + prolongation Solda 130 k€ + double run 45 k€ = 1 075 k€, soit **325
    k€ d''économie**. Double run d''octobre-novembre : 90 k€ sur l''exercice en cours.


    ### Règles d''arrêt, pré-autorisées


    - **Repli immédiat** (astreinte, sans comité) : taux d''échec Payflux > 0,8 % sur 3 relevés consécutifs,
    ou taux d''autorisation inférieur de 1,5 pt à Solda sur 60 minutes. Retour à 100 % Solda en moins
    de 15 minutes.

    - **Passage au palier suivant** : 7 jours consécutifs à ≤ 0,5 % d''échec, sans événement de repli.

    - **Sortie du contrat** : si au 5 décembre Payflux n''a pas tenu ≤ 0,5 % pendant 14 jours, on active
    la sortie gratuite avant l''expiration des 90 jours et on renégocie avec Solda depuis une position
    ouverte.


    ### Lundi 17 août


    1. Mandat juridique/DAF sur Payflux, avec trois clauses non négociables : SLA sur le **taux d''échec
    mesuré chez Vireo** (≤ 0,4 %) et pénalités associées ; test de charge au pic contractualisé ; confirmation
    écrite que les jetons peuvent être provisionnés **sans clôture du compte Solda**.

    2. Rédaction du préavis Solda, envoi le 21 août — en cherchant à l''obtenir comme option mensuelle
    et non comme engagement ferme sur trois mois.

    3. Lancement du chantier technique : routage par empreinte client (et non aléatoire par transaction,
    pour ne pas dégrader les modèles de fraude des deux côtés), vue comparative Solda/Payflux au tableau
    de bord, runbook de repli et exercice à blanc avant le 5 octobre.

    4. Inscription des règles d''arrêt ci-dessus au registre des délégations de l''astreinte.


    ### Ce qui me ferait changer d''avis


    Un test de charge contradictoire, réalisé avant le 15 octobre au volume de pic de Vireo, montrant
    Payflux ≤ 0,4 % — et une clause de sortie gratuite étendue à 180 jours. À ces deux conditions, A redevient
    défendable. En l''état, non.


    ---


    **Argument le plus fort contre cette recommandation :** le double run fractionne l''historique transactionnel
    entre deux prestataires, ce qui peut dégrader les taux d''autorisation côté émetteur des deux côtés
    pendant dix semaines — un coût réel, non chiffré au dossier. Le routage par empreinte client le limite
    mais ne l''annule pas. Cela reste préférable à un basculement sans retour possible trois semaines
    avant le pic.

    '
