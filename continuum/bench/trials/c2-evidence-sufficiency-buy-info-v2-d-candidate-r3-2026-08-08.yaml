response:
  text: '# Note au comité de direction — Cellules 2027


    **Objet :** attribution du contrat 72 000 cellules · **Décision demandée :** réserver la capacité
    Kelmar avant J+18


    ---


    ## Décision proposée


    **Réserver la ligne Kelmar 2027 à J+18. Ne pas attribuer 2027 à Sinolux en l''état des mesures.**
    Ouvrir en parallèle une qualification Sinolux pour 2028, conditionnée à une mesure indépendante.


    Critère décisif : ce n''est pas le prix d''achat, c''est le **coût total livré**, retours compris.
    Les 230 400 € d''écart de prix sont annulés par 1 124 retours supplémentaires sur l''année — soit
    1,56 point de taux de retour.


    ## L''arithmétique


    Retour terrain : 205 € × 72 000 = 14 760 000 € par point de taux, soit **147 600 € par 0,1 point**.

    Référence Kelmar (1,3 %) : 1 872 000 + 191 880 = **2 063 880 €**.


    | Taux de retour Sinolux | Coût total | Écart vs Kelmar |

    |---|---|---|

    | 1,1 % *(essais Sinolux)* | 1 803 960 € | **− 259 920 €** |

    | **2,86 % — point mort** | 2 063 880 € | 0 |

    | 3,0 % *(Ferro)* | 2 084 400 € | + 20 520 € |

    | 3,1 % *(audit de mars)* | 2 099 160 € | + 35 280 € |

    | 4,0 % | 2 232 000 € | + 168 120 € |


    Le point mort à 2,86 % suppose que les 205 € intègrent la cellule d''échange. S''ils s''y ajoutent,
    la gratuité Sinolux le déplace à 3,22 % — et l''audit de mars tombe alors **à l''intérieur** de la
    fourchette. À vérifier au contrôle de gestion avant J+12 : ce seul point fait basculer le scénario
    3,1 % de −35 280 € à +15 610 €, soit 0,8 % du budget. Dans les deux lectures, l''écart entre les deux
    fournisseurs est inférieur à la précision de nos mesures.


    ## Ce que valent les trois éléments sur Sinolux


    Nous n''avons pas trois sources, nous en avons **deux**. Ferro annonce « environ 3 % » en travaillant,
    sa note méthodologique le dit, sur l''échantillon de l''audit de mars : c''est la même mesure énoncée
    deux fois. Il reste une mesure indépendante (3,1 %, ligne comparable, même fournisseur) et une déclaration
    du vendeur (1,1 %), non auditée, qui est la seule branche rendant l''affaire rentable.


    Aucune borne haute n''a été mesurée. Rien n''établit que 3,1 % soit le pire cas.


    ## Ce que vaut la concession obtenue


    Sinolux refuse l''indexation sur le taux de retour — le seul engagement qui aurait transféré le risque
    — et offre la cellule gratuite. À 3,1 %, cette gratuité représente au plus **51 000 € sur 457 560
    € de coût de retour** : Sinolux prend en charge le neuvième qui lui coûte peu et nous laisse les huit
    neuvièmes. La remise de 3,20 € par cellule reste une hypothèse sur notre taux de retour, pas un engagement
    du fournisseur.


    ## Le piège de calendrier


    Le test Vertex rend son résultat à J+63. La capacité Kelmar se perd à J+18, ferme. **34 000 € achèteraient
    une information qui arrive 45 jours après la fermeture de la porte.** Refuser Kelmar à J+18 sans mesure,
    c''est se retrouver à J+21 sans alternative pour 72 000 unités, sans autre mesure disponible avant
    fin d''année, et avec un lancement à J+70 que la direction commerciale refuse de décaler. Le risque
    n''est pas de perdre 35 000 € : c''est de n''avoir plus de fournisseur.


    ## Repli et déclencheur


    Si Kelmar n''accepte qu''une réservation totale et non fractionnée, nous réservons les 72 000 et 2027
    est fermé. Déclencheur de réouverture : résultat Vertex à J+63, avant démarrage production, pour arbitrer
    2028.


    ## Ce qui renverserait cette décision


    Une mesure du taux de retour Sinolux sur ligne comparable, **indépendante de l''échantillon de mars**,
    inférieure à 2,0 % (marge suffisante face au ±0,3 point) — ou l''acceptation par Sinolux d''un plafond
    contractuel sur notre coût de retour. L''un ou l''autre avant J+18 fait basculer la recommandation.


    ## Premières actions


    1. **Avant J+12 — Kelmar :** la réservation est-elle un engagement d''achat ferme ou une option de
    capacité ? une réservation partielle (55 000 + solde flexible) est-elle possible ? Une réponse positive
    rouvre un scénario à deux sources.

    2. **Avant J+12 — Sinolux :** une proposition unique — plafonner notre exposition retour, ou cofinancer
    le test Vertex contre un engagement écrit de notre part sur un volume 2028 si la mesure ressort ≤
    2,0 %. C''est un accès réel au marché, pas une consultation. Un refus de cofinancer sa propre mesure
    est en soi une information.

    3. **Direction financière :** retirer les 230 400 € du budget 2027. Ils n''existent que dans la branche
    fournie par le vendeur.


    ---


    **Hors note, deux points pour vous :**


    L''argument le plus fort contre ma recommandation est que l''espérance monétaire penche vers Sinolux
    : +260 k€ si 1,1 %, −35 k€ si 3,1 %. Une asymétrie 7 pour 1 justifierait de tenter. Je ne la retiens
    pas pour trois raisons : le gain n''existe que dans le chiffre du vendeur, la perte n''est pas plafonnée
    à 3,1 % puisque aucune borne haute n''a été mesurée, et la décision de J+18 n''est pas « Sinolux ou
    Kelmar » mais « Sinolux ou plus personne ». Si Kelmar accepte une réservation partielle, cette asymétrie
    redevient exploitable sur une tranche — et c''est la question qui vaut le plus cher cette semaine.


    Le point sur la composition des 205 € n''est pas un détail comptable : il déplace le point mort de
    2,86 % à 3,22 % et change le signe du scénario le plus probable. Je l''ai posé en hypothèse déclarée
    faute de pouvoir le trancher depuis l''énoncé.

    '
