  text: 'L''écriture fichier n''est pas autorisée sur cette session — voici la note.


    ---


    # Prestataire de paiement — arbitrage Solda / Payflux


    **Pour** : Présidente du comité de direction · **De** : Direction des opérations · **Comité du vendredi**


    ## Recommandation


    **Option A — bascule intégrale le 3 novembre — mais on ne ferme pas le compte Solda le 30 novembre.**

    On notifie Solda avant le 15 octobre pour tenir l''option de prolongation, et on ne clôture qu''après
    preuve : un Black Friday et un Cyber Monday passés à 100 % sur Payflux. **Décision de clôture prise
    en comité le 28 novembre, sur critères écrits dès aujourd''hui.**


    ## Pourquoi ce n''est pas B


    Le dossier fait croire que l''arbitrage porte sur la vitesse de bascule. Il porte en réalité sur **une
    seule date : celle où l''on ferme le compte Solda.** Le transfert des 2,1 M de jetons n''est pas le
    point de non-retour — la clôture l''est. Tant que le compte reste ouvert, l''astreinte bascule 100
    % du trafic en moins de 15 minutes.


    Or **le contrat Solda court jusqu''au 30 novembre quoi qu''il arrive** : sous l''option A, le filet
    de sécurité est déjà payé et couvre le Black Friday (27/11) et le Cyber Monday (30/11) **à coût nul**.
    B achète 10 semaines de prudence à 190 k€ pour couvrir une fenêtre qui est déjà couverte.


    B a un second défaut : il ne répond à la question qui compte — Payflux tient-il la charge de pointe
    ? — qu''en janvier, à 100 %, dans le mois où la réponse ne vaut plus rien. A obtient cette réponse
    le 27 novembre, à temps pour décider.


    ## Les chiffres


    Volume : 18 000 × 42 € = **756 k€ de GMV/jour**, ~276 M€/an.


    | | Option A | Option B |

    |---|---|---|

    | Économie an 1 (dossier) | **500 k€** | 310 k€ |

    | Rodage Payflux (+0,9 pt sur 3 sem.) | 143 k€ de GMV exposée (100 % du trafic) | 21 k€ (10–25 % du
    trafic) |

    | Réponse « tient-il le pic ? » | **27 novembre** | janvier |

    | Repli 15 min pendant le Black Friday | oui, gratuit (contrat en cours) | oui, payant |


    - **Coût du rodage** : les 143 k€ de GMV exposée sous A représentent ~70 k€ après relances, soit ~18
    k€ de marge. C''est le prix de l''information, très inférieur aux 190 k€ d''écart.

    - **Coût de l''option décembre, si on l''exerce** : 130 k€ — 68 % de l''écart A/B, payé **uniquement
    si la preuve est mauvaise**. A conserve donc l''optionnalité de B en ne la payant que sur événement.

    - **À corriger dans la présentation** : Payflux stabilisé est à 0,5 % d''échec contre 0,4 % chez Solda.
    Ces 0,1 pt coûtent **276 k€ de GMV/an, dans les deux options**. L''économie réelle du changement n''est
    pas 500 k€ mais de l''ordre de 350–430 k€. Le changement reste franchement rentable ; l''affichage
    est optimiste.

    - **99,9 % de disponibilité contractuelle = 43 min/mois, 8,8 h/an d''indisponibilité conforme au contrat.**
    Ce n''est pas un engagement fort pour du paiement. À renégocier en pénalités au niveau transactionnel.


    ## Ce qui renverserait la recommandation


    Toute la construction repose sur une hypothèse à vérifier : **le coffre de jetons Solda reste actif
    et utilisable après transfert vers Payflux, tant que le compte est ouvert.** Si Solda ne le confirme
    pas par écrit **avant le 30 septembre**, le repli des 15 minutes n''existe pas sous A — et **B devient
    obligatoire**, à son prix. C''est la seule question susceptible de changer la réponse ; elle part
    lundi.


    Le meilleur argument contre A : passer à 100 % d''un coup expose le rodage complet au trafic plein.
    Il est chiffré ci-dessus à ~18 k€ de marge, et il achète en échange le seul test de charge réel qui
    existe. Il ne renverse pas.


    ## Critères de clôture — à valider vendredi, avant que les données n''existent


    Le compte Solda est clos le 30 novembre **si et seulement si**, sur le Black Friday et le Cyber Monday
    à 100 % Payflux :


    1. taux d''échec ≤ 0,6 % sur chacune des deux journées ;

    2. aucun incident de plus de 15 minutes ;

    3. taux d''autorisation dans un écart de 0,3 pt de la référence Solda sur 12 mois.


    **Un seul critère manqué → prolongation Solda pour décembre (130 k€), clôture reportée au comité de
    janvier.** Ces critères sont figés maintenant, précisément pour qu''on ne les assouplisse pas le 28
    novembre sous la pression de l''économie.


    ## Repli armé du 3 novembre à la clôture


    Le tableau de bord se rafraîchit toutes les 5 minutes. **Si le taux d''échec Payflux dépasse celui
    de Solda de plus de 0,3 pt sur 6 relevés consécutifs (30 min), l''astreinte bascule 100 % du trafic
    sur Solda immédiatement, sans arbitrage hiérarchique.** Retour à Payflux sur décision explicite uniquement.
    Coût maximal d''un tel épisode un jour de pic : ~30 k€ de GMV.


    **Butée absolue** : Solda a écrit que la prolongation ne sera pas reconduite au-delà du 28 février.
    Le 100 % Payflux définitif doit donc être acquis et stable **fin janvier au plus tard**, quelle que
    soit l''issue du 28 novembre.


    ## Lundi


    1. **Lettre à Solda** — notification de prolongation mois le mois (échéance 15/10, on ne joue pas
    avec cette date), assortie de deux demandes écrites : que la notification n''engage pas les mois non
    consommés, et **la confirmation que le coffre de jetons reste utilisable après transfert tant que
    le compte est ouvert** (réponse attendue au 30/09).

    2. **Ouverture de la négociation Payflux** — sortie sans pénalité étendue au 31 janvier (à défaut
    : signature datée du 1er octobre, ce qui place les 90 jours sur le 30 décembre et couvre tout le pic)
    ; pénalités de service au niveau transactionnel et non sur la seule disponibilité ; test de charge
    à 54 000 transactions/jour avant le 15 octobre.

    3. **Note à la DSI** — la clôture du compte Solda **sort du périmètre du projet de bascule**. Elle
    fait l''objet d''une décision comité distincte le 28 novembre. Le projet livre le transfert et la
    bascule, pas la fermeture.


    ---


    Trois points sur la fabrication de la note, pour vous et pas pour le comité :


    - **Le pivot de l''analyse** est que le contrat Solda couvre novembre gratuitement. Cela vide l''argument
    principal de B : la prudence qu''il vend pendant le pic est déjà acquise sous A. Ce qui reste à protéger,
    c''est décembre — et la notification du 15 octobre le protège pour 130 k€ conditionnels au lieu de
    190 k€ fermes.

    - **Deux chiffres sont des hypothèses, pas des données du dossier** : le volume d''un jour de pic
    (j''ai pris ×2, d''où les ~30 k€ de coût maximal d''un épisode de repli) et le taux de rattrapage
    sur relance (50 %, d''où les 70 k€). Ni l''un ni l''autre ne fait basculer l''arbitrage, mais si la
    présidente pousse sur ces lignes, ce sont celles-là.

    - **L''ambiguïté que je n''ai pas pu lever** : on ne sait pas si l''économie de 310 k€ de l''option
    B intègre déjà la prolongation Solda à 130 k€/mois pour décembre et janvier. Si elle ne l''intègre
    pas, B est encore plus cher que présenté — ce qui renforce la recommandation sans la changer. Je ne
    l''ai pas mis dans la note pour ne pas ouvrir un débat comptable qui ne modifie pas la décision, mais
    la question mérite d''être posée au contrôle de gestion avant vendredi.

    '
