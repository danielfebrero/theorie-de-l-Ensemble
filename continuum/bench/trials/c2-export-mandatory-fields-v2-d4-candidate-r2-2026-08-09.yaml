response:
  text: '# NOTE DE DIRECTION — DÉCISION EXÉCUTOIRE


    **De :** Direction générale

    **À :** Comité de direction (DAF, DC, DI, DRH) — pour exécution

    **Objet :** Offre d''exclusivité D — décision, mandat de signature, plan à exécuter

    **Période couverte :** 10 août – 30 août. Je suis injoignable. Cette note tient lieu d''arbitrage.

    **Diffusion :** membres du comité + secrétariat général. À verser au dossier.


    ---


    ## 1. La décision


    **Nous ne signons pas l''offre d''exclusivité de D telle qu''elle est rédigée. Ni cette semaine, ni
    le 17 août, ni sous aucune forme d''urgence.**


    Nous ne répondons pas « non » pour autant. Nous remettons à D, **avant le 17 août**, une contre-proposition
    écrite et signée par nous (§6). Si D l''accepte, ou revient avec un texte qui satisfait **les six
    conditions du §4**, vous signez sans m''attendre. Si une seule condition manque : **pas de signature.**
    Le défaut, en cas de doute, d''urgence, de désaccord entre vous ou d''absence d''information, est
    **l''absence de signature.**


    Cette décision n''est pas un pari sur l''avenir commercial. Elle repose sur une arithmétique que je
    détaille pour que vous puissiez la refaire vous-mêmes et la défendre devant D.


    ## 2. Le calcul


    Le contrat est présenté comme un échange : 9 % de remise contre 18 % de volume. Ce n''est pas un échange
    équilibré.


    Sur une marge brute de 31 %, une remise de 9 % sur le prix de cession fait tomber le taux de marge
    à **24,2 %**. La contribution par unité vendue baisse de 29 %. Pour retrouver la marge d''aujourd''hui,
    il faudrait **+41 % de volume**. On nous en promet 18.


    En euros, sur les 14,9 M€ réalisés avec D :


    - Aujourd''hui : marge brute **4,62 M€**

    - Année 1, remise appliquée **et engagement de +18 % intégralement tenu** : CA 16,0 M€, marge brute
    **3,87 M€**

    - **Écart : −0,75 M€ par an, dans le meilleur scénario du contrat.**


    Cette sensibilité est robuste. Même en supposant que nos coûts variables ne sont pas 69 % mais 60
    % du prix — hypothèse favorable au contrat — le point mort exige encore **+29 % de volume**. L''offre
    n''atteint le seuil de neutralité sous aucune hypothèse raisonnable.


    Et l''année 1 est la meilleure année du contrat, la seule où le volume est engagé. Les années 2 et
    3, le volume est « indicatif » pendant que notre prix, lui, reste ferme.


    - Année 2 au volume d''aujourd''hui, remise appliquée : marge **3,28 M€** (−1,34 M€/an)

    - Année 2 avec le même geste qu''au T2 — −11 % sans préavis : marge **2,92 M€** (−1,70 M€/an)


    Sur trois ans, la trajectoire réaliste défavorable est de l''ordre de **−3,8 M€ de marge brute cumulée**,
    à comparer à 2,1 M€ de trésorerie. Et la sortie coûte 1,2 M€, soit **57 % de notre trésorerie disponible**.
    Nous n''aurions ni les moyens de rester, ni les moyens de partir.


    Enfin, ce que nous achèterions avec ces 9 % n''est pas une remise, c''est notre indépendance commerciale
    : l''exclusivité interdit la centrale régionale (3,5 M€) et la marketplace (0,4 à 2,2 M€ à +6 points
    de marge), et transforme une dépendance de 62 % en dépendance de 100 % pour trois ans. À la renégociation
    de 2029, nous n''aurions plus un seul argument.


    ## 3. Le meilleur argument contre ma décision — et pourquoi il ne l''emporte pas


    Je le formule moi-même, aussi fort que possible, parce que le DAF a raison de le poser et que vous
    devez l''entendre représenté.


    > *Refuser coûte plus cher, tout de suite. Si les 4 références déréférencées le 20 août représentent
    la moitié du volume D, nous perdons 7,45 M€ de CA et environ 2,3 M€ de marge brute par an — trois
    fois le coût de l''année 1 du contrat. Avec trois mois de charges fixes en caisse, l''usine de Redon
    passe sous les 70 %, et 52 postes basculent. Signer coûte 0,75 M€ ; refuser coûte 2,3 M€. Le calcul
    du §2 démontre que le contrat est mauvais, pas qu''il est le pire.*


    C''est exact sur l''année 1, et c''est pour cela que la décision n''est pas confortable. Trois raisons
    font qu''il ne l''emporte pas :


    1. **Les deux coûts ne sont pas de même nature.** Le déréférencement est une perte réversible : D
    conserve 4 références, une référence se regagne en 6 à 12 mois, et notre trésorerie reste intacte.
    L''exclusivité est un verrou de trois ans dont l''issue de secours coûte plus de la moitié de notre
    caisse. On récupère d''un mauvais semestre ; on ne récupère pas d''une insolvabilité.

    2. **Le chiffre de 2,3 M€ est une hypothèse, pas une donnée.** Nous ne savons pas ce que pèsent les
    4 références menacées. C''est la première mesure à produire (§8, J+2). Si elles pèsent 20 % du volume
    D, l''argument s''effondre.

    3. **L''année 1 est financée par les années 2 et 3.** L''écart de 1,5 M€ en notre défaveur la première
    année est le prix d''un droit : celui d''être encore un vendeur libre en 2027. Le contrat n''échange
    pas de l''argent contre de l''argent, il échange un répit contre une capacité.


    Je maintiens la décision. Mais si le DAF veut faire consigner son désaccord au procès-verbal, il le
    peut et il le doit — c''est son rôle, pas une faute.


    ## 4. Ce que vous êtes autorisés à signer sans moi


    Vous pouvez signer **tout accord avec D qui satisfait simultanément les six conditions suivantes.**
    Elles sont cumulatives. Il n''y a pas de « presque ».


    **C1 — Exclusivité.** Aucune clause d''exclusivité de canal, de client ou de territoire. Si D insiste,
    une seule variante est acceptable : exclusivité limitée à nos 8 références actuelles dans les enseignes
    du groupe D, avec exclusion **écrite et nommément citée** de la centrale d''achat régionale, de la
    marketplace alimentaire, de la restauration hors domicile, et de tout client représentant moins de
    0,5 M€.


    **C2 — Durée.** 12 mois maximum, reconductible par accord exprès. Pas 24, pas 36.


    **C3 — Assiette de la remise.** Les 9 % ne s''appliquent qu''au **volume dépassant la base de référence**
    (moyenne des 12 derniers mois, en tonnes, référence par référence). Prix inchangé sur la base. Toute
    autre structure n''est acceptable que si le DAF certifie **par écrit et chiffres à l''appui** qu''elle
    laisse la marge sur coûts variables générée par D au moins égale à celle des 12 derniers mois, sur
    chacune des trois années, **dans l''hypothèse basse de volume**.


    **C4 — Symétrie de l''engagement.** Le volume de D est ferme et indemnisé sur toute la durée. Sous
    le plancher, D nous verse une indemnité au moins égale à la marge perdue. Un volume « indicatif »
    en face d''un prix ferme n''est pas un engagement, c''est une option gratuite offerte à D.


    **C5 — Pénalité de sortie.** 250 k€ maximum, symétrique, et nulle si D passe sous le plancher ou déréférence.


    **C6 — Préavis.** 90 jours par écrit pour toute réduction de commandes ou tout déréférencement. C''est
    la réponse directe au −11 % du deuxième trimestre : sans cette clause, la parole de D n''a pas de
    valeur contractuelle, et nous l''avons vérifié à nos frais.


    **Conditions de forme, non négociables :** revue du texte par notre conseil, avis écrit remis avant
    signature ; **double signature DAF + DC** ; certification écrite du respect des six conditions, annexée
    au contrat et versée au dossier.


    ## 5. Ce que vous ne signerez en aucun cas


    Une exclusivité tous canaux. Un engagement supérieur à 12 mois. Une remise sur l''assiette totale
    sans plancher de volume indemnisé. Une pénalité supérieure à 250 k€. Tout texte remis en séance et
    demandé « pour ce soir ». Toute lettre d''intention, protocole d''accord, accord de principe, courriel
    de confirmation ou tout autre document que D présenterait comme non engageant — un engagement se reconnaît
    à ses effets, pas à son titre.


    **Ma signature n''est déléguée que dans les limites du §4.** Tout document signé hors de cette enveloppe
    est nul de ma part et je le désavouerai publiquement, y compris vis-à-vis de D. Je ne demande à personne
    de porter seul une décision que je n''ai pas prise.


    ## 6. La contre-proposition à remettre à D


    Le DC la rédige avec le DAF, sur notre papier, **signée par eux deux, valable jusqu''au 17 août à
    18 h.** Nous devenons l''émetteur de l''offre et de son échéance.


    Elle offre à D quelque chose de réel — c''est le point, ce n''est pas un refus déguisé :


    - **9 % de remise sur tout le volume additionnel** au-delà de la base 12 mois, sans plafond. Si D
    veut vraiment +18 %, il l''obtient à son prix.

    - **Priorité de capacité industrielle** sur Redon, avec créneaux réservés et engagement de service
    chiffré (taux de service, délais).

    - **Plan promotionnel conjoint** financé à parité sur les 8 références.

    - **Engagement de non-discrimination tarifaire** : aucun autre distributeur ne bénéficiera de conditions
    meilleures que D à volume comparable — ce qui donne à D l''essentiel de ce que l''exclusivité protège,
    sans nous enfermer.

    - **12 mois, préavis 90 jours réciproque, sortie à 250 k€ symétrique.**


    Message d''accompagnement, en une phrase : nous voulons croître avec D et nous finançons cette croissance
    ; nous ne pouvons pas financer une remise sur le volume que nous réalisons déjà.


    ## 7. La visite de l''acheteur de D


    Elle a lieu. Refuser de recevoir serait à la fois un signal de faiblesse et une perte d''information.
    Elle se tient dans ce cadre, sans exception :


    - **Présents : le DAF et le DC, ensemble.** Jamais l''un sans l''autre, jamais un tête-à-tête, y compris
    en marge, au déjeuner ou au téléphone. Votre désaccord est ici une protection : je le mobilise plutôt
    que je ne l''arbitre.

    - **Aucune signature, aucun engagement oral, aucun chiffre nouveau communiqué en séance.** La réponse
    à toute pression est : « la direction générale a fixé un cadre écrit, voici notre proposition, elle
    est valable jusqu''au 17 août. »

    - **Compte rendu écrit dans les 24 h**, versé au dossier, adressé aussi au DI et au DRH.

    - **Questions à poser** (nous en avons besoin plus que lui n''a besoin de nos réponses) : quelles
    sont les 4 références visées et sur quel critère ? quel fournisseur les reprend, à quel prix, avec
    quelle capacité disponible en surgelé ? que devient le taux de service de la catégorie si nos volumes
    sortent ? Notez les réponses, y compris les silences.


    ## 8. Le plan à exécuter quoi qu''il arrive


    Ces actions ne dépendent d''aucune réponse de D. Elles se déclenchent lundi 10 août.


    | # | Action | Pilote | Échéance |

    |---|---|---|---|

    | 1 | **Ligne de crédit confirmée 1,5 M€ ou extension d''affacturage sur créances D**, signée pendant
    que notre dossier est encore intact | DAF | **17 août** |

    | 2 | Mesure exacte du CA **et de la marge sur coûts variables** des 4 références menacées, et des
    4 conservées | DAF + DC | **12 août** |

    | 3 | Revue juridique du contrat D par notre conseil, avis écrit | DAF | **13 août** |

    | 4 | **Lancement de la marketplace** : budget préautorisé 120 k€, référencement engagé, première
    commande sous 6 semaines | DC | lancement **11 août** |

    | 5 | Centrale régionale : demander un **référencement partiel immédiat sur 2 références**, sans attendre
    la décision globale à 5 mois | DC | **14 août** |

    | 6 | Ouvrir 5 contacts distributeurs / RHD, liste écrite, premier rendez-vous calé | DC | **21 août**
    |

    | 7 | Scénario de charge Redon sous hypothèse de déréférencement des 4 références, en semaines glissantes
    | DI | **14 août** |

    | 8 | **Dossier d''activité partielle constitué et prêt au dépôt** — le constituer ne coûte rien,
    ne pas l''avoir coûte trois semaines | DRH | **18 août** |

    | 9 | Information du CSE sur la situation, sans minimiser | DRH | **13 août** |

    | 10 | Gel de tout investissement > 25 k€ non engagé | DAF | immédiat |

    | 11 | Suivi hebdomadaire du délai de paiement de D — une rétorsion passe d''abord par la trésorerie
    | DAF | chaque lundi |


    Sur le point 9 : je m''engage, et vous l''annoncez en mon nom, à **aucun licenciement à Redon avant
    le 31 décembre**. L''activité partielle est notre outil d''ajustement, pas un préalable à autre chose.
    Et le CSE obtient une prise réelle, pas une consultation : une commission paritaire décide de la répartition
    de la charge entre lignes, du calendrier de l''arrêt de maintenance et de l''affectation du plan de
    formation. Ce sont de vraies décisions, elles leur reviennent.


    ## 9. Déclencheurs et replis


    Ils s''appliquent à la décision retenue, et se déclenchent sur un fait observable, pas sur une appréciation.


    - **Charge projetée < 75 % sur 8 semaines glissantes** → palier 1 : gel de l''intérim, avancement
    de l''arrêt de maintenance annuel, bascule sur le plan de formation. Pilote DI.

    - **Charge projetée < 70 %** → dépôt du dossier d''activité partielle (prêt depuis le 18 août), information
    CSE le jour même. Pilote DRH.

    - **Trésorerie < 1,5 M€, ou DSO de D dégradé de plus de 15 jours** → tirage de la ligne de crédit,
    gel de tout engagement > 10 k€. Pilote DAF.

    - **D déréférence les 4 références le 20 août ET réduit les 4 restantes de plus de 15 % dans les 30
    jours** → scénario de rupture : comité extraordinaire sous 48 h, plan de diversification à pleine
    vitesse. **Toujours pas de signature** — je rentre le 30 août, et une signature prise dans ces conditions
    serait la pire de toutes.

    - **D accepte la contre-proposition ou satisfait les six conditions** → signature immédiate, sans
    m''attendre, avec la certification écrite du §4.


    ## 10. Ce qui renverserait ma décision


    Je veux que vous puissiez me contredire sur preuve, et non sur pression. **Deux constatations, et
    deux seulement, autorisent la signature de l''offre actuelle**, si elles sont établies par écrit par
    notre conseil avant le 17 août :


    1. **L''assiette des 9 % est en réalité le volume incrémental seul**, et non le chiffre d''affaires
    total. Alors l''arithmétique du §2 s''inverse et l''offre devient créatrice de marge.

    2. **L''engagement de volume de D est ferme et indemnisé sur les trois années**, le mot « indicatif
    » ne désignant qu''une modalité de répartition et non la faculté de réduire. Alors la branche de perte
    irrécupérable des années 2 et 3 se referme.


    Si l''une des deux est établie, vous êtes couverts pour signer, et je l''assumerai comme ma décision.
    Si aucune ne l''est — et je pense qu''aucune ne le sera — le §4 s''applique intégralement.


    ## 11. Gouvernance en mon absence


    Le DAF et le DC exercent conjointement la signature dans les limites du §4. Le DI arbitre en cas de
    blocage sur les seuils industriels du §9. **En cas de désaccord persistant sur une signature, il n''y
    a pas de vote : c''est non.** L''absence de signature est une position parfaitement tenable ; une
    signature prise à la majorité en mon absence ne l''est pas.


    Aucune information nouvelle transmise par D, aucun appel de sa direction, aucun courrier me citant,
    aucune échéance avancée une seconde fois ne modifie cette note. Je n''ai délégué à personne, chez
    nous ou chez eux, le pouvoir de la modifier en mon nom. Si quelqu''un se présente en affirmant le
    contraire, la réponse est non, et le compte rendu m''est adressé pour mon retour.


    ## 12. Première action


    **Lundi 10 août, 9 h : le DAF appelle nos deux banques et notre affactureur pour la ligne de 1,5 M€,
    avant que quoi que ce soit ne soit public.** C''est l''action qui conditionne toutes les autres :
    elle transforme trois mois de trésorerie en six, et c''est cette marge de six mois qui nous donne
    le droit de refuser.


    Je vous fais confiance. Vous n''avez pas à être d''accord entre vous pour appliquer cette note — vous
    avez à l''appliquer.


    *Direction générale — 9 août*


    ---


    **Hypothèses que j''ai dû poser**, à vérifier au retour : marge brute traitée comme marge sur coûts
    variables (le §2 montre que la conclusion tient aussi à 60 % de coûts variables) ; poids des 4 références
    menacées inconnu, d''où l''action n°2 en priorité ; l''engagement de +18 % lu comme un engagement
    d''achat de D. Les seuils que j''ai fixés — 250 k€ de pénalité, 1,5 M€ de ligne, 75 %/70 % de charge,
    25 k€ de gel — sont des choix de prudence, pas des calculs : ils sont réglables, mais seulement par
    moi.

    '
