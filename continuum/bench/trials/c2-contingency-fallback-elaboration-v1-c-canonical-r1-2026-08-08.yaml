response:
  text: 'Je pars de la date du jour (samedi 8 août 2026) : le conseil siège le jeudi 13 août. Si la séance
    visée est une autre, les dates du calendrier ci-dessous se décalent d''autant, mais les délais relatifs
    (7 semaines de travaux, préavis de 30 jours, 11 semaines d''irréversibilité) commandent le plan et
    ne bougent pas.


    ---


    # Plan d''exécution — conversion électrique de la flotte

    **Direction de l''exploitation — pour le conseil du 13 août 2026**


    ## 1. Ce que le conseil vote jeudi


    | # | Décision | Montant | Irréversible ? |

    |---|---|---|---|

    | 1 | Commande de la tranche 1 : 8 bornes, spécification **double sortie séquencée**, mise en service
    au 15 octobre | 210 000 € | Non |

    | 2 | Réserve diesel : plafond de 36 véhicules prolongés, décision mensuelle déléguée au comité flotte
    | 70 000 € (enveloppe, 8 mois) | Non — 480 €/véhicule/mois |

    | 3 | Tranche 2 réservée : 10 bornes supplémentaires, décision ferme le 15 septembre sur données réelles
    | ~260 000 € (réservé) | Non |

    | 4 | Mandat de contractualisation sous 15 jours : Région, loueur, raccordement électrique | — | —
    |


    Engagement ferme jeudi : **280 000 €**. Trajectoire jusqu''à janvier : ~580 000 €, contre 620 000
    € de subvention sécurisée.


    ## 2. Le fait qui commande tout le plan


    La conversion n''est pas contrainte par les véhicules — ils sont commandés et payés. Elle est contrainte
    par deux plafonds physiques, dont un seul est visible dans le dossier.


    **Plafond n° 1 — l''autonomie en hiver.** Une charge complète représente 6 h × 22 kW ≈ 132 kWh utiles.
    Rapportés aux mesures de mars, cela donne 0,57 kWh/km en conditions tempérées (232 km) et **0,67 kWh/km
    à 2 °C** (197 km). À ce niveau de consommation, toute tournée au-delà de ~190 km est hors d''atteinte
    en hiver sans recharge intermédiaire. C''est exactement ce qu''a observé le responsable transport
    : les 11 recharges non prévues sur 120 tournées sont *toutes* au-dessus de 190 km. Le dossier est
    cohérent avec lui-même. Il ne reste pas d''incertitude technique à lever sur ce point — seulement
    un comptage à faire.


    Deux réserves à porter au conseil : l''essai de mars à 2 °C n''est pas un essai de janvier, et 197
    km est donc vraisemblablement une valeur optimiste ; et la tournée la plus longue fait 240 km, soit
    22 % au-delà du plafond hivernal.


    **Plafond n° 2 — la charge, qui n''est pas au budget.** 14 bornes, fenêtre de nuit prudente de 12
    h (18 h–6 h), soit 168 heures-borne. Une tournée moyenne en hiver demande ~4,6 h de charge. Les 14
    bornes actuelles ne peuvent donc alimenter **que ~28 véhicules électriques par nuit** — et ne présentent
    que 14 points de branchement simultanés.


    | Étape | Points de branchement | Heures-borne/nuit | VE alimentables (hiver) |

    |---|---|---|---|

    | Aujourd''hui | 14 | 168 | **28** |

    | + tranche 1 (8 bornes double sortie) | 44 | 264 | **44** |

    | + tranche 2 (10 bornes double sortie) | 64 | 384 | **64** |

    | Pour 96 VE toute l''année | 96 | ~430 | tranche 3 nécessaire |


    Conséquence à énoncer sans détour : **les 210 000 € devisés ne suffisent pas à faire rouler 60 véhicules,
    et encore moins 96.** Le budget d''infrastructure a été sous-dimensionné par rapport à la commande
    de véhicules. Le plan ci-dessous sécurise la subvention avec deux tranches ; la troisième (400 à 600
    k€, pour atteindre 96 VE) est signalée aujourd''hui et décidée en février sur mesures réelles, pas
    votée jeudi.


    La spécification « double sortie séquencée » est la ligne la plus rentable du plan : elle double le
    nombre de points de branchement sans doubler la puissance appelée, et supprime le besoin d''un poste
    de nuit pour rebrancher les câbles.


    ## 3. L''arithmétique qui fixe la posture


    > Une tournée non terminée coûte **900 €**. Un diesel prolongé coûte **480 € par mois**.


    Conserver un diesel est rentable dès qu''il évite **une tournée manquée tous les deux mois**. Sur
    les tournées de plus de 190 km, l''essai a mesuré un taux d''incident bien supérieur. La question
    n''est pas de savoir s''il faut garder des diesels, mais combien et jusqu''à quand.


    L''asymétrie est renforcée par le délai de 11 semaines : un véhicule rendu à tort ne revient pas avant
    fin janvier — c''est-à-dire après la date de la subvention. Se tromper par prudence coûte 480 €/mois
    et se corrige en 30 jours. Se tromper par confiance coûte 900 € par tournée et ne se corrige pas de
    la saison.


    **Règle de posture retenue : on prolonge par défaut, on rend sur preuve.** Aucun lot n''est rendu
    sans deux indicateurs au vert sur 30 jours glissants.


    ## 4. Calendrier d''exécution


    | Fin de mois | VE livrés | VE en tournée | Diesels conservés | Capacité de charge | Tournées couvertes
    |

    |---|---|---|---|---|---|

    | Septembre | 24 | 24 | 72 | 28 | 96 |

    | Octobre | 48 | 44 | 52 | 44 (tranche 1 au 15/10) | 96 |

    | Novembre | 72 | **64** | 32 | 64 (tranche 2 au 15/11) | 96 |

    | Décembre | 96 | 64 | 32 | 64 | 96 |

    | **31 janvier** | 96 | **64** | 32 | 64 | 96 |

    | Mars | 96 | 76 | 20 | 64 | 96 |

    | Avril + | 96 | selon tranche 3 | ≤ 12 | — | 96 |


    Le seuil de subvention (60 VE) est franchi **le 15 novembre**, avec 11 semaines de marge sur la date
    du 31 janvier et 4 véhicules d''avance.


    Une conséquence à assumer devant le conseil : **en décembre et janvier, une trentaine de véhicules
    électriques livrés et payés resteront à quai.** Ce n''est pas un défaut du plan, c''est le décalage
    entre un calendrier de livraison signé en mai et un calendrier d''infrastructure de 7 semaines qui
    n''a pas été lancé en même temps. Aucun plan ne peut le rattraper aujourd''hui ; celui-ci l''organise
    au lieu de le subir.


    ## 5. Règle d''affectation des tournées


    Plafond kilométrique par véhicule électrique, calculé la veille au soir à partir de la longueur de
    tournée et de la température prévue au départ :


    | Température prévue | Plafond VE | Base |

    |---|---|---|

    | < 5 °C | **175 km** | 197 km mesurés à 2 °C, marge 11 % |

    | 5–15 °C | 195 km | interpolation, à recaler sur relevés d''octobre |

    | > 15 °C | 210 km | 232 km mesurés, marge 10 % |


    Au-delà du plafond : diesel, ou recoupe. Le répartiteur n''a aucune latitude sur cette règle.


    **Alerte en cours de tournée.** La télémétrie 10 minutes existe déjà : à chaque relevé, projeter l''état
    de charge à l''arrivée à partir du kilométrage restant. Sous 10 % projeté, alerte au répartiteur →
    réacheminement ou envoi d''un diesel de renfort. Deux diesels de renfort par plateforme, inclus dans
    la réserve.


    **Chantier recoupe (le plus rentable du plan).** Responsable transport, livrable le 15 septembre :
    réduire le nombre de tournées de plus de 175 km en rééquilibrant avec des tournées courtes. Contrainte
    : aucune modification de créneau contractuel client. Chaque tournée ramenée sous 175 km libère un
    diesel et rapproche la tranche 3.


    ## 6. Le calendrier des préavis — le vrai poste de pilotage


    Le préavis de 30 jours fait que la décision de garder un véhicule se prend un mois avant qu''elle
    produise ses effets. C''est le seul point du plan où l''on peut perdre la main par simple inattention
    de calendrier.


    **Comité flotte le 25 de chaque mois**, sur les 30 derniers jours du tableau de bord. Préavis envoyé
    le jour même.


    | Comité | Décide la reprise de | Préavis à envoyer avant | Volume prévu à prolonger |

    |---|---|---|---|

    | 25 août | fin septembre | 31 août | 0 (reprise nominale de 24) |

    | 25 septembre | fin octobre | 30 septembre | 4 |

    | 25 octobre | fin novembre | 31 octobre | 8 |

    | **25 novembre** | **fin décembre** | **30 novembre** | **32** |

    | 25 décembre → avril | mois suivant | J-30 | 32 → 20 → 12 → 0 |


    Le préavis du 30 novembre est le point critique : 32 véhicules d''un coup, sur une prolongation courant
    jusqu''en avril. Le loueur a donné son accord de principe au mois le mois ; **cet accord doit être
    transformé en avenant écrit couvrant ce volume et cette durée avant le 31 août.** S''il refuse, le
    plan change de nature et le conseil doit être ressaisi en septembre.


    Coût de la réserve au-delà du calendrier de reprise initial : ~140 véhicules-mois × 480 € ≈ **67 000
    €**.


    ## 7. Pilotage — sur les outils existants, sans développement


    Le tableau de bord publie déjà chaque soir, par plateforme, le taux de tournées terminées et le nombre
    de recharges non prévues. Trois lignes à y ajouter, toutes dérivables de la télémétrie actuelle :


    | Indicateur (7 jours glissants, par plateforme) | Seuil |

    |---|---|

    | Tournées VE terminées | ≥ 98,5 % |

    | Recharges non prévues / tournées VE | ≤ 2 % |

    | VE partis avec état de charge < 90 % | ≤ 2 par semaine |

    | État de charge minimal à l''arrivée | ≥ 15 % |


    **Échelle d''escalade :**

    - **1 seuil franchi 7 jours** → plafond kilométrique VE abaissé de 15 km sur la plateforme concernée
    + **gel du prochain lot de reprise**.

    - **2 seuils, ou taux de complétion < 97 %** → 6 tournées repassées au diesel, mises en recoupe, note
    au conseil sous 48 h.

    - **Projection de VE roulants au 15 janvier < 60** → saisine écrite de la Région avant le 31 décembre,
    et location temporaire de charge rapide en parallèle.

    - **Étude de raccordement défavorable** (voir §9) → les tranches de bornes sont caduques : bascule
    sur une flotte mixte 60/36 durable et renégociation avec la Région. Rapport au conseil sous 5 jours.


    Le gel d''un lot est toujours disponible parce que la réserve n''est jamais descendue sous son plancher.
    C''est ce qui rend le plan réversible à chaque étape.


    ## 8. Le meilleur argument contre ce plan, et pourquoi il ne l''emporte pas


    *« Vous engagez 280 000 € pour couvrir un risque mesuré sur 6 véhicules pendant 3 semaines. Le constructeur
    annonce 260 km. Rendez les diesels selon le calendrier, gardez trois véhicules de secours, et achetez
    de la charge rapide si le problème se matérialise. »*


    L''argument tient sur la faiblesse de l''échantillon — c''est vrai, 6 véhicules sur 3 semaines ne
    sont pas une preuve solide. Il tombe sur trois points :


    1. **Les trois mesures dévient dans le même sens.** 232 < 260 annoncés ; 197 à 2 °C ; 11 recharges
    non prévues concentrées à 100 % sur les tournées longues. Trois signaux concordants ne s''annulent
    pas parce que l''échantillon est petit.

    2. **Le remède proposé n''est pas disponible à temps.** « Acheter de la charge rapide si le problème
    se matérialise » suppose 7 semaines de travaux au minimum, et le problème se matérialisera en décembre.
    La correction arriverait après le 31 janvier.

    3. **Le plafond de charge est indépendant de l''autonomie.** Même si les véhicules tenaient 260 km,
    14 bornes n''en alimentent que 28. Ce plan serait nécessaire pour cette seule raison.


    Ce qui reste juste dans l''objection est intégré : la réserve est plafonnée, décidée mois par mois,
    et son volume est indexé sur des mesures réelles — pas figé aujourd''hui.


    ## 9. Ce qui reste à obtenir avant jeudi


    Quatre éléments manquent, et trois d''entre eux peuvent invalider une partie du plan.


    1. **Puissance souscrite disponible sur les deux plateformes.** 64 points à 22 kW appellent ~660 kW
    en pointe, ~500 kW en moyenne sur la fenêtre de nuit, à répartir sur deux sites. Si un renforcement
    de raccordement est nécessaire, son délai (souvent > 6 mois) est supérieur à tout le calendrier. **Le
    devis de 210 000 € couvre-t-il le raccordement ?** C''est la question la plus lourde du dossier et
    personne ne l''a encore posée. Étude lancée lundi 10 août.

    2. **Histogramme des 96 tournées sur 90 jours**, par plateforme. La donnée existe dans le superviseur
    de flotte. Elle fixe le volume exact de la réserve diesel. Demandée lundi 10 août, disponible mercredi.

    3. **Confirmation écrite de la Région** sur la définition de « rouler » : 60 véhicules immatriculés
    et affectés, ou 60 véhicules effectivement en tournée à une date de contrôle ? Et quelle preuve est
    attendue — nos exports de tableau de bord suffisent-ils ? 620 000 € dépendent de la lecture d''un
    mot.

    4. **Avenant loueur** couvrant 32 véhicules prolongés jusqu''au 30 avril, au tarif annoncé.


    **Ce qui ferait revoir le plan à la baisse :** si l''histogramme montre moins de 10 tournées par jour
    au-dessus de 175 km, *et* si le protocole de réception de septembre (6 premiers véhicules, méthodologie
    de mars) reproduit ≥ 232 km et ≥ 210 km à 2 °C sur des véhicules de série, la réserve tombe à 12 véhicules
    et les reprises sont avancées d''un mois — environ 30 000 € économisés. Ces deux observations sont
    datées et vérifiables ; le comité flotte du 25 septembre les tranchera.


    ## 10. Trois arrangements à négocier plutôt qu''à imposer


    - **Clients des tournées longues** (une dizaine, > 200 km) : proposer un élargissement de créneau
    de ±90 minutes en échange d''un engagement tarifaire 2027. Un créneau élargi rend une tournée recoupable
    ; c''est le levier le moins cher du dossier.

    - **Loueur** : viser un forfait cadre jusqu''au 30 avril plutôt qu''une reconduction lot par lot —
    cela supprime le risque de calendrier du §6 et améliore probablement le tarif sur volume.

    - **Région** : proposer un reporting mensuel issu du tableau de bord existant, dès septembre. Une
    administration qui a vu la trajectoire tous les mois refuse difficilement le décompte final, et cela
    transforme la clause du 31 janvier en contrôle continu plutôt qu''en couperet.


    ## 11. Première action


    **Lundi 10 août, 8 h** : demande à l''exploitation de l''histogramme des 96 tournées sur 90 jours,
    et lancement de l''étude de raccordement électrique sur les deux plateformes.


    Sans ces deux éléments, les volumes du §4 restent provisoires et la commande de bornes reste un pari
    sur le raccordement. Avec eux, le vote de jeudi porte sur des chiffres tenus.


    ---


    **Résumé pour le conseil.** La conversion se fait. Elle se fait en flotte mixte pendant un hiver,
    parce que 197 km à 2 °C ne couvrent pas des tournées de 240 km et parce que 14 bornes n''alimentent
    pas 96 véhicules. Le surcoût de cette prudence est de 67 000 € de location diesel ; le coût de son
    absence se compte en centaines de milliers d''euros de tournées manquées, non rattrapables avant 11
    semaines. Le point à porter à la connaissance du conseil au-delà du plan : **le budget d''infrastructure
    de charge a été sous-dimensionné d''environ 600 000 € par rapport à la commande de véhicules votée
    le 4 mai.** Ce plan finance les deux premières tranches sur la subvention et place la troisième en
    décision de février, sur données mesurées.

    '
