response:
  text: '# Note au conseil — Vendredi

    ## Arbitrage Sedamex (A) / Nordwerk (B) — 18 mois


    ---


    ### 1. Recommandation


    **J''engage la ligne Nordwerk (option B).** La décision ne se joue pas sur l''espérance de gain, qui
    est favorable, mais sur le fait que le scénario défavorable est contractuellement borné à un montant
    que la société absorbe sans dommage structurel.


    ---


    ### 2. Ce que valent les deux options


    | | Option A | Option B |

    |---|---|---|

    | Espérance sur 18 mois | **+200 k€** (certain) | **+380 k€** (0,6 × 900 − 0,4 × 400) |

    | Meilleur cas | +200 k€ | +900 k€ |

    | Pire cas | +200 k€ | **−400 k€, plafonné** |


    B apporte 180 k€ d''espérance supplémentaire. Ce n''est pas l''argument décisif, et je ne le présente
    pas comme tel.


    ---


    ### 3. Le test qui décide : la solvabilité dans le pire cas


    Le seul motif légitime de refuser un pari à espérance positive est l''irréversibilité de la perte.
    Vérification, en cumulant le pire cas Nordwerk **et** l''intégralité du dividende voté :


    - **Fonds propres** : 3 400 − 700 (dividende) − 400 (échec) = **2 300 k€**

    - **Covenant** : plancher 1 200 k€ → **marge de 1 100 k€**

    - **Trésorerie** : 2 600 − 700 − 400 = **1 500 k€**, soit plus de 9 mois de masse salariale, dette
    nette nulle


    Le point bas est le douzième mois, quand les deux acomptes de dividende et la pénalité sont tous payés.
    Aux six dates de test trimestriel, les fonds propres ne descendent jamais sous 2 300 k€. **Le covenant
    n''est approché à aucun moment**, quel que soit l''ordre de survenance des événements.


    Autrement dit : le pire cas de Nordwerk consomme la moitié de notre coussin de covenant et nous laisse
    l''autre moitié. Une perte de 400 k€ représente 11,8 % des fonds propres. Ce n''est pas un risque
    existentiel — c''est un exercice.


    **Marge de sécurité résiduelle** : même dans le pire cas B, le plan d''affaires pourrait se dégrader
    de 1 100 k€ supplémentaires avant que le covenant ne soit touché. En option A, ce coussin serait de
    1 700 k€. **La différence de capacité d''encaissement entre les deux options est de 600 k€** — c''est
    le prix réel de B, et je l''assume devant vous.


    ---


    ### 4. Robustesse à l''erreur d''estimation


    Le 60 % vient de notre bureau d''études, partie intéressée. Je ne demande donc pas au conseil d''y
    croire, mais de constater qu''il n''a pas besoin d''y croire :


    - **B reste supérieure à A dès que la probabilité de succès dépasse 46,2 %**

    - **B ne détruit de la valeur qu''en dessous de 30,8 %**


    Le bureau d''études devrait donc se tromper de plus de 14 points pour que la recommandation bascule,
    et de 29 points pour que B devienne destructrice. Onze installations comparables documentées ne garantissent
    pas le 60 %, mais elles rendent une erreur de cette ampleur peu vraisemblable.


    ---


    ### 5. Réponse au directeur financier


    Je partage sa vigilance et je conteste sa prémisse. « On ne joue pas la maison » suppose que la maison
    soit en jeu : elle ne l''est pas. Pas de caution personnelle, pas de défaut croisé, aucune sûreté
    sur l''actif industriel, carnet de commandes non gagé, perte plafonnée à 400 k€ pénalité comprise.
    **Le contrat a été négocié précisément pour que le pire cas ne soit pas un événement de solvabilité.**
    Refuser B, ce n''est pas refuser de jouer la maison, c''est refuser 180 k€ d''espérance pour éviter
    un aléa de 400 k€ que nous portons les yeux ouverts.


    Sur Tremay : un dépôt de bilan n''est pas causé par le choix d''une ligne neuve, il est causé par
    un endettement et une perte non bornée. Nous ne savons pas si Tremay avait une dette nette nulle,
    2,6 M€ de trésorerie et un plafond de perte contractuel — j''affirme que non, sur les trois. Un cas
    saillant ne fait pas une fréquence ; nous en avons onze en face, et une structure de bilan que Tremay
    n''avait pas. Le raisonnement du directeur financier conduirait, appliqué systématiquement, à ne jamais
    rien engager d''industriel — ce qui est une décision, mais qu''il faut alors assumer comme telle.


    ---


    ### 6. Conditions que je pose à la signature


    L''irréversibilité de l''engagement — dix-huit mois sans sortie — justifie quatre garde-fous, à lever
    avant signature :


    1. **Contre-expertise indépendante** de l''estimation 60/40. C''est le seul chiffre qui porte la décision
    ; son audit coûte une fraction de l''enjeu.

    2. **Provision immédiate des 400 k€** : sortis de la trésorerie disponible et pilotés comme dépensés
    dès le premier jour. Le pire cas devient l''hypothèse de travail du plan de trésorerie, pas un scénario
    alternatif.

    3. **Confirmation écrite du banquier** que le covenant porte sur les seuls fonds propres et qu''une
    perte de 400 k€ ne déclenche aucune autre clause.

    4. **Définition contractuelle ex ante du fait générateur de l''échec technique** et de sa date de
    constatation, pour que ni le déclenchement ni le montant de la pénalité ne puissent dériver.


    J''ajoute une réserve à instruire : **savoir si Sedamex resterait accessible dans dix-huit mois, et
    à quelles conditions.** Nous renonçons à une option, pas seulement à 200 k€ ; il faut en connaître
    le prix de rachat.


    **Point d''attention pour le conseil** : cette recommandation suppose qu''aucune opération non portée
    à ma connaissance — cession, refinancement, entrée au capital dans les dix-huit mois — n''impose une
    lisibilité de bilan supérieure à celle du covenant. Si tel était le cas, l''arbitrage bascule vers
    A et je le dirai.


    **Reporting** : point d''avancement mensuel au conseil sur l''installation, avec les jalons techniques
    définis au point 4.


    ---


    Si vous voulez, je peux en faire une page web partageable pour la diffusion aux administrateurs, ou
    ajouter une annexe avec le détail trimestriel des fonds propres sous les deux options.

    '
