response:
  text: 'Décision : **non** au basculement intégral vers Sinolux, **non** au test Vertex, et **oui** à
    une tranche de qualification Sinolux adossée à une réservation Kelmar. Voici la note.


    ---


    # Note au comité de direction — Contrat cellules 2027


    **Objet :** arbitrage fournisseur cellules — 72 000 unités

    **De :** Direction des Opérations · **Date :** lundi · **Décision demandée :** engagement avant J+18


    ---


    ## 1. L''économie de 230 400 € n''existe qu''en dessous de 2,86 % de retours


    L''écart de prix est de 3,20 € par cellule. Une reprise coûte 205 €. Un point de retour supplémentaire
    coûte donc bien plus que l''économie de prix ne rapporte.


    Le basculement complet est neutre à **2,86 % de retours Sinolux** (1,3 % Kelmar + 1,56 point). Au-delà,
    il coûte de l''argent.


    | Hypothèse Sinolux | Coût total 2027 | vs Kelmar |

    |---|---|---|

    | Kelmar, 1,3 % (référence, 4 ans) | 2 063 880 € | — |

    | Sinolux 1,1 % (essais fournisseur) | 1 803 960 € | **+259 920 €** |

    | Sinolux 2,86 % | 2 063 880 € | 0 € |

    | Sinolux 3,1 % (audit de mars) | 2 099 160 € | **−35 280 €** |

    | Sinolux 5 % (queue de distribution) | 2 379 600 € | **−315 720 €** |


    Les 230 400 € inscrits au budget supposent que Sinolux se comporte comme Kelmar. Aucune pièce au dossier
    ne le soutient.


    ## 2. Nous n''avons pas trois sources, nous en avons deux — et elles ne se valent pas


    - **1,1 %** : essais internes du fournisseur, sur banc, non contradictoires.

    - **3,1 %** : audit sectoriel de mars, ligne comparable, même fournisseur — seule mesure externe.

    - **« environ 3 % » (Ferro)** : la note méthodologique indique que Ferro travaille **sur l''échantillon
    de l''audit de mars**. Ce n''est pas une confirmation, c''est la même mesure relue.


    Moyenner les trois chiffres donne 2,4 % — sous le seuil — et c''est une erreur de comptage : cela
    compte deux fois la même donnée et met à parité une mesure indépendante avec la déclaration de la
    partie intéressée. La seule mesure indépendante disponible place Sinolux **au-dessus du seuil de bascule**.


    ## 3. La clause de remplacement gratuit ne couvre pas le risque


    Sinolux refuse l''indexation sur le taux de retour et offre la cellule gratuite. La cellule vaut 22,80
    € ; la reprise en coûte 205. La clause couvre **11 % de l''exposition** et nous laisse les 89 % restants
    : logistique, geste commercial, atelier.


    Si l''on porte cette clause au crédit de Sinolux, le seuil de bascule passe de 2,86 % à 3,22 % — et
    l''hypothèse de l''audit (3,1 %) devient un gain marginal de 15 600 €. Le sort du dossier se joue
    alors sur un point de rédaction contractuelle, pas sur une conviction industrielle. C''est le signe
    que la décision n''est pas mûre pour un engagement total.


    **Le refus d''indexation est en soi une information** : Sinolux ne veut pas porter le risque du chiffre
    qu''il annonce.


    ## 4. Le test Vertex arrive trop tard et mesure trop grossièrement — nous ne l''achetons pas


    Résultat sous neuf semaines, soit **J+63**. Kelmar ferme à J+18, le prix Sinolux expire à J+21. Le
    résultat tomberait 42 jours après que la décision soit devenue irréversible : 34 000 € pour une information
    inutilisable.


    Même à temps, sa précision de ±0,3 point encadre le seuil de 2,86 % : à 3,1 % mesuré, l''intervalle
    [2,8 – 3,4] ne tranche pas. Et un vieillissement accéléré ne mesure pas un taux de retour terrain,
    qui intègre d''autres causes que la fatigue cellule.


    ## 5. Décision


    **a) Réserver la capacité Kelmar à J+18 pour 57 600 unités (80 %).** C''est la seule action irréversible
    du calendrier ; nous la prenons du côté sûr.


    **b) Attribuer à Sinolux une tranche de qualification de 14 400 unités (20 %), signée avant J+21,
    au prix de 22,80 €.**


    Cette tranche est notre instrument de mesure. 14 400 unités en service réel donnent le taux de retour
    à **±0,14 point** — deux fois mieux que Vertex, sur la bonne grandeur, pour un coût net compris entre
    **−7 100 € et +52 000 €** au lieu de 34 000 € fermes. Elle sécurise 80 % du volume chez un fournisseur
    dont nous connaissons le comportement depuis quatre ans, et elle ouvre 2028 sur une donnée, pas sur
    une brochure.


    **c) Contrepartie demandée à Sinolux, en échange d''une rampe contractuelle vers 60 % en 2028 :**
    participation forfaitaire de 150 € par reprise, plafonnée à 200 000 €. C''est l''alternative à l''indexation
    qu''ils refusent. S''ils l''acceptent, la branche de perte se referme et nous rouvrirons le volume
    2027 à la hausse avant J+21. S''ils la refusent, nous saurons ce que vaut leur 1,1 %.


    **d) Corriger la ligne budgétaire :** l''économie sécurisée est de **46 080 €**, non de 230 400 €.
    Provisionner 55 000 € au titre du surcoût de reprise de la tranche.


    ## 6. Pourquoi pas le basculement complet


    L''espérance de gain du basculement à 100 % reste légèrement positive, mais elle est inférieure à
    2 % de la valeur du contrat, c''est-à-dire noyée dans l''incertitude des estimations. Surtout, sa
    branche défavorable est sans issue : passé J+18, la ligne 2027 de Kelmar est vendue, aucune clause
    ne nous protège, et nous découvrons le taux réel en pleine production avec 72 000 chargeurs déjà engagés.
    Une espérance positive ne rachète pas une position dont on ne peut pas sortir.


    ## 7. Le meilleur argument contre cette décision


    Que Kelmar refuse 80 % ou reprenne le prix à la hausse : l''économie de 46 080 € disparaîtrait, et
    la double source ajoute des coûts de qualification et de traçabilité (estimés sous 20 000 €). **C''est
    le point à vérifier en premier.** Si Kelmar reprice au-dessus de 26,45 €, l''arbitrage change et nous
    revenons devant le comité avant J+15.


    Second argument : si Sinolux est réellement à 1,1 %, nous renonçons à environ 214 000 € pour un an.
    C''est le prix assumé d''une position dont on peut sortir.


    ## 8. Repli et déclencheur


    - Taux de retour cumulé de la tranche Sinolux **> 2,9 % à 4 000 unités livrées** → arrêt de toute
    allocation Sinolux 2028, bascule du solde vers Kelmar.

    - **> 4,5 %** → confinement du lot, activation de la clause de remplacement à l''échelle, revue produit
    immédiate.

    - Négocier dès maintenant une option Kelmar 2028 pour rendre ce repli exécutable.


    ## 9. Ce qui renverserait cette décision


    Une mesure indépendante et authentifiée du taux de retour terrain **sur la ligne Sinolux qui nous
    est destinée**, inférieure à 2,5 %, obtenue avant J+18 — ou l''acceptation par Sinolux de la participation
    au coût de reprise (point 5c). L''un ou l''autre justifierait de porter le volume à 100 %.


    ## 10. Actions


    | Échéance | Action | Responsable |

    |---|---|---|

    | J+3 | Demander à Kelmar le prix ferme sur 57 600 unités et une option 2028 | Achats |

    | J+3 | Transmettre à Sinolux la contre-proposition 150 €/reprise plafonnée | Achats |

    | J+8 | Obtenir de l''audit de mars le détail par cause de retour | Ingénierie |

    | J+10 | Arbitrage interne sur réponses Kelmar / Sinolux | Direction |

    | **J+18** | **Réservation Kelmar ferme — irréversible** | Direction |

    | J+21 | Signature tranche Sinolux | Achats |

    | J+70 | Démarrage production, plan de suivi retours par fournisseur armé | Opérations |


    Le lancement n''est pas reporté.


    ---


    Trois points sur lesquels la note repose sur une hypothèse plutôt que sur une pièce, et que je ferais
    confirmer :


    - **Le périmètre des 205 €.** J''ai retenu la lecture stricte (la cellule de remplacement est incluse
    dans les 205 €). Si le remplacement gratuit vient réellement en déduction, le seuil monte à 3,22 %
    et le basculement complet devient marginalement défendable. C''est la seule ambiguïté qui pourrait
    changer le sens de la recommandation — d''où le point 5c, qui la neutralise en négociant sur le vrai
    coût.

    - **Le prix Kelmar sur 80 %.** Les 26,00 € sont donnés pour le volume plein ; rien ne dit qu''ils
    tiennent sur une tranche réduite. Vérification J+3.

    - **L''imputation des retours.** Les 1,3 % Kelmar sont des retours chargeur, pas des défaillances
    cellule. Attribuer tout l''écart à la cellule est prudent mais probablement pessimiste pour Sinolux.


    Je peux publier la note en page partageable pour le comité si vous voulez un lien plutôt qu''un copier-coller.

    '
