response:
  text: '## Note au conseil — arbitrage Sedamex / Nordwerk


    **De :** la direction générale · **Pour :** conseil de vendredi · **Objet :** choix entre les deux
    options exclusives sur 18 mois


    ---


    ### 1. Recommandation


    **Signer Nordwerk (option B)**, sous une condition suspensive unique décrite au § 4 : la vérification
    contradictoire des onze références du bureau d''études avant apposition de la signature.


    ### 2. Ce sur quoi je fonde ce choix


    L''écart d''espérance est net : Nordwerk vaut **380 k€** (0,6 × 900 − 0,4 × 400) contre **200 k€**
    garantis pour Sedamex, soit **+180 k€**. Mais une espérance ne décide rien tant qu''on n''a pas vérifié
    qu''aucune branche ne nous détruit. C''est ce test qui tranche, et il ne condamne pas B :


    | Fin de période, après dividende de 700 k€ | Fonds propres | Trésorerie |

    |---|---|---|

    | Sedamex (certain) | 2 900 k€ | 2 100 k€ |

    | Nordwerk — succès (60 %) | 3 600 k€ | 2 800 k€ |

    | **Nordwerk — échec (40 %)** | **2 300 k€** | **1 500 k€** |

    | *Covenant bancaire* | *1 200 k€* | — |


    Dans le pire scénario de Nordwerk, dividende intégralement versé et perte plafond constatée, les fonds
    propres restent **1 100 k€ au-dessus du covenant** — près du double du seuil — et la trésorerie couvre
    **neuf mois de masse salariale**. Le covenant n''est menacé dans aucun des trois scénarios, à aucune
    clôture trimestrielle.


    L''exposition maximale représente **15 % des fonds propres post-dividende**. C''est une mauvaise année,
    pas une fin d''entreprise.


    ### 3. Réponse au directeur financier


    Son principe est juste : on ne joue pas la maison sur un tirage à 40 %. Ma réponse est que **la maison
    n''est pas dans le tirage**, et ce n''est pas une opinion, c''est ce que dit le contrat. Cinq mécanismes
    transforment une perte en faillite ; les cinq sont écartés par écrit :


    - perte **plafonnée à 400 k€**, pénalité de résiliation comprise ;

    - **aucune caution personnelle** du dirigeant ;

    - **aucune clause de défaut croisé** — la banque ne peut pas se joindre au sinistre ;

    - **aucune sûreté sur l''actif industriel** ;

    - **carnet de commandes non gagé**.


    Ce qui a tué Tremay n''est pas d''avoir installé une ligne neuve : c''est ce qui, chez eux, a converti
    une perte industrielle en défaut de paiement. Nous ne connaissons aucun de ces éléments — plafond,
    endettement, cautions, covenants. Un cas unique, sélectionné après coup sur son issue, ne nous dit
    pas ce que nous devons savoir. Il faudrait la structure de leur engagement pour que la comparaison
    instruise quoi que ce soit ; à défaut, elle nous alarme sans nous informer.


    Une réserve du directeur financier reste néanmoins fondée, et c''est celle-ci qui doit nous occuper.


    ### 4. Le vrai risque : le 60 %, pas le 400 k€


    Nordwerk ne bat Sedamex que si la probabilité de succès dépasse **46 %**. Notre marge d''erreur sur
    l''estimation du bureau d''études est donc de **14 points**. Si la probabilité réelle était de 40
    %, Nordwerk vaudrait 120 k€ et Sedamex l''emporterait. Or ce chiffre est produit en interne, par ceux
    qui portent le projet, et « comparables » est un jugement qu''ils ont rendu sur leurs propres références.


    Un contradictoire indépendant sur les onze installations coûte quelques milliers d''euros et deux
    à trois semaines. Face à un engagement ferme et irréversible de dix-huit mois, cette dépense n''est
    pas une précaution : c''est le meilleur investissement du dossier. **Je demande au conseil d''autoriser
    Nordwerk, et de subordonner la signature à cette vérification.**


    ### 5. Repli, déclencheur, et ce qui renverserait la décision


    Le contrat n''a pas de sortie anticipée : le repli ne consiste pas à en sortir, mais à ne pas aggraver.
    **Déclencheur observable :** jalon de qualification technique non atteint au sixième mois. Alors,
    sans nouvelle délibération : provision intégrale des 400 k€, gel de tout investissement discrétionnaire,
    aucun apport complémentaire sur la ligne. Nous ne doublerons pas la mise.


    **Ce qui renverse la recommandation vers Sedamex :** une probabilité auditée sous 50 % ; ou la découverte
    d''une clause perçant le plafond de 400 k€ ; ou un engagement bancaire additionnel non porté à notre
    connaissance.


    ### 6. Décisions demandées vendredi


    1. Autoriser Nordwerk, signature suspendue au contradictoire externe.

    2. Mandater ce contradictoire — **première action, dès lundi**.

    3. Confier au directeur financier, dont l''objection a désigné le bon point faible du dossier : la
    validation du contradictoire avant signature, avec **pouvoir de blocage** si la probabilité auditée
    passe sous 50 % ; le déclenchement du repli au sixième mois ; et la présentation trimestrielle du
    covenant au conseil.

    '
