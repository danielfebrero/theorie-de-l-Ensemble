response:
  text: '# Note au conseil d''administration — séance de jeudi


    **Objet : options d''allocation de la réserve. Recommandation du directeur.**


    ---


    ## 1. La note du trésorier répond à la mauvaise question


    Le débat est posé comme un arbitrage rendement/risque sur neuf ans. Ce n''est pas notre problème.
    Nous avons deux seuils, pas un, et c''est le second qui est déjà presque atteint.


    **Seuil statutaire — 11 M€.** Liquidation de plein droit.


    **Seuil de transfert — 3 × prestations annuelles.** L''Union mutualiste de l''Atlantique n''a jamais
    repris un portefeuille en dessous. Aujourd''hui : 16,2 M€. Nous sommes à 18,4 M€ — soit 2,2 M€ de
    marge. Et ce seuil **monte de 4,3 % par an** avec nos prestations, pendant que la réserve baisse d''environ
    1 M€ par an. Les deux courbes se croisent dans douze à quatorze mois.


    | Fin d''année | Réserve (option A) | Seuil UMA (3 × prestations) | Marge |

    |---|---|---|---|

    | Aujourd''hui | 18,4 | 16,2 | **+2,2** |

    | 1 | 17,5 | 16,9 | **+0,6** |

    | 2 | 16,3 | 17,6 | **−1,3** |

    | 3 | 14,9 | 18,4 | −3,5 |


    Le comité d''engagement de l''UMA instruit en douze à dix-huit mois. **Le dossier doit donc être déposé
    maintenant, cette semaine.** Chaque mois de délibération supplémentaire consomme une fraction irrécupérable
    de la seule sortie qui protège la couverture de 4 200 affiliés dont l''âge moyen est de 61 ans et
    qui ne trouveront pas de contrat de remplacement sur le marché — 2025 l''a démontré, aucun assureur
    n''a coté.


    C''est cela, l''échéance réelle. Pas neuf ans. Environ un an.


    ## 2. Deux vérifications à faire avant le vote


    **a) La projection à neuf ans ne se reconstitue pas.** En reprenant les hypothèses de la note elle-même
    — cotisations à 4,4 M€, prestations à 5,4 M€ progressant de 4,3 %, rendement 1,8 % — le seuil de 11
    M€ est franchi **entre la cinquième et la sixième année**, pas la neuvième. L''écart s''explique probablement
    par une indexation implicite des cotisations que l''assemblée générale a précisément refusée en 2024.
    Je demande au trésorier de produire ses hypothèses ligne à ligne avant jeudi. Si ma lecture est juste,
    tout le calendrier du conseil est décalé de trois ans dans le mauvais sens.


    **b) Le test des 3 ans est-il apprécié au dépôt ou à la signature ?** Question à poser à l''UMA par
    écrit sous 48 heures, avec celle de savoir si un engagement de relèvement des cotisations voté en
    AG entre dans leur appréciation. La réponse change la nature de ce que nous pouvons encore négocier.


    ## 3. Ce que je fais des trois options


    ### Option C — écartée. Je ne la soumets pas au vote comme option d''investissement.


    Trois motifs, dont le premier est indépendant de toute discussion sur le risque de défaut :


    **Elle nous met en défaut de paiement des prestations en troisième année, dans 100 % des scénarios.**
    Après souscription, il reste 4,0 M€ liquides. Notre besoin de trésorerie net est de 1,2 M€ la première
    année, 1,5 M€ la deuxième, 1,7 M€ la troisième. Le disponible est épuisé au cours de la troisième
    année d''un blocage qui en compte sept. Nous ne pourrons plus rembourser nos affiliés. Que la note
    performe à +14 % ou non est sans objet : nous serons insolvables opérationnellement bien avant l''échéance.
    *Sauf si* la note distribue ses coupons en numéraire annuellement — ce que « bloquée 7 ans, sans sortie
    anticipée » ne laisse pas présumer. À vérifier sur le term sheet, mais même en distribution, la branche
    à +2 % (9 % des cas) rapporte 0,29 M€/an et nous laisse à sec en année 3-4.


    **Elle referme définitivement la porte de l''UMA.** 14,4 M€ immobilisés sept ans dans un actif non
    coté : la réserve mobilisable tombe à 4,0 M€ et aucun repreneur n''instruira le dossier.


    **Le « bruit statistique » à 3 %, c''est la liquidation.** Réserve résiduelle 4,7 M€, très en dessous
    de 11 M€ : dissolution de plein droit et 4 200 personnes à forte exposition amiante sans couverture
    santé. Une probabilité de 3 % appliquée à un événement absorbant ne se compare pas à une espérance
    de rendement — c''est précisément l''erreur du calcul. Un fonds adossé à un seuil de ruine ne maximise
    pas son espérance, il maximise sa probabilité de survie. Le « C domine B dans 94 % des trajectoires
    » est une reformulation de « 94 %, c''est 88 + 6 » : cela ne dit rien du sort des 6 % restants, qui
    est terminal.


    J''ajoute quatre points de fait :

    - Le A− est la notation de **l''émetteur**, pas de la note structurée, dont le profil de perte peut
    être bien plus risqué que sa dette senior.

    - Une récupération annoncée à **5 % du nominal** est très inférieure aux recouvrements seniors habituels
    (~40 %). Ce chiffre signale un instrument subordonné ou à effet de levier. Il mérite une explication
    écrite.

    - Les 3 % viennent de l''émetteur lui-même, pas d''une agence.

    - « Deux caisses comparables ont souscrit l''an dernier » n''est pas un antécédent : douze mois ne
    valident pas une note à sept ans, et si l''émetteur fait défaut, nous ferons défaut ensemble.


    Enfin, 78 % de la réserve sur une contrepartie unique non cotée sans garantie des dépôts contrevient
    très probablement à nos règles de dispersion statutaires et prudentielles. Avis du commissaire aux
    comptes et du conseil juridique à obtenir avant tout vote — la responsabilité personnelle des administrateurs
    est engagée sur ce point.


    ### Option B — reportée dans son dimensionnement actuel.


    Le trésorier a raison sur un point : B ne referme pas l''écart. Mais le vrai défaut de B est ailleurs.
    Son pire décile — −35 % sur la tranche — ramène la réserve à 15,8 M€, soit **immédiatement sous le
    seuil de transfert de 16,2 M€**, sans jamais approcher les 11 M€. B est évaluée contre le mauvais
    plancher. Elle ne risque pas la liquidation ; elle risque de nous priver du repreneur.


    Tant que le dossier UMA est en instruction, notre marge de 2,2 M€ ne supporte aucune volatilité. Je
    ne propose donc **aucune diversification actions/crédit avant la réponse de l''UMA**. Si elle est
    négative, nous rouvrons le dossier avec une tranche calibrée par un test de pire décile contre le
    seuil de transfert, pas contre le seuil statutaire.


    ### Option A — retenue à titre conservatoire, sous un autre nom.


    A n''est pas « mourir à petit feu ». C''est le véhicule qui maintient la réserve mobilisable et liquide
    pendant les douze à dix-huit mois d''instruction du transfert. C''est une position d''attente assumée,
    pas une stratégie de rendement. Elle ne résout rien seule — et elle n''a pas à le faire, parce que
    ce n''est pas l''allocation d''actifs qui résout notre problème.


    ## 4. Le vrai problème, qu''aucune des trois options n''adresse


    Nous encaissons 4,4 M€ et versons 5,4 M€. Le déficit est de **23 % des cotisations**, et il se creuse.
    Aucun rendement financier ne comble un déficit technique de cet ordre sur une population de 4 200
    affiliés en décroissance. C prétend le faire — 14 % sur 78 % de la réserve produirait environ 2,0
    M€/an — et c''est exactement ce qui la rend séduisante : elle est la seule option qui semble équilibrer
    les comptes. Elle le fait en misant la couverture santé des affiliés sur une contrepartie unique.


    Les leviers réels sont au passif :

    - **Cotisations.** Il faut environ +23 % pour l''équilibre. Ce n''est pas votable en une fois. Mais
    les 6 % ont été rejetés en 2024 devant une assemblée à qui on n''avait pas présenté l''alternative.
    Une trajectoire pluriannuelle, présentée avec l''arithmétique de la liquidation et le calendrier UMA,
    ne se vote pas dans les mêmes conditions.

    - **Recours amiante.** À instruire sans délai : la part de nos prestations imputable à des pathologies
    professionnelles reconnues et récupérable auprès du FIVA ou de la branche AT-MP. Sur cette population,
    ce n''est pas marginal. C''est un chantier à ouvrir cette semaine, avec chiffrage pour l''AG.

    - **Paramètres de garantie.** À examiner, en sachant que toute réduction sur une cohorte amiante pose
    un problème d''équité et de risque contentieux qu''il faudra traiter de front.


    ## 5. Ce sur quoi j''engage la caisse


    1. **Dépôt du dossier de transfert à l''UMA sous quinze jours**, avec demande écrite préalable sur
    les modalités d''appréciation du test des trois ans.

    2. **Politique de plancher : 3 × prestations glissantes** comme contrainte opérationnelle contraignante,
    suivie mensuellement en conseil. Le seuil de 11 M€ cesse d''être notre référence de pilotage.

    3. **Aucune décision d''investissement susceptible, dans un scénario modélisé quelconque, de faire
    passer la réserve sous ce plancher** tant que le transfert est en instruction.

    4. **Convocation d''une AG extraordinaire** dans les trois mois, sur trajectoire de cotisations pluriannuelle,
    avec la projection auditée et le calendrier de transfert.

    5. **Ouverture du chantier recours amiante**, chiffrage sous soixante jours.

    6. **Si l''UMA décline** : je reviens devant vous avec un plan de run-off ordonné ou de transfert
    fractionné vers plusieurs porteurs — pas avec une allocation de rattrapage.


    Sur C, ma position est personnelle et je la formule clairement : je ne la signerai pas. Si le conseil
    l''adopte, je demande l''inscription de mon opposition au procès-verbal et j''en informe le commissaire
    aux comptes. Ce n''est pas un désaccord d''appétence au risque. Un administrateur ne peut pas engager
    78 % des réserves d''un régime de santé sur une contrepartie unique non cotée, en immobilisant la
    trésorerie nécessaire au paiement des prestations, sans que sa responsabilité soit recherchée.


    ---


    Le président et quatre administrateurs ont cosigné la note du trésorier. Elle repose sur deux erreurs
    vérifiables avant jeudi — la projection à neuf ans, et le seuil contre lequel le risque est mesuré.
    Je propose que le vote soit précédé de la reconstitution ligne à ligne du modèle et de la réponse
    écrite de l''UMA. Si l''un ou l''autre me donne tort, je le dirai en séance.


    ---


    Je peux te préparer le modèle de projection détaillé (feuille de calcul, sensibilités sur croissance
    des prestations et rendement), le courrier à l''UMA, ou publier cette note en page web partageable
    pour les administrateurs. Dis-moi ce qui t''est utile d''ici jeudi.

    '
