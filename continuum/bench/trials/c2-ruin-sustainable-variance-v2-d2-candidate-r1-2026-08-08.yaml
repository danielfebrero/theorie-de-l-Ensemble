response:
  text: 'Voici la note. Je recommande B — l''arithmétique et la structure de l''exposition vont dans ce
    sens — mais le vrai point faible du dossier n''est pas celui que soulève votre DAF, et je le traite
    comme condition de signature.


    ---


    # NOTE AU CONSEIL — séance de vendredi

    **Objet : arbitrage Sedamex / Nordwerk sur 18 mois**


    **Recommandation : option B, installation de la ligne Nordwerk**, sous une condition suspensive vérifiable
    avant signature (§ 5). Si cette condition n''est pas levée, l''option A s''applique de plein droit,
    sans nouvelle délibération. Le conseil repart donc vendredi avec une décision acquise dans les deux
    cas.


    ## 1. L''écart d''espérance

    B : 0,6 × 900 − 0,4 × 400 = **+380 k€**. A : **+200 k€**. Avantage B : 180 k€.


    Le chiffre qui compte davantage est le seuil de bascule : B reste supérieure à A tant que la probabilité
    de succès dépasse **46,2 %** (900p − 400(1−p) = 200). L''estimation du bureau d''études est de 60
    %. Nous avons 13,8 points de marge sur l''hypothèse centrale — ni un pari serré, ni un confort large.
    J''y reviens au § 4.


    ## 2. Ce que nous risquons réellement

    Perte maximale contractuelle : 400 k€, plafond total, pénalité de résiliation comprise. Pas de caution
    du dirigeant, pas de défaut croisé, aucune sûreté sur l''outil industriel, carnet de commandes libre.


    Branche défavorable, dividende de 700 k€ intégré :

    - fonds propres en fin de période : 3,4 − 0,7 − 0,4 = **2,3 M€**, contre un covenant à 1,2 M€ → **1,1
    M€ de marge** ;

    - trésorerie : 2,6 − 0,7 − 0,4 = **1,5 M€**, soit **neuf mois de masse salariale**, le plan étant
    par ailleurs à l''équilibre ;

    - le point le plus tendu est le douzième mois, où la pénalité peut tomber juste après le second acompte
    de dividende. Il reste tenable.


    Les 400 k€ représentent 11,8 % des fonds propres et 15,4 % de la trésorerie. En option A, la marge
    de covenant serait de 1,7 M€ : **B nous coûte 600 k€ de coussin réglementaire, dans la seule branche
    défavorable.** Le covenant ne saute que si le plan se dégrade de 1,1 M€ au-delà de ce scénario — un
    risque d''exploitation, pas un risque Nordwerk, et présent tout autant en option A.


    ## 3. Réponse au directeur financier

    Son avertissement porte sur le bon sujet, l''irréversibilité, mais pas sur la bonne grandeur. Nous
    ne jouons pas la maison : nous engageons 400 k€ plafonnés, sans caution, sans sûreté, avec neuf mois
    de salaires devant nous dans le pire cas. La maison serait engagée s''il y avait caution personnelle,
    nantissement de l''outil, perte non plafonnée ou franchissement du covenant. Aucun de ces quatre éléments
    n''est présent.


    Sur Tremay : je n''ai pas son dossier, et l''analogie ne vaut que si sa structure d''exposition ressemblait
    à la nôtre. Une défaillance après un investissement en ligne neuve suppose ordinairement une perte
    non bornée, un endettement préalable ou un actif gagé — nous avons zéro dette nette et 2,6 M€ de trésorerie.
    **Si le directeur financier établit que Tremay a déposé le bilan avec une perte plafonnée à ~12 %
    de ses fonds propres et sans sûreté donnée, mon modèle d''exposition est faux et je retire ma recommandation.**
    Je lui demande de produire cette pièce avant vendredi s''il la détient.


    ## 4. Le vrai point faible — qui n''est pas celui du DAF

    Le 60 % repose sur onze installations. Onze observations ne suffisent pas à établir avec confiance
    que la probabilité réelle dépasse notre seuil de 46,2 % : l''intervalle d''incertitude descend nettement
    en dessous. Et si ces onze cas proviennent de la liste de références du fournisseur, ils sont biaisés
    par construction. **C''est là que se joue la décision, pas sur le mot « 40 % ».**


    Ce doute est levable à peu de frais : parmi les onze, environ quatre ont échoué. Il faut savoir pourquoi,
    et si la cause nous concerne — site, alimentation, matière entrante, qualification des opérateurs,
    intégration à la ligne existante.


    ## 5. Condition suspensive et mandat au directeur financier

    Avant signature, le directeur financier conduit l''audit des quatre échecs documentés et de la provenance
    des onze cas, et **en signe la conclusion**. S''il juge un mode de défaillance transférable à notre
    site, ou si les références émanent du seul fournisseur, l''option A s''applique sans nouvelle réunion.
    Ce n''est pas une consultation : il tient la décision sur ce point.


    Il reçoit en outre :

    - **400 k€ cantonnés dès la signature**, non affectables, couvrant la pénalité par avance ;

    - **l''autorité de constater l''échec et de payer immédiatement**, sans attendre le douzième mois,
    dès qu''un jalon de mise en cadence est manqué — pour que nous ne financions pas un échec qui s''étire
    ;

    - **un seuil d''alerte à 1,8 M€ de fonds propres**, 600 k€ au-dessus du covenant, qui convoque le
    conseil de plein droit.


    ## 6. Ce qui renverserait la décision

    Quatre observations, toutes vérifiables avant signature : un coût hors plafond (démontage, remise
    en état, engagements fournisseurs, BFR additionnel, pénalités envers nos propres clients) ; une concentration
    des quatre échecs sur une caractéristique que nous partageons ; des références issues du seul fournisseur
    ; ou la perte définitive du compte Sedamex au-delà des dix-huit mois, que l''arbitrage cadré sur cette
    durée ne capture pas.


    ## 7. Première action

    Lundi, lettre au bureau d''études : provenance des onze installations et compte rendu de chaque échec,
    sous cinq jours. Le dividende n''entre pas dans l''arbitrage — voté en AG, exigible, hors de portée
    de la direction.


    ---


    Deux points sur lesquels j''ai tranché faute d''information, et que vous voudrez peut-être corriger
    :


    - **La valeur terminale de Sedamex.** L''énoncé cadre la comparaison sur dix-huit mois, donc je l''ai
    traitée ainsi. Si ne pas reconduire fait perdre le client durablement, les 200 k€ sous-estiment l''option
    A et le seuil de 46,2 % remonte. C''est en § 6.

    - **Le point faible réel.** J''ai délibérément déplacé le débat du « 40 % d''échec » vers la solidité
    du 60 %. Le DAF a raison de résister, mais son argument tel qu''il le formule est réfutable en trois
    lignes ; l''argument statistique, lui, tient. Lui confier l''audit qui le tranche, avec un droit de
    blocage effectif, vaut mieux que de gagner contre lui en séance.

    '
