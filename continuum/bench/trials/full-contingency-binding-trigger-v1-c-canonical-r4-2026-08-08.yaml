response:
  text: 'Verdict : **Option B**, mais pas la version du dossier — B avec gel des paliers pendant le pic.
    Ce qui décide n''est pas l''écart d''économie, c''est qu''après clôture du compte Solda, l''erreur
    n''est plus rattrapable avant six semaines et 2,1 M d''empreintes à recollecter. Voici la note.


    ---


    ## NOTE AU COMITÉ DE DIRECTION


    **Objet :** renouvellement du prestataire de paiement — arbitrage Solda / Payflux

    **De :** Direction des opérations · **Pour :** décision


    ### Recommandation


    **Option B, avec gel des paliers pendant le pic de fin d''année.** Démarrage le 3 novembre, plafond
    à 25 % du trafic du 20 novembre au 5 janvier, achèvement fin janvier. **Clôture du compte Solda mi-février,
    pas avant.**


    ### Ce que ça coûte


    | Année 1 | A — bascule intégrale 3 nov. | B+ — progressive, gel au pic |

    |---|---|---|

    | Économie contractuelle | 500 k€ | ~250 k€ |

    | Paiements perdus pendant la montée en charge | −143 k€ | −29 k€ |

    | **Net** | **~357 k€** | **~221 k€** |


    L''écart réel est de **136 k€, pas de 190 k€**. Le pilote Payflux mesure 1,3 % d''échec pendant trois
    semaines contre 0,4 % chez Solda. À 18 000 transactions et 756 000 € par jour, ces trois semaines
    coûtent 143 k€ de commandes échouées si l''on bascule tout d''un coup, 29 k€ si l''on n''expose que
    10 puis 25 % du trafic. **L''option A finance une partie de son économie avec des paniers perdus.**


    *Hypothèse à confirmer avec la Direction financière : que les 310 k€ de B intègrent déjà le double
    run à 45 k€/mois et le mois-le-mois Solda. S''ils ne l''intègrent pas, les deux options baissent d''autant
    — le classement ne change pas.*


    ### Pourquoi pas A


    Une sortie de Payflux après bascule intégrale coûte 240 k€ de pénalité, six semaines sans paiement
    en un clic, et la recollecte des empreintes de **2,1 millions de clients**. Si 70 % seulement ressaisissent
    leur carte, 630 000 clients perdent le paiement en un clic — sur une base de 276 M€ de volume annuel,
    l''ordre de grandeur est à huit chiffres. Ce n''est pas un mauvais trimestre : c''est une perte non
    rattrapable. 136 k€ ne paient pas ce risque-là.


    Le 99,9 % contractuel ne protège pas : il **autorise** 43 minutes d''indisponibilité par mois. Si
    elles tombent le vendredi noir, c''est ~90 k€ de volume et Payflux ne doit rien.


    ### Le meilleur argument contre cette recommandation


    Il est sérieux. A termine sa fenêtre dégradée le 24 novembre, avant le vendredi noir, et le compte
    Solda reste ouvert jusqu''au 30 novembre : il y a donc un filet pendant toute la montée en charge.
    B, à l''inverse, place délibérément une architecture à deux prestataires en pleine saison haute —
    deux surfaces de panne, réconciliation double.


    **Réponse :** le filet de A expire le 30 novembre, exactement quand le risque devient maximal. Du
    1er décembre à mi-janvier, le trimestre le plus lourd de l''année, A n''a aucun retour arrière. Et
    les trois semaines du pilote ont été mesurées en charge normale, pas en charge de pic. Quant à la
    complexité du double run, elle est réelle mais déjà outillée : tableau de bord à 5 minutes, astreinte
    24/7, bascule de trafic en moins de 15 minutes. **Nous savons faire tourner deux prestataires ; nous
    ne savons pas rouvrir un compte fermé.**


    ### Paliers


    3 nov : 10 %. — 10 nov : 25 % si échec ≤ 0,6 % sur 5 jours consécutifs. — **20 nov → 5 janv : gel
    à 25 %**, aucun changement de palier pendant le pic ; 75 % du vendredi noir tourne sur le prestataire
    dont nous connaissons le comportement en charge depuis 12 mois. — 5 janv : 50 %. — 19 janv : 100 %.
    — Compte Solda ouvert 4 semaines après le 100 %, clôture mi-février, en creux de saison.


    **Repli :** taux d''échec Payflux > 0,8 % sur 60 minutes glissantes (min. 1 000 transactions) → l''astreinte
    rebascule 100 % sur Solda en moins de 15 minutes, palier suivant reporté de 2 semaines. Deux replis
    → arrêt de la migration et retour devant le comité.


    **Ce qui renverserait cette recommandation :** si Payflux accepte par écrit une probation de 90 jours
    sans pénalité de sortie **et** réussit un test de charge à 2× notre pic devant témoin, **et** si Solda
    refuse le mois-le-mois ou le facture au-delà de 200 k€/mois — alors A redevient défendable.


    ### Lundi


    1. **Courrier à Solda** activant la prolongation au mois le mois — échéance 15 octobre, à envoyer
    maintenant et non à mettre au calendrier — avec confirmation écrite que la facturation ne porte que
    sur les mois consommés.

    2. **Vérifier que l''export des 2,1 M jetons est duplicatif et non destructif.** Si le coffre Solda
    est invalidé par l''export, le double run est impossible et tout ce plan tombe. C''est le seul point
    qui peut invalider cette recommandation.

    3. **Payflux :** obtenir par écrit la probation 90 jours, le test de charge, et le démarrage des 24
    mois au basculement à 100 % — pas à la signature.

    4. **Supervision paiement :** câbler le seuil d''alerte 0,8 %/60 min et publier le calendrier des
    paliers avec le gel.


    ---


    Deux points sur lesquels je ne peux pas être affirmatif faute de données au dossier, et que j''ai
    traités par hypothèse explicite plutôt qu''en repoussant la décision : la composition exacte des 310
    k€ (point signalé à la DF), et le caractère duplicatif de l''export des jetons — c''est l''action
    n° 2 de lundi, et la seule qui pourrait renvoyer le sujet au comité.

    '
