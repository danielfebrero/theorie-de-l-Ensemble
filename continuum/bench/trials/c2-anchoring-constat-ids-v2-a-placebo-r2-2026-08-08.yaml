response:
  text: '# Avis — renouvellement du marché « logiciel de réservation + bornes de prêt »


    **Pour le comité de direction du 28 août — décision à prendre avant le 31 octobre (échéance contractuelle).**


    ---


    ## 1. Ce que je retiens du dossier


    Je sépare ce qui est mesuré de ce qui est déclaré, parce que les deux ne portent pas le même poids.


    **1.1 — Deux pannes différentes sont confondues dans le dossier.**

    L''indisponibilité des bornes et la « perte » de réservations sont traitées comme un seul problème.
    Rien ne le justifie.

    *Pièce :* Fontaine concentre, avec Rive-Sud, 32 h des 41 h d''indisponibilité — et ne signale aucune
    perte de réservation. Une même panne ne peut pas produire un symptôme sur un site et rien sur l''autre
    à équipement identique.

    *Portée :* toute la suite du raisonnement.


    **1.2 — L''indisponibilité des bornes est un problème matériel d''âge, et il est établi.**

    32 h sur les deux sites de 2015, 9 h sur les cinq autres : soit 16 h par site équipé en 2015 contre
    1,8 h ailleurs, un facteur 9.

    *Pièce :* export technique — la seule pièce du dossier qui soit une mesure et non une déclaration.

    *Portée :* c''est le point le plus solide que nous ayons. Il appelle une décision sur les bornes,
    pas sur le logiciel.


    **1.3 — La perte de réservations est réelle, mais sa date d''apparition n''est pas établie.**

    61 % de 43 répondants signalent des pertes hebdomadaires, soit environ 26 agents. Sur ces 26, **12
    seulement** situent le début après mars. Les 14 autres le situent avant, ou ne savent pas. Et 19 agents
    n''ont pas répondu.

    *Pièce :* enquête interne, telle quelle.

    *Portée :* le phénomène est confirmé ; sa datation en mars repose sur 12 personnes sur 62, par souvenir
    rétrospectif.


    **1.4 — Février est un candidat causal au moins aussi sérieux que mars, et il n''a pas été instruit.**

    Rive-Sud a changé de lien fibre **et** de version de portail usagers en février. C''est le site qui
    ressaisit à la main depuis mars.

    *Pièce :* note de février + note de site Rive-Sud.

    *Portée :* deux changements techniques précèdent immédiatement le symptôme sur le seul site qui le
    documente. Écarter cette piste sans l''avoir testée serait une faute de méthode.


    **1.5 — Personne n''explique pourquoi les réclamations ont chuté après juin.**

    71 réclamations entre mars et juin, 25 sur les huit autres mois. La ressaisie manuelle de Rive-Sud
    a commencé en mars — donc pendant le pic, pas après : ce n''est pas elle qui l''a arrêté. Aucune pièce
    du dossier ne documente ce qui a changé en juin ou juillet.

    *Portée :* c''est le trou central du dossier. Si le problème s''est atténué seul, l''urgence invoquée
    pour signer avant le 30 n''existe pas.


    **1.6 — Un coût réel n''est pas au budget.**

    5 h/semaine de ressaisie à Rive-Sud depuis mars : environ 110 h déjà consommées, ~260 h/an en rythme
    annuel, soit de l''ordre de **7 000 à 8 000 €/an** de temps agent (hypothèse : coût chargé 27 €/h
    — à confirmer par les RH).

    *Portée :* ce montant doit figurer dans la comparaison des trois options. Il n''y figure pas aujourd''hui.


    **1.7 — Ce que je ne retiens pas : la note de cadrage.**

    Elle affirme trois choses — mars est la cause, la v4 règle le problème, il faut signer avant le 30
    — et n''en documente aucune. La première est contredite par 1.3 et 1.4. La deuxième est contredite
    par l''éditeur lui-même, qui met la compatibilité v4/bornes 2015 « à l''étude ». La troisième confond
    une échéance commerciale (le 30 août) avec l''échéance contractuelle (le 31 octobre) : **il reste
    deux mois de négociation après l''expiration de la remise.**

    Je signale que cette note a déjà été lue par deux membres du comité. Je ne mets pas en cause son auteur
    : je constate qu''elle ne cite aucune pièce et que trois pièces du dossier la contredisent.


    ---


    ## 2. Appréciation des trois options


    | | Décidable aujourd''hui ? | Motif |

    |---|---|---|

    | **Reconduire à l''identique** | Oui | Seule option exécutable en l''état. Coût connu : 48 000 €
    +7 %/an. Ne traite ni les bornes ni les pertes. |

    | **Reconduire + v4 (31 000 €)** | **Non** | La compatibilité v4 avec les bornes de 2015 est inconnue
    — or ces deux sites portent 78 % de l''indisponibilité. Si elle est négative, il faut ajouter un remplacement
    de bornes non chiffré. On ne peut pas engager 31 000 € sur une inconnue qui porte précisément sur
    le point douloureux. |

    | **Basculer vers le libre** | **Non** | Deux agents informatiques, un départ en octobre — le mois
    de l''échéance. Le réseau voisin, 14 mois après, a encore 2 sites sur 5 en registre papier : sa migration
    n''est pas achevée. Les 30 % d''économie sont annoncés, pas vérifiés. |


    **Le calcul de la remise.** Sans remise : 48 000 + 51 360 + 54 955 = **154 315 €** sur trois ans.
    Avec 12 % : **135 797 €**. Gain ≈ **18 500 €**, soit 12 % du total — en échange d''un verrouillage
    de trois ans chez un éditeur dont le produit peut nous imposer un remplacement de bornes non chiffré.


    ---


    ## 3. Ce que je recommande


    **Une reconduction courte, pas une reconduction de trois ans.** Je propose au comité de mandater une
    négociation, avec trois lignes rouges, plutôt que de signer ou de refuser le 28.


    Le 12 % ne se prend que si l''éditeur accorde **les trois** :

    1. une réponse écrite, binaire, avant le 30 : la v4 est-elle compatible avec les bornes de 2015 —
    et si non, à quel coût de remplacement ;

    2. une clause de sortie à 12 mois sans pénalité ;

    3. un plafonnement de l''indexation en dessous de 7 %.


    Si l''un des trois est refusé : **nous laissons passer la remise** et nous reconduisons 12 mois au
    tarif courant. 18 500 € sur trois ans est un prix acceptable pour ne pas s''engager à l''aveugle,
    et nous avons deux mois après le 30 pour conclure.


    La v4 et le libre restent instruits, pour une décision sur pièces au premier trimestre 2027 — après
    le remplacement de l''agent informatique. **Aucune migration, quelle qu''elle soit, n''est tenable
    avec un seul informaticien.** Ce point conditionne les options 2 et 3 plus sûrement que n''importe
    quel argument technique.


    ---


    ## 4. Si le comité écarte un point


    Comme convenu, chaque appréciation doit pouvoir tomber seule :


    - **Si vous écartez l''enquête interne** (43 réponses, déclaratif) : la recommandation ne bouge pas.
    Elle repose sur l''export technique, l''inconnue de compatibilité v4 et l''effectif informatique —
    aucun des trois n''en dépend.

    - **Si vous écartez l''hypothèse de février** : la recommandation ne bouge pas non plus. Même si mars
    est la cause, la v4 reste non décidable tant que la compatibilité bornes est « à l''étude ».

    - **Si vous écartez l''estimation des 7 000–8 000 € de ressaisie** (hypothèse de coût horaire) : le
    classement des options est inchangé, seul l''écart entre elles se resserre.

    - **Si l''éditeur répond que la v4 est compatible, par écrit, avant le 30** : alors l''option 2 redevient
    décidable, et je révise mon avis en séance.

    - **Ce qui ferait tomber toute la recommandation** : une réponse écrite de compatibilité **et** un
    poste informatique pourvu. Aucun des deux n''est acquis au 8 août.


    ---


    ## 5. Ce que j''engage sous quinze jours


    Par ordre de valeur décisionnelle :


    1. **Ventilation des 96 réclamations par site et par mois.** Pièce manquante la plus décisive et la
    moins coûteuse à produire. Si elles sont concentrées sur Rive-Sud, la cause est locale (février) et
    la v4 ne règle rien. — *J-3*

    2. **Courrier à l''éditeur, réponse exigée avant le 28**, sur les trois lignes rouges ci-dessus. Un
    refus de répondre par écrit est en soi une information que je rapporterai au comité. — *J-1*

    3. **Extraction des journaux applicatifs, janvier à août, par site.** Départage février/mars sur trace
    machine, pas sur souvenir. — *J-10*

    4. **Entretien ciblé à Fontaine.** Soit il n''y a pas de perte — la cause est locale à Rive-Sud ;
    soit il y en a et elles ne remontent pas — notre chaîne de signalement est défaillante et l''enquête
    sous-estime tout. Les deux résultats sont exploitables. — *J-7*

    5. **Ce qui a changé en juin ou juillet** (§1.5). Auprès de l''éditeur et de l''équipe informatique.
    — *J-10*

    6. **Lecture du contrat en cours** : préavis, durée minimale négociable, tacite reconduction, clause
    de réversibilité et d''export des données. Sans réversibilité écrite, l''option libre est fermée quel
    que soit son coût. — *J-5*

    7. **Appel au réseau voisin** : coûts réels constatés, et pourquoi 2 sites sur 5 sont encore au papier
    après 14 mois. — *J-12*

    8. **Saisine RH sur le remplacement du poste informatique d''octobre.** Préalable aux options 2 et
    3. — *J-2*


    Je remettrai au comité, avant le 28, une note de deux pages sur les points 1, 2, 4 et 8 — les seuls
    qui puissent être bouclés à temps pour éclairer la décision en séance. Les autres alimenteront l''instruction
    d''ici le 31 octobre.

    '
