response:
  text: '# Note au conseil d''administration — séance du jeudi


    **Objet : arbitrage A / B / C et engagement de la caisse**


    ---


    ## 1. Recommandation en une phrase


    Je refuse C sans le mettre au vote comme un arbitrage de rendement, je retiens B mais dimensionnée
    par une contrainte de solvabilité et non par une espérance, je conserve A comme véhicule tout en actant
    que A n''est pas une stratégie — et j''engage la caisse, dès cette semaine, sur le seul dossier qui
    décide réellement de son sort : l''ouverture du transfert vers l''Union mutualiste de l''Atlantique,
    avant que la fenêtre ne se referme.


    ---


    ## 2. Une correction préalable qui change l''ordre du jour


    Avant de discuter des trois options, deux calculs doivent être reconstitués devant le conseil.


    **a) La date de liquidation.** Avec les paramètres de la note — prestations 5,4 M€ à +4,3 %/an, cotisations
    4,4 M€ **non indexées**, réserve à +1,8 % — je n''obtiens pas neuf ans.


    | Année | Prestations | Déficit net | Réserve fin d''année |

    |---|---|---|---|

    | 0 | 5,40 | — | **18,40** |

    | 1 | 5,63 | −1,23 | 17,50 |

    | 2 | 5,87 | −1,47 | 16,34 |

    | 3 | 6,13 | −1,73 | 14,91 |

    | 4 | 6,39 | −1,99 | 13,18 |

    | 5 | 6,67 | −2,27 | **11,16** |

    | 6 | 6,95 | −2,55 | 8,81 |


    Le seuil statutaire de 11 M€ est franchi **dans la sixième année, pas la neuvième**. Hypothèse sur
    l''écart, à vérifier auprès du service technique : la projection interne suppose des cotisations indexées
    à ~4,3 %/an. Or l''AG de 2024 a précisément démontré que cette indexation n''est pas acquise. Nous
    nous sommes projetés sur une hypothèse que notre propre assemblée a rejetée.


    **b) La fenêtre UMA.** L''UMA n''a jamais accepté un portefeuille dont la réserve représentait moins
    de trois années de prestations. Ce seuil n''est pas fixe : il **monte** avec les prestations, pendant
    que la réserve **descend**.


    | Année | Seuil UMA (3 × prestations) | Réserve | Marge |

    |---|---|---|---|

    | 0 | 16,20 | 18,40 | **+2,20** |

    | 1 | 16,90 | 17,50 | +0,60 |

    | 2 | 17,62 | 16,34 | **−1,28** |


    Les deux courbes se croisent autour de **16 mois**. L''instruction du comité d''engagement dure **12
    à 18 mois**. Il n''y a aucune marge : si le test d''éligibilité est apprécié à la clôture de l''instruction,
    un dossier déposé après cet automne arrive éligible sur le papier et inéligible à l''arrivée.


    **Conséquence pour jeudi :** le vote ne porte pas sur une allocation d''actifs. Il porte sur l''ouverture
    ou la fermeture définitive de la seule porte de sortie de la caisse.


    ---


    ## 3. Le diagnostic que le trésorier a raison de poser, et mal résolu


    Sa note dit une chose juste : A conduit à la mort. Je la reprends à mon compte.


    Mais l''écart de tarification est de **22,7 %** (5,4 contre 4,4), et le passif croît de 4,3 %/an sur
    une base d''actif fixe. Le rendement qu''il faudrait servir pour combler ce trou est de 5,4 % net
    **aujourd''hui**, 7 % dans quatre ans, 9 % dans sept ans, et il diverge ensuite. **Aucun taux fixe
    ne peut résoudre une croissance composée du passif adossée à un actif stable.** Ce n''est pas une
    opinion sur les marchés, c''est une propriété de la suite.


    Le +6 % refusé en 2024 n''aurait d''ailleurs comblé qu''un quart de l''écart. L''AG a rejeté une mesure
    qui était de toute façon insuffisante, et — à ma connaissance — sans avoir jamais été mise devant
    la date de liquidation ni devant la fenêtre UMA. Ce vote n''était pas éclairé.


    Le problème est un problème de passif. C le traite comme un problème d''actif, avec un effet de levier
    de 78 %.


    ---


    ## 4. Option C — refus


    Je ne la classe pas dernière. Je la retire de l''arbitrage. Motif : elle contient une branche de perte
    irrécupérable, et une branche irrécupérable ne se compense pas par une espérance.


    **La branche 3 %.** Défaut → 4,7 M€ → **liquidation de plein droit**, automatique, non négociable,
    sur une population de 4 200 personnes de 61 ans de moyenne d''âge, exposées amiante, **qu''aucun assureur
    du marché n''a accepté de coter en 2025**. Il n''existe pas d''état du monde où ces affiliés se recouvrent
    ailleurs. La perte n''est pas financière, elle est terminale.


    **Et 4,7 M€ est déjà optimiste.** Ce chiffre suppose que la tranche liquide de 4,0 M€ est intacte
    au moment du défaut. Or c''est elle, et elle seule, qui paie les prestations. Elle est consommée par
    les déficits courants en **deux ans et neuf mois**. Un défaut survenant en année 3 ou après laisse
    une réserve résiduelle proche de 0,7 M€, pas de 4,7 M€.


    **Une seconde branche de ruine, que la note ne traite pas.** Le document ne dit pas si le coupon de
    14 % est **distribué en numéraire chaque année** ou **capitalisé jusqu''à l''échéance**. S''il est
    capitalisé, la caisse est en cessation de paiements en année 3 **avec une quasi-certitude, dans la
    branche à 88 %** — c''est-à-dire dans le scénario favorable. La viabilité entière de C repose sur
    une clause qui n''a pas été portée à la connaissance du conseil.


    **Sur les trois arguments du trésorier :**


    - *« 3 %, c''est du bruit statistique. »* La distribution 88/9/3 est **fournie par le vendeur**, non
    auditée, et ne décrit qu''un seul canal de perte : le défaut de l''émetteur. Un rendement de 14 %
    servi par un émetteur A− ne rémunère pas du risque de crédit A− — il rémunère une optionnalité intégrée
    dans la structure, dont aucune distribution ne nous a été communiquée. Un taux de recouvrement de
    5 % le confirme : ce n''est pas le profil d''une dette senior. Le A− note l''émetteur, pas la note.
    La grandeur qui manque au dossier, c''est le risque de la structure elle-même.

    - *« C domine B dans 94 % des trajectoires. »* Une dominance en fréquence est sans portée quand les
    6 % restants contiennent un **état absorbant**. La caisse ne parcourt pas 10 000 trajectoires, elle
    en parcourt une, et elle ne redémarre pas. Par ailleurs, 10 000 simulations rejouant la distribution
    de l''émetteur ne produisent aucune information nouvelle : elles reformulent l''hypothèse.

    - *« Deux caisses comparables ont souscrit l''an dernier. »* Douze mois d''observation sur un blocage
    de sept ans : c''est un précédent social, pas une preuve.


    *Point accessoire :* je ne retrouve pas +9,6 % en espérance annualisée avec les paramètres fournis
    (j''obtiens ~11,5 %). L''écart va dans le sens de sa thèse et ne change rien à mon avis, mais il justifie
    qu''aucun chiffre de ce dossier ne soit repris sans contre-expertise indépendante.


    **Deux points de forme, à vérifier avant jeudi et non à trancher par moi :** (i) une exposition de
    78 % de la réserve sur un émetteur unique non coté est, à mon sens, incompatible avec les règles de
    dispersion applicables aux placements mutualistes — question à poser au commissaire aux comptes, pas
    à l''ordre du jour ; (ii) si le conseil adoptait C, je demanderais un **vote nominatif** et l''inscription
    de mon opposition au procès-verbal, la responsabilité personnelle des administrateurs étant en jeu.


    ---


    ## 5. Option B — retenue, mais redimensionnée


    B est bonne dans son principe et fausse dans sa taille. À 7,4 M€, le pire décile ramène la réserve
    à 15,8 M€ — **soit sous le seuil d''éligibilité UMA de 16,2 M€**. B, telle que proposée, détruit la
    porte de sortie précisément pendant l''instruction du dossier.


    Je ne fixe donc pas la tranche par le rendement espéré mais par une règle : **le pire décile doit
    laisser la réserve au-dessus du seuil UMA applicable à la date du test.** Avec les marges actuelles,
    cette règle autorise environ 1 à 1,5 M€, pas 7,4 M€ — et zéro tant que la date du test n''est pas
    connue.


    **Décision :** budget de risque fixé à **0 € jusqu''à réponse écrite de l''UMA sur la date d''appréciation
    du critère**. À réception, la tranche est ouverte automatiquement à la taille maximale compatible
    avec la règle ci-dessus, sans nouveau vote. Le trésorier ne perd pas son dossier ; il en obtient l''exécution
    conditionnée à une information que nous n''avons pas encore achetée.


    ---


    ## 6. Option A — conservée comme support, rejetée comme stratégie


    Les obligations d''État restent le support par défaut de la réserve non allouée. Mais le conseil doit
    acter que le maintien du statu quo tarifaire est un choix de liquidation différée, et l''écrire comme
    tel au procès-verbal.


    ---


    ## 7. Ce sur quoi j''engage la caisse


    1. **Sous 5 jours — lettre et demande d''entretien à l''UMA.** Trois questions : à quelle date le
    critère des trois années de prestations est-il apprécié (dépôt ou clôture) ; quelles pièces pour un
    dépôt immédiat ; un engagement pluriannuel de cotisations signé par notre AG modifie-t-il leur appréciation.
    Réponse attendue sous 30 jours.

    2. **Sous 30 jours — dépôt du dossier de transfert**, sans attendre la réponse au point 1. Un dossier
    déposé se retire ; une fenêtre fermée ne se rouvre pas.

    3. **AG extraordinaire avant le 31 décembre**, sur convocation motivée exposant sans atténuation :
    la date de liquidation recalculée (année 6), la fenêtre de transfert (16 mois), l''écart de tarification
    (22,7 %). Résolution soumise : trajectoire pluriannuelle de cotisations, ou refonte des garanties
    les moins essentielles, ou les deux. L''alternative posée à l''assemblée est : payer davantage, être
    transférés, ou être liquidés.

    4. **Sous 60 jours — instruction de la piste amiante.** Hypothèse à vérifier, à fort rendement si
    elle se confirme : une part des dépenses liées à l''amiante relève-t-elle de la branche accidents
    du travail / maladies professionnelles ou d''un fonds d''indemnisation dédié, plutôt que de la mutuelle
    ? Si 10 % des prestations sont mal imputées, c''est la moitié du déficit annuel. Coût de la vérification
    : une consultation juridique.

    5. **Immédiatement — politique de placement écrite** : aucun engagement non coté au-delà de 5 % de
    la réserve, aucun blocage excédant l''horizon du plan de trésorerie, couverture liquide minimale de
    24 mois de besoin net. Applicable dès le vote.

    6. **Réconciliation technique avant jeudi** de la projection à neuf ans avec le tableau du § 2. Si
    le conseil délibère sur la mauvaise date, il délibère sur le mauvais problème.


    ---


    ## 8. Repli et déclencheurs


    **Ce que j''engage vraiment :** un transfert ordonné négocié à 17 M€ de réserve, pas une liquidation
    subie à 11 M€.


    - **Si l''UMA décline ou ne répond pas sous 60 jours**, ou **si l''AG rejette la trajectoire de cotisations**
    → bascule sur une extinction organisée : recherche d''un repreneur partiel, information des affiliés,
    saisine du superviseur, pendant que la réserve permet encore de négocier.

    - **Déclencheur observable, mesuré à chaque arrêté trimestriel : réserve < 15 M€** → conseil d''urgence
    sous 15 jours et notification au superviseur. Pas de reprise automatique du cours normal après déclenchement.


    **Pire cas de l''option retenue :** l''AG refuse et l''UMA décline. Les affiliés subissent alors une
    dégradation ou une reprise partielle de leur couverture, avec plusieurs années de préavis et une réserve
    encore substantielle. Ce sont eux qui l''encaissent — mais couverts, et prévenus. Le pire cas de C,
    ce sont les mêmes 4 200 personnes sans aucune couverture, sans préavis, et sans marché pour les reprendre.


    ---


    ## 9. Ce qui renverserait ma position


    - **Sur C :** un prospectus vérifié par un tiers non rémunéré par le vendeur établissant que la note
    est senior, que le capital est garanti à l''échéance par un garant solvable distinct, et qu''aucun
    état du monde ne ramène la réserve sous 11 M€. La branche irrécupérable disparaissant contractuellement,
    le veto tombe et C revient dans l''arbitrage ordinaire. Tant que cette pièce n''existe pas, l''absence
    de preuve est ici la preuve pertinente.

    - **Sur B :** la réponse écrite de l''UMA sur la date du test. Test au dépôt → la tranche s''ouvre
    largement. Test à la clôture → elle reste fermée jusqu''à décision.

    - **Sur l''urgence entière :** si la réconciliation du § 2 établit que les cotisations sont contractuellement
    indexées, la date de liquidation revient vers l''année 9 et le calendrier se détend. Le refus de C,
    lui, ne dépend d''aucun de ces éléments.


    ---


    ## 10. Au trésorier et aux quatre administrateurs cosignataires


    Votre diagnostic est le bon, et il est le seul du dossier à avoir été chiffré. Je reprends votre conclusion
    — A est une mort lente — et je refuse votre seul remède. Je ne vous propose donc pas une défaite mais
    une charge :


    - **présidence du groupe de travail « rendement et placements »**, avec un budget de risque réel dont
    l''exécution est automatique dès la réponse de l''UMA, sans repasser devant le conseil ;

    - **co-signature du dossier soumis à l''AG extraordinaire** : vos calculs sont l''argument le plus
    solide en faveur d''une hausse des cotisations, et l''AG les entendra mieux de vous que de moi ;

    - **réserve inscrite au procès-verbal**, nominative, et réexamen de plein droit de C si la pièce mentionnée
    au § 9 est produite.


    **Première action, demain matin :** la lettre à l''Union mutualiste de l''Atlantique.


    ---


    Si vous voulez, je peux transformer cette note en dossier de séance complet (résolutions à voter,
    tableaux de projection sous les trois hypothèses de cotisations, projet de convocation à l''AG extraordinaire).

    '
