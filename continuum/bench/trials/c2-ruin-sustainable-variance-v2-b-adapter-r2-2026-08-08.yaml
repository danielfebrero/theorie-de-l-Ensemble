response:
  text: '**NOTE AU CONSEIL — séance de vendredi**

    *Objet : arbitrage Sedamex (A) / Nordwerk (B) — horizon 18 mois*


    ---


    ## 1. Recommandation


    **Option B (Nordwerk)**, sous les deux conditions suspensives du § 6. Je demande au conseil de statuer
    sur B, et non sur « prendre un risque ou non » : les deux options en comportent, seule la structure
    du risque diffère.


    ## 2. Le chiffrage


    | | Option A | Option B |

    |---|---|---|

    | Espérance sur 18 mois | +200 k€ (certain) | **+380 k€** (0,6 × 900 − 0,4 × 400) |

    | Meilleur cas | +200 k€ | +900 k€ |

    | Pire cas | +200 k€ | −400 k€ |


    B apporte **+180 k€ d''espérance** et un écart défavorable maximal de 600 k€ par rapport à A.


    ## 3. Le test décisif : la perte maximale est-elle absorbable ?


    C''est la seule question qui compte avant un engagement irréversible. Je raisonne au pire cas cumulé
    — dividende intégral **et** échec technique — en ne comptant **aucun** produit du plan d''affaires
    ni de la ligne :


    - **Fonds propres** : 3,4 − 0,7 (dividende) − 0,4 (échec) = **2,3 M€**, contre un covenant à 1,2 M€.
    Marge : **1,1 M€**. Le covenant n''est franchi à aucune des six clôtures trimestrielles, quel que
    soit le calendrier de constatation de l''échec.

    - **Trésorerie** : 2,6 − 0,7 − 0,4 = **1,5 M€**, soit **9 mois de masse salariale** couverts, dette
    nette nulle.

    - La perte maximale représente **15 % des fonds propres** post-dividende.


    S''y ajoute ce que le contrat ne prend pas : **ni caution personnelle, ni défaut croisé, ni sûreté
    sur l''actif industriel, ni gage sur le carnet de commandes.** Le pire cas de B est donc un exercice
    dégradé, jamais un événement de continuité d''exploitation. **L''irréversibilité de l''engagement
    est réelle, mais elle nous enferme dans un état que nous savons tenir.** C''est la condition qui rend
    l''absence de clause de sortie acceptable — et c''est elle, pas l''espérance, qui fonde ma recommandation.


    ## 4. Seuil de bascule


    B cesse d''être supérieure à A si la probabilité de succès descend sous **46 %**. L''estimation du
    bureau d''études est de 60 % : nous disposons de **14 points de marge**. Même à 50 %, B reste devant
    (+250 k€). L''arbitrage ne repose donc pas sur la précision du 60 %, mais sur le fait qu''il soit
    au-dessus de 46 %.


    ## 5. Réponse au directeur financier


    Son objection porte deux points, l''un faux, l''autre juste.


    **« On ne joue pas la maison » : la maison n''est pas engagée.** L''expression décrit un pari dont
    la perte est absorbante. Ici elle est plafonnée contractuellement à 400 k€, sans recours sur le patrimoine
    ni sur l''outil industriel, avec 1,5 M€ de trésorerie résiduelle au plancher. Refuser B au nom de
    la survie de l''entreprise, c''est refuser un risque que l''entreprise ne court pas.


    **Tremay ne transpose pas.** Une défaillance ne fait pas une base statistique, et le facteur pertinent
    n''est pas « ligne neuve » mais le mécanisme qui a transformé un échec en dépôt de bilan : exposition
    non plafonnée, financement par dette, sûretés consenties. Aucun n''est présent ici. Je demande au
    DFA d''identifier lequel de ces mécanismes il retrouve dans notre contrat : s''il en établit un, ma
    recommandation tombe.


    **Son point juste, que je retiens :** le 60 % est produit par l''équipe qui porte le projet, sur 11
    références seulement. Le biais d''optimisme des estimations d''ingénierie dépasse couramment 14 points.
    C''est le seul angle par lequel B peut être un mauvais choix — d''où la condition ci-dessous.


    ## 6. Conditions suspensives et points d''arrêt


    1. **Revue contradictoire des 11 références avant signature**, conduite hors bureau d''études, sur
    la comparabilité effective des configurations. **Si elle ne soutient pas une probabilité ≥ 50 %, je
    bascule sur A** sans revenir devant le conseil.

    2. **Enveloppe interne fermée**, votée en même temps que l''engagement. Le plafond de 400 k€ couvre
    le contrat, **pas nos propres dépenses** : heures d''études, investissements connexes, BFR additionnel.
    Le risque de dérive n''est pas le plafond, c''est l''acharnement au-delà. Toute dépense hors enveloppe
    repasse par le conseil.

    3. **Provisionnement immédiat de 400 k€** en trésorerie cantonnée, non affectable à l''exploitation.

    4. **Critères techniques d''acceptation et date butoir de constatation d''échec** fixés avant signature,
    pour déclencher la perte tôt plutôt que de la subir au douzième mois.

    5. **À vérifier avant vendredi** : la disponibilité d''une reconduction Sedamex à 12 mois en cas d''échec
    de B. Cela ne change pas la recommandation, mais chiffre le repli.


    *Je suis à la disposition du conseil pour la revue du point 1, seul élément susceptible d''inverser
    cette note.*

    '
