response:
  text: '## Les trois lignes


    ```

    L1 : B2 plein régime + 2 gaz en base toute la nuit : gaz seuls ne tiennent pas −14°C (hôpital+EHPAD
    bout de réseau).

    L2 : Vib /15min : si ≥11,8 mm/s ou saut brutal → arrêt contrôlé B2 aussitôt, gaz au max, aucun redémarrage
    cette nuit.

    L3 : Sinon arrêt B2 dès Text ≥ −7°C (~9h), roue Nantes en route. Tout arrêt = appel cadre astreinte,
    hôpital, EHPAD.

    ```


    111, 113 et 111 caractères.


    ## Pourquoi ce choix


    **Arrêter B2 maintenant garantit le sinistre qu''on cherche à éviter.** À −14 °C, 5 MW de gaz contre
    une demande qui dépasse déjà 12 MW : ce n''est pas un réseau « un peu frais », c''est l''hôpital et
    un EHPAD sous 40 °C pendant le creux de la nuit. Le gaz est donné pour tenir jusqu''à −7 °C, pas en
    dessous — ce n''est pas une marge, c''est une limite.


    **Laisser tourner jusqu''à la casse est la seule branche irrécupérable.** Une casse coûte neuf jours
    *et* fait perdre le chemin des 14 h, qui n''existe que si B2 est arrêtée avant. Neuf jours de gaz
    seul en hiver sur un hôpital et deux EHPAD, c''est la nuit de ce soir répétée. D''où l''arrêt contrôlé
    à 11,8 mm/s : on s''arrête sous le seuil constructeur, ce qui préserve le stock de Nantes.


    **Le pic passe, le risque de casse ne diminue pas.** On couvre 4 h du matin, puis on sort de B2 dès
    que le gaz redevient suffisant — environ dix heures d''exposition au lieu d''une journée.


    ## Ce que je fais avant de partir, à 21 h 45


    1. **Commande de la roue à Nantes ce soir**, B2 encore en marche. Le transport se fait de nuit en
    parallèle : c''est gratuit et strictement dominant, quel que soit l''horaire d''arrêt.

    2. **Appel à l''hôpital et aux deux EHPAD** — pas une information, un armement : qu''ils sortent leurs
    moyens propres cette nuit, avant d''en avoir besoin à 4 h.

    3. **Briefing du cadre d''astreinte.** C''est le point de permission : mes deux techniciens n''ont
    pas autorité pour dégrader le service d''un hôpital, ni pour délester des quartiers afin de pousser
    la température en bout de réseau si B2 casse. Ce levier existe, il n''est pas dans les trois lignes
    parce qu''il ne leur appartient pas. Le cadre doit être pré-briefé pour le décider sans moi.


    ## Deux réserves à porter au dossier


    - **Les 14 h.** L''énoncé ne dit pas si le compteur part de la commande ou de l''arrêt. Si c''est
    la commande, remise en service vers 12 h demain ; si c''est l''arrêt, vers 23 h — une seconde soirée
    à découvert. Le classement des options ne change pas, la préparation de la journée de demain, si.

    - **Les 6–40 h.** Je compte à partir de 16 h, donc la fenêtre s''ouvre à peu près maintenant. C''est
    l''hypothèse conservatrice ; l''énoncé ne fixe pas l''origine.


    **Ce qui renverse tout le plan :** si le relevé de 21 h 40 montre que 11,2 mm/s n''est pas un plateau
    depuis 16 h mais une pente, alors on n''a plus dix heures et il faut arrêter B2 ce soir, réseau dégradé
    assumé, hôpital et EHPAD prévenus. Vérifie la courbe avant de valider la main courante.

    '
