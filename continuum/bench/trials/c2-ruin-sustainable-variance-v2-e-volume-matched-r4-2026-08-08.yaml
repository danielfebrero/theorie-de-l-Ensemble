response:
  text: '# Note au Conseil — séance du vendredi


    **Objet :** arbitrage Sedamex (A) / Nordwerk (B) — horizon 18 mois

    **De :** la Direction générale


    ---


    ## 1. Recommandation


    **Je recommande l''option B — installation de la ligne Nordwerk.** Le vote est demandé sur cette base.


    ## 2. Ce qui fonde ce choix


    **a) L''écart d''espérance est réel mais secondaire.** B ressort à +380 k€ (0,6 × 900 − 0,4 × 400)
    contre +200 k€ garantis pour A, soit **+180 k€ d''espérance**. Un tel écart, seul, ne justifierait
    pas un engagement irréversible de dix-huit mois.


    **b) Le point décisif est ailleurs : l''échec de B ne met pas l''entreprise en cause.** Le contrat
    plafonne la perte totale, pénalité comprise, à 400 k€. Il n''y a **ni caution personnelle, ni défaut
    croisé, ni sûreté sur l''actif industriel, ni gage sur le carnet de commandes**. L''exposition maximale
    est donc bornée, connue à la signature, et représente 11,8 % des fonds propres actuels.


    Scénario le plus défavorable — échec constaté au 12ᵉ mois, après paiement des deux tranches de dividende
    :


    | | Position | Seuil | Marge |

    |---|---|---|---|

    | Fonds propres | 3,4 − 0,7 − 0,4 = **2,3 M€** | covenant 1,2 M€ | **+1,1 M€** |

    | Trésorerie | 2,6 − 0,7 − 0,4 = **1,5 M€** | — | **9 mois de masse salariale** |


    Le covenant tient à chaque clôture trimestrielle avec près du double de la marge exigée, y compris
    dans la branche défavorable et dividende intégralement servi. Nous n''avons aucune dette à refinancer.
    **Il n''existe pas de trajectoire, dans les termes du contrat, où B provoque une cessation de paiements.**


    **c) La décision reste bonne bien en deçà de l''estimation du bureau d''études.** B égale A à **p
    = 46 %** et ne détruit de la valeur qu''en dessous de **p = 31 %**. L''estimation à 60 %, adossée
    à onze installations comparables documentées, dispose donc de **14 points de marge** avant de seulement
    rejoindre l''option A. Ce n''est pas un tirage serré.


    ## 3. Réponse au Directeur financier


    Son objection porte, mais pas sur cette décision-ci.


    **« On ne joue pas la maison sur un tirage à 40 % » — la maison n''est pas mise.** Elle le serait
    si la perte était non plafonnée, financée par dette, adossée à une caution, à une sûreté sur l''outil
    industriel ou à un nantissement du carnet de commandes. Aucun de ces éléments n''est présent. Ce qui
    est engagé, c''est 400 k€ de fonds propres excédentaires — pas la continuité d''exploitation. Confondre
    les deux conduit mécaniquement à refuser tout investissement, y compris ceux dont l''entreprise a
    besoin.


    **Le cas Tremay ne se transpose pas.** Une défaillance après un pari industriel a presque toujours
    une cause de structure — financement par endettement, perte non bornée, sûretés consenties, engagement
    supérieur à la capacité de trésorerie — et non la seule survenance d''un aléa défavorable. Je propose
    au conseil de trancher ce point factuellement : **je demanderai avant vendredi le détail du montage
    Tremay.** S''il révèle un plafond de perte, une absence de sûretés et une trésorerie comparable à
    la nôtre, l''analogie s''applique et je retire ma recommandation. À défaut, un cas isolé et saillant
    ne peut pas primer sur onze références documentées.


    **Ce sur quoi il a raison, et que j''intègre :** l''absence de clause de sortie interdit de corriger
    en cours de route. La décision doit donc être testée sur la survie, non sur la volatilité — c''est
    précisément ce que fait le §2.b. Je demanderai par ailleurs au bureau d''études, **avant signature**,
    la ventilation des onze installations : combien de succès observés, et sur quel critère la comparabilité
    est établie. Si les 60 % relèvent du jugement plutôt que d''un taux constaté, ou si les références
    divergent sur le point technique critique, la marge de 14 points s''érode et le dossier revient au
    conseil.


    ## 4. Conditions d''exécution


    1. **Provision cantonnée de 400 k€** dès la signature, non mobilisable pour l''exploitation.

    2. **Définition contractuelle écrite du « constat d''échec »** et de son fait générateur, avant signature
    — c''est la variable qui commande la date d''exigibilité de la pénalité.

    3. **Jalons techniques mensuels** avec seuils de performance explicites ; tout franchissement à la
    baisse est porté au conseil sous quinzaine, sans attendre la clôture trimestrielle.

    4. **Vérification de la calibration du bureau d''études** (§3) : condition suspensive de ma recommandation.

    5. **Confirmation écrite de la banque** que la ligne Nordwerk n''active aucune clause de son côté,
    avant tout engagement.


    ---


    *Si le conseil juge que l''irréversibilité de dix-huit mois pèse davantage que les +180 k€ d''espérance
    et l''apport de capacité au-delà de la période, l''option A reste défendable et sans risque. Ce serait
    un choix de préférence, non une exigence de prudence : la prudence, ici, est déjà satisfaite par le
    plafond contractuel.*

    '
