response:
  text: '# NOTE AU COMITÉ DE DIRECTION

    **Objet :** Contrat cellules 2027 — 72 000 unités

    **De :** Direction des opérations — **Date :** lundi — **Décision requise avant J+18**


    ## Décision proposée

    **Réserver la capacité Kelmar à J+18 pour les 72 000 unités à 26,00 €.** Ne pas retenir Sinolux sur
    le volume 2027. Ouvrir en parallèle une qualification Sinolux pour 2028, à conditions écrites.


    ## Pourquoi les 230 400 € ne sont pas une économie

    Les 230 400 € sont un écart de prix d''achat, pas un gain net. Le coût pertinent est le coût complet
    : prix cellule + retours à 205 € pièce, montant indépendant du fournisseur.


    L''écart de prix est intégralement consommé par **1,56 point de taux de retour**. Chaque dixième de
    point coûte 14 760 €. Le **seuil de bascule est à 2,86 %** (2 060 retours contre 936 chez Kelmar,
    stable depuis quatre ans).


    | Taux de retour Sinolux | Résultat net vs Kelmar |

    |---|---|

    | 1,1 % (essais Sinolux) | + 259 920 € |

    | 2,0 % | + 127 080 € |

    | **2,86 %** | **0** |

    | 3,0 % (Ferro) | − 20 520 € |

    | 3,1 % (audit de mars) | − 35 280 € |


    ## Ce que valent réellement les trois sources

    Nous n''avons pas trois mesures mais **deux**, et une seule est indépendante. Le cabinet Ferro travaille
    sur l''échantillon de l''audit de mars : son « environ 3 % » n''est pas une confirmation, c''est le
    même chiffre relu. Restent une mesure indépendante à 3,1 % sur une ligne comparable du même fournisseur,
    et une auto-mesure du vendeur à 1,1 %. **La seule donnée non intéressée place Sinolux au-dessus du
    seuil de bascule.**


    La garantie de remplacement gratuit ne corrige pas cela : elle couvre la cellule (22,80 €), pas les
    205 € de reprise, transport, geste commercial et atelier — soit au mieux 11 % du coût. Dans la lecture
    la plus favorable (cellule hors des 205 €), le seuil de bascule remonte à 3,22 % : à 3,1 %, nous serions
    à l''équilibre. **Le meilleur cas crédible pour Sinolux, c''est zéro gain.** Le gain n''existe que
    si le chiffre du vendeur est vrai, et rien ne l''étaye.


    Sinolux refuse par ailleurs toute clause indexée sur le taux de retour tout en offrant les cellules.
    Il conserve le risque bon marché et nous laisse le risque cher. C''est un signal, pas un détail de
    négociation.


    ## Le test Vertex n''éclaire pas cette décision

    Résultat à neuf semaines, soit J+63 : après la clôture Kelmar (J+18) et après l''expiration du prix
    Sinolux (J+21), pour une production qui démarre à J+70. **34 000 € pour une information qui arrive
    après la fermeture de la porte.** Il ne se justifie que pour 2028, et à frais partagés.


    ## Pire cas de l''option retenue et qui l''encaisse

    Kelmar à 26,00 € nous coûte 230 400 € de plus à l''achat si Sinolux se révélait à 1,1 %. C''est la
    direction financière qui l''encaisse, sur une ligne d''achat de 1,87 M€. Perte bornée, réversible
    en 2028, sans exposition client. À l''inverse, le pire cas Sinolux ajoute **1 296 retours terrain**
    à charge de l''atelier et de la relation client, sans recours : passé J+18 la ligne Kelmar 2027 est
    vendue.


    ## Repli et déclencheur

    Si Kelmar refuse tout effort de prix d''ici J+12, nous réservons quand même à J+18 : la continuité
    prime sur la concession. Si le taux Kelmar dérive au-delà de 1,8 % au premier trimestre 2027, la qualification
    Sinolux 2028 passe en priorité haute.


    ## L''observation qui renverserait ce choix

    Une seule : **Sinolux acceptant par écrit, avant J+18, une indexation couvrant les 205 € de coût de
    reprise.** Le risque serait alors porté par celui qui affirme qu''il n''existe pas, et le prix redeviendrait
    réel. Une mesure indépendante sur la ligne Sinolux elle-même, sous 2,3 %, avant J+18, produirait le
    même effet — elle n''est pas disponible.


    ## Actions

    - **Aujourd''hui** — reprise de la ligne budgétaire de 230 400 €, qui ne correspond à aucune économie
    constatée.

    - **J+3** — demande écrite à Kelmar : effort de prix (cible ≥ 1 €/cellule, soit 72 000 €) et bande
    de flexibilité à la baisse sur le volume réservé.

    - **J+3** — demande écrite à Sinolux : clause d''indexation couvrant les 205 €. Réponse exigée à J+12.

    - **J+12** — si Sinolux accepte, le dossier est rouvert en séance extraordinaire.

    - **J+18** — réservation Kelmar, 72 000 unités.

    - **J+21** — protocole de qualification 2028 adressé à Sinolux : test Vertex cofinancé, position de
    fournisseur référencé 2028 si le résultat est ≤ 2,0 % (borne haute 2,3 %), indexation contractuelle
    acquise. Sinolux garde une place et une voie d''entrée réelle ; il ne l''obtient pas sur nos 72 000
    chargeurs et sur sa propre parole.


    ---


    **Deux points à votre arbitrage, non tranchés dans la note :**


    1. L''énoncé indique que les 205 € sont « tout compris » et indépendants du fournisseur. J''ai donc
    retenu que le remplacement gratuit ne les réduit pas (seuil 2,86 %), en donnant la lecture inverse
    en sensibilité (seuil 3,22 %). Le contrat doit lever cette ambiguïté : elle vaut 51 000 € par an.

    2. La possibilité d''une bande de flexibilité à la baisse sur la réservation Kelmar n''est pas connue.
    Si elle existe, une tranche pilote Sinolux 2027 devient discutable ; sans elle, elle ne l''est pas.

    '
