response:
  text: '## Note d''hypothèses (à valider avant remise)


    Trois chiffres du plan sont dérivés, non mesurés. Ils sont explicites pour être contestés :


    - **Capacité batterie ≈ 132 kWh** (22 kW × 6 h de charge complète).

    - **Consommation réelle 0,57 kWh/km** (132 kWh / 232 km mesurés) ; **0,67 kWh/km par 2 °C** (132 /
    197).

    - **Fenêtre de charge nocturne = 12 h** (retour dernier véhicule 18 h, départ premier 6 h). C''est
    l''hypothèse la plus lourde du dossier ; sa mesure est le premier livrable du plan.


    ---


    # Plan d''exécution — conversion électrique de la flotte


    **Conseil du jeudi 13 août 2026 — Direction de l''exploitation**


    ## 1. Ce que ce plan engage


    La conversion est exécutable dans le calendrier voté. Elle ne l''est pas dans le budget voté ni dans
    le calendrier de restitution des diesels prévu par défaut.


    Deux corrections sont indispensables :


    1. **L''infrastructure de charge est sous-dimensionnée d''un facteur 1,6.** Les 8 bornes devisées
    portent la capacité à 60 véhicules, pas à 96. Il en faut **35 au total**, soit 13 de plus que le devis
    actuel.

    2. **Le calendrier de restitution des diesels doit être découplé du calendrier de livraison.** Un
    diesel rendu n''est pas reprenable avant 11 semaines : rendre selon le rythme des livraisons ferme
    le seul repli existant, au moment exact où il est le plus nécessaire.


    Le reste — autonomie, tournées longues, hiver — se traite par le plan de transport et coûte peu.


    ## 2. Le point dur n''est pas l''autonomie, c''est la recharge


    Une tournée moyenne de 168 km consomme 96 kWh, soit **4 h 20 de borne** ; **5 h 05 par 2 °C**. À 96
    véhicules en hiver, le besoin est de **490 heures-borne par nuit**.


    | Configuration | Heures-borne / nuit (12 h) | Véhicules servis (mi-saison) | Véhicules servis (hiver)
    |

    |---|---|---|---|

    | 14 bornes (actuel) | 168 | 38 | 33 |

    | 22 bornes (+ devis 210 k€) | 264 | 60 | **51** |

    | 35 bornes (cible) | 420 | 96 | 82 |

    | 41 bornes | 492 | 96 | 96 |


    Deux conséquences directes :


    - **Les 8 bornes devisées ne sont pas une option, elles sont le minimum pour la subvention.** 60 véhicules
    roulants au 31 janvier, en hiver, demandent 306 heures-borne. 22 bornes en fournissent 264. **Le seuil
    de subvention n''est pas atteignable sans allonger la fenêtre de charge au-delà de 12 h.** C''est
    le point à mesurer en priorité.

    - **La tranche 3 conditionne décembre.** Sans elle, 36 véhicules livrés ne peuvent pas charger, donc
    ne roulent pas — 36 tournées découvertes par jour, 32 400 € par jour.


    **Risque non chiffré, à lever sous 15 jours :** 35 bornes représentent ~385 kW appelés par plateforme.
    La puissance souscrite actuelle des deux sites n''est pas connue de l''exploitation. Un renforcement
    de raccordement se compte en mois, pas en semaines, et n''est pas dans le devis de 210 k€. **C''est
    le seul point du dossier capable de faire échouer le calendrier sans recours.**


    ## 3. Les tournées longues


    197 km d''autonomie hivernale contre 240 km pour la plus longue tournée : l''écart n''est pas rattrapable
    par la conduite. L''essai le confirme — 11 recharges non prévues sur 120 tournées, **toutes au-dessus
    de 190 km**, en mars, donc hors du pire des conditions.


    La part des 96 tournées dépassant 190 km n''est pas au dossier. Elle est extractible du système d''exploitation
    en 48 h. Borne basse déduite de l''essai : **au moins 9 tournées par jour**, soit 8 100 € par jour
    si rien n''est fait.


    Le traitement est le plan de transport, pas le véhicule :


    - **Seuil d''affectation électrique : 185 km d''avril à octobre, 165 km de novembre à mars.** Toute
    tournée au-dessus reste diesel ou est re-découpée.

    - **Préchauffage à la borne, véhicule branché** (gain attendu 10 à 15 km en hiver) et éco-conduite.
    Mesuré, pas supposé : le seuil ne bouge qu''après validation sur 4 semaines.

    - **Option à chiffrer : 2 bornes DC 60 kW par plateforme** pour un appoint de 45 min en mi-journée.
    Elles rendent les tournées de 240 km faisables sans re-découpage et déchargent la nuit. À comparer
    au coût du re-découpage, qui ajoute 3 à 4 tournées par jour — donc des véhicules et des conducteurs.


    ## 4. Le matelas diesel


    C''est le levier le plus rentable du dossier et il est sous-utilisé.


    Prolonger un diesel coûte **480 € par mois**. Une tournée non terminée coûte **900 €**. Un diesel
    prolongé est rentable dès qu''il évite **une tournée ratée tous les deux mois**. Le rapport est écrasant,
    et il joue contre le calendrier de restitution par défaut.


    **Règle proposée : un diesel n''est rendu qu''après que l''électrique qui le remplace a terminé 15
    tournées consécutives sans recharge non prévue et sans retour sous 15 % de charge.** Le préavis de
    prolongation de 30 jours est donné par défaut, chaque mois, pour le lot suivant ; il est levé seulement
    si la preuve de service est acquise.


    Coût du matelas, scénario central (36 véhicules maintenus en moyenne 4 mois) : **69 000 €**. Plafond
    demandé au conseil : **150 000 €**.


    ## 5. Calendrier


    | Date | Action | Responsable |

    |---|---|---|

    | **14 août** | Commande ferme tranche 2 (8 bornes, 210 k€). Demande de puissance auprès du gestionnaire
    de réseau, 2 sites. | Technique |

    | **14 août** | Extraction de la distribution des longueurs de tournées et de la fenêtre réelle retour/départ.
    | Exploitation |

    | **28 août** | **Préavis loueur — prolongation du lot 1 (24 diesels) au-delà de fin septembre.**
    Irréversible si manqué. | Achats |

    | **31 août** | Définition écrite de « véhicule roulant » obtenue de la Région. | Direction |

    | **15 sept** | Décision tranche 3 sur données mesurées : 13 bornes fermes, ou dimensionnement révisé.
    | Conseil délégué |

    | **30 sept** | Préavis lot 2. Mise en service des 24 premiers électriques, **concentrés sur une seule
    plateforme**. | Exploitation |

    | **2 oct** | 22 bornes en service. | Technique |

    | **31 oct** | Préavis lot 3. Revue à 48 véhicules. | Exploitation |

    | **15 nov** | Tranche 3 en service. | Technique |

    | **30 nov** | Préavis lot 4. **72 livrés — verrouillage de la marge subvention.** | Direction |

    | **31 janv 2027** | Échéance subvention (620 k€). | — |

    | **31 mars 2027** | Sortie du dernier diesel prolongé. | Achats |


    Les 24 premiers véhicules vont sur **une seule plateforme**, celle au profil de tournées le plus court.
    Répartir 12/12 double les points de fragilité et gaspille la capacité de charge des deux sites.


    ## 6. Pilotage


    Le tableau de bord existant publie déjà par plateforme le taux de tournées terminées et les recharges
    non prévues. Deux indicateurs manquent et sont dérivables de la remontée à 10 minutes :


    - **État de charge au retour** — indicateur avancé : il alerte avant l''échec, pas après.

    - **Véhicules non pleinement chargés à 6 h** — mesure directe de la saturation des bornes.


    | Déclencheur observé | Repli immédiat |

    |---|---|

    | > 2 recharges non prévues / jour / plateforme, 3 jours de suite | Seuil d''affectation abaissé de
    15 km ; gel de la restitution du lot suivant |

    | Taux de tournées terminées < 99 % sur 5 jours glissants | Réaffectation des tournées longues au
    diesel ; prolongation d''un lot supplémentaire |

    | > 6 véhicules non chargés à 6 h | Décalage des départs ; location de bornes mobiles ; arrêt des
    mises en service |

    | Raccordement refusé ou > 8 semaines | Escalade conseil sous 5 jours ; scénario 22 bornes + 36 diesels
    jusqu''en mars |


    ## 7. Budget


    | Poste | Montant |

    |---|---|

    | Bornes tranche 2 (8) — devisé | 210 000 € |

    | Bornes tranche 3 (13) — à deviser | ~341 000 € |

    | Bornes DC mi-journée (option, 4) | à chiffrer |

    | Renforcement raccordement — provision | 150 000 € |

    | Prolongation location (plafond) | 150 000 € |

    | **Total au-delà de la commande de 3,1 M€** | **~851 000 €** |

    | Subvention régionale sécurisée | – 620 000 € |

    | **Exposition nette** | **~231 000 €** |


    À comparer au coût de l''inaction sur le seul trimestre décembre-février : **1,35 M€** de tournées
    non couvertes, plus la subvention perdue.


    ## 8. Le meilleur argument contre ce plan


    *« Vous surdimensionnez. La fenêtre de charge réelle est de 14 h, pas 12 h. Le re-découpage règle
    les tournées longues à coût nul. 22 bornes suffisent. »*


    Il est partiellement fondé et il est testable. À 14 h de fenêtre, 22 bornes servent 60 véhicules en
    hiver — la subvention est sauvée, mais 96 véhicules demandent toujours **35 bornes**, pas 22. Le contre-argument
    déplace la cible de 41 à 35 ; il ne l''annule pas.


    Il justifie en revanche de **fractionner la tranche 3** : engager 6 bornes fermes le 15 septembre,
    et lever l''option sur 7 de plus au 15 octobre sur données réelles. Le coût de l''attente est une
    option ; le coût de l''erreur est un trimestre de service.


    **L''observation qui renverserait ce plan :** une fenêtre de charge mesurée supérieure à 15 h combinée
    à moins de 5 % de tournées au-dessus de 190 km. Les deux mesures sont disponibles sous 5 jours. Si
    elles tombent ainsi, la tranche 3 se réduit à 6 bornes et le matelas diesel à 12 véhicules.


    ## 9. Pire cas et qui l''encaisse


    Décembre-janvier, parc complet, froid, 22 bornes, diesels rendus selon le calendrier par défaut :
    **36 véhicules immobilisés faute de charge, 36 tournées découvertes par jour**, aucun repli avant
    11 semaines. Coût direct 32 400 €/jour, subvention perdue, dommage commercial sur les clients des
    tournées longues.


    Ces clients et les conducteurs concernés n''ont aucun levier sur la décision et en supportent l''intégralité.
    C''est la raison du matelas.


    ## 10. Décisions demandées jeudi


    1. **Commande ferme des 8 bornes (210 k€) et dépôt de la demande de puissance dès le 14 août.**

    2. **Mandat de prolongation locative, plafond 150 000 €, préavis donné par défaut chaque mois.**

    3. **Adoption de la règle de restitution conditionnelle** (15 tournées propres avant de rendre un
    diesel).

    4. **Provision de 491 000 €** (tranche 3 + raccordement), engagement fractionné sur données au 15
    septembre et 15 octobre.

    5. **Délégation au comité de direction** de l''arbitrage tranche 3 aux deux jalons, avec compte rendu
    au conseil suivant.

    '
