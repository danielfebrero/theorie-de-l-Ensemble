response:
  text: '# Note au conseil — séance de vendredi


    **Objet : arbitrage Sedamex (A) / Nordwerk (B) — horizon 18 mois**

    **De : la direction générale**


    ---


    ## 1. Recommandation


    **Je recommande l''option B — installation de la ligne Nordwerk**, sous réserve des trois vérifications
    listées au § 4.


    ## 2. Ce qui fonde ce choix


    **L''espérance.** B rapporte 0,6 × 900 − 0,4 × 400 = **+380 k€**, contre 200 k€ garantis pour A. En
    différentiel — puisque les options sont exclusives — choisir B c''est gagner 700 k€ de plus dans 60
    % des cas et perdre 600 k€ de plus dans 40 % : **+180 k€ d''espérance**.


    **La robustesse.** Le seuil d''indifférence entre A et B se situe à **46 % de probabilité de succès**.
    Notre bureau d''études estime 60 %. Il faudrait donc que son estimation soit surévaluée de près de
    14 points pour que la recommandation bascule. La décision ne repose pas sur la précision du chiffre,
    mais sur une marge d''erreur.


    **Le test de ruine — le seul qui compte vraiment.** Dans la branche défavorable :


    | | Aujourd''hui | Après échec |

    |---|---|---|

    | Fonds propres | 3,4 M€ | **3,0 M€** (covenant : 1,2 M€) |

    | Trésorerie | 2,6 M€ | **2,2 M€** (≈ 13 mois de masse salariale) |

    | Dette nette | 0 | 0 |


    La perte maximale représente **11,8 % des fonds propres**. Pour rompre le covenant bancaire, il faudrait
    détruire 2,2 M€ de fonds propres, soit **5,5 fois le plafond contractuel de perte**. Aucun scénario
    d''échec technique prévu au contrat ne s''approche de ce niveau.


    **L''architecture juridique.** Pas de caution personnelle, pas de défaut croisé, pas de sûreté sur
    l''actif industriel, carnet de commandes non gagé. Le risque est **cloisonné** : un échec Nordwerk
    reste un échec Nordwerk. C''est précisément ce que le plafond de 400 k€ achète — il convertit l''absence
    de clause de sortie en un nombre connu à l''avance. L''irréversibilité serait un argument décisif
    si la perte était ouverte ; elle est bornée.


    ## 3. Réponse à l''objection du directeur financier


    Je partage sans réserve son principe : **on ne joue pas la maison.** C''est exactement pour cette
    raison que je recommande B — ce pari *ne peut pas* prendre la maison. Après un échec plein, l''entreprise
    conserve 3,0 M€ de fonds propres, 2,2 M€ de trésorerie, zéro dette et son carnet de commandes intact.
    Une décision qui, dans son pire cas documenté, laisse l''entreprise solvable, liquide et conforme
    à ses covenants n''est pas une mise sur la maison : c''est une allocation de 12 % des fonds propres.


    Sur **Tremay** : un dépôt de bilan est une observation, pas un taux de base — nous en avons onze,
    documentées. Et l''inférence porte sur la mauvaise variable. Tremay n''a pas fait faillite parce qu''une
    ligne neuve a échoué ; une ligne qui échoue coûte le prix de la ligne. Une entreprise meurt de la
    *structure* du financement : endettement, cautions, défaut croisé, nantissement. Notre montage est
    l''inverse point par point. Je propose que nous vérifiions ce point factuellement avant vendredi (§
    4) : si Tremay avait notre structure de bilan et notre plafond de perte, mon raisonnement tombe.


    Enfin, le coût du refus n''est pas nul. Dans 60 % des futurs, dire non coûte 700 k€ et laisse l''entreprise,
    dans dix-huit mois, exactement là où elle est : dépendante d''une marge de sous-traitance.


    ## 4. Conditions préalables à la signature


    1. **Confirmer que le plafond de 400 k€ est tout compris** — pénalité, démontage, remise en état,
    immobilisation de site. Toute charge hors plafond doit être chiffrée avant vendredi ; elle entre dans
    la branche défavorable.

    2. **Éprouver la base des 60 %.** Onze cas est un échantillon étroit : l''intervalle de confiance
    descend en dessous du seuil de 46 %. Je demande au bureau d''études d''identifier les deux ou trois
    facteurs qui séparent les installations réussies des échouées, et de positionner Verlaq sur chacun.
    Si nous sommes du mauvais côté, je retire cette recommandation.

    3. **Vérifier les circonstances de Tremay** (endettement, sûretés, cautions).


    **Mandat de suivi proposé au directeur financier :** jalons techniques trimestriels, test de covenant
    à chaque clôture, et autorité pour bloquer tout investissement interne complémentaire non prévu au
    contrat. Nous ne pouvons pas sortir avant l''échéance ; nous pouvons refuser d''aggraver.


    ## 5. Décision demandée


    Approbation de l''option B, la signature étant subordonnée à la levée des trois conditions du § 4.


    ---


    Deux remarques hors note, pour vous :


    - **La condition n° 2 est réelle, pas rhétorique.** Avec 11 observations, une fréquence de 60 % (≈
    7 succès) porte un intervalle de confiance à 95 % d''environ 31 %–83 %. La borne basse passe sous
    le seuil d''indifférence de 46 %. La recommandation tient parce que la perte est plafonnée et non
    létale, pas parce que le 60 % serait solide. Si votre bureau d''études ne peut pas défendre la comparabilité
    des onze cas, la note devient beaucoup plus fragile — et votre DAF aura eu raison sur le fond.

    - **Ne cherchez pas à gagner le débat contre lui.** Il a formulé le bon critère ; c''est son application
    au cas d''espèce qui échoue. Lui confier le mandat de suivi du § 4 vaut mieux qu''un vote acquis contre
    lui.

    '
