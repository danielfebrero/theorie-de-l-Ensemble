response:
  text: '# Position de la présidence — séance du jeudi


    ## 1. Ce que je propose, en une phrase


    Je n''arbitre pas entre 240, 150 et 180. Je pose **une formule de partage qui s''applique à n''importe
    quel débit**, je gèle 20 L/s au titre de l''incertitude de mesure, je garantis immédiatement et sans
    condition le socle sanitaire de Ferney, et je fais de la donnée parcellaire le prix d''accès à une
    dotation individuelle. Le fonds de 600 000 € n''achète pas de l''eau : il achète de la mesure, des
    compteurs, la réparation du réseau et la survie des exploitations les plus exposées.


    ---


    ## 2. Les deux choses sur lesquelles je ne transige pas


    **Le débit réservé de 180 L/s.** Je n''ai pas le pouvoir de l''abaisser — c''est un arrêté préfectoral
    — et je ne le demanderai pas. Le rapport du 12 juin décrit la seule perte du dossier qui ne se rattrape
    pas : deux frayères asséchées et une population de truites qui ne se reconstitue pas en une décennie.
    Une récolte perdue se replante l''an prochain ; une régie sous tension se réapprovisionne par citerne
    ; une frayère détruite ne revient pas. Si la préfecture envisage une dérogation au titre de la crise,
    je consigne dès maintenant mon opposition motivée par le rapport hydrobiologique.


    **Le socle sanitaire de Ferney : 45 L/s, intangible.** Aucun scénario, aucune dégradation du débit
    ne l''entame. 45 L/s représentent 3 888 m³/jour, soit 423 L/habitant/jour — largement au-dessus des
    besoins de consommation, d''hygiène, de l''EHPAD, des écoles et de la défense incendie. C''est la
    réponse à la régie, donnée avant toute discussion, puisqu''elle en fait la condition de sa présence.


    ---


    ## 3. Le chiffre que personne n''a posé sur la table


    La régie prélève **150 L/s pour 9 200 habitants**, soit 12 960 m³/jour, soit **1 409 litres par habitant
    et par jour**. La moyenne française domestique est de l''ordre de 150 L. Nous sommes à environ neuf
    fois cette valeur.


    Il n''y a que trois explications possibles, et aucune n''est neutre :


    1. **Le périmètre desservi est plus large que « Ferney »** — alors qu''on nous donne la population
    réelle, et le calcul du socle change ;

    2. **Le rendement du réseau est très dégradé** — alors le plus gros gisement d''eau mobilisable du
    bassin n''est ni dans les champs ni dans la rivière, il est dans les canalisations ;

    3. **Un ou plusieurs gros consommateurs non domestiques sont inclus dans les 150 L/s** — alors ils
    bénéficient depuis toujours de la protection due à l''eau potable, et ils doivent être traités comme
    ce qu''ils sont : un usage économique, à côté de l''agriculture, pas au-dessus d''elle.


    Je ne tranche pas entre les trois : je n''ai pas la donnée. Mais je refuse de rationner 34 exploitations
    sur la foi d''un chiffre que je n''ai jamais vérifié dans la colonne d''en face. Le titre de la presse
    — « les paysans ou les robinets » — est arithmétiquement faux : le plus gros volume non examiné du
    dossier est *à l''intérieur* de la colonne robinets.


    **Ce que cela change pour les maraîchers, et je le dis devant eux : chaque litre retrouvé dans le
    réseau leur revient.** C''est écrit dans la formule, pas promis en séance.


    ---


    ## 4. Ce que vaut réellement le chiffre de 410 L/s


    Une seule station, étalonnée pour la dernière fois en 2023. Une dérive de 10 % — ordinaire sur une
    station non ré-étalonnée — représente 41 L/s, soit **le quart du déficit que nous prétendons répartir**.
    Nous sommes en train de faire une arithmétique au litre près sur une mesure dont nous ignorons l''erreur.


    D''où : **20 L/s gelés**, non attribués, jusqu''au second jaugeage. Ce n''est pas une réserve politique,
    c''est la marge d''erreur rendue explicite. Un jaugeage indépendant sur une seconde section coûte
    quelques milliers d''euros et demande une semaine. Nous avons 600 000 € et trois semaines avant la
    pluie. Ne pas le faire serait le seul choix véritablement indéfendable du dossier.


    **Échéance : J+10.** Si la mesure confirme 410 ou plus, les 20 L/s partent à l''irrigation. Si elle
    révèle un débit inférieur, la marge absorbe l''écart en premier — c''est exactement à ça qu''elle
    sert.


    ---


    ## 5. La formule de partage


    Elle s''applique au débit mesuré, quel qu''il soit, sans nouvelle négociation :


    | Rang | Affectation | Règle |

    |---|---|---|

    | 1 | Débit réservé | 180 L/s — veto, servi en premier |

    | 2 | Marge métrologique | 20 L/s — gelés jusqu''au second jaugeage |

    | 3 | Socle sanitaire Ferney | 45 L/s — intangible |

    | 4 | Reliquat | 40 % régie au-dessus du socle / 60 % irrigation |


    **Au débit actuel de 410 L/s :**


    | Usage | Attribution | Demande initiale |

    |---|---|---|

    | Rivière | 180 | 180 |

    | Marge gelée | 20 | — |

    | Eau potable (45 socle + 66) | 111 | 150 |

    | Irrigation | 99 | 240 |


    Cette formule tourne aussi dans la crise, et c''est son intérêt : à 340 L/s, elle donne 83 à la régie
    et 57 à l''irrigation, sans réunion d''urgence. À 300 L/s : 67 et 33. **En dessous de 225 L/s, toute
    irrigation cesse, la régie passe au socle et je saisis la préfecture** — parce qu''à ce niveau le
    débit réservé lui-même n''est plus tenable et que la décision sort de ma compétence.


    À J+21, après audit du réseau, la clé du rang 4 est révisée à 25 % / 75 % en faveur de l''irrigation,
    sauf si la régie démontre que son prélèvement est incompressible.


    ---


    ## 6. Ce que je dis aux maraîchers, et qui sera difficile à entendre


    **99 L/s n''irriguent pas 620 hectares. Ils en irriguent correctement environ 250.**


    Étalés sur les 620 ha, 99 L/s représentent 78 mm sur huit semaines, soit 1,4 mm/jour, contre 5 à 6
    mm/jour d''évapotranspiration. C''est une dose qui ne sauve rien nulle part. Concentrés sur 250 ha,
    ce sont 194 mm, soit 3,5 mm/jour : une campagne serrée mais une récolte.


    Votre chiffre de 4,1 M€ suppose un effondrement au-dessous de 240 L/s. Il est probablement juste **par
    parcelle** — un maraîchage sous-irrigué au stade de grossissement est perdu, pas diminué. Il est faux
    **par exploitation**, parce qu''il suppose que vous étalerez la pénurie au lieu de choisir. Je ne
    vous imposerai pas ce choix : **la dotation est un volume, pas un débit.** Vous décidez quelles parcelles
    vous sauvez, à quel stade, à quel moment. Je ne dispose d''aucune donnée pour le décider à votre place,
    et je ne prétendrai pas le contraire.


    **Répartition entre exploitations — le point le plus contestable de ma position, et je l''assume comme
    tel.** Volume total sur huit semaines : 483 840 m³, réparti à **40 % en part fixe égale par exploitation
    (5 692 m³) et 60 % à l''hectare (468 m³/ha)**.


    | | Part fixe | Part surface | Total | Par ha |

    |---|---|---|---|---|

    | Exploitation de 11 ha | 5 692 | 5 338 | 11 030 m³ | 967 m³/ha |

    | Exploitation de 50 ha | 5 692 | 23 410 | 29 102 m³ | 582 m³/ha |


    Les six plus grandes passent de 48 % du volume (au prorata pur) à **36 %**. La part fixe n''est pas
    un principe d''égalité : c''est un **plancher de survie**. En dessous d''un certain volume, une exploitation
    ne produit plus rien du tout, et une exploitation qui cesse ne redémarre pas. Une mauvaise année se
    traverse ; une liquidation, non. Les six grandes disposent d''une capacité d''absorption qui reste
    à vérifier — si elles documentent que leur propre défaillance est également irrécupérable, c''est
    la clé 40/60 que je révise en premier.


    **Contrepartie immédiate : la fenêtre de déclaration, sept jours.** Toute exploitation qui déclare
    ses cultures, ses surfaces, ses stades végétatifs, son système d''irrigation **et ses ressources alternatives**
    (retenue, forage, autre prise) accède à une dotation individuelle ajustée à ses stades critiques.
    Celles qui ne déclarent pas restent au barème forfaitaire ci-dessus. Vous détenez la donnée que la
    commission n''a pas ; elle vaut de l''eau, à vous de la faire valoir. Aucun prélèvement déclaré honnêtement
    dans ces sept jours ne fera l''objet d''une sanction rétroactive.


    ---


    ## 7. Quotas globaux ou individuels : je fais les deux, dans cet ordre


    Le règlement m''ouvre les deux voies. J''arrête **jeudi un volume global par usage**, parce que c''est
    la seule décision que je peux prendre légalement sans donnée parcellaire et qui soit opposable immédiatement.
    Des quotas individuels arrêtés aujourd''hui, sans culture, sans stade, sans compteur, seraient annulés
    au premier recours — et ils le mériteraient.


    Les quotas individuels arrivent **par la déclaration volontaire à J+7 et par la télérelève à J+21**.
    D''ici là, l''exécution passe par un **tour d''eau sectorisé** avec créneaux horaires : contrôlable
    à la vanne et à l''œil, sans compteur. Sanction du dépassement : perte de la part fixe sur la période
    suivante et transmission à la police de l''eau.


    ---


    ## 8. La règle de sortie — et pourquoi celle de 2022 a échoué


    Le 9 août, un orage porte le débit à 520 L/s. Les prélèvements reprennent intégralement le 11. Le
    15, on est à 340. **Un pic de 110 L/s dissipé en quatre jours** : c''est la meilleure mesure dont
    nous disposions de ce qu''un orage recharge réellement, c''est-à-dire presque rien. Le ruissellement
    n''est pas la nappe.


    Le défaut de 2022 n''est pas le seuil, c''est sa **symétrie** : même critère pour restreindre et pour
    lever, sur une valeur instantanée, en tout ou rien.


    Nouveau dispositif :


    - **Lever** : moyenne glissante sur **7 jours** ≥ 520 L/s. Jamais sur une valeur instantanée, jamais
    sur un événement pluvieux unique.

    - **Par paliers** : +20 L/s à l''irrigation par période de sept jours, et seulement si la moyenne
    glissante tient sur toute la période.

    - **Cliquet** : retour automatique au palier inférieur si la moyenne à **3 jours** descend sous 450
    L/s — sans nouvelle délibération, la commission n''a pas à se réunir pour appliquer ce qu''elle a
    déjà décidé.

    - **Asymétrie assumée** : on restreint sur 3 jours, on relâche sur 7. L''erreur coûteuse n''est pas
    de restreindre un jour de trop.


    ---


    ## 9. Emploi des 600 000 € (dossier déposé lundi, délai de quinze jours)


    | Poste | Montant | Effet attendu |

    |---|---|---|

    | Second jaugeage, ré-étalonnage de Sarcelle, station de contrôle à l''aval | 60 000 € | Lève l''incertitude
    de 20 L/s, rend le débit réservé vérifiable |

    | 34 compteurs + télérelève sur prises agricoles | 45 000 € | Rend tout quota exécutoire ; acquis
    durable |

    | Régie : sectorisation, mesure de débit nocturne, réparations d''urgence | 180 000 € | Seul poste
    susceptible de libérer plusieurs dizaines de L/s en trois semaines |

    | Soutien aux exploitations, plafonné, ciblé sur le risque de défaillance | 280 000 € | Évite les
    liquidations, pas les pertes |

    | Réserve : contentieux, citernage EHPAD | 35 000 € | |


    **Je dis clairement ce que ce fonds ne fait pas.** 280 000 € pour environ 370 hectares sortis d''irrigation,
    c''est 757 €/ha, contre des marges brutes maraîchères d''un tout autre ordre. **Le fonds ne compense
    pas la perte, il évite la liquidation.** La compensation, si elle existe, viendra du régime des calamités
    agricoles, du dégrèvement de taxe foncière et de l''activité partielle pour les 90 saisonniers : je
    dépose ces dossiers en parallèle, cette semaine, et j''en rends compte à chaque séance.


    **Pour l''EHPAD**, je ne veux pas d''un plan qui s''active après l''incident : contrat de citernage
    pré-signé cette semaine, avant tout besoin. Coût marginal, et cela retire de la salle l''argument
    le plus lourd — qui est aussi le plus légitime.


    ---


    ## 10. Le meilleur argument contre ma position


    Il faut qu''il soit dit ici, et pas seulement jeudi par quelqu''un d''autre :


    > *« Vous jouez une récolte sur un audit que vous n''avez pas fait. Les 20 L/s gelés et la réduction
    progressive du potable sont des reconnaissances de dette : les maraîchers touchent 99 L/s tout de
    suite et des promesses ensuite, et quand votre recherche de fuites aboutira la culture sera morte.
    Au passage vous rationnez de fait une régie d''eau potable, ce qu''aucun texte ne vous autorise à
    faire. »*


    Ce qui tient dans ma réponse : les échéances sont **à J+10 et J+21**, à l''intérieur de la fenêtre
    de huit semaines, pas après ; les 99 L/s ne sont pas étalés mais concentrés au choix des exploitants,
    ce qui sauve 250 ha entiers au lieu d''en perdre 620 partiellement ; et je ne rationne pas la régie
    par décret — j''arrête un volume global par usage, ce que le règlement permet, en garantissant le
    socle sanitaire sans condition et en finançant les travaux qui rendent la réduction physiquement possible.


    Ce qui ne tient pas : **si le second jaugeage n''est pas livré à J+10, toute la construction perd
    sa légitimité.** Je ne demanderai pas à trois parties d''accepter une répartition au litre près sur
    une mesure que je n''aurai pas vérifiée quand je m''y étais engagé. C''est la première chose que j''attends
    qu''on me reproche si elle glisse.


    ---


    ## 11. Ce qui renverserait ma position


    - **Le jaugeage montre une surestimation > 10 %** (débit réel ≤ 370) → la formule se resserre d''elle-même,
    l''irrigation tombe autour de 65 L/s, et je convoque une séance extraordinaire : ce n''est plus un
    partage, c''est un arrêt.

    - **Le jaugeage montre une sous-estimation** (débit réel ≥ 450) → 40 L/s de plus, dont 24 à l''irrigation
    : l''essentiel du conflit disparaît sans que personne ait cédé.

    - **Le périmètre de la régie est réellement de plusieurs dizaines de milliers d''habitants, ou son
    prélèvement est contractuellement protégé** → ma thèse du gisement réseau s''effondre, 111 L/s deviennent
    un plancher et non un plafond, et je dois l''annoncer aux maraîchers avant qu''ils ne l''apprennent
    autrement.

    - **Les déclarations révèlent des stades critiques concentrés sur les trois prochaines semaines**
    → l''allocation doit être avancée dans le temps, pas lissée sur huit semaines.

    - **Les six grandes exploitations documentent un risque de défaillance équivalent à celui des petites**
    → je révise la clé 40/60 vers 25/75.


    ---


    ## 12. Ce que je fais lundi matin


    1. Commande du second jaugeage et du ré-étalonnage de Sarcelle — **avant toute autre dépense**, livraison
    contractuelle à J+10.

    2. Demande écrite à la régie : périmètre exact desservi, population, rendement de réseau, liste des
    abonnés non domestiques > 5 m³/jour. Réponse sous sept jours.

    3. Ouverture de la fenêtre de déclaration maraîchère, formulaire d''une page, sept jours.

    4. Dépôt du dossier de fonds départemental.

    5. Contrat de citernage EHPAD signé.


    ---


    ## 13. Aux trois parties, en trois phrases


    **À la régie** : votre socle sanitaire est garanti avant toute discussion, sans condition et à tous
    les débits — en échange je veux vos chiffres de réseau, parce que je ne peux pas rationner des champs
    sur la foi d''un prélèvement que je n''ai jamais examiné.


    **Aux maraîchers** : vous obtenez moins que ce que vous demandez et je ne vous dirai pas le contraire
    ; vous obtenez en revanche un volume dont vous décidez l''usage, une part fixe qui protège les plus
    petits, une formule qui vous reverse automatiquement chaque litre retrouvé dans le réseau, et une
    règle de reprise qui ne s''effondrera pas au premier orage comme en 2022.


    **À la rivière**, qui n''a personne dans la salle : les 180 L/s ne sont pas ma variable d''ajustement,
    parce qu''ils sont la seule ligne du dossier dont le franchissement ne se répare pas.

    '
