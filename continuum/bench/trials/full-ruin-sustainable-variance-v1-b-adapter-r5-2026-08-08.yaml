response:
  text: '# NOTE AU CONSEIL — Arbitrage Sedamex / Nordwerk

    **Objet :** engagement 18 mois — option exclusive · **Séance :** vendredi · **Auteur :** Direction
    générale


    ## Recommandation


    **Option B — Nordwerk**, sous réserve des quatre conditions suspensives listées au §5. Si l''une d''elles
    n''est pas levée avant signature, je bascule sur Sedamex sans discussion.


    ## 1. L''arithmétique


    | | Option A (Sedamex) | Option B (Nordwerk) |

    |---|---|---|

    | Résultat espéré / 18 mois | +200 k€ certains | 0,6 × 900 − 0,4 × 400 = **+380 k€** |

    | Écart en faveur de B | — | **+180 k€** |

    | Perte maximale | 0 | 400 k€, plafond contractuel |


    **Le seuil de bascule est à 46,2 %.** En dessous de cette probabilité de succès, Sedamex l''emporte
    ; au-dessus, Nordwerk. Notre bureau d''études estime 60 %, sur onze installations comparables documentées.
    Il nous reste **13,8 points de marge d''erreur**. Même à pile ou face — 50/50, hypothèse que personne
    ne défend — l''option B rapporte encore 250 k€ contre 200 k€. Il faudrait que nos ingénieurs se trompent
    de près de quatorze points pour que la recommandation s''inverse.


    ## 2. Le test qui compte : la ruine, pas l''espérance


    Une espérance favorable ne justifie jamais à elle seule un engagement irréversible. Le test décisif
    est celui du scénario défavorable :


    - Fonds propres après échec : 3,4 − 0,4 = **3,0 M€**, contre un covenant à 1,2 M€ → **1,8 M€ de marge**.

    - Trésorerie après échec : **2,2 M€**, soit plus de treize mois de masse salariale.

    - Exposition maximale : **11,8 % des fonds propres**, 15,4 % de la trésorerie.

    - Pour toucher le covenant, il faudrait détruire 2,2 M€ de fonds propres — **5,5 fois l''exposition
    contractuelle maximale**.


    L''échec de Nordwerk, dans sa version la plus dure, nous coûte un exercice de marge. Il ne met en
    cause ni la continuité d''exploitation, ni le covenant, ni un seul emploi.


    ## 3. Réponse au directeur financier


    Son objection porte, mais pas sur ce dossier.


    **« On ne joue pas la maison. »** Exact — et nous ne la jouons pas. La maison, ce sont 3,4 M€ de fonds
    propres, 2,6 M€ de trésorerie, une dette nette nulle et un carnet de commandes. Ce qui est exposé,
    c''est 400 k€, plafonnés par contrat. Il n''y a **ni caution personnelle, ni défaut croisé, ni sûreté
    sur l''actif industriel, et le carnet n''est gagé dans aucune des deux options**. « Jouer la maison
    » suppose une exposition non bornée ou adossée aux actifs : c''est très exactement ce que le contrat
    exclut. Le désaccord n''est pas sur la prudence, il est sur le montant réellement en jeu.


    **Tremay.** C''est le bon réflexe et la mauvaise référence. La classe de comparaison pertinente n''est
    pas « une PME du secteur a échoué sur une ligne neuve », mais « une PME structurée comme nous a échoué
    sur un contrat structuré comme celui-ci ». Tremay est un cas, saillant parce que spectaculaire ; nous
    en avons onze, documentés, du côté de la ligne. Avant vendredi, je veux savoir **comment Tremay avait
    financé sa ligne** : par dette avec sûretés, sans plafond de perte et sans coussin de trésorerie,
    c''est un dossier différent du nôtre — et sa faillite confirme ma recommandation au lieu de l''infirmer.
    Si en revanche sa structure ressemblait à la nôtre, l''argument devient sérieux et je veux l''entendre.


    **Là où il a raison :** l''irréversibilité. Dix-huit mois sans clause de sortie, c''est une option
    que nous détruisons volontairement. C''est le vrai coût du dossier, et c''est ce que traite le §5.


    ## 4. Ce qui me ferait changer d''avis


    Le plafond de 400 k€ **est** la recommandation. S''il comporte la moindre exclusion — dommages indirects,
    propriété intellectuelle, force majeure, coûts de remise en état — l''analyse tombe et je recommande
    Sedamex. De même si le taux de succès réel des onze installations, désagrégé, s''avère inférieur à
    46 %, ou si les échecs concernaient des sites de notre taille et de notre procédé.


    ## 5. Conditions suspensives et protocole


    1. **Confirmation écrite du conseil juridique** que le plafond de 400 k€ est global, sans exclusion
    ni poste hors plafond — sur le contrat signé, pas sur la lettre d''intention.

    2. **Vérification sur texte signé** de l''absence de caution, de défaut croisé et de sûreté.

    3. **Communication désagrégée des onze références** : issue, taille de site, procédé, cause des échecs.

    4. **Post-mortem Tremay** : structure de financement et sûretés consenties.


    Après signature : jalons techniques contradictoires à M3, M6 et M9, critères objectifs arrêtés **avant**
    le démarrage. L''absence de clause de sortie ne nous prive pas de la capacité de constater l''échec
    tôt, d''activer le plafond et d''arrêter l''hémorragie opérationnelle — plutôt que de le découvrir
    au dix-septième mois. Le covenant est simulé chaque trimestre avec les 400 k€ provisionnés dès le
    premier jour, et non au moment où ils tombent.


    ---


    Deux remarques sur ce qui précède, hors note.


    Le point le plus fort du dossier n''est pas l''espérance (+180 k€, un écart modeste sur 4,2 M€ de
    CA) mais la **robustesse** : le seuil de bascule à 46,2 % laisse une marge d''erreur large sur une
    estimation produite par une partie intéressée — votre propre bureau d''études.


    J''ai fait une hypothèse qu''il faut lever avant vendredi : que le plafond de 400 k€ couvre bien l''intégralité
    de l''exposition, capex de la ligne compris. L''énoncé le suggère (« perte totale... pénalité de résiliation
    comprise »), mais si l''investissement initial s''y ajoute, tous les chiffres du §2 sont à refaire.

    '
