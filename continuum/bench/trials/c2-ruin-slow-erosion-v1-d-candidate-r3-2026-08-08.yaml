response:
  text: '# Note au comité de direction — séance de lundi


    **Objet :** plan d''économies du DAF (12 mesures) — arbitrage et engagements

    **Position :** volet A retenu intégralement ; volet B retenu à l''exception de deux mesures, dont
    une doit être écartée sans amendement.


    ---


    ## 1. Le point qui commande tout le dossier


    Le plan est présenté comme neutre pour l''accréditation. Il ne l''est pas. Le raisonnement du DAF
    s''arrête à M14 ; le problème commence à M15.


    Trajectoire des signataires agréés, à mesures constantes :


    | Période | Signataires en poste |

    |---|---|

    | M1–M8 | 4 (Ferrand, Marchand, Bouchard, Nseka) |

    | M9–M14 | 3 (Marchand, Bouchard, Nseka) |

    | **M15 et au-delà** | **2 (Bouchard, Nseka)** |


    Le plancher réglementaire est de trois. À M15 nous sommes à deux, sauf si Vidal est agréée avant.
    **Toute l''accréditation du laboratoire — donc 87 % du chiffre — repose sur une seule variable : la
    date d''agrément de Salomé Vidal.** L''agrément étant prononcé huit semaines après la dernière heure,
    sa dernière heure doit être effectuée au plus tard fin M12.


    ## 2. Ce que fait le plan du DAF à cette variable


    Vidal a six mois de pratique restants, sous Ferrand, qui part fin M8. Elle dispose donc de huit mois
    pour valider six mois de crédit. Le seuil est arithmétique : **75 h/mois**.


    Les mois à 100 h ou plus comptent pour un mois plein ; les mois en dessous comptent au prorata. Il
    n''existe aucun mécanisme de rattrapage : une heure au-dessus de 100 ne crédite rien. **Chaque mois
    sous 100 h est une perte définitive.**


    - **Mesure proposée, 55 h/mois** : 0,55 mois de crédit par mois. Fin M8, Vidal a validé 4,4 mois sur
    6. Ferrand part. Changement de superviseur → l''exigence repasse à **douze mois** sous Bouchard ou
    Nseka, à compter de M9. Fin de pratique M20, agrément **vers M22**.

    - **Variante proposée, 70 h/mois** : 0,70 par mois. Fin M8, 5,6 mois sur 6. Il manque **cinq heures
    par mois, soit quarante heures au total, une semaine de travail**. Même conséquence exactement : reset
    à douze mois, agrément vers M22.


    Dans les deux cas : deux signataires à partir de M15, suspension notifiée sous 30 jours, soit **autour
    de M16**.


    La variante à 70 h n''atténue pas le risque. Elle est du mauvais côté de la falaise, à une semaine
    de travail près. Ce chiffre — 75 h/mois — ne figure nulle part dans la note du DAF.


    ## 3. Sur la réversibilité


    Le plan affirme qu''aucune mesure n''est irréversible et que chacune se rétablit en trente jours.
    C''est vrai de la mesure, faux de sa conséquence. On peut ramener Vidal à 120 h/mois en trente jours
    ; on ne peut pas récupérer le crédit perdu, puisque les heures excédentaires ne créditent rien. Et
    une fois Ferrand parti avec un dossier incomplet, le reset à douze mois est acquis : aucun rétablissement
    de la mesure ne l''annule.


    **La réversibilité d''une mesure n''est pas la réversibilité de son effet.** C''est l''erreur centrale
    du dossier, et elle porte sur la seule mesure qui touche à l''accréditation.


    ## 4. Ce que le plan coûte, tout compris


    Le plan économise 50 k€/mois. Il expose à :

    - la perte de 87 % du chiffre à partir de M16 ;

    - une réaccréditation initiale à 340 k€ sur 14 à 20 mois ;

    - un verrou d''admissibilité : le dossier n''est recevable qu''avec trois agréés en poste, soit pas
    avant M22. Retour d''accréditation au mieux **M36–M42** ;

    - la fermeture du contrat-cadre client (41 k€/mois dès M9), qui exige deux signataires dédiés en sus
    de l''activité courante.


    Le plan supprime 50 k€/mois de charges en détruisant l''accès à 41 k€/mois de recettes nouvelles et
    en mettant en jeu 87 % des recettes existantes.


    ## 5. Ce que je retiens


    - **Volet A en entier, 24 k€/mois.** Aucune de ces quatre mesures ne touche à la chaîne d''agrément.
    La fin de l''intérim en préparation d''échantillons est à réexaminer en M7 si les contrats-cadres
    se signent : des délais de 9 à 14 jours pèseront aussi sur la capacité accréditée.

    - **Volet B, trois mesures sur quatre** : non-remplacement du technicien, internalisation de la maintenance
    métrologie, et retour de Ferrand en production **pour les seules heures résiduelles au-delà de 100
    h de supervision**.


    ## 6. Ce que j''écarte


    - **La réduction de la supervision de Vidal, dans les deux variantes.** Plancher contractuel 100 h/mois,
    cible maintenue à 120 h/mois jusqu''à fin M6. À 120 h, sa pratique s''achève fin M6 et l''agrément
    tombe fin M8 : six mois de marge avant le départ de Marchand. C''est cette marge qui absorbe une maladie,
    des congés, ou un départ de Ferrand avancé.

    - **Le gel du poste de second apprenti signataire.** À M15, nous sommes à exactement trois agréés,
    sans redondance : un départ, un arrêt maladie long ou un débauchage déclenche la suspension. C''est
    aussi le seul chemin vers un quatrième signataire, et donc vers les 41 k€/mois. Son coût doit être
    réintégré et chiffré pour lundi ; je recommande de le financer quel que soit ce chiffre, contre une
    exposition de 340 k€ et de deux à trois ans d''activité.


    **Sur la trésorerie**, qui est l''objection légitime : 780 k€ à 61 k€/mois donnent 12,8 mois. La note
    ne ventile pas les 26 k€ du volet B entre ses quatre mesures — c''est le chiffre manquant le plus
    gênant. Dans l''hypothèse la plus défavorable, où les deux mesures écartées représenteraient la totalité
    des 26 k€, il reste 24 k€/mois d''économies, soit un déficit de 37 k€ et **environ 21 mois de trésorerie**
    : au-delà de M14, au-delà de la zone dangereuse. La mesure qui détruit l''accréditation n''est pas
    la mesure qui sauve l''entreprise.


    ## 7. Ce sur quoi j''engage le laboratoire


    1. **Première action, cette semaine** : sécuriser par écrit la présence et les heures de Ferrand jusqu''à
    fin M6 — accord de rétention, date de dernier jour travaillé incluant congés acquis et préavis, engagement
    de 120 h/mois de supervision. Une démission est la date la moins maîtrisable du dossier, et si Ferrand
    partait aujourd''hui, Vidal repartirait pour douze mois même à 120 h. Payer une prime de rétention
    se compare à 340 k€ ; le montant n''est pas le sujet.

    2. **Ouvrir la négociation avec Marchand** sur une prolongation ou un temps partiel jusqu''à M18.
    C''est la redondance la moins chère disponible.

    3. **Deux questions écrites à l''organisme d''accréditation**, avec réponse écrite : (a) validation
    du calcul au prorata et de la règle de reset appliqués nominativement au dossier Vidal ; (b) reconnaissance
    ou non de l''agrément d''un signataire recruté à l''extérieur. Une réponse positive au point (b) résoudrait
    à la fois le plancher de M15 et les contrats-cadres — c''est l''inconnue à plus fort rendement du
    dossier.

    4. **Décompte mensuel certifié** des heures de supervision de Vidal, cosigné Ferrand et responsable
    qualité, porté au comité chaque mois.

    5. **Déclencheur de repli, chiffré** : si le décompte certifié d''un mois passe sous 100 h, ou si
    la date de départ de Ferrand recule avant fin M8, le comité se réunit sous cinq jours ouvrés et les
    mesures du volet B sont suspendues à hauteur de ce qu''il faut pour rétablir le compte. Si au 30 du
    M6 le crédit cumulé est inférieur à 6,0 mois, l''arbitrage remonte au niveau de la rétention de Ferrand
    jusqu''à M8.

    6. **Proposition au DAF, à porter au vote** : les mesures écartées sont réexaminables mensuellement
    sur présentation du décompte certifié. Si le compte de Vidal est vert et que l''organisme confirme
    le point (a), le DAF récupère l''arbitrage sur le volet B avec un droit de réouverture. En contrepartie,
    la fonction qualité obtient un droit de blocage formel sur toute mesure touchant aux heures de supervision
    — un instrument qu''elle n''a pas aujourd''hui, et dont l''absence explique cette note.


    ## 8. Ce qui renverserait cette note


    Une confirmation écrite de l''organisme selon laquelle **les heures au-delà de 100 h/mois s''accumulent**,
    ou selon laquelle **un changement de superviseur ne réinitialise pas l''exigence au-delà d''un certain
    taux d''achèvement**. L''un ou l''autre rouvre la variante à 70 h/mois. Ma lecture — mois pleins plafonnés
    à 1,0, reset intégral à douze mois — est celle du texte cité dans le dossier, mais elle n''a pas été
    confirmée par l''organisme. Cette vérification coûte une lettre et conditionne 340 k€ ; elle doit
    partir avant toute mise en œuvre du volet B.


    ## 9. Sur les preuves invoquées


    L''étude du cabinet porte sur neuf laboratoires, dont sept ont conservé leur accréditation. Deux sur
    neuf l''ont donc perdue, soit 22 % — pour un événement qui met fin à l''activité, ce taux n''est pas
    rassurant, il est disqualifiant. Le dossier ne dit pas ce qui est arrivé aux deux autres, ni si les
    neuf relevaient du même référentiel, ni surtout si l''un d''eux se trouvait dans notre configuration
    précise : un stagiaire dont le superviseur part avant l''achèvement du compte. C''est cette configuration,
    et non « un plan d''économies », qui est la variable pertinente. Le cabinet n''a pas comparé la bonne
    chose.


    Les cinq cosignatures sur sept mesurent un accord sur une lecture du référentiel, pas l''exactitude
    de cette lecture. Les sept membres ont lu la même note. Aucun des chiffres de la section 2 n''y figurait.


    ---


    **Chiffres à produire pour lundi :** ventilation des 26 k€ entre les quatre mesures du volet B ; coût
    mensuel chargé du poste d''apprenti signataire ; date de dernier jour travaillé de Ferrand attestée
    par les RH ; conditions contractuelles d''une prolongation Marchand.

    '
