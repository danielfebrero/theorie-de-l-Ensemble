    # Note au comité de direction — Approvisionnement cellules 2027


    **Objet :** arbitrage Kelmar / Sinolux · **De :** Direction des opérations · **Décision demandée :**
    J+15


    ## 1. Décision proposée


    **Réserver la capacité Kelmar à J+18 pour 64 800 unités (90 %), et engager Sinolux à J+21 sur 7 200
    unités (10 %) en lot de qualification tracé.** À défaut d''accord de l''un des deux sur ce partage
    avant J+15 : **100 % Kelmar**.


    Nous ne refusons pas Sinolux. Nous refusons de payer 72 000 unités sur une hypothèse que personne
    n''a mesurée sur notre ligne.


    ## 2. Ce que dit le calcul


    Écart de prix : 72 000 × 3,20 € = **230 400 €**. Coût d''un retour : 205 €, identique quel que soit
    le fournisseur.


    | Taux de retour Sinolux | Retours | Coût retours | Surcoût vs Kelmar | **Résultat net** |

    |---|---|---|---|---|

    | Kelmar (référence, 1,3 %) | 936 | 191 880 € | — | — |

    | 1,1 % (essais Sinolux) | 792 | 162 360 € | −29 520 € | **+259 920 €** |

    | **2,86 % (point mort)** | 2 060 | 422 280 € | +230 400 € | **0 €** |

    | 3,0 % (Ferro) | 2 160 | 442 800 € | +250 920 € | **−20 520 €** |

    | 3,1 % (audit de mars) | 2 232 | 457 560 € | +265 680 € | **−35 280 €** |


    Le gain bascule en perte au-delà de **2,86 %** (230 400 € ÷ 205 € = 1 124 retours supplémentaires
    tolérables, soit +1,56 point). Toute la décision tient dans 1,8 point sur une grandeur que nous n''avons
    jamais mesurée.


    ## 3. Les trois sources n''en font que deux — et une seule est indépendante


    - **Sinolux, 1,1 %** : auto-déclaration du vendeur, sur son protocole, sans contrôle externe. Le seul
    chiffre sous le point mort est celui de la partie intéressée.

    - **Audit sectoriel de mars, 3,1 %** : mesure indépendante, ligne comparable, même fournisseur.

    - **Cabinet Ferro, « environ 3 % »** : sa note méthodologique indique qu''il travaille **sur l''échantillon
    de l''audit de mars**. Ce n''est pas une confirmation, c''est le même chiffre relu. Le compter comme
    un second avis surestime notre niveau de preuve.


    Nous avons donc **une** mesure indépendante — au-dessus du point mort — et **une** déclaration de
    vendeur en dessous.


    ## 4. La clause de remplacement gratuit ne protège pas


    Sinolux refuse toute clause indexée sur le taux de retour, c''est-à-dire la seule qui transfèrerait
    le risque. Le remplacement gratuit porte sur la cellule (22,80 €), soit **11 % du coût d''un retour**
    ; les 89 % restants — échange, transport aller-retour, geste commercial, atelier — restent chez nous.
    Même en créditant intégralement la cellule, le scénario à 3,1 % ne remonte qu''aux environs de **+16
    k€** : dans l''épaisseur du trait. Valeur commerciale, pas valeur de couverture.


    ## 5. Le test Vertex n''éclaire pas 2027


    Résultat sous neuf semaines (**J+63**), donc après le jalon Kelmar (**J+18, ferme et non reportable**)
    et après l''expiration du prix Sinolux (**J+21**). Une mesure qui arrive après la décision irréversible
    ne réduit aucun risque sur 2027 : ses 34 000 € n''achètent rien à ce titre.


    **Je propose néanmoins de le lancer**, imputé à la qualification 2028 : l''écart de 230 400 € est
    récurrent, la précision de ±0,3 point sépare nettement 1,1 % de 3,1 %, et si Kelmar impose pour 2028
    un jalon équivalent, les retours terrain du lot pilote n''auront pas assez de recul à cette date.
    Réserve à porter au dossier : le vieillissement accéléré prédit un taux, il ne mesure pas notre taux
    de retour terrain. **Le lot pilote reste la mesure de référence.**


    ## 6. L''objection la plus forte — et pourquoi elle ne l''emporte pas


    *« Vous écartez 230 400 € par an sur un audit unique, portant sur une ligne comparable et non sur
    la nôtre, sans intervalle de confiance, peut-être en montée en cadence depuis corrigée. C''est verrouiller
    le pouvoir de prix de l''historique. »* L''objection est juste sur le fond : notre preuve est mince
    des deux côtés.


    Elle ne tranche pas, parce que **les deux erreurs ne coûtent pas la même chose**. Se tromper en restant
    chez Kelmar coûte une année d''écart de prix et se corrige en 2028. Se tromper en basculant à 100
    % coûte 35 k€ *et* la ligne Kelmar 2027, vendue et non reportable, sans source alternative avant la
    fin de l''année, avec 2 232 retours terrain, une charge atelier plus que doublée et un lancement à
    J+70 sans repli. Le second scénario n''est pas une perte, c''est une rupture d''approvisionnement.


    Le partage 90/10 achète l''information sur notre propre ligne pour une exposition maximale de **3
    528 €** (7 200 × 1,8 pt × 205 € = 26 568 € de surcoût contre 23 040 € d''économie), et rapporte jusqu''à
    **+26 k€** si Sinolux a raison.


    ## 7. Correction budgétaire — à acter cette semaine


    Les 230 400 € inscrits au budget sont un **écart de prix brut**, pas une économie : le net réel va
    de +260 k€ à −35 k€. Sur le schéma proposé, la ligne 2027 vaut **23 040 € brut, entre −3,5 k€ et +26
    k€ net**. Il faut donc **retirer environ 207 k€** de l''économie budgétée. Mieux vaut le faire maintenant
    que le découvrir en cours d''exercice.


    ## 8. Conditions d''arrêt et de réexamen


    1. **J+15** — accord écrit de Kelmar (64 800) *et* de Sinolux (7 200 à 22,80 €). Refus de l''un ⇒
    100 % Kelmar à J+18, sans nouvelle réunion.

    2. **J+63** — résultat Vertex. Au-dessus de **2,5 %**, le lot Sinolux est cantonné à une flotte identifiée,
    hors grands comptes ; aucun élargissement 2028.

    3. **Suivi mensuel** — retours du lot Sinolux tracés séparément (n° de série cellule). Seuil d''alerte
    : **taux cumulé > 2,5 % sur 2 000 unités livrées** ⇒ arrêt des affectations Sinolux, bascule sur stock
    Kelmar.

    4. **Décision 2028** — reprise du dossier sur données terrain + Vertex, au plus tard 30 jours avant
    le jalon capacité 2028.


    *Hypothèses explicites : les 205 € restent constants aux deux volumes ; Kelmar accepte une réservation
    partielle sans révision de prix ; Sinolux tient 22,80 € sur 7 200 unités ; le double approvisionnement
    n''ajoute pas de coût de qualification significatif. Ces points sont à confirmer avant J+15 — si le
    prix Sinolux se dégrade sur petit volume, le partage perd son intérêt et l''option par défaut redevient
    100 % Kelmar.*


    ---


    Trois points si vous voulez creuser avant lundi : (a) la non-indépendance Ferro/audit est le pivot
    du dossier — une confirmation écrite de Ferro sur ce point solidifierait la note ; (b) l''acceptation
    d''un volume partiel par les deux fournisseurs est la seule hypothèse qui peut faire tomber la recommandation
    ; (c) si vous préférez que je rédige le fichier ou une version publiée, il me faut l''autorisation
    d''écriture — elle a été refusée sur cette session.

    '
