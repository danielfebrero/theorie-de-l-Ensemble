    # Plan d''exécution — conversion électrique de la flotte de livraison


    **Pour le conseil du jeudi 13 août 2026** — Direction de l''exploitation

    Périmètre : mise en œuvre de la décision du 4 mai (96 utilitaires électriques, 3,1 M€, livraison sept.–déc.).
    L''opportunité de la conversion n''est pas rouverte.


    ---


    ## 1. Ce que le dossier établit


    Trois faits chiffrés structurent tout le plan.


    **a) L''autonomie réelle est de 232 km, et de 197 km par temps froid.** L''annonce constructeur (260
    km) ne doit apparaître nulle part dans un plan d''exploitation. À 197 km avec une réserve d''arrivée
    de 15 %, la distance exploitable en hiver est de **167 km — soit exactement la tournée moyenne (168
    km)**. Le parc n''a aucune marge en janvier, et janvier est le mois de la subvention.


    **b) Le seuil de rupture est identifié et net.** 11 tournées sur 120 ont exigé une recharge non prévue
    pendant l''essai, **toutes au-dessus de 190 km**. Le risque n''est pas diffus : il est porté par un
    segment de tournées qu''on peut nommer et isoler. C''est ce qui rend le plan pilotable.


    **c) Le goulot n''est pas le véhicule, c''est la borne.** Une charge complète prend 6 h. Une tournée
    de 168 km consomme 4 h 20 de charge en régime tempéré, 5 h en régime froid. Sur une fenêtre nocturne
    de 12 h, une borne sert **2 véhicules** — et seulement si quelqu''un les permute en milieu de nuit.


    | Bornes | Véhicules électriques exploitables/nuit |

    |---|---|

    | 14 (aujourd''hui) | 28 |

    | 22 (avec les 8 devisées) | 44 |

    | ~30 | 60 — cible subvention |

    | ~40 | 96 — cible finale |


    **Conséquence à énoncer sans détour : la commande de véhicules est ferme, l''infrastructure qui les
    rend exploitables ne l''est pas.** Avec les 22 bornes prévues, 52 des 96 véhicules livrés en décembre
    resteront à quai. Le chemin critique du programme n''est pas la livraison des utilitaires, ce sont
    7 semaines de travaux électriques et un raccordement dont la puissance n''a pas été vérifiée.


    ---


    ## 2. Principe directeur : l''asymétrie de la location


    Le loueur reprend les diesels au fil des livraisons. Un véhicule rendu **ne revient pas avant 11 semaines**.
    Prolonger coûte 480 €/véhicule/mois, décidé 30 jours à l''avance, arrêtable au mois le mois.


    - Se tromper en prolongeant : 480 €, récupérable le mois suivant.

    - Se tromper en rendant : 900 € par tournée manquée, pendant **11 semaines minimum**, sans retour
    arrière.


    Le point mort est à **0,53 tournée manquée par véhicule et par mois**, soit un incident tous les 40
    jours ouvrés. L''essai en a produit l''équivalent d''un tous les 11 jours. La prolongation n''est
    pas de la prudence, c''est l''option la moins chère.


    **Règle : on ne rend aucun diesel avant que le lot de véhicules électriques qui le remplace ait fait
    ses preuves en exploitation. Par défaut, on prolonge.**


    ---


    ## 3. Décisions demandées au conseil


    | | Décision | Montant | Échéance |

    |---|---|---|---|

    | **D1** | Engager fermement la tranche 1 d''infrastructure : 8 bornes déjà devisées, travaux lancés
    au plus tard le 24 août | 210 k€ | Bon de commande ven. 14 août |

    | **D2** | Autoriser la prolongation glissante du parc diesel, libération par lots sur critères mesurés
    (§5) | plafond 190 k€ | Notification du lot 1 au loueur **ven. 14 août** |

    | **D3** | Déléguer au comité d''exploitation l''engagement de la tranche 2 (8 bornes supplémentaires
    **ou** dédoublement des points de charge existants, selon chiffrage) | plafond 300 k€ | Décision avant
    le 5 sept. |

    | **D4** | Acter la cible hivernale : **60 véhicules électriques + 36 diesels** du 1er décembre au
    15 mars ; gel de toute libération diesel sur cette période | — | Immédiat |

    | **D5** | Créer 2 postes d''agent de charge de nuit (1 par plateforme) | ~70 k€ (9 mois) | Recrutement
    lancé 17 août |

    | **D6** | Mandater la vérification du raccordement électrique des deux sites et provisionner le renforcement
    éventuel | provision 150 k€ | Retour au conseil de septembre |


    **Sur D5 :** sans permutation nocturne, une borne ne sert qu''un véhicule et la capacité est divisée
    par deux. Deux agents de nuit (~70 k€) achètent la même capacité que 15 bornes supplémentaires (~390
    k€). C''est le levier le moins cher du dossier, et il ne demande aucun délai de travaux.


    **Sur D3 :** avant de commander 8 bornes de plus à 26 k€ pièce, faire chiffrer sous 10 jours le **dédoublement
    des points de charge** sur les bornes existantes (2 points à 11 kW alternés par borne 22 kW). Même
    puissance appelée, aucune permutation nocturne nécessaire, coût matériel très inférieur. Si la solution
    tient techniquement, elle change l''économie de tout le programme. Elle ne doit pas retarder D1, dont
    le délai de 7 semaines commande la date de septembre.


    ---


    ## 4. Calendrier d''exécution


    | Date | Action |

    |---|---|

    | Ven. 14 août | Notification loueur : prolongation du lot 1 (24 véh., reprise prévue sept.). Bon
    de commande tranche 1. |

    | Lun. 17 août | Saisine du gestionnaire de réseau : puissance disponible et délai de renforcement
    sur les 2 sites. Demande fournisseur : puissance AC embarquée réelle, courbe de charge, consommation
    à 0 °C. Extraction de l''histogramme kilométrique des 96 tournées sur 12 mois. |

    | Avant 15 sept. | Obtenir de la Région, **par écrit**, la définition de « roulent » et les pièces
    justificatives (§8). |

    | 24 août | Démarrage travaux tranche 1 → mise en service ~12 octobre |

    | 30 août | Périmètre du devis 210 k€ clarifié (génie civil et raccordement inclus ou non) |

    | 5 sept. | Engagement tranche 2 par délégation |

    | Septembre | 24 VE livrés. Mise en service **concentrée sur une seule plateforme**, sur les 24 tournées
    les plus courtes. 96 diesels conservés. |

    | 30 sept. | Notification prolongation lot 2 |

    | 15 oct. | Plan de rééquilibrage hivernal des tournées arrêté (§6) |

    | 31 oct. | Évaluation du gate 1 → libération ou prolongation du lot 1 |

    | Novembre | 72 VE livrés. Test grandeur nature du plan hivernal. Conseil : décision tranche 3 sur
    données réelles. |

    | 30 nov. | Dernière notification loueur avant gel |

    | 1er déc. → 15 mars | **Gel des libérations diesel.** Régime hivernal : 60 VE + 36 diesels. |

    | Avant 31 janv. | Dépôt du dossier de subvention, justificatifs télémétriques à l''appui |

    | 15 mars → mai | Reprise des libérations, pilotée par la température et la capacité de charge réelle
    |


    ---


    ## 5. Règles d''affectation et critères de libération


    ### Seuils d''éligibilité par régime thermique


    Dérivés du seuil observé de 190 km, corrigés du rapport d''autonomie mesuré (197/232 = 0,85) et d''une
    marge de 5 %.


    | Température minimale prévue | Tournée maximale confiée à un VE |

    |---|---|

    | ≥ 8 °C | 185 km |

    | 3 à 8 °C | 170 km |

    | < 3 °C | **155 km** |


    L''affectation est arrêtée la veille au soir sur la prévision météo. Les seuils sont révisés chaque
    mois à partir des états de charge de retour réellement observés — ils descendront ou monteront selon
    la mesure, pas selon l''hypothèse.


    ### Gate de libération d''un lot de 24 diesels


    Les quatre critères doivent être tenus **simultanément sur 20 jours ouvrés consécutifs**, sur le lot
    de VE correspondant :


    1. Taux de tournées terminées ≥ **99,0 %**

    2. Recharges non prévues ≤ **1 %** des tournées

    3. État de charge de retour ≥ **20 %** sur au moins 95 % des tournées

    4. Aucun véhicule immobilisé au départ pour charge incomplète


    Le critère 3 est le plus important : c''est le seul qui détecte la dégradation **avant** qu''elle
    produise un incident. La télémétrie 10 minutes le fournit déjà, sans investissement.


    **Limite explicite de ces gates :** un lot validé en octobre à 14 °C ne prouve rien sur janvier à
    2 °C. Aucune libération validée en régime tempéré n''autorise une libération en décembre. D''où le
    gel de D4.


    ---


    ## 6. Le chantier de transport à lancer maintenant


    En régime froid, le plafond passe à 155 km alors que la tournée moyenne est de 168 km. Deux leviers,
    à combiner :


    1. **Affecter les 36 diesels conservés aux 36 tournées les plus longues.** Mécaniquement, les 60 tournées
    restantes redescendent sous la moyenne actuelle. C''est probablement suffisant.

    2. **Rééquilibrer les tournées de la queue haute** (entre 155 et 185 km) par transfert de clients
    entre tournées voisines. Chantier lancé cette semaine, plan arrêté au 15 octobre, testé en novembre.


    La faisabilité dépend entièrement de l''histogramme kilométrique des 96 tournées — donnée que nous
    n''avons pas et qui est demandée pour le 22 août. Si la distribution présente une queue épaisse, il
    faudra créer jusqu''à 5 tournées supplémentaires sur décembre–mars (~70 k€ de conduite). Cette provision
    est incluse au budget.


    ---


    ## 7. Pilotage et conditions d''arrêt


    Le tableau de bord du soir existe déjà. Trois indicateurs à y ajouter, disponibles sans développement
    : **état de charge de retour par tournée**, **kilométrage réalisé / planifié**, **température minimale
    du jour**.


    Revue hebdomadaire le jeudi. Décisions de notification au loueur arrêtées le 25 de chaque mois (contrainte
    de préavis).


    **Conditions d''arrêt, opposables sans nouvelle réunion :**


    - Taux de tournées terminées < 98 % sur 5 jours ouvrés glissants, sur une plateforme → **gel immédiat
    des libérations diesel** et report des tournées > 155 km sur diesel.

    - Taux < 95 % sur 3 jours ouvrés → escalade au conseil sous 48 h, remise en location d''urgence du
    lot disponible.

    - Plus de 2 véhicules par nuit et par plateforme au départ avec charge incomplète → la capacité de
    charge est saturée : arrêt des mises en service supplémentaires jusqu''à extension.


    ---


    ## 8. Les deux inconnues qui peuvent faire échouer le plan


    **a) La définition de « roulent » — 620 k€ en dépendent.** Si la Région exige 60 véhicules *en exploitation
    quotidienne* au 31 janvier, la contrainte est celle décrite ici et elle est tendue. Si elle se satisfait
    de 60 véhicules *immatriculés et mis en service*, la contrainte tombe presque entièrement et une partie
    de la tranche 2 peut être décalée au printemps. Nous ne savons pas laquelle s''applique. Obtenir la
    réponse par écrit est l''action au meilleur rendement du dossier : quelques jours de travail contre
    620 k€ et potentiellement 300 k€ d''investissement anticipé.


    **b) Le raccordement électrique.** 40 bornes représentent 880 kW de puissance crête et environ 600
    kW en moyenne sur la nuit, répartis sur deux sites. Un site logistique standard est raccordé bien
    en dessous. Si un renforcement de poste est nécessaire, le délai du gestionnaire de réseau se compte
    en mois, pas en semaines — il dépasserait les 7 semaines de travaux et menacerait directement l''échéance
    du 31 janvier. **C''est le risque le plus sérieux du programme et le seul sur lequel nous n''avons
    aucune donnée.** Saisine lundi 17 août, réponse attendue pour le conseil de septembre. Le pilotage
    de charge (lissage nocturne automatique) doit être inclus dans la tranche 1 : il réduit la puissance
    appelée et peut, dans certains cas, éviter le renforcement.


    Par ailleurs, le devis de 210 k€ pour 8 bornes, soit 26 k€ l''unité, est élevé pour de la charge alternative
    22 kW. Son périmètre doit être clarifié avant le 30 août.


    ---


    ## 9. Budget hors véhicules


    | Poste | Montant | Statut |

    |---|---|---|

    | Tranche 1 — 8 bornes + pilotage de charge | 210 k€ | Ferme, demandé jeudi |

    | Prolongation location diesel (sept.–mai) | ≤ 190 k€ | Plafond, demandé jeudi |

    | 2 agents de charge de nuit (9 mois) | ~70 k€ | Demandé jeudi |

    | Tranche 2 — bornes ou dédoublement de points | ≤ 300 k€ | Délégation, avant le 5 sept. |

    | Rééquilibrage des tournées d''hiver | 0–70 k€ | Conditionnel à l''histogramme |

    | Tranche 3 — retour à 96 VE au printemps | 200–450 k€ | Conseil de novembre, sur données réelles
    |

    | Provision renforcement raccordement | 150 k€ | Conditionnel, §8b |

    | **Engagé jeudi** | **470 k€** | |

    | **Programme complet** | **0,9 à 1,44 M€** | |


    **Détail de la prolongation location.** 24 véhicules prolongés en septembre, 48 d''octobre à mars,
    24 en avril–mai, soit environ 380 mois-véhicules à 480 € ≈ **183 k€**.


    **Mise en regard.** Le programme sécurise 620 k€ de subvention. Il évite en outre les tournées manquées
    : à 3 % d''échec sur les quatre mois d''hiver sans réserve diesel, le coût serait de 96 × 21 × 4 ×
    3 % × 900 € ≈ **218 k€**. La prolongation de location s''autofinance donc largement ; le surcoût net
    du programme tient entièrement à l''infrastructure de charge.


    **Le conseil doit savoir que l''électrification coûte entre 0,9 et 1,4 M€ au-delà des 3,1 M€ votés,
    dont 210 k€ seulement étaient devisés.** Ce n''est pas un dépassement d''exécution : c''est le coût
    de la charge, qui n''avait pas été dimensionné pour 96 véhicules.


    ---


    ## 10. Le meilleur argument contre ce plan


    Il mérite d''être posé au conseil plutôt que découvert en séance.


    > *« Ce plan est surdimensionné. Il repose sur un essai de 6 véhicules et 120 tournées — un échantillon
    trop mince pour justifier 183 k€ de location redondante et 300 à 750 k€ de bornes non budgétées. Le
    constructeur annonce 260 km ; l''essai de mars a peut-être été mené sans formation à l''écoconduite,
    qui rend couramment 10 à 15 %. En dimensionnant sur le pire cas mesuré, on transforme une hypothèse
    pessimiste en dépense certaine. »*


    Ce qu''il faut lui répondre :


    - L''échantillon est petit, mais il n''est pas ambigu : **11 défaillances sur 120, toutes du même
    côté d''un seuil identifiable.** Un échantillon plus large déplacerait le seuil, il ne le supprimerait
    pas.

    - L''écoconduite améliore le roulage, pas le chauffage. L''écart de 232 à 197 km est thermique, et
    il tombe précisément sur la période de la subvention.

    - L''argument sur l''échantillon vaut dans les deux sens : il justifie de **mesurer avant de rendre
    les diesels**, ce qui est exactement la structure du plan. Les gates du §5 sont conçus pour libérer
    plus vite si la réalité est meilleure que l''essai — la prolongation s''arrête au mois le mois.

    - L''écart d''irréversibilité tranche : une prolongation inutile se corrige en 30 jours, une reprise
    prématurée se paie pendant 11 semaines. Aucune économie de 480 € ne justifie de s''exposer à une contrainte
    qu''on ne peut pas défaire.


    En revanche, la partie de cet argument qui porte est celle sur les bornes. C''est pourquoi seuls 210
    k€ sont demandés fermement jeudi, la tranche 2 est conditionnée au chiffrage du dédoublement de points,
    et la tranche 3 est renvoyée à novembre sur données réelles. Nous n''engageons pas 750 k€ d''infrastructure
    sur l''essai de mars — nous les engageons par paliers, sur la télémétrie.


    ---


    ## 11. Données manquantes et dates de réponse


    | Donnée | Pourquoi elle est bloquante | Échéance |

    |---|---|---|

    | Définition écrite de « roulent » par la Région | 620 k€ ; conditionne la tranche 2 | 15 sept. |

    | Puissance disponible et délai de renforcement, 2 sites | Peut invalider tout le calendrier | 5 sept.
    |

    | Histogramme kilométrique des 96 tournées, 12 mois | Détermine si 60 tournées passent sous 155 km
    | 22 août |

    | Périmètre du devis 210 k€ | Fiabilité du budget infrastructure | 30 août |

    | Puissance AC embarquée réelle et courbe de charge | Si 11 kW et non 22, la capacité de charge est
    divisée par deux | 29 août |

    | Fenêtre réelle retour/départ des véhicules | Le calcul « 2 véhicules par borne » en dépend | 29
    août |

    | Nombre de jours < 5 °C, historique 5 ans | Dimensionne la durée du régime hivernal | 5 sept. |

    | Pénalités de retard de livraison au contrat véhicules | Recours si les 24/mois glissent | 5 sept.
    |


    ---


    ## Annexe — hypothèses de calcul


    Les chiffres du §1 reposent sur les hypothèses suivantes, toutes à confirmer par la mesure d''ici
    fin août :


    - **Durée de charge proportionnelle à la distance parcourue** (6 h pour une autonomie pleine). Tournée
    de 168 km en régime tempéré = 168/232 × 6 h = 4 h 20 ; en régime froid = 168/197 × 6 h = 5 h 07.

    - **Fenêtre de charge nocturne de 12 h** (retour 18 h, départ 6 h). À vérifier sur les horaires réels
    : chaque heure perdue sur cette fenêtre coûte environ 3 bornes-équivalents sur le parc.

    - **2 véhicules par borne et par nuit**, ce qui suppose une permutation en milieu de nuit (D5). Sans
    agent de nuit : 1 véhicule par borne.

    - **Besoin total** : 96 × 168 km = 16 128 km/jour, soit 417 heures-bornes en tempéré et 491 en froid.
    À 80 % d''occupation réaliste sur 12 h, cela donne **43 bornes en tempéré et 51 en froid** pour 96
    véhicules — ce qui confirme que 96 VE ne sont pas exploitables en hiver, quelle qu''en soit l''infrastructure
    raisonnable, et fonde la cible mixte de D4.


    ---


    Trois points à porter à l''oral jeudi, car ils ne se lisent pas dans un tableau : la première notification
    au loueur part **vendredi**, avant tout autre travail ; la question posée à la Région sur le mot «
    roulent » vaut 620 k€ pour quelques jours d''effort ; et le raccordement électrique est la seule chose
    du dossier qui peut faire échouer le calendrier sans qu''on puisse la rattraper.


    Dis-moi si tu veux que je reprenne le fichier — l''écriture disque a été refusée, mais je peux le
    réenregistrer ailleurs ou le publier en page partageable pour le conseil.

