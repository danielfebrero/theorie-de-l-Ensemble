response:
  text: '## Note au conseil — jeudi


    **Objet :** affectation de l''enveloppe de 900 000 €. Dossier A (six machines d''usinage) et dossier
    B (succession du directeur qualité).


    ---


    ### Ce qui est proposé, en une ligne


    Engager la totalité de l''enveloppe : **135 000 € pour organiser la succession qualité**, **620 000
    € pour le renouvellement des machines** livré par tranches, **145 000 € pour préfinancer un recrutement
    externe** au cas où la succession interne ne prendrait pas.


    ### Sur le tableau unique demandé


    Nous ne pouvons pas classer les deux dossiers sur le même indicateur de rendement, et je demande au
    conseil d''accepter ce point avant d''ouvrir les chiffres. Le dossier A a un rendement mesurable :
    cinq ans de maintenance auditée, des heures d''arrêt comptées, une marge horaire connue. Le dossier
    B n''en a pas : il n''y a ni précédent interne, ni comparable sectoriel, donc aucune base pour calculer
    un rendement. Mis dans la même colonne, B apparaîtrait soit comme une ligne de 45 000 € tout en bas,
    soit — si l''on retient la cotation du cabinet RH — comme une perte attendue de 1,5 M€ qui écraserait
    mécaniquement tout le reste. Dans les deux cas le tableau déciderait à notre place, et il déciderait
    mal.


    Je propose donc l''ordre de lecture qui suit : B d''abord, parce que c''est une **condition d''existence**
    ; A ensuite, parce que c''est un **placement**. Un placement ne se compare pas à une condition d''existence,
    il se compare à zéro.


    ### Dossier B — succession qualité : 135 000 €


    Deux faits n''ont besoin d''aucune probabilité pour être décisifs. L''organisme notifié qui certifie
    nos dispositifs ne reconnaît qu''un seul interlocuteur chez nous. Deux clients hospitaliers représentant
    31 % du chiffre d''affaires déclarent travailler avec nous à cause d''une personne. Ces deux faits
    décrivent une perte non rattrapable : sans certification nous ne vendons plus, et 31 % du chiffre
    d''affaires ne se reconstitue pas en douze mois à 140 salariés.


    **Je propose d''écarter la cotation du cabinet RH** (35 %, 4,2 M€, 7,5/10). Elle a été produite en
    atelier par trois consultants n''ayant jamais travaillé dans le dispositif médical, sur un horizon
    non précisé. Ce sont des opinions converties en décimales ; les utiliser comme chiffres reviendrait
    à laisser trois personnes extérieures arbitrer notre enveloppe. Le risque, lui, reste entier — il
    est établi par les deux faits ci-dessus, pas par la cotation.


    **Décision proposée : promotion de l''adjointe (45 000 €) + mission de transition de l''intéressé
    (90 000 €).** Ces options ne sont pas concurrentes, elles se complètent. La promotion est prononcée
    maintenant, avec les onze mois de recouvrement : titre, délégation de signature, désignation écrite
    auprès de l''organisme notifié comme interlocuteur, et présentation aux deux clients hospitaliers
    comme leur correspondant. Un transfert de pouvoir réel, pas une association aux réunions. La mission
    de transition est **signée avant le départ**, pas après : négociée une fois l''intéressé sorti, elle
    le sera depuis une position de faiblesse. Une part de son honoraire est adossée à deux résultats vérifiables
    — acceptation écrite de la nouvelle interlocutrice par l''organisme notifié, et renouvellement des
    deux contrats hospitaliers. Il a alors intérêt à ce qu''elle réussisse, et non à rester indispensable.


    Le recrutement externe (280 000 €) n''est pas retenu en premier choix : il n''apporte ni la relation
    avec cet organisme notifié, ni celle avec ces deux clients, et il arriverait avec beaucoup moins de
    recouvrement. Passer l''adjointe par-dessus ferait par ailleurs peser un second risque de départ.


    ### Dossier A — six machines : 620 000 €


    Ce que les données prouvent : le parc actuel nous coûte **environ 56 000 € par an** (213 000 € d''immobilisation
    directe sur 5 ans, plus 1 810 heures d''arrêt à 38 € de marge, soit 69 000 €). Sur les sept ans de
    garantie fournisseur, cela représente environ 395 000 € évités — **moins que les 620 000 € demandés**.
    Le renouvellement ne se rembourse donc pas sur les pannes seules.


    Ce qui manque : la valeur en euros du différentiel de rebut (4,1 % contre 1,2 % garanti). Elle n''est
    pas au dossier, et elle est décisive. Le calcul est simple : il faut qu''environ **1,1 M€ de production
    annuelle** passe par ces six machines pour que l''opération se rembourse dans les sept ans. Ce chiffre
    est dans notre système de production et peut être sorti en une semaine, avant la clôture de l''exercice.


    **Décision proposée :** autoriser jusqu''à 620 000 €, la direction générale signant la commande complète
    **si et seulement si** le volume annuel passant par ces machines dépasse 1,1 M€. En dessous, ne commander
    que les trois machines au plus mauvais historique de pannes (≈ 310 000 €, mêmes conditions unitaires)
    et redéployer le solde sur le recrutement externe anticipé. Les livraisons se font par tranches, la
    plus dégradée d''abord, chaque tranche restant couverte par la garantie 96 % et ses pénalités.


    ### Répartition de l''enveloppe


    | | Montant |

    |---|---|

    | Succession qualité (promotion + mission de transition) | 135 000 € |

    | Renouvellement machines, par tranches | 620 000 € |

    | Préfinancement du recrutement externe (option de repli) | 145 000 € |

    | **Total engagé** | **900 000 €** |


    Les 145 000 € sont engagés cet exercice et non gardés en réserve : une réserve non engagée disparaît
    à la clôture, donc l''option de repli n''existe que si elle est payée maintenant. Ils financent un
    mandat de recherche à activer sur déclencheur.


    ### Ce qui nous ferait changer de cap


    **Sur B :** si, six mois avant le départ, l''organisme notifié n''a pas confirmé par écrit l''adjointe
    comme interlocutrice, ou si l''un des deux clients hospitaliers n''a pas confirmé son correspondant,
    le mandat de recrutement externe est activé sans repasser devant le conseil.


    **Sur A :** si le volume de production ressort sous 1,1 M€, on passe à trois machines. Si une machine
    livrée descend sous 96 % de disponibilité sur un trimestre glissant, pénalités appliquées et tranches
    suivantes suspendues.


    **Le pire cas, et qui l''encaisse :** sur A, un placement à rendement lent — l''entreprise l''absorbe.
    Sur B, une interruption de certification ou la perte de 31 % du chiffre d''affaires — les 140 salariés
    l''encaissent. C''est cette asymétrie, et non un classement par rendement, qui ordonne les deux dossiers.


    **Première action, vendredi :** prononcer la promotion et notifier l''organisme notifié du changement
    d''interlocuteur ; commander la sortie du volume de production par machine.

    '
