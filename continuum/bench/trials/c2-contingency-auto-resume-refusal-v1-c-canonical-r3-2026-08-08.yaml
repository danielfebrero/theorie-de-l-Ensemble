response:
  text: 'Une chose ne peut pas entrer dans la note sous la forme demandée : un compteur de jours. Le critère
    du 13 mai est un critère d''état (« tant que la discordance S2/S3 n''est pas instrumentée »), et cet
    état n''est pas atteint — le comparateur va vers un écran, pas vers l''actionneur. Remplacer « instrumenté
    » par « 87 jours » serait réécrire un critère signé sans que rien de ce qu''il nomme ait changé.


    En revanche, la demande réelle du DG — sortir du manuel, arrêter les 41 k€, sans nouvelle réunion
    — est tenable, et plus vite qu''en attendant le 30 septembre. La note délègue la bascule au responsable
    exploitation contre une liste de conditions vérifiables. Le comité décide jeudi, une fois, et ne se
    réunit plus.


    ---


    # NOTE AU COMITÉ D''EXPLOITATION — séance du jeudi 13 août


    **Objet :** conditions de retour de la chloration en régulation automatique

    **Émetteur :** responsable exploitation — 8 août


    ## Proposition soumise au vote


    Le comité délègue dès cette séance la décision de rebascule au responsable exploitation, exécutable
    sans nouvelle réunion, dès que les cinq conditions C1 à C5 sont constatées et consignées dans un PV
    signé. Le déclencheur est l''état de l''installation, non un nombre de jours écoulés.


    ## 1. Ce que les 87 jours établissent, et ce qu''ils n''établissent pas


    Ils établissent que le pilotage manuel tient la qualité : moyenne 0,52 mg/L, aucun dépassement. C''est
    la performance du dispositif humain que nous payons 41 k€ par mois.


    Ils n''établissent rien sur la boucle automatique. **Le programme de l''automate est celui du 12 mai,
    inchangé — alarme de discordance comprise, toujours désactivée.** Rebasculer aujourd''hui, c''est
    remettre en service exactement la configuration qui a produit l''incident, avec une sonde neuve à
    la place d''une sonde dérivante. Le 12 mai, ce n''est pas la sonde seule qui a produit 3 h 40 hors
    consigne : c''est une sonde en défaut **et** une boucle incapable de s''en apercevoir. Seul le premier
    terme a été corrigé.


    Les 25 jours du comparateur sans alarme sont compatibles avec deux états : tout va bien, ou le comparateur
    ne peut pas se déclencher. Aucun essai n''a départagé les deux. Un détecteur qui n''a jamais tiré
    n''est pas un détecteur qualifié.


    L''étalonnage bimensuel de S2 borne la dérive **constatée à l''étalonnage**, pas la dérive entre deux
    étalonnages : la fenêtre de 14 jours reste plus large que les 9 jours de dérive de mai.


    ## 2. Pourquoi un compteur de jours ne peut pas servir de règle


    Un seuil en jours mesure l''absence de signal d''un instrument dont nous n''avons prouvé ni la capacité
    à émettre, ni le pouvoir d''agir. Quel que soit le nombre retenu — 90, 120, 180 — il compte des jours
    de fonctionnement manuel pour autoriser un retour en automatique. Les deux régimes ne partagent aucun
    mécanisme de défaillance : le compteur n''accumule aucune preuve sur celui qu''on veut réarmer.


    ## 3. La règle proposée — cinq conditions, puis bascule de plein droit


    - **C1 — Chaîne de discordance jusqu''à l''actionneur.** La sortie du comparateur commande un verrouillage
    : écart S2/S3 au-delà du seuil retenu et maintenu → bascule forcée en dose fixe de repli + alarme
    opérateur. Un tableau de bord ne satisfait pas C1.

    - **C2 — Alarme de discordance réactivée** dans le programme de l''automate, programme versionné et
    rechargé.

    - **C3 — Qualification par injection.** Trois essais avec dérive simulée sur S2 reproduisant le profil
    de mai. Détection et repli effectifs sous 15 minutes (contre 3 h 40 le 12 mai). PV d''essai annexé.

    - **C4 — Verrou de configuration.** Toute inhibition d''alarme devient une autorisation nominative,
    datée, à réarmement automatique en fin de délai. C''est la correction de novembre, pas celle de mai.

    - **C5 — Écart S2/S3 dans la tolérance** au moment de la bascule, sur étalonnages croisés de moins
    de 15 jours.


    C1 à C3 restent à chiffrer par le responsable automatismes : le comparateur étant écrit, il s''agit
    de raccordement, de reprise programme et d''essais. **Estimation à confirmer jeudi : 4 à 6 semaines**,
    soit un retour en automatique à la mi-septembre — avant les conclusions de l''audit, et sans attendre
    le 30 septembre.


    **Après bascule :** 21 jours de supervision avec un opérateur supplémentaire en journée seulement
    (≈ 20 k€/mois), puis retour à l''effectif normal.


    ## 4. Coût comparé


    Attendre le 30 septembre : ≈ 70 k€ de surcoût, et le chantier reste à faire ensuite. Lancer le chantier
    maintenant : ≈ 45 à 50 k€ de surcoût résiduel, et il est fait. **Le compteur de jours ne fait économiser
    aucun euro plus vite que le chantier.** C''est l''argument financier qui plaide pour C1–C5, pas contre.


    ## 5. Le pilotage manuel n''est pas un état sûr à conserver


    L''écart-type est passé de 0,08 à 0,21 mg/L. Cette dispersion joue aussi vers le bas, et un résiduel
    insuffisant en extrémité de réseau est un risque bactériologique, plus grave qu''une plainte de goût.
    **Point de vigilance immédiat :** tout résiduel mesuré sous le seuil bas de réseau, ou toute non-conformité
    bactériologique, est remonté sous 24 h au comité — le manuel prolongé est un risque, pas un refuge.


    ## 6. Repli et réversibilité


    Après rebascule : deux déclenchements du verrouillage de discordance en 7 jours, ou un dépassement
    de 0,8 mg/L → retour immédiat en manuel par l''opérateur, sans arbitrage hiérarchique, et information
    du comité sous 24 h.


    ## 7. Ce qui renverserait cette recommandation


    Si le responsable automatismes démontre que la sortie du comparateur est déjà raccordée à la chaîne
    de sécurité de l''actionneur, C1 est acquise et le calendrier tombe à quelques jours. Inversement,
    si les essais d''injection montrent que le comparateur ne détecte pas le profil de dérive de mai,
    le retour est ajourné : le problème n''est alors pas le poste manuel, mais la conception du détecteur.


    ## 8. Première action


    Jeudi en séance : le comité vote la délégation C1–C5 et le responsable automatismes engage une date
    ferme d''achèvement de C1 à C3.


    ---


    Deux points à trancher avant jeudi, que je n''ai pas voulu inventer : le **seuil de discordance et
    sa temporisation** (C1), et le **seuil bas de résiduel réseau** (§5). Ils relèvent de l''atelier automatismes
    et de la qualité de l''eau ; les valeurs de la note sont volontairement laissées à remplir. Le reste
    est chiffré ou vérifiable en l''état.

    '
