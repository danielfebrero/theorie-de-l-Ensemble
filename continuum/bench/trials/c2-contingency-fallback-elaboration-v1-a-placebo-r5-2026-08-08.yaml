  text: '## Plan d''exécution — conversion de la flotte

    **Conseil du jeudi 13 août 2026 — Direction de l''exploitation**


    ---


    ### 1. Ce que ce plan traite


    La commande est ferme, le calendrier de livraison est fixé, la subvention est acquise sous condition.
    Le plan ci-dessous organise la mise en service des 96 véhicules sans rupture de service et sécurise
    les 620 000 €.


    Deux contraintes commandent tout le reste, et aucune des deux n''est un problème de véhicule :


    **La capacité de charge plafonne bien avant 96 véhicules.** 14 bornes de 22 kW ne soutiennent pas
    une flotte de 96 utilitaires. Le calcul, à partir des données du dossier :


    | | Autonomie réelle | Charge pour 168 km | Véhicules soutenus par nuit* |

    |---|---|---|---|

    | 14 bornes, mi-saison | 232 km | 4 h 20 | ~35 |

    | 14 bornes, janvier (2 °C) | 197 km | 5 h 05 | **~30** |

    | 22 bornes, janvier | 197 km | 5 h 05 | **~47** |

    | 30 bornes, janvier | 197 km | 5 h 05 | **~65** |

    | **96 véhicules, janvier** | | | **~43 bornes nécessaires** |


    \* fenêtre nocturne de 13 h (17h30–6h30), 85 % d''utilisation effective des bornes.


    Le budget voté couvre les véhicules ; il ne couvre pas l''infrastructure qui les fait rouler. Il manque
    environ 29 bornes, soit trois à quatre tranches de 8. Les 8 bornes devisées à 210 000 € nous amènent
    à 47 véhicules — pas à 60, et pas à 96.


    **L''hiver déplace le seuil de faisabilité sous la moyenne des tournées.** L''essai donne 197 km à
    2 °C avec chauffage. Avec une marge d''exploitation de 15 %, l''autonomie utilisable en janvier est
    d''environ **167 km** — soit la moyenne exacte de nos tournées. Environ la moitié des tournées deviennent
    infaisables en une charge, au moment précis où se joue la subvention. Les 11 recharges non prévues
    sur 120 tournées relevées en mars concernaient toutes des tournées de plus de 190 km ; en janvier,
    ce seuil descend vers 170 km.


    ---


    ### 2. Principe directeur : ne jamais rendre un diesel avant d''avoir prouvé qu''on peut s''en passer


    L''asymétrie est décisive. Prolonger 24 diesels un mois coûte 11 520 €, soit l''équivalent de 12,8
    tournées non terminées. Sur un mois de 21 jours ouvrés, la prolongation est rentable dès qu''elle
    évite **0,6 tournée ratée par jour**. À l''inverse, un véhicule rendu ne revient pas avant 11 semaines
    : une erreur de dimensionnement constatée le 5 janvier ne se corrige pas avant fin mars.


    Règle d''exploitation soumise au conseil : **en cas de doute sur un point d''arrêt, on prolonge le
    lot.** La direction d''exploitation n''a pas à arbitrer au cas par cas ; le préavis de 30 jours impose
    une décision anticipée, elle sera prise dans le sens de la prudence.


    ---


    ### 3. Affectation des tournées


    Le parc n''est pas homogène et ne doit pas être traité comme tel. Segmentation par longueur de tournée,
    révisée chaque mois :


    - **Électrique** : tournées ≤ 150 km jusqu''en octobre, puis ≤ 140 km de décembre à février.

    - **Diesel prolongé** : toutes les tournées longues, la totalité du plus long décile, et la réserve
    d''aléa.

    - La re-sectorisation des tournées longues (objectif : aucune tournée > 170 km) est lancée en parallèle
    mais ne conditionne pas le plan — elle produira ses effets au printemps.


    ---


    ### 4. Calendrier, jalons et points d''arrêt


    Chaque décision de restitution se prend 30 jours avant la reprise, sur les indicateurs du tableau
    de bord existant.


    | Date | Action | Point d''arrêt |

    |---|---|---|

    | **14 août** | Commande tranche 1 (8 bornes) | — |

    | **15 août** | Préavis loueur : reprise de 24 diesels au 15 sept. | Aucun risque, 24 VE ≪ capacité
    30 |

    | **1er sept.** | Livraison lot 1 (24 VE) — mise en service | — |

    | **15 sept.** | Décision lot d''octobre | Tournées terminées ≥ 99 % / 15 j ; recharges non prévues
    ≤ 2 ‰ |

    | **début oct.** | Mise en service 22 bornes (fin des 7 semaines) | Si retard travaux → prolonger
    le lot d''octobre |

    | **15 oct.** | Décision lot de novembre | Idem + occupation bornes < 85 % |

    | **15 nov.** | **Décision lot de décembre — entrée en hiver** | Consommation mesurée sous 5 °C ;
    SoC moyen à l''arrivée > 25 % |

    | **15 déc.** | Décision lot de janvier | Idem, conditions réelles de janvier |

    | **31 janv.** | Échéance subvention — 60 VE roulants | — |

    | **fin févr.** | Bilan hivernal, restitutions par lots | — |


    **Trajectoire de parc retenue** : rendre 24 diesels en septembre, 24 en octobre, puis **conserver
    48 diesels jusqu''à fin février**, restitution progressive au printemps après validation.


    Surcoût de location par rapport à la reprise au fil de l''eau : **92 160 €** (24 véhicules en novembre,
    48 de décembre à février, 24 en mars). J''y ajoute une réserve de deux mois si un point d''arrêt hivernal
    est manqué.


    ---


    ### 5. Sécuriser les 620 000 €


    Avec 22 bornes, nous soutenons 47 véhicules en janvier. **La subvention n''est pas atteignable sans
    une seconde tranche de bornes.** 30 bornes portent la capacité à environ 65 véhicules, au-dessus du
    seuil avec une marge de 5. La tranche 2 doit être décidée au plus tard le 30 septembre pour être livrée
    mi-novembre.


    210 000 € pour sécuriser 620 000 € : l''arbitrage n''appelle pas de discussion.


    Deuxième point, sans coût mais avec un délai : **le critère « 60 véhicules roulent » n''est pas défini.**
    Véhicules immatriculés et affectés, ou véhicules ayant effectué un nombre minimum de tournées ? La
    différence peut coûter la subvention entière. Je demande mandat pour obtenir de la Région une définition
    écrite avant le 15 septembre, et pour faire valider le mode de preuve — le superviseur de flotte,
    qui remonte état de charge et kilométrage toutes les 10 minutes, produit un relevé horodaté par véhicule
    qui devrait suffire.


    ---


    ### 6. Instrumentation


    Le tableau de bord publie aujourd''hui le taux de tournées terminées et les recharges non prévues.
    Ce sont des indicateurs de constat : quand ils bougent, la tournée est déjà perdue. Quatre indicateurs
    avancés, tous dérivables du flux existant, à livrer pour le 1er septembre :


    1. **État de charge à l''arrivée au dépôt**, par véhicule et par tournée. Seuil d''alerte à 20 % :
    une tournée terminée à 8 % est un échec évité de justesse, pas un succès.

    2. **Consommation rapportée à la température extérieure** — c''est la courbe qui nous dira en novembre
    ce qui se passera en janvier.

    3. **Taux d''occupation des bornes et temps d''attente au branchement.**

    4. **Écart km réalisés / km planifiés** par tournée.


    ---


    ### 7. Budget additionnel demandé


    | Poste | Montant |

    |---|---|

    | Bornes tranche 1 (8 points, devisé) | 210 000 € |

    | Bornes tranche 2 (8 points, estimation à confirmer) | 210 000 € |

    | Prolongation location diesel (92 k€ + réserve) | 140 000 € |

    | **Total** | **560 000 €** |


    À mettre en regard : 620 000 € de subvention sécurisée, et le risque évité. Une erreur de dimensionnement
    de 10 véhicules en janvier coûte 189 000 € par mois en tournées non terminées, sans possibilité de
    correction avant 11 semaines.


    Ce montant ne couvre pas la conversion complète : les 13 à 21 bornes restantes nécessaires pour exploiter
    les 96 véhicules représentent 350 000 à 550 000 € supplémentaires, à instruire au premier trimestre.


    ---


    ### 8. Risques et points ouverts


    **Le raccordement électrique n''a pas été vérifié.** 22 bornes appellent 484 kW en simultané, 43 bornes
    près de 950 kW. Si la puissance souscrite du site est insuffisante, le délai du gestionnaire de réseau
    dépasse largement les 7 semaines de travaux et remet en cause le calendrier de la subvention. **Audit
    à lancer sous 15 jours** — c''est le seul point qui peut invalider ce plan en bloc.


    Autres réserves, signalées sans qu''elles bloquent l''exécution :

    - L''essai porte sur 6 véhicules et 120 tournées en mars. La tendance est nette, la précision est
    faible, et mars n''est pas janvier.

    - Les 6 h de charge complète sont probablement mesurées en température tempérée. La charge par temps
    froid est plus lente ; nos calculs de capacité pourraient être optimistes. À mesurer dès les premières
    nuits froides de novembre.

    - La distribution réelle des longueurs de tournée (le décile supérieur, notamment) sera extraite de
    l''historique sous 5 jours et affinera l''affectation.


    ---


    ### 9. Décisions demandées jeudi


    1. Commande immédiate de la tranche 1 de bornes — **210 000 €**.

    2. Mandat de commande de la tranche 2 (~210 000 €), décision au plus tard le 30 septembre, sous réserve
    du devis et de l''audit réseau.

    3. Enveloppe de prolongation de location de **140 000 €**, avec délégation à la direction d''exploitation
    pour actionner les préavis lot par lot.

    4. Validation des points d''arrêt et de la règle « en cas de doute, on prolonge ».

    5. Mandat pour obtenir de la Région la définition écrite du critère de subvention avant le 15 septembre.

    6. Lancement de l''audit de raccordement électrique sous 15 jours.


    ---


    Le plan tient à condition que la décision soit prise jeudi. Les 7 semaines de travaux et le préavis
    de 30 jours ne laissent aucune marge : un report au conseil suivant décale la tranche 1 à novembre
    et met la subvention hors d''atteinte.


    Si vous voulez, je peux mettre ce document en page pour la remise au conseil, ou détailler le calcul
    de capacité de charge en annexe.

    '
