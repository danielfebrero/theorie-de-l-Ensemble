response:
  text: '## Position — lot F-2418 / réclamation Sodimarché 21 400 €


    **Régime du dossier :** mixte. Les faits matériels sont établis et quantifiés par nos propres pièces
    ; le quantum et l''opposabilité des analyses ne le sont pas. Les deux se traitent séparément.


    ---


    ### 1. Chronologie établie, pièce par pièce


    | Heure | Fait | Pièce |

    |---|---|---|

    | 6 h 25 | Chargement terminé, produit à 3 °C | P1 (fiche de quai, signée opérateur) |

    | « 6 h 40 » | Mention manuscrite « départ » sur le BL | P2 (BL 2418, signé chauffeur + réceptionnaire)
    |

    | 9 h 05 | Mise sous tension du groupe froid ; rien avant | P5 (enregistreur embarqué) |

    | 11 h 12 | Sortie du véhicule du site, écriture automatique | P3 (journal portique) |

    | 12 h 55 | Réception au dépôt, 1 792 barquettes | P4 (bon de réception) |


    Deux écarts sortent de cette table, et ils sont dans nos pièces, pas dans celles du dépôt :


    - **P2 contre P3.** La mention manuscrite « départ 6 h 40 » est contredite par une écriture automatique
    horodatée qui place la sortie à 11 h 12. Le véhicule est resté chargé sur site **4 h 47**.

    - **P1 contre P5.** Entre la fin de chargement (6 h 25) et la mise sous tension du groupe (9 h 05),
    **2 h 40** de conservation ne sont couvertes par aucun relevé.


    P7 (chauffeur « parti tôt », « attendu un moment ») est une déclaration téléphonique non datée et
    non signée. En l''état ce n''est pas une pièce : elle ne sera versée que recueillie par écrit, datée
    et signée.


    ---


    ### 2. Ce que l''entreprise reconnaît


    1. La livraison du lot F-2418 et la quantité de **1 840 barquettes au départ** (P1, P2).

    2. L''**immobilisation du véhicule chargé sur notre site de 6 h 25 à 11 h 12** (P1, P3).

    3. L''**absence de tout relevé de température entre 6 h 25 et 9 h 05** (P5). L''entreprise ne dispose
    d''aucune pièce établissant le respect de la plage 0–4 °C sur ce créneau, et ne peut donc pas l''affirmer.

    4. En conséquence : **le principe d''une prise en charge de la non-conformité du lot n''est pas contesté.**
    La cause probable est chez nous, pas chez le transporteur ni chez le client.

    5. La mention « départ 6 h 40 » portée sur le BL est **inexacte**. L''entreprise la signale elle-même
    et ne s''en prévaudra à aucun stade — ni auprès de l''assureur, ni auprès du client.


    Ce cinquième point n''est pas une concession de politesse. Une position construite sur « 6 h 40 »
    s''effondre à la première production du journal de portique, et transforme un sinistre couvert en
    fausse déclaration opposable par l''assureur. C''est le seul risque du dossier qui dépasse 21 400
    €.


    ---


    ### 3. Ce que l''entreprise conteste


    **a) Le quantum, faute de justificatifs.** Le décompte de 21 400 € n''est ventilé par aucune pièce
    : ni valorisation de la marchandise, ni facture de transport, ni base de calcul de la pénalité de
    rupture d''assortiment. Aucune indemnisation ne peut être arrêtée sur un montant global non décomposé.


    **b) L''écart de quantité, contradiction interne au dépôt.** Le réceptionnaire du dépôt a signé un
    BL portant 1 840 barquettes (P2), puis établi un bon de réception de 1 792 (P4). **48 barquettes**
    ne sont expliquées par aucune pièce. La réclamation ne peut porter que sur des quantités dont la destruction
    est justifiée.


    **c) La preuve de la destruction.** Aucun certificat ni procès-verbal de destruction ne figure au
    dossier. Une marchandise dont la destruction n''est pas établie n''est pas indemnisable.


    **d) La force probante de P6, sans en contester le sens.** L''analyse porte sur **3 barquettes** sur
    1 792, provient d''un laboratoire mandaté unilatéralement, et n''est accompagnée d''aucun procès-verbal
    de prélèvement : ni date et heure de prélèvement, ni scellés, ni convocation contradictoire, ni relevé
    des températures du dépôt entre la réception à 12 h 55 et le prélèvement. Nous contestons son **opposabilité**
    et son **extrapolation** à l''ensemble du lot. Nous ne contestons pas son résultat : nos propres pièces
    vont dans le même sens, et prétendre le contraire coûterait la crédibilité du reste de la position.


    **e) Le cumul.** L''indemnisation de la marchandise détruite et la pénalité de rupture d''assortiment
    couvrent en partie le même préjudice. Le cumul doit être justifié clause en main, contrat produit.


    ---


    ### 4. Ce que le dossier ne permet pas encore d''affirmer


    À signaler explicitement à l''assureur plutôt qu''à combler par des hypothèses : le **contrat n''est
    pas au dossier** (clause 0–4 °C, seuil 10⁵ UFC/g, pénalité, délai de huit jours), pas plus que la
    facture détaillée du dépôt, le certificat de destruction, le PV de prélèvement, les relevés du dépôt,
    le disque ou fichier tachygraphe du véhicule, et la déclaration écrite du chauffeur.


    ---


    ### 5. Ce qui renverserait la position


    Une seule hypothèse peut déplacer la responsabilité, et elle est vérifiable en 48 heures : **le véhicule
    était-il branché sur prise de quai ?** Un groupe froid alimenté par le secteur pendant le stationnement
    maintient la température sans que l''enregistreur embarqué soit sous tension — ce qui expliquerait
    le blanc de P5 sans rupture réelle. À vérifier : journal de la prise de quai, relevé de consommation
    électrique du poste, fiche de vie du groupe. Tant que cette vérification n''a pas produit de pièce,
    l''entreprise ne l''invoque pas.


    ---


    ### 6. Ce que l''entreprise engage dans les huit jours


    **J+1**

    - Déclaration de sinistre à l''assureur, avec les sept pièces numérotées telles quelles, y compris
    la contradiction P2/P3 signalée en tête de bordereau.

    - Gel et extraction des données : tachygraphe et feuille de route du 3 juin, journal de la prise de
    quai, échantillothèque du lot F-2418.


    **J+2**

    - Recueil par écrit, daté et signé, des déclarations du chauffeur et de l''opérateur de quai. P7 devient
    une pièce ou disparaît du dossier.

    - Analyse de l''échantillothèque F-2418 en laboratoire accrédité : établir la conformité à la production,
    et donc circonscrire l''incident au transport.


    **J+4**

    - Vérification que le véhicule n''a effectué aucune autre livraison le 3 juin — P3 l''indique déjà
    (aucune autre sortie), à confirmer par la feuille de route avant de l''écrire au client.


    **J+6 — action décisive, à ne pas manquer**

    - **Réponse écrite au dépôt, en recommandé avec accusé de réception**, contenant : reconnaissance
    des faits matériels des points 2.1 à 2.3 ; contestation motivée des points 3.a à 3.e ; demande formelle
    des pièces du point 4 ; réserve expresse sur le quantum et sur toute qualification juridique. Cette
    lettre interrompt l''acquisition de plein droit de la pénalité — c''est son objet premier, avant son
    contenu.


    **Proposition portée dans la même lettre :** prise en charge sans discussion de la valeur marchandise
    justifiée et du transport, contre abandon de la pénalité d''assortiment, adossée à un réapprovisionnement
    prioritaire du dépôt sous quinze jours et à un audit de notre procédure de quai communiqué à Sodimarché.
    Cela donne au client une contrepartie réelle — du stock, un délai, un droit de regard — et non une
    consultation de forme.


    **Correctif immédiat, sans attendre l''issue :** aucun chargement de produit réfrigéré tant que le
    groupe froid n''est pas sous tension et enregistrant ; horodatage automatique du départ substitué
    à la mention manuscrite sur le BL.


    ---


    ### 7. Repli


    Si au **J+20** le dépôt n''a produit ni certificat de destruction ni ventilation du décompte, la position
    bascule : proposition de règlement limitée aux 1 792 barquettes effectivement réceptionnées, valorisées
    au prix de cession, transport inclus, à l''exclusion de la pénalité — et transmission du dossier au
    conseil de l''assureur.


    Si le journal de la prise de quai établit une alimentation continue entre 6 h 25 et 9 h 05, le point
    2.3 est repris et la position se durcit sur l''ensemble.


    **Ce qui n''est pas en jeu :** 21 400 € ne mettent pas 34 salariés en danger. Ce qui le pourrait,
    c''est la perte du référencement chez Sodimarché ou une déchéance de garantie. Les deux se jouent
    sur la même chose — l''exactitude de ce qu''on écrit sur « 6 h 40 ».

    '
