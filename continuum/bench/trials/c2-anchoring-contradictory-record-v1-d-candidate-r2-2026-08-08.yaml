response:
  text: 'Deux documents, parce que la note qui explique notre exposition ne doit pas se retrouver entre
    les mains du client. (Écriture refusée dans le répertoire de travail — les fichiers sont dans le scratchpad
    de session.)


    **Ce que les pièces disent, et qui n''est pas discutable.** Chargement terminé à 6 h 25 (P1), sortie
    du site à 11 h 12 (P3, écriture automatique) : **4 h 47 de stationnement chargé sur notre quai**.
    Groupe froid sous tension à partir de 9 h 05 seulement (P5) : **2 h 40 sans froid et sans aucun relevé**.
    La route, elle, est documentée et conforme — 11 h 12 → 12 h 55 entre 2,9 et 3,6 °C. La seule fenêtre
    aveugle est entièrement chez nous, avant la sortie. Contester la causalité serait perdre la garantie
    pour 21 400 €.


    **Le piège du dossier : la pièce 2.** Le bon de livraison porte « départ 6 h 40 », signé des deux
    parties, et le portique dit 11 h 12. Une mention manuscrite fausse dans un document contradictoire
    signé. Si le dépôt la découvre le premier, un incident de chaîne du froid devient un problème de sincérité
    documentaire — beaucoup plus cher. La lettre la rectifie spontanément, en premier, et demande d''acter
    que la signature du réceptionnaire ne peut attester une heure de départ à laquelle il n''était pas
    présent.


    **Ce qui se conteste, et pour un seul motif à chaque fois : aucune pièce.** Les 21 400 € ne sont ventilés
    nulle part. L''assiette de 1 840 est démentie par le bon de réception du dépôt lui-même : **1 792**
    — 48 barquettes n''existent dans aucune pièce, ni chez eux ni chez nous. L''analyse porte sur 3 unités,
    soit 0,17 % du lot, sans protocole de prélèvement ni chaîne de conservation produits. Et le contrat
    — plage 0–4 °C, seuil 10⁵, délai de huit jours, pénalité de plein droit — n''est **pas au dossier**
    : tout ce qu''ils invoquent repose sur un texte qu''ils n''ont pas produit.


    **Ce qui se joue en premier, dès aujourd''hui.** Deux choses. D''abord la lettre part le jour même,
    RAR : le délai de huit jours est le seul élément qui produit un effet irréversible par simple écoulement
    du temps, et **aucune pièce ne date la réclamation** — on retient donc l''hypothèse la plus défavorable
    (la note prévoit le cas où les huit jours seraient déjà courus). Ensuite l''analyse des échantillons
    témoins à J+1 : c''est le test qui départage « contamination en transport » et « contamination en
    production ». Témoins conformes, le litige reste borné au lot F-2418 et devient une discussion de
    montant. Témoins non conformes, le périmètre déborde vers d''autres destinataires et notre position
    change de nature. La lettre est écrite pour ne rien préjuger de ce résultat, et s''engage à le communiquer
    même défavorable.


    Une précision sur le pire cas, section 6 de la note : la flore mésophile est un indicateur d''hygiène,
    pas un critère de sécurité. Un dépassement d''un facteur 4,2 ne caractérise pas à lui seul une denrée
    dangereuse — d''où la recherche de pathogènes en J+1 plutôt qu''en fin d''instruction, et aucune conclusion
    sanitaire avancée avant ce résultat.


    Enfin, Sodimarché reste un client. La lettre propose une expertise **codésignée** — ils choisissent
    l''expert sur une liste, ou en proposent trois — avec suspension écrite de la pénalité pendant l''expertise
    et règlement immédiat du poste marchandise non contesté sur l''assiette de 1 792. Ce n''est pas une
    consultation de courtoisie : c''est le choix de l''expert, un droit de regard sur le protocole et
    de l''argent maintenant.


    Deux vérifications à faire avant signature, que je ne peux pas trancher depuis le dossier : **le transport
    est-il exécuté en propre ou sous-traité** (cela déplace la garde pendant les 4 h 47 et ouvre ou ferme
    un recours), et **le groupe froid était-il en panne ou simplement pas mis en route** (aléa contre
    faute d''exploitation). Si l''extraction des 30 jours révèle des départs récurrents groupe éteint,
    il faut le déclarer à l''assureur nous-mêmes et sans attendre.

    '
