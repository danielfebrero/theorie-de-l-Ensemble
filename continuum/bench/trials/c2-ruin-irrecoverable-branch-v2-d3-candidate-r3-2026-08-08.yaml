response:
  text: '# Note au conseil d''administration — séance de jeudi


    **Recommandation en une ligne : je fais rejeter C sans amendement, je réduis B et je le conditionne,
    et j''engage la caisse sur le dépôt immédiat du dossier de transfert à l''Union mutualiste de l''Atlantique
    — parce que c''est la seule porte encore ouverte et qu''elle se referme dans dix-huit à vingt-quatre
    mois.**


    ---


    ## 1. Le problème n''est pas le rendement, et aucune allocation ne le résout


    Prestations 5,4 M€, cotisations 4,4 M€ : le compte technique est déséquilibré de **22,7 %**, et l''écart
    s''élargit de 4,3 % par an. Pour l''équilibrer par le seul rendement, il faudrait tirer 1,0 M€ de
    18,4 M€ dès cette année, soit **5,4 % net garanti**, puis davantage chaque année. Aucun actif ne produit
    cela sans risque, et un actif risqué qui le produirait en moyenne ne le produit pas *chaque année*
    — or les prestations, elles, tombent chaque année.


    Le trésorier a raison sur un point décisif, et je demande que le conseil l''acte formellement : **le
    statu quo est une trajectoire de mort certaine.** Son diagnostic est juste. C''est sa conclusion qui
    ne suit pas de son diagnostic.


    ## 2. Option C — refusée, et non négociable


    Je n''écarte aucun de ses chiffres. J''affirme que son modèle omet deux contraintes qui, ici, décident
    de tout.


    **a) La trésorerie manque en année 4, dans *toutes* les branches — y compris celle à 88 %.**


    C immobilise 14,4 M€ pendant sept ans. Restent 4,0 M€ disponibles pour couvrir les déficits d''exploitation
    :


    | Année | Déficit | Cumul | Tranche libre restante |

    |---|---|---|---|

    | 1 | 1,00 | 1,00 | 3,1 |

    | 2 | 1,23 | 2,23 | 1,9 |

    | 3 | 1,47 | 3,71 | 0,4 |

    | 4 | 1,73 | 5,43 | **épuisée** |


    Vers le 40ᵉ mois, la caisse ne peut plus payer ses prestations — trois ans avant le déblocage de la
    note. La cessation de paiements ne dépend pas du 3 % : elle est structurelle. *Sauf* si la note distribue
    des coupons en numéraire, ce que la documentation ne dit pas et qu''un produit non coté, bloqué, sans
    sortie anticipée, ne fait généralement pas. **À obtenir avant jeudi.** Même si elle en distribuait,
    ce qui suit resterait vrai.


    **b) 10 000 simulations sans barrière absorbante favorisent toujours l''actif le plus volatil.**


    La domination « dans 94 % des trajectoires » mesure la valeur terminale à dix ans. Elle ne teste ni
    la contrainte de liquidité annuelle, ni le seuil statutaire de 11 M€ — lequel n''est pas une contre-performance
    mais une **fin d''entité**. Dans la branche à 3 %, la réserve tombe à 4,7 M€ : liquidation de plein
    droit, 4 200 affiliés de 61 ans d''âge moyen, fortement exposés à l''amiante, remis sur un marché
    qui n''a coté personne en 2025. Ils deviennent individuellement inassurables. Cette branche ne se
    rattrape pas : il n''y a ni réassureur, ni garantie publique, ni seconde tentative.


    Et l''espérance de +9,6 % est calculée sur un ensemble de 10 000 caisses. Il y a une caisse et 4 200
    personnes. La moyenne d''ensemble n''est pas disponible à celui qui ne joue qu''une fois et ne peut
    pas rejouer.


    **c) Trois signaux qui devraient suffire seuls.**


    - La distribution de probabilités est **fournie par le vendeur**. Personne d''indépendant n''a valorisé
    ce produit.

    - Un émetteur A− en dette senior récupère historiquement de l''ordre de 40 %. **Une récupération à
    5 % indique une subordination ou un effet de levier incorporé** : le risque réel n''est pas celui
    du rating affiché, et le 3 % est probablement sous-estimé.

    - 78 % de la réserve sur un émetteur unique, illiquide, bloqué sept ans, pour un organisme à flux
    de trésorerie négatif et à seuil de liquidation statutaire : je demande que le conseil fasse confirmer
    par son conseil juridique, **avant le vote**, le statut prudentiel d''une telle concentration et la
    responsabilité individuelle des administrateurs qui la voteraient. Ce n''est pas un argument d''autorité,
    c''est une pièce à verser au dossier.


    **d) C ferme aussi la seule sortie.** L''Atlantique n''instruira pas un portefeuille dont la réserve
    est une note non cotée bloquée sept ans.


    Le veto ne se négocie pas et ne sera pas rouvert, même si le transfert échoue — car après un refus
    de transfert la situation serait pire, pas meilleure.


    ## 3. Option A — ce n''est pas une option, c''est une échéance. Et la date est peut-être fausse.


    En reprenant les hypothèses de la note (cotisations plates à 4,4, prestations +4,3 %, rendement +1,8
    %), je franchis les 11 M€ **en année 6, pas en année 9** :


    18,4 → 17,7 → 16,8 → 15,7 → 14,2 → 12,5 → **10,4**


    Soit la projection interne suppose une croissance des cotisations qui n''est pas écrite, soit elle
    est erronée. **Trois années d''écart sur le temps disponible : à réconcilier avant jeudi.** Je retiens
    A comme posture financière transitoire — liquide, capital stable — et non comme décision.


    ## 4. Ce qui décide réellement : la fenêtre de transfert, qui se referme


    L''Atlantique n''a jamais accepté un dossier sous trois années de prestations. Trois années valent
    **16,2 M€ aujourd''hui**, et ce seuil monte de 4,3 % par an pendant que la réserve baisse.


    | | Réserve | Prestations | Ratio | Éligible |

    |---|---|---|---|---|

    | Aujourd''hui | 18,4 | 5,40 | **3,41** | oui |

    | +12 mois | 17,7 | 5,63 | 3,15 | oui, de justesse |

    | +24 mois | 16,8 | 5,87 | **2,86** | non |


    L''instruction dure douze à dix-huit mois. **La fenêtre de dépôt se compte en semaines, pas en trimestres.**
    C''est le fait le plus contraignant du dossier, et il n''apparaît nulle part dans la note du trésorier.


    ## 5. Option B — retenue, réduite à 3 M€, et séquencée


    À 7,4 M€, le pire décile ramène la réserve à 15,8 M€ — **sous les 16,2 M€ d''éligibilité au transfert**.
    Le vrai coût de B n''est pas la moins-value de 2,6 M€ : c''est la perte de la sortie.


    Je propose donc une tranche diversifiée plafonnée à **3 M€ (16 % de la réserve)**, exécutée **après**
    l''accusé de réception du dossier de transfert. Pire décile : −1,05 M€, réserve à 17,3 M€, ratio maintenu
    au-dessus de 3,0.


    Je dis honnêtement au conseil ce que cela rapporte : **environ 0,13 M€ par an** de plus que les obligations
    d''État, soit 13 % du déficit de l''année en cours. B n''est pas une solution. C''est une amélioration
    marginale qui, correctement dimensionnée, n''abîme rien.


    ## 6. Ce sur quoi j''engage la caisse — résolutions soumises au vote


    1. **Rejet de C**, sans réexamen conditionnel.

    2. **Dépôt du dossier de transfert à l''Union mutualiste de l''Atlantique sous 30 jours**, en demandant
    que l''éligibilité soit appréciée à la date de dépôt. Mandat de négociation confié au trésorier.

    3. **Convocation d''une AG extraordinaire sous 90 jours** : relèvement des cotisations et réexamen
    du régime de prestations. Il faut dire à l''assemblée le chiffre réel — l''équilibre exige +22,7 %
    puis une indexation sur la dérive, et la hausse de 6 % refusée en 2024 ne couvrait pas le tiers de
    l''écart.

    4. **Plancher de liquidité** : au moins 24 mois de prestations en instruments à capital stable, en
    permanence.

    5. **Plafond de concentration** : aucune exposition supérieure à 10 % de la réserve sur un émetteur
    unique, aucun blocage supérieur à 24 mois.

    6. **Tranche diversifiée de 3 M€** après le point 2.


    Sur le point 2, le trésorier conduit la négociation et rapporte au conseil à chaque étape. Ce n''est
    pas une consultation : c''est le pilotage du dossier qui décide de l''avenir de la caisse, confié
    à celui qui a eu raison sur le diagnostic.


    ## 7. Repli et déclencheurs observables


    - **Ratio réserve / prestations annuelles < 3,10** → gel immédiat de toute diversification, retour
    intégral en capital stable.

    - **Avis négatif de l''Atlantique, ou absence de décision au 18ᵉ mois** → conseil convoqué sous 30
    jours pour ouvrir une **extinction organisée** : arrêt des adhésions, placement individuel négocié
    des affiliés, dissolution volontaire pendant que la réserve dépasse encore 15 M€. Mourir à 16 M€ avec
    un plan de placement pour 4 200 personnes vaut infiniment mieux que la liquidation statutaire à 11
    M€ sans rien.

    - **Nouveau rejet de la hausse par l''AG** → la décision d''extinction organisée est avancée au conseil
    suivant.

    - **Trésorerie disponible < 18 mois de prestations** → conseil extraordinaire sous 15 jours.


    ## 8. Ce qui renverserait ma recommandation


    - Sur le transfert : une confirmation écrite de l''Atlantique qu''elle n''instruira ce dossier à aucun
    niveau de réserve → l''extinction organisée devient l''ordre du jour immédiat.

    - Sur C : une valorisation indépendante non liée à l''émetteur, un échéancier de coupons en numéraire
    couvrant le déficit annuel, un rang senior avec récupération historique normale, **et** un dimensionnement
    sous 10 % de la réserve. Autrement dit, un autre produit. À 78 % et sept ans de blocage, rien ne rouvre
    le veto.

    - Sur l''ensemble : si la projection à neuf ans est confirmée exacte et la mienne fausse, le calendrier
    se détend — mais la fenêtre de transfert, elle, ne bouge pas, car elle dépend du ratio et non du seuil.


    ## 9. À obtenir avant jeudi


    1. La documentation complète de la note : identité de l''émetteur, rang de créance, échéancier des
    coupons, prospectus.

    2. La réconciliation de la projection 9 ans / 6 ans.

    3. La note du conseil juridique sur le statut prudentiel de C et la responsabilité des administrateurs.

    4. Un contact préalable avec l''Atlantique pour confirmer la date d''appréciation de l''éligibilité.


    ---


    **Le meilleur argument contre moi**, et il mérite d''être posé au conseil : « refuser C, c''est choisir
    une perte certaine à 100 % contre une perte à 3 % ». Il tombe pour une seule raison — l''alternative
    à C n''est pas A. C''est le transfert et l''assemblée générale, tous deux ouverts aujourd''hui, et
    que C ferme tous les deux. Le trésorier compare la bonne option à la mauvaise alternative.

    '
