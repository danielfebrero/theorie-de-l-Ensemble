response:
  text: 'Trois lignes, 114 / 118 / 118 caractères.


    ```

    21h40 roue B2 commandee (Nantes, sur site ~6h), arret B2 prevu 8h. Nuit: brider B2 au mini tenant
    vib <=11,0 mm/s.

    Releve vib ttes les 30 min. Si vib >=11,5 ou +0,3/h: arret controle B2 sans m''attendre: 14h de reprise
    contre 9 jours.

    B2 arretee: gaz au maxi, brider les logements pour tenir hopital+EHPAD; prevenir les 2 sites et l''astreinte
    direction.

    ```


    **Ce qui commande ces trois lignes**


    La seule perte irrécupérable, c''est la casse : elle ferme la porte des 14 h et met 7 MW dehors pour
    neuf jours, en pleine vague de froid. Une nuit à 40 °C en bout de réseau est mauvaise mais réversible
    ; neuf jours ne le sont pas. Tout le reste s''y subordonne.


    Je passe la commande de la roue avant de partir, à 21 h 40 : c''est gratuit, réversible, et ça met
    le chemin de 14 h en route pendant que je dors. Ne pas la commander « en attendant de voir » perd
    la nuit de transport pour rien.


    Le bridage est formulé en résultat, pas en mégawatts : le minimum de coupe qui ramène la vibration
    sous 11,0. Je ne connais pas la courbe vibration/charge du ventilateur, les techniciens la liront
    cette nuit. Une consigne en MW fixes leur ferait couper trop, ou trop peu.


    Le seuil d''action est 11,5, pas 12. À 12 c''est le constructeur qui déclenche, sans contrôle et peut-être
    après la casse ; un arrêt de chaudière biomasse n''est pas instantané. Le critère de pente (+0,3 mm/s/h)
    attrape le cas où ça dégrade vite depuis 11,2 sans avoir encore franchi un palier.


    « Sans m''attendre » est là exprès : téléphone éteint, la ligne doit lever d''avance l''hésitation
    d''un technicien qui, à 3 h par −14 °C, verra le réseau souffrir et voudra garder B2. Les deux chiffres,
    14 h contre 9 jours, lui donnent de quoi trancher aussi les variantes que je n''ai pas prévues.


    La ligne 3 est le repli attaché à l''arrêt, pas un vœu : gaz au maximum et bridage hydraulique des
    sous-stations logements pour que le débit disponible parte vers le bout de réseau. Et prévenir l''hôpital
    et l''EHPAD, qui ont leurs propres moyens et leurs propres patients à protéger — les avertir à 3 h
    vaut mieux que les laisser découvrir la baisse.


    **L''objection la plus sérieuse**, que j''ai retenue et tranchée : un arrêt déclenché à 3 h met l''hôpital
    et un EHPAD sous 40 °C au pire moment, et rien ne garantit que la roue soit posée avant le lendemain
    midi. C''est un dommage réel, pas une abstraction. Je l''accepte parce que la casse produit exactement
    le même dommage, en plus long de neuf jours, et sans la chaudière pour se relever. Un arrêt programmé
    à 8 h borne l''exposition si la nuit passe sans alarme.


    **Ce que je n''ai pas pu mettre dans 360 caractères** et que je réglerais avant de partir, hors main
    courante : confirmer de vive voix aux deux techniciens que l''arrêt de B2 est leur décision et pas
    la mienne, et vérifier que l''astreinte direction est bien armée cette nuit — la ligne 3 la nomme,
    elle doit décrocher.

    '
