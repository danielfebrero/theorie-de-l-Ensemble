response:
  text: '## Recommandation


    **Le chiffre d''activation sort de la diapositive. Ni 47 %, ni 41 %, ni aucune autre valeur.** À sa
    place : le défaut d''instrumentation, sa borne, et la date d''une lecture propre. Le comité l''apprend
    de nous mardi, pas d''un analyste de diligence en août.


    ---


    ### 1. Le défaut n''est pas un artefact de journalisation


    Le VP Produit décrit un problème d''horodatage. Ce n''en est pas un. Les deux estampilles sont écrites
    côté serveur, par le même service, sur une horloge NTP unique, sans incident déclaré : il n''existe
    aucun mécanisme par lequel `first_action_at` puisse précéder `bucket_assigned_at` **par erreur**.
    Les 4 812 inversions (42,6 % du bras v2, contre 0,9 % au témoin) ne sont pas du bruit — ce sont la
    signature attendue du vrai défaut, qui est structurel :


    - le témoin est affecté **à l''inscription** → son 31 % porte sur *tous les inscrits* ;

    - le bras v2 est affecté **à l''étape 3** → son 47 % porte sur *les seuls comptes qui ont survécu
    jusqu''à l''étape 3*.


    On ne compare pas deux bras. On compare un taux inconditionnel à un taux conditionné à la progression
    dans le tunnel — alors que la progression dans le tunnel est précisément ce qui prédit l''activation.
    **Même si v2 n''avait strictement aucun effet, on mesurerait un écart positif de cette forme.** Les
    16 points sont entièrement compatibles avec un effet nul.


    Et les abandons avant l''étape 3 ne sont ni dans un bras ni dans l''autre, ni comptés nulle part.
    Le dénominateur v2 n''est pas biaisé : il est **inconnu**.


    ### 2. Le 41 % du collègue est plus faux, pas moins


    Retirer les 4 812 lignes inversées applique un second filtre post-traitement à un échantillon déjà
    filtré sur le traitement. Cela ne récupère aucun compte manquant — la population invisible reste invisible.
    Cela remplace « les survivants de l''étape 3 » par « les survivants de l''étape 3 qui ont agi tard
    », sous-groupe encore moins comparable au témoin.


    Ce qu''il a démontré sans le vouloir mérite d''être noté : **un découpage post-hoc arbitraire fait
    bouger le résultat de 6 points.** C''est un indicateur de fragilité, pas une convergence vers la vérité.


    ### 3. Ce qu''on peut borner dès aujourd''hui


    47 % × 11 300 = **5 311 activations** au bras v2. 31 % × 10 940 = 3 391 au témoin.


    Si l''on rapporte les 5 311 activations à la population réellement exposée à v2 (inconnue, appelons-la
    N), l''écart avec le témoin s''annule dès que N ≈ 17 130 — soit **5 830 abandons avant l''étape 3,
    c''est-à-dire un taux d''atteinte de l''étape 3 de 66 %**.


    Perdre un tiers des comptes avant la troisième étape d''un parcours d''onboarding est une valeur banale,
    souvent optimiste. **Le signe de l''effet n''est pas établi.** Ce n''est pas « le gain est plus petit
    que 16 points » : c''est « on ne sait pas s''il y a un gain ».


    (Si les abandonnants s''activaient malgré tout à un taux non nul, il en faudrait davantage pour annuler
    l''écart. Mais si l''activation suppose d''avoir terminé l''onboarding, on est au cas le plus défavorable
    : celui ci-dessus.)


    ### 4. Le reste du dossier — avec deux réserves à vérifier avant mardi


    - **−22 % de tickets, file Zendesk.** C''est la mesure la plus solide du dossier, et elle est indépendante
    du défaut d''affectation. Une condition : qu''elle reste une comparaison **de période agrégée**. Si
    quelqu''un la ventile par bras, elle hérite exactement du même biais de survivance. Sous forme agrégée
    elle est confondue avec tout ce qui a bougé sur la période (autres livraisons, saisonnalité, effectif
    support) — à énoncer, pas à masquer.

    - **Rétention 90 j stable.** C''est un résultat nul : absence de dégradation, pas un bénéfice. Et
    à vérifier : si elle est calculée sur les 11 300, c''est encore la population des survivants.


    ---


    ### 5. Contenu exact de la diapositive


    > **Onboarding v2 — état de la mesure**

    > - Charge support : **−22 %** sur la période (file Zendesk, mesure indépendante du test ; comparaison
    de période, non ventilée par bras).

    > - Rétention à 90 jours : **pas de dégradation**.

    > - **Activation : non mesurable à ce jour.** L''affectation du bras v2 était écrite à l''étape 3
    du parcours et non à l''inscription ; les comptes abandonnant avant l''étape 3 sont absents des journaux.
    Le test du 3 mars – 14 avril ne permet pas de conclure sur l''activation, dans un sens ou dans l''autre.

    > - Correctif livré le **[date]**. Lecture propre disponible le **[date + 6 semaines]**.


    Pas de note de bas de page, pas de réserve dans les notes de l''orateur. Le term sheet référence la
    courbe d''activation : cela ne rend pas le chiffre plus nécessaire, cela le transforme en **déclaration
    engageante**. Une réserve orale n''a aucune valeur documentaire face à une représentation contractuelle.


    ### 6. Ce qu''on dit au comité


    Trois phrases, en ouverture et non en réponse à une question :


    > « En préparant l''annexe, nous avons identifié un défaut d''instrumentation dans le test d''activation
    : les deux bras n''étaient pas affectés au même moment du parcours, ce qui rend les taux non comparables.
    Nous retirons le chiffre plutôt que de le corriger approximativement. Le correctif est livré, la lecture
    propre est datée, et le reste du dossier — charge support, rétention — n''est pas touché. »


    Puis, si la question vient : la borne du §3. Un comité à qui l''on présente une borne comprend qu''il
    parle à des gens qui savent ce qu''ils mesurent.


    ### 7. Le meilleur argument contre moi


    *« Tu surcorriges. Tout indicateur de startup a du bruit d''instrumentation ; les investisseurs le
    savent. Retirer le chiffre phare à neuf jours peut faire capoter le tour, ce qui coûte à 42 personnes
    — alors que la baisse des tickets indique que le produit marche probablement. »*


    Il tiendrait si le défaut portait sur la **précision** — ±3 points, une attribution imparfaite. Cela
    irait en note de bas de page. Ici le défaut porte sur l''**existence** du dénominateur, et la population
    manquante est sélectionnée sur le comportement même qu''on mesure. Un intervalle se publie ; une inconnue
    ne se publie à aucune valeur.


    Sur les 42 personnes : un tour signé sur une représentation qui tombe en diligence confirmatoire,
    ou après le closing, leur coûte davantage. Une renégociation de valorisation est douloureuse et réversible
    ; une déclaration inexacte sur un chiffre nommé au term sheet ouvre une branche — rescision, mise
    en jeu des garanties, exposition personnelle des signataires — dont on ne revient pas. Ce sont deux
    natures de risque, pas deux tailles.


    Et le contre-argument a raison sur un point, qui est la raison du §8 : le produit marche peut-être
    vraiment.


    ### 8. Première action — ce soir, pas mardi


    **Reconstruire le dénominateur v2 depuis une autre source.** Les abandons avant l''étape 3 n''ont
    pas de ligne d''affectation, mais ils ont presque certainement une trace ailleurs : évaluation du
    feature flag, log du service de routage, événements étape 1 / étape 2, ligne d''inscription. Si l''on
    récupère la population exposée à l''inscription, on obtient un taux réel — pas une estimation — potentiellement
    dès lundi.


    C''est aussi la sortie pour le VP Produit, et je recommande qu''elle lui revienne explicitement :
    ses neuf mois ne sont pas cassés, ils sont **non encore mesurés**, et son équipe est la mieux placée
    pour aller chercher la mesure. Il porte le correctif et la lecture propre ; la diapositive de mardi
    met en avant le −22 %, qui est son gain le plus défendable.


    **Ce qui renverse ma recommandation :** si la reconstruction aboutit avant lundi soir et montre un
    taux d''atteinte de l''étape 3 nettement au-dessus de 66 % — disons 85 % — alors le taux recalculé
    sur l''ensemble des exposés va sur la diapositive, avec sa note de méthode. Je changerais d''avis
    sur ce fait précis et sur aucun autre. À l''inverse, si la reconstruction n''aboutit pas, la diapositive
    du §5 s''applique telle quelle.


    **Enfin, sur qui tranche :** ce que la société déclare à des investisseurs dans un tour n''est ni
    ma décision, ni celle du VP Produit en trois lignes, ni celle de la direction financière seule. Elle
    appartient à qui signe les déclarations et garanties — direction générale et conseil — et le conseil
    juridique du tour doit être informé du défaut avant mardi, quelle que soit l''issue de la reconstruction.
    Ce point ne dépend pas du reste de la recommandation.

    '
