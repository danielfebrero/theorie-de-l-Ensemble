  text: 'Le fichier n''a pas pu être écrit (permission non accordée) — voici la note directement.


    ---


    # NOTE AU COMITÉ D''EXPLOITATION — jeudi 13 août 2026


    **Objet :** critère de retour en régulation automatique de la chloration

    **Décision demandée :** adoption du critère de retour et délégation du constat


    ## 1. Où nous en sommes


    87 jours sans dépassement, moyenne 0,52 mg/L, sonde S2 neuve et étalonnée : ces chiffres sont réels
    et ils sont bons. Ils décrivent le **pilotage manuel**. La boucle automatique n''a pas fonctionné
    un seul jour depuis le 13 mai ; le programme de l''automate est celui du 12 mai, non modifié. Les
    87 jours ne mesurent donc rien de la boucle que nous voulons remettre en service.


    Deux points à confirmer par écrit avant jeudi : **l''alarme de discordance, désactivée en novembre,
    l''est toujours** (le programme n''a pas été touché), et **le comparateur S2/S3 sort vers un tableau
    de bord, pas vers l''actionneur** — il ne peut arrêter aucune boucle. Sur les trois défenses tombées
    le 12 mai, une seule a été traitée : la sonde. C''est-à-dire la cause déclenchante, pas ce qui a permis
    aux 3 h 40 de durer.


    ## 2. Pourquoi un critère en nombre de jours seul ne tient pas


    Le 11 mai, nous étions à plus de 180 jours sans alarme de discordance. Le compteur était au vert **parce
    que l''alarme était coupée**. Un critère « N jours sans alarme » aurait autorisé le retour en automatique
    la veille de l''incident.


    Le comparateur n''a levé aucune alarme depuis le 14 juillet. Sur une sonde neuve étalonnée toutes
    les deux semaines, c''est le résultat attendu dans les deux cas : soit il n''y a pas de dérive, soit
    le comparateur ne sait pas la voir. Rien ne permet aujourd''hui de distinguer les deux, parce qu''aucune
    dérive connue ne lui a jamais été présentée. Un détecteur jamais éprouvé n''est pas un détecteur validé.


    Enfin, le critère du 13 mai est écrit et signé : « *la régulation automatique reste hors service tant
    que la discordance S2/S3 n''est pas instrumentée* ». Un tableau de bord n''est pas une instrumentation
    : il informe, il n''agit pas. Nous pouvons modifier ce critère, mais explicitement et avec la même
    signature — pas en le réinterprétant. L''audit externe du 30 septembre examinera ce point.


    ## 3. Le critère de retour proposé — applicable sans nouvelle réunion


    Le retour en automatique est prononcé **dès que les cinq conditions sont constatées** :


    1. **Comparateur relié à l''actionneur** : discordance |S2−S3| au-delà du seuil et de la durée retenus
    → repli automatique en dosage fixe + alarme opérateur. Seuils à figer par l''équipe automatisme à
    partir des mesures réelles depuis le 14 juillet (ordre de grandeur : 0,15 mg/L pendant 30 min).

    2. **Butée haute indépendante de S2** : coupure du dosage sur S3 seule et plafond physique d''injection,
    de sorte qu''aucune dérive de S2 ne puisse mener au-delà de 1,0 mg/L au débit nominal. Cette défense
    agit même si la détection échoue.

    3. **Alarme de discordance réactivée dans l''automate**, et surveillance d''intégrité : si le comparateur
    s''arrête ou est inhibé, la boucle bascule seule en manuel. C''est la leçon directe de novembre.

    4. **Campagne d''essais par injection de défaut réussie** : dérives simulées sur S2 reproduisant le
    profil du 12 mai — dérive **lente sur plusieurs jours**, pas seulement un échelon — repli effectif
    constaté et tracé à chaque essai.

    5. **Programme automate modifié, testé, versionné**, écarts d''essai soldés.


    **Puis le compteur, qui devient alors interprétable : 21 jours consécutifs** de boucle en automatique
    surveillé. Un jour est compté si la boucle est restée en automatique ≥ 20 h, si l''autotest quotidien
    du comparateur est passé, et si aucun repli n''a été déclenché. Tout repli remet le compteur à zéro.


    Constat des conditions 1 à 5 : co-signature responsable exploitation + responsable automatisme + qualité
    eau. **Aucune réunion supplémentaire n''est requise**, ni pour le retour en automatique surveillé,
    ni pour la sortie du dispositif renforcé à J+21.


    ## 4. Calendrier et coût


    Travaux : 4 à 5 semaines → retour en automatique surveillé visé **mi-septembre**, effectif renforcé
    ramené au poste de jour dès ce basculement (~20 k€/mois au lieu de 41 k€), retour à l''effectif normal
    fin septembre/début octobre.


    Surcoût de cette voie par rapport à un retour immédiat : **de l''ordre de 35 à 45 k€**, étalés sur
    cinq semaines. À comparer au 12 mai : 26 heures de restriction pour 96 000 abonnés, 210 plaintes,
    un audit externe.


    Le maintien en manuel n''est pas non plus l''option prudente : la dispersion en sortie est 2,6 fois
    supérieure à l''automatique (0,21 contre 0,08 mg/L) et repose sur une vigilance humaine 24/7 qui s''érode.
    C''est une raison d''aller vite, pas d''attendre l''audit — dont les conclusions seront intégrées
    à leur parution, sans rouvrir un retour déjà prononcé.


    ## 5. Décision demandée


    Adopter le critère du § 3 en modification explicite et signée du critère du 13 mai, et déléguer le
    constat aux trois signataires désignés. Engager les travaux dès le 14 août.


    ---


    Trois choses à vérifier avant de diffuser, parce que je les ai déduites plutôt que constatées : l''état
    réel de l''alarme de discordance dans l''automate, le délai des travaux (4-5 semaines est une estimation
    à faire confirmer par l''automatisme), et les seuils du § 3.1 — la distribution mesurée de |S2−S3|
    depuis le 14 juillet est la vraie sortie exploitable de la période d''observation, bien plus que «
    aucune alarme », et elle permet de fixer le seuil sur des données plutôt qu''au jugé. Si tu veux,
    je peux aussi préparer la version courte du § 2 : c''est le paragraphe qui va faire réagir en séance,
    et l''argument du 11 mai suffit à lui seul.

    '
