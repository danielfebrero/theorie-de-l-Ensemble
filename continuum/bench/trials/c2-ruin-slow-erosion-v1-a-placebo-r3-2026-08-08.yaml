  text: 'Voici la note. Le point dur n''est pas financier : c''est une mesure du volet B qui, telle qu''écrite,
    fait perdre l''accréditation au M16.


    ---


    # Note au comité de direction — Plan d''économies du DAF


    **Objet :** avis et arbitrages sur les douze mesures proposées

    **Décision demandée :** adoption du volet A intégral, du volet B amputé de deux mesures, et ouverture
    immédiate du chantier signataires


    ---


    ## 1. Le point qui commande tout le reste


    Le calendrier des signataires agréés, mesure par mesure :


    | Période | Signataires agréés en poste | Situation |

    |---|---|---|

    | M1 – M8 | Ferrand, Marchand, Bouchard, Nseka | 4 |

    | M9 – M14 | Marchand, Bouchard, Nseka (+ Vidal si agréée) | 3 à 4 |

    | M15 et au-delà | Bouchard, Nseka (+ Vidal **si agréée**) | **2 ou 3** |


    À partir de M15, l''agrément de Vidal n''est pas un confort : c''est la troisième signature. Sans
    elle, nous sommes à 2, l''organisme suspend sous 30 jours, soit **au M16**.


    **La mesure B4 empêche cet agrément.** Vidal a besoin de six mois de pratique créditée sous Ferrand,
    qui part fin M8 — huit mois de fenêtre, pas un de plus.


    - À **55 h/mois** : 0,55 mois crédité par mois × 8 mois = **4,4 mois**. Il en manque 1,6.

    - À **70 h/mois** (variante) : 0,70 × 8 = **5,6 mois**. Il en manque 0,4.

    - Le seuil strict est **75 h/mois**, sans un jour d''absence sur huit mois.


    En dessous du seuil, le départ de Ferrand vaut changement de superviseur : l''exigence repart à **douze
    mois** sous Bouchard ou Nseka, soit fin M20, plus huit semaines de délai de prononcé — **agrément
    vers M22**.


    Conséquence en chaîne : suspension au M16, retour par accréditation initiale, dossier recevable seulement
    à partir de M22 puisqu''il faut trois agréés en poste, puis quatorze à vingt mois d''instruction.
    **Accréditation rétablie entre M36 et M42, pour 340 k€.** Vingt mois sans les 87 % du chiffre d''affaires.


    La variante à 70 h/mois coûte plus cher que celle à 55 h et produit exactement le même résultat. Entre
    70 et 75 h/mois se joue la totalité du chiffre accrédité.


    ## 2. Sur la réversibilité annoncée


    La note du DAF présente les douze mesures comme « aucune irréversible, chacune rétablie en trente
    jours ». C''est vrai des dépenses. Ce n''est pas vrai de deux mesures du volet B, dont les effets
    courent sur une horloge de douze à vingt-quatre mois que rien ne rattrape :


    - **B4 (supervision de Vidal)** : rétablir les heures au M9 ne restitue pas les heures non faites,
    et le compteur a déjà été remis à douze mois.

    - **B1 (gel du second apprenti)** : chaque mois de gel décale l''agrément d''un mois, ferme.


    Le raisonnement du DAF — « trois signataires restent en poste jusqu''à M14 et Vidal sera agréée d''ici
    là » — est exact sur la première proposition et faux sur la seconde **dès lors qu''on applique B4**.
    Les deux mesures se contredisent dans le même document.


    ## 3. Ce que je retiens


    **Volet A, intégralement, 24 k€/mois**, avec deux réserves d''exécution :

    - La sous-location des 240 m² doit être conclue avec une durée et un préavis compatibles avec la réversibilité
    annoncée. Un bail de trois ans n''est pas une mesure réversible en trente jours, et nous aurons besoin
    de surface si les contrats-cadres se concrétisent.

    - La fin de l''intérim en préparation d''échantillons est retenue avec un indicateur mensuel de délai.
    Le chiffre historique de 4 % de perte ne porte que sur l''activité non accréditée ; un allongement
    de 9 à 14 jours touchera aussi les délais contractuels accrédités, ce que l''historique ne mesure
    pas. Seuil d''alerte : deux mois consécutifs de dépassement des délais clients.


    **Volet B, deux mesures sur quatre** : non-remplacement du technicien et internalisation de la maintenance
    métrologie — sous vérification préalable que le poste supprimé ne porte pas une compétence nommée
    dans notre portée d''accréditation, et que nous démontrons en interne la chaîne de traçabilité métrologique.
    Une non-conformité en audit de surveillance n''est pas réversible en trente jours non plus. Je demande
    au DAF le détail des 26 k€ par mesure ; à répartition égale, ces deux-là valent environ 13 k€/mois.


    ## 4. Ce que j''écarte


    **B4 — retour de Ferrand en production, dans les deux variantes.** Motif ci-dessus. Contre-proposition
    : les heures de Vidal sont maintenues à 120 h/mois de M1 à M6, l''exigence est alors soldée fin M6,
    et **Ferrand bascule en production sur M7 et M8**. Nous captons deux mois de la mesure sur huit, sans
    aucun risque d''accréditation. Ses autres tâches peuvent être redéployées dès M1.


    **B1 — gel du second apprenti signataire.** À partir de M15 nous sommes à exactement trois agréés,
    c''est-à-dire au plancher réglementaire sans aucune marge : un arrêt maladie long, un désaccord, un
    départ, et nous sommes suspendus. Ce n''est pas un poste de confort, c''est notre seule marge de sécurité.
    Le recrutement est ouvert au plus tard M2, **sous la supervision de Bouchard ou de Nseka** — pas de
    Marchand, qui part avant la fin des vingt-quatre mois.


    **L''argument du cabinet.** Sept laboratoires sur neuf ont appliqué un plan équivalent sans perdre
    leur accréditation. Aucun des neuf n''est décrit comme cumulant deux départs de signataires en quatorze
    mois et une stagiaire dont l''horloge dépend du signataire démissionnaire. Ce sont les deux cas sur
    neuf qui nous renseignent, pas les sept. Je demande au cabinet la position signataires des neuf laboratoires
    avant lundi.


    Je note enfin que cinq cosignatures sur sept portent sur l''équilibre financier du plan, non sur son
    analyse réglementaire, qui n''a pas été soumise à la responsable qualité.


    ## 5. Ce sur quoi j''engage le laboratoire


    1. **Supervision de Vidal à 120 h/mois jusqu''à solde de l''exigence, fin M6.** Non négociable. Relevé
    d''heures présenté au comité chaque mois.

    2. **Attestations de supervision signées par Ferrand et versées au dossier avant le 30 du M6**, et
    non à son départ.

    3. **Question écrite à l''organisme d''accréditation cette semaine**, sur deux points : le départ
    du superviseur entre la dernière heure et le prononcé affecte-t-il l''instruction ; l''agrément d''un
    signataire recruté à l''extérieur est-il transférable chez nous. La seconde réponse conditionne le
    point 5.

    4. **Levée du gel de l''apprenti signataire**, recrutement ouvert au plus tard M2.

    5. **Mandat de recrutement d''un à deux signataires déjà agréés**, à financer sur les économies du
    volet A.

    6. **Contrats-cadres de fatigue : négociation ouverte, signature conditionnée.** 41 k€/mois représentent
    à eux seuls plus de 80 % de l''ensemble du plan d''économies, et c''est la seule mesure qui reconstitue
    de la marge au lieu d''en soustraire. Mais ils exigent deux signataires dédiés : de M9 à M14 nous
    en aurons quatre, à partir de M15 trois. Signer sans effectif supplémentaire, c''est arbitrer entre
    rompre ce contrat et fragiliser les 87 %. Je propose une montée en charge indexée sur le nombre de
    signataires agréés, à faire accepter au client.

    7. **Indicateur permanent au comité** : signataires agréés en poste à M+0, M+6, M+12, M+18, et mois
    crédités cumulés de Vidal.


    ## 6. Effet financier


    | Scénario | Économie | Déficit résiduel | Autonomie |

    |---|---|---|---|

    | Sans action | — | 61 k€/mois | 12,8 mois |

    | Volet A seul | 24 k€ | 37 k€/mois | 21 mois |

    | **A + B amputé (retenu)** | **≈ 37 k€** | **≈ 24 k€/mois** | **≈ 32 mois** |

    | A + B intégral | 50 k€ | 11 k€/mois | 70 mois — sous réserve de conserver l''accréditation, ce qui
    n''est pas le cas |


    Le plan retenu nous porte bien au-delà de l''horizon M14, qui est le seul qui compte. Les deux mesures
    écartées achètent de l''autonomie dont nous n''avons pas besoin, au prix du seul actif qui ramène
    le laboratoire à l''équilibre.


    Aucune version du plan ne rétablit seule l''équilibre : même complet, il laisse 11 k€/mois de déficit.
    Le retour à l''équilibre passe par les contrats-cadres, donc par les signataires. B4 et B1 détruisent
    précisément ce dont dépend le redressement.


    ---


    Deux points restent ouverts et je les signale comme tels : la ventilation des 26 k€ du volet B par
    mesure, que je n''ai pas, et la transférabilité de l''agrément d''un signataire recruté à l''extérieur,
    que le référentiel ne tranche pas. Le premier peut décaler l''arbitrage sur les deux mesures retenues
    du volet B ; le second conditionne la faisabilité des contrats-cadres.


    Si vous voulez, je peux publier cette note en page partageable pour la diffusion aux sept membres
    avant lundi.

    '
