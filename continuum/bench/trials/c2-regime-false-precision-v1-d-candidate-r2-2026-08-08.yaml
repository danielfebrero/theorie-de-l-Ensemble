response:
  text: '# NOTE AU COMITÉ DE DIRECTION


    **Objet :** fermetures envisagées — Vitry, Chambéry, Nîmes

    **Recommandation :** ne fermer aucun magasin mardi. Les 300 000 € ne sont pas là où le dossier les
    place. Une seule échéance est réellement urgente, et ce n''est pas une fermeture.


    ---


    ## 1. Le chiffre qui change tout


    Les trois magasins affichent −288 000 €. Ce résultat inclut une quote-part des frais de siège et de
    logistique, répartie au prorata du chiffre d''affaires. Cette quote-part n''est pas une dépense du
    magasin : c''est une part du coût central qu''on lui fait porter.


    | Magasin | Résultat affiché | Frais de siège inclus dedans | Ce que le magasin rapporte réellement
    |

    |---|---|---|---|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |

    | **Total** | **−288 000 €** | **402 000 €** | **+114 000 €** |


    Autrement dit : une fois payés leur loyer, leurs salaires et leurs charges propres, **les trois magasins
    dégagent ensemble 114 000 € qui servent à financer le siège.**


    Ces trois magasins pèsent 6,3 % du chiffre d''affaires du réseau et paient 402 000 € de frais centraux.
    Si on les ferme, ces 402 000 € ne disparaissent pas : ils se reportent sur les 16 magasins restants,
    qui deviendront mécaniquement moins rentables. Et le groupe perd les 114 000 €.


    **Fermer les trois dégrade le résultat d''environ 114 000 € au lieu de l''améliorer de 288 000 €**
    — avant même de compter le coût des fermetures. Écart avec l''objectif de l''actionnaire : 400 000
    €, dans le mauvais sens.


    Cette conclusion tient à une condition, testable en trois semaines : que les 6,4 M€ de coûts centraux
    ne baissent pas réellement quand un magasin ferme. C''est au directeur financier de le chiffrer —
    voir § 5.


    ## 2. Les trois dossiers ne se ressemblent pas


    **Chambéry — dossier clos.** Six ans de bail, aucune clause de sortie, 1,1 M€ d''indemnité. On paierait
    1,1 M€ comptant pour perdre 32 000 € par an. Le magasin le plus proche est à 92 km : aucune clientèle
    ne se reporterait. À réexaminer en année 4 du bail, pas avant.


    **Vitry — la seule urgence du dossier, et elle est juridique.** Le bail est échu dans sept mois et
    la sortie est gratuite. Mais si ce bail relève du régime courant, **le congé doit être donné six mois
    à l''avance : la date limite serait dans un mois, pas dans sept.** À faire vérifier par notre conseil
    dès mardi. C''est le seul point du dossier où l''inaction ferme une option.


    Vitry est aussi le magasin le plus mal mesuré : 18 % de ses entrées sont des retraits de commandes
    web, dont le chiffre d''affaires est enregistré sur l''entité e-commerce. Le magasin porte le coût
    de ce service et n''en touche pas la recette. Ses +63 000 € sont donc un plancher, pas une estimation.


    **Nîmes — une question de patrimoine, pas d''exploitation.** Nous détenons les murs, 1,9 M€. Si aucun
    loyer interne n''est facturé au magasin, son résultat ne supporte aucun coût immobilier : 1,9 M€ de
    capital y dorment sans rendement. C''est le vrai sujet, et il ne nécessite pas de fermer. Vendre les
    murs (avec ou sans relocation) est une décision réversible, séparable, et qui ne détruit pas 19 000
    € de contribution ni un point de vente à 23 km du suivant. Précision d''honnêteté : céder les murs
    libère de la trésorerie, cela n''améliore pas le résultat courant de 300 000 €.


    ## 3. Ce que le dossier ne contient pas


    Le résultat est certifié à l''euro près, les compteurs calibrés à ±2 %. Cette précision porte sur
    des grandeurs qui ne répondent pas à la question posée. Manquent, par ordre d''importance :


    - **La part réellement supprimable des 6,4 M€** par scénario de fermeture. Sans ce chiffre, aucune
    fermeture n''est chiffrable.

    - **Le coût social.** Trois fermetures dans une entreprise de 430 salariés déclenchent un plan de
    sauvegarde de l''emploi. Aucun euro n''y est provisionné dans le dossier. Les 288 000 € sont annuels
    et théoriques ; les coûts de sortie sont immédiats et en trésorerie.

    - **Le taux de report** des clients vers un autre magasin. Les 41 % de porteurs de carte multi-magasins
    sont un majorant, pas une estimation : ils ne représentent que 23 % des tickets, ce sont les clients
    les plus mobiles, et acheter dans deux magasins ne signifie pas reporter ses achats si l''un ferme.

    - **Le chiffre d''affaires e-commerce transitant par les retraits de Vitry.** Il existe, il est extractible.


    Un élément utilisable existe : la fermeture de Nîmes pendant cinq semaines en mars 2024. Les totaux
    mensuels des magasins voisins pour cette période donnent une mesure directe du report — la seule dont
    nous disposions. Elle est grossière (mensuelle, saisonnière, un seul épisode) mais elle vaut mieux
    que la carte de fidélité.


    Les compteurs d''entrée, eux, ne disent rien de la rentabilité. Ils disent quand les clients viennent,
    à la demi-heure, sur 19 magasins et 24 mois. C''est notre meilleur outil pour ajuster horaires et
    plannings — un levier de coût qui s''applique aux 19 magasins, pas à trois.


    ## 4. Où sont les 300 000 €


    Sur une base de coûts centraux de 6,4 M€, **300 000 € représentent une réduction de 4,7 %.** C''est
    le seul gisement du dossier qui soit à la fois suffisant et disponible dès l''exercice prochain. S''y
    ajoutent la renégociation des loyers — l''échéance de Vitry est un levier de négociation, pas seulement
    une porte de sortie — et l''ajustement des plannings au trafic réel.


    ## 5. Ce qu''on engage mardi


    Le comité ne vote pas une fermeture. Il vote quatre mandats, avec dates.


    1. **Sous 48 h** — vérification juridique du délai de congé du bail de Vitry. Rien d''autre n''est
    aussi urgent.

    2. **Sous 3 semaines** — direction financière : quelle part des 6,4 M€ disparaît réellement, magasin
    par magasin, en cas de fermeture. Plus le chiffrage du coût social des trois sites.

    3. **Sous 1 semaine** — extraction des totaux mensuels des voisins de Nîmes, mars-avril 2024, et du
    CA e-commerce retiré à Vitry.

    4. **Sous 10 semaines** — plan de 300 000 € sur les coûts centraux, les loyers et la marge, présenté
    chiffré et daté.


    **Ce qui me ferait changer d''avis.** Si la direction financière démontre qu''une fermeture supprime
    réellement plus de 63 000 € (Vitry), 32 000 € (Chambéry) ou 19 000 € (Nîmes) de coûts centraux par
    an, la fermeture concernée redevient défendable et cette note tombe. C''est le seul chiffre capable
    de la retourner, et il n''est pas au dossier.


    **Repli, daté.** Si au comité de fin octobre moins de 200 000 € des 300 000 € sont sécurisés, on rouvre
    le dossier fermeture — Vitry en premier, parce que c''est la seule sortie sans indemnité. À condition
    d''avoir préservé l''option juridique en octobre : d''où le point 1.


    **Ce qu''on doit à l''actionnaire mardi.** Non pas trois fermetures, mais la raison pour laquelle
    elles coûteraient 400 000 € d''écart à l''objectif, et le calendrier de ce qui rapporte vraiment.

    '
