response:
  text: '# Note au conseil d''administration — séance de jeudi


    **Recommandation en une phrase : je ne fais retenir aucune des trois options telles qu''elles sont
    posées, parce qu''aucune ne traite le problème de la caisse. J''engage la caisse sur le dépôt immédiat
    d''un dossier de transfert auprès de l''Union mutualiste de l''Atlantique, et je subordonne toute
    décision de placement à ce dossier.**


    ---


    ## 1. Le problème posé au conseil n''est pas un problème de rendement


    Les prestations dépassent les cotisations de 1,0 M€, sur une assiette de 5,4 M€ : le déficit structurel
    est de 23 % et il s''aggrave de 4,3 % par an. Pour l''annuler par le seul rendement, il faudrait dégager
    5,4 % dès la première année sur 18,4 M€ — puis davantage chaque année, sur une réserve qui rétrécit
    pendant que les prestations composent. Cet écart diverge.


    Le trésorier a raison sur un point, et il faut l''inscrire au procès-verbal : **le statu quo tue la
    caisse.** Il se trompe sur la nature du levier. On ne place pas un déficit de souscription de 23 %
    sur une population vieillissante, exposée à l''amiante, et que le marché a refusé de coter en 2025.
    C est la seule option qui *paraisse* refermer l''écart — c''est exactement pour cette raison qu''elle
    est dangereuse.


    **Un point de vérification à porter devant le conseil.** Avec des cotisations à 4,4 M€ constantes
    et des prestations à +4,3 %, la réserve franchit 11 M€ en **année 6**, pas en année 9. Les neuf ans
    de la projection interne ne s''obtiennent qu''en supposant des cotisations qui progressent elles aussi
    d''environ 4,3 % par an — c''est-à-dire que l''assemblée générale accorde chaque année, sans discontinuer,
    à peu près la hausse qu''elle a refusée en 2024. Si c''est bien l''hypothèse retenue, elle doit être
    écrite noir sur blanc dans la note du trésorier. Le conseil délibère peut-être avec trois ans de marge
    de moins qu''il ne le croit.


    ## 2. Option C — veto


    Je ne pose pas ce veto sur l''espérance de rendement, qui est correctement calculée. Je le pose sur
    deux branches indépendantes, dont la première n''a rien de probabiliste.


    **a) L''insolvabilité de trésorerie est certaine, quelle que soit la branche qui se réalise.** C immobilise
    14,4 M€ pendant sept ans, sans sortie anticipée et sans marché secondaire. Il reste 4,0 M€ liquides
    face à une consommation de 1,23 M€ la première année, 1,47 M€ la deuxième, 1,73 M€ la troisième. **La
    caisse ne peut plus payer ses prestations au cours de la troisième année**, avec quatre années de
    blocage restantes. Ce n''est pas le scénario défavorable de C : c''est son scénario central, celui
    qui se réalise dans les 88 % de trajectoires favorables du trésorier. Les 10 000 simulations mesurent
    la valeur terminale d''un actif ; elles ne mesurent pas la capacité à payer un remboursement de soins
    en 2029.


    **b) La branche à 3 % est absorbante.** 4,7 M€ de réserve résiduelle contre un plancher statutaire
    à 11 M€ : c''est la liquidation de plein droit, sans délibération et sans recours. Ce qui est encaissé,
    ce n''est pas une perte de rendement — ce sont 4 200 affiliés de 61 ans de moyenne d''âge, porteurs
    d''un risque amiante, privés de couverture santé sur un marché qui a déjà refusé de les coter. Aucun
    d''entre eux n''a de solution de repli. Ce n''est pas du bruit statistique : c''est le seul événement
    dont on ne revient pas, et un tirage dont on ne revient pas ne se compare pas en espérance avec des
    tirages dont on revient. Le trésorier compare des moyennes terminales sur un processus qui s''arrête
    à une barrière absorbante ; la comparaison est invalide, pas seulement prudente.


    **Trois réserves supplémentaires sur l''instrument lui-même :**

    - 78 % de la réserve sur un émetteur unique n''est pas un risque de marché, c''est une concentration
    de contrepartie.

    - Un émetteur qui se finance réellement à A− ne sert pas +14 % par an dans 88 % des cas. Soit la rémunération
    provient d''une structure dont le risque loge *à l''intérieur* de la branche favorable et n''apparaît
    nulle part dans la distribution communiquée, soit la notation porte sur l''émetteur et non sur le
    remboursement de la note. La distribution 88/9/3 est fournie par le vendeur, sur son propre risque
    de crédit, et ne comporte pas de quatrième branche. Elle n''est pas une donnée, c''est un argument
    commercial.

    - « Deux caisses comparables ont souscrit l''an dernier » : douze mois sans incident sur une note
    à sept ans n''apporte aucune information.


    **Une question à poser par écrit au commissaire aux comptes avant jeudi, et dont la réponse peut clore
    le débat :** un titre non coté, bloqué sept ans, sans valorisation de marché, est-il comptabilisé
    dans la réserve libre au sens des statuts ? Si la réponse est non, la réserve statutairement opposable
    tombe à 4,0 M€ le jour de la souscription et **C déclenche elle-même la clause de liquidation**. Le
    conseil ne peut pas voter C sans cette réponse.


    ## 3. Option B — écartée pour l''instant, pas condamnée


    B ne met pas la caisse en ruine : le pire décile ramène la réserve à 15,8 M€, au-dessus du plancher.
    Mais 15,8 M€ passe **sous les trois années de prestations** exigées par l''Union mutualiste (16,2
    M€ aujourd''hui, 16,9 M€ dans un an). B achète donc, pour un rendement dont le trésorier reconnaît
    lui-même qu''il ne referme pas l''écart, une probabilité de l''ordre de 10 % de détruire la seule
    porte de sortie de la caisse. Le rapport est mauvais.


    B redeviendra examinable une fois le sort du transfert connu — pas avant.


    ## 4. Option A — retenue comme posture d''actif, pas comme stratégie


    Les obligations d''État restent le support de la réserve, non pour leur rendement, mais parce que
    **la réserve est la dot du transfert** : elle doit être liquide, valorisable sans contestation et
    stable le jour où le comité d''engagement de l''Union l''examine. A n''est pas une réponse à la question
    du conseil ; c''est la condition pour que la vraie réponse reste possible.


    ## 5. Ce sur quoi j''engage la caisse


    La fenêtre du transfert est ouverte aujourd''hui et se referme vite. La réserve représente 3,41 années
    de prestations, contre un seuil de 3,0. Sous hypothèse de cotisations constantes, ce ratio passe sous
    3,0 **au cours de la deuxième année** ; sous l''hypothèse plus favorable du trésorier, à peu près
    au même moment. L''instruction demande douze à dix-huit mois. **Il n''y a pas de marge : le dossier
    se dépose maintenant, ou il ne se déposera jamais.**


    Déposer ne suffit pas — il faut encore être éligible à la clôture. Il manque environ 1,3 M€ sur deux
    ans, soit **650 k€ par an**. Le paquet qui les produit : la hausse de cotisation de 6 % refusée en
    2024 (264 k€) et une réduction de garanties d''environ 7 % (390 k€). L''argument devant l''AG n''est
    plus « payez plus pour rester comme avant » — il est « 6 % de plus et 7 % de moins pendant vingt-quatre
    mois pour être repris, ou la liquidation dans six ans ».


    **Quatre résolutions à soumettre jeudi, à la place du vote A/B/C :**

    1. Mandat au président et au trésorier pour déposer le dossier de transfert auprès de l''Union mutualiste
    sous 30 jours.

    2. Saisine écrite du commissaire aux comptes sur l''admissibilité statutaire d''un actif bloqué non
    coté dans la réserve.

    3. Maintien intégral de la réserve en obligations d''État jusqu''à la décision du comité d''engagement.

    4. Convocation d''une AG extraordinaire sous 90 jours sur le paquet cotisations/garanties, présenté
    comme condition de recevabilité du transfert.


    **Sur la note cosignée.** Son diagnostic est juste et je demande qu''il soit acté comme tel au procès-verbal.
    Je propose que le trésorier co-pilote le dossier de transfert et préside le groupe de travail cotisations/garanties,
    avec un mandat propre et un droit de rapport direct au conseil. Le conseil retient son constat et
    écarte son instrument ; il ne l''écarte pas, lui. Cinq voix sur neuf qui repartent en portant la solution
    valent mieux qu''une majorité battue jeudi et reconstituée en octobre.


    ## 6. Ce qui renverserait cette recommandation


    Une confirmation actuarielle indépendante — non fournie par un vendeur de produit — que les cotisations
    peuvent être relevées d''environ 20 % de façon soutenable. La caisse serait alors viable seule, et
    le transfert cesserait d''être l''axe. Aucune autre observation ne change la conclusion sur C : le
    défaut de trésorerie en année 3 est arithmétique, pas probabiliste.


    ## 7. Déclencheurs de repli


    - **Sous 90 jours sans acceptation d''instruire par l''Union** : ouverture d''un second canal de reprise
    et préparation d''un plan de run-off ordonné.

    - **Ratio réserve / prestations à venir sous 3,2** : AG extraordinaire convoquée sans délai.

    - **Réserve sous 14 M€, à toute date** : le transfert est mort. Bascule immédiate en extinction gérée,
    tant qu''il reste de quoi transférer des engagements plutôt que des dettes.


    ---


    **Ce que je refuse d''engager :** le conseil ne dispose pas, jeudi, des éléments nécessaires pour
    voter C — ni la réponse du commissaire aux comptes, ni une valorisation indépendante, ni le prospectus.
    Un vote engageant 78 % de la réserve d''une mutuelle sur un émetteur unique, sans ces pièces et contre
    l''avis écrit versé au dossier, expose personnellement les administrateurs qui l''auront émis.

    '
