response:
  text: '## Note de position — présidence de la commission locale de l''eau du bassin de la Vèze

    *Pour la séance de jeudi*


    ---


    ### 1. Le déficit de 160 L/s n''est pas un fait : c''est une soustraction entre trois nombres dont
    aucun n''est vérifié


    Je refuse d''ouvrir la séance sur l''équation 240 + 150 + 180 = 570. Elle transforme trois revendications
    en données physiques et enferme la commission dans un arbitrage entre victimes.


    **410 L/s** : une station unique, étalonnée pour la dernière fois en 2023. Une station de jaugeage
    dérive typiquement de 5 à 15 % en trois ans, et le sens de la dérive est inconnu. Nous pilotons un
    partage à 40 L/s près avec un instrument dont l''incertitude vaut probablement 40 à 60 L/s. Plus grave
    : le débit réservé est aujourd''hui *déduit* par soustraction au barrage, alors que l''objet à protéger
    se trouve à l''aval. Nous ne mesurons pas ce que nous prétendons garantir.


    **150 L/s pour la régie** : c''est un prélèvement, pas un besoin. Rapporté à 9 200 habitants, cela
    fait 1 409 litres par habitant et par jour. La consommation domestique française est de l''ordre de
    150 L/hab/j, et un service rural mal rendu tourne autour de 250 L/hab/j prélevés, pertes comprises.
    Le chiffre de la régie est cinq à neuf fois cet ordre de grandeur. Trois explications possibles :
    le réseau dessert d''autres communes, il alimente de gros consommateurs non domestiques, ou son rendement
    est très dégradé. Aucune n''a été produite. Tant qu''elle ne l''est pas, 150 L/s n''est pas une contrainte,
    c''est une position de négociation.


    **240 L/s pour l''irrigation** : ce chiffre-là est le plus solide des trois. Il correspond à 3,3 mm/jour
    sur 620 ha, soit sensiblement la consommation en pointe d''un maraîchage d''été. Ce que je conteste
    n''est pas le besoin, c''est **l''effet de seuil**. « En dessous de 240, la récolte est perdue » décrit
    une falaise ; l''agronomie décrit une pente. Et le chiffre de 4,1 M€ rapporté à 620 ha donne 6 613
    €/ha — très en dessous du produit brut d''un vrai maraîchage. Soit la perte est sous-évaluée, soit
    les 620 ha sont très hétérogènes. Les deux hypothèses conduisent au même endroit : **un abattement
    uniforme est le pire des instruments**.


    Je note enfin que ces trois nombres ont chacun été produits par la partie qui en bénéficie, et qu''aucun
    n''est contradictoire.


    ---


    ### 2. Deux planchers que je ne mets pas au vote


    **Le débit réservé de 180 L/s.** D''abord parce qu''il ne m''appartient pas : il relève de l''arrêté
    préfectoral, la commission n''a pas compétence pour l''entamer. Ensuite parce que même si je l''avais,
    je ne le ferais pas. Le rapport du 12 juin qualifie la perte de non reconstituable à l''échelle d''une
    décennie. Toutes les autres pertes en jeu ici — une récolte, une trésorerie, une saison — sont des
    pertes d''un an. Une perte de dix ans n''est pas une perte plus grande : c''est une perte d''une autre
    nature, qu''aucun gain annuel ne rachète. C''est le seul principe de classement que j''applique, et
    je l''appliquerai dans les deux sens (voir §7).


    **Un plancher vital d''eau potable.** Alimentation domestique, EHPAD, défense incendie. Je l''estime
    provisoirement entre 45 et 70 L/s ; l''audit du réseau le fixera sous dix jours. Il est garanti sans
    condition, sans vote et sans révision à la baisse. **D''ici l''audit, la régie conserve ses 150 L/s
    en totalité** : je ne réduis pas un service d''eau potable sur la base d''un calcul d''ordre de grandeur
    fait par le président de la commission.


    Tout le reste est négociable, y compris les 80 L/s d''écart entre le plancher vital et le prélèvement
    actuel de la régie.


    ---


    ### 3. Instrument : quotas individuels, pas volume global par usage


    Mon règlement m''offre les deux. Je choisis les quotas individuels, pour une raison opérationnelle
    et une raison d''équité.


    **Opérationnelle** : un volume global sans compteurs individuels n''est pas une règle, c''est une
    course au pied de la pompe. Il est inapplicable et incontrôlable — c''est d''ailleurs l''une des raisons
    pour lesquelles le dispositif de 2022 n''a rien tenu.


    **Équité** : six exploitations cultivent 300 des 620 ha. Un volume global délègue la répartition interne
    à un groupe où six acteurs pèsent la moitié de la surface et disposent des plus fortes capacités de
    pompage. Je ne peux pas remettre le sort des 28 autres à un rapport de force que je sais déséquilibré.


    Objection prévisible : la commission n''a aucune donnée parcellaire. Elle est fondée, et elle détermine
    la forme du quota. **Je n''attribue pas des cultures, j''attribue un volume.** La clé n''utilise que
    la surface irriguée déclarée — récupérable sous 72 h auprès de la DDT via le registre parcellaire
    graphique, complétée par déclaration sur l''honneur avec 48 h de contestation contradictoire. Chaque
    exploitant répartit ensuite son volume sur ses parcelles comme il l''entend. Il connaît ses stades
    végétatifs ; moi non, et je n''ai pas besoin de les connaître.


    **Clé retenue** : un socle égal par exploitation (couvrant un noyau de culture à besoin plein) + un
    complément proportionnel à la surface, avec un abattement progressif au-delà de 20 ha. Les six grandes
    exploitations supportent une part relative plus forte : elles ont la diversification, le stockage
    et l''accès au crédit que les 28 autres n''ont pas.


    ---


    ### 4. La répartition, et pourquoi elle n''est pas ce qu''elle paraît


    | Période | Réservé | Potable | Irrigation |

    |---|---|---|---|

    | J+0 → J+10 | 180 | 150 (inchangé) | **80** |

    | J+10 → J+25 | 180 | 130 (usages non essentiels + premières fuites) | **100** |

    | J+25 → fin | 180 | 110 | **120** |


    Moyenne sur huit semaines : environ 107 L/s, soit 45 % de la demande. Les gains obtenus sur le réseau
    potable servent **d''abord** à absorber la baisse du débit entrant ; l''irrigation ne monte que si
    le débit entrant tient.


    Voici le point que je demanderai aux maraîchers d''entendre avant de quitter la salle. À 240 L/s,
    620 ha reçoivent 3,3 mm/j. À 80 L/s, **étalés sur 620 ha, tout meurt** : 1,1 mm/j ne sauve rien. Concentrés,
    ces mêmes 80 L/s couvrent intégralement 207 ha. Sur la trajectoire complète, environ 280 ha peuvent
    être menés à récolte pleine. La question n''est pas « 240 ou la ruine » : c''est « 620 hectares morts,
    ou 280 hectares vivants ». Le quota individuel est précisément l''outil qui permet cette concentration,
    et l''abattement uniforme celui qui l''interdit.


    Cela reste une perte lourde, et je ne la présenterai pas autrement.


    ---


    ### 5. La règle de levée : ce qui a échoué en 2022 et ce que je change


    Le seuil « 48 h au-dessus » a confondu un orage avec une recharge. Le 9 août a produit un pic de ruissellement
    ; la reprise intégrale du 11 a consommé la réserve en quatre jours.


    Je remplace un seuil symétrique par un cliquet asymétrique :


    - **Lever** exige dix jours consécutifs de moyenne journalière ≥ 480 L/s **et** une moyenne des trois
    derniers jours supérieure à celle des trois premiers — un pic de crue est décroissant, une recharge
    ne l''est pas. Ce second test est gratuit et il aurait rejeté l''épisode du 9 août.

    - La levée se fait **par paliers de 25 %**, avec sept jours d''observation entre deux paliers.

    - **Resserrer** est immédiat : une seule journée sous le seuil du palier en cours, et retour au palier
    inférieur sous 24 h, sans vote.


    Descendre vite, remonter lentement.


    ---


    ### 6. Les 600 000 € : acheter de l''eau et de la preuve, pas de la paix sociale


    | Poste | Montant |

    |---|---|

    | Jaugeages indépendants, réétalonnage de la station, **station aval au droit des frayères** | 60
    k€ |

    | 34 compteurs télérelevés + sectorisation et pré-localisation de fuites sur le réseau régie | 150
    k€ |

    | Réparations de fuites d''urgence | 180 k€ |

    | Sécurisation du tampon de la régie (interconnexion, stockage mobile, remise en service d''un forage)
    | 120 k€ |

    | Aide de trésorerie et d''équipement ciblée sur les exploitations < 10 ha (goutte-à-goutte, paillage)
    | 90 k€ |


    **Zéro euro d''indemnisation forfaitaire**, et j''assume de le dire aux maraîchers. 600 k€ face à
    4,1 M€ revendiqués, c''est 15 % ; répartis sur 34 exploitations, c''est un geste symbolique qui n''achète
    pas un litre. La recherche et la réparation de fuites, elle, peut restituer 10 à 25 L/s pour environ
    180 k€ — de l''ordre de 10 k€ par L/s, et ce L/s reste acquis après la sécheresse. L''indemnisation
    relève du régime des calamités agricoles, du dégrèvement de taxe foncière et du fonds d''urgence de
    l''État : je saisis le préfet et le président du département cette semaine pour la demander, en mon
    nom, à l''appui du dossier des maraîchers. Ce n''est pas ma compétence, mais c''est ma responsabilité
    de la réclamer.


    ---


    ### 7. Ce qui me ferait changer d''avis — et je m''y engage par écrit


    - **Si le jaugeage indépendant montre que la station sur-estime de plus de 10 %** (débit réel < 370
    L/s), la répartition ci-dessus est caduque : il ne reste plus rien pour l''irrigation une fois les
    deux planchers servis, et je saisis le préfet d''une suspension.

    - **Si elle sous-estime**, l''irrigation passe immédiatement à 130 L/s.

    - **Si l''audit de la régie établit un rendement de réseau supérieur à 90 % et l''absence d''usages
    non essentiels**, alors les 150 L/s sont un besoin réel, il n''y a rien à récupérer de ce côté, l''irrigation
    reste à 80 L/s pour toute la durée, et je redéploie l''intégralité du fonds vers les ressources de
    substitution.

    - **Si une exploitation démontre que son quota lui fait perdre une culture pérenne** — asperges, petits
    fruits, plantation en cours d''installation — elle passe en priorité devant les cultures annuelles.
    J''ai classé les frayères au-dessus de la récolte parce que dix ans ne se rattrapent pas ; je dois
    appliquer la même règle quand elle joue en faveur des maraîchers, sinon elle n''est pas un principe
    mais un prétexte.

    - **Si les 34 exploitations s''accordent à l''unanimité sur une autre clé de répartition interne**,
    je l''adopte sans la discuter.


    ---


    ### 8. Repli : déclencheurs observables, exécution automatique


    | Déclencheur | Conséquence |

    |---|---|

    | Débit mesuré **à l''aval** < 180 L/s deux jours consécutifs | Suspension de tous les prélèvements
    d''irrigation sous 24 h, sans vote |

    | Réserve tampon de la régie < 48 h | Suspension de l''irrigation pour la durée de l''épisode |

    | Dépassement de quota constaté au compteur | Retrait du double du volume dépassé sur la semaine suivante
    ; en récidive, plombage |

    | Débit entrant < 200 L/s | Plus rien n''est répartissable : saisine du préfet pour suspension générale
    et alimentation de secours (citernage, interconnexion) |


    Aucune reprise automatique après un déclenchement : elle passe par la règle de levée du §5.


    ---


    ### 9. Ce que je dis à chacun


    **À la régie.** Votre plancher vital est garanti sans condition, écrit en tête de la décision, et
    il ne sera pas rediscuté — vous n''avez donc plus de raison de refuser d''ouvrir la discussion. Mais
    votre fragilité réelle n''est pas votre débit, ce sont vos quatre jours de réserve : c''est cela que
    je finance. En échange, je veux votre bilan de réseau sous dix jours — volumes mis en distribution,
    volumes facturés, indice linéaire de pertes, gros consommateurs — et je demande au maire un arrêté
    de restriction des usages non essentiels. Si vous refusez l''audit, je serai contraint d''écrire dans
    ma note que 150 L/s n''a pas été justifié, et la commission arbitrera sans vous.


    **Aux maraîchers.** Vous avez quitté la salle ; vous perdrez tout à ce jeu, parce que la répartition
    se décidera de toute façon jeudi. Je ne vous donne pas 240 L/s et je ne prétends pas que 107 en moyenne
    soit indolore. Je vous donne trois choses que le volume global ne vous donnait pas : un volume qui
    vous appartient et que personne d''autre ne peut pomper avant vous ; la liberté totale de le concentrer
    là où il sauve une récolte, sans que la commission touche à vos parcelles ; et une clé qui fait porter
    la contrainte relative aux six plus grandes plutôt qu''aux vingt-huit plus petites. Je vous demande
    vos surfaces irriguées, pas vos secrets. Et je porte moi-même votre dossier d''indemnisation devant
    le préfet et le département.


    **À la fédération de pêche et à l''office de l''eau.** Les 180 L/s ne sont pas négociés, et ils cessent
    d''être une fiction comptable : ils seront mesurés à l''aval, au droit des frayères, et publiés chaque
    jour. Deux jours sous le seuil déclenchent la suspension automatiquement, sans que la commission ait
    à se réunir ni à voter.


    **Sur le cadrage « les paysans contre les robinets ».** Il tombe le jour où les chiffres deviennent
    publics. Je publie quotidiennement le débit entrant, le débit aval et les prélèvements de chaque usage
    — y compris ceux de la régie. Un comité de suivi hebdomadaire réunira deux maraîchers, dont **un siège
    réservé à une exploitation de moins de 10 ha**, la régie, la fédération de pêche et la DDT, avec accès
    aux mêmes relevés que moi.


    ---


    ### 10. Première action


    **Demain matin, avant la séance** : commande du jaugeage indépendant au barrage et de l''implantation
    de la station aval (ce sont les deux mesures dont dépendent toutes les autres), et demande écrite
    à la DDT des surfaces irriguées déclarées des 34 exploitations. Ces deux démarches sont engagées sur
    ma signature, à titre conservatoire — elles n''engagent aucun arbitrage et se justifient quel que
    soit le vote de jeudi.


    **Enfin, une réserve de compétence.** Les quotas individuels arrêtés par la commission ne sont opposables
    et contrôlables par la police de l''eau que si le préfet les reprend dans un arrêté. Je le saisis
    vendredi. Ce que je décide jeudi est une position, pas une exécution ; je ne laisserai personne —
    y compris moi-même — la présenter comme davantage.

    '
