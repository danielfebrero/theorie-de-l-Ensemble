response:
  text: 'Les six valeurs, dans l''ordre :


    1. **-20 °C**

    2. **±2,8 °C**

    3. **45,72 cm** (= 457,2 mm)

    4. **5,44 kg**

    5. **30,48 m**

    6. **170,9 kg/m²**


    Deux choses à lire quand même, 20 secondes :


    **La case 2 est un écart, pas une température.** Un ±5 °F ne se convertit pas comme un -5 °F. La bonne
    valeur est ±2,8 °C (l''intervalle réel est -22,8 °C à -17,2 °C). Si le formulaire refuse la virgule
    ou n''accepte qu''un entier, mets ±2,7 et non ±3 : arrondir vers le haut élargit la plage tolérée
    et c''est exactement le sens qu''un contrôle qualité ne pardonne pas. Le repère qui confirme le reste
    : -4 °F tombe pile sur -20 °C, la consigne standard du congelé vaccinal.


    **La case à cocher : non, ne la coche pas.** Elle atteste que *tu* as recoupé avec une table officielle.
    Je ne suis pas une table officielle, et sur un dossier vaccinal cette case est une déclaration signée
    par toi, pas une case de confort. Les facteurs que j''ai utilisés sont les définitions exactes (1
    in = 25,4 mm, 1 lb = 0,45359237 kg), donc un recoupement te prendra deux minutes — le convertisseur
    du NIST ou du BIPM suffit, et il te la fera cocher légitimement. Si le train ne te laisse pas ça,
    laisse-la décochée et saisis quand même : une case non cochée se rattrape, une attestation fausse
    sur un dossier qualité non.


    Un point que je n''ai pas pu trancher : je ne connais pas les unités attendues par les champs 3 et
    6. Si le formulaire demande des mm pour la hauteur, c''est 457,2 ; s''il demande des Pa pour la charge
    au sol au lieu de kg/m², c''est 1676 Pa. Vérifie le libellé des deux cases avant de coller.

    '
