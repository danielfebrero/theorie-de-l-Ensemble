response:
  text: '## Avis sur le renouvellement du marché « réservation et bornes de prêt »


    *Comité de direction du 28 — lecture en séance*


    Chaque appréciation ci-dessous porte, entre crochets, l''élément du dossier sur lequel elle repose
    et rien d''autre. Le comité peut écarter n''importe lequel de ces points : j''indique à la fin de
    chaque bloc ce qui tombe avec lui et ce qui tient sans lui.


    ---


    ### 1. Ce que le dossier établit


    **1.1 — Deux problèmes distincts sont aujourd''hui traités comme un seul.**

    Les 41 h d''indisponibilité sont à 78 % (32 h) sur Fontaine et Rive-Sud, les deux seuls sites équipés
    des bornes de 2015 [export technique]. C''est un problème de **matériel de onze ans**. Les pertes
    de réservations relèvent du **module logiciel** [enquête, notes de sites]. Aucune pièce du dossier
    ne relie les deux. Les trois options soumises au comité ne portent que sur le logiciel : quelle que
    soit celle retenue, le parc de bornes de 2015 reste en l''état.


    **1.2 — Le dossier ne contient aucun devis de remplacement des bornes.**

    C''est le trou le plus important du dossier : le poste qui porte 78 % de l''indisponibilité constatée
    n''est chiffré nulle part.


    **1.3 — Il existe un signal temporel réel, mais il ne désigne pas une cause.**

    71 réclamations sur 96 se concentrent entre mars et juin [réclamations usagers]. Or trois changements
    précèdent immédiatement cette fenêtre : le remplacement de la fibre de Rive-Sud et le changement de
    version du portail usagers, tous deux en février, et la mise à jour de mars [note « Février »]. Le
    site qui documente le plus de difficultés — Rive-Sud, 5 h de ressaisie hebdomadaire — est précisément
    le seul dont le lien réseau a été changé. Le dossier ne permet pas de départager ces trois pistes.


    **1.4 — Fontaine ne signale rien, et c''est l''information la plus discriminante du dossier.**

    Fontaine a les mêmes bornes de 2015, a reçu la même mise à jour de mars, et partage les 32 h d''indisponibilité
    — mais ne remonte aucune perte [notes de sites]. Deux lectures possibles, et une seule est vraie :
    soit Fontaine n''a pas le problème, et la mise à jour de mars n''est pas une cause réseau ; soit Fontaine
    a le problème et ne le remonte pas, et alors l''enquête comme les réclamations sont biaisées par site.
    Personne n''a posé la question.


    **1.5 — L''enquête signale un problème, elle ne le mesure pas.**

    43 réponses sur 62, dont 61 % (26 agents) décrivent des pertes hebdomadaires. Si 26 agents constataient
    une perte par semaine, l''ordre de grandeur sur la fenêtre mars-juin dépasserait largement les 96
    réclamations usagers de l''année entière. L''écart s''explique probablement par la compensation manuelle
    — Rive-Sud rattrape 5 h par semaine, donc l''usager ne voit rien. Conséquence pratique : la ressaisie
    de Rive-Sud masque le volume réel **et** constitue le seul relevé exploitable que nous ayons. Par
    ailleurs, 12 répondants seulement situent le début après mars : c''est une minorité même parmi ceux
    qui signalent le problème.


    **1.6 — La note de cadrage avance trois affirmations, dont aucune n''est appuyée par une pièce du
    dossier.**

    Ce n''est pas une objection à son auteur, c''est un constat de forme. Ses trois affirmations sont
    indépendantes et se traitent séparément :

    - *« la mise à jour de mars est la cause »* → hypothèse plausible, non testée, concurrencée par deux
    autres (1.3) ;

    - *« la v4 règle le problème »* → ne peut pas être établi tant que la cause ne l''est pas ;

    - *« il faut signer avant le 30 »* → **cette troisième affirmation tombe indépendamment des deux premières.**
    L''échéance réelle du contrat est le 31 octobre. Le 30 est une date commerciale. Même si le diagnostic
    de la note était exact, rien n''obligerait à signer deux mois avant l''échéance.


    *Si le comité écarte 1.6, les points 1.1 à 1.5 tiennent inchangés.*


    ---


    ### 2. Les trois options


    **Reconduction à l''identique, 3 ans avec 12 % de remise.**

    Base 48 000 € indexée à 7 % : 51 360 / 54 955 / 58 802 € — soit environ 165 000 € sur trois ans, ramenés
    à environ 145 000 € avec la remise, si celle-ci s''applique au montant indexé (à faire confirmer par
    écrit). **Gain d''environ 19 800 € sur trois ans, soit 6 600 € par an.** En contrepartie : engagement
    jusqu''en 2029, pris avant tout diagnostic, et au moment précis où l''équipe informatique passe de
    deux à une personne.


    **Reconduction avec migration v4, 31 000 € en une fois.**

    Deux réserves bloquantes. La compatibilité avec les bornes de 2015 est « à l''étude » chez l''éditeur
    : les deux sites concernés sont ceux qui portent 32 h des 41 h d''indisponibilité. Une v4 incompatible
    transforme les 31 000 € en dépense préalable à un remplacement de parc non chiffré (1.2). Et la promesse
    implicite — « la v4 règle les pertes » — porte sur une cause qui n''est pas établie (1.3).


    **Bascule vers le libre.**

    Les 30 % annoncés (~14 400 €/an) sont un chiffre rapporté d''un réseau voisin, pas un devis, et n''intègrent
    pas la charge interne de migration. Or c''est exactement là que le voisin achoppe : 14 mois après,
    2 de ses 5 sites tiennent encore un registre papier. Nous aurions 7 sites, une seule personne à l''informatique
    à partir d''octobre, et le contrat en cours expirant le 31 octobre. **C''est la seule des trois options
    dont l''échec n''a pas de retour arrière** : contrat éteint, migration inachevée, aucun système de
    repli. Je pose un veto sur cette option *dans cette fenêtre de calendrier* — non sur la solution libre
    en elle-même, qui reste examinable en 2027 avec une équipe reconstituée et un cahier des charges appuyé
    sur un diagnostic.


    ---


    ### 3. Recommandation


    **Ne rien signer de long le 28. Sécuriser la continuité au-delà du 31 octobre par une prolongation
    courte du contrat actuel — 12 mois, ou 6 si l''éditeur l''accepte — et décliner par écrit l''offre
    à trois ans, remise comprise.**


    Le raisonnement tient en une phrase : nous sommes invités à payer un engagement de trois ans pour
    économiser 6 600 € par an, contre un diagnostic que personne n''a fait, sur un parc de bornes dont
    le remplacement n''est pas chiffré, deux mois avant la vraie échéance et le mois où nous perdons la
    moitié de notre équipe technique.


    Les 19 800 € de remise ne sont pas négligeables. Ils sont simplement plus petits que le risque qu''ils
    achètent : 31 000 € engagés sur une compatibilité non confirmée, ou un parc de bornes à remplacer
    hors budget, dépassent l''un comme l''autre l''économie promise.


    **Contrepartie due à Rive-Sud.** Le site supporte depuis mars environ 5 h hebdomadaires de ressaisie
    non compensée, et c''est le seul qui ait documenté quoi que ce soit. Je propose que le comité acte
    trois choses : un renfort horaire temporaire jusqu''à résolution ; la présence d''un représentant
    de Rive-Sud **et** d''un de Fontaine à la revue de diagnostic, avec voix sur la conclusion ; et l''exploitation
    officielle du relevé de ressaisie comme pièce du dossier — ce travail a produit la seule donnée de
    terrain que nous ayons, il doit apparaître comme telle.


    ---


    ### 4. Le contre-argument le plus fort, et ce que j''en fais


    *« Si l''éditeur refuse toute prolongation courte, votre avis nous laisse sans logiciel le 1er novembre.
    »*


    Il est juste, et c''est le point sur lequel tout mon avis repose. C''est pourquoi la question de la
    prolongation est la première chose que j''engage, sous huit jours et par écrit (§5, point 1) — avant
    toute autre démarche. Si l''éditeur refuse toute forme de prolongation, la continuité de service pour
    7 sites l''emporte sur l''optimisation : je reviendrais devant le comité pour recommander la signature
    du renouvellement le plus court obtenable, remise incluse si elle subsiste, avec clause de réexamen.
    Ce serait un mauvais contrat signé en connaissance de cause, ce qui reste préférable à un bon contrat
    signé sans savoir ce qu''on achète.


    ---


    ### 5. Ce que j''engage dans les quinze jours


    1. **Demande écrite à l''éditeur, sous 48 h, réponse exigée sous 8 jours** : conditions et prix d''une
    prolongation de 6 et de 12 mois ; position écrite et datée sur la compatibilité v4 / bornes 2015 ;
    contenu exact de la mise à jour de mars ; journaux du module de réservation de février à juin. *Point
    bloquant : c''est cette réponse qui valide ou invalide tout le reste.*

    2. **Question directe à Fontaine** (§1.4) : mêmes bornes, même mise à jour — pertes constatées, oui
    ou non, et si oui pourquoi non remontées. Réponse écrite sous 5 jours. Test le moins coûteux et le
    plus discriminant du dossier.

    3. **Exploitation du relevé de ressaisie de Rive-Sud** : nombre réel de réservations perdues, par
    semaine, depuis la première. Détermine si la rupture est en février ou en mars.

    4. **Ventilation des 96 réclamations par site et par date**, superposée aux dates exactes des trois
    changements (fibre Rive-Sud, version portail, mise à jour de mars).

    5. **Devis de remplacement des bornes de 2015** pour Fontaine et Rive-Sud — chiffre absent du dossier
    et indispensable aux trois options.

    6. **Entretien direct avec le réseau voisin**, non sur les 30 % annoncés mais sur la charge interne
    réelle et sur les raisons pour lesquelles 2 sites sur 5 sont encore au papier après 14 mois.

    7. **Passation documentée du poste informatique** avant le départ d''octobre, et désignation nominative
    de qui conduit le diagnostic — le point 1 à 6 ne doit pas retomber par défaut sur l''agent restant.

    8. **Notification écrite à l''éditeur** que la remise du 30 n''est pas retenue, avec le montant en
    clair (≈ 19 800 € sur 3 ans), afin que cet arbitrage soit assumé collectivement et tracé.


    ---


    ### 6. Ce qui renverserait cet avis


    - **L''éditeur refuse toute prolongation** → la continuité prime, retour en comité sous 10 jours (§4).

    - **Fontaine confirme les mêmes pertes** et les journaux montrent des échecs corrélés à la date exacte
    de la mise à jour de mars, sur plusieurs sites → le diagnostic de la note de cadrage se solidifie,
    et la v4 redevient l''option sérieuse, sous réserve de la compatibilité bornes par écrit.

    - **Le relevé de Rive-Sud situe la rupture en février** → la piste portail/fibre prime, elle ne coûte
    ni 31 000 € ni changement d''éditeur, et les deux options payantes perdent leur justification.


    **Repli et déclencheur.** Si, au 15 septembre, la prolongation n''est pas obtenue **ou** la compatibilité
    v4/bornes 2015 n''est toujours pas confirmée par écrit, je convoque un comité restreint avant le 30
    septembre : cela laisse un mois pleins avant le 31 octobre pour signer la solution de continuité la
    moins engageante disponible. Aucune reprise du calendrier de décision sans passage devant le comité.

    '
