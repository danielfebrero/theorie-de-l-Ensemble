response:
  text: 'Voici la note. Elle est écrite comme un mandat exécutoire : décision prise, conditions de signature
    binaires, plan de repli pré-autorisé, seuils chiffrés, et limites de délégation explicites — pour
    qu''aucun arbitrage ne vous soit renvoyé.


    ---


    # NOTE DE MANDAT — DÉCISION CONTRAT D

    **De :** Direction générale

    **À :** Comité de direction (DAF, Directeur Industriel, Directeur Commercial, DRH)

    **Copie :** Président / actionnaire, conseil juridique

    **Date :** J‑1 (veille de mon départ)

    **Période couverte :** de ce jour à mon retour (J+21)

    **Nature :** mandat exécutoire. Ce document n''est pas consultatif. Il se substitue à mon arbitrage.


    ---


    ## 0. Statut de ce document


    Pendant mon absence, ce texte fait autorité. Ce qui n''y figure pas n''est pas autorisé. En cas de
    doute d''interprétation, la règle est : **ne pas signer, ne pas engager, appliquer le plan B**. Seul
    le Président / l''actionnaire peut suspendre ce mandat.


    **Aucun échange verbal n''engage Verdal.** Tous les contacts avec D passent par écrit, avec un interlocuteur
    unique désigné : le Directeur Commercial, en copie systématique de la DAF.


    ---


    ## 1. La décision


    **Nous ne signons pas le contrat d''exclusivité tel qu''il est proposé.**


    J''adresse ce jour à D, sous ma signature, une contre-proposition écrite (annexe 1). Vous n''avez
    pas à négocier : la contre-proposition est partie. Votre travail en mon absence est de **vérifier**,
    pas d''arbitrer.


    ---


    ## 2. Pourquoi — le calcul qui rend la décision non arbitrable


    Le contrat consiste à céder 9 % de prix sur **la totalité** de la base actuelle pour acheter 18 %
    de volume supplémentaire.


    | | Aujourd''hui | Avec le contrat, année 1 |

    |---|---|---|

    | CA D | 14,9 M€ | 16,0 M€ |

    | Coût des produits (69 %) | 10,3 M€ | 12,1 M€ |

    | **Marge brute D** | **4,62 M€** | **3,87 M€** |

    | | | **− 0,75 M€** |


    Dit autrement : la remise nous coûte **1,34 M€** immédiatement (9 % de 14,9 M€) et le volume supplémentaire
    nous en rapporte **0,59 M€**. Nous payons 1,34 pour acheter 0,59.


    **Le seuil d''équilibre est à +41 % de volume.** D en offre 18 %. Ce résultat ne dépend pas d''une
    hypothèse fine de marge : à 25 % de marge il faudrait +56 %, à 40 % il faudrait encore +29 %. **Il
    n''existe aucune hypothèse de marge sous laquelle cet accord est créateur de valeur.**


    Et l''asymétrie de durée aggrave tout : le volume est ferme **un an**, l''exclusivité dure **trois
    ans**. Si D revient à son volume actuel en année 2, la marge tombe à 3,28 M€, soit **−1,34 M€ par
    an**, pendant deux ans, sans que nous ayons le droit de vendre ailleurs. Cumul du scénario central
    sur trois ans : **−3,4 M€**, et **−4,6 M€** si nous devons sortir. Face à 2,1 M€ de trésorerie.


    **C''est signer qui est la branche irrécupérable, pas refuser.** Refuser expose à une perte de charge
    sévère mais réparable — la trésorerie tient, l''activité partielle existe pour cela, et 5,7 M€ d''alternatives
    sont identifiés. Signer nous prive du droit de nous reconstruire pendant trois ans, au moment précis
    où nous en aurions besoin.


    *Vérification à produire par la DAF sous 48 h : marge brute réelle sur le périmètre D, référence par
    référence. Si elle est inférieure à 27 %, la conclusion est renforcée, pas modifiée. Transmettre le
    chiffre au comité, pas à D.*


    ---


    ## 3. Les six conditions de signature


    Vous êtes autorisés à signer **si et seulement si** D renvoie un projet de contrat satisfaisant **les
    six conditions, cumulativement et sans réserve**. Il s''agit d''une vérification binaire, pas d''une
    appréciation.


    | | Condition | Vérification |

    |---|---|---|

    | **C1** | **Garantie de référencement.** Les 8 références sont maintenues au catalogue pendant toute
    la durée. Toute suppression = résiliation de plein droit, sans pénalité, fin immédiate de l''exclusivité.
    | Clause présente ? oui/non |

    | **C2** | **Symétrie de durée.** La durée de l''exclusivité n''excède pas celle de l''engagement
    ferme de volume. Volume ferme 1 an → exclusivité 12 mois. | Durées identiques ? oui/non |

    | **C3** | **Symétrie de sanction.** Si les enlèvements de D sur 3 mois glissants sont inférieurs
    de plus de 10 % à l''engagement, Verdal sort sans pénalité et l''exclusivité cesse. | Clause présente
    ? oui/non |

    | **C4** | **Remise adossée au volume.** Les 9 % ne portent que sur le volume au‑delà de 14,9 M€ ;
    sur la base historique, remise plafonnée à 2 %. *Variante également acceptable : 9 % pleins avec clause
    de rattrapage — si le volume réel est inférieur à +18 %, D reverse le différentiel.* | L''une des
    deux formes ? oui/non |

    | **C5** | **Fenêtre hors exclusivité.** Sont exclus du champ : la vente directe / marketplace, sans
    plafond ; et un second canal de distribution dans la limite de 4 M€ de CA par an. | Clause présente
    ? oui/non |

    | **C6** | **Pénalité de sortie ≤ 0,6 M€**, payable en quatre trimestres. | Montant ≤ 0,6 M€ ? oui/non
    |


    Avec C4, l''accord devient positif de **+0,3 M€ dès l''année 1** au lieu de −0,75 M€. Ce n''est pas
    une posture de négociation : c''est le seuil à partir duquel signer crée de la valeur au lieu d''en
    détruire.


    C1, C2 et C3 sont structurelles — elles ferment la branche irrécupérable. C4, C5, C6 sont économiques.
    Cette hiérarchie fonde la branche 3 ci‑dessous.


    ---


    ## 4. Procédure de décision en mon absence


    **Décideurs :** DAF, Directeur Industriel, Directeur Commercial. **Unanimité des trois requise.**
    À défaut d''unanimité, la décision par défaut est : **ne pas signer**. Décision consignée par écrit,
    signée des trois, copie au Président le jour même.


    **Calendrier** (J = jour d''envoi de la contre-proposition) :


    - **J+3** — Le Directeur Industriel remet le plan de charge réel et le prévisionnel à 12 semaines,
    par site. Ce document alimente les seuils de la section 6.

    - **J+6** — Si aucune réponse de D : relance écrite, une seule, sans concession, sans nouvelle proposition.

    - **J+8** — Échéance annoncée par D. Réception ou non de son projet.

    - **J+8 à J+10** — Le conseil juridique vérifie les six conditions et rend un avis écrit **oui/non
    par condition**. Aucune appréciation qualitative n''est demandée.

    - **J+10 au plus tard** — Signature ou déclenchement de la branche applicable.


    **Les trois branches, et elles seules :**


    **Branche 1 — les six conditions sont satisfaites.** Signer. Notifier D. Poursuivre malgré tout le
    développement des deux alternatives dans la fenêtre C5 : l''accord sécurise la charge, il ne remplace
    pas la diversification.


    **Branche 2 — C1, C2 ou C3 n''est pas satisfaite.** Ne pas signer, quelle que soit la générosité du
    reste. Envoyer la lettre type (annexe 2) : maintien des livraisons aux conditions actuelles, offre
    écrite d''un accord de croissance de 12 mois sans exclusivité, avec remise de 2 % sur le volume au‑delà
    de +8 %. Déclencher le plan B, section 5.


    **Branche 3 — C1, C2, C3 satisfaites intégralement, mais C4, C5 ou C6 refusée.** Ne pas signer. Proposer
    par écrit une prorogation du délai au **J+30**, en maintenant les livraisons aux conditions actuelles,
    et me laisser conclure à mon retour. Si D refuse la prorogation : appliquer la branche 2. Ce cas n''est
    pas un échec — il signifie que D accepte le cadre et discute le prix, ce qui est exactement le terrain
    sur lequel je veux revenir.


    ---


    ## 5. Plan B — pré-autorisé, à exécuter sans validation supplémentaire


    Déclenché automatiquement en branche 2. Le Directeur Commercial en est le pilote unique.


    1. **Marketplace alimentaire — en ligne sous 60 jours.** C''est le levier rapide et le plus rentable
    : 6 points de marge supplémentaires. Objectif engageant : 0,6 M€ facturés à J+180. Budget de lancement
    autorisé : **80 k€** (référencement, photo, logistique du premier palier). Pas de recrutement.

    2. **Centrale d''achat régionale — accélération.** Proposer sous 15 jours un démarrage partiel sur
    2 références, sans attendre la décision globale de cinq mois. Un pilote engagé vaut mieux qu''une
    décision attendue.

    3. **Prospection de remplacement.** Le Directeur Commercial identifie sous 30 jours trois cibles de
    distribution supplémentaires. Objectif : que la part de D descende sous 50 % en 18 mois. C''est l''objectif
    de fond, contrat signé ou non.

    4. **Affacturage.** La DAF met en place, sans attendre aucun seuil, une ligne d''affacturage sur les
    créances D. Négociation ouverte cette semaine. C''est notre principal gisement de trésorerie et il
    est adossé à la signature d''un débiteur de premier rang.

    5. **Juridique.** Le conseil est mandaté dès aujourd''hui pour : (a) analyser le projet de contrat
    ; (b) **préparer sans l''envoyer** un courrier réservant nos droits au titre de la rupture brutale
    de relations commerciales établies (art. L.442‑1 II du code de commerce) et de la dépendance économique
    — 62 % de notre CA sur une relation ancienne constitue un fondement sérieux ; (c) confirmer le statut
    contractuel des 8 références. Ce courrier n''est envoyé que si le déclencheur de la section 6 est
    atteint.


    ---


    ## 6. Seuils et déclencheurs — chiffrés, observables, sans appréciation


    | Observation | Action, immédiate et obligatoire |

    |---|---|

    | Trésorerie < **1,6 M€** | Gel de tout capex non engagé. Activation de l''affacturage. Information
    factuelle des banques — nous informons avant qu''elles ne découvrent. |

    | Trésorerie < **1,2 M€** | Tirage de la ligne de crédit. Demande de moratoire URSSAF/fournisseurs.
    Information du CSE. Réunion CODIR hebdomadaire. |

    | Plan de charge prévisionnel à 8 semaines < **78 %** | Dossier d''activité partielle Redon constitué
    et prêt à déposer. Non déposé. |

    | Plan de charge < **70 %** | Dépôt et activation de l''activité partielle sur Redon. Priorité absolue
    : **aucun licenciement**, voir section 7. |

    | Commandes D en baisse > **15 %** sur 4 semaines glissantes | Réunion CODIR sous 48 h. Envoi du courrier
    de réservation des droits préparé au 5(e). |

    | D déréférence une référence avant J+30 | Envoi immédiat du courrier juridique. Suspension de toute
    discussion commerciale. Passage en branche 2 si ce n''était pas déjà le cas. |


    ---


    ## 7. Limites de délégation — interdit en mon absence


    - Modifier, même à la marge, le texte de la contre-proposition ou les six conditions.

    - Signer un engagement d''exclusivité de plus de 12 mois, ou toute clause pénale supérieure à 0,6
    M€.

    - Engager Verdal au‑delà de 24 mois, sur quelque sujet que ce soit.

    - Tout capex supérieur à **150 k€** hors les 80 k€ marketplace explicitement autorisés.

    - **Toute procédure de licenciement.** L''activité partielle est autorisée ; les ruptures de contrat
    ne le sont pas. Nous ne détruisons pas la compétence de Redon pour un trimestre de charge.

    - Toute communication externe, presse ou réseaux, sur la relation avec D.

    - Tout engagement verbal, en réunion ou au téléphone, avec D ou ses représentants.


    ---


    ## 8. Le meilleur argument contre cette note — et pourquoi je ne le retiens pas


    L''argument sérieux est celui‑ci : D pèse déjà 62 %, il a coupé 11 % au T2 sans préavis, il peut déréférencer
    la moitié de notre gamme en septembre. Les alternatives, elles, rapportent 0,4 M€ dans le meilleur
    des cas avant six mois. Refuser, c''est risquer le chômage partiel de 52 personnes **avant** que la
    diversification existe. Les 9 %, si douloureux soient-ils, achètent douze mois de charge garantie.


    Cet argument tiendrait si l''engagement de volume était réellement opposable. Il ne l''est pas : la
    pénalité de 1,2 M€ pèse sur nous seuls, et rien n''oblige D à enlever les volumes annoncés. Nous paierions
    une prime d''assurance de 0,75 M€ pour une police que l''assureur peut annuler unilatéralement, en
    échange de trois ans d''interdiction de nous assurer ailleurs. C1 et C3 ne sont pas des exigences
    de confort : elles sont exactement ce qui transformerait cet argument en argument valide. Si D les
    accorde, l''accord devient signable — c''est le sens de la branche 1.


    Et le fait décisif est ailleurs : la baisse de 11 % au T2 est intervenue **sans** exclusivité et **sans**
    litige. Ce n''est pas notre refus qui crée le risque de déréférencement. Le risque est déjà là, et
    l''exclusivité ne le supprime pas — elle nous prive seulement du droit d''y répondre.


    ---


    ## 9. Ce qui renverserait cette décision


    Une seule observation la renverse : **la preuve écrite que l''engagement de volume de D est ferme
    et sanctionné** — c''est‑à‑dire une clause donnant à Verdal, en cas de sous‑enlèvement, une indemnité
    d''un ordre comparable aux 1,2 M€ qui nous sont opposés. C''est précisément l''objet de C1 et C3.
    Si D l''accorde, l''accord change de nature et la branche 1 s''applique sans hésitation.


    Trois faits qui **ne** renversent **pas** la décision, et que vous rencontrerez : une amélioration
    verbale des conditions ; une remise portée à 7 % au lieu de 9 % ; un engagement de volume porté à
    +25 %. Aucun des trois ne touche à l''asymétrie de durée ni au risque de déréférencement. Le seuil
    d''équilibre resterait au‑dessus de l''offre.


    ---


    ## 10. Première action


    **Aujourd''hui, avant mon départ**, j''envoie à D la contre-proposition signée (annexe 1), en indiquant
    explicitement que je suis en déplacement jusqu''au J+21, que le comité de direction est habilité à
    signer si le projet renvoyé satisfait les six conditions, et qu''il n''est habilité à rien d''autre.
    Cette phrase est volontaire : elle retire à D tout espoir d''obtenir en mon absence ce qu''il n''aurait
    pas obtenu en ma présence.


    **Demain matin**, la DAF ouvre la négociation d''affacturage et le Directeur Commercial engage l''ouverture
    du compte marketplace. Ces deux actions démarrent immédiatement, quelle que soit la réponse de D.
    Elles sont la seule chose qui, dans dix-huit mois, aura vraiment changé notre position.


    ---


    *Annexe 1 : contre-proposition adressée à D, signée. — Annexe 2 : lettre type branche 2. — Annexe
    3 : courrier de réservation des droits, préparé, non envoyé.*


    ---


    Trois points d''attention avant d''envoyer, si vous voulez les régler ce soir : la marge réelle sur
    le périmètre D (la note suppose 31 %, robuste mais à confirmer), le plan de charge actuel de Redon
    (il détermine si le seuil de 78 % est un garde-fou ou une alerte déjà active), et le poids en CA des
    4 références menacées — je ne l''ai pas, et c''est la seule inconnue qui pourrait justifier d''assouplir
    C5. Dites-moi si vous voulez que je rédige les annexes 1 et 2.

    '
