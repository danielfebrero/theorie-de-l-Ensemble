response:
  text: '# NOTE AU COMITÉ DE DIRECTION


    **Objet :** Cellules 2027 — arbitrage Kelmar / Sinolux · **Échéance opérante : J+18**


    ---


    **Décision proposée.** Réserver la capacité 2027 chez Kelmar à J+18. D''ici là, poser deux questions
    — une à Sinolux, une à Kelmar — dont les réponses sont les seules informations qui puissent encore
    arriver avant l''échéance. Si les deux sont négatives, Kelmar sans réserve.


    ## 1. Le seuil


    L''économie de 230 400 € s''annule à **2,86 % de retours**. Au-delà, le contrat Sinolux coûte plus
    cher que Kelmar.


    | | Cellules | Reprises | Coût reprises | **Total 2027** |

    |---|---|---|---|---|

    | Kelmar 1,3 % | 1 872 000 € | 936 | 191 880 € | **2 063 880 €** |

    | Sinolux à 1,1 % | 1 641 600 € | 792 | 162 360 € | **1 803 960 €** (−259 920) |

    | Sinolux à 3,1 % | 1 641 600 € | 2 232 | 457 560 € | **2 099 160 €** (+35 280) |


    Ce n''est pas un dossier de prix. C''est un pari sur un taux de retour, et le seuil du pari est 2,86
    %.


    ## 2. Nous avons deux sources, pas trois


    La note méthodologique de Ferro indique qu''il travaille sur l''échantillon de l''audit de mars. Son
    « environ 3 % » n''est donc pas une confirmation indépendante : c''est la même mesure, servie deux
    fois. Restent l''essai interne du vendeur (1,1 %) et **une seule mesure indépendante, à 3,1 %** —
    au-dessus du seuil.


    ## 3. La garantie offerte ne couvre pas le risque


    Sur les 205 € d''une reprise, la cellule pèse 22,80 €, soit 11 %. Sinolux nous offre ces 11 % et refuse
    les 89 % restants, qui sont précisément l''objet du risque. Au mieux, en lecture la plus généreuse,
    ce geste repousse le seuil à 3,22 % — toujours dans la zone d''incertitude, pas hors d''elle.


    Surtout : un fournisseur qui mesure 1,1 % chez lui aurait tout intérêt à signer une indexation qui
    ne lui coûterait rien. **Son refus d''indexer est, à ce jour, l''information la plus dure dont nous
    disposons sur ce qu''il croit de son propre chiffre.**


    ## 4. Le test Vertex arrive 45 jours trop tard


    34 000 €, ±0,3 point — soit exactement la résolution nécessaire — mais résultat à J+63, quand la capacité
    Kelmar se ferme à J+18. Le calendrier commercial n''y change rien : reporter le lancement ne rouvre
    pas la porte de Kelmar. **La contrainte qui nous lie est J+18, pas J+70.**


    ## 5. Ce qui rend l''erreur irrattrapable


    Si nous prenons Sinolux à J+18, la ligne 2027 de Kelmar est vendue. À J+63, si Vertex confirme 3,1
    %, il n''existe aucun recours : pas de second fournisseur, production à J+70. Le coût du mauvais choix
    n''est pas l''écart de 35 000 € — c''est 2 232 chargeurs repris chez nos clients, sans solution de
    repli, sur douze mois d''engagement.


    ## 6. Actions, avec échéances internes


    1. **À Kelmar, avant J+5 :** demander une option payante prolongeant la réservation jusqu''à J+65.
    Même à 50 000 €, elle rendrait le test Vertex décisif et préserverait les deux branches. Attendu :
    refus — mais la question est gratuite et c''est la plus rentable du dossier.

    2. **À Sinolux, réponse exigée à J+14 :** prise en charge de 150 € par reprise au-delà de 1,5 %. Sous
    leur propre chiffre de 1,1 %, cette clause ne leur coûte rien. **Acceptation → le risque est transféré
    et je recommande Sinolux. Refus → leur chiffre ne vaut pas leur signature, et il ne vaudra pas la
    nôtre.**

    3. **À J+18, à défaut :** réserver chez Kelmar. Sous réserve que Kelmar maintienne 26,00 € à volume
    réduit — **à vérifier avant J+3** —, en réservant 64 000 unités et en confiant 8 000 unités à Sinolux
    comme lot de qualification. Exposition bornée à environ 4 000 € et 144 reprises supplémentaires ;
    en échange, une mesure terrain réelle et une position de négociation pour 2028.

    4. **Commander Vertex maintenant** — 34 000 € — mais pour préparer 2028, et en le disant. Financer
    ce test au titre de 2027 reviendrait à payer un rapport que nous lirons 45 jours après avoir décidé
    sans lui.


    ## 7. L''argument contraire, et pourquoi il ne suffit pas


    L''audit de mars porte sur *une ligne comparable*, pas sur notre cellule ; Sinolux a pu progresser
    depuis. C''est exact, et c''est pourquoi la recommandation n''est pas « jamais Sinolux » mais « pas
    à l''aveugle, pas au volume plein cette année ». Le lot de qualification et le test Vertex existent
    précisément pour que la décision 2028 — même prix, mêmes 230 000 €, mais avec du temps devant nous
    — se prenne sur des mesures et non sur des déclarations.


    ## 8. Ce qui renverserait cette recommandation


    Une mesure de retour indépendante de Sinolux, sur la cellule contractuelle, en dessous de 2,5 %, disponible
    avant J+18. À défaut, l''acceptation par Sinolux de la clause du point 6.2.


    ## 9. Point budgétaire


    Les 230 400 € inscrits au budget supposent un taux de retour que personne n''a mesuré sur cette cellule.
    Sous la seule mesure indépendante disponible, cette ligne vaut **−35 280 €**. Je demande sa correction
    avant que d''autres arbitrages s''appuient dessus. La direction financière enregistre l''économie
    ; c''est le budget des opérations qui porte les 205 €. Cet écart de portage mérite d''être tranché
    par le comité, pas par le calendrier.


    ---


    **Ce que je décide, si le comité ne tranche pas autrement :** Kelmar à J+18, deux questions posées
    d''ici là, Vertex commandé pour 2028.

    '
