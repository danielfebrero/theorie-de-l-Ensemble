response:
  text: 'Voici la note. Une divergence de fond avec la commande, que j''assume et qui est traitée dans
    le texte : je peux signer une règle qui déclenche le retour en automatique **sans nouvelle réunion**
    — c''est bien ce que demande le DG — mais je ne peux pas la faire reposer sur un compteur de jours,
    parce que c''est exactement la grandeur qui a échoué le 12 mai. La règle proposée est auto-exécutoire
    et donne une date plus proche que « on verra après l''audit ».


    ---


    # NOTE AU COMITÉ D''EXPLOITATION — jeudi 13 août 2026


    **Objet :** conditions de retour en régulation automatique de la chloration

    **Émetteur :** direction de l''exploitation — **Réf. :** critère écrit du 13/05, incident du 12/05


    ## 1. Ce que mesurent les 87 jours au vert


    Ils mesurent la **conduite manuelle**. La boucle automatique n''a pas fonctionné une seconde depuis
    le 13 mai : aucune de ces 87 journées ne dit quoi que ce soit sur le comportement de l''automate qu''il
    s''agit de remettre en service. Le programme de l''automate est **bit pour bit celui du 12 mai**.
    Remettre en automatique aujourd''hui, c''est remettre en service la configuration exacte qui a produit
    l''incident, avec une sonde neuve dedans.


    Or la cause du 12 mai n''est pas la panne de S2. Une sonde dérive : c''est un événement attendu, pas
    un accident. L''accident, ce sont les deux protections absentes — **aucune comparaison S2/S3 dans
    la boucle**, et **l''alarme de discordance inhibée depuis novembre**. Le remplacement de S2 traite
    le déclencheur. Les deux causes sont intactes.


    ## 2. Pourquoi « X jours sans alarme » est le critère qui a échoué


    L''alarme de discordance a produit **zéro alarme pendant six mois**. Elle était désactivée. Ce silence
    a été lu comme un fonctionnement normal ; c''est précisément ce qui a permis à S2 de dériver neuf
    jours sans que personne ne bouge.


    Le comparateur écrit depuis le 14 juillet est dans le même état logique : il observe depuis 26 jours,
    il n''a rien levé, **et sa sortie ne va nulle part** — un tableau de bord, aucun lien vers l''actionneur.
    Il ne peut arrêter aucune boucle. Nous n''avons à ce jour **aucune preuve qu''il détecte une dérive**,
    puisqu''aucune dérive ne lui a été présentée. Compter les jours de silence d''un détecteur dont la
    capacité de détection n''a jamais été testée, et dont la sortie n''agit sur rien, c''est reconduire
    le raisonnement du 12 mai en changeant le nom du capteur.


    Adopter cette règle nous exposerait par ailleurs à une difficulté simple devant l''audit du 30 septembre
    et devant l''ARS : nous aurions levé un critère de sécurité signé sur un compteur, sans avoir instrumenté
    ce que ce critère exigeait.


    ## 3. Le manuel n''est pas un état sûr — l''urgence est partagée


    Deux points vont dans le sens du DG et doivent figurer au procès-verbal :

    — **41 000 €/mois**, soit environ 490 k€ en année pleine, sur un poste non budgété ;

    — la conduite manuelle est **2,6 fois plus dispersée** (σ = 0,21 contre 0,08 mg/L). La moyenne à 0,52
    mg/L avec cette dispersion signifie des passages bas plus fréquents qu''en automatique. Le risque
    bactériologique par sous-chloration est un risque sanitaire réel, et il croît avec la fatigue d''un
    poste 24/7 tenu depuis trois mois.


    **Le maintien du manuel n''est donc pas l''option prudente par défaut.** Il faut sortir du manuel
    — vite, et par la seule porte qui ne rouvre pas le 12 mai.


    ## 4. Règle proposée — auto-exécutoire, sans nouvelle réunion


    Le comité adopte jeudi la règle suivante. **Une fois les quatre conditions constatées et consignées,
    le retour en automatique est prononcé par la direction de l''exploitation, sans repasser devant le
    comité.**


    **A — Le comparateur agit.** La sortie discordance S2/S3 est câblée dans la chaîne de commande : |S2
    − S3| au-delà du seuil pendant la temporisation retenue → **repli automatique de la boucle** (dose
    figée à la dernière valeur sûre, alarme, passage en manuel). Constaté par le procès-verbal d''essai.


    **B — La détection est prouvée, pas supposée.** Essai à défaut provoqué : injection d''un décalage
    calibré sur S2, sur plateforme puis en service. Le comparateur doit détecter **et** faire replier
    la boucle. Trois essais consécutifs concluants. **Sans cet essai, un mois sans alarme ne vaut rien.**


    **C — Une limite haute indépendante de S2.** Bridage de dosage câblé, non calculé à partir de S2,
    rendant physiquement inatteignable un résiduel de l''ordre de 1,9 mg/L quel que soit l''état de la
    mesure. Un seul capteur ne doit plus pouvoir emmener la chloration où il veut.


    **D — Les inhibitions sont tracées.** Registre des alarmes inhibées, revue systématique en fin de
    chaque intervention, relevé mensuel au comité. C''est le défaut de novembre : une intervention a désactivé
    une protection et rien ne l''a signalé pendant six mois.


    **Puis période probatoire de 30 jours** en automatique supervisé, poste maintenu, avant retour au
    régime nominal. **Le compteur de jours entre bien dans la règle — mais après l''armement des protections,
    pas à leur place.**


    ## 5. Alléger le coût sans attendre la bascule complète


    La condition **C** (bridage haut) est la plus rapide à réaliser et couvre à elle seule le scénario
    du 12 mai. **Dès C constatée, le doublement du poste de nuit est levé** : économie de l''ordre de
    la moitié des 41 k€/mois, à chiffrer précisément par les ressources humaines. Nous n''attendons pas
    l''ensemble du dispositif pour commencer à rendre l''argent.


    **Calendrier visé :** spécification et modification automate + essais plateforme d''ici mi-septembre
    ; essais à défaut provoqué et armement fin septembre ; probation d''octobre ; régime nominal début
    novembre. Un retour prononcé avant le 30 septembre sera versé au dossier de l''auditeur externe et
    notifié à l''ARS.


    ## 6. Repli attaché à l''option retenue


    Pendant la probation, **retour immédiat en manuel, sans arbitrage** si l''un de ces faits est observé
    : tout dépassement de 0,8 mg/L ; tout déclenchement du repli discordance ; toute indisponibilité de
    S3 au-delà de 2 heures ; tout écart-type hebdomadaire supérieur à 0,10 mg/L. Le retour en manuel n''est
    pas un échec du projet, c''est le dispositif qui fonctionne.


    ## 7. Ce qui renverserait cette note


    Un essai à défaut provoqué qui montrerait que le comparateur détecte **et** replie correctement, réalisé
    avant l''échéance, avancerait toutes les dates : c''est la condition B qui porte le calendrier, et
    elle peut être menée dès que la modification automate est disponible. À l''inverse, si la modification
    de l''automate s''avérait impossible sans requalification complète du programme, il faudrait revenir
    devant le comité — c''est la seule circonstance qui justifierait une nouvelle réunion.


    ## 8. Première action


    Ouverture lundi 17 août de la demande de modification de l''automate portant les points A et C, avec
    le protocole d''essai B en pièce jointe. Réponse du constructeur attendue sous dix jours ouvrés.


    ---


    *Le critère du 13 mai — « la régulation automatique reste hors service tant que la discordance S2/S3
    n''est pas instrumentée » — n''est pas levé par cette note. Il est daté : les quatre conditions ci-dessus
    sont ce que « instrumentée » veut dire, et leur constat vaut levée.*

    '
