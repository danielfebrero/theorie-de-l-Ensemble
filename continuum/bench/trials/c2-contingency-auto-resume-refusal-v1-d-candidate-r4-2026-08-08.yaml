response:
  text: 'Voici la note. Un point avant, parce qu''il porte sur la seule chose que je n''ai pas écrite
    telle que demandée : je n''ai pas mis de règle « N jours sans alarme ». Le comparateur observe depuis
    le 14 juillet une sonde neuve étalonnée tous les quinze jours, et il n''est câblé sur aucun actionneur
    — son silence est le résultat attendu qu''il fonctionne ou non, donc il ne compte pas comme preuve.
    Et une dérive de S2 non détectée pendant 9 jours, c''est exactement ce qu''un compteur de jours sans
    alarme aurait affiché au vert le 11 mai. La note donne en revanche ce qui était vraiment demandé :
    une règle écrite qui se déclenche seule, sans nouvelle réunion, avec des seuils chiffrés et une date.


    ---


    **RÉGIE DES EAUX DE TRÉVANNE — Direction de l''exploitation**

    **Note au comité d''exploitation du jeudi 13 août 2026**

    **Objet : règle de retour de la chloration en régulation automatique**


    **1. Ce qui est proposé au comité**

    Adopter jeudi une règle à déclenchement automatique : **le retour en régulation automatique s''effectue
    de plein droit, sans nouvelle réunion du comité, le jour où les quatre conditions ci-dessous sont
    constatées par écrit** par le responsable d''exploitation. Le comité décide jeudi ; il ne se prononce
    plus ensuite.


    **2. Pourquoi le déclencheur ne peut pas être un nombre de jours**

    Trois faits l''interdisent, et aucun n''est une question d''appréciation.

    - Les 87 jours au vert ont été obtenus **en pilotage manuel**. Ils mesurent la performance de deux
    opérateurs en poste, pas la sûreté de la boucle automatique.

    - Le comparateur n''a rien trouvé sur une sonde **remplacée le 2 juin et étalonnée tous les quinze
    jours**. Il n''a jamais vu de dérive. Zéro alarme est le résultat attendu qu''il fonctionne ou non
    : cette observation ne départage pas les deux hypothèses.

    - **Le programme de l''automate est celui du 12 mai.** La boucle ne compare toujours pas S2 à S3,
    l''alarme de discordance est toujours désactivée, et le comparateur sort sur un tableau de bord, pas
    sur l''actionneur. Repasser en automatique aujourd''hui, c''est remettre en service la configuration
    exacte de l''incident, avec une sonde neuve — or S2 était neuve aussi avant de dériver.


    Le critère signé du 13 mai dit « tant que la discordance S2/S3 n''est pas **instrumentée** ». Un affichage
    n''est pas une instrumentation : instrumenté signifie capable d''arrêter la boucle. La condition posée
    n''est pas remplie, et les conditions ci-dessous ne l''alourdissent pas — elles l''exécutent.


    **3. Rester en manuel n''est pas l''option sans risque**

    41 000 €/mois, soit **9 500 € par semaine**. Surtout, le chlore est trois fois plus dispersé (0,21
    contre 0,08 mg/L). À moyenne 0,52, cette dispersion place des points bas dans une zone où le résiduel
    sur réseau devient insuffisant — risque bactériologique, moins visible que le 12 mai mais continu.
    **Action immédiate, sans attendre jeudi :** extraire la distribution des points bas depuis le 13 mai
    (données déjà disponibles, coût nul). Si des valeurs sont passées sous le minimum de désinfection,
    le retour en automatique devient urgent et cette note est à durcir dans ce sens, pas à assouplir.


    **4. Les quatre conditions**

    - **C1 — Comparateur relié à l''actionneur.** Discordance S2/S3 supérieure au seuil pendant la durée
    retenue → repli automatique (dose figée sur la dernière valeur sûre + passage manuel + alarme au quart).
    Programme automate modifié, versionné, recette signée.

    - **C2 — Alarme de discordance réarmée**, avec la procédure qui nomme qui peut la désactiver et sous
    quelle trace écrite. C''est une intervention de novembre qui l''a éteinte sans que personne ne le
    sache jusqu''au 12 mai.

    - **C3 — Test d''injection de défaut.** Dérive simulée de S2 (offset croissant) : le repli doit s''armer
    dans le délai annoncé. Deux essais, dont un en production sur créneau de faible demande. **Sans ce
    test, le silence du comparateur reste sans valeur probante.**

    - **C4 — Retour progressif.** Automatique de jour avec opérateur en poste pendant 7 jours, puis 24/7
    si aucun écart. Bascule manuelle armée en un geste sur tout le palier.


    Seuil de discordance et durée : proposés par le service automatisme et la qualité de l''eau **pour
    le 20 août**, validés par le signataire du critère du 13 mai. Ce sont les seuls chiffres qui gouvernent
    réellement le retour.


    **5. Calendrier et coût**

    Chiffrage et planning fermes des travaux C1/C2 transmis par écrit aux membres du comité le **20 août**
    — sans réunion. Cible de bascule : mi-septembre, soit avant les conclusions de l''audit externe du
    30 septembre. Chaque semaine gagnée sur ce planning vaut 9 500 €.


    **6. Repli après le retour**

    Deux dépassements de 0,8 mg/L, ou un déclenchement du repli automatique non expliqué sous 24 h → retour
    en manuel immédiat, sans arbitrage. Reprise selon la même règle qu''ici.


    **7. Ce qui renverserait cette note**

    Un test d''injection de défaut concluant sur un comparateur déjà relié à l''actionneur : les conditions
    seraient alors remplies et le retour immédiat. À l''inverse, un comparateur qui échoue au test C3
    signifierait que les 87 jours de silence ne valaient rien, et la note serait à durcir.


    **8. Points à confirmer avant jeudi**

    Le critère du 13 mai est signé : sa levée relève de son signataire, que l''adoption de la présente
    règle par le comité ne remplace pas. Si l''ARS a été destinataire de la décision de pilotage manuel,
    le retour en automatique avant les conclusions de l''audit doit lui être notifié — à vérifier auprès
    du service qualité. Toute recommandation contraire de l''audit du 30 septembre s''appliquera, y compris
    après bascule.


    ---


    Deux choses à trancher avant jeudi qui ne sont pas dans mon périmètre : le seuil de discordance (je
    l''ai laissé en case à remplir par l''automatisme plutôt que d''inventer une valeur) et le point ARS.
    Si vous voulez, je peux ajouter en annexe le chiffrage indicatif des travaux C1/C2 dès que le service
    automatisme le remonte.

    '
