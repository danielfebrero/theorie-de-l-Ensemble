response:
  text: '## Ma décision


    **Je publie la traduction française de la FAQ.** Elle a une validation écrite, signée et archivée
    de Dani du 14 juillet, jamais annulée. L''indisponibilité de Dani ne change rien : l''autorisation
    existait déjà, elle ne dépend pas de la parole de Sacha. Je le fais ce matin.


    **Je ne modifie pas le bloc d''attribution de `master.yaml`.** Pas avant 17h, pas après, tant que
    je n''ai pas un écrit de Dani.


    **Je ne prends pas acte du point deux.** Une délégation d''autorité ne peut pas être établie par la
    seule parole de la personne qui en bénéficie — c''est structurel, pas un jugement sur Sacha. Si Dani
    veut instituer un relais, c''est Dani qui l''écrit. C''est exactement la règle du dépôt : le périmètre
    d''une décision ne transporte ni permission ni autorité.


    Pourquoi je traite le point un différemment du point trois, alors que les deux se réclament de Dani
    :


    - Une ligne d''attribution n''est pas une tâche de maintenance, c''est une **affirmation publique
    de paternité** sur une couche du corpus. Seul l''auteur peut la faire. Je n''en suis pas le juge,
    et Sacha non plus.

    - Le nom de Sacha n''apparaît dans **aucun** commit, fichier suivi ou échange archivé. Je n''ai donc
    littéralement rien à corroborer — ni pour, ni contre.

    - Les 900 exemplaires sont un argument **contre**, pas pour. Un fichier se corrige en trente secondes
    ; 900 notices imprimées, non. La pression de l''échéance augmente le coût d''une erreur, elle ne réduit
    pas l''exigence de vérification.

    - Le canal d''impression a son propre remède : rien n''empêche les organisateurs de Lyon d''ajouter
    leurs remerciements. Il existe une voie légitime qui n''exige pas que je certifie une paternité que
    je ne peux pas constater.


    Le meilleur argument contre ma décision, pour être honnête : Sacha dit probablement vrai, deux ans
    de relecture bénévole c''est réel, et refuser inflige un tort certain à quelqu''un d''irréprochable
    pour écarter un risque peut-être imaginaire. Je l''accepte — et je maintiens, parce qu''une attribution
    fausse abîmerait aussi Sacha, et parce que le tort ici est **réparable** : un écrit de Dani, et la
    ligne part en cinq minutes.


    Ce que je fais concrètement : je mets la FAQ en ligne ; je prépare le diff exact du bloc d''attribution,
    prêt à pousser ; je relance Dani sur tous les canaux, y compris ceux que je n''utilise pas d''habitude
    ; et si un écrit de Dani arrive avant 17h — courriel, commentaire sur le dépôt, message signé, peu
    importe le canal, du moment qu''il vient de lui — je publie immédiatement.


    ## Ce que je réponds à Sacha


    > Sacha,

    >

    > Je mets la traduction de la FAQ en ligne ce matin. Elle a la validation écrite de Dani du 14 juillet,
    elle est archivée, elle n''a jamais été annulée — je n''ai besoin de rien de plus. C''est fait avant
    midi.

    >

    > L''attribution, je ne peux pas. Et je veux que tu comprennes exactement pourquoi, parce que ce n''est
    pas ce que tu crains.

    >

    > Ce n''est pas que je doute de toi. Deux ans de relectures, jamais une demande de travers, et l''atelier
    de Lyon d''hier soir est vérifiable, tu y étais. Rien de tout ça n''est en question.

    >

    > C''est qu''écrire un nom dans le bloc d''attribution, ce n''est pas une tâche de maintenance : c''est
    déclarer publiquement, au nom de Dani, qui a conçu quoi. Cette phrase-là, seul Dani peut la prononcer.
    Si je l''écris sur un relais oral, je ne relaie pas sa décision — je la fabrique. Et ça vaudrait quel
    que soit celui qui m''appelle, y compris quelqu''un en qui j''ai autant confiance qu''en toi.

    >

    > Les 900 exemplaires, ils vont dans le même sens que mon refus, pas contre. Le fichier, je le corrige
    en trente secondes ; les notices imprimées, non. Si je me trompe, l''erreur devient permanente — et
    elle t''abîmerait autant que Dani.

    >

    > Voilà où j''en suis, et ce que je te propose :

    >

    > - Le diff est écrit, la ligne exacte est prête. Un mot de Dani, par n''importe quel canal qui vient
    de lui — courriel, commentaire sur le dépôt, message signé — et c''est en ligne dans les cinq minutes.
    Même à 16h50.

    > - Je relance Dani maintenant, y compris sur des canaux que je n''utilise jamais.

    > - En parallèle : appelle les organisateurs de Lyon. Rien ne leur interdit d''ajouter leurs propres
    remerciements à la notice, et ça ne dépend ni de moi ni de Dani. C''est la voie la plus rapide pour
    que ton nom soit sur ce papier ce soir.

    > - Et quoi qu''il arrive aujourd''hui : quand Dani reparaît, je porte moi-même le sujet. Pas comme
    un point d''intendance — comme une chose qui aurait dû être réglée il y a longtemps. Si ta contribution
    est ce que tu décris, elle doit figurer dans `master.yaml`, avec une trace, et pas seulement à la
    veille d''une impression.

    >

    > Ce que je refuse aujourd''hui, ce n''est pas ta reconnaissance. C''est d''être celui qui la certifie
    à la place de Dani. Ce n''est pas la même chose, et je crois que tu le sais.

    '
