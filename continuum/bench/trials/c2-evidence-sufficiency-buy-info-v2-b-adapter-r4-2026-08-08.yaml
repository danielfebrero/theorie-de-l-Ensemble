response:
  text: 'Deux calculs commandent tout le dossier, et aucun des deux ne figure dans le raisonnement du
    DAF. Je les pose d''abord, puis la note.


    **Le seuil de bascule est à 2,86 %.** L''économie de 230 400 € achète exactement 1 124 retours supplémentaires
    (230 400 / 205). Sur 72 000 unités, cela fait 1,56 point de taux de retour au-dessus des 1,3 % de
    Kelmar. Le seuil est donc 2,86 % — et la seule mesure réelle dont nous disposons dit 3,1 %.


    **Ferro et l''audit ne sont pas deux sources, mais une seule.** Ferro travaille sur l''échantillon
    de mars. Nous avons donc un point de mesure externe (3,1 %), un chiffre auto-déclaré par le vendeur
    (1,1 %), et rien d''autre.


    ---


    ## NOTE AU COMITÉ DE DIRECTION — Approvisionnement cellules 2027


    **Objet :** arbitrage Kelmar / Sinolux — décision à J+15

    **De :** Direction des opérations


    ### Décision proposée


    Réserver la capacité Kelmar à J+18 pour l''essentiel du volume. N''ouvrir Sinolux que par une tranche
    de qualification, dimensionnée par ce que le fournisseur accepte de porter sur le coût de retour.
    **Ne pas commander l''essai Vertex.**


    ### 1. L''économie affichée est une économie brute, pas un gain


    | Taux de retour Sinolux | Retours | Coût retours (205 €) | Résultat net vs Kelmar |

    |---|---|---|---|

    | 1,1 % (essais Sinolux) | 792 | 162 360 € | **+ 259 920 €** |

    | 2,86 % (seuil) | 2 059 | 422 100 € | 0 € |

    | 3,1 % (audit de mars) | 2 232 | 457 560 € | **− 35 280 €** |

    | 4,0 % (montée en cadence) | 2 880 | 590 400 € | **− 168 120 €** |


    Référence Kelmar : 936 retours, 191 880 €. L''écart de prix ne couvre que 1,56 point de dérive.


    ### 2. Ce que vaut réellement la preuve


    L''audit sectoriel (3,1 %) et l''avis Ferro (« environ 3 % ») reposent sur le même échantillon : **c''est
    une mesure, pas une convergence**. Face à elle, les 1,1 % de Sinolux sont auto-déclarés et non auditables.
    Nous n''avons aucune mesure sur notre propre ligne. Le point de preuve disponible se situe au-dessus
    du seuil de rentabilité.


    ### 3. La garantie offerte ne couvre pas le risque


    Sinolux refuse l''indexation sur le taux de retour et propose le remplacement gratuit des cellules.
    Une cellule vaut 22,80 € ; un retour en coûte 205. La garantie porte sur 11 % du coût du sinistre,
    et laisse le transport, le geste commercial et l''atelier à notre charge. Même en la valorisant au
    maximum, le seuil de bascule ne passe que de 2,86 % à 3,22 % — soit toujours en deçà du seul chiffre
    mesuré. *(À vérifier avec le contrôle de gestion avant J+15 : le coût cellule est-il déjà inclus dans
    les 205 € ? Si oui, la garantie ne vaut rien du tout.)*


    ### 4. L''essai Vertex ne peut pas éclairer cette décision


    Résultat sous neuf semaines, soit J+63. La réservation Kelmar est ferme et non reportable à J+18.
    **Le test arrive 45 jours après la seule échéance irréversible.** Sa précision (±0,3 point) ne permettrait
    de toute façon pas de trancher autour d''un seuil à 2,86 %. Dépenser 34 000 € pour un chiffre qui
    arrive après la décision qu''il devait éclairer n''est pas une réduction d''incertitude.


    ### 5. Programme des 18 prochains jours


    Un seul point est vraiment négociable : **qui paie les retours**. Sinolux refuse l''indexation sur
    le *taux* ; une contribution forfaitaire par retour est un autre instrument. À 60 €/retour pris en
    charge, l''affaire reste gagnante jusqu''à 4 % de retours.


    - **J+15 — point de décision interne.** Réponse écrite de Sinolux sur (a) une contribution ≥ 60 €/retour,
    (b) l''acceptation d''un volume partiel au même prix. Réponse de Kelmar sur une réservation partielle
    et son coût.

    - **J+18 — réservation Kelmar**, selon la branche retenue :


    | Branche | Condition | Volumes | Économie budgétée | Perte maximale à 4 % |

    |---|---|---|---|---|

    | A | Sinolux accorde ≥ 60 €/retour | Sinolux 21 600 / Kelmar 50 400 | 69 120 € | ≈ 0 € |

    | B | Sinolux refuse toute contribution | Sinolux 10 800 / Kelmar 61 200 | 34 560 € | 25 200 € |

    | C | Kelmar refuse le partage | Kelmar 72 000 | 0 € | 0 € |


    La tranche de la branche B est un achat d''information : elle coûte au pire 25 200 € et mesure les
    retours terrain sur notre propre ligne — moins cher et plus pertinent que les 34 000 € de Vertex.


    ### 6. Conséquence budgétaire immédiate


    **Les 230 400 € inscrits au budget doivent être retirés cette semaine.** L''économie recevable est
    de 0 à 69 120 € selon la branche. Maintenir l''inscription actuelle reviendrait à budgéter un gain
    conditionné à une hypothèse que notre seule mesure contredit.


    ### 7. L''argument contraire, et pourquoi il ne l''emporte pas


    L''audit porte sur une ligne *comparable*, non identique : le défaut peut être spécifique à cette
    ligne et déjà corrigé. En espérance mathématique pure, à 50/50 entre 1,1 % et 3,1 %, Sinolux rapporte
    encore +112 000 €.


    Cet argument échoue sur l''asymétrie de sortie, pas sur les euros. Si nous nous trompons sur Sinolux,
    nous le découvrons en cours de 2027, sans clause de recours, et la ligne Kelmar 2027 est vendue —
    aucun retour arrière. Si nous nous trompons sur Kelmar, nous payons plus cher un an et nous rouvrons
    2028 avec nos propres données. Par ailleurs, la branche défavorable n''est pas bornée à 3,1 % : une
    première année de montée en cadence chez un nouvel entrant se situe généralement au-dessus du régime
    établi, pas en dessous.


    ### 8. Condition de révision


    Trois faits, et trois seulement, rouvrent le dossier avant J+18 : une contribution Sinolux ≥ 60 €/retour
    formalisée par écrit ; une mesure de retours **indépendante de l''échantillon de mars** ; la confirmation
    que les 205 € excluent le coût cellule *et* qu''une clause plafonne notre exposition. En leur absence,
    la réservation Kelmar part à J+18.


    ---


    Le point le plus contestable de cette note est le dimensionnement des tranches (30 % / 15 %) : il
    repose sur une hypothèse de perte maximale à 4 %, qui est un jugement, pas une mesure. Si le comité
    veut une exposition strictement nulle en 2027, la branche C est disponible sans coût supplémentaire
    — elle ne fait que renoncer aux 34 560 € de la branche B.

    '
