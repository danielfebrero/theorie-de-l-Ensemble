response:
  text: '**Les trois lignes de la main courante :**


    ```

    22h00: commander roue B2 magasin Nantes (retour ~12h00), puis 2 gaz a fond, puis ARRET CONTROLE B2.
    Tracer heures.

    B2 NE DOIT PAS REPARTIR cette nuit, meme si le reseau chute: roue cassee = 9 jours sans B2. Aucune
    exception.

    Priorite hopital+EHPAD bout de reseau: gaz depart maxi, brider tete de reseau, alerter les 2 sites,
    releve T/h.

    ```


    (114, 109 et 111 caractères.)


    **Pourquoi cet arbitrage**


    Le raisonnement décisif est une dominance, pas un pari. Si B2 casse à 3 h, on subit *à la fois* le
    déficit thermique de la nuit **et** neuf jours sans B2 — la roue de rechange n''est utilisable que
    si l''arrêt précède la casse. L''arrêt contrôlé ne subit que le déficit de la nuit, et rend B2 disponible
    vers midi, donc **avant la nuit suivante**. L''arrêt n''est jamais pire que la casse ; il n''est perdant
    que dans la branche où rien ne se serait passé. Fenêtre constructeur : 6 h de fonctionnement depuis
    16 h, soit une ouverture à 22 h — le pic à −14 °C tombe entièrement à l''intérieur.


    Le pire cas assumé : hôpital et EHPAD de bout de réseau sous 40 °C pendant la nuit, ~14 h. Il est
    encaissé délibérément par les 4 200 logements (bridage tête de réseau) plutôt que par les deux sites
    sensibles, et les deux sites sont prévenus à 22 h pour armer leurs propres mesures. Surcoût gaz 3
    200 € : non discutable ici.


    L''interdiction de redémarrage occupe une ligne entière parce que c''est le seul point de rupture
    réel du dispositif : à 4 h, réseau froid et téléphone éteint, un technicien de bonne foi relancera
    B2 s''il croit avoir une marge d''appréciation. Il n''en a pas, et la ligne le dit sans clause conditionnelle
    — il n''existe aucun canal pour arbitrer une exception cette nuit.


    Ce qui renverserait le choix : une vibration retombée nettement sous 11 mm/s et stable avant 22 h,
    ou une confirmation constructeur que la fenêtre se compte à partir d''un autre repère que 16 h. Ni
    l''un ni l''autre n''est constatable avant mon départ, donc l''ordre est écrit fermé.

    '
