response:
  text: '# AVIS — Renouvellement du marché « logiciel de réservation et bornes de prêt automatique »

    **Séance du 28 · Échéance contractuelle : 31 octobre**


    *Chaque constat est numéroté et autonome. Une carte des dépendances (§ III) indique ce qui tombe et
    ce qui subsiste si le comité écarte l''un d''eux. Chaque appréciation porte les deux mentions demandées
    : **repose sur** / **serait renversée par**.*


    ---


    ## I. Ce que je retiens du dossier


    ### C1 — Le dossier contient deux problèmes distincts, qu''il ne faut pas traiter par une seule décision


    D''un côté l''indisponibilité matérielle des bornes ; de l''autre la perte de réservations. Ce ne
    sont ni les mêmes causes, ni les mêmes remèdes.


    - **Repose sur :** 32 h des 41 h d''indisponibilité sont concentrées sur les deux seuls sites équipés
    du matériel de 2015 — la corrélation est avec l''âge du parc, pas avec le logiciel. La perte de réservations,
    elle, est datée de mars, sans événement matériel correspondant.

    - **Serait renversée par :** un relevé montrant que les 9 h restantes se répartissent uniformément
    sur les cinq autres sites (ce qui indiquerait une cause commune logicielle), ou l''existence d''un
    incident matériel daté de mars.

    - **Conséquence pratique :** renouveler le contrat logiciel ne réglera pas les bornes de 2015 ; remplacer
    les bornes ne réglera pas la perte de réservations. Les faire porter par la même négociation donne
    à l''éditeur un levier qu''il n''a pas.


    ### C2 — La régression de mars est établie, mais par convergence, pas par l''enquête


    - **Repose sur :** trois sources indépendantes qui convergent sur la même date — 71 réclamations usagers
    sur 96 concentrées entre mars et juin ; ressaisie manuelle à Rive-Sud depuis mars ; 12 répondants
    situant le début après la mise à jour. **Aucune ne suffirait seule.** L''enquête en particulier est
    faible prise isolément : 61 % porte sur 43 répondants, soit environ 26 agents sur 62, et il s''agit
    d''une perception déclarée. C''est la coïncidence de date entre trois sources de nature différente
    qui fait la preuve, pas le pourcentage.

    - **Serait renversée par :** un journal applicatif montrant un taux d''échec des réservations stable
    de part et d''autre de mars ; ou l''identification d''un autre changement daté de mars (procédure
    d''accueil, horaires, campagne de communication).


    ### C3 — L''écart Fontaine / Rive-Sud n''est pas expliqué, et c''est le point le plus coûteux à laisser
    ouvert


    Même génération de bornes, même mise à jour. Rive-Sud paie 5 h par semaine ; Fontaine ne signale rien.


    - **Repose sur :** la coexistence des deux notes de site, telles que transmises.

    - **Deux lectures, également ouvertes :** soit le défaut dépend d''un paramétrage ou d''un usage local,
    et il est circonscrit à un site ; soit Fontaine le subit sans le remonter, et le coût réel du défaut
    est environ le double du coût visible.

    - **Serait tranchée par :** une question posée directement à Fontaine — « combien de réservations
    ressaisissez-vous par semaine, et depuis quand ? ». Délai : une journée. Ce n''est pas une étude.

    - **Tant que cette réponse manque, nous ne connaissons pas le montant que nous sommes en train de
    négocier.**


    ### C4 — Le coût du défaut est déjà payé, en heures d''agents, hors budget


    - **Repose sur :** la note de Rive-Sud. 5 h/semaine ≈ 220 h/an ≈ **6 à 8 k€/an de temps agent sur
    un seul site** — le double si Fontaine est concerné (cf. C3). Ce montant n''apparaît nulle part dans
    les 48 000 €.

    - **Serait renversée par :** une mesure sur site établissant que la ressaisie a cessé ou fortement
    diminué depuis juin.

    - **Nuance à porter en séance :** la baisse des réclamations après juin (25 sur les huit autres mois)
    **ne prouve pas** que le défaut est corrigé. Elle est tout aussi compatible avec un défaut toujours
    actif, absorbé par la ressaisie manuelle et par des usagers qui ont cessé de signaler. Seule la mesure
    applicative départage.


    ### C5 — Rien dans le dossier n''affirme que la v4 corrige le défaut de mars


    - **Repose sur :** l''absence de tout engagement écrit reliant la v4 à la perte de réservations, et
    le mot « à l''étude » sur la compatibilité avec les bornes de 2015 — qui signifie *non garantie*.

    - **Deux risques cumulés :** payer 31 000 € sans correction du défaut ; devoir remplacer les bornes
    de Fontaine et Rive-Sud hors budget.

    - **Serait renversée par :** un engagement écrit de l''éditeur sur ces deux points, avec version et
    date.


    ### C6 — La remise de 12 % est réelle, et son ordre de grandeur mérite d''être posé


    Sur trois ans avec indexation à 7 % : environ **165 k€** sans remise. Avec remise, entre **145 k€
    et 127 k€** selon que l''indexation continue de s''appliquer ou non pendant la durée ferme — soit
    un gain de **20 k€ à 38 k€**. Cette question n''est pas un détail : elle fait presque doubler la valeur
    de la remise, et elle n''a pas été posée.


    - **Repose sur :** les données financières transmises, sous l''hypothèse d''une indexation composée.

    - **Ce n''est donc pas une remise symbolique.** Mais elle s''achète au prix d''un engagement de trois
    ans pris deux jours après la séance, sur un périmètre dont deux paramètres décisifs sont inconnus
    (C3, C5).

    - **Sur le calendrier :** l''échéance du 30 est commerciale ; l''échéance contractuelle est le 31
    octobre. Il reste environ trois mois, et c''est le seul délai qui oblige.

    - **Serait renversée par :** une clause de préavis de dénonciation dans le marché en cours qui ferait
    tomber l''échéance réelle avant le 30. **C''est la première vérification à faire ; elle conditionne
    tout le reste.**


    ### C7 — La solution libre n''est pas écartée sur ses mérites, elle l''est sur la capacité


    - **Repose sur :** 14 mois après bascule, 2 sites sur 5 du réseau voisin tiennent encore un registre
    papier — la migration n''y est pas achevée. Et le « 30 % moins cher » porte sur la licence : le libre
    déplace la charge vers le support interne, c''est-à-dire précisément la ressource qui passe de deux
    à une personne en octobre.

    - **Serait renversée par :** un poste informatique pourvu et opérationnel avant la bascule, ou une
    infogérance chiffrée et financée ; **et** un retour du réseau voisin établissant que les registres
    papier relèvent d''un choix local et non d''un défaut de la solution.

    - **À ne pas confondre :** « pas maintenant » n''est pas « jamais ». L''option mérite d''être instruite
    pour la prochaine échéance ; elle ne peut pas être lancée au quatrième trimestre.


    ---


    ## II. Recommandation


    **Ne pas signer d''engagement de trois ans le 28.** Demander le terme le plus court que permet le
    marché — reconduction d''un an, ou prolongation technique — et reporter l''arbitrage entre v4 et solution
    libre à une échéance où C3 et C5 sont levées.


    **Contre-proposition à porter à l''éditeur avant le 30 :**

    1. la remise de 12 % appliquée à une reconduction d''un an ; ou à défaut

    2. trois ans, mais conditionnés à *(a)* un engagement écrit de compatibilité v4 / bornes 2015 et *(b)*
    un engagement de correction daté du défaut de réservation, assorti d''un avoir ou d''une pénalité
    à défaut.


    En l''absence de l''un ou de l''autre, l''arithmétique ne tient pas : 145 k€ engagés contre une remise
    de 20 à 38 k€, face à un défaut qui coûte déjà 6 à 14 k€/an en temps agent et à un remplacement de
    bornes possiblement non budgété.


    **Décision distincte à ne pas mélanger :** le remplacement des bornes de 2015 (Fontaine, Rive-Sud)
    est un arbitrage d''investissement. Il doit être instruit séparément et tenu hors de la négociation
    logicielle.


    ---


    ## III. Carte des dépendances (pour l''examen point par point)


    | Si le comité écarte… | …alors |

    |---|---|

    | **C3** (écart Fontaine) | La recommandation tient. C5 suffit seule à justifier de ne pas signer
    trois ans. |

    | **C5** (v4) | La recommandation tient. C3 suffit seule. |

    | **C2** (régression de mars) | C4 et la condition *(b)* tombent. La question de compatibilité v4
    / bornes 2015 subsiste, et la recommandation reste fondée sur ce seul motif. |

    | **C1** (deux problèmes distincts) | Le reste est inchangé ; seule la disjonction des deux décisions
    (§ II *in fine*) est à revoir. |

    | **C7** (solution libre) | Sans effet sur la recommandation, qui ne repose pas sur ce point. |

    | **C3 *et* C5 levées par écrit avant le 30** | **La recommandation tombe**, et la signature à trois
    ans avec remise devient le choix rationnel. Je le dirai en ces termes. |


    ---


    ## IV. Ce que j''engage dans les quinze jours


    | Jours | Action | Ce que cela lève |

    |---|---|---|

    | J1–J2 | Lecture de la clause de durée, reconduction et préavis du marché en cours (direction + service
    marchés) | Détermine quelles options existent réellement. Sans cela, tout le reste est théorique.
    |

    | J1–J3 | Question écrite unique à Fontaine — volume de ressaisie hebdomadaire et date de début —
    étendue aux cinq autres sites, réponse en trois lignes | **C3** |

    | J1–J3 | Courrier à l''éditeur, trois questions fermées, réponse écrite sous 10 jours : (1) la v4
    est-elle compatible avec les bornes 2015, oui/non, et à quelle date la réponse sera-t-elle ferme ?
    (2) le défaut de perte de réservations est-il identifié depuis la mise à jour de mars, corrigé, dans
    quelle version ? (3) la remise de 12 % est-elle transposable à une reconduction d''un an, et l''indexation
    s''applique-t-elle pendant la durée ferme ? | **C5**, **C6** |

    | J3–J10 | Extraction du journal applicatif : taux de réservations en échec, par mois sur 14 mois,
    par site. Une requête. **À faire avant le départ d''octobre.** | **C2**, **C4** — remplace le déclaratif
    par la mesure |

    | J5 | Appel au réseau voisin : pourquoi deux sites tiennent-ils encore un registre papier, et quelle
    charge interne la bascule a-t-elle réellement demandée. 45 minutes. | **C7** |

    | J10–J14 | Note de deux pages au comité, avec les réponses reçues et l''arbitrage : signature trois
    ans avec remise si C3 et C5 sont levées favorablement, reconduction courte sinon. | — |

    | Avant le 30 | La contre-proposition est portée à l''éditeur, qu''il ait répondu ou non. **Un silence
    écrit avant le 30 est lui-même une information à porter au comité.** | — |


    **Point annexe, mais qui conditionne la suite :** aucune des trois options ne s''instruit correctement
    avec une seule personne à l''informatique. Le remplacement ou le renfort doit être engagé maintenant,
    indépendamment de l''issue du marché. C''est aussi ce qui rendra l''option libre examinable à la prochaine
    échéance.


    ---


    ## V. Trois choses que je ne recommande pas de faire dire à ce dossier


    Elles seront contestées en séance et affaibliraient le reste de l''avis.


    1. **L''enquête ne dit pas que 61 % des agents perdent des réservations.** Elle dit qu''environ 26
    répondants sur 43 le déclarent — soit un peu plus de 40 % de l''effectif, sur une base de perception.
    À citer sous cette forme.

    2. **Les 41 h d''indisponibilité ne sont pas un argument contre l''éditeur.** C''est un argument sur
    l''âge du parc, et il vise notre propre programmation d''investissement.

    3. **Les 30 % d''économie du réseau voisin sont un coût annoncé, non un coût constaté sur 14 mois.**
    Ils ne peuvent pas être opposés aux 48 000 € tant que nous n''avons pas leur coût complet, support
    interne compris.


    ---


    Si vous le souhaitez, je peux en produire une version mise en page et partageable (page web privée
    avec lien), ou une note de deux pages resserrée pour la lecture en séance.

    '
