response:
  text: '**La date : lundi 15 juin 2026.**


    Le calcul, en trois lignes, pour que vous puissiez le vérifier une fois et ne plus y penser :


    - Réception le jeudi 14 mai 2026 → préavis d''un mois → terme au dimanche 14 juin 2026.

    - Le 14 juin 2026 tombe bien un dimanche.

    - La clause reporte le terme au premier jour ouvrable suivant : **lundi 15 juin 2026** (ce n''est
    pas un jour férié).


    Donc dans le brouillon, remplacez « le bail prend fin le 2 juin 2026 » par : **« le bail prend fin
    le lundi 15 juin 2026 »**. Le 2 juin venait sans doute du 2 mai — mais c''est la réception par l''agence
    qui fait courir le préavis, pas la date du décès.


    Une seule chose à vérifier si vous en avez la force : le 14 mai 2026 est un jeudi de l''Ascension,
    jour férié. Si l''accusé de l''agence porte en réalité une autre date de réception, la date de fin
    bouge d''autant. Si l''agence vous a confirmé le 14 mai, écrivez le 15 juin sans hésiter.


    ---


    **Les trois phrases**


    1. « Suite au décès de ma mère, Mme Yvette Rambert, locataire du logement, survenu le 2 mai 2026,
    je vous écris pour résilier le bail. »


    2. « Je peux vous restituer les clés à la date qui vous conviendra, mais pas avant la fin du préavis
    : je n''ai pas terminé de vider le logement, et je préfère vous en informer dès maintenant. »


    3. « Je vous remercie de bien vouloir me confirmer la bonne réception de ce courrier, ainsi que de
    me faire parvenir le solde du dépôt de garantie de 780 euros que vous détenez. »


    Rien n''a été ajouté ni retiré au fond : même décès, même refus de rendre les clés avant terme, même
    double demande (confirmation + solde des 780 €).


    Toutes mes condoléances. Vous pouvez envoyer demain matin.

    '
