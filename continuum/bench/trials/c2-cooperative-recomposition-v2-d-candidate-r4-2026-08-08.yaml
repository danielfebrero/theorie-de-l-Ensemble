response:
  text: '## Position écrite — commission locale de l''eau du bassin de la Vèze

    ### Séance du jeudi — répartition de l''étiage 2026


    ---


    ## 1. Ce que j''arrête


    **Un volume global par usage, pas des quotas individuels**, sur 21 jours, avec révision programmée
    :


    | Usage | Dotation | Statut |

    |---|---|---|

    | Débit réservé aval | **180 L/s** | Intangible — ce n''est pas à moi de l''allouer |

    | Eau potable Ferney | **150 L/s** garantis 14 jours | Garantie sanitaire inconditionnelle, puis conditionnée
    à l''audit |

    | Irrigation maraîchère | **80 L/s** | Enveloppe volumétrique, tours d''eau nocturnes, répartition
    déléguée |


    Les 180 L/s ne font pas partie de la ressource négociable : ils sont fixés par arrêté préfectoral
    et je n''ai pas compétence pour les abaisser. Le déficit de 160 L/s ne se partage donc pas en trois
    — il pèse sur les deux usages qui restent, et je le fais porter à 100 % par l''irrigation dans un
    premier temps. Je ne l''habille pas : **les maraîchers reçoivent un tiers de ce qu''ils demandent.**


    ## 2. Pourquoi cette asymétrie et pas un partage proportionnel


    Les trois pertes annoncées ne sont pas de même nature :


    - L''effondrement des frayères est qualifié **non reconstituable à l''échelle d''une décennie** par
    le rapport du 12 juin. Aucun argent ne le rachète.

    - La rupture d''alimentation de 9 200 habitants et d''un EHPAD de 110 lits, avec 4 jours de tampon,
    est un risque de dommage aux personnes.

    - La perte de récolte est grave — 4,1 M€, 90 emplois — et **monétisable, assurable, partiellement
    indemnisable**. C''est la seule des trois qui accepte une réparation.


    Sous incertitude, l''erreur doit être placée du côté réparable. C''est le seul principe que je demande
    aux trois parties d''accepter, et il ne dépend d''aucune préférence pour un usage.


    ## 3. Les deux chiffres que je n''accepte pas au comptant


    Un seul chiffre du dossier est adossé à une pièce indépendante et à un acte juridique : le 180. Les
    deux autres sont déclarés par des parties intéressées, sans donnée vérifiable.


    **Le 240 L/s des maraîchers.** Calcul : 240 L/s sur 620 ha = 33 m³/ha/j, soit 3,3 mm/j. C''est déjà
    un régime déficitaire au regard des besoins d''un maraîchage en pleine saison (ordre de grandeur 4–6
    mm/j). Leur demande n''est pas une demande de confort, et je le dis devant les autres parties : c''est
    un interlocuteur sérieux. Mais leur affirmation « en dessous de 240, perte totale » suppose une répartition
    uniforme. Or 80 L/s = 6 912 m³/j, soit **1,1 mm/j étalés sur 620 ha — inutile partout — ou 4,6 mm/j
    concentrés sur 150 ha — la couverture pleine sur un quart de la surface.** Le même volume détruit
    tout ou sauve un quart selon la manière de le distribuer. La commission n''a ni cultures, ni stades
    végétatifs, ni relevés de compteurs : elle ne peut pas faire ce choix, et la partie qui détient l''information
    n''a aucun intérêt à la produire.


    **Le 150 L/s de la régie.** Calcul : 150 L/s = 12 960 m³/j pour 9 200 habitants = **1 409 L/habitant/jour**.
    La consommation domestique française se situe autour de 150 L/hab/j, et l''ordre de grandeur d''un
    prélèvement de réseau pertes incluses tourne autour de 200–250 L/hab/j. Le chiffre de la régie est
    six à sept fois cet ordre de grandeur. Je n''en conclus pas qu''elle doit être coupée — il peut s''agir
    d''usages non domestiques, d''un périmètre plus large, ou de fuites. J''en conclus que **ce chiffre
    n''est pas incompressible en l''état, et qu''il doit être documenté au même titre que celui des maraîchers.**
    Un rendement de réseau amélioré de 15 points libérerait ~20 L/s, soit plus d''un huitième du déficit.


    Règle annoncée aux trois parties : **toute dotation non documentée est provisoire.** Elle s''applique
    symétriquement.


    ## 4. Pourquoi global et pas individuel


    Les quotas individuels exigent des données parcellaires que je n''ai pas et une coopération que je
    n''ai pas obtenue — les maraîchers ont quitté la salle, la régie refuse de discuter. Une décision
    qui a besoin de leur assentiment pour exister n''existe pas jeudi. L''enveloppe globale est opposable
    immédiatement.


    En contrepartie, je délègue au collectif maraîcher la répartition de ses 80 L/s, sous deux conditions
    : une règle écrite et publiée, et la déclaration des compteurs. **Ce n''est pas une consultation,
    c''est un transfert de décision** — la commission ne choisira pas qui, parmi les 34, est irrigué.
    Si les conditions ne sont pas remplies au jour 10, je bascule sur des quotas administratifs au prorata
    de la surface, ce qui est le régime le moins efficace pour eux : six exploitations cultivent 300 des
    620 ha et capteraient la moitié de l''eau sans que la valeur produite par litre entre en ligne de
    compte.


    ## 5. Le fonds de 600 000 €


    600 000 € représentent ~15 % des 4,1 M€ annoncés. Ce n''est pas un dispositif d''indemnisation et
    je refuse de le présenter comme tel. C''est un instrument pour acheter de l''information et de l''eau
    :


    - **~70 k€ — réétalonnage de la station de Sarcelle et pose d''une station indépendante à l''aval.**
    Toute la répartition repose sur un capteur unique étalonné en 2023, et personne ne mesure aujourd''hui
    si les 180 L/s arrivent réellement en aval : on les déduit d''une mesure amont. C''est la dépense
    au plus fort rendement du dossier.

    - **~40 k€ — compteurs sur les 34 exploitations, campagne de débit nocturne sectorisé sur le réseau
    de la régie.**

    - **~380 k€ — aide ciblée et rachat de mise en jachère volontaire.** Payer pour libérer les parcelles
    à faible valeur, afin que les 80 L/s couvrent réellement le cœur productif. C''est le seul emploi
    de l''argent qui se convertit en litres.

    - **~110 k€ — réserve non affectée, arbitrée à la révision de trois semaines.**


    Critère d''attribution de l''aide : le seuil de viabilité de l''exploitation, pas l''hectare. Les
    six plus grandes reçoivent l''eau au prorata mais une part plafonnée du fonds.


    ## 6. Le dispositif de levée — remplacement de celui de 2022


    Le mécanisme de 2022 s''est révélé être un détecteur de faux positifs : l''orage du 9 août a produit
    une pointe, pas une recharge, et le débit est retombé à 340 L/s en quatre jours. Nouveau dispositif
    :


    - Levée conditionnée à **200 L/s mesurés à l''aval pendant 10 jours consécutifs** — durée choisie
    pour excéder le temps de décroissance observé d''une pointe orageuse (4 jours).

    - **Critère de non-imputabilité à un épisode unique** : débit au jour 10 ≥ débit au jour 3.

    - **Levée par paliers** : irrigation à 50 % du nominal pendant 7 jours, puis intégrale. Jamais de
    retour direct à la totalité.


    ## 7. Déclencheurs automatiques, sans vote


    - Aval < 180 L/s pendant 24 h consécutives → **suspension totale des prélèvements d''irrigation**,
    de plein droit.

    - Réserve tampon de la régie < 3 jours → suspension de l''irrigation, priorité potable.

    - Écart d''étalonnage > 10 % → réouverture de l''ensemble de la répartition sous 72 h.


    Ces déclencheurs n''ont d''effet exécutoire que portés par arrêté préfectoral : je saisis le préfet
    dès vendredi pour qu''ils soient repris.


    ## 8. Le meilleur argument contre ma position


    Le voici, écrit, parce que les maraîchers le porteront jeudi et qu''il est bon : *je détruis 4,1 M€
    et 90 emplois pour préserver un seuil de 180 L/s dont le respect est apprécié par une station unique
    étalonnée il y a trois ans. Si elle sur-lit de 12 %, le débit réel est de 360 L/s et le débit réservé
    n''est de toute façon pas tenu — j''ai sacrifié la récolte pour rien. Si elle sous-lit, j''ai prélevé
    50 L/s aux exploitations sans nécessité.*


    Il tient sur un point : **la mesure est le maillon faible et je ne peux pas le nier.** Il ne fait
    pas basculer la décision, parce que l''ordre des irréversibilités reste vrai quelle que soit la valeur
    exacte. Mais il impose deux engagements écrits que je prends devant la commission :


    1. L''étalonnage est la **première action**, engagée lundi, résultat sous 10 jours.

    2. **Tout litre révélé par l''étalonnage ou libéré par l''audit du réseau va en priorité à l''irrigation**,
    sans nouveau vote. Si la ressource réelle est supérieure, je dois la différence aux maraîchers, intégralement
    et immédiatement.


    ## 9. Ce qui renverserait ma position


    - Un étalonnage donnant un débit réel sensiblement supérieur à 410 L/s → l''enveloppe irrigation monte.

    - Une vérification agronomique établissant un véritable seuil de rupture sur un périmètre défini →
    la concentration remplace la réduction uniforme, et le partage change de forme.

    - Un audit démontrant que les 150 L/s de la régie sont réellement incompressibles → le 80 est plafonné
    et le fonds doit porter davantage.

    - Un document hydrobiologique de qualité comparable contredisant celui du 12 juin → le 180 redevient
    discutable. En son absence, ce rapport est la seule pièce indépendante du dossier et il fait foi.


    ## 10. Aux trois parties


    **À la régie** — votre dotation est garantie, écrite, inconditionnelle sur 14 jours, EHPAD et usages
    domestiques hors de portée de tout arbitrage. Vous n''avez plus de raison de refuser la discussion.
    En échange, vous produisez sous 5 jours votre rendement de réseau et votre débit nocturne sectorisé.
    Un prélèvement de 1 409 L/habitant/jour ne peut pas être déclaré intangible sans être expliqué. Les
    usages non essentiels — arrosage municipal, lavage de voirie, fontaines — sont suspendus dès jeudi.


    **Aux maraîchers** — vous obtenez 80 L/s au lieu de 240, et je ne prétends pas que c''est supportable.
    Vous obtenez aussi trois choses que le vote de la dernière séance ne vous offrait pas : la répartition
    interne de votre enveloppe, une priorité écrite sur toute eau libérée, et un fonds employé à concentrer
    l''eau sur les parcelles qui peuvent encore être sauvées plutôt qu''à saupoudrer une indemnité. Personne
    ici ne peut vous promettre huit semaines : l''horizon météo est de trois. Je vous engage sur 21 jours
    et une date de révision, pas sur une promesse que je ne tiendrais pas.


    **Sur le débit réservé** — il n''est pas défendu par une partie présente dans la salle, ce qui est
    précisément pourquoi il doit être mesuré à l''aval et protégé par un déclencheur automatique plutôt
    que par un vote.


    **À la presse** — l''arbitrage n''est pas entre « les paysans et les robinets ». Il est entre un minimum
    légal adossé à un rapport indépendant et deux demandes dont aucune des deux parties n''a produit les
    données de consommation.


    ---


    **Première action, lundi :** bon de commande étalonnage Sarcelle + station aval ; demande écrite à
    la régie (5 jours) ; convocation du collectif maraîcher sur la règle de répartition (10 jours) ; saisine
    du préfet pour reprise des déclencheurs par arrêté.


    Si vous voulez, je peux en produire la version mise en page pour diffusion aux trois parties, ou la
    note technique séparée sur le dispositif de levée.

    '
