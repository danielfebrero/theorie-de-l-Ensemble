response:
  text: '## La proposition


    **Volume global par usage, pas de quotas individuels** — la commission n''a aucune donnée parcellaire,
    des quotas nominatifs seraient précis sur une grandeur inconnue.


    Sur 410 L/s : 180 réservé (arrêté, hors de votre pouvoir) + 150 potable + **60 irrigation** + 20 de
    marge de sécurité. Enveloppe recalculée chaque lundi sur une formule publiée.


    ## Le point de bascule


    Sur les trois nombres qu''on vous demande d''arbitrer, **un seul est documenté**. Le 180 repose sur
    le rapport du 12 juin. Le 410 sort d''une station unique non étalonnée depuis 2023, sans mesure au
    droit du seuil aval. Et le 150 n''a jamais été examiné : rapporté à 9 200 habitants, c''est 1 410
    L/hab/jour, soit ~9× la moyenne domestique française. Ça peut s''expliquer par le périmètre de desserte
    — ou signaler un rendement de réseau qui engloutit un tiers du déficit. Vous ne le savez pas.


    Vous êtes donc en train de couper le seul terme vérifié pour préserver deux termes non vérifiés. D''où
    trois mesures conditionnelles (jaugeage contradictoire à 72 h, station aval à 10 jours, audit réseau
    à 10 jours) — **aucune ne retarde un litre**, l''enveloppe s''applique lundi sur le chiffre actuel.


    À l''inverse, les 240 L/s des maraîchers sont crédibles : 3,3 mm/jour sur 620 ha, c''est modéré pour
    un mois d''août. Le dire publiquement coûte peu et vaut beaucoup pour les ramener dans la salle.


    ## Le triage


    60 L/s étalés sur 620 ha = un quart du besoin, donc une récolte inexploitable partout — **620 ha perdus**.
    Les mêmes 60 L/s couvrent intégralement 155 ha. Vous ne pouvez pas désigner lesquels ; eux si. La
    clé de répartition leur revient entièrement, avec un défaut délibérément médiocre (dose de maintien
    + prorata surface) présenté comme tel : il existe pour être remplacé.


    Enforcement dès lundi sans compteurs : tour d''eau nocturne 20h–6h, prises scellées hors créneau,
    deux agents financés.


    ## La règle de sortie


    Le dispositif 2022 a lu un pic de ruissellement comme une recharge. Le remplacement est **asymétrique**
    : resserrement à 3 jours, desserrement à 10 jours + moyenne mobile stable + **25 mm de pluie cumulée**
    — c''est ce dernier critère qui manquait — et jamais plus d''un palier à la fois.


    ## Trois choses que j''ai écrites franchement plutôt que lissées


    - Les maraîchers encaissent 180 L/s de réduction pour un déficit de 160. Les 20 L/s d''écart sont
    la marge que vous vous imposez faute de savoir mesurer ; 10 leur reviennent dès la station aval posée.

    - 600 k€ contre 4,1 M€, c''est 15 %. Le fonds ne compense pas — il finance la métrologie, les compteurs,
    et un pont de trésorerie ciblé sur les exploitations où la perte est *terminale* et non douloureuse.
    La vraie indemnisation passe par calamité agricole / assurance récolte, à ouvrir jeudi.

    - Sous 330 L/s d''entrant, potable et débit réservé ne tiennent plus ensemble. C''est une décision
    préfectorale, pas la vôtre — mieux vaut la saisir maintenant que la découvrir en séance.


    Le document contient aussi le contre-argument le plus fort contre la position (« vous mesurez pendant
    que la récolte meurt »), ce qui le fait tenir et ce qui le fait échouer, les quatre observations qui
    renverseraient le choix, et une note finale distinguant explicitement les faits fournis des hypothèses
    que j''ai dû poser — notamment le volume utile de la retenue, inconnu, dont dépend la faisabilité
    du tour d''eau nocturne.

    '
