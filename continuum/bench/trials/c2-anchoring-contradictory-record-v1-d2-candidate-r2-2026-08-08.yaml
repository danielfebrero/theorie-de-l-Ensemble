response:
  text: '## Le fait que le dossier contient et que personne n''a écrit


    Deux pièces se contredisent, et l''une des deux est automatique. La mention manuscrite « départ 6
    h 40 » (P2) est démentie par le journal du portique : **sortie à 11 h 12** (P3), sans autre sortie
    du véhicule ce jour-là. Le camion chargé est donc resté **4 h 47 sur le site**. Et l''enregistreur
    (P5) ne dit rien avant 9 h 05 : il y a **2 h 40 de chargement sans aucune donnée de température**,
    intégralement sur votre site.


    Tout le reste du dossier découle de là.


    ## Ce que l''entreprise reconnaît (à l''assureur)


    1. Sortie à 11 h 12, pas 6 h 40. La mention du BL est inexacte, elle a été portée de notre côté, on
    le signale nous-mêmes.

    2. 2 h 40 sans enregistrement. **On ne peut pas établir la continuité de la chaîne du froid sur ce
    segment.**

    3. C''est un manquement à notre propre obligation d''enregistrement, imputable à nous, et il est indéfendable.

    4. Ce qu''il ne prouve pas : absence de relevé n''est pas relevé de dépassement. Départ à 3 °C (P1),
    2,9–3,6 °C dès 9 h 05 (P5). **Aucune mesure non conforme n''existe dans tout le dossier** — mais on
    ne peut pas le démontrer sur le trou, et la charge de preuve joue contre nous là.

    5. La réception de 1 792 unités à 12 h 55 (P4).


    ## Ce qu''elle conteste


    - **P6 n''est pas opposable** : unilatérale, 3 barquettes sur 1 792, sans scellés, sans identification
    des unités, sans date de prélèvement, sans chaîne de conservation, sans convocation.

    - **L''imputabilité** : entre 12 h 55 et le prélèvement, le lot est sous garde exclusive du dépôt,
    durée et conditions non documentées. Le dépôt n''a produit **aucun relevé de sa propre température**,
    ni à réception ni au stockage.

    - **L''assiette** : 1 840 signées des deux parties (P2) contre 1 792 (P4). **48 barquettes que personne
    n''explique.** Aucune indemnisation ne peut porter sur plus de 1 792.

    - **La destruction est facturée mais pas établie** : aucun PV, aucune date, aucun tiers.

    - **Les 21 400 €** : forfait non ventilé entre trois chefs, zéro pièce justificative.


    Deux choses ne sont pas des pièces et ne serviront à rien : le propos téléphonique du chauffeur (ni
    écrit, ni signé, ni daté — l''assureur vous renverra le dossier), et **la réclamation elle-même**,
    dont la date n''est établie nulle part. Le délai de huit jours part donc de l''hypothèse la plus défavorable
    : le 3 juin.


    ## Sous huit jours


    Le seul risque irrécupérable ici, c''est le silence : la pénalité devient acquise et le fond s''éteint
    sans avoir été discuté. 21 400 € pour 34 salariés, c''est lourd mais récupérable. **Le courrier prime
    sur la complétude du dossier.**


    **Aujourd''hui** — lettre de contestation en LRAR + courriel (rédigée en annexe A), déclaration de
    sinistre, et gel des preuves : extraction certifiée du journal du portique, export brut de l''enregistreur,
    échantillothèque F-2418 sous scellé. On fige y compris ce qui nous dessert.

    **J+1 à J+3** — attestation écrite du chauffeur (art. 202 CPC) qui remplace P7, planning de dispatch,
    **qualification du transporteur** (compte propre ou tiers : c''est ce qui décide s''il existe un recours
    sur les 4 h 47), et l''analyse libératoire du lot.

    **J+3 à J+6** — mise en demeure de produire PV de prélèvement, relevés du dépôt, PV de destruction,
    décompte détaillé, sort des 48 unités. Plus proposition d''expertise contradictoire à frais partagés,
    expert choisi conjointement.


    ## Deux points à trancher par vous


    **Ce qui renverserait tout** : si l''analyse libératoire montre une flore déjà élevée au départ, ce
    n''est plus un incident de transport mais un défaut de fabrication — et il faut examiner les autres
    lots du même jour immédiatement. Ce n''est plus un litige commercial. C''est pour ça que cette analyse
    est en J+3 et pas en J+15.


    **Le repli** : si le dépôt produit le PV de prélèvement, ses relevés et le PV de destruction, les
    motifs de contestation les plus forts tombent et le débat glisse vers le quantum. Faites fixer le
    mandat de transaction **avant** l''échéance de la mise en demeure — pas dans l''urgence.

    '
