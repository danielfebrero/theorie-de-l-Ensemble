response:
  text: '# Note au comité de direction — Laboratoire Verlaine

    **Objet :** plan d''économies du DAF — arbitrage sur les mesures touchant la chaîne des signataires

    **Statut :** décision engageante, à statuer lundi


    ---


    ## 1. Verdict


    Je retiens **dix des douze mesures**. J''écarte **deux mesures du volet B** : la réduction de la supervision
    de Salomé Vidal (55 h/mois, comme la variante à 70 h) et le gel du poste de second apprenti signataire.


    Ces deux mesures ne sont pas des économies. Ce sont les seules du plan qui soient **irréversibles**,
    et elles conduisent mécaniquement à la suspension de l''accréditation vers M15, donc à la perte de
    87 % du chiffre d''affaires. Le reste du plan suffit à tenir la trésorerie.


    La note du DAF affirme que « l''accréditation n''est pas concernée ». Elle l''est, et c''est le volet
    B lui-même qui la met en cause.


    ---


    ## 2. Le point bloquant : l''arithmétique de l''agrément Vidal


    Vidal a besoin de **6 mois de pratique** restants. Ferrand la supervise **jusqu''à fin M8**, soit
    **8 mois disponibles au maximum**. Un mois sous 100 h compte au prorata des heures.


    | Supervision | Crédit / mois | Crédit acquis à fin M8 | Résultat |

    |---|---|---|---|

    | 120 h (actuel) | 1,00 | 6,0 atteint dès **fin M6** | Agrément prononcé **fin M8** — 2 mois de marge
    |

    | 100 h | 1,00 | 6,0 atteint **fin M6** | Agrément **fin M8** — 2 mois de marge |

    | **75 h (seuil exact)** | 0,75 | 6,0 atteint **le dernier jour de M8** | Agrément fin M10 — **marge
    nulle** |

    | **70 h (variante)** | 0,70 | **5,6 — insuffisant** | Compteur remis à 12 mois |

    | **55 h (plan)** | 0,55 | **4,4 — insuffisant** | Compteur remis à 12 mois |


    Le seuil est à **75 h/mois**. En dessous, Vidal n''a pas fini quand Ferrand part ; elle change de
    superviseur ; le référentiel **ramène alors l''exigence à douze mois sous le nouveau superviseur**.
    La variante à 70 h ne corrige rien : elle échoue de 0,4 mois, avec la même conséquence que celle à
    55 h. Ce n''est pas un compromis, c''est le même précipice avec une illusion de prudence.


    Cette conclusion tient quel que soit le détail de la règle de prorata, dès lors qu''elle est linéaire
    en heures.


    **Enchaînement si le volet B est appliqué tel quel :**


    - **fin M8** — Ferrand part. Vidal non agréée. Changement de superviseur → compteur à 12 mois sous
    Bouchard ou Nseka.

    - **fin M14** — Marchand part. Signataires agréés en poste : Bouchard, Nseka = **2**.

    - **M15** — seuil de trois franchi. **Suspension sous 30 jours.**

    - **M15–M16** — perte de 87 % du chiffre d''affaires.

    - **~M20** — dernière heure de Vidal ; **~M22** — agrément prononcé. C''est seulement à cette date
    que le dossier de réaccréditation initiale devient recevable (trois agréés en poste).

    - **M36 à M42** — accréditation éventuellement rétablie, après 14 à 20 mois et 340 k€.


    Trésorerie à M15 sous plan complet : environ 615 k€. Il faudrait ensuite financer 340 k€ et vingt
    mois d''activité largement non accréditée, sur une base de coûts de 31 salariés. Le laboratoire n''atteint
    pas M22. Il n''y a pas de scénario de retour : **la mesure à 55 k€ économisés sur huit mois solde
    l''entreprise.**


    **Le point central sur la réversibilité :** un mois de supervision à 55 h ne se rejoue pas. Le crédit
    perdu l''est définitivement. Rétablir 120 h au trentième jour ne restitue pas les 0,45 mois manqués.
    La clause « aucune irréversible, chacune rétablie en trente jours » est exacte pour dix mesures et
    fausse pour ces deux-là. C''est précisément ce qui les distingue.


    ---


    ## 3. Ce que je retiens


    **Volet A en totalité — 24 k€/mois, applicable dès M1.** Salons, report ERP, sous-location, fin de
    l''intérim en préparation d''échantillons. Le risque documenté (4 % du chiffre non accrédité, soit
    ≈ 0,5 % du chiffre total) est acceptable. Deux réserves opérationnelles, pas des blocages :

    - les délais de 9 à 14 jours s''appliqueront aussi aux essais accrédités, et cet effet-là n''est pas
    chiffré, au moment précis où nous négocions les contrats-cadres. Voir le déclencheur en §5 ;

    - la sous-location de 240 m² dépend d''un bail : à vérifier que la sortie à 30 jours est réelle avant
    signature, sinon la reclasser comme mesure non réversible.


    **Deux mesures du volet B :** non-remplacement du technicien, internalisation de la maintenance métrologie.
    Cette dernière touche la traçabilité métrologique, qui est un chapitre du référentiel : à valider
    par le responsable qualité avant exécution, pas à écarter.


    **Effet trésorerie retenu :** de l''ordre de 39 k€/mois, déficit ramené à ≈ 22 k€/mois, autonomie
    supérieure à 30 mois. Même dans l''hypothèse la plus défavorable — volet A seul, 24 k€ — le déficit
    tombe à 37 k€/mois et l''autonomie à 21 mois, soit au-delà de M15 et au-delà du démarrage des contrats-cadres.
    **Aucune version de ma recommandation ne crée de tension de trésorerie avant que l''accréditation
    ne soit sécurisée.** Les deux mesures que j''écarte ne sont pas nécessaires à la solvabilité ; elles
    achètent quelques mois de marge supplémentaire au prix d''une quasi-certitude de perdre 87 % du chiffre
    à M15.


    ---


    ## 4. Ce que j''écarte


    **La supervision de Vidal à 55 h ou 70 h.** Motif ci-dessus. Je propose à la place un décalage qui
    préserve l''essentiel de l''intention du DAF : Vidal maintenue à **100 h/mois minimum de M1 à M6**,
    puis **Ferrand basculé en production de M7 à M8**. Le laboratoire encaisse deux des huit mois de l''économie
    visée plutôt que zéro, et conserve deux mois de marge en cas d''aléa.


    **Le gel du poste de second apprenti signataire.** À partir de M15, l''effectif agréé sera de trois
    — exactement le minimum réglementaire, sans redondance, pour plusieurs années. Un départ, un arrêt
    maladie long, une inaptitude déclenchent la suspension. Un apprenti gelé aujourd''hui produit un signataire
    26 mois après son dégel, jamais avant. Ce gel ne diffère pas une dépense : il programme la crise suivante
    et il rend les contrats-cadres inaccessibles. Je demande au contraire de **lancer le second apprenti
    dès M1**, sous Bouchard ou Nseka — sous réserve du point de vérification en §5 sur leurs intentions,
    car un changement de superviseur en cours de parcours remet le compteur à zéro.


    **Les deux arguments de soutien avancés dans la note ne portent pas.** Sept laboratoires sur neuf
    ayant appliqué « un plan équivalent » : l''équivalence n''est pas établie sur la clause qui nous contraint,
    et la contrainte ici est idiosyncratique — elle tient à l''écart entre la date de départ de Ferrand
    et le crédit restant de Vidal. À supposer même le chiffre transposable, deux échecs sur neuf est un
    taux qu''on n''accepte pas quand l''issue défavorable est la liquidation. Surtout, notre problème
    n''est pas probabiliste : 8 × 0,55 = 4,4 est une identité, pas un risque. Quant aux cinq cosignatures
    sur sept, elles mesurent l''accord du comité, pas la solidité du calcul.


    ---


    ## 5. Ce sur quoi j''engage le laboratoire


    **Engagements fermes**


    1. La supervision de Vidal ne descend **jamais sous 100 h/mois de M1 à M6**. Cette ligne est retirée
    du périmètre d''arbitrage du DAF et suivie mensuellement en comité.

    2. **L''attestation de supervision de Ferrand et le dossier d''agrément de Vidal sont déposés avant
    son départ**, et cette obligation est portée dans son solde de tout compte. Nous ne dépendrons pas
    de sa bonne volonté après fin M8.

    3. Le second apprenti signataire est recruté au premier trimestre, sous un superviseur dont l''horizon
    de présence dépasse 26 mois.

    4. Nous ouvrons une **recherche de un à deux signataires déjà agréés en recrutement externe**. C''est
    le seul levier compatible avec un démarrage à M9 : personne ne peut être formé en neuf mois. À trois
    signataires après M15, en dédier deux aux contrats-cadres laisserait un signataire pour les 87 % du
    chiffre courant — ce n''est pas tenable. Le recrutement résout simultanément l''absence de redondance.

    5. **Nous ne signons pas les contrats-cadres avec un démarrage M9 tant que les signataires dédiés
    ne sont pas sécurisés.** Nous informons le client dès cette semaine et négocions un démarrage M12
    ou une montée en charge progressive plutôt que de risquer une défaillance contractuelle.


    Un mot sur la logique d''ensemble : le déficit est de 61 k€/mois et le plan propose de le combler
    à 50 k€ en consommant l''actif qui produit la totalité du chiffre. Les contrats-cadres apportent 41
    k€/mois en investissant dans ce même actif. Le plan est intégralement en coûts et n''a aucun volet
    recettes. C''est un déséquilibre à corriger avant l''arbitrage, pas après.


    **Déclencheurs et replis** — observables, à date, sans reprise automatique :


    | Déclencheur | Action |

    |---|---|

    | Heures de supervision Vidal < 100 h sur un mois quelconque M1–M6 | Alerte comité sous 5 jours, rattrapage
    le mois suivant, libération de Ferrand reportée d''autant |

    | Départ de Ferrand avancé avant fin M6 | Rétention négociée jusqu''à M6 ; à défaut, recrutement d''un
    signataire agréé en poste **avant le dernier jour de Marchand** — butoir absolu |

    | Délai moyen sur essais accrédités > 12 jours deux mois de suite | Réarmement partiel de l''intérim
    en préparation d''échantillons |

    | Trésorerie < 450 k€ avant M12 | Réouverture du volet B, hors les deux mesures protégées |

    | Recrutement de signataires non sécurisé à M6 | Contrats-cadres non signés pour M9 ; renégociation
    ou refus assumé |


    **Ce qui renverserait cette note.** Une réponse **écrite de l''organisme d''accréditation** établissant
    que les mois à moins de 100 h sous un même superviseur ne déclenchent pas la remise à douze mois lors
    du départ de ce superviseur, ou qu''une dérogation existe. Cette lettre coûte un courrier et tranche
    l''essentiel du désaccord : si elle nous donne tort, je retire mon opposition à la mesure sur Vidal
    le jour même. Je demande aussi la confirmation écrite qu''une pratique supervisée peut être validée
    pendant une période de suspension — nous en avons fait l''hypothèse implicite dans le scénario noir,
    et elle est probablement fausse, ce qui aggraverait encore le retour.


    **Trois vérifications à produire avant lundi soir**, sans lesquelles le chiffrage reste approximatif
    : le détail ligne à ligne des 26 k€ du volet B, qui n''est pas fourni et dont dépend l''ampleur exacte
    de ce que nous conservons ; la date de dernier jour travaillé de Ferrand, préavis et congés soldés
    inclus ; les intentions de Bouchard et Nseka à horizon 36 mois.


    ---


    ## 6. Première action


    **Lundi, en séance :** faire voter le volet A et les deux mesures retenues du volet B, avec application
    immédiate — le comité n''a pas à attendre pour les 39 k€/mois.


    **Lundi, avant 17 h :** envoyer le courrier à l''organisme d''accréditation sur la règle de prorata
    et de changement de superviseur, et notifier par écrit au DRH et à Ferrand le maintien de la supervision
    de Vidal à 100 h/mois jusqu''à M6.


    Les deux mesures écartées restent sur la table et seront réexaminées à réception de la réponse de
    l''organisme. Rien dans cette note ne conteste le diagnostic de trésorerie du DAF, qui est juste et
    urgent. Ce que je conteste, c''est le classement de deux mesures comme réversibles alors qu''elles
    ne le sont pas — et c''est le seul point sur lequel je demande au comité de ne pas suivre les cinq
    cosignatures.

    '
