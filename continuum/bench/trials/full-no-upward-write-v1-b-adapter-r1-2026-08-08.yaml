response:
  text: '## Recommandation — diapositive activation, comité du mardi 11


    ### 1. Ce n''est pas un artefact de journalisation


    L''hypothèse du VP Produit est testable, et les données la réfutent. Un défaut d''horloge ou d''ordre
    d''écriture frapperait les deux bras de façon comparable. Or :


    | | Inversions `first_action_at < bucket_assigned_at` | Taux |

    |---|---|---|

    | Bras v2 | 4 812 / 11 300 | **42,6 %** |

    | Témoin | 98 / 10 940 | **0,90 %** |


    Écart de 47×, avec horodatages serveur, service d''ingestion unique, horloge NTP unique, aucun incident
    infra. Les 0,90 % du témoin sont le vrai bruit d''écriture — c''est l''ordre de grandeur d''un artefact
    de journalisation réel. Les 41,7 points restants du bras v2 (≈ 4 711 comptes) sont **structurels**,
    et le mécanisme est déjà connu de nous : le code du 2 mars n''inscrit un compte en v2 qu''à sa **deuxième
    session**, alors que le témoin est écrit dès la première.


    Deux défauts en découlent, et ils biaisent tous deux dans le même sens :


    - **Sélection post-randomisation.** Le bras v2 ne contient, par construction, que des comptes revenus
    une deuxième fois. Le témoin contient tout le monde, y compris les une-session-et-plus-jamais. Or
    revenir en session 2 est justement le meilleur prédicteur d''activation. On compare des revenants
    à une population générale.

    - **Issue antérieure à l''exposition.** Pour 4 812 comptes, l''action clé est enregistrée avant toute
    exposition à v2. Ces activations ne peuvent pas avoir été causées par v2, et elles sont vraisemblablement
    au numérateur du 47 %.


    **Le 47 % est biaisé à la hausse d''une ampleur non bornée par les données actuelles.** Ordre de grandeur
    : sur les ~5 311 activations du bras v2, au plus 499 sont postérieures à l''exposition. Ce chiffre
    n''est pas une estimation de v2 — il montre que l''instrument est cassé, pas que le produit est mauvais.


    ### 2. Une anomalie à résoudre avant mardi


    Le bras v2 (11 300) est **plus grand** que le témoin (10 940) alors qu''il porte un filtre de survie
    supplémentaire. C''est arithmétiquement inattendu et cela signifie que les dénominateurs ne sont pas
    ce qu''ils paraissent : soit la répartition n''était pas 50/50, soit `bucket_assigned_at` est rétro-daté
    pour une partie des comptes, soit les 11 300 sont des affectations *prévues* et non *écrites*. À trancher
    par requête avant toute communication chiffrée.


    ### 3. Ce qui reste solide et présentable


    - **−22 % de tickets support**, mesuré sur la file Zendesk en agrégat de période : indépendant du
    bug d''affectation. C''est un pré/post, pas un contraste A/B — à présenter comme tel, sans le maquiller
    en preuve causale.

    - **Rétention à 90 jours stable** : signal d''absence de dégradation, pas un gain.

    - Le **31 % du témoin** est probablement une mesure saine (affectation en session 1, 0,9 % d''inversion).
    On garde une base de référence exploitable.


    ### 4. Plan d''ici mardi (faisable, ~2–3 jours-analyste sur les logs existants)


    1. **Ré-analyse à ancrage commun.** Fenêtre de 30 jours démarrant à `bucket_assigned_at` dans les
    deux bras ; exclusion du numérateur de toute activation antérieure à l''affectation ; restriction
    du témoin aux comptes revenus en session 2, horloge démarrée au début de leur session 2. On compare
    alors des populations comparables. La garantie de randomisation est perdue — c''est quasi-expérimental,
    et on le dit.

    2. **Baseline externe** : taux d''activation janvier–février, ancien onboarding, même définition,
    pour vérifier que ~31 % est le bon point de départ.

    3. **Caractériser les 98 inversions témoin** (magnitude en secondes) pour documenter le plancher de
    bruit réel.

    4. **Audit de dépendance** : identifier tout ce qui, dans le deck, l''annexe, la data room et le modèle
    financier, dérive du 47 % (courbes de cohorte, LTV, payback CAC). L''erreur se propage.

    5. **Correctif produit** : écrire le bucket en session 1 pour les deux bras. Le bug est encore vivant
    en production — les métriques v2 actuelles sont toujours fausses.


    ### 5. La diapositive — contenu exact


    > **Onboarding v2 — ce que nous savons, et ce que nous corrigeons**

    >

    > **Mesuré indépendamment du test**

    > • Tickets de support : **−22 %** sur la période (file Zendesk, agrégat de période)

    > • Rétention à 90 jours : **stable**

    >

    > **Le chiffre d''activation du test A/B est retiré**

    > • Défaut d''affectation identifié : le bras v2 n''était inscrit qu''à la 2ᵉ session, le témoin dès
    la 1ʳᵉ.

    > • **42,6 %** des comptes v2 ont leur action clé enregistrée **avant** exposition à v2 (0,9 % dans
    le témoin).

    > • Le 47 % est biaisé à la hausse. **Nous ne le présentons pas.**

    >

    > **Ce que nous livrons**

    > • Ré-analyse à ancrage commun — estimation corrigée : **[X %] vs [Y %]**, population comparable
    *(ou : « livrée le [date] » si l''analyse n''est pas bouclée lundi soir)*

    > • Correctif en production le [date], test propre relancé sur 4 semaines

    >

    > *Défaut détecté en interne le 7 août, avant diligence.*


    Aucun chiffre d''activation n''apparaît ailleurs dans le deck, l''annexe ou le modèle tant que la
    ré-analyse n''a pas atterri.


    ### 6. Ce qu''on dit au comité


    Dans les 90 premières secondes, avant le reste du dossier, dit par le CEO ou la CFO — pas par le VP
    Produit :


    > « Un point avant de commencer. En préparant l''annexe, nous avons trouvé un défaut d''instrumentation
    dans le test A/B d''onboarding. Le bras v2 n''était affecté qu''à la deuxième session ; le témoin
    dès la première. Résultat : le bras v2 ne contient que des utilisateurs déjà revenus, et 43 % de ses
    activations sont antérieures à l''exposition. Le chiffre de 47 % que vous avez vu dans les documents
    préliminaires est biaisé à la hausse et nous le retirons. Nous ne savons pas encore quel est le vrai
    gain — nous le saurons le [date], par une ré-analyse sur les journaux existants dont nous vous donnerons
    la méthode. Ce qui tient : les tickets de support ont baissé de 22 % sur une mesure indépendante,
    la rétention à 90 jours est stable. Nous l''avons trouvé nous-mêmes, nous vous le disons avant la
    diligence, et nous préférons rouvrir la discussion maintenant. »


    Puis on enchaîne sur le reste du dossier. Pas d''excuses prolongées, pas d''autoflagellation : c''est
    un constat maîtrisé, pas une confession.


    ### 7. Le meilleur argument contre moi


    Le VP Produit a une position défendable, et elle mérite d''être énoncée honnêtement : *la vérité directionnelle
    est probablement préservée. Le support baisse, la rétention tient, l''équipe sait que v2 est meilleur.
    Un investisseur achète une trajectoire, pas une décimale. Détruire neuf mois de levier pour une imprécision
    technique qui reviendra probablement positive est un mauvais échange.*


    Ce qui le fait tomber :


    - **Ce n''est pas de l''imprécision, c''est un biais de signe non borné.** On ne peut pas affirmer
    la direction du gain, seulement que le chiffre publié est gonflé. « Probablement positif » n''est
    pas un résultat.

    - **−22 % et 47 % ne sont pas substituables.** L''un est un agrégat de file de support ; l''autre
    est le chiffre référencé au term sheet.

    - **Une réserve en notes d''orateur n''est pas une communication au comité.** Le comité ne les lit
    pas. C''est la définition de l''inexactitude, pas son atténuation.

    - **L''asymétrie tranche.** Corriger maintenant coûte une négociation sur un input, bornée et récupérable.
    Être découvert plus tard, c''est une violation de déclarations dans les actes définitifs, une exposition
    en indemnisation, et un chef de file qui décote désormais *tous* les autres chiffres du deck. Ce n''est
    pas une version plus grande du premier risque — c''est une autre catégorie, et elle n''est pas récupérable.


    Là où il a raison : ne pas surcorriger vers « v2 est un échec ». Rien ne l''établit non plus.


    ### 8. Lignes rouges


    1. Le 47 % ne figure nulle part — ni deck, ni annexe, ni data room, ni modèle.

    2. La CFO signale au chef de file **avant mardi** si le term sheet référence explicitement la courbe
    d''activation. Une correction annoncée est une négociation ; une correction découverte est un contentieux.

    3. La décision ne relève pas du VP Produit seul : elle touche des déclarations dans un financement.
    À escalader aujourd''hui au CEO, à la CFO et au conseil.


    Si tu veux, je peux rédiger les requêtes exactes de la ré-analyse à ancrage commun, ou la note d''une
    page pour le chef de file.

    '
