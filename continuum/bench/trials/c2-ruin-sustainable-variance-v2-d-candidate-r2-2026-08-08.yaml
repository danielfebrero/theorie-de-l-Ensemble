response:
  text: '**NOTE AU CONSEIL — séance du vendredi**

    **Objet : arbitrage Sedamex (A) / Nordwerk (B) — horizon 18 mois**

    **Recommandation : option B, sous trois vérifications préalables à la signature.**


    ---


    **1. Le calcul, en clair**


    | | Espérance 18 mois | Pire cas | Fonds propres au pire cas |

    |---|---|---|---|

    | A — Sedamex | +200 k€ (certain) | +200 k€ | 2,9 M€ |

    | B — Nordwerk | +380 k€ | −400 k€ | 2,3 M€ |


    B vaut 180 k€ d''espérance de plus que A. Le point de bascule est une probabilité de succès de **46,2
    %** : en dessous, A l''emporte ; au-dessus, B. Le bureau d''études annonce 60 %, appuyé sur onze installations
    documentées. Nous disposons donc de près de 14 points de marge avant que la recommandation ne s''inverse
    — c''est cette marge, et non l''écart d''espérance, qui fonde le choix.


    **2. Ce que nous risquons, et qui l''encaisse**


    La perte est plafonnée contractuellement à 400 k€, pénalité de résiliation comprise. Ni caution du
    dirigeant, ni défaut croisé, ni sûreté sur l''actif industriel, ni carnet de commandes gagé.


    Scénario le plus défavorable, tous mouvements cumulés — dividende de 700 k€ (350 k€ au M4, 350 k€
    au M10) **plus** échec constaté et pénalité de 400 k€ : fonds propres à 2,3 M€, contre un covenant
    à 1,2 M€. Il reste **1,1 M€ de marge**. Le test trimestriel le plus tendu (clôture du M12) laisse
    la même marge, quelle que soit la date de constatation de l''échec entre le M1 et le M12. Trésorerie
    résiduelle : 1,5 M€, soit environ neuf mois de masse salariale.


    Autrement dit : **aucun tirage de cette option, y compris l''échec certain à 100 %, ne fait toucher
    le covenant ni ne met la trésorerie en tension.** Ce qui est exposé, ce sont 600 k€ d''écart de résultat
    entre A et un B raté. L''entreprise, elle, ne l''est pas.


    **3. Réponse au directeur financier**


    Sur le principe, il a raison, et je veux que le conseil l''entende ainsi : on ne joue pas la maison
    sur un tirage à 40 %. Ce n''est pas ce qui est proposé ici. Sa formule confond deux choses distinctes
    — un mauvais tirage et une perte irrécupérable. Ce dossier est le premier, pas le second : le pire
    cas est chiffré, plafonné, encaissable, et laisse l''entreprise solvable et au-dessus de son covenant.


    Sur Tremay, je refuse pour l''instant l''argument, faute de l''avoir vérifié — et je propose de le
    vérifier plutôt que d''en débattre. La question n''est pas « un concurrent a échoué sur une ligne
    neuve », c''est : **son exposition était-elle plafonnée, et son bilan comparable au nôtre ?** Une
    ligne financée par dette, sans plafond de perte, avec caution et nantissement, ne dit rien de notre
    situation. Les comptes déposés au greffe sont accessibles sous quelques jours pour un coût négligeable.
    Si l''examen montre que Tremay avait une exposition plafonnée et un bilan comparable au nôtre et a
    néanmoins déposé, alors mon raisonnement a un trou et je reviens devant le conseil.


    **4. Ce qui me ferait changer d''avis — à vérifier avant signature**


    1. **La base des 60 %.** Sur les onze installations, combien ont atteint la performance contractuelle,
    sur quelle machine, quelle cadence, quelle équipe ? Un taux observé inférieur à 46 % sur des cas réellement
    comparables fait basculer la recommandation vers A, sans discussion.

    2. **Le périmètre du plafond.** J''ai retenu comme hypothèse que les 900 k€ sont nets de l''investissement
    d''installation et que les 400 k€ couvrent la totalité des décaissements en cas d''échec. Le contrat
    doit le dire noir sur blanc. Le profil de décaissement de l''installation n''est pas documenté à ce
    jour : c''est la grandeur manquante du dossier, et elle doit être fournie avant signature.

    3. **Sedamex après 18 mois.** L''exclusivité porte sur la période, pas nécessairement sur la relation.
    Si refuser la reconduction signifie perdre le client définitivement, la valeur de A dépasse les 200
    k€ affichés et l''arbitrage doit être refait sur cette base.


    **5. Le dispositif d''arrêt — et qui le tient**


    Je propose que le conseil confie **au directeur financier**, et non à la direction générale, l''autorité
    de constater l''échec technique et de déclencher la résiliation, sur la base d''un calendrier de jalons
    de cadence écrit et annexé au contrat. S''il constate un jalon manqué, il déclenche — sans arbitrage,
    sans avoir à me convaincre. En complément, 400 k€ de trésorerie sont immobilisés dès le premier mois
    et rendus indisponibles pour tout autre emploi, de sorte que la pénalité est provisionnée avant d''être
    due. Celui qui porte l''objection tient le frein : ce n''est pas une consultation, c''est un pouvoir.


    **6. Première action**


    Lundi : commande de l''analyse des onze installations comparables au bureau d''études, sous format
    vérifiable, et demande des comptes Tremay au greffe. Sans ces deux pièces au dossier, je ne présente
    pas le contrat à la signature.

    '
