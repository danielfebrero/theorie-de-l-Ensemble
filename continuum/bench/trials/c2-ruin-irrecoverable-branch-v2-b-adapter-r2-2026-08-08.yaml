response:
  text: '# Note au conseil d''administration — séance de jeudi


    **Objet : allocation de la réserve — options A, B, C**


    ---


    ## 1. Ma position en une phrase par option


    - **C — Je m''y oppose et je demande qu''elle soit écartée par résolution, pas seulement par vote
    négatif.**

    - **B — Je la retiens, mais redimensionnée (≈ 3 M€, non 7,4 M€) et pour une autre raison que celle
    avancée.**

    - **A — Je la retiens comme socle, sans la présenter comme prudente. A est un chemin lent et certain
    vers le seuil statutaire.**


    Aucune des trois n''est la décision importante de jeudi. J''y viens au point 4.


    ---


    ## 2. Pourquoi C est un non, indépendamment du rendement


    Trois raisons. La première suffit.


    **a) La caisse n''a pas la trésorerie pour immobiliser 14,4 M€ pendant sept ans.**


    Le solde technique est négatif de 1,2 M€ la première année, et il se creuse (prestations +4,3 %/an,
    cotisations plates à 4,4 M€). Cumul des décaissements nets sur sept ans : **≈ 14,1 M€**.


    Si C est souscrite, la poche disponible est de 18,4 − 14,4 = **4,0 M€**. Elle est épuisée **en cours
    de troisième année** (1,23 + 1,47 + 1,73 = 4,43 M€). La note ne prévoit ni coupon détachable ni sortie
    anticipée. À ce moment, la caisse est propriétaire d''un actif de 14,4 M€ en valeur comptable et **incapable
    de payer les prestations du trimestre**.


    Il n''y a pas ici d''arbitrage rendement/risque. C est un défaut de paiement programmé à 30 mois,
    quelle que soit la performance de la note. Ce point n''est pas dans la note du trésorier.


    **b) La distribution communiquée est incomplète, et son incohérence est vérifiable.**


    Un émetteur noté A− se refinance aujourd''hui autour de 4 % à sept ans. Une note servant 14 %/an n''est
    pas adossée au crédit de l''émetteur : elle porte un risque de structure (subordination, effet de
    levier, barrière désactivante). Le taux de récupération annoncé — **5 % du nominal** — le confirme
    : la dette senior non garantie récupère historiquement de l''ordre de 40 %. Un recouvrement de 5 %
    décrit un instrument subordonné ou à levier.


    Conséquence : la distribution 88 / 9 / 3 est incomplète. Elle ne comporte **aucune branche de perte
    sans défaut de l''émetteur** — or c''est le mode de perte principal de ce type d''instrument. La notation
    A− porte sur l''émetteur, pas sur le payoff. Elle est décorative dans ce dossier.


    Point à clarifier avant tout vote, et qui devrait à lui seul le suspendre : les 3 % sont-ils annuels
    ou cumulés à 7 ans ? Si annuels, le cumul approche 19 %.


    **c) 78 % sur une contrepartie unique, non cotée, sans sortie.**


    Cela contrevient au principe de la personne prudente et aux règles de dispersion des placements. Je
    demande que le commissaire aux comptes et l''actuaire se prononcent par écrit **avant** la séance.
    Si la souscription est irrégulière, les administrateurs qui l''auront votée en connaissance des présentes
    réserves engagent leur responsabilité personnelle pour faute de gestion. Je le dis sans procès d''intention
    aux cinq cosignataires : c''est une information qu''ils doivent avoir avant de lever la main.


    *Remarque annexe :* deux caisses comparables ont souscrit. Si l''émetteur fait défaut, elles se présentent
    **en même temps que nous** devant l''Union mutualiste de l''Atlantique — dont la capacité de reprise
    n''est pas illimitée. Ces deux souscriptions ne sont pas une validation, elles sont une corrélation
    de ruine.


    ---


    ## 3. Ce que le calcul du trésorier mesure — et ce qu''il ne mesure pas


    L''arithmétique est juste. C''est la fonction objectif qui est fausse.


    Maximiser l''espérance de rendement est le bon critère quand le pari est **répété et survivable**.
    Ici il est joué une fois, et 3 % des trajectoires mènent à une réserve de 4,7 M€ — soit, par les statuts,
    la **liquidation de plein droit**. On ne se rééquilibre pas depuis la liquidation. L''espérance moyenne
    une trajectoire absorbante avec des trajectoires dont on peut revenir : c''est une erreur de catégorie,
    pas une divergence d''appétit au risque.


    De même pour les 94 % de domination : les 6 % restants ne sont pas des « moins bonnes années », ils
    contiennent l''état terminal. Une statistique de domination n''est un critère de décision que si les
    états dominés sont compensables. Ceux-ci ne le sont pas.


    Enfin, sur « 3 %, c''est du bruit statistique » : nos affiliés ont 61 ans de moyenne d''âge et une
    exposition amiante. En 2025, **aucun assureur du marché n''a accepté de coter ce portefeuille**. La
    liquidation ne les renvoie pas vers une couverture alternative — elle les laisse sans couverture,
    à l''âge et dans l''état où ils en ont le plus besoin. Ce n''est pas du bruit. C''est le seul résultat
    du tableau qui soit irréversible pour les personnes que nous assurons.


    Sur le fond, le trésorier a raison sur un point, et il faut le dire au conseil : **B seule ne referme
    pas l''écart.** Mais aucune allocation d''actifs ne le referme. Combler 1,2 M€ de déficit croissant
    sur une base de 18,4 M€ exigerait plus de 7 % de rendement réel dès la première année, davantage ensuite.
    Nous encaissons 4,4 et versons 5,4 : c''est un problème de tarification, pas de placement. Chercher
    la solution du côté de l''actif est précisément la manière dont les mutuelles meurent.


    ---


    ## 4. Le chiffre que personne n''a produit — et qui commande tout le reste


    L''Union mutualiste de l''Atlantique n''a jamais repris un portefeuille dont la réserve représentait
    **moins de trois années de prestations**. Son comité d''engagement instruit en **12 à 18 mois**.


    Projection au statu quo, hypothèses littérales du dossier :


    | | Prestations | Réserve | **Réserve / prestations** |

    |---|---|---|---|

    | Aujourd''hui | 5,40 | 18,40 | **3,41** |

    | Année 1 | 5,63 | 17,50 | **3,11** |

    | Année 2 | 5,87 | 16,34 | **2,78** ❌ |

    | Année 3 | 6,13 | 14,91 | 2,43 |


    **Le critère d''éligibilité au transfert expire entre 12 et 24 mois.** L''instruction en demande 12
    à 18. Autrement dit : la fenêtre est ouverte aujourd''hui et ne le sera plus si nous délibérons encore
    deux conseils. Si le comité statue sur la situation au moment de sa décision — hypothèse prudente
    à confirmer auprès de l''Union — le dossier doit partir **ce trimestre** pour arriver à temps.


    C''est la seule option de ce dossier qui possède une date d''expiration. Ce n''est ni A, ni B, ni
    C.


    Et c''est la raison décisive de refuser C, au-delà même de la trésorerie : **immobiliser 78 % de la
    réserve dans un actif non coté et bloqué sept ans rend le portefeuille inéligible au transfert dès
    la signature.** C ne fait pas que risquer la caisse — elle referme la seule sortie ordonnée dont nous
    disposons.


    *Réserve méthodologique, à trancher avant jeudi :* avec les hypothèses écrites du dossier (cotisations
    **plates** à 4,4 M€), je franchis le seuil de 11 M€ **en année 5-6**, pas en neuf ans. L''écart avec
    la projection interne implique des hypothèses non explicitées (indexation des cotisations ?). Le conseil
    ne peut pas voter sur une projection dont le calendrier varie du simple au double. Je demande que
    l''actuaire la reprenne et la documente.


    ---


    ## 5. Ce sur quoi j''engage la caisse


    Je soumets cinq résolutions jeudi.


    **R1 — Rejet de C**, et adoption d''une politique de placement opposable : aucune contrepartie non
    souveraine au-delà de **5 %** de la réserve ; aucun instrument non liquidable sous 30 jours au-delà
    de **10 %** ; **plancher de liquidité de 24 mois de décaissement net** en instruments réalisables
    sous 5 jours ouvrés. La note du trésorier et la présente note sont annexées au procès-verbal.


    **R2 — Ouverture immédiate du dossier auprès de l''Union mutualiste de l''Atlantique.** Mandat au
    directeur, premier contact sous 15 jours, dossier complet sous 90 jours. C''est la résolution la plus
    importante des cinq.


    **R3 — B redimensionnée à 3 M€** (≈ 16 % de la réserve), en instruments cotés valorisés quotidiennement.
    Motif retenu : liquidité et réversibilité, non rendement. Le calibrage à 7,4 M€ est incompatible avec
    R2 — un décile bas à −35 % ramènerait la réserve à 15,8 M€ et ferait passer le ratio sous 3,0, c''est-à-dire
    hors critère du transfert, pendant l''instruction.


    **R4 — Convocation d''une AG extraordinaire sur les cotisations**, dossier commun avec R2. Les +6
    % rejetés en 2024 (≈ 0,26 M€) n''auraient de toute façon pas comblé l''écart ; il faut présenter le
    besoin réel et l''alternative réelle. Les affiliés ont le droit de choisir entre cotiser davantage
    et perdre leur couverture — ils n''ont pas eu ce choix en 2024, on leur a soumis un pourcentage sans
    le scénario.


    **R5 — Revue du régime de prestations** par l''actuaire, avec instruction explicite : quantifier avant
    d''arbitrer. Je précise ma position — sur une population amiante non réassurable, réduire les garanties
    est un transfert de risque vers les affiliés, pas une économie. Cela reste sur la table, en dernier
    rang, et documenté comme tel.


    ---


    ## 6. Conditions d''arrêt et ce qui me ferait changer d''avis


    Suivi trimestriel de deux indicateurs, avec déclenchement automatique :


    - **Ratio réserve / prestations annuelles.** Passage sous 3,0 → convocation d''un conseil extraordinaire
    sous 30 jours.

    - **Couverture de liquidité** (mois de décaissement net couverts). Passage sous 24 mois → gel de tout
    engagement nouveau.


    Ce qui reviendrait sur mon avis :


    - Sur **C** : rien dans le dossier actuel. Un instrument à échéance longue redeviendrait discutable
    seulement s''il était coté, à contrepartie multiple, sorti à tout moment, et plafonné à 10 % — c''est-à-dire
    un autre instrument que celui-ci.

    - Sur **la stratégie** : si l''Union décline formellement, la question du budget de risque se rouvre
    — mais devant l''AG, avec les affiliés informés que la caisse joue alors sa survie sur les marchés
    faute de repreneur. Pas au conseil, et pas en catimini.


    ---


    **Ce sur quoi je m''engage devant vous :** que la caisse reste, à chaque trimestre des dix-huit prochains
    mois, en état de payer ses prestations et en état d''être reprise. Aucune des deux conditions ne survit
    à l''option C. La question de jeudi n''est pas de savoir combien nous rapporte la réserve — c''est
    de savoir si nous utilisons la fenêtre de transfert pendant qu''elle est encore ouverte.


    ---


    *Points à faire confirmer par écrit avant la séance : (i) qualification statutaire d''un actif non
    coté dans le calcul de la réserve au regard du seuil de 11 M€ — commissaire aux comptes ; (ii) conformité
    de C aux règles de dispersion et au principe de la personne prudente — actuaire et conseil juridique
    ; (iii) date d''appréciation du ratio par le comité d''engagement de l''Union ; (iv) reprise de la
    projection à neuf ans. Je ne suis ni actuaire ni juriste : ces quatre points sont des hypothèses de
    ma part, pas des conclusions.*

    '
