response:
  text: '# Note au comité de direction — Plan d''économies du DAF


    **Objet :** avis sur les volets A et B ; continuité de l''accréditation ISO 17025

    **Date :** séance de lundi


    ---


    ## 1. Verdict


    **Je retiens le volet A en totalité. J''écarte le retour de Ferrand en production avec supervision
    réduite de Vidal, dans les deux variantes, 55 h et 70 h. J''écarte le gel du poste de second apprenti
    signataire.**


    La phrase centrale de la note du DAF — « l''accréditation n''est pas concernée : trois signataires
    restent en poste jusqu''à M14 et Vidal sera agréée d''ici là » — est fausse. Elle est fausse non pas
    par excès de prudence de ma part, mais par l''arithmétique des chiffres contenus dans la note elle-même.
    Sous le volet B tel qu''écrit, **Vidal n''est pas agréée d''ici M14. Elle ne l''est pas non plus d''ici
    M20.**


    ---


    ## 2. Le fait déterminant : le calcul d''agrément de Salomé Vidal


    Le référentiel, tel que cité dans la note : vingt-quatre mois de pratique supervisée à 100 h/mois
    au moins **sous un même signataire** ; un mois sous 100 h compte au prorata ; **tout changement de
    superviseur ramène l''exigence à douze mois sous le nouveau** ; l''agrément est prononcé huit semaines
    après la dernière heure.


    Vidal a six mois de pratique restants, sous Ferrand. Ferrand part fin M8. La fenêtre de supervision
    disponible est donc de **huit mois, M1 à M8, et elle ne se rouvre pas.**


    | Supervision | Crédit / mois | Mois nécessaires | Mois disponibles | Résultat |

    |---|---|---|---|---|

    | 120 h (situation actuelle) | 1,00 | 6,0 | 8 | Dernière heure fin M6 → **agrément fin M8**. Marge
    : 2 mois |

    | 100 h (plancher du référentiel) | 1,00 | 6,0 | 8 | Identique. Marge : 2 mois |

    | 75 h | 0,75 | 8,0 | 8 | Limite exacte, marge nulle |

    | **70 h (variante proposée)** | 0,70 | **8,6** | 8 | **Échec — il manque 0,6 mois** |

    | **55 h (plan B)** | 0,55 | **10,9** | 8 | **Échec — il manque 1,6 mois** |


    La variante à 70 h a l''apparence d''un compromis raisonnable. Elle ne l''est pas : elle échoue, de
    peu, mais elle échoue. Le seuil de bascule se situe à 75 h/mois, sans aucune marge. **Toute supervision
    inférieure à 100 h/mois expose le laboratoire à un échec dont il ne se relève pas.**


    Ce calcul est robuste aux deux lectures possibles du prorata. Si l''on compte en mois (55 h = 0,55
    mois), il manque 1,6 mois. Si l''on compte en heures (600 h restantes, soit 24 × 100 h moins l''acquis),
    8 × 55 = 440 h, il manque 160 h. À 70 h : 560 h contre 600 requises. **Les deux lectures donnent le
    même verdict.**


    ### La cascade, si le volet B est appliqué


    1. Ferrand part fin M8. Vidal n''a pas complété. **Changement de superviseur → l''exigence est ramenée
    à douze mois sous Bouchard ou Nseka.**

    2. Reprise à M9, achèvement fin M20, agrément prononcé **vers M22**.

    3. Marchand part fin M14. À compter de M15 : **Bouchard et Nseka, soit deux signataires agréés.**
    Sous le plancher de trois.

    4. **Suspension par l''organisme sous trente jours, soit vers M16.**

    5. Le retour passe par une accréditation initiale. Le dossier n''est recevable qu''avec trois signataires
    agréés en poste — c''est-à-dire pas avant l''agrément de Vidal, **M22**. Puis quatorze à vingt mois
    d''instruction. **Accréditation rétablie entre M36 et M42.**

    6. Pendant vingt à vingt-six mois, le laboratoire fonctionne sur **13 % de son chiffre d''affaires**,
    tout en devant financer 340 k€.


    Avec 780 k€ de trésorerie et aucun découvert supplémentaire accordé par la banque en janvier, le laboratoire
    ne franchit pas cette période. Ce n''est pas un mauvais scénario parmi d''autres : c''est une branche
    de perte irrécupérable, et elle est atteinte par le simple déroulement du calendrier, sans qu''aucun
    aléa ne soit nécessaire.


    ---


    ## 3. Ce que « réversible en trente jours » ne couvre pas


    Le DAF écrit qu''aucune mesure n''est irréversible et que chacune peut être rétablie en trente jours
    si la trésorerie remonte. C''est exact pour onze mesures sur douze. Ce sont des lignes budgétaires
    : on les rouvre.


    La douzième consomme une ressource qui ne se reconstitue pas. **Les mois de présence de Ferrand sont
    un stock qui s''épuise et qui ne se rachète pas.** Rétablir 120 h de supervision en M9 ne produit
    rien, parce qu''il n''y a plus personne pour superviser. La mesure est réversible ; son effet ne l''est
    pas. Et la règle du changement de superviseur rend la perte non proportionnelle : on ne perd pas les
    mois sacrifiés, **on repart à douze.**


    La fenêtre réelle de rétablissement n''est donc pas de trente jours. Elle se ferme à une date fixe
    :


    - Variante 55 h : le retour à 120 h doit intervenir **au plus tard fin M4**. Au-delà, même en supervisant
    à plein régime jusqu''au départ de Ferrand, le compte n''y est plus.

    - Variante 70 h : au plus tard **fin M6**, et alors sans aucune marge sur la date de départ de Ferrand.


    Si le comité veut malgré tout tester le volet B, il doit savoir qu''il s''engage sur une décision
    dont la clause de retour expire à M4, et non à trente jours — et que le déclencheur de ce retour,
    la remontée de trésorerie, est précisément ce qu''on ne saura pas observer avant M6.


    ---


    ## 4. Ce que vaut l''étude des neuf laboratoires


    Le cabinet rapporte que sept laboratoires sur neuf ont appliqué un plan équivalent sans perdre leur
    accréditation. Trois remarques.


    D''abord, l''échantillon. Neuf cas, sélection non décrite. Un laboratoire ayant perdu son accréditation
    puis fermé ne figure pas dans un panel constitué aujourd''hui. Le taux observé est plausiblement optimiste.


    Ensuite, la portée. « Plan équivalent » n''est pas défini. Un plan qui arrête les salons et sous-loue
    240 m² est équivalent au nôtre sur le volet A. Il n''y a aucune raison de penser que sept laboratoires
    ont, comme nous, réduit la supervision de leur unique signataire en formation sous un superviseur
    démissionnaire à huit mois de son départ. La contrainte qui nous lie n''est pas le plan, c''est notre
    pyramide de signataires.


    Enfin, et c''est le point décisif : **2 sur 9, soit 22 %, ce serait déjà un taux d''échec inacceptable
    pour un événement de cette nature.** Mais la question ne se pose même pas en ces termes. Chez nous,
    l''échec n''a pas une probabilité de 22 %. Il découle du calcul du paragraphe 2. **Une fréquence de
    base ne corrige pas une arithmétique.** L''étude répond à une autre question que la nôtre.


    La cosignature de cinq membres sur sept ne modifie rien à ce calcul. Elle mesure l''accord du comité,
    pas la position de l''organisme d''accréditation — **qui est le seul à pouvoir se prononcer, et à
    qui la question n''a pas été posée.** Je recommande par ailleurs que l''objection des deux membres
    non signataires soit consignée au procès-verbal avec une date de réexamen, plutôt que refermée par
    une majorité.


    ---


    ## 5. Ce que je retiens


    **Volet A, intégralement — 24 k€/mois.** Arrêt des salons, report de la migration ERP, sous-location
    de 240 m², fin de l''intérim en préparation d''échantillons. Aucune de ces mesures ne touche la chaîne
    des signataires. Elles sont réversibles au sens propre.


    *Réserve sur l''intérim.* La perte historique de 4 % porte sur le chiffre non accrédité, soit 13 %
    du total : elle est donc bornée à **0,5 % du chiffre d''affaires**, ce qui ne peut pas annuler 24
    k€/mois. Je retiens la mesure. Mais les délais de 9 à 14 jours frappent la préparation d''échantillons,
    qui est en amont de **toute** l''activité, y compris des 87 % accrédités soumis à des échéances clients.
    L''historique dit que la perte s''est concentrée sur le non-accrédité ; il ne garantit pas que cela
    tiendra à ce niveau de charge. Je pose un déclencheur explicite au § 8.


    **Du volet B, je retiens sous condition :** le non-remplacement du technicien, et l''internalisation
    de la maintenance métrologie **limitée aux équipements hors périmètre accrédité**. Pour le périmètre
    accrédité, l''internalisation n''est acceptable que si l''on peut produire, avant la bascule, les
    preuves de compétence, les raccordements aux étalons et les budgets d''incertitude que l''organisme
    exigera au prochain audit. Internaliser la métrologie tout en ne remplaçant pas un technicien est
    exactement la combinaison qui produit une non-conformité majeure. **Ne pas faire les deux en même
    temps sur le périmètre accrédité.**


    ---


    ## 6. Ce que j''écarte


    **Le retour de Ferrand en production avec supervision réduite, à 55 h comme à 70 h.** Motif : § 2.
    La supervision de Vidal reste à 120 h/mois, et à défaut jamais sous 100 h, jusqu''à la fin de sa pratique
    — soit fin M6 au rythme actuel.


    **Le gel du poste de second apprenti signataire.** C''est la mesure la plus coûteuse du plan, et la
    note la présente comme la plus anodine. Trois raisons :


    - À compter de M15, une fois Marchand parti, l''effectif agréé sera de **exactement trois** — Bouchard,
    Nseka, Vidal — et le restera. Une démission, un arrêt maladie prolongé, un différend : suspension.
    Le laboratoire vivra en permanence sur le plancher réglementaire, sans aucun tampon.

    - C''est la seule filière vers un cinquième signataire.

    - C''est la condition des contrats-cadres à 41 k€/mois (§ 7).


    Le gel économise le coût d''un apprenti. Il coûte la résilience de l''accréditation et 41 k€/mois
    de chiffre d''affaires. **Je propose l''inverse : ouvrir le poste sans délai.**


    ---


    ## 7. Les contrats-cadres à 41 k€/mois


    Ils exigent deux signataires dédiés en supplément de l''activité courante, à partir de M9.


    - **M9 à M14 :** quatre signataires en poste (Marchand, Bouchard, Nseka, Vidal). Servable.

    - **À partir de M15 :** trois. On ne dédie pas deux signataires sur trois. **Non servable.**


    Un apprenti recruté aujourd''hui sous Bouchard ou Nseka serait agréé vers M26 — trop tard pour couvrir
    M15, mais nécessaire pour la suite. Le seul levier qui couvre M15 est le **recrutement externe d''un
    signataire déjà agréé**, et son délai de recherche impose de commencer maintenant.


    Cela dépend d''une question à laquelle la note ne répond pas et que je ne tranche pas ici : **l''agrément
    d''un signataire recruté à l''extérieur est-il reconnu immédiatement dans notre organisme, ou faut-il
    une période sous notre propre périmètre ?** Toute la couverture de M15 et les deux contrats en dépendent.
    Cette question se pose à l''organisme, par écrit, cette semaine — c''est une information peu coûteuse
    à acquérir et qui commande le reste du plan.


    **Je n''engage donc pas la signature des contrats en l''état.** J''engage l''ouverture de la négociation
    avec une clause de capacité : démarrage en M9, et engagement de volume au-delà de M14 conditionné
    au recrutement effectif d''un signataire agréé. Signer sans cette clause, c''est promettre une prestation
    accréditée que nous ne pourrons pas produire à partir de M15, avec les pénalités correspondantes.


    ---


    ## 8. Trésorerie : pourquoi il n''y a pas d''urgence à appliquer le volet B en M1


    C''est le point qui rend la décision confortable, et il manque à la note du DAF.


    - Sans aucune mesure : 780 / 61 = **12,8 mois** d''autonomie.

    - Volet A seul : déficit ramené à 37 k€/mois, soit **21 mois** d''autonomie.

    - Volet A + les deux mesures conditionnelles du volet B : au-delà de 25 mois.

    - Volet A seul + contrats à partir de M9 : 296 k€ consommés sur M1–M8, 484 k€ restants, puis un solde
    mensuel légèrement positif. Avec les mesures conditionnelles, nettement positif.


    Le volet A seul porte le laboratoire **bien au-delà de M14**. Il n''existe donc aucune contrainte
    de liquidité obligeant à trancher le volet B en M1. Le comité peut se donner un point de décision
    en M6, avec en main l''agrément de Vidal en cours d''instruction, la réponse écrite de l''organisme
    et l''état de la négociation client. Le plan du DAF échange 26 k€/mois — dont il ne reste, après retrait
    des mesures dangereuses, qu''une fraction — contre les 41 k€/mois qui referment réellement le déficit.


    ---


    ## 9. Ce sur quoi j''engage le laboratoire


    | # | Action | Échéance | Porteur |

    |---|---|---|---|

    | 1 | **Question écrite à l''organisme d''accréditation** : effet exact du prorata sous 100 h ; application
    de la règle de changement de superviseur en cas de départ subi ; reconnaissance de l''agrément d''un
    signataire recruté à l''extérieur. Aucune mesure du volet B n''est mise en œuvre avant réponse. |
    Cette semaine | Direction qualité |

    | 2 | Application du volet A, avec la réserve du § 5 sur la préparation d''échantillons | M1 | DAF
    |

    | 3 | Supervision de Vidal maintenue à 120 h/mois, plancher absolu 100 h, jusqu''à la dernière heure
    requise (fin M6 au rythme actuel) | M1 → M6 | Direction technique |

    | 4 | Accord écrit avec Ferrand : engagement de supervision jusqu''à la fin de la pratique de Vidal,
    contre une contrepartie réelle — prime d''achèvement versée à M8 et conditionnée à la complétude du
    dossier, et proposition de mission de conseil après son départ. Un salarié démissionnaire n''a aucune
    raison structurelle de porter le point critique du laboratoire ; il faut lui en donner une. | M1 |
    Direction générale |

    | 5 | Sécurisation de Vidal : son agrément devient le chemin critique de l''entreprise. Engagement
    contractuel réciproque, et information transparente sur la place qui lui est faite. Même démarche
    vis-à-vis de Bouchard et Nseka, qui deviennent irremplaçables à partir de M15. | M1 | Direction générale
    |

    | 6 | Ouverture du poste de second apprenti signataire (mesure inversée) et lancement d''une recherche
    de signataire agréé externe | M1 | RH |

    | 7 | Négociation des contrats-cadres avec clause de capacité au-delà de M14 | M1 → M3 | Direction
    commerciale |

    | 8 | Décision de réexamen du volet B résiduel, avec les réponses en main | M6 | Comité |

    | 9 | Ventilation détaillée des 26 k€ du volet B, mesure par mesure — elle manque et empêche d''arbitrer
    les lignes conditionnelles | Avant lundi | DAF |


    ---


    ## 10. Repli et déclencheurs observables


    - **Si l''organisme confirme la lecture du § 2 et refuse la reconnaissance d''un agrément externe
    :** le plancher de trois à partir de M15 n''est tenable que si Vidal est agréée. Aucune mesure ne
    doit alors toucher ni sa supervision, ni Bouchard, ni Nseka, à aucun moment. Les contrats-cadres sont
    renégociés en volume compatible avec trois signataires.

    - **Si Ferrand refuse l''engagement de supervision, ou avance son départ :** situation critique immédiate.
    Recherche d''un signataire agréé externe en urgence, et saisine de l''organisme sur les conditions
    d''un transfert de supervision avant la fin des six mois — le seul cas où la règle des douze mois
    peut peut-être être bornée. Aucune mesure d''économie supplémentaire tant que ce point n''est pas
    résolu.

    - **Si les délais de livraison sur périmètre accrédité dépassent le délai contractuel, ou dès la première
    réclamation d''un client accrédité :** rétablissement immédiat de l''intérim en préparation d''échantillons.
    Coût de l''erreur : quelques milliers d''euros par mois. Coût de l''inaction : les 87 %.

    - **Si la trésorerie passe sous 400 k€ avant M9 :** réexamen d''ensemble, y compris de mesures que
    je n''ai pas retenues ici — mais jamais la supervision de Vidal, qui reste hors périmètre d''arbitrage
    jusqu''à son agrément.

    - **Si l''agrément de Vidal n''est pas prononcé à M9 :** déclenchement du plan de recrutement externe
    en urgence, et information immédiate de l''organisme. Ne pas attendre M14.


    ---


    ## 11. Ce qui renverserait cette position


    Une réponse écrite de l''organisme établissant l''un des points suivants :


    - que le prorata s''applique différemment de la lecture du § 2 ;

    - que le changement de superviseur imposé par un départ ne ramène pas l''exigence à douze mois ;

    - qu''un signataire agréé recruté à l''extérieur compte immédiatement dans le plancher de trois.


    Le troisième point ne réhabiliterait pas pour autant la réduction de supervision : il fournirait un
    filet, pas une raison de retirer le filet actuel. Les deux premiers, eux, rouvriraient l''arbitrage
    sur la variante à 70 h. C''est pour cela que la question est l''action n° 1 et qu''aucune mesure du
    volet B n''est engagée avant la réponse.


    ---


    ## 12. Hypothèses et chiffres manquants


    À faire figurer au procès-verbal, pour que la décision soit relisable :


    - **Chiffre d''affaires mensuel absent de la note.** La ligne « 4 % du chiffre non accrédité » ne
    peut pas être chiffrée en euros. Elle est bornée à 0,5 % du total, ce qui suffit à trancher, mais
    le montant doit être produit.

    - **Ventilation des 26 k€ du volet B non fournie.** L''arbitrage sur le technicien et la métrologie
    est rendu sous cette réserve.

    - **Trésorerie supposée intégralement disponible.** Si une part des 780 k€ est nantie ou affectée,
    les autonomies du § 8 sont à recalculer.

    - **Coût complet d''un signataire non fourni**, donc marge nette des contrats-cadres non chiffrée.
    À 41 k€/mois de recette, elle est très probablement franchement positive, mais ce n''est pas établi.

    - **Lecture du prorata en mois** retenue comme hypothèse de travail, la lecture en heures donnant
    le même verdict. Confirmation attendue de l''organisme.

    - Les mois M1 à M22 sont comptés à partir de la mise en œuvre du plan ; les huit semaines de délai
    d''agrément sont arrondies à deux mois.


    ---


    **En un mot.** Le plan du DAF économise 26 k€/mois sur un volet dont une seule ligne, présentée comme
    réversible, détruit l''accréditation qui porte 87 % du chiffre d''affaires — et il gèle en même temps
    la mesure qui aurait rapporté 41 k€/mois. Le volet A suffit à tenir vingt-et-un mois. Il n''y a rien
    à gagner à trancher le volet B en janvier, et tout à perdre.

    '
