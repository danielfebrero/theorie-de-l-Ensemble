response:
  text: '## Note au conseil — séance du jeudi


    **Objet :** affectation de l''enveloppe unique de 900 000 €, dossiers A (parc d''usinage) et B (succession
    direction qualité)


    ---


    ### 1. Ce que nous proposons de décider


    | Ligne | Montant | Ce que l''engagement achète | Base du chiffre | Reportable ? |

    |---|---|---|---|---|

    | **A — Parc complet, 6 machines** | 620 000 € | ~56 000 €/an de coûts d''arrêt supprimés ; rebut
    de 4,1 % → 1,2 % ; disponibilité 96 % garantie 7 ans sous pénalités | 5 ans de maintenance horodatée
    et auditée | Oui, mais pas de budget avant 12 mois |

    | **B — Promotion de l''adjointe, effet immédiat** | 45 000 € | Le poste est tenu pendant les 11 mois
    de recouvrement, pas après | Aucune base chiffrable — voir §3 | **Non.** Fenêtre close dans 11 mois
    |

    | **B — Mission de transition du partant, 12 mois** | 90 000 € | Transfert de l''organisme notifié,
    des 9 auditeurs, des 2 clients (31 % du CA) | Aucune base chiffrable — voir §3 | **Non** |

    | Mise en service, outillage, formation sur les 6 machines | ~90 000 € | Condition pour que la ligne
    A produise son rendement | Devis à obtenir avant engagement | — |

    | Accompagnement réglementaire du changement d''interlocuteur | ~55 000 € | Sécurise l''acceptation
    de la remplaçante par l''organisme notifié | Devis à obtenir avant engagement | — |

    | *B — Recrutement externe* | *280 000 €* | *Non retenu : plus cher, et plus lent sur la seule horloge
    qui compte* | — | — |

    | **Total** | **900 000 €** | | | |


    **Sur le tableau unique demandé.** Nous le fournissons, mais avec une colonne de rendement vide sur
    le dossier B, et c''est délibéré. Le dossier A a un dénominateur : cinq ans de relevés horodatés et
    audités. Le dossier B n''en a aucun — l''entreprise n''a jamais changé de directeur qualité. Le seul
    chiffre en euros disponible sur B (1,47 M€ de perte attendue) ne provient pas d''une mesure ; il est
    le produit de deux estimations d''atelier. Placé dans la même colonne que les 56 000 €/an de la ligne
    A, il classerait mécaniquement B en tête sur la foi de son ordre de grandeur, pas de sa solidité.
    Le conseil lirait alors un classement de la précision apparente, pas de la valeur. **Le bon critère
    de tri entre les deux dossiers n''est pas le rendement : c''est la dernière colonne.** Le dossier
    A peut attendre douze mois au prix de douze mois de pannes. Le dossier B ne peut pas attendre : dans
    onze mois l''homme est parti et le transfert n''est plus possible, à aucun prix.


    ### 2. Dossier A — décision : parc complet, 620 000 €


    Le calcul auditable, sur cinq ans : 213 000 € de coût direct d''immobilisation, soit 42 600 €/an ;
    plus 1 810 heures d''arrêt à 38 € de marge, soit 13 756 €/an. Total **56 356 €/an**, environ 394 000
    € sur les sept ans de garantie. Le gain de rebut s''y ajoute : 2,9 points récupérés valent environ
    **1 100 € par tranche de 1 000 heures produites** — l''atelier convertira en une minute avec ses heures
    annuelles.


    Disons-le franchement : sur ces seuls flux, le parc ne se rembourse pas en sept ans. Il se rembourse
    sur la durée de vie des machines. Trois éléments emportent quand même la décision, et aucun n''est
    un rendement : la moyenne sur cinq ans **sous-estime** l''année en cours, puisqu''un parc de 14 ans
    se dégrade ; la garantie de 96 % sur 7 ans avec pénalités transforme un aléa que nous portons aujourd''hui
    en engagement que le fournisseur porte demain ; et surtout, l''argent non engagé cet exercice est
    perdu. Face à zéro, le seuil de rentabilité n''est plus un taux à battre, c''est zéro. C''est aussi
    la raison pour laquelle nous ne recommandons **pas** le tranchage : il n''économise rien, il abandonne.


    ### 3. Dossier B — décision : promotion immédiate + mission de transition, 135 000 €


    Les trois pistes RH sont présentées comme exclusives. Elles ne le sont pas. Nous en retenons deux,
    parce qu''elles font deux choses différentes : la promotion **tient le poste**, la mission de transition
    **transfère ce qui ne s''écrit pas**. Ensemble : 11 mois de recouvrement puis 12 mois d''accompagnement,
    soit 23 mois de couverture pour 135 000 €.


    Deux conditions, à porter à l''ordre du jour :

    - **La nomination doit être prononcée maintenant**, pas au onzième mois. Elle n''a de valeur que pendant
    qu''il est encore là.

    - **La mission de transition doit être un contrat à livrables nommés**, pas une mise à disposition
    : présentation à l''organisme notifié lors du prochain audit, visites conjointes des deux clients
    hospitaliers avant son départ, requalification documentée des 9 auditeurs, inventaire des dossiers.
    Sans livrables, on achète une disponibilité, pas un transfert.

    - **À vérifier avant jeudi** (fait bloquant, pas jugement) : l''adjointe, 3 ans d''ancienneté, satisfait-elle
    aux critères d''expérience exigés pour la personne chargée du respect de la réglementation ? Si non,
    le montage change. Un appel à l''organisme notifié suffit.


    **Sur la cotation du cabinet RH.** 35 % de probabilité, 4,2 M€, criticité 7,5 sur 10 : ces nombres
    ont été produits en atelier par trois consultants n''ayant jamais travaillé dans le dispositif médical,
    en discussion commune — donc sans indépendance des avis. Une note sur 10 ne s''additionne pas à des
    euros. Nous ne l''utilisons pas comme donnée d''entrée. Nous n''en avons pas besoin : **la décision
    tient quelle que soit la probabilité retenue.** Même à 5 % au lieu de 35 %, l''exposition attendue
    dépasse 200 000 €, contre 135 000 € engagés. Une décision qui ne change pas quand le chiffre contesté
    varie d''un facteur sept n''a pas à attendre que le chiffre soit tranché.


    ### 4. Ce qui est demandé au conseil jeudi


    1. Engager 620 000 € sur le parc complet, avec la garantie 96 %/7 ans et ses pénalités.

    2. Prononcer la nomination de l''adjointe **avec effet immédiat** (45 000 €) et mandater la direction
    pour signer la mission de transition à livrables (90 000 €).

    3. Autoriser l''engagement du solde de 145 000 € sur mise en service et accompagnement réglementaire,
    sur devis, **avant clôture** — ces deux lignes sont des estimations ; si les devis rentrent en dessous,
    le reliquat doit être réaffecté (extension de la mission, formation de l''adjointe) et non laissé,
    sous peine d''être perdu.

    '
