response:
  text: 'L''écriture de fichiers n''a pas été autorisée — voici les deux documents directement.


    ---


    # Ce que révèle le dossier avant toute rédaction


    Trois observations commandent tout le reste.


    **1. La fenêtre litigieuse est chez nous, pas sur la route.** Le portique (P3) date la sortie à 11
    h 12 ; l''enregistreur (P5) démarre à 9 h 05. La sortie est donc **postérieure de 2 h 07** à la première
    donnée. Le véhicule chargé est resté **4 h 47** sur le site, et les **2 h 40** non documentées (6
    h 25 → 9 h 05) s''y sont entièrement déroulées. Le trajet, lui, est intégralement couvert par des
    relevés conformes. Aucune stratégie de report sur le transport n''est disponible.


    **2. Le contrat n''est pas au dossier.** Le 0–4 °C, le seuil 10⁵, le délai de huit jours, la pénalité
    de plein droit : tout cela est affirmé par les deux parties et établi par aucune pièce. C''est exactement
    le motif de renvoi que l''assureur applique. Pièce à verser en premier.


    **3. P5 est ambiguë, et l''ambiguïté vaut cher.** « Groupe froid sous tension à partir de 9 h 05 […]
    l''appareil était hors tension » — selon que « l''appareil » désigne l''enregistreur ou le groupe
    froid, le manquement est **documentaire** ou **thermique**. Un indice objectif tranche : les relevés
    sont **entre 2,9 et 3,6 °C dès la mise sous tension**. Une caisse réchauffée 2 h 40 montrerait une
    courbe de descente en température sur les premières minutes. Son absence prouverait que la caisse
    était restée froide. **Cela se lit sur l''extraction brute du fichier** — c''est la pièce la plus
    rentable du dossier, et personne ne l''a demandée.


    ---


    # NOTE DE POSITION — LOT F-2418

    *Destinataires : assureur, direction, conseil. **Ne pas transmettre au client.***


    ## Chronologie établie par pièces — 3 juin


    | Heure | Fait | Pièce |

    |---|---|---|

    | 6 h 25 | Fin de chargement, produit à 3 °C | P1 |

    | 6 h 40 | Mention manuscrite « départ » sur le BL | P2 — **contredite** |

    | 9 h 05 | Première donnée de l''enregistreur ; rien avant | P5 |

    | 9 h 05 → 12 h 55 | Relevés entre 2,9 et 3,6 °C | P5 |

    | 11 h 12 | Sortie du véhicule (horodatage automatique, sortie unique du jour) | P3 |

    | 12 h 55 | Arrivée au dépôt, 1 792 barquettes | P4 |


    Durées : **2 h 40** sans enregistrement — **4 h 47** de stationnement chargé sur site — **1 h 43**
    de route — **6 h 30** du quai à la réception. Écart de quantité : **48 barquettes**, inexpliqué par
    aucune pièce (P6 mentionne 3 unités analysées sans dire si elles sont prises sur les 1 792 ou en sus).


    ## Ce que l''entreprise reconnaît


    1. **Le chargement** : 1 840 barquettes, fin à 6 h 25, produit à 3 °C (P1, P2).

    2. **Le stationnement de 4 h 47** sur site après chargement (P1 + P3), justifié par aucune pièce,
    relevant de notre organisation.

    3. **L''absence d''enregistrement sur 2 h 40** (P5). Nous ne pouvons pas documenter le respect de
    la plage 0–4 °C sur cette fenêtre. Si le contrat impose un enregistrement continu, ce seul défaut
    fonde le refus, quelle qu''ait été la température réelle.

    4. **Le refus du lot n''est pas abusif en soi.** Nous n''attaquons pas le principe ; nous attaquons
    le chiffrage.

    5. **Le résultat de P6 tel que rapporté.** En prendre acte n''est ni en admettre la valeur probante,
    ni en admettre la cause.

    6. **L''écart de 48 barquettes est réel.** S''il correspond à une quantité non chargée, il emporte
    **un avoir de notre part**, que nous émettrons spontanément.

    7. **Une défaillance de procédure interne est acquise** — thermique ou documentaire, un véhicule chargé
    de frais quittant le quai sans chaîne d''enregistrement active est un manquement à notre plan de maîtrise
    sanitaire.


    ## Ce que l''entreprise conteste


    **La qualification de rupture du froid sur les 2 h 40.** Point non tranché (voir observation 3 ci-dessus).
    Nous ne concédons qu''un **défaut d''enregistrement** et réservons expressément la rupture effective
    jusqu''à l''extraction brute. À noter : l''enregistreur mesure une ambiance, pas une température à
    cœur — aucune pièce n''établit de température à cœur après 6 h 25.


    **Le montant de 21 400 €, en totalité, faute de décompte.** Ni ventilation, ni valeur unitaire, ni
    base quantitative, ni justificatif de transport. L''assureur ne peut ni provisionner ni garantir en
    l''état.


    **La valeur probante de P6.** Trois barquettes sur 1 840, laboratoire mandaté unilatéralement, et
    rien n''établit la date du prélèvement, son procès-verbal, la chaîne de conservation, la méthode,
    l''accréditation, l''existence d''échantillons témoins, ni notre convocation.


    **L''imputation, faute de point de départ connu.** Une croissance microbienne se démontre par un différentiel,
    pas par une valeur isolée. Rien n''établit la flore initiale du lot, ni les conditions de stockage
    **au dépôt entre 12 h 55 et le prélèvement**. Les deux bornes manquent.


    **La destruction.** Aucune pièce ne l''établit. Si elle est intervenue sans expertise contradictoire
    et sans conservation de témoins, elle nous a privés de tout moyen de vérification et affaiblit d''autant
    P6. Moyen réservé.


    **La pénalité de rupture d''assortiment** — notre principal gisement en valeur. Clause non produite,
    base de calcul inconnue, réalité et durée de la rupture non établies, diligences de substitution du
    dépôt inconnues. Une pénalité manifestement excessive au regard du préjudice réel est réductible par
    le juge (art. 1231-5 c. civ.).


    **La base quantitative.** Notre engagement éventuel ne peut excéder les **1 792 unités** que le dépôt
    reconnaît avoir reçues (P4).


    **Le point de départ des huit jours.** Aucune pièce n''établit la date de réception de la réclamation
    — or c''est elle qui fait courir le délai au terme duquel la pénalité serait acquise. À défaut de
    certitude, retenir la date la plus défavorable.


    ## Affirmations rattachées à aucune pièce — à n''invoquer nulle part


    Les stipulations contractuelles elles-mêmes (0–4 °C, 10⁵, huit jours, pénalité) · l''heure de 6 h
    40 · les propos du chauffeur — **P7 relate un appel téléphonique, ce n''est pas une pièce**, et le
    « parti tôt » est au demeurant contredit par P3 · la cause de l''absence d''alimentation · la météo
    du 3 juin · **l''employeur du chauffeur et la qualification du transport, compte propre ou sous-traitance**
    — lacune qui commande le régime de responsabilité et l''assureur mobilisable · la destruction · la
    composition des 21 400 € · la date de réception de la réclamation · la flore initiale et le stockage
    au dépôt après 12 h 55.


    ## Pièces à verser


    **Bloquant** — P8 contrat intégral et avenants · P9 réclamation + preuve de sa date de réception ·
    P10 contrat de transport ou attestation de compte propre, statut du chauffeur, attestations d''assurance.


    **Déterminant, la fenêtre** — P13 **extraction brute de l''enregistreur** + certificat d''étalonnage
    + notice du comportement à la mise sous tension · P14 horamètre et journal du groupe froid, carnet
    d''entretien · P11 et P12 attestations écrites du chauffeur et de l''opérateur de quai, forme de l''art.
    202 CPC, recueillies **séparément** · P23 export certifié du portique et vidéo de quai **avant expiration
    du cycle d''écrasement** · P17 bulletin Météo-France.


    **Déterminant, la microbiologie** — P15 **analyse de l''échantillothèque F-2418** en laboratoire accrédité,
    même méthode que P6 · P16 dossier de fabrication et autocontrôles libératoires · P18 rapport de laboratoire
    complet et PV de prélèvement du dépôt · P22 relevés de stockage du dépôt après 12 h 55.


    **Chiffrage** — P19 certificat de destruction · P20 décompte détaillé · P21 clause pénale et justificatifs
    de la rupture · P24 réconciliation de stock sur les 48 unités.


    ## Ce que l''entreprise engage sous huit jours


    *J+0 = date de réception de la réclamation (P9).*


    | | |

    |---|---|

    | **J+0** | Établir la date de réception. **Gel des preuves** par instruction écrite : fichier brut,
    journal du portique, originaux BL et fiche de quai, vidéo de quai, échantillothèque F-2418 et lots
    voisins |

    | **J+1** | **Déclaration de sinistre à l''assureur** avec la présente note et P1–P7 · verser le contrat
    · qualifier le transport et, si sous-traitance, **appel en garantie du transporteur** |

    | **J+2** | Attestations écrites chauffeur et opérateur de quai · extraction brute + horamètre, **analyse
    de la courbe des 30 premières minutes après 9 h 05** |

    | **J+3** | Mise en analyse de l''échantillothèque · **envoi de la réponse à Sodimarché**, LRAR +
    courriel. *Ne pas attendre J+7 : la preuve de l''envoi dans le délai est l''enjeu* |

    | **J+4** | Demande formelle : décompte, certificat de destruction, rapport complet, relevés de stockage,
    sort des témoins |

    | **J+5** | Réconciliation des 48 unités et **avoir spontané** si l''écart est à notre charge · proposition
    d''expertise amiable, à défaut référé art. 145 CPC |

    | **J+6** | **Revue sanitaire des autres lots du jour.** Si P15 révèle une non-conformité à l''origine
    : retrait et information DDPP (art. 19 règl. 178/2002). Si P15 est conforme, la conclusion établit
    que le produit était conforme au départ |

    | **J+7–8** | Vérification des AR, relances, point d''étape assureur |


    ## Posture financière


    Aucun montant proposable aujourd''hui : le décompte adverse n''existe pas. Une fois P20 obtenu — **marchandise**
    : poste le plus difficile à contester si le contrat impose l''enregistrement continu et si P13 montre
    une courbe de descente ; à provisionner sur **1 792 unités**, à la valeur d''achat contractuelle,
    non à la valeur de revente du dépôt. **Transport** : à admettre contre justificatif. **Pénalité**
    : à contester principalement.


    **Si P13 ne montre aucune courbe de descente et si P15 est conforme, la position bascule** : le manquement
    devient purement documentaire, le lien de causalité avec P6 n''est plus démontré, et la contestation
    peut porter sur la totalité. Ne rien proposer au client avant d''avoir ces deux pièces.


    ## Point d''intégrité — la mention « départ 6 h 40 »


    P2 est contredite par une écriture automatique horodatée (P3), qui ne relève **aucune autre sortie
    du véhicule ce jour-là**. Écart : 4 h 32.


    - **Nous n''invoquons pas et n''invoquerons pas l''heure de 6 h 40**, nulle part.

    - Le BL est communiqué **tel quel**, sans retouche, accompagné de P3 et de la mention de discordance.
    Le produire comme établissant un départ à 6 h 40 serait une déclaration inexacte à l''assureur, exposant
    la garantie à la nullité (art. L. 113-8 c. assur.) et aux clauses de déchéance. Le risque est sans
    commune mesure avec 21 400 €.

    - **Nous signalons la discordance à l''assureur nous-mêmes**, avant qu''il ne la trouve. Un dossier
    qui signale sa pièce faible est instruit ; un dossier dont on découvre la pièce faible est renvoyé.

    - L''origine de la mention s''éclaircit par P11 et P12, recueillies séparément et sans confrontation
    préalable. Rien n''établit à ce jour autre chose qu''une inscription anticipée — hypothèse, non affirmation.

    - La discordance nous sert par ailleurs : elle démontre que l''heure opposable est celle du portique,
    donc que la fenêtre litigieuse s''est déroulée **sur site**. Nous n''avons aucun intérêt à la dissimuler.


    ## Actions correctives


    Verrouillage du départ (pas de BL libéré sans enregistreur actif et consigne atteinte, contrôle matérialisé
    sur la fiche de quai) · **suppression des heures saisies à la main** sur les documents de transport,
    l''heure opposable devenant l''horodatage du portique reporté automatiquement · rapprochement automatique
    quai/portique avec alerte au-delà d''un délai à fixer · plafond formalisé de stationnement chargé,
    avec attente en enceinte réfrigérée au-delà · révision du volet « transport » du PMS · vérification
    de la durée de conservation de l''échantillothèque.


    ---


    # PROJET DE LETTRE À SODIMARCHÉ


    > **Note au relecteur, à supprimer avant envoi.** LRAR **et** courriel avec accusé de lecture, au
    plus tard J+3. Cette lettre ne reprend rien de la note interne : ni la fenêtre 6 h 25 – 9 h 05, ni
    la discordance du BL. Elle n''affirme rien de faux — elle conteste le chiffrage, réclame les pièces
    et propose le contradictoire. **Ne rien y ajouter qui reconnaisse une rupture du froid** : le point
    n''est pas tranché et une reconnaissance écrite ferait perdre tout terrain.


    **Objet : votre réclamation du [date] — lot F-2418, livraison du 3 juin — contestation et demande
    de pièces**


    Madame, Monsieur,


    Nous accusons réception de votre réclamation du [date], reçue le [date], par laquelle vous nous notifiez
    le refus du lot F-2418 et nous réclamez la somme de 21 400 €.


    La présente vaut **réponse écrite dans le délai contractuel de huit jours**. Nous vous prions d''en
    accuser réception.


    **Nous contestons la réclamation dans son principe comme dans son montant**, pour les motifs suivants
    et sous réserve des pièces demandées.


    **1. Sur le montant.** La somme nous est présentée globalement, sans décomposition ni justificatif
    ; nous ne pouvons en apprécier ni le bien-fondé ni l''exactitude. Merci de nous communiquer : le décompte
    détaillé ventilé entre marchandise, transport et pénalité, avec valeur unitaire et quantité par poste
    ; les justificatifs des frais de transport ; la stipulation fondant la pénalité de rupture d''assortiment,
    le détail de son calcul, les éléments établissant la réalité et la durée de la rupture, et les démarches
    entreprises pour y remédier par un approvisionnement de substitution. En l''absence de ces éléments,
    la réclamation est contestée en totalité.


    **2. Sur la quantité.** Notre BL porte sur 1 840 barquettes, votre bon de réception sur 1 792, soit
    un écart de **48 unités** que rien ne documente. Merci de nous adresser votre relevé de réception
    détaillé, palette par palette, et le procès-verbal éventuel établi à la réception. Nous procédons
    à la réconciliation de nos propres enregistrements et vous en communiquerons le résultat ; **si cet
    écart correspond à une quantité non livrée par nos soins, nous émettrons spontanément l''avoir correspondant.**
    En tout état de cause, votre réclamation ne saurait être assise sur une quantité supérieure aux 1
    792 unités que vous reconnaissez avoir reçues.


    **3. Sur l''analyse.** Nous prenons acte du résultat communiqué. Nous observons qu''il a été obtenu
    sur **trois barquettes** d''un lot de 1 840, par un laboratoire que vous avez seul mandaté, **sans
    que nous ayons été convoqués au prélèvement ni mis en mesure de faire procéder à une contre-analyse**.
    Merci de nous communiquer : le rapport complet avec méthode et accréditation ; le procès-verbal de
    prélèvement mentionnant date, heure, conditions et température de réception des échantillons ; le
    sort des **échantillons témoins** et, s''ils existent, leur mise à disposition immédiate ; les relevés
    de température et de manutention dans vos installations **entre l''arrivée à 12 h 55 le 3 juin et
    la date du prélèvement**. Ce dernier point est déterminant : un résultat microbiologique ne s''apprécie
    que par différence entre deux états connus. Nous faisons analyser nos échantillons conservés du lot
    par un laboratoire accrédité et vous en communiquerons les résultats.


    **4. Sur la destruction.** Aucun élément ne nous a été communiqué. Merci de nous adresser le certificat
    de destruction précisant date, quantité et opérateur. **Si la marchandise a été détruite sans expertise
    contradictoire préalable et sans conservation d''échantillons témoins, nous aurons été privés de tout
    moyen de vérification et entendons en tirer toutes conséquences.** Nous vous demandons de suspendre
    immédiatement toute destruction en cours et de conserver en l''état ce qui subsiste du lot.


    **5. Expertise contradictoire.** Nous vous proposons de désigner d''un commun accord un expert indépendant,
    chargé d''examiner contradictoirement les conditions de conservation du lot depuis sa fabrication
    jusqu''au prélèvement, ainsi que le chiffrage du préjudice allégué ; nous acceptons d''en partager
    les frais par moitié. Merci de nous faire connaître votre position sous quinze jours. À défaut d''accord,
    et compte tenu du caractère périssable et destructible des éléments de preuve, nous nous réservons
    de saisir la juridiction compétente sur le fondement de l''article 145 du code de procédure civile.


    **6. Réserves.** La présente réponse est adressée dans le délai contractuel et constitue une contestation
    formelle et motivée, faisant obstacle à l''acquisition de quelque pénalité que ce soit. Elle ne comporte
    **aucune reconnaissance de responsabilité**, ni sur le principe ni sur le montant, et est faite sous
    réserve de tous nos droits, moyens et actions, notamment à l''égard de tout tiers intervenu dans l''exécution
    de la livraison.


    Notre assureur est saisi du dossier. Nous souhaitons que ce différend trouve une issue préservant
    nos relations commerciales.


    *Pièces jointes : copie du BL n° 2418 — copie du bon de réception.*


    > **Note au relecteur.** Ne joindre que ces deux pièces. **Ne pas joindre** la fiche de quai, le relevé
    de l''enregistreur ni le journal du portique : ils vont à l''assureur, pas au client, et rien ne nous
    oblige à les produire à ce stade.


    ---


    **Deux points sur lesquels j''attire votre attention.** D''abord, j''ai délibérément scindé en deux
    documents alors que la demande en évoquait un seul : la franchise due à l''assureur — notamment sur
    la mention « départ 6 h 40 » — est exactement ce qu''il ne faut pas écrire au client. Un texte unique
    servant les deux destinataires est un piège. Ensuite, l''extraction brute de l''enregistreur et l''analyse
    de l''échantillothèque sont à lancer aujourd''hui : ce sont les deux seules pièces susceptibles de
    faire basculer le dossier d''une reconnaissance de responsabilité vers une contestation intégrale,
    et l''une comme l''autre demandent quelques jours.

    '
