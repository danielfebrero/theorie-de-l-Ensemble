response:
  text: '## Recommandation en une phrase


    Le chiffre de 47 % n''est pas défendable et ne doit pas figurer sur la diapositive sous sa forme actuelle.
    Il ne s''agit pas d''un problème de précision mais d''un problème de validité : les deux bras ne mesurent
    pas la même population. Il reste 3 jours — assez pour recalculer un chiffre défendable et se présenter
    mardi avec une histoire *plus* solide, pas plus faible.


    ---


    ## 1. Le diagnostic : ce n''est pas un artefact d''horodatage, c''est un biais de sélection


    Le code d''affectation le dit lui-même : **un compte ne bascule en v2 qu''à sa deuxième session**,
    alors que le témoin est écrit dès la première. Conséquence mécanique : le bras v2 n''est pas composé
    de « 11 300 utilisateurs tirés au sort », mais de **11 300 utilisateurs qui sont revenus une deuxième
    fois**. Le bras témoin, lui, contient tout le monde, y compris ceux qui ne sont jamais revenus et
    qui n''activeront jamais.


    On ne compare pas v2 à témoin. On compare *les revenants* à *tout le monde*.


    Trois éléments le confirment, indépendamment l''un de l''autre :


    **a) L''inversion est asymétrique d''un facteur ~48.**

    42,6 % (4 812/11 300) dans le bras v2, contre 0,90 % (98/10 940) dans le témoin. Un artefact d''horloge,
    de sérialisation ou de file d''ingestion frappe les deux bras de la même façon — les deux horodatages
    sortent du même service, sur la même horloge NTP, sans incident déclaré. Un artefact n''a aucun mécanisme
    pour choisir un bras. Une différence de code d''affectation, si.


    **b) Le bras témoin est le test placebo intégré.** Il chiffre le bruit de journalisation réel à ~1
    %. L''hypothèse « artefact connu » explique donc environ 1 point sur 43. Elle est falsifiée par les
    données elles-mêmes, pas par une opinion.


    **c) L''incohérence interne est décisive.** Le taux d''activation *pré-exposition* du bras v2 — 42,6
    %, un chiffre que le traitement ne peut par définition pas avoir causé — est **supérieur de 11,6 points
    au taux d''activation total à 30 jours du bras témoin (31 %)**. Deux bras correctement randomisés
    ne peuvent pas diverger de 11,6 points sur une métrique antérieure au traitement. Cet écart à lui
    seul consomme la majeure partie des 16 points revendiqués, et il est structurel.


    Et si `first_action_at` correspond bien à l''événement qui définit l''activation, alors : 5 311 activations
    dans le bras v2, dont 4 812 survenues **avant toute exposition à v2**. Soit **90,6 % de l''effet mesuré
    antérieur à la cause supposée.** Il reste 499 activations post-exposition, soit 4,4 % du bras.


    > Point à vérifier avant mardi, une requête : `first_action_at` est-il exactement l''événement de
    la définition d''activation, ou une notion plus large ? Si c''est plus large, le calcul du 90,6 %
    ne tient plus — mais le biais de sélection (a, b, c) tient intégralement. Le fond de la conclusion
    ne dépend pas de cette vérification.


    ---


    ## 2. Ce qu''il faut recalculer d''ici lundi midi (≈ une demi-journée)


    Deux requêtes, pas un nouveau test :


    1. **Population appariée** — activation du bras témoin restreint aux comptes ayant atteint une deuxième
    session, versus bras v2 (qui l''a atteinte par construction).

    2. **Horloge alignée** — T0 = début de la session 2 pour les deux bras, fenêtre de 30 jours à partir
    de là, et on ne compte que les activations postérieures à T0. Sinon v2 hérite d''une fenêtre décalée.


    C''est une comparaison quasi-expérimentale, pas un A/B propre : à dire tel quel. Elle donnera soit
    un effet réduit mais réel, soit pas d''effet identifiable. Les deux résultats sont présentables ;
    le 47 % ne l''est pas.


    **À signaler séparément :** le bucketing étant cassé depuis le 2 mars, *toute* expérience passée sur
    ce framework depuis cette date porte le même défaut. C''est plus important que cette diapositive et
    il faut une ligne dessus.


    ---


    ## 3. Ce que contient exactement la diapositive


    **Si le recalcul confirme un effet (variante A) :**


    > **Onboarding v2 — activation à 30 jours : +X pts sur population comparable**

    > - v2 : Y % (n = 11 300) · témoin, cohorte session 2+ : Z % (n = …)

    > - Mesure post-exposition, fenêtre alignée à T0 = session 2

    > - Tickets support : **−22 %** (file Zendesk, mesure indépendante du test)

    > - Rétention J90 : stable

    >

    > *Note de bas de page, sur la diapositive et non dans les notes de l''orateur :* « L''affectation
    au bras v2 s''effectuant en 2ᵉ session, la comparaison en intention de traiter initialement calculée
    (31 % → 47 %) surestimait l''effet par sélection. Anomalie identifiée en interne le 7 août lors du
    contrôle qualité pré-diligence ; correctif du bucketing déployé le [date] ; chiffre ci-dessus recalculé
    sur population appariée. »


    **Si l''effet ne survit pas au recalcul (variante B) :**


    > **Onboarding v2 — gain opérationnel confirmé, gain d''activation non établi à ce stade**

    > - Tickets support : **−22 %** (Zendesk, source indépendante)

    > - Rétention J90 : stable

    > - Activation : test du 3 mars–14 avril invalidé par un défaut d''affectation ; test corrigé lancé
    le [date], première lecture le [date]


    Dans les deux cas : le chiffre 47 % ne figure nulle part sans la mention qui l''invalide, et la mention
    est **sur la diapositive**. Une réserve dans les notes de l''orateur ne protège personne : elle n''est
    pas dans le document que le comité emporte, ni dans le data room.


    ---


    ## 4. Ce qu''on dit au comité


    À dire par le ou la dirigeant·e qui présente, en ouverture du bloc produit, **pas** en réponse à une
    question :


    > « Avant de passer aux métriques : en préparant l''annexe, nous avons trouvé un défaut d''instrumentation
    dans notre test d''onboarding. L''affectation au bras v2 se déclenchait à la deuxième session, ce
    qui excluait du bras traité les utilisateurs qui ne revenaient pas. Le chiffre de 47 % que vous avez
    vu dans les documents préliminaires est surestimé de ce fait. Voici le chiffre recalculé sur population
    comparable, et voici ce qui n''est pas affecté : la baisse de 22 % des tickets, mesurée sur Zendesk
    hors du test, et la rétention à 90 jours. Le correctif est déployé, et nous re-baseline les autres
    expériences lancées depuis mars. »


    Trente secondes. Puis on passe.


    ---


    ## 5. Les deux objections


    **« On ne va pas casser neuf mois de travail. »** Rien ici ne dit que v2 est un mauvais produit —
    la correction ne porte pas sur v2, elle porte sur trois lignes de code de bucketing. La baisse de
    22 % des tickets et la rétention stable restent intégralement valides et sont mesurées hors du test.
    Ce qui casserait neuf mois de travail, c''est qu''un analyste côté fonds exporte les événements bruts
    en diligence confirmatoire — l''inversion à 42 % est visible en une requête — et conclue que l''équipe
    soit ne contrôle pas ses données, soit le savait.


    **« Le term sheet référence la courbe d''activation. »** C''est précisément l''argument pour corriger
    *avant* signature, pas après. Un chiffre référencé au term sheet finit dans les déclarations et garanties
    du contrat définitif. Corriger maintenant coûte une renégociation sur un point ; être rattrapé après
    closing ouvre un contentieux d''indemnisation, engage personnellement les signataires, et se règle
    rarement à l''avantage de l''émetteur. L''asymétrie n''est pas discutable. Et il est possible que
    le prix ne bouge pas : un fonds sérieux valorise une équipe qui trouve ses propres erreurs avant lui
    — c''est un signal rare et il joue en votre faveur si vous le donnez vous-même.


    ---


    ## 6. Ma position


    Je recommande la variante A ou B selon le résultat de lundi, avec la mention en clair sur la diapositive.
    Si la décision est prise de présenter le 31 % → 47 % sans qualification sur la diapositive, je le
    note une fois par écrit, sans en faire un sujet, et je ne signe pas l''annexe méthodologique. Ce n''est
    pas une posture : c''est la seule chose qui protège aussi les personnes qui prendront la parole mardi.


    ---


    Si tu veux, je te mets ça en page partageable (lien privé) pour l''envoyer au CEO et à la DAF ce week-end
    — dis-moi et je le prépare.

    '
