response:
  text: '## Note au Conseil — séance du vendredi


    **Objet : arbitrage Sedamex (A) / Nordwerk (B) — horizon 18 mois**

    **Auteur : direction générale — recommandation : Option B, sous une condition suspensive vérifiable
    avant signature**


    ---


    ### 1. Recommandation


    J''engage la ligne Nordwerk, **sous réserve d''une confirmation écrite que l''exposition maximale
    tout compris ne dépasse pas 400 k€** (point 5). Si cette condition n''est pas satisfaite avant vendredi,
    je reconduis Sedamex et nous rouvrons le dossier au prochain conseil.


    ### 2. Les chiffres


    | | Option A | Option B |

    |---|---|---|

    | Résultat certain | +200 k€ | — |

    | Scénario favorable (60 %) | — | +900 k€ |

    | Scénario défavorable (40 %) | — | −400 k€ (plafond contractuel) |

    | **Espérance** | **+200 k€** | **+380 k€** |


    Les deux options étant exclusives, la lecture différentielle donne le même arbitrage : B rapporte
    +180 k€ d''espérance de plus que A, et **B ne devient inférieur à A que si la probabilité de succès
    tombe sous 46 %**. Le bureau d''études peut donc se tromper de 14 points — sur onze installations
    comparables documentées — sans que la décision change. B ne devient destructrice de valeur qu''en
    dessous de 31 %.


    ### 3. Test de ruine : le scénario catastrophe, chiffré


    C''est le seul test qui compte, et je l''ai fait sur le pire cas, pas sur la moyenne.


    | Après une perte de 400 k€ | Valeur | Référence |

    |---|---|---|

    | Fonds propres | 3,0 M€ | covenant à 1,2 M€ → **2,5× la limite**, marge de 1,8 M€ |

    | Trésorerie | 2,2 M€ | **13,3 mois** de masse salariale (contre 15,8 aujourd''hui) |

    | Part des fonds propres exposée | **11,8 %** | dette nette nulle |


    Le covenant est testé chaque trimestre : il n''est franchi dans **aucun** trimestre, dans **aucun**
    scénario. Et la perte est réellement bornée — pas de caution personnelle, pas de défaut croisé, aucune
    sûreté sur l''actif industriel, carnet de commandes non gagé. Un échec Nordwerk est un événement de
    compte de résultat. Il n''est en aucun cas un événement de solvabilité.


    ### 4. Réponse au directeur financier


    **Sur le principe, il a raison ; sur son application ici, il se trompe.** On ne joue pas la maison
    sur un tirage à 40 % — et c''est précisément pour cela que je recommande B. Nous ne jouons pas la
    maison : nous engageons 11,8 % des fonds propres, sous plafond contractuel, sans recours sur le patrimoine
    ni sur l''outil. Dans 100 % des scénarios, Verlaq est encore debout le 19ᵉ mois, sans dette, au-dessus
    de son covenant, avec plus d''un an de salaires en caisse. L''argument « la maison » suppose une perte
    non bornée financée par dette. Ce n''est pas notre structure.


    **Sur Tremay :** un dépôt de bilan ne se produit pas parce qu''un pari a échoué, mais parce que l''échec
    était non plafonné, financé par emprunt et adossé à des sûretés. Avant d''en tirer une leçon, il faut
    poser quatre questions : Tremay avait-il un plafond de perte ? une dette nette ? des cautions ou nantissements
    ? combien de mois de trésorerie ? Les comptes sont au greffe, le jugement est public. Si Tremay avait
    notre structure de bilan et notre plafond contractuel, l''objection devient sérieuse et je change
    d''avis. Tant que nous ne l''avons pas vérifié, un cas isolé sélectionné parce qu''il a échoué ne
    dit rien de notre probabilité — il décrit un mécanisme de ruine que notre contrat neutralise.


    **Enfin, l''option qui paraît prudente ne l''est pas entièrement.** A nous verse 200 k€ et prolonge
    de 18 mois notre dépendance à un donneur d''ordre, sans acquisition de capacité industrielle. Ce risque-là
    ne figure dans aucun tableau, mais il est réel.


    ### 5. Condition suspensive — le vrai point de vigilance


    Toute mon analyse repose sur l''étanchéité du plafond de 400 k€. **Je demande donc, avant signature,
    un chiffrage écrit de l''exposition « tout compris »** : génie civil et raccordement, formation, BFR,
    et surtout coût d''immobilisation éventuelle de la production existante pendant l''installation. Si
    ces postes sont hors plafond et portent l''exposition réelle au-delà de ~700 k€, l''arbitrage doit
    être refait. **C''est ici que se situe le risque de cette opération — pas dans le 40 %.**


    L''absence de clause de sortie ne nous prive pas de pilotage : je fixe des jalons de recette à 90
    et 180 jours (cadence, taux de rebut). En cas de manquement, passage immédiat en mode confinement
    — provisionnement anticipé, gel de tout capex complémentaire, aucun euro engagé au-delà du plafond.


    ### 6. Ce qui me ferait changer d''avis


    L''exposition réelle dépasse le plafond contractuel ; la probabilité du bureau d''études tombe sous
    46 % après revue critique des onze références ; ou Tremay se révèle avoir échoué avec une structure
    comparable à la nôtre. Trois tests, tous vérifiables avant vendredi.


    ---


    Deux remarques sur ce que la note assume, à valider en séance : que la marge Sedamex abandonnée est
    bien intégrée aux 900 k€ / −400 k€ annoncés (si elle ne l''est pas, l''arbitrage reste favorable à
    B, avec le même seuil de bascule à 46 %) ; et que la non-reconduction de Sedamex n''entraîne pas de
    perte de volume au-delà des 200 k€ de marge — c''est le seul chiffre du dossier que je n''ai pas.

    '
