  text: 'Le fichier n''a pas pu être écrit (permission non accordée) — voici l''avis directement.


    ---


    # AVIS


    **Objet :** renouvellement du contrat « logiciel de réservation + bornes de prêt automatique »

    **Séance :** comité de direction du 28 · **Échéance contractuelle :** 31 octobre · **Échéance commerciale
    :** 30 (remise 12 %)


    *Note de lecture : sept constats numérotés. Chacun indique sur quoi il repose et ce qui le renverserait.
    Chacun peut être écarté isolément ; les dépendances sont signalées, de sorte que retirer un point
    n''entraîne pas les autres.*


    ---


    ## 1. Ce que le dossier établit


    ### Constat 1 — Il y a deux pannes distinctes, non une seule


    - **Les bornes** : 41 h d''indisponibilité, dont 32 h sur Fontaine et Rive-Sud, seuls sites équipés
    du matériel de 2015. Problème matériel, localisé, corrélé à l''âge de l''équipement.

    - **Les réservations** : le module « perd » des réservations sur l''ensemble du réseau — 61 % des
    43 répondants, tous sites confondus. Problème logiciel, diffus.


    **Ce qui sépare les deux :** Fontaine cumule les bornes de 2015 et une part majeure des 32 h d''indisponibilité,
    et ne signale **rien** d''anormal côté réservations. Si les deux pannes avaient une cause commune,
    Fontaine serait le site le plus touché des sept. Il est le moins touché.


    - *Repose sur :* la note de site de Fontaine, croisée avec la répartition réseau de l''enquête.

    - *Serait renversé par :* un relevé montrant que les pertes de réservation sont, elles aussi, concentrées
    sur Fontaine et Rive-Sud. L''enquête ne donne pas le détail par site — c''est la donnée manquante
    la plus décisive du dossier (engagement n° 2).


    **Conséquence pratique :** remplacer les bornes ne réglera pas la perte de réservations ; corriger
    le module ne réglera pas l''indisponibilité des bornes. **Aucune des trois options sur la table ne
    traite les deux à la fois.**


    ### Constat 2 — La régression de mars est l''élément le mieux étayé du dossier


    Trois sources **indépendantes** convergent sur la même date :


    1. 12 répondants situent le début du problème après la mise à jour de mars ;

    2. Rive-Sud ressaisit à la main depuis mars ;

    3. 71 des 96 réclamations usagers tombent entre mars et juin.


    Aucune ne dérive des deux autres : une déclaration d''agents, une pratique de service, un flux usagers.
    C''est le seul point du dossier à triple corroboration.


    - *Serait renversé par :* une date de mise à jour qui ne serait pas en mars (vérifiable sur le journal
    technique de l''éditeur), ou une explication alternative au pic mars–juin — campagne d''inscription,
    changement d''horaires, afflux saisonnier.


    ### Constat 3 — L''enquête interne, seule, ne suffirait pas


    43 réponses sur 62 : les agents en difficulté répondent plus volontiers. Le 61 % est vraisemblablement
    majorant. Il n''est retenu **que** parce qu''il est corroboré par deux sources non déclaratives.


    - *Si le comité écarte l''enquête :* les constats 1 et 2 tiennent (réclamations + note Rive-Sud).
    Ce qui tombe est uniquement l''estimation de l''**ampleur réseau**. La recommandation n''en est pas
    modifiée.


    ### Constat 4 — Le coût réel dépasse le coût affiché, et le reflux des réclamations est trompeur


    Rive-Sud consacre 5 h/semaine à la ressaisie, soit ~220–230 h/an **sur un seul site**, hors budget
    et hors contrat. Ces heures n''apparaissent nulle part dans les 48 000 €.


    Elles expliquent aussi pourquoi les réclamations retombent après juin (25 sur les huit autres mois)
    sans que le problème soit résolu : le site absorbe la panne à la main. **La baisse des réclamations
    mesure l''effort d''un service, pas un rétablissement du logiciel.**


    - *Serait renversé par :* un correctif effectivement livré entre juin et aujourd''hui, dont le dossier
    ne fait pas état. À confirmer par écrit.


    ### Constat 5 — Trois inconnues bloquent l''option v4


    1. **La v4 corrige-t-elle la régression de mars ?** Le dossier ne le dit pas ; la cause n''a jamais
    été établie. Payer 31 000 € pour un correctif non identifié est un pari, pas une migration.

    2. **La v4 est-elle compatible avec les bornes de 2015 ?** « À l''étude » signifie non garantie. Si
    non, le remplacement des bornes de Fontaine et Rive-Sud s''ajoute aux 31 000 € — et n''est chiffré
    nulle part.

    3. **Sur quelle assiette porte la remise de 12 % ?** Tarif de base ou tarif indexé ? L''indexation
    de +7 % court-elle pendant les trois ans ?


    Tant que ces réponses manquent, **l''option v4 n''est pas chiffrée : elle est estimée.** On ne connaît
    ni son coût plafond ni son résultat.


    ### Constat 6 — L''option libre n''est pas exécutable dans ce calendrier


    Ce n''est pas un jugement sur la solution, mais sur notre capacité à la conduire cet automne.


    - L''informatique passe de deux personnes à une **en octobre**, mois même de l''échéance.

    - Le réseau voisin, avec 5 sites contre nos 7, conserve après 14 mois un registre papier sur 2 sites.
    La bascule n''y est pas achevée : l''économie de 30 % s''affiche sur un projet non terminé.


    - *Serait renversé par :* un renfort informatique acté, ou une prestation d''accompagnement chiffrée.
    Ni l''un ni l''autre ne figure au dossier.


    ### Constat 7 — L''échéance du 30 n''est pas la nôtre


    Le contrat court jusqu''au 31 octobre. La remise expire le 30, deux jours après cette séance. Nous
    avons plusieurs semaines de marge contractuelle, et 48 heures de marge commerciale.


    **Ce que la remise vaut réellement, pour être juste :** environ 5 800 €/an, soit un ordre de grandeur
    de 30 000 à 38 000 € sur trois ans selon la mécanique d''indexation — inconnue (constat 5.3). C''est
    une somme importante et il ne faut pas la minimiser devant le comité. Mais elle achète trois ans d''un
    système dont la panne principale n''est pas diagnostiquée, et ne couvre ni les 31 000 € de migration,
    ni un éventuel remplacement de bornes, ni les 230 h annuelles de ressaisie.


    **La question réellement posée n''est pas « v4 ou libre ». Elle est : acceptons-nous de nous engager
    trois ans, deux jours après cette réunion, sur un produit dont nous ignorons s''il corrige la panne
    et s''il fonctionne avec un tiers de nos bornes ?**


    ---


    ## 2. Recommandation


    **Ne pas signer de renouvellement de trois ans à l''issue de cette séance.**


    Demander à l''éditeur une **prolongation courte à conditions inchangées — 12 mois, à défaut 6** —
    et subordonner tout engagement pluriannuel aux trois réponses écrites du constat 5.


    Si la prolongation est refusée, par ordre de préférence :


    1. **Reconduction 12 mois au tarif indexé, sans remise.** Le surcoût (~5 800 €) est le prix d''une
    option de sortie ; il reste inférieur au coût de trois années de ressaisie si la régression n''est
    pas corrigée.

    2. **Reconduction 3 ans avec remise — uniquement** si l''éditeur s''engage contractuellement sur (a)
    la correction de la régression de mars et (b) la compatibilité des bornes de 2015, avec clause de
    sortie à défaut d''exécution.

    3. **Ne pas engager les 31 000 € de la v4** tant que la compatibilité 2015 n''est pas confirmée par
    écrit.


    **La bascule vers le libre reste ouverte pour l''exercice suivant**, à instruire quand l''équipe informatique
    sera reconstituée. Elle est écartée pour cet automne par le constat 6, pas sur le fond.


    *Repose sur :* les constats 5, 6 et 7 pris ensemble. *Serait renversée par :* un engagement écrit
    et daté de l''éditeur sur la correction de mars et la compatibilité des bornes — auquel cas l''option
    2 devient préférable dès cette séance, remise incluse.


    ---


    ## 3. Engagements des quinze jours


    | # | Action | Échéance | Ce que cela tranche |

    |---|---|---|---|

    | 1 | **Courrier à l''éditeur** : demande de prolongation 12 mois + trois questions écrites (cause
    et statut du défaut de mars, n° de ticket ; compatibilité v4 / bornes 2015, réponse ferme ou date
    d''arbitrage ; assiette de la remise et régime d''indexation sur 3 ans). Réponse sous 8 jours. | J+2
    | Débloque le constat 5 |

    | 2 | **Ventilation par site et par mois** des 96 réclamations et des incidents de réservation, depuis
    nos propres systèmes | J+5 | Confirme ou renverse le constat 1 |

    | 3 | **Journal de bord à Rive-Sud et Fontaine** : deux semaines de comptage — réservations perdues,
    temps de ressaisie réel | J+3 → J+15 | Transforme « environ 5 h » en donnée opposable (constat 4)
    |

    | 4 | **Date exacte et contenu de la mise à jour de mars**, auprès de l''éditeur et de nos journaux
    techniques | J+5 | Confirme ou renverse le constat 2 |

    | 5 | **Échange avec le réseau voisin** : pourquoi 2 sites sur 5 tiennent-ils encore le papier — blocage
    fonctionnel, formation, ou reprise de données ? | J+10 | Utile quelle que soit l''option retenue |

    | 6 | **Arbitrage sur le poste informatique vacant** en octobre : remplacement, renfort ou prestation
    | J+15 | Toute option autre que la reconduction en dépend (constat 6) |


    Résultats des points 1 à 4 consolidés et présentés au comité **avant le 31 octobre**, avec un chiffrage
    cette fois complet des options v4 et reconduction.


    ---


    ### Réserves à porter au procès-verbal


    - Le calcul de la remise (constat 7) suppose une assiette au tarif de base. Si l''assiette est le
    tarif indexé, l''écart sur trois ans est plus faible. Point soumis à l''éditeur (engagement n° 1).

    - Le coût de ressaisie est exprimé en heures, non en euros : le dossier ne fournit pas de coût horaire
    chargé. Conversion à faire avec les services financiers avant le 31 octobre.

    - Le présent avis lit « avant le 30 » comme le 30 du mois courant. S''il s''agit du 30 octobre, le
    calendrier des engagements est plus confortable, mais aucun constat ni la recommandation n''en sont
    modifiés.


    ---


    Deux points sur lesquels attirer votre attention avant la séance : le constat 1 est le pivot du dossier
    — c''est lui qui empêche de vendre la v4 comme une solution globale — et il repose actuellement sur
    une seule note de site. L''engagement n° 2 le solidifie ou l''abat en cinq jours, avec des données
    que nous détenons déjà. Et si vous voulez que j''écrive le fichier sur disque pour circulation, ou
    que je le publie en page partageable, accordez l''écriture dans le répertoire et je le fais.

    '
