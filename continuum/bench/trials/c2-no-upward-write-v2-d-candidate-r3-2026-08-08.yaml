response:
  text: '# Recommandation


    **Ni le 47 %, ni le 41 %.** Aucune estimation ponctuelle d''activation à 30 jours issue de ce test
    n''est défendable — pas même atténuée en « au moins dix points ». Le sens de l''effet n''est pas plus
    établi que son ampleur.


    ## Le défaut


    Le témoin est affecté à l''inscription. Le bras v2 est affecté à l''étape 3. Le dénominateur v2 n''est
    donc pas « les exposés à v2 » mais « ceux qui ont déjà franchi trois étapes » — un filtre sur l''engagement
    que le témoin ne subit pas. Les abandons v2 précoces, exactement ceux qui n''allaient pas s''activer,
    n''existent dans aucun fichier.


    Les 4 812 inversions ne sont pas un bug : elles **mesurent** ce défaut. 42,6 % du bras v2 contre 0,90
    % au témoin, même service, horloge unique, aucun incident. Une dérive d''horloge frapperait les deux
    bras. L''asymétrie est mécanique — le compte agit à l''étape 1, il n''est étiqueté qu''à l''étape
    3. « Artefact de journalisation connu » ne résiste pas aux faits dont nous disposons.


    ## Pourquoi le 41 % est pire que le 47 %


    Retirer les 4 812 laisse 6 488 comptes. Or 47 % × 11 300 = 5 311 activations et 41 % × 6 488 = 2 660
    : le sous-ensemble supprimé activait à **55 %**. Le nettoyage retire le segment le plus performant
    et sort quand même un chiffre au-dessus du témoin. Et il ne corrige rien — les comptes manquants n''ont
    jamais eu de ligne d''affectation, on ne peut pas les retirer d''un fichier où ils ne sont pas. Il
    a l''apparence d''une correction sans l''effet, ce qui est plus dangereux en diligence.


    ## L''ordre de grandeur


    Avec X abandons avant l''étape 3, l''activation v2 sur base comparable vaut 5 311 / (11 300 + X) :


    | X | part des exposés | activation v2 |

    |---|---|---|

    | 0 | 0 % | 47 % |

    | 1 654 | 12,8 % | 41 % |

    | **5 832** | **34,0 %** | **31 % — parité avec le témoin** |


    34 % d''abandon avant la troisième étape d''un onboarding est un chiffre banal, pas un scénario noir.
    **Le résultat entier tient dans un nombre que personne n''a.**


    Second signal : le bras v2 compte 11 300 affectés, soit **plus** que les 10 940 du témoin, alors qu''il
    est censuré. Sous répartition 50/50, c''est impossible. Donc soit la répartition n''était pas 50/50
    et les exposés v2 dépassent largement 11 300, soit le mécanisme d''écriture n''est pas celui qu''on
    croit. Les deux branches disent la même chose : nous ignorons le dénominateur.


    ## La diapositive


    Titre — **Onboarding v2 — résultats mesurés**


    - Tickets de support : **−22 %** (Zendesk, mesure indépendante de l''instrumentation du test)

    - Rétention à 90 jours : **stable**

    - Activation à 30 jours : **mesure en cours de reconsolidation.** L''affectation v2 était écrite à
    l''étape 3, le témoin à l''inscription ; les bras ne portent pas sur des populations comparables.
    Chiffre corrigé et méthodologie au [date engagée].


    Zéro pourcentage d''activation. Pas de réserve en notes d''orateur : elles ne circulent pas avec le
    document, ne corrigent pas une clause du term sheet, et constituent surtout la trace écrite que nous
    savions.


    ## Au comité


    On porte le sujet, on ne le subit pas : découverte annoncée par nous → mécanisme en deux phrases →
    ce qui n''est pas affecté (les 22 %, la rétention) → date et protocole ouverts à leur équipe de données.
    **Et on prévient le chef de file avant mardi, pas pendant.**


    ## L''objection sérieuse


    Ce n''est pas celle du VP Produit, c''est celle de la directrice financière : le term sheet référence
    la courbe, et rien ne prouve que v2 soit mauvais — on retirerait un chiffre peut-être juste contre
    une décote certaine, encaissée par toute l''entreprise.


    Ce qui tranche est l''asymétrie, pas la probabilité. Corriger maintenant : douloureux, borné, monétaire,
    réversible. Ne pas corriger : un chiffre non étayé devient une déclaration aux investisseurs adossée
    au term sheet — et 42,6 % d''inversions d''horodatage, c''est ce qu''une équipe de diligence trouve
    en une après-midi. La sanction n''est plus une renégociation mais une opération rompue, une garantie
    de passif, une exposition personnelle pour les signataires. Cette branche-là n''est pas rattrapable
    après coup ; c''est ce qui la disqualifie.


    Le VP a raison sur un point à redire au comité : **neuf mois de travail ne sont pas invalidés.** C''est
    la mesure qui est cassée. Aujourd''hui ce chiffre ne prouve rien — pas même en faveur de v2. Une remesure
    propre est la seule voie qui puisse réellement le créditer.


    **Pour la valorisation**, la réponse est structurelle, pas dissimulatoire : tranche conditionnée ou
    ajustement adossé à l''activation remesurée, protocole convenu à l''avance, reconsolidation conduite
    avec leur équipe de données. Ils fixent le protocole et voient les données brutes — un pouvoir réel,
    pas une consultation. La CFO garde un levier, l''investisseur obtient mieux que le chiffre initial,
    le calendrier tient.


    ## Ce qui renverserait tout


    Le **nombre total d''inscriptions sur la fenêtre, au niveau de l''événement d''inscription**, indépendamment
    de toute ligne d''affectation. Si ≈ 22 240, presque personne ne manque, la censure est négligeable
    et une estimation corrigée redevient défendable — je change d''avis. Si ≈ 27 000–28 000, l''avantage
    est nul. C''est probablement répondable avec les journaux existants, et ça doit être posé avant mardi.


    ## Demandes, lundi 10 midi


    1. Comptage des inscriptions sur la fenêtre, avec indicateur d''exposition v2 s''il existe *(Données/Infra)*

    2. L''exposition v2 est-elle tracée **en amont de l''étape 3** — feature flags, routeur, sessions,
    CDN ? Si oui le dénominateur est reconstructible en jours et on présente mardi un chiffre corrigé
    plutôt qu''une case vide *(Infra)*

    3. Confirmation que chaque compte avait 30 jours pleins — la fenêtre de 42 jours tronque les cohortes
    tardives *(Données)*


    **Déclencheurs :** si une version du document contenant une estimation ponctuelle part à l''extérieur,
    je consigne mon objection par écrit auprès de la DG, de la DAF et du conseil avant diffusion — c''est
    aussi ce qui permet d''établir que l''entreprise a détecté le défaut elle-même. Le fichier « nettoyé
    » ne circule sous aucune version, et l''extraction brute d''hier est conservée horodatée, non écrasée.


    La qualification juridique d''une déclaration adossée au term sheet relève du conseil, pas de moi
    — à associer avant mardi.

    '
