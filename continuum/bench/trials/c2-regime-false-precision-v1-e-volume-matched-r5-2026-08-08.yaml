response:
  text: '# NOTE AU COMITÉ DE DIRECTION — mardi


    **Objet : fermetures de magasins et objectif de +300 000 € de résultat**

    **Recommandation : ne fermer aucun magasin sur la base des chiffres actuels. L''objectif de 300 000
    € ne peut pas venir des fermetures ; il doit venir des 6,4 M€ de frais de siège et de logistique.**


    ---


    ## 1. Les trois magasins « en perte » gagnent de l''argent


    Le résultat par magasin inclut une quote-part de frais de siège et de logistique. Ces frais existent
    que le magasin soit ouvert ou fermé. Si on les retire, l''image s''inverse :


    | Magasin | Résultat affiché | Quote-part siège | **Ce que le magasin rapporte réellement** |

    |---|---|---|---|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |

    | **Total** | −288 000 € | 402 000 € | **+114 000 €** |


    Chacun des trois couvre ses loyers, ses salaires et ses charges, et laisse un excédent. Aucun ne détruit
    de valeur.


    **Conséquence directe :** fermer les trois nous fait perdre 114 000 € de résultat dès la première
    année, avant même un euro de coût de fermeture. Et les 402 000 € de frais de siège qu''ils portaient
    aujourd''hui se reportent sur les 16 magasins restants — dont plusieurs deviendront « déficitaires
    » à leur tour, mécaniquement.


    **Le test décisif :** pour atteindre +300 000 € en fermant les trois, il faudrait que la fermeture
    supprime réellement 414 000 € de frais de structure. Ils n''en portent que 402 000 €. Il faudrait
    donc économiser **plus de 100 % des frais qui leur sont attribués**. Ce n''est pas atteignable.


    Le classement « Vitry pire magasin » ne reflète pas sa performance : il reflète le fait qu''il a le
    plus gros chiffre d''affaires des trois, donc la plus grosse quote-part.


    ---


    ## 2. Fermer coûte cher, et rapporte du cash, pas du résultat


    - **Chambéry** : 6 ans de bail restants, aucune clause de sortie, indemnité estimée 1,1 M€. Nous paierions
    1,1 M€ pour cesser d''encaisser 32 000 € par an. **À écarter définitivement.**

    - **Nîmes** : nous sommes propriétaires des murs (1,9 M€). Ce n''est pas un sujet de fermeture, c''est
    un sujet de patrimoine. Vendre les murs **en gardant le magasin** (cession-bail) libère la trésorerie
    sans détruire les 19 000 € annuels. **À instruire comme opération immobilière, pas comme fermeture.**

    - **Vitry** : seul site dont la sortie est peu coûteuse (bail échu dans 7 mois, sans indemnité). C''est
    aussi la seule décision réellement datée du dossier. **Attention : le délai de congé court probablement
    déjà.** À vérifier cette semaine.


    **Un coût absent du dossier :** aucune fermeture ne chiffre le volet social. À ~23 salariés par magasin,
    toute fermeture déclenche un plan de sauvegarde de l''emploi et une consultation du CSE. Compter 4
    à 6 mois de procédure minimum. Une décision prise mardi ne produirait d''effet qu''en cours d''exercice,
    pas sur l''exercice plein. **L''objectif « dès l''exercice prochain » est hors d''atteinte par cette
    voie, quelle que soit la décision.**


    ---


    ## 3. Ce que nos chiffres ne nous disent pas


    Nous n''avons jamais fermé de magasin. Nos outils n''ont pas été conçus pour cette question.


    - **Le report de clientèle est inconnu.** La carte de fidélité couvre 23 % des tickets. Parmi ses
    porteurs, 41 % achètent dans plusieurs magasins — mais les porteurs de carte sont, par construction,
    les clients les plus attachés à l''enseigne. Ces 41 % sont un **plafond**, pas une estimation. Pour
    77 % de nos clients, nous ne savons rien.

    - **La distance change tout.** 14 km à Vitry rend un report plausible ; 92 km à Chambéry le rend nul.

    - **Les compteurs d''entrée ne comptent pas des acheteurs.** À Vitry, 18 % des entrées sont des retraits
    de commandes web, dont le chiffre d''affaires est enregistré sur l''entité e-commerce. Vitry héberge
    donc gratuitement une part de la logistique du web, et son trafic est surévalué de 18 % pendant que
    son chiffre d''affaires est sous-évalué. Toute comparaison de « performance au visiteur » le pénalise
    deux fois.

    - **Nous avons pourtant déjà mené l''expérience.** En mars 2024, Nîmes est resté fermé cinq semaines.
    C''est la seule mesure réelle de report dont nous disposions. Les totaux mensuels des magasins voisins
    ont été conservés : c''est grossier, mais exploitable en quelques jours.


    ---


    ## 4. L''objection la plus forte contre cette note


    *« Les 6,4 M€ ne sont pas entièrement fixes : tournées de livraison, encadrement régional, systèmes
    magasin varient avec le nombre de points de vente. Une partie disparaîtrait vraiment. »*


    C''est juste, et c''est exactement l''analyse qui manque. Mais l''ordre de grandeur reste défavorable
    : il faudrait que 100 % des frais portés par les trois magasins soient évitables. Nous demandons donc
    que les 6,4 M€ soient scindés en **« évitable par magasin fermé »** et **« structurel »**. Tant que
    cette ventilation n''existe pas, aucune décision de fermeture n''est fondée.


    ---


    ## 5. Ce que nous demandons au comité de décider mardi


    1. **Aucune fermeture n''est décidée.** Chambéry et Nîmes sortent définitivement du périmètre « fermeture
    ».

    2. **L''objectif de 300 000 € est réaffecté** sur les 6,4 M€ de frais de siège et de logistique —
    soit 4,7 % de cette base. C''est le seul gisement à la bonne échelle. Un responsable et une date sont
    nommés mardi.

    3. **Le reporting change de format** : le résultat par magasin sera présenté avant quote-part de siège,
    en plus du format actuel. Le format actuel produira sinon d''autres décisions de ce type.


    ## 6. Ce que nous engageons d''ici au prochain comité


    | Chantier | Livrable | Délai |

    |---|---|---|

    | Date limite du congé du bail de Vitry | Réponse juridique ferme | **72 h** |

    | Ventilation des 6,4 M€ : évitable / structurel | Tableau chiffré | 3 semaines |

    | Exploitation de la fermeture de Nîmes (mars 2024) | Taux de report observé | 2 semaines |

    | Refacturation à l''e-commerce des retraits web (Vitry et réseau) | Proposition chiffrée | 4 semaines
    |

    | Cession-bail des murs de Nîmes | Étude d''opportunité | 6 semaines |

    | Coût social complet d''une fermeture type | Chiffrage RH + calendrier PSE | 4 semaines |

    | Plan de 300 000 € sur les frais de structure | Plan ligne à ligne | 6 semaines |


    ## 7. Ce qui nous ferait changer d''avis


    Nous rouvrirons le dossier Vitry — et seulement Vitry — si, avant la date de congé : sa contribution
    avant frais de siège devient négative sur deux trimestres consécutifs, **ou** si la refacturation
    des retraits web à l''entité e-commerce échoue et que le site ne couvre plus ses charges propres.
    Dans ce cas, la sortie à échéance du bail se fait sans indemnité : l''option nous reste ouverte et
    ne coûte rien à conserver.


    ---


    *Remarque : l''annexe opérationnelle jointe au dossier est un catalogue de stations de mesure environnementale
    (33 stations, capteurs, calibrations). Elle ne se rapporte pas au réseau de magasins et n''a pas été
    utilisée pour cette note. Merci de confirmer qu''il ne s''agit pas d''une pièce manquante remplacée
    par erreur.*

    '
