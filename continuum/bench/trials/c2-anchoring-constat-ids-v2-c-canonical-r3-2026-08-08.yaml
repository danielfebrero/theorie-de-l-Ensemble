response:
  text: '# Avis — renouvellement du marché « logiciel de réservation et bornes de prêt »


    *Pour lecture en séance du 28. Chaque appréciation est rattachée à la pièce qui la fonde ; chaque
    constat peut être écarté isolément — la section IV indique lesquels portent la recommandation.*


    ---


    ## I. Ce que je retiens du dossier


    **C1 — Le dossier mélange deux pannes distinctes.**

    *Pièce : export technique + enquête interne.* L''indisponibilité des **bornes** (matériel, 41 h) et
    la **perte de réservations** (module logiciel) sont deux objets différents, sur deux systèmes différents,
    avec deux causes possibles différentes. Ils ne partagent que le contrat.

    *Ce que ça n''établit pas :* qu''aucun des deux ne soit réel. Les deux le sont probablement — séparément.


    **C2 — L''indisponibilité des bornes est un problème de vétusté, et il est modeste.**

    *Pièce : export technique.* 32 h sur les deux seuls sites équipés en 2015, soit ~16 h/site/an, contre
    ~1,8 h/site sur les cinq autres — un facteur d''environ 9. Rapporté au temps d''ouverture, on est
    de l''ordre de 0,5 % (sous réserve des heures d''ouverture réelles, que je n''ai pas).

    *Ce que ça n''établit pas :* une urgence. C''est un plan de remplacement à programmer, pas un motif
    de signature en 48 h.


    **C3 — Fontaine contredit l''explication par les bornes.**

    *Pièce : notes de sites.* Fontaine a les mêmes bornes de 2015 que Rive-Sud et ne signale aucune perte
    de réservation. La vétusté des bornes n''explique donc pas les pertes.

    *Ce que ça n''établit pas :* que Fontaine n''a pas le problème. Une absence de signalement n''est
    pas une absence de panne — c''est le premier point à vérifier (voir VI-1).


    **C4 — La cause de mars repose sur 12 souvenirs, contre trois changements simultanés.**

    *Pièce : enquête interne + chronologie de février.* 61 % de 43 répondants ≈ 26 agents décrivent des
    pertes ; **12** les situent après la mise à jour de mars — soit moins de la moitié de ceux qui constatent
    le problème, et 19 % de l''effectif. Or février a vu **deux autres changements** : remplacement du
    lien fibre de Rive-Sud et changement de version du portail usagers.

    *Ce que ça n''établit pas :* que mars soit hors de cause. Simplement qu''aucune pièce du dossier ne
    permet de la désigner plutôt que les deux autres.


    **C5 — Personne n''a compté une seule réservation perdue.**

    *Pièce : l''ensemble du dossier.* L''enquête mesure une perception (« perd des réservations »), pas
    un volume. Aucun journal applicatif, aucun relevé, aucun taux. C''est le trou central du dossier :
    nous nous apprêtons à arbitrer 31 000 € et trois ans d''engagement sans une seule mesure du défaut
    allégué.


    **C6 — Le profil des réclamations est ambigu, et l''ambiguïté est instructive.**

    *Pièce : 96 réclamations, dont 71 entre mars et juin.* Soit ~18/mois sur quatre mois, puis ~3/mois
    sur les huit autres. Une cause logicielle permanente installée en mars produirait un plateau, pas
    un pic qui retombe. Deux lectures tiennent également : le défaut s''est résorbé, **ou** la ressaisie
    manuelle de Rive-Sud — engagée précisément en mars — absorbe désormais le symptôme visible sans corriger
    la cause.

    *Conséquence :* le coût réel est peut-être déjà payé, en heures d''agents, hors budget.


    **C7 — Rive-Sud finance le contournement sur sa masse salariale.**

    *Pièce : notes de sites.* 5 h/semaine ≈ 225–260 h/an, de l''ordre de 0,13 ETP, pour un seul site.
    C''est la dépense la plus certaine du dossier et la seule qui ne figure dans aucune ligne budgétaire.


    **C8 — L''urgence commerciale ne correspond à aucune échéance opérationnelle.**

    *Pièce : proposition du commercial + date d''échéance.* La remise expire le **30** — deux jours après
    la séance, **deux mois avant** l''échéance réelle du 31 octobre. Rien dans l''exploitation ne justifie
    cet écart. Sur trois ans indexés à +7 %, la remise de 12 % vaut environ **19 800 €** (≈ 165 100 €
    contre ≈ 145 300 €), soit ~6 600 €/an : à peu près le coût annuel de la ressaisie manuelle d''un seul
    site, et **moins des deux tiers** des 31 000 € de la migration v4.


    **C9 — Le précédent du réseau voisin est un avertissement, pas un modèle.**

    *Pièce : réseau voisin.* 14 mois après bascule, 2 sites sur 5 tiennent encore un registre papier.
    L''économie de 30 % est **annoncée** ; la dégradation de service, elle, est observée. Deux sites en
    mode papier coûteraient plusieurs fois ce que la ressaisie de Rive-Sud coûte aujourd''hui.


    **C10 — La capacité informatique est le facteur limitant, et il est connu.**

    *Pièce : équipe de deux personnes, un départ en octobre.* Migration v4 et bascule vers le libre exigent
    toutes deux une capacité de projet que nous n''aurons pas au moment précis où le contrat arrive à
    échéance.


    ---


    ## II. Sur la note de cadrage


    Elle avance trois affirmations enchaînées. Aucune ne survit au dossier tel quel :


    | Affirmation | État |

    |---|---|

    | « La mise à jour de mars est la cause » | **Non établie** — 12 souvenirs, trois changements concurrents
    (C4), aucune mesure (C5) |

    | « La v4 règle le problème » | **Non établie** — dépend de la précédente ; et la compatibilité avec
    les bornes de 2015 est « à l''étude », c''est-à-dire inconnue |

    | « Il faut signer avant le 30 » | **Non établie** — l''échéance est le 31 octobre (C8) |


    Je ne mets pas en cause la bonne foi de son auteur : c''est l''enchaînement d''hypothèses plausibles
    qui pose problème, pas leur sincérité. Mais deux membres du comité l''ont lue et aucune pièce ne l''accompagne.
    Elle doit être versée au débat comme hypothèse à tester, non comme diagnostic.


    ---


    ## III. Ce que je recommande


    **Reconduire à l''identique, sur la durée la plus courte négociable (6 à 12 mois), en refusant explicitement
    l''engagement de trois ans et la remise associée. Ne rien décider sur la v4 avant d''avoir deux réponses
    écrites. Écarter la bascule vers le libre pour cette fenêtre — non sur le fond, mais sur la capacité.**


    **Pourquoi.** Le seul engagement irréversible sur la table est la signature de trois ans. Elle nous
    coûterait ~19 800 € de moins, mais nous priverait de toute porte de sortie pendant trois ans — au
    moment exact où l''équipe informatique passe de deux à une personne (C10), et sur un éditeur incapable
    de nous dire si son produit phare fonctionne avec nos bornes. Payer 31 000 € de migration dont la
    prémisse technique est « à l''étude » (compatibilité) et la prémisse causale non démontrée (C4, C5),
    c''est acheter une réparation sans savoir ce qui est cassé.


    Le libre n''est pas disqualifié sur le fond ; il l''est sur le calendrier. Une bascule menée à un
    informaticien produirait, avec une probabilité sérieuse, le résultat du réseau voisin (C9) : des sites
    en mode papier. C''est une option à réexaminer dans douze mois, avec une capacité reconstituée.


    ---


    ## IV. Ce dont cette recommandation dépend


    Elle repose sur **C5, C8 et C10**. Écartez l''un des trois et elle bouge :


    - **Sans C5** (si une mesure de pertes existe et est probante) → la v4 redevient discutable dès maintenant.

    - **Sans C8** (si l''échéance du 30 est contractuellement rigide et vérifiée) → l''arbitrage remise/flexibilité
    doit être rejoué, mais je maintiendrais le refus des trois ans.

    - **Sans C10** (si un recrutement ou une prestation est acquis avant décembre) → la fenêtre s''ouvre
    pour v4 comme pour le libre.


    Elle **ne dépend pas** de C2, C3, C6, C7 ni C9. Le comité peut écarter n''importe lequel de ces cinq
    sans que la recommandation change.


    ---


    ## V. Le meilleur argument contre moi


    *Les pertes sont réelles et continues ; Rive-Sud saigne 0,13 ETP depuis mars ; attendre coûte de l''argent
    et use les équipes. Si l''éditeur confirme la compatibilité en novembre, nous aurons renoncé à 19
    800 € pour rien, et repoussé de six mois un soulagement dû aux agents.*


    Il tient sur le coût humain, et je ne le minore pas. Il ne bascule pas la décision : 19 800 € est
    le prix de l''option de sortie sur trois ans, à un moment où la moitié de la capacité technique disparaît
    et où la question technique centrale est sans réponse. Et une remise qui ne survit pas à une question
    écrite de 48 h est un instrument de négociation, pas un prix — nous pouvons en demander la prorogation,
    et son refus sera lui-même une information.


    **Ce qui renverserait mon avis :** un engagement écrit de l''éditeur, daté et assorti d''une clause
    de remédiation, établissant la compatibilité v4 avec les bornes de 2015 — **et** des journaux applicatifs
    montrant des pertes réelles, réparties sur les sept sites et corrélées à la version de mars. Les deux
    ensemble, pas l''un des deux. À l''inverse, des journaux montrant des pertes concentrées sur le seul
    Rive-Sud désigneraient février (fibre ou portail) et disqualifieraient la v4 comme réponse.


    ---


    ## VI. Ce que j''engage sous quinze jours


    | # | Action | Livrable | Porteur |

    |---|---|---|---|

    | 1 | Demander à l''éditeur l''extraction des journaux du module de réservation, 12 mois, **par site**
    | Taux de pertes mesuré, ou refus écrit — les deux sont exploitables | Informatique |

    | 2 | Question écrite à l''éditeur : compatibilité v4 / bornes 2015, réponse ferme, datée, avec clause
    de remédiation | Courrier + réponse | Direction |

    | 3 | Demander par écrit la prorogation de la remise au-delà du 30 | Réponse écrite | Direction |

    | 4 | Appeler Fontaine : pertes constatées mais non signalées ? Comptage manuel sur 15 jours | Relevé
    Fontaine + Rive-Sud, même protocole | Chefs de site |

    | 5 | Chiffrer la ressaisie Rive-Sud en euros et l''inscrire au budget | Ligne budgétaire | Finances
    |

    | 6 | Obtenir du réseau voisin un retour factuel : pourquoi 2 sites sur papier à 14 mois | Compte
    rendu d''échange | Chargé de mission |

    | 7 | Sonder les conditions d''une reconduction 6–12 mois | Proposition tarifaire écrite | Direction
    |


    Les points 1, 2 et 4 sont ceux qui produisent de la preuve. Les autres sécurisent la marge de manœuvre.


    ---


    ## VII. Repli


    **Déclencheur observable :** si, au **30 septembre**, l''éditeur n''a pas répondu par écrit sur la
    compatibilité v4 (point 2), la v4 est retirée de l''arbitrage — pas reportée, retirée — et la reconduction
    courte est signée sans elle.


    **Second déclencheur :** si le relevé du point 4 fait apparaître des pertes mesurées sur quatre sites
    ou plus, le sujet cesse d''être un différend d''exploitation et devient un manquement contractuel
    : la voie est la mise en demeure, pas la migration payante.


    **Aucune reprise automatique.** Toute évolution de cet avis repasse devant le comité.


    ---


    **Ce que je demande à la séance :** un mandat pour ne pas signer avant le 30, et la validation des
    sept engagements ci-dessus. Le dossier ne contient aujourd''hui aucune pièce permettant de dépenser
    31 000 € ni d''engager trois ans. Il en contiendra dans quinze jours.

    '
