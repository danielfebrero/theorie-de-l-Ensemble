response:
  text: '## Les trois lignes


    ```

    B2 tourne cette nuit. J''ai commande la roue (Nantes) a 21h50: dispo ~12h. Relever vibration B2 toutes
    les 30 min.

    ARRET B2 si vib >=11,8 mm/s, +0,3/30min, bruit ou odeur. Sinon arret programme des Text >= -7C. Gaz
    100% en continu.

    B2 arretee: delestage logements par sous-stations pour tenir hopital+EHPAD >40C; prevenir astreinte
    + les 2 sites.

    ```


    113, 116 et 114 caractères. Sans accents : la GTC ne les rend pas toujours, et un caractère mal affiché
    sur une consigne d''arrêt est un caractère de trop.


    ## Pourquoi B2 reste en marche


    Le point décisif est que la centrale est **déjà à fond** : 12 MW fournis = 7 (B2) + 5 (gaz). Il n''y
    a aucune réserve. Arrêter B2 à 21h40 ne dégrade pas le réseau, il l''effondre : 5 MW pour une demande
    qui monte au-dessus de 12 MW à −14 °C, soit plus de la moitié manquante, avec certitude, sur le créneau
    le plus froid, et l''hôpital et l''EHPAD de bout de réseau touchés en premier. C''est le seul scénario
    où le dommage est certain et immédiat.


    Maintenir B2 expose à une casse. En reprenant la fenêtre constructeur (6 à 40 h de fonctionnement)
    et les ~5 h 40 déjà courues depuis 16 h, la nuit amène B2 vers 16 h de marche — de l''ordre de 30
    % de risque si on lit la fourchette uniformément, ce que le constructeur ne garantit pas. Et si la
    casse survient, la pénurie de la nuit est la même que dans l''option « arrêt immédiat », **plus**
    neuf jours. L''arrêt immédiat achète donc un mal certain pour éviter un mal probable de même nature.


    Ce qui rend l''écart supportable, c''est la commande de la roue ce soir. Elle ne coûte qu''une pièce
    et un transport, elle est réversible, et elle transforme « B2 tourne » en « B2 revient à midi » au
    lieu de « B2 revient dans neuf jours ». C''est la première action, avant même la main courante, et
    elle ne dépend d''aucune décision de nuit.


    Le seuil d''arrêt est fixé à 11,8 et non à 12 mm/s : il faut de la marge pour un arrêt propre. Une
    roue arrêtée avant la casse conserve le délai de 14 h ; une roue cassée le détruit.


    ## Ce qui renverserait le choix


    Un franchissement de 11,8 mm/s, ou une montée de 0,3 mm/s en une demi-heure. À ce moment la casse
    n''est plus une probabilité mais une trajectoire, et l''arrêt propre reprend l''avantage — c''est
    exactement ce que la ligne 2 délègue aux techniciens, sans m''attendre.


    Serait aussi renversante une information que je n''ai pas : une capacité de chaufferie mobile mobilisable
    dans la nuit, ou une autonomie thermique propre à l''hôpital. Si l''hôpital a sa production de secours,
    l''ensemble le plus exposé change et l''arrêt anticipé redevient discutable. À vérifier dès la reprise.


    ## Deux points à trancher explicitement


    La ligne 3 mentionne une astreinte. Le poste n''a pas été décrit dans la consigne que j''ai reçue
    : je suppose qu''un cadre d''astreinte existe et qu''il est joignable, puisque ma propre indisponibilité
    ne peut pas laisser deux techniciens seuls face à un arrêt de 7 MW. Si ce poste n''existe pas, la
    ligne 3 est à corriger avant affichage avec un numéro réel — sinon elle renvoie vers le vide.


    Le délestage des logements sur décision de nuit engage un service à 4 200 abonnés. Les techniciens
    l''exécuteront parce que je l''ai écrit, mais l''autorisation de couper des abonnés ne se transmet
    pas par une main courante : elle appartient à l''exploitant ou à l''autorité concédante. J''écris
    la ligne parce qu''à 4 h du matin l''alternative est pire, et je signale que cette délégation doit
    être confirmée par qui a le pouvoir de l''accorder — pas présumée acquise du fait que je suis responsable
    d''exploitation.

    '
