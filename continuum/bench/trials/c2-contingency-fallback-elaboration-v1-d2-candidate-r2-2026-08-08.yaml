    ---


    # Bardane — Plan d''exécution de la conversion électrique

    **Direction de l''exploitation — conseil de jeudi**


    La conversion est votée, la commande est ferme. Ce document ne la discute pas : il dit comment 96
    tournées par jour continuent d''être livrées pendant qu''elle se déroule, et comment les 620 000 €
    sont sécurisés.


    ## 1. Les quatre décisions demandées jeudi


    | # | Décision | Montant | Échéance |

    |---|---|---|---|

    | **D1** | Notifier au loueur la **prolongation de la totalité des lots diesel**, au mois le mois
    | 46 080 €/mois pour 96 véh. — plafond **250 000 €** | **Vendredi** (préavis 30 j) |

    | **D2** | Commander les **8 bornes devisées** | **210 000 €** | Vendredi (7 semaines de travaux)
    |

    | **D3** | Pré-autoriser une **2ᵉ tranche de 8 bornes**, sur critère | **210 000 €** conditionnels
    | Arbitrage 15 sept., butoir 15 nov. |

    | **D4** | **Enveloppe de sécurisation subvention** | **300 000 €** conditionnels | Jusqu''au 31 déc.
    |


    D1 est la plus urgente et la moins chère. Un diesel prolongé coûte 480 €/mois, soit 0,53 tournée non
    terminée. Un diesel rendu ne revient pas avant 11 semaines.


    ## 2. La contrainte qui commande le plan : la recharge, pas l''autonomie


    L''attention se porte spontanément sur les 260 km annoncés contre 232 mesurés et 197 par 2 °C. Ce
    n''est pas là que le plan casse.


    `Temps de charge = 6 h × km / autonomie réelle du jour`


    | Tournée | Doux (232 km) | 2 °C (197 km) |

    |---|---|---|

    | 140 km | 3 h 37 | 4 h 16 |

    | **168 km (moyenne)** | 4 h 21 | **5 h 07** |

    | 190 km | 4 h 55 | 5 h 47 |

    | **240 km (plus longue)** | 6 h 12 | **hors de portée** |


    Capacité, fenêtre nocturne de 12 h (17 h 30 – 05 h 30) :


    | Bornes | h-borne/nuit | Véh. @168 km doux | Véh. @168 km à 2 °C |

    |---|---|---|---|

    | **14 (aujourd''hui)** | 168 | 38 | **32** |

    | **22 (après D2)** | 264 | 60 | **51** |

    | 30 | 360 | 82 | 70 |

    | 41 | 492 | 113 | **96** |


    Trois conséquences, à énoncer telles quelles :


    1. **Les 14 bornes actuelles ne portent que ~32 véhicules en hiver.** La livraison de septembre (24)
    passe ; celle d''octobre, non.

    2. **Les 22 bornes ne portent 60 véhicules en janvier que si ces 60 roulent sur les tournées les plus
    courtes.** À kilométrage moyen, la capacité tombe à 51. C''est l''écart qui met la subvention en jeu
    — et c''est un problème d''affectation avant d''être un problème d''investissement.

    3. **La flotte complète demande ~41 bornes en hiver**, soit 19 de plus que budgété (≈ 500 000 €, hors
    renforcement de puissance). La commande de 3,1 M€ a été passée en face d''un plan d''infrastructure
    qui couvre à peu près la moitié de la flotte. Ce n''est pas un motif de revenir sur la commande ;
    c''est une ligne à rapporter au conseil avant le 30 septembre.


    **Levier gratuit, appliqué immédiatement :** affecter les VE aux tournées les plus courtes, par ordre
    croissant. Il ne coûte rien et vaut plusieurs bornes.


    ## 3. Règles d''exploitation


    **R1 — Plafond.** Aucun VE au-delà de **190 km**. Les 11 recharges non prévues de l''essai (11/120)
    sont toutes survenues au-delà de ce seuil.


    **R2 — Plafond hivernal.** Température matinale prévue < 5 °C → plafond **160 km** (190 × 197/232
    = 161). Bascule automatique décidée la veille à 17 h, pas au cas par cas.


    **R3 — Affectation par longueur croissante.** Les 96 tournées sont classées une fois pour toutes ;
    le VE n° *n* prend la tournée n° *n*. Les tournées de queue restent diesel.


    **R4 — Nuit de charge dimensionnée.** Créneau nommé par véhicule, calculé sur le besoin réel + 20
    % de marge, pas sur une charge à 100 %. Les bornes sont inoccupées de 06 h à 17 h : les tournées finissant
    avant 14 h basculent sur un créneau de jour — capacité nocturne libérée sans investissement.


    **R5 — Aucun diesel rendu sans preuve.** Restitution seulement après **15 jours ouvrés consécutifs**
    du VE repreneur à 100 % de tournées terminées et zéro recharge non prévue. Une livraison ne déclenche
    jamais à elle seule une restitution.


    **R6 — Test forcé, sous filet.** En octobre puis en janvier, 6 VE délibérément engagés sur des tournées
    de 190–232 km, diesel en réserve immédiate. Mesurer la limite plutôt que l''éviter — sans quoi le
    plafond ne sera jamais relâché et nous paierons deux flottes indéfiniment.


    ## 4. Calendrier


    | Période | Livrés | En service | Diesels gardés | Actions |

    |---|---|---|---|---|

    | Semaine du conseil | 0 | 0 | 96 | D1 loueur · D2 bornes · demande écrite Région · audit de puissance
    |

    | Fin août | 0 | 0 | 96 | Histogramme des 96 tournées · dénominateur de l''essai · classement figé
    |

    | Septembre | 24 | 24 | 96 | Mise en service 8/semaine. **Aucune restitution.** |

    | **15 sept.** | — | — | — | **Arbitrage D3** |

    | 1ᵉʳ octobre | 24 | 24 | 96 | 22 bornes en service |

    | Octobre | 48 | 40–48 | 72–96 | Premières restitutions sur R5 · test forcé R6 |

    | Novembre | 72 | **60 visés** | 48–72 | Bascule R2. **Cible atteinte fin novembre, deux mois d''avance.**
    |

    | 15 nov. | — | — | — | Butoir de commande tranche 2 |

    | **15 déc.** | 96 | **≥ 55 exigés** | — | Sous 55 → déclenchement D4 |

    | Janvier | 96 | 60–70 | 26–36 | Constat Région · aucune restitution avant le dégel |

    | T1 suivant | 96 | montée | décroissant | Recoupe des tournées longues · dossier bornes phase 2 |


    La cible de 60 est datée **fin novembre**, pas fin janvier. Les deux mois d''écart ne sont pas négociables
    : ils absorbent un retard de livraison, un retard de bornes, ou une vague de froid.


    ## 5. Restitution des diesels


    Le loueur reprend au fil des livraisons. Nous ne suivons pas ce rythme.


    - Prolonger 1 diesel 1 mois : **480 €** = 0,53 tournée non terminée.

    - Ce même diesel, sur 21 jours ouvrés, peut éviter jusqu''à 21 échecs : **18 900 €**.

    - Une restitution prématurée est verrouillée **11 semaines** (≈ 55 jours ouvrés). Si elle laisse 10
    tournées sans véhicule : 10 × 900 € × 55 = **495 000 €**, hors clients perdus.

    - Prolonger ces mêmes 24 véhicules 3 mois : **34 560 €**.


    **Rapport de 14 pour 1.** Le diesel est conservé par défaut ; c''est la restitution qui doit être
    justifiée par une preuve, jamais l''inverse.


    Cycle : le 1ᵉʳ de chaque mois, le lot repris 30 jours plus tard est arbitré sur les 20 derniers jours
    ouvrés de tableau de bord.


    **À négocier avec le loueur cette semaine :** un engagement ferme de prolongation de 3 mois sur un
    lot identifié, contre une réduction du délai de reprise de 11 semaines ou une réserve mobilisable
    sous 15 jours. Nous achetons de la certitude, il achète de la visibilité — seule variable du dossier
    où les deux parties gagnent.


    ## 6. Sécuriser les 620 000 €


    **Critère D3, arbitré le 15 septembre :** si la moyenne kilométrique des 60 tournées les plus courtes
    dépasse **145 km**, les 22 bornes ne portent pas 60 véhicules en janvier → 2ᵉ tranche commandée le
    jour même. 7 semaines → bornes en service début novembre. Butoir absolu : 15 novembre.


    **Ambiguïté à lever par écrit dès vendredi :** « 60 véhicules roulent » n''est pas défini. Immatriculés
    ? Réceptionnés ? En service commercial un jour donné, ou sur une période continue ? Et quelle pièce
    probante la Région exige-t-elle ? Notre télémétrie produit tout, encore faut-il savoir quoi produire.
    Coût de la question : nul. Coût de l''erreur : 620 000 €.


    **Enveloppe D4.** Si au 15 décembre moins de 55 VE sont en service : location de bornes rapides mobiles,
    équipe de nuit pour étaler la fenêtre au-delà de 12 h, ou recoupe accélérée. Dépenser jusqu''à 300
    000 € pour sécuriser 620 000 € reste positif de 320 000 €. Au-delà, le calcul se referme et il faut
    renoncer à la subvention plutôt qu''à la fiabilité.


    ## 7. Tableau de bord, seuils, repli


    Le tableau de bord du soir devient l''instrument de pilotage, sans développement nouveau. Deux ajouts
    demandés au superviseur : état de charge au retour, et marge kilométrique restante par tournée.


    | Palier | Signal (7 j glissants, par plateforme) | Action |

    |---|---|---|

    | **Vert** | 100 % terminées **et** ≤ 1 recharge non prévue | Restitutions du lot suivant confirmées.
    Après 4 semaines vertes, plafond R1 relevé à 205 km. |

    | **Orange** | 2–4 recharges non prévues **ou** taux 98–99,5 % | Restitutions gelées. Plafond 190
    → 175 km (160 → 150 en hiver). Prolongation notifiée sous 48 h. |

    | **Rouge** | ≥ 5 recharges **ou** taux < 98 % **ou** 2 tournées non terminées le même jour | Arrêt
    de toute restitution. Prolongation de tous les lots. Retour au diesel sous 24 h. Compte rendu au conseil
    sous 7 jours. |


    Le palier ne redescend jamais automatiquement : retour au vert après un rouge = 10 jours ouvrés propres.


    **Détection avant l''incident :** un véhicule rentrant sous 15 % d''état de charge n''a pas manqué
    sa tournée, mais il a consommé la marge. Trois occurrences en une semaine sur une même tournée → reclassement,
    sans attendre un échec.


    ## 8. Budget


    | Poste | Montant | Statut |

    |---|---|---|

    | 8 bornes (tranche 1) | 210 000 € | À engager vendredi |

    | Prolongations diesel — référence | ≈ 130 000 € | Progressif |

    | Prolongations diesel — plafond | 250 000 € | Enveloppe |

    | 8 bornes (tranche 2) | 210 000 € | Conditionnel 15 sept. |

    | Sécurisation subvention | 300 000 € | Conditionnel 15 déc. |

    | **Engagé jeudi** | **≈ 340 000 – 460 000 €** | |

    | **Conditionnel maximal** | **970 000 €** | |

    | Subvention sécurisée | – 620 000 € | |

    | **Bornes phase 2 (~19) + renforcement puissance** | **≈ 500 000 € + inconnu** | **Non budgété —
    dossier au 30 sept.** |


    **Le renforcement de puissance est le vrai risque de calendrier, plus que les 7 semaines de travaux.**
    22 bornes appellent 484 kW simultanés, 41 bornes en appellent 900. Si la puissance souscrite ne suit
    pas, le délai de raccordement se compte en mois et ne s''achète pas. **Audit lancé vendredi, rendu
    sous 15 jours.** Aucun autre élément du dossier ne peut faire perdre la subvention aussi silencieusement.


    ## 9. Ce que nous ne savons pas encore


    | Inconnue | Source | Délai | Effet |

    |---|---|---|---|

    | Distribution des longueurs des 96 tournées | Interne | 48 h | Détermine le nombre de VE possibles
    et D3 |

    | Combien des 120 tournées de l''essai dépassaient 190 km | Essai mars | 48 h | Si peu, le taux d''échec
    sur tournées longues est bien supérieur à 9 % → plafond à abaisser |

    | Conditions de l''essai (température, chargement) | Essai mars | 1 sem. | Recalibre R1/R2 |

    | Consommation réelle en kWh/km | Télémétrie | 1 sem. | Remplace le modèle du §2 par une mesure —
    refait la table de capacité |

    | Définition de « roule » + pièce probante | Région, écrit | 1–2 sem. | 620 000 € |

    | Puissance souscrite et délai de renforcement | Gestionnaire réseau | 2–8 sem. | Peut rendre la tranche
    2 inopérante à temps |


    Les quatre premières sont dans nos murs, dues avant fin août. Tant que l''histogramme n''est pas produit,
    tout chiffre d''affectation de ce plan est une hypothèse déclarée comme telle.


    ## 10. La meilleure objection à ce plan


    > *« Conserver les diesels et plafonner à 190 km revient à payer deux flottes et à ne jamais éprouver
    la capacité réelle des véhicules. On repoussera la difficulté jusqu''en mars, où l''on découvrira
    que quarante tournées ne passent pas — après avoir dépensé 130 000 € de location pour ne rien apprendre.
    »*


    Elle porte sur un point : un plan uniquement prudent n''apprend rien. D''où **R6** et le critère explicite
    de relâchement (quatre semaines vertes → 205 km). La prudence est datée et réversible ; elle n''est
    pas un état permanent.


    Elle ne porte pas sur le reste. Nous ne payons pas deux flottes complètes : nous payons une assurance
    dont l''échelle est connue (480 €/véhicule/mois, plafonnée à 250 000 €) contre un risque dont l''échelle
    est connue aussi (495 000 € et la relation client, verrouillés 11 semaines). Aucune information disponible
    jeudi ne renverse ce rapport.


    ## 11. Ce qui ferait changer ce plan


    **Resserré si** — sur 10 jours ouvrés consécutifs, les deux plateformes affichent 100 % de tournées
    terminées, zéro recharge non prévue, état de charge au retour > 30 %. Plafond relevé, restitutions
    accélérées, tranche 2 annulée.


    **Arrêté si** — l''histogramme montre moins de 60 tournées sous 160 km. Les 60 véhicules requis ne
    peuvent alors pas rouler en janvier avec 22 bornes, quelle que soit l''affectation : la tranche 2
    devient obligatoire et la recoupe des tournées démarre en septembre.


    **Renversé si** — l''audit conclut à un renforcement de puissance de plus de 12 semaines. La séquence
    de bornes ne tient plus, la cible de novembre non plus, et la question devient : renoncer à la subvention,
    ou financer une charge provisoire. Tranchée avant le 30 septembre, pas en décembre.


    ## 12. Première action


    **Vendredi matin, avant toute autre chose :** notification écrite au loueur de la prolongation de
    la totalité des lots. Le préavis est de 30 jours, il n''y a pas de deuxième occasion de le poser,
    et un lot non prolongé se verrouille pour 11 semaines. Cette notification n''engage aucune dépense
    irréversible — elle achète le droit de décider plus tard, avec des données que nous n''avons pas encore.


    ---


    Deux points à signaler avant jeudi, parce qu''ils ne figuraient pas dans le dossier :


    - **La contrainte est la recharge, pas l''autonomie.** Le débat naturel portera sur les 260 km annoncés
    contre 232 mesurés ; le mur réel est à 14 bornes pour 32 véhicules en hiver, et à 22 bornes pour 51.

    - **Je n''ai pas la distribution des longueurs des 96 tournées**, et c''est elle qui décide si les
    60 véhicules de janvier tiennent sur 22 bornes. Elle est disponible en interne sous 48 h ; les chiffres
    d''affectation du §4 sont conditionnels à ce relevé et présentés comme tels.

    '
