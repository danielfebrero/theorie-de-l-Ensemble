  text: 'L''écriture du fichier n''a pas été autorisée — voici la position directement.


    # Note de position — Lot F-2418


    **Méthode.** Chaque fait porte le numéro de sa pièce. Ce qu''aucune pièce n''établit n''est pas affirmé
    : ces points figurent en lacunes, avec la pièce à constituer.


    **Deux documents distincts.** La note ci-dessous, pour l''assureur, expose tout, y compris le défavorable.
    Le courrier au dépôt satisfait l''obligation des huit jours sans reprendre les concessions : celles-ci
    relèvent de l''expertise contradictoire. Règle cardinale — ne rien affirmer au dépôt que nos propres
    pièces contredisent. L''aveu de la matérialité d''un fait ne vaut pas reconnaissance de responsabilité
    (art. L. 124-2 c. assur.) : c''est ce qui permet d''être exact sans être engageant.


    ## Chronologie établie


    | Heure | Fait | Pièce |

    |---|---|---|

    | 6 h 25 | Fin de chargement, produit à 3 °C | P1 |

    | 6 h 40 | Mention manuscrite « départ » | P2 — **contredite par P3** |

    | 9 h 05 | Mise sous tension du groupe froid, rien avant | P5 |

    | 9 h 05 → | Relevés 2,9–3,6 °C, dans la plage | P5 |

    | 11 h 12 | Sortie effective du site | P3 |

    | 12 h 55 | Arrivée dépôt, 1 792 barquettes | P4 |


    **2 h 40** sans froid ni enregistrement · **4 h 47** d''immobilisation chargé sur site · **1 h 43**
    de trajet · **48 barquettes** d''écart (P2 : 1 840 / P4 : 1 792).


    ## 1. Ce que l''entreprise reconnaît


    La livraison du lot le 3 juin (P2, P4). La fin de chargement à 6 h 25, produit à 3 °C (P1). **L''absence
    de production de froid et de tout enregistrement entre 6 h 25 et 9 h 05** (P1 + P5, ce dernier par
    son silence même) : le chargement a été fait dans une caisse dont le groupe n''était pas en marche.
    **L''immobilisation jusqu''à 11 h 12** (P3). **L''inexactitude de la mention « départ 6 h 40 »** (P2)
    au regard de l''horodatage automatique (P3) — l''entreprise ne s''en prévaudra à aucun stade et le
    signale à son assureur sans attendre. Le manquement au protocole interne que révèlent ces points.


    Sont reconnus des **faits matériels** et un **manquement de procédé**. Ni la causalité, ni le montant.


    ## 2. Ce que l''entreprise conteste


    **La causalité.** Aucune pièce n''établit la flore **au départ**. Sans valeur initiale, l''écart à
    l''arrivée n''est pas imputable au seul hiatus : charge initiale, dérive antérieure, ou conservation
    au dépôt entre 12 h 55 et le prélèvement — période qu''aucune pièce ne documente.


    **La valeur probante de P6.** Analyse unilatérale. Ni PV de prélèvement, ni scellés, ni échantillon
    témoin, ni méthode normalisée, ni accréditation, ni incertitude de mesure. Grandval non convoquée.
    Trois unités sur 1 840 sans plan d''échantillonnage opposable.


    **La qualification.** La flore mésophile est un critère d''**hygiène des procédés**, non de sécurité
    des denrées (règl. CE 2073/2005). Aucun pathogène recherché. Le dépassement — 0,62 log — ne caractérise
    pas à lui seul une denrée impropre justifiant une destruction totale.


    **La destruction.** Aucun PV, aucun bordereau, aucune date. Opérée sans mise en demeure ni possibilité
    de constat : le dépôt s''est privé, et nous a privés, de toute contre-analyse. Cela affaiblit la démonstration
    dont il a la charge.


    **Les quantités.** Le BL à 1 840 est signé **par son propre réceptionnaire**. 48 unités inexpliquées,
    et aucune pièce ne dit combien ont été détruites.


    **Les 21 400 €.** Aucune pièce : pas de décomposition, pas de facture, pas de clause pénale produite,
    rien sur la limitation du préjudice.


    ## 3. Lacunes — à instruire, non à affirmer


    Contrat et annexes (**P8**, J+4) · flore au départ par analyse sur échantillons témoins (**P9**, J+2)
    · motif de l''immobilisation, P7 n''existant qu''oralement → attestations art. 202 CPC (**P10**, J+2)
    · **statut du chauffeur** (**P12**, J+1) · relevé Météo-France (**P11**) · date de réception de la
    réclamation, qui déclenche le délai (**P13**, J+1).


    Deux hypothèses non affirmées, à valider : les relevés sont dans la plage **dès 9 h 05, sans courbe
    de descente** (P5), ce qui *suggère* que la masse chargée à 3 °C n''a pas dérivé — mais l''appareil
    mesure l''air, pas le cœur ; et une immobilisation de 4 h 47 suivie d''un trajet de 1 h 43 pour une
    arrivée à 12 h 55 est compatible avec un créneau imposé en début d''après-midi.


    **Urgence.** Si le transport a été confié à un tiers, le contrat type « température dirigée » met
    à sa charge la présentation d''un véhicule prérefroidi — l''absence de mise sous tension lui serait
    prima facie imputable. Mais la protestation motivée court à trois jours (L. 133-3 c. com.) et la prescription
    est annale. **Ce point conditionne l''existence d''un recours et se périme : il passe avant tout.**


    ## 4. Ce qui est engagé sous huit jours


    Décompte à partir de la réception de la réclamation ; deux jours de marge conservés.


    **J+1** — statut du chauffeur, réserves de recours le jour même si transporteur tiers · déclaration
    de sinistre avec P1–P7 numérotées et le bordereau de lacunes · **mise sous scellés des échantillons
    témoins**, gel de toute destruction interne · établissement de P13.

    **J+2** — analyses sur témoins, labo accrédité, flore + pathogènes · attestations écrites chauffeur,
    opérateur de quai, responsable d''expédition · extraction certifiée du journal du portique avec attestation
    d''intégrité de l''horodatage, P3 étant notre pièce la plus solide · relevé météo.

    **J+3** — revue des autres expéditions de la semaine : même véhicule, même opérateur, même séquence.

    **J+4** — versement du contrat. **J+5** — validation par l''assureur. **J+6** — envoi du courrier,
    LRAR et courriel avec AR.


    **Correctifs immédiats**, sans attendre l''issue : chargement bloqué tant que le groupe n''est pas
    en marche et l''enregistreur sous tension ; suppression de la saisie manuelle de l''heure de départ,
    remplacée par la reprise automatique du portique ; alerte si l''écart chargement–sortie dépasse 30
    minutes. À documenter pour l''assureur : cela relève de la limitation du risque.


    **À ne pas faire :** aucun paiement, aucun avoir, aucune régularisation commerciale, même partielle
    — ce serait acquiescer au principe et au montant.


    ## 5. Position financière


    Aucun chiffre avant P9 et les justificatifs. Cadre indicatif, sous accord de l''assureur : *marchandise*
    discutable sur le fond si la causalité est confirmée, mais dans la limite de la quantité établie comme
    détruite — aujourd''hui étayée par aucune pièce ; *transport* subordonné aux factures ; *rupture d''assortiment*
    contestée en son principe tant que la clause n''est pas produite.


    ## 6. Courrier au dépôt — structure


    Réponse dans le délai contractuel, sous toutes réserves, sans reconnaissance de responsabilité, assureur
    saisi. Mention que la séquence d''expédition fait l''objet d''une vérification interne dont aucun
    résultat ne sera dissimulé à l''expert — ni plus, ni moins. Contestation sur les six motifs du § 2.
    Demande sous quinzaine : PV de prélèvement et rapport complet ; PV de destruction et bordereau d''élimination
    ; détail chiffré des 21 400 € ; **relevés de température de leur chambre froide entre 12 h 55 et le
    prélèvement** ; explication de l''écart de 48 unités ; **créneau de livraison attribué le 3 juin**
    ; clause fondant la pénalité. Proposition d''expertise amiable contradictoire à frais partagés, et
    mise en demeure de conserver tout élément subsistant.


    ---


    Deux points sur lesquels je serais net auprès de la direction. Le dossier est défavorable sur les
    faits, et il l''est par **nos** pièces : c''est précisément pourquoi la divulgation contrôlée est
    la seule stratégie tenable — si le dépôt obtient P3 et P5 en expertise après nous avoir vus invoquer
    « 6 h 40 », la crédibilité tombe sur l''ensemble, y compris sur les contestations solides, qui sont
    nombreuses. Et le statut du chauffeur commande tout le reste : c''est la seule action dont la fenêtre
    se ferme en jours.

    '
