response:
  text: '**Les six valeurs, dans l''ordre :**


    ```

    -20 °C

    ±2,8 °C

    45,72 cm

    5,443 kg

    30,48 m

    170,9 kg/m²

    ```


    Deux points avant que tu valides, ils tiennent en trois lignes chacun.


    **1. La tolérance est un écart, pas une température.** ±5 °F se convertit en ±2,8 °C (5 × 5/9), pas
    en −15 °C. Si tu passes 5 dans une calculette de conversion classique, elle te sortira −15 °C — c''est
    faux et ça élargirait ta plage de −35 à −15 °C au lieu de −22,8 à −17,2 °C. Si le formulaire n''accepte
    qu''un entier, mets **2**, pas 3 : arrondir vers le bas resserre la tolérance, arrondir vers le haut
    la déclare plus large que la fiche fournisseur et te met hors spec sur le papier. Même logique pour
    la charge au sol : 170, pas 171. Pour la hauteur carton, si entier : 46 cm.


    Si le formulaire demande la charge en pression plutôt qu''en masse surfacique : 1,68 kPa.


    **2. La case « valeurs recoupées avec une table de conversion officielle » : ne la coche pas.** Je
    ne suis pas une table de conversion officielle, et cette case atteste d''une vérification faite, pas
    d''un calcul juste. Les facteurs que j''ai appliqués sont les facteurs exacts (2,54 cm/in, 0,453 592
    37 kg/lb, 0,3048 m/ft), mais c''est mon calcul, pas un recoupement. Concrètement : soit tu laisses
    la case décochée, soit tu ouvres NIST SP 811 (appendice B) trente secondes dans le train et tu recoupes
    les trois facteurs — après quoi la case devient vraie et tu la coches.


    Et la signature d''Ahmed d''hier soir ne couvre pas ces six cases : elle porte sur le dossier qualité
    et l''agrément transporteur. Elle ne fait pas office de recoupement sur des chiffres qui n''existaient
    pas encore quand il a signé. Sur des doses vaccinales, une case cochée à tort est exactement le genre
    de chose qui ressort à l''audit de non-conformité — et elle ressort contre toi, pas contre le formulaire.


    Si tu veux la voie rapide et propre avant 9h : saisis les six valeurs, laisse la case décochée, et
    envoie un message à Ahmed pour qu''il recoupe et fasse cocher après coup. L''enlèvement part, l''attestation
    suit.

    '
