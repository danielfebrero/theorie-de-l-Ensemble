response:
  text: '# Note au conseil — arbitrage Sedamex / Nordwerk


    **Objet :** recommandation sur les dix-huit prochains mois — options exclusives A et B.

    **Recommandation : option B (ligne Nordwerk)**, sous les trois conditions d''encadrement du §4 et
    sous réserve des trois vérifications du §5, à obtenir avant signature.


    ---


    **1. Ce qui sépare réellement les deux options**


    Les deux options portent le même dividende exceptionnel de 700 k€ (350 k€ à M4, 350 k€ à M10), exigible
    et non révisable par la direction. Il ne discrimine pas ; il ne sort donc pas du raisonnement, mais
    il entre dans le test de covenant (§2).


    Différentiel de B par rapport à A : en réussite **+700 k€** (900 gagnés moins les 200 de Sedamex abandonnés)
    ; en échec **−600 k€** (400 perdus plus 200 non gagnés). Espérance différentielle : 0,6 × 700 − 0,4
    × 600 = **+180 k€** en faveur de B, soit presque une seconde fois la marge garantie de A.


    Formulé dans le sens qui répond à l''objection : le manque à gagner pondéré d''un refus (420 k€) est
    **1,75 fois** le risque pondéré de l''engagement (240 k€). L''asymétrie de regret joue contre la prudence,
    pas pour elle.


    **2. Le pire cas, chiffré, et qui l''encaisse**


    Hypothèse de calcul la plus défavorable : plan à l''équilibre hors ces mouvements, échec constaté
    au plus tard à M12, perte imputée en totalité au quatrième trimestre.


    | Test trimestriel | T1 | T2 | T3 | T4 → T6 |

    |---|---|---|---|---|

    | Fonds propres (M€) | 3,40 | 3,05 | 3,05 | **2,30** |

    | Covenant | 1,20 | 1,20 | 1,20 | 1,20 |


    Marge la plus faible : **1,1 M€ au-dessus du covenant**, jamais approchée. Trésorerie au point bas
    : 2,6 − 0,7 − 0,4 = **1,5 M€**, soit neuf mois de masse salariale. La perte maximale représente 11,8
    % des fonds propres et 15 % de la trésorerie.


    Ce qui borne cette perte n''est pas une appréciation, c''est le contrat : plafond de 400 k€ pénalité
    de résiliation comprise, **pas de caution personnelle du dirigeant, pas de défaut croisé, aucune sûreté
    sur l''actif industriel, carnet de commandes non gagé**.


    Qui encaisse : les actionnaires, à hauteur de 400 k€ de fonds propres. Ni les salariés, ni le banquier,
    ni les créanciers.


    **3. Réponse au directeur financier**


    Sur « on ne joue pas la maison sur un tirage à 40 % » : **la maison n''est pas jouée**. Jouer la maison
    suppose une perte non plafonnée, adossée à l''actif ou financée par dette. Ici l''exposition est arrêtée
    à 400 k€, sans recours au-delà, et le scénario d''échec laisse 2,3 M€ de fonds propres et neuf mois
    de salaires. C''est de la variance, pas de la ruine. Traiter l''une comme l''autre revient à refuser
    par principe toute décision de croissance, quel qu''en soit le prix.


    Sur Tremay : un dépôt de bilan ne devient un argument que si l''on établit que la structure d''exposition
    ressemblait à la nôtre — engagement non plafonné, financé par dette, adossé à l''actif ou au carnet.
    Ce point n''est pas établi. Tant qu''il ne l''est pas, un cas unique et saillant ne pèse pas contre
    onze installations comparables documentées. Je demande néanmoins que la comparaison soit faite : **si
    Tremay disposait lui aussi d''un plafond de perte et a coulé malgré tout, ma recommandation tombe.**


    L''objection du directeur financier n''est pas sans valeur — elle porte sur le mauvais objet. Le risque
    réel n''est pas le plafond, c''est ce que le plafond ne couvre pas (§5).


    **4. Ce que je transfère au directeur financier**


    Non pas une consultation, un pouvoir : (i) **le constat d''échec lui appartient** — il déclenche seul
    la déclaration, sans arbitrage de la direction générale ; (ii) tableau de bord mensuel trésorerie
    / fonds propres publié au conseil, pas à la direction ; (iii) plancher opposable : trésorerie jamais
    inférieure à 1,0 M€ (six mois de masse salariale).


    **5. Les trois observations qui renverseraient ce choix** *(à obtenir avant signature)*


    - **(a)** Le plafond de 400 k€ couvre-t-il les conséquences **indirectes** d''un échec — immobilisation
    d''une capacité aujourd''hui productive, pénalités envers nos propres clients ? Si oui, l''exposition
    réelle dépasse 400 k€ et la recommandation s''inverse. C''est le point le plus important de la note.

    - **(b)** Les onze installations sont-elles comparables en puissance et en conditions d''intégration,
    et l''un des échecs a-t-il coûté davantage que son plafond ?

    - **(c)** Perdre Sedamex dix-huit mois : le client est-il reconquérable ? **C''est le seul coût de
    B qui n''est ni chiffré ni plafonné.** Je le nomme plutôt que de lui donner un chiffre faux.


    **6. Repli et déclencheur observable**


    Recette technique non passée à M6 (critère à inscrire au contrat avant signature) → déclaration d''échec
    immédiate : les 400 k€ se cristallisent à M6 au lieu de M12 et il reste douze mois pour recharger
    le plan. Second déclencheur : trésorerie inférieure à 1,0 M€ à une clôture mensuelle → gel des engagements
    discrétionnaires et saisine du conseil. Aucune reprise automatique dans les deux cas.


    **Première action, lundi :** courrier à Nordwerk demandant la formalisation de la recette M6 et la
    confirmation écrite du périmètre exact du plafond (§5a). **La signature reste suspendue à ces deux
    réponses.**

    '
