response:
  text: '# Note au comité — fermetures de magasins

    **Objet : réponse à l''objectif de 300 000 € de résultat**

    **Date : 8 août 2026 — pour la séance de mardi**


    ---


    ## En une phrase


    Aucun des trois magasins ne doit fermer mardi : les trois rapportent de l''argent à l''entreprise,
    et les fermer coûterait 114 000 € de résultat par an plus 1,1 M€ de trésorerie. Les 300 000 € demandés
    ne sont pas dans les magasins, ils sont dans les 6,4 M€ de frais de siège et de logistique.


    ---


    ## 1. Les trois « magasins en perte » rapportent 114 000 € par an


    Le résultat par magasin inclut une part des frais de siège et de logistique. Cette part est **calculée**,
    pas dépensée par le magasin. Elle ne disparaît pas quand le magasin ferme : la direction financière,
    les entrepôts, les systèmes et les fonctions support restent là.


    Ce que chaque magasin rapporte réellement une fois cette part écartée :


    | | Résultat affiché | Part de siège incluse | Apport réel à l''entreprise |

    |---|---|---|---|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |


    Les trois couvrent leurs loyers, leurs salaires et leurs charges, et laissent 114 000 € qui financent
    le siège. Fermer les trois ne fait pas gagner 288 000 € : cela fait **perdre 114 000 €**. L''écart
    à combler passerait de 300 000 € à 414 000 €.


    ## 2. Fermer déplace le problème sur les magasins suivants


    Les 402 000 € de frais de siège attribués à ces trois sites seraient répartis l''an prochain sur les
    16 magasins restants — environ 25 000 € de charge supplémentaire chacun, davantage pour les plus gros.
    Tout magasin qui dégage aujourd''hui moins de 25 000 € basculerait en négatif dans le tableau, sans
    avoir rien changé à son activité. Le comité de l''an prochain aurait alors une nouvelle liste de «
    magasins en perte » à fermer. C''est un mécanisme comptable, pas une dégradation commerciale, et il
    n''a pas de fin.


    ## 3. Les trois cas ne se ressemblent pas


    **Chambéry — hors de question, à tout prix.** L''indemnité de résiliation de 1,1 M€ représente 183
    000 € par an sur les six ans restants, pour supprimer un magasin qui en rapporte 32 000. Le magasin
    du réseau le plus proche est à 92 km : la clientèle ne se reporterait pas, elle serait perdue. La
    perte est définitive et non récupérable. Aucune hypothèse favorable ne rend cette fermeture rentable.


    **Nîmes — deux sujets à ne pas mélanger.** Le magasin rapporte 19 000 €. Les murs valent 1,9 M€ et
    nous appartiennent. Vendre les murs ne suppose pas de fermer le magasin : une cession avec bail en
    retour dégage la trésorerie tout en gardant l''activité. C''est une décision financière, à instruire
    séparément, et qui appelle une question à l''actionnaire (§5).


    **Vitry — le seul cas qui mérite une vraie décision, mais pas mardi.** C''est le seul site dont on
    peut sortir sans indemnité, et le magasin le plus proche est à 14 km. Mais deux choses manquent avant
    de trancher :


    - **18 % des entrées de Vitry sont des retraits de commandes web.** Le magasin supporte la surface,
    le personnel et le stockage de ces retraits ; le chiffre d''affaires correspondant est enregistré
    sur l''entité e-commerce, et Vitry ne facture rien pour ce service. Une partie de sa « perte » est
    un service rendu gratuitement à une autre entité. Fermer Vitry ne supprime pas ces retraits : il faut
    les reloger ailleurs, à un coût que personne n''a chiffré.

    - **Le taux de report vers le magasin à 14 km est inconnu.** Il faudrait qu''il génère plus de 63
    000 € de marge supplémentaire pour que la fermeture soit neutre.


    Le bail court encore 7 mois. La décision est à prendre avant, pas mardi.


    ## 4. Ce qui renverserait cette recommandation


    Une seule chose : que les frais de siège attribués soient réellement supprimables magasin par magasin.
    Le seuil est précis. Il faudrait que la fermeture de Vitry fasse disparaître **plus de 63 000 € des
    181 000 €** qui lui sont imputés, soit plus d''un tiers. Nous ne le croyons pas — mais nous ne l''avons
    pas vérifié ligne à ligne, et c''est vérifiable en trois semaines. Si le contrôle de gestion démontre
    le contraire, la recommandation sur Vitry change.


    Deux points de méthode à retenir contre les arguments qui seront faits en séance :


    - Les compteurs d''entrée comptent des **entrées, pas des acheteurs**, à ±2 % près. Ils ne peuvent
    pas départager deux magasins. Sur Vitry, ils le pénalisent même mécaniquement, puisqu''ils incluent
    les retraits web.

    - La carte de fidélité ne couvre que **23 % des tickets**, et ses porteurs sont les clients les plus
    attachés à l''enseigne. Le fait que 41 % d''entre eux achètent dans deux magasins **surestime** le
    report qu''on obtiendrait en fermant : les 77 % restants sont, par construction, moins susceptibles
    de nous suivre à 14 ou 23 km.


    ## 5. Où sont réellement les 300 000 €


    Dans les 6,4 M€ de frais de siège et de logistique : 300 000 €, c''est **4,7 %** de cette enveloppe.
    C''est le seul gisement de cette taille dans l''entreprise, et c''est le seul dont la réduction ne
    détruit ni chiffre d''affaires ni emploi de terrain de manière irréversible.


    Une question doit être posée à l''actionnaire avant d''aller plus loin : **300 000 € récurrents, ou
    300 000 € sur le seul exercice prochain ?** La réponse change tout. Un résultat ponctuel peut venir
    de la cession des murs de Nîmes ; un résultat récurrent ne peut venir que des charges de structure
    — et la cession des murs le dégraderait, puisqu''elle transformerait un actif détenu en loyer à payer.


    ## 6. Ce que nous demandons au comité de décider mardi


    1. **Aucune fermeture décidée mardi.** Chambéry est retiré de la liste définitivement.

    2. **Poser la question à l''actionnaire** : récurrent ou ponctuel. Réponse attendue sous 15 jours.

    3. **Audit des 6,4 M€** — quelle part est réellement évitable, et à quelle échéance. Porteur : direction
    financière. Livrable : 30 septembre.

    4. **Chiffrer le coût réel des retraits web** supportés par les magasins, et proposer une refacturation
    à l''entité e-commerce. Une semaine de travail. *Attention : au niveau du groupe, cette refacturation
    ne crée pas un euro — elle corrige la lecture par magasin. Elle ne compte pas dans les 300 000 € si
    l''actionnaire raisonne en consolidé.*

    5. **Dossier Vitry** à présenter au comité du 15 octobre, avec le coût de relogement des retraits
    et une estimation du taux de report. Décision au plus tard le 15 novembre, soit deux mois avant l''échéance
    du bail.

    6. **Dossier murs de Nîmes**, instruit comme une opération financière, sans lien avec l''exploitation
    du magasin.


    **Repli.** Si l''audit du siège dégage moins de 150 000 € au 30 septembre, nous revenons devant le
    comité avec un plan de cession d''actifs — et non avec une liste de fermetures, dont ce document montre
    qu''elles aggravent le résultat.


    ## 7. Ce que nous ne saurons pas à temps


    Nous n''avons pas de mesure fiable du report de clientèle. La fermeture de cinq semaines de Nîmes
    en mars 2024 est notre seule observation réelle, mais seuls les totaux mensuels des magasins voisins
    ont été conservés : elle donnera un ordre de grandeur, pas un chiffre, et sur un magasin à 23 km,
    pas à 14. Nous l''exploiterons pour le dossier Vitry en la présentant pour ce qu''elle est.


    L''enseigne n''a jamais fermé de magasin. La première fermeture crée un précédent interne et fixe
    la méthode pour toutes les suivantes. Raison de plus pour que la première, si elle a lieu, repose
    sur un calcul que le comité peut défendre — et non sur un tableau dont les trois lignes rouges sont
    un artefact de répartition.


    Les directeurs et les équipes des trois sites doivent être informés qu''ils sont à l''étude, avec
    le calendrier ci-dessus et une place dans l''instruction du dossier Vitry. Une échéance annoncée et
    tenue est gérable ; une rumeur de six mois ne l''est pas, et coûterait les meilleurs vendeurs avant
    même la décision.

    '
