response:
  text: '## Ce que je propose


    Une position en trois enveloppes, dont une seule est fixe, et un mécanisme de levée qui remplace celui
    de 2022.


    **1. Débit réservé : 180 L/s, non négociable, hors de ma compétence.**

    C''est un arrêté préfectoral — la commission ne peut pas l''abaisser, seul le préfet le peut. Je ne
    demanderai pas de dérogation, et j''explique pourquoi plus bas, parce que c''est la vraie question
    du dossier.


    **2. Eau potable : 120 L/s, avec un plancher garanti de 60 L/s.**

    En baisse de 20 % sur les 150 L/s prélevés. Trajectoire : 100 L/s à J+15, 85 L/s à J+30, conditionnée
    à l''audit décrit ci-dessous.


    **3. Agriculture : le solde, soit 110 L/s aujourd''hui**, alloué en **volume sur huit semaines** (≈
    530 000 m³, 86 mm sur 620 ha) et non en débit constant, avec un plafond hebdomadaire à 150 % du prorata.
    Les maraîchers concentrent l''eau sur les stades critiques ; c''est leur arbitrage, pas le mien.


    Chaque litre récupéré sur le réseau part au champ. C''est le point central, et c''est ce qui casse
    le cadrage « les paysans contre les robinets ».


    ## Pourquoi la régie est la première à devoir ouvrir ses livres


    150 L/s pour 9 200 habitants font **1 409 L/habitant/jour**. La consommation domestique française
    est de l''ordre de 150 L/j, et un réseau au rendement moyen prélèverait ici environ **20 L/s**. L''EHPAD
    ajoute moins de 0,5 L/s. Même en supposant un rendement catastrophique de 30 %, on n''atteint pas
    70 L/s.


    Ce chiffre est donc **inexplicable par les 9 200 habitants seuls**. Trois hypothèses, que je ne tranche
    pas : un périmètre desservi plus large que Ferney, des abonnés non domestiques raccordés, ou des pertes
    majeures. Je demande sous huit jours les volumes mis en distribution et facturés sur douze mois, le
    périmètre réel, la liste des abonnés au-dessus de 5 000 m³/an, et le rendement au sens du descriptif
    de réseau obligatoire.


    En regard, la demande maraîchère est physiquement cohérente : 240 L/s sur 620 ha font 3,3 mm/jour,
    soit environ 70 % de l''évapotranspiration d''une culture légumière en août. Leur chiffre tient ;
    c''est celui de la régie qui ne tient pas. Je le dis dans cet ordre parce que la partie qui refuse
    d''ouvrir la discussion est celle dont le volume est le moins expliqué.


    **Ce que la régie obtient en échange** : un plancher de 60 L/s inscrit dans la décision et jamais
    franchi (soit 563 L/hab/j, quatre fois le besoin domestique), la priorité absolue sur toute ressource
    de secours, et un plan de citernage armé pour l''EHPAD. Quatre jours de réserve, c''est une vulnérabilité
    réelle : leur exigence de garantie est légitime dans son principe, pas dans son montant. Je leur donne
    la garantie, pas le volume.


    Baisses immédiates, sans travaux : arrêté suspendant les usages non prioritaires alimentés par le
    réseau (espaces verts, lavage de voirie, piscines) et modulation nocturne de pression, qui réduit
    les fuites en quelques jours.


    ## Le contre-argument que je dois affronter


    *« 4,1 M€ et 90 emplois contre des truites. Abaissez le réservé. »*


    Arithmétiquement, il fonctionne : sans réservé, 410 L/s couvrent 150 + 240. C''est la seule option
    qui « résout » le problème, et c''est pour ça qu''elle sera proposée jeudi.


    Je la refuse pour trois raisons cumulatives. Elle est illégale sans le préfet. Elle échange une perte
    d''un an, assurable et partiellement compensable, contre une perte que le rapport du 12 juin qualifie
    de non reconstituable à l''échelle d''une décennie — l''asymétrie de réversibilité décide seule. Et
    la partie qui encaisse cette perte est la seule des trois à n''avoir personne dans la salle : je nomme
    dès jeudi la fédération de pêche comme observateur avec droit de saisine si le réservé est franchi.


    J''ajoute que les 4,1 M€ sont un chiffre produit par le demandeur, sans aucune donnée parcellaire
    derrière. Je ne le conteste pas — je le conditionne : il devient une pièce du dossier d''indemnisation,
    pas un argument de séance.


    ## Quotas individuels ou volume global : les deux, à des niveaux différents


    Le volume global par usage est l''instrument des trois enveloppes ci-dessus. Mais un volume global
    **à l''intérieur** de l''enveloppe agricole serait une course à la pompe, que les six exploitations
    détenant 300 ha gagneraient en quelques jours.


    Donc : quotas individuels dans l''enveloppe agricole — mais je n''ai ni compteurs ni données parcellaires,
    et des quotas inapplicables se feront annuler.


    D''où la séquence :

    - **J+0 à J+15** : tour d''eau par secteur, par créneaux horaires. Contrôlable à la vanne et à l''œil,
    sans compteur, cette semaine.

    - **J+8** : le collectif maraîcher me remet sa propre clé de répartition des 110 L/s entre les 34
    exploitations. C''est eux qui détiennent la connaissance des cultures et des stades, pas moi. S''ils
    ne remettent rien, ma clé par défaut s''applique : **un socle égal par exploitation, puis le solde
    à l''hectare, avec un plafond global de 40 % pour les six plus grandes**. Ce socle protège les 28
    exploitations dont la totalité de l''activité est en jeu ; une clé purement surfacique enverrait la
    moitié de l''eau aux six.

    - **J+15** : compteurs télérelevés posés, quotas individuels opposables.


    C''est un transfert de décision, pas une consultation. Les maraîchers ont quitté la salle avant le
    vote ; je leur rends l''arbitrage qui les concerne, avec un délai et un défaut.


    ## Les 600 000 € : acheter de l''eau et de la mesure avant d''acheter du silence


    | Poste | Montant | Ce que ça produit |

    |---|---|---|

    | Recherche de fuites + modulation de pression, réseau Ferney | ~120 k€ | des L/s pour tout le monde
    |

    | 34 compteurs télérelevés + sectorisation régie | ~100 k€ | rend les quotas opposables |

    | Réétalonnage station Sarcelle + piézomètre + point de contrôle aval | ~50 k€ | rend les seuils incontestables
    |

    | Indemnisation maraîchère ciblée | ~300 k€ | socle par exploitation puis hectare |

    | Étude structurelle (REUT, retenues, interconnexion) | ~30 k€ | la campagne prochaine |


    Ordres de grandeur, à fermer sous quinze jours. Les 300 k€ représentent 7 % de la perte annoncée :
    leur fonction n''est pas de réparer, elle est de rendre le respect du tour d''eau rationnel pour les
    petites exploitations. Versement conditionné au respect des créneaux et au dépôt de la déclaration
    parcellaire — le dossier d''indemnisation produit les données qui nous manquent.


    Sur la réutilisation des eaux traitées de la STEP : mentionnée pour la campagne prochaine seulement,
    et avec une réserve — ce rejet alimente probablement déjà l''aval, donc le détourner déplacerait le
    problème sur le réservé plutôt que de le résoudre. À instruire, pas à promettre.


    ## Le mécanisme de 2022 et pourquoi il a échoué


    Un orage produit du ruissellement, pas de la recharge. 48 heures au-dessus du seuil ont mesuré la
    pluie du 9 août, pas l''état de la ressource — d''où le retour à 340 L/s en quatre jours. Le remplacement
    :


    - Levée sur **moyenne glissante 10 jours**, pas sur 48 h.

    - Levée **par paliers** de 25 L/s, avec 7 jours de maintien minimum à chaque palier. Jamais de retour
    intégral.

    - **Cliquet asymétrique** : on restreint sur une moyenne 3 jours en baisse, on relâche sur une moyenne
    10 jours en hausse.

    - **Critère piézométrique** en plus du débit : pas de levée si la nappe ne remonte pas.


    ## Seuils d''arrêt, publiés et observables au quotidien


    - Moyenne 3 jours < 340 L/s : enveloppe agricole divisée par deux.

    - Q < 300 L/s : prélèvements agricoles suspendus.

    - Q < 240 L/s : potable seul, saisine du préfet, citernage armé.

    - Franchissement du réservé au point de contrôle aval : suspension agricole immédiate, sans délibération.


    ## Ce qui me ferait changer d''avis


    Trois observations, que j''annonce avant qu''on me les oppose :


    1. **Si le réétalonnage montre que le débit réel dépasse 410 L/s de plus de 15 %**, les enveloppes
    sont recalculées à la hausse au point hebdomadaire suivant. Les allocations sont d''ailleurs exprimées
    en part du débit mesuré, précisément pour absorber une dérive de la courbe de tarage — une station
    non étalonnée depuis 2023 dérive surtout dans les bas débits.

    2. **Si l''audit établit un rendement de réseau supérieur à 85 % et un périmètre réellement supérieur
    à Ferney**, mon enveloppe de 120 L/s est fausse : elle remonte à 150 et l''enveloppe agricole tombe
    à 80 L/s. Je m''y engage maintenant, publiquement, pour qu''on ne dise pas que je l''ai caché.

    3. **Si les déclarations parcellaires montrent moins de 200 ha en stade critique**, l''enveloppe suffit
    au cœur de la récolte et l''indemnisation est surdimensionnée.


    ## Ce que je dis en séance


    Je ne prétends pas que cette décision est indolore. Les maraîchers demandent 240 L/s et reçoivent
    110 : aucune répartition de 410 L/s ne leur donne ce qu''ils demandent. Le déficit est réel et il
    pèse d''abord sur eux, parce qu''ils sont le seul usage ajustable et indemnisable des trois. Je préfère
    le dire ainsi plutôt que de l''habiller.


    Ce que je refuse, c''est qu''on présente le statu quo comme la prudence. Ne rien décider, c''est attribuer
    la ressource à qui a la plus grosse pompe — les six exploitations qui cultivent 300 ha — et franchir
    le réservé sous quinze jours. C''est la seule option du dossier dont le résultat irréversible est
    certain.


    **Première action, lundi matin** : arrêté de suspension des usages non prioritaires du réseau, mise
    en place du tour d''eau par secteur, et notification à la régie de la demande de pièces à huit jours.

    '
