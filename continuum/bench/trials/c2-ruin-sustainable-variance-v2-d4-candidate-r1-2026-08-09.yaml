response:
  text: '# NOTE AU CONSEIL — séance de vendredi

    **Objet : arbitrage Sedamex (A) / Nordwerk (B), horizon 18 mois — Direction générale**


    ## Recommandation

    **Option B — installation de la ligne Nordwerk**, sous trois conditions suspensives levées avant signature
    (§5).


    ## 1. Le test décisif n''est pas l''espérance de gain, c''est la ruine

    Espérance A : 200 k€ certains. Espérance B : 0,6 × 900 − 0,4 × 400 = **380 k€**. Un écart de 180 k€
    ne justifierait pas, à lui seul, un engagement irréversible de dix-huit mois. Ce qui le justifie,
    c''est que la branche défavorable de B ne met en cause aucune continuité. Scénario le plus défavorable
    — échec constaté, 400 k€ exigibles, les deux acomptes de dividende versés (en k€) :


    | | Fonds propres | Trésorerie |

    |---|---|---|

    | Situation de départ | 3 400 | 2 600 |

    | − dividende exceptionnel (350 + 350) | 2 700 | 1 900 |

    | − plafond de perte Nordwerk | **2 300** | **1 500** |

    | Covenant bancaire | 1 200 | — |

    | **Marge** | **+1 100** | **9 mois de masse salariale** |


    Que la perte soit provisionnée dès qu''elle devient probable ou décaissée au douzième mois, le test
    trimestriel donne le même résultat. Pour approcher le covenant, il faudrait une perte de 1,5 M€ —
    **3,7 fois le plafond contractuel**. Le contrat l''interdit : pas de caution personnelle, pas de défaut
    croisé, aucune sûreté sur l''actif industriel, carnet de commandes non gagé. Le pire cas est borné,
    financé d''avance par la trésorerie existante, et encaissé par les seuls actionnaires. Ni les salariés,
    ni le banquier, ni les clients ne sont exposés.


    ## 2. Robustesse de l''hypothèse

    B ne l''emporte sur A que si la probabilité de succès dépasse **46,2 %** (900p − 400(1−p) = 200).
    Le bureau d''études l''estime à 60 % sur onze installations documentées : **il peut se tromper de
    quatorze points et la recommandation tient encore**. À 50/50, B rapporte encore 250 k€ contre 200.
    C''est cette marge d''erreur, et non le chiffre central, qui fonde le choix.


    ## 3. Réponse au directeur financier

    Son principe est juste, il ne s''applique pas ici. « On ne joue pas la maison » suppose que la maison
    soit sur la table : elle ne l''est pas. Le maximum exposé est 400 k€, soit 11,8 % des fonds propres
    et 15,4 % de la trésorerie. Refuser une exposition plafonnée à 12 % des fonds propres, contre une
    espérance supérieure, n''est pas de la prudence.


    Sur Tremay : un cas ne fait pas une base. La question n''est pas « un concurrent a-t-il échoué sur
    une ligne neuve », mais « son exposition était-elle plafonnée ». Une PME ne dépose pas le bilan parce
    qu''un investissement échoue ; elle dépose parce que l''échec est financé par de la dette assortie
    d''un défaut croisé, garanti personnellement, ou non borné. Nous n''avons aucun des trois. Si le dossier
    Tremay révèle au contraire une structure comparable à la nôtre — perte plafonnée, sans dette —, je
    révise ma recommandation.


    ## 4. Ce que je transfère au directeur financier

    Non une consultation, trois pouvoirs réels :

    - **Cantonnement de 400 k€** sur compte dédié dès la signature, sous sa seule signature : le plafond
    est financé au jour 1, pas espéré.

    - **Le tableau de bord technique mensuel lui appartient**, sur jalons fixés par écrit par le bureau
    d''études avant signature.

    - **Il détient le droit de déclencher seul la constatation d''échec** dès qu''un jalon est manqué,
    sans arbitrage de la direction. Celui qui porte l''objection tient la gâchette du repli.


    ## 5. Conditions suspensives — avant signature

    1. **Vérification juridique** que les 400 k€ constituent un plafond réellement total : pénalité, capex
    non amorti, démontage, remise en état, coûts de personnel et immobilisation du BFR compris. Tout coût
    hors plafond annule la recommandation.

    2. **Confirmation écrite du banquier** qu''aucune autre jambe (trésorerie minimale, ratio d''EBITDA)
    n''accompagne le covenant de fonds propres.

    3. **Jalon technique du mois 6** défini par écrit par le bureau d''études, valant constatation d''échec
    s''il est manqué.


    ## 6. Repli et déclencheur

    Jalon du mois 6 manqué → constatation d''échec immédiate, 400 k€ cristallisés à cette date plutôt
    que différés, équipe rebasculée, réouverture de la discussion avec Sedamex. Revue au conseil dès que
    la projection de fonds propres au trimestre suivant passe sous 1,6 M€ (400 k€ au-dessus du covenant).


    ## 7. Ce qui renverserait ce choix

    Un plafond de 400 k€ qui fuit ; un covenant assorti d''une jambe non communiquée ; onze références
    qui s''avéreraient non comparables en échelle ou en procédé, ou dont le taux d''échec observé dépasserait
    nettement 40 %.


    **Hypothèse assumée, à porter au procès-verbal :** les 200 k€ de Sedamex sont définitivement perdus,
    et rien ne garantit que ce contrat nous soit rouvert en cas d''échec. Le regret maximal de B face
    à A est donc de 600 k€, non de 400 k€. Le raisonnement ci-dessus tient à ce niveau.


    ## 8. Première action

    Lundi matin : saisine du conseil juridique sur le point 5.1 et demande écrite au banquier sur le point
    5.2. Réponses attendues jeudi soir pour la séance de vendredi. Sans elles, l''arbitrage est reporté
    d''une semaine — il n''est pas tranché par défaut vers A.

    '
