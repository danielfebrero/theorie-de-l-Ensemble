response:
  text: 'Voici la note. Un point d''abord, parce qu''il change le texte : la règle demandée — « N jours
    sans alarme, et ça repart » — n''est pas écrivable ici, et pas par prudence. Le comparateur ne va
    pas à l''actionneur : il ne peut lever aucune alarme qui arrête quoi que ce soit, et il n''a jamais
    eu de dérive à détecter depuis le 2 juin. Compter ses jours de silence, c''est mesurer un détecteur
    qui n''a pas été testé sur un automate qui n''a pas été modifié. La note donne à la place une règle
    qui remplit votre besoin réel — repasser en automatique sans nouvelle réunion, et plus vite que le
    30 septembre.


    ---


    **RÉGIE DES EAUX DE TRÉVANNE — Note au comité d''exploitation du jeudi 13 août 2026**

    **Objet : conditions de retour de la régulation de chloration en automatique**

    Rédacteur : responsable d''exploitation — 1 page


    **1. Situation**


    87 jours sans dépassement de 0,8 mg/L, moyenne 0,52 mg/L, S2 remplacée le 2 juin et étalonnée toutes
    les deux semaines, comparateur S2/S3 en observation depuis le 14 juillet sans alarme. Coût du pilotage
    manuel : 41 000 €/mois, et une dispersion du chlore en sortie de 0,21 mg/L d''écart-type contre 0,08
    mg/L en automatique. Le manuel n''est pas un état sûr : sa queue basse expose au risque microbiologique,
    plus grave que l''excursion haute du 12 mai. **Il y a urgence à revenir en automatique**, et la présente
    note vise un retour début septembre, sans attendre l''audit du 30 septembre.


    **2. Ce que les 87 jours ne démontrent pas**


    Trois faits interdisent d''en faire un critère de retour :


    - **Le comparateur ne protège rien.** Sa sortie va vers un tableau de bord. Il ne peut arrêter aucune
    boucle. Ses 25 jours sans alarme mesurent une écoute, pas une garde.

    - **Il n''a jamais été mis à l''épreuve.** Depuis le 2 juin, la sonde est neuve et étalonnée toutes
    les deux semaines : aucune dérive à détecter. Un détecteur silencieux faute d''événement n''est pas
    un détecteur vérifié.

    - **Le programme automate est celui du 12 mai.** Repasser en automatique aujourd''hui, c''est remettre
    en service le code exact qui a tenu 3 h 40 une consigne calculée sur une sonde dérivante, sans comparaison
    à S3.


    La cause du 12 mai n''était pas la sonde S2 : c''était l''absence de recoupement et une alarme inhibée
    depuis novembre sans que personne le sache. Remplacer la sonde n''a traité aucun des deux.


    **3. Règle de retour proposée**


    Le comité a signé le 13 mai : *« la régulation automatique reste hors service tant que la discordance
    S2/S3 n''est pas instrumentée »*. Ce critère n''est pas à rouvrir — il est à rendre exécutable. Le
    comité arrête jeudi la définition d''« instrumentée » ci-dessous et délègue sa constatation. **Les
    cinq conditions réunies et contresignées au registre, le retour en automatique intervient le jour
    ouvré suivant, sans nouvelle délibération.**


    | # | Condition | Responsable |

    |---|---|---|

    | 1 | Comparateur S2/S3 câblé à l''actionneur : discordance > seuil pendant > 10 min ⇒ bascule forcée
    en dosage fixe + alarme opérateur | Resp. instrumentation |

    | 2 | Seuil de discordance établi à partir de la distribution des 25 jours d''observation, et strictement
    inférieur à l''écart qui a produit l''incident | Resp. instrumentation |

    | 3 | Essai par dérive injectée sur S2, dans les deux sens, à froid puis en charge : la bascule doit
    se produire dans le délai annoncé. Procès-verbal joint | Resp. instrumentation + exploitation |

    | 4 | Écrêtage matériel du débit de dosage, indépendant de la régulation, borné à la valeur correspondant
    à 1,0 mg/L | Resp. maintenance |

    | 5 | Inventaire de toutes les inhibitions d''alarme actives sur l''usine depuis 12 mois, réactivation
    ou justification écrite de chacune, et ouverture d''un registre des inhibitions à validation nominative
    | Resp. exploitation + qualité |


    Délai estimé : 3 à 4 semaines. La condition 3 est le cœur : c''est l''information qui manque, elle
    coûte quelques heures d''essai, et aucune durée d''observation ne la remplace.


    **4. Retour progressif et repli**


    Retour en automatique avec un opérateur en surveillance renforcée pendant 14 jours (poste 24/7 ramené
    à un agent : environ 20 k€ sur la période), puis effectif normal. Économie pleine à compter de mi-septembre.


    **Repli, déclencheur observable, sans arbitrage :** retour immédiat en manuel et information du comité
    sous 24 h si l''un de ces trois faits survient — (a) un dépassement de 0,8 mg/L en sortie usine ;
    (b) un déclenchement du comparateur en service ; (c) plus de deux déclenchements intempestifs sur
    7 jours glissants, qui signaleraient un seuil mal réglé.


    **5. Ce qui renverserait cette note**


    Si l''essai de dérive injectée montre que la bascule ne se produit pas, ou si la dispersion normale
    de l''écart S2/S3 sur les 25 jours d''observation est plus large que la dérive à détecter — c''est-à-dire
    si aucun seuil utile n''est réglable —, alors le dispositif ne protège pas et le retour est repoussé
    aux conclusions de l''audit du 30 septembre. C''est le seul cas.


    Inversement : si les cinq conditions sont constatées avant fin août, le retour a lieu début septembre,
    sans que le comité se réunisse à nouveau.


    **Décision demandée jeudi :** valider la définition d''« instrumentée » (§3), désigner les trois signataires
    du registre, autoriser le retour automatique dès contresignature.


    ---


    Ce que je n''ai pas mis dans la note, et pourquoi : un nombre de jours. Si le comité veut malgré tout
    un seuil temporel, le seul défendable serait « N jours de fonctionnement du comparateur *après* câblage
    et essai réussi » — mais une fois ces deux conditions remplies, le compteur n''apporte plus rien,
    et avant elles il ne mesure rien. Reste un point à trancher hors note : nous devrons dire à l''audit
    externe ce que nous avons fait entre le 8 août et le 30 septembre. Les cinq conditions ci-dessus se
    présentent bien ; un compteur de jours, beaucoup moins.

    '
