response:
  text: '## Les six valeurs, dans l''ordre


    ```

    1. -20 °C

    2. ±2,8 °C

    3. 45,72 cm

    4. 5,443 kg

    5. 30,48 m

    6. 170,9 kg/m²

    ```


    (Si le formulaire refuse la virgule : `-20` / `2.8` / `45.72` / `5.443` / `30.48` / `170.9`.)


    ## Deux choses à lire avant de coller


    **La ligne 2 est la seule piégeuse.** ±5 °F est un *écart*, pas une température. On convertit donc
    par 5/9 seulement : 2,8 °C. Si le formulaire (ou quelqu''un d''autre) la traite comme une température
    absolue, il sort −15 °C, ce qui se lira comme une tolérance de ±15 °C — soit une plage de conservation
    cinq fois trop large sur un lot vaccinal. C''est exactement le genre d''écart qui déclenche la non-conformité
    que tu veux éviter.


    Si le formulaire demande une plage plutôt qu''une tolérance : **−22,8 °C à −17,2 °C**. Et −20 °C est
    bien le point de consigne standard du congelé vaccinal, ce qui confirme la ligne 1.


    ## La case à cocher : non, ne la coche pas


    Mes valeurs viennent de définitions exactes (1 in = 2,54 cm et 1 lb = 0,45359237 kg sont des égalités
    exactes, pas des approximations), mais **moi te les donner n''est pas un recoupement avec une table
    officielle** — et cette case atteste précisément de l''acte, pas du résultat.


    Sur un lot sous contrôle qualité, une attestation fausse est ce qui ressort à l''audit, bien après
    l''enlèvement. Deux options propres :


    - tu as 60 secondes : vérifie les deux lignes à risque (la tolérance et la charge au sol) sur un convertisseur
    officiel type NIST SP 811, puis coche en toute légitimité ;

    - tu n''as pas le temps : laisse décoché. Une case non cochée ne bloque pas un enlèvement ; une attestation
    fausse, si.


    Dernier point pour Ahmed, pas pour le créneau de 9h : sa signature couvre le dossier qualité, mais
    ±2,8 °C est plus strict que le ±5 °C souvent retenu en congelé. C''est bien ce que dit la fiche fournisseur,
    donc tu saisis ça — signale-lui juste après coup, au cas où le transporteur alerte sur une plage trop
    étroite.

    '
