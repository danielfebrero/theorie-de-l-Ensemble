response:
  text: '## Recommandation


    **Le taux d''activation ne va pas sur la diapositive mardi — ni 47 %, ni 41 %.** Le dispositif de
    mesure ne produit pas un taux comparable au témoin, et l''écart n''est pas borné. La diapositive centrale
    change de titre. On informe le comité *et l''investisseur chef de file* avant mardi, pas pendant.


    ---


    ## 1. Les deux faits n''en sont qu''un


    Le point d''affectation et les horodatages inversés ne sont pas deux problèmes : le second est la
    signature du premier.


    Le bras v2 est affecté à l''étape 3. Un compte n''entre donc dans le bras que s''il a **survécu**
    jusque-là. Le témoin est affecté à l''inscription, sans condition. Les deux dénominateurs ne mesurent
    pas la même population : l''un est « tous les inscrits », l''autre est « les inscrits qui ont tenu
    trois étapes ». Survivre à trois étapes d''onboarding est un excellent prédicteur de l''activation
    — c''est presque la variable qu''on prétend mesurer. La randomisation est cassée au niveau du dénominateur,
    pas du traitement.


    Les 4 812 inversions le confirment mécaniquement : ces comptes ont agi **avant** d''être affectés,
    ce qui est exactement ce que produit une affectation tardive. Le taux témoin de 98/10 940 = **0,9
    %** est le véritable bruit d''horloge. Le taux v2 de 4 812/11 300 = **42,6 %** est 47 fois supérieur.
    Sur un seul service, une seule horloge NTP, aucun incident, aucun ticket : il ne reste aucune explication
    instrumentale. Le VP Produit a raison sur l''existence de l''artefact, il se trompe d''un facteur
    ~47 sur son ampleur — l''artefact connu explique environ **102** des 4 812 lignes.


    **Anomalie arithmétique à résoudre :** 11 300 comptes v2 affectés contre 10 940 au témoin. Si la répartition
    du trafic était 50/50 à l''inscription, le bras qui perd des comptes par attrition ne peut pas en
    compter *plus* que celui qui n''en perd aucun. Soit la répartition n''était pas 50/50, soit l''exposition
    v2 réelle est nettement supérieure à 11 300. Dans les deux cas, le dénominateur v2 réel nous est inconnu
    **et supérieur** à ce qu''on affiche.


    ## 2. Ce qu''on peut calculer malgré tout


    On ne connaît pas le nombre de comptes v2 perdus avant l''étape 3, mais l''effet du biais se calcule
    exactement. Si *d* est ce taux d''abandon précoce, le taux d''activation réel du bras v2 est **47
    % × (1 − d)** (en supposant qu''aucun compte abandonné avant l''étape 3 ne s''active — hypothèse *favorable*
    à v2 au numérateur).


    | Abandon avant l''étape 3 | Activation v2 réelle | Écart vs témoin (31 %) |

    |---|---|---|

    | 0 % | 47,0 % | +16 pts |

    | 10 % | 42,3 % | +11 pts |

    | 20 % | 37,6 % | +7 pts |

    | 30 % | 32,9 % | +2 pts |

    | **34,0 %** | **31,0 %** | **0 — parité** |

    | 40 % | 28,2 % | −3 pts |


    **L''effet annoncé disparaît intégralement si 34 % des comptes exposés à v2 abandonnent avant l''étape
    3**, soit environ 5 830 comptes invisibles. Un abandon de 34 % avant la troisième étape d''un parcours
    d''onboarding n''est pas un scénario pessimiste : c''est une valeur ordinaire. Le 47 % est un **majorant**,
    et la marge entre le majorant et la parité tient dans une hypothèse banale.


    C''est là le cœur du problème à porter devant le comité : nous ne savons pas si l''effet est de +16
    points ou de zéro.


    ## 3. Pourquoi le 41 % du collègue est plus dangereux que le 47 %


    Son calcul est de bonne foi et il est même conservateur au numérateur — vérification faite, le sous-groupe
    qu''il supprime s''active à ~55 %, contre 41 % pour celui qu''il conserve. Il retire donc les comptes
    les plus performants. Mais :


    1. **Il ne corrige rien.** Le défaut est un dénominateur amputé de comptes qui ne sont *dans aucune
    ligne*. On ne répare pas des lignes manquantes en supprimant des lignes présentes.

    2. **Il supprime la preuve.** Les 4 812 inversions sont le seul témoin observable de l''affectation
    tardive. Les retirer efface la trace du biais tout en le conservant.

    3. **Il ne survit pas non plus.** Le seuil de parité du 41 % est un abandon précoce de seulement **24
    %**.

    4. **Il aggrave le risque.** Un chiffre « nettoyé » présenté sans mention de la suppression a l''apparence
    de la rigueur. En diligence, un nombre corrigé sans méthode documentée se lit moins bien qu''un nombre
    brut.


    ## 4. Contenu exact de la diapositive


    **Titre remplacé** — le résultat qui tient devient le titre :


    > **Onboarding v2 : −22 % de tickets de support sur 6 semaines, rétention à 90 jours stable**

    > Mesure indépendante (file Zendesk), instrumentation non affectée par le défaut d''affectation du
    test.


    **Bloc secondaire, sur la même diapositive, en clair :**


    > **Activation à 30 jours : mesure en cours de reprise, lecture attendue le [date].**

    > Le test du 3 mars au 14 avril affecte le bras v2 à l''étape 3 du nouveau parcours et le bras témoin
    à l''inscription. Les comptes v2 abandonnant avant l''étape 3 ne sont enregistrés dans aucun bras.
    Le taux observé de 47 % est donc un **majorant** portant sur une population conditionnée à la survie.
    L''écart avec le témoin s''annule si l''abandon avant l''étape 3 atteint 34 %. Nous reconstruisons
    le dénominateur d''exposition à partir des journaux d''inscription et de *feature flag*, indépendants
    du service d''onboarding.


    Rien n''est enterré dans les notes de l''orateur. Une réserve qui ne figure pas sur la diapositive
    n''existe pas : le deck circule, l''orateur non.


    ## 5. Ce qu''on dit au comité


    Trois phrases, dans cet ordre :


    1. « En préparant l''annexe, nous avons trouvé nous-mêmes un défaut de conception dans l''instrumentation
    du test d''activation. Le chiffre de 47 % n''est pas comparable au témoin et nous le retirons. »

    2. « Le défaut est identifié, il est réparable, et nous attendons une mesure valide le [date]. Voici
    la borne dans l''intervalle : entre 31 % et 47 %, selon un paramètre que nous sommes en train de mesurer.
    »

    3. « Le reste du dossier est mesuré sur une instrumentation distincte et n''est pas touché : −22 %
    de tickets, rétention stable. »


    **L''investisseur chef de file doit l''apprendre du CEO avant mardi, pas dans la salle.** Une découverte
    annoncée est de la rigueur ; la même découverte extraite en diligence est de la dissimulation, et
    elle emporte la confiance sur *tout* le reste du dossier — y compris le −22 % qui, lui, est bon.


    ## 6. Le meilleur argument contre — et pourquoi il ne tient pas


    *Le contre-argument le plus fort :* l''effet est probablement réel. Le −22 % de tickets corrobore
    indépendamment que v2 améliore quelque chose ; la rétention stable exclut un gain acheté par une dégradation
    ailleurs. Une affectation tardive est un bug d''instrumentation banal, sans intention de tromper.
    Retirer le titre neuf jours avant la signature peut coûter des dizaines de millions de valorisation
    pour un biais qui, une fois mesuré, ramènera peut-être 47 % à 43 %.


    *Il ne tient pas, pour trois raisons.* D''abord il établit que l''effet est **plausible**, pas que
    le chiffre est **défendable** — et il conclut donc à *mesurer*, pas à *publier*. Ensuite, la corroboration
    par le support porte sur une autre population (ceux qui contactent le support) et ne calibre en rien
    le dénominateur d''activation ; elle est cohérente avec l''effet, elle ne le quantifie pas. Enfin,
    l''asymétrie tranche : si le VP a raison, la reprise nous coûte quelques jours et 4 points de titre.
    S''il a tort et que le chiffre est publié, un tour signé sur une déclaration matériellement fausse
    — dont il existe déjà une trace écrite interne — ne se renégocie pas : il se défait, avec indemnisation,
    exposition personnelle des signataires, et options des 42 salariés emportées au passage. Coût récupérable
    contre perte irrécupérable.


    ## 7. Ce qu''il faut lancer aujourd''hui


    | # | Action | Propriétaire | Échéance |

    |---|---|---|---|

    | 1 | Reconstruire le dénominateur d''exposition v2 : comptes inscrits × répartition du *feature flag*,
    source indépendante du service d''onboarding | Data + Infra | mercredi |

    | 2 | Extraire le taux d''abandon avant l''étape 3 depuis les événements étape 1 / étape 2 | Data
    | mercredi |

    | 3 | Vérifier la définition exacte de `first_action_at` (rétro-alimenté depuis un contact pré-inscription
    ?) | Data | aujourd''hui |

    | 4 | Établir la répartition réelle du trafic entre bras (explique-t-elle 11 300 > 10 940 ?) | Infra
    | mardi |

    | 5 | Brief CEO + CFO + conseil en valeurs mobilières, avec cette note | Toi | **aujourd''hui** |

    | 6 | Le VP Produit copropriétaire de la reprise et de la lecture au comité | VP Produit | mardi |


    Le point 6 n''est pas de la courtoisie. La reprise de mesure est un travail produit, la narration
    du résultat lui revient, et il n''y a aucune raison de transformer un défaut d''instrumentation en
    désaveu de neuf mois de travail : v2 garde le −22 %, qui est le meilleur résultat du dossier et qui,
    lui, tient.


    ## 8. Ce qui renverserait cette recommandation


    Une seule observation la renverse : **si l''action 1 montre que l''exposition v2 réelle est proche
    de 11 300** (disons ≥ 95 %), alors l''abandon précoce est négligeable, le biais est marginal, et le
    47 % remonte sur la diapositive avec une note de méthode. C''est mesurable en 48 h. Secondairement,
    si `first_action_at` s''avère rétro-alimenté depuis un événement pré-inscription, les 4 812 inversions
    changent de nature et l''analyse est à refaire — d''où le point 3, à faire aujourd''hui.


    ## 9. Si la recommandation est écartée


    Déclencheur observable : **si un deck contenant un taux d''activation non qualifié (47 % ou 41 %)
    est diffusé au comité d''investissement ou déposé dans la data room**, alors, le jour même : objection
    écrite adressée au CEO, à la CFO et au conseil externe, avec copie conservée ; refus de signer ou
    de co-signer l''annexe contenant ce chiffre ; escalade au conseil d''administration. Ce n''est pas
    une menace, c''est la seule position tenable : la note d''aujourd''hui rend le défaut connu, et un
    chiffre connu comme faux qui reste au deck cesse d''être une erreur pour devenir une déclaration.


    ## 10. Qui décide


    Ce n''est ni toi ni le VP Produit. Le VP Produit n''a pas qualité pour accepter ce risque au nom de
    la société dans une opération sur titres — la proximité du sujet ne vaut pas délégation d''autorité.
    La contrainte de la CFO sur le *term sheet* est un intrant réel, pas une décision. **La décision appartient
    au CEO et au conseil, après avis du conseil en valeurs mobilières.** Ton livrable est de leur donner
    de quoi décider aujourd''hui — c''est cette note.


    ---


    Je peux la mettre en forme comme document partageable (fichier ou page web privée) si tu veux la diffuser
    telle quelle — dis-moi, je ne le fais pas d''office vu ce qu''elle contient.

    '
