response:
  text: '## Les trois lignes


    ```

    Nuit: B2 bridée 5 MW max + 2 gaz au maxi, sans exception. Roue commandée Nantes, dispo 11h40. Je reprends
    7h.

    Vib ≥11,8 mm/s ou bruit anormal: ARRÊT CONTRÔLÉ B2 sans attendre 12, la roue doit rester intacte (sinon
    9 jours).

    B2 arrêtée: gaz maxi, départ maxi, brider amont, appeler hôpital + EHPAD bout de réseau. Sinon aucune
    manoeuvre.

    ```


    109 / 113 / 112 caractères. Si la GTC n''affiche pas les accents, les retirer ne change aucune longueur.


    ## Ce que je fais avant de partir, pour que ces lignes tiennent


    1. **Je commande la roue maintenant**, avant de brider quoi que ce soit. C''est gratuit par rapport
    à l''enjeu et ça démarre le compteur de 14 h à 21h40 au lieu de 7h.

    2. **Je bride B2 moi-même et je regarde la vibration répondre.** C''est le pari de toute la nuit :
    moins de vitesse de roue, moins de contrainte, donc décalage de la fenêtre de casse. **Si la vibration
    ne descend pas en bridant, l''hypothèse est fausse** — dans ce cas j''arrête B2 en contrôlé avant
    de partir et je réécris les trois lignes en mode secours. C''est l''observation qui renverse la décision,
    et je ne pars pas sans l''avoir faite.

    3. **J''appelle l''hôpital et les deux EHPAD avant 22 h**, pas les techniciens à 4 h du matin. Ils
    doivent armer leurs appoints et leur protocole chambre froide cette nuit, pas la découvrir. C''est
    moi qui porte cet appel, ce n''est pas déléguable à une ligne de main courante.


    ## Le raisonnement, en clair


    **Arrêter B2 maintenant** est le geste qui a l''air prudent et qui est le pire : 5 MW de gaz contre
    12 MW de besoin à −14 °C, garantis, pendant les 13 heures les plus froides, avec l''hôpital en bout
    de réseau. Ce n''est pas « sous-station à 38 °C », c''est un réseau qui décroche. Le coût certain
    est plus grave que le risque évité.


    **Laisser B2 à 7 MW** met la casse au milieu du pic de 4 h, et la casse coûte neuf jours — c''est
    la seule branche vraiment irrécupérable ici. La fenêtre constructeur de 6 h commence à courir vers
    22 h.


    **Le bridage est la seule option qui n''achète pas une catastrophe pour en éviter une autre.** 10
    MW sur 12 : la nuit sera inconfortable, le bout de réseau descendra, mais le réseau tient et la roue
    survit jusqu''à la dépose programmée. Le surcoût gaz est accepté sans discussion.


    **Le point dur des trois lignes, c''est « ARRÊT CONTRÔLÉ ».** Le réflexe d''un technicien est d''attendre
    le seuil constructeur de 12 mm/s. À 12, la machine s''arrête sur casse et on perd les 14 heures :
    neuf jours. Les 11,8 mm/s sont une marge que je choisis, elle ne vient pas du constructeur — c''est
    ce qui transforme un arrêt subi en arrêt qui préserve la pièce.


    **Ce que les techniciens ne doivent pas faire est aussi important que le reste** : ne pas remonter
    B2 en puissance parce qu''il fait froid et que le réseau tire. D''où « sans exception » en ligne 1
    et « aucune manoeuvre » en ligne 3.


    Ce que ces trois lignes ne couvrent pas, et que j''assume : une casse malgré le bridage vers 3 h laisse
    deux techniciens avec 5 MW et un hôpital froid, sans moi. C''est pour ça que l''appel de 22 h à l''hôpital
    n''est pas optionnel — c''est la vraie ligne de repli, et elle ne tient pas dans 120 caractères.

    '
