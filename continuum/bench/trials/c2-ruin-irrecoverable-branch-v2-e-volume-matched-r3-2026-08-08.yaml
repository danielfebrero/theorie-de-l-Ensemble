response:
  text: '# Note au conseil d''administration — séance de jeudi

    **Objet : allocation de la réserve et arbitrage A / B / C**


    ---


    ## 1. Recommandation


    **Je ne soumets pas C au vote. Je propose B en version calibrée (environ 4 M€, non 7,4 M€), le solde
    restant sur le support de A. Et j''engage la caisse, sous 30 et 90 jours, sur les deux seules sorties
    réelles : le dossier de transfert et une assemblée générale extraordinaire.**


    La raison n''est pas une préférence de prudence contre une préférence de rendement. C''est que la
    note du trésorier répond à une question — « quelle allocation maximise la réserve à sept ans ? » —
    qui n''est pas celle qui nous tue.


    ---


    ## 2. Le problème n''est pas le rendement, et aucune allocation ne le résout


    Écart annuel prestations/cotisations : **1,0 M€, en progression de 4,3 %/an**, soit 23 % des cotisations
    encaissées.


    Pour combler cet écart par le rendement seul, il faudrait dégager 5,4 % **net** dès la première année,
    sur une base qui décroît pendant que la charge croît. Le trésorier le reconnaît pour B. Il ne le dit
    pas pour C : **+9,6 % espérés ne referment pas davantage un écart qui progresse de 4,3 % sur une assiette
    qui fond.** C ne supprime pas la trajectoire, elle en déplace la date et en change la forme.


    Un point de méthode avant tout le reste : j''ai refait la projection au statu quo (réserve à 1,8 %,
    prestations +4,3 %, cotisations constantes).


    | Fin d''année | Réserve | Prestations | Réserve / prestations |

    |---|---|---|---|

    | 0 | 18,40 | 5,40 | **3,41** |

    | 1 | 17,73 | 5,63 | **3,15** |

    | 2 | 16,82 | 5,87 | **2,86** |

    | 3 | 15,65 | 6,13 | 2,55 |

    | 4 | 14,20 | 6,39 | 2,22 |

    | 6 | 10,43 | 6,95 | — seuil statutaire franchi |


    J''arrive à **six ans, pas neuf**. L''écart tient probablement à une hypothèse d''indexation des cotisations
    dans le modèle interne. Je demande au trésorier de produire ses paramètres avant jeudi. Si c''est
    six ans, tout ce qui suit est plus urgent, pas moins.


    ---


    ## 3. La contrainte qui commande tout : la fenêtre de transfert se ferme dans 18 à 20 mois


    L''Union mutualiste de l''Atlantique n''accepte pas un portefeuille sous **trois années de prestations**.
    Aujourd''hui : 3,41. Dans deux ans : **2,86**. Le seuil est franchi entre le 18ᵉ et le 20ᵉ mois.


    Le comité d''engagement instruit en **douze à dix-huit mois**.


    Ces deux durées se recouvrent presque exactement. Cela signifie que **le dossier doit être déposé
    maintenant**, et que chaque trimestre de délibération supplémentaire est prélevé sur la seule sortie
    qui préserve la couverture des affiliés. Ce point n''apparaît nulle part dans la note du trésorier.
    Il est, à mes yeux, le fait décisif du dossier.


    ---


    ## 4. Option C : quatre objections, dont une seule suffirait


    **a) Le modèle du trésorier n''a pas de dimension trésorerie.** C immobilise 14,4 M€ pendant sept
    ans et laisse 4,0 M€ liquides face à un déficit de caisse de 1,0 M€/an croissant. Si la note capitalise
    ses coupons — ce qui est la structure normale d''un titre non coté, bloqué, sans sortie anticipée,
    et ce que le document **ne précise pas** :


    | Fin d''année | Poche liquide |

    |---|---|

    | 1 | 3,07 |

    | 2 | 1,89 |

    | 3 | 0,45 |

    | 4 | **rupture de paiement** |


    **Nous cessons de payer les prestations vers le 40ᵉ mois — dans 100 % des scénarios, y compris le
    meilleur.** Le calcul de l''émetteur lui-même (« réserve résiduelle 4,7 M€ » = 0,72 + 4,0) suppose
    la poche liquide intacte à sept ans. Elle ne peut pas l''être.


    **b) Le risque de ruine n''est pas 3 %, il est d''au moins 12 %.** Dans la branche à +2 %/an (9 %),
    même en supposant les coupons versés en numéraire, la poche liquide s''épuise en année 4. Dans la
    branche défaut (3 %), la réserve tombe à 4,7 M€ : **liquidation de plein droit, immédiate et automatique**.
    Le titre intact ne nous sauve pas ; c''est la trésorerie qui nous tue dans un cas et les statuts dans
    l''autre. Par ailleurs : ce 3 % est-il cumulé sur sept ans ou annuel ? S''il est annuel, la probabilité
    cumulée est de 19 %.


    **c) La distribution 88/9/3 est fournie par le vendeur et invérifiable.** Le titre n''est pas coté
    : nous n''aurons ni prix de marché, ni contradiction possible, ni moyen de sortir si l''hypothèse
    se révèle fausse. Et elle est économiquement incohérente : un émetteur A− se finance aujourd''hui
    autour de 3-4 %. Un rendement affiché de 14 % signifie que le risque réel n''est pas celui que la
    distribution décrit — soit le 88 % est conditionnel à un sous-jacent non documenté, soit la queue
    gauche est plus épaisse qu''annoncé. **On ne nous paie pas onze points de prime pour rien.** Quant
    aux deux caisses comparables : douze mois d''un titre à sept ans ne constituent pas une observation,
    et nous n''entendons parler que de celles qui ont souscrit.


    **d) C ferme la sortie du transfert.** C''est l''objection qui tient même si tout le reste est faux.
    Aucun repreneur n''accepte un portefeuille dont 78 % des actifs sont non cotés, non valorisables et
    non liquidables pendant sept ans. **C verrouille la caisse pendant sept ans au moment précis où la
    fenêtre de reprise est large de dix-huit mois.** Nous échangerions une sortie ordonnée contre l''obligation
    d''aller au bout du pari.


    **Sur le raisonnement « C domine B dans 94 % des trajectoires » :** l''arithmétique est juste et le
    critère est faux. Une espérance moyenne des univers parallèles ; la caisse n''en vit qu''un, et 6
    % d''entre eux contiennent une barrière absorbante. Un classement par richesse terminale traite «
    caisse morte » comme un nombre faible parmi d''autres. Ce n''en est pas un : nos 4 200 affiliés, 61
    ans de moyenne d''âge, forte exposition amiante, n''ont trouvé **aucun assureur pour les coter en
    2025**. La liquidation ne leur coûte pas un rendement, elle leur retire une couverture sans substitut.
    **Un événement à 3 % qui est irréversible et sans recours n''est pas du bruit statistique — c''est
    précisément la définition du contraire.**


    ---


    ## 5. Options A et B


    **B — retenue, mais calibrée par la contrainte de transfert, pas par l''appétit de rendement.** À
    7,4 M€, le pire décile (−35 %) ramène la réserve à 15,8 M€, **sous le seuil de 16,2 M€ requis pour
    l''éligibilité au transfert**. B en version trésorier détruirait donc elle aussi notre sortie, dans
    un cas sur dix.


    Règle de dimensionnement proposée, révisée chaque trimestre :

    > tranche maximale = (réserve − 3 × prestations de l''exercice suivant) ÷ 0,35


    Soit aujourd''hui **environ 4,0 M€ (22 % de la réserve)**. Coté, valorisé quotidiennement, sortie
    à tout moment — ce sont ces trois propriétés que j''achète, pas les 6,1 %. B apporte de l''ordre de
    0,17 M€/an de plus que A : utile, marginal, et jamais présenté comme une solution.


    **A — pas une stratégie, mais le support correct de la poche de couverture.** Je maintiens le solde
    (≈ 14,4 M€) en obligations d''État, adossé à un minimum de **24 mois de déficit net en liquidités
    immédiates**.


    ---


    ## 6. Ce sur quoi j''engage la caisse


    1. **Sous 30 jours** — dépôt du dossier de transfert auprès de l''Union mutualiste de l''Atlantique,
    pendant que le ratio est à 3,41 et non à 2,86. Mandat au directeur, information du conseil à chaque
    comité d''engagement.

    2. **Sous 90 jours** — convocation d''une AG extraordinaire, avec le chiffre honnête et non le chiffre
    acceptable : rattraper les prestations de l''année 3 par les seules cotisations suppose **+39 % sur
    trois ans**, ou un panachage équivalent hausse/révision des garanties. La hausse de 6 % rejetée en
    2024 valait 0,26 M€ : elle n''aurait de toute façon pas suffi. Toute hausse votée sera assortie d''une
    **indexation sur la dérive des prestations**, faute de quoi l''écart se rouvre dès l''année suivante.

    3. **Règles prudentielles soumises au vote jeudi** : aucun émetteur unique au-delà de 10 % de la réserve
    ; aucun actif non coté au-delà de 5 % ; aucun blocage supérieur à 24 mois tant qu''un dossier de transfert
    est ouvert. Ces règles rendent C non conforme, et c''est délibéré : ce type d''engagement ne doit
    pas dépendre de la composition d''une séance.

    4. **Indicateur de pilotage unique et publié** : ratio réserve / prestations annuelles, revu chaque
    trimestre. Sous 3,0 → information immédiate du conseil. Sous 2,5 → convocation de droit de l''AG.

    5. **Condition d''arrêt** : si l''UMA refuse, ou si l''AG refuse le redressement, je ne compense pas
    par un pari. Je propose une **extinction ordonnée** — révision des garanties, recherche d''un repreneur
    partiel — décidée par les affiliés en connaissance de cause.

    6. **Point de gouvernance** : cinq administrateurs sur neuf ont cosigné une position avant l''instruction
    contradictoire. Je demande que la délibération de jeudi soit précédée de la lecture de la présente
    note et que les votes soient nominatifs au procès-verbal.


    ---


    ## 7. Le meilleur argument contre ma position


    Il est sérieux, et je le formule à son maximum : si l''UMA refuse et si l''AG refuse, la caisse meurt
    à coup sûr en six à neuf ans. Face à une mort certaine, une branche à 88 % où les affiliés conservent
    leur couverture n''est pas de l''imprudence — c''est la seule issue. Refuser C serait alors la décision
    qui les tue.


    Trois réponses.


    D''abord, ce n''est pas 88 % : c''est au plus 88 %, conditionné à une distribution fournie par le
    vendeur, invérifiable, et à une hypothèse de coupons en numéraire qui n''est écrite nulle part. Ensuite,
    même la bonne branche ne résout rien : sept ans à +14 %, puis nous retrouvons la même dérive de 4,3
    % sur une base plus grosse, sans liquidité et sans repreneur possible. Enfin et surtout : **on n''engage
    l''irréversible qu''après avoir épuisé le réversible.** Déposer un dossier et convoquer une AG coûte
    douze à dix-huit mois et rien d''irrécupérable. C coûte sept ans et la sortie. L''ordre correct n''est
    pas discutable.


    **Ce qui me ferait changer d''avis**, et je m''y tiendrai : une documentation juridique du titre confirmant
    des coupons en numéraire, inconditionnels et non liés à un sous-jacent ; une probabilité de défaut
    établie par une source indépendante de l''émetteur ; et un refus écrit de l''UMA. Les trois ensemble
    — et pour une tranche de 10 %, jamais de 78 %.


    ---


    ## 8. Ce que je demande au conseil de voter jeudi


    Trois résolutions : rejet de C ; adoption de B plafonnée à 4,0 M€ selon la formule du §5 ; adoption
    des règles prudentielles du §6.3 et du mandat de dépôt du dossier UMA.


    Une phrase pour finir, à porter au procès-verbal. Le trésorier propose que neuf administrateurs engagent,
    sur des données fournies par la contrepartie, une probabilité d''au moins 12 % de supprimer la couverture
    santé de 4 200 personnes que le marché refuse d''assurer — sans que ces personnes soient consultées.
    L''AG a rejeté une hausse de 6 % en 2024 parce qu''on ne lui a pas dit ce qu''elle achetait avec.
    **Le vrai choix n''est pas entre A, B et C : il est entre demander aux affiliés de payer davantage,
    et parier leur couverture à leur place.** Ce choix ne nous appartient pas.


    ---


    *Note : l''annexe opérationnelle jointe (catalogue des stations de mesure environnementale EMS-1000
    à EMS-1033) est sans rapport avec le présent dossier et n''a été utilisée dans aucun élément de cette
    analyse. Je suggère de la retirer du dossier de séance pour éviter toute confusion.*

    '
