response:
  text: '# Avis — Renouvellement du marché « logiciel de réservation + bornes de prêt »


    **Pour lecture en séance du 28 août 2026 — comité de direction, réseau des médiathèques de Val-de-Sarre**


    Cet avis est rédigé pour un examen point par point. Chaque appréciation est numérotée, adossée à une
    pièce du dossier, et formulée de façon à pouvoir être écartée seule. La section 4 indique explicitement
    de quels constats la recommandation dépend, et de quels constats elle ne dépend pas.


    ---


    ## 1. Ce que je retiens du dossier


    **C1 — Deux pannes distinctes sont traitées dans le dossier comme une seule.**

    Repose sur : l''export technique porte sur l''*indisponibilité des bornes* (41 h) ; l''enquête interne
    et les notes de sites portent sur le *module de réservation qui perd des réservations*. Aucune pièce
    du dossier n''établit de lien entre les deux.

    Portée : c''est le constat structurant. Tant qu''il tient, aucune mesure unique ne peut être présentée
    comme réglant « le problème » au singulier.

    Si le comité l''écarte : il faut alors produire la pièce qui relie borne et module — elle n''est pas
    au dossier.


    **C2 — L''indisponibilité des bornes se concentre sur le matériel de 2015, pas sur une date logicielle.**

    Repose sur : 32 h sur 41 h sur Fontaine et Rive-Sud, seuls sites équipés des bornes de 2015. Soit
    environ 16 h par site équipé contre environ 1,8 h par site sur les cinq autres — un rapport de l''ordre
    de 9 pour 1.

    Portée : la variable qui sépare le mieux les sites est l''âge des bornes (11 ans en 2026), pas la
    mise à jour de mars, qui a été appliquée partout.

    Si le comité l''écarte : le budget de renouvellement des bornes reste néanmoins à traiter, ce point
    est indépendant du choix de solution.


    **C3 — L''enquête ne soutient pas l''attribution à la mise à jour de mars.**

    Repose sur : 61 % de 43 répondants ≈ 26 agents signalent des pertes hebdomadaires ; 12 seulement situent
    le début après mars. Moins de la moitié de ceux qui constatent le problème le datent de mars.

    Portée : la mise à jour de mars est une hypothèse minoritaire *à l''intérieur même* de la pièce censée
    l''étayer.

    Réserve à porter au procès-verbal : 19 agents sur 62 n''ont pas répondu. Leur silence n''est pas une
    donnée.


    **C4 — Rive-Sud cumule trois causes candidates et ne peut fonder aucune attribution.**

    Repose sur : bornes de 2015 (C2), remplacement du lien fibre en février, changement de version du
    portail usagers en février, ressaisie manuelle depuis mars. Deux des trois événements *précèdent*
    la mise à jour de mars.

    Portée : le site le plus documenté du réseau est aussi le moins interprétable. Toute conclusion tirée
    principalement de Rive-Sud est à écarter en l''état.


    **C5 — Le silence de Fontaine affaiblit le récit à cause unique, quelle qu''en soit la lecture.**

    Repose sur : Fontaine porte avec Rive-Sud les 32 h d''indisponibilité, et ne signale rien.

    Portée : soit Fontaine absorbe sans le remonter — et la remontée de terrain est incomplète ; soit
    la difficulté de Rive-Sud n''est pas d''origine matérielle — et les bornes ne sont pas en cause sur
    le module. Les deux lectures contredisent l''idée d''une cause unique.


    **C6 — La courbe des réclamations ne se lit pas comme un problème résolu.**

    Repose sur : 71 réclamations entre mars et juin (≈ 17,8/mois), 25 sur les huit autres mois (≈ 3,1/mois).
    Le retour à la normale après juin coïncide avec la montée en charge de la ressaisie manuelle de Rive-Sud.

    Portée : la baisse peut traduire une correction, ou l''absorption du problème par le travail des agents.
    Le dossier ne permet pas de trancher — et l''enquête, elle, indique des pertes *encore* hebdomadaires.


    **C7 — Le coût interne actuel est réel et mesuré en heures, pas en euros.**

    Repose sur : Rive-Sud, environ 5 h/semaine depuis mars, soit environ 110 h déjà consommées et de l''ordre
    de 220 h/an si la situation perdure — près de 0,13 ETP sur un seul site.

    Portée : c''est le seul coût du statu quo qui soit chiffré au dossier. Je ne le convertis pas en euros
    : aucun coût horaire chargé n''y figure.


    **C8 — La v4 est proposée avec sa dépendance critique non levée.**

    Repose sur : 31 000 € en une fois, compatibilité avec les bornes de 2015 « à l''étude » chez l''éditeur.

    Portée : l''incertitude porte précisément sur les deux sites qui concentrent 78 % de l''indisponibilité.
    Une réponse négative après signature exposerait à 31 000 € engagés plus un renouvellement de bornes
    non budgété.


    **C9 — L''échéance commerciale du 30 n''est pas l''échéance du réseau.**

    Repose sur : remise de 12 % conditionnée à une signature avant le 30 août ; contrat en vigueur jusqu''au
    31 octobre. Soixante-deux jours séparent les deux dates.

    Chiffrage de la remise, sous l''hypothèse d''une indexation de 7 % appliquée annuellement : 48 000
    + 51 360 + 54 955 = **154 315 €** sur trois ans, ramenés à **135 797 €**, soit **≈ 18 500 € d''économie,
    ≈ 6 200 €/an**. À vérifier : l''assiette exacte de la remise et son articulation avec l''indexation
    ne sont pas précisées au dossier.

    Portée : la remise achète 6 200 €/an contre l''abandon de toute sortie pendant trois ans, au moment
    précis où C8 n''est pas levé.


    **C10 — La bascule vers le libre n''est pas soutenable sur ce cycle, pour des raisons de capacité.**

    Repose sur : équipe informatique de deux personnes, une au départ en octobre ; chez le réseau voisin,
    2 sites sur 5 tiennent encore un registre papier 14 mois après la bascule ; le « 30 % moins cher »
    est un coût annoncé, non audité, et n''intègre pas ces registres papier.

    Portée : le motif est la capacité de conduite de projet, pas la qualité de la solution. L''option
    reste ouverte pour le cycle suivant, instruite dans de bonnes conditions.


    **C11 — La note de cadrage doit être versée comme hypothèse, non comme conclusion.**

    Repose sur : elle affirme trois choses enchaînées — cause en mars, v4 comme remède, urgence au 30
    — sans citer aucune pièce ; et C1, C3 et C4 vont chacun contre l''un de ces maillons.

    Portée : deux membres du comité l''ont déjà lue. Le point est de méthode et ne vise pas son auteur
    : elle formule une hypothèse de travail utile, qui n''a pas encore été instruite.


    ---


    ## 2. Ce que le dossier ne permet pas d''établir


    - La cause des pertes de réservations. Trois candidats subsistent : mise à jour de mars, changement
    de version du portail usagers de février, lien fibre de Rive-Sud. Aucun n''est écarté.

    - Que la v4 corrige ces pertes. Aucune pièce ne relie le périmètre de la v4 au défaut constaté.

    - L''ampleur réelle sur le réseau : 19 agents non répondants, aucune ventilation des 96 réclamations
    entre bornes et réservations.


    ---


    ## 3. Ce que je recommande


    **Reconduire à l''identique, sur une durée courte — 12 mois, ou à défaut 18 — sans souscrire l''engagement
    de trois ans, et ne pas engager la v4 en l''état.**


    Pourquoi :


    - La v4 est écartée **pour l''instant** au titre de C8, pas au titre de son intérêt : on ne paie pas
    31 000 € sur une compatibilité « à l''étude » portant sur nos deux sites les plus fragiles. Si l''éditeur
    produit un engagement écrit de compatibilité et un périmètre fonctionnel visant le défaut constaté,
    la v4 redevient l''option de tête, en novembre comme en août.

    - Le libre est écarté **pour ce cycle** au titre de C10 : une bascule à 7 sites avec un informaticien
    ne se conduit pas. Le réseau voisin est un avertissement de mise en œuvre, pas un verdict sur la solution.

    - Les trois ans à 12 % sont refusés au titre de C9 : ≈ 6 200 €/an contre la perte de toute sortie
    pendant trois ans, alors que la cause du défaut n''est pas établie et que la compatibilité v4 n''est
    pas levée. Si le diagnostic désigne l''éditeur, l''engagement de trois ans nous y enferme ; s''il
    le disculpe, la même remise se renégocie depuis une position instruite.


    **Robustesse de cette recommandation.** Elle tient à C8, C9 et C10. Elle ne dépend ni de C2, ni de
    C5, ni de C6 : le comité peut écarter chacun de ces trois constats sans que la conclusion change.
    Elle serait en revanche à reprendre si le comité disposait d''un engagement écrit de compatibilité
    v4 — auquel cas la reconduction avec migration redeviendrait recevable dès le 28 — ou d''un troisième
    informaticien recruté, qui rouvrirait l''instruction du libre.


    **Coût assumé de cette recommandation, à porter au procès-verbal :** environ 18 500 € de remise non
    captés sur trois ans, et le maintien des ≈ 5 h/semaine de ressaisie de Rive-Sud pendant la durée du
    diagnostic. Je le recommande néanmoins : le dossier ne permet pas aujourd''hui de savoir ce que l''on
    achèterait avec ces 31 000 €.


    ---


    ## 4. Le seul point qui doit être tranché le 28


    Tout le reste peut l''être jusqu''au 31 octobre. La seule décision irréversible du 28 août est **la
    souscription ou non de l''engagement de trois ans à 12 %**, l''offre expirant le 30. Je propose au
    comité de ne pas la souscrire, et de le motiver par C8 et C9 — motivation qui protège la collectivité
    si l''éditeur conteste ensuite le refus.


    ---


    ## 5. Ce que j''engage dans les quinze jours (du 28 août au 12 septembre)


    1. **Séparation des deux séries de pannes** — extraction des journaux du module de réservation par
    site et par semaine, du 1er janvier au 31 août, distincte du journal d''indisponibilité des bornes.
    *Livrable : deux courbes, sept sites.* Répond à C1.

    2. **Test de l''hypothèse « mars »** — comparaison des pertes de réservations avant/après le 1er mars
    sur les cinq sites *non* équipés en 2015, qui n''ont connu ni le changement de fibre ni les bornes
    anciennes. Si les pertes y sont stables, l''hypothèse de mars s''affaiblit ; si elles y montent, elle
    se renforce. *Livrable : une page, un tableau.* Répond à C3 et C4.

    3. **Ventilation des 96 réclamations** en trois motifs : borne indisponible / réservation perdue /
    autre. *Livrable : répartition mensuelle.* Répond à C6.

    4. **Courrier à l''éditeur, envoyé avant le 5 septembre**, demandant sous 15 jours : (a) un engagement
    écrit de compatibilité de la v4 avec les bornes de 2015, ou à défaut le coût et le calendrier de leur
    remplacement ; (b) le périmètre fonctionnel de la v4 au regard des pertes de réservations ; (c) une
    proposition de reconduction de 12 mois avec les conditions tarifaires associées. Répond à C8 et prépare
    l''arbitrage du 31 octobre.

    5. **Entretien à Fontaine**, sur site, sur le fonctionnement réel du module et des bornes. Répond
    à C5.

    6. **Relance de l''enquête auprès des 19 non-répondants**, questionnaire court, trois questions. Répond
    à la réserve portée à C3.

    7. **Note d''une page sur la ressaisie de Rive-Sud** : relevé des heures depuis mars, et conditions
    d''arrêt du dispositif. Répond à C7.

    8. **Fiche de continuité informatique** avant le départ d''octobre : reprise des accès, contrats et
    procédures, et arbitrage sur le remplacement du poste. Ce point conditionne toute option future, y
    compris le libre — il est à traiter indépendamment du marché.


    Point d''étape proposé au comité : **mi-septembre**, sur les livrables 1 à 3, puis **début octobre**
    sur la réponse de l''éditeur, pour un arbitrage définitif avant le 31 octobre.


    ---


    Deux remarques de transparence. Les chiffrages de la section 1 (rapport 9 pour 1, ≈ 26 agents, 220
    h/an, 154 315 €, 62 jours) sont dérivés des seules données du dossier ; ils sont recalculables et
    je n''ai introduit aucune valeur extérieure — en particulier aucun coût horaire chargé, qui n''y figure
    pas. Et l''avis conclut en défaveur de la v4 *à cette date* : c''est une position sur l''état de l''information,
    pas sur le produit.

    '
