response:
  text: '# Avis — renouvellement du marché réservation + bornes


    Chaque appréciation porte l''élément du dossier sur lequel elle repose, et ce qui change si le comité
    l''écarte.


    ## 1. Ce que je retiens


    **C1 — Le dossier confond deux pannes distinctes.** *[export technique / enquête + note Rive-Sud]*
    L''indisponibilité mesurée est **matérielle** et concentrée sur le parc 2015 (32 h sur 41). Les «
    pertes de réservation » sont **logicielles** et déclaratives. Aucune pièce ne relie les deux. Les
    trois options sont présentées comme réglant les deux problèmes ; aucune ne le fait. *À calibrer :*
    41 h sur 12 mois et 7 sites ≈ 3,5 h/mois pour tout le réseau — cela désigne un vieillissement localisé,
    pas un service en échec.


    **C2 — La cause « mise à jour de mars » est plausible mais non établie, et ses concurrentes ne sont
    pas instruites.** *[12 répondants sur 43 ; Fontaine ; février]* Fontaine a le même parc et **ne signale
    rien**. En février, le lien fibre de Rive-Sud a été remplacé **et** le portail usagers a changé de
    version — deux changements antérieurs à mars, non instruits. Le seul fait quantifié du dossier (5
    h/semaine de ressaisie, ≈ 225 h/an) est **mono-site**. Un défaut applicatif réseau qui n''affecte
    qu''un site sur sept est atypique ; un défaut de lien ou de portail localisé l''est beaucoup moins.
    Le couple « Fontaine silencieux / Rive-Sud à 5 h par semaine » est la donnée la plus informative du
    dossier, et personne ne l''a exploitée.

    *Si le comité retient quand même mars :* la v4 est renforcée, mais C4 reste entier.


    **C3 — Le pic de réclamations est réel mais borné, et le dossier s''arrête avant la réponse.** *[96
    dont 71 mars-juin, donc 25 sur huit mois]* Rien sur l''après-juin. Deux lectures opposées tiennent
    également — problème résorbé, ou usagers qui ont cessé de réclamer. À compléter avant la décision
    : cela coûte une requête.


    **C4 — La v4 est un achat ferme contre une contrepartie incertaine.** *[31 000 € / compatibilité «
    à l''étude »]* Les deux sites non garantis sont exactement ceux qui portent 32 des 41 heures. Si l''étude
    conclut à l''incompatibilité, le réseau paie la migration **et** le remplacement des bornes — ni chiffré
    ni budgété. C''est la seule branche où une décision du 28 peut produire une dépense non maîtrisée.


    **C5 — Le calendrier de la remise n''est pas celui du réseau.** *[remise le 30 / contrat jusqu''au
    31 octobre]* Deux mois d''écart : c''est la marge du réseau, l''urgence est celle de l''éditeur. Chiffrage
    : 48 000 + 51 360 + 54 955 ≈ **154 300 €** sur trois ans ; avec 12 % ≈ **135 800 €** ; avantage ≈
    **18 500 €, soit ~6 200 €/an**. Du même ordre que le coût annuel de la ressaisie de Rive-Sud — signer
    pour capter la remise sans savoir si la ressaisie s''arrêtera, c''est arbitrer entre deux montants
    comparables en n''en connaissant qu''un.


    **C6 — Le libre n''est pas écarté sur le fond, il l''est sur la capacité.** *[2 agents dont 1 part
    en octobre ; 2 sites sur 5 encore au papier après 14 mois]* Le −30 % est un coût annoncé, pas constaté,
    et il n''intègre pas la charge interne. Quatorze mois après, la migration voisine n''est pas achevée.
    Conduire cette bascule avec un agent informatique serait le choix le plus exposé.


    **C7 — La note de cadrage enchaîne trois affirmations non sourcées, et elle a déjà circulé.** Diagnostic
    (mars), remède (v4), urgence (le 30) : non établi, conditionné, fournisseur. Ce point ne vise pas
    son auteur — il signale que deux membres ont reçu la conclusion avant le dossier, ce qui justifie
    de reprendre les trois affirmations séparément. Je propose que le chargé de mission pilote le test
    qui validerait son hypothèse.


    ## 2. Ce que je recommande


    **Reconduire à l''identique sur une durée courte (12 mois), sans v4, sans bascule, et sans signer
    trois ans avant le 30.**


    Seule option qui n''achète rien d''irréversible alors que le diagnostic manque et qu''il est peu coûteux
    à obtenir avant le 31 octobre. Le critère décisif n''est pas le coût, c''est la réversibilité.


    **Ce que ça coûte, explicitement :** ~6 200 €/an d''avantage-remise ; le maintien de la ressaisie
    à Rive-Sud ; et le risque que l''éditeur refuse une reconduction courte ou la surfacture — à poser
    par écrit cette semaine. **Ce que ça évite :** 31 000 € contre une compatibilité « à l''étude », et
    trois ans à +7 % sur un défaut non caractérisé.


    **Contre-argument le plus sérieux :** « on perd la remise, on garde le module quatre mois de plus,
    et fin octobre on signera dans l''urgence, plus cher. » Exact **si l''instruction n''est pas menée**
    — d''où un repli daté, écrit dès maintenant plutôt que subi.


    **Ce qui renverserait cet avis :** un journal applicatif montrant des pertes **multi-sites** postérieures
    à mars et absentes avant ; ou un engagement **écrit** sur la compatibilité des bornes 2015 — dans
    ce second cas, v4 + reconduction remisée redevient défendable dès la séance.


    ## 3. Les quinze jours


    1. **Courrier éditeur sous 5 jours** : (a) journaux applicatifs janvier→août **par site** ; (b) correctifs
    et versions déployés en février et mars ; (c) position écrite et datée sur la compatibilité bornes
    2015 ; (d) confirmation que la remise tient jusqu''au 31 octobre + conditions d''une reconduction
    12 mois. Un refus sur (c) ou (d) est en soi une information.

    2. **Relevé contradictoire Rive-Sud / Fontaine sur deux semaines** — saisies, honorées, ressaisies.
    Le test le plus discriminant du dossier, pour quelques heures d''agents.

    3. **Instruire février** : dates exactes fibre et portail, mises en regard des 96 réclamations mois
    par mois.

    4. **Courbe des réclamations après juin.**

    5. **Chiffrage du parc 2015 séparément**, indépendamment du choix logiciel.

    6. **Ressource** : le départ d''octobre est un fait du dossier. Aucune option n''est tenable à un
    agent.

    7. **Appel au réseau voisin** : pourquoi 2 sites sur 5 sont-ils encore au papier, et quelle charge
    interne réelle ?

    8. **Rive-Sud** : reconnaître la charge et proposer un appui temporaire — le site qui paie ne peut
    pas être aussi celui à qui on demande d''attendre.


    **Repli, déclencheur observable :** si **au 30 septembre** les pièces 1(a)–(c) manquent, ou si le
    relevé (2) confirme des pertes multi-sites → session courte début octobre, option par défaut arrêtée
    dès aujourd''hui : reconduction trois ans, remise si maintenue, **indexation plafonnée + clause de
    sortie annuelle**, v4 non engagée tant que la compatibilité n''est pas écrite.


    Deux choses que le dossier ne permet pas de trancher : la cause réelle des pertes, et le coût complet
    du libre. Les points 1 à 4 lèvent la première avant le 31 octobre ; le point 7 documente la seconde
    pour le prochain cycle.

    '
