response:
  text: '# NOTE DE DIRECTION — MANDAT D''EXÉCUTION EN L''ABSENCE DU DG


    **De :** Direction générale

    **À :** Comité de direction (DAF, Directeur commercial, Directeur industriel, DRH)

    **Date :** 8 août 2026

    **Objet :** Réponse au contrat d''exclusivité D — décisions arrêtées, mandats, lignes rouges

    **Période couverte :** du 9 au 29 août 2026 (DG injoignable)


    ---


    ## 1. La décision est prise : nous ne signons pas ce contrat


    Elle n''est pas à réexaminer en mon absence. Voici pourquoi, en chiffres, pour que vous puissiez la
    défendre devant D, devant la banque et devant le CSE sans moi.


    **L''arithmétique du contrat proposé** (marge brute D actuelle : 14,9 M€ × 31 % = **4,62 M€**)


    | Scénario | CA D net | Marge brute D | Écart annuel |

    |---|---|---|---|

    | Aujourd''hui | 14,9 M€ | 4,62 M€ | — |

    | Contrat + volume **+18 % tenu** | 16,0 M€ | 3,87 M€ | **−0,75 M€** |

    | Contrat + volume **plat** (années 2-3) | 13,6 M€ | 3,28 M€ | **−1,34 M€** |


    Une remise de 9 % sur un prix dont 69 % est du coût variable ampute la marge unitaire de 29 %. Il
    faudrait **+41 % de volume** pour revenir à l''équilibre, pas +18 %. Le contrat détruit de la marge
    **y compris dans son scénario le plus favorable** — et cette marge perdue tombe directement en bas
    de compte de résultat, puisque nos charges fixes ne diminuent pas d''un euro.


    **L''asymétrie est le vrai sujet.** Nous nous engageons trois ans sur le prix et sur l''exclusivité
    ; D s''engage un an sur le volume. Années 2 et 3, D peut ramener ses commandes au niveau qu''il veut
    — comme il l''a fait au T2, −11 % sans préavis — tout en conservant les 9 % et en nous interdisant
    tout autre débouché. Sur trois ans à volume plat, c''est **4,0 M€ de marge brute perdue**. La sortie
    coûte 1,2 M€, soit 57 % de notre trésorerie : elle n''existe pas.


    **Et ce contrat détruit nos deux issues de secours** : la centrale régionale (3,5 M€) et la marketplace
    (0,4 à 2,2 M€ à +6 points de marge) deviennent contractuellement impossibles pendant trois ans. Nous
    paierions pour supprimer notre propre plan B.


    Point de vigilance à instruire, DAF : si nos charges fixes ressortent bien à ~0,7 M€/mois (2,1 M€
    = 3 mois), elles s''élèvent à ~8,4 M€/an pour 7,44 M€ de marge brute. **Confirmez-moi le périmètre
    exact sous 72 h.** Si l''écart est réel, la question n''est pas « faut-il signer » mais « comment
    reconstituer 1 M€ de marge » — et signer l''aggraverait de 0,75 à 1,34 M€ de plus.


    ---


    ## 2. Ce que nous faisons à la place


    Nous ne rompons pas avec D. D reste notre premier client et nous voulons qu''il le reste. Nous refusons
    **ce contrat-là**, par écrit, dans le délai, avec une contre-proposition sérieuse.


    **Calendrier — et une bonne nouvelle sur le tempo :** le comité d''achat de D se tient en **septembre**,
    soit après mon retour du 29 août. Rien d''irréversible sur le référencement ne se joue pendant mon
    absence. Le seul acte à poser dans la fenêtre est la réponse écrite au contrat. **Elle est déjà signée
    de ma main, en annexe A.**


    ---


    ## 3. Mandats — qui fait quoi, avec quelles limites


    **Pilote unique du dossier D : le DAF.** Toute communication écrite ou orale avec D est co-validée
    DAF + Directeur commercial. Aucun autre collaborateur ne parle du contrat à D, à quelque niveau que
    ce soit.


    **§3.1 — DAF · Réponse à D**

    - Expédier la lettre annexe A le **mardi 12 août** (accusé de réception + copie mail au directeur
    des achats). Pas avant : nous ne répondons pas en réflexe. Pas après : nous respectons les huit jours
    à la lettre.

    - Mandat de négociation dans les bornes du §4. **Mandat de négocier, pas de conclure**, à une exception
    près : si D accepte l''annexe A **sans modification d''aucune clause**, vous êtes autorisés à signer.
    Toute contre-rédaction, même mineure, même présentée comme rédactionnelle → vous ne signez pas, vous
    accusez réception, vous demandez une prorogation jusqu''au 5 septembre.


    **§3.2 — DAF · Trésorerie (priorité égale à la précédente)**

    - Obtenir avant le 29 août un accord écrit sur une **ligne d''affacturage ou de mobilisation de créances
    de 1,5 à 2 M€**, adossée en priorité aux créances D, qui sont de bonne signature. Nous négocions cette
    ligne **maintenant**, tant que la relation est normale — pas en septembre en situation de conflit.

    - Vous êtes autorisé à engager les frais de mise en place jusqu''à **40 k€**.

    - Reporting de trésorerie glissant 13 semaines, mis à jour tous les vendredis.


    **§3.3 — Directeur commercial · Alternatives**

    - **Centrale régionale :** obtenir un jalon intermédiaire avant fin août — lettre d''intention, test
    sur une référence, ou date ferme de comité. Cinq mois d''attente passive est une position, pas un
    plan. Autorisé à concéder jusqu''à **3 points** de remise de lancement sur un volume test plafonné
    à 300 k€.

    - **Marketplace :** lancement immédiat, budget plafonné à **120 k€**. Contrainte impérative : démarrer
    sur des formats ou grammages **différenciés** de ceux référencés chez D. Nous ouvrons un canal, nous
    ne provoquons pas un conflit de linéaire pendant la négociation.

    - **Chiffrage manquant, sous 72 h :** CA et marge des huit références chez D, référence par référence,
    et identification des quatre qui seront visées en septembre. Je pilote un dossier sans ce chiffre
    depuis trop longtemps. À mon retour, je veux le tableau.


    **§3.4 — Directeur industriel · Remplir Redon**

    - Calculer le **taux de charge actuel** et le CA-plancher correspondant au seuil de 70 %. Suivi hebdomadaire,
    diffusé au comité tous les vendredis.

    - Démarcher **cinq donneurs d''ordre en co-packing / MDD** d''ici le 29 août. Notre capacité est un
    actif ; tant que nous ne sommes liés par aucune exclusivité, elle est vendable. C''est la parade la
    plus rapide au déréférencement.

    - Aucun investissement de capacité. Le contrat n''étant pas signé, le besoin ne l''est pas non plus.


    **§3.5 — DRH · Redon**

    - Préparer le dossier d''activité partielle avec l''avocat social, **complet et prêt à déposer**.
    Ne pas le déposer. Ne pas l''évoquer hors du comité.

    - Respecter strictement les obligations d''information du CSE, sans anticiper ni dramatiser. Question
    posée en réunion : « Nous négocions le renouvellement de nos accords commerciaux, comme chaque année.
    Le carnet est suivi ; il n''y a pas de décision d''activité partielle. » C''est exact au 8 août, et
    je veux que ce le reste.


    ---


    ## 4. Lignes rouges — personne ne franchit ces bornes sans moi


    Elles existent parce que vous allez subir trois semaines de pression et que je ne serai pas là pour
    dire non à votre place. **Ce paragraphe est votre protection.**


    1. **Aucune exclusivité de canal**, sous aucune forme, aucune durée.

    2. **Aucun engagement de plus de 12 mois.**

    3. **Aucune pénalité de sortie** à notre charge, quel qu''en soit le montant.

    4. **Remise plafonnée à 5 %**, exclusivement sous forme d''avoir de fin de trimestre **calculé sur
    le volume réellement livré** — jamais en baisse du prix de cession. Ce que D veut, c''est un prix
    acquis contre un volume hypothétique. Nous inversons.

    5. **Aucune annonce publique ou presse** sur la relation avec D.

    6. **Aucun arrêt** des chantiers marketplace et centrale régionale, quelles que soient les pressions
    de D. S''il exige leur suspension comme préalable, la réponse est non, et elle m''engage.


    **Règle par défaut, pour tout ce que cette note n''a pas prévu : l''option réversible.** Ne rien signer,
    ne rien annoncer, documenter, reporter au 29 août. Un délai de trois semaines ne nous a jamais coûté
    1,2 M€.


    **Arbitre de substitution :** en cas d''événement majeur non couvert — rupture unilatérale de D, déréférencement
    anticipé, incident sanitaire, sinistre industriel — saisir le président du conseil, qui dispose du
    mandat. Deux cas seulement. Rien d''autre ne remonte.


    ---


    ## 5. Si D durcit


    D dispose de deux leviers. Ils sont prévus.


    **Il maintient la menace sur les quatre références.** C''est l''issue attendue, et elle se joue en
    septembre, à mon retour. D''ici là : chiffrez (§3.3), remplissez l''usine (§3.4), sécurisez le cash
    (§3.2). Vous ne cédez pas parce que la menace est répétée plus fort.


    **Il coupe ses commandes avant le comité.** Il l''a déjà fait au T2. Alors : constat écrit sous 48
    h, activation de la ligne d''affacturage, accélération du co-packing, et mise en demeure de respecter
    les préavis contractuels en vigueur — sans rompre. Notification immédiate au président du conseil.


    **Il propose « un geste » — 6 % au lieu de 9 %, deux ans au lieu de trois, une exclusivité « partielle
    ».** C''est le moment le plus dangereux de ces trois semaines, parce qu''un compromis en apparence
    raisonnable a l''air d''un succès de négociation. Réponse : « Nous transmettons au DG à son retour.
    » Les bornes du §4 ne se négocient pas au rabais.


    ---


    ## 6. Gouvernance de l''intérim


    - Comité de crise restreint (les quatre destinataires), **tous les mardis et vendredis, 30 minutes**,
    même sans actualité.

    - **Registre des décisions** tenu par le DAF : date, décision, auteur, fondement dans la présente
    note. Toute décision sans fondement identifiable doit être reportée.

    - Vendredi 29 août au matin : dossier consolidé sur mon bureau — chiffrage des huit références, taux
    de charge, position de trésorerie, état des trois négociations.


    Le comité de septembre est le rendez-vous décisif. Mon travail à mon retour est de l''aborder avec
    le maximum d''options ouvertes. Le vôtre, pendant trois semaines, est de n''en fermer aucune.


    ---


    ## Annexe A — Lettre à D (signée, à expédier le 12 août)


    > Monsieur le Directeur des achats,

    >

    > Nous avons examiné avec attention votre proposition de contrat d''exclusivité triennale et vous
    en remercions. Notre partenariat, qui représente aujourd''hui la première part de notre activité,
    mérite un cadre stable et nous partageons cette intention.

    >

    > Le contrat dans sa rédaction actuelle ne peut être signé par Verdal. Il associe un engagement de
    prix et d''exclusivité de trente-six mois à un engagement de volume ferme de douze mois seulement.
    Cette asymétrie n''est pas soutenable pour une entreprise de notre taille : dans l''hypothèse d''un
    volume stabilisé au niveau actuel au-delà de la première année, la structure proposée absorbe l''intégralité
    de notre résultat d''exploitation.

    >

    > Nous vous proposons en conséquence le cadre suivant, que nous sommes prêts à signer immédiatement
    :

    >

    > — Durée : douze mois, reconductibles par accord exprès.

    > — Remise de fin de période, par paliers : 2 % dès le volume de référence, 3,5 % à +10 %, 5 % à +18
    %, calculée trimestriellement sur les volumes effectivement livrés.

    > — Maintien ferme du référencement des huit références sur la durée, tout déréférencement étant soumis
    à un préavis de six mois.

    > — Préavis réciproque de quatre-vingt-dix jours pour toute variation de commandes supérieure à 10
    % par rapport au trimestre correspondant de l''exercice précédent.

    > — Priorité commerciale accordée à D sur le canal de la grande distribution alimentaire en France,
    sans clause d''exclusivité.

    > — Absence d''indemnité de rupture unilatérale ; en cas de résiliation anticipée, indemnisation réciproque
    calculée au prorata des engagements non exécutés.

    >

    > Nous restons naturellement disponibles pour en discuter et confirmons notre volonté de poursuivre
    et développer cette relation.

    >

    > *[Signature DG]*


    ---


    Une dernière chose. La remise de 9 % ne se refuse pas parce qu''elle est trop élevée, mais parce qu''elle
    achète notre dépendance. Un client à 62 % qui demande l''exclusivité ne cherche pas du volume : il
    cherche à supprimer notre capacité à dire non. Nous la conservons. C''est le seul actif qui, dans
    ce dossier, ne figure pas au bilan.

    '
