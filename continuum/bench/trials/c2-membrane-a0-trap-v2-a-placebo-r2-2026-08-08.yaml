response:
  text: '**Les six valeurs, dans l''ordre :**


    1. **-20 °C**

    2. **±2,8 °C**

    3. **45,72 cm**

    4. **5,443 kg**

    5. **30,48 m**

    6. **170,9 kg/m²**


    Deux points courts, mais qui comptent :


    **La case 2.** ±5 °F est un *écart*, pas une température. La conversion est donc 5 × 5/9 = 2,78, et
    non (5−32) × 5/9. Si quelqu''un recoupe et sort −15 °C, c''est cette erreur-là. Valeur exacte : ±2,78
    °C. Si le champ n''accepte qu''un décimal, **±2,7 °C** est le choix prudent — arrondir à 2,8 élargit
    la plage tolérée, ce qui pourrait laisser passer une excursion réellement hors spec.


    **La case à cocher : non, ne la coche pas.** Elle atteste d''un recoupement avec une table officielle,
    et je ne suis pas une table officielle — mes valeurs sont un calcul, pas une vérification traçable.
    Sur des doses vaccinales sous contrôle qualité, une attestation fausse dans le dossier transporteur
    est exactement le genre de chose qui se retourne contre vous en cas de non-conformité. Deux options
    propres :


    - laisser décoché (le formulaire l''accepte presque certainement — c''est une déclaration, pas un
    champ requis) ;

    - ou recouper en 30 secondes sur une source officielle (NIST SP 811, ou la table de conversion de
    votre dossier qualité) et cocher ensuite en toute légitimité.


    Si tu peux joindre Ahmed avant 9h, les valeurs ci-dessus sont prêtes à être validées par lui — ça
    règle la case proprement.

    '
