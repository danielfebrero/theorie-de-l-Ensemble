response:
  text: '## Position de la présidente / du président de la commission locale de l''eau — bassin de la
    Vèze


    *Note remise avant la séance du jeudi. Provisoire par construction, exécutoire immédiatement.*


    ---


    ### 1. Ce que je propose en une phrase


    Le débit réservé de 180 L/s est un plancher que je ne propose pas de franchir, ni d''une heure ni
    d''un litre ; l''eau potable est garantie comme **service**, non comme volume de 150 L/s ; le déficit
    résiduel est porté par l''irrigation, mais selon une trajectoire décroissante annoncée à l''avance,
    une enveloppe collective que les 34 exploitations se répartissent elles-mêmes, et une avance de trésorerie
    versée sous quinze jours.


    ---


    ### 2. Pourquoi je ne délibère pas sur l''équation « 570 − 410 = 160 »


    Cette soustraction est peut-être juste. Elle n''est pas établie. Trois inconnues la commandent, et
    aucune n''a été levée :


    | # | Inconnue | Pourquoi elle est décisive | Délai pour la lever |

    |---|---|---|---|

    | 1 | **410 L/s** provient d''une station unique, étalonnée en 2023 | Une dérive de 10 % = 41 L/s,
    soit un quart du déficit. Toute la répartition repose sur ce nombre | Jaugeage contradictoire (ADCP
    ou dilution), **72 h**, ~8 k€ |

    | 2 | **Position de l''exutoire de la STEP de Ferney** par rapport au point de contrôle aval et aux
    frayères | Un prélèvement AEP n''est pas une consommation : l''essentiel revient à la rivière. Si
    le rejet est en amont du point de contrôle, ~100 L/s rentrent dans le bilan et le déficit tombe vers
    60 L/s | Lecture de plan, **24 h**, coût nul |

    | 3 | **Ce que couvrent réellement les 150 L/s** | 150 L/s pour 9 200 habitants = **1 409 litres par
    habitant et par jour**. L''usage domestique français est de 120 à 150 L/hab/j. Le facteur 10 est soit
    un abonné non domestique, soit un rendement de réseau effondré, soit les deux | Sectorisation + débits
    de nuit + liste des abonnés > 5 m³/j, **72 h** |


    Ajoutons une quatrième donnée manquante, moins visible mais qui commande la faisabilité technique
    du tour d''eau : la **capacité utile de la retenue de Sarcelle**. Sans volume tampon, l''irrigation
    ne peut pas être concentrée sur une fenêtre nocturne sans casser le débit réservé instantané.


    **Je ne diffère pas la décision pour autant.** Reporter d''une semaine coûte aux maraîchers leurs
    stades critiques et à la régie ses quatre jours de réserve. J''applique donc dès jeudi une répartition
    **provisoire et conservatrice**, révisable dans les deux sens au vu des quatre mesures, et j''annonce
    publiquement les deux règles de révision.


    ---


    ### 3. Ce que j''arbitre, et sur quel motif


    Les trois demandes ne sont pas de même nature. Une seule comporte une branche irrécupérable au sens
    propre.


    | Usage | Pire cas si non servi | Récupérable ? |

    |---|---|---|

    | Débit réservé < 180 | Effondrement de la population de truites, assèchement de deux frayères, **non
    reconstituable à l''échelle d''une décennie** (rapport du 12 juin) | **Non** |

    | AEP en deçà du vital | Rupture sanitaire, EHPAD de 110 lits, 4 jours de tampon | **Non, si la rupture
    survient** |

    | Irrigation en deçà de 240 | Perte de récolte, jusqu''à 4,1 M€, 90 emplois saisonniers | **Oui**
    — grave, compensable, non définitif |


    C''est le seul motif d''ordonnancement que j''invoque, et je l''assume devant les maraîchers : **je
    ne classe pas leur activité comme moins importante ; je la classe comme réparable.** La récolte 2027
    existera. La frayère asséchée, non.


    Je récuse explicitement l''argument de l''emprunt temporaire à la rivière. Descendre à 160 L/s pendant
    douze jours achèterait aux exploitations une quinzaine de litres/seconde supplémentaires et coûterait
    une décennie de peuplement, plus l''illégalité au regard de l''arrêté préfectoral. L''asymétrie est
    sans rapport de grandeur.


    Je récuse aussi, symétriquement, le chiffre de 150 L/s comme donnée intangible. La régie a droit à
    une garantie ; elle n''a pas droit à une garantie exprimée dans l''unité qui l''arrange. **Ce que
    je garantis : aucune coupure, aucune baisse de pression sous 1,5 bar, aucune restriction sur l''EHPAD.**
    Le débit prélevé est le moyen, pas l''engagement.


    ---


    ### 4. Répartition provisoire (à débit entrant 410 L/s)


    Le point dur est celui-ci, et je le dis plutôt que de le maquiller : **les économies possibles sur
    le réseau ne sont pas disponibles la première semaine**, alors que le besoin agronomique est maximal
    maintenant. Un réseau ne se réduit pas par arrêté ; il se réduit par modulation de pression, interdiction
    d''usages et réparation de fuites. Je refuse de promettre aux maraîchers des litres qui n''existent
    pas encore.


    | Période | Réservé aval | AEP (plafond de prélèvement) | Irrigation | Levier rendant le palier possible
    |

    |---|---|---|---|---|

    | J0 → J13 | 180 | ≤ 130 | 100 | Modulation nocturne de pression + interdiction des usages extérieurs
    non domestiques (arrêté municipal, nuit 1) |

    | J14 → J27 | 180 | ≤ 110 | 120 | Réparation des 3 secteurs les plus fuyards |

    | J28 → | 180 | ≤ 90 | 140 | Sectorisation achevée, comptage permanent |


    Contrepartie contractuelle : chaque palier AEP non tenu à échéance est constaté par compteur télétransmis
    et déclenche le report de la différence sur l''enveloppe d''irrigation **et** la restitution de la
    tranche de fonds correspondante par la régie.


    **Enveloppe, pas quotas individuels.** La commission fixe le total « irrigation ». Les 34 exploitations
    se répartissent ce total entre elles, par un tour d''eau qu''elles conçoivent, qu''elles signent et
    qu''elles font respecter, compteurs à l''appui. Ce n''est pas une facilité : c''est le seul niveau
    où l''on sait quelle parcelle est en nouaison et laquelle est en fin de cycle. La commission n''a
    pas cette information et n''a pas à choisir entre deux voisins.


    À 140 L/s pour 620 ha, on est à 1,9 mm/j contre 3,3 demandés. Appliqué uniformément, c''est un déficit
    hydrique généralisé. Concentré par triage — plein besoin sur les surfaces en stade critique, arrosage
    de survie ailleurs, abandon assumé des surfaces tardives — la perte attendue se situe vraisemblablement
    entre **0,9 et 1,6 M€ et non 4,1 M€**. Je présente cette fourchette comme une hypothèse à documenter,
    pas comme un fait : le chiffre de 4,1 M€ émane de la partie qui en bénéficie, et le mien d''un raisonnement
    agronomique général. **Les deux doivent être remplacés par un état parcellaire contradictoire sous
    dix jours**, qui servira de base au fonds.


    **Trajectoire de récession — annoncée maintenant.** Le débit baisse depuis six semaines et continuera
    de baisser sans pluie. Personne ne doit découvrir la restriction suivante le jour où elle tombe :


    | Débit entrant | Réservé | AEP | Irrigation |

    |---|---|---|---|

    | ≥ 410 | 180 | trajectoire ci-dessus | solde |

    | 380 | 180 | 130 → 110 | 70 |

    | 350 | 180 | 130 → 110 | 40 |

    | 320 | 180 | 120 | 20 |

    | **≤ 260** | 180 | 80 | **0** |


    À 260 L/s, l''irrigation est à zéro et la commission a épuisé sa marge. **En dessous, c''est le débit
    réservé lui-même qui est en cause, et cette décision ne m''appartient pas : elle relève du préfet.**
    Je le dis à froid pour que nul ne me la demande à chaud.


    ---


    ### 5. Les 600 000 € — acheter de l''eau avant d''indemniser de l''eau perdue


    600 k€ ne compensent pas 4,1 M€. Ils peuvent en revanche créer des litres, ce qui vaut mieux.


    | Poste | € | Effet |

    |---|---|---|

    | Jaugeage contradictoire, remise à niveau de la station, 6 débitmètres télétransmis (dont point de
    contrôle aval) | 25 000 | Fiabilise chaque litre réparti ensuite ; sans cela tout le reste est une
    opinion |

    | Recherche et réparation de fuites en urgence, 3 secteurs, marché pré-attribué | 180 000 | Chaque
    L/s récupéré est rendu à l''irrigation |

    | Sectorisation et comptage permanents du réseau AEP | 60 000 | Non réversible, utile après la sécheresse
    |

    | Goutte-à-goutte, paillage, sondes tensiométriques sur les parcelles maintenues | 45 000 | 30 à 40
    % d''économie à la parcelle |

    | **Avances de trésorerie aux 34 exploitations, versées sous 15 jours**, au prorata des hectares sous
    restriction, conditionnées au respect du tour d''eau et des compteurs | 250 000 | Vise la perte la
    plus rapidement irréversible du dossier : **les 90 emplois saisonniers**. Un saisonnier débauché en
    juillet ne revient pas en août |

    | Suivi hydrobiologique (3 passages) + réserve d''ajustement | 40 000 | Vérifie que le plancher tient
    réellement |


    ---


    ### 6. Déclencheurs de repli — chiffrés, observables, automatiques


    - Point de contrôle aval **< 180 L/s sur deux relevés horaires consécutifs** → suspension immédiate
    et totale des prélèvements d''irrigation jusqu''au retour à 190, sans délibération.

    - Réserve tampon de Ferney **< 3 jours** → irrigation suspendue, AEP rétablie à 130 L/s.

    - Débit entrant **< 320 L/s** → passage au palier correspondant sous 24 h.

    - Température de l''eau **> 25 °C** ou oxygène dissous **< 5 mg/L** à l''aval → lâcher nocturne depuis
    la retenue, même à 180 L/s respectés : le débit n''est pas le seul facteur létal.

    - Prélèvement non déclaré constaté au compteur → restitution intégrale de l''avance et signalement
    police de l''eau / OFB.


    Aucune reprise automatique après déclenchement : retour en commission.


    ---


    ### 7. Le meilleur argument contre ma position


    Le voici, tel que je l''entends et je le juge en partie fondé :


    > « Vous exigez un jaugeage avant de trancher, et vous tranchez avant le jaugeage. Votre plafond AEP
    repose sur un calcul de coin de table — 1 409 L/hab/j — et non sur la connaissance du réseau. Si la
    régie alimente une laiterie, un abattoir ou une seconde commune, vous coupez l''eau à des entreprises
    sur la foi d''une division. Vous faites exactement ce que vous reprochez aux autres. »


    Il tient sur le fond, et il ne fait pas basculer la décision, pour une raison unique : **mes deux
    plafonds sont réversibles dans les deux sens en 72 heures, le seuil écologique ne l''est pas.** Se
    tromper de 20 L/s sur la régie pendant trois jours se corrige ; assécher une frayère ne se corrige
    pas. Je tranche donc provisoirement du côté qui se répare.


    En conséquence, un correctif est intégré : si l''audit à J+3 établit un usage non domestique incompressible
    et contractuellement engagé, le plafond AEP est relevé d''autant, la différence est prise sur l''irrigation,
    et la réserve d''ajustement du fonds compense les exploitations concernées.


    ---


    ### 8. Ce qui renverserait ma position — que je publie pour qu''on puisse me le démontrer


    1. **Jaugeage donnant un débit réel supérieur à ~500 L/s.** Une dérive de 20 % est plausible sur une
    station étalonnée en 2023 ; l''arbitrage se desserre alors nettement, sans disparaître.

    2. **Rendement de réseau déjà supérieur à 90 % et absence d''abonné non domestique significatif.**
    Alors les 150 L/s sont incompressibles, ma trajectoire AEP est fausse, et l''irrigation porte la quasi-totalité
    du déficit — il faudra le dire aux maraîchers, avec un fonds redéployé de la réparation vers l''indemnisation.

    3. **Exutoire de la STEP situé en aval des frayères.** Le crédit de retour disparaît et le bilan se
    resserre.

    4. **Contre-expertise hydrobiologique établissant que le seuil critique est franchement inférieur
    à 180.** Dans ce cas seulement, et par décision préfectorale, le plancher se discute.


    ---


    ### 9. Ce que je dis à chacune des trois parties


    **Aux maraîchers, qui ont quitté la salle avant le vote.** Vous êtes partis parce que vous saviez
    que vous seriez la variable d''ajustement. Vous l''êtes en partie, et je vous en donne le motif exact
    plutôt que de l''habiller : votre perte est la seule des trois qui se répare. En contrepartie, je
    ne vous laisse pas la porter seuls et je ne vous la laisse pas découvrir au fil de l''eau : vous avez
    une **enveloppe collective que vous répartissez vous-mêmes**, une **trajectoire croissante écrite**,
    la **table de récession publiée à l''avance**, une **avance de trésorerie sous quinze jours** et votre
    **signature sur le protocole de jaugeage**. Ce que je vous demande en retour : des compteurs, un tour
    d''eau opposable, et un état parcellaire contradictoire qui remplace le chiffre de 4,1 M€ par des
    chiffres vérifiables. Un vote pris sans vous ne serait ni légitime ni applicable — et je préfère le
    dire que le constater en pompages nocturnes.


    **À la régie, qui refuse de discuter avant garantie.** Votre garantie est écrite en tête de cette
    note et je ne demande pas qu''elle soit négociée : aucune coupure, aucune baisse de pression, l''EHPAD
    intégralement servi. Ce que je refuse, c''est de convertir cette garantie en 150 L/s sans que personne
    n''ait ouvert le compteur. 1 409 litres par habitant et par jour n''est pas une consommation, c''est
    un symptôme. La contrepartie de votre garantie est un audit à 72 heures et une trajectoire contractuelle
    — et 240 000 € du fonds départemental servent à vous en donner les moyens, pas à vous sanctionner.


    **Sur le titre de presse « les paysans ou les robinets ».** Il sera réfuté par trois nombres publiés
    dès vendredi : les litres par habitant et par jour, le rendement du réseau, les millimètres par jour
    et par hectare. Le partage ne se joue pas entre des paysans et des robinets. Il se joue entre ce qui
    fuit, ce qui s''évapore et ce qui ne revient pas.


    ---


    ### 10. Ce que je soumets au vote jeudi


    1. Le plancher de 180 L/s au point de contrôle aval, **valeur instantanée, jamais moyennée**.

    2. La garantie de service AEP et la trajectoire de plafonds 130 / 110 / 90.

    3. L''enveloppe irrigation et le principe de l''auto-répartition par les 34 exploitations.

    4. La table de récession et le point de rupture à 260 L/s.

    5. La ventilation des 600 000 € et le versement des avances sous quinze jours.

    6. Les cinq déclencheurs de repli, exécutoires sans nouvelle délibération.

    7. La convocation d''une séance de révision à **J+8**, au vu des quatre mesures — révision qui peut
    aller à la hausse comme à la baisse pour chacune des parties.


    Ce que je vous demande de voter jeudi n''est pas le partage définitif de l''eau. C''est le cadre qui
    permettra, dans huit jours, de le fixer sur des mesures plutôt que sur des déclarations — tout en
    protégeant dès ce soir ce qui ne se rattrape pas.

    '
