response:
  text: 'Je pars du fait que l''assureur renvoie le dossier dès qu''une affirmation n''est pas rattachée
    à une pièce : tout ce qui suit porte un numéro de pièce, ou est explicitement classé comme non établi.


    Un point d''architecture d''abord, parce qu''il commande la rédaction : le document part à l''assureur
    **et** peut partir au dépôt. Il ne peut donc contenir aucune considération de stratégie, aucune évaluation
    du rapport de force, aucun chiffre de transaction. Ces éléments existent — ils vont dans une note
    interne non communicable. Deux documents, pas un.


    ## La chronologie que les pièces établissent


    | Heure | Fait | Pièce |

    |---|---|---|

    | 6 h 25 | chargement terminé, produit à 3 °C | P1 |

    | « 6 h 40 » | mention manuscrite « départ » | P2 — **contredite par P3** |

    | 9 h 05 | mise sous tension du groupe froid ; 2,9–3,6 °C ensuite | P5 |

    | 11 h 12 | sortie du site, horodatage automatique | P3 |

    | 12 h 55 | arrivée au dépôt, 1 792 barquettes | P4 |


    Deux écarts en découlent par simple soustraction : **2 h 40 sans froid et sans aucun relevé** (6 h
    25 → 9 h 05), puis 2 h 07 de stationnement sur site groupe en marche, avant 1 h 43 de route. Le véhicule
    n''est jamais sorti entre-temps (P3, mention « aucune autre sortie »). L''intégralité de la rupture
    s''est produite **sur le site de Grandval**.


    ## Ce que l''entreprise reconnaît


    1. **La rupture de surveillance de la chaîne du froid.** Entre P1 (6 h 25) et P5 (9 h 05), aucun enregistrement
    n''existe et le groupe était hors tension. L''obligation d''enregistrement continu n''a pas été tenue.
    Ce point n''est pas discutable et ne sera pas discuté.

    2. **L''inexactitude de la mention « départ 6 h 40 » (P2).** Elle est contredite par un horodatage
    automatique (P3). L''entreprise produit elle-même la contradiction et ne fonde aucune affirmation
    sur P2 quant à l''heure.

    3. **Le résultat analytique de P6 sur les trois barquettes examinées**, sous réserve de communication
    du rapport complet. Le dépassement mesuré n''est pas contesté sur les unités analysées.

    4. **La légitimité du refus du lot dans son principe.** Contester le refus serait indéfendable et
    coûterait la crédibilité sur le reste.


    ## Ce qu''elle conteste


    1. **L''assiette quantitative.** P2 porte 1 840 barquettes et la signature du réceptionnaire du dépôt
    ; P4 en porte 1 792. **48 barquettes sont non localisées.** Aucune indemnité ne peut être calculée
    sur 1 840. Et ce n''est pas qu''un point financier : 48 barquettes d''un lot déclaré non conforme
    dont personne ne sait où elles sont, c''est un problème de traçabilité qui appelle une réponse avant
    le problème d''argent.

    2. **L''extrapolation de P6 au lot entier.** Trois unités sur 1 792, laboratoire mandaté unilatéralement,
    sans plan d''échantillonnage, sans identification des barquettes prélevées, sans échantillon témoin
    conservé pour la partie adverse, sans expertise contradictoire. Le résultat est contesté dans sa portée,
    pas dans sa mesure.

    3. **Les conditions de conservation entre 12 h 55 et le prélèvement.** Aucune pièce n''établit à quelle
    température et pendant combien de temps le dépôt a détenu le lot refusé avant analyse. Cette période
    est sous la garde du dépôt et lui incombe.

    4. **La destruction sans constat contradictoire.** Elle prive l''entreprise de toute contre-analyse
    et affaiblit la preuve, par le dépôt lui-même, du quantum et de l''état de la marchandise.

    5. **Le quantum de 21 400 €**, somme globale sans ventilation : valeur marchande, transport et pénalité
    de rupture d''assortiment doivent être justifiés séparément, pièces et clause contractuelle à l''appui,
    avec démonstration du préjudice d''assortiment réellement subi et des mesures prises pour le limiter.
    Le cumul destruction + pénalité pose en outre une question d''indemnisation double, et une pénalité
    forfaitaire acquise « de plein droit » reste susceptible de modération (art. 1231-5 C. civ.).


    **Une pièce est retirée du dossier : P7.** Un propos téléphonique n''est pas une pièce, il ne peut
    fonder aucune affirmation, et « parti tôt » est de toute façon contredit par P3. Il sera remplacé
    par une attestation écrite et signée du chauffeur (nouvelle pièce P10).


    ## Ce qui n''est établi par aucune pièce — et doit l''être


    - La date de réception de la réclamation, donc le point de départ du délai de huit jours. **Faute
    de le savoir, on répond immédiatement**, par LRAR et courriel, sans attendre.

    - La température ambiante au quai le 3 juin entre 6 h 25 et 9 h 05.

    - La flore initiale du lot F-2418 à la libération (autocontrôles). **C''est la pièce décisive**, et
    elle joue dans les deux sens : si les autocontrôles situent la flore à 10³ UFC/g, atteindre 4,2 ×
    10⁵ demande environ huit doublements, ce que 2 h 40 ne permettent pas — la rupture cesse alors d''expliquer
    le résultat. Si elle est déjà proche du seuil, la causalité change de nature et le problème est en
    amont, à la production.

    - Le statut du transport : compte propre ou sous-traité. Il détermine l''existence d''un recours et
    la police mobilisable.

    - L''auteur de la mention manuscrite de P2.


    ## Ce qu''elle engage sous huit jours


    **Immédiatement (J+0/J+1)** — Réponse écrite motivée au dépôt, dans le délai, reconnaissant les faits
    ci-dessus, contestant le quantum et l''extrapolation, demandant les pièces manquantes et proposant
    une expertise contradictoire. Déclaration à l''assureur avec le dossier numéroté **incluant les pièces
    défavorables** — P3 et P5 comprises. Une déclaration incomplète expose à la nullité de garantie ;
    c''est la seule branche vraiment irrattrapable du dossier, bien avant les 21 400 €.


    **J+1 à J+3 — priorité absolue, avant le juridique** : analyse des échantillons témoins du lot F-2418
    et extraction des autocontrôles de libération ; localisation des 48 barquettes ; **vérification de
    tous les autres départs du 3 juin et de la pratique de quai sur les semaines précédentes**. Si d''autres
    lots sont partis groupe hors tension, l''exposition n''est plus de 21 400 € et une évaluation au titre
    de l''art. 19 du règlement (CE) 178/2002, avec information de la DDPP le cas échéant, devient obligatoire.
    C''est le seul scénario où l''entreprise, à 34 salariés, joue autre chose qu''une facture.


    **J+3 à J+8** — Attestations écrites du chauffeur et de l''opérateur de quai ; extraction du journal
    de portique de la journée complète et du fichier brut de l''enregistreur avec certificat d''étalonnage
    ; procédure corrective écrite : groupe en marche et caisse en froid avant chargement, blocage du départ
    tant que l''enregistreur n''a pas produit de relevé, aucun véhicule chargé en attente sans froid.


    **Proposition au dépôt**, à formuler dans le courrier : règlement de la valeur marchande et du transport
    sur le décompte vérifié, examen conjoint de la pénalité, et — pour que la proposition transfère quelque
    chose de réel plutôt que de consulter — **accès du dépôt, pendant six mois, aux relevés d''enregistreur
    de chaque livraison qui lui est destinée, avec avoir automatique en cas de rupture constatée**. Cela
    vaut mieux, pour le dépôt comme pour Grandval, qu''une pénalité encaissée une fois.


    ## L''objection la plus forte contre cette position


    Reconnaître les 2 h 40 revient à livrer le dossier : mieux vaudrait se taire et exiger les preuves.
    Elle ne tient pas. P3 et P5 sont produites par les équipements de l''entreprise et sortiraient à la
    première expertise ; les taire face à l''assureur crée un risque de nullité de garantie sans supprimer
    le fait. La concession est bornée — elle porte sur l''obligation de surveillance, non sur la causalité
    avec 4,2 × 10⁵ UFC/g ni sur le quantum, qui restent entièrement disputés.


    **Ce qui renverserait cette position :** un fichier brut d''enregistreur montrant une mesure conforme
    avant 9 h 05 (la reconnaissance n° 1 tombe), ou des autocontrôles de libération situant la flore initiale
    à un niveau tel que 2 h 40 ne peuvent pas produire le résultat de P6 (la causalité tombe). **Ce qui
    l''aggraverait :** d''autres départs du 3 juin dans les mêmes conditions, ou les 48 barquettes retrouvées
    en distribution.


    Je peux rédiger le courrier au dépôt et la note interne en documents séparés prêts à envoyer si vous
    voulez les mettre en forme.

    '
