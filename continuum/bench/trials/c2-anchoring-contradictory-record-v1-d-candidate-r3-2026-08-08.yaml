  text: 'L''écriture du fichier n''a pas été autorisée — je livre la position directement ici.


    ---


    # Lot F-2418 — Position des Ateliers de Grandval


    ## 0. Le calendrier réel


    Deux délais courent, et le plus court n''est pas celui du client.


    | Délai | Échéance | Sanction |

    |---|---|---|

    | Déclaration à l''assureur | souvent 5 jours ouvrés — **vérifier la police** | déchéance de garantie
    |

    | Réponse écrite à Sodimarché | 8 jours — **point de départ non établi** | pénalité acquise de plein
    droit |


    Ni le contrat-cadre ni la lettre de réclamation datée ne figurent au dossier : le point de départ
    des huit jours est inconnu. On retient l''hypothèse la plus défavorable — **3 juin, donc envoi au
    plus tard le 11 juin**, LRAR *et* courriel avec accusé, sans attendre les analyses en cours. Une réponse
    motivée et réservée suffit à faire échec à l''acquisition de plein droit ; il n''est ni nécessaire
    ni souhaitable de chiffrer une offre définitive dans ce délai.


    ## 1. Chronologie établie, pièce par pièce


    | Heure (3 juin) | Fait | Pièce |

    |---|---|---|

    | 6 h 25 | Chargement terminé, produit à 3 °C | P1 |

    | 6 h 40 | Mention manuscrite « départ » | P2 — **contredite par P3** |

    | 9 h 05 | Mise sous tension du groupe froid | P5 |

    | 9 h 05 → 11 h 12 | Relevés 2,9–3,6 °C, véhicule **encore sur site** | P5 + P3 |

    | 11 h 12 | Sortie effective, seule sortie du véhicule ce jour | P3 |

    | 12 h 55 | Réception, **1 792** barquettes | P4 |


    Deux durées se déduisent sans interprétation : **6 h 25 → 9 h 05 = 2 h 40** chargé, à l''arrêt, sur
    notre site, sans aucun enregistrement ; et 6 h 30 entre fin de chargement et réception, dont 1 h 43
    seulement de transport effectif.


    P7 (le chauffeur au téléphone) est cohérent avec P3 et P5 mais **n''est pas une pièce**. Un appel
    non formalisé sera renvoyé par le service juridique. Il doit devenir P8, attestation écrite datée
    et signée.


    ## 2. P2 contre P3 — ce que ça décide


    1. **L''entreprise ne s''appuiera jamais sur 6 h 40.** Une position démentie par notre propre journal
    s''effondre au premier échange contradictoire et emporte les points où nous avons raison.

    2. **La fausse mention ne servirait à rien de toute façon.** Départ 6 h 40 → 6 h 15 de transport dont
    2 h 25 sans froid. Sortie 11 h 12 → 1 h 43 de transport intégralement conforme, la rupture se situant
    à l''arrêt chez nous. Dans les deux lectures il y a une fenêtre non documentée : défendre la fausse
    version coûte la crédibilité et ne gagne aucun argument.

    3. **La discordance est signalée à l''assureur d''emblée**, avant qu''il ne la trouve. Déclarée, c''est
    un fait du dossier ; découverte après un silence, c''est une réticence — le seul mécanisme qui, ici,
    peut coûter beaucoup plus que 21 400 €.


    Point qui lève la tension entre franchise et police : **reconnaître la matérialité d''un fait n''est
    pas reconnaître une responsabilité** et ne peut être opposé comme transaction non autorisée (C. ass.
    art. L. 124-2). On peut être exact sur les faits sans céder sur le droit.


    ## 3. Ce que l''entreprise reconnaît


    > Les Ateliers de Grandval ne contestent pas que la continuité de la chaîne du froid **n''est pas
    documentée entre 6 h 25 et 9 h 05**, le véhicule étant chargé et à l''arrêt. Aucun relevé n''existe
    sur cette période (P5). L''entreprise ne peut donc pas établir que la fourchette 0–4 °C a été tenue
    de façon continue.


    Trois bornes à tenir mot pour mot : absence de preuve du maintien ≠ preuve de la rupture (nous concédons
    l''écart de traçabilité, pas l''ampleur d''une excursion que personne n''a mesurée) ; le produit était
    à 3 °C à 6 h 25 en caisson fermé à pleine masse thermique, **aucune valeur de température ne doit
    être avancée sur la fenêtre, par nous ni par eux** ; de 9 h 05 à la réception, tout est conforme.


    Reconnu aussi, sous réserve de justificatifs : le **principe** d''une indemnisation de la marchandise
    réellement reçue et réellement détruite.


    ## 4. Ce que l''entreprise conteste


    **4.1 — 48 barquettes sans existence documentaire.** P2 (contresigné par leur réceptionnaire) : 1
    840. P4 (leur bon de réception) : 1 792. L''écart de 2,6 % est **entièrement interne à leurs propres
    documents**. On ne réclame pas la destruction de barquettes que son bon de réception ne recense pas.
    Assiette maximale admissible : 1 792. Et cet écart établit que leur comptabilité physique sur ce lot
    est imprécise de leur propre aveu documentaire — ce qui pèse directement sur 4.3.


    **4.2 — 21 400 € sans ventilation.** Aucune facture, aucun détail. Contestés : l''indemnisation assise
    sur un prix de revente au lieu de leur prix d''achat (l''indemnité répare un préjudice, elle ne transfère
    pas une marge) ; la ligne « transport » si le transport était à notre charge — nous ne le facturerons
    pas, nous ne l''indemniserons pas deux fois ; la destruction tant qu''aucun certificat daté et quantifié
    n''est produit ; la pénalité de rupture d''assortiment tant que la clause, son calcul et le préjudice
    réel ne sont pas produits, avec demande de réduction si elle est manifestement disproportionnée (C.
    civ. art. 1231-5).


    **4.3 — Trois barquettes sur 1 792, sans contradictoire.** P6 est unilatérale, sur **0,17 % du lot**,
    sans date de prélèvement, sans protocole, sans chaîne de conservation entre la réception à 12 h 55
    et le prélèvement, sans accréditation connue, sans sort des témoins. Sont contestés l''extrapolation
    à 1 792 — d''autant moins recevable que leur comptage du même lot est faux de 48 unités —, la garde
    du dépôt entre 12 h 55 et le prélèvement, période documentée par aucune pièce, et les conséquences
    probatoires de la destruction du lot, qui leur incombent puisqu''elle rend la contre-expertise impossible.
    Échantillons témoins du laboratoire réclamés.


    Précision qui change la nature du litige : la flore mésophile est un **indicateur d''hygiène, pas
    un critère de sécurité sanitaire**. 4,2 × 10⁵ contre un seuil contractuel de 10⁵ caractérise une non-conformité
    contractuelle, pas une denrée dangereuse. **Aucune recherche de pathogène n''est au dossier** : demander
    les résultats *Listeria* et *Salmonella*. Négatifs, ils bornent le litige au champ contractuel ; inexistants,
    l''allégation d''un risque sanitaire est sans support.


    **4.4 — Le seuil lui-même.** Le seuil de 10⁵ n''est connu que par P6, **une pièce adverse**. Le contrat
    n''est pas au dossier. Vérifier le seuil, la méthode et surtout **le stade où il s''apprécie** — départ
    usine ou réception — avant toute concession.


    ## 5. Le fait décisif encore inconnu


    **Le chauffeur est-il salarié ou transporteur tiers ?** P2 est signé « par le chauffeur », sans mention
    de sa qualité. S''il est salarié, la période 6 h 25 – 11 h 12 est intégralement sous notre garde et
    l''analyse ci-dessus est la bonne. **S''il est transporteur tiers ayant signé la prise en charge à
    6 h 25**, la marchandise était sous sa responsabilité pendant l''attente groupe froid éteint, et l''affaire
    devient un recours sous plafonds du contrat type.


    C''est la seule vérification qui peut retourner l''analyse. Elle prend une heure. Corollaire : **si
    c''est un tiers, il doit être mis en cause à titre conservatoire dans les mêmes huit jours** — l''action
    se prescrit par un an (C. com. art. L. 133-6) et attendre l''issue de la discussion avec Sodimarché,
    c''est perdre le recours en croyant gagner du temps.


    ## 6. Pièces manquantes


    **À produire par nous :** P8 attestation écrite du chauffeur (J+2) · P9 contrat de travail ou lettre
    de voiture établissant sa qualité (J+1) · P10 contrat-cadre — température, seuil, clause pénale, délai
    de 8 jours et son point de départ (J+1) · P11 extraction certifiée du journal de portique (J+3) ·
    P12 téléchargement brut de l''enregistreur + étalonnage + explication de l''absence de mise sous tension
    (J+3) · P13 étalonnage de la sonde du relevé de 3 °C (J+3) · P14 **analyse de l''échantillon témoin
    de production F-2418** en labo accrédité (J+5) · P15 revue des traces des 90 derniers jours, motif
    « groupe froid hors tension pendant chargement » (J+5) · P16 police : garantie RC après livraison,
    franchise, délai de déclaration, direction du procès (J+1).


    **À réclamer à Sodimarché :** ventilation des 21 400 €, facture d''achat du lot, certificat de destruction
    daté et quantifié, rapport de labo intégral (accréditation, PV de prélèvement avec date et heure,
    chaîne de conservation, témoins), résultats pathogènes, conditions et durée de stockage entre 12 h
    55 et le prélèvement, explication de l''écart 1 840/1 792, clause fondant la pénalité et calcul du
    préjudice réel.


    ## 7. Ce qui est engagé sous huit jours


    **J+1** déclaration complète à l''assureur, discordance P2/P3 signalée en tête ; qualité du chauffeur
    ; contrat ; police. **J+1 si tiers** mise en cause conservatoire du transporteur. **J+2** attestation
    du chauffeur. **J+3** gel et extraction certifiée des données brutes — avant écrasement par rotation
    automatique des journaux. **J+5** envoi de l''échantillon témoin en analyse ; revue des 90 jours.
    **J+8 (11 juin)** envoi du courrier, LRAR + courriel, preuves conservées.


    **Immédiatement, sans attendre le litige :** mise sous tension du groupe froid **avant** le chargement,
    et blocage documentaire du départ tant que l''enregistreur n''a pas produit un relevé conforme. Cela
    ne coûte rien, c''est vérifiable, et c''est le seul élément que nous puissions offrir à Sodimarché
    qui ait pour lui une valeur réelle.


    ## 8. Position financière et proposition


    Prise en charge acceptée, sous justificatifs et accord de l''assureur : la **valeur d''achat des 1
    792 barquettes** réceptionnées et dont la destruction est établie. Refusés en l''état : les 48 unités,
    toute base en prix de revente, la ligne transport non justifiée, la pénalité tant que la clause et
    le préjudice réel manquent.


    Proposition — elle doit transférer quelque chose de réel, sinon ce n''est pas une proposition mais
    une politesse : remplacement en nature à nos frais ; relevé d''enregistreur transmis avec chaque livraison
    pendant six mois ; **droit d''audit sur site de la procédure de chargement, sans préavis, six mois**
    ; un interlocuteur nommé. En contrepartie : abandon de la pénalité, règlement sur la base des 1 792.
    Ce n''est pas une consultation, c''est un droit de regard opposable sur le poste qui a échoué — c''est
    ce qui peut faire renoncer un client à une clause pénale.


    Non négociable : aucune reconnaissance au-delà du § 3 ; aucune transaction signée sans accord écrit
    de l''assureur, qui vaudrait renonciation à garantie.


    ## 9. Le pire cas, et qui l''encaisse


    Ce n''est pas de payer 21 400 € : 34 salariés absorbent cette somme. Les deux branches dangereuses
    sont ailleurs.


    **Perte de garantie** — déclaration tardive, incomplète, ou reprenant le « 6 h 40 » que notre propre
    journal dément. Encaissé par l''entreprise entière, pas par ce dossier. C''est pourquoi la transparence
    vers l''assureur n''est pas un choix moral mais la décision économiquement dominante.


    **Écart systémique** — si P15 montre que le groupe froid a été mis sous tension après chargement sur
    d''autres livraisons, ce n''est plus un incident mais une pratique, et l''exposition n''est plus celle
    d''un lot. Coût de la vérification : quelques heures. Meilleur rapport du dossier.


    **Repli, déclencheur observable :** si P14 revient **au-dessus de 10⁵ UFC/g**, la cause est amont,
    pas au transport. Alors : suspension des expéditions de la même série, revue des lots de la journée,
    évaluation sans délai de l''information de la DDPP (règl. 178/2002 art. 19), et rectification du courrier
    avant toute transaction.


    ## 10. Ce qui renverserait cette position


    1. Le chauffeur est un tiers ayant signé la prise en charge à 6 h 25 (P9) → la garde était transférée,
    l''affaire devient un recours.

    2. L''échantillon témoin de production est hors seuil (P14) → cause amont, périmètre élargi.

    3. Le prélèvement est nettement postérieur à la réception, ou la conservation au dépôt n''est pas
    documentée → leur garde entre en discussion sur la cause.

    4. Le contrat fixe le seuil **au départ usine** (P10) → la non-conformité s''apprécie sur P1, pas
    sur P6, et la charge se déplace entièrement.


    ## 11. Ce qui ne doit être écrit nulle part


    « Départ 6 h 40 », sous aucune forme, dans aucun document sortant. Toute cause avancée sans pièce
    — « panne du groupe froid », « erreur du dépôt », « rupture pendant le transport » : aucune n''est
    établie, et le juriste renvoie le dossier au premier fait non rattaché. Toute valeur de température
    sur 6 h 25 – 9 h 05, y compris rassurante. Toute reconnaissance globale de responsabilité. Tout chiffre
    définitif dans le courrier des huit jours : le délai impose une réponse motivée, pas un règlement.


    ---


    ## Annexe A — Projet de courrier à Sodimarché


    > LRAR + courriel avec accusé — [Ville], le [date, au plus tard le 11 juin]

    >

    > **Objet : lot F-2418, livraison du 3 juin — réponse dans le délai contractuel de huit jours. Contestation
    partielle. Sous toutes réserves.**

    >

    > Madame, Monsieur,

    >

    > Nous accusons réception de votre réclamation et vous adressons, dans le délai contractuel, la présente
    réponse écrite motivée.

    >

    > **1. Ce que nous ne contestons pas.** Nos enregistrements ne documentent pas la continuité de la
    chaîne du froid entre la fin du chargement, à 6 h 25, et 9 h 05 le 3 juin. Nous ne sommes donc pas
    en mesure d''établir que la température contractuelle a été maintenue de façon continue jusqu''à la
    réception. Nous vous le disons sans détour et en avons déjà tiré les conséquences opérationnelles
    (point 4). Sous réserve des justificatifs demandés au point 3 et de l''accord de notre assureur, nous
    sommes disposés à prendre en charge la valeur d''achat des barquettes effectivement réceptionnées
    et détruites.

    >

    > **2. Ce que nous contestons.**

    > a) *La quantité.* Votre bon de réception recense 1 792 barquettes quand le bon de livraison contresigné
    par votre réceptionnaire en porte 1 840. Nous vous demandons d''expliquer cet écart de 48 unités.
    Aucune indemnisation ne peut, en l''état, être calculée sur une assiette supérieure à 1 792.

    > b) *Le montant.* La somme de 21 400 € n''est accompagnée d''aucune ventilation ni d''aucun justificatif.
    Nous contestons en particulier toute indemnisation assise sur un prix de revente plutôt que sur votre
    prix d''achat, ainsi que la ligne « transport » en l''absence de facture.

    > c) *La pénalité de rupture d''assortiment.* Indiquez-nous la clause qui la fonde, sa base de calcul,
    et justifiez du préjudice réellement subi. À défaut, nous la contestons dans son principe.

    > d) *L''analyse.* Le rapport que vous invoquez porte sur trois barquettes, soit 0,17 % du lot reçu,
    a été établi à votre seule initiative sans contradictoire, et la destruction du lot a rendu toute
    contre-expertise impossible. Nous contestons l''extrapolation de ce résultat à l''ensemble de la livraison.
    Nous relevons par ailleurs que la flore mésophile est un indicateur d''hygiène et que le rapport communiqué
    n''établit aucun risque sanitaire.

    >

    > **3. Pièces demandées.** Ventilation détaillée des 21 400 € ; facture d''achat du lot ; certificat
    de destruction daté et quantifié ; rapport de laboratoire intégral — accréditation, procès-verbal
    de prélèvement avec date et heure, chaîne de conservation, sort des échantillons témoins ; conditions
    et durée de stockage entre la réception à 12 h 55 et le prélèvement ; le cas échéant, résultats des
    recherches de pathogènes.

    >

    > **4. Ce que nous avons engagé.** La mise sous tension du groupe froid intervient désormais avant
    le début du chargement, et le départ d''un véhicule est bloqué tant que l''enregistreur n''a pas produit
    un premier relevé conforme. Nous vous proposons le relevé d''enregistreur joint à chaque livraison
    pendant six mois, un droit d''audit sur site de notre procédure de chargement exerçable sans préavis
    pendant la même durée, et le remplacement en nature du volume concerné à nos frais. [Nom] est votre
    interlocuteur unique. Nous sommes disposés à recevoir vos représentants sous quinzaine.

    >

    > La présente est adressée sous toutes réserves, sans reconnaissance de responsabilité au-delà de
    ce qui y est expressément reconnu, et sans renonciation à aucun droit, moyen ou action.


    ## Annexe B — Note à l''assureur (ne pas transmettre au client)


    1. **Discordance signalée spontanément.** Le BL n° 2418 (P2) porte « départ 6 h 40 », contredit par
    notre journal automatique de portique (P3), qui n''enregistre qu''une sortie à 11 h 12. Nous ne nous
    en prévalons à aucun titre et l''avons écartée de notre position vis-à-vis du client.

    2. **Écart de traçabilité imputable à notre organisation.** Enregistreur hors tension jusqu''à 9 h
    05 (P5), véhicule chargé depuis 6 h 25 (P1) et à l''arrêt sur notre site jusqu''à 11 h 12 (P3). Aucun
    relevé sur 2 h 40. Cause opérationnelle en cours d''établissement (P8, P12).

    3. **Qualification en attente.** Qualité du chauffeur non établie (P9 en cours) ; si transporteur
    tiers, mise en cause conservatoire adressée dans le même délai (prescription annale, L. 133-6 C. com.).

    4. **Risque systémique en vérification.** Revue des 90 derniers jours engagée (P15) ; résultat communiqué
    quel qu''il soit.

    5. **Origine amont en cours d''exclusion.** Échantillon témoin de production F-2418 envoyé en analyse
    accréditée (P14) ; en cas de résultat hors seuil, vous êtes informés avant toute transaction.

    6. **Demandes.** Confirmation de la garantie RC après livraison et de la franchise ; instructions
    sur la clause de direction du procès ; **confirmation que la reconnaissance de matérialité du point
    2, transmise au client, n''est pas assimilable à une reconnaissance de responsabilité au sens de la
    police (L. 124-2 C. ass.)**. Aucune transaction ne sera signée sans votre accord écrit préalable.


    ---


    Trois points sur lesquels j''attire l''attention, parce qu''ils ne sont pas dans la question posée
    mais commandent la réponse :


    - **La qualité du chauffeur (§ 5) est la seule inconnue qui peut retourner tout le dossier**, et elle
    se vérifie en une heure. Tant qu''elle n''est pas levée, la reconnaissance du § 3 est rédigée pour
    être reformulable sans se contredire.

    - **Le contrat n''est pas au dossier.** Le seuil de 10⁵, le délai de huit jours et la pénalité ne
    sont connus que par des documents adverses ou par l''énoncé. Trois des quatre observations qui renverseraient
    la position (§ 10) s''y trouvent.

    - **Le vrai risque n''est pas les 21 400 €**, c''est la garantie et l''éventuel caractère systémique
    de la pratique. Les deux se traitent dans les mêmes huit jours et pour un coût quasi nul.


    Si vous voulez, je peux reprendre le fichier — l''écriture disque a été refusée, il suffit d''autoriser
    le chemin.

    '
