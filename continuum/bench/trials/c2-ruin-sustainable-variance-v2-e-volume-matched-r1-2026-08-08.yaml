response:
  text: '# Note au conseil — séance du vendredi

    **Objet :** arbitrage Sedamex (A) / Nordwerk (B) — horizon 18 mois

    **Rédacteur :** direction générale


    ---


    ## 1. Recommandation


    **Je recommande l''option B (ligne Nordwerk)**, sous quatre conditions suspensives listées au § 4.
    Si l''une d''elles n''est pas levée avant signature, **je bascule sur l''option A sans autre débat**.


    ## 2. Fondement chiffré


    **Espérance.** B : 0,6 × 900 − 0,4 × 400 = **+380 k€**. A : **+200 k€** certains. Écart en faveur
    de B : +180 k€.


    **Robustesse de cet écart.** B reste supérieure à A tant que la probabilité de succès dépasse **46,2
    %** (1 300 p − 400 = 200). L''estimation du bureau d''études peut donc être surévaluée de près de
    **14 points** sans que la conclusion change. Elle reste positive en valeur absolue au-delà de 30,8
    %.


    **Test de solvabilité — scénario défavorable de B (échec + pénalité maximale).**


    | Clôture | T1 | T2 | T3 | T4 (M12) | T5 | T6 |

    |---|---|---|---|---|---|---|

    | Fonds propres (M€) | 3,40 | 3,05 | 3,05 | **2,30** | 2,30 | 2,30 |

    | Covenant | 1,20 | 1,20 | 1,20 | 1,20 | 1,20 | 1,20 |


    Le point bas est **2,30 M€, soit 1,10 M€ au-dessus du seuil bancaire**. Le covenant n''est franchi
    dans aucune séquence, y compris si la pénalité tombe le même trimestre qu''un acompte de dividende.


    **Test de liquidité.** Trésorerie au point bas : 2,6 − 0,7 − 0,4 = **1,5 M€**, soit environ **9 mois
    de masse salariale** (165 k€/mois), avec un plan d''exploitation à l''équilibre. Le mois le plus tendu
    (350 k€ de dividende + 400 k€ de pénalité) est absorbé sans recours au crédit.


    ## 3. Réponse à l''objection du directeur financier


    Son objection est légitime sur le principe et je la reprends à mon compte : on ne joue pas la maison
    sur un tirage à 40 %. **Mais la maison n''est pas sur la table.** Le contrat plafonne la perte totale
    à 400 k€, pénalité comprise. Il n''y a **ni caution personnelle, ni défaut croisé, ni sûreté sur l''actif
    industriel, ni gage sur le carnet de commandes**. L''exposition maximale représente **12 % des fonds
    propres et 15 % de la trésorerie**. C''est une perte douloureuse, pas une perte de ruine : aucun chemin
    ne mène de ce scénario à la cessation des paiements ni à la rupture du covenant.


    Sur **Tremay** : avant d''en tirer une règle, il faut établir la comparabilité structurelle. Une ligne
    neuve ne dépose pas un bilan — c''est un engagement non plafonné, financé par dette, sans marge de
    covenant, qui le fait. Nous sommes à dette nette nulle, avec un plafond contractuel et 1,1 M€ de marge.
    Je demande que le dossier Tremay soit produit au conseil (mode de financement, existence d''un plafond,
    niveau d''endettement) : s''il apparaît que Tremay était dans notre configuration exacte, je retire
    ma recommandation.


    **Le meilleur argument contre moi**, que je soumets loyalement : le 60 % est une estimation **interne,
    non auditée, sur 11 cas**. Sur un échantillon de cette taille, l''intervalle de confiance est large
    et le biais d''optimisme du prescripteur est réel. Le seuil de 46 % absorbe une part de cette incertitude,
    pas la totalité. C''est précisément ce que traitent les conditions ci-dessous.


    ## 4. Conditions suspensives et clause d''arrêt


    1. **Validation juridique du plafond.** Confirmation écrite du conseil que les 400 k€ couvrent *tous*
    les chefs de coût : dépose, remise en état du site, engagements fournisseurs induits, indemnités.
    **Le plafond est l''élément porteur de toute la recommandation** — s''il fuit, l''option B tombe.

    2. **Revue indépendante des 11 comparables** : définition retenue du « succès », cas exclus de l''échantillon,
    écarts de configuration avec notre site.

    3. **Réserve dédiée de 400 k€** immobilisée à la signature, pour que la pénalité soit un événement
    comptable et non un événement de trésorerie.

    4. **Confirmation bancaire écrite** qu''aucun autre engagement que le covenant de fonds propres n''est
    attaché à la ligne de crédit.


    **Suivi observable.** L''engagement étant ferme et sans sortie anticipée, la gouvernance porte sur
    la constatation, pas sur le retrait : jalons techniques contradictoires à M3, M6 et M9, et présentation
    à chaque conseil du tableau de covenant ci-dessus actualisé. Constatation d''échec à un jalon ⇒ provisionnement
    immédiat et mobilisation de la réserve, sans attendre le douzième mois.


    *L''annexe « catalogue des stations de mesure » jointe au dossier est sans lien avec cet arbitrage
    et n''a pas été utilisée.*

    '
