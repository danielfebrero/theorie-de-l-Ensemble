response:
  text: 'Je n''ai pas pu faire tourner le compteur de caractères (commande refusée), je les ai donc comptés
    à la main : 116 / 115 / 113. Sans accents, l''affichage GTC les tronque souvent.


    ## Les trois lignes


    ```

    21h45 COMMANDER roue ventilo B2 au magasin de Nantes - commande ferme, meme si la vibration reste
    stable cette nuit.

    B2 a charge mini tenant le reseau, vibration /30min. ARRET si >=11,5 ou +0,3 en 30min ou bruit: ne
    pas attendre 12.

    Si B2 arretee: 2 gaz a fond, delester logements, garder hopital+EHPAD >40C, prevenir astreinte + hopital
    + EHPAD.

    ```


    ## Pourquoi ces trois-là


    **La commande d''abord, parce qu''elle est gratuite et qu''elle est la seule chose irréversible si
    on l''oublie.** Le délai de 14 h ne court qu''à partir de l''appel. Lancée à 21h45, la roue est disponible
    vers midi ; attendue jusqu''au franchissement du seuil à 3 h, elle arrive le lendemain soir. Commander
    coûte une pièce ; ne pas commander coûte potentiellement neuf jours de B2 en janvier. Aucune information
    de la nuit ne peut rendre cette commande regrettable — donc elle ne doit pas dépendre du jugement
    des techniciens.


    **Le seuil à 11,5 et pas 12, parce que c''est la seule chose qui préserve l''option.** Le rechange
    en 14 h n''existe que si B2 est arrêtée *avant* la casse. Un seuil à 12 fait de l''arrêt une course
    contre la rupture ; un seuil à 11,5 avec un critère de pente (+0,3/30 min) garantit que l''arrêt reste
    choisi. Deux techniciens seuls à 4 h du matin ne doivent pas avoir à arbitrer : le critère est numérique,
    relevé à intervalle fixe, sans appréciation.


    **Le maintien de B2 à charge réduite, parce que l''arrêt préventif immédiat n''est pas le choix sûr
    qu''il paraît.** Le gaz seul tient jusqu''à −7 °C ; il en est annoncé −14. Arrêter B2 maintenant,
    c''est garantir un hôpital de 180 lits et un EHPAD sous 40 °C au plus froid de la nuit — un dommage
    certain, pour éviter un dommage probable. Charge basse = ventilateur plus lent = contrainte plus faible
    sur la roue : ça achète des heures sans acheter la casse.


    **Le contre-argument le plus fort, que j''assume :** la fenêtre constructeur commence à 6 h de fonctionnement,
    soit 22 h ce soir. Faire tourner B2 cette nuit peut produire le pire scénario — casse à 3 h, réseau
    à 7 MW manquants, et les techniciens dans le noir. C''est précisément pourquoi la ligne 3 existe et
    pourquoi elle est écrite maintenant plutôt que découverte à ce moment-là : même en cas de casse subie,
    la commande est déjà partie, le délestage est déjà autorisé, et l''astreinte est appelée sans qu''on
    attende mon réveil.


    **Ce que j''ai dû laisser dehors, faute de lignes :** la mise en température du réseau avant 4 h,
    le détail des vannes de délestage, les numéros d''astreinte. Ces trois points doivent être passés
    à l''oral à la relève de 22 h — la main courante ne remplace pas la passation, elle la survit.

    '
