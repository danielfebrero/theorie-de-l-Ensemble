response:
  text: '# NOTE AU CONSEIL — Séance du vendredi


    **Objet : arbitrage Sedamex (A) / Nordwerk (B) — horizon 18 mois**

    **De : la direction générale**


    ---


    ## 1. Recommandation


    **Je recommande l''option B (ligne Nordwerk)**, assortie des trois conditions de pilotage du § 4.


    ---


    ## 2. Fondement du choix


    **Le pire cas de B ne met pas l''entreprise en danger.** C''est le seul test qui commande la décision,
    et il est passé avec une marge large.


    | | Départ | Après dividende (700 k€) | Après échec Nordwerk (−400 k€) |

    |---|---|---|---|

    | Fonds propres | 3,4 M€ | 2,7 M€ | **2,3 M€** |

    | Trésorerie | 2,6 M€ | 1,9 M€ | **1,5 M€** |


    - **Covenant (FP > 1,2 M€, test trimestriel) : respecté à chacun des six tests**, avec un coussin
    de 1,1 M€ dans la branche défavorable. Il faudrait une perte de 1,5 M€ — soit **3,75 fois le plafond
    contractuel** — pour l''enfreindre. Le plan d''affaires étant à l''équilibre hors ces mouvements,
    aucun autre poste ne creuse cette trajectoire.

    - **Trésorerie plancher : 1,5 M€, soit plus de 9 mois de masse salariale.** Le décaissement de la
    pénalité intervient au plus tard au 12ᵉ mois ; quel que soit son ordre par rapport aux deux échéances
    de dividende, le plancher reste identique.

    - **L''exposition est cloisonnée** : pas de caution personnelle du dirigeant, pas de défaut croisé,
    aucune sûreté sur l''actif industriel, carnet de commandes non gagé. La perte est plafonnée contractuellement,
    tout compris. **L''échec de B est un événement à conséquence bornée, pas un événement absorbant.**


    **Sur le rendement.** Espérance de B : (0,6 × 900) − (0,4 × 400) = **+380 k€**, contre +200 k€ pour
    A. Surtout, **le point de bascule est à 46,2 % de probabilité de succès** : c''est en dessous de ce
    seuil, et non de 60 %, que A redeviendrait préférable. L''estimation du bureau d''études, appuyée
    sur onze installations documentées, dispose donc de près de 14 points de marge d''erreur avant que
    la recommandation ne s''inverse. En dessous de 30,8 %, seulement, B devient perdante en espérance.


    ---


    ## 3. Réponse au directeur financier


    **« On ne joue pas la maison sur un tirage à 40 % ».** Je souscris entièrement au principe. Je conteste
    que ce soit ce dont il s''agit. Ce que nous engageons, c''est **400 k€ au maximum, soit 11,8 % des
    fonds propres actuels et 15,4 % de la trésorerie**. Ce qui mettrait la maison en jeu, ce sont la caution
    personnelle, le défaut croisé, la sûreté industrielle et le nantissement du carnet : les quatre sont
    absents, et je les ai fait vérifier ligne à ligne. Une décision qui laisse l''entreprise avec 2,3
    M€ de fonds propres et neuf mois de salaires en caisse n''engage pas sa survie.


    **Le précédent Tremay.** Un dépôt de bilan ne s''explique pas par le fait d''avoir installé une ligne,
    mais par la structure de l''exposition qui l''accompagnait. La question utile n''est pas « Tremay
    a-t-il échoué ? » mais « la perte de Tremay était-elle plafonnée ? ». Si elle l''était, leur défaillance
    a une autre cause et ne nous enseigne rien ici ; si elle ne l''était pas, leur cas confirme ma démonstration
    plutôt qu''il ne l''infirme. Un cas unique, choisi parce qu''il a mal fini, ne peut pas déplacer une
    estimation fondée sur onze observations.


    **Le meilleur argument contre moi**, que le DAF n''a pas encore formulé et que je veux poser devant
    vous : *l''espérance mathématique n''a de sens que sur un grand nombre de tirages, or nous ne jouons
    qu''une fois.* C''est exact. C''est précisément pourquoi le critère de la décision n''est pas l''espérance
    — elle ne fait que départager — mais la **survie dans la branche perdante**, établie au § 2. Une entreprise
    qui refuse tout pari favorable dont elle survit à l''échec ne se protège pas : elle renonce méthodiquement
    à sa croissance. Second point à porter au débit de B : l''exclusivité fait que l''échec coûte **600
    k€ en relatif**, pas 400 (2,3 M€ de fonds propres contre 2,9 M€ sous A). Ce différentiel reste absorbable,
    covenant tenu dans les deux cas.


    ---


    ## 4. Conditions attachées à la recommandation


    L''absence de clause de sortie signifie que notre seule marge de pilotage est interne. J''en tire
    trois engagements :


    1. **Le plafond de 400 k€ couvre le contrat, pas nos surcoûts internes** (heures d''études, matières,
    désorganisation de production). Je fixe une enveloppe interne plafonnée à 100 k€ et je la porte au
    reporting mensuel du conseil.

    2. **Jalons techniques de constatation à M+3, M+6 et M+9.** Si l''échec est acquis, il est constaté
    immédiatement et non différé : purger les 400 k€ tôt vaut mieux que d''y ajouter des dépenses non
    plafonnées. Décision au plus tard au 12ᵉ mois.

    3. **Condition d''arrêt observable** : si, à un test trimestriel, les fonds propres projetés au trimestre
    suivant passent sous 1,8 M€, la direction revient devant le conseil avant tout nouvel engagement.


    *Reste non chiffré, et je le signale : sur 38 salariés, une ligne neuve mobilise le bureau d''études
    au détriment de l''existant. Le carnet n''est pas gagé, mais il peut être perturbé. C''est l''objet
    du jalon M+3.*

    '
