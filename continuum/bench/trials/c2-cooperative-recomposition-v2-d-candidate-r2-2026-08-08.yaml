response:
  text: "## Position de la présidence — séance du jeudi\n\n### 1. Ce que je propose\n\nJe n'ai pas 570\
    \ L/s. Je n'ai pas non plus de solution qui épargne les trois parties. Toute position qui prétendrait\
    \ le contraire serait démentie en quinze jours, et c'est ce qui est arrivé en 2022.\n\n**Répartition\
    \ applicable immédiatement, pour 21 jours, sur la base de 410 L/s :**\n\n| Usage | Dotation | Équivalent\
    \ | Statut |\n|---|---|---|---|\n| Débit réservé aval | **180 L/s** | — | Plancher intangible |\n\
    | Régie de Ferney | **150 L/s** | 12 960 m³/j | Garanti 10 jours, puis conditionné |\n| Maraîchage\
    \ (620 ha) | **80 L/s** | 111 m³/ha/décade | Quotas individuels au prorata de la surface |\n\nJe retiens\
    \ des **quotas individuels**, pas un volume global par usage. Un volume global confié à 34 exploitations\
    \ dont 6 détiennent la moitié de la surface se répartit par la capacité de pompage, pas par le besoin\
    \ : il serait capté par les six plus grandes avant la fin de la première semaine. Les 28 autres porteraient\
    \ la totalité de l'ajustement sans que la commission ait rien décidé.\n\nLes quotas sont libellés\
    \ **en volume par décade, pas en débit instantané**. Un quota en L/s est incontrôlable sans télémétrie\
    \ et transforme la nuit en course au pompage.\n\n**Règle d'accès** : pas de compteur relevable, pas\
    \ de quota. Les prélèvements de cette taille sont soumis à déclaration et à comptage ; l'absence de\
    \ compteur en état de marche vaut dotation nulle jusqu'à sa pose. C'est le seul levier de contrôle\
    \ dont je dispose réellement.\n\n**Transferts** : une exploitation peut céder tout ou partie de son\
    \ quota à une autre, par déclaration à la commission, dans la limite de +40 % du quota initial du\
    \ cessionnaire. Ce plafond existe pour que la mutualisation ne redevienne pas la captation que les\
    \ quotas individuels visaient à empêcher.\n\n### 2. Pourquoi ce partage et pas un autre\n\nLes trois\
    \ pertes ne sont pas de même nature, et c'est le seul critère qui tienne devant vous.\n\nLa perte\
    \ des frayères est qualifiée de **non reconstituable à l'échelle d'une décennie** par le rapport du\
    \ 12 juin. Aucune somme d'argent ne la rachète. Elle est aussi hors de ma main : le débit réservé\
    \ résulte d'un arrêté préfectoral, je ne peux ni l'abaisser ni le négocier.\n\nLa rupture d'alimentation\
    \ d'une régie disposant de **4 jours de réserve** et desservant un EHPAD de 110 lits produit un événement\
    \ sanitaire sous 96 heures. Cette perte-là non plus ne se répare pas.\n\nLa perte de récolte est **grave\
    \ et bornée** : 4,1 M€, 90 emplois saisonniers, une campagne. Elle est indemnisable, assurable, et\
    \ elle n'interdit pas la campagne suivante.\n\nJe place donc l'irréversible avant le réparable. Ce\
    \ n'est pas un jugement sur la valeur des personnes : c'est la seule hiérarchie qui ne dépende pas\
    \ de qui est resté dans la salle.\n\n**Je dois dire aux maraîchers ce que 80 L/s signifient.** Leur\
    \ demande de 240 L/s représente 3,3 mm/jour sur 620 ha : c'est un besoin agronomique sobre pour du\
    \ maraîchage en août, pas une demande gonflée. Je le reconnais publiquement. À 80 L/s, on descend\
    \ à 1,1 mm/jour. Une part importante des 4,1 M€ sera perdue quoi que je décide. La question n'est\
    \ plus de l'éviter, elle est de concentrer l'eau restante là où elle sauve encore quelque chose, et\
    \ de payer le reste.\n\n### 3. Où je vais chercher les 160 L/s manquants — et d'abord à Ferney\n\n\
    La régie prélève 150 L/s pour 9 200 habitants, soit **1 409 litres par habitant et par jour**. La\
    \ consommation domestique française est de l'ordre de 150 litres. L'EHPAD représente moins de 0,5\
    \ L/s. Il y a un facteur nettement supérieur à cinq entre ce qui est prélevé et ce qu'un tel besoin\
    \ explique.\n\nJe ne conclus pas : je constate un écart que personne n'a expliqué. Trois hypothèses,\
    \ exclusives ou cumulées — le périmètre desservi dépasse Ferney, le rendement du réseau est très dégradé,\
    \ ou 150 L/s est un volume autorisé et non consommé. Une campagne de **débit de nuit sectorisée**\
    \ tranche en 72 heures pour quelques dizaines de milliers d'euros.\n\nC'est pourquoi la garantie de\
    \ 150 L/s est ferme pendant 10 jours et conditionnée ensuite. Elle est ferme parce qu'avec 4 jours\
    \ de tampon je n'ai pas le droit d'expérimenter sur une régie. Elle est conditionnée parce que je\
    \ n'ai pas le droit de détruire une récolte pour alimenter une fuite.\n\n**Engagement précis** : à\
    \ compter du 11ᵉ jour, chaque litre par seconde identifié comme perte de réseau ou usage non prioritaire\
    \ est retiré de la dotation de la régie et transféré automatiquement à l'enveloppe d'irrigation, sans\
    \ nouvelle délibération. La réduction porte exclusivement sur le volume perdu ou non prioritaire,\
    \ **jamais sur le volume servi aux abonnés**. On ne ferme pas les robinets, on ferme les fuites.\n\
    \nEn contrepartie de sa garantie, la régie transmet sous 5 jours son rendement de réseau, son périmètre\
    \ exact et l'historique de ses prélèvements. Elle demande une dotation garantie : je la lui accorde.\
    \ Une dotation garantie sans données transmises, je ne l'accorde pas.\n\n### 4. Ce que vaut le chiffre\
    \ de 410\n\nTout ce dossier repose sur **une station unique, étalonnée pour la dernière fois en 2023**,\
    \ en bas de sa courbe de tarage — c'est-à-dire dans la plage où elle est le moins fiable. L'incertitude\
    \ plausible sur une telle mesure est du même ordre de grandeur que la marge que nous nous disputons.\n\
    \nCette station est à la fois le juge et la partie : c'est elle qui a déclenché la levée de 2022.\
    \ Je fais procéder sous 72 heures à un **jaugeage indépendant contradictoire**, en présence d'un représentant\
    \ de chaque partie, et au réétalonnage de la station. Tant qu'il n'est pas fait, je retiens 410 L/s\
    \ comme hypothèse de travail — sans l'arrondir à la hausse, parce qu'une erreur optimiste se paie\
    \ sur les frayères et sur l'EHPAD.\n\nChaque partie peut exiger, à ses frais couverts par la commission,\
    \ un jaugeage contradictoire supplémentaire. C'est un pouvoir réel donné aux maraîchers sur la donnée\
    \ qui les condamne.\n\n### 5. La reprise : pourquoi 2022 ne se reproduira pas\n\nLe dispositif de\
    \ 2022 a levé les restrictions sur **48 heures au-dessus d'un seuil, mesurées par une seule station**.\
    \ L'orage du 9 août n'a pas rechargé la nappe, il a produit du ruissellement : le pic était de l'eau\
    \ qui passait, pas de l'eau qui restait. Quatre jours plus tard nous étions à 340 L/s, plus bas qu'avant\
    \ l'orage, avec les prélèvements rouverts en totalité.\n\nNouveau régime, **asymétrique par construction**\
    \ :\n\n- **La restriction se durcit automatiquement**, sur moyenne glissante de 3 jours, sans délibération\
    \ :\n  - < 390 L/s → irrigation ramenée à 60 L/s\n  - < 375 L/s → 30 L/s, réservés à la survie des\
    \ cultures pérennes et sous abri, sur demande motivée\n  - < 360 L/s → irrigation suspendue ; le disponible\
    \ reconstitue le tampon de la régie\n  - < 340 L/s → le débit réservé lui-même n'est plus tenable\
    \ en même temps que l'eau potable : saisine immédiate du préfet, seul compétent pour arbitrer sous\
    \ l'arrêté. Je n'ai pas ce pouvoir et je ne le prendrai pas.\n- **La levée est lente et jamais totale**\
    \ : moyenne glissante sur **10 jours consécutifs**, ET remontée confirmée du niveau piézométrique,\
    \ ET délibération de la commission. Elle se fait par paliers de 25 % de l'enveloppe restreinte, espacés\
    \ de 10 jours. Un orage ne lève rien : le critère de nappe est là précisément pour ça.\n\n### 6. Emploi\
    \ des 600 000 €\n\nÉtalés en indemnisation, 600 000 € représentent 15 % du préjudice annoncé : ils\
    \ n'achètent rien et n'évitent aucune perte. Je les affecte à ce qui produit de l'eau ou de la certitude.\n\
    \n- **45 000 €** — jaugeage indépendant, réétalonnage de la station, campagne de débit de nuit sectorisée,\
    \ relevé piézométrique. Engagés sous 72 heures.\n- **155 000 €** — réparation d'urgence des fuites\
    \ identifiées par l'audit, et sécurisation de l'EHPAD (plan de livraison par citerne pré-contractualisé,\
    \ interconnexion de secours si elle existe). C'est le meilleur rendement en litres par euro du dossier,\
    \ et le seul gain permanent.\n- **320 000 €** — **renoncement indemnisé** : rachat de la mise en culture\
    \ de parcelles vouées à l'échec, de l'ordre de 130 à 160 ha, avec priorité aux exploitations de moins\
    \ de 15 ha. Une culture qui va être perdue consomme de l'eau pour rien ; l'indemniser maintenant convertit\
    \ une perte certaine en trésorerie immédiate et reconcentre l'eau restante sur les surfaces sauvables\
    \ — environ +30 % de dotation par hectare pour ceux qui poursuivent.\n- **80 000 €** — réserve d'aléa\
    \ non affectée.\n\nCe fonds ne couvre pas le préjudice. Je saisis en parallèle le préfet pour la reconnaissance\
    \ en calamité agricole, le dégrèvement de taxe foncière sur le non-bâti, et l'activation de l'activité\
    \ partielle pour les saisonniers. Cet argent-là ne sort pas de mes 600 000 €.\n\n### 7. Les données\
    \ que je n'ai pas et que j'aurai avant le 10ᵉ jour\n\nLa commission ne détient « ni cultures, ni stades\
    \ végétatifs, ni relevés de compteurs ». Cette absence est réparable en une semaine, pas en une saison\
    \ :\n\n- **Registre parcellaire graphique** auprès de la DDT — couverture partielle en maraîchage,\
    \ à assumer comme telle ;\n- **déclarations sur l'honneur** de surface par culture et par stade, sous\
    \ 5 jours ;\n- **contrôle croisé par imagerie satellitaire** (parcelles réellement en culture et réellement\
    \ irriguées) — quelques jours, coût marginal ;\n- **relevés de compteurs contradictoires hebdomadaires**.\n\
    \nLe quota au prorata de la surface est **provisoire et assumé comme grossier** : il traite un hectare\
    \ de salade comme un hectare de melon. Il a la seule qualité qui compte aujourd'hui — il est calculable\
    \ ce soir avec la seule donnée que je possède, les 620 ha, et il n'avantage personne. Il est révisé\
    \ au 10ᵉ jour selon les besoins réels par stade végétatif.\n\n### 8. Le meilleur argument contre ma\
    \ position\n\nIl vient des maraîchers, et il est solide :\n\n> *« Vous garantissez à la régie 1 409\
    \ litres par habitant et par jour, presque dix fois la norme domestique, sans en avoir vérifié un\
    \ seul. Vous coupez aux deux tiers un usage dont vous reconnaissez vous-même qu'il est agronomiquement\
    \ sobre. Vous protégez donc l'usage le moins justifié en détruisant le mieux justifié, au seul motif\
    \ que l'un porte l'étiquette \"potable\". Si l'audit trouve des fuites, vous aurez sacrifié une récolte\
    \ pour arroser un trou dans une canalisation. »*\n\nSur le fond, il est juste. Je le maintiens quand\
    \ même, et voici précisément pourquoi : il porte sur le mérite, ma décision porte sur le délai. Une\
    \ erreur de coupe sur la régie devient un événement sanitaire en 96 heures et ne se rattrape pas ;\
    \ une erreur de coupe sur l'irrigation est une perte financière lourde mais bornée et compensable.\
    \ Avec 4 jours de tampon, je n'ai pas le temps de vérifier avant de garantir.\n\nMais cet argument\
    \ change ma décision sur deux points, et ce sont des concessions réelles : l'audit est **engagé avant\
    \ jeudi, pas après la séance**, et le transfert du volume récupéré vers l'irrigation est **automatique,\
    \ pas discrétionnaire** — sinon la régie n'a aucun intérêt à chercher ses fuites. Si l'audit établit\
    \ que les 150 L/s sont réellement consommés, je le dirai publiquement et les maraîchers resteront\
    \ à 80 L/s : le fonds basculera alors intégralement vers l'indemnisation.\n\n### 9. Ce qui renverserait\
    \ cette position\n\nJe m'engage à la réviser, sans attendre qu'on me le demande, sur l'un de ces constats\
    \ :\n\n- le jaugeage indépendant donne un débit réel significativement différent de 410 L/s — toute\
    \ l'arithmétique est refaite ;\n- l'audit de nuit établit que les 150 L/s sont légitimement consommés\
    \ — il n'y a plus de marge à Ferney, et je dois le reconnaître devant les maraîchers ;\n- une réévaluation\
    \ hydrobiologique établit que le seuil de 180 L/s est lui-même mal calibré — vers le haut, l'arbitrage\
    \ empire et je saisis le préfet ;\n- les déclarations et l'imagerie montrent que les 620 ha ne sont\
    \ pas tous en culture ou en irrigation — la dotation par hectare des parcelles réellement actives\
    \ augmente d'autant.\n\n### 10. Ce que je ne peux pas décider, et qui doit le décider\n\nJe le dis\
    \ pour qu'aucune partie ne se croie liée par ce qu'elle ne l'est pas, ni protégée par ce qui ne la\
    \ protège pas :\n\n- **Le débit réservé de 180 L/s relève de l'arrêté préfectoral.** Je ne peux ni\
    \ le suspendre ni l'abaisser. Toute demande en ce sens doit être adressée au préfet.\n- **La commission\
    \ n'a pas la police de l'eau.** Mes quotas ne sont opposables qu'une fois repris par arrêté ; je transmets\
    \ ma délibération le lendemain de la séance en demandant leur reprise, et la constatation des dépassements\
    \ revient aux services de l'État.\n- **La réutilisation des eaux traitées** de la station d'épuration\
    \ pour l'irrigation est la ressource structurelle évidente de ce bassin. Elle exige une autorisation\
    \ sanitaire et des ouvrages : **elle ne sera pas disponible cet été.** Je fais lancer l'étude maintenant\
    \ pour la campagne suivante. Ne la comptez pas dans les 160 L/s.\n\n### 11. Ce que je propose à chacune\
    \ des trois parties\n\n**Aux maraîchers, qui ont quitté la salle.** Vous n'obtiendrez pas 240 L/s,\
    \ et je ne vous le ferai pas espérer. Je reconnais publiquement que votre demande est agronomiquement\
    \ fondée. Je vous donne trois pouvoirs qui ne sont pas de la consultation : le droit de déclencher\
    \ un jaugeage contradictoire de la station qui vous condamne ; une voix délibérative sur l'affectation\
    \ de tout volume récupéré sur le réseau de Ferney ; et un plafond de transfert qui empêche que les\
    \ six plus grandes exploitations rachètent l'eau des vingt-huit autres.\n\n**À la régie, qui refuse\
    \ de discuter avant garantie.** Votre condition est remplie : 150 L/s, fermes, dix jours, sans discussion.\
    \ Elle a une contrepartie exigible sous 5 jours — vos données de rendement et de périmètre — et une\
    \ échéance : au-delà du 10ᵉ jour, ce qui est perdu dans le réseau ne vous est plus alloué. Vos abonnés\
    \ ne subiront aucune réduction de service. La sécurisation de l'EHPAD est financée avant tout le reste.\n\
    \n**À la rivière, qui n'a personne dans cette salle.** C'est la seule partie qui supporte une perte\
    \ définitive et la seule qui ne peut pas quitter la séance. Je propose que l'OFB et la fédération\
    \ de pêche siègent comme observateurs disposant du **pouvoir de déclencher le repli** dès dégradation\
    \ des indicateurs biologiques, sans passer par moi. Sinon les 180 L/s ne sont protégés que par ma\
    \ bonne volonté, et la bonne volonté n'a pas tenu en 2022.\n\n**À la presse.** Ce dossier n'oppose\
    \ pas « les paysans » aux « robinets ». Il manque 160 L/s. Une partie est peut-être dans une canalisation\
    \ percée plutôt que dans un champ, et nous ne le savons pas encore parce que personne n'a mesuré.\
    \ Le tiers qui perdra le plus est celui dont personne ne parle : la rivière, parce que sa perte est\
    \ la seule qui ne se rattrapera pas.\n\n---\n\n**Première action, dès demain matin :** commande du\
    \ jaugeage indépendant et de la campagne de débit de nuit, engagement des 45 000 €, et convocation\
    \ des trois parties à une séance de restitution au 10ᵉ jour dont la date est fixée dès jeudi.\n"
