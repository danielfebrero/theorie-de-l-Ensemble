response:
  text: '## Ce qui décide le dossier avant d''écrire une ligne


    Deux choses, à poser d''emblée parce qu''elles orientent tout le reste :


    **La mention « départ 6 h 40 » (pièce 2) est contredite par la pièce 3.** Le portique donne 11 h 12,
    écriture automatique, sans autre sortie ce jour-là. Une position construite sur 6 h 40 s''effondre
    à la première lecture du juriste de l''assureur — et une déclaration de sinistre qui reprend 6 h 40
    comme un fait expose à un refus de garantie pour déclaration inexacte, ce qui coûte beaucoup plus
    que 21 400 €. On abandonne cette mention et on la traite comme une anomalie documentaire de notre
    côté.


    **Le trou de 2 h 40 est le nôtre.** Fin de chargement 6 h 25 à 3 °C (P1), groupe froid sous tension
    à 9 h 05 (P5) : entre les deux, aucun relevé. Il ne sert à rien de le contester, il est écrit dans
    notre propre appareil. En revanche il ne prouve ni une rupture de chaîne, ni la cause de la flore,
    ni le montant réclamé — et c''est là que la position se tient.


    ---


    # Position de l''entreprise — lot F-2418 / réclamation Sodimarché 21 400 €


    **Les Ateliers de Grandval — destinataires : assureur (déclaration de sinistre) et Sodimarché (réponse
    contractuelle sous huit jours)**


    ## 1. Chronologie établie, pièce par pièce


    | Heure | Fait | Pièce | Nature |

    |---|---|---|---|

    | 6 h 25 | Chargement terminé, produit à 3 °C | P1 | Déclaratif signé (opérateur) |

    | « 6 h 40 » | Mention manuscrite « départ » | P2 | **Contredite par P3 — écartée** |

    | 6 h 25 → 9 h 05 | **Aucun relevé de température (2 h 40)** | P5 | Absence d''enregistrement |

    | 9 h 05 → 12 h 55 | 2,9 à 3,6 °C, soit **3 h 50 conformes** | P5 | Enregistrement automatique |

    | 11 h 12 | Sortie effective du site (4 h 47 après chargement) | P3 | **Horodatage automatique** |

    | 12 h 55 | Arrivée dépôt, 1 792 barquettes portées reçues | P4 | Document du dépôt |

    | non daté | Prélèvement, analyse, refus, destruction | P6 | **Aucune pièce ne date ces actes** |


    Durée totale chargement → réception : 6 h 30, dont 3 h 50 documentées conformes et 2 h 40 non documentées.


    ## 2. Ce que l''entreprise reconnaît


    1. **La conservation du lot n''est pas documentée entre 6 h 25 et 9 h 05** (P1, P5). L''enregistreur
    embarqué était hors tension. Ce défaut de traçabilité est imputable à l''entreprise et n''est pas
    discuté.

    2. **Le véhicule est resté 4 h 47 sur le site après la fin du chargement** (P1, P3). Le fait est établi
    par notre propre journal automatique et n''est pas discuté.

    3. **La mention manuscrite « départ 6 h 40 » portée sur le bon de livraison n° 2418 est inexacte**
    (P2 contre P3). L''entreprise la retire de son argumentaire, la signale spontanément et ouvre une
    action corrective sur le renseignement des BL.

    4. **Le lot livré présentait un dépassement du seuil contractuel de flore mésophile** sur les trois
    barquettes analysées (P6), sous les réserves de méthode exposées au § 3.

    5. La flore mésophile est un indicateur d''hygiène contractuel, non un critère de sécurité sanitaire
    : aucune pièce n''établit de risque pour le consommateur, et l''entreprise ne s''en prévaut pas comme
    d''une excuse — elle le note comme élément de proportionnalité du préjudice.


    ## 3. Ce que l''entreprise conteste


    **3.1 — L''écart de 48 barquettes, et la contradiction interne aux documents du dépôt.**

    Le bon de livraison n° 2418 porte la quantité 1 840 et **la signature du réceptionnaire du dépôt,
    sans réserve** (P2). Le bon de réception du même dépôt porte 1 792 (P4). Cette contradiction est interne
    aux pièces de Sodimarché. De deux choses l''une : soit le réceptionnaire a signé sans compter, et
    son bon de réception ne fait pas foi contre notre bon de livraison contresigné ; soit 48 barquettes
    ont disparu après prise en charge par le dépôt. Dans les deux cas, l''écart n''est pas opposable à
    l''entreprise. Aucune pièce ne le rattache au chargement.


    **3.2 — L''absence de réserve à la réception.**

    Le BL est signé sans réserve sur l''état et la température de la marchandise (P2). Aucune pièce ne
    justifie d''un protest motivé adressé dans le délai contractuel et légal. L''entreprise demande la
    production de ce protest et, à défaut, oppose l''acceptation sans réserve.


    **3.3 — La valeur probante de l''analyse (P6).**

    Analyse diligentée unilatéralement, sur 3 barquettes pour 1 840 (0,16 %), sans qu''aucune pièce n''établisse
    : la date et l''heure du prélèvement, l''identité du préleveur, le PV de prélèvement et la mise sous
    scellés, la chaîne de conservation des échantillons, l''accréditation du laboratoire et la méthode
    normative appliquée, le plan d''échantillonnage. **Surtout, aucune pièce ne documente la température
    du lot au dépôt entre 12 h 55 et le prélèvement.** Le dépôt réclame la preuve d''une conservation
    qu''il ne fournit pas pour sa propre garde. Un résultat de flore mésophile est directement fonction
    du temps et de la température écoulés avant analyse : sans cette donnée, le résultat ne peut être
    imputé à une phase plutôt qu''à une autre.


    **3.4 — La destruction unilatérale de la marchandise.**

    La réclamation invoque une marchandise détruite. Aucune pièce ne produit de bon de destruction, ni
    de date, ni de mise en demeure préalable, ni de proposition d''expertise contradictoire. La destruction
    a supprimé la possibilité même de contre-analyse sur le lot. L''entreprise conteste que le coût d''une
    destruction opérée sans contradictoire lui soit intégralement imputé.


    **3.5 — Le montant de 21 400 €.**

    Somme globale, non ventilée, appuyée sur aucune pièce comptable. Sont contestés en l''état, faute
    de justificatif : la valorisation de la marchandise et sa base (prix d''achat, quantité retenue —
    1 840 ou 1 792 ?), le coût de transport et de destruction, et **la pénalité de rupture d''assortiment**,
    dont la clause contractuelle fondatrice, le mode de calcul et la réalité du préjudice ne sont produits
    par aucune pièce.


    **3.6 — Le lien de causalité.**

    Aucune pièce n''établit la charge microbiologique du lot à la sortie de production, ni au chargement,
    ni à la réception. Le dépassement constaté (P6) est postérieur à une période de 6 h 30 dont **2 h
    40 relèvent de la garde de l''entreprise et un délai indéterminé de celle du dépôt**. L''entreprise
    ne conteste pas sa part ; elle conteste qu''on lui impute la totalité en l''absence de toute mesure
    intermédiaire.


    ## 4. Ce qui n''est rattaché à aucune pièce et ne sera pas affirmé


    La pièce 7 est un propos téléphonique. « Parti tôt » et « attendu un moment » ne sont ni datés, ni
    signés, ni recevables, et « parti tôt » est de surcroît contredit par P3. **Aucune affirmation de
    la position ne repose sur la pièce 7.** Elle est convertie en attestation écrite (§ 6) ou écartée.
    De même ne sont pas affirmés, faute de pièce : le stationnement du véhicule sur un quai réfrigéré,
    la température ambiante du 3 juin, la conformité du lot au chargement.


    ## 5. Le contre-argument le plus fort de l''adversaire, et notre réponse


    *Sodimarché dira :* « Votre propre journal automatique montre un camion immobilisé 4 h 47 chez vous,
    votre propre enregistreur est resté éteint 2 h 40, votre propre BL porte une heure de départ fausse,
    et la flore ressort à 4,2 fois le seuil. La preuve d''une conservation conforme vous incombe et vous
    ne l''avez pas pour la seule période qui compte. »


    *Il tient — et il n''est pas contesté sur la garde de la marchandise pendant 2 h 40.* Il ne bascule
    rien sur trois points qu''il ne touche pas : il ne justifie ni l''écart de 48 barquettes contredit
    par la signature du dépôt lui-même, ni la ventilation des 21 400 €, ni la pénalité de rupture d''assortiment
    ; et il ne dispense pas le dépôt de documenter sa propre garde et son propre prélèvement. La position
    n''est donc pas « nous ne sommes pas responsables », elle est : **responsabilité admise sur le seul
    périmètre documenté, quantum et périmètre contestés faute de pièces.**


    ## 6. Ce que l''entreprise engage dans les huit jours


    **À J+1 — Réponse écrite recommandée AR à Sodimarché** (interrompt l''acquisition de plein droit de
    la pénalité) : reconnaissance du § 2, contestation motivée du § 3, demande de pièces, proposition
    d''expertise contradictoire. Texte au § 8.


    **À J+1 — Déclaration de sinistre à l''assureur**, sur la base du présent document, avec les sept
    pièces numérotées et la mention expresse que P2 est contredite par P3.


    **À J+2 — Analyse de l''échantillon témoin du lot F-2418** conservé en échantillothèque à l''usine,
    à température maîtrisée, par un laboratoire accrédité, sur la même méthode que P6. *C''est l''acte
    qui décide le dossier :* témoin conforme ⇒ la charge est apparue après sortie d''usine, et le partage
    se joue entre nos 2 h 40 et la garde du dépôt ; témoin non conforme ⇒ le problème est en production,
    la contestation du § 3.6 tombe et la stratégie devient transactionnelle immédiate.


    **À J+2 — Production de nos autocontrôles** du lot F-2418 (date de fabrication, DLC, résultats microbiologiques
    de libération) et du plan de palettisation / comptage de chargement pour les 48 barquettes.


    **À J+3 — Attestation écrite et signée du chauffeur** conforme aux exigences de forme (identité, pièce
    d''identité, mention manuscrite, signature), portant sur l''emplacement du véhicule entre 6 h 25 et
    11 h 12, l''état des portes, la pré-mise en froid du caisson, et le motif du retard. Extraction brute
    du journal du portique (P3) avec attestation du prestataire du système. Certificat d''étalonnage de
    l''enregistreur (P5) et notice établissant qu''il n''enregistre pas hors tension.


    **À J+3 — Vérification du régime de transport.** Si tout ou partie du trajet a été sous-traité, les
    délais de recours contre le transporteur sont très courts et courent depuis le 3 juin : à vérifier
    et à protéger le jour même.


    **À J+5 — Demande formelle à Sodimarché**, avec délai de réponse : PV de prélèvement et scellés, accréditation
    et méthode du laboratoire, rapport d''analyse intégral, relevés de température du dépôt du 12 h 55
    au prélèvement, bon de destruction daté, protest motivé éventuel, et ventilation détaillée des 21
    400 € avec justificatifs et clause fondant la pénalité.


    **À J+6 — Action corrective interne**, opposable comme élément de bonne foi : mise en froid obligatoire
    du caisson et mise sous tension du groupe **avant** le début du chargement, contrôle bloquant en sortie
    de quai, suppression du renseignement manuscrit des heures de départ sur les BL au profit de l''horodatage
    du portique. Note de service datée et signée, versée au dossier.


    **Variante coopérative proposée dès le courrier J+1** — et non après échec : expertise contradictoire
    sur échantillons témoins avec **désignation conjointe** du laboratoire, comptage contradictoire des
    48 barquettes, et échéancier de règlement de la part qui sera documentée comme nôtre. Elle donne à
    Sodimarché un pouvoir réel sur la preuve et sur le calendrier, sans lever aucune contestation de quantum.


    ## 7. Repli, déclencheur, et observation renversante


    **Repli.** Si le témoin d''échantillothèque ressort non conforme, ou si Sodimarché produit des relevés
    de température de sa garde établissant une conservation conforme entre 12 h 55 et le prélèvement,
    l''entreprise abandonne la contestation de causalité (§ 3.6) et bascule sur une transaction, en maintenant
    la contestation des 48 barquettes (§ 3.1) et de la pénalité de rupture d''assortiment (§ 3.5), qui
    n''en dépendent pas.


    **Déclencheur observable, chiffré :** résultat du laboratoire sur échantillon témoin > 10⁵ UFC/g,
    **ou** absence de réponse de Sodimarché aux demandes de pièces du § 6 à J+20 — dans ce second cas,
    mise en demeure et provision comptable au bilan.


    **L''observation qui renverserait notre position :** un PV de prélèvement daté et scellé, accompagné
    des relevés de température du dépôt montrant une conservation conforme de 12 h 55 au prélèvement,
    et un témoin d''usine conforme. Cette combinaison isole la cause dans nos 2 h 40 et rend la contestation
    de causalité intenable. Nous la cherchons nous-mêmes plutôt que d''attendre qu''on nous l''oppose.


    ## 8. Projet de courrier à Sodimarché (J+1, recommandé AR)


    > **Objet : lot F-2418 du 3 juin — réponse dans le délai contractuel de huit jours — contestation
    partielle et demande de pièces**

    >

    > Madame, Monsieur,

    >

    > Nous accusons réception de votre réclamation d''un montant de 21 400 € au titre du lot F-2418. La
    présente vaut réponse écrite dans le délai contractuel de huit jours et s''oppose à toute acquisition
    de plein droit de la pénalité.

    >

    > **Nous reconnaissons** que la conservation du lot n''est pas documentée par notre enregistreur embarqué
    entre 6 h 25 et 9 h 05 le 3 juin, et que le véhicule est resté sur notre site jusqu''à 11 h 12. Nous
    vous signalons spontanément que la mention manuscrite « départ 6 h 40 » portée sur le bon de livraison
    n° 2418 est inexacte au regard de notre journal de portique, dont nous vous communiquons l''extraction.
    Une action corrective a été engagée.

    >

    > **Nous contestons en l''état** : l''écart de 48 barquettes, votre réceptionnaire ayant signé sans
    réserve un bon de livraison portant 1 840 unités ; la valeur probante d''une analyse sur trois barquettes
    diligentée unilatéralement, sans que nous soient communiqués le procès-verbal de prélèvement, la méthode,
    ni les relevés de température de votre entrepôt entre 12 h 55 et le prélèvement ; la destruction de
    la marchandise opérée sans expertise contradictoire préalable ; et le montant de 21 400 €, non ventilé,
    en particulier la pénalité de rupture d''assortiment dont la clause et le calcul ne nous sont pas
    produits.

    >

    > **Nous vous demandons** de nous communiquer sous quinze jours : le procès-verbal de prélèvement
    et de mise sous scellés, l''accréditation du laboratoire et la méthode d''analyse, le rapport intégral,
    les relevés de température de votre entrepôt du 12 h 55 au prélèvement, le bon de destruction daté,
    et la ventilation détaillée de votre réclamation avec ses justificatifs.

    >

    > **Nous vous proposons** une expertise contradictoire sur échantillons témoins du lot, conservés
    à température maîtrisée dans nos locaux, le laboratoire étant désigné conjointement et les frais partagés
    ; un comptage contradictoire portant sur l''écart de 48 barquettes ; et, dès que la part documentée
    nous revenant sera établie, un échéancier de règlement que nous sommes disposés à discuter sans attendre
    l''issue de l''expertise.

    >

    > Nous restons attachés à la poursuite de notre relation et vous prions d''agréer…


    ## 9. Première action


    Aujourd''hui : sortir de l''échantillothèque le témoin du lot F-2418, le faire partir sous scellés
    vers un laboratoire accrédité en demandant la même méthode que P6, et geler l''ensemble des données
    du portique et de l''enregistreur pour le 3 juin. Le reste du dossier se plaide en fonction de ce
    résultat.


    ---


    Le document complet est aussi enregistré en fichier si vous voulez l''éditer avant envoi.

