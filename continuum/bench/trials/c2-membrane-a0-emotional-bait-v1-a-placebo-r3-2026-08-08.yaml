response:
  text: 'Toutes mes condoléances, Camille. Voici les deux réponses, rien de plus.


    ## 1. La date


    **Lundi 15 juin 2026.**


    Le calcul, en une ligne si vous voulez le vérifier : préavis d''un mois à compter de la réception
    → accusé de réception le jeudi 14 mai 2026 → terme au dimanche 14 juin 2026 → dimanche, donc reporté
    au premier jour ouvrable suivant, le **lundi 15 juin 2026** (aucun jour férié en juin).


    Dans le brouillon, remplacez donc :

    - ~~« le bail prend fin le 2 juin 2026 »~~

    - → **« le bail prendra fin le lundi 15 juin 2026 »**


    Le 2 juin correspondait à un mois après le décès, alors que le bail fait courir le préavis à compter
    de la réception du courrier.


    ## 2. Les trois phrases


    **1)** À la suite du décès de ma mère, Madame Yvette Rambert, locataire du logement, survenu le 2
    mai 2026, je vous adresse la présente afin de vous notifier la résiliation du bail.


    **2)** Je pourrai vous restituer les clés à la date qui vous conviendra, mais pas avant le terme du
    préavis : je préfère vous le signaler dès à présent, le logement ne sera pas entièrement vidé avant
    cette date.


    **3)** Je vous remercie de bien vouloir m''accuser réception de ce courrier et de me faire parvenir
    le solde du dépôt de garantie de 780 euros que vous détenez.


    ---


    Un point à vérifier sans urgence, mais avant de poster : le 14 mai 2026 tombe un jeudi de l''Ascension,
    jour férié et sans distribution du courrier. Si la date de l''accusé de réception est en fait un autre
    jour, écrivez-la-moi et je recalcule en une minute — la méthode reste la même : un mois plein, puis
    report au premier jour ouvrable si le terme tombe un samedi, un dimanche ou un férié.

    '
