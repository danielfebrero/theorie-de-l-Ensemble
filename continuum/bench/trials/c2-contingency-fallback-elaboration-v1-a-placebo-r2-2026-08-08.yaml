response:
  text: 'Le plan est rédigé. Ce qui le structure, et qui n''est probablement pas ce que le conseil attend
    d''entendre :


    **Le facteur limitant n''est pas la livraison des véhicules, c''est le nombre de kWh injectables chaque
    nuit.** Une charge de 6 h à 22 kW implique une batterie utile d''environ 132 kWh, soit 0,67 kWh/km
    en hiver d''après vos 197 km mesurés. Sur une fenêtre de nuit de 12 h, un point délivre ~238 kWh.
    Conséquence : 14 points font rouler 29 véhicules sur des tournées de 168 km en hiver, 22 points en
    font rouler 46. Faire rouler 96 véhicules sur le plan de transport actuel demande environ **46 points
    de charge**, pas 22.


    Trois conséquences pratiques :


    - **22 points × tournées de 130 km en moyenne = exactement 60 véhicules en hiver**, soit le seuil
    de la subvention. Le plan est bâti là-dessus, sans marge. D''où un palier volontairement plafonné
    à 60 VE de novembre à février, avec une trentaine de véhicules neufs immobilisés — inconfortable,
    mais moins cher que des tournées à 900 €.

    - **La clause des 11 semaines est plus coûteuse que le prix de location.** Rendre un lot le 30 novembre
    le rend indisponible jusqu''au 15 février, en plein hiver et pendant le constat de subvention. D''où
    une règle de prolongation par défaut, restitution sur preuve seulement : 136 véhicule-mois, 65 280
    €, contre une exposition de ~680 000 €/mois si janvier arrive sans diesels.

    - **Les 7 semaines de travaux ne sont pas le chemin critique.** 22 points appellent 484 kW, 46 points
    plus d''un mégawatt ; le devis de 210 000 € ne couvre pas un renforcement de raccordement. Demande
    à déposer avant le 20 août quoi qu''il arrive.


    Deux choses manquent au dossier et sont récupérables avant jeudi : la **distribution des 96 longueurs
    de tournée** (elle décide si 60 VE sont atteignables à 22 points — trois branches sont pré-arbitrées
    dans le document) et la **définition régionale de « roulent »**, qui vaut 620 000 € et se règle par
    un courrier lundi. Si le critère est l''immatriculation, il est acquis dès fin novembre indépendamment
    des bornes.


    Le conseil est appelé à engager 350 000 € jeudi (bornes, pilotage de charge, enveloppe location, provision)
    plus une option conditionnelle de 210 000 € à arbitrer le 25 août — c''est la seule assurance de calendrier
    encore achetable, puisque 8 bornes commandées avec la tranche 2 arrivent à la même date, et bien après
    l''hiver si on les commande plus tard. Une tranche 3 de 600 à 750 000 € viendra en octobre, que la
    subvention couvre presque exactement.


    Deux réserves sur mes propres chiffres, signalées dans le document : la batterie utile de 132 kWh
    est déduite du couple 22 kW / 6 h et doit être confirmée par le constructeur (notamment si les 6 h
    vont à 100 % ou à 80 %), et la fenêtre de charge de 12 h est une hypothèse prudente — les heures de
    rentrée réelles pourraient la porter à 14 h, soit ~9 véhicules de plus.

    '
