response:
  text: '# Note au comité — fermetures de magasins


    **Destinataires :** comité de direction, séance de mardi

    **Objet :** quels magasins fermer pour tenir l''objectif de 300 000 €


    ---


    ## 1. Recommandation


    **Ne fermer aucun magasin mardi.** Fermer Vitry, Chambéry et Nîmes ne rapporterait pas 300 000 € :
    cela coûterait environ **114 000 € de résultat par an**, plus **1,1 M€ de trésorerie** immédiate pour
    Chambéry.


    Mardi, le comité décide trois choses : ouvrir l''instruction du seul cas défendable (Vitry), obtenir
    deux chiffres manquants sous 30 jours, et lancer le plan qui produit réellement les 300 000 €.


    ## 2. Pourquoi les trois « pertes » n''en sont pas


    Le résultat par magasin inclut une part des frais de siège et de logistique (6,4 M€ répartis au prorata
    du chiffre d''affaires). **Ces frais ne disparaissent pas quand un magasin ferme** : ils se reportent
    sur les seize autres. Le bon indicateur pour une décision de fermeture est donc ce que le magasin
    rapporte *avant* cette répartition.


    | Magasin | Résultat affiché | Part de siège incluse | Ce que le magasin rapporte réellement |

    |---|---|---|---|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |

    | **Total** | **−288 000 €** | 402 000 € | **+114 000 €** |


    Le piège est visible : les trois « pertes » totalisent 288 000 €, presque exactement l''objectif.
    C''est une coïncidence de présentation comptable, pas un gisement. Les trois magasins couvrent leurs
    propres coûts et contribuent, ensemble, à hauteur de 114 000 € aux frais de structure.


    Précision sur Vitry : 18 % de ses entrées sont des retraits de commandes web, dont le chiffre d''affaires
    est comptabilisé sur l''entité e-commerce. Vitry supporte le coût de ce service sans en recevoir le
    produit. Sa contribution réelle est donc **supérieure** à 63 000 €, d''un montant que nous ne savons
    pas encore chiffrer.


    ## 3. Ce qui renverserait cet avis


    Une seule chose : **si une part significative des 6,4 M€ disparaissait vraiment avec les magasins.**
    Une tournée logistique supprimée, un poste de supervision régionale, des licences par site — cela
    existe. Les seuils sont calculables :


    - Fermer Vitry n''améliore le résultat que si **plus de 35 %** de sa quote-part (181 000 €) s''évapore
    réellement.

    - Chambéry : plus de 25 %. Nîmes : plus de 20 %.


    Nous ne connaissons pas cette part. **C''est le chiffre décisif, et il est absent du dossier.** Le
    contrôle de gestion peut le produire en dix jours en ventilant les 6,4 M€ en trois blocs : coûts qui
    disparaissent avec un site, coûts qui disparaissent par paliers, coûts qui restent quoi qu''il arrive.


    Second élément manquant : **combien de clients suivent quand un magasin ferme.** Les 41 % de porteurs
    de carte multi-magasins ne mesurent pas cela — ils mesurent une habitude chez les 23 % de clients
    les plus fidèles, ce qui surestime le report. Nous disposons d''une observation réelle et inexploitée
    : **la fermeture de Nîmes pendant cinq semaines en mars 2024.** Les totaux mensuels des magasins voisins
    existent. Deux jours de travail donnent un ordre de grandeur du taux de report à 23 km. Limites à
    assumer : cinq semaines, une saison, granularité mensuelle, et une fermeture perçue comme temporaire
    — les clients attendent au lieu de changer d''habitude, ce qui sous-estime probablement le report
    définitif.


    ## 4. Le cas Vitry — et son horloge


    Vitry est le seul dossier à instruire, pour trois raisons : sortie de bail sans indemnité, magasin
    du réseau à 14 km, et donc report de clientèle plausiblement élevé. Si 60 % de son activité migrait
    à 14 km, l''essentiel de sa contribution réapparaîtrait ailleurs sans coût supplémentaire. **C''est
    le meilleur argument contre notre recommandation, et il est sérieux.**


    Ce qui l''empêche d''être une décision de mardi : nous n''avons aucune mesure de ce report, et la
    fermeture supprimerait un point de retrait en proche couronne, avec un effet non chiffré sur l''entité
    e-commerce.


    **Point urgent.** Un bail commercial se dénonce généralement par congé six mois avant l''échéance.
    Si c''est le cas ici, la fenêtre de décision n''est pas de sept mois mais **d''environ un mois**.
    À vérifier auprès du conseil dès lundi — c''est la seule vraie contrainte de calendrier du dossier.


    ## 5. Chambéry et Nîmes — non


    **Chambéry :** payer 1,1 M€ d''indemnité pour supprimer 32 000 € de contribution annuelle. Le magasin
    le plus proche est à 92 km : le report serait quasi nul, la perte de chiffre d''affaires quasi totale.
    Aucune lecture ne rend cette opération rentable.


    **Nîmes :** les murs (1,9 M€) sont une question de bilan, pas d''exploitation. Deux mises en garde.
    Une cession-bail (vendre les murs, rester locataire) transformerait +19 000 € en perte lourde dès
    la première année de loyer. Une vente après fermeture dégagerait une plus-value ponctuelle, qui pourrait
    atteindre l''objectif à elle seule — mais une fois, en détruisant un résultat récurrent et une position
    commerciale. Nous ne la recommandons pas ; si l''actionnaire vise un résultat non reconductible, il
    doit le dire, car cela change entièrement la réponse. **Nous supposons ici un objectif récurrent.**


    ## 6. Où sont réellement les 300 000 €


    - **Frais de structure (6,4 M€)** : −5 % = 320 000 €. C''est l''arithmétique honnête de l''objectif.
    Aucun magasin n''est en cause.

    - **Planification des équipes** : nous disposons de 24 mois de comptages à la demi-heure, calibrés
    à ±2 %, sur 19 magasins. C''est l''actif le plus sous-exploité du dossier. Sur une masse salariale
    de l''ordre de 17 à 19 M€ (430 salariés — le chiffre exact est au contrôle de gestion), un ajustement
    de 1,5 à 2 % des heures aux flux réels représente 250 000 à 380 000 €, sans fermeture ni licenciement.

    - **Refacturation des retraits web** aux entités : à traiter, mais sans illusion. Si l''objectif porte
    sur le résultat consolidé du groupe, un transfert entre entités ne crée rien. **Il faut faire préciser
    le périmètre.**


    Réserve de méthode sur les comptages : ils enregistrent des entrées, pas des acheteurs. À Vitry, 18
    % ne sont pas des clients du magasin. Les taux de transformation ne sont pas comparables entre sites
    tant que les retraits ne sont pas déduits.


    ## 7. Ce qu''on engage d''ici là


    | Échéance | Action | Responsable |

    |---|---|---|

    | Lundi | Vérifier le délai de congé du bail de Vitry | Direction juridique |

    | 10 jours | Ventiler les 6,4 M€ : coûts évitables / par paliers / incompressibles | Contrôle de gestion
    |

    | 10 jours | Exploiter mars 2024 (Nîmes) pour estimer le taux de report | Contrôle de gestion |

    | 30 jours | Chiffrer le coût du service retrait web à Vitry et le facturer | DAF |

    | 30 jours | Plan d''ajustement des heures aux flux, 19 magasins | DRH + exploitation |

    | 90 jours | Décision Vitry, sur mesures et non sur intuition | Comité |


    **Contrainte à énoncer clairement :** l''enseigne n''a jamais fermé de magasin. Une fermeture chez
    un employeur de 430 salariés déclenche une consultation du CSE **préalable à la décision** et un plan
    de sauvegarde de l''emploi. Mardi, le comité ne peut donc pas décider une fermeture ; il peut décider
    d''ouvrir une instruction. Si l''instruction Vitry aboutit, l''offre de reclassement au magasin situé
    à 14 km doit être construite avant l''annonce, avec prise en charge du trajet et maintien de l''ancienneté
    — c''est ce qui distingue une réorganisation d''une rupture.


    **Repli.** Si la ventilation des 6,4 M€ montre que plus de 35 % de la quote-part de Vitry disparaît
    réellement à la fermeture, et que mars 2024 indique un report supérieur à 50 %, nous révisons cette
    note et recommandons la sortie de Vitry à l''échéance du bail. Aucun autre résultat ne justifierait
    de rouvrir les cas Chambéry et Nîmes.

    '
