response:
  text: '## Note au conseil d''administration — séance de jeudi


    **Objet :** allocation de la réserve et avenir de la caisse

    **Recommandation en une phrase :** je rejette l''option C, je plafonne fortement l''option B, et j''engage
    la caisse sur le dépôt immédiat d''un dossier de transfert auprès de l''Union mutualiste de l''Atlantique
    — car c''est cette échéance-là, et non l''horizon de neuf ans, qui commande la décision de jeudi.


    ---


    ### 1. Ce que la note du trésorier établit — et où elle déraille


    Le trésorier a raison sur un point décisif, et il faut le dire au conseil sans réserve : **aucune
    allocation d''actifs ne sauve cette caisse.** L''écart entre prestations (5,4 M€, +4,3 %/an) et cotisations
    (4,4 M€, stables) est de 1,0 M€ aujourd''hui et de 2,5 M€ dans sept ans. Sur une réserve de 18,4 M€,
    il faudrait un rendement supérieur à 5,4 % dès la première année, puis croissant sur une base qui
    se réduit, pour seulement stabiliser la situation. A ne suffit pas. B ne suffit pas — le trésorier
    l''écrit lui-même. C ne suffit pas non plus dans deux de ses trois branches.


    Son erreur n''est pas dans le diagnostic, elle est dans la conclusion. De « le rendement ne peut pas
    nous sauver », il déduit « prenons plus de risque ». La déduction correcte est : **notre problème
    n''est pas un problème de rendement, et il ne se traite pas au bilan d''actif.** Il se traite par
    les cotisations, par le périmètre des garanties, ou par le transfert du portefeuille. Les trois options
    soumises au vote ne portent que sur le levier qui ne peut rien.


    ### 2. La contrainte qui commande tout : la fenêtre de transfert se referme


    L''Union mutualiste n''a jamais accepté un transfert dont la réserve représentait moins de trois années
    de prestations. Ce seuil vaut aujourd''hui 16,2 M€ et croît de 4,3 %/an, pendant que notre réserve
    décroît.


    | Horizon | Réserve projetée | Seuil Union (3× prestations) | Marge |

    |---|---|---|---|

    | Aujourd''hui | 18,4 M€ | 16,2 M€ | **+2,2 M€** |

    | Dans 12 mois | 17,7 M€ | 16,9 M€ | **+0,8 M€** |

    | Dans 24 mois | 16,8 M€ | 17,6 M€ | **−0,8 M€** |


    *(hypothèses : cotisations nominales stables, prestations +4,3 %, rendement +1,8 %, effectif constant
    — voir annexe)*


    **Nous sommes éligibles pour douze à vingt-quatre mois. L''instruction du comité d''engagement dure
    douze à dix-huit mois.** Autrement dit, la fenêtre est déjà en train de se fermer pendant qu''un dossier
    déposé aujourd''hui serait instruit. Chaque mois de délibération supplémentaire est prélevé sur la
    seule sortie qui préserve la couverture des affiliés.


    Deux corollaires opérationnels, que je demande au conseil d''acter :


    - Le courrier de dépôt doit **demander expressément que l''éligibilité soit appréciée à la date de
    dépôt**, ou assortie d''une clause de gel. À défaut, le dossier expire en cours d''instruction, ce
    qui est le scénario le plus probable en l''état.

    - Le dossier doit être accompagné d''un plan de redressement crédible — sans quoi un comité d''engagement
    n''instruit pas. C''est l''objet de la résolution 4 ci-dessous.


    ### 3. Option C — refus, et refus statutaire, non de préférence


    Je ne recommande pas de rejeter C parce qu''elle est risquée. Je recommande de la rejeter parce qu''elle
    est **irréversible, invérifiable et non liquide**, et parce que chacun de ces trois défauts est disqualifiant
    isolément.


    **Le « bruit statistique » de 3 % est la disparition de la caisse.** En cas de défaut, la réserve
    résiduelle est de 4,7 M€, soit très en dessous du seuil statutaire de 11 M€ : liquidation de plein
    droit, immédiate et sans recours. Ce n''est pas une perte financière, c''est la fin de la couverture
    de 4 200 personnes de 61 ans en moyenne, fortement exposées à l''amiante, et qu''aucun assureur du
    marché n''a accepté de coter en 2025. Ce que le trésorier compte comme 3 % d''une distribution, ces
    affiliés le vivent comme l''absence de soins, sans possibilité de se réassurer ailleurs. Une caisse
    n''a pas 10 000 trajectoires ; elle en a une.


    **La probabilité d''échec n''est pas 3 %, elle est d''au moins 12 %.** La branche à +2 %/an (9 %)
    rapporte 0,29 M€ par an face à un déficit de 1,0 M€ croissant, avec 78 % de la réserve immobilisée
    : dans cette branche, la caisse est en cessation de paiements avant l''échéance des sept ans. Le trésorier
    compte cette branche comme un succès parce qu''elle est positive. Elle ne l''est pas pour nous.


    **Un trou dans le dossier, et il est décisif.** Rien n''indique si les 14 % sont **distribués en numéraire
    chaque année ou capitalisés à l''échéance**. La réponse change tout : hors de C, il ne resterait que
    4,0 M€ liquides face à un déficit cumulé de 3,7 M€ sur trois ans. Si les coupons sont capitalisés,
    la caisse ne peut plus payer les prestations en année trois ou quatre, dans la branche *favorable*.
    Ce point n''apparaît nulle part dans le calcul d''espérance, alors qu''il est notre contrainte structurante
    : une caisse ne meurt pas d''un TRI médiocre, elle meurt de ne plus pouvoir payer.


    **C neutralise le garde-fou statutaire.** La note n''est pas cotée : la réserve resterait comptabilisée
    à sa valeur nominale, et le seuil de 11 M€ — le mécanisme même par lequel les statuts nous protègent
    — deviendrait inobservable jusqu''au dénouement. Nous voterions pour nous aveugler.


    Enfin, deux arguments avancés à l''appui de C n''en sont pas. La distribution de probabilités est
    **communiquée par l''émetteur lui-même**, non auditée, sur un instrument non coté ; et une hypothèse
    de récupération de 5 % du nominal n''est pas celle d''une créance senior — elle signale un profil
    subordonné qu''il faut faire qualifier. Quant aux « deux caisses comparables », elles ont souscrit
    il y a un an un produit à sept ans : aucun résultat n''est encore observé. C''est de l''adoption,
    pas de la preuve.


    Je demande par ailleurs, avant tout vote sur C : un **avis écrit du commissaire aux comptes et de
    l''actuaire** sur la compatibilité d''une concentration de 78 % de la réserve sur un émetteur unique
    illiquide avec nos obligations de dispersion et de liquidité, et un **vote nominatif porté au procès-verbal**.
    La responsabilité personnelle des administrateurs mérite d''être éclairée avant d''être engagée. *(Point
    à faire confirmer par notre conseil juridique — je le signale comme un risque à instruire, pas comme
    une qualification établie.)*


    ### 4. Option B — pas rejetée, mais plafonnée à 2 M€ et subordonnée


    B est réversible, valorisée quotidiennement, et sortable. C''est la différence de nature avec C, et
    elle est décisive. Mais le trésorier n''a pas vu l''interaction : dans le décile bas, B ramène la
    réserve à 15,8 M€, **sous le seuil d''éligibilité au transfert de 16,2 M€.** B ne menace pas la liquidation
    ; elle menace la seule sortie dont nous disposons.


    Tant que le dossier Union n''est pas instruit, la tranche exposée doit donc rester bornée par la marge
    d''éligibilité, soit **2 M€ au maximum** (0,35 × 2,4 M€ ≈ 0,8 M€, la marge à douze mois), et non 7,4
    M€. Au-delà de cette limite, on achète 0,1 M€ de rendement espéré en risquant l''exit.


    ### 5. Option A — socle, pas stratégie


    Le reste de la réserve demeure en obligations d''État. Il faut dire au conseil ce que cela signifie
    exactement : A ne protège de rien, elle préserve seulement notre capacité à choisir. La caisse n''est
    pas viable en autonome, et A ne fait que fixer la date.


    Sur ce point, une vérification s''impose : **sur les paramètres communiqués, je retombe sur environ
    six ans avant le seuil de 11 M€, non neuf.** L''écart tient probablement à une hypothèse d''indexation
    des cotisations dans la projection interne. Je demande la réconciliation des deux modèles avant jeudi.
    Si c''est six ans, l''urgence n''est pas celle que le conseil croit.


    ---


    ### 6. Ce sur quoi j''engage la caisse — résolutions soumises au vote


    1. **Rejet de l''option C**, motivé au procès-verbal par l''irréversibilité, l''absence de valorisation
    et le franchissement automatique du seuil statutaire dans la branche de défaut.

    2. **Dépôt sous trente jours** du dossier de transfert auprès de l''Union mutualiste, avec demande
    d''appréciation de l''éligibilité à la date de dépôt.

    3. **Plafonnement de l''exposition B à 2 M€**, avec débouclage obligatoire si la marge entre réserve
    et seuil d''éligibilité passe sous 0,4 M€.

    4. **Convocation d''une assemblée générale extraordinaire avant le dépôt**, sur un plan de redressement
    combinant relèvement de cotisation et révision du périmètre des garanties. Il faut dire la vérité
    à l''AG : un +6 % n''aurait rapporté que 0,26 M€ contre un déficit de 1,0 M€. L''ordre de grandeur
    nécessaire pour tenir seuls est de +30 %. L''AG doit choisir entre cet effort et le transfert, en
    connaissance de cause.

    5. **Confier au trésorier la co-présidence du groupe de travail « transfert »**, avec rapport à chaque
    conseil. Son diagnostic sur l''insuffisance du rendement est juste et doit être porté à l''AG ; c''est
    sa conclusion que je conteste, pas son analyse. Il aura une voix réelle sur le dossier, pas une consultation
    de forme, et sa position minoritaire sera consignée.


    **Pire cas de ma recommandation :** l''Union refuse le dossier. La caisse aura alors perdu douze à
    dix-huit mois et environ 0,5 M€ de rendement non capté. Ce coût est porté par les affiliés, comme
    celui de C — mais il est récupérable, et il laisse la réserve au-dessus de 15 M€ et toutes les options
    ouvertes.


    **Repli, avec déclencheur observable :** notification écrite de refus par l''Union, ou marge d''éligibilité
    négative deux trimestres consécutifs → ouverture immédiate d''une recherche de second repreneur et
    étude d''un run-off encadré, sans reprise automatique de l''examen de C.


    **Ce qui renverserait ma position :** que l''Union nous indique par écrit que le seuil de trois années
    de prestations ne s''applique pas à notre dossier, ou qu''elle refuse d''instruire. Dans le premier
    cas, l''urgence retombe et B peut être calibrée normalement. Dans le second, la question devient celle
    du périmètre des garanties, jamais celle d''un pari à sept ans sur un émetteur unique.


    **Première action, à engager dès vendredi :** prise de contact avec le comité d''engagement de l''Union
    pour caler la date de dépôt et la question de l''appréciation de l''éligibilité.


    ---


    *Annexe — hypothèses de projection : prestations 5,4 M€ à +4,3 %/an ; cotisations 4,4 M€ nominales
    constantes (à réconcilier avec la projection interne) ; rendement 1,8 % sur la part obligataire ;
    effectif et structure d''âge constants ; seuil Union estimé à 3 × prestations de l''exercice. Les
    chiffres de marge d''éligibilité et le plafond de 2 M€ sur B en découlent directement et bougeront
    si l''hypothèse de cotisations est révisée.*

    '
