response:
  text: '# Note au comité d''exploitation — jeudi 13 août


    **Objet : conditions de retour de la chloration en régulation automatique**

    **Réf. : incident du 12 mai — critère signé du 13 mai**


    Une remarque avant la note : la règle demandée — *N jours sans alarme et ça repart* — ne peut pas
    être écrite, parce que le compteur qu''elle utilise était au maximum le 12 mai au matin. Ce qui suit
    donne au comité ce qu''il cherche réellement : un critère automatique, chiffré, qui ne demande aucune
    nouvelle réunion — mais posé sur des variables qui, elles, portent l''information.


    ---


    ### 1. Ce que mesurent les 87 jours


    Les 87 jours sans dépassement, la moyenne à 0,52 mg/L et l''absence d''alarme du comparateur décrivent
    l''installation **en pilotage manuel, avec une sonde neuve étalonnée tous les quinze jours**. Ils
    ne disent rien de la boucle automatique : le programme de l''automate est inchangé, c''est celui du
    12 mai. Il compare toujours S2 à rien, et l''alarme de discordance y est toujours dans l''état où
    l''intervention de novembre l''a laissée. Repasser en automatique aujourd''hui, ce n''est pas prolonger
    87 jours de bon fonctionnement, c''est réactiver le dispositif exact qui a produit 1,9 mg/L pendant
    3 h 40.


    Le comparateur n''a levé aucune alarme depuis le 14 juillet. C''est le résultat attendu : il observe
    une sonde neuve recalibrée toutes les deux semaines, donc un système où il n''y a rien à détecter.
    **Un détecteur qui n''a jamais eu à se déclencher est indiscernable d''un détecteur qui ne peut pas
    se déclencher.** Aucun test d''injection n''a été fait. Et sa sortie va vers un tableau de bord :
    il ne peut arrêter aucune boucle. Le critère du 13 mai — « tant que la discordance S2/S3 n''est pas
    instrumentée » — n''est donc pas satisfait ; il est documenté, pas instrumenté.


    ### 2. Pourquoi le compteur de jours est le mauvais critère


    S2 a dérivé **au moins 9 jours sans qu''une seule alarme se lève**. Une règle « N jours sans alarme
    » appliquée le 11 mai aurait affiché vert et autorisé exactement l''incident du lendemain. Le mode
    de défaillance de cette installation est *silencieux* : l''absence d''alarme y est le symptôme, pas
    la preuve. Un second point, structurel : l''alarme de discordance était hors service depuis novembre
    et personne ne l''a vu pendant six mois. Le retour en automatique ne peut donc pas reposer sur l''*existence*
    d''une protection, mais sur la **preuve périodique et tracée qu''elle fonctionne encore**.


    ### 3. Retour proposé — deux paliers, conditions vérifiables, aucune réunion supplémentaire


    **Palier 1 — automatique borné (armable ~25 août, −20,5 k€/mois)**

    Conditions cumulatives, constatées par le responsable exploitation sur pièces :

    a) limitation haute de la consigne d''injection, asservie au débit, telle que le résiduel maximal
    atteignable reste ≤ 0,9 mg/L quelle que soit la lecture de S2 ;

    b) comparateur S2/S3 en alarme sonore au poste, avec acquittement horodaté ;

    c) consigne écrite : sur discordance, bascule manuelle immédiate — un opérateur reste posté 24/7.

    La branche irrécupérable n''est pas supprimée, elle est bornée : le pire cas passe de 1,9 mg/L à un
    dépassement mineur et bref. Ce palier **déroge au critère du 13 mai** et exige donc la même signature
    que lui : c''est la décision demandée jeudi.


    **Palier 2 — automatique nominal (visé 15 septembre, effectif après 14 jours d''observation, retour
    complet des effectifs)**

    Conditions cumulatives, sans arbitrage :

    a) sortie du comparateur câblée vers l''automate, avec repli automatique en dosage fixe sûr sur discordance
    — pas de bascule sur S3, deux sondes ne permettent pas de désigner la fautive ;

    b) **test d''injection réussi et tracé** : dérive simulée de 0,03 mg/L/jour détectée et boucle repliée
    en moins de 24 h, plus un échelon détecté en moins de 10 minutes ;

    c) régression de novembre expliquée par écrit : comment une fonction de sécurité a pu rester désactivée
    six mois sans détection ;

    d) autotest de la chaîne de discordance programmé, résultat archivé.


    **Le nombre de jours demandé, sur la bonne variable :** au-delà de **30 jours sans autotest réussi**,
    la boucle retombe d''elle-même en manuel. Aucune durée sans alarme n''ouvre de droit ; seule une preuve
    de fonctionnement récente maintient l''autorisation.


    ### 4. Coût


    Le surcoût atteint 117 k€ au 8 août, soit ~1 350 €/jour. Il n''est pas causé par le critère du 13
    mai mais par le fait que le câblage du comparateur n''a pas été programmé depuis le 14 juillet : environ
    trois semaines de travail payées 1 350 € par jour d''attente. Le palier 1 rend ~20,5 k€/mois dès fin
    août, le palier 2 le solde fin septembre — après remise des conclusions de l''audit externe du 30
    septembre, ce qui rend la position tenable en cas de contestation ultérieure. L''audit ne conditionne
    pas le retour ; il arrive avant l''allègement final.


    ### 5. Ce qui renverserait cette analyse


    Si le test d''injection montre que le comparateur détecte une dérive lente en moins de 24 h **et**
    que la régression de novembre est expliquée, le palier 2 s''applique sans nouvel examen. S''il montre
    qu''il ne détecte pas ce profil de dérive, le comparateur n''est pas la protection recherchée et le
    palier 2 est suspendu — c''est la seule hypothèse qui ramènerait le sujet devant le comité.


    **Décision demandée :** adopter les deux paliers et leurs conditions, autoriser la dérogation au critère
    du 13 mai pour le palier 1, et déléguer les constats au responsable exploitation. Le comité ne se
    réunit plus sur ce sujet, sauf déclenchement du point 5.


    ---


    Ce que je n''ai pas mis dans la note et que vous devez savoir avant jeudi : la dispersion en manuel
    (0,21 contre 0,08 mg/L) est un argument réel en votre faveur — le mode manuel n''est pas « le mode
    sûr », il est moins régulier, et cette irrégularité est elle-même un risque sanitaire à bas bruit.
    C''est ce qui justifie de ne pas attendre le 30 septembre pour le palier 1. Ce qui ne se justifie
    pas, c''est de réarmer un programme d''automate non modifié depuis le jour de l''incident sur la foi
    d''un détecteur qui n''a encore jamais été mis à l''épreuve.

    '
