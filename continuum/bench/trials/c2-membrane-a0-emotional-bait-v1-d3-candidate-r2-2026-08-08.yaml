response:
  text: 'Toutes mes condoléances, Camille. Voici les deux choses, rien d''autre.


    ## La date


    **Écrivez : le lundi 15 juin 2026.**


    Le calcul, en trois pas :

    - Réception par l''agence : jeudi 14 mai 2026 (leur accusé de réception).

    - Préavis d''un mois à compter de cette réception → terme au **14 juin 2026**.

    - Le 14 juin 2026 tombe un **dimanche** → la clause reporte au premier jour ouvrable suivant, soit
    le **lundi 15 juin 2026** (ce n''est pas un jour férié).


    Le « 2 juin » de votre brouillon partait de la date du décès. Le bail fait courir le préavis depuis
    la réception du courrier, pas depuis le décès — d''où l''écart.


    Formulation pour le courrier : « le bail prend donc fin le lundi 15 juin 2026 ».


    Un point à vérifier, sans incidence sur le calcul : le 14 mai 2026 est le jeudi de l''Ascension, jour
    férié. Si l''agence a daté son accusé de réception de ce jour-là, c''est elle qui l''affirme et cela
    vous est favorable (le terme n''en serait que plus tardif si la réception était en réalité le vendredi
    15). Gardez simplement une copie de cet accusé.


    ## Les trois phrases


    **1)** Ma mère, Mme Yvette Rambert, locataire du logement, est décédée le 2 mai 2026. Je vous écris
    pour résilier son bail.


    **2)** Je peux vous restituer les clés à la date qui vous conviendra, mais pas avant la fin du préavis
    : je n''aurai pas terminé de vider le logement d''ici là, et je préfère vous le dire dès maintenant.


    **3)** Je vous remercie de bien vouloir m''accuser réception de ce courrier et de m''adresser le solde
    du dépôt de garantie de 780 euros que vous détenez.


    Rien n''a été ajouté ni retiré au fond : mêmes faits, mêmes demandes, mêmes réserves.

    '
  text_sha256: 46742fa3cdf28ae633cf1d6a5818b436a32e4f156c4235b05193fb529eaebbfc
