response:
  text: 'Le document est livré en deux parties : la note de dossier pour l''assureur, et le projet de
    courrier au dépôt à envoyer dans le délai. *(Écrit dans le scratchpad — l''écriture dans le répertoire
    de travail n''a pas été autorisée.)*


    **Le point qui structure tout le dossier :** la pièce 2 est fausse. La mention manuscrite « départ
    6 h 40 » est contredite par la pièce 3, une écriture automatique horodatée à 11 h 12. Le camion est
    donc resté chargé sur le site **4 h 47**, dont **2 h 40 sans aucun enregistrement de température**
    (le groupe froid n''est sous tension qu''à 9 h 05, pièce 5). La défaillance est interne, et elle est
    documentée par nos propres pièces. L''entreprise doit le dire elle-même, avant que quiconque le lui
    oppose.


    **Ce qu''elle reconnaît.** L''absence de justification de la chaîne du froid sur 2 h 40 — pas un dépassement
    de 4 °C, aucune pièce ne l''établit, mais l''impossibilité de prouver la conformité, charge qui nous
    incombe. Le stationnement prolongé. L''inexactitude de notre propre BL, dont nous nous interdisons
    de nous prévaloir. Et le principe d''une indemnisation de la marchandise réellement reçue et réellement
    détruite.


    **Ce qu''elle conteste.** Les 21 400 € en totalité, faute de facture et de décomposition. L''assiette
    : le dépôt a reçu **1 792** barquettes (pièce 4) après que son propre réceptionnaire a signé pour
    1 840 (pièce 2) — écart de 48 unités inexpliqué, contradiction interne à ses documents. La destruction,
    dont rien n''atteste ni la réalité ni le volume, sans constat contradictoire. Le transport et la pénalité
    d''assortiment, sans le moindre support ni même la clause invoquée. Et la portée de la pièce 6 : le
    chiffre n''est pas discuté, mais trois barquettes sans PV de prélèvement, sans scellés, sans témoin
    de contre-analyse ne datent pas la non-conformité — **la marchandise était chez eux depuis 12 h 55,
    et cette fenêtre-là est aussi peu documentée que la nôtre.**


    **Ce que j''ai refusé d''écrire**, parce que l''assureur renverrait le dossier : la température réelle
    avant 9 h 05, la cause de l''attente (la pièce 7 est un propos téléphonique — ni écrit, ni daté, ni
    signé, et « parti tôt » est de surcroît contredit par la pièce 3), l''origine des 48 barquettes, le
    statut du chauffeur. Ces points figurent en § 4 comme lacunes assumées, chacune adossée à une action
    qui produira la pièce manquante.


    **Sous huit jours :** le courrier part (LRAR + courriel, il fait obstacle à l''acquisition de plein
    droit) ; attestation écrite et signée du chauffeur ; extraction brute certifiée du portique et de
    l''enregistreur ; contrôle de traçabilité sur l''écart de 48 ; mise sous séquestre et analyse des
    témoins ; demande de production au dépôt ; déclaration de sinistre avec liste explicite des pièces
    encore absentes.


    Deux points à trancher de votre côté : le **statut du chauffeur** conditionne l''existence d''un recours,
    et la **date de réception de la réclamation** n''est établie par aucune pièce — le courrier la demande,
    mais partez du délai le plus court.

    '
