  text: 'L''écriture fichier n''a pas été autorisée non plus — voici la note directement.


    ---


    # Note au comité de direction — Prestataire de paiement


    **De :** Direction des opérations · **Pour décision :** vendredi


    ## Recommandation : Option B, mais pas le B qui est sur la table


    Bascule progressive à **calendrier avancé** : 10 % au 15 septembre, 100 % au 27 octobre — un mois
    plein avant le Black Friday (27 novembre), compte Solda encore ouvert.

    **Économie an 1 : 387 500 €**, contre 500 000 € pour A et 310 000 € pour le B proposé.


    ## Pourquoi pas A


    La bascule du 3 novembre place la fenêtre de dégradation mesurée chez le marchand comparable — 1,3
    % d''échec pendant trois semaines — du 3 au 24 novembre. Le Black Friday tombe le 27. **Trois jours
    de marge**, sur une seule observation, chez un autre marchand, avec une autre intégration. Si la courbe
    met quatre semaines au lieu de trois, le pic annuel se joue en régime dégradé.


    Le vrai risque n''est pas là. À 3× le volume normal, le Black Friday tourne à **94 500 € de GMV par
    heure**. Quatre heures d''incident = 378 000 €, davantage que l''économie annuelle de A. Notre astreinte
    sait rebasculer le trafic en moins de 15 minutes — mais seulement **tant que les deux comptes sont
    ouverts**. Avec le levier : 20 minutes, 31 500 €. Sans : la durée de l''incident.


    Et le point de non-retour n''est pas la pénalité de 240 000 €, nulle pendant 90 jours et donc couverte.
    C''est la fermeture du compte Solda : 6 semaines de réouverture et la recollecte des empreintes auprès
    de **2,1 millions de clients**. On ne redemande pas leur carte à 2,1 millions de personnes. Cette
    branche ne se rattrape pas, et A l''arme trois jours après la fin d''une rampe non vérifiée.


    ## Pourquoi pas le B proposé


    Démarrer le 3 novembre, c''est payer deux fois : la rampe traverse le pic à mi-parcours, et sa queue
    tombe dans les mois de prolongation Solda à 130 000 €. **Le contrat Solda court déjà jusqu''au 30
    novembre — il est payé.** Chaque semaine de double run avant cette date coûte 45 000 €/mois et zéro
    prolongation. C''est la fenêtre gratuite ; le B proposé ne l''utilise pas.


    ## Calendrier


    **15 sept → 10 %** · **29 sept → 25 %** · **13 oct → 50 %** · **27 oct → 100 %** · gel total de configuration
    du 20 novembre au 31 décembre · Black Friday à 100 % avec Solda vivant · fermeture Solda après le
    pic.


    Aucun palier n''est franchi sans 7 jours consécutifs à ≤ 0,6 % d''échec au palier courant.


    ## Bascule arrière


    Déclencheur : échec Payflux **> 1,5 % sur deux rafraîchissements consécutifs** du tableau de bord
    (10 min), ou taux d''autorisation inférieur de plus d''1 point à Solda sur tranche comparable pendant
    30 min. L''astreinte rebascule 100 % du trafic **sans escalade ni réunion**. Exercice à blanc avant
    le 15 septembre — sinon le 15 septembre ne se fait pas.


    ## Lundi


    1. **Notification Solda de la prolongation au mois le mois — envoyée lundi, pas le 14 octobre.** Obtenir
    par écrit que la notification ouvre une option sans engager de minimum. Si Solda exige un engagement
    : acheter décembre seul, 130 000 €, soit 26 % de l''économie contre la perte de 2,1 M d''empreintes.
    *(dir. opérations)*

    2. **Signature Payflux au plus tard le 8 septembre**, avec deux clauses : les 90 jours de sortie gratuite
    courent à partir de la première transaction en production ; engagement contractuel sur le taux d''échec
    ≤ 0,5 % avec avoirs. Ce dixième de point vaut **275 940 € de GMV échoué par an** — le poste le plus
    lourd du dossier, aujourd''hui garanti par rien. *(achats + juridique)*

    3. Gel du calendrier ci-dessus, runbook de bascule arrière armé et testé. *(DSI/paiements)*

    4. Le responsable supervision paiement reçoit un **droit d''arrêt formel et opposable** de la rampe,
    et une rotation d''astreinte financée sur l''économie. Dix semaines de double run se paient en charge
    d''équipe : on la finance au lieu de l''absorber.

    5. Règle écrite : **aucun jeton supprimé, aucun compte fermé** avant le 30 novembre et avant un Black
    Friday à 100 % sous 0,6 %. Contresignée DSI. *(dir. opérations)*


    ## Ce qui me ferait changer d''avis


    Si au **13 octobre** le palier 25 % affiche ≤ 0,45 % d''échec et une latence à parité, la courbe du
    pilote ne nous concerne pas : on comprime, 100 % le 20 octobre, et on n''achète pas décembre. À l''inverse,
    si au 13 octobre nous sommes encore au-dessus de 0,8 % à 25 %, **la bascule ne se fait pas en 2026**
    : prolongation Solda décembre-février, rampe reprise le 20 décembre au plus tard.


    Ce dernier point commande l''urgence. Solda a écrit que la prolongation **ne va pas au-delà du 28
    février**. Une rampe de 10 semaines doit donc démarrer le 20 décembre au plus tard, et il n''existe
    aucune fenêtre 2027. Reporter la décision de six semaines ne réduit pas le risque : cela supprime
    le repli.


    ## Le meilleur argument contre cette note


    Sur la seule espérance de perte de rampe, B ne se justifie pas : la rampe de A coûte 142 884 € de
    GMV échoué, celle de B 21 433 € — **121 451 € d''écart, moins que le double run**. B ne s''achète
    pas sur l''espérance ; il s''achète sur la branche irrécupérable. C''est précisément pourquoi je recommande
    la version avancée plutôt que celle du dossier : elle ramène la prime de 190 000 € à 112 500 € en
    utilisant un contrat déjà payé.


    ---


    *Hypothèses à valider avant vendredi : double run à 45 000 €/mois supposé indépendant du palier de
    trafic ; Black Friday estimé à 3× le volume moyen ; taux de récupération des paiements échoués par
    relance non fourni par le dossier — il conditionne la conversion du GMV échoué en chiffre d''affaires
    réellement perdu.*


    ---


    Deux remarques hors note, pour vous :


    **La décision réelle n''est pas A ou B, c''est la date de démarrage.** Les deux options du dossier
    démarrent le 3 novembre, ce qui gaspille les dix semaines de contrat Solda déjà payées et pousse la
    queue de migration dans les mois à 130 000 €. Avancer la rampe de sept semaines fait presque tout
    le travail : le pic devient réversible en 15 minutes et la prime de risque tombe de 190 k€ à 112 k€.
    Si le comité ne retient qu''une chose, c''est celle-là.


    **Deux points où le dossier est muet et qui pèsent plus que l''écart A/B :** l''écart de taux d''échec
    en régime permanent (0,5 % vs 0,4 % = 275 940 €/an de GMV échoué, soit plus de la moitié de l''économie
    annoncée, sans aucune garantie contractuelle), et le taux de récupération des paiements échoués par
    relance. Sans ce second chiffre, toutes les pertes ci-dessus sont exprimées en GMV échoué, pas en
    chiffre d''affaires perdu — je l''ai signalé en bas de note plutôt que de choisir une hypothèse à
    votre place. La finance devrait pouvoir le sortir de l''historique Solda d''ici vendredi.

    '
