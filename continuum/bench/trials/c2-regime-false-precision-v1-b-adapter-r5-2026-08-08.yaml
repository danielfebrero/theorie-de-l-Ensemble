response:
  text: '# Note au comité — fermetures envisagées et objectif de 300 000 €

    **8 août 2026 — 2 pages**


    ---


    ## Recommandation


    **Ne pas arrêter de liste de fermetures mardi.** Les trois magasins dits « en perte » rapportent en
    réalité de l''argent : les fermer tous les trois dégraderait le résultat de **114 000 € par an** et
    coûterait **1,1 M€ de trésorerie**. Les 300 000 € demandés existent, mais ils sont dans les 6,4 M€
    de frais de siège et de logistique — pas dans les magasins.


    ---


    ## 1. Ce que le mot « perte » recouvre ici


    Chaque magasin porte une part des 6,4 M€ de frais de siège et de logistique, répartie selon son chiffre
    d''affaires. **Cette part est un partage de facture, pas une dépense du magasin.** Elle ne disparaît
    pas si le magasin ferme : elle se reporte sur les autres.


    | | Résultat affiché | Part du siège incluse | Ce que le magasin rapporte réellement |

    |---|---:|---:|---:|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |

    | **Total** | **−288 000 €** | **402 000 €** | **+114 000 €** |


    Sur ses propres loyers, salaires et charges — connus ligne à ligne — chacun des trois encaisse plus
    qu''il ne dépense. Fermer les trois, c''est perdre ces 114 000 € et laisser les 402 000 € de frais
    de siège aux 16 magasins restants. L''écart avec l''objectif ne serait pas de 300 000 €, mais de 414
    000 €.


    **L''effet cliquet.** Après ces fermetures, les 6,4 M€ se répartissent sur 16 magasins : la quote-part
    de chaque survivant augmente d''environ **7 %**. Plusieurs magasins aujourd''hui légèrement bénéficiaires
    basculeront dans le rouge. Le même comité se tiendra l''an prochain, avec une nouvelle liste.


    ---


    ## 2. Chambéry et Nîmes : dossiers à fermer, pas magasins à fermer


    **Chambéry — écarté définitivement.** Six ans de bail sans clause de sortie, 1,1 M€ d''indemnité.
    On paierait 1,1 M€ pour supprimer 32 000 € de contribution annuelle. Le magasin le plus proche est
    à 92 km : le chiffre d''affaires ne se reporterait pas, il disparaîtrait. Aucune version de ce calcul
    ne fonctionne.


    **Nîmes — écarté ; les murs sont un sujet séparé.** Le magasin contribue +19 000 €. Les murs valent
    1,9 M€ : c''est un actif, pas un résultat. Les vendre rapporte de la trésorerie **une fois** ; en
    cession-bail, on encaisse 1,9 M€ et on crée un loyer qui **dégrade** le résultat chaque année suivante.
    Si l''actionnaire veut du résultat récurrent, l''immobilier est le mauvais outil. Si la demande réelle
    est de la trésorerie, il faut le dire — le dossier change alors entièrement.


    ---


    ## 3. Vitry : le seul cas ouvert, et le chiffre qui manque


    C''est le seul site dont on peut sortir sans rien payer (bail échu dans 7 mois). Deux éléments absents
    de l''analyse actuelle :


    - **18 % des entrées de Vitry sont des retraits de commandes web.** Vitry supporte la surface et le
    personnel d''un chiffre d''affaires enregistré sur l''entité e-commerce. Son résultat est mécaniquement
    sous-estimé — et sa fermeture déplacerait ces retraits vers la livraison à domicile ou vers le magasin
    à 14 km, un coût que personne n''a chiffré.

    - **Le report est plausible ici** : 14 km seulement, et 41 % des porteurs de carte achètent déjà dans
    au moins deux magasins.


    **Le chiffre qui tranche, et que nous n''avons pas encore :** quelle part de la marge de Vitry doit
    se reporter sur le magasin voisin pour compenser les 63 000 € perdus. Le seuil est simplement 63 000
    € rapportés à la marge annuelle de Vitry. Ce seuil est probablement faible — quelques pour cent —
    ce qui rendrait la fermeture défendable. Mais il doit être **calculé, pas supposé**. La comptabilité
    dispose de toutes les lignes nécessaires ; c''est deux jours de travail.


    ---


    ## 4. Le calendrier interdit d''atteindre 300 000 € par fermeture


    430 salariés, environ 23 par magasin. Une fermeture entraîne plus de dix licenciements dans une entreprise
    de plus de 50 salariés : plan de sauvegarde de l''emploi obligatoire, consultation du CSE, recherche
    de reclassement. Comptez **4 à 8 mois** entre la décision et la fermeture effective, avec les coûts
    (indemnités, reclassement, accompagnement) concentrés sur l''exercice prochain — précisément celui
    où les 300 000 € sont attendus. Une fermeture votée mardi **dégrade** l''an prochain avant d''améliorer,
    au mieux, l''année suivante.


    S''y ajoute que l''enseigne n''a jamais fermé de magasin : ni la procédure, ni notre taux de report
    réel ne sont connus en interne. Une première fermeture coûte toujours plus que prévu.


    ---


    ## 5. D''où viennent réellement les 300 000 €


    300 000 €, c''est **4,7 % des 6,4 M€** de frais de siège et de logistique. C''est le seul gisement
    de cette taille qui ne détruit pas de chiffre d''affaires. Trois chantiers, à mener en parallèle :


    1. **Les 6,4 M€ eux-mêmes.** Ces frais ont toujours été répartis, jamais examinés. 4,7 % est un objectif
    modeste sur un poste jamais audité.

    2. **La refacturation e-commerce.** Les magasins financent aujourd''hui le retrait des commandes web
    sans en porter le chiffre d''affaires. Soyons clairs : c''est un transfert entre entités du groupe,
    **cela ne crée pas de résultat consolidé**. Son intérêt est de révéler quels magasins sont réellement
    en difficulté.

    3. **Les 16 magasins « bénéficiaires ».** Les trois sites en rouge sont les trois plus petits, pas
    les trois moins bien tenus. Un magasin à +60 000 € dont le loyer dépasse le marché de 20 % représente
    plus de gisement que Nîmes. Il nous faut l''échéancier des baux des 19 sites.


    ---


    ## 6. L''objection la plus solide à cette note


    On peut me répondre : *« votre calcul suppose que les frais de siège sont entièrement fixes ; s''ils
    sont en partie variables, fermer des magasins en supprime une part, et vos +114 000 € s''effondrent.
    »* C''est exact, et c''est vérifiable. Il faut séparer, dans les 6,4 M€, ce qui varie avec le nombre
    de magasins (livraisons, animation réseau, maintenance) de ce qui n''en dépend pas (systèmes, direction,
    achats).


    **Condition d''arrêt explicite :** si la part réellement variable attribuable à ces trois sites dépassait
    114 000 €, la fermeture redeviendrait défendable — pour Vitry seul, Chambéry et Nîmes restant bloqués
    par l''indemnité et la distance. Ce test figure dans les travaux demandés ci-dessous.


    ---


    ## 7. Décisions demandées mardi — aucune n''est irréversible


    1. **Aucune liste de fermetures n''est arrêtée.** Chambéry et Nîmes sont écartés définitivement, motifs
    au dossier (1,1 M€ d''indemnité et 92 km ; actif immobilier détenu).

    2. **Ouverture d''un dossier Vitry avec date butoir** : la date de préavis du bail, à confirmer sous
    48 heures. D''ici là, trois calculs : marge commerciale de Vitry hors retraits web ; part variable
    des 6,4 M€ ; coût de bascule des retraits web.

    3. **Lancement du chantier 300 000 €** sur les frais de siège et les baux, point d''étape à six semaines.


    ---


    ## Point de vigilance sur les données


    Les compteurs d''entrée comptent des **entrées, pas des acheteurs**, à ±2 % près. Ils ne disent rien
    de la valeur d''un client. Ils ne doivent servir d''argument à aucun moment mardi.


    La fermeture de Nîmes pendant cinq semaines en mars 2024 est notre **seule observation réelle** d''un
    report de clientèle. Mais nous n''avons conservé que les totaux mensuels des magasins voisins, sur
    une période qui ne coïncide pas avec les mois calendaires, en sortie d''hiver et après un sinistre
    médiatisé. Elle donne un ordre de grandeur, pas une preuve. Nous l''utiliserons pour contrôler le
    calcul Vitry, jamais pour le fonder.


    ---


    Si vous voulez, je peux vous en sortir un fichier (Markdown, ou une page mise en forme prête à distribuer
    au comité).

    '
