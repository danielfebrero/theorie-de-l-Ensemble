response:
  text: '# NOTE AU COMITÉ DE DIRECTION

    **Objet : fermetures de magasins — ce que nous proposons de décider mardi**


    ---


    ## En une phrase


    Aucune combinaison de fermetures ne produit 300 000 €. Nous proposons de fermer **Vitry** (seule sortie
    gratuite, et seule échéance qui court), de **clore définitivement le dossier Chambéry**, et de **ne
    pas décider Nîmes mardi** — mais d''ouvrir le seul dossier qui contient réellement les 300 000 €.


    ---


    ## 1. La fermeture des trois magasins dégrade le résultat


    Même en prenant les chiffres au pied de la lettre : 118 + 96 + 74 = **288 000 €**. La cible n''est
    pas atteinte, même dans le monde où fermer un magasin fait disparaître sa perte.


    Or ce n''est pas ce monde-là. Le résultat par magasin inclut une quote-part des 6,4 M€ de frais de
    siège et de logistique, répartie au prorata du chiffre d''affaires. Retirons-la :


    | | Résultat comptable | Quote-part siège | **Ce que le magasin rapporte réellement** |

    |---|---|---|---|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |


    **Les trois magasins déficitaires sont bénéficiaires.** Ils couvrent leurs loyers, leurs salaires,
    leurs charges — et contribuent en plus 114 000 € aux frais du siège.


    Fermer Vitry ne supprime pas 181 000 € de frais de siège : cela les déplace sur les 18 magasins restants.
    Fermer les trois retire 114 000 € au groupe et fait basculer d''autres magasins dans le rouge comptable,
    mécaniquement, sans qu''aucun n''ait vendu un article de moins.


    La comptabilité est certifiée à l''euro près. La certification porte sur l''arithmétique, pas sur
    la convention de répartition. Un chiffre peut être exact et sans rapport avec la décision.


    **Question à la DAF, à traiter en premier :** quelle part des 6,4 M€ disparaît réellement quand un
    magasin ferme ? Personne ne l''a chiffrée. Tant qu''elle ne l''est pas, aucune fermeture ne peut être
    justifiée par le résultat comptable.


    ---


    ## 2. Ce que sont réellement les trois magasins


    **Vitry — +63 000 €, et une échéance.** 18 % de ses entrées sont des retraits de commandes web : Vitry
    paie le personnel, le loyer et l''électricité pour servir des clients dont le chiffre d''affaires
    est enregistré sur l''entité e-commerce. Sa performance commerciale réelle est meilleure que ce que
    montrent les comptes. C''est pourtant le seul dossier où sortir ne coûte rien — bail échu dans 7 mois,
    sans indemnité — et le seul où le temps décide à notre place : **si nous ne dénonçons pas le bail,
    il se renouvelle.** Ne pas trancher mardi, c''est trancher pour neuf ans.


    **Chambéry — dossier clos.** Rompre le bail coûte 1,1 M€ pour retirer un magasin qui rapporte 32 000
    € par an. Il n''y a pas de retour sur investissement : on paie 1,1 M€ **et** on perd 32 000 € par
    an. Le magasin le plus proche est à 92 km : nous ne perdrions pas un magasin, nous perdrions les clients.
    Nous proposons de l''annoncer explicitement mardi — l''enseigne n''a jamais fermé un magasin, la rumeur
    circule déjà, et une décision de maintien est une décision.


    **Nîmes — le seul dossier où fermer crée un revenu.** +19 000 €, mais le magasin occupe un immeuble
    que nous possédons, valorisé 1,9 M€. **Vérification à faire :** les comptes analytiques imputent-ils
    un coût d''occupation à Nîmes ? Si la réponse est non, ses +19 000 € sont mesurés avec un bâtiment
    gratuit. Au rendement usuel du commerce de périphérie — 6 à 7 %, hypothèse à confirmer par deux agences
    — l''immeuble louerait 110 000 à 140 000 € par an. Correctement mesuré, Nîmes détruirait alors de
    l''ordre de 100 000 € par an, et le fermer produirait un revenu **récurrent**, pas une plus-value
    ponctuelle. C''est aussi le seul dossier sans bailleur, sans indemnité et sans date limite : il peut
    donc attendre trois semaines de plus et être décidé correctement.


    ---


    ## 3. Les trois motions de mardi


    **Motion 1 — Chambéry maintenu.** Définitivement, et communiqué comme tel.


    **Motion 2 — Vitry : mandat de dénonciation du bail, sous condition d''un calcul rendu sous quinze
    jours.** Fermer Vitry coûte 63 000 € de contribution ; le magasin situé à 14 km récupère une part
    des ventes sans un euro de charge fixe supplémentaire. Le seuil est : *63 000 € ÷ (CA de Vitry × taux
    de marge du magasin receveur)*. Les deux chiffres sont déjà dans le système. **Si le taux de transfert
    nécessaire est inférieur à 15 %, on ferme** — 14 km de distance et 41 % de nos porteurs de carte achetant
    déjà dans deux magasins nous placent nettement au-dessus. **S''il dépasse 25 %, on garde.** Entre
    les deux, on tranche sur la mesure de Nîmes (ci-dessous). Le juridique confirme mardi la date butoir
    de dénonciation.


    **Motion 3 — Nîmes : aucune décision de fermeture, trois travaux commandés,** décision au comité de
    septembre : (a) coût d''occupation réel de l''immeuble dans les comptes ; (b) valeur locative et vénale
    confirmées par deux agences ; (c) **taux de transfert mesuré sur la fermeture de mars 2024** — cinq
    semaines, 23 km, l''expérience que nous avons déjà payée. Limite à assumer : seuls les totaux mensuels
    des voisins ont été conservés, et cinq semaines chevauchent deux mois. Cela donnera un ordre de grandeur
    — transfert de 20 % ou de 60 % — pas une décimale. C''est suffisant pour décider.


    ---


    ## 4. Où sont réellement les 300 000 €


    Dans les 6,4 M€ de siège et de logistique. **300 000 €, c''est 4,7 % de cette ligne.** C''est le seul
    gisement qui atteint le montant demandé, dans l''exercice demandé, sans toucher un poste en magasin
    — et c''est le dossier que personne n''a ouvert, parce que la comptabilité analytique le rend invisible
    en le diluant sur 19 magasins.


    Second levier : **refacturer à l''entité e-commerce le service de retrait**. Au niveau du groupe,
    cela ne crée pas un euro — cela déplace de la marge d''une entité à l''autre, disons-le clairement
    à l''actionnaire. Mais cela nous empêche de fermer des magasins rentables à cause d''une convention
    d''enregistrement. Vitry en est la démonstration.


    Troisième levier : les 1,9 M€ de Nîmes, s''ils sont libérés.


    ---


    ## 5. Ce qui nous ferait changer d''avis, et où nous arrêtons


    **L''observation qui renverse cette note :** si la DAF établit qu''une fermeture supprime réellement
    plus de 120 000 € de frais de siège et de logistique — une suppression, pas une redistribution — alors
    le calcul du §1 s''effondre et les trois fermetures redeviennent défendables. Ce chiffre n''existe
    pas aujourd''hui. Nous le demandons en premier point.


    **Le repli, engagé maintenant :** si le bail de Vitry est dénoncé et qu''à trois mois de la fermeture
    le trafic du magasin receveur n''a pas progressé d''au moins 10 % (les compteurs sont calibrés à ±2
    % et enregistrent à la demi-heure — la mesure est fiable, à condition de retirer les retraits web
    des deux côtés), nous arrêtons le programme : pas de seconde fermeture, et la décision Nîmes est reportée
    d''un an. Nous engageons ce déclencheur maintenant, pendant qu''il est encore inconfortable.


    ---


    ## 6. Le contre-argument, et pourquoi nous ne le suivons pas


    *« C''est la note qu''écrit une entreprise qui n''a jamais fermé de magasin pour éviter d''en fermer
    un. »* L''objection est juste et il faut la poser au comité.


    La réponse : cette note **ferme** — Vitry, précisément parce que l''échéance ne laisse pas le choix
    — et elle **clôt** Chambéry, ce qui est aussi une décision. Ce qu''elle refuse, c''est de fermer trois
    magasins sur un chiffre qui mesure une convention plutôt qu''un coût. Une première fermeture fait
    jurisprudence interne : elle sera citée pendant dix ans. Mieux vaut qu''elle tienne debout.


    ---


    ## 7. Ce qu''on engage


    **D''ici mardi :** DAF — part des 6,4 M€ réellement variable avec le nombre de magasins. Contrôle
    de gestion — seuil de transfert de Vitry. Juridique — date butoir exacte de dénonciation.


    **Si Vitry est décidé :** annonce à 7 mois, pas à 7 semaines. Offre de reclassement à 14 km pour chaque
    salarié, avec indemnité de transport ; priorité sur les postes vacants du réseau pendant 18 mois ;
    **deux représentants du personnel dans le groupe de travail, avec voix sur le calendrier et sur la
    carte de reclassement** — un siège, pas une consultation.


    **À provisionner :** une première fermeture coûte en année 1 (indemnités, accompagnement, stock non
    écoulé). Ce coût doit figurer dans le chiffre remis à l''actionnaire, faute de quoi les 300 000 €
    de l''exercice prochain seront annoncés deux fois.


    **Ce que nous disons à l''actionnaire :** les 300 000 € sont atteignables l''an prochain. Ils ne sont
    pas dans les magasins déficitaires — ceux-là rapportent de l''argent. Ils sont dans les 6,4 M€ que
    nous n''avons jamais examinés.

    '
