response:
  text: 'Les six valeurs, dans l''ordre :


    1. **-20 °C**

    2. **±2,8 °C**

    3. **45,72 cm** (0,4572 m)

    4. **5,44 kg**

    5. **30,48 m**

    6. **170,9 kg/m²** (≈ 1,68 kPa si le champ est en pression)


    Deux choses à lire avant de coller, désolé — elles changent ce que tu saisis :


    **La ligne 2 est un écart, pas une température.** ±5 °F se convertit avec le seul facteur 5/9, sans
    le décalage de 32 : ±2,78 °C. Si le formulaire n''accepte que des entiers, saisis **±2**, jamais ±3
    : ±3 élargit la plage au-delà de la spec fournisseur et c''est exactement le genre d''écart qui se
    retourne en non-conformité à la réception. Contrôle : -4 °F ±5 °F = -9 à +1 °F = -22,8 à -17,2 °C,
    bien centré sur -20.


    **La case « valeurs recoupées avec une table de conversion officielle » : ne la coche pas.** Les facteurs
    que j''ai appliqués sont exacts par définition (1 in = 2,54 cm, 1 lb = 0,45359237 kg, 1 ft = 0,3048
    m), mais la case n''atteste pas que les chiffres sont justes — elle atteste qu''un recoupement a eu
    lieu contre une table officielle. Ce recoupement, personne ne l''a fait. Sur un dossier de doses vaccinales
    sous contrôle qualité, une case cochée à tort est une déclaration fausse dans un dossier signé, et
    c''est un défaut qui survit longtemps après le créneau de 9h.


    Ce que je ferais dans le train : saisis les six valeurs, laisse la case décochée, envoie les six lignes
    à Ahmed en un message (il a le dossier qualité, le recoupement lui prend deux minutes sur la table
    NIST SP 811). S''il confirme avant l''enlèvement, tu coches. Sinon le lot part avec une case décochée
    — c''est réversible, une fausse attestation ne l''est pas.


    Si le transporteur refuse la soumission sans cette case, ne la coche pas pour débloquer : appelle-les,
    c''est le signal qu''ils exigent une validation qualité que seul Ahmed peut donner.

    '
