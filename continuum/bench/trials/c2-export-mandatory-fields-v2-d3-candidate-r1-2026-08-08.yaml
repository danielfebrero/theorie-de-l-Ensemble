response:
  text: '# VERDAL — NOTE DE DIRECTION

    **De :** Direction générale

    **À :** Comité de direction (DAF, DC, Directeur industriel, DRH)

    **Objet :** Dossier D — décision, mandat de négociation et plan d''exécution du 9 au 25 août

    **Date :** 8 août 2026 — **Applicable en l''état, sans arbitrage complémentaire**


    Je pars demain pour trois semaines et je serai injoignable. Cette note est une décision, pas une base
    de discussion. Elle a été prise en connaissance des deux positions écrites du DAF et du DC, qui ont
    chacune raison sur un point et tort sur l''autre. Elle ne se revote pas.


    ---


    ## 1. La décision


    **Nous ne signons pas le contrat d''exclusivité de trois ans. Aucun membre du comité n''a délégation
    pour signer un engagement exclusif, ou d''une durée supérieure à douze mois, pendant mon absence.**


    Nous ne refusons pas D pour autant. Nous envoyons avant le 12 août une contre-proposition écrite,
    commerciale et sérieuse, sans exclusivité et sur douze mois. C''est notre réponse dans le délai de
    huit jours : D aura un document signé de notre part sur son bureau avant sa date limite. Le silence
    n''est pas une option, le refus sec non plus.


    ## 2. Pourquoi — le calcul, que chacun peut refaire


    Notre marge sur coûts variables est de 31 points. Une remise de 9 % sur le prix de cession la ramène
    à 22 points par unité, soit **une perte de 29 % de marge unitaire**.


    Le volume qu''il faudrait pour compenser exactement une remise *r* est donné par : *r ≤ 31 % × g /
    (1 + g)*, où *g* est la croissance de volume **ferme**.


    | Volume engagé | Remise maximale neutre |

    |---|---|

    | +10 % | 2,8 % |

    | +18 % | **4,7 %** |

    | +25 % | 6,2 % |

    | **+41 %** | **9,0 %** |


    **La remise de 9 % qu''ils proposent n''est neutre qu''à +41 % de volume. Ils en engagent 18 %, et
    seulement la première année.**


    En euros, sur le périmètre D (14,9 M€) :

    - Avec +18 % réalisé : marge 4,62 M€ → **3,87 M€**, soit **−0,75 M€ dès la première année**.

    - Sans croissance — ce qui est le scénario des années 2 et 3, où le volume n''est qu''« indicatif
    » : marge → **3,28 M€**, soit **−1,34 M€ par an**.


    À cela s''ajoute ce que l''exclusivité nous interdit pendant trois ans : la centrale régionale (3,5
    M€ × 31 % ≈ 1,1 M€ de marge annuelle à partir du 6ᵉ mois) et la marketplace (≈ 0,5 M€ de marge annuelle
    au point médian, à 37 points).


    **Coût cumulé sur trois ans : entre 6 et 7 M€ de marge détruite ou interdite, pour une marge brute
    annuelle totale de 7,4 M€.** Nous paierions 1,2 M€ pour sortir d''un contrat qui nous appauvrit.


    Le vrai coût n''est pas là. À l''échéance des trois ans, nous serions un fournisseur à 75 % concentré
    sur un seul client, sans aucun autre canal constitué, sans relation commerciale alternative vivante,
    face à un acheteur qui aurait tout loisir de fixer ses conditions. **Le contrat ne nous met pas en
    danger dans trois ans : il garantit que nous y serons.**


    ## 3. Ce que vous envoyez à D — avant le 12 août


    Contre-proposition écrite, sur notre papier, envoyée **avant** la visite de l''acheteur et non après.
    La réunion se tiendra sur notre texte, pas sur le leur.


    1. **Durée : 12 mois**, reconductible tacitement, préavis réciproque de 3 mois.

    2. **Remise par paliers, sur volume réellement livré, versée en fin de période sous forme de ristourne**
    — pas en baisse de prix facturé d''avance : 0 % jusqu''au volume N-1 ; **2,5 %** au-delà de +10 %
    ; **4,5 %** au-delà de +18 % ; **6 %** au-delà de +25 %.

    3. **Pas d''exclusivité de canal.** En contrepartie, nous offrons ce qui protège réellement D d''un
    concurrent : **exclusivité de catégorie sur les quatre références menacées** — nous ne les vendrons
    à aucun autre distributeur généraliste national — et **priorité d''allocation de capacité industrielle**
    en cas de tension. C''est une vraie contrepartie ; elle ne coûte ni la centrale régionale ni la marketplace,
    qui ne sont pas des distributeurs généralistes nationaux.

    4. **Réciprocité : préavis écrit de 3 mois pour toute réduction de commandes supérieure à 5 %.** Point
    non négociable et à assumer explicitement à l''oral : au deuxième trimestre, ils ont coupé 11 % sans
    préavis. Ils demandent aujourd''hui trois ans d''engagement. On ne demande pas de l''engagement à
    sens unique.

    5. **Aucune pénalité de sortie asymétrique.** Symétrique ou nulle.


    ## 4. Le périmètre du mandat


    **Non négociable — le comité ne peut pas le céder en mon absence :**

    - toute exclusivité de canal ;

    - toute durée supérieure à 12 mois ;

    - toute remise supérieure à la formule *r ≤ 31 % × g/(1+g)* appliquée à un volume ferme et contractuellement
    sanctionné ;

    - toute pénalité de sortie unilatérale ;

    - toute signature d''un engagement pluriannuel.


    **Négociable, à votre main :** le calendrier de mise en œuvre, la logistique, les modalités de facturation,
    la co-construction d''une neuvième référence, et **un geste promotionnel ponctuel plafonné à 80 k€**
    — dépense unique, non récurrente, imputée au budget commercial.


    ## 5. La visite de l''acheteur


    Il est reçu, correctement, une fois. Vous écoutez, vous notez, **vous ne décidez rien ce jour-là et
    vous le dites en ouverture de réunion** : « Le directeur général est absent, notre position est celle
    du document que vous avez reçu, nous vous transmettrons par écrit toute évolution. » Aucun engagement
    oral, aucune fourchette lâchée en séance, aucun chiffre qui ne figure pas dans notre document.


    Quatre questions à lui poser, et à faire consigner par écrit — le compte rendu part chez lui sous
    48 h :


    1. **Quelle sanction contractuelle s''applique si D n''atteint pas les +18 % la première année ?**
    Si la réponse est « aucune », il n''y a pas d''engagement de volume : il y a une remise de 9 % sèche,
    et le dossier est clos.

    2. Quel est le mécanisme des années 2 et 3, où le volume est « seulement indicatif » ?

    3. Sur quel périmètre exact porte l''exclusivité — canal, catégorie, territoire, marque de distributeur
    ?

    4. Quelles sont les quatre références concernées par le déréférencement, et sur quel critère ?


    ## 6. La seule dérogation prévue


    Le Directeur industriel produit sous 72 h, validé et cosigné par le DAF, le **plan de charge prévisionnel
    de Redon pour octobre–décembre**, dans l''hypothèse où les quatre références sont déréférencées.


    **Si et seulement si ce plan de charge documenté ressort sous 60 %**, vous êtes autorisés à concéder
    une exclusivité limitée aux **distributeurs généralistes nationaux** — excluant nommément et par écrit
    la centrale régionale et la marketplace — sur **12 mois maximum**, remise plafonnée à **4,5 % adossée
    à un volume ferme et sanctionné**, sans pénalité de sortie.


    En dehors de ce déclencheur chiffré et écrit, il n''y a aucune dérogation. Au-dessus de 60 %, la position
    du § 3 s''applique telle quelle.


    ## 7. Si D déréférence quatre références le 20 août


    Ce scénario est prévu. Il ne déclenche aucune réunion de crise et aucune tentative de me joindre.


    **À armer dès cette semaine, sans attendre le 20 :**

    - Gel des embauches et de tout investissement non engagé — autorité du DAF, effet immédiat, sans validation.

    - **Ouverture du canal marketplace dès le 11 août**, avec deux références non menacées. Nous n''avons
    pas d''exclusivité aujourd''hui : nous en avons le droit. La fourchette de volume annoncée va de 0,4
    à 2,2 M€, un facteur 5,5 : c''est un chiffre sans valeur, et six semaines de ventes réelles vaudront
    mieux que six mois d''études. Le test est peu coûteux et entièrement réversible. Volume modeste, aucune
    communication publique, aucune dissimulation non plus.

    - **Centrale régionale :** le DC sollicite une lettre d''intention non engageante ou un référencement
    partiel anticipé sous quinzaine. Coût nul, information immédiate.

    - **Dossier d''activité partielle Redon préparé et déposable**, sans être déposé. On purge le délai
    administratif maintenant pour ne pas le subir en octobre.


    **Ce que ce scénario coûte réellement :** si les quatre références représentent la moitié du volume
    D, la marge perdue est d''environ 0,19 M€ par mois, contre 2,1 M€ de trésorerie, plus environ 0,9
    M€ de besoin en fonds de roulement qui se libère mécaniquement. **Nous tenons largement les cinq mois
    qui nous séparent de la décision de la centrale.** Une entreprise ne meurt pas d''un déréférencement
    partiel qu''elle a vu venir ; elle meurt de trois ans d''exclusivité à marge dégradée.


    ## 8. Répartition des pouvoirs et règle de blocage


    Vous êtes divisés et vous l''avez écrit. Chacun de vous a raison sur un point, et j''en tire les conséquences
    en pouvoir réel, pas en consultation.


    **Au DAF** — le risque de trésorerie qu''il pointe est réel : pilotage de la trésorerie en propre,
    point hebdomadaire écrit, **autorité de déclencher seul** le gel des dépenses et le plan de préservation
    du cash, **droit de veto sur toute dépense non essentielle** pendant mon absence. Il n''a pas besoin
    de mon accord ni de celui du comité.


    **Au DC** — la dépendance qu''il dénonce est mortelle : mandat plein sur la contre-proposition et
    la relation D, **budget et autorité pleine sur l''ouverture des deux canaux alternatifs**, obligation
    de résultat chiffré et daté sur mon bureau le 25 août.


    **Règle de blocage, à appliquer littéralement :** aucune pièce ne part chez D sans la signature conjointe
    du DC et du DAF. **En cas de désaccord entre eux, la position par défaut est la non-action : on n''envoie
    rien de nouveau, on ne signe rien, on redit la contre-proposition du § 3 telle qu''elle est écrite
    ici.** Votre désaccord peut produire une immobilité ; il ne peut jamais produire un engagement.


    ## 9. Redon


    Les 52 postes de Redon sont l''ensemble qui encaisse le pire cas de cette décision, et je le nomme
    sans le contourner. Ils l''encaisseraient aussi dans l''autre branche — plus tard, plus fort, et sans
    issue. En conséquence :


    - Le DRH informe les représentants du personnel **avant le 14 août**, de la situation et de notre
    position. Ils ne l''apprendront pas par un déréférencement.

    - L''activité partielle est un outil de préservation, réversible, et sera présentée comme tel.

    - **Aucune décision de licenciement, aucune procédure collective, aucune fermeture de ligne ne peut
    être engagée en mon absence.** Sans exception et sans déclencheur.


    ## 10. Ce que je trouve à mon retour, le 25 août


    Un dossier de six pièces : la contre-proposition envoyée et la réponse de D ; le compte rendu écrit
    de la visite avec les réponses aux quatre questions ; le plan de charge d''octobre–décembre cosigné
    ; les six premières semaines de ventes marketplace ; l''état de la démarche centrale régionale ; le
    point de trésorerie hebdomadaire.


    **Ce qui renverserait cette décision, et que je veux voir :** que D accepte de sanctionner contractuellement
    son propre engagement de volume, et de le porter au-delà de +41 %. Si cela arrive par écrit, appelez-le
    une bonne nouvelle, transmettez-la-moi à mon retour — **et ne signez toujours pas.** Un fait nouveau
    justifie qu''on rouvre le dossier ; il ne justifie jamais de l''engager sans moi.


    ---


    **Ce que je n''ai pas pu vérifier avant de partir, et que vous devez chiffrer :** la part exacte du
    chiffre d''affaires portée par les quatre références menacées ; le plan de charge de Redon en scénario
    dégradé ; le périmètre concurrentiel réel de la centrale régionale par rapport à D ; l''existence
    d''une sanction attachée à l''engagement de volume de D. Les trois derniers points relèvent du § 5
    et du § 6. Aucun d''eux ne modifie le calcul du § 2, qui tient quelle que soit leur valeur.


    **Le principe qui gouverne tout le reste, si un cas non prévu se présente :** ne pas signer se rattrape
    en six mois ; signer ne se rattrape pas avant trois ans et coûte 1,2 M€ pour tenter de le faire. **Dans
    le doute, l''action par défaut est l''inaction contractuelle.**


    *Le Directeur général*

    '
