response:
  text: '# Avis sur le renouvellement du marché « réservation + bornes de prêt »


    *Comité de direction du 28 — lecture point par point. Chaque appréciation ci-dessous porte la mention
    de la pièce sur laquelle elle repose, et l''effet qu''aurait son retrait.*


    ---


    ## 1. Ce que le dossier établit


    **1.1 — Deux problèmes distincts sont traités comme un seul.**

    L''indisponibilité des bornes et la perte de réservations sont deux symptômes séparés, sur deux objets
    différents (matériel de prêt / module logiciel de réservation). Le dossier les additionne.

    *Repose sur :* export technique (heures de bornes) et enquête interne (réservations) — deux sources
    qui ne mesurent pas la même chose.

    *Si le comité écarte ce point :* tout le reste de l''avis tombe, car il en découle.


    **1.2 — L''indisponibilité des bornes est un signal de vétusté, pas de logiciel.**

    32 h sur 41 h se concentrent sur les deux seuls sites équipés en 2015, soit environ 16 h par site
    et par an contre 1,8 h sur les cinq autres — un facteur 9. Le partage suit exactement la génération
    de matériel.

    *Repose sur :* export technique.

    *Si écarté :* il faudrait une autre explication au fait que la panne épouse la ligne de partage du
    parc.


    **1.3 — Le coût opérationnel le plus lourd du dossier n''est pas celui dont on débat.**

    La ressaisie manuelle de Rive-Sud représente environ 230 h par an, soit cinq à six fois le total des
    heures de bornes indisponibles sur l''ensemble du réseau. Elle porte sur un seul site.

    *Repose sur :* note de site Rive-Sud (5 h/semaine depuis mars), rapprochée de l''export technique.

    *Si écarté :* la hiérarchie des urgences change, mais pas la conclusion sur la signature.


    **1.4 — L''échéance commerciale n''est pas l''échéance du service.**

    La remise expire le 30 ; le contrat court jusqu''au 31 octobre. Il y a environ deux mois entre les
    deux. Aucune continuité de service ne dépend d''une décision prise le 28.

    *Repose sur :* dates du dossier (échéance contractuelle, offre commerciale).

    *Si écarté :* seul le calendrier de l''avis change ; le fond reste.


    **1.5 — Le gain de la remise n''est pas chiffrable en l''état.**

    Sur trois ans à 48 000 € indexés à 7 %, le marché représente environ 154 000 €. Si les 12 % portent
    sur les trois années, l''économie est d''environ 18 500 € ; s''ils ne portent que sur la première,
    d''environ 5 800 €. Le dossier ne le précise pas. Dans l''hypothèse basse, la remise vaut moins d''un
    cinquième de la migration v4.

    *Repose sur :* volet financier ; l''assiette de la remise n''y figure pas.

    *Si écarté :* il resterait à dire pourquoi on renonce à connaître le prix de ce qu''on signe.


    ---


    ## 2. Ce que le dossier n''établit pas


    **2.1 — La causalité attribuée à la mise à jour de mars n''est pas démontrée.**

    Février a vu deux changements sur Rive-Sud : remplacement du lien fibre et changement de version du
    portail usagers. Ce sont deux causes candidates au moins aussi bien placées chronologiquement que
    mars. Le dossier ne comporte aucune pièce permettant de les départager.

    *Repose sur :* le point « février » du dossier, absent de la note de cadrage.


    **2.2 — L''enquête interne mesure une perception, pas une cause ni une ampleur.**

    43 réponses sur 62, non aléatoires : les sites qui souffrent répondent davantage. 61 % de 43 représentent
    26 agents, soit 42 % du réseau. Sur ces répondants, 12 seulement datent le début après mars — moins
    de la moitié de ceux qui signalent des pertes. Et le questionnaire n''a pas proposé février comme
    date candidate : il ne pouvait donc pas la faire apparaître.

    *Repose sur :* les chiffres de l''enquête eux-mêmes.


    **2.3 — Le silence de Fontaine contredit la lecture « réseau ».**

    Fontaine a le même parc de 2015 et la même part d''indisponibilité que Rive-Sud, et ne signale aucune
    perte de réservation. Soit Fontaine n''est pas touché — et le problème n''est pas logiciel, il est
    local à Rive-Sud. Soit Fontaine est touché sans le déclarer — et l''enquête ne peut plus servir à
    mesurer quoi que ce soit. Les deux lectures interdisent de conclure à une défaillance générale du
    module.

    *Repose sur :* notes de sites, rapprochées de l''export technique.


    **2.4 — Le pic de réclamations est compatible avec plusieurs récits.**

    71 réclamations sur 96 entre mars et juin coïncident avec la mise à jour, mais aussi avec la période
    où les agents ont commencé à en parler, ce qui augmente mécaniquement le signalement. Une corrélation
    de fenêtre ne désigne pas une cause.


    **2.5 — La note de cadrage est un avis, non une pièce.**

    Elle affirme trois choses (mars est la cause, v4 corrige, il faut signer avant le 30) et n''en documente
    aucune. Elle a été lue par deux membres du comité avant la séance ; je propose qu''elle soit versée
    au dossier comme contribution, et non comme constat.


    **2.6 — La compatibilité de v4 avec les bornes de 2015 est « à l''étude ».**

    C''est-à-dire inconnue. Les 31 000 € porteraient donc sur une migration dont rien ne garantit qu''elle
    desserve les deux sites qui concentrent 78 % de l''indisponibilité.


    ---


    ## 3. Recommandation


    **Ne pas signer d''engagement de trois ans le 28. Demander à l''éditeur une prolongation courte ou
    une reconduction d''un an, et rendre la migration v4 conditionnelle à un engagement écrit de compatibilité
    avec les bornes de 2015.**


    Le critère qui l''emporte est la réversibilité, non le coût. Signer trois ans avant diagnostic verrouille
    environ 135 000 à 154 000 € sur une hypothèse causale qui n''est appuyée par aucune pièce, et y ajouterait
    31 000 € pour une compatibilité non garantie. Le gain certain de la remise est au mieux de 18 500
    €, au pire de 5 800 € ; il ne compense pas ce verrouillage.


    **Le passage au libre est écarté pour ce cycle** — non sur ses mérites, mais sur le calendrier de
    nos moyens : l''équipe informatique passe de deux à une personne en octobre. Le réseau voisin, à cinq
    sites, laisse deux sites sur registre papier quatorze mois après sa bascule. Conduire une migration
    de sept sites à un agent nous exposerait au même résultat, en pire. L''option reste ouverte pour le
    cycle suivant, à condition d''être instruite avec un plan de charge, ce que le dossier ne comporte
    pas.


    ---


    ## 4. Le meilleur argument contre cette recommandation


    *Si la mise à jour de mars est réellement la cause et si v4 la corrige,* alors attendre coûte un trimestre
    supplémentaire de réservations perdues, environ 60 h de ressaisie à Rive-Sud, et jusqu''à 18 500 €
    de remise. Et si l''éditeur refuse toute prolongation, le réseau se retrouve sans contrat au 1er novembre.


    **Ce que je réponds :** la demande de prolongation est la première action engagée et sa réponse sera
    connue en quelques jours, bien avant toute échéance réelle. Le coût de l''attente est borné et déjà
    absorbé ; celui d''un achat à l''aveugle ne l''est pas. Si l''éditeur refuse toute prolongation, c''est
    un fait nouveau : le dossier revient devant le comité avant le 31 octobre, avec pour repli une reconduction
    d''**un an**, et non de trois — ce qui préserve la continuité sans verrouiller le diagnostic.


    ---


    ## 5. Ce que j''engage dans les quinze jours


    Toutes ces actions tiennent avant la mi-septembre et laissent plus de six semaines avant l''échéance
    du 31 octobre.


    1. **Demander par écrit à l''éditeur**, sous cinq jours : les conditions d''une prolongation ou d''une
    reconduction d''un an ; l''assiette exacte de la remise de 12 % ; le journal de version de la mise
    à jour de mars ; l''état des tickets d''incident ouverts par le réseau sur douze mois ; **une déclaration
    écrite et datée de compatibilité de v4 avec les bornes de 2015**.

    2. **Extraire les journaux serveur du module de réservation**, par site et par semaine, sur douze
    mois. C''est la seule pièce qui départage les hypothèses, elle existe déjà et son obtention est à
    coût quasi nul.

    3. **Interroger Fontaine explicitement** sur les pertes de réservation. Sa réponse tranche entre les
    deux lectures du point 2.3.

    4. **Établir la chronologie de Rive-Sud** : date exacte du remplacement fibre, date de bascule du
    portail, date de la mise à jour, superposées à la courbe des réclamations.

    5. **Faire chiffrer séparément le remplacement des bornes de 2015**, hors marché logiciel. Un parc
    de onze ans n''a pas à être arbitré à l''intérieur d''un contrat applicatif.

    6. **Appeler le réseau voisin** pour savoir précisément pourquoi deux sites sur cinq tiennent encore
    un registre papier.

    7. **Rapport au comité à la mi-septembre**, avec proposition de décision ferme.


    ---


    ## 6. Ce qui renverserait cet avis, et à quelles conditions on s''arrête


    - **Observation qui renverse la recommandation :** des journaux serveur montrant des pertes de réservation
    réparties sur au moins quatre sites indépendamment de la génération de bornes, avec une rupture nette
    à la date de mars et aucune en février. Dans ce cas, l''hypothèse logicielle devient la bonne, v4
    devient prioritaire, et je recommanderai de signer — sous garantie écrite de compatibilité.

    - **Si les pertes se révèlent concentrées sur Rive-Sud seul :** le problème est local (lien, portail,
    configuration). Ni v4 ni le libre ne le corrigent. On répare le site et on reconduit à l''identique.

    - **Déclencheur d''arrêt de la piste v4 :** absence de déclaration écrite de compatibilité au 12 septembre.
    Les 31 000 € ne sont pas engagés.

    - **Déclencheur de retour au comité :** refus de toute prolongation par l''éditeur. Repli : reconduction
    d''un an.

    - **Pire cas de l''option recommandée :** perte de la remise, soit entre 5 800 € et 18 500 € sur trois
    ans. Il est supporté par le budget du réseau, il est chiffré, et il est réversible. Le pire cas des
    deux autres options — trois ans verrouillés sur un diagnostic faux, ou sept sites en dégradation avec
    un seul informaticien — est supporté par les agents et par les usagers, et ne l''est pas.

    '
