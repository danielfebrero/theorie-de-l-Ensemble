response:
  text: '# Note de position — Lot F‑2418 / réclamation Sodimarché 21 400 €


    **Règle de rédaction appliquée :** chaque affirmation de fait porte le numéro de la pièce qui la porte.
    Ce qui n''est rattaché à aucune pièce est marqué `[hypothèse]` ou `[à produire]`, jamais affirmé.
    C''est la condition pour que le dossier ne revienne pas.


    ---


    ## 1. Chronologie établie par pièces


    | Heure (3 juin) | Fait | Pièce | Nature |

    |---|---|---|---|

    | 6 h 25 | Fin de chargement, produit relevé à 3 °C | P1 | déclaratif manuscrit (opérateur) |

    | « 6 h 40 » | Mention manuscrite « départ » sur le BL | P2 | **contredite par P3** |

    | 6 h 25 → 9 h 05 | **2 h 40, remorque chargée, groupe froid hors tension** | P5 | enregistrement
    automatique (absence de données) |

    | 9 h 05 | Mise sous tension du groupe ; relevés 2,9 – 3,6 °C ensuite | P5 | enregistrement automatique
    |

    | 9 h 05 → 11 h 12 | 2 h 07, camion **encore sur site**, groupe en service | P3 + P5 | horodatage
    automatique |

    | 11 h 12 | Sortie du site — **seule sortie du véhicule ce jour** | P3 | horodatage automatique |

    | 12 h 55 | Arrivée au dépôt, 1 792 barquettes réceptionnées | P4 | document Sodimarché |


    **Deux faits structurent le dossier :**


    1. **Le camion est resté 4 h 47 sur notre site après la fin du chargement** (P1 + P3). La marchandise
    était sous notre garde, dans nos murs, pendant toute cette période.

    2. **Pendant 2 h 40 de cette attente, aucun froid n''était produit** (P5). Nous ne disposons d''**aucune
    mesure de température** sur cette fenêtre : l''enregistreur était hors tension.


    ---


    ## 2. Ce que l''entreprise reconnaît


    Elle reconnaît des **faits matériels**, et rien d''autre. *Aucune reconnaissance de responsabilité,
    aucune reconnaissance du principe ni du montant de la créance* — l''assureur y verrait un motif de
    refus de garantie.


    **2.1 — L''interruption de la production de froid sur notre site, du 3 juin 6 h 25 à 9 h 05.** Établie
    par nos propres pièces (P1, P5). Elle est indéfendable et il serait contre‑productif de la discuter
    : elle est écrite dans notre enregistreur.


    **2.2 — Le stationnement prolongé du véhicule chargé sur notre site jusqu''à 11 h 12** (P3), soit
    4 h 47 après fin de chargement, et un délai total de 6 h 30 entre fin de chargement et réception (P1
    + P4).


    **2.3 — L''inexactitude matérielle de la mention « départ 6 h 40 » portée au BL n° 2418** (P2). Elle
    est contredite par le journal de portique, écriture automatique horodatée (P3). **Nous signalons cette
    contradiction nous‑mêmes, spontanément, dans le dossier transmis.** Un document signé par notre chauffeur
    et contresigné par le dépôt, porteur d''une heure fausse de 4 h 32, découvert par l''adversaire, détruirait
    la crédibilité de l''ensemble de nos pièces. Découvert par nous et signalé, il ne coûte que sa correction.


    **2.4 — Le caractère non probant de la déclaration téléphonique du chauffeur (P7).** Elle n''est ni
    écrite ni signée, et son contenu — « parti tôt » — est contredit par P3. Elle est transmise à l''assureur
    pour ce qu''elle est : un propos oral non vérifié et contredit. Elle ne fonde aucune affirmation de
    la présente note. Nous ne la retirons pas du dossier : une pièce écartée par nous et retrouvée ensuite
    vaut aveu de dissimulation.


    ---


    ## 3. Ce que l''entreprise conteste


    Elle ne conteste pas l''incident. Elle conteste **le lien de causalité tel qu''il est présumé, l''assiette
    et le quantum**.


    **3.1 — Le montant global de 21 400 €, faute de décomposition.** La réclamation agrège trois chefs
    — marchandise détruite, transport, pénalité de rupture d''assortiment — sans qu''aucune pièce du dossier
    ne ventile les montants ni n''en donne la base de calcul. **Chaque chef doit être chiffré séparément
    et justifié par une pièce.** En l''état, aucun des trois n''est vérifiable.


    **3.2 — L''assiette quantitative : 1 840 ou 1 792 ?** Le BL contresigné par le réceptionnaire du dépôt
    porte 1 840 (P2) ; le bon de réception du dépôt porte 1 792 (P4). L''écart de **48 barquettes (2,6
    % du lot)** oppose deux documents du dépôt entre eux. Aucune pièce n''en rend compte. **La marchandise
    détruite ne peut être indemnisée au‑delà de ce que le dépôt reconnaît avoir reçu**, soit 1 792 (P4),
    tant que le sort des 48 unités n''est pas documenté.


    **3.3 — La portée de l''analyse du laboratoire (P6).** Trois barquettes sur 1 840, soit 0,16 % du
    lot. Le rapport transmis ne mentionne pas :

    - la date et l''heure du prélèvement, ni le délai écoulé depuis la réception de 12 h 55 (P4) ;

    - **les conditions de conservation de la marchandise au dépôt entre 12 h 55 et le prélèvement** —
    un lot refusé, stocké dans des conditions inconnues, pendant une durée inconnue ;

    - le plan d''échantillonnage contractuel appliqué (n, m, M) ni la traçabilité des unités prélevées
    ;

    - la chaîne de conservation des échantillons jusqu''au laboratoire.


    Un dépassement microbiologique constaté après un délai et dans des conditions non documentés ne peut
    être imputé de plein droit à la seule fenêtre du 3 juin matin. Nous demandons le rapport complet.


    **3.4 — La destruction de la marchandise sans expertise contradictoire.** Aucune pièce n''établit
    que nous ayons été invités à un prélèvement contradictoire avant destruction. La destruction unilatérale
    nous a privés du moyen de contre‑analyse sur le lot livré. Nous en tirons argument, sans en faire
    notre argument principal.


    **3.5 — La pénalité de rupture d''assortiment.** Elle suppose un préjudice commercial réel du dépôt,
    et une clause contractuelle qui en fixe le mode de calcul. **Ni la clause ni le calcul ne figurent
    au dossier.** Une pénalité forfaitaire manifestement disproportionnée au préjudice réel est réductible.


    **3.6 — Une réserve technique, à vérifier avant d''être opposée.** `[hypothèse — ne pas transmettre
    au client avant vérification]` Les relevés de P5 s''échelonnent entre 2,9 et 3,6 °C, sans valeur supérieure.
    Si l''export brut confirme que **la première valeur enregistrée à 9 h 05 était déjà ≤ 3,6 °C**, cela
    établit que l''air de la remorque n''avait pas dépassé le seuil contractuel après 2 h 40 sans froid
    — ce qui est cohérent avec l''inertie thermique d''une remorque isotherme fermée chargée de 1 840
    barquettes à 3 °C (P1). Cette réserve ne vaut **que** si l''export brut le confirme ; elle ne prouve
    pas la température à cœur du produit, seulement celle de l''air. Elle est vérifiable en 24 h et peut
    déplacer sensiblement la discussion. **Elle n''est opposable qu''après vérification du fichier brut**
    — avancée sans cela, elle se retourne contre nous.


    ---


    ## 4. Ce qui manque au dossier et doit être produit


    Le service juridique de l''assureur renvoie tout dossier dont une affirmation de fait n''est rattachée
    à aucune pièce. Or **quatre affirmations centrales du litige ne reposent aujourd''hui sur aucune pièce
    numérotée** :


    | À produire | Ce que cela fonde | Détenteur |

    |---|---|---|

    | **P8 — Le contrat Sodimarché** | La conservation 0–4 °C, le seuil 10⁵ UFC/g, le délai de 8 jours,
    la pénalité de plein droit. **Rien de tout cela n''est actuellement au dossier.** | nous |

    | **P9 — Autocontrôles libératoires du lot F‑2418** (flore à la production, DLC, date de fabrication)
    | L''état microbiologique initial. Sans lui, la croissance de flore n''est pas imputable à une fenêtre
    plutôt qu''à une autre. **Pièce décisive.** | nous |

    | **P10 — Échantillons témoins du lot F‑2418 + leur analyse** | Le seul contre‑poids possible à P6,
    le lot livré étant détruit. **À faire analyser immédiatement, par un laboratoire accrédité.** | nous
    |

    | **P11 — Lettre de réclamation du dépôt + preuve de sa date de réception** | Le point de départ du
    délai de 8 jours. **Aucune pièce ne le date à ce jour.** | nous |

    | **P12 — Export brut de l''enregistreur** (fichier natif, horodatage certifié, première valeur enregistrée)
    | La réserve du § 3.6 et l''intégrité de P5. | nous |

    | **P13 — Déclarations écrites et signées** du chauffeur et de l''opérateur de quai | Remplace P7,
    non probante. Doivent être cohérentes avec P3 — c''est‑à‑dire mentionner l''attente sur site. | nous
    |

    | **P14 — Justificatifs du dépôt** : bordereau de destruction, ventilation des 21 400 €, protocole
    et date de prélèvement, conditions de stockage après 12 h 55 | Les § 3.1 à 3.5. | **à réclamer au
    dépôt** |


    ---


    ## 5. Ce que l''entreprise engage dans les huit jours


    Le délai est le seul élément véritablement irréversible du dossier : **passé le terme, la pénalité
    est acquise sans discussion possible.** Le reste est négociable ; ceci ne l''est pas.


    **J+0 (aujourd''hui) — Établir la date exacte du terme.** Identifier la lettre de réclamation et sa
    date de réception (P11). Tant qu''elle n''est pas établie, on retient l''hypothèse la plus défavorable
    : terme = 8 jours à compter de la date la plus ancienne plausible.


    **J+0 — Déclaration à l''assureur.** Sans attendre la complétude du dossier. La plupart des polices
    imposent un délai de déclaration de 5 jours ouvrés et sanctionnent le retard par la déchéance. On
    déclare d''abord, on complète ensuite.


    **J+1 — Conservation des preuves.** Gel et mise sous scellés des échantillons témoins F‑2418 (P10),
    export du fichier brut de l''enregistreur (P12), extraction certifiée du journal de portique (P3).
    Instruction écrite : aucune destruction, aucune purge automatique de ces données jusqu''à clôture.


    **J+1 — Analyse des témoins** lancée auprès d''un laboratoire accrédité COFRAC, sur le même paramètre
    que P6.


    **J+2 — Recueil des déclarations écrites** du chauffeur et de l''opérateur (P13), sur les faits tels
    qu''ils sont établis par P3, pas tels qu''ils ont été dits au téléphone.


    **J+3 — Vérification de la réserve du § 3.6** contre l''export brut. Résultat binaire : elle entre
    dans la position, ou elle en est retirée.


    **J+5 — Envoi de la réponse écrite au dépôt**, LRAR + courriel avec accusé, contenant : reconnaissance
    des faits matériels du § 2, contestation motivée du § 3, réserve expresse de tous droits, demande
    des pièces du § 14, et **proposition d''expertise contradictoire**. Marge de 3 jours sur le terme.


    **J+5 — Proposition de sortie négociée, formulée dans le même courrier.** Sodimarché est un client,
    pas un adversaire. La proposition : prise en charge de la marchandise réceptionnée et détruite sur
    la base des 1 792 unités (P4) au prix de revient, **contre abandon de la pénalité de rupture d''assortiment**,
    assortie d''un réapprovisionnement prioritaire daté et d''un engagement de procédure corrigée. Cela
    transfère au dépôt quelque chose de réel — une livraison de remplacement à date ferme et une part
    du risque financier — plutôt qu''une consultation de principe. La condition de recevabilité de cette
    offre est qu''elle soit **validée par l''assureur avant émission**, sous peine de non‑garantie.


    **J+7 — Action corrective interne, documentée et transmise à l''assureur.** L''incident n''est pas
    une défaillance matérielle : le groupe froid fonctionnait, il n''a pas été mis en marche. Deux mesures
    : mise sous tension du groupe et pré‑refroidissement de la remorque **avant** début de chargement,
    comme point de contrôle bloquant de la fiche de quai (P1) ; et rapprochement automatique quotidien
    entre l''heure de fin de chargement (P1), l''heure de mise sous tension (P5) et l''heure de sortie
    du portique (P3), avec alerte au‑delà de 30 minutes d''écart. Le coût est marginal ; c''est ce qui
    empêche le sinistre d''être requalifié en défaut d''organisation par l''assureur.


    ---


    ## 6. Le meilleur argument contre nous


    Il faut l''écrire avant que l''adversaire ne l''écrive :


    > *La marchandise est restée 2 h 40 sans froid dans une remorque fermée, en juin, sur le site du fournisseur,
    sous sa garde exclusive. Le fournisseur ne dispose d''aucune mesure de température sur cette fenêtre
    — non par accident, mais parce que l''appareil chargé de la mesurer n''avait pas été mis en marche.
    Sa seule donnée thermique antérieure à 9 h 05 est une mention manuscrite de son propre opérateur (P1),
    non instrumentée. Le même dossier contient un BL portant une heure de départ fausse de 4 h 32 (P2
    vs P3). L''analyse est non conforme d''un facteur 4,2 (P6). L''absence de preuve contraire est le
    fait du fournisseur : il ne peut en tirer avantage.*


    **Il tient sur le principe.** Il ne tient pas sur le montant : il ne dit rien des 48 barquettes manquantes
    (P2 vs P4), rien des conditions de stockage au dépôt après 12 h 55, rien de la base de calcul de la
    pénalité, et rien de l''état microbiologique initial du lot. **La position n''est donc pas « nous
    ne devons rien », mais « nous devons ce qui est prouvé, sur l''assiette prouvée ».** C''est la seule
    position tenable devant un assureur qui instruit sur pièces, et la seule qui ne s''effondre pas à
    la première contre‑pièce.


    ---


    ## 7. Ce qui renverserait la position


    - **Si l''analyse des témoins (P10) revient au‑dessus de 10⁵** : le lot était non conforme avant chargement,
    la fenêtre du 3 juin n''est plus la cause, mais le défaut devient un défaut de production — plus grave
    en garantie, et la négociation change entièrement de nature. À traiter avant tout envoi.

    - **Si les autocontrôles libératoires (P9) sont manquants ou incomplets** : nous perdons le débat
    sur la causalité et il faut basculer sur la seule discussion du quantum (§ 3.1 à 3.5).

    - **Si l''export brut (P12) montre une première valeur > 4 °C à 9 h 05** : le § 3.6 est retiré, et
    la fenêtre de rupture est prouvée matériellement. Ne rien avoir écrit à ce sujet au client devient
    déterminant.


    **Repli, déclencheur observable :** si à J+4 les analyses de témoins ne sont pas revenues ou si P9
    est introuvable, le courrier du J+5 part **sans le volet causalité**, limité à la reconnaissance des
    faits matériels, à la contestation d''assiette et de quantum, à la réserve de droits et à la demande
    d''expertise contradictoire. Le délai prime sur la complétude : un courrier incomplet dans les huit
    jours préserve le débat ; un courrier parfait au neuvième jour rend la pénalité définitive.


    ---


    **Première action, maintenant :** identifier la lettre de réclamation et sa date de réception (P11),
    et déclarer le sinistre à l''assureur. Tant que le terme n''est pas daté, tout le reste du plan est
    bâti sur une échéance inconnue.

    '
