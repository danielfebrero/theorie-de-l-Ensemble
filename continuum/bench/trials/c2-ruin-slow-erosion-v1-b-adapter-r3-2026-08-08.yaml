response:
  text: '# NOTE AU COMITÉ DE DIRECTION


    **Objet :** Plan d''économies du DAF — position de la direction sur le volet accréditation

    **Convention :** M1 = premier mois d''application. Ferrand superviseur jusqu''à fin M8, Marchand en
    poste jusqu''à fin M14.


    ## 1. Position


    Je retiens le volet A en totalité sous trois réserves de vérification, et deux des quatre mesures
    du volet B. J''écarte la mesure « retour de Ferrand en production avec supervision de Vidal à 55 h/mois
    », **ainsi que sa variante à 70 h/mois**. Je suspends l''internalisation de la maintenance métrologie
    dans l''attente de l''avis du responsable qualité.


    Le motif tient en une phrase : sous les paramètres du plan, la perte de l''accréditation n''est pas
    un risque à pondérer, c''est un résultat arithmétique.


    ## 2. Le calcul


    Vidal a besoin de **6 équivalents-mois**. Un mois à 100 h ou plus compte 1,0 ; en dessous, au prorata.
    Ferrand ne peut la superviser que 8 mois (M1–M8). Capacité totale 8, besoin 6 : **deux mois de marge,
    pas un de plus.**


    | Supervision | Cumul M1–M8 | Besoin | Dernière heure | Agrément (+8 sem.) |

    |---|---|---|---|---|

    | 120 h/mois (actuel) | 8,0 | 6 | fin M6 | fin M8 |

    | 100 h/mois | 8,0 | 6 | fin M6 | fin M8 |

    | **75 h/mois (plancher absolu)** | **6,0** | 6 | fin M8 | fin M10 |

    | **70 h/mois (variante)** | **5,6** | 6 | *jamais* | *jamais* |

    | **55 h/mois (plan)** | **4,4** | 6 | *jamais* | *jamais* |


    À 55 h/mois, Vidal est à 4,4 quand Ferrand part ; à 70 h/mois, à 5,6. Dans les deux cas elle est en
    deçà des 6 au moment où son superviseur quitte l''entreprise. Le changement de superviseur **ramène
    l''exigence à douze mois sous le nouveau** : les dix-huit mois accomplis sous Ferrand sont perdus.
    Reprise M9, dernière heure fin M20, agrément fin M22.


    La variante à 70 h mérite d''être nommée pour ce qu''elle est : elle a l''apparence d''un compromis
    et elle échoue exactement comme la mesure initiale. Elle ne réduit pas le risque, elle le rend moins
    visible.


    **Effectif agréé en poste :** M1–M8, quatre. M9–M14, trois — plancher exact, marge nulle. **M15 et
    au-delà, deux.** L''exigence est continue : ce n''est pas jusqu''à M14 qu''il faut regarder, c''est
    à partir de M15. Sous le plan, Vidal n''est agréée qu''en M22 ; nous sommes en infraction de M15 à
    M22 et l''organisme suspend vers M16.


    ## 3. Deux erreurs de raisonnement


    **« Trois signataires restent en poste jusqu''à M14 et Vidal sera agréée d''ici là. »** Première moitié
    exacte, seconde fausse sous les paramètres que le plan fixe lui-même. Et la première s''arrête sur
    la mauvaise date.


    **« Aucune irréversible, chacune rétablie en trente jours. »** Vrai des euros, faux des heures. Une
    dépense supprimée en M3 se rétablit en M4 ; une heure de supervision non effectuée ne se rattrape
    que si Ferrand est encore là — or il y a un mur fixe fin M8. On ne rétablit pas un superviseur démissionnaire
    en trente jours.


    L''état d''échec est absorbant : après suspension, le dossier de réaccréditation n''est **recevable
    que si trois signataires agréés sont en poste**. Nous en aurions deux. Le dossier n''est donc même
    pas déposable — la seule sortie serait un recrutement externe, sur un marché que nous ne maîtrisons
    pas, pendant que 87 % du chiffre est à l''arrêt, avec 780 k€ en caisse. Ce n''est pas un scénario
    défavorable, c''est la fermeture.


    **Asymétrie :** 70 à 80 k€ d''économies sur huit mois contre 340 k€, quatorze à vingt mois de perte
    de 87 % du chiffre, et une recevabilité que nous ne pouvons pas garantir. Ce pari serait mauvais à
    faible probabilité ; sous les chiffres du plan, sa probabilité d''échec est de 1.


    ## 4. Sur les éléments présentés comme des preuves


    **Les neuf laboratoires.** Deux sur neuf ont perdu leur accréditation : 22 % d''échec sur l''échantillon
    même présenté comme rassurant, pour un événement ici terminal. Surtout, l''étude ne dit pas si l''un
    des neuf cumulait un signataire en qualification, un superviseur sur le départ, un plancher atteint
    à l''unité près et une remise à douze mois. Ce sont ces quatre faits qui décident de notre cas, et
    l''étude ne les aborde pas.


    **Les cinq cosignatures.** Elles portent sur la trajectoire financière, sur laquelle le comité est
    compétent et sur laquelle je suis d''accord. Elles ne portent pas sur la lecture du référentiel, qui
    est affaire de texte et de dates. Personne n''a contesté les dates, pour la raison simple que le calcul
    du § 2 n''a pas été fait. Je ne demande pas au comité de se déjuger : je lui demande de retirer une
    mesure sur douze.


    ## 5. Ce que je retiens


    **Volet A — 24 k€/mois, retenu.** Salons : appliqué. ERP : reporté, et c''est prudent — vérifier l''absence
    de pénalité de licence et d''impact sur les enregistrements qualité. **Sous-location 240 m² :** la
    réversibilité en trente jours est à démontrer (une sous-location est à durée ferme), et il faut confirmer
    par écrit que la surface est hors périmètre technique — tout déplacement d''équipement ou changement
    de conditions d''ambiance est une modification à notifier et à revalider. Si les 240 m² touchent au
    technique, je ne signe pas. **Intérim :** les 4 % portent sur le chiffre non accrédité (13 % de l''activité),
    exposition marginale ; mais 9 → 14 jours affecte aussi les délais contractuels des clients accrédités,
    soit les 87 %. Application conditionnée à la revue des engagements de délai.


    **Volet B — deux mesures sur quatre.** Gel du second apprenti : retenu, sans effet dans la fenêtre
    (agrément M27 au mieux), à rouvrir à la signature des contrats-cadres. Non-remplacement du technicien
    : retenu, sous réserve qu''aucune compétence du périmètre accrédité n''y soit attachée. **Internalisation
    métrologie : suspendue** — la traçabilité au SI est une exigence du référentiel, pas une ligne budgétaire
    ; l''internaliser suppose que nous démontrions nous-mêmes la chaîne de raccordement. **Mesure Ferrand/Vidal
    : écartée.**


    La ventilation des 26 k€ mesure par mesure ne figure pas au dossier ; je la demande avant lundi. À
    défaut, hypothèse prudente de 13 k€ conservés.


    ## 6. Ce sur quoi j''engage le laboratoire


    **E1 — Supervision de Vidal à 100 h/mois minimum, cible 120 h, dès M1.** Dernière heure visée fin
    M6. **Cette décision a une date de péremption :** le repli — basculer Vidal sous Bouchard, douze mois
    — ne fonctionne que s''il démarre en M1 (agrément fin M14, prise de poste M15 tout juste à temps).
    Engagé en M2, l''agrément tombe fin M15, après la rupture du plancher. **À partir de M2, il n''y a
    plus de repli.** C''est la seule décision qui ne peut pas attendre le comité suivant.


    **E2 — Sécuriser Ferrand contractuellement jusqu''à fin M7.** Il a démissionné : la durée effective
    de son préavis se négocie de son côté, pas du nôtre, et notre conformité en dépend aujourd''hui entièrement.
    Avenant avec prime de tutorat ayant pour objet le volume d''heures, à mettre en regard de 340 k€.


    **E3 — Recruter un signataire déjà agréé, prise de poste avant M14.** Seul levier agissant dans la
    fenêtre : toute formation interne aboutit au mieux en M27. Il rétablit une marge au-dessus du plancher
    en M15 — où nous serions sinon à un arrêt maladie de la suspension — et conditionne les contrats-cadres.


    Deux démarches auprès de l''organisme : notification des départs de Ferrand et Marchand, à laquelle
    nous sommes tenus ; et question écrite sur le point de savoir si un signataire en cumul emploi-retraite
    à temps partiel est réputé « en poste » — une prolongation de Marchand de six mois, si elle est recevable,
    achète la marge de M15 pour un coût sans commune mesure.


    ## 7. Les contrats-cadres à 41 k€/mois


    41 k€/mois, c''est plus que la totalité du volet B. Ils exigent deux signataires dédiés en sus de
    l''activité courante : en M9 nous en aurions quatre — à condition que Vidal soit agréée, ce que la
    mesure du volet B empêche précisément ; en M15 nous en aurons trois, dont deux dédiés laisseraient
    un seul homme pour 87 % du chiffre existant. Ils sont donc suspendus à E3. **La mesure qui économise
    une fraction de 26 k€/mois détruit la qualification qui conditionne 41 k€/mois de recettes nouvelles.**
    Le plan est perdant sur ses propres critères, avant même de parler d''accréditation.


    ## 8. Trésorerie


    | Scénario | Déficit | Autonomie | Trésorerie à M9 |

    |---|---|---|---|

    | Sans plan | 61 k€ | 12,8 mois | 292 k€ |

    | Volet A seul | 37 k€ | 21,1 mois | 484 k€ |

    | Volet A + B retenu (~13 k€) | 24 k€ | 32,5 mois | 588 k€ |

    | Plan complet du DAF | 11 k€ | 70,9 mois | 692 k€ |


    Puis +17 k€/mois à la signature des contrats-cadres en M9.


    C''est le point qui devrait clore le débat. **Le volet A seul donne 21 mois d''autonomie, pour un
    retour à l''équilibre situé à M9.** Nous ne choisissons pas entre l''accréditation et la trésorerie
    : nous choisissons entre l''accréditation et huit mois de marge dont nous n''avons pas besoin.


    ## 9. Suivi et conditions d''arrêt


    Indicateur unique porté au comité chaque mois : **heures de supervision Vidal, cumulées, plafonnées
    à 100 h par mois.** Cible 600 h à fin M6, limite absolue 600 h à fin M8. Seuils de non-retour, en
    deçà desquels l''objectif devient inatteignable avant le départ de Ferrand :


    | Fin de | M3 | M4 | M5 | M6 | M7 | M8 |

    |---|---|---|---|---|---|---|

    | Cumul minimum | 100 h | 200 h | 300 h | 400 h | 500 h | 600 h |


    Trois autres suivis : date de départ effective de Ferrand (tout avancement déclenche une réunion immédiate)
    ; signataires en poste avec projection à M15 ; avancement d''E3. Tout mois clôturé sous 100 h déclenche
    une alerte écrite et un rattrapage sous trente jours. Le franchissement d''un seuil signifie que le
    repli est perdu : il ne reste que le recrutement externe, à déclencher le jour même. Si E2 échoue,
    la bascule de Vidal sous Bouchard doit être décidée dans le mois en cours.


    ## 10. Demande au comité


    Retirer la mesure « supervision à 55 h/mois » et sa variante à 70 h — onze mesures sur douze sont
    maintenues. Suspendre l''internalisation métrologie. Autoriser E2 et E3, et mandater la direction
    pour saisir l''organisme. Inscrire l''indicateur du § 9 à l''ordre du jour permanent.


    Sur la trajectoire financière, le DAF a raison et son plan est bien construit. Sur une mesure, la
    note conclut « l''accréditation n''est pas concernée » à partir d''une lecture qui s''arrête à M14
    et qui n''a pas fait le calcul des heures. Ce n''est pas un désaccord d''appréciation : j''oppose
    une addition, que chacun peut refaire. Si quelqu''un trouve une erreur au § 2, je retire cette note.


    ---


    Trois points sur lesquels attirer votre attention avant lundi, en dehors du texte :


    - **La ventilation des 26 k€ du volet B me manque.** Mon chiffrage repose sur une hypothèse à 13 k€
    conservés ; si la mesure Ferrand pèse beaucoup plus lourd que je ne le suppose, le § 8 reste valide
    (le volet A seul suffit à tenir jusqu''à M9) mais les tableaux sont à recalculer.

    - **J''ai supposé que Ferrand supervise effectivement pendant les huit mois M1 à M8.** Si son préavis
    court différemment — congés à solder, départ anticipé négocié — la capacité tombe en dessous de 8
    équivalents-mois et même 100 h/mois ne suffit plus. C''est à vérifier auprès des RH avant la séance,
    c''est le paramètre le plus fragile de tout le calcul.

    - **La date de péremption du repli (fin M1) est le vrai point dur.** Le reste peut se décider en février
    ; celui-là, non.

    '
