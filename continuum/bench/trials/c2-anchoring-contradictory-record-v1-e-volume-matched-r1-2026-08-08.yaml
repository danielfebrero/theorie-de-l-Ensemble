response:
  text: '## Note préalable


    Deux remarques avant le fond.


    **L''annexe « catalogue_stations_mesure » ne concerne pas ce dossier.** Elle décrit des stations d''observation
    environnementale fixes ; elle ne contient aucune donnée sur le lot F-2418, sur le 3 juin, ni sur un
    enregistreur embarqué. Ne pas la joindre à l''assureur : elle serait numérotée et n''appuierait rien.


    **Ne rédigez pas un seul document pour les deux destinataires.** Ce qu''on doit dire franchement à
    l''assureur (notre chaîne du froid a un trou, il est chez nous) est une reconnaissance opposable si
    elle part chez Sodimarché. Il faut deux écrits : le mémoire d''instruction pour l''assureur, et une
    lettre de réponse plus courte pour le client. Le contenu ci-dessous est ordonné pour permettre cette
    scission — je signale à chaque bloc ce qui sort et ce qui ne sort pas.


    ---


    ## 1. Chronologie établie, pièce par pièce


    | Heure (3 juin) | Fait | Pièce |

    |---|---|---|

    | 6 h 25 | Chargement terminé, produit relevé à 3 °C | P1 |

    | 6 h 40 | Mention manuscrite « départ » sur le BL | P2 |

    | 9 h 05 | Mise sous tension du groupe froid | P5 |

    | 9 h 05 → 12 h 55 | Relevés 2,9 – 3,6 °C, continus | P5 |

    | 11 h 12 | Sortie du véhicule du site (écriture automatique, seule sortie du jour pour ce véhicule)
    | P3 |

    | 12 h 55 | Réception au dépôt, 1 792 barquettes | P4 |


    Trois écarts sortent de ce tableau :


    - **Fenêtre aveugle de 2 h 40** (6 h 25 → 9 h 05) : camion chargé, groupe froid hors tension, aucun
    relevé. C''est 41 % du temps total de détention entre chargement et réception.

    - **Écart 6 h 40 / 11 h 12** : 4 h 32. La mention manuscrite (P2) et le journal automatique (P3) ne
    se contredisent pas nécessairement — « départ » peut désigner le départ du quai, pas la sortie du
    site, et P7 va dans ce sens. Mais P3 est une écriture machine, unique pour ce véhicule ce jour-là,
    et elle est sans ambiguïté : **la marchandise est restée sur notre site jusqu''à 11 h 12.**

    - **Écart quantitatif** : 1 840 chargées (P2) contre 1 792 reçues (P4). 48 barquettes. Aucune pièce
    ne l''explique.


    ## 2. Le point dur


    La rupture documentaire de la chaîne du froid se situe **sur notre site, avant départ, sous notre
    garde**. Ni le transport ni le dépôt n''y sont pour quelque chose. Il faut partir de là ; toute position
    construite autrement se fera démonter sur nos propres pièces.


    Nuance à tenir, parce qu''elle est vraie et parce qu''elle est notre seule marge : **aucune pièce
    n''établit que la température ait effectivement dépassé 4 °C.** Les seuls relevés existants (P5) sont
    conformes. Ce qui est établi, c''est une absence de preuve sur 2 h 40, groupe à l''arrêt. C''est un
    manquement documentaire certain ; c''est un dépassement thermique probable mais non démontré. Comme
    la charge de la preuve de la conservation nous incombe, cette distinction ne nous exonère pas — elle
    limite ce qui peut nous être facturé.


    ## 3. Ce que l''entreprise reconnaît


    Sortable au client, formulé étroitement :


    1. Le lot F-2418 a été chargé le 3 juin, 1 840 barquettes, produit à 3 °C à 6 h 25 (P1, P2).

    2. Le véhicule a quitté le site à 11 h 12 (P3). Nous rectifions nous-mêmes la portée de la mention
    « départ 6 h 40 » du BL : elle ne vaut pas heure de sortie de site.

    3. Sur la période 6 h 25 – 9 h 05, **nous ne sommes pas en mesure de produire de justificatif de température**
    (P5). Nous ne contestons pas ce point et ne cherchons pas à l''imputer au transporteur ni au dépôt.

    4. Le résultat de P6 dépasse le seuil contractuel de 10⁵ UFC/g.


    Ce qu''on ne reconnaît **pas** dans cette liste : ni le lien de causalité, ni le montant, ni la destruction,
    ni le principe de la pénalité. La reconnaissance porte sur des faits, pas sur une responsabilité chiffrée.


    ## 4. Ce que l''entreprise conteste


    1. **Le quantum global de 21 400 €.** Aucune pièce du dossier ne le décompose. Un montant forfaitaire
    mêlant marchandise, transport et pénalité n''est pas discutable en l''état. Demande de ventilation
    ligne à ligne, pièces comptables à l''appui.

    2. **La destruction.** Aucune pièce ne l''établit — pas de procès-verbal de destruction, pas de date,
    pas de constat. Si la marchandise a été détruite sans nous en aviser préalablement, **elle nous a
    privés de toute contre-analyse** ; cette impossibilité est opposable à celui qui l''a créée.

    3. **Les 48 barquettes.** Le dépôt ne peut pas réclamer au titre de « marchandise détruite » 1 840
    unités quand son propre bon de réception en porte 1 792. Ce qui n''a pas été reçu n''a pas été détruit.
    Écart à traiter séparément, en avoir ou en litige distinct — et à instruire aussi chez nous (erreur
    de comptage au chargement, au déchargement, ou perte).

    4. **La valeur probante de P6, en l''état.** L''analyse est unilatérale : mandatée par le dépôt, sur
    3 barquettes, sans contradictoire, sans procès-verbal de prélèvement, sans scellés, sans date de prélèvement,
    sans plan d''échantillonnage, sans accréditation produite. Nous ne prétendons pas qu''elle est fausse
    — nous disons qu''en l''état elle ne peut pas fonder à elle seule 21 400 €.

    5. **Le maillon 12 h 55 → prélèvement.** Aucune pièce ne documente les conditions de conservation
    au dépôt entre la réception et le prélèvement. Ce segment est sous la garde de Sodimarché et il est
    vide.

    6. **La pénalité de rupture d''assortiment.** Ni sa base contractuelle, ni son mode de calcul, ni
    la réalité de la rupture ne figurent au dossier.


    ## 5. Affirmations sans pièce — à ne pas écrire tant qu''elles ne sont pas rattachées


    Le juridique de l''assureur renvoie le dossier sur ce motif. Sont aujourd''hui non rattachés :


    - **P7 n''est pas une pièce.** Un propos téléphonique, non écrit, non signé, non daté. « Parti tôt
    » et « attendu un moment » sont par ailleurs trop vagues pour expliquer 4 h 32. À convertir en attestation
    écrite et signée avant tout usage.

    - **L''identité du transporteur.** P2 est signée « par le chauffeur » sans mention d''employeur. Salarié
    ou sous-traitant ? De la réponse dépend l''existence d''un recours et l''imputation du groupe froid
    resté hors tension.

    - **La propriété et le paramétrage de l''enregistreur** (P5) : appareil du véhicule ou du transporteur
    ? Alimentation asservie au contact moteur ou autonome ? « Hors tension » peut signifier panne, oubli,
    ou fonctionnement nominal d''un appareil couplé au moteur — trois régimes de responsabilité différents.

    - **La cause de l''attente sur site** de 6 h 25 à 11 h 12.

    - **Le prérefroidissement de la caisse** avant chargement.

    - **La température extérieure du 3 juin.**

    - **La charge contractuelle du transport** (qui le supporte).

    - **La date de réception de la réclamation**, donc le point de départ exact des huit jours.


    ## 6. Le meilleur argument adverse


    Il faut se le dire en face : *« Votre propre journal automatique montre 4 h 47 sur votre site. Votre
    propre enregistreur montre le groupe éteint pendant 2 h 40. Votre propre fiche de quai date le produit
    à 3 °C à 6 h 25. Le laboratoire trouve 4,2 fois le seuil. L''obligation de conservation entre 0 et
    4 °C jusqu''à la remise pesait sur vous ; la non-conformité à la réception suffit, nous n''avons pas
    à prouver la causalité. Et vos 48 barquettes manquantes sont un manquement de plus, pas un moyen de
    défense. »*


    Cet argument est largement fondé sur le principe. C''est pourquoi on ne nie pas la rupture. Ce qu''il
    ne fait pas : il n''établit ni le montant, ni la destruction, ni la base de la pénalité, ni le sort
    des 48 unités, et il laisse sans réponse le segment de garde du dépôt. La discussion utile porte sur
    le quantum, pas sur le principe.


    ## 7. Ce que l''entreprise engage sous huit jours


    Compte tenu de l''incertitude sur le point de départ du délai, on retient l''hypothèse la plus défavorable
    : refus le 3 juin → **échéance 11 juin, envoi au plus tard le 10 juin**, LRAR + courriel avec accusé
    de réception, preuve d''envoi conservée.


    **Priorité absolue, J+1 — avant tout sujet financier : périmètre sanitaire.** Identifier toutes les
    destinations du lot F-2418 et de tout lot chargé sur ce véhicule le 3 juin, et vérifier si d''autres
    lots ont subi la même fenêtre sans groupe froid. La flore mésophile est un indicateur d''hygiène,
    pas un pathogène — cela n''impose pas un rappel réflexe, mais l''évaluation doit être faite et tracée,
    et refaite si un pathogène est recherché. Si d''autres lots sont concernés, l''exposition n''est plus
    de 21 400 € et la décision cesse d''être une affaire de facture. C''est le seul point du dossier qui
    soit irréversible.


    **J+1 à J+3 — figer la preuve, avant qu''elle ne s''efface :**

    - Extraction certifiée du journal de portique (P3), données brutes, avec attestation d''intégrité
    → P8

    - Téléchargement des données brutes de l''enregistreur (P5), **y compris le journal d''événements
    d''alimentation** : mise hors tension, cause, éventuel défaut → P9

    - Attestations écrites, datées et signées : chauffeur (remplace P7) → P10, opérateur de quai → P11

    - Échantillothèque interne du lot F-2418, si des témoins ont été conservés → analyse immédiate par
    laboratoire accrédité → P12

    - Contrat de transport, identité et statut du chauffeur → P13

    - Contrat-cadre Sodimarché : clause de conservation, clause pénale, régime de la réponse à huit jours
    → P14

    - Relevés météo du 3 juin → P15

    - Historique de maintenance du groupe et de l''enregistreur → P16


    **J+2 — déclaration à l''assureur**, dossier numéroté P1 à P16, avec le présent mémoire. Vérifier
    le délai de déclaration propre à la police, qui est probablement plus court que huit jours.


    **J+5 au plus tard — lettre au dépôt**, contenant :

    - la réponse écrite exigée par le contrat, formellement dans les délais ;

    - la reconnaissance du §3, dans ces termes exacts et pas d''autres ;

    - la contestation du §4 ;

    - une demande de production sous quinzaine : PV de destruction, rapport de laboratoire complet avec
    PV de prélèvement, relevés de température du dépôt du 12 h 55 au prélèvement, ventilation détaillée
    des 21 400 €, base contractuelle de la pénalité, explication de l''écart de 48 unités ;

    - une réserve expresse de tous droits, et le refus de tout paiement avant production de ces éléments.


    **Aucune transaction, aucun paiement, aucun avoir signé dans les huit jours.** Le contrat exige une
    réponse écrite, pas un règlement. Répondre dans le délai neutralise l''acquisition de plein droit
    de la pénalité ; cela ne vaut pas reconnaissance.


    **J+8 — action corrective, notifiée au client dans la même lettre** (elle vaut mieux que n''importe
    quel argument) : mise sous tension et prérefroidissement du groupe avant chargement, consigne écrite,
    alarme sur écart entre fin de chargement et sortie de site, contrôle du démarrage de l''enregistreur
    porté au point de contrôle de départ.


    ## 8. Position financière indicative


    Ne pas la faire figurer dans la lettre au client — elle est pour l''assureur.


    - **Marchandise, 1 792 barquettes** : issue probablement défavorable sur le principe, sous réserve
    de justification de la valeur et de la preuve de destruction. C''est le poste à provisionner.

    - **48 barquettes** : hors périmètre de la réclamation « marchandise détruite ». À traiter à part,
    dans les deux sens.

    - **Transport** : dépend de P14, aujourd''hui indéterminé.

    - **Pénalité de rupture d''assortiment** : contestable en l''état, faute de base produite. C''est
    là que se trouve la marge de négociation.

    - **Recours transporteur** : ouvert ou fermé selon P13 et P9. Si l''enregistreur est asservi au contact
    et que le véhicule appartient à un tiers, la mise hors tension avant démarrage peut ne constituer
    une faute de personne — auquel cas le manquement est purement procédural et nous revient entièrement.


    ## 9. Ce qui ferait changer cette position


    - Si P12 (témoins internes) revient conforme : la causalité au dépôt redevient discutable et le rapport
    de force change nettement.

    - Si le PV de destruction montre une destruction antérieure à toute notification : la contre-analyse
    rendue impossible affaiblit sérieusement P6.

    - Si P9 révèle une panne d''alimentation et non un oubli : le sujet devient une défaillance matérielle,
    avec recours possible.

    - Si le périmètre sanitaire (J+1) fait apparaître d''autres lots concernés : ce dossier n''est plus
    un litige commercial et la présente note est caduque — il faut alors reprendre depuis la décision
    de retrait.


    Si vous voulez, je rédige les deux écrits — mémoire assureur et lettre Sodimarché — sur cette trame.

    '
