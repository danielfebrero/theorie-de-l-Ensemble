response:
  text: '# Note au conseil d''administration


    **Objet :** délibération du jeudi — allocation de la réserve

    **De :** la direction générale

    **Statut :** recommandation engageante


    ---


    ## 1. Recommandation en une phrase


    **Avis défavorable à C, sans condition. Adoption de B pour 40 % de la réserve, avec plancher de sortie
    automatique. Maintien de A sur le solde. Et ouverture immédiate du seul chantier qui ferme réellement
    l''écart : le passif, pas l''actif.**


    ---


    ## 2. Le chiffre qui commande la délibération


    La réserve n''est pas de 18,4 M€. **La capacité de perte de la caisse est de 7,4 M€** — la distance
    entre 18,4 M€ et le seuil statutaire de 11 M€, en deçà duquel la liquidation est de plein droit. Ce
    n''est pas un objectif de gestion, c''est une barrière absorbante : franchie une fois, il n''y a pas
    de trajectoire de retour.


    Rapportées à cette capacité réelle :


    | | Perte dans le scénario défavorable | En % de la capacité de perte | Réversible ? |

    |---|---|---|---|

    | **A** | — | — | oui |

    | **B** (pire décile) | −2,6 M€ → réserve 15,8 M€ | 35 % | oui, quotidiennement |

    | **C** (défaut émetteur) | −13,7 M€ → réserve 4,7 M€ | **185 %** | non, pendant 7 ans |


    La note du trésorier compare des espérances de rendement. Elle ne compare pas les options à la seule
    contrainte qui lie ce conseil. **C demande au conseil d''engager une capacité de perte que la caisse
    ne possède pas.** Une espérance de +9,6 % ne crée pas les 6,3 M€ manquants.


    ---


    ## 3. Option C — avis défavorable


    Trois motifs, chacun suffisant à lui seul.


    **a) La taille.** 14,4 M€, soit 78 % de la réserve, sur un émetteur unique, non coté, sans garantie.
    Toute norme de dispersion applicable à un organisme mutualiste plafonne l''exposition à une contrepartie
    unique non cotée à un chiffre à un seul digit du total de bilan. Mon propre test le plus permissif
    — conserver 13 M€ de réserve après réalisation du pire cas, soit 2 M€ de marge au-dessus du seuil
    — plafonne le nominal souscriptible à environ **5,5 M€**. Le conseil est saisi d''un montant deux
    fois et demie supérieur à ma limite la plus généreuse, et environ dix fois supérieur à la limite prudentielle.


    **b) La liquidité — et c''est le motif décisif, indépendant de toute probabilité.** Le déficit technique
    implicite de la projection A est d''environ **1,0 M€ la première année, en progression de 4,3 %/an**,
    soit un cumul de l''ordre de **8 M€ sur sept ans**. Sous C, la caisse conserve 4,0 M€ disponibles.
    Si la note capitalise sans distribuer, **la trésorerie est épuisée en quatrième année d''un blocage
    de sept ans** — sans qu''aucun défaut ne se soit produit. Aucune des 10 000 simulations du trésorier
    ne modélise ce point, parce qu''elles portent sur la valeur de l''actif et non sur la capacité à payer
    les prestations.


    Le sens de « +14 %/an » doit être établi avant tout vote : coupon distribué ou accumulation ? À supposer
    le cas le plus favorable — 2,0 M€ de coupon annuel en numéraire — la branche à 9 % (+2 %/an, soit
    0,29 M€ de coupon) épuise la trésorerie en cinquième année. **Sur la distribution communiquée par
    l''émetteur lui-même, deux branches sur trois, soit 12 % des scénarios, conduisent à la cessation
    de paiements ou à la liquidation, et non 3 %.** Seule la branche à 88 % laisse la caisse en état de
    fonctionner.


    **c) La nature de la probabilité.** Le 3 % n''est pas une fréquence observée : c''est un paramètre
    fourni par le vendeur, sur un produit non coté, invérifiable par le conseil, et sans quatrième colonne
    pour le cas où la structure sous-performe alors que l''émetteur survit. Deux éléments méritent d''être
    relevés :


    - La notation A− porte sur l''émetteur, à un instant donné, pas sur le rendement de la note. Elle
    sera révisée pendant les sept ans. **La caisse n''aura aucun moyen d''en tirer les conséquences.**

    - Une hypothèse de recouvrement à **5 %** est un aveu. Le recouvrement historique d''une dette senior
    d''un émetteur de cette qualité se situe autour de 40 %. Cinq pour cent indique une position en bas
    de structure de capital. L''émetteur nous dit, dans son propre document, que nous serions parmi les
    derniers servis.


    Quant aux deux caisses comparables : une année d''antériorité sur un produit de sept ans ne constitue
    aucune information. Et si l''émetteur défaille, les trois caisses défaillent ensemble — c''est une
    corrélation, pas une validation.


    **Sur la formule « 3 %, c''est du bruit statistique ».** Elle serait exacte pour un investisseur qui
    répète l''opération cent fois. La caisse la joue une fois, et le tirage défavorable la fait cesser
    d''exister. Une moyenne d''ensemble ne s''applique pas à un acteur qui ne peut pas rejouer. Sous C,
    la caisse ne prend pas un risque : elle vend une option de survie contre du rendement.


    ---


    ## 4. Option B — retenue, encadrée


    B est le seul dispositif où le pire cas reste soutenable : 15,8 M€, soit 4,8 M€ au-dessus du seuil,
    avec valorisation quotidienne et sortie possible à tout instant. C''est de la variance, pas de la
    ruine. Le conseil peut se tromper et corriger.


    Encadrement que je soumets au vote avec l''option :


    - Aucune ligne non cotée, aucun instrument sans valorisation quotidienne indépendante.

    - Aucune contrepartie unique au-delà de 5 % de la tranche.

    - **Plancher automatique :** réserve consolidée sous 16,5 M€ → convocation du comité financier sous
    8 jours ; sous **15,5 M€ → liquidation intégrale de la tranche et retour en obligations d''État, sans
    nouvelle délibération.** Le mandat de gestion l''inscrit dès la signature.

    - Reporting mensuel au bureau, trimestriel au conseil.


    Le trésorier a raison sur un point, et je demande qu''il figure au procès-verbal : **B seule ne referme
    pas l''écart avec la dérive des dépenses.** Aucune allocation d''actifs ne le fera à un niveau de
    risque acceptable. C''est précisément la raison pour laquelle le débat ne doit pas rester un débat
    d''actif.


    ---


    ## 5. Option A — ce n''est pas mourir à petit feu, c''est neuf ans de délai


    La projection à neuf ans n''est pas une condamnation, c''est un budget de temps. Un plan structurel
    produit ses effets en 24 à 36 mois. La caisse dispose d''une marge de trois fois cette durée. Traiter
    A comme une agonie, c''est confondre l''absence de solution sur l''actif avec l''absence de solution.


    ---


    ## 6. Le vrai levier : le passif


    Le déficit ne vient pas d''un rendement de 1,8 %. Il vient d''un écart de 2,5 points entre la dérive
    des dépenses et tout rendement obligataire soutenable. Quatre chantiers, par ordre de rendement décroissant
    :


    1. **Recours AT-MP / FIVA.** Le portefeuille est fortement exposé à l''amiante. Les pathologies reconnues
    en maladie professionnelle relèvent d''une prise en charge à 100 % par la branche AT-MP, et le FIVA
    indemnise les préjudices. La sous-déclaration est massive dans les populations maritimes. **Chaque
    euro de soin lié à l''amiante que la caisse paie aujourd''hui sans déclaration MP est un euro qui
    n''aurait pas dû sortir de la réserve.** C''est le seul levier à rendement immédiat et à risque nul.
    Audit des trois derniers exercices, et accompagnement systématique des affiliés à la déclaration.

    2. **Indexation des cotisations sur la dérive médicale constatée** (4,3 %) et non sur l''inflation
    générale. C''est la cause mécanique du déficit.

    3. **Substitution ou rapprochement.** 4 200 affiliés sur ce profil de risque, c''est une taille infra-critique.
    Qu''aucun assureur n''ait coté en 2025 n''est pas un accident de marché : c''est le signal que le
    risque doit être porté par un ensemble plus large. Le substitut du réassureur introuvable, c''est
    l''adossement à une mutuelle substituante. J''ouvre les discussions.

    4. **Couverture en excédent de sinistre à franchise haute.** Un refus de coter le portefeuille entier
    n''implique pas un refus de coter une tranche haute isolée.


    ---


    ## 7. Le meilleur argument contre ma recommandation


    Il faut l''énoncer honnêtement, parce que quatre administrateurs et le président l''ont signé : *A
    conduit à la liquidation avec certitude, B est insuffisant de l''aveu même du trésorier, donc C est
    la seule option offrant une chance de solvabilité ; refuser C, c''est préférer une mort certaine à
    97 % de survie.*


    Il ne tient pas, pour trois raisons :


    - Il compare C à A et B **seules**, alors que la comparaison pertinente est C contre *(B + chantier
    structurel)*. Le trésorier a comparé trois placements pour résoudre un problème de passif.

    - Les 97 % sont un chiffre du vendeur, et 12 % de sa propre distribution conduisent à la cessation
    de paiements.

    - Le calendrier est inversé. C produit son résultat à sept ans. La caisse rencontre son problème de
    trésorerie à quatre ans. **Même dans la branche gagnante, le remède arrive après le décès.**


    ---


    ## 8. Recomposition — ce que je propose au trésorier et au président


    Je ne demande pas au conseil de désavouer le trésorier. Sa lecture du problème est juste ; c''est
    l''instrument qui est disqualifié. Je propose donc :


    - Que son constat — *A et B sont insuffisants à horizon 2035* — soit inscrit tel quel en préambule
    de la résolution.

    - Qu''il **préside le comité actif-passif** créé par cette délibération et pilote le chantier structurel,
    avec les moyens correspondants.

    - Que la question d''un produit structuré soit **rouverte à 12 mois**, sur des paramètres définis
    à l''avance : nominal ≤ 1,5 M€, rang senior, valorisation ou marché secondaire existant, distribution
    vérifiée par un tiers indépendant de l''émetteur, avis prudentiel écrit préalable. Si ces conditions
    sont réunies, je soutiendrai l''opération.


    ---


    ## 9. Ce sur quoi j''engage la caisse


    **Je m''engage sur :**


    1. La mise en œuvre de B dans les 30 jours, plancher automatique inscrit au mandat.

    2. **Étude actif-passif complète — projection de trésorerie mensuelle à 10 ans — remise au conseil
    sous 90 jours.**

    3. **Audit AT-MP/FIVA des trois derniers exercices, résultat chiffré sous 120 jours**, avec cible
    de récupération et dispositif d''accompagnement des affiliés.

    4. Ouverture de discussions de rapprochement avec au moins trois organismes, point d''étape à 6 mois.

    5. Proposition de trajectoire de cotisations au conseil d''automne.

    6. **Rendez-vous à 12 mois :** si la trajectoire consolidée ne montre pas une réduction d''au moins
    40 % du déficit technique annuel, je le dis au conseil sans l''atténuer, et je propose la mise à l''étude
    d''une fusion ou d''un transfert de portefeuille pendant qu''il reste 15 M€ de réserve — c''est-à-dire
    tant que la caisse a encore quelque chose à négocier.


    **Ce qui me ferait changer d''avis sur C :** une vérification indépendante de la distribution 88/9/3
    par un tiers sans lien avec l''émetteur, un rang senior confirmé, une liquidité secondaire contractuelle,
    et un nominal ramené sous 1,5 M€. Aucune de ces conditions n''est réunie aujourd''hui, et aucune ne
    peut l''être avant jeudi.


    **Si le conseil vote C malgré cet avis**, je demande, avant le vote et non après :


    - un avis écrit du commissaire aux comptes sur la conformité de l''opération aux règles de dispersion
    et de liquidité ;

    - la clarification écrite par l''émetteur du caractère distribué ou capitalisé du rendement, et du
    rang de la créance ;

    - l''inscription au procès-verbal du vote nominatif de chaque administrateur, ainsi que de mon opposition
    motivée.


    Ce n''est pas une manœuvre. Un administrateur qui approuve une concentration de 78 % sur une contrepartie
    unique non cotée et non liquide engage sa responsabilité personnelle, et chacun a le droit de savoir
    ce qu''il signe.


    ---


    ## Projet de résolution soumis au vote


    > Le conseil, constatant que les options A et B ne referment pas à elles seules l''écart entre la
    dérive des dépenses et le rendement de la réserve à horizon 2035 :

    > **(1)** rejette l''option C ;

    > **(2)** approuve l''option B à hauteur de 40 % de la réserve, assortie d''un plancher de liquidation
    automatique à 15,5 M€ de réserve consolidée ;

    > **(3)** maintient le solde en obligations d''État ;

    > **(4)** institue un comité actif-passif présidé par le trésorier ;

    > **(5)** mandate la direction générale pour l''audit AT-MP/FIVA et l''ouverture de discussions de
    rapprochement, avec point d''étape à 6 mois et clause de revoyure à 12 mois.


    ---


    **En un mot au conseil :** le trésorier propose de résoudre un déficit de 1 M€ par an en mettant 13,7
    M€ en jeu sur un produit que nous ne pourrions ni vendre, ni valoriser, ni quitter pendant sept ans.
    Le risque que court la caisse n''est pas de mourir lentement — elle a neuf ans devant elle. Il est
    de disparaître un matin de 2032, en laissant 4 200 affiliés que personne d''autre n''a accepté d''assurer.


    *Je peux produire d''ici mercredi une version mise en page pour envoi aux administrateurs, ainsi que
    la projection de trésorerie mensuelle sous les trois options si vous voulez la présenter en séance.*

    '
