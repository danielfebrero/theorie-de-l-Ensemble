  text: '# Recommandation au conseil — séance de jeudi


    ## Verdict


    **A : conservée comme socle, mais elle n''est pas une stratégie. B : retenue, calibrée, réversible.
    C : je ne la soumets pas au vote — et je considère que le conseil n''a pas le pouvoir de l''adopter.**


    Ce sur quoi j''engage la caisse, ce n''est aucune de ces trois options : c''est **le dépôt d''un dossier
    de transfert auprès de l''Union mutualiste de l''Atlantique avant la fin du trimestre.** Le reste
    en découle.


    ---


    ## 1. Option C — refus, sans contrepartie négociable


    La distribution communiquée comporte une branche à 3 % qui ramène la réserve à 4,7 M€. Les statuts
    déclenchent alors la **liquidation de plein droit**. Il n''y a pas de retour depuis cet état : ce
    ne sont pas 3 % de perte, c''est 3 % de disparition de la couverture pour 4 200 affiliés dont aucun
    assureur n''a accepté de coter le risque en 2025. Ils ne se réassurent nulle part. **Cette branche
    est irrécupérable, et ce ne sont pas les administrateurs qui l''encaissent, ce sont les affiliés.**
    Aucune espérance ne compense cela, parce que la caisse ne joue qu''une fois : les 10 000 simulations
    du trésorier décrivent 10 000 caisses, pas neuf ans de la nôtre.


    Trois défauts s''ajoutent, et chacun suffirait :


    - **La distribution est celle de l''émetteur.** Elle décrit *son* défaut à 3 %, pas le risque de la
    note. Il n''y a aucune branche « l''émetteur survit et la note ne paie rien ou perd du principal »
    — or un coupon de 14 % d''un émetteur A− n''existe pas sans risque vendu à l''intérieur de la structure.
    Une distribution à trois branches dont aucune n''est une perte hors défaut n''est pas une distribution,
    c''est une plaquette.

    - **C éteint la liquidité avant même le défaut.** 14,4 M€ bloqués laissent 4,0 M€ disponibles contre
    un déficit de trésorerie de 1,0 M€ la première année, croissant de 4,3 %/an : **le disponible est
    épuisé en année 3 ou 4**, dans 100 % des trajectoires, y compris les 88 %. Sauf si la note distribue
    le coupon en cash chaque année — ce que le dossier ne dit pas. Personne autour de la table ne connaît
    la réponse à cette question, et elle est plus déterminante que l''espérance de rendement.

    - **C ferme la seule sortie.** Voir §3.


    Enfin, et je demande une confirmation juridique écrite avant jeudi : une concentration de **78 % de
    la réserve sur un émetteur unique, non coté, illiquide 7 ans** est, à ma lecture, incompatible avec
    les obligations de placement prudent qui s''imposent à nous. Si c''est le cas, un vote majoritaire
    ne crée pas cette permission — il expose personnellement les administrateurs qui l''émettent. Que
    deux caisses comparables aient souscrit l''an dernier n''est pas un précédent, c''est une exposition
    corrélée.


    ## 2. Option B — retenue, mais pour ce qu''elle est


    Pire décile : −2,6 M€, réserve à 15,8 M€, soit 4,8 M€ au-dessus du seuil statutaire, coté quotidiennement,
    sortie à tout moment. **C''est de la variance soutenable, pas de la ruine.** Je ne l''écarte pas et
    je ne la sur-avertis pas.


    Mais le trésorier a raison sur un point qu''il faut retourner contre sa propre conclusion : B seule
    ne referme pas l''écart. **Aucune allocation ne le referme.** L''écart n''est pas un problème de rendement,
    c''est un problème de flux : 1,0 M€ de déficit annuel, en progression de 4,3 %, contre un surcroît
    de rendement de B d''environ 0,8 M€/an qui, lui, ne progresse pas. Le déficit passe devant en année
    3. **On ne finance pas un déficit structurel de cotisation par une prise de risque sur l''actif —
    on ne fait que déplacer la date et ajouter une variance.**


    Je propose donc B **à 30 % (5,5 M€) et non 40 %**, sans instrument bloqué ni non coté, la différence
    servant à préserver la liquidité pendant l''instruction du dossier de transfert.


    ## 3. Ce que la note du trésorier ne regarde pas : l''horloge


    L''UMA n''a jamais accepté un transfert dont la réserve représentait moins de trois années de prestations.
    Ce seuil vaut **16,2 M€ aujourd''hui — et il monte de 4,3 % par an avec les prestations, pendant que
    la réserve baisse.** Les deux courbes se croisent :


    | | Réserve | Seuil UMA (3× prestations) | Éligible |

    |---|---|---|---|

    | Aujourd''hui | 18,4 | 16,2 | oui, marge 2,2 |

    | Dans 1 an | 17,7 | 16,9 | oui, marge 0,8 |

    | Dans 2 ans | ~17,0 | 17,6 | **non** |


    **La fenêtre se ferme dans 12 à 20 mois. Le comité d''engagement instruit en 12 à 18 mois.** Nous
    sommes déjà à la limite. Cette conclusion tient dans toutes les hypothèses testées, y compris avec
    B, parce que B déplace la réserve de quelques centaines de milliers d''euros et le seuil, lui, monte
    de 700 000 € par an.


    C rend ce transfert impossible : une réserve à 78 % illiquide et bloquée 7 ans n''est pas transférable.
    **C ne fait pas courir un risque de 3 % à la caisse — C échange un horizon de neuf ans avec une porte
    de sortie contre sept ans sans porte.**


    **Divergence à trancher avant tout le reste :** la projection interne annonce le seuil de 11 M€ dans
    neuf ans. À cotisations constantes — ce qu''elles sont depuis le rejet de 2024 — je trouve **le seuil
    franchi en année 6**. Les neuf ans ne s''obtiennent qu''en supposant les cotisations indexées à ~4,3
    %/an. Si c''est bien l''hypothèse du modèle, elle est fausse depuis l''assemblée de 2024, et le conseil
    délibère sur un horizon supérieur de trois ans à l''horizon réel. **À vérifier avant jeudi ; c''est
    la première ligne de l''ordre du jour.**


    ## 4. Ce sur quoi j''engage la caisse


    Je n''engage pas la survie de la caisse comme institution. J''engage **la continuité de la couverture
    des 4 200 affiliés**, qui peut survivre à la disparition de la caisse par transfert, et qui ne survit
    pas à une liquidation de plein droit.


    1. **Dépôt du dossier UMA avant le 31 décembre 2026**, avec demande écrite dès cette semaine sur deux
    points : l''éligibilité s''apprécie-t-elle à la date de dépôt ou à la date de décision, et un portefeuille
    comportant une poche cotée est-il recevable.

    2. **Aucun instrument bloqué, non coté ou à émetteur unique** tant que le dossier de transfert est
    ouvert. Engagement de mandature, pas de conjoncture.

    3. **B à 30 %**, exclusivement coté et liquidable sous 48 h.

    4. **Un plan de flux présenté à l''AG de printemps**, portant sur les recettes et sur les dépenses.
    Sur les dépenses, une piste que le dossier n''explore pas et qui peut être significative compte tenu
    de notre profil : la part des prestations liées à des pathologies de l''amiante susceptibles d''être
    prises en charge au titre des maladies professionnelles ou par le FIVA plutôt que par nous. Je ne
    dispose pas des données pour la chiffrer — c''est une hypothèse à instruire, pas un acquis, et je
    demande son chiffrage sous 60 jours.

    5. **Transparence intégrale envers les affiliés** sur le seuil de 11 M€ et sur l''horloge du transfert.
    Ils n''ont pas rejeté une hausse de 6 % en 2024 contre leur intérêt : ils l''ont rejetée sans qu''on
    leur dise ce qu''ils achetaient avec.


    ## 5. Au trésorier et aux cinq cosignataires


    Leur diagnostic est juste et il est le seul du dossier : le statu quo est une mort lente, et A n''est
    pas une réponse. Je ne conteste que l''instrument. Je propose donc, et j''y tiens :


    - **le trésorier pilote le dossier de transfert** et conduit la négociation avec l''UMA — c''est le
    sujet réel, et c''est lui qui a vu qu''il fallait agir ;

    - **une commission de quatre affiliés, dont deux malades reconnus, siège au conseil avec voix délibérative
    sur les termes du transfert** — pas consultative. Ce qui se décide ici décide de leur couverture ;
    le pouvoir de dire non leur revient ;

    - **l''assemblée générale tranche la hausse de cotisation**, avec les deux trajectoires chiffrées
    et la date de fermeture de la fenêtre UMA sur la convocation. Progressive, différenciée par âge, avec
    clause d''extinction au transfert.


    ## 6. Repli — déclencheurs observables


    - Réserve sous **16,5 M€** à une clôture trimestrielle → gel de toute prise de risque nouvelle, AG
    extraordinaire sous 30 jours.

    - **Refus écrit de l''UMA d''ouvrir un dossier**, ou dossier non déposé au 31/12/2026 → bascule vers
    un transfert négocié auprès d''autres unions ou une dissolution organisée à nos conditions, tant que
    la réserve le permet.

    - Réserve sous **13 M€** → intégralité en obligations d''État liquides, plus aucune marge de gestion
    discrétionnaire.


    ## 7. Ce qui renverserait cette recommandation


    - Le suivi des prestations sur deux semestres ressort à **≤ 1,5 %/an** au lieu de 4,3 % → l''urgence
    tombe, les neuf ans redeviennent vrais, la fenêtre de transfert se rouvre.

    - L''UMA confirme par écrit qu''elle refuse d''instruire **quelle que soit la réserve** → la stratégie
    de transfert meurt, et le conseil doit alors arbitrer entre une hausse de cotisation lourde et une
    dissolution ordonnée. Pas entre A, B et C.

    - Sur C : rien. Un coupon distribué en cash, une note transférable, une confirmation indépendante
    du 3 % — chacun de ces éléments améliorerait le dossier, aucun ne supprime une branche irrécupérable
    à 78 % de la réserve. Ce qui serait discutable, c''est une exposition dont le pire cas laisse la réserve
    au-dessus de 16 M€, soit **2,3 M€ de nominal au maximum** — et encore, pas sous forme bloquée sept
    ans tant que le transfert est la stratégie.


    ## Première action


    Lundi matin : courrier au comité d''engagement de l''UMA posant les deux questions du point 1, et
    demande au directeur financier de la trajectoire de réserve à cotisations constantes. Ces deux réponses
    valent plus que le vote de jeudi.


    ---


    **Note sur les chiffres.** Les trajectoires ci-dessus sont recalculées à partir des seules données
    de la note (5,4 M€ à +4,3 %, 4,4 M€ constants, 18,4 M€, +1,8 %) ; l''écart avec la projection interne
    à neuf ans vient d''une hypothèse d''indexation des cotisations que je n''ai pas pu vérifier faute
    d''accès au modèle. La piste maladies professionnelles / FIVA est une hypothèse non chiffrée.

    '
