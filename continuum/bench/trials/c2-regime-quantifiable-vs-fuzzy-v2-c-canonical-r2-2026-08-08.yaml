response:
  text: '# Note au conseil — arbitrage de l''enveloppe 900 000 €


    **Jeudi — décision demandée sur deux dossiers**


    ---


    ## 1. Les deux dossiers ne sont pas en concurrence


    C''est le point à trancher en premier, avant tout classement. Le parc complet (620 000 €) et l''intégralité
    des dispositifs de succession qualité (195 000 €) totalisent **815 000 €** — l''enveloppe les couvre
    tous les deux. Il n''y a pas d''arbitrage A contre B. La vraie question est : **le parc complet vaut-il
    620 000 € ?** Sur les chiffres du dossier, la réponse est non — mais trois machines sur six, oui.


    ## 2. Dossier B — décision : oui, les deux dispositifs, engagés cette semaine


    **Promotion de l''adjointe (45 000 €) *et* mission de transition du titulaire (90 000 €).** Ce ne
    sont pas deux options concurrentes : c''est un recouvrement de 11 mois avant le départ, puis 12 mois
    de filet après. On achète 23 mois de transfert pour 135 000 €. J''ajoute **60 000 €** de transfert
    institutionnel : co-signature des audits, présentation formelle de l''adjointe à l''organisme notifié
    avant le départ, visites conjointes chez les deux clients hospitaliers. Total **195 000 €**.


    **Recrutement externe (280 000 €) : non retenu.** Il coûte deux fois plus, arrive au mieux au moment
    du départ, et n''apporte ni la reconnaissance de l''organisme notifié ni la relation client — c''est-à-dire
    exactement les deux choses que nous perdons.


    **Sur la cotation du cabinet RH (35 %, 4,2 M€, 7,5/10) : je recommande de ne pas l''utiliser.** Trois
    consultants sans expérience du dispositif médical produisent en atelier des chiffres qui ont l''apparence
    d''une mesure sans en avoir la substance. Le débat de jeudi ne doit pas porter sur la justesse de
    35 %.


    **Et il n''en a pas besoin.** L''exposition, c''est 31 % du chiffre d''affaires, soit plusieurs millions
    d''euros par an, face à une dépense de 195 000 €. La décision est la même que la probabilité de rupture
    soit de 5 %, de 35 % ou de 50 %. Une décision qui ne change pas sur toute la plage plausible n''a
    pas besoin d''estimation fine.


    ## 3. Dossier A — décision : trois machines maintenant, trois sous condition


    Les chiffres audités sont solides, et c''est précisément pourquoi il faut les lire jusqu''au bout
    :


    - 362 heures d''arrêt par an, 42 600 € de coût direct, plus 13 800 € de marge perdue (362 h × 38 €)
    → **environ 56 000 € par an**.

    - Rembourser 620 000 € sur les 7 ans de garantie exige **88 600 € par an**. Il manque environ 32 000
    € par an, qui devraient venir du gain de rebut (4,1 % → 1,2 %). **Le dossier ne chiffre pas le volume
    annuel produit** : ce gain n''est donc pas vérifiable en l''état.

    - Sur les seuls gains mesurés, le retour est à 11 ans, pour une garantie de 7 ans.


    **Conséquence : on ne renouvelle pas les six machines parce que le calcul de rendement le justifierait
    — il ne le justifie pas.** On renouvelle celles qui concentrent les pannes. La maintenance est horodatée
    et auditée : le classement des 6 machines par heures d''arrêt existe. S''il est concentré comme il
    l''est presque toujours, trois machines portent l''essentiel des 1 810 heures et rendent environ 39
    000 € par an pour 310 000 € — plus la couverture d''une panne terminale à 14 ans.


    **Deux exigences avant signature.** Le fournisseur garantit 96 % de disponibilité : sur nos volumes,
    notre parc de 14 ans est déjà à environ 96 %. Cette clause, en l''état, ne garantit rien. Exiger le
    taux calculé sur nos heures d''ouverture réelles, et le volume annuel qui permet de chiffrer le gain
    de rebut. Ces deux chiffres se demandent en une semaine et changent le montant de la tranche 2.


    ## 4. Le tableau unique demandé


    Le voici — un seul classement, toutes lignes confondues, du plus au moins prioritaire. Un avertissement
    d''une ligne : **l''indicateur de classement n''est pas un rendement en euros.** Les lignes qualité
    n''ont pas de dénominateur — aucun précédent interne, aucun comparable sectoriel. Les classer par
    « rendement » supposerait un chiffre qui n''existe pas. Le classement retenu est *ce que coûte de
    ne pas le faire, rapporté à l''euro engagé* : il ne demande pas de connaître le numérateur avec précision,
    seulement de savoir qu''il est très supérieur.


    | # | Ligne | Coût | Gain mesuré | Coût de l''inaction | Réversible |

    |---|---|---|---|---|---|

    | 1 | Promotion de l''adjointe | 45 000 € | 11 mois de recouvrement | Succession non identifiée à
    J+11 mois | Oui |

    | 2 | Mission de transition du titulaire | 90 000 € | 12 mois de filet | Savoir tacite de 22 ans perdu
    net | Oui |

    | 3 | Transfert institutionnel (organisme notifié, clients) | 60 000 € | — | Relation portée par une
    personne, pas par l''entreprise | Oui |

    | 4 | Machines — tranche 1 (3 plus défaillantes) | 310 000 € | ≈ 39 000 €/an | Pannes + risque de
    panne terminale | **Non** |

    | 5 | Machines — tranche 2 (3 restantes) | 310 000 € | < 17 000 €/an | Faible | **Non** |

    | 6 | Recrutement externe d''un directeur qualité | 280 000 € | — | — | Non retenu |


    Les lignes 1 à 3 passent devant la ligne 4 non parce qu''elles rapportent plus, mais parce qu''elles
    sont réversibles, dix fois moins chères, et qu''elles couvrent la seule exposition du dossier qui
    ne se rattrape pas.


    ## 5. Répartition proposée


    | Poste | Montant |

    |---|---|

    | Dossier B — dispositif complet | 195 000 € |

    | Dossier A — tranche 1, engagée maintenant | 310 000 € |

    | Dossier A — tranche 2, conditionnelle (décision avant le 30 novembre) | 310 000 € |

    | Réserve : pièces critiques des machines non renouvelées | 85 000 € |

    | **Total** | **900 000 €** |


    **Si la tranche 2 ne se justifie pas sur les données par machine, nous la laissons tomber.** Une ligne
    budgétaire perdue coûte 0 €. Une machine qui ne rembourse pas coûte 103 000 €. L''enveloppe non reconductible
    est une contrainte de calendrier, pas une raison d''acheter.


    ## 6. Ce qui nous ferait changer d''avis, et le repli


    **Ce qui renverse le dossier A :** si le classement par machine montre des pannes uniformément réparties,
    la tranche ciblée perd son intérêt — il faut alors soit les six, soit aucune, et ce sera un choix
    de risque d''obsolescence, pas de rendement.


    **Ce qui renverse le dossier B :** si l''organisme notifié confirme par écrit que la certification
    est adossée au système et non à une personne nommée, la mission de transition à 90 000 € devient discutable.
    À demander cette semaine — c''est un courrier.


    **Repli, dossier B.** Déclencheur observable : si à 4 mois du départ l''adjointe n''a pas conduit
    un audit de certification en première main et n''a pas été présentée à l''organisme notifié, on ne
    prolonge pas — on rouvre le recrutement externe immédiatement, en acceptant les 280 000 €. Ce point
    de contrôle est à mettre à l''ordre du jour du conseil de décembre.


    **Première action, lundi :** demander au fournisseur les deux chiffres manquants (disponibilité sur
    nos heures réelles, volume annuel), et à la direction qualité le classement des 6 machines par heures
    d''arrêt. Les trois arrivent avant fin de mois et fixent la tranche 2.

    '
