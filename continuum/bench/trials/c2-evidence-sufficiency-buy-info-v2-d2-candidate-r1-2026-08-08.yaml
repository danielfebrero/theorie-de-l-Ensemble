  text: 'L''écriture fichier est refusée également — voici la note directement.


    ---


    # NOTE AU COMITÉ DE DIRECTION — Contrat cellules 2027


    **Objet :** attribution du contrat cellules 2027 (72 000 unités)

    **Recommandation :** réserver la capacité Kelmar à J+18. Ne pas attribuer à Sinolux en l''état.

    **Échéance impérative :** J+18, ferme et non reportable.


    ## 1. L''économie de 230 400 € n''existe pas au taux de retour mesuré


    L''écart de prix cellule (3,20 €) ne se lit pas seul. Coût complet, retours inclus à 205 € par chargeur
    repris :


    | Coût complet 2027 | Kelmar 1,3 % | Sinolux 1,1 % | Sinolux 3,1 % |

    |---|---|---|---|

    | Achat cellules | 1 872 000 € | 1 641 600 € | 1 641 600 € |

    | Retours (nombre) | 936 | 792 | 2 232 |

    | Coût des retours | 191 880 € | 162 360 € | 457 560 € |

    | **Total** | **2 063 880 €** | **1 803 960 €** | **2 099 160 €** |

    | Écart vs Kelmar | — | **− 259 920 €** | **+ 35 280 €** |


    **Le seuil de bascule est un taux de retour Sinolux de 2,86 %.** Il monte à 3,22 % si l''on crédite
    intégralement le remplacement gratuit des cellules — 22,80 € par retour, soit 11 % d''un coût de 205
    €. La seule mesure indépendante disponible donne **3,1 %**, à l''intérieur de cette bande.


    Au taux mesuré, le résultat réel va de **− 35 280 € (perte)** à **+ 15 610 € (gain)** selon le traitement
    de la garantie. Dans l''hypothèse la plus favorable à Sinolux, l''économie vaut **un quinzième** de
    la ligne budgétaire. Les 230 400 € inscrits supposent implicitement que Sinolux retourne au même taux
    que Kelmar. Aucune source ne le soutient.


    ## 2. Nous avons deux sources, pas trois


    - **Sinolux, essais internes — 1,1 %.** Partie intéressée.

    - **Audit sectoriel de mars — 3,1 %.** Mesure indépendante, ligne comparable, même fournisseur.

    - **Cabinet Ferro, « environ 3 % ».** Sa note méthodologique indique qu''il travaille **sur l''échantillon
    de l''audit de mars**. Ce n''est pas une troisième mesure : c''est la même, reformulée.


    Le rapport n''est pas 2 contre 1. C''est **une mesure indépendante à 3,1 % contre une déclaration
    du vendeur à 1,1 %**.


    ## 3. La négociation elle-même est une donnée


    Sinolux refuse toute clause indexée sur le taux de retour — la seule qui lui coûterait quelque chose
    s''il se trompait. Il accepte le remplacement gratuit des cellules : 22,80 € par retour, quand le
    retour nous coûte 205 €. **Il prend 11 % du risque et décline les 89 % restants.** Un fournisseur
    qui croit à ses 1,1 % ne perd presque rien à signer l''indexation.


    ## 4. Le calendrier interdit d''acheter l''information


    Le test Vertex (34 000 €, ± 0,3 point) rend son résultat à J+63. La réservation Kelmar est ferme à
    J+18. **Le résultat arriverait 45 jours après l''expiration de la seule option réversible.** Payer
    34 000 € pour une information qui ne peut plus changer la décision 2027 n''a pas de valeur. Ne pas
    engager Vertex cette semaine sur ce motif.


    ## 5. Décision


    1. **Réserver Kelmar à J+18**, volume 2027 complet. Seule action qui protège le démarrage production
    à J+70 sans report du lancement.

    2. **Avant J+15, condition écrite à Sinolux :** prise en charge de 205 € par chargeur repris au-delà
    d''un taux de retour de 1,5 %. Accepté par écrit avant J+18, nous basculons : l''exposition est plafonnée
    et l''économie devient **garantie à 200 880 € minimum**. Coût de la démarche : un courrier.

    3. **Ouvrir la qualification Sinolux pour 2028 :** lot de qualification borné (sous réserve que Kelmar
    accepte une réservation partielle sans pénalité de prix — à vérifier avant J+18, sans jamais compromettre
    la réservation), et test Vertex lancé au T3 avec **co-financement Sinolux à 50 %**, contre un volume
    2028 engagé conditionné au résultat mesuré.


    Le point 3 donne à Sinolux une place réelle et engageante, pas une consultation, et donne à la direction
    financière un chemin vers l''économie — décalé d''un exercice, mais sécurisé.


    ## 6. Pire cas de l''option retenue


    Si Sinolux tenait réellement 1,1 %, nous renonçons à 259 920 € sur 2027. La perte est portée par la
    marge Nordwatt, sur un exercice, et reste récupérable puisque la qualification 2028 démarre immédiatement.
    Pas de branche irrécupérable de ce côté — ni, en toute honnêteté, de l''autre : le risque Sinolux
    se chiffre à environ **1 300 incidents clients supplémentaires**, sans possibilité de changer de source
    en cours d''année, la ligne Kelmar 2027 étant vendue à J+18. Soutenable dans les deux cas ; l''asymétrie
    porte sur la perte de l''option, pas sur le montant.


    ## 7. Ce qui renverserait cette décision


    Une mesure du taux de retour **indépendante de Sinolux et non dérivée de l''échantillon de mars**,
    disponible avant J+18, situant le taux sous 2,6 %. Ou l''acceptation écrite de la clause indexée.
    Rien d''autre.


    ## 8. Repli et déclencheur


    - Sinolux accepte la clause avant J+18 → attribution Sinolux, réservation Kelmar abandonnée.

    - Lot de qualification 2028 au-delà de 2,0 % de retours à six mois → abandon de Sinolux pour 2028.


    ## Première action — aujourd''hui


    Courrier à Sinolux (clause indexée à 1,5 %, réponse exigée à J+15) et confirmation à Kelmar de notre
    intention de réserver à J+18, avec demande de faisabilité d''une réservation partielle.


    ---


    Trois remarques hors note :


    - **Le nœud est arithmétique, pas psychologique.** Le seuil de 2,86 % et la mesure de 3,1 % sont assez
    proches pour que le traitement de la garantie change le signe du résultat. C''est pourquoi la note
    donne la fourchette (− 35 k€ à + 16 k€) plutôt qu''un chiffre unique : la conclusion robuste n''est
    pas « Sinolux coûte plus cher », c''est « l''économie budgétée est fausse d''un ordre de grandeur,
    quelle que soit l''hypothèse retenue ».

    - **La clause indexée est le vrai levier.** Elle coûte un courrier et vaut 230 400 €. Si Sinolux l''accepte,
    la recommandation s''inverse — et j''ai fixé le seuil à 1,5 % précisément pour qu''un fournisseur
    croyant à 1,1 % puisse signer sans difficulté.

    - **Sur Vertex**, je n''ai pas trouvé de moyen de faire arriver le résultat avant J+18 avec les données
    fournies. Si une version accélérée du protocole existe (échantillon réduit, précision dégradée à ±
    0,6 point), elle mériterait un appel dès aujourd''hui : à ± 0,6 point, un résultat à 1,5 % resterait
    décisif. Je n''ai pas d''élément permettant de dire si Vertex le propose.

    '
