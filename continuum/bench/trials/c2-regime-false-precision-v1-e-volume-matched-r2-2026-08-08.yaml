response:
  text: '## Note au comité — fermetures de magasins


    **Objet :** décision demandée mardi. **Réponse courte :** aucune fermeture ne rapportera les 300 000
    € demandés l''an prochain, et fermer les trois magasins déficitaires dégraderait le résultat du groupe.
    Un seul site — Vitry — mérite une décision, sous condition, d''ici 60 jours. Les 300 000 € doivent
    être cherchés ailleurs, et ils existent.


    ---


    ### 1. Le point qui change tout : les trois magasins « déficitaires » rapportent de l''argent


    Le résultat par magasin inclut une part des frais de siège et de logistique (6,4 M€ répartis au prorata
    du chiffre d''affaires). **Ces frais ne disparaissent pas quand un magasin ferme** : le siège, les
    entrepôts et les systèmes restent. Ils sont simplement réattribués aux magasins survivants.


    La bonne question n''est donc pas « ce magasin est-il négatif ? » mais « que perd le groupe le jour
    où il ferme ? »


    | Magasin | Résultat affiché | Quote-part siège | **Ce que le magasin apporte réellement** |

    |---|---|---|---|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |

    | **Total** | −288 000 € | 402 000 € | **+114 000 €** |


    Les trois sites couvrent leurs propres loyers, salaires et charges, et laissent 114 000 € pour financer
    le siège. Ils sont négatifs parce qu''on leur facture plus de siège qu''ils n''en dégagent — pas parce
    qu''ils coûtent de l''argent.


    **Conséquence directe :** fermer les trois ferait perdre 114 000 € de résultat récurrent, plus les
    coûts de fermeture, et les 402 000 € de frais de siège se reporteraient sur les 16 magasins restants
    (+6,7 % de quote-part chacun, environ 25 000 € par magasin). Au lieu de +300 000 €, on obtiendrait
    environ **−114 000 € avant coûts de sortie** — soit plus de 400 000 € d''écart avec l''objectif.


    **Et l''an prochain, le même exercice désignera de nouveaux « déficitaires »**, mécaniquement créés
    par la réattribution. C''est un engrenage, pas un diagnostic.


    ---


    ### 2. Magasin par magasin


    **Chambéry — dossier à clore.** Six ans de bail, aucune clause de sortie, 1,1 M€ d''indemnité, soit
    183 000 € par an sur la durée restante. Le magasin en apporte +32 000 €. Le magasin du réseau le plus
    proche est à 92 km : aucun report de clientèle n''est à espérer. Il faudrait que Chambéry détruise
    plus de 200 000 € par an pour que la sortie se justifie. **Recommandation : ne pas fermer, sujet clos
    pour cet exercice.**


    **Nîmes — mauvais sujet, bonne question.** Fermer un magasin dont on détient les murs ne rapporte
    rien tant qu''on ne vend pas. En revanche, 1,9 M€ immobilisés pour +19 000 € par an, c''est un mauvais
    emploi du capital : le même montant placé rapporterait quatre à cinq fois plus. **La vraie question
    est immobilière, pas commerciale, et la meilleure option est probablement la cession-bail** — on encaisse
    la valeur du bien et on garde le magasin, sa clientèle et sa contribution. À vérifier avant : un loyer
    interne est-il imputé à Nîmes ? S''il ne l''est pas, son résultat est déjà flatté par rapport aux
    magasins loués. Dans tous les cas, une opération immobilière ne produit pas 300 000 € de résultat
    courant l''an prochain.


    **Vitry — le seul candidat sérieux.** C''est le seul site dont on peut sortir sans indemnité, bail
    échu dans 7 mois, et le seul dont un magasin du réseau est à 14 km — donc le seul où une part réelle
    de la clientèle peut se reporter. Le calcul de décision tient en une ligne : **fermer Vitry est gagnant
    si (part du chiffre d''affaires qui se reporte à 14 km × taux de marge brute de Vitry) + coûts de
    structure réellement supprimés > 63 000 €.** Ce seuil est probablement atteint pour un report modeste
    — le contrôle de gestion peut le chiffrer en une journée. Deux réserves avant de trancher :

    - **18 % des entrées de Vitry sont des retraits de commandes web**, dont le chiffre d''affaires est
    logé chez e-commerce. Fermer Vitry ne fait pas disparaître ce flux : il faut savoir ce que son remplacement
    coûtera à l''entité e-commerce, et l''inscrire au débit de la décision.

    - Nous n''avons **jamais fermé de magasin** : nous n''avons ni taux de report observé, ni coût de
    fermeture éprouvé. Toute estimation est un pari.


    ---


    ### 3. Ce que je recommande de décider mardi


    1. **Chambéry et Nîmes : pas de fermeture.** Chambéry est arithmétiquement impossible. Nîmes bascule
    sur un arbitrage immobilier (cession-bail à instruire, calendrier propre).

    2. **Vitry : accord de principe sur le non-renouvellement du bail**, décision définitive au comité
    de [date, à fixer au plus tard 60 jours avant l''échéance de préavis], sur la base des deux chiffrages
    ci-dessous. Si le seuil de 63 000 € n''est pas franchi, on renouvelle.

    3. **Découpler l''objectif des 300 000 € du sujet « fermetures »** : ils ne s''y trouvent pas.


    **Où sont réellement les 300 000 € :** dans les 6,4 M€ de frais de siège et de logistique — 4,7 %
    de réduction suffisent. Contrairement aux fermetures, cette économie est immédiate, sans indemnité,
    sans perte de clientèle et sans risque social multi-sites. C''est le chantier à ouvrir mardi, et le
    seul qui tient le calendrier de l''actionnaire.


    ---


    ### 4. Ce qu''on engage d''ici là (30 jours)


    | # | Action | Livrable |

    |---|---|---|

    | 1 | Découper les 6,4 M€ de frais de siège en **coûts évitables / non évitables**, magasin par magasin
    | Combien disparaît vraiment si Vitry ferme — le chiffre qui valide ou tue la décision |

    | 2 | Exploiter la **fermeture de Nîmes en mars 2024** (5 semaines) : totaux mensuels des magasins
    voisins | Première estimation réelle de notre taux de report |

    | 3 | Croiser les **cartes de fidélité** : part de clients Vitry ayant déjà acheté au magasin à 14
    km | Fourchette haute de report |

    | 4 | Chiffrer avec e-commerce le **remplacement du point retrait de Vitry** | Coût à imputer à la
    fermeture |

    | 5 | Chiffrer le **coût social et de remise en état** d''une fermeture de site | Notre premier repère,
    inexistant à ce jour |

    | 6 | Instruire la **cession-bail de Nîmes** (valorisation, loyer résultant) | Décision séparée, calendrier
    propre |

    | 7 | Ouvrir le **plan de réduction des frais de structure de 300 000 €** | Feuille de route à 30
    jours |


    **Précautions sur ces chiffres, à dire au comité :** les compteurs d''entrée mesurent des entrées,
    pas des acheteurs, à ±2 %, et 18 % de celles de Vitry sont des retraits web — tout argument fondé
    sur la fréquentation doit être retraité avant usage. Les porteurs de carte (23 % des tickets) sont
    par construction les clients les plus fidèles et les plus mobiles : le taux de report qu''ils suggèrent
    est un **plafond**, pas une prévision. L''épisode de Nîmes n''est disponible qu''en totaux mensuels,
    sur un seul événement vieux de deux ans, en basse saison : il donne une fourchette, pas un chiffre.


    ---


    ### 5. L''objection la plus forte à cette note


    *« La comptabilité analytique est certifiée sur trois exercices. Trois ans de rouge, c''est trois
    ans de subvention. Raisonner en contribution, c''est l''argument qui permet de ne jamais rien fermer
    — et les frais de siège sont du cash bien réel. »*


    C''est juste sur un point : les 6,4 M€ sont du cash, et c''est précisément pour cela qu''il faut les
    attaquer directement plutôt qu''espérer les faire disparaître en fermant des magasins. Le test est
    vérifiable, et je propose de s''y tenir : **si la direction financière identifie 181 000 € de coûts
    de siège et de logistique qui disparaissent réellement le jour où Vitry ferme, alors Vitry doit fermer
    et cette note a tort.** Ce chiffrage est l''action n°1 ci-dessus. À défaut, fermer revient à supprimer
    114 000 € de contribution pour ne rien économiser.


    **Condition d''arrêt :** si les actions 1 à 4 ne sont pas livrées à [date], nous renouvelons le bail
    de Vitry par défaut — nous ne prendrons pas une décision irréversible sur des estimations non vérifiées.


    ---


    Deux remarques sur la commande : le catalogue de stations de mesure joint en annexe n''a aucun lien
    avec ce dossier et n''a pas été utilisé. Et je n''ai pas de chiffre d''affaires absolu — les parts
    de chaque site (Vitry 2,8 %, Chambéry 2,0 %, Nîmes 1,5 % du réseau) sont déduites de la clé de répartition
    des frais de siège, ce qui suffit aux conclusions ci-dessus mais pas au calcul du seuil de report
    de Vitry, qui demande sa marge brute réelle.

    '
