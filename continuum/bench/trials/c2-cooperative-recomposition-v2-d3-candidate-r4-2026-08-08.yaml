response:
  text: '# Position de la présidence — Commission locale de l''eau du bassin de la Vèze

    *Séance du jeudi — répartition d''étiage*


    ---


    ## 1. Ce qui n''est pas mis au vote


    Les 180 L/s de débit réservé sont fixés par arrêté préfectoral. La commission n''a pas compétence
    pour les abaisser : seule une dérogation du préfet le pourrait, et le rapport hydrobiologique du 12
    juin la rendrait indéfendable — deux frayères asséchées et une population de truites non reconstituable
    à l''échelle d''une décennie.


    C''est la seule perte du dossier qui ne se rachète pas. Une récolte perdue coûte 4,1 M€ et se rejoue
    en 2027 ; une frayère détruite ne se rejoue pas, et aucun fonds départemental ne la rachète. Je ne
    propose donc **aucune** répartition qui descende sous 180.


    **Reste à partager : 230 L/s pour 390 L/s demandés.**


    ## 2. Le chiffre de 160 L/s n''est pas fiable, et ce n''est pas un détail


    Trois trous dans le dossier, tous comblables en moins de trois semaines :


    | Inconnue | État | Enjeu |

    |---|---|---|

    | **Le capteur** | Station unique, étalonnage 2023 | Une dérive de 10 % déplace le déficit de ±40
    L/s. Nous arbitrons 570 L/s sur un instrument non vérifié depuis deux ans. |

    | **Le réseau de Ferney** | Rendement inconnu | 150 L/s pour 9 200 habitants = **1 409 L/hab/jour**,
    contre ~150 L en moyenne nationale. Facteur ~9. |

    | **Les parcelles** | Aucune donnée | Ni cultures, ni stades, ni compteurs. La perte annoncée de 4,1
    M€ est invérifiable — et inenforçable comme quota. |


    Le deuxième point est le plus lourd. Même en supposant des usages non domestiques et un réseau médiocre,
    l''écart reste inexpliqué sur plusieurs dizaines de L/s. **Une part significative des 160 L/s manquants
    fuit peut-être d''une canalisation.** Je ne l''affirme pas : je constate que personne dans cette salle
    ne peut le démenti, et que la régie refuse d''ouvrir la discussion.


    Deux remarques d''équité, dans l''autre sens. Les 240 L/s demandés par les maraîchers représentent
    3,3 mm/jour sur 620 ha — soit environ **deux tiers** de l''évapotranspiration de saison. Leur demande
    n''est pas gonflée ; c''est déjà une dose de restriction. Ce qui reste non démontré, c''est le caractère
    binaire de la perte : l''irrigation ne fonctionne pas par falaise, et « en dessous de 240, tout est
    perdu » est une affirmation, pas une mesure.


    ## 3. Répartition proposée


    **Deux paliers, l''écart entre les deux étant financé par ce que le réseau rend.**


    | | Réservé | Régie | Maraîchage | Total |

    |---|---|---|---|---|

    | **Palier 1** — immédiat | 180 | **135** | **95** | 410 |

    | **Palier 2** — J+10, si rendement < 75 % | 180 | **115** | **115** | 410 |


    Les 15 L/s retirés à la régie au palier 1 ne touchent **aucun robinet, aucun lit d''EHPAD** : arrêté
    municipal interdisant arrosage des espaces verts, lavage de voirie, piscines et fontaines, plus modulation
    de pression nocturne. Ce sont des pertes et des usages d''agrément, pas de l''eau bue.


    Le passage au palier 2 est conditionné à une seule chose : la campagne de débit de nuit sectorisé.
    Si le rendement du réseau est bon, la régie garde 135 et je le dirai publiquement. S''il est mauvais,
    elle descend à 115 — et **chaque litre récupéré sur les fuites va à 100 % à l''irrigation** tant que
    dure la crise.


    C''est l''articulation centrale du dispositif : les maraîchers ont désormais intérêt à ce que la campagne
    fuite réussisse, et la régie a intérêt à coopérer plutôt qu''à subir une coupe forfaitaire.


    ## 4. Le mode d''allocation vaut plus que les litres


    C''est le point que je défendrai le plus fermement.


    À 95 L/s, le secteur dispose de 41 % de la dose demandée. Répartie uniformément sur 620 hectares,
    cette dose ne sauve **rien** : sous-irriguer partout, c''est perdre partout, et le scénario à 4,1
    M€ devient auto-réalisateur. Concentrée sur 40 % de la surface à dose pleine, elle sauve à peu près
    40 % de la production — et les emplois saisonniers qui vont avec, car ils sont attachés aux hectares
    réellement conduits jusqu''à la récolte.


    **Le vrai levier de la commission n''est pas le nombre de litres. C''est l''autorisation, l''organisation
    et le financement de la concentration.**


    D''où la réponse à la question du règlement intérieur : **volume global par usage** comme plafond
    opposable au barrage, **plus** quotas individuels à l''intérieur de l''enveloppe agricole à compter
    de J+10 — pas avant, parce que sans compteurs un quota individuel est inapplicable et le dire vaut
    mieux que le feindre. Dans l''intervalle, plafond collectif avec clause de responsabilité collective
    : dépassement une semaine, enveloppe réduite d''autant la semaine suivante.


    **Règle de répartition interne** (socle + hectare, volumes hebdomadaires) :


    | | Socle / exploitation | Part à l''hectare | Exploitation 10 ha | Exploitation 50 ha |

    |---|---|---|---|---|

    | Palier 1 (95 L/s) | 550 m³ | 62 m³/ha | 1 170 m³ → **5,0 ha** à dose pleine | 3 650 m³ → **15,6
    ha** |

    | Palier 2 (115 L/s) | 650 m³ | 76 m³/ha | 1 410 m³ → **6,0 ha** | 4 450 m³ → **19,0 ha** |


    Le socle protège les 28 petites exploitations d''un effacement total ; la part à l''hectare préserve
    la capacité productive des six grandes. Six exploitations détiennent 48 % de la surface : une répartition
    purement proportionnelle leur donnerait 48 % de l''eau, une répartition égalitaire par ferme leur
    en donnerait 18 %. Le socle place le curseur entre les deux, et je l''assume comme un choix, non comme
    une déduction.


    **Quotas transférables**, enregistrés à la commission, pour la saison seulement. Un exploitant dont
    la culture est déjà perdue doit pouvoir céder son volume à un voisin dont la culture est sauvable.
    C''est ce qui transforme un rationnement en réorganisation.


    Enfin : **la profession fixe elle-même sa règle interne** si elle en propose une autre à la majorité
    qualifiée sous 7 jours. Je propose le socle+hectare comme règle par défaut, pas comme verdict.


    ## 5. Les 600 000 €


    Pas de la compensation d''abord. De la mesure et des litres d''abord.


    | | Montant | Délai |

    |---|---|---|

    | Étalonnage station Sarcelle + point de contrôle aval indépendant + jaugeages contradictoires hebdomadaires
    | 25 k€ | 72 h |

    | Compteurs sur les 34 prises d''irrigation | 70 k€ | 10 j |

    | Recherche de fuites sectorisée + réparations prioritaires réseau Ferney | 230 k€ | 10–25 j |

    | Rachat volontaire de quota / gel de parcelles, priorité aux plus petites exploitations | 275 k€
    | continu |

    | **Total** | **600 k€** | |


    Le fonds est mobilisable sous quinze jours ; les 25 k€ de métrologie doivent être avancés sur la trésorerie
    de la commission dès vendredi, sans attendre.


    Le rachat volontaire fait double emploi utile : il compense **et** il concentre. Un exploitant payé
    pour geler des parcelles libère du volume pour celui qui peut aller jusqu''à la récolte.


    ## 6. La règle de sortie — le défaut de 2022


    Le dispositif de 2022 a échoué le 11 août pour trois raisons nommables : pas de persistance (48 h),
    pas d''hystérésis (même seuil à l''entrée et à la sortie), pas de progressivité (retour intégral d''un
    coup). Un orage n''est pas une recharge.


    Nouvelle règle :


    - **Seuil de sortie ≠ seuil d''entrée.** On restreint à 450 L/s ; on ne relâche qu''à partir de **700
    L/s**.

    - **Persistance : 10 jours consécutifs**, pas 48 heures.

    - **Deux points de mesure indépendants**, sur relevés postérieurs à l''étalonnage.

    - **Retour en trois paliers** de +25 % de quota, sept jours chacun, avec retour automatique au palier
    inférieur si le débit repasse sous 700 pendant 3 jours.


    ## 7. Échelle de crise — annoncée d''avance, pas découverte le jour venu


    Les maraîchers ont quitté la salle et la régie refuse de discuter : c''est le même geste, refuser
    d''être la variable d''ajustement. La réponse n''est pas de les convaincre, c''est de supprimer la
    discrétion.


    | Débit entrant (2 mesures, 3 jours consécutifs) | Réservé | Régie | Irrigation |

    |---|---|---|---|

    | ≥ 410 | 180 | 135 → 115 | 95 → 115 |

    | < 380 | 180 | 130 | 70 |

    | < 360 | 180 | 130 | 50 |

    | < 340 | 180 | 130 | 30 |

    | < 310 | 180 | 130 | **0** + saisine préfectorale, citernage EHPAD |


    L''ordre de sacrifice est écrit : irrigation, puis usages municipaux non essentiels, **jamais** le
    réservé, **jamais** le socle sanitaire. Et les 4 jours de réserve tampon de Ferney sont eux-mêmes
    une vulnérabilité : je demande la contractualisation immédiate d''une interconnexion ou d''un citernage
    de secours, avant d''en avoir besoin.


    ## 8. Ce que je dis à chaque partie


    **À la régie.** Votre dotation sanitaire est garantie sans condition et par écrit, et vous restez
    servie en priorité absolue à tout palier de dégradation. C''est exactement ce que vous exigiez. En
    échange, je veux votre rendement de réseau et vos débits de nuit sectorisés sous 7 jours. Si vos 150
    L/s sont justifiés, vous les récupérez et je porterai publiquement la correction. S''ils ne le sont
    pas, vous ne pouvez pas demander à 34 exploitations de renoncer à leur récolte pour couvrir des fuites
    que vous refusez de mesurer.


    **Aux maraîchers.** Votre demande de 240 L/s n''est pas excessive à l''hectare — c''est déjà une dose
    de restriction, et je le dirai à la presse. Mais elle est supérieure à ce qui existe, et je ne peux
    pas voter une eau qui n''est pas dans la rivière. Ce que je peux vous donner, c''est le droit de concentrer,
    des quotas transférables, la maîtrise de votre règle interne, la totalité des litres récupérés sur
    le réseau, et 275 k€ pour que ceux qui renoncent ne soient pas ruinés. La perte réaliste sous ce dispositif
    est de l''ordre de 2,3 M€, pas de 4,1 — mais seulement si vous concentrez. Si vous étalez, vous obtiendrez
    les 4,1 M€ que vous annoncez.


    **Sur le cadre aval.** Il n''a pas de siège dans cette salle ; l''arrêté préfectoral est sa seule
    voix. Jaugeage hebdomadaire au point de contrôle aval, publié. Le seul usage dont le plancher n''est
    pas négociable est aussi le seul qui ne peut pas venir plaider.


    **À la presse.** Le dossier n''est pas « les paysans contre les robinets ». C''est 570 demandés sur
    410 disponibles, mesurés par une station non étalonnée depuis 2023, avec zéro compteur d''un côté
    et un rendement de réseau inconnu de l''autre. Une part du litige porte sur de l''eau que personne
    n''utilise.


    ## 9. Le meilleur argument contre ma position


    Je coupe la régie de 10 % puis 23 % sur la base d''un calcul par habitant, dans une commission qui
    n''a pas plus de données sur le réseau que sur les parcelles. Si la régie dessert des industriels
    ou des communes voisines qui ne figurent pas au dossier, 115 L/s peut casser quelque chose de sanitaire
    — et avec 4 jours de tampon, l''erreur se voit en 4 jours.


    Cet argument tient, et c''est pourquoi la coupe est **étagée** : le palier 1 ne touche que des usages
    d''agrément et de la pression nocturne, et le palier 2 ne se déclenche **que** sur mesure de rendement.
    Il ne tient pas jusqu''à justifier le statu quo : il justifie de mesurer avant de couper davantage,
    pas de ne jamais mesurer.


    ## 10. Ce qui me ferait changer d''avis


    - **Rendement de réseau > 85 %** → les 150 L/s de la régie sont fondés, le palier 2 est annulé, l''arbitrage
    retombe entièrement sur l''irrigation et le fonds bascule du réseau vers la compensation.

    - **Jaugeage contradictoire s''écartant de plus de 15 % des 410 L/s** → tous les seuils du § 7 sont
    recalculés avant application.

    - **Enquête parcellaire montrant les cultures massivement en phase critique (nouaison, grossissement)**
    → la perte devient effectivement quasi-binaire, le socle est réduit au profit de la concentration,
    et le rachat de quota passe en priorité budgétaire devant les réparations.


    ## 11. Première action


    Vendredi matin, avant même le vote de jeudi soir : commande du jaugeage contradictoire de la station
    de Sarcelle sous 72 h (25 k€ sur trésorerie, remboursés au fonds), et courrier recommandé à la régie
    demandant rendement de réseau et campagne de débit de nuit sectorisé sous 7 jours, avec mention explicite
    que le refus de produire ces données vaudra présomption de rendement dégradé au sens du § 3.


    ---


    ### Hypothèses assumées, faute de données


    - Référence de 150 L/hab/jour pour l''usage domestique (moyenne nationale) — à remplacer par les données
    réelles de la régie.

    - Dose pleine de 234 m³/ha/semaine — dérivée de la demande des maraîchers eux-mêmes, non d''un relevé
    parcellaire.

    - Récupération de 10 à 25 L/s sur le réseau — conditionnelle à un rendement effectivement mauvais
    ; nulle s''il est bon.

    - Les 15 L/s du palier 1 (usages d''agrément + modulation de pression) sont une estimation haute ;
    à vérifier sous 10 jours.

    '
