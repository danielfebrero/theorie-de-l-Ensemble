  text: 'La publication a été refusée — le document reste en local : `…/scratchpad/position-veze.md`.
    Voici la position.


    ---


    # Position de la présidence — séance de jeudi


    ## La répartition


    | Usage | Demande | Dotation | Écart |

    |---|---:|---:|---:|

    | Débit réservé aval | 180 | **180** | 0 |

    | Eau potable (régie de Ferney) | 150 | **130** | −20, révisable |

    | Irrigation maraîchère | 240 | **100** | −140 |

    | | 570 | **410** | |


    **Forme :** volume global par usage jeudi. À l''intérieur de l''enveloppe maraîchère, répartition
    individuelle dès le premier jour sur la seule donnée que nous ayons — la surface — puis conversion
    en quotas documentés au 15ᵉ jour sur déclarations et compteurs.


    Le déficit de 160 L/s est réparti sur **deux** usages, pas un seul. C''est le point qui doit tenir
    devant la presse.


    ## Pourquoi le débit réservé ne bouge pas


    D''abord parce que je n''en ai pas le pouvoir : les 180 L/s relèvent d''un arrêté préfectoral, seul
    le préfet peut y déroger. Je ne choisis donc pas la truite contre le maraîcher — ces litres ne sont
    pas à ma disposition.


    Ensuite parce que c''est la seule des trois pertes qui ne se rachète pas. Une récolte se rejoue l''an
    prochain, des saisonniers se réembauchent ; le rapport du 12 juin qualifie les frayères de non reconstituables
    à l''échelle décennale. Hiérarchie de délais de retour, pas de valeurs.


    Enfin parce qu''une dérogation ne réglerait rien : descendre à 120 L/s libérerait 60 L/s — un tiers
    du déficit — au prix du définitif, pour un sursis de deux semaines.


    ## Les 20 L/s pris à la régie


    150 L/s pour 9 200 habitants font **~1 400 L/habitant/jour**. Un réseau rural comparable tourne entre
    150 et 250, EHPAD et petites activités comprises. Facteur cinq à neuf. Cela signifie pertes de réseau,
    périmètre desservi plus large que Ferney, ou gros consommateurs raccordés — dans les trois cas, du
    volume mobilisable sans toucher un robinet de particulier.


    Je garantis à la régie **le service, pas le prélèvement** : les 9 200 habitants et l''EHPAD passent
    en priorité absolue sur tout le reste. Ce que je ne garantis pas, c''est le volume pompé. Sous 72
    h j''attends rendement de réseau, bilan sectoriel, liste des non-domestiques. Si les chiffres tiennent,
    la dotation remonte à 150 sans nouvelle séance et l''enveloppe maraîchère absorbe l''écart.


    La symétrie est le cœur de l''argument : j''exige des maraîchers qu''ils justifient 240, j''exige
    de la régie qu''elle justifie 150. Aucun des deux n''a été audité. Je ne peux pas croire l''un sur
    parole et instruire l''autre.


    ## Pourquoi 100 L/s, et concentrés


    100 L/s étalés sur 620 ha = **1,4 mm/jour**, contre 4 à 6 mm d''évapotranspiration en août. On donne
    à chacun une dose sous le seuil de survie : on perd tout *et* on gaspille l''eau. Les mêmes 100 L/s
    sur 300 ha = **2,9 mm/jour**, régime déficitaire sévère mais praticable.


    C''est la réponse directe aux maraîchers. Ils affirment qu''en dessous de 240 la récolte est perdue
    en totalité. **Si cet effet de seuil est réel, il condamne la répartition uniforme, pas la mienne**
    — face à un seuil, la seule stratégie qui sauve quelque chose est de servir pleinement une fraction
    et d''abandonner le reste. Leur argument plaide pour la concentration.


    Je note aussi que ce seuil est affirmé exactement au niveau de la demande formulée, sans donnée parcellaire,
    par la partie qui en bénéficie. Un déficit hydrique produit normalement une perte continue, pas un
    effondrement binaire. Je ne peux ni le vérifier ni l''écarter aujourd''hui.


    **Répartition interne :** socle de 0,6 L/s par exploitation (20,4 L/s pour 34), les 79,6 restants
    au prorata surfacique (0,128 L/s/ha). Une exploitation de 5 ha reçoit 1,24 L/s au lieu de 0,81 ; une
    de 50 ha, 7,05 au lieu de 8,06. Les six qui cultivent 300 des 620 ha ne captent pas mécaniquement
    la moitié. Transferts autorisés entre exploitations, plafonnés à 1,5× la dotation initiale, jamais
    sous le socle.


    Le transfert est le seul mécanisme qui exploite l''information que nous n''avons pas et qu''eux ont
    : quelle parcelle, à quel stade, vaut d''être sauvée.


    ## Les 600 000 €


    Étalés sur 4,1 M€ annoncés, ils couvrent 15 % et ne changent aucun comportement. Affectés :


    - **500 k€** — appel à manifestation d''intérêt pour arrêt d''irrigation, prix ascendant, plafond
    2 500 €/ha, cible 300 ha. Les hectares dont l''abandon coûte le moins sortent en premier : la sélection
    recherchée, sans que la commission arbitre culture par culture. Le prix se découvre au lieu d''être
    décrété. Éligibilité conditionnée au maintien des contrats saisonniers en cours.

    - **60 k€** — jaugeage contradictoire, station aval, télérelève des compteurs.

    - **40 k€** — amorce du secours potable.


    ## La règle de sortie, contre le défaut de 2022


    Un orage apporte du ruissellement, pas du stock. Une mesure instantanée sur 48 h mesure la pluie de
    la veille. Remplacement : moyenne mobile 10 jours ; hystérésis dissymétrique (durcissement sur 3 jours,
    levée sur 10) ; exclusion des pics de crue de moins de 48 h sauf maintien à 7 jours ; corroboration
    obligatoire par piézomètre ou jaugeage manuel ; levée par paliers de 20 L/s ; réengagement automatique
    sans nouvelle séance.


    ## Ce que je ne sais pas — et que j''achète sous 72 h


    Aucun chiffre du dossier n''a été vérifié. Les 410 L/s viennent d''**une seule station étalonnée en
    2023**, et nous ne mesurons rien à l''aval, là où le débit réservé s''applique réellement. Trois achats
    d''information : jaugeage contradictoire sous 5 jours (DDT + OFB) ; déclaration parcellaire sous 72
    h et compteurs sous 7 jours ; rendement et bilan sectoriel de la régie sous 72 h. Quelques dizaines
    de milliers d''euros pour arbitrer 4 millions annoncés — ne pas le faire serait le seul choix indéfendable
    ici.


    ## Repli (moyenne 3 jours au barrage)


    - **< 380** → enveloppe maraîchère à 70 L/s.

    - **< 340** → irrigation suspendue en totalité.

    - **< 310** → la commission est dessaisie ; l''arbitrage potable/débit réservé relève du préfet. Saisine
    automatique.


    La ligne la plus dangereuse n''est aucune de celles-là : **4 jours de tampon face à 3 semaines sans
    pluie annoncée.** Interconnexion ou marché de citernes à contractualiser cette semaine, pas le jour
    de la rupture.


    ## Ce qui renverserait cette position


    - Le jaugeage montre une surestimation de la station > 10 % → l''enveloppe maraîchère tombe à presque
    rien. Risque le plus probable et le moins surveillé.

    - Rendement de réseau > 85 %, ou réseau desservant bien plus que Ferney → mes 20 L/s n''existent pas,
    la potable remonte à 150, l''irrigation tombe à 80.

    - Les compteurs montrent un prélèvement actuel très inférieur à 240 → l''annonce de perte totale est
    falsifiée.


    ## Première action


    Vendredi matin : notification écrite des trois demandes de justification, et **lancement immédiat
    de l''appel à manifestation d''intérêt** — quinze jours de délai de mobilisation du fonds interdisent
    d''attendre les résultats des mesures. Comité de suivi hebdomadaire dès vendredi : un représentant
    par usage, fédération de pêche, OFB, DDT, même donnée pour tous. Le désaccord sur la répartition est
    légitime ; le désaccord sur les chiffres ne doit plus l''être.


    ---


    **Le contre-argument le plus sérieux contre moi** : les 130 L/s reposent sur une inférence per capita
    non vérifiée. Si la régie dessert en réalité plusieurs communes, je coupe 20 L/s à un réseau sans
    marge, avec un EHPAD à 4 jours de tampon — soit l''inversion exacte de la priorité que je prétends
    défendre. C''est pourquoi cette dotation se révise automatiquement **à la hausse** sur production
    des pièces, quand l''enveloppe maraîchère, elle, ne se révise qu''à la baisse. La dissymétrie est
    assumée : elle place la charge du doute sur l''usage réversible.

    '
