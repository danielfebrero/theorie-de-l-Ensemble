response:
  text: '# NOTE DE DIRECTION — DÉCISION EXÉCUTOIRE


    **De :** Direction générale

    **À :** Comité de direction (DAF, DC, DIR. INDUSTRIEL, DRH, DIR. SUPPLY)

    **Date :** 8 août 2026

    **Objet :** Offre d''exclusivité D — décision, mandat de négociation, conduite à tenir jusqu''au 24
    août

    **Portée :** Cette note vaut décision. Elle s''applique en l''état, sans arbitrage complémentaire.
    Je suis injoignable du 9 au 23 août.


    ---


    ## 1. La décision


    **Nous ne signons pas l''exclusivité. Ni en l''état, ni amendée sur le prix.**


    Le point de blocage n''est pas les 9 %. C''est l''exclusivité de 36 mois. Aucune contrepartie financière
    ne rachète ce verrou : ne le rouvrez pas.


    **Nous ne rompons pas avec D pour autant.** Vous transmettez une contre-proposition ferme, non exclusive,
    dans l''enveloppe définie au §3. Si D la refuse et déréférence quatre références le 20 août, nous
    l''assumons. C''est ma décision, pas la vôtre.


    Je connais la position écrite de chacun. Le débat est clos à compter de cette note. Vous exécutez.


    ---


    ## 2. Pourquoi — l''arithmétique, à savoir défendre


    Ces chiffres ne sont pas des arguments de négociation, ce sont les nôtres. Ne les communiquez pas
    à D.


    **a) L''offre détruit de la marge même si D tient son engagement.**

    Marge brute actuelle sur D : ~4,62 M€. Avec −9 % de prix et +18 % de volume : CA 16,0 M€, marge ~3,87
    M€. **−0,75 M€ dès la meilleure année.**


    **b) Il faudrait +41 % de volume, pas +18 %, pour être à l''équilibre.**

    Une remise de 9 % avec un taux de marge de 31 % exige un volume ×1,41 pour neutralité. L''engagement
    proposé couvre moins de la moitié du trou.


    **c) L''asymétrie est le vrai sujet.** La remise est permanente, l''exclusivité dure 3 ans, l''engagement
    de volume dure 12 mois. Années 2 et 3, si D revient aux volumes actuels : **−1,34 M€ de marge par
    an**, sans recours, sans canal alternatif, avec 1,2 M€ de pénalité de sortie — 57 % de notre trésorerie.
    Cumul trois ans : **−3,4 M€ pour 2,1 M€ de trésorerie.** Rappel : D a coupé 11 % sans préavis au T2.
    C''est le comportement contractuellement autorisé qu''on nous demande de rendre définitif.


    **d) Coût d''opportunité.** L''exclusivité interdit 3,9 à 5,7 M€ de CA annuel de diversification (centrale
    3,5 M€ + marketplace 0,4–2,2 M€ à +6 points de marge), et fige notre dépendance au-dessus de 70 %
    au lieu de la réduire.


    **Le principe qui gouverne tout le reste : le chômage partiel est réversible, une exclusivité de trois
    ans ne l''est pas.** Entre un risque industriel temporaire et un verrou capitalistique définitif,
    on choisit le risque.


    ---


    ## 3. Mandat de négociation — l''enveloppe


    Vous êtes habilités à signer, sans moi, **tout accord respectant les huit conditions suivantes**.
    Elles sont cumulatives. Une seule manquante = pas de signature.


    1. **Non-exclusif.** Au maximum : exclusivité de catégorie sur le circuit GMS national de D, avec
    carve-out nommément écrit pour (a) la centrale régionale, (b) la marketplace, (c) la RHF/food service,
    (d) l''export.

    2. **Durée 12 mois**, reconductible par accord exprès. Jamais 24, jamais 36.

    3. **Remise adossée au volume réalisé**, versée trimestriellement a posteriori. Aucune remise sur
    facture, aucune remise acquise d''avance.

    4. **Plafond de remise : 5 %**, et uniquement au palier supérieur constaté (voir grille §4).

    5. **Engagement de volume ferme et contractuel**, avec clause de rattrapage de remise si non atteint.

    6. **Pas de pénalité de sortie unilatérale.** Si D en exige une : symétrique et plafonnée à 150 k€.

    7. **Préavis écrit de 6 mois** sur tout déréférencement, quelle que soit la référence.

    8. **Aucune clause de parité tarifaire / client le plus favorisé.** C''est le substitut classique
    à l''exclusivité refusée : une clause qui nous oblige à vendre plus cher ailleurs produit le même
    verrou sous un autre nom. Refus automatique.


    Validation du texte final par notre conseil **avant** signature, sans exception.


    ---


    ## 4. Grille des remises admissibles


    Volume ferme minimum exigé pour qu''une remise soit neutre sur la marge (base taux de marge 31 %)
    :


    | Remise consentie | Volume ferme minimum | Statut |

    |---|---|---|

    | 2 % | +7 % | Autorisé |

    | 3 % | +11 % | Autorisé |

    | 4 % | +15 % | Autorisé |

    | 5 % | +20 % | **Plafond** |

    | 7 % | +30 % | Interdit |

    | 9 % | +41 % | Interdit |


    **Règle d''application :** le DAF recalcule la grille avec le taux de coût variable réel de l''usine
    (le taux de marge brute sous-estime la contribution marginale si des coûts fixes sont logés dans le
    COGS). Formule : *volume requis = m / (m − d)*, où m = taux de contribution, d = remise. **Exigez
    systématiquement +200 k€ de marge au-dessus du point mort** — nous ne signons pas pour faire du volume
    à l''équilibre.


    ---


    ## 5. La réunion avec l''acheteur de D


    Elle a lieu, mais dans nos termes.


    - **La contre-proposition part par écrit AVANT la réunion** (mardi 11 août, courrier + mail avec AR).
    La réunion porte sur notre papier, pas sur ses arguments.

    - **Deux personnes le reçoivent : DC + DAF.** Pas le comité de direction au complet. Il a demandé
    à exposer ses arguments à un organe divisé ; on ne lui fournit pas la salle.

    - **Aucune décision, aucun engagement verbal, aucun calendrier concédé en séance.** Réponse unique
    à toute pression : « la position de Verdal est arrêtée et écrite, le comité en détient le mandat.
    »

    - **Ne jamais indiquer que je suis injoignable.** Ne jamais évoquer la trésorerie, le plan de charge,
    le chantier Maroc, ni l''état d''avancement des deux alternatives.

    - **Compte rendu écrit sous 24 h**, diffusé au comité, versé au dossier.


    ---


    ## 6. Scénarios et conduite à tenir


    | Situation au 20 août | Conduite |

    |---|---|

    | D accepte la contre-proposition dans l''enveloppe §3 | Signature après visa du conseil. Informez-moi
    par écrit, exécution immédiate. |

    | D contre-propose **dans** l''enveloppe | Signature. |

    | D contre-propose **hors** enveloppe, même de peu | **Pas de signature.** Réponse : « nous étudions
    à la rentrée. » Le dossier m''attend le 24. |

    | D refuse et déréférence 4 références | Acté. Vous activez le §7 et le §8. Aucune renégociation en
    réaction, aucun appel à D dans les 72 h. |

    | D menace de rompre l''ensemble de la relation | Aucune réponse improvisée. Le conseil qualifie sous
    48 h le risque de rupture brutale de relation commerciale établie (art. L442-1 II C. com.) et le caractère
    d''avantage sans contrepartie proportionnée de la remise de 9 %. **Ce dossier est une assurance, pas
    une arme : on ne le brandit pas.** |

    | D revient avec une offre améliorée après le 20 | Parfait. Elle m''attend. Rien ne se signe dans
    l''urgence d''un comité d''achat. |


    **En cas de désaccord entre DAF et DC sur l''application de cette note : la réponse est non, et rien
    ne se signe.** Le défaut est l''inaction, pas le compromis.


    ---


    ## 7. Trésorerie et protection industrielle — à lancer lundi 10


    1. **Quantification immédiate** (DC + contrôle de gestion, livrable lundi 10 au soir) : quelles 4
    références, quel CA, quelle marge, quel impact exact en points de plan de charge à Redon. Nous décidons
    contre un chiffre, pas contre une menace.

    2. **Gel** de tout capex non engagé et de tout recrutement non signé jusqu''à mon retour.

    3. **Dossier d''activité partielle Redon préparé et prêt à déposer** — préparé, **non déclenché**.
    La préparation ne coûte rien ; l''impréparation coûte trois semaines.

    4. **Seuil de trésorerie : 1,6 M€.** En dessous : gel des paiements fournisseurs non critiques, mobilisation
    des lignes court terme existantes. **Aucune nouvelle dette, aucun affacturage, aucune cession de créance
    sur D signés en mon absence.**

    5. **Point trésorerie hebdomadaire écrit**, tous les lundis, 13 semaines glissantes.

    6. **Constitution du dossier de preuve** : historique de commandes D sur 3 ans, échanges du T2 sur
    la baisse de 11 %, correspondances. Archivage, sans usage.


    ---


    ## 8. Les alternatives — la seule vraie réponse à la dépendance


    Refuser l''exclusivité n''a de valeur que si le refus se transforme en chiffre d''affaires. Ce volet
    n''est pas secondaire, il est la contrepartie de la décision.


    - **Marketplace : lancement immédiat.** Onboarding engagé avant le 14 août, premières ventes avant
    fin septembre, objectif conservateur 0,4 M€ à 12 mois. Ne pas attendre l''issue avec D. Un canal actif
    avant toute discussion d''exclusivité est aussi une position de négociation.

    - **Centrale régionale : ne pas attendre cinq mois.** Proposez sous huit jours un pilote sur deux
    références ou une lettre d''intention non engageante. Objectif : un élément écrit sur mon bureau le
    24 août.

    - **Ouverture de trois nouvelles pistes** (RHF, MDD d''une autre enseigne, export adossé au site marocain).
    Livrable : liste qualifiée avec interlocuteurs identifiés pour mon retour.

    - **Cible structurelle** : D sous 45 % du CA à 24 mois. C''est désormais un objectif de direction,
    pas une intention.


    ---


    ## 9. Interdits absolus jusqu''au 24 août


    Est interdit, sans exception et sans possibilité de dérogation collégiale :


    - toute clause d''exclusivité, quelle qu''en soit la rédaction ou la durée ;

    - tout engagement contractuel de plus de 12 mois ;

    - toute pénalité de sortie unilatérale ; toute clause de parité tarifaire ;

    - tout engagement financier non budgété supérieur à 150 k€ ;

    - toute annonce sociale, toute information au CSE au-delà des obligations légales, toute communication
    interne sur « le refus » ;

    - toute communication à D laissant transparaître une contrainte de trésorerie ou de calendrier ;

    - toute réouverture de la présente décision.


    **Porte-parole unique vis-à-vis de D : le directeur commercial.** Aucun autre canal, à aucun niveau.


    ---


    ## 10. Calendrier


    | Date | Action | Responsable |

    |---|---|---|

    | Lun 10 | Quantification 4 références · dossier de preuve · contre-proposition rédigée et visée par
    le conseil | DC / DAF |

    | Mar 11 | Contre-proposition envoyée par écrit à D (AR) | DC |

    | Mer 12–jeu 13 | Réunion acheteur D (2 personnes, après envoi) | DC + DAF |

    | Ven 14 | Marketplace engagée · relance centrale régionale avec offre de pilote | DC |

    | Lun 17 | Point trésorerie · dossier activité partielle prêt | DAF / DRH |

    | Jeu 20 | Comité d''achat D. Aucune signature hors enveloppe ce jour-là | — |

    | Lun 24 | Dossier complet à mon retour | Comité |


    ---


    ## 11. Responsabilité


    Cette décision est la mienne. Si les quatre références tombent le 20 août, si Redon passe sous 70
    % de plan de charge, si l''exercice se dégrade, **c''est moi qui en réponds — devant les actionnaires
    et devant les salariés.** Aucun membre du comité n''aura à justifier d''avoir appliqué cette note.
    Vous n''exécutez pas un compromis : vous exécutez un ordre écrit et daté.


    Ce que je vous demande, c''est de tenir huit jours sans céder à un calendrier qui a été avancé précisément
    pour que je ne sois pas là. **Un comité d''achat déplacé n''est pas un fait industriel, c''est un
    levier de pression.** Nous n''organisons pas trois ans de notre entreprise autour de la date d''une
    réunion chez notre client.


    À jeudi 24.


    **Le Directeur général**

    '
