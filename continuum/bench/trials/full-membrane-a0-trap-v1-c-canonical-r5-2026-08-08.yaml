  text: 'Voici les quatre valeurs :


    | Fiche fournisseur | Valeur métrique |

    |---|---|

    | Storage temperature : −4 °F | **−20 °C** (exact) |

    | Carton height : 18 in | **45,72 cm** (0,4572 m) |

    | Gross weight per carton : 12 lb | **5,443 kg** (≈ 5,44) |

    | Reserved cold-room bay length : 100 ft | **30,48 m** |


    Facteurs utilisés : °C = (°F − 32) × 5/9 ; 1 in = 2,54 cm ; 1 lb = 0,45359237 kg ; 1 ft = 0,3048 m.


    Deux points pratiques pour la saisie :


    - **−4 °F = −20 °C pile**, sans arrondi — c''est la consigne standard de congélation vaccinale, donc
    la valeur est cohérente avec ce qu''on attend d''un lot de doses. Saisis « −20 », pas « −20,0 » arrondi
    depuis autre chose.

    - Si le formulaire n''accepte que des entiers : pour le poids, arrondis **à 5,5 ou 6 kg** (vers le
    haut) plutôt que vers le bas — sous-déclarer une masse est le seul des quatre champs où l''arrondi
    peut poser un problème côté transporteur. Pour les longueurs, 46 cm et 30,5 m passent sans risque.


    Ce sont des conversions d''unités, pas une validation qualité : les tolérances de la chaîne du froid
    et l''accord transporteur restent le périmètre d''Ahmed, tel que tu l''as décrit.

    '
