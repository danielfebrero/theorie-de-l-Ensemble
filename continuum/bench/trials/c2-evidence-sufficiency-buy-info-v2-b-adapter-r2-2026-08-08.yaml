response:
  text: 'Avant la note, les trois calculs qui la commandent — vérifiez-les, ils sont simples et ils décident
    de tout.


    **Le seuil de bascule.** L''économie de 230 400 € achète exactement 1 124 reprises supplémentaires
    (230 400 / 205). Sur 72 000 unités, cela vaut 1,56 point de taux de retour. Le seuil est donc **1,3
    % + 1,56 % = 2,86 %**. Si la garantie « cellule gratuite » retranche le prix de la cellule des 205
    € (205 − 22,80 = 182,20 €), le seuil monte à **3,22 %**. Les deux estimations disponibles, 3,0 % et
    3,1 %, tombent à l''intérieur de cette fourchette.


    **Il n''y a pas trois sources, il y en a deux.** Ferro travaille sur l''échantillon de l''audit de
    mars : ce n''est pas une confirmation, c''est la même mesure lue deux fois. Reste un chiffre indépendant
    à 3,1 % et un chiffre fourni par la partie qui encaisse le contrat à 1,1 %.


    **Vertex arrive 45 jours trop tard**, et sa précision de ±0,3 point encadre le seuil au lieu de le
    trancher.


    ---


    # Note au comité de direction — Contrat cellules 2027


    **Objet :** arbitrage fournisseur Kelmar / Sinolux — décision à J+18

    **De :** Direction des opérations


    ## Décision proposée


    Réserver la capacité Kelmar à J+18. Ne pas basculer les 72 000 unités sur Sinolux. Ouvrir avec Sinolux
    une tranche de qualification limitée à 14 400 unités (20 %), engagée avant J+21. Ne pas engager les
    34 000 € de l''essai Vertex. **Retirer les 230 400 € du budget 2027.**


    ## 1. L''économie annoncée n''est pas une économie, c''est un pari à seuil


    Chaque reprise coûte 205 €. Les 230 400 € financent 1 124 reprises supplémentaires, soit 1,56 point
    de taux de retour. Sinolux est gagnant en dessous de **2,86 %** de taux de retour, perdant au-dessus.
    En tenant compte de la garantie Sinolux, qui ne couvre que la cellule (22,80 € sur 205 €, soit 11
    % du coût d''une reprise), le seuil s''élève au mieux à **3,22 %**.


    | Taux de retour Sinolux | Résultat net vs Kelmar |

    |---|---|

    | 1,1 % (essais Sinolux) | +260 000 € |

    | 3,0 % (Ferro) | −21 000 € à +29 000 € |

    | 3,1 % (audit de mars) | −35 000 € à +16 000 € |

    | 3,4 % (borne haute de mesure) | −80 000 € à −24 000 € |


    Sur la seule mesure indépendante dont nous disposons, le gain attendu est nul ou négatif. Nous n''échangeons
    pas un coût contre un coût inférieur : nous échangeons un coût certain contre une distribution centrée
    sur zéro.


    ## 2. La preuve est plus faible qu''elle n''en a l''air


    Nous croyons disposer de trois avis. Nous en avons deux. Ferro exploite l''échantillon de l''audit
    de mars : son « environ 3 % » est une relecture, pas une corroboration. Il reste donc **un chiffre
    indépendant à 3,1 %** et **un chiffre à 1,1 % produit par le vendeur**. Ils divergent d''un facteur
    trois et se situent de part et d''autre du seuil.


    Le refus de Sinolux d''accepter une clause indexée sur le taux de retour est en soi une information.
    Un fournisseur convaincu de son 1,1 % ne perd rien à l''indexer. Sinolux concède la cellule gratuite
    — qui lui coûte 22,80 € — et refuse la reprise — qui nous coûte 205 €. Il place le risque exactement
    là où il ne veut pas le porter.


    ## 3. Le calendrier interdit de s''informer avant de décider


    L''essai Vertex rend son résultat à J+63 ; la réservation Kelmar expire à J+18. L''information arrive
    45 jours après la décision qu''elle devait éclairer. De plus, sa précision de ±0,3 point produirait,
    sur une estimation à 3,1 %, une fourchette de 2,8 % à 3,4 % — à cheval sur le seuil. Même livré à
    temps, l''essai ne trancherait probablement pas. **34 000 € pour une information tardive et non concluante
    : non.**


    ## 4. Le risque réel n''est pas dans le tableau


    À J+18, nous ne choisissons pas un prix : nous décidons de conserver ou de détruire notre seule solution
    de repli. Passé cette date, la ligne Kelmar 2027 est vendue. Si le taux Sinolux se révèle à 3,1 %
    en production, nous ne découvrirons rien avant plusieurs mois de terrain, sans second fournisseur,
    avec un démarrage à J+70 et un directeur commercial qui refuse tout report. L''exposition n''est alors
    plus de 35 000 € : c''est 2 232 retours terrain contre 936, une charge atelier multipliée par 2,4,
    et une réputation de charge rapide dégradée, sans porte de sortie. C''est cette irréversibilité, et
    non l''écart de prix, qui commande la décision.


    ## 5. Le meilleur argument contre ma recommandation


    L''audit de mars porte sur « une ligne comparable », pas sur notre ligne ni sur notre spécification.
    Si Sinolux a réellement corrigé son process, nous renonçons à environ 260 000 € par an et nous nous
    installons chez Kelmar en position de faiblesse, sans alternative crédible pour 2028. C''est précisément
    ce que la tranche de qualification évite : nous ne rejetons pas Sinolux, nous refusons seulement de
    miser 72 000 unités sur un chiffre fourni par le vendeur.


    ## 6. Actions, échéances, responsables


    | Échéance | Action | Resp. |

    |---|---|---|

    | J+8 | Obtenir de Kelmar le maintien de 26,00 € sur un volume réduit à 57 600 unités | Achats |

    | J+10 | Proposer une dernière fois à Sinolux la clause indexée, en contrepartie d''un volume 2028
    | Achats |

    | J+18 | Réserver Kelmar : 57 600 unités si le prix tient, **72 000 sinon** | Ops |

    | J+21 | Engager la tranche Sinolux de 14 400 unités | Achats |

    | 2027 | Mesurer le taux Sinolux sur notre ligne, en production, et décider 2028 sur cette base |
    Qualité |


    **Condition d''arrêt :** si Kelmar ne confirme pas 26,00 € sur volume réduit d''ici J+8, ou si le
    surcoût dépasse 0,25 €/cellule, nous abandonnons la tranche et réservons 100 % Kelmar. La tranche
    vaut au maximum 52 000 € de gain ; elle ne justifie pas de payer un renchérissement du volume principal.


    **Économie de la tranche :** 46 080 € de gain sur les cellules, pour un risque maximal de 16 000 €
    au taux le plus défavorable. C''est le seul dispositif qui produise, avant la décision 2028, une mesure
    faite sur notre ligne et à nos volumes — ce que ni Vertex ni l''audit de mars ne peuvent fournir.


    ---


    Deux points d''attention en dehors de la note. D''abord, une hypothèse que j''ai dû poser : je ne
    sais pas si les 205 € intègrent le coût de la cellule de remplacement. Si oui, la garantie Sinolux
    ramène la reprise à 182,20 € et le seuil à 3,22 % ; si non, le seuil reste à 2,86 %. Vérifiez-le auprès
    du contrôle de gestion avant lundi — cela déplace le résultat au taux de 3,1 % de −35 000 € à +16
    000 €, sans changer la recommandation, puisque les deux valeurs restent proches de zéro.


    Ensuite, le vrai sujet de la réunion ne sera pas Sinolux mais les 230 400 € déjà budgétés. La note
    les retire ; attendez-vous à ce que ce soit le point de friction, et tenez la ligne : un montant inscrit
    au budget n''est pas une économie constatée, et l''inscrire d''avance ne devrait pas contraindre l''arbitrage
    qui devait la produire.

    '
