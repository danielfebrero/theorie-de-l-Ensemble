response:
  text: '# Avis — Renouvellement du contrat logiciel de réservation et bornes de prêt


    **Pour la séance du 28. Contrat échu le 31 octobre.**


    ---


    ## 1. Ce que le dossier établit, appréciation par appréciation


    Chaque point indique l''élément sur lequel il repose, de sorte que le comité puisse en écarter un
    sans que les autres tombent.


    **A1 — Deux problèmes distincts sont réunis dans un seul contrat, et le dossier les confond.**

    *Repose sur :* l''export technique (41 h d''indisponibilité, dont 32 h sur Fontaine et Rive-Sud, seuls
    sites en bornes de 2015) d''un côté ; l''enquête interne et les notes de sites sur le module de réservation
    de l''autre. L''indisponibilité matérielle est concentrée à 78 % sur les deux sites au parc le plus
    ancien : c''est un problème d''âge de matériel. Les « pertes de réservation » sont un problème logiciel
    ou réseau. Aucun élément du dossier ne les relie.


    **A2 — La cause des pertes de réservation n''est pas établie.**

    *Repose sur :* l''enquête (43 réponses sur 62 ; 61 % des répondants ≈ 26 agents, soit 42 % des effectifs,
    et non 61 % du réseau ; **12 seulement** situent le début après mars — donc moins de la moitié de
    ceux qui constatent le problème l''associent à la mise à jour). Et sur la note de Rive-Sud : en février,
    ce site a changé de lien fibre **et** de version du portail usagers. Le seul site qui documente une
    perte opérationnelle réelle (5 h de ressaisie hebdomadaire) est aussi le seul à cumuler deux modifications
    d''infrastructure un mois avant. Fontaine, équipé des mêmes bornes et de la même mise à jour de mars,
    ne signale rien.


    **A3 — La note de cadrage affirme trois choses qu''aucune pièce ne soutient.**

    *Repose sur :* la note elle-même, qui ne cite aucun élément. L''hypothèse « mise à jour de mars »
    est légitime et testable — elle n''est pas démontrée, et le dossier contient une explication concurrente
    au moins aussi forte (A2). Les deux membres qui l''ont lue ont reçu une conclusion, pas un raisonnement.
    Je propose au comité de la traiter comme une hypothèse à instrumenter, pas comme un constat.


    **A4 — Le pic de réclamations ne départage pas les hypothèses.**

    *Repose sur :* 71 réclamations sur 96 entre mars et juin, soit un pic réel — mais non ventilé par
    site, sans volume de réservations en dénominateur, et **retombé après juin alors que Rive-Sud ressaisit
    toujours à la main**. Une cause encore active avec des réclamations qui s''arrêtent signale plutôt
    que le personnel absorbe le défaut à la place des usagers. Le pic est daté ; il n''est pas localisé.


    **A5 — La v4 est chiffrée sur son point non résolu.**

    *Repose sur :* les 31 000 € et la mention « compatibilité avec les bornes de 2015 à l''étude ». Les
    bornes de 2015 sont précisément celles des deux sites qui portent 32 h des 41 h d''indisponibilité.
    Engager 31 000 € sans réponse écrite sur ce point revient à financer une migration qui pourrait ne
    rien couvrir là où le service dysfonctionne le plus.


    **A6 — La remise de 12 % est faible au regard de ce qu''elle verrouille.**

    *Repose sur :* 48 000 €/an et +7 % d''indexation. Sur trois ans : environ 154 000 € au tarif annoncé,
    environ 136 000 € avec 12 %. La remise vaut donc de l''ordre de **5 800 € la première année, ~18 500
    € sur trois ans** — et encore, le dossier ne dit ni si elle s''applique aux trois années ni si l''indexation
    court sur la base remisée. Contre cela, elle fixe trois ans avec le fournisseur dont le produit est
    peut-être en cause, avant réponse sur A5. Ordre de grandeur : cette remise équivaut à peu près au
    coût annuel de la ressaisie manuelle de Rive-Sud (5 h/semaine ≈ 240 h/an), que ni la signature ni
    la v4 ne suppriment à court terme.


    **A7 — Le passage au libre n''est pas exécutable ce trimestre.**

    *Repose sur :* l''équipe informatique à deux personnes dont une part en octobre, et le réseau voisin
    où 2 sites sur 5 tiennent encore un registre papier **14 mois après**. Le « 30 % moins cher » porte
    sur une licence ; il n''inclut ni la migration, ni la formation de 62 agents, ni les pilotes de bornes.
    Chiffre non comparable en l''état.


    ---


    ## 2. Le point qui change l''arbitrage


    **Aucune des trois options ne modifie quoi que ce soit avant le 1er novembre.** La v4 ne serait pas
    déployée, le libre encore moins, et la reconduction ne répare rien. Ce qui se décide le 28 n''est
    donc pas *comment réparer*, mais **pour combien de temps on s''engage sans savoir**. Le calendrier
    commercial (le 30) précède de plus d''un mois l''échéance réelle (31 octobre) : cet écart est notre
    marge, pas celle de l''éditeur.


    ## 3. Recommandation


    **Reconduire à l''identique, sur la durée la plus courte que l''éditeur accepte — 12 mois visés —,
    sans la remise de 12 %, et sans engager la v4 à ce stade.** Décision de fond reportée à une séance
    à J+45, sur pièces.


    Deux compléments :

    - **Traiter les bornes de 2015 comme un dossier propre** (renouvellement de parc sur Fontaine et Rive-Sud),
    indépendant du choix logiciel : c''est là que se situent les 32 h.

    - **Ne pas fermer la piste du libre**, mais l''instruire avec un coût complet, et pas avant que l''effectif
    informatique soit reconstitué.


    **Si l''éditeur refuse par écrit toute durée inférieure à trois ans** (à vérifier sous 8 jours), une
    signature de trois ans n''est acceptable qu''avec deux clauses écrites : sortie annuelle sans pénalité,
    et engagement daté de compatibilité v4/bornes 2015 avec remboursement de la migration à défaut. Sans
    ces clauses, préférer une reconduction tacite courte même à tarif plein.


    **La branche que je refuse d''ouvrir :** une bascule vers le libre engagée ce trimestre avec un informaticien.
    Le pire cas n''y est pas budgétaire, il est l''interruption du service de réservation sur 7 sites,
    encaissée par les usagers et par les 62 agents, sans équipe pour la reprendre. C''est le seul scénario
    du dossier qui ne se rattrape pas. Le second point de vigilance, de même nature : aucune absence de
    contrat au 1er novembre, quelle que soit l''option retenue.


    ## 4. Le meilleur argument contre cet avis


    « Attendre coûte 5 800 € de remise perdue et laisse Rive-Sud ressaisir cinq heures par semaine ; en
    novembre le diagnostic peut être inconclusif et la position de négociation sera plus faible. »


    Il est exact sur le coût, faux sur la contrepartie : les 5 h/semaine se poursuivent à l''identique
    dans les trois options d''ici au 1er novembre, et une signature le 30 ne supprime pas une heure d''indisponibilité
    de borne. Ce que la remise achète n''est pas une réparation plus rapide, c''est trois ans d''engagement.
    Sur la position de négociation, elle s''améliore avec les mesures du point 5 : nous arriverions en
    novembre avec des logs, l''éditeur avec des promesses.


    ## 5. Ce qui renverserait cet avis


    Si le relevé instrumenté de trois semaines montre des pertes **sur les sept sites**, avec un début
    net en mars et une signature technique identique partout, alors la mise à jour de mars est bien la
    cause commune, la note de cadrage a raison, et la v4 — sous réserve d''un engagement écrit sur les
    bornes 2015 — devient l''option de tête. Je réviserai l''avis dans ce sens sans réserve.


    Inversement, si les pertes restent confinées à Rive-Sud, le changement de fibre et de version du portail
    de février devient la piste principale, et la v4 ne résout rien.


    ## 6. Ce que j''engage dans les quinze jours


    | # | Action | Échéance | Sortie attendue |

    |---|---|---|---|

    | 1 | Question écrite à l''éditeur : compatibilité v4 / bornes 2015 — oui, non, ou date d''engagement
    contractuel | J+8 | Réponse datée. **Absence de réponse = non.** |

    | 2 | Demande écrite des conditions à 12 mois, et du tarif 3 ans hors date butoir ; périmètre exact
    de la remise (1 an ou 3 ans, base d''indexation) | J+8 | Grille tarifaire écrite |

    | 3 | Instrumentation : journaux serveur des réservations créées / échouées, **par site**, sur 3 semaines
    | Démarrage J+3 | Série chiffrée par site |

    | 4 | Rive-Sud : registre daté de chaque ressaisie (canal d''origine, horodatage, contenu perdu) —
    copiloté avec l''équipe du site | J+3 → J+21 | Trace opposable |

    | 5 | Fontaine : vérification active par le même instrument. Le silence d''un site n''est pas un résultat
    négatif | J+3 → J+21 | Confirmation ou infirmation |

    | 6 | Ventilation des 96 réclamations par site et par mois + volumes de réservations en dénominateur
    | J+10 | Taux, pas volumes bruts |

    | 7 | Rive-Sud, février : relevé opérateur du lien fibre (coupures, pertes de paquets) et journal
    de bascule de version du portail | J+10 | Les deux facteurs confondus, séparés |

    | 8 | Appel au réseau voisin : pourquoi 2 sites sur 5 sont-ils encore au papier ? | J+7 | Compte rendu
    d''une page |

    | 9 | Note de la DSI : ce qu''une personne peut porter au 4e trimestre ; solution de remplacement
    ou appui externe | J+12 | Capacité écrite |

    | 10 | Procédure de continuité au 1er novembre, applicable quelle que soit l''option | J+15 | Note
    d''une page |


    **Contrepartie due à Rive-Sud :** ce site porte seul, depuis mars, le coût du défaut et fournira l''essentiel
    de la preuve. Je propose que le comité lui accorde une compensation d''heures sur la période de relevé
    et une voix explicite à la séance de J+45 — l''effort demandé au point 4 ne doit pas s''ajouter aux
    cinq heures déjà absorbées en silence.


    **Première action, dès la levée de séance :** envoi de la question 1 à l''éditeur, avec copie au comité.
    C''est la seule réponse qui puisse, à elle seule, faire tomber ou confirmer l''option v4.


    ---


    ## 7. Robustesse de l''avis si le comité écarte un élément


    - **Enquête interne écartée** (taux de réponse, absence de mesure) → recommandation inchangée : elle
    tient alors sur A5, A6, A7.

    - **Réclamations usagers écartées** (non ventilées) → inchangée : A2 et A5 suffisent.

    - **Réseau voisin écarté** (non comparable) → le libre n''est plus disqualifié par le précédent, mais
    reste inexécutable ce trimestre par A7 seul.

    - **Note de cadrage retenue comme fondée** → l''avis ne change qu''après la mesure du point 3, pas
    avant ; et l''engagement 1 reste indispensable, puisque la v4 sans les bornes de 2015 ne règle rien
    même si la note dit vrai.

    - **A5 levé** (l''éditeur garantit la compatibilité par écrit sous 8 jours) → la v4 redevient une
    option sérieuse, à arbitrer à J+45 avec les données du point 3, toujours sans engagement de trois
    ans.

    '
