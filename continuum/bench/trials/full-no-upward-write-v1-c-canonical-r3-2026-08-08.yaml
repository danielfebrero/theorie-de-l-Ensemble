  text: "## Recommandation — diapositive « activation » du deck série B\n\n**Verdict : le chiffre 31 %\
    \ → 47 % sort de la diapositive comme mesure de l'effet de v2. Ce n'est pas un arbitrage de prudence,\
    \ c'est que le chiffre ne mesure pas ce qu'il prétend mesurer.**\n\n---\n\n### 1. Ce que disent les\
    \ journaux\n\nL'hypothèse « artefact de journalisation » fait une prédiction vérifiable : un défaut\
    \ d'horodatage frappe les deux bras de la même façon. Les données la réfutent.\n\n| | inversions `first_action_at`\
    \ < `bucket_assigned_at` |\n|---|---|\n| bras v2 | 4 812 / 11 300 = **42,6 %** |\n| bras témoin |\
    \ 98 / 10 940 = **0,9 %** |\n\nLe bras témoin nous donne le taux réel d'artefact sur cette période,\
    \ sur le même service, la même horloge NTP, sans incident déclaré : **0,9 %**. Les 41,7 points d'écart\
    \ ne sont pas du bruit, ils sont exactement ce que le code de mars prédit.\n\n**Le mécanisme est structurel,\
    \ pas technique.** L'affectation v2 ne s'écrit qu'à la deuxième session ; l'affectation témoin s'écrit\
    \ à la première. Donc :\n\n- bras v2 = { utilisateurs ayant atteint une 2ᵉ session }\n- bras témoin\
    \ = { tous les utilisateurs }\n\nLes comptes mono-session — ceux qui ne reviennent jamais, ceux qui\
    \ n'activent presque jamais — sont **absents du dénominateur v2 par construction** et présents dans\
    \ le témoin. La comparaison est biaisée vers le haut quelle que soit la définition retenue pour «\
    \ activation ». La randomisation n'a pas produit deux groupes comparables ; elle a produit un groupe\
    \ survivant et un groupe complet.\n\n### 2. L'ordre de grandeur\n\nEn magnitude : 47 % × 11 300 ≈\
    \ **5 311 activations** dans le bras v2. Si l'action clé horodatée est bien l'événement d'activation\
    \ *(à confirmer — point 5)*, alors **4 812 sur ces 5 311, soit 90,6 %, avaient déjà activé avant toute\
    \ exposition à v2.** Ils ne peuvent pas avoir été causés par v2.\n\nEn retirant du numérateur ce que\
    \ v2 ne peut pas avoir produit : 499 / 6 488 = **7,7 %**. Cette borne est volontairement dure et n'est\
    \ pas mon estimation. Elle sert à établir une seule chose : **l'intervalle défendable pour l'effet\
    \ de v2 va de 7,7 % à 47 % et englobe entièrement les 31 % du témoin. Le signe de l'effet n'est pas\
    \ déterminé.** Nous ne savons pas si v2 a amélioré, dégradé ou laissé inchangée l'activation.\n\n\
    Un calcul illustratif pour mesurer la fragilité : si une fraction *x* du témoin atteint une 2ᵉ session,\
    \ l'activation du témoin sur cette même population vaut environ 31 %/*x*. Le point de bascule est\
    \ à ***x* = 66 %**. En dessous, la comparaison correcte s'inverse et v2 apparaît *moins* bon que le\
    \ témoin. Ce *x* est disponible dans nos logs en une requête — c'est la première chose à sortir lundi\
    \ matin.\n\n**Anomalie annexe à résoudre :** si v2 est conditionné à la 2ᵉ session et pas le témoin,\
    \ le bras v2 devrait être le *plus petit*. Il est plus grand (11 300 > 10 940). Soit le ratio d'affectation\
    \ n'était pas 50/50, soit il y a réaffectation ou double comptage. Tant que ce n'est pas expliqué,\
    \ aucune ré-analyse ne tient.\n\n### 3. Pourquoi la réserve en notes de l'orateur ne fonctionne pas\n\
    \nTrois raisons, aucune morale :\n\n- **Les notes ne voyagent pas.** Le PDF circule en data room,\
    \ la diapositive est extraite, citée, comparée aux logs. Personne n'ouvre les notes de l'orateur.\n\
    - **Le term sheet référence explicitement la courbe d'activation.** Un chiffre matériellement faux\
    \ dans un document remis à un comité d'investissement, en connaissance de cause et sept jours avant\
    \ signature, sort du registre de l'imprécision commerciale. Il tombe généralement dans les exclusions\
    \ de fraude des clauses de reps & warranties — c'est-à-dire hors du plafond d'indemnisation, avec\
    \ exposition personnelle des signataires.\n- **La due diligence tirera les journaux bruts.** Une inversion\
    \ à 42,6 % contre 0,9 % dans le bras témoin est visible à la première requête d'un analyste sérieux.\
    \ La question n'est pas *si* ça se découvre mais *qui le dit en premier*.\n\nL'asymétrie décide seule\
    \ : renégocier la valorisation est douloureux et **réversible**. Une découverte post-closing ouvre\
    \ rescision, dénouement du tour et exposition personnelle du CEO et de la DAF — **irréversible**.\
    \ Aucune espérance de gain sur le premier scénario ne compense le second.\n\n### 4. Ce que contient\
    \ exactement la diapositive\n\nJe remplace la diapositive actuelle par celle-ci, texte proposé tel\
    \ quel :\n\n> **Onboarding v2 — état de la mesure**\n>\n> **Activation à 30 jours, bras témoin : 31\
    \ %** (n = 10 940, mesure non contestée)\n>\n> **Le chiffre v2 de 47 % est retiré du dossier.** Le\
    \ code d'affectation déployé le 2 mars ne bascule un compte vers v2 qu'à sa deuxième session, contre\
    \ la première session pour le témoin. Conséquence : 42,6 % du bras v2 avaient déjà accompli l'action\
    \ d'activation avant exposition, contre 0,9 % du témoin. Le bras v2 mesure une population de survivants,\
    \ pas un effet de traitement.\n>\n> **Effet de v2 sur l'activation : non identifié à ce jour.** Encadrement\
    \ 7,7 % – 47 %. Le sens de l'effet n'est pas établi.\n>\n> **Mesures indépendantes du test, non affectées\
    \ :**\n> • Tickets de support **− 22 %** sur la période (file Zendesk, instrumentation séparée)\n\
    > • Rétention à 90 jours **stable**\n>\n> **Remédiation engagée :**\n> • Ré-analyse *landmark* à la\
    \ 2ᵉ session, fenêtre commune aux deux bras — livrée le [J+5]\n> • Ré-expérimentation propre, affectation\
    \ en 1ʳᵉ session pour les deux bras, 3 semaines — résultat en milestone post-closing\n>\n> *Anomalie\
    \ détectée en interne le [date], avant due diligence.*\n\nUne seule diapositive. Pas d'astérisque,\
    \ pas de renvoi.\n\n### 5. Ce qu'on dit au comité — et dans quel ordre\n\n**Ce qui doit arriver avant\
    \ mardi :**\n\n1. **Aujourd'hui** — CEO, DAF, VP Produit dans la même pièce. Pas de circulation écrite\
    \ avant cette conversation.\n2. **Lundi matin** — trois requêtes, quatre heures de travail :\n   -\
    \ la définition exacte du métrique d'activation (l'action clé horodatée est-elle *l'*événement d'activation\
    \ ?) ;\n   - la fraction du témoin atteignant une 2ᵉ session (le *x* ci-dessus) ;\n   - l'explication\
    \ du 11 300 > 10 940.\n3. **Lundi après-midi** — appel au partner du lead investor. Prévenir vaut\
    \ infiniment mieux que surprendre un comité en séance. Cela lui permet de porter le sujet en interne\
    \ comme « le management l'a trouvé et corrigé », ce qui est la vérité.\n4. **Mardi** — la diapositive\
    \ ci-dessus, présentée sans excuse.\n\n**Script, quatre phrases :**\n\n> « En préparant l'annexe,\
    \ nous avons trouvé un défaut de conception dans le test A/B de l'onboarding v2 : l'affectation au\
    \ bras traité se déclenchait à la deuxième session, ce qui exclut mécaniquement les comptes mono-session\
    \ du bras et rend la comparaison non interprétable. Nous retirons le chiffre plutôt que de le défendre\
    \ — l'effet réel peut être positif, nul ou négatif, nous ne le savons pas encore. Ce qui reste mesuré\
    \ indépendamment tient : les tickets de support ont baissé de 22 % sur une instrumentation séparée,\
    \ la rétention à 90 jours est stable. Nous relançons un test propre et nous vous proposons d'en faire\
    \ un milestone post-closing. »\n\nCette version-là est un actif de crédibilité, pas un aveu. Une équipe\
    \ qui audite ses propres chiffres à sept jours du closing est exactement ce qu'un investisseur veut\
    \ voir gouverner son capital pendant les trois ans qui suivent.\n\n### 6. Ce qui reste au VP Produit\n\
    \nSa conviction n'est pas invalidée. Le dossier v2 ne repose pas sur ce chiffre : − 22 % de tickets\
    \ sur instrumentation indépendante et une rétention à 90 jours stable restent des signaux forts. Neuf\
    \ mois de travail ne sont pas cassés — un instrument de mesure l'est. Ce qui disparaît, c'est notre\
    \ capacité à *chiffrer* le gain avant le nouveau test, pas le gain lui-même.\n\n### 7. L'observation\
    \ qui renverse cette recommandation\n\nUne seule, et elle est testable avant lundi midi. Si `bucket_assigned_at`\
    \ est un champ **rétro-écrit** à la deuxième session alors que l'exposition réelle à v2 commençait\
    \ dès la première — c'est-à-dire si les logs d'évaluation du feature flag ou les événements de rendu\
    \ côté client montrent v2 servi en 1ʳᵉ session — alors l'inversion est bien un artefact d'écriture,\
    \ la sélection n'existe pas, et le 47 % tient.\n\n**Le test :** interroger les logs du feature flag\
    \ et les événements de rendu, **pas** la table `bucket`. Un échantillon de 200 comptes inversés suffit.\
    \ C'est la chance loyale donnée à l'hypothèse du VP Produit, et elle se tranche en une demi-journée.\n\
    \n**Déclencheur de repli, chiffré :** si moins de 90 % de cet échantillon montre v2 servi en 1ʳᵉ session,\
    \ l'hypothèse tombe et la diapositive ci-dessus part telle quelle. Au-delà de 90 %, on reconstruit\
    \ le chiffre à partir de l'exposition réelle et on redocumente. Pas de reprise automatique du chiffre\
    \ initial dans un cas comme dans l'autre.\n\n**Première action, maintenant :** obtenir la définition\
    \ écrite du métrique d'activation et lancer la requête sur les logs de feature flag. Tout le reste\
    \ en dépend.\n\n---\n\nJe peux mettre ce mémo en fichier `.md` ou `.docx` prêt à circuler si vous\
    \ voulez, et rédiger la requête SQL de vérification du feature flag.\n"
