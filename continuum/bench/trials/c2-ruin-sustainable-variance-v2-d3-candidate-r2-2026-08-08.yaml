response:
  text: '# Note au conseil — arbitrage Sedamex / Nordwerk


    **De :** la direction générale — **Pour :** conseil du vendredi — **Objet :** recommandation sur les
    dix-huit prochains mois


    ---


    ## 1. Recommandation


    **Installer la ligne Nordwerk (option B)**, sous une condition suspensive : la vérification externe
    décrite au § 5 doit être levée avant signature. Si elle n''est pas levée, nous reconduisons Sedamex
    sans autre débat.


    ## 2. Ce que disent les chiffres


    | | Option A — Sedamex | Option B — Nordwerk |

    |---|---|---|

    | Résultat sur 18 mois | +200 k€ certains | +900 k€ (60 %) / −400 k€ (40 %) |

    | Espérance | +200 k€ | **+380 k€** |

    | Pire cas | +200 k€ | −400 k€, plafonné contractuellement |


    L''écart d''espérance est de **180 k€** en faveur de B. Le point de bascule est à **46,2 % de probabilité
    de succès** : en dessous, A redevient supérieur. Notre estimation de 60 % dispose donc d''une marge
    de 13,8 points avant de nous faire regretter le choix.


    ## 3. Le test qui commande la décision : le pire cas est-il survivable ?


    Trajectoire des fonds propres dans le **scénario le plus défavorable de B** — échec technique, perte
    plafonnée constatée, dividende payé intégralement :


    3,4 M€ − 700 k€ (dividende, M4 et M10) − 400 k€ (échec) = **2,3 M€**, soit **1,1 M€ au-dessus du covenant**
    de 1,2 M€. Le covenant est respecté à chacune des six clôtures trimestrielles, y compris si l''échec
    est constaté au trimestre qui suit le premier acompte de dividende.


    Trésorerie au plancher : 2,6 − 0,7 − 0,4 = **1,5 M€**, soit **neuf mois de masse salariale**, dette
    nette nulle.


    Qui encaisse ce pire cas : l''entreprise, sur ses fonds propres. Pas les 38 salariés — la trésorerie
    couvre neuf mois de paie même après le choc. Pas le banquier — le covenant tient avec près du double
    de marge. Pas le patrimoine du dirigeant — il n''y a **ni caution personnelle, ni défaut croisé, ni
    sûreté sur l''actif industriel, ni carnet de commandes gagé**.


    **La perte maximale représente 11,8 % de nos fonds propres et 15 % de notre trésorerie.** C''est un
    mauvais trimestre. Ce n''est pas une menace d''existence.


    ## 4. Réponse au directeur financier


    Sur le fond de sa vigilance, je le suis. Sur la qualification, non — et cette qualification est tout
    le débat.


    **« Jouer la maison » suppose une branche où l''on perd la maison. Elle n''existe pas ici**, parce
    que le contrat plafonne la perte et parce qu''aucun créancier n''a de prise sur nos actifs. Un tirage
    défavorable dont le pire cas laisse 2,3 M€ de fonds propres et neuf mois de trésorerie est de la **variance**,
    pas de la ruine. Traiter les deux de la même façon nous conduit à refuser systématiquement toute exposition
    bornée — c''est-à-dire à ne plus investir.


    Sur **Tremay** : je ne connais pas leur dossier, et je demande à ne pas décider sur une ressemblance
    de surface. Une entreprise ne meurt pas d''avoir installé une ligne neuve ; elle meurt d''un mécanisme.
    Les mécanismes usuels sont une perte non plafonnée, un financement par dette avec sûretés, une caution,
    un défaut croisé, ou une rupture de covenant. **Nous en sommes protégés sur les cinq points.** Je
    propose que le directeur financier expose vendredi quel mécanisme précis de la chute de Tremay serait
    reproductible chez nous. S''il en identifie un, il fait basculer la décision et je m''y range.


    ## 5. La vraie fragilité — et ce que nous achetons avant de signer


    Elle n''est pas dans le montant du risque, elle est dans **le 60 %**. Ce chiffre vient de notre propre
    bureau d''études, sur onze cas — un échantillon dont l''intervalle de confiance englobe le seuil de
    bascule de 46 %, et produit par une équipe qui n''est pas neutre sur la décision. C''est le seul endroit
    où nous pouvons nous tromper de façon coûteuse.


    Comme l''engagement est ferme et sans clause de sortie, cette vérification n''a de valeur qu''**avant**
    signature. Elle est peu coûteuse au regard de 180 k€ d''écart : contact direct de quatre exploitants
    des onze références, contrôle de la comparabilité réelle des configurations, et **revue juridique
    du plafond de 400 k€** — toute la démonstration du § 3 repose sur le fait qu''il couvre aussi les
    coûts internes et la remise en état, ce qui reste à confirmer.


    ## 6. Mandat au directeur financier


    Je ne lui demande pas son avis, je lui confie le verrou : **la condition suspensive est levée par
    sa signature, pas par la mienne.** Il conduit la vérification, il détient le veto suspensif jusqu''à
    signature, et il tient ensuite le déclencheur de repli du § 7. Son opposition devient un pouvoir de
    contrôle réel sur l''exposition qu''il conteste.


    ## 7. Repli, déclencheur, première action


    Le contrat ne permet pas de sortir. Le repli consiste donc à **constater l''échec tôt plutôt que tard**
    : la perte est plafonnée et exigible au plus tard au douzième mois, et chaque mois d''obstination
    au-delà du point de non-retour technique ajoute des coûts internes hors plafond.


    - **Déclencheur observable :** recette de qualification technique non prononcée au troisième mois,
    ou cadence inférieure à 70 % du nominal au sixième.

    - **À son déclenchement :** ouverture immédiate de la procédure de constatation d''échec, gel de tout
    capex additionnel non engagé, information du conseil sous quinze jours.

    - **Interdit dès aujourd''hui :** tout engagement complémentaire non plafonné sur ce projet.

    - **Première action, lundi :** lancement de la vérification externe, rapport au conseil sous trois
    semaines, signature suspendue jusque-là.


    ## 8. Ce qui renverserait cette recommandation


    Un taux de succès observé inférieur à 46 % sur les références vérifiées ; une non-comparabilité des
    configurations installées ; un plafond de 400 k€ qui n''inclurait pas les coûts internes et de remise
    en état ; ou un mécanisme de la chute de Tremay démontré comme reproductible chez nous. Dans chacun
    de ces quatre cas, la recommandation devient : **reconduire Sedamex**.


    ---


    *Note : l''espérance, le seuil de bascule et les trajectoires de fonds propres et de trésorerie sont
    calculés à partir des données du dossier. La probabilité de 60 % est la seule donnée de la démonstration
    qui ne soit pas contractuelle ou comptable — d''où la condition suspensive.*

    '
