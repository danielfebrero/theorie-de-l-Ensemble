response:
  text: "# Position de la présidence — séance du jeudi\n\n## 1. Ce que je propose, en une phrase\n\nUn\
    \ **volume global par usage**, pas de quotas individuels ; une **échelle de paliers annoncée à l'avance**\
    \ au lieu d'une décision renégociée chaque semaine ; et, avant tout, la **vérification en cinq jours\
    \ des deux chiffres sur lesquels repose l'intégralité du dossier** — parce qu'aucun des deux n'a été\
    \ audité.\n\n## 2. Le point le plus important : nous nous apprêtons à détruire 4,1 M€ sur la foi de\
    \ deux nombres non vérifiés\n\n**Le 410 L/s.** Une station unique, dernier étalonnage 2023. Une courbe\
    \ de tarage dérive surtout en bas d'échelle — c'est précisément le régime où nous sommes. Une erreur\
    \ de 10 % représente ±41 L/s, soit le quart du déficit. Nous n'avons aucun point de contrôle indépendant.\n\
    \n*Sur l'annexe fournie :* le catalogue ne contient pas la station de Sarcelle et ne peut donc rien\
    \ prouver la concernant. Il sert seulement de référence de pratique : dans ce réseau, aucune région\
    \ ne repose sur une station unique (4 à 5 par région), et chaque station porte 3 à 5 capteurs aux\
    \ étalonnages échelonnés sur 2–4 ans, ce qui permet un recoupement interne. Sarcelle n'a ni redondance\
    \ ni rotation. Ce n'est pas une faute ; c'est une insuffisance à un point de décision où 40 L/s changent\
    \ le résultat.\n\n**Le 150 L/s de la régie.** 150 L/s = 12 960 m³/jour pour 9 200 habitants, soit\
    \ **1 409 L/habitant/jour** — environ neuf fois la moyenne domestique française. Aucune combinaison\
    \ plausible de pertes de réseau et d'usages non domestiques ne produit ce chiffre spontanément. Trois\
    \ hypothèses : c'est un volume autorisé et non un prélèvement réel ; le réseau dessert au-delà de\
    \ Ferney ; ou il existe une fuite ou un abonné industriel majeur. **Les trois changent l'arithmétique\
    \ du déficit.**\n\nLe déficit de 160 L/s est peut-être en grande partie un artefact de mesure et de\
    \ déclaration. Je refuse de l'arbitrer avant de l'avoir mesuré.\n\nEn regard, la demande des maraîchers\
    \ est la seule des trois qui soit techniquement vérifiable en l'état : 240 L/s sur 620 ha = **3,34\
    \ mm/jour**, soit environ la moitié de l'évapotranspiration d'un maraîchage d'été. Leur demande n'est\
    \ pas gonflée. C'est un point que je dirai publiquement.\n\n## 3. L'instrument : volume global, et\
    \ pourquoi pas de quotas individuels\n\nNous n'avons ni cultures, ni stades végétatifs, ni relevés\
    \ de compteurs. Des quotas individuels seraient donc nécessairement proportionnels à la surface —\
    \ c'est-à-dire **techniquement la pire répartition possible**, et juridiquement indéfendable faute\
    \ de base factuelle.\n\nVoici pourquoi c'est la pire. Les maraîchers affirment eux-mêmes qu'en dessous\
    \ de 3,34 mm/jour la récolte est perdue. Si cette affirmation est vraie, alors :\n\n- **90 L/s étalés\
    \ sur 620 ha** = 1,25 mm/jour = **perte totale sur 620 ha**.\n- **90 L/s concentrés sur ~233 ha à\
    \ la dose qu'ils réclament** = récolte réelle sur 233 ha, soit de l'ordre de **1,5 M€ et une trentaine\
    \ d'emplois préservés** au lieu de zéro.\n\nMême volume. Résultat opposé. La commission ne peut pas\
    \ créer d'eau, mais elle peut empêcher que celle qui reste soit gaspillée par étalement uniforme.\n\
    \nJe propose donc : **volume global par usage, répartition interne déléguée à la profession**, sous\
    \ trois conditions non négociables :\n\n1. Plan nominatif de répartition remis sous 7 jours, adopté\
    \ à **double majorité** (majorité des 34 exploitations *et* majorité des hectares) — pour que les\
    \ 6 exploitations qui détiennent 300 ha ne puissent pas se servir seules.\n2. **Plancher par exploitation**\
    \ : aucune ne peut être ramenée à zéro sans son accord écrit et indemnisation.\n3. Comptage aux points\
    \ de prise collectifs et scellement des pompes individuelles, financé par le fonds. Sans compteur,\
    \ un quota est une fiction.\n\n**À défaut de plan sous 7 jours, la commission applique le prorata\
    \ surface.** Je dis explicitement que ce défaut est mauvais pour tout le monde : c'est ce qui doit\
    \ les faire négocier.\n\n## 4. La répartition et l'échelle de paliers\n\nLe débit réservé de 180 L/s\
    \ n'est pas à moi de répartir : il est fixé par arrêté préfectoral. **Je ne demanderai pas de dérogation**,\
    \ et je l'assume : se tromper contre la rivière coûte une décennie et deux frayères non reconstituables\
    \ ; se tromper contre le maraîchage coûte une saison, chiffrable et partiellement indemnisable. L'asymétrie\
    \ décide. Accessoirement, une dérogation ferait tomber la base juridique de tout le dispositif.\n\n\
    Reste 230 L/s à partager.\n\n| Palier | Débit moyen 5 j | Réservé | Régie | Maraîchage |\n|---|---|---|---|---|\n\
    | N1 | ≥ 410 | 180 | 140 | **90** |\n| N2 | 380–409 | 180 | 138 | 62 |\n| N3 | 350–379 | 180 | 135\
    \ | 35 |\n| N4 | 330–349 | 180 | 130 | 20 *(goutte-à-goutte, noyau prioritaire)* |\n| N5 | 300–329\
    \ | 180 | **120** *(plancher vital)* | 0 |\n| N6 | < 300 | non atteignable | 120 | 0 | \n\nLe palier\
    \ N6 n'est plus une décision de commission : c'est une saisine immédiate du préfet.\n\n**Deux garanties\
    \ fermes à la régie :** 120 L/s de plancher vital, priorité absolue sur tout autre usage, à tous les\
    \ paliers, EHPAD inclus. La tranche au-dessus de 120 est conditionnée à l'audit de demande.\n\n**Pendant\
    \ la fenêtre de vérification (J+0 à J+5), nous fonctionnons au palier N2**, pas N1 — parce qu'en cas\
    \ de surestimation de la station, le volume manquant est physiquement prélevé sur l'aval, c'est-à-dire\
    \ sur le seul poste irréversible. La marge de prudence est prise sur les usages ajustables. **Ce sont\
    \ les maraîchers qui en paient l'essentiel, et c'est leur grief le plus légitime contre moi.** C'est\
    \ pourquoi le jaugeage est la ligne 1 du budget et se fait en 5 jours, pas en 15.\n\n## 5. Les 600\
    \ 000 €\n\nRépartis selon le nombre de litres/seconde réellement achetés par euro :\n\n| Poste | Montant\
    \ | Ce que ça produit |\n|---|---|---|\n| Jaugeage indépendant, 2ᵉ point de contrôle, télétransmission,\
    \ compteurs agricoles | 40 k€ | Certitude sur ±40 L/s |\n| Recherche de fuites et réparations réseau\
    \ Ferney | 180 k€ | **La seule ligne qui crée de l'eau neuve** : 10 à 25 L/s plausibles sous 4 semaines\
    \ |\n| Goutte-à-goutte, paillage, tours d'eau nocturnes | 120 k€ | +20 à 30 % de surface à volume\
    \ constant |\n| Indemnisation de la mise en jachère volontaire ciblée | 200 k€ | **Achat de la concentration**\
    \ — on paie ceux qui renoncent, on ne saupoudre pas |\n| Réserve : citernage EHPAD, aléas | 60 k€\
    \ | Le tampon de 4 jours de la régie est un risque en soi |\n\nJe signale que 600 k€ face à 4,1 M€\
    \ représente 15 %. Employés en indemnisation forfaitaire, ils ne sauvent rien. Employés à acheter\
    \ la réallocation et à colmater le réseau, ils changent le résultat.\n\n**Le tampon de 4 jours de\
    \ la régie** est un problème indépendant de l'arbitrage : une panne de pompe ou un épisode de turbidité\
    \ met 9 200 personnes et un EHPAD en difficulté en 96 heures. Contrat de citernage pré-signé cette\
    \ semaine, quel que soit le vote.\n\nÀ instruire, sans que j'en fasse un acquis : retenues collinaires\
    \ existantes, forages privés recensés, et réutilisation des eaux traitées de la STEP de Ferney (~15\
    \ L/s d'ordre de grandeur, mais réglementation restrictive sur les cultures consommées crues).\n\n\
    ## 6. La correction de 2022\n\nLe dispositif de 2022 a échoué parce qu'il levait sur un signal instantané.\
    \ Le 9 août l'a démontré : 520 L/s deux jours, reprise totale le 11, retour à 340 en quatre jours.\n\
    \nNouvelle règle, **asymétrique** :\n\n- **Durcissement** : moyenne glissante 72 h sous le seuil du\
    \ palier → automatique, sans vote.\n- **Levée** : moyenne glissante **10 jours** supérieure d'au moins\
    \ **15 %** au seuil du palier, **et** débit non décroissant sur les 5 derniers jours, **et** un palier\
    \ à la fois, avec **10 jours de maintien** avant le suivant.\n\nTestée sur l'épisode du 9 août, cette\
    \ règle n'aurait rien levé : la moyenne 10 jours reste très en dessous du seuil, et le test de non-décroissance\
    \ échoue seul. C'est vérifiable sur les données de 2022 et je le mettrai en annexe.\n\n## 7. Ce que\
    \ je dis à chacun\n\n**À la régie.** Votre plancher est garanti, prioritaire, écrit, et il ne dépend\
    \ d'aucun vote. Vous n'avez rien à défendre en séance. En contrepartie, la tranche au-dessus de 120\
    \ est conditionnée à l'ouverture de vos données : 1 409 L/habitant/jour n'est pas un chiffre de distribution\
    \ domestique, et je ne demanderai pas aux maraîchers de renoncer à une récolte tant que ce nombre\
    \ n'est pas expliqué. **Tout volume récupéré par l'audit et les réparations va intégralement au maraîchage**,\
    \ pas au budget de la régie.\n\n**Aux maraîchers.** Votre demande n'est pas excessive et je le dirai\
    \ publiquement : 3,34 mm/jour, c'est déjà la moitié du besoin. Je ne peux pas vous donner 240. Je\
    \ peux vous donner le choix de l'usage : 90 L/s répartis uniformément, c'est zéro récolte sur 620\
    \ ha ; 90 L/s sur 233 ha à votre propre dose, c'est ~1,5 M€ et une trentaine d'emplois. Cette répartition\
    \ est la vôtre, pas la mienne — sous double majorité et plancher, pour que les six grandes exploitations\
    \ ne décident pas seules. Et 200 000 € payent la jachère de ceux qui renoncent.\n\n**À la presse et\
    \ au public.** Ce n'est pas « les paysans contre les robinets ». La contrainte qui mord est un seuil\
    \ écologique légal que je n'ai pas le pouvoir de modifier, plus une mesure que personne n'a vérifiée\
    \ depuis trois ans. La vraie question de jeudi est : **qui supporte l'incertitude ?** Ma réponse :\
    \ provisoirement les usages réversibles, et pour cinq jours seulement, le temps d'aller la lever.\n\
    \n## 8. L'objection la plus forte contre ma position\n\n*Vous imposez aux maraîchers une réduction\
    \ de 62 %, sur la base d'un débit que vous venez vous-même de déclarer non fiable, pour respecter\
    \ un seuil de 180 L/s issu d'un unique rapport du 12 juin — antérieur au cœur de l'étiage. Si le débit\
    \ réel est 450 et si 160 L/s pendant trois semaines n'avaient pas de coût écologique mesurable, vous\
    \ aurez détruit plus d'un million d'euros pour une précaution que vous ne savez pas chiffrer.*\n\n\
    Cette objection est solide et je ne la contourne pas. Trois réponses :\n\n1. L'asymétrie des erreurs\
    \ n'est pas symétrique en durée : une saison de légumes contre une décennie de rivière.\n2. Je n'ai\
    \ pas la compétence juridique d'abaisser le 180 ; l'objection vise le préfet, pas la commission.\n\
    3. Et surtout : **je rends la révision automatique et orientée vers celui qui paie**. Si le jaugeage\
    \ confirme un débit supérieur, le passage au palier supérieur est de droit sous 24 h, sans nouveau\
    \ vote, et le volume supplémentaire va au maraîchage. Ils portent le risque de l'incertitude, ils\
    \ en portent aussi le bénéfice.\n\n## 9. Ce qui déclencherait l'abandon de cette position\n\nJe m'engage\
    \ à la retirer si l'un de ces faits survient :\n\n- Le jaugeage indépendant écarte la mesure de la\
    \ station de plus de 8 % → toute l'échelle de paliers est recalée avant application.\n- Aucun plan\
    \ de répartition à double majorité sous 7 jours → passage au prorata surface, et je le porte comme\
    \ un échec de la méthode, pas comme une sanction.\n- L'audit de la régie montre que 150 L/s correspond\
    \ bien à un besoin réel incompressible → le déficit est structurel, ma répartition ne tient plus,\
    \ et le dossier relève du préfet et non de la commission.\n- Réserve de Ferney sous 48 h à un moment\
    \ quelconque → suspension immédiate de toute allocation agricole, sans délibération.\n\nRelevés publiés\
    \ chaque lundi, comité de contrôle avec un maraîcher, un représentant de la régie et un représentant\
    \ de la fédération de pêche. La confiance manque ; elle ne se rétablira pas par le vote de jeudi,\
    \ mais par des chiffres que les trois parties lisent en même temps.\n\n---\n\nSi vous voulez, je peux\
    \ en tirer la note formatée pour circulation (2 pages + annexe technique sur le test rétrospectif\
    \ de la règle de levée sur l'épisode du 9 août).\n"
