    ---


    # Note au comité de direction — vendredi 14 août 2026


    **Objet :** renouvellement du prestataire de paiement — arbitrage A / B

    **Décision demandée :** mandat de signature Payflux sous conditions + autorisation de notifier Solda


    ## Recommandation : option B, calendrier modifié


    Bascule progressive, démarrage **semaine du 7 septembre**, paliers 10 % → 25 % → **50 % atteint le
    5 octobre**, puis **gel à 50/50 du 20 novembre au 3 janvier**, passage à 100 % **semaine du 4 janvier**,
    fermeture de Solda en février. Nous traversons le pic de fin d''année avec les deux prestataires actifs
    et un aiguillage réversible en 15 minutes.


    ## Pourquoi pas A


    A rapporte **190 k€ de plus** la première année. Ces 190 k€ achètent trois semaines d''apprentissage
    Payflux sur **100 % du trafic**, et **3 jours** de marge entre la fin de stabilisation attendue (24
    nov.) et le Black Friday (27 nov.).


    - Le « 3 semaines » vient d''**un** pilote, chez **un** marchand. Ce n''est pas une constante. Chaque
    semaine de dérive supplémentaire coûte **48 k€ de GMV**.

    - Un taux d''échec à 1,3 % **ne déclenchera pas de repli** : c''est exactement ce que le pilote nous
    a annoncé. Ce n''est pas un incident détectable en 5 minutes, c''est une hémorragie tolérée. L''astreinte
    ne protège pas contre ça.

    - À 100 % sur Payflux, **nous n''avons plus de témoin**. Nous signerions 24 mois avec 240 k€ de pénalité
    sans avoir jamais mesuré l''écart permanent annoncé (0,5 % vs 0,4 %) contre une référence vivante.


    ## Les chiffres


    18 000 tx/j × 42 € = **756 k€ de GMV/jour**, 276 M€/an. **1 point d''échec = 2,76 M€ de GMV/an.**


    | | Option A | **Option B (recommandée)** |

    |---|---|---|

    | Économie brute an 1 | 500 k€ | 310 k€ |

    | Prolongation Solda, décembre | −130 k€ | −130 k€ |

    | Janvier / février si retenus | 0 à −260 k€ | 0 à −260 k€ |

    | **Économie an 1** | **370 à 110 k€** | **180 à −80 k€** |

    | GMV exposé pendant l''apprentissage | **143 k€** | **29 k€** |

    | Trafic sur prestataire non prouvé au Black Friday | **100 %** | **50 %** |

    | Mesure comparative avant engagement 24 mois | non | **oui** |

    | Économie en régime permanent (an 2+) | 500 k€/an | 500 k€/an |


    Deux chiffres à garder en tête :


    - **Écart permanent 0,1 pt** (0,5 % vs 0,4 %) = **276 k€ de GMV/an**, soit 55 % de l''économie affichée
    par A. À faire tomber par SLA **avant** signature, pas après.

    - **99,9 % de disponibilité contractuelle = 43 minutes d''arrêt autorisées par mois.** Une heure d''arrêt
    un jour de pic (volume estimé ×3) : **95 à 180 k€ de GMV**. Sans repli, c''est irrattrapable.


    ## Ce que B protège et que A ne protège pas


    Tant que le compte Solda **reste ouvert**, l''astreinte ramène 100 % du trafic sur Solda en 15 minutes,
    sans recollecte d''empreintes. Le jour où nous fermons Solda, le retour coûte **6 semaines et la recollecte
    de 2,1 millions d''empreintes de carte auprès des clients**. En saison haute, ce n''est pas un plan
    de repli, c''est un arrêt d''activité. **Nous ne fermons pas Solda avant d''avoir mesuré Payflux sur
    un Black Friday réel.**


    ## Le contre-argument, et pourquoi il ne tient pas


    *« A est réversible aussi : il suffit de garder Solda ouvert. »* Exact — et c''est pourquoi la notification
    du 15 octobre est obligatoire dans les deux scénarios. Mais **A garde le filet sans garder la mesure**
    : on pourrait revenir en arrière, on ne saurait pas s''il faut le faire. B coûte 190 k€ et achète
    la preuve, pendant que la sortie sans pénalité est encore ouverte.


    ## Ce qu''on fait lundi 17 août


    1. **Notification Solda** — lettre de prolongation mois par mois **envoyée avant le 15 septembre**
    (échéance dure : 15 octobre). Négocier : la notification ouvre l''option, sans durée minimale imposée.
    — *Juridique + Achats*

    2. **Contrat Payflux** — signature sous trois clauses, sinon nous ne signons pas : (a) les **90 jours
    sans pénalité courent à partir du premier trafic de production**, pas de la signature ; (b) **plancher
    de taux d''échec à 0,45 %** en régime établi, mesuré sur notre tableau de bord, assorti d''avoirs
    ; (c) **engagement de disponibilité renforcé du 20 novembre au 31 décembre**. — *Achats + DirOps*

    3. **Point bloquant à lever cette semaine** — confirmer par écrit que la migration des 2,1 M de jetons
    est une **copie** et non un transfert qui invalide les jetons Solda. Si ce n''est pas une copie, A
    **et** B tombent et nous revenons devant le comité. — *CTO*

    4. **Mesure** — affectation **aléatoire** du trafic (pas par BIN ni par pays) et vue comparative par
    prestataire, opérationnelles avant le 7 septembre. — *Supervision paiement*

    5. **Seuils de repli écrits et pré-autorisés** — échec Payflux > 0,8 % sur 30 min, ou taux d''autorisation
    inférieur de 1,5 pt à Solda sur trafic comparable : l''astreinte ramène à 0 % **sans validation hiérarchique**.
    — *Supervision paiement*

    6. **Gel des changements** du 20 novembre au 3 janvier, repli excepté.


    **Jalons :** 15 oct. notification + feu vert 50 % · 4 janv. passage à 100 % ou sortie · 15 fév. fermeture
    Solda · **28 fév. butoir Solda, non reconductible.**


    ---


    **Hypothèses à confirmer avant vendredi.** Volume Black Friday estimé à ×3 le nominal (non fourni
    au dossier). Les montants d''exposition sont en **GMV exposé**, pas en marge perdue : la part des
    paiements échoués définitivement perdue après relance n''est pas connue et divise mécaniquement ces
    montants. L''économie de 310 k€ de l''option B est supposée **nette** d''environ 4 mois de double
    run ; chaque mois d''overlap supplémentaire coûte 45 k€.


    ---


    Trois points qui ne sont pas dans la note mais que tu dois avoir en tête vendredi :


    **Le calcul central donne A gagnant, et je recommande quand même B.** Sur les valeurs moyennes du
    dossier, l''exposition supplémentaire de A (~114 k€ de GMV) est inférieure à son avantage de 190 k€.
    B ne se justifie pas par l''espérance mathématique mais par la queue de distribution : un incident
    majeur un jour de pic sans repli, et l''impossibilité de mesurer l''écart permanent avant de s''engager
    24 mois. Si la présidente attaque sur ce point, c''est la bonne réponse — pas un calcul plus favorable.


    **Le vrai arbitrage n''est pas A vs B, c''est « fermer Solda ou pas ».** Le transfert de jetons n''est
    pas irréversible ; la *fermeture du compte* l''est. D''où le point 3 : si la migration n''est pas
    une copie, toute l''analyse s''effondre et il faut le savoir avant vendredi, pas en novembre.


    **L''an 1 de B peut être négatif.** Si nous prenons décembre, janvier et février de prolongation Solda,
    B coûte ~80 k€ de plus que renouveler Solda. C''est assumé — le régime permanent est à 500 k€/an dès
    l''an 2 — mais mieux vaut l''annoncer que se le faire découvrir.

    '
