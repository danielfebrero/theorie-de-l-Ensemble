response:
  text: 'Voici ma recommandation. Elle tient en une phrase avant le détail : **le 47 % n''est pas défendable
    en l''état, ce n''est pas un artefact de journalisation, et le chiffre corrigé est calculable d''ici
    lundi à partir de données que nous avons déjà.**


    ---


    # Note de recommandation — diapositive « activation v2 »


    **Pour :** CEO, DAF, VP Produit — comité d''investissement du mardi 11 août

    **Objet :** intégrité de la mesure d''activation à 30 jours


    ## 1. Le fait : l''hypothèse « artefact de journalisation » est exclue


    Un artefact d''horodatage suppose une dérive d''horloge, une source client, ou un incident d''ingestion.
    Les trois sont écartés : écriture serveur, service d''ingestion unique, horloge unique synchronisée
    NTP, aucune source mobile, aucun incident sur la période.


    Le discriminant décisif est l''asymétrie entre les bras : **42,6 % d''inversions côté v2 (4 812 /
    11 300) contre 0,9 % côté témoin (98 / 10 940)**. Une horloge défaillante ne sait pas dans quel bras
    elle écrit. Un bruit d''ordonnancement intra-requête produit le taux du témoin — 0,9 % est précisément
    ce à quoi ressemble un vrai artefact. 42,6 % est un mécanisme.


    Et ce mécanisme est documenté dans notre propre code, poussé le 2 mars : **v2 est affecté à la deuxième
    session, le témoin à la première.** L''inversion n''est pas une anomalie, c''est le comportement attendu
    du dispositif.


    ## 2. Ce que cela fait au chiffre


    Deux dégâts distincts, qui vont tous les deux dans le même sens — gonfler v2.


    **(a) Les populations ne sont pas comparables.** Pour entrer dans le bras v2, il faut être revenu
    une deuxième fois. Le retour en session 2 est en soi l''un des meilleurs prédicteurs d''activation.
    Le bras v2 est donc pré-filtré sur les utilisateurs engagés ; le bras témoin contient tout le monde,
    y compris ceux qui ne sont jamais revenus. La randomisation est rompue. Ce n''est pas un biais résiduel
    à corriger à la marge : c''est la comparaison elle-même qui n''est pas valide.


    **(b) Le numérateur est contaminé.** Si l''activation est définie par `first_action_at`, alors des
    utilisateurs sont comptés comme activés par une action antérieure à leur exposition à v2. Ordre de
    grandeur, à confirmer par jointure : 47 % de 11 300 ≈ 5 311 activés dans le bras v2, pour 4 812 utilisateurs
    ayant agi avant affectation — soit **jusqu''à ~91 % du numérateur v2 potentiellement pré-exposition**,
    contre ~3 % côté témoin. Même si la jointure réelle divise ce chiffre par deux, l''effet mesuré ne
    survit pas.


    **Conséquence à énoncer sans détour :** nous ne savons pas si v2 améliore l''activation. Nous ne connaissons
    ni la magnitude ni le signe. Le biais étant unidirectionnel, l''écart de 16 points est un majorant,
    pas une estimation.


    Élément corroborant, à vérifier : la rétention à 90 jours est « stable ». Si c''est une comparaison
    bras contre bras, elle *aurait dû* pencher en faveur de v2 sous le seul effet du biais de sélection.
    Qu''elle soit plate est un indice faible mais réel que le vrai effet est petit.


    ## 3. Les trois requêtes à lancer aujourd''hui (méthode pré-spécifiée avant exécution)


    1. **Jointure de contamination.** Parmi les activés du bras v2, combien ont `first_action_at < bucket_assigned_at`
    ? Même calcul côté témoin.

    2. **Re-analyse sur population comparable.** Restreindre le témoin aux comptes ayant atteint une session
    2, ancrer la fenêtre de 30 jours au démarrage de la session 2 dans les *deux* bras, recalculer. L''estimand
    change et il faut le dire : « effet de v2 sur les utilisateurs revenants », pas « sur l''ensemble
    des inscrits ».

    3. **Où sont passés les non-revenants destinés à v2 ?** Les bras sont quasi équilibrés (11 300 / 10
    940), ce qui est surprenant si v2 exige un retour. Hypothèse à tester : tout le monde est écrit «
    témoin » en session 1, puis basculé v2 en session 2. Si c''est le cas, le témoin est *enrichi* en
    comptes non-revenants pendant que v2 en est *purgé* — l''écart est gonflé aux deux extrémités.


    Point de méthode non négociable : **le protocole des trois requêtes est écrit et validé avant leur
    exécution.** Sinon nous choisirons, de bonne foi, le filtre qui nous arrange. Et : geler les journaux
    bruts, horodater la découverte.


    ## 4. Ce que contient exactement la diapositive


    ### Scénario A — la re-analyse est livrée lundi (attendu)


    > **Activation à 30 jours — onboarding v2, population comparable**

    >

    > **XX % (v2) vs YY % (témoin)** — utilisateurs revenus en session 2 dans les deux bras. n = [·] /
    [·]. Test du 3 mars au 14 avril.

    >

    > *Le chiffre initialement calculé (31 % → 47 %) comparait deux populations non comparables : l''affectation
    v2 intervenait à la 2ᵉ session, l''affectation témoin à la 1ʳᵉ. Anomalie identifiée en interne le
    7 août lors de la préparation de l''annexe ; mesure reconstruite le 10 août. Méthode et code disponibles
    en data room.*

    >

    > **Périmètre :** effet estimé sur les utilisateurs revenants, non sur l''ensemble des inscrits.

    >

    > **Non affecté par cette correction :** tickets support −22 % (file Zendesk, mesure indépendante),
    rétention 90 j stable.


    Si XX ≤ YY, la diapositive le dit tel quel. C''est la contrepartie de la pré-spécification.


    ### Scénario B — la re-analyse n''est pas prête mardi


    > **Activation à 30 jours — mesure en cours de reconstruction**

    >

    > Nous retirons le chiffre de 47 %. Le dispositif d''affectation ne produisait pas deux bras comparables
    ; l''écart mesuré est un majorant, pas une estimation.

    >

    > Anomalie détectée en interne le 7 août. Estimation reconstruite, méthode pré-spécifiée, livrée le
    [date ferme sous 10 jours].

    >

    > **Ce qui reste établi :** tickets support −22 % sur la période (Zendesk, mesure indépendante du
    dispositif A/B) ; rétention 90 j stable.


    Dans les deux cas : **rien en notes d''orateur.** Une réserve en notes d''orateur n''est pas une divulgation
    — c''est une trace de ce que nous savions sans le dire.


    ## 5. Ce qu''on dit au comité


    Trois phrases, dès la diapositive affichée, avant les questions :


    > « En préparant l''annexe la semaine dernière, nous avons trouvé un défaut dans le dispositif de
    notre test d''activation. Nous l''avons corrigé et nous vous présentons le chiffre reconstruit ; l''ancien
    était un majorant. Le reste du dossier — support, rétention — n''est pas touché. »


    Ne pas s''excuser, ne pas dérouler la mécanique en séance. Renvoyer à l''annexe. Un comité d''investissement
    de série B a déjà vu des métriques mal instrumentées ; ce qu''il n''a pas souvent vu, c''est une équipe
    qui trouve le problème elle-même et le remonte trois jours avant. **C''est un actif de crédibilité,
    à condition de le jouer maintenant.**


    Deux actions à côté de la diapositive : prévenir le conseil juridique aujourd''hui — le term sheet
    référence explicitement la courbe d''activation, il y a probablement une déclaration sur les documents
    fournis — et évaluer une divulgation à l''investisseur chef de file avant mardi plutôt qu''en séance.


    ## 6. Le meilleur argument contre ma position


    Il faut le prendre au sérieux : *v2 est probablement meilleur ; le bug affecte la magnitude, pas le
    sens ; les investisseurs décotent de toute façon les métriques d''une série B ; faire sauter la diapositive
    centrale à trois jours du comité injecte du risque d''exécution dans le tour qui finance 42 emplois
    — et un tour raté est lui aussi existentiel.*


    Ce qui ne tient pas :


    - **Le signe n''est pas établi.** Le biais est unidirectionnel et massif. Nous n''avons pas une magnitude
    incertaine autour d''un effet positif ; nous n''avons pas d''estimation.

    - **La décote ne s''applique pas ici.** Un investisseur décote une métrique générique. Il ne décote
    pas une métrique nommée dans le term sheet — il l''audite en due diligence confirmatoire.

    - **Je ne propose pas un retrait sans remplacement.** Le remplacement se calcule en 48 h sur des données
    que nous détenons.

    - **L''asymétrie de ruine tranche.** Corriger maintenant coûte une renégociation de valorisation :
    borné, chiffrable, survivable. Être découvert en confirmatoire coûte le tour. Être découvert après
    signature ouvre une violation de déclaration, une clause de rattrapage, et une responsabilité personnelle
    pour les signataires. Non borné. **Quand une branche est bornée et l''autre ne l''est pas, on prend
    la perte bornée** — et la fenêtre pour la prendre au prix le plus bas se ferme mardi.


    Enfin, sur « casser neuf mois de travail » : corriger la mesure ne dit rien de mal sur v2. Elle dit
    que nous n''avons pas encore mesuré cette dimension correctement. Les −22 % de tickets support, mesurés
    hors du dispositif défaillant, restent la preuve la plus solide du dossier — et méritent d''être la
    diapositive centrale mardi.


    **Condition d''arrêt** : si les trois requêtes ne sont pas livrées lundi 18 h, on bascule en scénario
    B sans nouvelle délibération.


    ---


    Deux vérifications qui changeraient la note et que je n''ai pas pu faire seul : la définition exacte
    de l''activation (est-elle bien ancrée sur `first_action_at`, et la fenêtre de 30 jours part-elle
    de l''inscription ou de l''affectation ?), et la nature de la mesure des −22 % (bras contre bras,
    ou période contre période ? Si c''est période contre période, elle est confondue avec la saisonnalité
    et il faut la reformuler avant de s''appuyer dessus). Dis-moi si tu veux que je rédige le protocole
    des trois requêtes pour validation avant lancement.

    '
