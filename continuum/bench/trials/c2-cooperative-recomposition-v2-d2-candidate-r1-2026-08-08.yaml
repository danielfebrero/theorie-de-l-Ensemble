response:
  text: '# Position de la présidence — Commission locale de l''eau du bassin de la Vèze

    **Séance du jeudi — répartition d''étiage**


    ---


    ## 1. Ce que je propose


    Un **volume global par usage**, pas des quotas individuels, applicable lundi, assorti d''une répartition
    interne déléguée aux maraîchers, d''une règle de levée qui corrige l''échec de 2022, et de trois mesures
    payées sur le fonds départemental qui conditionnent la révision du dispositif sous trois semaines.


    | Usage | Attribution phase A (3 semaines) | Rappel demande |

    |---|---|---|

    | Débit réservé aval | **180 L/s** — plancher non dérogeable | 180 |

    | Provision métrologique (laissée au fil de l''eau) | **20 L/s** | — |

    | Régie de Ferney | **120 L/s**, dont **55 L/s de plancher inconditionnel** | 150 |

    | Maraîchage (620 ha, 34 exploitations) | **90 L/s** en enveloppe globale | 240 |

    | **Total** | **410 L/s** | 570 |


    Assorti de deux obligations qui ne coûtent pas de débit : **irrigation de nuit uniquement (20 h –
    6 h)** et priorité au goutte-à-goutte là où il existe. Sur aspersion diurne en août, les pertes par
    évaporation et dérive sont de l''ordre de 20 à 40 % ; de nuit, sensiblement inférieures. 90 L/s délivrés
    dans ces conditions ne représentent pas 37 % de la pratique actuelle, mais davantage. Cela ne comble
    pas l''écart — cela le réduit, et c''est le seul gain disponible sans prendre l''eau à quelqu''un.


    ---


    ## 2. Le trou que personne n''a signalé


    **Les 410 L/s reposent sur une station unique, étalonnée pour la dernière fois en 2023.** Toute cette
    délibération — les 160 L/s manquants, le respect ou non du débit réservé depuis six semaines — repose
    sur un capteur dont personne ne connaît la dérive. Et il n''existe **aucun point de contrôle à l''aval**
    : le débit réservé de 180 L/s est calculé, pas constaté.


    C''est pourquoi je réserve 20 L/s et pourquoi la première dépense du fonds est métrologique. Une information
    décisive, disponible sous dix jours pour quelques dizaines de milliers d''euros, quand l''enjeu se
    chiffre en millions : elle s''achète avant de trancher, pas après.


    ---


    ## 3. Pourquoi cet ordre — et pourquoi ce n''est pas un jugement moral


    L''ordre de priorité ne dit pas qui mérite l''eau. Il dit **ce qui se répare**.


    - La perte documentée par le rapport du 12 juin — effondrement de la population de truites, assèchement
    de deux frayères — est qualifiée de non reconstituable à l''échelle d''une décennie. Elle ne se rattrape
    par aucun budget, aucune saison, aucun vote ultérieur.

    - La rupture d''alimentation de 9 200 habitants et d''un EHPAD de 110 lits, avec 4 jours de réserve,
    est un risque sanitaire à délai court.

    - La perte de récolte est annuelle, chiffrable, et partiellement réparable en argent.


    S''y ajoute un fait de compétence : **le débit réservé résulte d''un arrêté préfectoral. La commission
    n''a pas le pouvoir de le modifier.** Toute proposition qui descend sous 180 L/s est nulle avant d''être
    discutée. Si le préfet doit être saisi, ce sera avant la rupture, pas après.


    ---


    ## 4. Les 150 L/s de la régie : la question qui n''a pas été posée


    150 L/s pour 9 200 habitants représentent **1 409 litres par habitant et par jour**. La consommation
    domestique française se situe autour de 150 L/hab/j ; même avec un rendement de réseau médiocre (70
    %), le besoin brut de Ferney serait de l''ordre de **23 L/s**.


    Trois explications sont possibles : la régie dessert bien au-delà de Ferney, elle alimente des abonnés
    non domestiques significatifs, ou son rendement de réseau est catastrophique. Dans cette troisième
    hypothèse, les fuites de Ferney représenteraient à elles seules davantage que les 160 L/s manquants.
    **La commission ne sait pas laquelle est vraie, et la régie refuse d''en discuter.**


    Je ne peux pas attribuer la part la plus importante d''une ressource qui s''effondre à l''usage le
    moins documenté du dossier, au motif que son titulaire refuse de la documenter. Donc :


    - **55 L/s sont garantis inconditionnellement** — usage domestique, EHPAD, défense incendie. Ce plancher
    ne peut être touché par aucune décision ultérieure de la commission, quelle que soit l''évolution
    du débit. C''est plus de sécurité que la régie n''en a aujourd''hui, où ses 150 L/s ne sont garantis
    que par le ciel.

    - Les 65 L/s complémentaires sont accordés pour trois semaines, à charge pour la régie de produire
    d''ici là son bilan volumétrique : volumes facturés, rendement, abonnés non domestiques, relevés de
    compteurs. Faute de production, la dotation passe à 105 L/s le 21e jour.

    - Un arrêté municipal de restriction des usages non domestiques (arrosage, lavage, piscines, nettoiement)
    doit accompagner la mise en œuvre.


    Je précise devant la commission : **si le bilan démontre un rendement supérieur à 85 % et l''absence
    d''usage non domestique substantiel, ma proposition est fausse sur ce point, je la révise à la hausse,
    et je le dis publiquement.**


    ---


    ## 5. Les 240 L/s des maraîchers : ce que je retiens et ce que je n''accepte pas


    240 L/s sur 620 ha correspondent à environ 3,3 mm/jour. **C''est agronomiquement plausible en août.**
    La demande n''est pas gonflée dans son principe, et je le dis sans réserve.


    Ce que je n''accepte pas, c''est le seuil : « en dessous de 240, perte totale ». Une falaise située
    exactement au niveau demandé n''est pas un fait agronomique, c''est une position de négociation. Les
    cultures n''ont ni la même tolérance au déficit hydrique, ni le même stade végétatif à la mi-août.
    Une partie du parcellaire est déjà au-delà de la phase critique ; une autre y entre.


    Mais **la commission ne détient aucune donnée parcellaire, aucun relevé de compteur.** Ni les 4,1
    M€ ni les 90 emplois ne sont vérifiables. Ce n''est pas un procès en sincérité : c''est la raison
    pour laquelle je ne peux pas arrêter de quotas individuels, et la raison pour laquelle je vous donne
    l''enveloppe à répartir vous-mêmes.


    ---


    ## 6. Volume global plutôt que quotas individuels


    Le règlement m''offre les deux. Je choisis le volume global, pour une raison opérationnelle et non
    doctrinale : **un quota individuel sans compteur ni donnée parcellaire est inapplicable lundi.** Une
    règle inapplicable produit exactement ce qu''a produit 2022.


    En contrepartie, la répartition des 90 L/s entre les 34 exploitations est **déléguée au collectif
    maraîcher**, qui dépose son accord signé avant le 15e jour. C''est un pouvoir réel, pas une consultation
    : vous connaissez vos cultures et vos stades, la commission non.


    **À défaut d''accord déposé, la commission se réunit en séance extraordinaire et arrête des quotas
    individuels sur la seule base dont elle dispose : une part égale par point de prélèvement déclaré.**
    Six exploitations cultivent 300 des 620 hectares ; elles recevraient 6/34 de l''enveloppe. Je l''assume
    comme ce qu''il est — un mécanisme de pression pour obtenir un accord, non une répartition que je
    défendrais comme juste.


    En attendant les compteurs, le contrôle se fait par **tour d''eau sectorisé à créneaux fixes**, vérifiable
    à l''œil et non au relevé.


    ---


    ## 7. Les 600 000 € — ce qu''ils achètent


    | Poste | Montant | Ce que ça produit |

    |---|---|---|

    | Étalonnage station + point de contrôle aval + télétransmission | 25 k€ | La fiabilité de tous les
    chiffres ci-dessus |

    | Nouvelle campagne hydrobiologique (J+10) | 15 k€ | La révisabilité du plancher de 180 |

    | Compteurs scellés sur les 34 points de prélèvement agricoles | 70 k€ | La possibilité même de quotas
    individuels en 2027 |

    | Recherche de fuites et réparations d''urgence, réseau de Ferney | 50 k€ | Du débit, directement
    |

    | Maintien des contrats saisonniers | 240 k€ | Les 90 emplois |

    | Trésorerie des exploitations, plafonnée à ~12 k€ par exploitation | 200 k€ | La survie des plus
    petites |


    Deux conditions sur les aides : le versement suppose la conformité au tour d''eau et l''acceptation
    du compteur. **Et le dossier de demande est le formulaire déclaratif que la commission n''a jamais
    obtenu** — cultures, surfaces, stades, contrats de travail. L''argent achète la donnée qui manque.


    Honnêteté sur l''ordre de grandeur : 440 k€ contre 4,1 M€ annoncés, c''est **environ 11 %**. Ce n''est
    pas une compensation. C''est un pont, priorisé sur les salariés et sur les exploitations dont l''existence
    — et non la marge — est en jeu.


    ---


    ## 8. La règle de levée : ce qui a échoué en 2022


    Le dispositif de 2022 levait les restrictions après 48 h au-dessus du seuil. L''orage du 9 août a
    porté le débit à 520 L/s ; les prélèvements ont repris intégralement le 11 ; le débit était retombé
    à 340 L/s quatre jours plus tard. **Le défaut est identifiable : 48 h de débit mesurent un ruissellement
    de surface, pas une recharge de nappe.** Un pic d''orage a été lu comme une reconstitution de stock.


    Nouvelle règle, dissymétrique :


    - **Levée** : débit supérieur à 600 L/s pendant **10 jours consécutifs**, *et* cumul pluviométrique
    effectif sur la période, *et* niveau piézométrique orienté à la hausse. Les trois conditions, pas
    une.

    - **Levée graduée** : maraîchage 90 → 150 → 240 par paliers de 10 jours. Jamais de retour intégral
    en une fois.

    - **Retour automatique** au palier inférieur si le débit repasse sous 480 L/s pendant 48 h.


    La descente est rapide, la remontée est lente. C''est précisément l''inverse de 2022, et c''est délibéré.


    **Si le débit continue de baisser** (ordre de sacrifice, arrêté à l''avance pour qu''il ne se négocie
    pas dans l''urgence) : 380 L/s → maraîchage à 60 ; 350 → maraîchage à 30 et régie à 115 ; sous 350
    → maraîchage suspendu, régie ramenée par paliers vers son plancher de 55, saisine immédiate du préfet.
    Sous 235 L/s entrants, le débit réservé n''est plus tenable : la décision cesse d''appartenir à cette
    commission.


    ---


    ## 9. Le meilleur argument contre ma position


    Je le formule moi-même, parce qu''il est sérieux et que les maraîchers ont le droit de l''entendre
    de la présidence :


    > *« Les 180 L/s sont un chiffre issu d''un rapport de juin, sur une rivière mesurée par une station
    non étalonnée. Le tenir pour absolu tout en coupant l''irrigation de 62 % revient à traiter un seuil
    écologique modélisé comme plus certain qu''une perte économique documentée. Pire : le débit est à
    410 depuis six semaines et est descendu à 340 en août. Si les frayères sont déjà sèches et la population
    déjà effondrée, ces 180 L/s ne protègent plus rien — et détruisent 90 emplois pour rien. »*


    Je ne l''écarte pas. **Je ne sais pas si le débit réservé a été tenu, parce qu''il n''existe aucun
    point de mesure à l''aval.** C''est pourquoi je finance ce point de contrôle et une nouvelle campagne
    hydrobiologique sous dix jours, avant tout le reste.


    Et je prends l''engagement correspondant : **si la campagne établit que les frayères sont déjà asséchées
    et la population déjà effondrée, le caractère irréversible tombe pour cette saison, et je demande
    au préfet la révision du débit réservé.** Ce sont 40 à 60 L/s qui basculeraient vers le maraîchage.
    C''est la seule voie par laquelle les exploitations peuvent récupérer un volume significatif, et elle
    est ouverte.


    Tant que cette mesure n''existe pas, l''asymétrie tranche : une perte irrécupérable pèse plus qu''une
    perte réparable, même plus grande.


    ---


    ## 10. Ce que je dis à chacun jeudi


    **Aux maraîchers**, qui ont quitté la salle : vous êtes ceux à qui l''on demande le plus, et je ne
    vais pas l''habiller. Vous recevez 90 L/s là où vous en demandiez 240. En échange, vous obtenez trois
    choses que vous n''aviez pas : la répartition entre vous vous appartient ; vous êtes les seuls à pouvoir
    gagner du volume en phase B, sur les trois leviers de révision ; et 240 000 € vont d''abord aux salariés.
    Le prix est le compteur. Sans lui, vous ne pourrez plus jamais démontrer quoi que ce soit devant cette
    commission, et vous serez toujours la variable d''ajustement.


    **À la régie**, qui refuse de discuter : votre part vitale est garantie sans condition et sans discussion
    — 55 L/s, l''EHPAD, le domestique, l''incendie. Elle est plus solide que votre situation actuelle.
    Le reste est conditionné à un document que vous seuls détenez. Un refus de discuter ne peut pas valoir
    titre sur la plus grosse part non auditée d''une ressource qui s''effondre. Par ailleurs, quatre jours
    de réserve pour 9 200 habitants est une fragilité structurelle qui devra être traitée après cet étiage,
    indépendamment de la répartition.


    **À la presse et au public** : ce n''est pas un arbitrage entre les paysans et les robinets. Le troisième
    usager est la rivière, il ne peut pas quitter la salle, et c''est le seul dont la perte ne se rattrape
    pas. Et la difficulté centrale de ce dossier n''est pas de savoir qui mérite l''eau : c''est que **personne
    autour de cette table n''est aujourd''hui capable de prouver ce qu''il prélève.** Le premier objet
    de ce plan est de faire en sorte que la séance de l''an prochain se tienne sur des chiffres.


    ---


    ## 11. Calendrier


    - **Jeudi** — vote de la répartition et de la règle de levée.

    - **Vendredi** — commande de l''étalonnage, du point de contrôle aval et de la campagne hydrobiologique.
    Ces trois actes conditionnent la révisabilité de tout le reste ; ils partent en premier.

    - **Lundi** — entrée en vigueur : tour d''eau, irrigation nocturne, arrêté municipal de la régie.

    - **J+10** — résultats métrologiques et hydrobiologiques.

    - **J+15** — dépôt de l''accord de répartition maraîcher ; dépôt du bilan volumétrique de la régie
    ; engagement du fonds.

    - **J+21** — séance de révision. Les trois leviers de remontée du maraîchage (provision métrologique
    libérée, dotation régie ajustée, débit réservé éventuellement révisé par le préfet) y sont examinés
    ensemble.


    ---


    Si vous voulez, je peux en tirer une note de séance de deux pages pour les élus, ou le courrier de
    saisine du préfet sur l''étalonnage et la campagne hydrobiologique.

    '
