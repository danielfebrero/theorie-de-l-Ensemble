response:
  text: 'Le plan est rédigé. Les trois choses qui le structurent :


    **Le facteur limitant n''est pas l''autonomie, c''est la borne.** À 22 kW, une charge complète rend
    197 km par 2 °C — soit 33 km rechargés par heure de borne. Une tournée moyenne de 168 km consomme
    donc 5,1 h, et la fenêtre nocturne de ~14 h ne permet que deux véhicules par borne. Même avec les
    8 bornes devisées : 22 × 2 = **44 véhicules**. La subvention en exige 60. Le débat sur l''autonomie
    a masqué le vrai plafond pendant cinq mois.


    **Ce qui débloque, c''est la note reçue hier — mais pas le chiffre qu''on en retient.** « 11 sur 120
    » n''est pas l''information ; « toutes au-dessus de 190 km » l''est. En affectant l''électrique aux
    seules tournées courtes, la charge tombe à 4,3 h, on passe à trois rotations par borne, et 22 bornes
    portent **66 véhicules**. Les deux leviers sont nécessaires : les bornes seules donnent 44, la segmentation
    seule 42.


    **Le calendrier des préavis prime sur celui des livraisons.** 480 €/mois contre 900 € par tournée
    manquée : garder un diesel est rentable dès 2,5 % d''échec sur sa tournée, contre 9,2 % mesurés à
    l''essai. Et prolonger est réversible quand rendre coûte 11 semaines. La première date irréversible
    n''est pas en septembre — c''est le préavis conservatoire sur le lot de septembre, **avant le 15 août**,
    donc avant que le conseil ne se réunisse à nouveau.


    Trois points signalés au conseil sans les cacher :

    - Les 210 000 € doivent être votés jeudi et commandés le jour même : les 7 semaines de travaux sont
    toute la marge.

    - Faire rouler les 96 véhicules demanderait ~48 bornes, pas 22. **La décision du 4 mai ne finance
    pas l''état final** — il faudra de la recharge à plus forte puissance et une étude de raccordement,
    à lancer maintenant pour une décision au printemps 2027.

    - Une hypothèse porte tout le plan : qu''au moins 66 des 96 tournées passent sous 180 km. La donnée
    est dans le système de planification et s''extrait lundi matin. Si elle est mauvaise, il faut reconstruire
    autour d''un redécoupage des tournées. Si elle est meilleure que prévu, l''enveloppe diesel tombe
    de 112 000 € à ~80 000 €.


    Trois autres vérifications sont datées avant jeudi, dont une qui peut faire tomber la troisième rotation
    : la courbe de charge réelle. Le calcul suppose une charge linéaire, ce qu''une borne 22 kW n''est
    pas au-delà de 80 %. La mesure est déjà dans nos serveurs depuis mars — il suffit de la sortir.

    '
