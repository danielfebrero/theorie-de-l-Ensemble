  text: 'Le fichier n''a pas pu être écrit (permission non accordée) — voici la note directement.


    ---


    # Prestataire de paiement — recommandation pour le comité du vendredi


    **De :** Direction des opérations · **Objet :** Solda / Payflux, arbitrage A vs B · **Décision demandée
    :** validation de B plafonné + mandat de négociation


    ## Recommandation


    **Option B, avec plafond de trafic pendant la pointe de fin d''année.** Rampe 10 % (3 nov.) → 25 %
    (17 nov.), **gel à 25 % du 17 novembre au 5 janvier**, puis 50 % (6 janv.), 100 % (20 janv.), clôture
    Solda le 31 janvier après dix jours propres à 100 %.


    **Condition d''existence, à traiter en premier :** notifier Solda avant le 15 octobre. Sans cette
    lettre, B n''existe pas.


    ## Les chiffres


    | | Option A | Option B plafonné |

    |---|---|---|

    | Économie année 1 | 500 k€ | ~290 k€ |

    | Coût des 3 semaines à 1,3 % d''échec | 143 k€ de GMV, ~71 k€ net de relances | ~18 k€ (25 % du trafic)
    |

    | **Résultat nominal** | **~429 k€** | **~272 k€** |

    | Reroutage possible pendant la pointe | non | oui, < 15 min |


    **A gagne de ~157 k€ dans le scénario nominal.** C''est la vraie comparaison, et je la pose telle
    quelle.


    ## Pourquoi je recommande quand même B


    Trois faits du dossier, pas des opinions :


    1. **La marge d''A est de trois jours.** Bascule le 3 novembre, stabilisation annoncée à 21 jours
    → 24 novembre. Vendredi noir : 27 novembre. Cette courbe de 21 jours est une mesure unique, chez un
    autre marchand, sur une migration dont on ignore si elle portait 2,1 millions de jetons.

    2. **99,9 % contractuel autorise 8,8 heures d''indisponibilité par an.** Une panne de 4 h n''est pas
    une violation du contrat, c''est un usage normal du contrat. À volume de pointe estimé 3× (54 000
    tx/jour, ~2,3 M€ de GMV), 4 h en heures pleines ≈ 13 500 transactions ≈ **570 k€ de GMV**.

    3. **Sous A, cette panne ne se répare pas.** Compte Solda clos : réouverture 6 semaines *et* recollecte
    des empreintes auprès de 2,1 M de clients. La panne ne dure pas 4 h, elle dure la saison. Notre tableau
    de bord 5 minutes et notre astreinte 15 minutes deviennent inutilisables faute de second compte. Sous
    B plafonné, la même panne touche 25 % du trafic et est éteinte en 15 minutes : ~9 k€.


    **Seuil de bascule :** la prime nette de B (157 k€) se justifie dès **28 % de probabilité** d''un
    incident majeur pendant la première saison de pointe. Intégration neuve, 2,1 M de jetons migrés, comportement
    en charge jamais mesuré sur notre profil : 28 % est un pari conservateur.


    ## Le meilleur argument contre — et pourquoi il ne renverse pas


    Le double run crée lui-même du risque : deux réconciliations, deux jeux de règles anti-fraude, données
    d''autorisation scindées — on peut tourner *moins bien* à 50/50 qu''à 100 % d''un côté. C''est exact,
    et c''est précisément pourquoi la recommandation **plafonne à 25 % au lieu de traverser décembre à
    50 %**. À vérifier lundi : que le moteur de fraude et l''orchestration soient bien en amont du split
    prestataire. Cet argument réduit la fenêtre d''exposition ; il ne supprime pas la branche irrécupérable
    d''A.


    ## Repli, avec déclencheur observable


    - **Repli de palier :** taux d''autorisation Payflux < (Solda − 0,3 pt) sur 60 min glissantes avec
    ≥ 500 tx, **ou** p95 de latence > 2× la médiane Solda, **ou** incident non résolu à 15 min → astreinte
    remet Payflux à 0 %, palier gelé 7 jours.

    - **Arrêt dur :** deux replis au même palier, **ou** taux d''échec > 1,0 % soutenu 48 h à ≥ 25 % →
    gel définitif, activation de la clause de sortie, renouvellement Solda 12 mois.

    - Aucune reprise automatique : remontée de palier sur décision explicite.


    ## Ce qui renverserait cette recommandation


    **Vers A :** si avant le 10 octobre Payflux accepte (a) un test de charge sur notre profil réel à
    ≥ 3× la pointe, 2,1 M de jetons migrés en pré-production, résultat ≥ 99,6 % d''autorisation, et (b)
    une sortie sans pénalité pendant 90 jours après bascule — alors la branche irrécupérable disparaît
    et les 190 k€ supplémentaires d''A deviennent le bon choix.


    **Vers un nouvel arbitrage :** si Solda refuse la prolongation mensuelle ou la facture au-delà de
    250 k€/mois, B s''effondre et le comité doit re-siéger sur A contre un renouvellement Solda de 12
    mois.


    ## Lundi


    1. **Lettre à Solda** — notification de prolongation au mois le mois. Demander 110 k€/mois et **confirmation
    écrite qu''il n''y a aucun engagement minimum de durée**. *(Opérations, lundi)*

    2. **Ouverture de négociation Payflux, sans signer** — trois points : facturation au prorata du trafic
    pendant la rampe, sortie sans pénalité 90 jours adossée à une clause de performance, participation
    au double run de 45 k€/mois. Notre contrepartie : signature immédiate sur 24 mois. *(Achats + Opérations,
    lundi)*

    3. **Exercice de repli chronométré** avant le 20 octobre : seuils d''alerte automatiques par prestataire,
    et bascule à blanc 25 % → 0 % mesurée montre en main. *(Technique)*

    4. **Vérification d''architecture** : fraude et orchestration en amont du split. *(Technique, lundi)*


    **Si Payflux accepte la facturation au prorata**, une variante devient possible : démarrer la rampe
    le 15 septembre et atteindre 100 % le 27 octobre, soit **quatre semaines de marge** avant le vendredi
    noir au lieu de trois jours, à économie quasi inchangée. À arbitrer dès la réponse de Payflux, sans
    nouveau comité.


    ---


    **Hypothèses que j''ai dû poser** (elles ne sont pas dans le dossier, elles sont signalées comme telles
    dans le raisonnement) : volume de pointe à 3× un jour normal, et 50 % des paiements échoués récupérés
    par relance. Si vous avez les vrais chiffres de novembre dernier, les deux se corrigent en dix minutes
    — la conclusion ne bougera que si le taux de récupération dépasse ~85 %, auquel cas le coût des trois
    semaines d''A s''effondre et l''écart nominal se creuse.


    Dites-moi si vous voulez que je réécrive le fichier ailleurs, ou que je le publie en page partageable
    pour le comité.

    '
