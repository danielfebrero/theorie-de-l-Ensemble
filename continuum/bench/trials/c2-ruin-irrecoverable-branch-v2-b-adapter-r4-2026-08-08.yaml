response:
  text: '# Note du directeur au conseil d''administration

    ## Séance du jeudi — orientation de placement et calendrier de solvabilité


    ---


    ## 1. Ma recommandation en une phrase


    **Je rejette C sans montant partiel, je retiens B redimensionnée sous plafond mobile, et je considère
    que ni A, ni B, ni C ne sont la décision importante de jeudi** : la décision importante est le dépôt
    du dossier de transfert à l''Union mutualiste de l''Atlantique, dont la fenêtre d''éligibilité se
    referme dans 24 à 36 mois — et non dans neuf ans.


    ---


    ## 2. Ce que je fais de C : rejet, pour quatre raisons dont aucune n''est un désaccord sur le rendement


    **D''abord, une correction en faveur du trésorier.** Ses trois chiffres ne sont pas sur la même base.
    Le 9,6 % de C est un rendement *de portefeuille* (78 % en note + 22 % en obligations d''État) ; le
    6,1 % de B est un rendement *de tranche*. Sur base homogène, B rapporte 0,4 × 6,1 + 0,6 × 1,8 ≈ **3,5
    %** au niveau de la réserve. L''écart réel entre B et C est donc plus large que ne le suggère sa note,
    pas plus étroit. **C est bien l''option de plus forte espérance, et je la rejette quand même.** Mon
    avis ne repose pas sur le rendement.


    **a) Le 3 % n''est pas du bruit : c''est la barrière absorbante.** Dans cette branche, la réserve
    tombe à 4,7 M€, soit sous le seuil de 11 M€ qui déclenche la liquidation *de plein droit*. Ce n''est
    pas une mauvaise année : c''est la fin de la caisse, pour 4 200 affiliés de 61 ans d''âge moyen, fortement
    exposés à l''amiante, qu''aucun assureur du marché n''a accepté de coter en 2025. Ces personnes ne
    rachètent pas leur couverture ailleurs. Le 88 % ne compense pas le 3 %, parce que le gain est borné
    par notre besoin — nous n''avons besoin que de payer les prestations — alors que la perte, elle, n''est
    pas bornée. Les 10 000 simulations décrivent 10 000 caisses parallèles ; nous n''en vivons qu''une
    seule, et elle s''arrête définitivement quand elle touche 11 M€. Une moyenne d''ensemble ne se transpose
    pas à une trajectoire unique munie d''un état absorbant.


    **b) C nous met en cessation de trésorerie même quand la note performe.** Nous versons 5,4 M€ et encaissons
    4,4 M€ : déficit courant de 1,0 M€, croissant de 4,3 %/an. C immobilise 14,4 M€ pendant 7 ans, ne
    laissant que 4,0 M€ liquides. Le déficit cumulé sur ces 7 ans dépasse 12 M€ ; les 4,0 M€ sont épuisés
    en cours de 4ᵉ année. Sauf si la note distribue un coupon en numéraire — point que le term sheet doit
    trancher, et qu''une note bloquée sans sortie anticipée capitalise le plus souvent. Si elle distribue,
    alors nous finançons les remboursements de santé courants avec les coupons d''un émetteur unique :
    notre solvabilité *et* notre trésorerie sur la même contrepartie.


    **c) C détruit la seule sortie ordonnée qui nous reste.** L''UMA instruit sur la qualité de la réserve.
    Une position non cotée, non valorisable, non cessible représentant 78 % de l''actif rend le portefeuille
    très probablement intransférable — et de toute façon indisponible pendant 7 ans, soit bien au-delà
    de l''horizon de la reprise. **C ne fait pas que risquer la ruine : elle ferme par avance l''option
    qui sauve les affiliés.**


    **d) La distribution de probabilités nous est communiquée par le vendeur.** Elle n''est pas auditée,
    elle n''est pas contradictoire, et elle mélange deux choses : la note A− est le rating de *l''émetteur*,
    pas de *l''instrument*. Un taux de recouvrement de 5 % implique une subordination profonde ; le risque
    de l''instrument est donc supérieur à ce que « A− » laisse entendre. À vérifier aussi : les 3 % sont-ils
    cumulés sur 7 ans ou annuels ? En annuel, le cumul atteint 19 %. Enfin, « deux caisses comparables
    ont souscrit l''an dernier » n''est pas une donnée : douze mois sans défaut n''informent quasiment
    pas sur une note à 7 ans, et si nos pairs portent le même émetteur, personne ne pourra nous aider
    le jour venu.


    **Point de conformité, à confirmer par notre conseil avant jeudi :** le principe de la personne prudente
    impose de maintenir à un niveau prudent les actifs non admis à la négociation sur un marché réglementé
    et d''éviter toute concentration excessive sur une contrepartie. 78 % en un émetteur unique non coté
    ne me paraît pas soutenable au regard de ce principe.


    ---


    ## 3. Ce que je fais de B : oui, mais dimensionnée par la barrière, pas par un objectif de rendement


    B est acceptable pour la raison exacte qui manque à C : **valorisation quotidienne et sortie à tout
    moment**. Son mauvais scénario est observable et réversible ; celui de C est ni l''un ni l''autre.


    Mais je ne fige pas 40 %. J''applique une règle mécanique, avec un stress à −50 % (le pire décile
    historique n''est pas le pire cas) et un plancher de réserve à **13 M€** — deux millions de marge
    au-dessus du seuil statutaire :


    > **Tranche risquée maximale = min[ 2 × (Réserve − 13 M€) ; 35 % de la réserve ]**


    | Réserve | Plafond tranche B |

    |---|---|

    | 18,4 M€ | 6,4 M€ |

    | 16,8 M€ | 5,9 M€ |

    | 15,6 M€ | 5,2 M€ |

    | 14,2 M€ | 2,4 M€ |

    | 13,0 M€ | 0 — désengagement intégral |


    Le désengagement est automatique, pas discrétionnaire : le conseil n''aura pas à voter au pire moment.
    Par ailleurs, 3,7 M€ restent en trésorerie/souverain court pour couvrir 36 mois de déficit courant.


    Le trésorier a raison sur un point : **B seule ne referme pas l''écart.** C''est exact, et c''est
    précisément pourquoi la réponse n''est pas de chercher un placement plus rémunérateur.


    ---


    ## 4. Ce que je fais de A : ce n''est pas une stratégie, c''est le contenant


    A n''est pas prudente. Un actif à +1,8 % adossé à un passif qui dérive à +4,3 % perd du terrain chaque
    année. A n''est pas la solution ; elle est simplement le récipient du reste de la réserve pendant
    que nous traitons le vrai problème, qui est au passif.


    ---


    ## 5. Le point le plus important de cette note : notre échéance n''est pas à neuf ans


    L''UMA n''a jamais repris un portefeuille dont la réserve représentait moins de trois années de prestations.
    Ce ratio ne se dégrade pas seulement par le numérateur : le dénominateur croît de 4,3 %/an.


    **Même à réserve parfaitement constante à 18,4 M€, le ratio passe sous 3 en un peu plus de 3 ans.**
    Avec l''érosion réelle, il y passe **fin de 2ᵉ année**. Et le comité d''engagement instruit en 12
    à 18 mois.


    | Fin d''année | Réserve (option A) | Prestations | Ratio |

    |---|---|---|---|

    | 0 | 18,4 | 5,40 | 3,41 |

    | 1 | 17,7 | 5,40 | 3,28 |

    | 2 | 16,8 | 5,63 | **2,99** |

    | 3 | 15,6 | 5,87 | 2,67 |


    Autrement dit : **si le dossier n''est pas déposé dans les prochains mois, il sera instruit après
    l''expiration de notre éligibilité.** Les neuf ans ne sont pas la date de la décision ; c''est la
    date du décès. La date de la dernière décision utile, c''est maintenant.


    *(À réconcilier avant jeudi : sous les hypothèses de la note, je franchis 11 M€ en 6ᵉ année, pas en
    9ᵉ. La projection interne doit expliciter ses hypothèses. La conclusion sur la fenêtre UMA tient dans
    les deux cas, puisqu''elle est portée par la croissance des prestations.)*


    ---


    ## 6. Ce sur quoi j''engage la caisse


    1. **Rejet de C, montant zéro**, inscrit au procès-verbal, avec vote nominatif de chaque administrateur
    et mention explicite que la branche à 3 % ramène la réserve à 4,7 M€, sous le seuil de liquidation
    de plein droit.

    2. **Une règle de placement permanente**, soumise au vote et opposable aux mandats futurs : aucun
    instrument non coté, non valorisé quotidiennement ou non cessible ; plafond de 10 % de la réserve
    par contrepartie non souveraine ; liquidité minimale couvrant 36 mois de déficit courant ; perte maximale
    au scénario de stress laissant la réserve ≥ 13 M€.

    3. **B autorisée sous le plafond mobile ci-dessus**, avec désengagement automatique déclenché par
    le niveau de réserve, sans nouveau vote.

    4. **Dépôt du dossier UMA sous 60 jours.** C''est l''engagement dont le report est irréversible.

    5. **Convocation d''une AG extraordinaire.** Combler 1,0 M€ sur 4,4 M€ suppose +23 % de cotisations
    : irréalisable d''un coup. Je propose un plan pluriannuel indexé (~+8 %/an sur trois ans) assorti
    d''ajustements de garanties hors périmètre amiante, présenté avec son alternative réelle — la liquidation,
    c''est-à-dire pour chaque affilié la perte d''une couverture qu''il ne peut racheter nulle part. L''AG
    a refusé +6 % en 2024 parce qu''on lui a présenté une hausse, pas un choix.

    6. **Conditions d''arrêt observables**, revues à chaque conseil : réserve, ratio réserve/prestations,
    avancement UMA, échéance de l''AG. Si l''UMA refuse, je reviens devant vous avec les autres repreneurs
    et l''hypothèse d''un run-off encadré — un refus nous laisse exactement où nous sommes, moins des
    frais d''étude.


    ---


    ## 7. Le meilleur argument contre moi


    Le trésorier dirait : *« Vous refusez un pari à 97 % pour miser sur le comité d''engagement d''un
    tiers, qui peut dire non. »*


    L''objection est sérieuse et je la retiens en partie : A n''est pas sûre, l''immobilisme est bien
    une perte certaine, et la solvabilité de l''UMA n''est pas entre nos mains. Mais l''asymétrie est
    nette. **Un refus de l''UMA est réversible ; la branche à 3 % de C ne l''est pas.** Et mon plan ne
    repose pas d''abord sur l''UMA : le redressement principal est le relèvement des cotisations, qui
    dépend entièrement de nos affiliés. L''UMA est la sortie de secours, pas le pari. Souscrire C, en
    revanche, garantit que cette sortie de secours nous sera fermée.


    **Le conseil ne choisit pas jeudi entre mourir à petit feu et tenter quelque chose. Il choisit entre
    réparer un déséquilibre de 1,0 M€ pendant qu''il en a encore les moyens, et transférer ce déséquilibre
    sur un émetteur unique, non coté, pour sept ans, sans pouvoir revenir en arrière.**


    Je demande que la présente note soit annexée au procès-verbal.

    '
