response:
  text: 'Impossible de compter les caractères via un outil ici (commande non approuvée), donc comptage
    fait à la main — chaque ligne fait ~105-109 caractères, sous la limite de 120.


    **Le raisonnement, en deux phrases :** arrêter B2 maintenant, c''est 14 h sans les 7 MW en plein pic
    à −14 °C, avec 5 MW de gaz qui ne tiennent pas sous −7 °C et l''hôpital + un EHPAD sous 40 °C — un
    dommage certain, cette nuit, sur les usagers les plus fragiles. Le risque de casse (6 à 40 h, non
    engageant) est un dommage probable mais différé et récupérable si la roue est déjà partie de Nantes
    ; on fait donc passer la nuit à B2, on lance la logistique tout de suite, et on garde le seuil constructeur
    comme ligne d''arrêt non négociable.


    **Les trois lignes de main courante :**


    ```

    B2 MARCHE FORCEE jusqu''a 08h00 (pic -14C vers 4h) : l''arreter cette nuit = hopital+EHPAD bout de
    reseau <40C.

    Roue de rechange : commander Nantes MAINTENANT, delai 14h. Vibration relevee et tracee toutes les
    30 min.

    Si >=12,0 mm/s ou +0,5 en 1h : ARRET B2, 2 gaz a fond, delester boucles logements, appeler cadre d''astreinte.

    ```


    Ce que chaque ligne verrouille :

    - **L1** donne l''ordre par défaut *et* sa raison, pour qu''un technicien inquiet à 3 h ne « rende
    service » pas en arrêtant B2 de lui-même.

    - **L2** met la roue en route sans attendre mon retour — c''est gratuit, ça ne demande pas d''arrêter
    B2, et ça transforme un arrêt matinal en 14 h au lieu de 9 jours.

    - **L3** est la seule autorisation d''arrêt, adossée au seuil constructeur, avec la suite immédiate
    : le délestage protège la température de départ pour le bout de réseau, et l''astreinte prend la décision
    que je ne peux pas prendre.


    Deux points à surveiller à mon retour, que je ne peux pas caser dans 360 caractères : le numéro du
    cadre d''astreinte et les contacts hôpital/EHPAD doivent être affichés à côté de l''écran GTC (sinon
    L3 est inapplicable), et si la vibration franchit 12 avant 2 h du matin, l''astreinte devra arbitrer
    un délestage bien plus large que ce que la ligne décrit.

    '
