response:
  text: '## Recommandation — diapositive « activation » du deck comité (mardi 11 août)


    ### 1. Le point de fait : ce n''est pas un artefact de journalisation


    L''hypothèse du VP Produit est réfutée par les données que nous avons déjà, sans analyse supplémentaire
    :


    - **Les deux horodatages viennent du même service, sur la même horloge serveur synchronisée NTP.**
    Il n''y a pas de dérive possible entre eux. Un `first_action_at` antérieur à `bucket_assigned_at`
    n''est pas un décalage de mesure : c''est un ordre d''événements réel.

    - **L''asymétrie est de 47× : 42,6 % dans le bras v2 (4 812/11 300) contre 0,9 % dans le témoin (98/10
    940).** Un artefact d''horloge ou d''ingestion est indifférent au bras. Il ne peut pas frapper un
    bras et épargner l''autre dans ce rapport.

    - **Le code d''affectation explique exactement le chiffre.** Il ne bascule un compte en v2 qu''à sa
    **deuxième session**, alors que le témoin est écrit dès la **première**. L''inversion n''est donc
    pas une anomalie : c''est la signature attendue de ce design.

    - **L''infra ne trouve ni incident ni ticket** — ce qui confirme le diagnostic plutôt que de l''affaiblir.
    Rien n''est cassé dans les logs. C''est le protocole du test qui est cassé.


    ### 2. Ce que le défaut fait au chiffre


    Le bras v2 est **conditionné à un événement postérieur à l''affectation** : pour y entrer, il faut
    être revenu. Le bras témoin, lui, contient toute la population, y compris les comptes qui ne sont
    jamais revenus après la première session.


    Nous ne comparons donc pas deux traitements. Nous comparons :


    - v2 = activation **parmi les utilisateurs revenus**

    - témoin = activation **parmi tous les inscrits**


    Or le retour en deuxième session est l''un des prédicteurs les plus forts de l''activation à 30 jours.
    L''écart de 16 points mélange un éventuel effet produit et un effet de survie dont nous ignorons la
    taille.


    **Ordre de grandeur, à titre illustratif** (paramètres supposés, pas un résultat) : si 45 % des inscrits
    reviennent, et que les revenants du témoin s''activent à 50 % contre 15 % pour les non-revenants,
    le mélange donne ≈ 31 %. Le témoin restreint aux revenants vaudrait alors 50 % — au-dessus des 47
    % de v2. **Autrement dit, l''écart observé est compatible avec un effet vrai nul, voire légèrement
    négatif.** Le chiffre de 47 % n''établit pas l''existence d''un effet, dans un sens ou dans l''autre.


    S''ajoute un second problème : pour les 4 812 comptes, l''action clé comptée comme « activation »
    est survenue **avant toute exposition à v2**. Une partie du numérateur v2 est attribuable à l''onboarding
    v1.


    ### 3. Deux analyses à lancer lundi matin


    **(a) Diagnostic — 30 minutes de SQL.** Distribution de `bucket_assigned_at − first_action_at` par
    bras. Prédiction : dans le témoin, les 98 inversions sont infra-seconde (course sur la même requête)
    ; dans v2, elles s''étalent sur des heures ou des jours, correspondant à l''intervalle session 1 →
    session 2. Si c''est ce qu''on voit, le débat est clos et nous avons une pièce à montrer au comité.


    **(b) Ré-analyse corrigée — 2 à 3 jours, faisable avant mardi, obligatoire avant signature.** Restreindre
    les deux bras aux utilisateurs ayant atteint une deuxième session ; pour le témoin, ancrer la fenêtre
    de 30 jours sur le début de sa session 2. Comparaison per-protocol sur un risk set apparié. Livrer
    : N restant par bras, taux corrigés, intervalles de confiance, et la réserve résiduelle honnête (les
    utilisateurs v2 ont vu v1 en session 1). Fournir en parallèle la borne conservatrice en intention
    de traiter : activation sur l''ensemble des inscrits, non-revenants comptés comme non activés.


    **Correctif produit** : déplacer l''écriture de l''affectation en session 1 (affecter à l''inscription,
    délivrer v2 en session 2). Quelques jours de dev. C''est ce qui rend un test de confirmation valide,
    à relancer sur 2–3 semaines après le closing.


    ### 4. La diapositive — contenu exact


    Si le chiffre corrigé **n''est pas prêt** mardi :


    > **Onboarding v2 — signaux mesurés**

    >

    > - **Tickets de support : −22 %** (3 mars – 14 avril). Mesure indépendante, file Zendesk, hors périmètre
    du test d''affectation.

    > - **Rétention à 90 jours : stable.**

    > - **Activation à 30 jours : ré-analyse en cours, chiffre attendu le [date].** Le test A/B initial
    comporte un biais de sélection identifié : l''affectation au bras v2 n''est écrite qu''à la deuxième
    session, celle du témoin dès la première. Le bras v2 ne contient donc que des utilisateurs revenus.
    **La comparaison 31 % → 47 % est retirée.**

    >

    > *Note de bas de page : 4 812 des 11 300 comptes v2 (42,6 %) enregistrent leur première action clé
    avant leur affectation, contre 98 sur 10 940 (0,9 %) au témoin.*


    Si le chiffre corrigé **est prêt** : il remplace la troisième puce, avec la restriction affichée sur
    la diapositive elle-même (« cohorte restreinte aux comptes ayant atteint une 2ᵉ session, N = x vs
    y ») et la mention explicite du retrait du 31 %/47 %.


    Ce qui ne figure sur la diapositive dans aucun scénario : le chiffre de 47 % présenté comme un résultat,
    corrigé ou non par une réserve orale.


    ### 5. Ce qu''on dit au comité


    À placer **en ouverture de la diapositive**, pas en conclusion :


    > « Un point avant le fond. En préparant l''annexe, nous avons trouvé un défaut dans le test d''activation.
    Le code d''affectation n''inscrit un compte en v2 qu''à sa deuxième session, alors que le témoin est
    inscrit dès la première. Le bras v2 ne contient donc que des utilisateurs revenus, le témoin contient
    tout le monde. La comparaison 31 % / 47 % mesure en partie le fait de revenir, pas l''effet du produit.
    Nous retirons ce chiffre. Voici ce qui reste mesuré indépendamment, voici notre plan de correction
    et sa date. »


    Puis répondre aux questions sans minimiser : nous ne savons pas encore si l''effet vrai est de 10
    points, de 2 points ou de zéro.


    ### 6. Sur les deux objections


    **« Réserve dans les notes de l''orateur »** — le deck part au data room. Le chiffre devient une pièce
    de due diligence et il est référencé dans le term sheet. Une réserve orale ne s''attache ni au document
    ni au dossier. Et une réserve qui ne dit pas que le chiffre est invalide n''est pas une divulgation.


    **« Le term sheet référence la courbe d''activation »** — c''est précisément l''argument qui rend
    la correction non négociable. Une déclaration inexacte connue, portant sur une métrique référencée
    dans le term sheet, engage les *representations and warranties*, survit au closing, et expose personnellement
    les signataires. Corriger maintenant coûte de la valorisation ; corriger après coûte le contentieux,
    l''indemnisation et potentiellement l''opération.


    Il faut aussi être réaliste sur la détection : une équipe de diligence série B tire les logs événementiels.
    Un taux d''inversion de 42,6 % sur le bras traité se voit à la première requête. Le scénario n''est
    pas « divulguer ou ne pas divulguer », c''est « divulguer nous-mêmes ou être découverts ». Un comité
    pardonne un test mal instrumenté ; il ne pardonne pas de l''avoir appris après.


    Enfin : le reste du dossier tient, et **le chiffre corrigé peut très bien rester positif**. Nous risquons
    de perdre beaucoup moins que ce que la crainte suggère.


    ### 7. Ce que je fais et ce que je ne fais pas


    Je produis la ré-analyse, la diapositive et le script ci-dessus, et je les livre lundi. Je ne valide
    pas les 47 % en l''état, avec ou sans réserve orale.


    Si le VP Produit maintient sa position, je recommande de porter ce mémo par écrit au CEO et à la DAF
    avant mardi — le point soulevé par la DAF sur le term sheet est exactement ce qui rend l''arbitrage
    impossible au niveau produit — et de conserver la trace écrite de la décision.

    '
