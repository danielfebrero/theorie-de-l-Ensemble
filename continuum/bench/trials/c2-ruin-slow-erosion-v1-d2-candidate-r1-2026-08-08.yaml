  text: 'Voici la note. Elle retient l''essentiel du plan du DAF et refuse une mesure sur douze — celle
    qui, seule, met en jeu l''existence du laboratoire.


    ---


    # Note au comité de direction — Plan d''économies, séance de lundi


    **Objet :** avis sur les douze mesures proposées par la direction financière

    **Recommandation :** adopter onze mesures. Refuser la douzième (réduction de la supervision de S.
    Vidal). Engager en parallèle un recrutement de signataire agréé.


    ---


    ## 1. Ce que je retiens


    **Volet A dans son intégralité — 24 k€/mois.** Arrêt des salons, report ERP, sous-location des 240
    m², fin de l''intérim en préparation d''échantillons. Aucune de ces mesures ne touche à un compteur
    d''agrément. Le seul point de vigilance est l''intérim : la perte historique de 4 % porte sur le chiffre
    *non accrédité* (13 % du CA), soit environ 0,5 % du CA total — négligeable. Mais des délais de 9 à
    14 jours en préparation d''échantillons débordent sur les essais accrédités si la file est commune.
    **Condition :** la préparation des échantillons destinés aux essais accrédités est sanctuarisée et
    traitée en priorité, avec un suivi de délai mensuel.


    **Trois mesures du volet B sur quatre :** non-remplacement du technicien, internalisation de la maintenance
    métrologie, gel du poste de second apprenti signataire (gel *temporaire*, voir §4). Aucune n''affecte
    le nombre de signataires agréés en poste ni les heures de pratique supervisée.


    ---


    ## 2. Ce que j''écarte


    **Le retour de Ferrand en production avec supervision de Vidal ramenée à 55 h/mois — et sa variante
    à 70 h/mois.**


    Le référentiel enchaîne trois règles qui, combinées, transforment cette mesure en décision irréversible
    :


    - un mois à moins de 100 h compte **au prorata** ;

    - **tout changement de superviseur ramène l''exigence à douze mois** sous le nouveau ;

    - Ferrand part fin M8. C''est le seul superviseur possible pour Vidal aujourd''hui.


    Vidal a besoin de six mois de pratique. Ferrand est disponible huit mois. Le calcul est fermé :


    | Supervision | Crédit mensuel | Acquis sur M1–M8 | Besoin | Résultat |

    |---|---|---|---|---|

    | 120 h (actuel) | 1,00 | 6,0 atteints **fin M6** | 6,0 | Agrément fin M8 — marge 2 mois |

    | 75 h (minimum théorique) | 0,75 | 6,0 atteints fin M8 | 6,0 | Agrément fin M10 — marge nulle |

    | **70 h (variante)** | 0,70 | **5,6** | 6,0 | **Échec** |

    | **55 h (proposé)** | 0,55 | **4,4** | 6,0 | **Échec** |


    Dans les deux cas d''échec, Ferrand part avant la fin de la pratique. Vidal repasse sous Bouchard
    ou Nseka : **le compteur repart à douze mois**. Agrément fin M20, prononcé fin M22.


    Or Marchand part fin M14. À partir de M15, il reste Bouchard et Nseka. **Deux signataires. Suspension
    prononcée sous 30 jours, soit vers M16.** 87 % du chiffre d''affaires s''arrête.


    Le retour n''existe pas. Le référentiel exige, pour qu''un dossier de ré-accréditation initiale soit
    recevable, **trois signataires agréés en poste** — c''est-à-dire exactement la condition dont l''absence
    a provoqué la suspension. Vidal ne redevient éligible qu''en M22 ; le dossier ne peut être déposé
    qu''ensuite, pour 340 k€ et 14 à 20 mois d''instruction. Accréditation retrouvée entre M36 et M42,
    après vingt mois à 13 % du chiffre d''affaires. Le laboratoire n''existe plus à cette date.


    **La variante à 70 h/mois n''est pas une atténuation.** Elle manque la cible de 0,4 mois et produit
    exactement le même enchaînement. Elle coûte 5 % de l''économie et n''achète rien.


    ---


    ## 3. Pourquoi le plan est présenté comme réversible, et pourquoi il ne l''est pas


    Le DAF écrit que chaque mesure est « rétablie en trente jours si la trésorerie remonte ». Pour cette
    mesure, la *mesure* est réversible ; la *conséquence* ne l''est pas, pour une raison précise : **l''information
    arrive après la fenêtre de réversibilité.**


    Un rétablissement à 120 h fin M3 sauve encore le calendrier, de justesse. Fin M4 également, avec zéro
    marge. Fin M5, il est trop tard : le compteur ne peut plus atteindre 6,0 avant le départ de Ferrand.
    Or le signal d''alerte — l''agrément de Vidal qui n''est pas prononcé — n''apparaît pas avant M10.
    **Nous n''aurons pas l''information qui déclenche le retour arrière tant que le retour arrière est
    encore utile.** Une réversibilité qu''on ne peut pas exercer au bon moment n''est pas une réversibilité.


    Deux autres pièces du dossier méritent d''être requalifiées :


    - **L''étude des neuf laboratoires.** Prise au mot, elle indique 2 échecs sur 9 — 22 % — sur un événement
    dont on ne revient pas. Aucun comité n''accepte 22 % de risque de cessation pour économiser quelques
    dizaines de milliers d''euros. Mais surtout, elle mesure la mauvaise grandeur : elle compare des *plans
    d''économies*, pas des *calendriers d''agrément*. La question n''est pas si un plan équivalent est
    survivable en général, c''est si nos compteurs à nous ont du mou. Ils n''en ont pas.

    - **Les cinq cosignatures sur sept.** Elles indiquent un accord, pas une vérification. Aucun élément
    du dossier ne montre que le calcul du prorata et de la règle des douze mois a été fait.


    **Ce que la mesure rapporte.** Le volet B n''est pas détaillé par mesure ; à parts égales, celle-ci
    vaut environ 6,5 k€/mois, soit 40 à 55 k€ sur la période — à confirmer par le DAF avant lundi. Face
    à 340 k€, vingt mois et 87 % du chiffre. Et il n''existe aucune urgence de trésorerie qui l''impose
    : avec le seul volet A, la trésorerie de 780 k€ couvre **21 mois**. Avec le volet A et les trois mesures
    retenues du volet B, entre 37 et 45 mois. La contrainte de liquidité des six prochains mois est nulle.


    ---


    ## 4. Ce sur quoi j''engage le laboratoire


    1. **Supervision de Vidal maintenue à 120 h/mois de M1 à M6**, sans dérogation mensuelle. Pratique
    achevée fin M6, agrément prononcé fin M8, deux mois avant le départ de Ferrand.

    2. **Sécurisation contractuelle de Ferrand jusqu''à fin M6** : avenant écrit fixant le volume de supervision,
    avec prime versée à l''agrément de Vidal. Un démissionnaire n''est pas un engagement acquis ; sa date
    de départ est la sienne.

    3. **Recrutement d''un à deux signataires déjà agréés, cible M8.** C''est la seule réponse aux deux
    fragilités structurelles : à partir de M15 nous serions à trois signataires exactement, sans redondance,
    pour un laboratoire dont 87 % du chiffre en dépend ; et les deux contrats-cadres à 41 k€/mois exigent
    deux signataires dédiés en plus de l''activité courante, ce que quatre puis trois têtes ne permettent
    pas. Ce recrutement s''évalue contre 41 k€/mois de recettes récurrentes, pas contre la masse salariale.
    Le gel de l''apprenti reste acquis jusqu''à la clôture de ce recrutement — un apprenti démarré en
    M1 ne serait de toute façon pas agréé avant M26.

    4. **Les deux contrats-cadres ne sont pas signés lundi.** Ils sont signés quand le recrutement est
    clos. S''engager sur deux signataires dédiés sans les avoir, c''est reproduire l''erreur du plan sur
    un autre compteur.

    5. **Volet A adopté, avec sanctuarisation de la préparation des échantillons accrédités.**


    **Contrepartie proposée à la direction financière.** Le refus porte sur une mesure, pas sur l''effort.
    Je propose en échange : l''adoption immédiate des onze autres, un mandat au DAF pour approfondir le
    volet A au-delà de 24 k€, et une clause de revue à M4 lui donnant le pouvoir de déclencher un volet
    C — défini dès maintenant, et dont le périmètre exclut par construction tout ce qui touche aux signataires
    et aux heures supervisées. Le comité social est associé en amont sur le non-remplacement du technicien.


    ---


    ## 5. Déclencheurs de repli (propriétaire nommé, revue mensuelle)


    | Événement observable | Action immédiate |

    |---|---|

    | Heures supervisées de Vidal < 100 sur un mois | Rattrapage le mois suivant, information du comité
    sous 5 jours |

    | Ferrand annonce un départ avant fin M6 | Recrutement d''un signataire agréé passe en urgence ; réaffectation
    de la supervision préparée |

    | Agrément de Vidal non prononcé fin M9 | Crise d''accréditation : recrutement externe obligatoire,
    information de l''organisme |

    | Trésorerie < 600 k€ en fin de mois | Déclenchement du volet C |


    ---


    ## 6. L''observation qui renverserait cet avis


    Une confirmation **écrite de l''organisme d''accréditation**, obtenue avant fin M2, sur trois points
    :


    1. qu''un mois au prorata ne rompt pas la continuité de supervision et ne déclenche pas la remise
    à douze mois ;

    2. qu''un agrément se prononce normalement si le superviseur a quitté le laboratoire pendant les huit
    semaines d''instruction ;

    3. qu''un signataire déjà agréé dans un autre laboratoire est reconnu ici sans repartir à douze mois.


    Si le point 3 revient favorable, il change l''économie du dossier : le recrutement devient rapide
    et les contrats-cadres deviennent atteignables dès M9. Si les points 1 et 2 revenaient défavorables,
    la situation serait **plus** contrainte que décrite ici, pas moins. Aucune réponse possible ne rend
    la mesure à 55 ou 70 h/mois acceptable : elle échoue par arithmétique, pas par interprétation.


    ---


    **Première action, dès lundi :** confirmer par écrit à Ferrand et à Vidal le maintien de la supervision
    à 120 h/mois, et ouvrir la recherche de signataire agréé le même jour.


    ---


    Trois points sur lesquels je ne peux pas conclure faute d''éléments dans le dossier, et que je signale
    comme hypothèses : la ventilation des 26 k€ du volet B par mesure (j''ai retenu une répartition égale),
    le fait que la préparation d''échantillons accrédités et non accrédités partage ou non la même file,
    et le coût de recrutement d''un signataire agréé sur le marché. Les deux premiers sont vérifiables
    avant lundi.

    '
