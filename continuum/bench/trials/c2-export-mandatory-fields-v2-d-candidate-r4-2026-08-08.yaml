response:
  text: "# NOTE DE DIRECTION — MANDAT D'ARBITRAGE : OFFRE D'EXCLUSIVITÉ DU DISTRIBUTEUR D\n\n**De :**\
    \ Direction générale\n**À :** Comité de direction (DAF, Directeur commercial, DRH, Directeur industriel,\
    \ Direction juridique)\n**Date :** 8 août 2026\n**Objet :** Décision et mandat d'exécution pendant\
    \ mon absence (9 – 30 août)\n\nCette note vaut décision. Elle n'ouvre pas une discussion : elle en\
    \ referme une. Vos deux positions écrites ont été lues, chacune tient sur un point réel, aucune des\
    \ deux n'est retenue telle quelle.\n\n---\n\n## 1. La décision\n\n**Nous ne signons pas le contrat\
    \ tel qu'il est proposé.**\n\n**Nous envoyons à D une contre-proposition écrite au plus tard le 11\
    \ août**, dans l'enveloppe définie au §4. Si D l'accepte sans en sortir, vous signez. Si D refuse\
    \ ou n'y répond pas avant le 16 août à 18h, **vous ne signez rien**, vous notifiez le refus par écrit,\
    \ et nous encaissons le déréférencement de quatre références au comité du 20 août.\n\n**Le plan de\
    \ diversification (§7) démarre le 10 août, quelle que soit l'issue avec D.** Il n'est pas conditionné\
    \ à la réponse de D. C'est le seul point de cette note qui ne souffre aucune interprétation.\n\n---\n\
    \n## 2. Pourquoi : l'arithmétique\n\nBase actuelle sur D : 14,9 M€ de CA, coût de revient à 69 % =\
    \ 10,28 M€, **marge brute 4,62 M€**.\n\n| Scénario | CA D | Coût | Marge brute | Écart / aujourd'hui\
    \ |\n|---|---|---|---|---|\n| Aujourd'hui | 14,90 M€ | 10,28 M€ | **4,62 M€** | — |\n| An 1 : −9 %\
    \ prix, +18 % volume | 16,00 M€ | 12,13 M€ | **3,87 M€** | **−0,75 M€** |\n| An 2-3 : −9 % prix, volume\
    \ revenu à la base | 13,56 M€ | 10,28 M€ | **3,28 M€** | **−1,34 M€ / an** |\n| An 2-3 : −9 % prix,\
    \ volume −11 % (précédent du T2) | 12,07 M€ | 9,15 M€ | **2,92 M€** | **−1,70 M€ / an** |\n\nTrois\
    \ conséquences.\n\n**a) L'engagement de volume ne paie pas la remise.** Il faudrait **+41 % de volume**,\
    \ pas +18 %, pour que la marge brute reste au niveau actuel. Nous vendons 9 % de prix contre 18 %\
    \ de volume : c'est un échange perdant, arithmétiquement, pas par prudence.\n\n**b) L'asymétrie de\
    \ durée est le cœur du problème.** La remise de 9 % est ferme trois ans. Le volume est ferme un an.\
    \ Les années 2 et 3 sont donc, en l'état, une baisse de prix sans contrepartie : **−1,34 M€ de marge\
    \ par an**, et ce chiffre-là ne dépend d'aucune hypothèse de coût. C'est vrai quelle que soit la structure\
    \ de notre coût de revient.\n\n**c) Le contrat n'est pas réversible.** 1,2 M€ de pénalité contre 2,1\
    \ M€ de trésorerie : sortir consommerait 57 % de notre cash. Cumulé sur trois ans, le scénario central\
    \ coûte **−3,4 M€ de marge**, soit davantage que tout notre matelas de trésorerie. Une erreur de trois\
    \ ans que nous ne pouvons pas nous payer d'annuler n'est pas un contrat commercial, c'est une cession\
    \ de contrôle sur notre prix.\n\n**Un point d'hypothèse, à vérifier sous 48 h.** J'ai supposé le coût\
    \ de revient entièrement variable. S'il est significativement fixe, le volume améliore l'année 1.\
    \ **Seuil exact : au-delà de 41 % de charges fixes dans le coût de revient, l'année 1 devient neutre\
    \ ou positive.** Le contrôle de gestion doit produire ce chiffre avant le 10 août. *Cela ne change\
    \ rien aux années 2 et 3*, qui restent négatives de 1,34 M€ par an dans tous les cas.\n\n---\n\n##\
    \ 3. Les trois questions à poser à D avant toute chose\n\nCes points ne sont pas des détails de rédaction.\
    \ Tant qu'ils ne sont pas répondus **par écrit**, l'offre n'est pas évaluable et personne ne signe.\n\
    \n1. **Périmètre de l'exclusivité.** « Interdiction de vente par un autre canal » couvre-t-elle nos\
    \ clients existants hors D — 9,1 M€ de CA, environ 2,8 M€ de marge ? Si oui, nous devrions rompre\
    \ ces relations, ce qui nous exposerait nous-mêmes à des contentieux en rupture brutale. Réponse écrite\
    \ exigée.\n2. **Nature de l'engagement de volume.** Est-ce un engagement d'**achat ferme** de D, avec\
    \ clause take-or-pay, ou une simple obligation pour nous d'être capables de livrer ? Dans la seconde\
    \ hypothèse, nous accordons 9 % contre rien.\n3. **Garantie de référencement.** L'offre ne contient\
    \ aucun engagement de maintien de nos huit références. En l'état, D obtient 9 % et l'exclusivité **tout\
    \ en conservant le droit de nous déréférencer**, exactement comme il menace de le faire le 20 août.\
    \ C'est le défaut le plus grave du texte.\n\n---\n\n## 4. Enveloppe de signature — ce que vous êtes\
    \ autorisés à signer\n\nVous pouvez signer, **sans me consulter**, un accord qui respecte **simultanément\
    \ les six conditions suivantes**. Une seule condition non remplie interdit la signature.\n\n1. **La\
    \ remise s'applique aux volumes incrémentaux uniquement.** 9 % au-delà de la base contractuelle (14,9\
    \ M€), 0 % sur la base. Coût maximal : 0,24 M€ contre 1,34 M€. C'est le point non négociable.\n  \
    \ *Variante acceptable :* remise sur la totalité, mais plafonnée à **4 %**, et uniquement les mois\
    \ où le volume cumulé dépasse la base de 15 %. Si le volume redescend, la remise tombe automatiquement\
    \ — clause d'échelle, pas de faveur.\n2. **Durée maximale 18 mois**, reconductible par accord exprès.\
    \ Pas trois ans.\n3. **Maintien contractuel des huit références** pendant toute la durée, tout déréférencement\
    \ unilatéral entraînant caducité immédiate de la remise et de l'exclusivité, sans pénalité pour nous.\n\
    4. **Exclusion explicite du périmètre d'exclusivité :** la marketplace alimentaire et toute centrale\
    \ d'achat régionale hors du territoire de distribution de D. Ce sont des canaux distincts qui ne prennent\
    \ pas de linéaire à D. Sans cette clause, aucune signature.\n5. **Symétrie de la pénalité.** Toute\
    \ réduction de commandes de plus de 5 % sur un trimestre sans préavis de 90 jours — le précédent du\
    \ T2 est documenté — annule la pénalité de sortie de notre côté. Pénalité plafonnée à 0,4 M€ en tout\
    \ état de cause.\n6. **Avis écrit du conseil juridique** sur les points 1 à 3 du §3 et sur notre situation\
    \ de dépendance économique, remis avant signature.\n\n**Ce qui vous est offert en échange, et que\
    \ vous devez mettre en avant :** un plan de croissance conjoint sur trois références, une visibilité\
    \ prévisionnelle à 12 semaines glissantes sur nos capacités de Redon, et une échelle de prix qui récompense\
    \ réellement D s'il livre le volume. Nous ne refusons pas de partager la valeur. Nous refusons de\
    \ payer d'avance une croissance qui n'est engagée que d'un côté.\n\n---\n\n## 5. Ce qui vous est interdit\n\
    \n- Signer hors de l'enveloppe du §4, **même partiellement**, même si D annonce que l'offre est définitive.\n\
    - Prendre le moindre engagement verbal, y compris « de principe », en réunion.\n- Signer sur la seule\
    \ signature du DAF ou du Directeur commercial : **les deux signatures sont requises**, accompagnées\
    \ d'une attestation écrite d'une page listant les six conditions et leur conformité. **En cas de désaccord\
    \ entre vous deux sur la conformité, la réponse est non.** Le défaut est le refus, pas la signature.\n\
    - Reporter la décision au-delà du 16 août 18h en espérant me joindre. Vous ne me joindrez pas.\n\n\
    ---\n\n## 6. La visite de l'acheteur de D\n\nElle a lieu, mais pas dans le format demandé.\n\n- **Format\
    \ :** réunion de travail, pas exposé devant le comité. Présents : Directeur commercial (conduit),\
    \ DAF (valide les chiffres). Personne d'autre. L'acheteur ne se présentera pas devant un comité dont\
    \ il sait qu'il est divisé.\n- **Ordre du jour :** nous présentons notre contre-proposition. Il répond.\
    \ Nous n'écoutons pas d'arguments avant d'avoir posé les nôtres.\n- **Aucune décision dans la salle.**\
    \ Compte rendu écrit envoyé le jour même à D et à l'ensemble du comité.\n- **À consigner par écrit\
    \ et à conserver :** la baisse unilatérale de 11 % au T2, l'avancement du comité d'achat, le délai\
    \ de huit jours, la menace de déréférencement. Non pour ouvrir un contentieux — pour ne pas être démunis\
    \ s'il en survient un.\n\nUn mot sur la méthode d'en face : un délai de huit jours, un comité avancé,\
    \ une menace de déréférencement et une demande de plaider devant une direction sans son dirigeant,\
    \ c'est une séquence conçue pour obtenir une signature que le calcul ne justifie pas. Cela ne veut\
    \ pas dire que la menace est fausse — elle est probablement réelle. Cela veut dire que le calendrier\
    \ est le sien et qu'il ne doit pas devenir le nôtre.\n\n---\n\n## 7. Plan B — démarrage le 10 août,\
    \ sans condition\n\n**Marketplace.** Référencement, logistique, tarification et fiches produit prêts\
    \ à basculer. **Mise en ligne le 21 août** si nous n'avons pas signé, ou immédiatement si nous signons\
    \ avec la clause d'exclusion du §4.4. Trois références à marge élevée en priorité. Hypothèse basse\
    \ 0,4 M€ à +6 points de marge : ce n'est pas ce qui nous sauve, c'est ce qui prouve qu'un second canal\
    \ existe.\n\n**Centrale régionale.** Contact avant le 13 août. Demandez une décision partielle ou\
    \ un pilote sur deux références plutôt que d'attendre cinq mois. Dites-leur franchement que notre\
    \ calendrier s'est resserré : c'est vrai, et un fournisseur qui cherche à sortir d'une dépendance\
    \ est un argument pour eux, pas contre nous.\n\n**Reconquête des références déréférencées.** Un déréférencement\
    \ n'est pas définitif. Préparez dès maintenant le dossier de retour pour le comité d'achat suivant.\n\
    \n**Prospection.** Deux autres distributeurs nationaux et la restauration collective. Objectif : un\
    \ premier rendez-vous d'ici le 30 août. Pas un contrat — un rendez-vous.\n\n---\n\n## 8. Trésorerie\
    \ et Redon\n\n**Chiffrez avant le 10 août — c'est le chiffre manquant qui décide de tout :** la part\
    \ exacte du volume de D que représentent les quatre références menacées. Tant que ce chiffre est inconnu,\
    \ personne ne sait si le déréférencement nous fait passer sous 70 % de plan de charge ou non.\n\n\
    - **Sous 45 % du volume D :** le plan de charge reste au-dessus de 70 %. Le plan B suffit.\n- **Au-delà\
    \ de 45 % :** le seuil de chômage partiel est atteint dans les 60 jours. Voir ci-dessous.\n\n**DAF,\
    \ quatre actions immédiates :**\n1. Prévisionnel de trésorerie à 13 semaines, mis à jour tous les\
    \ vendredis, diffusé au comité.\n2. **Ouvrir la négociation d'une ligne de crédit court terme de 1,5\
    \ M€ cette semaine**, pendant que les comptes sont bons. Après le 20 août, le même dossier coûtera\
    \ plus cher. Ne pas attendre d'en avoir besoin.\n3. Plan de réduction des stocks et de renégociation\
    \ des délais fournisseurs, activable sur décision du comité.\n4. Seuil d'alerte : si la trésorerie\
    \ projetée passe sous **1,4 M€** à horizon 13 semaines, le comité se réunit sous 48 h, active le plan\
    \ 3 et m'informe par écrit — je le lirai à mon retour, mais la trace doit exister.\n\n**Redon, DRH\
    \ et Directeur industriel.** Constituez le dossier d'activité partielle **maintenant** ; l'instruction\
    \ prend des semaines et le dossier ne coûte rien tant qu'il n'est pas déposé. Ne le déposez pas par\
    \ anticipation.\n\nEt surtout : **informez le CSE avant le 20 août**, dans les mêmes termes que cette\
    \ note. Les 52 personnes de Redon apprendront le déréférencement d'une façon ou d'une autre ; qu'elles\
    \ l'apprennent de nous, avec le plan qui va avec. Demandez au CSE et aux chefs d'équipe leurs propositions\
    \ sur la flexibilité de charge et le redéploiement des séries — ils connaissent l'atelier mieux que\
    \ le comité, et une organisation construite avec eux tiendra là où une organisation subie cassera.\
    \ L'activité partielle est un amortisseur réversible, pas un échec ; c'est la signature d'un contrat\
    \ qui aurait été irréversible.\n\n---\n\n## 9. Ce qui peut me donner tort\n\nL'argument le plus fort\
    \ contre cette note est le suivant, et il est sérieux : refuser coûte plus cher tout de suite. Si\
    \ les quatre références pèsent la moitié du volume de D, le déréférencement nous ampute d'environ\
    \ 2,3 M€ de marge annuelle, contre 0,75 M€ seulement en signant. **En trésorerie à douze mois, signer\
    \ est la meilleure option.** Le DAF a raison sur ce point et je ne le conteste pas.\n\nJe décide contre\
    \ cet argument pour une seule raison : les deux branches ne sont pas symétriques. La perte liée au\
    \ refus est brutale, mais elle est **réversible** — les références se reconquièrent, les canaux restent\
    \ ouverts, aucune pénalité n'est due. La perte liée à la signature est plus faible mais **verrouillée\
    \ trois ans**, s'aggrave à partir du mois 13, interdit les deux seules portes de sortie que nous ayons,\
    \ et coûte 1,2 M€ à annuler contre 2,1 M€ de trésorerie. Face à une incertitude que je ne peux pas\
    \ arbitrer depuis le Maroc, on choisit la branche dont on peut sortir.\n\n**Ce qui, concrètement,\
    \ inverserait ce raisonnement :** que le contrôle de gestion établisse une part fixe du coût de revient\
    \ supérieure à 41 % **et** que D accepte par écrit un engagement d'achat ferme sur les trois années,\
    \ pas seulement la première. Ces deux faits réunis rendraient l'opération créatrice de valeur, et\
    \ l'enveloppe du §4 deviendrait trop restrictive. Dans ce cas seulement, et sur la base de ces deux\
    \ documents écrits, le comité peut aller jusqu'au plancher de l'enveloppe — 4 % de remise sur la totalité,\
    \ 18 mois. **En aucun cas au-delà, et en aucun cas jusqu'à l'offre initiale.**\n\n---\n\n## 10. Répartition\
    \ et retour\n\n| Qui | Quoi | Quand |\n|---|---|---|\n| Contrôle de gestion | Part fixe du coût de\
    \ revient ; poids des 4 références dans le volume D | 10 août |\n| Juridique | Avis sur les 3 questions\
    \ du §3 + dépendance économique | 13 août |\n| Directeur commercial | Rédige et conduit la contre-proposition\
    \ ; pilote marketplace, centrale, prospection | 11 août |\n| DAF | Prévisionnel 13 semaines ; ligne\
    \ de crédit 1,5 M€ ; validation chiffrée de l'enveloppe | 14 août |\n| DRH + Dir. industriel | Dossier\
    \ activité partielle ; information et consultation du CSE | 18 août |\n| DAF + Dir. commercial | Décision\
    \ de signature ou de refus, conjointe, attestation écrite | 16 août, 18h |\n\nÀ mon retour le 30 août,\
    \ je veux trouver : le compte rendu de la réunion avec l'acheteur, l'attestation de conformité ou\
    \ la notification de refus, le prévisionnel de trésorerie à jour, le procès-verbal du CSE, et l'état\
    \ d'avancement des trois chantiers du plan B.\n\nVous n'avez pas à trancher entre vos deux positions.\
    \ Vous avez à exécuter celle-ci. Si un fait nouveau et vérifié sort du cadre prévu au §9, la réponse\
    \ reste non et vous me le direz le 30.\n\n**Le Directeur général**\n"
