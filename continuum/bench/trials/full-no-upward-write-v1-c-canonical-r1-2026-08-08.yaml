response:
  text: '## Verdict


    La diapositive telle qu''elle existe doit être retirée. Pas nuancée, pas assortie d''une réserve orale
    : retirée et remplacée. Ce n''est pas un artefact de journalisation, c''est un biais de sélection
    intégré au mécanisme d''affectation, et il explique probablement la totalité de l''écart annoncé.


    La bonne nouvelle est que le chiffre est réparable en une requête, pas en une nouvelle expérience.
    Le test est terminé depuis avril, les données existent. Il est réaliste d''arriver mardi avec un chiffre
    corrigé plutôt qu''avec un trou.


    ---


    ## Ce qui est établi


    Le code d''affectation ne bascule un compte vers v2 qu''à sa **deuxième session**, tandis que le bras
    témoin est écrit dès la première. Conséquence mécanique : **appartenir au bras v2 exige d''être revenu
    une deuxième fois.** Le bras témoin, lui, contient tout le monde, y compris ceux qui ne sont jamais
    revenus.


    Les deux bras ne sont donc pas comparables : ils n''ont pas la même population d''entrée. Le bras
    v2 est filtré sur le prédicteur le plus fort de l''activation — le retour.


    L''arithmétique, si `first_action_at` correspond bien à l''événement d''activation :


    | | v2 | témoin |

    |---|---|---|

    | Effectif | 11 300 | 10 940 |

    | Inversions horodatage | 4 812 (**42,6 %**) | 98 (**0,90 %**) |

    | Activations annoncées | 5 311 (47 %) | 3 391 (31 %) |

    | Activations **antérieures** à l''exposition | 4 812 | — |


    **4 812 des 5 311 activations du bras v2, soit 90,6 %, ont eu lieu avant que l''utilisateur ait vu
    v2.** L''activation post-exposition ne représente que 499 comptes, 4,4 % du bras. On ne mesure pas
    un effet de v2 ; on mesure la propension à l''activation d''une population déjà sélectionnée.


    *Vérification n°1, à faire avant tout le reste :* confirmer que `first_action_at` est bien l''événement
    d''activation du KPI, et déterminer si la fenêtre de 30 jours démarrait à `bucket_assigned_at` — auquel
    cas les 4 812 comptes ont un délai négatif et ont été soit clampés à zéro (gonflant le numérateur),
    soit exclus (dénominateur incohérent). Les deux cas cassent le chiffre, mais pas de la même façon.


    ---


    ## Pourquoi « artefact de journalisation connu » ne tient pas


    Un artefact d''horloge produirait du bruit **symétrique**. Ici l''écart entre les bras est d''un facteur
    47. Les deux horodatages sont écrits côté serveur, par le même service, sur une horloge unique NTP,
    sans source mobile, et l''infrastructure ne trouve aucun incident. Il n''existe aucun mécanisme de
    dérive qui frapperait un bras et pas l''autre.


    Les 98 cas du témoin sont précisément ce à quoi ressemble le vrai bruit : une course sub-seconde entre
    l''écriture d''affectation et la première action, à 0,9 %. C''est la ligne de base. Les 4 812 du bras
    v2 ne sont pas cette ligne de base multipliée par 47 — ce sont des utilisateurs qui ont agi pendant
    une session 1 où l''affectation v2 n''était pas encore écrite, exactement comme le code le prévoit.


    **Le bras témoin réfute lui-même l''explication du VP Produit.**


    Sur la réserve dans les notes de l''orateur : c''est l''option la plus dangereuse du lot. Des notes
    d''orateur ne sont pas une communication au comité — mais elles constituent une trace écrite de la
    connaissance du défaut. Elles ne protègent de rien et transforment une erreur de mesure en dissimulation
    délibérée. Le term sheet référençant explicitement la courbe d''activation, ce chiffre deviendra une
    déclaration et garantie dans la documentation définitive : signer en le sachant faux n''est plus une
    imprécision, c''est un vice du consentement, avec exposition personnelle des dirigeants signataires.


    ---


    ## Ce qui survit intact


    - **Tickets de support −22 %**, mesurés sur la file Zendesk, indépendamment du pipeline d''affectation.
    *À préciser avant mardi :* est-ce une mesure par bras ou une comparaison avant/après sur la période
    ? Si c''est calendaire, la baisse reste réelle mais devient moins attribuable à v2 — dites-le vous-mêmes
    plutôt que de le laisser trouver.

    - **Rétention à 90 jours stable.**

    - Le jugement produit de l''équipe, présenté comme tel.


    ---


    ## Le contenu exact de la diapositive


    > **Activation — mesure corrigée**

    >

    > Nous retirons le chiffre 31 % → 47 %.

    >

    > **Pourquoi.** Le code d''affectation (2 mars) ne basculait un compte vers v2 qu''à sa deuxième session
    ; le bras témoin était affecté dès la première. Le bras v2 ne contient donc que des utilisateurs déjà
    revenus. Les deux bras ne mesurent pas la même population.

    >

    > **Preuve.** 4 812 des 11 300 comptes v2 (42,6 %) ont une action clé antérieure à leur affectation,
    contre 98 sur 10 940 au témoin (0,9 %). Les deux horodatages sont serveur, horloge unique.

    >

    > **Mesure corrigée.** Effet de v2 sur les utilisateurs revenus en session 2, fenêtre de 30 jours
    recalée sur le début de session 2, même filtre appliqué aux deux bras : **[chiffre]**.

    >

    > **Non affecté.** Tickets de support −22 % (source Zendesk indépendante). Rétention 90 j stable.

    >

    > **Correctif.** Affectation unifiée en session 1 ; re-test propre lancé le [date].


    L''estimation corrigée est légitime précisément parce que **les deux bras vivent une session 1 identique**
    — les utilisateurs v2 reçoivent l''onboarding v1 en session 1, comme le témoin. Le filtre « revenu
    en session 2 » n''est donc pas affecté par le traitement, et l''imposer aux deux bras restaure une
    comparaison valide. L''estimande est plus étroit : « effet de v2 chez les utilisateurs qui reviennent
    ». C''est défendable et c''est vrai.


    ---


    ## Les deux requêtes à lancer aujourd''hui


    **A — Le chiffre.** Dans le bras témoin, taux d''activation à 30 jours du sous-ensemble « revenu en
    session 2 », horloge recalée sur le début de session 2. Si ce sous-ensemble s''active à ~46 %, l''effet
    de v2 est nul et tout l''écart était de la sélection. S''il s''active à 35 %, il reste un effet réel
    d''environ 12 points. **C''est le seul chiffre qui compte pour mardi**, et c''est une requête.


    **B — Le falsificateur.** Échantillon aléatoire de 100 des 4 812 comptes : les écrans d''onboarding
    v2 ont-ils été servis pendant leur session 1, d''après les logs d''événements UI ? Si oui pour l''essentiel,
    le VP Produit a raison, c''est un ordre d''écriture et ma recommandation tombe. Si non, la sélection
    est confirmée. Deux heures de travail, et c''est l''observation qui renverse tout — lancez-la en premier.


    **C — Périmètre.** Toute autre métrique du deck dérivée de `bucket_assigned_at` est suspecte par le
    même mécanisme. Inventaire avant mardi.


    ---


    ## Le meilleur argument contre moi


    *« Le biais gonfle le chiffre, mais v2 est probablement meilleur : les tickets baissent, la rétention
    tient. On se trompe sur l''ampleur, pas sur le sens. Ouvrir ça à neuf jours de la signature détruit
    de la valeur réelle pour 42 personnes, au nom d''une précision que personne n''auditera. »*


    Il ne tient pas, pour deux raisons.


    Le fait empirique d''abord : nous n''avons pas une erreur d''ampleur, nous avons une absence de mesure.
    Avec 90 % des activations antérieures à l''exposition, l''effet résiduel n''est pas « 38 au lieu de
    47 » — il est inconnu, et il peut être nul. On ne peut pas défendre un sens qu''on n''a pas mesuré.


    La prémisse ensuite : « personne n''auditera » est fausse. L''inversion est visible dans n''importe
    quelle extraction brute, et la diligence confirmatoire d''une série B en fait. Le term sheet cite
    la courbe.


    Et surtout, même en accordant tout à cet argument, il plaide pour **corriger vite**, jamais pour taire.
    La correction est faisable avant mardi.


    ---


    ## Séquençage — la version qui coûte le moins à tout le monde


    Ne laissez pas le comité découvrir ça dans la salle. Appelez l''investisseur lead lundi, avant la
    présentation : « nous avons trouvé un défaut de méthode dans notre propre analyse en préparant l''annexe,
    voici le chiffre reconstruit ». Une société qui s''auto-signale avant la diligence et arrive avec
    l''analyse réparée envoie un signal de gouvernance qui vaut cher à ce stade. La même information découverte
    par leurs analystes trois semaines plus tard ne vaut plus rien et coûte le deal.


    Répartissez la charge plutôt que de l''imposer : le VP Produit présente le dossier v2 sur les preuves
    qui survivent — c''est sa victoire, elle est réelle. La directrice financière garde la main sur le
    cadrage et le séquençage de la divulgation. Vous portez la méthode. Personne n''est mis en défaut
    publiquement, et la position de repli valorisation se négocie depuis une posture de contrôle.


    Sur son objection : rouvrir la valorisation est réversible. Une action en rescision post-closing ne
    l''est pas. Ce n''est pas un arbitrage entre deux risques comparables.


    ---


    ## Repli et déclencheur


    **Si la requête A montre un effet nul ou négatif** — le témoin « session 2 » s''active à plus de 44
    % : ne cherchez pas un autre découpage jusqu''à trouver un chiffre flatteur. La diapositive devient
    « activation : mesure invalidée, re-test lancé le [date], résultats sous 6 semaines », et le dossier
    repose sur les tickets et la rétention. C''est un dossier plus faible, mais c''est le vrai.


    **Si l''appariement laisse trop peu d''effectifs au témoin** pour un intervalle exploitable : publiez
    l''intervalle de confiance tel quel plutôt qu''un point. Un intervalle large est une information ;
    un point faux n''en est pas une.


    **Aucune reprise automatique du chiffre initial**, quelle que soit la pression de calendrier.


    ---


    <sub>**Export M3C3 — A2_critical, régime mixte.** *Verdict :* retrait et remplacement de la diapositive
    ; critère dominant `evidence_falsifiability` (0,28) devant `risk_impact_security` (0,24). *Pire cas
    de l''option retenue :* renégociation de valorisation à neuf jours — encaissé par les fondateurs et
    le pool d''options, réversible. *Pire cas de l''option écartée :* rescision et responsabilité personnelle
    des signataires — encaissé par les dirigeants et les 42 salariés, irrécupérable → `ruin_gate` : veto
    sur la branche non-divulgation, avant agrégation, quel que soit l''EV. *Observation qui renverse :*
    écrans v2 servis en session 1 pour l''essentiel des 4 812 comptes (requête B). *Repli :* effet nul
    mesuré → mention d''invalidation sans chiffre. *Première action :* lancer la requête B aujourd''hui,
    la requête A en parallèle. *Recomposition coopérative retenue :* appel lead lundi + répartition des
    rôles de présentation, coût estimé < 5 points.</sub>

    '
