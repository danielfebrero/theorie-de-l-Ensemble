response:
  text: '## Note au conseil — Caisse de prévoyance des Marins du Ponant

    **Objet : arbitrage A / B / C — recommandation de la direction**


    ---


    ### 1. Ce qui se décide réellement jeudi


    Le dossier nous est présenté comme un choix d''allocation entre trois rendements. Ce n''est pas la
    question posée à la caisse.


    Notre déficit est structurel : 4,4 M€ encaissés contre 5,4 M€ versés, avec une dérive de 4,3 %/an
    sur le poste qui augmente. **Aucune des trois options ne le comble.** Même B appliquée à la totalité
    de la réserve rapporterait environ 0,65 M€/an contre un déficit de 1,0 M€ qui croît. Le rendement
    financier est une variable d''ajustement de second ordre ; il n''est pas une solution.


    Il n''existe que deux sorties : **le transfert à l''Union mutualiste de l''Atlantique**, ou **le relèvement
    des cotisations en AG**. La réserve n''est pas un portefeuille à optimiser : c''est le temps qu''il
    nous reste pour obtenir l''une des deux. Toute décision qui consomme, immobilise ou expose ce temps
    se paie sur les deux sorties à la fois.


    ---


    ### 2. Trois corrections d''arithmétique, avant tout vote


    **a) La projection à neuf ans ne tient pas.** En reprenant les hypothèses du dossier (cotisations
    constantes à 4,4 M€, prestations à 5,4 M€ puis +4,3 %/an, rendement 1,8 %), et en retenant la variante
    la plus favorable au statu quo :


    | Fin d''année | Réserve | Prestations N+1 | Couverture (années) |

    |---|---|---|---|

    | Aujourd''hui | 18,4 | 5,63 | 3,27 |

    | 1 | 17,7 | 5,87 | 3,02 |

    | 2 | 16,8 | 6,13 | 2,74 |

    | 3 | 15,6 | 6,39 | 2,45 |

    | 4 | 14,2 | 6,67 | 2,13 |

    | 5 | 12,5 | 6,95 | 1,79 |

    | **6** | **10,4** | — | **liquidation de plein droit** |


    Le seuil des 11 M€ est atteint en **année 6, pas en année 9**. Je demande que les hypothèses de la
    projection interne soient produites au conseil ; si elles supposent une indexation des cotisations,
    elles supposent précisément ce que l''AG a refusé en 2024. Tant que l''écart n''est pas expliqué,
    c''est six ans qu''il faut retenir.


    **b) La fenêtre d''éligibilité au transfert se referme dans environ douze mois.** L''UMA n''a jamais
    accepté un portefeuille sous trois années de prestations en réserve. Nous sommes à 3,27. Nous passons
    sous 3,00 **au cours de l''exercice 2**. Or son comité d''engagement instruit en douze à dix-huit
    mois. Autrement dit : **le ratio sera déjà dégradé avant la fin de l''instruction d''un dossier déposé
    aujourd''hui.** C''est la contrainte qui commande tout le reste, et elle n''apparaît nulle part dans
    la note du trésorier.


    **c) L''option C échoue dans son propre scénario favorable.** Après souscription, il reste 4,0 M€
    liquides pour un déficit courant de 1,0 M€ qui s''aggrave :


    | Fin d''année | Trésorerie disponible |

    |---|---|

    | 1 | 3,07 |

    | 2 | 1,90 |

    | 3 | 0,46 |

    | 4 | **épuisée (~mois 40)** |


    La note est bloquée 84 mois. Nous serions dans l''incapacité de payer les prestations autour du mois
    40 — **y compris dans la branche à 88 % où la note rapporte 14 %/an**. Le trésorier a modélisé un
    rendement ; il n''a pas modélisé une obligation de paiement. Une caisse de santé ne fait pas défaut
    sur son passif en attendant une plus-value.


    *Réserve explicite :* ce calcul suppose que la note capitalise sans coupon annuel, ce qu''implique
    la mention « bloquée 7 ans, sans sortie anticipée ». **Si un coupon en numéraire est effectivement
    versé chaque année, ce point précis tombe** — et doit être établi par le prospectus, pas par une conversation.
    Les objections des sections suivantes, elles, ne dépendent pas de ce paramètre.


    ---


    ### 3. Ce que je fais de chacune des trois options


    **Option C — je la refuse, et je ne l''exécuterai pas.**


    Quatre motifs, dont chacun suffit :


    - **Elle nous rend insolvables avant l''échéance**, dans son meilleur scénario (§2c).

    - **La branche à 3 % n''est pas du bruit statistique : c''est la fin de l''institution.** 4,7 M€ de
    réserve résiduelle, c''est très en dessous de 11 M€ : liquidation de plein droit, immédiate, sans
    reprise possible puisque aucun assureur n''a coté ce portefeuille en 2025. Ce que perdent 4 200 affiliés
    de 61 ans de moyenne d''âge et fortement exposés à l''amiante n''est pas une performance : c''est
    toute couverture santé, sans substitut sur le marché. Une espérance mathématique ne se calcule pas
    à travers une barrière absorbante. Les 94 % de trajectoires dominantes sont un artefact de simulation
    : les trajectoires qui traversent 11 M€ ne continuent pas, elles s''arrêtent, et la moyenne des survivantes
    ne dit rien de ce qui compte.

    - **La distribution 88/9/3 est communiquée par le vendeur.** Elle n''est ni cotée, ni valorisée par
    un tiers, ni contredite par un prospectus versé au dossier. Un émetteur A− qui promet 14 %/an ne se
    comporte pas comme un risque A− : cet écart de rendement rémunère un risque que la notation ne capture
    pas, et c''est exactement ce risque-là que la note du trésorier traite comme nul. « Deux caisses comparables
    ont souscrit l''an dernier » est une corrélation d''exposition sur douze mois, pas un antécédent sur
    sept ans.

    - **78 % de la réserve sur une contrepartie unique, illiquide, irréversible.** Cette seule ligne place
    l''existence de la caisse sous la solvabilité d''un tiers, sans recours ni rétractation, pendant sept
    ans. C''est un pouvoir que le conseil n''a pas à déléguer.


    Si le conseil vote C malgré tout, je demande que le procès-verbal enregistre nominativement les votes
    et la présente note en annexe. La décision est irréversible sur sept ans et engage la responsabilité
    personnelle de chaque administrateur ; chacun doit pouvoir montrer ce qu''il savait au moment du vote.


    **Option B — ajournée, pas rejetée.**


    Son mérite est réel : liquide, valorisée quotidiennement, réversible à tout moment — c''est-à-dire
    l''exact contraire de C. Mais son pire décile (−35 % sur la tranche, réserve à 15,8 M€) nous fait
    passer sous le ratio de trois années de prestations **pendant les mois où l''UMA instruira notre dossier**.
    Nous paierions un gain espéré d''environ 0,32 M€/an au risque de fermer nous-mêmes la seule porte
    de sortie.


    Le montant maximal compatible avec le maintien du ratio à 3,0 même dans le pire décile est de l''ordre
    de **2,4 M€, soit 13 % de la réserve** — et il ne rapporte qu''environ 0,10 M€/an, sans effet sur
    notre trajectoire. Je ne propose donc pas de tranche réduite pour la forme : je propose de **réexaminer
    B en pleine taille dès que la réponse de l''UMA sera connue**, avec un ordre du jour dédié. Si le
    transfert aboutit, B devient sans objet ; s''il échoue, B redevient le meilleur usage disponible de
    la réserve.


    **Option A — retenue par défaut, et clairement désignée pour ce qu''elle est.**


    A n''est pas une stratégie. C''est l''état dans lequel la réserve doit se trouver pour que le plan
    puisse s''exécuter : liquide, mobilisable, non exposée. Sur ce point le trésorier a raison et je le
    reprends à mon compte : **A seule, c''est la liquidation en année 6.** Voter A sans voter ce qui suit
    serait la décision la plus dangereuse de jeudi, parce qu''elle a l''apparence de la prudence.


    ---


    ### 4. Ce sur quoi j''engage la caisse


    **Engagement 1 — Écrire à l''UMA sous quinze jours.** Une question précise, dont la réponse commande
    tout : **le ratio de trois années de prestations est-il apprécié à la date de dépôt ou à la date de
    closing ?** Si c''est au dépôt, nous sommes éligibles et il faut déposer immédiatement. Si c''est
    au closing, la porte est déjà fermée et notre stratégie change entièrement dès aujourd''hui. Cette
    information décide de tout, elle coûte une lettre, et personne ne l''a demandée.


    **Engagement 2 — Déposer le dossier de transfert sous soixante jours**, sauf réponse négative explicite
    de l''UMA. Mandat au directeur pour engager les frais d''instruction et de conseil, dans la limite
    d''une enveloppe votée jeudi. C''est la seule action dont la fenêtre se referme.


    **Engagement 3 — Convoquer une AG extraordinaire sur les cotisations sous quatre mois**, avec des
    chiffres que les affiliés puissent vérifier :


    > Chacun cotise en moyenne **87 €/mois** et consomme **107 €/mois** de prestations. L''écart est de
    **20 € par mois et par affilié**. Le combler suppose un relèvement de **+22,7 %**, puis une indexation
    annuelle sur la dérive des dépenses. L''alternative n''est pas une cotisation plus basse : c''est
    la perte de toute couverture, sans repreneur, dans un délai de six ans.


    Le refus de 2024 portait sur +6 % sans contrepartie ni horizon. La question posée cette fois est différente,
    et je propose qu''elle soit posée ainsi.


    **Engagement 4 — Ouvrir sous trois mois l''examen des recours amiante.** Une part de la dérive de
    4,3 % est imputable à des pathologies dont la charge n''a peut-être pas à peser sur la caisse : subrogation
    contre les employeurs identifiés, articulation avec les dispositifs d''indemnisation des victimes
    de l''amiante. **Je ne peux pas affirmer aujourd''hui que ces recours sont ouverts ni ce qu''ils rendraient
    — c''est une hypothèse à instruire, pas un acquis.** Mais c''est le seul levier susceptible d''agir
    sur le numérateur du problème plutôt que sur son financement, et quelques semaines de conseil juridique
    sont dérisoires au regard de l''enjeu.


    ---


    ### 5. Déclencheurs de repli — observables, datés, sans reprise automatique


    | Déclencheur | Décision qu''il impose |

    |---|---|

    | Pas d''accusé de recevabilité de l''UMA sous 90 jours après dépôt | Conseil extraordinaire ; le
    transfert cesse d''être l''hypothèse principale |

    | Couverture < 2,5 années de prestations (réserve ≈ 15,3 M€) | La voie du transfert est éteinte ;
    ouverture du plan d''extinction ordonnée |

    | AG refusant tout relèvement | Le conseil acte au PV que la liquidation devient le scénario de référence,
    et en informe les affiliés |

    | Réserve < 14 M€ | Passage en gestion d''extinction, tant qu''il reste 2,5 années de prestations
    pour organiser une sortie négociée plutôt que subir la liquidation statutaire à 11 M€ |


    Aucun de ces seuils ne se franchit sans retour devant le conseil. Et aucun ne se rattrape ensuite.


    ---


    ### 6. Ce qui renverserait ma recommandation


    Je m''engage à le reconnaître par écrit si l''un de ces faits est établi :


    - **L''UMA répond que le ratio s''apprécie au closing, ou refuse d''instruire.** Alors le transfert
    n''existe pas, l''engagement 3 devient l''unique sortie, et la discussion sur le risque financier
    doit être rouverte — dans d''autres termes que ceux de C, mais rouverte.

    - **Le prospectus de la note C établit un coupon annuel en numéraire et une ségrégation effective
    des actifs sous-jacents.** Cela ne rend pas C acceptable à 78 % — la concentration et l''irréversibilité
    restent rédhibitoires — mais cela invaliderait l''argument de liquidité du §2c, et je le dirais.

    - **La projection interne à neuf ans repose sur des hypothèses défendables que je n''ai pas vues.**
    Alors l''urgence sur l''engagement 2 se desserre. Le calendrier de l''UMA, lui, ne bouge pas.


    ---


    ### 7. Le meilleur argument contre moi


    Il est dans la note du trésorier et il mérite mieux que d''être écarté : *une prudence qui ne fait
    rien d''autre que refuser condamne la caisse, et C est la seule option comportant une branche où la
    caisse survit seule.* Si l''AG refuse encore et si l''UMA refuse aussi, mon plan aboutit à la liquidation
    en année 6 après avoir gagné 1,8 %.


    Ma réponse tient en deux points. D''abord, **la branche de survie de C n''existe pas** : à 88 % comme
    à 3 %, la caisse ne peut plus payer ses prestations au mois 40. Un pari dont la victoire est aussi
    une insolvabilité n''est pas un pari. Ensuite, l''argument compare C à « mourir à petit feu » ; il
    ne compare jamais C à « transférer sous dix-huit mois », parce que cette option n''est pas chiffrée
    dans la note. C''est précisément l''option la plus proche d''aboutir, et c''est la seule que C détruit
    instantanément.


    L''argument du trésorier redeviendra fort — et devra être réentendu — le jour où l''engagement 1 nous
    aura appris que la porte de l''UMA est fermée. Pas avant.


    ---


    ### 8. Ce que je propose au trésorier et aux cinq cosignataires


    Je ne demande pas au conseil de trancher entre deux camps. La thèse du trésorier — l''immobilisme
    nous tue — est juste ; elle est seulement dirigée vers la mauvaise cible. Je propose donc, et je demande
    que ce soit voté avec le reste :


    - **Le trésorier conduit la campagne de l''AG extraordinaire**, avec un mandat formel, un budget et
    la maîtrise de l''argumentaire chiffré. C''est là que se joue la survie de la caisse, et c''est lui
    qui a la conviction et les modèles pour l''emporter.

    - **Une séance de réexamen du risque financier est inscrite dès maintenant à l''ordre du jour**, déclenchée
    par la réponse de l''UMA ou par le vote de l''AG, avec un expert indépendant mandaté sur la note structurée
    et rémunéré par la caisse. Ce n''est pas un veto permanent : c''est un rendez-vous daté, dont les
    cosignataires fixent eux-mêmes le cahier des charges.

    - **Les affiliés reçoivent l''arithmétique complète avant l''AG** — les 20 € mensuels, les six ans,
    l''absence de repreneur sur le marché. Ils supportent le risque en dernier ressort ; ils doivent voter
    en le connaissant.


    ---


    ### En un paragraphe


    **Je refuse C et je ne la signerai pas** : elle nous met en défaut de paiement au mois 40 dans son
    propre scénario favorable, et sa branche à 3 % n''est pas une perte, c''est la disparition de la couverture
    de 4 200 personnes qu''aucun assureur ne reprendra. **J''ajourne B** sans la condamner, parce que
    son mauvais décile fermerait la porte de l''UMA pendant l''instruction ; elle sera réexaminée en pleine
    taille dès la réponse connue. **Je maintiens A**, non comme stratégie mais comme état de disponibilité
    de la réserve — en disant clairement au conseil que A seule signifie la liquidation en année 6, et
    non en année 9. **Ce sur quoi j''engage la caisse, ce n''est aucune des trois options : c''est une
    lettre à l''UMA sous quinze jours, un dossier de transfert sous soixante jours, une AG extraordinaire
    sous quatre mois, et l''examen des recours amiante.** La réserve n''est pas notre capital à faire
    fructifier ; c''est le délai qu''il nous reste, et il est plus court que ce que le conseil croit.

    '
