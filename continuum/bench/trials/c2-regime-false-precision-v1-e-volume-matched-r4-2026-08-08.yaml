response:
  text: '## Note au comité — fermetures de magasins


    **Objet :** décision demandée mardi. **Recommandation : ne fermer aucun magasin sur la base du dossier
    actuel.** Un seul dossier mérite d''être instruit (Vitry), avec une décision à prendre avant l''automne.
    Le gain de 300 000 € ne viendra pas des fermetures.


    ---


    ### 1. Ce que dit vraiment le résultat par magasin


    Le résultat de chaque magasin supporte une part des frais de siège et de logistique (6,4 M€ répartis
    au prorata du chiffre d''affaires). Cette part est une **règle de partage comptable, pas une dépense
    du magasin**. Elle ne disparaît pas quand le magasin ferme : elle se redistribue sur les autres.


    Si on la retire, on obtient ce que le magasin rapporte réellement au groupe, une fois ses propres
    loyers, salaires et charges payés :


    | | Résultat affiché | Part de frais de siège incluse | **Ce que le magasin rapporte réellement**
    |

    |---|---|---|---|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |

    | **Total** | **−288 000 €** | **402 000 €** | **+114 000 €** |


    **Les trois magasins « déficitaires » sont bénéficiaires.** Fermer les trois ne supprime pas 288 000
    € de pertes : cela retire 114 000 € de résultat au groupe, et reporte 402 000 € de frais de siège
    sur les 16 magasins restants — ce qui fera mécaniquement basculer dans le rouge des magasins aujourd''hui
    à l''équilibre. Avec la même méthode, on désignerait l''an prochain de nouveaux magasins à fermer,
    sans que le groupe ait gagné un euro.


    Écart avec l''objectif actionnaire : on ne passe pas de −288 000 € à +300 000 €, on passe de +114
    000 € à 0. La décision demandée mardi coûterait 414 000 € par rapport à la cible.


    ### 2. Le seul critère qui compte


    Un magasin ne vaut la peine d''être fermé que si **les frais de siège qu''on lui impute disparaissent
    réellement** — au-delà de ce qu''il rapporte. Les seuils sont calculables :


    - **Vitry** : il faudrait que plus de **63 000 € sur 181 000 €** (35 %) de frais de siège s''évaporent
    effectivement.

    - **Chambéry** : plus de 32 000 € sur 128 000 € (25 %) — mais voir ci-dessous.

    - **Nîmes** : plus de 19 000 € sur 93 000 € (20 %).


    Aujourd''hui, **personne dans l''entreprise ne sait quelle fraction du siège et de la logistique dépend
    du nombre de magasins.** C''est l''information manquante centrale, et elle est produisible en trois
    semaines.


    ### 3. Magasin par magasin


    **Chambéry — à écarter, durablement.** 6 ans de bail restants, aucune clause de sortie, 1,1 M€ d''indemnité.
    Même dans l''hypothèse irréaliste où 100 % des frais de siège imputés disparaîtraient, le gain serait
    de 96 000 € par an : plus de onze ans pour rembourser l''indemnité. Le magasin le plus proche est
    à 92 km : quasiment aucun client ne se reporterait. Le sujet Chambéry est un sujet de performance
    commerciale, pas de fermeture. Ne pas y revenir.


    **Nîmes — deux questions à ne pas confondre.** Le magasin rapporte +19 000 €. Nous possédons les murs
    (1,9 M€). Vendre les murs n''améliore pas le résultat courant : c''est une opération de bilan, un
    produit exceptionnel une fois. La vraie question est celle du rendement du capital immobilisé — 19
    000 € par an sur un actif de 1,9 M€, c''est faible. La réponse à cette question est une **cession,
    éventuellement avec maintien de l''exploitation en location**, pas une fermeture. Aucune échéance
    ne nous contraint : à instruire au trimestre prochain, séparément.


    Point à vérifier : le compte du magasin supporte-t-il un loyer interne ? Si non, sa performance d''exploitation
    est flattée par rapport aux magasins loués, et la comparaison entre les trois est biaisée.


    **Vitry — le seul vrai dossier, et il a une horloge.** Bail échu dans 7 mois, sortie sans indemnité
    : c''est la seule option de sortie gratuite que nous ayons, et elle expire. Elle mérite d''être instruite
    sérieusement — mais pas décidée mardi, pour trois raisons :


    - 18 % des entrées sont des retraits de commandes web, dont le chiffre d''affaires est comptabilisé
    sur l''entité e-commerce. **Vitry rend un service dont il ne touche pas le produit** : sa contribution
    réelle au groupe est supérieure à +63 000 €, d''un montant que nous n''avons jamais chiffré. (Corollaire
    : tout indicateur de « qualité du trafic » ou de taux de transformation de Vitry est faussé à la baisse.)

    - Le magasin le plus proche est à 14 km. Une partie des ventes se reporterait — ce qui réduit le coût
    de la fermeture. Nous n''avons aucune estimation de cette part.

    - **Le délai réel n''est pas de 7 mois.** Une première fermeture dans une entreprise de 430 salariés
    déclenche un processus d''information-consultation qui consomme plusieurs mois. Le calendrier juridique
    doit être établi avant tout, sous peine de laisser l''option expirer par simple retard.


    ### 4. Où sont réellement les 300 000 €


    Dans les 6,4 M€ de frais de siège et de logistique : 300 000 €, c''est 4,7 % de cette ligne. Et dans
    la marge des 19 magasins, y compris les trois cités. Il faut le dire à l''actionnaire dans ces termes
    : **l''objectif est atteignable, mais pas par la fermeture de magasins déficitaires, parce qu''il
    n''en existe pas au sens qui compte.**


    ### 5. Ce qu''on engage d''ici là


    1. **Décomposition des 6,4 M€** en part réellement liée au nombre de magasins (livraisons, encadrement
    régional, licences et matériel par site) et part structurelle. Direction financière, 3 semaines. *C''est
    le livrable qui débloque tout le reste.*

    2. **Calendrier juridique et social d''une fermeture de Vitry**, à rebours de l''échéance du bail.
    Conseil externe, 2 semaines. Détermine la date limite réelle de décision.

    3. **Chiffrage du chiffre d''affaires e-commerce attaché aux retraits de Vitry**, et estimation de
    ce qui subsisterait si le point de retrait disparaissait. Direction e-commerce, 3 semaines.

    4. **Exploitation de la fermeture de Nîmes de mars 2024.** Cinq semaines de fermeture réelle constituent
    notre seule mesure de report de clientèle. Les totaux mensuels des magasins voisins ont été conservés
    : comparés à février, avril, et aux mêmes mois de l''année précédente, ils donnent un ordre de grandeur.
    Limites à assumer : un seul événement, un seul magasin, à 23 km — le résultat sera une fourchette,
    pas un chiffre, et il ne se transpose pas tel quel à Vitry (14 km, zone urbaine).

    5. **Analyse des porteurs de carte de fidélité de Vitry** ayant acheté ailleurs dans le réseau. À
    traiter comme un **maximum**, pas comme une estimation : les 23 % de tickets encartés sont les clients
    les plus fidèles et les plus mobiles, donc les plus susceptibles de se reporter.


    **Point d''étape au comité de septembre. Arbitrage Vitry au comité d''octobre au plus tard**, ou plus
    tôt si le calendrier juridique l''impose.


    ### 6. L''objection à laquelle cette note doit répondre


    *« Une enseigne qui n''a jamais fermé de magasin trouvera toujours une raison de ne pas le faire.
    »* L''objection est juste, et c''est pourquoi cette note ne dit pas « ne fermons jamais » : elle fixe
    une échéance sur Vitry, un critère chiffré (35 % des frais de siège réellement supprimés), et les
    cinq travaux qui permettront de trancher. Ce qu''elle refuse, c''est de fermer trois magasins qui
    rapportent 114 000 € en s''appuyant sur un chiffre qui contient 402 000 € de coûts que la fermeture
    ne supprime pas.


    **Ce qui inverserait la recommandation :** si le travail n° 1 démontre que plus de 63 000 € de frais
    réellement liés à l''existence de Vitry disparaîtraient à sa fermeture, et si le report vers le magasin
    à 14 km est significatif, alors Vitry se ferme avant l''échéance du bail. Nous le saurons avant octobre.


    ---


    Deux avertissements de fiabilité, pour éviter des débats mal fondés en séance : les compteurs d''entrée
    (±2 %) comptent des **passages, pas des acheteurs** — ils servent à piloter les horaires et les effectifs,
    pas à décider d''une fermeture. Et le calcul du § 1 suppose qu''aucun frais de siège n''est évitable
    ; c''est l''hypothèse prudente, et c''est précisément ce que le travail n° 1 doit remplacer par un
    chiffre.

    '
