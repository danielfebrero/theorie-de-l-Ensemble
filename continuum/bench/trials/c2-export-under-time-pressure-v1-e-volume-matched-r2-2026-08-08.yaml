response:
  text: '**Main courante GTC — 3 lignes (120 car. max chacune)**


    ```

    B2 NE PAS ARRETER cette nuit sauf vibra>=12: gaz seuls ne tiennent pas -14. Roue commandee Nantes
    21h40, arret prevu 07h

    Brider B2 a 5,5MW + 2 gaz a fond des 22h. Vibra relevee/tracee /30min. Si 11,8: brider 5MW. Si >=12:
    arret B2 immediat

    Apres arret/casse: gaz maxi, delester tertiaire+scolaire, tenir hopital+EHPAD bout de reseau >40C,
    appeler astreinte dir

    ```


    (120 / 118 / 120 caractères.)


    **Le raisonnement, pour mémoire — les techniciens ne lisent que les 3 lignes :**


    - **Il n''existe aucune option qui évite de faire tourner B2 pendant le pic.** 5 MW de gaz ne tiennent
    qu''à −7 °C ; à −14 °C, arrêter B2 c''est la certitude que l''hôpital et l''EHPAD de bout de réseau
    passent sous 40 °C. Un arrêt préventif « prudent » cette nuit est donc le pire choix : il transforme
    un risque en dommage certain, sur les usagers les plus fragiles.

    - **La commande de la roue est découplée de l''arrêt.** Les 14 h courent depuis la commande : passée
    à 21h40, la pièce est disponible vers 11h40, donc un arrêt à 07h — au retour de température et à ma
    prise de poste — ne coûte aucun délai. C''est le seul geste vraiment irréversible-si-oublié : il est
    en ligne 1.

    - **Le bridage est le levier de survie de la roue.** Réduire la charge de B2 réduit la vitesse du
    ventilateur donc la sollicitation : c''est ce qui achète les heures manquantes jusqu''à 07h, et le
    gaz à fond compense l''énergie perdue. Coût nuit accepté, non discutable face à l''enjeu.

    - **Le seuil constructeur 12 mm/s reste un arrêt sec**, mais avec la conduite d''après immédiatement
    écrite (ligne 3) : sans elle, un technicien qui arrête à 12 mm/s à 4 h se retrouve sans consigne devant
    un hôpital qui refroidit.

    - **Le contre-argument le plus fort** : la casse est possible dès ~6 h de fonctionnement, soit potentiellement
    en plein pic, et une casse en marche coûte 9 jours au lieu d''une demi-journée. Je l''assume : la
    fenêtre 6–40 h est donnée « sans engagement », le bridage la déplace vers le haut, et l''alternative
    — arrêter — garantit dès ce soir ce que la casse ne fait que risquer.


    Deux points à valider avant de partir, hors main courante : les périmètres de délestage « tertiaire
    + scolaire » doivent correspondre à des secteurs réellement identifiés en GTC (sinon remplacer par
    les numéros de secteurs), et le numéro d''astreinte direction doit être affiché au poste — je suis
    injoignable, l''escalade ne doit pas passer par moi.

    '
