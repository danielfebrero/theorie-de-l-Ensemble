response:
  text: '## Position écrite — Présidence de la CLE du bassin de la Vèze


    *Adressée aux trois parties 48 h avant la séance, pour que personne ne la découvre dans la salle.*


    ---


    ### 1. Ce que je ne mets pas au vote


    **Le débit réservé de 180 L/s est intangible.** Deux raisons, et la seconde suffit.


    D''abord, il relève d''un arrêté préfectoral : la commission n''a pas compétence pour le modifier,
    et une délibération qui l''entamerait serait annulée.


    Ensuite : c''est la seule perte irréversible du dossier. Le rapport du 12 juin qualifie l''assèchement
    des frayères de non reconstituable à l''échelle d''une décennie. Les 4,1 M€ annoncés par les maraîchers
    sont une perte lourde, mais elle est d''une saison et elle est compensable. Une population de truites
    effondrée et deux frayères asséchées ne se rachètent avec aucun budget. Ces deux grandeurs ne s''additionnent
    pas dans la même colonne : la première entre dans l''arbitrage, la seconde le borne. Je ne les mettrai
    pas en balance, et je ne laisserai pas la séance le faire.


    **Un bloc sanitaire est garanti sans condition et sans terme.** Population de Ferney, EHPAD, établissements
    sensibles, défense incendie. La régie demande une garantie avant d''ouvrir la discussion : elle l''a,
    immédiatement, par écrit. Ce qui n''est pas garanti, c''est le reste de son prélèvement — et c''est
    l''objet du point suivant.


    Il reste donc 230 L/s à répartir, contre 390 demandés.


    ---


    ### 2. Le chiffre que personne n''a regardé


    150 L/s pour 9 200 habitants font **1 409 litres par habitant et par jour**. La moyenne domestique
    française est de 148. Le prélèvement de la régie représente environ **neuf fois et demie** le besoin
    domestique de la population qu''elle est censée desservir.


    Je ne prétends pas savoir ce qui explique l''écart. Trois hypothèses sont plausibles et vérifiables
    en quelques jours : un rendement de réseau dégradé, des abonnés non domestiques (industrie, agroalimentaire),
    ou la desserte de communes qui ne figurent pas dans ce dossier. Aucune n''est illégitime. Mais aucune
    n''a été produite devant la commission, et l''ensemble de l''arbitrage repose dessus.


    **Ce que je demande à la régie, sous 5 jours :** rendement de réseau et indice linéaire de pertes,
    volumes facturés par catégorie d''abonnés, liste des abonnés non domestiques au-delà de 5 000 m³/an,
    périmètre exact desservi.


    Tant que ces éléments ne sont pas produits, je ne peux pas traiter les 150 L/s comme un besoin sanitaire.
    Je les traite comme un prélèvement dont une part est sanitaire — garantie — et le reste indéterminé.


    Cela répond aussi au titre du journal. La ligne de partage n''est pas entre les paysans et les robinets.
    Elle passe entre les usages vitaux et les usages non vitaux, et elle traverse les deux camps.


    ---


    ### 3. Le chiffre invérifiable, et pourquoi ma réponse n''est pas « moins d''eau »


    Les 240 L/s ne sont adossés à aucune donnée que nous détenions : ni culture, ni stade végétatif, ni
    relevé de compteur. Mais ils ne sont pas absurdes. Rapportés aux 620 ha, ils font **0,39 L/s/ha**,
    soit environ 3,3 mm/jour — déjà en dessous des besoins d''un maraîchage d''été. Les maraîchers demandent
    une dose déficitaire.


    C''est précisément pourquoi la mauvaise réponse serait de leur accorder 80 L/s « répartis ». À 0,13
    L/s/ha sur 620 ha, on obtient un tiers de dose partout : les cultures souffrent toutes, presque aucune
    n''arrive à récolte, et la perte est quasi totale. La bonne réponse est **la même eau, concentrée**
    :


    | Volume agricole | Réparti sur 620 ha | Concentré à la dose demandée (0,39 L/s/ha) |

    |---|---|---|

    | 80 L/s | 0,13 L/s/ha — un tiers de dose partout | **205 ha menés à récolte** |

    | 110 L/s | 0,18 L/s/ha | **282 ha menés à récolte** |

    | 240 L/s (demande) | 0,39 L/s/ha sur 620 ha | — |


    Autrement dit : 110 L/s concentrés délivrent à l''hectare **plus** que les 240 L/s demandés étalés.
    Aux prix implicites du dossier (4,1 M€ / 620 ha ≈ 6 600 €/ha), sauver 205 à 282 ha en plein rendement
    représente 1,3 à 1,9 M€, contre un résidu de l''ordre de 0,6 M€ en dose uniforme. **L''écart créé
    par le plan de concentration vaut deux à trois fois le fonds départemental.** C''est le principal
    argument que j''ai à opposer aux maraîchers, et il est chiffré à partir de leurs propres nombres.


    ---


    ### 4. L''instrument : quotas individuels, pas volume global


    Le règlement me laisse le choix. Je prends les **quotas individuels**, et je m''en explique.


    Six exploitations cultivent 300 ha sur 620. Un volume global par usage, avec répartition libre à l''intérieur
    de la profession, confie l''arbitrage au rapport de force interne, sans compteurs pour l''objectiver
    et sans que la commission puisse voir où le déficit atterrit. Il atterrira sur les 28 autres. Le quota
    individuel est le seul instrument qui rende la répartition interne visible, publiable et contestable.


    **Règle d''attribution.** Chaque exploitation déclare sous 72 h ses parcelles, cultures, stades et
    index de compteur. La commission publie chaque semaine une *surface finançable en eau* = bloc agricole
    ÷ 0,39. Chaque exploitation reçoit une part proportionnelle à sa surface irriguée déclarée, avec un
    plancher de 2 ha par exploitation. Le quota est exprimé en **pourcentage du bloc agricole**, pas en
    litres — il suit donc automatiquement la baisse du débit sans nouvelle délibération.


    Absence de déclaration au 72<sup>e</sup> jour-heure : allocation au plancher. La déclaration est le
    prix de l''accès.


    Je choisis la proportionnalité à la surface **parce que je n''ai aucune donnée justifiant mieux**
    — pas parce qu''elle est optimale. Toute exploitation peut contester sa part en produisant ses données
    parcellaires : la voie de recours est la correction de mon ignorance.


    ---


    ### 5. La règle de partage, robuste à la baisse


    Le débit va continuer de descendre. Je n''inscris donc pas trois nombres, j''inscris un **ordre**
    :


    1. 180 L/s au réservé, en absolu, avant tout ;

    2. le bloc sanitaire ;

    3. **le solde à l''agriculture.**


    L''agriculture absorbe donc toute la variance hydrologique. C''est un désavantage réel et je l''assume
    à découvert : c''est le seul usage dont la perte est monétairement réparable. En contrepartie, **la
    totalité du fonds va à l''agriculture**, et tout litre libéré par la régie lui revient — à elle, et
    nulle part ailleurs. C''est écrit dans la délibération.


    Calendrier : régie à 150 L/s pendant 5 jours (sa réserve tampon est de 4 jours, elle n''est à aucun
    moment exposée) ; à J+5, suspension par arrêté municipal des seuls usages non essentiels — arrosage
    d''espaces verts, lavage de voirie, remplissage de piscines, lavage de véhicules — soit environ −30
    L/s qui passent à l''agriculture sans qu''un seul foyer soit touché ; à J+12, dotation fixée par l''audit,
    plancher sanitaire garanti à 60 L/s (déjà près du double d''une estimation généreuse des besoins vitaux,
    marge assumée en raison de notre ignorance).


    ---


    ### 6. La clause de levée : ne pas refaire 2022


    Le dispositif de 2022 a échoué parce qu''il mesurait un **événement** et pas un **état**. L''orage
    du 9 août a produit du ruissellement, pas de la recharge : 520 L/s pendant deux jours, reprise intégrale
    le 11, retour à 340 L/s en quatre jours. Le seuil a fonctionné exactement comme prévu et le résultat
    a été un désastre.


    Nouvelle clause :


    - **La levée exige 7 jours consécutifs au-dessus du seuil**, pas 48 heures ;

    - **le seuil de levée (700 L/s) est très supérieur au seuil de restriction** — un hystérésis, pour
    qu''un régime ne s''inverse pas sur du bruit ;

    - **la levée est progressive** : un palier intermédiaire à 550 L/s pendant 5 jours ouvre au plus +30
    L/s à l''agriculture ; le retour intégral n''existe qu''au seuil haut ;

    - **une pluie ne lève rien.** Elle fait avancer un compteur. Ce sont les jours qui lèvent, pas l''orage.


    ---


    ### 7. La station


    Tout ce qui précède repose sur un instrument unique, étalonné pour la dernière fois en 2023, sans
    point de contrôle contradictoire. C''est la fragilité la plus grave du dossier et elle n''a jamais
    été soulevée.


    Je demande sous 7 jours un **jaugeage contradictoire** au droit de la station, l''installation d''une
    échelle limnimétrique à l''aval du débit réservé avec deux jaugeages manuels hebdomadaires, et le
    réétalonnage complet.


    **Règle d''imputation de l''erreur, arrêtée maintenant et pas après :** si le jaugeage révèle que
    la station surestime, la correction est prélevée sur le bloc agricole — jamais sur le réservé, jamais
    sur le bloc sanitaire — et l''écart est indemnisé par le fonds. Si elle sous-estime, l''intégralité
    du surplus va à l''agriculture. Décider cette règle avant de connaître le résultat est la seule façon
    qu''elle soit honnête.


    ---


    ### 8. Le fonds de 600 000 €


    Il ne sert **pas** à acheter de l''eau. Il achète le plan de concentration, c''est-à-dire il paie
    ce que les maraîchers renoncent à irriguer.


    - **420 k€** — indemnisation des surfaces déclarées abandonnées, dégressive à l''hectare et plafonnée
    par exploitation, de sorte que les six grandes ne captent pas la moitié du fonds ;

    - **90 k€** — pose et relevé de compteurs sur les 34 exploitations, condition d''accès au régime 2027
    ;

    - **40 k€** — jaugeage, échelle aval, réétalonnage ;

    - **50 k€** — réserve d''ajustement.


    Je dis franchement ce que ce fonds n''est pas : 600 k€ contre 4,1 M€ annoncés, c''est 15 %. Il ne
    répare pas la saison. Il transforme un renoncement subi en acte payé, et c''est le plan de concentration
    — pas l''argent — qui préserve l''essentiel de la valeur.


    ---


    ### 9. Repli, avec déclencheurs observables


    | Déclencheur | Action, sans nouvelle réunion |

    |---|---|

    | Débit < 350 L/s, 3 jours consécutifs | Bloc agricole ramené à 40 L/s ; régie au plancher sanitaire
    ; réservé tenu |

    | Débit < 250 L/s | Irrigation agricole suspendue ; saisine immédiate du préfet |

    | Pression de service insuffisante, ou incident EHPAD | Suspension immédiate de tout prélèvement agricole,
    décision du président, ratification a posteriori |


    Sous 250 L/s, deux irréversibles se heurtent : la vie humaine et la frayère. **Je pré-engage la réponse
    maintenant, à froid : le bloc sanitaire prime sur le débit réservé.** Cette décision appartient au
    préfet, pas à moi ; je demande qu''elle soit documentée et versée au dossier hydrobiologique. L''écrire
    aujourd''hui évite qu''elle soit prise dans la panique un dimanche d''août.


    ---


    ### 10. Ce qui me ferait avoir tort


    **Le contre-argument le plus fort contre ma propre position :** je reproche aux maraîchers un chiffre
    non audité (240 L/s) et je fonde tout mon phasage sur un chiffre tout aussi non audité de l''autre
    côté (le plancher de 60 L/s). Si l''audit démontre que les 150 L/s sont réellement incompressibles
    — parce que la régie dessert d''autres communes, par exemple — alors l''arithmétique de la phase 2
    s''effondre et l''agriculture reste à 80 L/s toute la saison.


    Dans ce cas, je ne rouvre pas le débit réservé. Je saisis le préfet pour une interconnexion de secours
    ou un transfert, et je bascule l''intégralité du fonds en indemnisation. Je le dis avant l''audit
    pour que personne ne puisse croire que le résultat de l''audit dépend de ce qu''il m''arrange de trouver.


    **Seconde faiblesse, réelle :** un quota sans compteur est un vœu. Pendant les deux premières semaines,
    le contrôle repose sur les contrôles inopinés de l''OFB et de la DDT, sur le conditionnement du versement
    du fonds au respect du quota — l''argent tient lieu de compteur tant qu''il n''y a pas de compteur
    — et sur la publication des allocations individuelles, dans une profession de 34 exploitants qui connaissent
    tous les parcelles des autres. C''est faible. Je préfère l''écrire que le découvrir.


    ---


    ### 11. Ce que je dis à chacun, jeudi


    **À la régie.** Votre bloc sanitaire est garanti, sans condition, sans terme, avant toute discussion
    — vous n''avez plus de raison de refuser de discuter. Ce qui n''est pas garanti, c''est la part de
    votre prélèvement qui dépasse neuf fois le besoin domestique de Ferney, et j''attends vos chiffres
    sous cinq jours. Aucun foyer, aucun lit d''EHPAD n''est touché à aucun moment de ce plan.


    **Aux maraîchers.** Je ne vous propose pas un tiers d''eau partout, je vous propose votre dose pleine
    sur 205 puis 282 hectares — davantage à l''hectare que ce que vous avez demandé. Ce que vous abandonnez
    est payé. Vous siégez au comité qui vérifie les données de la régie : vous auditez vous-mêmes le chiffre
    qui vous contraint. Et chaque litre qu''elle libère vous revient, c''est écrit.


    **Pour la rivière.** 180 L/s ne sont pas un curseur. La fédération de pêche et l''OFB siègent au comité
    de suivi, les débits journaliers des trois blocs sont publiés, et la seule circonstance où ce plancher
    pourrait céder est nommée à l''avance, bornée, et relève du préfet.


    **À la presse.** Le tableau quotidien sera public. « Les paysans contre les robinets » ne survivra
    pas à sa première ligne.


    **Première action, vendredi matin :** les trois demandes de données partent — régie, exploitations,
    jaugeage — et le jaugeage contradictoire est commandé. Rien dans ce plan n''est solide tant que ces
    trois retours ne sont pas là.


    ---


    Si vous voulez ce document sous forme de page partageable avec les trois parties et la presse, je
    peux le publier en un lien.

    '
