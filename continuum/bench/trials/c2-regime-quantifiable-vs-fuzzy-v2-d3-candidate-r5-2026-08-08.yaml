response:
  text: '# Note au conseil — séance de jeudi


    **Objet :** arbitrage des dossiers A (machines) et B (direction qualité) sur l''enveloppe de 900 000
    €

    **Recommandation :** engager la totalité de l''enveloppe — 620 000 € sur A, 280 000 € sur B. Les deux
    dossiers tiennent dans l''enveloppe : il n''y a pas d''arbitrage à faire entre eux, seulement deux
    décisions à prendre.


    ---


    ## 1. Le tableau demandé, et sa seule limite


    Le président demande un classement unique par rendement en euros. Il est fourni ci-dessous, mais en
    deux blocs, et voici pourquoi : les lignes du dossier A ont un rendement mesuré (cinq ans de maintenance
    horodatée et auditée). Les lignes du dossier B n''en ont pas — non par paresse, mais parce que ce
    qu''on y achète est la continuité d''un agrément réglementaire, dont la perte ne se rattrape pas et
    ne se chiffre donc pas en rendement. Les ranger sur la même colonne obligerait à inventer un chiffre
    pour B ; le classement refléterait alors ce chiffre inventé, pas les faits. **Un indicateur unique
    ne trancherait pas les deux dossiers : il trancherait la valeur qu''on aurait choisi d''inventer pour
    le second.**


    | # | Ligne | Coût | Ce que l''euro achète | Base | Décision |

    |---|---|---|---|---|---|

    | **A** | Parc complet, 6 machines | 620 000 € | 57 000 à 78 000 €/an récupérés | Mesurée, auditée
    | **Engager** |

    | A1 | *dont* 3 machines les plus défaillantes | 310 000 € | l''essentiel du gain ci-dessus | À confirmer
    (§3) | Livrer en premier |

    | A2 | *dont* 3 machines restantes | 310 000 € | le solde | Mesurée | Livrer ensuite |

    | **B** | Promotion de l''adjointe | 45 000 € | le titulaire du poste | Non chiffrable | **Engager**
    |

    | B | Mission de transition de l''intéressé | 90 000 € | le transfert de la relation ON et clients
    | Non chiffrable | **Engager** |

    | B | Provision recrutement externe | 145 000 € | le repli si l''adjointe ne qualifie pas | Non chiffrable
    | **Engager sous conditions** |


    ---


    ## 2. Dossier A — engager le parc complet, livré par ordre de défaillance


    Les chiffres audités donnent, en année pleine sur le parc : 42 600 € de coût direct d''immobilisation,
    362 heures d''arrêt (soit 13 800 € de marge perdue si les machines sont bien notre goulot), et un
    gain de rebut de 2,9 points valant 10 600 à 21 200 € selon le volume d''heures produites. Total :
    **57 000 à 78 000 € par an, pour 620 000 € investis, soit un retour en 8 à 11 ans.**


    Sur un exercice normal, ce rendement ne passerait pas. Ici il passe, et c''est le seul argument qui
    compte : **l''enveloppe n''est pas reconductible.** L''alternative à un investissement qui rapporte
    9 % par an n''est pas un placement meilleur, c''est zéro. Le seuil de rentabilité à retenir jeudi
    n''est pas notre coût du capital, il est nul.


    **Deux réserves à lever avant signature, pas après :**


    - **La garantie de 96 % est peut-être décorative.** À 96 %, le fournisseur s''autorise 4 % d''arrêt.
    Nous subissons aujourd''hui 362 heures par an. Si le parc tourne plus de ~9 000 heures par an au total,
    le plancher contractuel autorise *plus* d''arrêt que ce que nous connaissons déjà, et les pénalités
    ne se déclencheront jamais. Le chiffre des heures annuelles d''ouverture du parc est en interne :
    à obtenir avant jeudi, et à indexer le plancher sur notre disponibilité réelle constatée.

    - **Le journal de maintenance est horodaté : il dit machine par machine où sont les 47 pannes.** Cette
    ventilation s''obtient en deux jours et ne coûte rien. Elle ne change pas le montant engagé — nous
    prenons les six — mais elle fixe l''ordre de livraison, et donc la date à laquelle le gain commence.


    ## 3. Dossier B — promotion et transition ensemble, avec une provision de repli


    Les trois pistes RH ne sont pas exclusives, et la question posée n''est pas « laquelle », mais « laquelle
    du poste, laquelle de la relation ». Nous recommandons **la promotion de l''adjointe (45 000 €) et
    la mission de transition (90 000 €)**, soit 135 000 €.


    **La cotation du cabinet RH ne peut pas fonder cette décision, et nous demandons au conseil de l''écarter.**
    Trois consultants sans expérience du dispositif médical, en atelier, sans base de comparaison. Elle
    est en outre incohérente : la probabilité de 35 % porte sur la rupture d''*au moins une* relation,
    tandis que les 4,2 M€ correspondent au chiffre d''affaires annuel des *deux* — et à du chiffre d''affaires,
    non à de la marge. Le chiffre n''est utilisable ni pour alarmer ni pour rassurer.


    **Le vrai risque n''est pas dans cette cotation.** Perdre 31 % du chiffre d''affaires serait grave
    et rattrapable en plusieurs années. Perdre la continuité de la certification ne l''est pas : sans
    certificat, plus aucun produit ne se vend, y compris aux clients qui restent. C''est la seule branche
    sans retour, et c''est celle que la cotation ne mentionne pas.


    **Point décisif à vérifier avant la nomination :** le règlement applicable (MDR/IVDR, article 15)
    impose une personne chargée de veiller au respect de la réglementation, disposant soit d''un diplôme
    qualifiant plus un an d''expérience, soit de quatre ans d''expérience en affaires réglementaires ou
    système qualité sur dispositifs. L''adjointe a trois ans chez nous ; son parcours antérieur décide.
    Et à 140 salariés, nous ne relevons pas de la dérogation réservée aux petites entreprises : **cette
    fonction doit être interne — la mission de transition ne peut donc pas la couvrir.** À confirmer avec
    notre conseil réglementaire cette semaine.


    **Ce qui ne coûte rien et vaut le plus :** les onze mois restants. Présentation de la successeure
    à l''organisme notifié pendant que le titulaire est encore en poste, si possible lors de la prochaine
    visite de surveillance ; visites conjointes chez les deux clients hospitaliers ; contractualisation
    de ces deux relations. Ce sont des directives de management à donner jeudi, pas des lignes budgétaires.


    ## 4. Répartition et déclencheurs


    **620 000 € sur A** (parc complet, livraison ordonnée par défaillance, plancher de disponibilité renégocié
    avant signature).

    **135 000 € sur B** (promotion + mission de transition), engagés immédiatement.

    **145 000 € de provision B**, engagés sous forme de mandat ferme auprès du cabinet, mobilisables sur
    trois déclencheurs observables : l''adjointe ne satisfait pas l''article 15 ; l''organisme notifié
    émet une non-conformité ou une réserve lors de la prochaine visite ; l''un des deux clients hospitaliers
    dénonce ou ne renouvelle pas son contrat dans les six mois du départ. Avec les 135 000 € déjà engagés,
    la provision porte le dossier B à 280 000 €, soit exactement le coût du recrutement externe : nous
    ne renonçons à rien en commençant par l''interne.


    **Total engagé : 900 000 €.** À vérifier auprès de la direction financière avant jeudi : si l''enveloppe
    exige un décaissement et non un simple engagement contractuel, la provision doit prendre une autre
    forme, et cette question doit être tranchée avant la séance.


    **Ce qui renverserait ces choix :** pour A, un volume d''heures produites nettement inférieur à ce
    que nous supposons, ou une concentration des pannes sur une seule machine — les deux réduiraient l''engagement
    à une tranche. Pour B, un parcours de l''adjointe satisfaisant l''article 15 *et* une reprise en main
    documentée de la relation ON dans les trois mois rendraient la provision inutile ; à l''inverse, un
    refus de l''intéressé d''assurer la transition fait basculer immédiatement sur le recrutement externe.


    **Première action, vendredi matin :** demander la ventilation des pannes par machine, les heures annuelles
    d''ouverture du parc, et le dossier de qualification de l''adjointe au regard de l''article 15.

    '
