response:
  text: "Voici la note. Un point de méthode d'abord, parce qu'il change la conclusion : les trois magasins\
    \ « en perte » rapportent en réalité 114 000 € par an au groupe. Le calcul est dans la note.\n\n---\n\
    \n# Note au comité — fermetures de magasins\n\n**Objet :** réponse à l'objectif de 300 000 € de résultat\
    \ sur l'exercice prochain\n**Recommandation :** ne fermer aucun magasin mardi. Aller chercher les\
    \ 300 000 € ailleurs. Ne préserver qu'une seule échéance, celle du bail de Vitry.\n\n## 1. Pourquoi\
    \ les chiffres disent le contraire de ce qu'on leur fait dire\n\nNos comptes sont justes. Ils répondent\
    \ simplement à une autre question que celle de mardi.\n\nLe résultat par magasin inclut une quote-part\
    \ des frais de siège et de logistique — 6,4 M€ répartis au prorata du chiffre d'affaires. **Cette\
    \ quote-part ne disparaît pas quand un magasin ferme.** Les salaires du siège, l'informatique, la\
    \ direction, l'essentiel de l'entrepôt restent. Elle se reporte simplement sur les magasins qui restent.\n\
    \nLa bonne question n'est donc pas « ce magasin est-il en perte ? » mais « que perd le groupe le jour\
    \ où il n'existe plus ? »\n\n| Magasin | Résultat affiché | Quote-part siège incluse | Ce que le magasin\
    \ rapporte réellement |\n|---|---|---|---|\n| Vitry | −118 000 € | 181 000 € | **+63 000 €** |\n|\
    \ Chambéry | −96 000 € | 128 000 € | **+32 000 €** |\n| Nîmes | −74 000 € | 93 000 € | **+19 000 €**\
    \ |\n| **Total** | **−288 000 €** | **402 000 €** | **+114 000 €** |\n\nLes trois magasins couvrent\
    \ leurs loyers, leurs salaires et leurs charges, et versent en plus 114 000 € qui financent le siège.\
    \ Les fermer, c'est perdre ces 114 000 € et redistribuer 402 000 € de frais fixes sur les 16 magasins\
    \ restants. Mécaniquement, plusieurs magasins aujourd'hui bénéficiaires basculeraient dans le rouge\
    \ : nous aurions une nouvelle liste de « magasins en perte » et exactement le même débat l'an prochain.\n\
    \nUn mot sur la coïncidence : 118 + 96 + 74 = 288 000 €, presque l'objectif. C'est ce qui rend le\
    \ plan séduisant. Mais c'est une addition de quote-parts, pas une addition d'économies.\n\n## 2. Les\
    \ trois sites, un par un\n\n**Vitry.** C'est le plus gros des trois en chiffre d'affaires, et celui\
    \ dont le chiffre est le plus mal mesuré : 18 % de ses entrées sont des retraits de commandes web,\
    \ dont le chiffre d'affaires est enregistré sur l'entité e-commerce. Vitry fait le travail, une autre\
    \ entité encaisse — et Vitry paie ensuite sa quote-part de siège calculée sur un chiffre d'affaires\
    \ amputé. C'est le magasin le plus pénalisé par notre propre convention comptable. Le fermer ne supprimerait\
    \ pas ces retraits : il faudrait les livrer autrement, à un coût que personne n'a chiffré.\n\nC'est\
    \ aussi le seul dont la sortie ne coûte rien : bail échu dans 7 mois, sans indemnité. **Point de calendrier\
    \ à vérifier cette semaine :** un congé de bail commercial se donne en principe six mois avant l'échéance.\
    \ Si c'est le cas ici, la fenêtre se referme dans quelques semaines. C'est la seule urgence réelle\
    \ du dossier.\n\n**Chambéry.** 6 ans de bail restants, aucune clause de sortie, 1,1 M€ d'indemnité.\
    \ Payer 1,1 M€ pour supprimer un site qui rapporte 32 000 € par an n'est défendable dans aucun scénario.\
    \ C'est en outre le site le plus isolé — 92 km du magasin suivant — donc celui dont la clientèle se\
    \ reporterait le moins. **La fermeture de Chambéry doit sortir de la discussion.**\n\n**Nîmes.** Nous\
    \ détenons les murs, 1,9 M€. Ce n'est pas une question de fermeture, c'est une question de patrimoine,\
    \ et il ne faut pas confondre les deux. Vendre les murs rapporterait **une fois** 1,9 M€ : un produit\
    \ exceptionnel, pas un résultat récurrent — cela ne répond donc pas à la demande de l'actionnaire,\
    \ qui porte sur le résultat d'exploitation. La vraie question à instruire est différente : peut-on\
    \ vendre les murs **et garder le magasin** (cession-bail) ? On encaisserait 1,9 M€ en conservant l'exploitation\
    \ et les 19 000 € — sous réserve que le loyer futur reste soutenable. À chiffrer, sur un calendrier\
    \ propre.\n\n## 3. Ce que nous ne savons pas, et que nous pouvons savoir en quatre semaines\n\nTrois\
    \ chiffres manquent. Aucun n'est coûteux à produire.\n\n1. **Le taux de report de clientèle.** Nous\
    \ avons une expérience réelle : Nîmes est resté fermé cinq semaines en mars 2024. Nous n'avons gardé\
    \ que les totaux mensuels des magasins voisins — c'est grossier, mais comparable à l'année précédente.\
    \ Surtout, la carte de fidélité est nominative : nous pouvons suivre individuellement les porteurs\
    \ habituels de Nîmes, voir où ils ont acheté pendant ces cinq semaines, et s'ils sont revenus après.\
    \ C'est la seule mesure directe que nous possédions de ce qui se passe quand un magasin ferme.\n *Limite\
    \ assumée :* la carte ne couvre que 23 % des tickets, et les porteurs sont probablement les clients\
    \ les plus mobiles (41 % achètent déjà dans deux magasins). Le taux obtenu est donc un **plafond**,\
    \ pas une moyenne. C'est utile quand même : s'il est déjà faible, la question est tranchée.\n2. **La\
    \ part réellement variable des 6,4 M€.** Combien de ces frais disparaissent effectivement quand un\
    \ magasin ferme ? Personne ne l'a jamais séparé. Sans ce chiffre, aucune économie de fermeture n'est\
    \ calculable.\n3. **Le coût d'une première fermeture.** Nous n'avons jamais fermé. Plan de sauvegarde\
    \ de l'emploi, indemnités, reclassements, délais, contentieux : rien de cela ne figure dans le −118\
    \ 000 €. C'est une sortie de trésorerie qui tombe la première année — précisément l'exercice où l'actionnaire\
    \ attend +300 000 €.\n\n*Sur les compteurs d'entrée :* ils sont fiables (±2 %) mais ils comptent des\
    \ entrées, pas des acheteurs. Ils ne peuvent pas dire si un magasin est rentable. En revanche, 24\
    \ mois d'historique à la demi-heure sur 19 magasins sont un excellent outil pour recaler horaires\
    \ et plannings : c'est un gisement d'économies, pas un argument de fermeture.\n\n## 4. Ce que nous\
    \ proposons de décider mardi\n\n1. **Aucune fermeture décidée mardi.** Le dossier ne le permet pas.\n\
    2. **Chambéry : la fermeture est retirée de la table**, définitivement, sur les données déjà disponibles.\n\
    3. **Vitry :** vérifier sous 5 jours la date limite de congé, et ouvrir immédiatement la renégociation\
    \ du loyer. Notre position ne sera jamais aussi forte : le bailleur a sept mois pour éviter une vacance.\
    \ Objectif : une baisse de loyer, ou un bail plus court qui nous rende l'option de sortie plus tard,\
    \ à froid.\n4. **Nîmes :** mandater une étude de cession-bail des murs, sujet patrimonial séparé.\n\
    5. **Lancer les trois mesures du point 3**, responsable nommé, restitution au comité dans quatre semaines.\n\
    6. **Ouvrir le chantier des 300 000 €** (ci-dessous), avec un responsable et une date par ligne.\n\
    \n## 5. Où sont les 300 000 €\n\n300 000 €, c'est **4,7 % des 6,4 M€** de frais de siège et de logistique.\
    \ Cette ligne pèse plus que les trois magasins réunis et n'a jamais été passée au crible. C'est là\
    \ qu'il faut chercher en premier.\n\nEnsuite : renégociation du loyer de Vitry (l'échéance est notre\
    \ levier), plannings recalés sur les 24 mois de fréquentation, et réattribution du chiffre d'affaires\
    \ des retraits web aux magasins qui les servent. Cette dernière ne crée pas un euro, mais elle cesse\
    \ de désigner comme coupables les magasins qui portent le canal web.\n\n## 6. Ce qui nous ferait changer\
    \ d'avis\n\nCette recommandation bascule si la mesure de mars 2024 montre un report élevé — disons\
    \ plus de la moitié du chiffre d'affaires retrouvé dans le réseau — **et** que la part réellement\
    \ variable des frais de siège dépasse la contribution du magasin. Dans ce cas, et **pour Vitry seulement**\
    \ (le seul dont la sortie ne coûte rien), la fermeture redevient défendable. Nous le saurons dans\
    \ quatre semaines.\n\n**Pire cas de ce que nous proposons :** nous nous présentons devant l'actionnaire\
    \ sans fermeture et sans 300 000 € immédiatement acquis. C'est la direction qui l'encaisse, sur sa\
    \ crédibilité. D'où l'importance de présenter le point 5 mardi avec des noms et des dates, pas comme\
    \ une intention.\n\n**Repli :** si dans quatre semaines le plan d'économies chiffré et engagé est\
    \ inférieur à 200 000 €, ou si la mesure de report n'a pas été produite, le comité reprend le dossier\
    \ Vitry en décision et tranche avant la date limite de congé.\n\n**Première action :** mercredi matin,\
    \ appel au conseil du bail de Vitry pour obtenir la date limite de congé. C'est la seule échéance\
    \ du dossier qui court sans nous.\n\n---\n\nTrois points à surveiller à l'oral mardi :\n\n- Le tableau\
    \ du §1 est le seul passage qui compte. S'il n'est pas accepté, rien du reste ne tient.\n- La date\
    \ de congé de Vitry est une donnée que je n'ai pas : si le préavis est déjà dépassé ou s'il est de\
    \ trois mois, le §4.3 change de nature.\n- Je n'ai pas chiffré le coût social d'une fermeture faute\
    \ d'éléments (effectifs par site, ancienneté). Si le comité veut un ordre de grandeur mardi, il faut\
    \ ces données lundi.\n"
