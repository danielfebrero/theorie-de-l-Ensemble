response:
  text: '## Recommandation — comité d''investissement de mardi


    **Verdict en trois lignes.** Le chiffre 31 % → 47 % ne mesure pas un effet de l''onboarding v2 ; il
    mesure la façon dont le bras v2 a été constitué. Le 41 % « nettoyé » est pire, pas plus prudent. La
    diapositive doit perdre la comparaison d''activation et garder ce qui reste mesuré proprement.


    ---


    ### 1. Ce que disent réellement les journaux


    Le défaut n''est pas dans les données, il est dans la définition du bras v2.


    Le témoin est affecté à l''inscription : son dénominateur est l''ensemble des comptes exposés. Le
    bras v2 est affecté à l''étape 3 : son dénominateur est l''ensemble des comptes **qui ont survécu
    jusqu''à l''étape 3**. Les deux bras ne comptent pas la même chose. Tout compte exposé à v2 qui abandonne
    avant l''étape 3 est absent des 11 300 — et absent de tout.


    Le taux du bras v2 est donc un taux conditionnel : *activation sachant que le compte a déjà franchi
    les deux tiers du nouveau parcours*. Le comparer au taux inconditionnel du témoin n''est pas une comparaison
    biaisée à la marge ; c''est une comparaison entre deux quantités différentes.


    **Les 4 812 inversions ne sont pas un artefact de journalisation, elles sont la signature de ce défaut.**
    Même service d''ingestion, horloge unique, NTP, aucune source cliente, aucun incident infra : il n''existe
    pas de mécanisme d''horloge qui produirait 42,6 % d''inversions dans un bras et 0,90 % dans l''autre.
    Un artefact d''horodatage frappe les deux bras. Ce qui frappe un seul bras, c''est une différence
    de conception — ici, l''écriture tardive de la ligne d''affectation. Les 4 812 comptes ont simplement
    agi avant d''être enrôlés. C''est exactement ce qu''on attend d''une affectation posée à l''étape
    3. La qualification « artefact connu » est réfutée par les données du dossier, pas par une opinion.


    ### 2. Pourquoi 41 % est un recul, pas une concession


    Retirer les 4 812 lignes revient à filtrer sur une variable postérieure au traitement, corrélée au
    résultat. On ne corrige pas une sélection en ajoutant une deuxième sélection. Les 6 488 comptes restants
    sont désormais doublement filtrés (ont atteint l''étape 3 **et** n''ont pas agi avant l''enrôlement)
    ; le biais résiduel n''a même plus de signe déterminable.


    Surtout : la chute de 47 % à 41 % en supprimant 43 % de l''échantillon ne démontre pas la robustesse
    du résultat. Elle démontre que la mesure bouge de six points selon un choix de filtrage arbitraire
    — c''est un indicateur de fragilité présenté comme un gage de solidité. Mettre 41 % sur la diapositive,
    c''est publier un chiffre au dénominateur inconnu en ayant l''air d''avoir traité le problème. Devant
    un investisseur qui refait le calcul, c''est la position la plus difficile à défendre des trois.


    ### 3. L''ampleur du trou, chiffrée


    Les 5 311 comptes activés du bras v2 sont probablement bien comptés. C''est le dénominateur qui manque.
    Si *a* désigne le taux d''abandon avant l''étape 3 (non journalisé), l''activation v2 réelle vaut
    47 % × (1 − *a*) :


    | Abandon avant étape 3 | Activation v2 réelle | vs témoin (31 %) |

    |---|---|---|

    | 0 % | 47,0 % | +16 pts |

    | 20 % | 37,6 % | +6,6 pts |

    | **34 %** | **31,0 %** | **effet nul** |

    | 40 % | 28,2 % | **−2,8 pts** |

    | 50 % | 23,5 % | −7,5 pts |


    *(Hypothèse : les abandons pré-étape 3 activent à ~0 % à 30 jours. Si une partie revient plus tard,
    les valeurs remontent un peu — cela ne change pas la lecture.)*


    Une nouvelle étape d''onboarding qui perd 20 à 50 % des comptes est parfaitement ordinaire. **Le seuil
    d''annulation totale de l''effet — 34 % — est en plein milieu du domaine plausible.** Nous ne savons
    donc pas si l''effet est de +16 points, nul, ou négatif. Ce n''est pas une incertitude sur la précision
    : c''est une incertitude sur le signe.


    ### 4. Ce que contient la diapositive


    Retirer la comparaison d''activation. Texte proposé, littéral :


    > **Onboarding v2 — résultats mesurés (3 mars – 14 avril)**

    > - **Tickets de support : −22 %** — mesuré indépendamment sur la file Zendesk, hors instrumentation
    du test

    > - **Rétention à 90 jours : stable**

    > - **Activation à 30 jours : re-mesure en cours.** Un défaut d''instrumentation identifié en interne
    rend l''échantillon initial non comparable au témoin. Lecture propre attendue le [date]. Aucun chiffre
    d''activation n''est présenté ici.


    Pas de 47 %. Pas de 41 %. Pas de 47 % avec astérisque. Une réserve dans les notes de l''orateur ne
    corrige pas un chiffre affiché : le comité retient la diapositive, pas le commentaire — et le term
    sheet référence la courbe, pas les notes.


    Vérifier avant mardi que le −22 % est **par compte** et non en volume absolu. Si le volume de tickets
    a baissé parce que le volume d''inscriptions a baissé, ce chiffre a son propre problème de dénominateur
    et doit tomber aussi.


    ### 5. Ce qu''on dit au comité


    « Nous avons trouvé un défaut d''instrumentation dans notre propre test d''onboarding en préparant
    l''annexe. L''affectation du bras v2 était écrite à l''étape 3 du parcours, pas à l''inscription —
    le bras v2 ne contient donc que les comptes ayant déjà survécu à l''onboarding, et le témoin les contient
    tous. Les deux taux ne sont pas comparables et nous retirons le chiffre. Ce qui tient : −22 % de tickets,
    mesuré hors de cette chaîne, et une rétention stable. L''instrumentation est corrigée, la re-mesure
    lit le [date]. »


    Cadrage court et net. Un dossier qui signale son propre défaut avant la due diligence se lit comme
    une équipe rigoureuse ; le même défaut trouvé par l''analyste du lead se lit comme autre chose, et
    la requête qui l''exhibe tient en une ligne de SQL — n''importe quel analyste comparant `first_action_at`
    et `bucket_assigned_at` la trouve en dix minutes.


    ### 6. Le meilleur argument contre ma position


    Il est sérieux : **le −22 % de tickets suggère que v2 améliore réellement l''expérience.** On n''obtient
    pas ça par hasard. Retirer le chiffre coûte de l''argent réel, maintenant, pour un défaut réparable
    en une semaine.


    Réponse : cet argument soutient « v2 aide », pas « l''activation est à 47 % ». Ce sont deux affirmations
    distinctes, et une seule figure dans le term sheet. Le −22 % survit précisément parce qu''il est mesuré
    ailleurs — c''est ce qui rend la diapositive honnête encore solide. Sur l''asymétrie, enfin : un retrait
    avant signature rouvre la négociation sur la valorisation — coût borné, connu, récupérable. Un chiffre
    erroné dans les matériaux d''un tour signé devient une déclaration inexacte dans un document de financement
    — coût non borné, et non récupérable. Sous irréversibilité, on prend la branche bornée. C''est la
    logique qui prime, pas la préférence.


    ### 7. Récupérer le dénominateur (48–72 h, faisable avant mardi)


    1. **Nombre total de créations de comptes sur la période**, depuis la table comptes — indépendant
    de la plomberie du test. À comparer aux 22 240 (11 300 + 10 940). L''écart est un plancher pour l''exposition
    v2 non journalisée. **Ce seul nombre tranche la question.**

    2. **Journaux du feature flag / routeur.** Si l''affectation est déterministe (hash de `account_id`),
    l''exposition v2 se reconstruit hors ligne sur toute la fenêtre.

    3. Recalculer l''activation en intention de traiter sur le dénominateur reconstruit.

    4. Corriger : écriture de l''affectation à l''inscription pour les deux bras, re-run de 2–3 semaines.


    **Condition d''arrêt de mon propre raisonnement :** si le point 1 montre un total d''inscriptions
    proche de 22 240 — c''est-à-dire une attrition pré-étape 3 quasi nulle — alors le dénominateur est
    intact et le 47 % tient largement. Je change d''avis sur cette seule preuve. Mais un entonnoir d''onboarding
    qui ne perd personne avant sa troisième étape n''existe pas, et je ne m''attends pas à ce résultat.


    ### 8. Qui décide


    Ce n''est pas un arbitrage produit. C''est une décision de communication dans un financement dont
    le term sheet cite la métrique concernée : elle appartient au DG, à la directrice financière et au
    conseil juridique. Faire relire la référence du term sheet par le conseil avant mardi. Et transmettre
    cette note par écrit quelle qu''en soit l''issue.


    ---


    *Le catalogue de stations de mesure joint en annexe ne comporte aucun élément touchant à cette décision.*

    '
