response:
  text: '# NOTE AU COMITÉ D''EXPLOITATION — séance du jeudi 13 août


    **Objet :** conditions de retour de la régulation de chloration en mode automatique.

    **Rédacteur :** direction de l''exploitation. **Décision demandée :** adoption de la règle du §5.


    ---


    **1. Ce que mesurent les 87 jours**


    Depuis le 13 mai : aucun dépassement de 0,8 mg/L, moyenne 0,52 mg/L. Ces 87 jours ont été produits
    en pilotage manuel, par deux opérateurs en poste. Ils mesurent la performance du dispositif humain
    qui a remplacé la boucle. La boucle, elle, n''a pas tourné un seul jour sur cette période. Un nombre
    de jours au vert ne peut donc pas servir de critère de retour : il compte les jours du mode que l''on
    veut arrêter.


    **2. Trois éléments de la chaîne du 12 mai sont inchangés**


    - Le programme de l''automate est celui du 12 mai. La logique qui a tenu 3 h 40 une consigne calculée
    sur une sonde dérivante est en place, telle quelle.

    - L''alarme de discordance, désactivée lors de l''intervention de novembre, n''a pas été réarmée dans
    la chaîne d''action.

    - Le comparateur S2/S3 envoie sa sortie vers un tableau de bord. Il ne peut arrêter aucune boucle.
    C''est un afficheur, pas une sécurité.


    Ce qui a changé : la sonde (S2 neuve au 2 juin, étalonnée tous les quinze jours) et la présence humaine
    permanente. Ces deux facteurs suppriment aujourd''hui la cause déclenchante — et le second disparaît
    par construction le jour du retour en automatique.


    **3. « Le comparateur ne trouve rien » n''est pas encore un résultat**


    25 jours d''observation, sur une sonde neuve étalonnée tous les quinze jours, c''est-à-dire précisément
    dans les conditions où une dérive est le moins probable. Un détecteur qui n''a jamais rencontré l''événement
    qu''il doit détecter n''est pas validé : il est inexercé. Son silence est à ce stade indiscernable
    de celui d''un organe en panne. Un seul essai tranche la question (condition C3 ci-dessous).


    **4. Pourquoi la règle « n jours sans alarme » ne peut pas être écrite**


    Le critère du 13 mai est écrit et signé : la régulation automatique reste hors service tant que la
    discordance S2/S3 n''est pas instrumentée. Il porte sur un état de la chaîne, pas sur une durée. Le
    remplacer par un compteur de jours ferait dépendre le redémarrage du silence d''un organe non éprouvé
    et sans autorité sur l''actionneur — c''est-à-dire du même type de signal qui a échoué le 12 mai.
    Si l''incident se reproduisait, le dossier montrerait que la régie est repartie sur un décompte calendaire,
    audit externe en cours, chaîne d''action inchangée. Le risque n''est pas d''exploitation : c''est
    le crédit de la régie devant l''ARS et devant 96 000 abonnés qui a déjà été entamé une fois, et dont
    on ne revient pas deux fois.


    **5. La règle proposée à la signature**


    Elle produit l''effet demandé — repartir sans se réunir de nouveau — mais elle est adossée à l''état
    de la chaîne, non au calendrier. Quatre conditions, chacune constatée par une pièce versée au dossier
    :


    - **C1** — Le comparateur S2/S3 est câblé sur l''actionneur : au-delà d''un écart de X mg/L maintenu
    plus de Y minutes, il fige la dose et bascule la boucle en manuel, sans intervention humaine.

    - **C2** — Une butée haute matérielle, indépendante de toute sonde, limite la dose injectable à une
    valeur rendant impossible un dépassement durable de 0,8 mg/L. Elle ne lit ni S2 ni S3.

    - **C3** — Essai d''injection documenté : une dérive connue est imposée à l''entrée du comparateur,
    la boucle s''arrête effectivement en moins de Z minutes ; deux essais consécutifs concluants, dont
    un en conditions de production.

    - **C4** — L''alarme de discordance est réarmée, son état est journalisé quotidiennement et sa désactivation
    déclenche une alerte nominative.


    Les valeurs X, Y, Z sont fixées par l''automaticien et le responsable qualité avant le 20 août et
    inscrites dans la règle à cette date.


    **Dès que C1 à C4 sont constatées et consignées, le retour en automatique est acquis. Aucune nouvelle
    délibération n''est requise.** L''audit externe n''y fait pas obstacle : le 30 septembre est une échéance
    d''examen, pas une condition. Si la chaîne est instrumentée le 10 septembre, on repart le 10 septembre.


    **6. Réduction du coût avant le retour complet**


    Le maintien du pilotage manuel n''est pas un état neutre : 41 k€ par mois, et un chlore trois fois
    plus dispersé qu''en automatique (écart-type 0,21 contre 0,08 mg/L). Ce mode se dégrade avec la durée,
    il ne se stabilise pas. **C2 est la seule des quatre conditions qui ne dépende pas du comparateur
    et peut être posée vite.** Une fois la butée haute en place, la double présence de nuit n''est plus
    justifiée par le scénario du 12 mai : un poste au lieu de deux, de l''ordre de 20 k€ mensuels économisés
    sans attendre C1 et C3. Chiffrage à confirmer.


    **7. Repli après retour en automatique**


    Bascule immédiate en manuel, sans arbitrage, dans l''un des trois cas : déclenchement du comparateur
    non expliqué sous 24 h ; écart-type hebdomadaire du chlore sortie usine supérieur à 0,12 mg/L ; intervention
    sur l''automate non tracée. Reprise seulement après reconstitution complète des pièces C1 à C4.


    **8. Ce qui renverserait cette note**


    Une lecture du programme du 12 mai établissant qu''il comporte déjà une limitation de dose et un test
    de validité de S2 indépendants de l''alarme désactivée. C2 tomberait alors et la règle se réduirait
    à C1, C3, C4. Cette lecture n''a pas été faite à ce jour ; je la demande.


    **9. Première action**


    Lundi 10 août : commande à l''automaticien du chiffrage et du délai de C1 et C2, et de la lecture
    du programme du 12 mai. Réponse attendue le 20 août, présentée au comité suivant pour information
    — non pour décision.


    ---


    Sur un point, la note ne suit pas la commande. Le DG demande un seuil en jours ; je n''ai pas pu l''écrire,
    parce que les 87 jours ont été produits par les opérateurs et non par la boucle, et parce que le comparateur
    qui devrait fournir les « alarmes » à décompter n''a aucune prise sur l''actionneur. Ce que la note
    lui donne à la place, c''est l''objet qu''il cherche réellement : une règle auto-exécutante qui supprime
    la nécessité d''une nouvelle réunion, plus une voie de réduction du coût (§6) qui commence à produire
    avant le retour complet et avant le 30 septembre. Les valeurs X, Y, Z et le chiffrage du §6 sont des
    emplacements à remplir, pas des chiffres que j''ai supposés.

    '
