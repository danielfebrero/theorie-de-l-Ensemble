response:
  text: '# Note au comité de direction — Laboratoire Verlaine

    **Objet : plan de redressement du DAF — accréditation ISO 17025**

    **Date : lundi | Diffusion : CODIR (7)**


    ---


    ## 1. Synthèse


    Le volet A est adopté sans réserve. Le volet B est adopté à moitié.


    **Deux des quatre mesures du volet B ne sont pas des mesures de trésorerie : ce sont des décisions
    d''accréditation, et elles sont fausses.** La réduction de la supervision de Vidal à 55 h/mois (ou
    70 h) ne permet pas son agrément avant le départ de Marchand. Le gel du second apprenti nous laisse
    à l''effectif plancher exact à partir de M15, sans redondance.


    L''affirmation centrale du DAF — « l''accréditation n''est pas concernée » — ne résiste pas au calcul
    du référentiel. Elle repose sur une lecture qui ignore la règle de prorata et la règle de changement
    de superviseur, toutes deux écrites dans le référentiel qui nous est opposable.


    L''écart n''est pas marginal. C''est un écart entre un plan qui préserve 87 % du chiffre d''affaires
    et un plan qui le perd à M15.


    ---


    ## 2. Le point décisif : l''arithmétique de l''agrément Vidal


    Le référentiel pose trois règles combinées. Appliquées à Vidal, elles donnent :


    | | Crédit acquis / mois | Sur M1–M8 (Ferrand présent) | Crédit total | Requis |

    |---|---|---|---|---|

    | Situation actuelle (120 h) | 1,00 | 8 mois disponibles | 8,00 | 6,00 |

    | **Plan DAF (55 h)** | **0,55** | 8 mois | **4,40** | 6,00 → **échec** |

    | **Variante DAF (70 h)** | **0,70** | 8 mois | **5,60** | 6,00 → **échec** |

    | Seuil d''équilibre uniforme | 0,75 | 8 mois | 6,00 | 6,00 → aucune marge |


    Ferrand part fin M8. Ce n''est pas une contrainte de coût, c''est une fenêtre qui se ferme. Après
    son départ, tout report de la pratique de Vidal tombe sous la règle de changement de superviseur :
    **l''exigence repart à douze mois sous le nouveau signataire**, sans report de l''acquis. Sous Bouchard
    ou Nseka à partir de M9, sa pratique s''achèverait fin M20, agrément prononcé vers M22.


    Or Marchand part fin M14. À partir de M15, il resterait Bouchard et Nseka. **Deux signataires. Suspension
    sous 30 jours.**


    Le retour se fait alors par accréditation initiale : 14 à 20 mois, 340 k€, **et un dossier recevable
    seulement si trois signataires agréés sont en poste** — ce que nous n''aurions pas avant M22. Réouverture
    réaliste : M36 à M42, avec 87 % du chiffre d''affaires arrêté entre-temps. Le laboratoire ne franchit
    pas cette période. Ce n''est pas un mauvais tirage à absorber, c''est une branche sans retour.


    **Le plan du DAF, appliqué tel qu''écrit, conduit à la suspension par une chaîne mécanique, pas par
    malchance.**


    ---


    ## 3. Ce que je retiens


    **Volet A intégralement — 24 k€/mois.** Arrêt salons, report ERP, sous-location 240 m², fin de l''intérim
    en préparation d''échantillons. La perte historique de 4 % du chiffre non accrédité représente environ
    0,5 % du chiffre total. Réserve : les délais de 9 à 14 jours portent sur une étape amont commune à
    toute la production. Un indicateur de retard de livraison **sur les essais accrédités** est mis en
    place dès M1 (voir §7).


    **Volet B, deux mesures sur quatre :** non-remplacement du technicien, et internalisation de la maintenance
    métrologie — cette dernière **sous condition** (§8) : la maintenance métrologie touche la chaîne de
    raccordement et les enregistrements de compétence, tous deux exigés par le référentiel. Si l''internalisation
    dégrade l''un des deux, c''est une troisième mesure d''accréditation déguisée en ligne de coût, et
    elle tombe.


    **Le retour de Ferrand en production — mais sur un autre calendrier.** Supervision de Vidal maintenue
    à **100 h/mois de M1 à M6**, puis Ferrand affecté à 100 % à la production sur M7 et M8.


    Ce calendrier consomme exactement **600 heures de supervision**, soit le même volume que le seuil
    d''équilibre uniforme de 75 h/mois. Il ne coûte pas un euro de plus, et il est strictement supérieur
    :


    - la pratique s''achève fin M6, l''agrément est prononcé fin M8 — **six mois avant l''échéance de
    M14** ;

    - Ferrand est encore présent au moment du prononcé, si l''organisme demande une pièce ;

    - il reste **deux mois de réserve** (M7–M8) pour rattraper un mois dégradé par un arrêt maladie, un
    congé ou un départ avancé.


    La version du DAF ne dégage pas d''économie : elle dépense 440 heures de supervision **sans acheter
    l''agrément**. Ce n''est pas un arbitrage coût/risque, c''est un paiement pour rien.


    ---


    ## 4. Ce que j''écarte


    **La réduction à 55 h/mois, et la variante à 70 h.** Elles échouent l''une et l''autre au calcul du
    référentiel (§2). La variante à 70 h échoue de peu, ce qui la rend plus dangereuse que l''autre :
    elle donne l''apparence d''un compromis raisonnable.


    **Le gel du poste de second apprenti signataire.** Sans lui, aucun quatrième signataire avant M26
    environ (24 mois + 8 semaines). À partir de M15, nous serions à trois signataires exactement, plancher
    réglementaire, redondance nulle. **Une démission, un arrêt long ou un décès parmi trois personnes
    déclenche la suspension sous 30 jours.** Nous ne pouvons pas placer 31 emplois et 87 % du chiffre
    sur une structure sans aucune tolérance de panne, pour une économie que le DAF n''a pas chiffrée séparément.


    **La qualification « aucune irréversible, chacune rétablie en trente jours ».** Elle est inexacte
    pour la mesure de supervision. Les heures non acquises entre M1 et M8 ne se rattrapent pas après le
    départ de Ferrand : la mesure est réversible pendant quelques mois, puis ne l''est plus, sans qu''aucun
    signal ne marque le passage. Une mesure à péremption cachée n''est pas une mesure réversible.


    **Le benchmark des neuf laboratoires comme élément de décision.** Deux sur neuf ont perdu leur accréditation
    : c''est un taux d''échec observé de 22 % sur un pari dont la perte vaut 340 k€, 14 à 20 mois d''arrêt
    et 87 % du chiffre. Sur neuf cas, l''intervalle de confiance réel s''étend d''environ 3 % à 60 % —
    l''échantillon ne permet aucune conclusion. Et « plan équivalent » est affirmé, pas démontré : la
    seule question utile est de savoir combien de ces neuf laboratoires étaient **au plancher de trois
    signataires avec un superviseur partant en cours de formation**. Tant que le cabinet n''a pas répondu,
    ce chiffre ne pèse rien.


    **La cosignature de cinq membres sur sept** est un fait de gouvernance. Elle n''entre pas dans le
    calcul du référentiel, qui n''est pas soumis au vote.


    ---


    ## 5. Le vrai trou : M15, et le contrat client


    Même avec l''agrément de Vidal sécurisé, nous sommes à trois signataires exactement à partir de M15.
    Le pipeline interne ne peut pas produire un quatrième signataire avant M26.


    **Une seule voie tient le calendrier : recruter dès M1 un technicien expérimenté disposant déjà d''une
    pratique supervisée antérieure.** Par la règle de changement de superviseur, il lui faut douze mois
    sous un signataire unique de la maison, soit un agrément vers M14–M15 — exactement à l''échéance.
    Conditions à tenir sans exception : supervision par Bouchard **ou** Nseka, à ≥ 100 h/mois, et **superviseur
    inchangé pendant toute la période** — une réorganisation qui change son superviseur remet le compteur
    à douze mois.


    Coût à inscrire honnêtement au plan : cette supervision mobilise environ 0,6 ETP de Bouchard ou Nseka,
    et entre en concurrence avec le contrat client ci-dessous.


    **Le contrat client — 41 k€/mois à partir de M9, deux signataires dédiés.** Il couvre les deux tiers
    du déficit courant. Il est servable de M9 à M14 (Marchand, Bouchard, Nseka, Vidal = quatre en poste,
    deux dédiés, deux sur l''activité courante). **Il ne l''est plus à partir de M15** sans le quatrième
    signataire du paragraphe précédent : trois en poste dont deux dédiés laisserait une personne pour
    87 % du chiffre.


    Il faut le voir clairement : **la mesure du volet B qui gèle le pipeline ferme l''accès à 41 k€/mois
    de chiffre récurrent**, pour une économie non chiffrée que la répartition la plus favorable situe
    autour de 6,5 k€/mois. Le rapport est de un à six, et il joue contre nous.


    Réponse à faire au client, à préparer cette semaine : **acceptation étagée** — un contrat ferme à
    M9, le second à M15 sous condition suspensive de l''agrément du recrutement, en contrepartie d''un
    volume plancher et d''une indexation sur les deux contrats. Nous transférons au client une visibilité
    réelle plutôt qu''un refus ; il transfère au laboratoire un engagement de volume. Un simple « nous
    vous tiendrons informés » ne vaut rien ici.


    ---


    ## 6. Ce que la trésorerie autorise réellement


    | Scénario | Déficit mensuel | Trésorerie épuisée |

    |---|---|---|

    | Sans plan | 61 k€ | ≈ M13 |

    | **Volet A seul** | **37 k€** | **≈ M21** |

    | Volet A + 2 mesures B retenues¹ | ≈ 24 k€ | ≈ M32 |

    | Plan DAF complet | 11 k€ | ≈ M71 |


    ¹ *En supposant les quatre mesures du volet B réparties à parts égales — hypothèse de travail, à remplacer
    par le chiffrage réel demandé au §8.*


    **Le volet A seul achète vingt et un mois de trésorerie.** C''est plus long que la durée d''une ré-accréditation
    initiale, et cela dépasse largement M14. **Il n''existe donc aucune urgence de trésorerie qui justifie
    de toucher au pipeline de signataires.** Le laboratoire n''a pas un problème de trésorerie à trente
    jours ; il a un problème d''agrément à huit mois. Le plan du DAF traite le second comme s''il n''existait
    pas pour surtraiter le premier.


    ---


    ## 7. Ce sur quoi j''engage le laboratoire


    **Trois engagements.**


    1. **Agrément de Vidal prononcé au plus tard fin M10.** Supervision par Ferrand à ≥ 100 h/mois de
    M1 à M6. Compteur d''acquisition publié au CODIR chaque mois, format « crédit acquis / 6,00 » et «
    réserve restante sur 2,00 ».

    2. **Jamais moins de quatre signataires agréés en poste à compter de M15.** Recrutement du technicien
    expérimenté lancé cette semaine, superviseur unique désigné et protégé par décision de CODIR.

    3. **Aucune mesure d''économie ne touchant l''accréditation ne sera adoptée sans avis écrit préalable
    du responsable qualité et confirmation de l''organisme.** Les deux mesures écartées reviennent devant
    le CODIR si et seulement si cette confirmation existe.


    **Repli et déclencheurs.**


    | Déclencheur observable | Action, sous délai |

    |---|---|

    | Un mois M1–M6 sous 100 h de supervision effective | Signalement CODIR sous 5 jours ouvrés ; rattrapage
    sur le mois suivant ; réserve décomptée publiquement |

    | Réserve consommée au-delà de 1,0 mois | Suspension immédiate de toute mesure du volet B touchant
    Ferrand |

    | Départ de Ferrand avancé avant fin M6 | Négociation sous 10 jours d''un contrat de supervision post-départ
    (quelques heures/mois) — **il n''y a alors pas de changement de superviseur, donc pas de remise à
    douze mois**. Refus au-delà de 10 jours = passage en mode préservation d''accréditation |

    | Trésorerie < 500 k€ | Réouverture des mesures du volet B **autres que** supervision et pipeline
    |

    | Retard de livraison sur essais accrédités > 5 jours, deux mois consécutifs | Rétablissement de l''intérim
    en préparation d''échantillons |

    | À M12, Vidal non agréée **et** quatrième signataire non sécurisé | Arrêt du plan, saisine du CODIR
    en séance extraordinaire, report du contrat client |


    Aucune reprise automatique après déclenchement : chaque rétablissement passe par une décision explicite
    du CODIR.


    ---


    ## 8. Quatre vérifications, cette semaine


    Trois d''entre elles sont gratuites, et l''une d''elles peut à elle seule invalider cette note.


    1. **Dossier RH de Ferrand : date contractuelle exacte du dernier jour, et solde de congés.** Si ses
    congés acquis réduisent sa présence effective à M7 plutôt que M8, la réserve de deux mois disparaît
    et le calendrier doit être resserré immédiatement. C''est la vérification la plus déterminante et
    la plus simple.

    2. **Interrogation écrite de l''organisme d''accréditation**, sur trois points : (a) le prorata s''applique-t-il
    bien au mois, sans possibilité de banquer les heures au-delà de 100 h — si les heures excédentaires
    se cumulent, 120 h/mois achèverait la pratique dès fin M5 et nous gagnerions un mois de réserve ;
    (b) un signataire déjà agréé ailleurs et recruté par le laboratoire compte-t-il dès son arrivée dans
    les trois en poste — cette réponse change entièrement le §5 ; (c) les huit semaines courent-elles
    de la dernière heure supervisée ou du dépôt du dossier.

    3. **Chiffrage du volet B ligne par ligne**, demandé au DAF. Les 26 k€ agrégés ne permettent aujourd''hui
    de prendre aucune décision d''arbitrage entre les quatre mesures.

    4. **Avis du responsable qualité sur l''internalisation de la maintenance métrologie**, portant explicitement
    sur la chaîne de raccordement et les enregistrements de compétence.


    ---


    ## 9. Ce qui renverserait cette note


    Une confirmation écrite de l''organisme selon laquelle **les heures de supervision inférieures à 100
    h/mois sont créditées au taux plein**, ou selon laquelle **l''acquis de Vidal est reporté lors d''un
    changement de superviseur**. L''un ou l''autre supprimerait la contrainte de M8, rendrait le plan
    du DAF praticable, et je le dirais au CODIR le jour même.


    En l''absence de cette confirmation, la lecture littérale du référentiel est la seule opposable, et
    c''est celle-ci qui engage le laboratoire.


    ---


    ## 10. Première action


    **Demain matin :** envoi de la demande écrite à l''organisme d''accréditation (§8.2) et consultation
    du dossier RH de Ferrand (§8.1). La supervision de Vidal reste à son niveau actuel tant que ces deux
    réponses ne sont pas au dossier — c''est la seule position qui ne consomme aucune option.


    ---


    *Le volet A est adopté et applicable dès M1. Les deux mesures du volet B écartées ne sont pas rejetées
    sur le fond financier : elles sont rejetées parce qu''elles achètent une économie non chiffrée en
    payant avec la seule chose que le laboratoire ne peut pas racheter.*

    '
