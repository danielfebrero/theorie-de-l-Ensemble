response:
  text: '# NOTE DE DIRECTION — MANDAT D''EXÉCUTION EN L''ABSENCE DU DG


    **Objet :** Contrat d''exclusivité proposé par le distributeur D — décision, mandat de négociation
    et plan de conduite

    **Période couverte :** J+1 à J+21 (DG injoignable)

    **Destinataires :** membres du comité de direction

    **Statut :** exécutoire. Ce document remplace toute instruction orale antérieure.


    ---


    ## 1. Décision


    **Nous ne signons pas le contrat en l''état.** Le refus est la position par défaut : en l''absence
    d''accord de D sur les conditions du §4, aucune signature n''intervient, quelle que soit la pression
    exercée d''ici le comité d''achat de septembre.


    Cette décision n''est pas discrétionnaire. Elle repose sur un calcul que vous pouvez refaire vous-mêmes,
    et que vous devrez refaire à chaque contre-proposition de D.


    ---


    ## 2. Le calcul qui fonde la décision


    Base actuelle sur D : 14,9 M€ de CA, 31 % de marge → **4,62 M€ de marge brute**, pour 10,28 M€ de
    coûts directs.


    | Scénario | CA D | Coûts directs | Marge brute | Écart |

    |---|---|---|---|---|

    | Aujourd''hui | 14,90 M€ | 10,28 M€ | **4,62 M€** | référence |

    | An 1 signé (+18 % vol., −9 % prix) | 16,00 M€ | 12,13 M€ | **3,87 M€** | **−0,75 M€** |

    | An 2-3 signé (volume revenu à la base, remise maintenue) | 13,56 M€ | 10,28 M€ | **3,28 M€** | **−1,34
    M€/an** |


    **L''année 1 est déjà perdante, engagement de volume tenu.** À 31 % de marge, une remise de 9 % détruit
    plus de valeur que 18 % de volume n''en crée. Il faudrait **+41 % de volume** pour que l''opération
    soit seulement neutre.


    Les années 2 et 3 sont la vraie question : la remise est ferme, le volume est « indicatif ». Nous
    vendrions une baisse de prix définitive contre une promesse de volume de douze mois. Le cumul trois
    ans, dans l''hypothèse centrale, approche **−3,4 M€ de marge brute** — soit près de trois fois la
    pénalité de sortie de 1,2 M€. Un contrat dont il est moins coûteux de sortir que d''y rester est un
    contrat qu''on ne signe pas.


    Rappel enfin que D a réduit ses commandes de 11 % au T2 **sans préavis**. La signature ne nous protège
    pas de ce comportement au-delà de douze mois ; elle nous en prive seulement des recours.


    ---


    ## 3. Point rédhibitoire à vérifier en priorité (J+1, DAF + conseil)


    La clause telle que rédigée interdit « toute vente par un autre canal ». **Lue littéralement, elle
    supprime aussi nos 9,1 M€ de CA hors D** (2,82 M€ de marge). Dans cette lecture, la marge brute totale
    passerait de 7,44 à 3,87 M€ et l''entreprise ne survivrait pas au contrat.


    **Instruction :** obtenir de D, par écrit, le périmètre exact de l''exclusivité avant toute discussion
    de fond. Si D confirme une exclusivité totale sur l''ensemble de notre activité, **la négociation
    s''arrête là** : réponse négative motivée, et application directe du §6.


    ---


    ## 4. Mandat de négociation — limites impératives


    Vous êtes autorisés à négocier et, si et seulement si les cinq conditions ci-dessous sont réunies
    **simultanément**, à signer sans me consulter.


    **Conditions rédhibitoires (les cinq, cumulatives) :**


    1. **Périmètre de l''exclusivité** limité au canal GMS effectivement servi par D. Carve-out écrit
    et explicite pour : marketplace / vente en ligne directe, RHD, export, et l''ensemble de notre portefeuille
    clients existant hors D.

    2. **Volume ferme et opposable sur les trois années**, avec pénalité à la charge de D en cas de sous-réalisation.
    À défaut, durée du contrat ramenée à **12 mois** avec reconduction expresse.

    3. **Remise conforme au test de marge** du §5. La construction que nous proposons en priorité : la
    remise de 9 % s''applique **au seul volume incrémental** au-delà de la base 14,9 M€, et non à l''assiette
    totale.

    4. **Symétrie de sortie** : notre pénalité plafonnée à 0,4 M€ ; pénalité équivalente à la charge de
    D en cas de déréférencement ou de sous-commande.

    5. **Préavis écrit de 6 mois** pour tout retrait de référence pendant la durée du contrat.


    **Toute autre configuration : pas de signature.** Si D refuse un délai de réflexion et impose le choix
    entre son texte et rien, la réponse est *rien*. Aucun membre du CODIR n''a mandat pour signer en dehors
    de ces bornes, y compris en cas d''unanimité du comité.


    ---


    ## 5. Test de marge — à appliquer à toute contre-proposition


    Remise maximale acceptable selon l''engagement de volume ferme obtenu :


    | Volume ferme an 1 | Remise maximale |

    |---|---|

    | +0 % | 0 % |

    | +10 % | 2,8 % |

    | +18 % | **4,7 %** |

    | +30 % | 7,2 % |

    | +41 % | 9,0 % |


    Formule si D propose autre chose : accepter uniquement si **14,9 × v × (1 − d) − 10,28 × v ≥ 4,62**,
    où *v* est le coefficient de volume et *d* la remise. Ce test s''applique au volume **ferme et contractuel**,
    jamais au volume indicatif.


    ---


    ## 6. Calendrier d''exécution


    **J+1 à J+3 — Direction commerciale + DAF**

    Réponse écrite à D, envoyée **au plus tard J+3** — ne pas attendre le huitième jour, l''attente sera
    lue comme une capitulation en préparation. Contenu : confirmation de notre volonté de poursuivre et
    d''accroître le partenariat, contre-proposition articulée sur les cinq conditions, demande de report
    de l''examen au comité d''octobre pour permettre l''aboutissement de la négociation.


    Ton : commercial et constructif. Aucune mention de contentieux dans ce courrier.


    **J+1 — Conseil juridique (mandat direct)**

    Constituer le dossier de relation commerciale établie : historique des flux sur cinq ans, part de
    CA, correspondances, documentation de la réduction de 11 % du T2 intervenue sans préavis. Faire chiffrer
    le préavis raisonnable exigible au titre de l''article L.442-1 II du code de commerce compte tenu
    de l''ancienneté et du taux de dépendance de 62 %. **Ce dossier ne sort pas.** Il est notre couverture
    si D exécute sa menace, pas un argument de négociation à ce stade.


    **J+1 à J+15 — DAF, priorité absolue**

    Sécuriser **1,5 M€ de lignes confirmées** : affacturage sur le poste client D (créances de première
    qualité), découvert autorisé, mobilisation Dailly. Trois mois de trésorerie sont notre véritable point
    de faiblesse — c''est ce qui rend la menace de D efficace. Ce chantier prime sur tout le reste.


    Vérifier également l''écart entre nos charges fixes annuelles telles qu''implicites dans le ratio
    « 2,1 M€ = 3 mois » (~8,4 M€) et notre marge brute (7,44 M€). Si cet écart se confirme, la structure
    ne peut supporter **aucune** remise, et le refus devient inconditionnel. Me transmettre le point par
    écrit pour mon retour.


    **J+1 à J+21 — Direction commerciale**

    *Centrale régionale :* accélérer. Proposer un pilote sur deux références avec démarrage immédiat et
    demander une lettre d''intention non engageante sous cinq semaines. Objectif : disposer d''un signal
    écrit avant le comité de septembre.

    *Marketplace :* lancer sans attendre, sur 2 à 3 références non vendues à D, pour éviter le conflit
    de canal. Investissement plafonné à **60 k€** sans mon accord. À +6 points de marge, même la borne
    basse de 0,4 M€ est créatrice de valeur et démontre l''existence d''une alternative.


    **J+1 à J+10 — Direction industrielle + DRH**

    Préparer le dossier d''activité partielle du site de Redon : instruction complète, chiffrage, éléments
    DREETS. **Ne pas déposer.** Faire valider par le conseil le calendrier d''information-consultation
    du CSE afin qu''aucun délai ne nous soit opposable le jour où le recours devient nécessaire.


    Déclencheur, seul autorisé en mon absence : plan de charge constaté **sous 72 % sur trois semaines
    consécutives** avec carnet à quatre semaines confirmant la tendance. En dessous de ce seuil, déposer
    sans attendre mon retour. Au-dessus, ne rien déclencher.


    ---


    ## 7. Si D exécute sa menace


    Hypothèse haute : perte de 4 références sur 8, soit environ 7,45 M€ de CA et 2,31 M€ de marge, plan
    de charge ramené à ~69 %.


    C''est un choc sévère et je ne le minimise pas. Il reste préférable à la signature pour trois raisons
    : il est **partiel** (nous conservons quatre références et 9,1 M€ hors D), il est **contestable**
    juridiquement (§6, volet préavis), et il est **réversible** — un déréférencement se regagne, une exclusivité
    de trois ans ne se dénoue qu''en payant.


    Conduite en cas de déréférencement effectif :

    1. Mise en demeure sous 48 h, préavis de 12 mois réclamé — le conseil dispose déjà du dossier.

    2. Aucune contre-offre tarifaire dans les 30 jours. Céder sous le coup de la sanction fixe notre prix
    pour dix ans.

    3. Bascule immédiate des capacités libérées vers la centrale et la marketplace ; relance des trois
    prospects du pipeline mis en veille au S1.

    4. Activité partielle selon le seuil du §6.


    ---


    ## 8. Gouvernance pendant mon absence


    Cellule de décision : **DAF (président), Directeur commercial, Directeur industriel.** En cas de partage,
    la voix du DAF est prépondérante.


    Règle unique et sans exception : **toute décision non expressément couverte par cette note est reportée
    à mon retour.** Si le report est impossible, l''option retenue est celle qui préserve la réversibilité.
    On ne signe jamais un engagement pluriannuel pour éviter un inconfort de trois semaines.


    Compte rendu écrit hebdomadaire déposé sur l''espace partagé, y compris si rien ne bouge. Je le lirai
    à mon retour ; il vaudra justification des décisions prises.


    Communication interne : aucune, hors CODIR et hors obligations légales à l''égard du CSE. Une fuite
    parviendra à D en quarante-huit heures et affaiblira notre position.


    ---


    ## 9. La seule condition qui renverse cette décision


    Si D produit, par écrit et avant expiration du délai, **un engagement de volume ferme et sanctionné
    sur les trois années**, avec une remise respectant le tableau du §5 et les carve-outs du §4, alors
    le contrat devient créateur de valeur et vous signez.


    C''est bien là le point : nous ne refusons pas l''exclusivité par principe. Nous refusons de payer
    une remise définitive contre une promesse de douze mois.


    ---


    *Signé — le Directeur général. Note remise au CODIR le [date], applicable jusqu''à mon retour le [date].*

    '
