response:
  text: '## Note au conseil — arbitrage Sedamex / Nordwerk


    **De :** la direction générale · **Pour :** conseil du vendredi · **Objet :** recommandation sur les
    18 prochains mois


    ---


    ### Recommandation


    **Option B — ligne Nordwerk**, sous trois conditions suspensives à lever avant signature (détaillées
    plus bas). Si l''une des trois n''est pas levée, je bascule sur Sedamex sans autre débat.


    ### Ce sur quoi je fonde ce choix


    **1. L''écart d''espérance est net.** Sedamex : +200 k€ certains. Nordwerk : 0,6 × 900 − 0,4 × 400
    = **+380 k€**, soit +180 k€ (+90 %). Le point de bascule est à **46,2 % de probabilité de succès**
    : Nordwerk reste supérieure tant que le bureau d''études ne se trompe pas de plus de 14 points.


    **2. La branche défavorable ne met en cause ni le covenant, ni la continuité.** Pire cas 18 mois,
    dividende inclus :


    | | Fonds propres | Trésorerie |

    |---|---|---|

    | Départ | 3 400 k€ | 2 600 k€ |

    | − dividende voté (700) | 2 700 | 1 900 |

    | − échec Nordwerk (400) | **2 300 k€** | **1 500 k€** |


    Covenant à 1 200 k€ : **marge de 1 100 k€** au test trimestriel le plus tendu. Trésorerie résiduelle
    : **9 mois de masse salariale**. Pour que le covenant soit touché, il faudrait qu''en plus de l''échec
    et du dividende, le plan de base décroche de plus de 1,1 M€ non budgété sur 18 mois. Ce n''est pas
    le scénario que nous discutons.


    **3. L''exposition est bornée par contrat, pas par espérance.** Plafond ferme à 400 k€ pénalité comprise,
    **sans caution personnelle, sans défaut croisé, sans sûreté sur l''outil industriel, carnet de commandes
    non gagé**. La perte maximale est connue à la signature.


    ### Réponse au directeur financier


    Son objection est la bonne question, posée sur le mauvais contrat.


    « Jouer la maison » désigne une exposition non plafonnée, adossée à des garanties, dont la branche
    défavorable détruit l''entreprise. Ici, la branche défavorable laisse 2,3 M€ de fonds propres, 1,5
    M€ de trésorerie, zéro dette nette et aucun actif saisi. C''est de la **variance encaissable**, pas
    un risque de ruine — et refuser 180 k€ d''espérance pour éviter une variance encaissable, ce n''est
    pas de la prudence, c''est un coût.


    Sur Tremay : un cas unique n''est pas un taux de base, et la seule question qui rend Tremay pertinent
    est celle-ci — **leur exposition était-elle plafonnée ?** Si elle était financée par dette avec sûretés,
    leur échec n''instruit pas notre décision, il instruit la structure de leur contrat. Nous avons précisément
    acheté l''inverse.


    En revanche, je retiens son objection sur un point que je fais mien : **le 60 % est notre propre estimation,
    sur 11 observations.** Sur 11 cas, l''incertitude statistique est d''environ 15 points — c''est-à-dire
    exactement la marge qui nous sépare du point de bascule. C''est le vrai sujet, et il est achetable.


    ### Les trois conditions suspensives


    1. **Vérification externe des 11 installations** — contact direct des exploitants, résultat réel constaté.
    Si moins de 6 sur 11 confirment un succès net, ou si 2 ou plus signalent un litige sur la qualification
    de l''échec : **on signe Sedamex**.

    2. **Audit juridique du plafond de 400 k€** — qui déclare l''échec technique, selon quels critères,
    et que reste-t-il hors plafond (frais de procédure, remise en état). Si le plafond n''est pas étanche,
    l''arbitrage change de nature et Sedamex l''emporte (à 700 k€ d''exposition réelle, le seuil de bascule
    monte à 56 %, marge trop mince).

    3. **Sécurisation de la relation Sedamex** — droit de première offre à 18 mois. Nous perdons le contrat,
    nous ne devons pas perdre le client.


    ### Repli, déclencheur et suivi


    Le contrat n''a pas de clause de sortie, mais nous gardons la main sur la dépense. **Jalon technique
    contradictoire au 6ᵉ mois** : s''il n''est pas atteint, nous constatons l''échec immédiatement pour
    cristalliser le plafond au lieu de laisser courir des coûts hors plafond jusqu''au 12ᵉ mois. **Seuil
    d''alerte covenant à 1 800 k€ de fonds propres** à toute clôture trimestrielle : gel des dépenses
    discrétionnaires et information de la banque avant qu''elle ne la demande. Le suivi du jalon et du
    seuil est confié au directeur financier — son objection devient le dispositif de contrôle.


    ### Première action


    Lancer dès lundi la vérification des 11 installations et l''audit du plafond. Décision de signature
    au retour de ces deux éléments, au plus tard avant l''échéance de reconduction Sedamex — **dont je
    demande au conseil de confirmer la date en séance**, car elle conditionne tout le calendrier.


    ---


    *Hypothèses : plan de base à l''équilibre hors mouvements décrits ; dividende de 700 k€ non révisable
    et déduit dans tous les scénarios ; charges d''échec supposées intégralement couvertes par le plafond
    contractuel — c''est la condition 2 qui le vérifie.*


    Deux points que je n''ai pas pu trancher faute de données et que j''ai transformés en questions au
    conseil plutôt qu''en suppositions : la date limite de reconduction Sedamex, et le sort de la relation
    Sedamex au-delà des 18 mois. Si vous me donnez ces éléments, je resserre le calendrier et la condition
    3.

    '
