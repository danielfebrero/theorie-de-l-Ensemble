response:
  text: '# NOTE AU COMITÉ DE DIRECTION


    **Objet :** Plan de redressement DAF — position sur les douze mesures

    **Date :** lundi — pour décision

    **Diffusion :** membres du comité


    ---


    ## 1. Position en une ligne


    Je retiens le volet A intégralement et trois des quatre mesures du volet B. **J''écarte la réduction
    de la supervision de Salomé Vidal (55 h/mois comme 70 h/mois) : elle est arithmétiquement incompatible
    avec son agrément, et son effet n''est pas réversible.** J''engage le laboratoire sur le recrutement
    immédiat d''un signataire agréé externe, seul levier qui traite l''échéance M14 et conditionne les
    41 k€/mois de contrats-cadres.


    ---


    ## 2. Le point qui invalide le volet B tel qu''écrit


    Vidal a 18 mois-équivalents acquis sous Ferrand, il lui en reste 6. Ferrand part **fin M8** : il ne
    reste que 8 mois de supervision possible sous ce superviseur. Au-delà, tout changement de superviseur
    **ramène l''exigence à douze mois sous le nouveau**, ce qui annule les 18 mois acquis.


    | Supervision | Crédit / mois | Crédit sur 8 mois | 24 mois atteints ? | Agrément |

    |---|---|---|---|---|

    | 120 h (actuel) | 1,00 | 8,0 | Oui, fin **M6** | fin M8 |

    | 100 h (plancher) | 1,00 | 8,0 | Oui, fin **M6** | fin M8 |

    | 75 h (minimum théorique) | 0,75 | 6,0 | Oui, fin M8 — marge nulle | fin M10 |

    | **70 h (variante DAF)** | 0,70 | 5,6 | **Non — 23,6 / 24** | jamais |

    | **55 h (volet B)** | 0,55 | 4,4 | **Non — 22,4 / 24** | jamais |


    La variante à 70 h/mois échoue de **0,4 mois-équivalent**, soit une douzaine de jours de pratique.
    Elle n''est pas une atténuation : elle produit exactement le même résultat que 55 h.


    **Enchaînement en cas d''adoption :** Vidal non agréée → M14, départ Marchand → 2 signataires en poste
    → suspension sous 30 jours (~M15) → 87 % du chiffre d''affaires tombe. Le retour exige une accréditation
    initiale (340 k€, 14 à 20 mois), dont le dossier n''est recevable qu''avec trois agréés en poste —
    que nous n''aurions pas avant l''agrément de Vidal sous un nouveau superviseur, soit ~M22. Accréditation
    rétablie **M36 à M42**, sans trésorerie pour y parvenir.


    **Sur la réversibilité.** La mesure est réversible ; son effet ne l''est pas. On peut rétablir les
    heures de Ferrand en trente jours tant que Ferrand est là. Après M8, le superviseur n''existe plus,
    et la règle de remise à zéro détruit 18 mois acquis. Le manquement ne devient d''ailleurs visible
    qu''à M8, bien après la fenêtre de rétablissement. C''est le seul point du plan où la formule « aucune
    irréversible » ne tient pas.


    ---


    ## 3. Ce que je retiens


    **Volet A, 24 k€/mois — intégralement.** Aucune de ces mesures ne touche la chaîne d''agrément. La
    perte historique de 4 % du chiffre non accrédité représente ~0,5 % du chiffre total : acceptable.
    *Réserve à lever avant application :* confirmer que la file de préparation d''échantillons est séparée
    entre travaux accrédités et non accrédités. Si elle est commune, les délais de 9 à 14 jours exposent
    87 % du chiffre et non 13 % — dans ce cas, l''intérim est maintenu sur le flux accrédité.


    **Volet B — trois mesures sur quatre :**

    - Non-remplacement d''un technicien : retenu, sous réserve que son absence ne reporte pas de tâches
    de paillasse sur les signataires.

    - Internalisation de la maintenance métrologie : **retenue sous condition**. Le poste touche directement
    la traçabilité métrologique et la maîtrise des équipements, qui sont auditées. À conditionner à des
    certificats d''étalonnage raccordés maintenus et à une compétence interne documentée avant bascule.
    À défaut, mesure suspendue.

    - Gel du second apprenti signataire : retenu **à titre temporaire**, et sans le présenter comme sans
    coût. Un apprenti recruté à M1 n''est agréé qu''à ~M28 : le gel ne change rien avant M14, mais il
    plafonne durablement l''effectif à trois. Levée automatique à la signature des contrats-cadres.


    ---


    ## 4. Ce que j''écarte


    **Le retour de Ferrand en production avec supervision ramenée à 55 h/mois, et sa variante à 70 h/mois.**


    Le DAF n''a pas communiqué la valeur individuelle de cette mesure. Même en lui attribuant la totalité
    du volet B — hypothèse majorante — elle rapporte au plus 26 k€ × 8 mois = **208 k€**, et vraisemblablement
    de l''ordre de 50 k€. En face : 340 k€ de frais directs, 14 à 20 mois de suspension et 87 % du chiffre.
    Le rapport est défavorable même dans l''hypothèse la plus généreuse pour le plan.


    **Ce n''est pas un arbitrage de trésorerie.** Aucun scénario de refus ne crée de tension avant M14
    :


    | Scénario | Économie/mois | Déficit résiduel | Trésorerie à M14 |

    |---|---|---|---|

    | Sans plan | 0 | 61 k€ | épuisée ~M13 |

    | Volet A seul | 24 k€ | 37 k€ | ~262 k€ |

    | **Plan retenu ici** | ~43 k€ | ~18 k€ | **~530 k€** |

    | Plan intégral DAF | 50 k€ | 11 k€ | ~626 k€ |


    Le volet A seul nous porte au-delà de l''échéance critique. Le plan doit être appliqué — l''inaction
    épuise la trésorerie à M13 — mais rien n''oblige à financer 50 k€ en prenant l''accréditation en gage.


    ---


    ## 5. Ce sur quoi j''engage le laboratoire


    1. **Supervision de Vidal maintenue à 100 h/mois minimum, sans interruption, jusqu''à complétion.**
    Cible : 24 mois-équivalents atteints fin M6, soit deux mois de marge avant le départ de Ferrand. Le
    décompte est relevé et contresigné par Ferrand chaque mois ; tout mois inférieur à 100 h déclenche
    rattrapage immédiat le mois suivant. Je ne descendrai pas sous 90 h/mois, quelles que soient les circonstances.

    2. **Attestation écrite de Ferrand des heures effectuées, obtenue avant son départ.** Un salarié démissionnaire
    n''est plus mobilisable ensuite. Y adjoindre une option de prestation de supervision jusqu''à M10,
    activable en cas d''aléa.

    3. **Recrutement d''un signataire agréé externe, arrivée avant M14.** C''est la seule mesure qui traite
    la marge nulle post-M14 (Bouchard, Nseka, Vidal = exactement trois, seuil du référentiel). Un arrêt
    maladie, un départ ou un litige déclenche alors la suspension sous 30 jours. Ce recrutement conditionne
    aussi les contrats-cadres : deux signataires dédiés en plus de l''activité courante sont impossibles
    à trois. À traiter comme l''investissement qui débloque 41 k€/mois — soit les deux tiers du déficit
    — et non comme une charge.

    4. **Confirmation écrite de l''organisme d''accréditation sur quatre points**, demandée cette semaine
    : lecture du prorata pour un mois sous 100 h ; portabilité de l''agrément d''un signataire recruté
    à l''extérieur ; crédit acquis par Vidal à ce jour ; présence ou non requise du superviseur au prononcé,
    huit semaines après la dernière heure. Ces réponses conditionnent le calendrier ci-dessus.

    5. **Point de contrôle mensuel au comité** sur deux indicateurs seulement : heures supervisées de
    Vidal, et effectif agréé en poste à échéance 6 mois.


    ---


    ## 6. Réserves sur les éléments d''aide à la décision


    Le benchmark de neuf laboratoires ne répond pas à la question posée. Il établit une fréquence, pas
    la compatibilité de notre configuration propre — un superviseur partant à l''intérieur de la fenêtre
    de crédit, une retraite à M14, un plancher atteint exactement. À supposer les cas comparables, deux
    échecs sur neuf pour un événement terminal ne constituent pas un élément rassurant.


    La cosignature de cinq membres sur sept engage la responsabilité du comité ; elle ne modifie pas le
    décompte du référentiel. Je le signale parce que la note du DAF présente ces deux éléments comme des
    garanties, alors qu''aucun des deux ne porte sur le point de calcul en cause.


    ---


    **Décision demandée lundi :** validation du volet A, du volet B amputé de la mesure de supervision,
    du plancher à 100 h/mois, et ouverture du recrutement d''un signataire agréé.


    ---


    Le calcul décisif tient en une ligne : Vidal a besoin de 6 mois de crédit, Ferrand offre 8 mois de
    présence, et 55 h/mois n''en produisent que 4,4. Si le DAF communique la valeur individuelle de la
    mesure et le détail du plan de charge de Ferrand, je peux affiner l''économie récupérable entre 100
    et 120 h/mois — mais cela ne change pas l''arbitrage.

    '
