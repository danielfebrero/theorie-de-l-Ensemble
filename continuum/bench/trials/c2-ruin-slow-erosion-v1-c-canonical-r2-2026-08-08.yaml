    ---


    # Note au comité de direction — Laboratoire Verlaine


    **Objet :** plan d''économies du DAF — arbitrage trésorerie / accréditation ISO 17025

    **Décision demandée :** adopter le volet A, adopter deux mesures sur quatre du volet B, écarter les
    deux autres, engager trois actions absentes du plan.


    ## 1. Le point dur : le départ de Ferrand est une échéance, pas un paramètre


    Le plan est présenté comme entièrement réversible. Une mesure ne l''est pas, et c''est la seule qui
    compte : la réduction de la supervision de Salomé Vidal.


    Ce que dit le référentiel, appliqué à notre dossier :


    - Il reste à Vidal 6 mois-équivalents de pratique. Un mois compte pour 1 s''il est à 100 h ou plus,
    au prorata en dessous. Un mois à 120 h compte donc pour 1, pas pour 1,2 : **les 20 h au-dessus de
    100 sont perdues, elles ne constituent aucune avance.**

    - Tout changement de superviseur ramène l''exigence à **12 mois sous le nouveau**. Le crédit acquis
    sous Ferrand ne se reporte pas.

    - Ferrand part fin M8. **La dernière heure supervisée par Ferrand doit donc tomber au plus tard fin
    M8**, sinon le compteur repart pour 12 mois.


    **Huit mois pour banquer six mois-équivalents : le plancher arithmétique est de 75 h/mois en moyenne.
    La marge totale du dossier est de 200 heures de sous-régime cumulé sur M1–M8.**


    | Supervision M1→M8 | Crédit fin M8 | Conséquence | Agrément Vidal |

    |---|---|---|---|

    | 120 h/mois (statu quo) | 6,0 / 6 dès fin M6 | Marge 2 mois | ≈ M8 |

    | 100 h/mois | 6,0 / 6 fin M6 | Marge 2 mois, coût zéro | ≈ M8 |

    | 75 h/mois | 6,0 / 6 fin M8 | Marge nulle | ≈ M10 |

    | **70 h/mois (variante)** | **5,6 / 6** | **Reset 12 mois à M9** | **≈ M22** |

    | **55 h/mois (volet B)** | **4,4 / 6** | **Reset 12 mois à M9** | **≈ M22** |


    Le volet B consomme 360 heures de marge (8 × 45 h) là où le dossier en contient 200. La variante à
    70 h en consomme 240. **Les deux échouent, et de la même façon.**


    Effectif de signataires agréés :


    | Période | Signataires en poste |

    |---|---|

    | M1–M8 | Ferrand, Marchand, Bouchard, Nseka — 4 |

    | M9–M14 | Marchand, Bouchard, Nseka (+ Vidal si agréée ≈ M9) — 3 ou 4 |

    | **M15 et au-delà** | **Bouchard, Nseka (+ Vidal) — 3 si et seulement si Vidal est agréée** |


    Sous volet B, Vidal est agréée vers M22 ; Marchand part fin M14 ; nous tombons à deux signataires
    dès M15 ; l''organisme suspend sous 30 jours, soit **vers M16**. L''affirmation du DAF — « trois signataires
    restent en poste jusqu''à M14 et Vidal sera agréée d''ici là » — est exacte sur sa première moitié,
    fausse sur la seconde de six à huit mois.


    ## 2. Ce que coûte la branche que nous n''avons pas le droit de prendre


    Après suspension : accréditation initiale, 14 à 20 mois, 340 k€, dossier recevable **seulement si
    trois signataires agréés sont en poste**. Il faut donc rémunérer trois signataires seniors pendant
    14 à 20 mois en n''encaissant que les 13 % de chiffre non accrédité, puis payer 340 k€. Avec 780 k€
    de trésorerie, aucune combinaison d''économies ne finance cette branche. Ce n''est pas un mauvais
    scénario, c''est une perte irrécupérable : **elle interdit la mesure quelle que soit son espérance
    de gain.**


    Pour situer l''urgence réelle : la trésorerie tient 12,8 mois sans aucune mesure, 21 mois avec le
    seul volet A, environ 31 à 34 mois avec le volet A et les deux mesures du volet B que je retiens.
    **Nous n''avons pas un problème de survie à 12 mois qui justifierait de jouer l''accréditation. Nous
    avons un problème de reconstitution de marge sur 24 à 36 mois.**


    ## 3. Ce que je retiens


    **Volet A en totalité — 24 k€/mois**, avec une réserve. La fin de l''intérim en préparation d''échantillons
    allonge les délais de 9 à 14 jours. Le chiffre de 4 % porte sur le chiffre **non accrédité**, soit
    0,5 % du chiffre total ; il ne dit rien de l''effet de ces délais sur les 87 % accrédités ni sur notre
    crédibilité auprès du client qui propose les contrats-cadres. Je retiens la mesure en maintenant une
    capacité de préparation minimale dédiée au flux accrédité, avec mesure du délai moyen sur ce flux
    au 60ᵉ jour.


    **Volet B, deux mesures sur quatre** : non-remplacement du technicien, internalisation de la maintenance
    métrologie. Aucune n''affecte la chaîne de supervision ni le plancher de signataires. Je demande au
    DAF le détail des 26 k€ par mesure, que la note ne fournit pas.


    **Le retour de Ferrand en production**, mais sur son temps résiduel une fois la supervision servie,
    pas l''inverse. Et j''accepte la seule économie gratuite du dossier, que le plan n''a pas vue : **ramener
    la supervision de 120 à 100 h/mois ne coûte pas une heure de crédit**, le prorata étant plafonné à
    1 mois par mois. Cela libère 20 h/mois de Ferrand pour la production sans déplacer la date d''agrément.


    ## 4. Ce que j''écarte


    **La supervision à 55 h/mois, et la variante à 70 h.** Elles ne sont pas plus prudentes l''une que
    l''autre : même agrément à M22, même suspension à M16. La variante à 70 h est le pire cas de figure
    — elle coûte presque autant en économies renoncées et échoue à 0,4 mois-équivalent près, ce qui donne
    l''illusion d''une marge inexistante.


    Je récuse la qualification de « réversible en trente jours ». Rétablir 120 h au trentième jour ne
    restitue pas le crédit non acquis, et si Ferrand est parti, rien ne restitue l''identité du superviseur.
    Le temps de pratique est la seule ressource du dossier qui ne se rachète pas.


    **Le gel du poste de second apprenti signataire.** Un apprenti démarré aujourd''hui est agréé à M26
    ; gelé douze mois, à M38. À compter de M15 nous serons exactement à trois signataires, sans redondance
    : un arrêt maladie long, un départ, un litige, et nous sommes suspendus. Cette mesure supprime notre
    seule assurance au moment précis où nous n''en avons plus d''autre, pour une économie qui n''est même
    pas chiffrée séparément.


    **Le benchmark du cabinet ne constitue pas une preuve.** La question n''est pas combien de laboratoires
    ont réduit leurs coûts, mais combien l''ont fait alors que leur unique chaîne de formation dépendait
    d''un superviseur démissionnaire à huit mois et que leur plancher réglementaire tombait à quatorze.
    Sur neuf cas, cette sous-population est vraisemblablement vide. Et le mécanisme ici n''est pas probabiliste
    : c''est une règle de calcul déterministe. Cinq cosignatures sur sept ne modifient pas un prorata.


    ## 5. Ce sur quoi j''engage le laboratoire


    1. **Plancher de supervision de Vidal par Ferrand à 100 h/mois, superviseur unique, sans exception,
    jusqu''à extinction du crédit** (fin M6 au rythme nominal). Relevé d''heures contresigné mensuellement
    et versé au dossier.

    2. **Sécurisation écrite de la présence de Ferrand jusqu''à fin M8**, avec option de contrat de supervision
    seule jusqu''à M10 en cas de glissement. Notre assurance la moins chère.

    3. **Recrutement d''un signataire déjà agréé, lancé cette semaine.** Seul levier qui opère à l''échelle
    du mois plutôt que de 24 mois. Il couvre le départ de Marchand, la redondance perdue et la condition
    d''accès aux contrats-cadres. Le coût annuel d''un signataire senior est sans commune mesure avec
    340 k€ et une suspension.

    4. **Maintien du second apprenti signataire**, et ouverture immédiate du poste plutôt que gel.

    5. **Contrats-cadres de fatigue : pas de signature en l''état.** 41 k€/mois couvrent les deux tiers
    du déficit et valent plus que la totalité du volet B — c''est l''objet le plus rentable du dossier
    et il mérite plus d''efforts que les arbitrages de coûts. Mais ils exigent cinq signataires à partir
    de M9, alors que nous en aurons quatre au mieux et trois à partir de M15. Nous ne dédions pas Vidal
    fraîchement agréée à un contrat externe. Signature conditionnée au recrutement du point 3, ou démarrage
    renégocié à M12 avec montée en charge progressive.

    6. **Recomposition de l''enveloppe d''économies, pas de son montant.** Le DAF a raison sur l''urgence
    de trésorerie et je ne lui retire pas sa cible. Je lui retire deux mesures et lui demande de retrouver
    les 12 à 14 k€/mois correspondants hors chaîne de signature : extension de la sous-location au-delà
    de 240 m², report de rémunération variable de l''équipe de direction, acompte négocié sur les contrats-cadres.
    Arbitrage sous quinze jours.


    **Déclencheurs et replis, sur l''option retenue :**


    - Fin de mois, déficit de crédit cumulé de Vidal supérieur à 120 h (60 % de la marge consommée) →
    retour immédiat à 120 h/mois, Ferrand en supervision exclusive.

    - Ferrand signale un départ avant fin M8 → activation du contrat de supervision seule le jour même
    ; à défaut, saisine de l''organisme avant tout autre engagement.

    - Recrutement du signataire agréé non clos fin M6 → renonciation ou renégociation des contrats-cadres,
    notifiée au client.

    - Trésorerie sous 450 k€ → second train de mesures, pris exclusivement hors périmètre accréditation.

    - Notification de départ d''un des trois signataires alors que l''effectif est à trois → gel de tout
    engagement irréversible, information de l''organisme à notre initiative.


    ## 6. Le meilleur argument contre cette note


    Il existe et il est sérieux. Si l''organisme admet que le crédit de pratique se transfère lorsque
    le superviseur part pour un motif indépendant du candidat, ou qu''une co-supervision documentée préserve
    la chaîne, alors le reset de 12 mois ne s''applique pas. Dans ce cas, à 55 h/mois et sans reset, Vidal
    atteindrait les six mois-équivalents vers fin M11 et serait agréée vers M13 — juste avant le départ
    de Marchand. Le plan du DAF passerait, de justesse.


    Il ne tient pas en l''état, pour deux raisons. Le texte est explicite et sans réserve : « tout changement
    de superviseur ramène l''exigence à douze mois ». Et même si l''exception existait, elle nous laisserait
    un mois de marge sur un dossier à 340 k€, ce que je ne recommanderais pas davantage. Mais l''hypothèse
    est vérifiable pour un coût nul, et c''est ce qui la rend décisive.


    ## 7. L''observation qui renverse cette note


    Une prise de position **écrite** de l''organisme sur trois points : transfert du crédit acquis en
    cas de départ du superviseur, admissibilité d''une co-supervision, plafonnement du prorata au-delà
    de 100 h. Si le premier point est confirmé favorablement par écrit, la réduction de supervision redevient
    discutable et je réexamine l''arbitrage sous 48 h. Aucune autre forme de confirmation — orale, informelle,
    par analogie, ou par l''avis du cabinet — ne suffit.


    ## 8. Première action


    Cette semaine, deux courriers. Le premier à l''organisme d''accréditation, demandant la position écrite
    du point 7 : c''est l''information la moins chère et la plus décisive du dossier, elle tranche une
    question à 340 k€ pour le prix d''une lettre. Le second à Ferrand, actant par écrit sa supervision
    à 100 h/mois jusqu''à extinction du crédit de Vidal et sa présence jusqu''à fin M8, avec option de
    prolongation en supervision seule. L''ouverture du poste de signataire agréé suit sans attendre la
    réponse de l''organisme : elle est utile dans les deux branches.


    ---


    **Hypothèses explicites, à vérifier avant le comité.** Que les « six mois de pratique restants » de
    Vidal s''entendent en mois-équivalents à 100 h et non en volume horaire brut — à confirmer sur son
    dossier de formation. Que les 26 k€ du volet B se répartissent de telle sorte que les deux mesures
    retenues en représentent 12 à 14 k€ — à confirmer par le DAF ; les projections de trésorerie du §
    2 en dépendent. Que la sous-location de 240 m² n''obère pas la capacité d''accueil des bancs de fatigue,
    si les contrats-cadres aboutissent.


    ---


    Deux points valent d''être signalés hors note : la variante à 70 h/mois est le piège du dossier —
    elle échoue à 0,4 mois-équivalent près, ce qui la fait passer pour un compromis raisonnable alors
    qu''elle produit exactement le même résultat que 55 h. Et le passage de 120 à 100 h est une économie
    réelle à coût nul que le plan a manquée, ce qui donne au DAF une contrepartie concrète plutôt qu''un
    refus sec.

    '
