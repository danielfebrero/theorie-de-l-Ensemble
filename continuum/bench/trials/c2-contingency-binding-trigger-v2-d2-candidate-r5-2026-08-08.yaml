  text: 'La publication n''a pas été approuvée — la note reste en local, elle est complète telle quelle.


    **Verdict : A**, bascule intégrale le 3 novembre, sous deux conditions préalables.


    Le raisonnement décisif tient en un point de calendrier que le dossier ne relève pas : **B court sur
    10 semaines à partir du 3 novembre, donc 100 % du trafic le 12 janvier, alors que Solda expire le
    30 novembre.** B exige la prolongation mensuelle sur décembre *et* janvier — 260 k€ nulle part dans
    son chiffrage. Économie réelle de B : 50 k€, pas 310 k€. A avec la prolongation de décembre seule
    : 370 k€.


    Deuxième point : les 320 k€ d''écart n''achèteraient que 129 k€ de volume brut exposé en moins pendant
    le rodage — et ce calcul suppose qu''on ne réagit pas, alors que le tableau de bord rafraîchit à 5
    minutes et l''astreinte rebascule en 15.


    Troisième point, celui qui conditionne tout : la vraie branche irrécupérable n''est ni A ni B, c''est
    **la fermeture du compte Solda**. D''où les deux conditions — prévenir Solda avant le 15 octobre,
    et obtenir par écrit que le renouvellement plein reste ouvert en cas de retour avant le 31 décembre.
    Sans la seconde, la prolongation s''arrête au 28 février et le repli est un pont vers rien : je ne
    recommanderais alors pas la bascule.


    Deux détails de calendrier qui pèsent dans la note : le **30 novembre est un Cyber Monday**, donc
    sans prolongation notre dernier jour de réversibilité est notre deuxième plus gros jour de l''année
    ; et caler la signature Payflux au **1er octobre** fait courir la fenêtre de sortie sans pénalité
    jusqu''au 30 décembre, couvrant exactement le vendredi noir, le Cyber Monday et le pic de décembre.
    Signer plus tôt nous en prive gratuitement.


    Le meilleur argument contre A est retenu dans la note : le tableau de bord ne mesure ni l''intégrité
    des remises ni le taux de contestation, et A y expose 100 % du flux au premier jour. Il ne renverse
    pas le choix — 25 % de flux contaminé reste contaminé, B achète du volume en moins et pas de la détection
    — mais il impose d''instrumenter avant le 3 novembre.


    Un point à faire trancher avant vendredi, sans qu''il change la recommandation : si le contrôle de
    gestion confirme que les 310 k€ de B intègrent déjà une continuité Solda, l''écart retombe de 320
    k€ à 190 k€. C''est signalé en note dans le document.


    La note est ici : `/tmp/claude-0/-tmp-bench-campaign2-work-cell-DDJJEw/915db3c4-2b59-500b-9acf-a46e619c123c/scratchpad/note-comite-paiement.md`


    Je peux la republier comme page partageable si vous relancez l''autorisation, ou la basculer en format
    papier à en-tête si elle est remise en séance.

    '
