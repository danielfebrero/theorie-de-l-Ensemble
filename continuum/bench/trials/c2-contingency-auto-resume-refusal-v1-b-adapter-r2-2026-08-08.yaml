response:
  text: '# RÉGIE DES EAUX DE TRÉVANNE — Note au comité d''exploitation


    **Séance du jeudi** — **Objet :** retour en régulation automatique de la chloration — règle de bascule

    **Rédacteur :** responsable de l''exploitation — **8 août 2026**


    ## 1. Position


    Le retour en automatique est souhaitable et doit être organisé vite. Le pilotage manuel n''est pas
    un régime sûr : l''écart-type en sortie est passé de 0,08 à 0,21 mg/L. Cette dispersion joue dans
    les deux sens, et le sens bas — sous-chloration — porte un risque microbiologique supérieur à celui
    du 12 mai. Nous payons 41 k€ par mois pour un régime moins stable que celui que nous avons arrêté.
    L''objectif n''est donc pas de prolonger le manuel : c''est d''en sortir proprement, et plus tôt que
    le 30 septembre.


    ## 2. Ce que mesurent les 87 jours


    Les 87 jours sans dépassement, la moyenne à 0,52 mg/L et la sonde neuve mesurent la **qualité du pilotage
    manuel**. Ils ne mesurent rien de la boucle automatique : celle-ci n''a pas fonctionné depuis le 13
    mai et le programme d''automate en service est celui du 12 mai, inchangé. Un compteur de jours calmes
    en manuel ne peut pas servir de critère de retour en automatique : il compte les jours d''un régime
    pour en autoriser un autre.


    Le comparateur S2/S3 n''a levé aucune alarme depuis le 14 juillet, soit 25 jours d''observation, sur
    une sonde remplacée le 2 juin et étalonnée toutes les deux semaines. **Il n''a jamais vu de dérive.**
    Absence d''alarme = absence de dérive **ou** incapacité à la détecter ; les deux hypothèses sont indiscernables
    tant qu''aucune dérive n''a été injectée. Un comparateur qui n''a rien vu passer n''est pas validé,
    il a été laissé tranquille.


    Enfin, sa sortie va vers un tableau de bord. Le critère signé le 13 mai demande que la discordance
    soit **instrumentée** ; à ce jour elle est **affichée**.


    ## 3. État des trois causes établies par l''enquête


    | Cause du 12 mai | État au 8 août |

    |---|---|

    | Dérive de S2 non détectée pendant ≥ 9 jours | Sonde remplacée, étalonnage bimensuel. La détection
    en ligne, elle, n''existe toujours pas — la sonde neuve dérivera aussi. **Non refermée.** |

    | La boucle ne compare jamais S2 à S3 | Comparateur écrit, en observation, non relié à l''actionneur,
    non éprouvé. **Non refermée.** |

    | Alarme de discordance désactivée depuis novembre | Réactivation et traçabilité des inhibitions non
    établies. **Non refermée.** |


    Repasser en automatique aujourd''hui, c''est remettre en service la configuration exacte du 12 mai,
    avec une sonde neuve qui n''a pas encore eu le temps de dériver.


    ## 4. Règle proposée — auto-exécutoire, sans nouvelle réunion


    Le comité n''a pas à se réunir de nouveau. Il fixe jeudi la règle ci-dessous ; **la bascule se fait
    dès que les six conditions sont attestées, à la date où elles le sont.**


    **Conditions préalables (toutes) :**


    1. **Bridage de dose.** Limite haute matérielle du poste de chloration, indépendante de S2, telle
    qu''au débit nominal la sortie ne puisse dépasser 0,8 mg/L quelle que soit la consigne calculée. Essai
    de tenue à consigne maximale.

    2. **Comparateur relié à l''actionneur.** Écart S2/S3 au-delà du seuil pendant la temporisation →
    repli automatique en dose fixe sûre + alarme au poste. Seuil et temporisation figés par la métrologie
    avant essai.

    3. **Essai positif d''injection.** Dérive introduite volontairement sur S2 (offset appliqué en entrée
    de boucle) ; le repli doit se déclencher dans le délai spécifié, deux fois sur deux. Sans cet essai,
    le comparateur reste une hypothèse.

    4. **Défaillance de S3 traitée.** Perte, gel de valeur ou hors-gamme de S3 = discordance : repli,
    pas silence. S3 entre au plan d''étalonnage au même titre que S2.

    5. **Alarme de discordance réactivée**, inhibition impossible sans trace nominative et expiration
    automatique. C''est la cause de novembre.

    6. **Programme d''automate modifié, versionné, relu** par un tiers ; écart de version visible en supervision.


    Chaque condition est attestée par écrit, datée et nominative, par le responsable métrologie et le
    responsable exploitation. **La dernière signature vaut autorisation de bascule.**


    **Période probatoire : 14 jours** en automatique avec un opérateur en poste au lieu de deux. Arrêt
    immédiat et sans arbitrage si : toute valeur > 0,8 mg/L, tout déclenchement de repli non expliqué,
    toute indisponibilité de S3 > 2 h. En cas d''arrêt : retour au manuel, traitement de la cause, redémarrage
    des 14 jours. À l''issue des 14 jours sans arrêt : régime normal, suppression des deux postes.


    Une durée n''intervient qu''à un seul endroit dans cette règle : **après** la mise en service des
    barrières, jamais avant.


    ## 5. Coût et calendrier


    41 k€/mois = 1,35 k€/jour. Attendre le 30 septembre coûte ~72 k€ **sans rien refermer**. Les conditions
    1, 2 et 5 relèvent du câblage et du paramétrage ; les conditions 3 et 6 d''une semaine d''essais et
    d''une modification de programme. Cible : conditions réunies à mi-septembre → probatoire à un opérateur
    (≈ −20 k€/mois) → régime normal fin septembre. **Le chemin le plus court vers l''arrêt des 41 k€ passe
    par ces travaux, pas par l''attente.**


    Deux points à lever avant jeudi : (a) informer l''audit externe de la démarche, pour qu''il ne découvre
    pas le 30 septembre une remise en service qu''il n''a pas instruite ; (b) confirmer si la remise en
    service doit être notifiée à l''ARS au titre des suites de la restriction.


    ## 6. Décision demandée


    Adopter la règle du §4 et engager les travaux 1 à 6.


    Ce que je ne peux pas proposer, c''est une règle en nombre de jours : elle donnerait une date de retour
    sans donner de motif, et elle rendrait au comité, le jour où la sonde neuve dérivera à son tour, exactement
    la réunion qu''il cherche à éviter.


    ---


    Le fichier est ici : `scratchpad/note_comite_exploitation_2026-08-08.md`.


    Deux points à trancher avant jeudi, qui vous appartiennent :


    - **Le bridage de dose (condition 1) est la barrière la plus utile et la moins chère** : il borne
    le scénario du 12 mai sans dépendre de la détection de la dérive. Si vous ne deviez en engager qu''une,
    c''est celle-là — et elle seule permettrait, si le comité le décide, un retour anticipé en automatique
    dégradé avant les autres conditions.

    - **Le calendrier de mi-septembre est une cible, pas un engagement** : je n''ai pas la charge de l''atelier
    automatisme ni le délai d''approvisionnement du matériel de bridage. À confirmer d''ici jeudi si vous
    voulez que la note porte une date ferme.

    '
