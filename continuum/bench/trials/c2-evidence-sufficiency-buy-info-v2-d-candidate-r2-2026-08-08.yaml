response:
  text: '# NOTE AU COMITÉ DE DIRECTION


    **Objet :** Contrat cellules 2027 — Kelmar / Sinolux

    **De :** Direction des opérations


    ---


    **Décision proposée : réserver la capacité Kelmar à J+18 et lui attribuer les 72 000 cellules 2027.
    Ne pas basculer sur Sinolux cette année. Rouvrir le dossier pour 2028 sur mesure indépendante.**


    ### 1. L''économie de 230 400 € ne survit pas au coût des retours


    Chaque retour coûte 205 €, quel que soit le fournisseur. Kelmar : 1,3 % stable, soit 936 retours et
    191 880 €.


    | Scénario Sinolux | Retours | Cellules + retours | Écart vs Kelmar |

    |---|---|---|---|

    | 1,1 % (chiffre du fournisseur) | 792 | 1 803 960 € | **− 259 920 €** (gain) |

    | **2,86 % (seuil d''équivalence)** | 2 060 | 2 063 880 € | **0 €** |

    | 3,0 % (Ferro) | 2 160 | 2 084 400 € | + 20 520 € |

    | 3,1 % (audit de mars) | 2 232 | 2 099 160 € | **+ 35 280 €** (surcoût) |


    *(Kelmar : 2 063 880 €. Si l''on crédite le remplacement gratuit des cellules, le seuil monte à 3,22
    % — l''estimation indépendante reste dans la zone d''indécision.)*


    Le seuil est à 2,86 %. La seule mesure indépendante disponible est à 3,1 %. **L''économie de 230 400
    € est intégralement à l''intérieur de l''incertitude, et l''estimation centrale est du mauvais côté.**


    ### 2. Nous n''avons pas trois sources, nous en avons deux — dont une seule indépendante


    La note méthodologique de Ferro indique qu''il travaille sur l''échantillon de l''audit de mars :
    ce n''est pas une confirmation, c''est la même mesure relue. Il reste une mesure indépendante (3,1
    %) et une déclaration du vendeur sur lui-même (1,1 %).


    **Le refus de la clause indexée est l''élément le plus dur du dossier.** À 1,1 %, une indexation au-delà
    de 1,3 % ne coûterait rien à Sinolux. À 3,1 %, elle lui coûterait environ 265 000 € par an. En la
    refusant, Sinolux nous laisse porter un risque qu''il ne tient manifestement pas pour négligeable.
    Le remplacement gratuit des cellules, lui, couvre 22,80 € d''un retour qui nous en coûte 205 : environ
    10 % du coût de sa propre défaillance.


    ### 3. Le test Vertex ne peut pas trancher 2027


    Neuf semaines de résultat, soit J+63. Kelmar ferme à J+18, Sinolux à J+21. L''information arrive six
    semaines après la décision, et aucune autre mesure n''existe avant la fin de l''année. **La décision
    2027 se prend sans mesure supplémentaire : c''est une contrainte de calendrier, pas un arbitrage.**
    Payer 34 000 € pour éclairer 2027 serait sans objet ; payer 34 000 € pour éclairer 2028 est justifié.


    ### 4. L''asymétrie des deux échéances


    Manquer J+21 nous coûte au pire une économie potentielle de 230 400 €. Manquer J+18 nous prive de
    la seule capacité de repli identifiée pour toute l''année 2027, sans report de lancement possible
    et sans second fournisseur qualifié. Un prix se renégocie ; une ligne de production vendue ne se rachète
    pas. C''est cette asymétrie, plus que les 35 280 €, qui commande la décision.


    ### 5. Actions


    - **Avant J+18 :** obtenir de Kelmar le coût et la nature exacte de la réservation — option avec droit
    de réduction, ou engagement ferme ? Réserver les 72 000 unités.

    - **Entre J+18 et J+21 :** dernière proposition à Sinolux, au choix — prise en charge des 205 € par
    retour au-delà de 1,3 %, ou co-financement à 50 % du test Vertex. Sa réponse est en elle-même une
    information. Refus attendu → Kelmar 100 %.

    - **À J+21 :** lancer Vertex, avec un **bras témoin de cellules Kelmar dans le même protocole**. Le
    ±0,3 point porte sur un vieillissement accéléré, pas sur notre taux de retour terrain ; seul un écart
    comparatif est exploitable.

    - **Variante, si et seulement si la réservation Kelmar est réductible sans pénalité :** tirer 52 000
    Kelmar / 20 000 Sinolux. Économie 64 000 €, surcoût maximal 73 800 € au taux de 3,1 %, et des données
    terrain réelles pour 2028. À ne retenir que si l''atelier accepte la double qualification.


    ### 6. Ce qui renverserait cette décision


    - Sinolux accepte de porter les 205 € par retour au-delà de 1,3 % → il devient le meilleur choix,
    le risque n''est plus chez nous.

    - Sinolux documente, pièces à l''appui avant J+18, que l''audit de mars porte sur une chimie ou une
    ligne abandonnée.

    - Une seconde mesure indépendante, disponible avant J+18, situe le taux sous 2,5 %.

    - La réservation Kelmar s''avère être un droit non déductible supérieur à ~35 000 € : l''avantage
    central s''efface et l''arbitrage repose alors entièrement sur le risque d''approvisionnement, que
    le comité doit trancher explicitement.


    ### 7. Point de gouvernance


    Les 230 400 € figurent au budget avant que la décision soit prise. Sur la seule mesure indépendante
    dont nous disposons, cette ligne est un surcoût d''environ 35 000 €, pas une économie. **Je demande
    son retrait du budget engagé et son reclassement en économie conditionnelle 2028.** Une économie déjà
    inscrite exerce une pression sur la décision censée la produire.


    ---


    **Une hypothèse à confirmer avant lundi :** la note traite la réservation Kelmar comme un engagement
    ferme sur le volume (lecture conservatrice). Si c''est en réalité une option peu coûteuse avec droit
    de réduction, la variante 52 000 / 20 000 du point 5 devient la meilleure option — c''est le seul
    chiffre manquant qui puisse déplacer la recommandation.

    '
