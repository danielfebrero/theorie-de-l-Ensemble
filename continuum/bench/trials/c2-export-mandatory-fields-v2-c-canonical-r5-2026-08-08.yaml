response:
  text: '# NOTE DE DIRECTION — DÉCISION EXÉCUTOIRE


    **De :** Direction générale

    **À :** Comité de direction (DAF, Directeur commercial, Directeur industriel, DRH)

    **Date :** samedi 8 août 2026

    **Objet :** Offre d''exclusivité du distributeur D — décision, mandat et conduite jusqu''au 20 août

    **Statut :** exécutoire. Je suis injoignable du 9 au 24 août. Cette note remplace l''arbitrage.


    ---


    ## 1. La décision


    **Nous ne signons pas le contrat d''exclusivité proposé par D.**


    Cette décision est prise, elle n''est pas soumise au comité, et l''acheteur de D ne peut pas la faire
    évoluer lors de sa visite.


    Ce que vous êtes en revanche mandatés pour faire, et que vous ferez : **envoyer lundi 10 août une
    contre-offre écrite, déjà rédigée et signée par mes soins** (§3), et **signer sans moi** si D l''accepte
    selon la règle mécanique du §4.


    Si D refuse, nous encaissons le déréférencement des quatre références le 20 août et nous exécutons
    le §7. C''est un scénario prévu, chiffré et financé, pas un accident.


    ---


    ## 2. Pourquoi — le calcul, que je vous demande de refaire et de contester


    L''offre est présentée comme un échange volume contre prix. Ce n''en est pas un.


    Sur une base de 14,9 M€ de cession à D et 31 % de marge brute :


    | | CA D | Marge brute D | Écart |

    |---|---|---|---|

    | Aujourd''hui | 14,9 M€ | **4,62 M€** | — |

    | Année 1 (volume +18 %, prix −9 %) | 16,00 M€ | **3,87 M€** | **−0,75 M€** |

    | Années 2-3 (remise acquise, volume retombé) | 13,56 M€ | **3,28 M€** | **−1,34 M€/an** |


    **L''accord détruit de la marge dès la première année, même si D tient parfaitement son engagement.**
    La remise de 9 % sur le prix consomme 29 % de la marge unitaire. Le point mort volume est à **+41
    %**, pas +18 %. On nous demande de vendre plus pour gagner moins.


    Trois asymétries structurelles :


    1. **L''engagement de volume est ferme un an, la remise est acquise trois ans.** Années 2 et 3, D
    paie 9 % de moins sans rien devoir. C''est la clause qui décide de tout.

    2. **La remise porte sur la base entière, pas sur la croissance.** Nous financerions à 1,34 M€/an
    un volume incrémental qui n''en rapporte que 0,83.

    3. **L''exclusivité interdit les deux alternatives pendant trois ans** : centrale régionale (3,5 M€
    ≈ 1,1 M€ de marge annuelle) et marketplace (0,4 à 2,2 M€ à +6 points). Coût d''opportunité sur la
    durée : **3 à 4 M€ de marge**.


    Total : **5 à 7 M€ de marge brute sur trois ans**, à comparer à une marge brute annuelle totale de
    7,44 M€.


    Deux vérifications de robustesse, à faire et à me remonter :

    - Si la marge réelle sur D est **inférieure** à la moyenne de 31 % — ce qui est probable en GMS —
    la conclusion se durcit, elle ne s''inverse jamais. Le sens du résultat ne dépend pas de la précision
    de l''hypothèse.

    - Le +18 % de volume suppose une capacité disponible sans surcoût. Si l''atelier exige des équipes
    supplémentaires, retirez-le encore de la colonne « année 1 ».


    Enfin, le fait décisif n''est pas dans le contrat : **au deuxième trimestre, D a réduit ses commandes
    de 11 % sans préavis.** Le texte proposé ne contient aucune clause qui l''en empêcherait à l''avenir.
    Nous céderions trois ans d''exclusivité contre un engagement d''un an, à une contrepartie qui vient
    de démontrer qu''elle ne s''estime pas liée par ses volumes.


    ---


    ## 3. Ce que vous envoyez lundi 10 août avant 10h


    La lettre est rédigée, elle est en pièce jointe à cette note, elle porte ma signature. **Vous l''envoyez
    telle quelle, sans y ajouter ni en retirer une ligne**, par courriel avec accusé de réception et par
    LRAR, à l''acheteur et à sa direction commerciale.


    Elle doit partir **avant** la visite de l''acheteur, pour que la réunion porte sur notre texte et
    non sur le sien.


    Elle propose un partenariat de croissance sur cinq points :


    1. **Remise de 9 % sur le seul volume au-delà du niveau 2025**, jamais sur la base historique. Sur
    +18 %, D obtient sa remise pleine sur la croissance qu''il apporte ; nous gagnons 0,59 M€ au lieu
    d''en perdre 0,75. Cette proposition est économiquement défendable des deux côtés : dites-le ainsi.

    2. **Durée de 18 mois**, renouvelable par tacite reconduction.

    3. **Pas d''exclusivité.** Au maximum, exclusivité de catégorie sur la GMS française, laissant expressément
    libres la restauration hors domicile, les centrales régionales et la vente en ligne.

    4. **Préavis écrit de trois mois** pour toute réduction de commandes supérieure à 5 % en volume glissant.
    Justifiez-le explicitement par le deuxième trimestre — sans agressivité, mais nommément.

    5. **Maintien des huit références** sur la durée, et pénalité de sortie **symétrique, plafonnée à
    0,3 M€**, nulle si D manque son propre engagement de volume.


    Aucune contrepartie supplémentaire n''est offerte. Aucun geste de dernière minute n''est autorisé.


    ---


    ## 4. Règle de signature en mon absence


    Vous êtes autorisés à signer **sans moi** un accord avec D si, et seulement si, **les cinq conditions
    suivantes sont toutes remplies dans le texte écrit de D** :


    - [ ] Aucune clause n''empêche la vente à une centrale régionale ni sur une marketplace ;

    - [ ] La remise ne s''applique qu''au volume au-delà du niveau 2025, et ne dépasse pas 9 % ;

    - [ ] La durée est de 18 mois ou moins, **ou bien** la pénalité de sortie est inférieure ou égale
    à 0,4 M€ ;

    - [ ] Le préavis de trois mois sur réduction de commandes figure au contrat ;

    - [ ] Les huit références sont maintenues contractuellement.


    **Une seule case non cochée : vous ne signez pas.** Il n''y a pas de compensation entre les points,
    pas d''appréciation d''ensemble, pas de vote.


    **Modalités :** signature conjointe obligatoire du DAF et du Directeur commercial. **En cas de désaccord
    entre eux sur la lecture d''une case, la case est réputée non cochée et l''accord n''est pas signé.**
    Le silence, l''hésitation et le partage valent refus. C''est délibéré : je choisis que l''erreur possible
    soit celle qu''on peut corriger en septembre.


    Aucun avenant, aucune lettre d''intention, aucun courriel d''engagement, aucune « confirmation de
    principe » ne peut être émis en dehors de ce cadre. Un accord verbal en réunion n''engage pas Verdal,
    et je vous demande de le dire à l''acheteur en séance, à haute voix, devant témoins.


    ---


    ## 5. La visite de l''acheteur de D


    Cette visite est une manœuvre. Le comité est divisé, il l''a écrit, je suis absent, et l''acheteur
    demande à parler lui-même à vos équipes. La réponse n''est pas de refuser — refuser signalerait une
    rupture que nous ne voulons pas — mais de cadrer.


    - La réunion a lieu **mardi 11 ou mercredi 12 août**, dans nos locaux, **90 minutes maximum**.

    - Sont présents **le DAF et le Directeur commercial, ensemble**. Aucun des deux ne rencontre l''acheteur
    seul, à aucun moment, y compris en marge, y compris au téléphone. C''est une règle absolue.

    - Le comité plénier n''est pas convoqué. Les équipes commerciales et industrielles ne sont pas présentes.

    - Ordre du jour envoyé la veille : point 1, notre contre-offre ; point 2, la liste écrite des quatre
    références visées ; point 3, les volumes prévisionnels 2027.

    - **Vous n''exposez aucune division interne.** Une seule position est présentée : celle de cette note.
    Les débats du comité ne sortent pas de la salle du comité.

    - Aucune décision, aucun chiffre nouveau, aucune concession n''est produite en séance. La formule
    est : « Notre proposition écrite est sur votre bureau ; nous attendons votre retour écrit. »

    - Compte rendu écrit sous 24 h, envoyé à D pour validation et archivé.


    **Obtenez impérativement, par écrit et avant ou pendant cette réunion, la liste nominative des quatre
    références menacées de déréférencement et leur poids exact dans notre CA D.** Nous décidons aujourd''hui
    sur une hypothèse d''équipondération. Cette donnée est la plus importante que vous puissiez rapporter,
    et elle conditionne le §8.


    ---


    ## 6. Ce que vous faites en parallèle, quel que soit l''issue avec D


    Ces sept actions sont indépendantes de la réponse de D. Elles démarrent lundi. Aucune n''attend le
    20 août.


    | # | Action | Responsable | Échéance |

    |---|---|---|---|

    | 1 | **Négocier une ligne de crédit court terme de 1,5 M€** auprès de nos deux banques, sur les comptes
    actuels | DAF | dossier déposé **mardi 11 août** |

    | 2 | Plan de trésorerie à 13 semaines, dans les deux scénarios, avec la définition retenue des charges
    fixes | DAF | **mercredi 12 août** |

    | 3 | Poids exact des 4 références dans le CA D, la marge et le plan de charge Redon | Dir. commercial
    + Dir. industriel | **mercredi 12 août** |

    | 4 | **Ouverture marketplace** : contrat, catalogue, logistique, prix. Nous ne sommes tenus par rien.
    | Dir. commercial | **mise en ligne avant le 31 août** |

    | 5 | **Centrale régionale** : demander un pilote sur 2 références à démarrer en octobre, sans attendre
    leur décision globale | Dir. commercial | contact **lundi 10 août** |

    | 6 | **Dossier d''activité partielle Redon** préparé, information-consultation du CSE engagée, sans
    dépôt | DRH | dossier prêt **vendredi 14 août** |

    | 7 | Gel de tout engagement d''investissement non encore contractualisé | DAF | immédiat |


    Le point 1 est le plus urgent et le plus sous-estimé : une ligne de crédit se négocie avant l''annonce
    d''un déréférencement, pas après. Deux jours de retard ici coûtent plus cher que toute la négociation
    avec D.


    ---


    ## 7. Si D refuse — le plan du 20 août


    Scénario probable. Il ne constitue pas un échec, il constitue le prix d''un refus de dépendance.


    **Vendredi 14 août, 12h** : si aucune réponse conforme au §4 n''est parvenue, vous notifiez à D, par
    écrit et courtoisement, que nous déclinons l''exclusivité, que notre contre-offre reste valable jusqu''au
    30 septembre, et que **nous restons leur fournisseur aux conditions actuelles**. Nous ne rompons rien.
    C''est eux qui déréférencent, pas nous qui partons — la nuance compte commercialement et juridiquement.


    **20 août** : quatre références tombent. Ordre de grandeur à confirmer par l''action 3 : jusqu''à
    7,4 M€ de CA et 2,3 M€ de marge brute en année pleine, plan de charge Redon possiblement sous 70 %.


    **Alors :**

    - Activité partielle à Redon, déposée le 21 août sur le dossier déjà prêt. **Le chômage partiel est
    l''amortisseur prévu, pas la défaite.** Il est réversible, partiellement financé, et il préserve les
    52 compétences dont nous aurons besoin en 2027.

    - Aucun licenciement économique n''est engagé en mon absence. Aucun.

    - Communication interne le 21 août, avant les rumeurs : message factuel, assumé, signé de vous quatre.
    Les salariés doivent apprendre la nouvelle de nous.

    - Redéploiement commercial des quatre références déréférencées vers la marketplace et la RHD dès le
    24 août.


    ---


    ## 8. Les deux seuls cas où vous vous écartez de cette note


    **Cas A — la menace est plus lourde que prévu.** Si l''action 3 établit que les quatre références
    pèsent **plus de 45 %** du CA D **et** que le plan de charge groupe passerait sous 60 %, alors vous
    demandez à D, par écrit, un **report de 30 jours** de la décision de déréférencement, en invoquant
    mon absence. Vous ne signez toujours pas l''exclusivité. Un report n''est pas une concession ; l''exclusivité
    en est une, définitive.


    **Cas B — événement extérieur grave** (sinistre industriel, défaillance d''un fournisseur critique,
    perte d''un second client majeur). Vous suspendez la négociation avec D, vous ne signez rien, et vous
    traitez l''urgence. Le contrat D peut attendre septembre ; il n''y a pas de meilleure offre perdue
    qu''une entreprise mal gouvernée pendant trois semaines.


    En dehors de ces deux cas, la note s''applique à la lettre.


    ---


    ## 9. Ce qui prouverait que j''ai tort


    Je vous dois cette section, et je vous demande de la prendre au sérieux plutôt que de m''être loyaux.


    Le meilleur argument contre ma décision est celui-ci : *« Avec 62 % du CA chez D et 2,1 M€ de trésorerie,
    nous n''avons pas cinq mois devant nous. Signer, c''est acheter trois ans de temps pour se diversifier
    depuis une position financée. Refuser, c''est risquer la spirale : D coupe, le plan de charge s''effondre,
    la trésorerie part en trois mois, et nous mourons avant la réponse de la centrale régionale. »*


    Cet argument est sérieux, et c''est celui du DAF. Il tombe sur un seul point, mais il tombe entièrement
    : **l''exclusivité interdit précisément d''utiliser le temps qu''elle achète.** Trois ans sans autre
    canal, en payant 1,34 M€ par an pour ce privilège, ne nous rapprochent pas de l''indépendance — ils
    la rendent inatteignable, et ils remettent à D, en 2029, un fournisseur sans alternative en position
    de renégocier n''importe quoi. Nous paierions pour perdre notre capacité de nous sauver. Si l''offre
    était de 12 mois d''exclusivité avec volume ferme sur trois ans, je signerais avant de partir.


    **Ce qui me ferait changer d''avis, concrètement :** un texte écrit de D retirant l''exclusivité hors
    GMS, ou limitant la remise au volume incrémental. C''est exactement ce que teste le §4. Si D accepte,
    signez — j''aurai eu tort sur leur intransigeance, et tant mieux.


    **Ce que je vous demande de surveiller comme un signal de danger réel :** si D réduit ses commandes
    de plus de 20 % **sur les références non menacées** avant le 20 août, la lecture change — ce n''est
    plus une négociation, c''est une sortie organisée. Dans ce cas, cellule de crise immédiate, activité
    partielle déposée sans attendre, tirage de la ligne de crédit. Même dans ce cas, on ne signe pas :
    on ne signe jamais un contrat de trois ans avec quelqu''un qui est déjà en train de partir.


    ---


    ## 10. Gouvernance pendant mon absence


    - **DAF et Directeur commercial exercent conjointement** le mandat du §4. Ni l''un ni l''autre seul.

    - **Le Directeur industriel** est le garant du §6 (actions 3, 6, 7) et alerte les deux mandataires
    si le plan de charge décroche.

    - Un **point écrit de 10 lignes** est produit chaque jour ouvré à 18h, archivé, et m''attend à mon
    retour : décisions prises, contacts D, trésorerie, plan de charge.

    - **Journal de bord obligatoire** de tout échange avec D, y compris informel. Un appel non consigné
    n''a pas eu lieu.

    - Je n''arbitre rien à distance. Ne cherchez pas à me joindre : le dispositif est conçu pour fonctionner
    sans moi, et une exception le romprait.


    ---


    Je connais le prix de cette décision. Il se compte en postes à Redon, en trois mois difficiles, et
    en une relation commerciale abîmée avec notre premier client. Je l''assume et j''en réponds à mon
    retour.


    Ce que je ne peux pas assumer, c''est de céder trois ans d''accès au marché, en échange d''un engagement
    d''un an, à un partenaire qui a coupé 11 % de ses commandes sans préavis il y a dix semaines, et de
    découvrir en 2029 que nous n''avons plus ni marge, ni canal, ni choix.


    Nous restons fournisseur de D. Nous ne devenons pas sa propriété.


    **Direction générale — 8 août 2026**


    ---


    ### Annexe — hypothèses de calcul


    Marge brute homogène à 31 % sur le canal D (à corriger par l''action 3 — une marge réelle inférieure
    aggrave la conclusion). Coûts variables supposés linéaires sur le volume incrémental (une non-linéarité
    aggrave également la conclusion). Base 14,9 M€ = exercice de référence. Point mort volume : 0,31 ÷
    (0,91 − 0,69) = +40,9 %. Contre-offre incrémentale : marge sur incrément 2,68 M€ × 31 % = 0,83 M€,
    moins remise 2,68 M€ × 9 % = 0,24 M€, soit **+0,59 M€** contre **−0,75 M€** pour l''offre de D. Écart
    entre les deux propositions en année 1 : **1,34 M€**.


    **Pièce jointe :** lettre à D, signée, à expédier le lundi 10 août avant 10h.

