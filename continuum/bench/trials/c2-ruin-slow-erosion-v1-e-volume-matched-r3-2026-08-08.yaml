response:
  text: '## Note au comité de direction — Plan d''économies du DAF et exposition accréditation ISO 17025


    **Objet :** avis sur les douze mesures proposées. Décision demandée lundi.


    ---


    ### 1. En une phrase


    Je retiens le volet A en entier et trois des quatre mesures du volet B ; j''écarte la réduction de
    la supervision de Salomé Vidal, dans ses deux variantes (55 h et 70 h), parce qu''elle est la seule
    mesure du plan dont l''effet ne se rattrape pas en trente jours et qu''elle conduit, calcul à l''appui,
    à la suspension de l''accréditation vers M15.


    ### 2. Le calcul qui commande la décision


    Vidal a 18 mois de pratique acquis, 6 mois restants, à 120 h/mois sous Ferrand. Ferrand part **fin
    M8**. Le référentiel prévoit qu''un changement de superviseur ramène l''exigence à **douze mois sous
    le nouveau**. La question n''est donc pas « Vidal sera-t-elle agréée avant M14 ? » mais « aura-t-elle
    bouclé ses 6 mois avant le départ de Ferrand ? »


    | Supervision | Crédit/mois | Crédit acquis sur M1–M8 | Résultat |

    |---|---|---|---|

    | 120 h (actuel) | 1,00 | 6,0 atteints dès **fin M6** | Agrément prononcé **fin M8** (8 semaines)
    |

    | 70 h (variante) | 0,70 | **5,60** — il manque 0,40 | Réinitialisation à 12 mois sous nouveau superviseur
    |

    | 55 h (plan) | 0,55 | **4,40** — il manque 1,60 | Idem |


    La variante à 70 h n''est pas une version atténuée : elle échoue pour **quatre dixièmes de mois**.
    Le seuil mathématique est 75 h/mois, atteint sans aucune marge — un arrêt maladie, un congé, une semaine
    de panne machine le fait tomber.


    **Conséquence en cascade des variantes 55 h et 70 h :** nouveau superviseur à partir de M9 → 12 mois
    pleins → fin de pratique M20 → agrément **M22**. Or l''effectif agréé passe à 2 (Bouchard, Nseka)
    au départ de Marchand **fin M14**. Suspension notifiée sous 30 jours, soit **M15–M16**. Le retour
    exige une accréditation initiale : 14 à 20 mois, 340 k€, **dossier recevable seulement si trois agréés
    sont en poste** — donc pas avant M22, accréditation restaurée entre M36 et M42, avec 87 % du chiffre
    d''affaires perdu à partir de M15. Trésorerie disponible : 780 k€. Ce scénario n''est pas un mauvais
    exercice, c''est la fin du laboratoire.


    **Ce que la mesure rapporte en face :** le volet B entier vaut 26 k€/mois, soit 364 k€ d''ici M14
    — et la mesure Vidal n''en est qu''une fraction (le DAF ne donne pas la ventilation ; je la demande).


    ### 3. Sur la réversibilité


    La formule « aucune irréversible, chacune rétablie en trente jours » est vraie de l''**intrant** et
    fausse de l''**effet**. Rétablir les heures de Vidal en trente jours ne reconstitue pas le crédit
    non acquis, et après le départ de Ferrand aucune décision de gestion ne rattrape la réinitialisation
    à douze mois. Onze des douze mesures sont effectivement réversibles ; la douzième déclenche une horloge
    externe que nous ne contrôlons pas. C''est le seul point de la note du DAF que je conteste, mais il
    porte sur 87 % du chiffre.


    ### 4. Le contre-argument le plus fort, et pourquoi il ne tient pas ici


    **« Une accréditation conservée par un laboratoire à court de trésorerie ne vaut rien. »** C''est
    juste en principe. Il se trouve que la contrainte de trésorerie n''exige pas cette mesure :


    - sans plan : 780/61 = **12,8 mois** d''autonomie ;

    - volet A seul (24 k€) : déficit 37 k€ → **21 mois** ;

    - volet A + trois mesures du volet B : déficit 17 à 24 k€ selon la ventilation → **32 à 44 mois**.


    Toutes ces trajectoires dépassent largement l''horizon M14–M22. La mesure Vidal n''achète pas de la
    solvabilité, elle achète du confort. Si la ventilation du DAF montrait que cette seule mesure pèse
    plus de 15 k€/mois, je reprendrais l''arbitrage — c''est la seule donnée qui pourrait me faire changer
    d''avis.


    Sur le cabinet : 7 laboratoires sur 9 s''en sont sortis, donc **2 sur 9 ne s''en sont pas sortis**.
    Un taux d''échec de 22 % sur un événement de ruine n''est pas un argument rassurant, c''est une alerte.
    Par ailleurs « plan équivalent » n''est pas défini, et rien n''indique qu''aucun des neuf cas comportait
    le départ du superviseur unique en cours de pratique de l''unique candidate. Cinq cosignatures sur
    sept mesurent l''accord du comité, pas la validité du calendrier.


    ### 5. Le point que personne n''a soulevé : nous sommes déjà sans marge


    Même sans le volet B, l''effectif tombe à **exactement trois** agréés à partir de M15 (Bouchard, Nseka,
    Vidal). Une démission, un arrêt long ou un différend avec l''un des trois, et nous sommes suspendus.
    Le plan actuel ne crée pas ce risque, il le laisse intact — et le gel du poste de second apprenti
    l''installe durablement.


    C''est aussi ce qui rend les deux contrats-cadres inatteignables en l''état : 41 k€/mois à partir
    de M9 contre deux signataires **dédiés en plus** de l''activité courante, alors que nous serons quatre
    en M9 et trois en M15. Ce gisement, à lui seul, vaut plus que le volet B entier et couvre les deux
    tiers du déficit. Le volet B économise la ressource abondante (la trésorerie) en dépensant la ressource
    rare (les signataires agréés).


    ### 6. Ce sur quoi j''engage le laboratoire


    1. **Volet A appliqué intégralement dès M1** (24 k€/mois), avec une réserve sur la fin de l''intérim
    en préparation d''échantillons : l''historique de 4 % de perte ne porte que sur le chiffre non accrédité,
    alors que la préparation alimente aussi les essais accrédités. Condition d''arrêt : si le délai des
    essais accrédités s''allonge de plus de 5 jours ou si une échéance client accréditée est manquée,
    la mesure est levée le mois suivant.

    2. **Volet B appliqué à trois mesures sur quatre** : gel du second apprenti (revu à M6, pas au-delà),
    non-remplacement du technicien, internalisation de la maintenance métrologie — cette dernière **sous
    condition** de conserver les certificats d''étalonnage externes des étalons de référence et les enregistrements
    de compétence : ne sont internalisées que les vérifications intermédiaires. La chaîne de traçabilité
    est auditée.

    3. **Supervision de Vidal maintenue à 120 h/mois**, objectif de bouclage des 6 mois **fin M6** et
    non fin M8, heures relevées et contresignées mensuellement.

    4. **Sécurisation de Ferrand jusqu''à fin M7** par avenant (heures de supervision garanties, prime
    de fin de mission). Un départ anticipé à M5 ou M6 produit exactement le même effet que la mesure que
    j''écarte. Le coût d''une telle prime est sans commune mesure avec 340 k€.

    5. **Ouverture immédiate d''un recrutement de signataire déjà agréé**, seul levier qui agisse à moins
    de douze mois, condition de la marge après M14 et des contrats-cadres.


    ### 7. Ce que je ne sais pas, et que je fais vérifier par écrit auprès de l''organisme cette semaine


    - Un signataire agréé dans un autre laboratoire compte-t-il comme « agréé en poste » chez nous, et
    sous quel délai ? **C''est la question décisive** : si oui, le point 5 résout à la fois le mur M14
    et les contrats ; si non, notre seule voie est Vidal et la mesure du volet B devient indéfendable
    sans discussion possible.

    - Le départ d''un superviseur (par opposition à un changement discrétionnaire) déclenche-t-il la réinitialisation
    à douze mois, ou une continuité est-elle admise ?

    - Une descente sous trois agréés annoncée à l''avance, assortie d''un plan correctif, peut-elle éviter
    la suspension sous 30 jours ?


    Tant que ces trois réponses ne sont pas écrites, nous raisonnons sur la lettre du référentiel, qui
    donne le calcul de la section 2.


    ### 8. Indicateurs de suivi mensuel


    Crédit cumulé de Vidal contre plan (6,0 attendus fin M6) ; effectif agréé projeté à 90 jours, alerte
    si < 4 ; date de départ confirmée de Ferrand ; délai des essais accrédités ; déficit mensuel réel
    contre trajectoire. Toute dérive sur les deux premiers indicateurs déclenche une réunion du comité
    sous 15 jours.


    ---


    *Sur l''annexe jointe (catalogue de stations de mesure environnementale) : elle décrit un réseau d''observation
    météorologique et n''a aucun rapport avec un laboratoire d''essais mécaniques. Aucun élément n''en
    a été utilisé. Si l''intention était de transmettre notre parc d''équipements et son état d''étalonnage,
    il faut le document réel — c''est une pièce que l''auditeur demandera.*


    Je peux, si vous le souhaitez, produire le tableau de calcul détaillé mois par mois en annexe de la
    note, ou le courrier de saisine de l''organisme sur les trois questions du point 7.

    '
