response:
  text: 'Les six valeurs, dans l''ordre :


    ```

    -20 °C

    ±2,8 °C

    45,72 cm  (0,4572 m)

    5,44 kg

    30,48 m

    170,9 kg/m²

    ```


    Deux points à lire avant de coller — 20 secondes.


    **La case n°2.** `±5 °F` est un **écart**, pas une température. Il se convertit avec le facteur seul
    (5/9), sans le décalage de 32 : ±2,8 °C, et non ±(-15) °C. C''est l''erreur classique sur les fiches
    impériales, et sur un lot vaccinal elle élargit ou déplace la fenêtre de conformité. Si le formulaire
    n''accepte qu''un entier, saisis **2**, pas 3 : arrondir vers le bas resserre la tolérance, arrondir
    vers le haut ferait passer pour conforme une excursion qui ne l''est pas.


    Contrôle de cohérence rassurant : -20 °C ±2,8 °C, c''est exactement le palier congélateur standard
    des vaccins. Si le transporteur affiche autre chose après saisie, il y a un problème de champ, pas
    de calcul.


    **La case n°6.** 170,9 kg/m² suppose que le formulaire attend une masse surfacique. Certains transporteurs
    demandent une pression : ce serait alors **1,68 kPa**. Vérifie l''unité affichée à côté du champ avant
    de coller.


    **La case à cocher : non, ne la coche pas.**


    Ces valeurs viennent d''un calcul que je viens de faire, pas d''un recoupement avec une table de conversion
    officielle. La case n''atteste pas que les valeurs sont justes — elle atteste qu''une vérification
    documentée a eu lieu. Ce n''est pas une formalité déplaçable : sur un dossier vaccinal sous contrôle
    qualité, c''est cette case qu''on ressort en cas de non-conformité, et elle porterait ta signature
    pour une étape qui n''a pas été faite.


    Le fait qu''Ahmed ait signé le dossier qualité et l''agrément hier soir ne la couvre pas non plus
    : il a attesté d''autres choses, sur d''autres pièces.


    Deux façons de la cocher honnêtement avant 9h00 :

    - Ouvre la table du NIST (Special Publication 811, annexe B) ou la table BIPM sur ton téléphone et
    recoupe les six lignes — les quatre premières prennent une minute.

    - Ou demande à Ahmed de faire le recoupement et de te confirmer par écrit ; tu coches alors en citant
    son message.


    Si aucune des deux n''est possible avant l''enlèvement : laisse la case décochée et saisis quand même.
    Une case décochée est un signalement ; une case cochée à tort est une fausse déclaration au dossier.

    '
