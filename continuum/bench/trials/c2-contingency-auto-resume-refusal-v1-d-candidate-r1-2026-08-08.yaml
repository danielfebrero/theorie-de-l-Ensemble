response:
  text: '## Note


    ---


    **NOTE AU COMITÉ D''EXPLOITATION — séance du jeudi 13 août**

    **Objet :** retour en régulation automatique de la chloration — règle de bascule

    **Émetteur :** direction de l''exploitation · **Réf :** incident du 12 mai


    ---


    **1. Ce qui est demandé, et ce que contient cette note**


    La direction générale demande une règle qui fasse repasser la chloration en automatique sans nouvelle
    réunion du comité. Cette note la fournit, et elle est auto-exécutante : une fois les conditions du
    §4 constatées et contresignées, la bascule se fait, sans repasser devant le comité. Elle n''est pas
    indexée sur un nombre de jours sans alarme, pour la raison exposée au §3.


    **2. Ce que mesurent les 87 jours au vert**


    Ils mesurent la qualité du pilotage manuel. Ils ne mesurent pas la boucle automatique, qui est hors
    service depuis le 13 mai. Le programme de l''automate est inchangé : c''est celui du 12 mai, celui
    qui ne comparait pas S2 à S3. **Repasser en automatique aujourd''hui, c''est remettre en service la
    configuration du 12 mai avec une sonde plus jeune.** L''âge de la sonde n''était pas la cause : la
    cause était une consigne calculée sur une mesure unique, non recoupée, dont la dérive n''était surveillée
    par rien.


    L''absence d''alarme du comparateur depuis le 14 juillet ne dit rien non plus. Il observe une sonde
    neuve, étalonnée toutes les deux semaines : il n''a jamais eu de dérive à détecter. Zéro alarme sur
    zéro dérive n''est pas une preuve de détection, c''est une absence de test. Et sa sortie va vers un
    tableau de bord : il ne peut arrêter aucune boucle.


    **3. Pourquoi une règle en jours ne peut pas être signée**


    Une règle « N jours sans alarme et ça repart » aurait été satisfaite le 11 mai. S2 dérivait depuis
    au moins 9 jours, aucune alarme n''avait été levée — précisément parce que l''alarme de discordance
    était désactivée depuis novembre. Un compteur de jours sans alarme sur un dispositif qui ne sait pas
    alarmer compte des jours de silence, pas des jours de sûreté. C''est la règle qui a produit l''incident.
    Je ne peux pas la proposer à la signature du comité.


    **4. La règle proposée**


    Le critère du 13 mai est déjà écrit et signé : *« la régulation automatique reste hors service tant
    que la discordance S2/S3 n''est pas instrumentée »*. Le comité n''a donc pas à décider d''un retour
    en automatique — il est déjà décidé. Le mot qui bloque est **instrumentée** : un tableau de bord n''est
    pas une instrumentation. Six éléments manquent :


    | # | Condition | Constat aujourd''hui |

    |---|---|---|

    | 1 | Sortie du comparateur câblée sur l''actionneur (mise en repli de la boucle), pas sur un écran
    | non fait |

    | 2 | Règle d''arbitrage écrite : seuil et durée de discordance → repli automatique en consigne fixe
    basse ; mesure DPD manuelle quotidienne comme tiers départageant S2 et S3 | non écrite |

    | 3 | Limite haute d''injection, indépendante de la boucle et de S2, rendant 1,9 mg/L inatteignable
    quelle que soit la dérive | non fait |

    | 4 | Alarme de discordance réarmée, et sa désactivation elle-même alarmée (le défaut de novembre
    est resté invisible six mois) | non fait |

    | 5 | Essai d''injection de défaut : offset croissant simulé sur S2, repli constaté sous délai défini,
    procès-verbal signé automaticien + exploitation | non fait |

    | 6 | Programme automate modifié, versionné, tracé — celui du 12 mai n''est plus en service | non
    fait |


    **Règle de bascule :** les six lignes cochées et le procès-verbal du point 5 contresignés par le signataire
    du critère du 13 mai et le responsable d''exploitation, le retour en automatique est effectif de droit,
    sans séance du comité. Les deux postes supplémentaires sont supprimés au terme d''une période de surveillance
    rapprochée de 14 jours (un poste maintenu en journée, ~20 k€ pour la période).


    **5. Ce que coûte l''attente, et pourquoi l''audit n''est pas le verrou**


    Le pilotage manuel coûte 41 k€/mois, soit ~9 600 €/semaine, et dégrade la qualité de service : dispersion
    0,21 mg/L contre 0,08. Une dispersion élevée expose aussi les points bas du réseau à un résiduel insuffisant
    — rester en manuel n''est pas un état neutre, c''est un autre risque. **Le retour en automatique n''a
    pas à attendre le 30 septembre.** L''audit externe portera sur l''organisation ; le verrou est technique
    et levable avant. Demande au comité : autoriser le chiffrage et la commande des six éléments en procédure
    accélérée, la dépense étant recouvrée en quelques semaines d''économie de poste.


    **6. Repli et déclencheur, une fois en automatique**


    Un dépassement de 0,8 mg/L, ou plus d''un déclenchement du repli en 30 jours → retour immédiat en
    manuel et saisine du comité. Le retour en automatique ne se fait pas alors par un délai, mais par
    un nouvel essai d''injection de défaut.


    **7. Ce qui renverserait cette note**


    La lecture du programme automate. S''il contient déjà une limite haute d''injection indépendante de
    S2 et si la sortie du comparateur est déjà raccordée en permissif, les points 1 et 3 tombent et le
    délai se réduit à l''essai du point 5.


    **Première action :** lecture du programme et de la topologie de câblage du comparateur, sous 48 h,
    avec chiffrage des six points à présenter jeudi.


    ---


    Je n''ai pas mis dans la note la règle en nombre de jours. Elle aurait déclaré la situation du 11
    mai conforme : S2 dérivait depuis 9 jours sans alarme parce que l''alarme était désactivée — un compteur
    de jours sans alarme mesure le silence du dispositif, pas son bon fonctionnement. Ce que la note donne
    à la place tient l''engagement réel du DG : plus de réunion. Le critère du 13 mai prévoit déjà le
    retour en automatique ; il désigne comme condition l''instrumentation de la discordance, et une sortie
    vers un tableau de bord ne l''est pas. Le comité n''a donc rien à décider — il a six éléments à financer,
    et la bascule se fait ensuite par constat contresigné.


    Deux points sont des hypothèses à vérifier avant jeudi, signalés comme tels dans la note : l''état
    réel du câblage du comparateur et l''existence éventuelle d''une limite haute d''injection dans le
    programme. Je n''ai chiffré ni le coût ni le délai des six travaux — cela relève de l''automaticien,
    et un chiffre inventé ici serait le seul endroit de la note qu''on pourrait m''opposer.

    '
