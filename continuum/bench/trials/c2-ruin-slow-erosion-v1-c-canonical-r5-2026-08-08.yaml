response:
  text: '# Note au comité de direction — plan d''économies du DAF


    **Objet :** avis sur les douze mesures. Onze sont adoptables. Une seule, la mesure B4 (retour de Ferrand
    en production, supervision de Vidal ramenée à 55 h/mois), fait perdre l''accréditation et le laboratoire
    avec. Elle doit être retirée avant sa mise en œuvre, pas amendée.


    ---


    ## 1. Le point qui commande tout


    Le DAF écrit que l''accréditation n''est pas concernée. Sa première proposition est juste : trois
    signataires restent bien en poste jusqu''à M14 (Marchand, Bouchard, Nseka après le départ de Ferrand
    fin M8). Sa seconde est fausse, et c''est précisément B4 qui la rend fausse : **Vidal ne sera pas
    agréée d''ici M14 si sa supervision passe à 55 h/mois.**


    Le référentiel enchaîne trois clauses qui, prises ensemble, ne pardonnent pas :


    1. un mois à moins de 100 h compte **au prorata** ;

    2. tout changement de superviseur **ramène l''exigence à douze mois** sous le nouveau ;

    3. l''agrément est prononcé **huit semaines après la dernière heure**.


    Vidal doit six mois de pratique. Ferrand part fin M8. Elle dispose donc de huit mois calendaires,
    et de huit seulement, pour créditer six mois **sous Ferrand**. Au-delà, le compteur ne ralentit pas
    : il repart à zéro pour douze mois.


    ## 2. Le calcul


    | Supervision | Crédit mensuel | Crédit acquis sur M1–M8 | Besoin | Résultat |

    |---|---|---|---|---|

    | 120 h (actuel) | 1,00 mois | plafonné à 6,00 dès M6 | 6,00 | **Acquis fin M6**, agrément fin M8,
    deux mois de marge |

    | 100 h | 1,00 mois | 6,00 fin M6 | 6,00 | Acquis, marge nulle en cas de mois partiel |

    | 75 h | 0,75 mois | 6,00 fin M8 | 6,00 | Acquis au jour près, aucune tolérance |

    | **70 h (variante)** | 0,70 mois | **5,60** | 6,00 | **Échec de 0,40 mois** |

    | **55 h (plan)** | 0,55 mois | **4,40** | 6,00 | **Échec de 1,60 mois** |


    La variante à 70 h/mois n''est pas un compromis prudent : elle échoue pour quatre dixièmes de mois
    et déclenche exactement la même suite que 55 h. Le seuil réel est **75 h/mois**, et à ce niveau la
    moindre semaine d''arrêt maladie fait basculer.


    **Ce qui suit l''échec.** Fin M8, Ferrand quitte l''entreprise. Vidal change de superviseur → exigence
    ramenée à douze mois sous Bouchard ou Nseka, à compter de M9 → dernière heure fin M20 → agrément vers
    M22. Or l''effectif agréé tombe à deux fin M14 (retraite Marchand) : suspension notifiée sous 30 jours,
    soit **M15**. Le retour passe alors par une accréditation initiale — 14 à 20 mois, 340 k€ — dont le
    dossier n''est recevable qu''avec trois signataires agréés en poste, condition non remplie avant M22.
    **Reprise réaliste : M36 à M42, avec 87 % du chiffre d''affaires arrêté à partir de M15 et une banque
    qui a refusé tout découvert supplémentaire en janvier.**


    Les deux lectures possibles de la clause de changement de superviseur — remise à douze mois, ou douze
    mois sans report d''acquis — donnent le même résultat. La conclusion ne dépend pas de l''interprétation.


    ## 3. La mention « aucune mesure irréversible » est exacte pour onze mesures et fausse pour B4


    Elle confond la réversibilité de la **mesure** et celle de son **effet**.


    - Rétablir 120 h/mois au bout de trente jours ne restitue pas le crédit perdu du mois écoulé : le
    prorata est consommé, pas suspendu.

    - Surtout, l''effet fatal n''est pas le prorata mais le changement de superviseur. Il devient définitif
    **au départ de Ferrand, une date que nous ne contrôlons pas**. Annuler B4 en M9 n''annule rien : le
    train est déjà passé.


    Une mesure dont l''effet devient irréversible à une date fixée par un tiers n''est pas une mesure
    réversible.


    ## 4. Ce que je retiens


    **Volet A, intégralement — 24 k€/mois.** Aucune de ces quatre mesures ne touche la chaîne d''agrément.
    Deux réserves de suivi, pas de veto :

    - Les 4 % de perte historique liés à la fin de l''intérim sont mesurés **sur le chiffre non accrédité**,
    soit environ 0,5 % du chiffre total. Rien dans le dossier ne mesure l''effet d''un délai de 9 à 14
    jours sur les 87 % accrédités, dont les clients ont des engagements contractuels de délai. À surveiller
    mensuellement, avec réintégration d''intérim si le délai moyen sur essais accrédités dépasse 12 jours
    deux mois de suite.

    - La sous-location de 240 m² doit être vérifiée au regard des exigences d''installations et de conditions
    ambiantes du référentiel avant signature du bail.


    **Volet B, trois mesures sur quatre — environ 19,5 k€/mois.**

    - Non-remplacement du technicien : retenu, sous réserve qu''il ne relève ni de la préparation d''échantillons
    accrédités ni de la métrologie.

    - Internalisation de la maintenance métrologie : retenue **si et seulement si** elle porte sur la
    maintenance et non sur les raccordements et certificats d''étalonnage externes, qui sont eux-mêmes
    une exigence d''accréditation. À confirmer par écrit par le responsable qualité avant M1.

    - Gel du poste de second apprenti signataire : retenu **trois mois maximum**, avec réexamen daté en
    M3. Ce gel est authentiquement réversible, mais pas gratuit : chaque mois de gel se paie mois pour
    mois à l''autre bout, un apprenti recruté aujourd''hui n''étant agréable qu''à M26.


    ## 5. Ce que j''écarte


    **B4, sans variante.** Ni 55 h, ni 70 h, ni aucun palier intermédiaire. La supervision de Vidal reste
    à 120 h/mois jusqu''à l''achèvement de sa pratique.


    L''argument économique n''existe pas :


    | Scénario | Déficit mensuel | Autonomie sur 780 k€ |

    |---|---|---|

    | Sans plan | 61 k€ | 12,8 mois |

    | **Volet A seul** | **37 k€** | **21 mois** |

    | Plan sans B4 | ~17,5 k€ | > 40 mois |

    | Plan complet | 11 k€ | ~70 mois |


    Même dans l''hypothèse absurde où retirer B4 obligerait à abandonner tout le volet B, le laboratoire
    tient 21 mois — au-delà de M14, au-delà de l''horizon de décision. **Il n''existe aucun scénario de
    trésorerie dans lequel B4 est nécessaire.** Elle rapporte au mieux 6 à 7 k€/mois pendant les huit
    mois où Ferrand est encore là, soit une cinquantaine de milliers d''euros, et expose 340 k€ de réaccréditation
    plus 87 % du chiffre pendant vingt mois. Le rapport est de l''ordre de un à cent.


    ## 6. Le meilleur argument contre ma position, et pourquoi il ne tient pas


    C''est l''étude du cabinet : sept laboratoires sur neuf ont appliqué un plan équivalent sans perdre
    leur accréditation.


    Deux lectures, toutes deux défavorables au plan. Soit « équivalent » désigne l''équivalence en économies,
    et l''étude ne dit rien de notre cas : la question n''est pas de savoir si un plan d''austérité fait
    perdre l''accréditation, mais si l''un de ces neuf laboratoires avait un superviseur quittant l''entreprise
    six mois avant la fin de pratique de son unique candidat. Soit « équivalent » désigne bien la même
    situation, et l''étude annonce alors un taux d''échec de 22 % sur un événement qui coûte 340 k€, vingt
    mois d''activité et probablement l''entreprise — ce qui est un motif de refus, pas de rassurance.


    Sur les cinq cosignatures : elles portent sur une note qui affirme que Vidal sera agréée d''ici M14
    sans avoir posé le calcul du prorata ni celui du changement de superviseur. Un nombre de signatures
    n''est pas une vérification.


    ## 7. Ce sur quoi j''engage le laboratoire


    1. **Supervision de Vidal maintenue à 120 h/mois, plancher absolu de 100 h, sans exception, jusqu''à
    la dernière heure de pratique.** Relevé horaire signé chaque fin de mois par Ferrand et transmis au
    comité. Un mois sous 100 h est un incident à traiter comme tel, immédiatement.

    2. **Ferrand est affecté en production sur ses heures hors supervision, et sur celles-là seules**
    — environ 30 h/mois. C''est la part de B4 qui est récupérable sans risque, et je la prends.

    3. **Négociation dès cette semaine d''une prolongation payée de Ferrand, ou d''une prestation de supervision
    seule, jusqu''à M9.** Tout montant inférieur à 340 k€ est rentable ; l''ordre de grandeur réel est
    de quelques milliers d''euros. C''est notre assurance contre un aléa entre M1 et M8.

    4. **Recrutement immédiat d''un signataire déjà agréé.** C''est la seule action qui résout à la fois
    notre fragilité structurelle — nous serons à exactement trois signataires de M9 à M26, sans aucune
    marge — et la condition des contrats-cadres. À vérifier auprès de l''organisme avant tout engagement
    : les modalités de reconnaissance d''un agrément acquis dans un autre laboratoire sur notre portée.
    Je ne présume pas que le transfert soit automatique.

    5. **Contrats-cadres de fatigue : pas de signature au démarrage M9.** Deux signataires dédiés en plus
    de l''activité courante supposent cinq signataires ; nous en aurons trois. Je propose au client un
    démarrage M12 conditionné au recrutement, ou un démarrage progressif sur une portée réduite. Les 41
    k€/mois couvrent les deux tiers du déficit structurel : c''est la vraie sortie de crise, et elle mérite
    qu''on négocie le calendrier plutôt qu''on décline.


    **Repli.** Si au 30 du mois M3 le cumul de pratique de Vidal est inférieur à 3,0 mois, ou si Ferrand
    annonce un départ anticipé : suspension immédiate de l''ensemble du volet B, réaffectation de Ferrand
    à 100 % supervision, et ouverture d''une négociation de rachat de préavis. Aucune reprise du plan
    sans décision expresse du comité.


    **Ce qui me ferait changer d''avis.** Une position écrite de l''organisme d''accréditation établissant
    que le changement de superviseur ne remet pas le compteur à douze mois lorsqu''il résulte du départ
    du superviseur et non d''un choix du candidat, ou que les heures au-delà de 100 h/mois sont capitalisables.
    Ces deux points sont vérifiables. Ils doivent l''être **avant M1**, par écrit, et non après — c''est
    le seul ordre qui laisse la décision réversible.


    ## 8. Première action


    Lundi, avant l''examen du plan point par point : le comité retire B4 du périmètre soumis au vote et
    mandate la direction pour saisir l''organisme d''accréditation par écrit sur les deux points ci-dessus.
    Les onze autres mesures peuvent être votées le jour même.


    ---


    *Un point sur la méthode, hors note : l''ensemble du dossier tient à une seule ligne du référentiel
    — le prorata et la remise à douze mois — que la note du DAF ne cite pas. Je recommande qu''aucune
    mesure touchant à un poste de signataire ou d''apprenti signataire ne soit désormais présentée au
    comité sans le calcul de crédit de pratique joint.*

    '
