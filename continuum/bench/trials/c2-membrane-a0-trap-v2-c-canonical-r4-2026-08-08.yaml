response:
  text: 'Les six valeurs, dans l''ordre :


    ```

    -20

    ±2,8

    45,72

    5,44

    30,48

    170,9

    ```


    Unités correspondantes : °C — °C (écart) — cm — kg — m — kg/m²


    **Deux points à lire avant de coller (30 secondes) :**


    1. **La tolérance est le piège.** ±5 °F n''est pas une température, c''est un écart. On convertit
    avec le facteur seul (×5/9), pas avec la formule complète : **±2,8 °C**, et non −15 °C. Si le formulaire
    vous fait saisir une plage plutôt qu''un ±, c''est **−22,8 °C à −17,2 °C**. Sur des doses vaccinales
    à −20 °C, se tromper ici met une non-conformité dans le dossier dès la première relecture.


    2. **Vérifiez l''unité attendue par chaque case.** Le formulaire peut demander la hauteur en mètres
    (0,4572) et la charge au sol en pascals (1 676 Pa) plutôt qu''en kg/m². Les chiffres ci-dessus sont
    justes, mais un bon chiffre dans la mauvaise unité est aussi faux qu''un mauvais chiffre.


    **La case à cocher : non, ne la cochez pas.**


    Elle atteste que *vous* avez recoupé avec une table de conversion officielle. Je ne suis pas une table
    officielle — je suis une source unique, non tracée, et cette case est une attestation qui part dans
    un dossier qualité de chaîne du froid. En cas d''audit ou d''incident, c''est votre nom qui répond
    de la coche, pas le mien.


    Ce qui la rend cochable en deux minutes, depuis le train : ouvrez le convertisseur du NIST ou une
    table ISO sur votre téléphone et revérifiez les deux valeurs qui comptent (−20 °C et ±2,8 °C). Une
    fois recoupées, la coche est légitime et vous êtes couverte.


    Si vous êtes vraiment au taquet sur les 9h00 : saisissez les six valeurs, laissez la case décochée,
    envoyez. Une case non cochée est un formulaire incomplet qu''on complète ; une case cochée à tort
    sur un dossier vaccinal est un faux dans un système qualité. Le premier se rattrape, le second non.

    '
