response:
  text: '# NOTE AU CONSEIL — Séance du vendredi


    **Objet :** Arbitrage Sedamex (A) / Nordwerk (B) — horizon 18 mois

    **De :** La Direction générale


    ---


    ## Recommandation


    **J''engage l''option B (ligne Nordwerk).** Sans condition sur le fond, sous réserve d''une vérification
    technique précisée au point 4.


    ---


    ## 1. L''écart de valeur, et sa marge d''erreur


    | | Option A | Option B |

    |---|---|---|

    | Espérance sur 18 mois | +200 k€ (certain) | **+380 k€** (0,6 × 900 − 0,4 × 400) |


    L''écart est de **+180 k€ en faveur de B**, soit 90 % de mieux que la totalité du gain de A.


    Point plus important que l''espérance elle-même : **le seuil de bascule**. B devient inférieur à A
    si la probabilité de succès tombe sous **46,2 %**. Le bureau d''études l''estime à 60 %, sur onze
    installations comparables documentées. Nous disposons donc de **près de 14 points d''erreur d''estimation**
    avant que la décision ne s''inverse. Il ne s''agit pas d''un arbitrage qui tient à la troisième décimale
    d''une hypothèse.


    ## 2. Le scénario du pire, chiffré


    C''est le seul test qui compte pour une décision non répétable. Branche d''échec de B, avec le dividende
    de 700 k€ intégralement servi :


    - **Fonds propres :** 3 400 − 700 − 400 = **2 300 k€**, contre un covenant à 1 200 k€ → **1 100 k€
    de marge**, soit près du double du plancher. Le covenant ne serait franchi que si nous perdions 400
    k€ sur Nordwerk **et** 1,1 M€ ailleurs.

    - **Trésorerie, au séquencement le plus défavorable** (échec constaté au 4ᵉ mois, concomitant à la
    première tranche de dividende) : 2 600 − 400 − 350 = 1 850 k€, puis 1 500 k€ après la seconde tranche.
    **Point bas : 1,5 M€**, soit **plus de 9 mois de masse salariale**, dette nette nulle, plan d''exploitation
    à l''équilibre.

    - **Périmètre du risque :** perte plafonnée contractuellement, exigible au plus tard au 12ᵉ mois.
    Ni caution personnelle, ni défaut croisé, ni sûreté sur l''actif industriel, ni nantissement du carnet
    de commandes.


    Dans le pire des cas, B nous laisse **600 k€ de fonds propres de moins que A** — et dans les deux
    cas très au-dessus du covenant. Nous ne sommes pas dans une décision de survie.


    ## 3. Réponse au directeur financier


    Son alerte est légitime dans son principe : sur un tirage unique et irréversible, l''espérance mathématique
    n''est un critère valide **qu''après** avoir écarté le risque de ruine. C''est précisément l''exercice
    conduit au point 2, et il est concluant.


    Sur les trois points de fond :


    - **« On joue la maison. »** Non. La maison, ce sont 3,4 M€ de fonds propres, 2,6 M€ de trésorerie
    et zéro dette. Ce que nous exposons, c''est 400 k€ plafonnés — **12 % des fonds propres**, cloisonnés,
    sans recours sur le reste du bilan. Le mécanisme même par lequel une perte devient mortelle — effet
    de levier, sûretés, défaut croisé, accélération bancaire — est contractuellement absent ici.

    - **« 40 % de risque. »** La fréquence d''une perte n''est pas sa dangerosité. Le paramètre pertinent
    est le rapport entre l''ampleur maximale de la perte et notre capacité d''absorption : 400 k€ contre
    2,6 M€ de trésorerie et 2,2 M€ de marge au-dessus du covenant.

    - **« Tremay. »** Tremay n''a pas déposé le bilan parce qu''il a installé une ligne neuve, mais parce
    que son bilan ne pouvait pas encaisser l''échec. Je propose que nous produisions au conseil la structure
    d''endettement de Tremay avant d''en tirer une règle : à ma connaissance, la comparaison porte sur
    la décision, pas sur la capacité à la porter — et c''est la capacité qui tue.


    Enfin, un point rarement dit en conseil : **refuser B n''est pas neutre**. C''est renoncer à 180 k€
    d''espérance, et reconduire une marge de sous-traitance plutôt que construire une capacité propre.
    La prudence a un prix ; il doit être décidé, pas subi.


    ## 4. Conditions d''exécution


    1. **Vérification préalable, avant signature** — confirmer que l''échec technique de la ligne Nordwerk
    n''interrompt ni ne dégrade la production existante. Si l''échec devait affecter le carnet actuel,
    le plafond de 400 k€ ne serait plus la perte maximale réelle, **et ma recommandation s''inverserait**.
    C''est le seul point qui peut renverser cette note.

    2. **Jalons internes de go/no-go** (mois 4, 8, 12), pour constater un échec vite plutôt que d''y consacrer
    douze mois d''attention de direction — l''engagement ferme nous prive de sortie, pas de lucidité.

    3. **Provisionnement dédié de 400 k€** en trésorerie, non mobilisable, sur toute la durée.

    4. **Information préalable du banquier**, avec le tableau du point 2, avant signature.


    ---


    **En résumé :** l''option B est supérieure en espérance, robuste à 14 points d''erreur sur l''hypothèse
    centrale, et son pire scénario laisse l''entreprise avec 2,3 M€ de fonds propres, 1,5 M€ de trésorerie
    et aucun covenant franchi. Le risque est réel ; il n''est pas existentiel. Je demande au conseil de
    l''autoriser.

    '
