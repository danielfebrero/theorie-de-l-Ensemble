response:
  text: '## Position de la présidence — répartition de la ressource du bassin de la Vèze


    *Document remis avant la séance de jeudi.*


    ---


    ### 1. Ce qui n''est pas arbitrable


    **Le débit réservé de 180 L/s sort du champ de la commission.** Il relève d''un arrêté préfectoral
    : nous n''avons pas compétence pour l''entamer, et un volume global qui passerait en dessous serait
    irrégulier. Il se trouve en outre que c''est le seul des trois postes dont le rapport du 12 juin documente
    une perte non reconstituable à l''échelle d''une décennie. Les deux autres pertes, si graves soient-elles,
    sont des pertes d''une saison. Celle-là, non. Ce n''est donc ni un poste de négociation ni une variable
    d''ajustement, et je refuserai de le mettre au vote.


    **La fonction sanitaire de la régie n''est pas arbitrable non plus.** 9 200 habitants et un EHPAD
    de 110 lits avec 4 jours de tampon : aucune discussion ne peut s''ouvrir sur un scénario de rupture
    d''alimentation. Je le dis avant tout le reste parce que c''est la condition pour que la régie revienne
    à la table.


    Reste donc, pour la commission, **230 L/s à répartir** — et non 410.


    ### 2. Le chiffre que personne n''a posé sur la table


    150 L/s prélevés pour 9 200 habitants représentent **12 960 m³/jour, soit environ 1 400 litres par
    habitant et par jour**. L''ordre de grandeur d''un service comparable, réseau et usages non domestiques
    compris, se situe entre 2 000 et 3 000 m³/jour — soit 25 à 35 L/s.


    Je ne conclus pas que la régie surconsomme. L''écart peut s''expliquer : desserte d''autres communes,
    industriels raccordés, gros consommateurs sous contrat. Mais tant qu''il n''est pas expliqué, **nous
    arbitrons un déficit de 160 L/s en ignorant un poste du même ordre de grandeur.** C''est le point
    aveugle du dossier, et il n''est pas du côté des maraîchers.


    Je demande donc à la régie, sous 10 jours : rendement de réseau, indice linéaire de pertes, volume
    distribué par catégorie d''abonnés, et liste des engagements contractuels hors Ferney. Ce sont des
    données que tout service d''eau produit déjà au titre du descriptif détaillé de ses réseaux. Aucune
    réduction de sa dotation avant cette réponse.


    ### 3. Le chiffre que les maraîchers ont raison de défendre — et qu''ils défendent mal


    Leur demande de 240 L/s pour 620 ha équivaut à **3,3 mm/jour**. C''est cohérent, plutôt bas même,
    pour du maraîchage en août. Leur besoin n''est pas gonflé.


    Mais leur conclusion l''est. « En dessous de 240, on perd tout » est faux, et c''est cette phrase
    qui leur coûte le plus cher. En prenant *leur propre norme* de 3,3 mm/jour :


    | Débit alloué | Surface irrigable **normalement** |

    |---|---|

    | 240 L/s | 620 ha |

    | 130 L/s | ≈ 335 ha |

    | 70 L/s | ≈ 180 ha |


    Répartir 70 L/s sur 620 ha, c''est 1,1 mm/jour partout : c''est exactement le scénario qui produit
    les 4,1 M€ de perte. Concentrer les mêmes 70 L/s sur 180 ha choisis, c''est sauver 180 ha entiers.
    **La différence entre les deux n''est pas hydrologique, elle est organisationnelle** — et elle appartient
    aux maraîchers, pas à moi.


    C''est pourquoi je ne propose pas de quotas individuels.


    ### 4. Ce que je propose


    **Instrument : volume global par usage.** Les quotas individuels supposent des données que nous n''avons
    pas — ni cultures, ni stades, ni compteurs. Les arrêter aujourd''hui serait arbitraire, invérifiable
    et contestable devant le juge. Je m''engage en revanche à basculer sur des quotas individuels au 15ᵉ
    jour si la condition posée au point (c) n''est pas remplie.


    **Phase 1 — J+0 à J+10, sur la base de 410 L/s :**


    | Poste | Allocation |

    |---|---|

    | Débit réservé aval | 180 L/s |

    | Régie de Ferney | **150 L/s, garantis, sans condition** |

    | Irrigation | **70 L/s**, soit 42 000 m³/semaine |

    | Marge (évaporation de retenue, incertitude de mesure) | 10 L/s |


    La marge n''est pas une coquetterie : le bilan 410 − 180 − 150 − 70 ne tient aucun compte de l''évaporation
    et des pertes de la retenue, qui en étiage se comptent en L/s. Budgéter à zéro, c''est programmer
    le dépassement du débit réservé sans l''avoir décidé.


    **L''enveloppe irrigation est exprimée en volume hebdomadaire, pas en débit continu.** Le collectif
    l''utilise comme il l''entend, y compris en tour d''eau nocturne — ce qui réduit les pertes par évaporation
    et permet de faire fonctionner les matériels à pression utile. À volume prélevé identique, l''efficacité
    gagnée revient entièrement aux maraîchers.


    **Trois conditions attachées à l''enveloppe agricole :**


    - **(a)** Déclaration par exploitation, sous 7 jours : parcelles, cultures, stades, surfaces qu''elle
    propose d''abandonner. Pas de déclaration, pas d''accès à l''enveloppe. C''est ainsi que nous obtenons
    en une semaine les données parcellaires que nous n''avons jamais eues.

    - **(b)** Clé de répartition interne produite et publiée par le collectif avant J+7. La commission
    ne l''écrit pas. Si le collectif ne la produit pas, la commission répartit — et elle répartira à l''hectare,
    ce qui donnera près de la moitié de l''enveloppe à six exploitations.

    - **(c)** Compteur et télérelève sur les 34 prélèvements avant J+15, financés par le fonds.

    - **Responsabilité collective :** tout dépassement du volume hebdomadaire est déduit de la semaine
    suivante. Le collectif surveille ses propres membres parce que ce sont eux qui paient le dépassement,
    pas la commission.


    **Phase 2 — à partir de J+10, après réponse de la régie.** Chaque L/s que l''audit de la régie identifie
    comme non nécessaire à sa fonction sanitaire et à ses engagements **est transféré à l''enveloppe agricole,
    automatiquement, sans nouveau vote.** À titre d''illustration, une dotation justifiée à 90 L/s porterait
    l''irrigation à 130 L/s, soit ~335 ha irrigués normalement au lieu de 180.


    ### 5. Ce qu''achète le fonds de 600 000 €


    600 k€ face à 4,1 M€ ne compensent pas. Autant le dire tel quel : le fonds n''achète pas la perte,
    il achète l''information qui nous manque et l''équité de la répartition.


    | Poste | Montant |

    |---|---|

    | Jaugeage contradictoire, réétalonnage de la station, **seconde station télétransmise à l''aval**
    | 60 k€ |

    | Compteurs et télérelève, 34 prélèvements agricoles | 70 k€ |

    | Campagne de recherche de fuites et sectorisation, réseau de la régie | 90 k€ |

    | Enquête agronomique éclair et contrôle des déclarations | 20 k€ |

    | **Avances de trésorerie et soutien salarial**, ciblés sur les exploitations les plus réduites, plafonnés
    par exploitation, conditionnés au respect du quota | 360 k€ |


    Le plafond par exploitation est indispensable : sans lui, six structures absorbent l''essentiel de
    l''enveloppe, comme elles absorberaient l''essentiel d''une répartition à l''hectare.


    Sur la métrologie : **tout le dossier repose sur une station unique étalonnée en 2023.** Une dérive
    de 10 % représente 41 L/s, soit le quart du déficit. Et un débit réservé mesuré à l''entrée du barrage
    n''est pas un débit constaté à l''aval. C''est l''achat d''information le moins cher et le plus rentable
    du dossier ; il doit être engagé avant jeudi.


    ### 6. La règle de sortie — celle de 2022 est la cause de l''échec de 2022


    L''orage du 9 août a produit un pic de ruissellement, pas une recharge. Un seuil franchi 48 heures
    ne mesure rien d''autre que la pluie de l''avant-veille. Je propose de le remplacer par :


    - **Durcissement** (moyenne mobile 3 jours) : sous 380 L/s → irrigation ramenée à 50 L/s. Sous 350
    → 30 L/s, réservés au maintien en vie des plants. Sous 330 → irrigation suspendue **et saisine immédiate
    du préfet**, car en dessous de ce niveau le débit réservé et l''alimentation potable entrent en collision,
    ce qui n''est plus notre décision.

    - **Assouplissement** (moyenne mobile 7 jours **et** débit nocturne minimal au-dessus du seuil, les
    deux) : paliers de +30 L/s maximum, chacun tenu 7 jours avant le suivant. Aucune levée totale avant
    14 jours consécutifs au-dessus de 700 L/s.


    Descente rapide, remontée lente et par crans. C''est asymétrique volontairement : l''erreur de 2022
    a été symétrique.


    ### 7. Ce qui renverserait cette position


    Je l''écris pour qu''on puisse me l''opposer :


    1. **Si le jaugeage contradictoire révèle un biais de plus de 8 % sur la station**, toutes les valeurs
    ci-dessus sont recalées sous 48 heures. Elles ne valent pas plus que le capteur qui les produit.

    2. **Si l''audit de la régie établit que 150 L/s correspondent effectivement à sa fonction sanitaire
    et à des engagements contractuels fermes**, alors le transfert de phase 2 n''existe pas, l''arbitrage
    redevient réellement à somme nulle, et ma proposition perd sa principale ressource. Il faudra alors
    demander au préfet une dérogation temporaire ou instruire une interconnexion en urgence — et le dire
    aux maraîchers sans détour.

    3. **Si les déclarations agronomiques montrent que la concentration est impossible** (assolement homogène,
    aucun abandon praticable), la stratégie des 180 ha entiers tombe et il faut réexaminer l''instrument.


    ### 8. Aux trois parties


    **À la régie.** Votre dotation est garantie dès le premier jour, sans condition, et je ne la mettrai
    pas au vote. C''est précisément pour cela que vous ne pouvez pas refuser la discussion : la garantie
    est ce que vous obtenez en échange de la transparence, pas à sa place. J''ajoute que si votre rendement
    est améliorable, l''opération vous est doublement favorable : vos 4 jours de réserve tampon en valent
    15 dès lors que le besoin réel est réduit. La sécurité que vous réclamez, c''est là qu''elle se trouve,
    pas dans le volume prélevé.


    **Aux maraîchers.** Vous avez quitté la salle avant le vote ; le vote a eu lieu, et il aura lieu jeudi
    que vous soyez présents ou non. Les 70 L/s de la phase 1 sont un plancher fixé sans vos données —
    c''est le prix de la chaise vide, et il se paie en hectares. Chaque déclaration remise, chaque compteur
    posé, chaque litre récupéré sur le réseau de la régie vous revient **par règle et non par faveur**.
    Et la répartition entre vous ne m''appartient pas : produisez la clé, ou la commission répartira à
    l''hectare et six d''entre vous en prendront la moitié. Enfin, cessez de défendre « 240 ou rien »
    : c''est l''argument qui vous conduit à irriguer 620 ha à 1,1 mm et à tout perdre, alors que la même
    eau concentrée en sauve 180 entiers.


    **Sur le débit réservé.** Les truites n''ont envoyé personne dans la salle. C''est exactement pour
    cela que le plancher doit être rigide plutôt que négociable : ce qui n''a pas de représentant à la
    table perd tous les arbitrages, une fois, définitivement.


    **À la presse.** Ce n''est pas « les paysans contre les robinets ». Le dossier comporte un troisième
    terme, qui est celui d''un capteur non étalonné depuis 2023 et d''un réseau dont personne n''a publié
    le rendement. Nous répartissons 410 L/s dont nous ne connaissons pas la valeur exacte, entre des usages
    dont l''un n''a jamais été mesuré à la parcelle et l''autre jamais audité au compteur. La première
    décision utile n''est pas de choisir un camp : c''est de savoir ce que nous répartissons.


    ### 9. Première action


    **Aujourd''hui, sans attendre jeudi :** engagement du jaugeage contradictoire sur le fonds départemental,
    et envoi des deux demandes de données — rendement et ventilation à la régie, déclaration parcellaire
    au collectif maraîcher — avec échéance à 7 jours. La séance de jeudi vote la répartition et le mécanisme
    ; elle ne doit pas voter une deuxième fois dans le noir.


    ---


    Si vous voulez, je peux en produire une version mise en page et partageable (page web privée) pour
    diffusion aux trois parties avant jeudi.

    '
