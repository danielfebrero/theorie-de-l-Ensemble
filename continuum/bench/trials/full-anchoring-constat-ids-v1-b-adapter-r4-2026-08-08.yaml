  text: '# Avis — Renouvellement du marché logiciel de réservation et bornes de prêt

    **Comité de direction du 28 · Réseau des médiathèques de Val-de-Sarre**


    **En une phrase :** je recommande de reconduire avec l''éditeur, mais de refuser l''offre telle qu''elle
    est construite — trois ans signés avant le 30 — et de rapporter l''arbitrage sur la v4 à une séance
    tenue avant le 31 octobre, une fois obtenues quatre réponses écrites qui manquent aujourd''hui au
    dossier.


    Chaque point ci-dessous est autonome : le comité peut en écarter un sans invalider les autres. Les
    points **1**, **2** et **6** portent la recommandation ; les écarter la modifie. Les autres l''accompagnent.


    ---


    ## I. Ce que le dossier établit


    **1. Le dossier mélange deux pannes indépendantes, qui n''appellent pas la même décision.**

    Les 41 h d''indisponibilité sont un problème de matériel : 32 h sur les deux seuls sites équipés de
    bornes de 2015, aujourd''hui âgées de onze ans. Les réservations perdues sont un problème logiciel
    apparu en mars. Aucun des deux n''est en soi un argument sur le choix de l''éditeur : les bornes de
    2015 seront à remplacer quelle que soit l''option retenue, et un défaut apparu après une mise à jour
    se traite d''abord au titre du contrat en cours.

    *Repose sur :* la concentration des 32 h sur les deux sites de 2015, et la datation en mars du second
    problème (12 répondants, note de Rive-Sud, courbe des réclamations).

    *Renversé par :* une indisponibilité significative des bornes sur les cinq sites récents, ou un lien
    technique documenté entre le module de réservation et les bornes.


    **2. La rupture de mars est le fait le mieux étayé du dossier.**

    71 réclamations sur quatre mois contre 25 sur les huit autres : environ 18 par mois contre 3. C''est
    un signal objectif, indépendant du déclaratif. Il converge avec la ressaisie manuelle à Rive-Sud,
    engagée précisément à cette date.

    *Repose sur :* la répartition 71/25 des 96 réclamations.

    *Renversé par :* un changement de méthode de comptage des réclamations en mars, ou une cause externe
    concomitante (campagne d''inscriptions, portail usager modifié).


    **3. L''enquête interne est plus fragile que son chiffre ne le suggère.**

    61 % porte sur 43 répondants, soit environ 26 agents sur 62 — 42 % de l''effectif, pas 61 %. La datation
    en mars n''est le fait que de 12 répondants, soit 19 % des agents. 19 personnes n''ont pas répondu
    et on ignore de quels sites elles relèvent. L''enquête corrobore la rupture de mars ; elle ne la démontre
    pas seule.

    *Repose sur :* 43/62 et 12 répondants sur la datation.

    *Renversé par :* une répartition des répondants par site montrant une couverture complète des sept
    sites.


    **4. Le silence de Fontaine est une anomalie non résolue, pas une absence de problème.**

    Fontaine a les mêmes bornes de 2015 que Rive-Sud et figure dans les mêmes 32 h d''indisponibilité,
    mais ne signale rien. Trois lectures possibles : Fontaine ne remonte pas, la répartition des 32 h
    est très déséquilibrée entre les deux sites, ou Fontaine a un contournement local non documenté. Le
    dossier ne permet pas de trancher, et la lecture retenue change l''ampleur du problème.

    *Repose sur :* l''agrégation des 32 h sur « deux sites » sans ventilation.

    *Renversé par :* la ventilation mensuelle des 32 h par site — un seul tableau suffit.


    **5. La charge de ressaisie est réelle mais mesurée sur un seul site.**

    5 h par semaine à Rive-Sud depuis mars, soit environ 230 h par an, ~0,14 ETP. C''est du même ordre
    de grandeur que la remise de 12 % (≈ 6 700 € par an). Si la même charge existe ailleurs sans être
    déclarée, l''arbitrage change ; on ne le sait pas.

    *Repose sur :* la note de site de Rive-Sud.

    *Renversé par :* un relevé de la charge de ressaisie sur les sept sites.


    **6. La remise de 12 % coûte plus cher qu''elle ne rapporte, dans sa forme actuelle.**

    Sous l''hypothèse d''une indexation de 7 % maintenue trois ans — seule la première année est annoncée
    —, le marché représente environ 165 000 € sur trois ans, ramenés à ~145 000 € avec la remise : un
    gain d''environ 20 000 €. En contrepartie, on s''engage trois ans sur un module dont le défaut de
    mars n''est ni qualifié ni corrigé, et sur une compatibilité v4/bornes 2015 encore « à l''étude ».
    **Le contrat court jusqu''au 31 octobre : ne pas signer le 30 ne crée aucune rupture de service.**
    Seule la remise est perdue, pas la continuité.

    *Repose sur :* échéance au 31 octobre, date-butoir de remise au 30, mention « à l''étude ».

    *Renversé par :* une réponse écrite de l''éditeur sur la compatibilité **et** un engagement contractuel
    de correction du défaut de mars, obtenus avant le 28.


    **7. Le comparatif du réseau voisin n''est pas exploitable en l''état.**

    30 % d''économie est un coût *annoncé*, non audité, et deux de leurs cinq sites tiennent encore un
    registre papier quatorze mois après la bascule : 40 % de la migration inaboutie. Ce registre papier
    est précisément le coût interne que le chiffre annoncé n''intègre pas.

    *Repose sur :* 2 sites sur 5 en double saisie à 14 mois.

    *Renversé par :* leur coût complet réel, charge interne comprise, et une explication des deux sites
    qui ne referme pas la question.


    **8. La capacité informatique est le facteur limitant de toutes les options.**

    Deux personnes, une qui part en octobre — le mois même de l''échéance. Toute bascule engagée dans
    cette fenêtre reposerait sur une personne. Le réseau voisin, à cinq sites, n''a pas achevé la sienne
    en quatorze mois. Nous en avons sept.

    *Repose sur :* le départ d''octobre et l''échéance du 31 octobre.

    *Renversé par :* un remplacement pourvu et opérationnel avant octobre, ou une assistance à maîtrise
    d''ouvrage externe budgétée.


    ---


    ## II. Recommandation


    **Reconduire avec l''éditeur, sur la durée la plus courte disponible — un an si l''option existe —,
    et non trois ans avant le 30.** L''arbitrage sur la migration v4 (31 000 €) est reporté à une séance
    tenue avant le 31 octobre, sur pièces.


    **Pourquoi pas la reconduction à l''identique sur trois ans :** elle achète 20 000 € de remise au
    prix d''un verrouillage de trois ans sur un défaut non qualifié et une compatibilité non répondue.
    On paie pour renoncer à un moyen de pression au moment précis où l''on en a besoin.


    **Pourquoi pas la bascule vers le libre maintenant :** ce n''est pas un jugement sur la solution,
    c''est un jugement sur la fenêtre. Sept sites, une personne à l''informatique à partir d''octobre,
    une échéance au 31 octobre, et un comparable dont 40 % de la migration reste inachevée à quatorze
    mois. L''option reste ouverte pour le cycle suivant — c''est même une raison de préférer un an à trois.


    **Pourquoi la v4 reste le scénario de référence sans être décidée aujourd''hui :** si l''éditeur confirme
    par écrit que la v4 corrige le défaut de mars et fonctionne avec les bornes de 2015, 31 000 € est
    un montant proportionné. Si la compatibilité n''est pas acquise, la v4 ne se justifie plus seule —
    et le remplacement des bornes de 2015 devra de toute façon être budgété en ligne distincte, indépendamment
    du logiciel retenu.


    ---


    ## III. Ce que j''engage


    **Avant la séance du 28 — pour que le comité puisse arbitrer la question de la remise en connaissance
    de cause (échéance : le 22)**


    1. Demander à l''éditeur, par écrit, une réponse ferme sur la compatibilité v4 / bornes 2015 : oui,
    non, ou date d''engagement. *(direction + informatique)*

    2. Ouvrir un signalement formel de dysfonctionnement au titre du contrat en cours sur la mise à jour
    de mars, avec demande de délai de correction. Cela établit si le défaut est une régression relevant
    de l''éditeur ou une limite de conception. *(informatique)*

    3. Demander le maintien de la remise jusqu''au 15 octobre, ou son équivalent sur un engagement d''un
    an. Réponse écrite. *(direction)*

    4. Obtenir la ventilation mensuelle des 32 h entre Fontaine et Rive-Sud. *(informatique)*

    5. Extraire la courbe mensuelle des 96 réclamations, **en particulier juillet** : si juillet est revenu
    autour de 3, l''incident est retombé et l''urgence n''est pas celle qu''on croit ; s''il est resté
    à 15, il est toujours ouvert. *(accueil / qualité)*


    **Dans les quinze jours suivant la séance (jusqu''au 12 septembre)**


    6. Relevé de la charge réelle de ressaisie sur les sept sites, deux semaines, comptage simple — ferme
    l''angle mort de Fontaine et des 19 non-répondants.

    7. Entretien avec la DSI du réseau voisin : coût complet réel, et motif des deux sites restés au papier.

    8. Saisine RH sur le remplacement du poste informatique d''octobre : c''est la contrainte qui commande
    les trois options.

    9. Inscription du renouvellement des bornes de 2015 en ligne budgétaire distincte, dissociée du choix
    logiciel.


    ---


    ## IV. Ce que cet avis ne tranche pas


    La cause technique des réservations perdues — le dossier permet de dater le problème, pas de l''expliquer.
    Le coût réel de la solution libre. Et la question de savoir si Fontaine va bien ou se tait : c''est
    le point 4, et c''est le moins cher à lever de tout le dossier.

    '
