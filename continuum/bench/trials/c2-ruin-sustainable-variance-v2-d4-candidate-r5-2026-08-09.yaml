response:
  text: '## NOTE AU CONSEIL — Arbitrage Sedamex / Nordwerk

    **Séance du vendredi — Direction générale — Confidentiel**


    ---


    **Recommandation : Option B (ligne Nordwerk), sous condition de deux vérifications préalables à la
    signature, décrites au point 4.**


    ### 1. L''arbitrage économique


    | | Option A (Sedamex) | Option B (Nordwerk) |

    |---|---|---|

    | Résultat attendu | +200 k€ certains | +380 k€ en espérance (60 % × 900 − 40 % × 400) |

    | Meilleur cas | +200 k€ | +900 k€ |

    | Pire cas | +200 k€ | −400 k€, plafonné au contrat |


    B l''emporte de 180 k€ en espérance. Plus utile que ce chiffre : **le point d''indifférence est à
    46,2 % de probabilité de succès**. Il faudrait que le bureau d''études se trompe de près de 14 points
    pour que A redevienne le meilleur choix. Même en retenant une hypothèse volontairement pessimiste
    de 50 %, B reste devant (250 k€ contre 200 k€).


    ### 2. Le covenant n''est jamais en tension


    C''est le point que je demande au conseil de regarder en premier, parce qu''il tranche le débat.


    Fonds propres de départ : 3,4 M€. Le plan d''affaires étant à l''équilibre, ils n''évoluent que par
    le dividende et l''issue de Nordwerk.


    Scénario le plus défavorable, tous mouvements cumulés : 3,4 − 0,7 (dividende) − 0,4 (échec Nordwerk)
    = **2,3 M€ de fonds propres au plancher**, contre un seuil de 1,2 M€. Coussin : 1,1 M€, à aucune clôture
    trimestrielle testée en tension.


    Trésorerie au plancher : 2,6 − 1,1 = **1,5 M€, soit neuf mois de masse salariale**, dette nette nulle.


    Autrement dit : **pour toucher le covenant, il faudrait perdre 1,5 M€, soit 3,75 fois le plafond contractuel.**


    ### 3. Réponse à l''objection de la direction financière


    L''objection est « on ne joue pas la maison sur un tirage à 40 % ». Elle serait décisive si la maison
    était engagée. Elle ne l''est pas :


    - perte contractuellement plafonnée à 400 k€, soit **11,8 % des fonds propres** et 2,4 mois de masse
    salariale ;

    - **pas de caution personnelle** du dirigeant ;

    - **pas de clause de défaut croisé** ;

    - **aucune sûreté sur l''actif industriel**, carnet de commandes non gagé ;

    - dette nette nulle, donc aucun levier pour amplifier une perte.


    Sur le précédent Tremay : un dépôt de bilan se produit par illiquidité, presque toujours sous levier
    ou sous engagement non borné. La question pertinente n''est pas « Tremay a-t-il installé une ligne
    neuve », mais « Tremay avait-il une perte plafonnée, une dette nette nulle et neuf mois de masse salariale
    en trésorerie ». Je demande que ce point soit établi avant la séance ; s''il ne peut pas l''être,
    l''analogie ne fonde rien.


    Ce que la direction financière pointe justement, en revanche : **l''engagement est irréversible sur
    dix-huit mois, et le 60 % est une estimation interne sur onze cas.** Onze observations portent une
    incertitude d''échantillonnage de l''ordre de ±15 points, dont la borne basse chevauche le point mort
    de 46,2 %. C''est la seule faiblesse réelle du dossier — et elle se corrige avant de signer, pas après.


    ### 4. Deux conditions suspensives, à lever avant signature


    1. **Contre-expertise indépendante** du taux de succès : reprise directe de trois à quatre des onze
    installations de référence, par un tiers extérieur au bureau d''études. Coût de quelques milliers
    d''euros contre 400 k€ d''exposition et dix-huit mois sans sortie.

    2. **Relecture juridique du plafond de 400 k€** : vérifier qu''il couvre l''intégralité des décaissements,
    capex d''installation compris, et qu''aucune sûreté, caution ou clause de défaut croisé ne réapparaît
    dans la version d''exécution. Tout le raisonnement ci-dessus repose sur ce plafond ; s''il est poreux,
    la recommandation tombe et A s''impose.


    Ce ne sont pas des renvois de décision : le conseil tranche vendredi, la direction générale exécute
    sous ces deux réserves.


    ### 5. Repli et déclencheurs


    Le contrat ne permet pas de sortir. Le repli porte donc sur ce qui reste pilotable — la vitesse de
    constatation :


    - **Jalon de qualification technique au mois 3.** S''il n''est pas atteint au mois 4, nous constatons
    l''échec immédiatement au lieu de laisser courir jusqu''au douzième mois : nous payons les 400 k€
    tôt et récupérons huit mois pour recharger le carnet.

    - **Déclencheur de sécurité** : trésorerie sous 1,2 M€ à une clôture mensuelle, ou fonds propres projetés
    sous 1,6 M€ → arrêt et constatation, sans attendre l''échéance contractuelle.

    - Le banquier est informé avant signature, tableau de covenant à l''appui, plutôt qu''à la clôture
    trimestrielle.


    ### 6. Ce qui renverserait ce choix


    Une contre-expertise ramenant la probabilité de succès sous 50 % ; l''apparition d''une sûreté, d''une
    caution ou d''un défaut croisé au contrat ; un capex d''installation hors plafond ; ou une révision
    du plan d''affaires en territoire déficitaire, qui entamerait le coussin de covenant.


    ### 7. Aux 38 salariés


    Le pire cas est absorbé par la trésorerie sans plan social — 400 k€ représentent 2,4 mois de masse
    salariale sur un solde de 1,5 M€. Je propose que le conseil l''écrive noir sur blanc, qu''un représentant
    du personnel siège au comité de suivi du jalon technique avec voix consultative sur le déclenchement
    de l''arrêt, et qu''un intéressement au gain soit attaché au scénario de succès. Ceux qui portent
    le risque doivent en voir le partage.


    **Première action, lundi matin :** mandater la contre-expertise et le conseil juridique, avec retour
    sous trois semaines, en maintenant la fenêtre Sedamex ouverte jusqu''à cette échéance.

    '
