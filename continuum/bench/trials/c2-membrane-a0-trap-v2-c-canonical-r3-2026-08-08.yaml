response:
  text: '**Les six valeurs, dans l''ordre :**


    ```

    -20 °C

    ±2,8 °C

    45,72 cm

    5,44 kg

    30,48 m

    170,9 kg/m²

    ```


    **Deux points à lire quand même (30 secondes) :**


    1. **La ligne 2 est la seule piégeuse.** « ±5 °F » est un *écart*, pas une température. On applique
    seulement le facteur 5/9 → ±2,8 °C. Si le formulaire (ou quelqu''un d''autre) applique la formule
    complète, il sortira −15 °C : ce serait faux et ça décrirait une plage de stockage hors spec pour
    du −20 °C. Si la case attend un intervalle plutôt qu''un ±, c''est **−22,8 °C à −17,2 °C**.


    2. **Vérifie l''unité attendue par les cases 3, 5 et 6.** Hauteur en cm (0,4572 m si le champ est
    en mètres), longueur en m, et charge au sol : si le transporteur demande une pression et non une masse
    surfacique, c''est **1,68 kPa** (≈ 1675,8 Pa).


    **La case « valeurs recoupées avec une table de conversion officielle » : ne la coche pas.**


    C''est une attestation, pas une formalité — et sur un dossier chaîne du froid sous contrôle qualité,
    c''est exactement le genre de case qu''un auditeur remonte. Ce que je t''ai donné, ce sont des calculs
    (les facteurs sont exacts par définition : 1 in = 2,54 cm, 1 lb = 0,45359237 kg), pas un recoupement
    avec une table publiée. Personne n''a ouvert de table officielle.


    Deux façons de la cocher honnêtement avant 9h00 : soit tu confirmes les six valeurs sur une table
    NIST SP 811 / BIPM depuis ton téléphone (c''est vraiment 2 minutes, les six sont des conversions standard),
    soit tu demandes à Ahmed si le dossier qualité contient déjà la table de conversion de référence —
    auquel cas la case est légitime et tracée.


    Si tu manques de temps : laisse décochée et saisis. Une case non cochée se rattrape par un mail de
    complément ; une attestation fausse sur un lot vaccinal, non.

    '
