response:
  text: '# Position de la présidence — répartition de la ressource, étiage 2026


    *Document soumis à la commission locale de l''eau, séance de jeudi.*


    ---


    ## 1. Ce que je ne mets pas au vote


    L''addition du dossier — 240 + 150 + 180 = 570 — suggère un déficit de 160 L/s à partager entre trois
    demandeurs. C''est une erreur de cadrage, et elle est la source de l''impasse.


    Le débit réservé de 180 L/s n''est pas une demande. C''est une condition aux limites, pour deux raisons
    indépendantes :


    - **Juridique** : il est fixé par arrêté préfectoral. La commission n''a pas compétence pour l''amender.
    Un vote qui le rognerait serait nul, et exposerait chacun de nous personnellement.

    - **Physique** : le rapport hydrobiologique du 12 juin qualifie la perte, en dessous de ce seuil,
    de non reconstituable à l''échelle d''une décennie. Deux frayères asséchées ne se rachètent avec aucune
    ligne du fonds départemental. C''est la seule perte du dossier qui soit strictement irréversible.


    **Le déficit de 160 L/s est donc supporté par deux usages, pas par trois.** Irrigation et eau potable
    demandent ensemble 390 L/s ; 230 L/s sont disponibles. La coupe est de 41 % sur l''ensemble des deux.


    Je le dis ainsi devant les trois parties parce que c''est le seul point du dossier qui ne se négocie
    pas, et parce que le taire jusqu''au vote reviendrait à faire délibérer la commission sur un espace
    de décision qui n''existe pas.


    ---


    ## 2. Trois nombres portent toute la décision, et aucun n''est vérifié


    ### 2.1 Le 410 L/s


    Il provient d''une station unique, étalonnée pour la dernière fois en 2023. C''est précisément à l''étiage
    que les courbes de tarage dérivent le plus et s''extrapolent le plus mal. Toute la répartition est
    une division de ce nombre : une erreur de 10 % déplace 41 L/s, soit plus que ce que le fonds départemental
    peut acheter.


    **Un jaugeage contradictoire (moulinet ou dilution) coûte quelques milliers d''euros et prend trois
    jours.** C''est l''achat d''information au meilleur rapport du dossier.


    ### 2.2 Le 150 L/s de la régie


    150 L/s = 12 960 m³/jour pour 9 200 habitants, soit **1 409 litres par habitant et par jour**. La
    consommation domestique française se situe autour de 150 L/hab/j. Même en intégrant un tissu économique
    et un rendement de réseau médiocre, l''ordre de grandeur ne se referme pas.


    Je n''affirme pas qu''il y a gaspillage : je constate que ce nombre n''est étayé par rien au dossier,
    et que sa vérification est immédiate — un bilan volumétrique produit/facturé et un rendement de réseau
    existent dans toute régie. **Je les demande sous cinq jours.**


    ### 2.3 Le 240 L/s des maraîchers


    C''est, paradoxalement, la seule demande du dossier qui résiste au test d''ordre de grandeur : 240
    L/s sur 620 ha = 33 m³/ha/jour = **3,3 mm/jour**, soit en dessous de l''évapotranspiration d''un mois
    d''août. La demande est agronomiquement sobre.


    En revanche, la conséquence annoncée ne l''est pas. « En dessous de 240, perte de la récolte » décrit
    une falaise. La réponse d''un rendement à l''eau est une courbe continue, et elle diffère radicalement
    selon la culture et le stade. Une restriction de 50 % ne détruit pas 100 % de la valeur — sauf si
    l''eau est étalée uniformément sur 620 ha, ce qui est exactement ce qu''il faut éviter.


    ### 2.4 Le nombre absent : le stock


    Le dossier présente un bilan de débits pour un ouvrage qui est, par définition, un stock. **Quel volume
    utile la retenue de Sarcelle contient-elle aujourd''hui ?** Le seuil de décision est chiffrable :
    combler intégralement le déficit pendant les trois semaines sans pluie annoncées demanderait 290 000
    m³ ; sur huit semaines, 774 000 m³. Si le volume utile dépasse 250 000 m³, l''arbitrage de jeudi n''est
    pas celui que nous croyons tenir. Si la retenue est vide ou son marnage bloqué, il faut l''écrire
    noir sur blanc dans la délibération, car son absence du dossier est la première question que poseront
    les maraîchers.


    ---


    ## 3. La répartition que je propose


    | Usage | Demande | **Dotation** | Écart |

    |---|---:|---:|---:|

    | Débit réservé aval | 180 | **180** | 0 % |

    | Eau potable Ferney | 150 | **115** | −23 % |

    | Irrigation (34 exploitations) | 240 | **115** | −52 % |

    | **Total** | 570 | **410** | |


    Trois précisions qui font l''essentiel du dispositif :


    **Un plancher sanitaire inviolable de 45 L/s** est inscrit au bénéfice de la régie, de rang supérieur
    à tout autre usage, irrigation comprise. 45 L/s = 423 L/hab/jour : c''est très au-delà de la consommation
    vitale, de l''EHPAD, de la défense incendie et des besoins hospitaliers. C''est la garantie que la
    régie exige, et je la lui donne par écrit dès jeudi. **Ce que je refuse de garantir, ce sont les 105
    L/s qui ne sont pas ce plancher et que rien au dossier ne justifie.**


    **Les 115 L/s de la régie sont provisoires et de droit précaire.** Les leviers de la réduction sont
    disponibles sous 72 heures et ne demandent aucun travaux : modulation nocturne de pression (qui réduit
    simultanément la consommation et les fuites), suspension des usages municipaux non domestiques — espaces
    verts, lavage de voirie, stade, piscine —, restriction des usages individuels non essentiels. **Si
    le bilan volumétrique n''est pas produit à J+5, la dotation de la régie passe automatiquement à 95
    et l''irrigation à 135.** Le silence n''est pas une preuve de nécessité.


    **Le 115/115 n''est pas un partage symbolique.** Les deux usages reçoivent le même volume parce qu''aucun
    des deux n''a démontré, à ce stade, un besoin supérieur à l''autre au-delà de son plancher. La différence
    de taux de coupe reflète uniquement le fait que la régie partait d''une demande dont le tiers seulement
    est établi.


    ---


    ## 4. L''instrument : quotas individuels, et cessibilité


    Le règlement m''ouvre deux voies. Je propose **les quotas individuels**, et j''écarte le volume global
    par usage.


    **Pourquoi pas le volume global.** 34 exploitations dont 6 cultivent 48 % de la surface, aucun relevé
    de compteur, une enveloppe collective : c''est une course à la pompe que les six plus grosses gagnent,
    et que la commission ne peut ni constater ni sanctionner, faute de pouvoir attribuer un dépassement
    à quiconque. Ce serait reconduire en pire l''échec de 2022.


    **La clé de répartition.** La seule donnée objective disponible sans enquête est la surface déclarée.
    Les déclarations PAC et le registre parcellaire graphique existent : la commission ne les détient
    pas, la DDT les transmet en quelques jours. Je les demande dès demain.


    **Quota : 0,185 L/s/ha**, soit 16 m³/ha/jour, **notifié en volume hebdomadaire (112 m³/ha/semaine)**
    et non en débit instantané. Ce détail est décisif : un plafond de débit force le goutte-à-goutte uniforme,
    un volume hebdomadaire permet d''irriguer les bonnes parcelles les bons jours.


    **Cessibilité.** Toute exploitation peut céder tout ou partie de son volume hebdomadaire à une autre,
    par déclaration écrite à la commission 48 heures à l''avance, enregistrée au registre des substitutions.
    Rachat plafonné à +50 % du quota initial de l''acheteur.


    Voici la raison de fond de ce mécanisme, et c''est la phrase qui justifie l''ensemble de l''architecture
    :


    > **115 L/s permettent d''irriguer pleinement environ 300 hectares, ou d''en abîmer 620 à demi-dose.
    La commission ne sait pas lesquels sont les 300. Les maraîchers, eux, le savent.**


    La cession transfère la décision à ceux qui détiennent l''information — stades végétatifs, valeur
    des cultures, sensibilité au stress hydrique — sans les obliger à la révéler à une commission qui
    n''a ni le mandat ni les moyens de l''auditer. C''est aussi ce qui corrige l''injustice inhérente
    à une clé à l''hectare, aveugle aux cultures.


    **Sans compteurs relevés, un quota est un vœu.** Le dossier établit que la commission ne détient aucun
    relevé. Il faut savoir sous cinq jours si les compteurs existent et ne sont pas lus, ou s''ils n''existent
    pas : la réponse fait passer la ligne « comptage » du fonds de 15 000 à 60 000 €.


    ---


    ## 5. Les 600 000 € du fonds départemental


    | Poste | Montant |

    |---|---:|

    | Comptage des 34 exploitations + protocole de relevé hebdomadaire | 60 000 € |

    | Jaugeage contradictoire et ré-étalonnage de Sarcelle **+ station de contrôle du débit réservé à
    l''aval** | 40 000 € |

    | Recherche de fuites régie : sectorisation, prélocalisation acoustique, réparations d''urgence |
    150 000 € |

    | Compensation directe aux exploitations qui cèdent leur volume | 330 000 € |

    | Réserve | 20 000 € |


    **J''assume de ne pas mettre les 600 000 € en compensation**, et voici le calcul qui le justifie devant
    les maraîchers, qui sont les premiers à pouvoir le contester.


    1 L/s maintenu pendant huit semaines représente 4 838 m³, soit 2,6 hectares irrigués à pleine dose,
    soit environ **17 000 € de production sauvée**. Si la campagne de recherche de fuites libère 20 L/s
    pour 150 000 €, elle rend aux maraîchers ~340 000 € de production dès cette saison — davantage que
    si les mêmes 150 000 € leur avaient été versés — et elle les rend chaque année suivante. Les 330 000
    € de compensation, eux, ne couvrent qu''environ 15 % de la perte. **Le fonds n''a jamais été à l''échelle
    d''une perte de 4,1 M€ ; prétendre le contraire jeudi est le plus court chemin pour que la commission
    perde toute crédibilité en septembre.** Le fonds est un pont vers les dispositifs qui, eux, sont à
    l''échelle : calamité agricole, assurance récolte, dégrèvement de taxe foncière sur le non bâti, dossiers
    que je propose de déposer collectivement cette semaine.


    Un point également non négociable : **il n''existe aujourd''hui aucune mesure du débit réservé.**
    Nous mesurons ce qui entre au barrage et nous supposons ce qui sort. Nous imposons à deux usages une
    privation de 41 % au nom d''une obligation que personne ne vérifie. La station aval est la condition
    de légitimité de tout le reste.


    ---


    ## 6. La règle de sortie — le véritable enseignement du 9 août


    Le dispositif de 2022 a lu la bonne grandeur au mauvais endroit. Un orage a porté le débit à 520 L/s,
    la règle des 48 heures a levé les restrictions, et le débit est retombé à 340 en quatre jours. **Une
    impulsion qui se dissipe en quatre jours est du ruissellement de surface, pas une recharge de nappe.**
    La règle de 2022 a interprété la pluie comme la fin de la sécheresse ; elle mesurait un événement
    météorologique alors qu''il fallait mesurer un état hydrogéologique.


    Règle proposée :


    - **Aucune levée sur valeur instantanée.** Le critère porte sur la **moyenne journalière glissante
    sur 10 jours**, assortie d''un critère de **pente de récession** : le débit doit cesser de décroître,
    pas seulement passer un seuil.

    - **Levée conditionnée** à : moyenne 10 jours > 700 L/s **et** débit réservé constaté à l''aval avec
    marge **et** absence de récession marquée sur la période.

    - **Levée progressive** : les quotas remontent de 25 % de l''écart par palier de 10 jours. Jamais
    de retour intégral en une fois.

    - **Hystérésis asymétrique assumée** : le resserrement s''applique en 24 heures, le desserrement prend
    au minimum 40 jours. La ressource se dégrade plus vite qu''elle ne se reconstitue ; la règle doit
    être aussi asymétrique que le phénomène.


    ---


    ## 7. Replis, avec déclencheurs observables


    | Déclencheur (moyenne journalière) | Action, sous 24 h |

    |---|---|

    | Débit < 360 L/s | Irrigation ramenée à 65 L/s |

    | Débit < 250 L/s | Irrigation suspendue ; potable plafonnée à 70 ; réservé maintenu à 180 |

    | Débit < 225 L/s | Saisine immédiate du préfet — sous ce niveau, la question sort de la compétence
    de la commission, puisque seul l''arrêté peut être arbitré |

    | **Réserve tampon de la régie < 2 jours** | **Réallocation d''urgence depuis l''irrigation, immédiate,
    sans délibération** |

    | Bilan volumétrique régie non produit à J+5 | Potable → 95, irrigation → 135, automatiquement |


    La ligne « tampon < 2 jours » est la seconde garantie écrite donnée à la régie. Avec quatre jours
    de réserve et un EHPAD de 110 lits, toute incertitude sur ce point est inacceptable, et je préfère
    l''inscrire comme automatisme que la laisser dépendre d''une réunion.


    ---


    ## 8. Ce que je dis à chacune des trois parties


    **Aux maraîchers, qui ont quitté la salle.** Votre demande de 240 L/s est la seule du dossier qui
    tienne au test d''ordre de grandeur, et je l''écris dans la délibération. Vous êtes néanmoins l''usage
    le plus coupé, parce que vous êtes le seul dont la perte, si nous nous trompons, sera encore réparable
    dans dix-huit mois. Ce n''est pas un jugement sur votre bonne foi, c''est une hiérarchie de réversibilité.
    En contrepartie, quatre choses concrètes : le choix des quotas individuels plutôt que du volume global
    protège les 28 exploitations qui ne gagneraient pas une course à la pompe ; la cessibilité vous rend
    le choix des parcelles sauvées ; les 330 000 € vont directement à ceux qui cèdent, pas en saupoudrage
    ; et **deux des trois sièges du comité technique qui contrôlera le bilan volumétrique de la régie
    et le jaugeage de Sarcelle vous reviennent.** Vous ne serez pas consultés sur le nombre de la régie
    : vous l''auditerez. Le quota prend effet à J+3, pour permettre d''achever le tour d''eau en cours.


    **À la régie, qui refuse de discuter sans garantie.** Vous l''obtenez, dès jeudi et par écrit : un
    plancher de 45 L/s de rang supérieur à tout autre usage, et une réallocation automatique si votre
    tampon descend sous deux jours. Aucune coupure d''eau potable n''est possible sous ce dispositif.
    Ce que vous n''obtenez pas, c''est la garantie de 150 L/s, parce que 1 409 litres par habitant et
    par jour n''est pas un besoin établi mais un prélèvement constaté, et que je ne peux pas demander
    à 34 exploitations de perdre la moitié de leur récolte pour couvrir un nombre que personne n''a examiné.
    La charge de la preuve vous revient, sous cinq jours.


    **À la presse et au public.** « Les paysans ou les robinets » est faux, et c''est vérifiable dans
    la délibération : les robinets de Ferney ne sont à aucun moment menacés par ce dispositif. Le partage
    réel n''oppose pas deux populations, il oppose les usages vitaux — qui sont tous protégés — aux usages
    qui ne le sont pas et qu''aucune des deux parties n''a documentés. La rivière, elle, ne dispose d''aucun
    représentant dans la salle : c''est pourquoi son débit est la seule ligne que je place hors délibération.


    ---


    ## 9. Le meilleur argument contre ma position


    Je le formule aussi solidement que je peux, parce qu''il sera formulé jeudi.


    > *Vous coupez l''irrigation de 52 % sur la base d''un soupçon que vous ne documentez pas, tout en
    protégeant intégralement 180 L/s sur la base d''un rapport que vous n''examinez pas davantage. Vous
    êtes sceptique envers la seule partie qui supporte une perte économique, et crédule envers les deux
    parties administratives. Le 240 L/s est la seule demande du dossier qui passe le test d''ordre de
    grandeur ; le 150 L/s ne le passe pas ; le 180 L/s est un nombre administratif rond accompagné d''un
    rapport. La cohérence exigerait de les éprouver tous les trois.*


    **L''argument est juste sur la méthode, et il ne renverse pas la décision.** L''asymétrie n''est pas
    un jugement de crédibilité, c''est un jugement de réversibilité. Une coupe excessive de l''irrigation
    coûte de l''argent, partiellement compensable, entièrement rattrapable à la campagne suivante. Une
    coupe excessive du débit réservé coûte une décennie et rien ne la rachète. Une coupe excessive de
    l''eau potable coûte des vies dans un EHPAD à quatre jours de réserve. Face à des erreurs de coûts
    aussi différents, la symétrie de traitement serait une faute, pas une vertu.


    J''applique d''ailleurs la même exigence probatoire aux 180 L/s — mais **prospectivement** : je demande
    une réévaluation hydrobiologique pour la mi-septembre. Si elle établit qu''un abaissement temporaire
    de dix jours est récupérable, ces litres reviendront à l''irrigation. La charge de la preuve pèse
    sur celui qui veut abaisser, parce que le coût de se tromper entre-temps ne se répare pas.


    **Là où l''argument mord vraiment, je le concède.** Si le rendement du réseau de Ferney s''avère supérieur
    à 90 %, alors les 150 L/s sont un besoin réel, ma prémisse centrale est fausse, et j''aurai coupé
    l''irrigation de moitié pour financer un usage que je n''aurais pas su justifier. C''est pourquoi
    le bilan à J+5 n''est pas une formalité : c''est la charnière de tout le dispositif, il est assorti
    d''une sanction automatique, et le contrôle en est confié aux maraîchers.


    ---


    ## 10. Ce que j''assume, et ce qui me ferait changer d''avis


    **Le pire cas de mon option, et qui l''encaisse.** Environ 300 hectares sauvés, environ 320 abandonnés,
    soit de l''ordre de **2,1 M€ de perte**, ramenés à ~1,8 M€ après compensation, et de l''ordre de 45
    emplois saisonniers perdus. Cette perte est supportée par les maraîchers, et concentrée sur ceux qui
    cèdent leur volume — c''est la raison pour laquelle les 330 000 € doivent leur être versés directement
    et non répartis sur les 34.


    **Quatre observations renverseraient ce dispositif :**


    1. Un jaugeage contradictoire écartant le débit réel de plus de 10 % des 410 L/s → toute la grille
    est recalculée.

    2. Un volume utile en retenue supérieur à 250 000 m³ → le déficit devient franchissable sur les trois
    semaines critiques et l''arbitrage change de nature.

    3. Un rendement de réseau supérieur à 90 % à Ferney → ma prémisse tombe, et la ligne « fuites » du
    fonds avec elle.

    4. Une réévaluation hydrobiologique documentant la réversibilité d''un abaissement bref du débit réservé
    → ~20 L/s temporairement libérables.


    **Première action, aujourd''hui, avant la séance :** commander le jaugeage contradictoire de Sarcelle
    et la station de contrôle aval, et demander à la DDT le registre parcellaire des 34 exploitations.
    Il reste soixante-douze heures avant jeudi, et chaque nombre de ce document est un rapport à une mesure
    que personne n''a vérifiée depuis trois ans.


    ---


    *Si vous le souhaitez, je peux mettre cette position en page comme document partageable aux trois
    collèges avant jeudi.*

    '
