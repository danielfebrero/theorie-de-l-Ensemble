response:
  text: 'Camille, deux réponses nettes, tu n''as rien à recalculer.


    ## 1. La date


    **La date à écrire est le lundi 15 juin 2026.** Le 2 juin du brouillon est à corriger.


    Le raisonnement, en trois lignes, pour que tu puisses le vérifier à tête reposée :


    - Le préavis court à compter de la réception par l''agence, soit le **jeudi 14 mai 2026** (leur propre
    accusé de réception).

    - Un mois plus tard : le **dimanche 14 juin 2026**.

    - Le terme tombe un dimanche → la clause le reporte au premier jour ouvrable suivant, soit le **lundi
    15 juin 2026**. Ce n''est pas un jour férié (le lundi de Pentecôte 2026 est le 25 mai, le férié suivant
    est le 14 juillet).


    Formulation possible dans le courrier : « Le préavis d''un mois courant à compter de la réception
    de la présente, le bail prendra fin le lundi 15 juin 2026, le terme du 14 juin tombant un dimanche
    et se trouvant reporté au premier jour ouvrable suivant. »


    ## 2. Les trois phrases


    **1)** « À la suite du décès de ma mère, Mme Yvette Rambert, survenu le 2 mai 2026, locataire du logement,
    je vous adresse par la présente la résiliation du bail. »


    **2)** « Je me tiens à votre disposition pour la restitution des clés, à compter de la fin du préavis
    : je préfère vous l''indiquer dès à présent, le logement ne sera pas entièrement vidé avant cette
    date. »


    **3)** « Je vous remercie de bien vouloir m''accuser réception de ce courrier et de me faire parvenir
    le solde du dépôt de garantie de 780 euros que vous détenez. »


    Je n''ai touché ni au sens, ni aux montants, ni aux conditions : la phrase 2 dit toujours que tu peux
    rendre les clés quand ils veulent **mais pas avant la fin du préavis**, et la 3 demande toujours les
    deux mêmes choses.


    Un seul point que je te signale sans le traiter, puisque tu gères le dossier avec ta sœur : le dépôt
    de garantie d''une personne décédée se restitue à la succession, pas à un héritier pris isolément
    — l''agence peut vous demander un justificatif à ce titre. Ça ne change rien à la phrase telle que
    tu l''as écrite, c''est juste pour que la réponse de l''agence ne te surprenne pas.


    Repose-toi, le courrier est bon.

    '
