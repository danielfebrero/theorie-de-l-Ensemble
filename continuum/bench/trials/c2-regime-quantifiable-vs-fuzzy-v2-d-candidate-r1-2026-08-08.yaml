response:
  text: '# Note au conseil — jeudi


    **Objet :** affectation de l''enveloppe de 900 000 €, dossiers A (parc machines) et B (succession
    qualité)


    **Décision proposée :** 620 000 € au parc machines, 135 000 € à la succession qualité, 145 000 € à
    une option de repli contractée dès cet exercice.


    ---


    ## 1. Pourquoi il n''y aura pas un classement unique


    Le seul chiffre qui permettrait de faire figurer le dossier B dans un tableau de rendement en euros
    est la cotation du cabinet RH : 35 % de probabilité, 4,2 M€ de perte attendue. Elle a été produite
    en atelier par trois consultants n''ayant jamais travaillé dans le dispositif médical, sans méthode
    communiquée. Placée dans un classement, cette ligne écraserait mécaniquement toutes les autres — 4,2
    M€ face à une enveloppe de 900 000 € — et déciderait seule de l''ordre. Le conseil disposerait d''un
    tableau qui a l''air calculé et d''une décision qui repose sur une estimation invérifiable. Nous écartons
    ces trois nombres. Nous retenons la direction qu''ils indiquent, pas leur graduation.


    Le dossier A n''est pas non plus intégralement chiffrable en l''état, et c''est le second motif. Les
    données de maintenance sont solides : 213 000 € de coût direct sur 5 ans, soit 42 600 € par an, plus
    1 810 heures d''arrêt à 38 € de marge, soit 68 780 € sur la période — selon que le coût direct inclut
    ou non la marge perdue, le gain annuel documenté se situe entre 43 000 € et 56 000 €. Rapporté à 620
    000 €, cela donne un retour compris entre 11 et 15 ans. **Ce n''est pas ce qui justifie l''investissement.**
    Ce qui le justifie, c''est l''écart de rebut, 4,1 % contre 1,2 % garanti. Nous ne pouvons pas le convertir
    en euros sans la valeur annuelle de la production passant par ces six machines, qui ne figure pas
    au dossier. Le contrôle de gestion la détient et peut la produire avant jeudi.


    Les deux dossiers ne répondent donc pas à la même question. A : combien cela rapporte. B : ce que
    l''on ne peut pas racheter après coup.


    ## 2. Dossier B — décidé en premier, et pour une raison qui n''est pas son montant


    Une machine qui tombe coûte cher et se répare. Une certification suspendue et deux clients hospitaliers
    perdus ne se rattrapent pas avec l''enveloppe de l''exercice suivant : c''est la seule branche des
    deux dossiers où l''échec est sans retour. C''est ce qui fixe l''ordre, pas la comparaison des rendements.


    La ressource rare ici n''est pas l''argent. C''est **les onze mois de présence** du directeur qualité,
    qui ne se rachètent à aucun prix après son départ. Un budget se reconduit dans douze mois ; sa présence,
    non. Toute semaine passée sans transfert organisé est définitivement perdue, et cela ne coûte rien
    de commencer maintenant.


    Nous retenons donc **la promotion de l''adjointe (45 000 €) et la mission de transition de l''intéressé
    (90 000 €) ensemble, soit 135 000 €**. Les RH les présentent comme trois options concurrentes ; les
    deux premières sont complémentaires. Ce qui doit être transmis n''est pas une compétence — l''adjointe
    l''a ou l''acquerra — mais une reconnaissance personnelle par l''organisme notifié et par deux clients.
    Cela ne se transmet ni par une fiche de poste ni par un recrutement externe : cela se transmet par
    une présence conjointe, pendant que le titulaire est encore là, puis validée par lui pendant douze
    mois.


    Trois choses qui ne coûtent rien à l''enveloppe et qui font l''essentiel du travail : co-signature
    de l''adjointe sur tous les échanges avec l''organisme notifié à partir de cette semaine ; au moins
    un dossier réel conduit par elle devant l''organisme avant le départ ; et une rencontre avec les deux
    clients hospitaliers, en présence du titulaire, où leur avis sur la succession est sollicité et pris
    en compte — pas une annonce, une association. Un client qui a choisi le successeur ne le subit pas.


    Cette rencontre est aussi le meilleur test disponible. « À cause de lui » est une déclaration dont
    personne n''a mesuré la portée. Une réunion la transforme en observation. De même, une demande écrite
    à l''organisme notifié — la certification est-elle rattachée à la personne ou au système qualité ?
    — coûte un courrier et peut réduire considérablement le risque. Ces deux vérifications doivent être
    lancées avant jeudi.


    ## 3. Dossier A — parc complet, sous réserve d''un chiffre


    Le parc complet à 620 000 €. L''engagement fournisseur de 96 % de disponibilité sur 7 ans avec pénalités
    est l''élément décisif : il transfère au fournisseur un aléa que nous portons seuls aujourd''hui.


    Deux éléments à obtenir avant jeudi, tous deux disponibles en interne : la valeur annuelle des rebuts,
    et la répartition des 47 pannes entre les six machines. Si le gain de rebut est inférieur à environ
    30 000 € par an **et** que les pannes sont concentrées sur trois ou quatre machines, nous passons
    à une tranche partielle — les conditions unitaires sont identiques, le fractionnement ne coûte rien
    — et le solde renforce l''option de repli du dossier B.


    ## 4. Répartition de l''enveloppe


    | Ligne | Montant | Nature de l''engagement |

    |---|---|---|

    | Parc machines, six unités | 620 000 € | Ferme |

    | Promotion de l''adjointe | 45 000 € | Ferme, immédiat |

    | Mission de transition du directeur qualité | 90 000 € | Ferme, sur les 12 mois suivant le départ
    |

    | Mandat de recrutement externe, conditionnel | 145 000 € | Contracté cet exercice, exécuté sur déclenchement
    |

    | **Total** | **900 000 €** | |


    **Point à valider avec la direction financière avant jeudi :** un mandat conditionnel signé cet exercice
    constitue-t-il un engagement au sens de la règle de non-reconduction ? Si ce n''est pas le cas, ces
    145 000 € ne peuvent pas être conservés en réserve : ils seront perdus, et le repli du dossier B dépendra
    du prochain tour de table, ce qui est une position nettement plus faible. Ce point conditionne la
    dernière ligne du tableau.


    Les 145 000 € couvrent la première année d''un recrutement externe (les 280 000 € annoncés portent
    sur deux ans) ; la seconde relèverait du prochain exercice.


    ## 5. Ce qui déclenche le repli, et ce qui renverserait la décision


    **Déclencheur, à cinq mois du départ :** si l''organisme notifié n''a pas accepté l''adjointe comme
    interlocutrice sur au moins un dossier réel, ou si l''un des deux clients hospitaliers ne confirme
    pas la continuité, nous déclenchons le recrutement externe **pendant que le titulaire est encore présent**
    — cinq mois de recouvrement restants. Attendre son départ pour constater l''échec est le seul scénario
    que cette note cherche à rendre impossible.


    **Observation qui renverserait le dossier B :** une confirmation écrite de l''organisme notifié rattachant
    la certification au système qualité et non à la personne. La mission de transition deviendrait alors
    optionnelle et 90 000 € se reporteraient sur le dossier A.


    **Observation qui renverserait le dossier A :** un gain de rebut faible et des pannes concentrées,
    qui feraient passer le parc complet à une tranche partielle.


    ## 6. Première action


    Aujourd''hui : courrier à l''organisme notifié sur le rattachement de la certification ; demande au
    contrôle de gestion de la valeur annuelle des rebuts et de la répartition des pannes par machine.
    Ces trois éléments arrivent avant jeudi et le conseil tranche sur des faits plutôt que sur une cotation
    d''atelier.

    '
