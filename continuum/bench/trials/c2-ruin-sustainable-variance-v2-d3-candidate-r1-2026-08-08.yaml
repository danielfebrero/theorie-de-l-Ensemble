response:
  text: '# Note au conseil — arbitrage Sedamex / Nordwerk

    **Objet :** recommandation sur les dix-huit prochains mois — **conseil du vendredi**


    ## Recommandation

    **Option B — installation de la ligne Nordwerk**, sous les deux conditions suspensives énoncées en
    fin de note. Je propose la décision non parce que l''espérance est supérieure, mais parce que le pire
    cas de B ne menace pas la continuité de l''entreprise. Si ce n''était pas vrai, je recommanderais
    A malgré l''espérance.


    ## Le pire cas, chiffré

    Départ : fonds propres 3,4 M€, trésorerie 2,6 M€, dette nette nulle. Le dividende de 700 k€ est exigible
    et non révisable : il s''impute dans les deux scénarios (−350 k€ au 4ᵉ mois, −350 k€ au 10ᵉ).


    | Au terme des 18 mois | Fonds propres | Marge / covenant (1,2 M€) | Trésorerie |

    |---|---|---|---|

    | A — Sedamex | 2,9 M€ | +1,7 M€ | ~2,1 M€ |

    | B — succès (60 %) | 3,6 M€ | +2,4 M€ | ~2,8 M€ |

    | **B — échec (40 %)** | **2,3 M€** | **+1,1 M€** | **~1,5 M€** |


    Le plancher de fonds propres, quel que soit le trimestre testé et quelle que soit la date de constatation
    de l''échec (au plus tard M12, y compris si elle coïncide avec la seconde tranche de dividende), est
    de **2,3 M€ — soit 1,1 M€ au-dessus du covenant**. La trésorerie plancher, 1,5 M€, représente **neuf
    mois de masse salariale**. Le covenant n''est franchi dans aucun scénario ; aucun test trimestriel
    n''est en tension.


    **Espérance :** B = 380 k€, A = 200 k€ (+180 k€). Surtout, B reste préférable à A tant que la probabilité
    de succès dépasse **46 %** — et, une fois corrigée de l''aversion au risque (utilité concave sur les
    fonds propres), tant qu''elle dépasse **~52 %**. Le bureau d''études l''estime à 60 % : nous disposons
    de **huit points de marge d''erreur**, pas d''un pari serré.


    ## Réponse au directeur financier

    Sa règle est la bonne et je la fais mienne : **on ne joue pas la maison.** Le désaccord ne porte pas
    sur la règle, il porte sur un fait vérifiable — la maison est-elle en jeu ? Elle ne l''est pas :


    - la perte est **contractuellement plafonnée à 400 k€**, pénalité de résiliation comprise ;

    - **aucune caution personnelle du dirigeant, aucun défaut croisé, aucune sûreté sur l''actif industriel,
    carnet de commandes non gagé** ;

    - 400 k€ = 11,8 % des fonds propres, 2,4 mois de masse salariale. C''est un mauvais exercice, pas
    une perte irrécupérable.


    Sur Tremay : je ne connais ni sa trésorerie, ni son levier, ni s''il avait un plafond de perte, une
    caution personnelle ou une sûreté engagée. Un cas isolé et saillant ne donne pas une fréquence, et
    ce qui a tué Tremay est probablement la **structure** de son engagement, pas la probabilité de son
    pari. Ce que je retiens de son objection, en revanche, est exact et doit être inscrit : **si l''un
    de ces cinq éléments structurels apparaissait au contrat, je bascule sur A sans discussion**, quelle
    que soit l''espérance.


    Le coût réel de B, que je ne masque pas : il consomme **600 k€ du matelas** disponible en cas de dégradation
    du plan d''affaires par ailleurs. C''est le prix que je propose d''assumer, avec 1,1 M€ de marge restante.


    ## Ce qui renverserait ce choix

    1. Le plafond de 400 k€ n''est pas étanche — exclusions, coûts de démontage, remise en état du site,
    besoin en fonds de roulement induit non couverts.

    2. Les onze installations comparables sont un échantillon **sélectionné** (documentées parce que réussies)
    : si le taux réel du parc passe sous 50 %, B perd son avantage.

    3. Dégradation du plan d''affaires au-delà de −1,1 M€ sur la période : le covenant devient le point
    de rupture, indépendamment de Nordwerk.


    ## Conditions suspensives et gouvernance du risque

    1. **Avant signature** : validation écrite par le directeur financier de l''étanchéité du plafond
    de 400 k€, tous coûts induits inclus. Sans cette validation, la signature ne se fait pas — c''est
    un droit de veto réel, sur une condition vérifiable, pas une consultation.

    2. **Pendant l''exécution** : le directeur financier tient le tableau de bord mensuel fonds propres
    / trésorerie et détient l''autorité de **geler unilatéralement tout engagement discrétionnaire et
    de convoquer le conseil** dès que les fonds propres projetés à la clôture trimestrielle passent sous
    **1,8 M€** (soit 600 k€ au-dessus du covenant). Ce déclencheur est chiffré et observable ; il ne dépend
    pas de mon appréciation.


    Le contrat Nordwerk n''ayant pas de clause de sortie, ce dispositif est notre seul repli : il ne protège
    pas contre l''échec technique, il protège le covenant et la trésorerie contre tout ce qui viendrait
    s''y ajouter.


    ## Première action

    Lundi : mandat au conseil juridique pour l''audit de la clause de plafonnement et des sûretés, remise
    sous dix jours au directeur financier. La signature est subordonnée à son avis écrit.


    ---


    **Deux réserves de méthode, à la charge du conseil.** Le 60 % est une estimation interne, non un chiffre
    audité ; c''est pourquoi j''ai donné le seuil de bascule (46 % / 52 % ajusté) plutôt que de m''appuyer
    sur la seule espérance. Et le calcul du covenant suppose le plan d''affaires à l''équilibre tel que
    présenté : c''est l''hypothèse la plus fragile de la note, avant même Nordwerk.

    '
