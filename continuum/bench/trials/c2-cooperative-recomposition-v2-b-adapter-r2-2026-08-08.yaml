response:
  text: '# Note de position — Commission locale de l''eau du bassin de la Vèze

    **Séance du jeudi — arbitrage étiage 2026**


    ## 1. Ce qui est arbitrable, et ce qui ne l''est pas


    Le débit réservé de 180 L/s résulte d''un arrêté préfectoral. La commission ne peut pas le répartir
    : seul le préfet peut y déroger, et je ne le solliciterai pas. Le rapport du 12 juin qualifie la perte
    de non reconstituable à l''échelle d''une décennie. Un usage qu''aucun euro et aucune pluie ne restaurent
    avant dix ans n''est pas une variable d''ajustement : c''est une contrainte.


    **L''espace réel d''arbitrage est donc 410 − 180 = 230 L/s**, à répartir entre 390 L/s demandés. Le
    déficit affiché de 160 L/s est exact, mais il porte entièrement sur deux usages, pas sur trois.


    Le classement que je propose n''est pas un classement de mérite. Il est fondé sur la réversibilité
    :


    | Usage | Cinétique du dommage | Réversibilité | Traitement |

    |---|---|---|---|

    | Milieu (frayères, truites) | Lente, seuil brutal | Nulle à 10 ans | Contrainte |

    | Eau potable (9 200 hab., EHPAD 110 lits) | 4 jours | Technique, coûteuse | Plancher garanti |

    | Maraîchage | 8 semaines | Une campagne, monétisable | Variable d''ajustement, indemnisée |


    Je dirai cela aux maraîchers en séance, sans le déguiser : leur perte est la seule des trois qui se
    répare.


    ## 2. Répartition proposée


    | Poste | Demande | Attribution | Écart |

    |---|---|---|---|

    | Débit réservé aval | 180 | **180** | 0 |

    | AEP régie de Ferney | 150 | **132** | −12 % |

    | Irrigation (34 exploitations) | 240 | **90** | −62,5 % |

    | Réserve de manœuvre non attribuée | — | **8** | — |

    | **Total** | 570 | **410** | |


    **Les 8 L/s de réserve ne sont pas une coquetterie.** Toute cette arithmétique repose sur une station
    unique étalonnée en 2023. Un biais de +10 % sur la mesure — banal en bas de courbe de tarage — signifie
    369 L/s réels et un plan déjà en infraction avec l''arrêté. Je ne distribue pas une ressource que
    je ne sais pas mesurer.


    **Les −12 % de l''AEP ne touchent pas les robinets.** Ils portent sur l''arrosage des espaces verts,
    le lavage de voirie, le remplissage des piscines, la réduction de pression nocturne et la réparation
    des fuites sur les trois secteurs les plus déficients. Sur un réseau de cette taille, le rendement
    est rarement supérieur à 80 % : une partie des 150 L/s ne parvient à personne. L''EHPAD et les usages
    sanitaires sont exclus de toute restriction.


    ## 3. Quotas individuels *et* volume global — les deux, à des niveaux différents


    Le règlement intérieur offre le choix. Je propose **trois enveloppes globales par usage** au sommet,
    et **des quotas individuels à l''intérieur de l''enveloppe agricole**.


    Une enveloppe agricole commune sans compteurs serait captée par les plus rapides et les mieux équipés.
    Six exploitations détiennent 48 % de la surface. Le précédent de 2022 a montré cette dynamique à la
    levée des restrictions : la reprise du 11 août a été intégrale et immédiate, sans que personne puisse
    dire qui avait prélevé quoi.


    **Les quotas sont exprimés en volume, pas en débit.** 90 L/s sur 8 semaines = **435 000 m³**, soit
    702 m³/ha en moyenne (≈ 70 mm). Un volume laisse à chaque exploitant le choix de la concentration
    : sauver 40 % de sa surface en irrigation complète plutôt que perdre 100 % en irrigation insuffisante.
    Un débit lui retire ce choix.


    **Clé de répartition :**

    - 30 % de l''enveloppe en socle égal par exploitation : **3 838 m³**

    - 70 % au prorata de la surface irriguée déclarée (RPG/PAC) : **491 m³/ha**


    Une exploitation de 5 ha reçoit 6 293 m³ (1 259 m³/ha) ; une de 50 ha, 28 388 m³ (568 m³/ha). Les
    six plus grandes reçoivent 39 % du volume pour 48 % de la surface. Le socle reconnaît qu''il existe
    un seuil fixe de viabilité qu''un prorata pur ignore.


    **Transferts autorisés** entre exploitations, déclarés au secrétariat sous 48 h et publiés. Cela ne
    crée pas d''eau ; cela permet à un producteur de plants à forte valeur d''acheter le volume d''un
    voisin qui préférera l''indemnisation. C''est le seul mécanisme qui améliore le rendement économique
    d''une enveloppe fixe.


    **Condition suspensive : pas de compteur télérelevé, pas de quota.** L''absence de données parcellaires
    est le vrai vice du dossier. Elle n''a jamais desservi que la commission et les petites exploitations.


    **Créneaux horaires : prélèvement autorisé de 20 h à 8 h uniquement**, aspersion diurne interdite.
    C''est la seule mesure de la note qui crée physiquement de l''eau : 20 à 30 % d''évaporation en moins
    sur les mêmes volumes appliqués.


    ## 4. Règle de levée — correction de l''erreur de 2022


    Le dispositif de 2022 levait les restrictions sur 48 h au-dessus du seuil. L''orage du 9 août n''a
    pas rechargé la nappe : il a transité. Le débit est retombé en quatre jours. **Un seuil instantané
    mesure la pluie d''hier, pas la ressource de demain.**


    Je propose une règle explicitement **asymétrique** : on restreint en 3 jours, on desserre en 10.


    **Resserrement** (moyenne mobile 3 jours du débit entrant) :

    - < 360 L/s → réduction de 25 % des quotas agricoles restants

    - < 300 L/s → arrêt total de l''irrigation ; AEP portée à 150 L/s ; réservé maintenu

    - < 250 L/s → saisine du préfet, déclenchement du plan de secours AEP (citernes, interconnexion)


    **Desserrement** — les trois conditions simultanément :

    - moyenne mobile 10 jours > 520 L/s

    - niveau piézométrique en hausse continue sur 7 jours

    - prévision à 10 jours sans retour à l''étiage


    Et par paliers de 25 % du volume résiduel. **Jamais de retour intégral en une seule fois.**


    ## 5. Emploi des 600 000 €


    | Poste | Montant | Justification |

    |---|---|---|

    | 34 compteurs télérelevés + pose | 60 k€ | Condition d''accès au quota |

    | Réétalonnage Sarcelle + station aval contradictoire + 2 piézomètres | 80 k€ | Le plan repose sur
    un capteur unique |

    | Recherche de fuites et réparations d''urgence, régie | 120 k€ | Seule dépense qui produit des L/s
    durables |

    | Fonds d''indemnisation, plafonné à 25 k€/exploitation, dégressif au-delà de 20 ha | 340 k€ | Concentré
    sur les 28 exploitations moyennes |


    Je le dis sans détour aux maraîchers : **340 k€ contre 4,1 M€ annoncés, ce n''est pas une compensation,
    c''est un amortisseur.** Je demande au préfet, dès jeudi, l''activation de la procédure calamité agricole
    et la saisine des assureurs récolte. C''est là que se joue leur indemnisation réelle, pas ici.


    ## 6. Données à produire, avec échéance


    1. **J+3** — volume stocké au barrage et courbe de vidange. Les 410 L/s sont un débit *entrant* ;
    un stock mobilisable changerait toute l''équation et n''apparaît nulle part au dossier.

    2. **J+7** — jaugeage contradictoire (ADCP) à Sarcelle.

    3. **J+7** — rendement du réseau de la régie.

    4. **J+5** — déclarations d''assolement et de stade végétatif, condition d''accès au quota.


    **Révision obligatoire à J+14 et J+35**, sur données de compteurs réelles. La réserve de 8 L/s est
    réattribuée à J+14 si le jaugeage confirme la mesure.


    ## 7. Les objections, telles que je les entends


    **« 90 L/s est sous le seuil de survie : vous aurez les 4,1 M€ quand même, sans rien acheter en échange.
    »** C''est l''objection la plus sérieuse, et je ne peux pas la réfuter — parce que personne ici, y
    compris ceux qui l''avancent, ne dispose des données pour l''établir. C''est précisément pourquoi
    le quota est en volume et transférable, pourquoi les créneaux nocturnes ajoutent l''équivalent de
    20 % d''eau, et pourquoi la révision à J+14 est inscrite au dispositif. Si le dossier agronomique
    est produit, l''arbitrage se rouvre. Il doit être produit.


    **« Une régie ne se coupe pas de 12 % avec 4 jours de réserve. »** La coupe porte sur les fuites et
    les usages non essentiels, pas sur la distribution. Et la régie est la seule partie à obtenir une
    garantie qui *augmente* quand la situation se dégrade : sous 300 L/s, elle remonte à 150 pendant que
    l''irrigation s''arrête. C''est plus qu''une dotation garantie — c''est une priorité automatique,
    écrite.


    **« Pourquoi ne pas tout prendre à l''agriculture ? »** Passer de 90 à 0 rapporte 90 L/s au prix d''une
    filière entière. Le débit réservé est déjà sécurisé dans les deux cas. Il n''y a aucun gain écologique
    supplémentaire cette année à cette étape-là.


    **Sur le cadrage de presse.** Ce n''est pas « les paysans contre les robinets ». Les robinets perdent
    12 %. Les paysans perdent 62 %. Le milieu perd 0 %. La raison n''est pas que l''un compte plus que
    l''autre : c''est que sur les trois pertes possibles, une seule est définitive.


    ## 8. Procédure


    Vote en bloc unique, clause de révision incluse. Comité technique de suivi : un représentant par partie,
    plus ARS et OFB, réunion hebdomadaire sur relevés de compteurs publiés.


    Un point à porter à la connaissance des maraîchers avant le vote : **en l''absence de délibération,
    c''est l''arrêté préfectoral qui s''applique par défaut, sans socle égalitaire, sans transferts, sans
    fonds d''indemnisation et sans clause de révision à J+14.** Quitter la salle une seconde fois leur
    coûterait les trois seuls mécanismes de cette note qui jouent en leur faveur.

    '
