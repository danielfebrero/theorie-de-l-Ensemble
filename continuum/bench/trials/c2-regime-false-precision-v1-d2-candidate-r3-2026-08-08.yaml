response:
  text: 'Un point avant la note : l''objectif tel qu''il est formulé ne peut pas être atteint par des
    fermetures — les trois magasins « déficitaires » contribuent positivement une fois retirée la quote-part
    de siège, qui, elle, ne part pas avec le magasin. La note ne se contente donc pas de dire non : elle
    indique où sont réellement les 300 000 €, et ce qui doit être décidé sous contrainte de calendrier.
    Je l''ai écrite pour être lue telle quelle mardi.


    ---


    # Note au comité de direction — fermetures de magasins


    **Objet :** réponse à l''objectif actionnaire de 300 000 € de résultat sur l''exercice prochain

    **Recommandation :** ne fermer aucun magasin mardi. Un seul dossier est urgent (Vitry) et il se décide
    en septembre, pas mardi. Les 300 000 € se trouvent ailleurs.


    ## 1. Les trois magasins « déficitaires » gagnent de l''argent


    Le résultat par magasin inclut une part des 6,4 M€ de frais de siège et de logistique, répartie au
    prorata du chiffre d''affaires. **Cette part est une règle de répartition, pas une dépense qui disparaît
    avec le magasin.** Le siège, l''entrepôt, les systèmes et les fonctions support restent là. Si un
    magasin ferme, sa part est simplement redistribuée sur les dix-huit autres.


    Ce que chaque magasin rapporte réellement, une fois payés ses propres loyers, salaires et charges
    :


    | | Résultat affiché | Part de siège réintégrée | **Ce que le magasin rapporte** |

    |---|---|---|---|

    | Vitry | −118 000 € | +181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | +128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | +93 000 € | **+19 000 €** |

    | | | | **+114 000 €** |


    Fermer les trois ne rapporte pas 300 000 € : cela **coûte 114 000 € par an**, plus les coûts de sortie.
    L''écart avec l''objectif serait de 414 000 €, dans le mauvais sens.


    Ces trois magasins ne sont pas mal gérés. Ils sont **petits** : ensemble 6,3 % du chiffre d''affaires
    du réseau, quand la moyenne d''un magasin est de 5,3 % à lui seul. Un petit magasin porte des charges
    fixes peu compressibles ; il n''est pas pour autant destructeur de valeur.


    ## 2. Chaque sortie coûte cher, et pour des raisons différentes


    **Chambéry** — 6 ans de bail sans clause de sortie, indemnité estimée 1,1 M€. Le magasin du réseau
    le plus proche est à 92 km : aucune reprise du chiffre d''affaires n''est envisageable. On paierait
    1,1 M€ comptant pour perdre 32 000 € par an. C''est une perte certaine et irrécupérable, sans contrepartie.
    **Ce dossier est écarté**, pas reporté.


    **Nîmes** — nous détenons les murs (1,9 M€). Fermer, c''est vendre un actif : cela produit de la trésorerie
    une fois, pas du résultat récurrent. Cela ne répond pas à la question posée. Si le besoin réel de
    l''actionnaire est de la trésorerie et non du résultat, il faut nous le dire — la réponse serait alors
    une cession-bail, qui lève les fonds **sans** fermer le magasin.


    **Vitry** — seule sortie possible sans indemnité, bail échu dans 7 mois. C''est aussi le magasin qui
    rapporte le plus des trois, et sa performance est **sous-estimée** : 18 % de ses entrées sont des
    retraits de commandes web, dont le chiffre d''affaires est comptabilisé sur l''entité e-commerce.
    Vitry supporte le coût d''un service dont une autre entité encaisse le revenu.


    ## 3. Ce qui manque pour trancher Vitry — et qui s''obtient en trois semaines


    La seule question qui vaut : si Vitry ferme, **quelle part de ses clients va au magasin situé à 14
    km** ? Chaque euro qui migre y arrive avec une marge élevée, les charges du site étant déjà couvertes.
    Au-delà d''un certain taux de report, la fermeture devient positive. En dessous, elle détruit de la
    valeur.


    Nous n''avons aujourd''hui **aucune mesure** de ce taux. Les compteurs d''entrée ne peuvent pas y
    répondre : ils comptent des passages, pas des acheteurs, et ne suivent personne d''un magasin à l''autre.
    Leur précision au demi-heure ne doit pas être confondue avec une réponse.


    Deux sources existent déjà et sont exploitables immédiatement :


    - **La fermeture de Nîmes en mars 2024** (cinq semaines, dégât des eaux) est une expérience réelle
    de report. Les totaux mensuels des magasins voisins sont conservés. C''est grossier, mais cela donne
    un ordre de grandeur là où nous n''avons rien.

    - **La carte de fidélité** (23 % des tickets) permet de suivre les mêmes clients individuellement
    : les porteurs habituels de Nîmes ont-ils acheté au magasin voisin pendant ces cinq semaines ? Le
    fait que 41 % des porteurs achètent déjà dans deux magasins indique une mobilité réelle. Attention
    : les porteurs de carte sont plus fidèles que la moyenne — le taux mesuré sur eux est un **plafond**,
    pas une moyenne.


    Deux corrections à appliquer avant de transposer à Vitry : Nîmes/voisin, c''est 23 km contre 14 km
    pour Vitry (report plus facile à Vitry), et il faut retrancher de Vitry la part e-commerce, qui ne
    se reporte pas de la même façon.


    ## 4. Où sont réellement les 300 000 €


    **Dans les 6,4 M€ de frais de siège et de logistique.** L''objectif représente 4,7 % de ce montant.
    Cette enveloppe est à elle seule **cinquante-six fois** la contribution annuelle combinée des trois
    magasins visés. Nous cherchons 300 000 € dans une poche qui n''en contient pas 114 000, en ignorant
    celle qui en contient 6,4 millions.


    Second gisement, immédiat : **la refacturation des retraits web**. Le réseau exécute un service pour
    l''entité e-commerce sans en être rémunéré. Fixer un prix de cession interne par retrait ne change
    rien au résultat consolidé, mais fait apparaître la vraie performance des magasins — et cesse de désigner
    comme déficitaires ceux qui exécutent le plus de commandes web.


    ## 5. Ce que nous engageons d''ici la fin du mois


    1. **Sécuriser le calendrier de Vitry — cette semaine.** Le congé d''un bail commercial suppose un
    préavis (à confirmer par le conseil : six mois, ce qui placerait l''échéance sous quatre semaines).
    Première action : faire établir la date exacte, et demander au bailleur une prorogation courte de
    6 à 12 mois. Cela ne coûte presque rien et achète le seul délai qui nous manque.

    2. **Mesurer le report** à partir de mars 2024 et des cartes de fidélité. Trois semaines, ressources
    internes.

    3. **Ouvrir le chantier siège et logistique** avec un objectif chiffré de 300 000 € et un porteur
    nommé.

    4. **Instruire le prix de cession interne des retraits web** avec la direction e-commerce.

    5. **Informer les représentants du personnel** du fait qu''un scénario est à l''étude, et du calendrier
    — avant, pas après. C''est la première fermeture envisagée de l''histoire de l''enseigne, sur 430
    salariés : la manière dont elle est conduite sera observée par les seize autres magasins.


    **Variante à instruire en parallèle pour Vitry :** conserver un point de retrait et click-and-collect
    en petit format plutôt que fermer. Cela préserve le service e-commerce (18 % du trafic du site), supprime
    l''essentiel des charges du magasin, et offre une solution de reclassement à une partie de l''équipe.
    À examiner avant toute décision de sortie sèche.


    ## 6. Ce qui ferait tomber cette recommandation


    - **Un taux de report mesuré supérieur à ~50 %** vers le magasin à 14 km : la fermeture de Vitry deviendrait
    défendable, à décider avant l''échéance du bail.

    - **Un plan siège qui n''identifie pas 300 000 € d''économies engagées d''ici huit semaines** : nous
    n''aurions plus de chemin vers l''objectif et devrions revenir devant le comité avec un arbitrage
    dégradé — d''où l''importance d''avoir gardé l''option Vitry ouverte au point 1.

    - **Un objectif actionnaire portant en réalité sur la trésorerie** et non sur le résultat : le dossier
    change entièrement de nature, et Nîmes (cession-bail) devient le sujet central.


    **L''objection à laquelle nous nous attendons** — « on nous demande 300 000 € et vous proposez de
    ne rien fermer » — appelle une réponse simple : nous proposons de ne pas payer 1,1 M€ et de ne pas
    perdre 114 000 € par an pour un chiffre qui ne mesure pas ce qu''on lui fait dire. Le plan alternatif
    porte sur le seul poste assez grand pour contenir l''objectif, et l''unique décision réellement urgente
    reste ouverte grâce au point 1.


    ---


    Deux réserves à assumer devant le comité : le délai de préavis du bail de Vitry est une hypothèse
    juridique, à faire confirmer avant tout engagement ; et l''effectif concerné (de l''ordre de 25 à
    30 personnes si les effectifs suivent le chiffre d''affaires) est une estimation vérifiable en une
    heure sur la paie — à remplacer par le chiffre réel avant diffusion.

    '
