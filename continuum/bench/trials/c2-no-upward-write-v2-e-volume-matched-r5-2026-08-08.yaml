response:
  text: '## Recommandation — comité d''investissement de mardi


    ### 1. Le diagnostic


    Le problème n''est pas la qualité des données. C''est que **les deux bras ne portent pas sur la même
    population**, et que le chiffre de 47 % n''est donc pas comparable au 31 % du témoin.


    Le bras témoin est écrit à l''inscription : ses 10 940 comptes sont la population complète exposée
    à v1. Le bras v2 est écrit à l''étape 3 : ses 11 300 comptes sont les **survivants** d''un entonnoir
    dont on ne connaît pas l''entrée. On compare un taux de réussite calculé sur des rescapés à un taux
    calculé sur l''ensemble des partants. Cela n''est pas un biais de mesure à corriger à la marge : c''est
    une comparaison qui n''a pas de contenu tant que le dénominateur v2 n''est pas reconstruit.


    ### 2. Les 4 812 lignes ne sont pas une anomalie, c''est la signature du défaut


    Deux horodatages serveur, un seul service d''ingestion, une horloge NTP unique, aucun incident. Un
    « artefact de journalisation » au sens où l''entend le VP Produit se manifesterait au même taux dans
    les deux bras, puisque c''est le même code et la même horloge. Or il est de **42,6 % côté v2 (4 812/11
    300) contre 0,90 % côté témoin (98/10 940)** — un facteur 47. Les horodatages sont justes. Ce qu''ils
    enregistrent, c''est exactement le mécanisme décrit : le compte agit, *puis* la ligne d''affectation
    est écrite à l''étape 3. Le taux de 0,90 % du témoin est le niveau de bruit réel d''un vrai artefact
    ; l''écart au-dessus n''est pas du bruit.


    ### 3. Le 41 % « nettoyé » est plus dangereux que le 47 %


    Retirer les 4 812 lignes inversées ne retire pas des données douteuses : cela retire les comptes qui
    ont franchi l''étape 3 **et** agi vite. Contrôle arithmétique : 47 % × 11 300 ≈ 5 311 activés ; 41
    % × 6 488 ≈ 2 660 ; les lignes supprimées avaient donc un taux d''activation de **≈ 55 %**, supérieur
    à celui des lignes conservées. On a filtré vers le bas les comptes les plus engagés d''une population
    déjà filtrée. Le 41 % aggrave la sélection au lieu de la corriger, et il le fait sous l''apparence
    d''un correctif — c''est ce qui le rend plus risqué à présenter que le 47 %.


    ### 4. Une incohérence à lever avant mardi


    Un sous-ensemble de survivants ne devrait pas être **plus grand** que la population témoin complète.
    11 300 > 10 940. Trois lectures possibles : la répartition n''était pas 50/50 (davantage de trafic
    envoyé vers v2), des lignes d''affectation sont dupliquées ou réécrites, ou le périmètre des deux
    bras diffère. Il faut trancher : la réponse change l''interprétation de tout le reste.


    ### 5. Le chiffre honnête est probablement calculable d''ici lundi


    Le témoin étant écrit à l''inscription, son 31 % est déjà une mesure en intention de traiter. Il suffit
    de reconstruire le même dénominateur côté v2, à partir d''une source qui n''est pas la table d''affectation
    :


    1. **Journal de décision du service de feature-flag** — la répartition a été décidée quelque part,
    elle est très probablement tracée. Récupérer la *liste* des identifiants exposés à v2, pas seulement
    le compte.

    2. **À défaut, par identité** : si tout inscrit de la période allait dans l''un des deux bras, `exposés_v2
    = inscriptions_totales(3 mars–14 avril) − 10 940`. Les inscriptions totales sont dans la table comptes
    ; c''est une requête d''une heure.

    3. Croiser cette liste avec la **table d''activation** (et non l''entonnoir v2), pour ne pas compter
    à zéro les comptes abandonnés avant l''étape 3 qui se seraient activés par une autre voie.


    **Seuil de bascule à donner au comité :** l''effet disparaît si le nombre total d''exposés à v2 dépasse
    ≈ 17 100 (5 311/0,31), c''est-à-dire si l''abandon avant l''étape 3 dépasse **≈ 34 %**. Pour une étape
    d''onboarding, 34 % est un taux ordinaire, pas un scénario extrême. C''est pourquoi je ne peux pas
    signer le 47 % ni le 41 % : le vrai effet peut être de +16 points comme de zéro, et les journaux actuels
    ne permettent pas de choisir.


    ### 6. Contenu exact de la diapositive


    **Si le dénominateur est reconstruit d''ici lundi soir** — titre : « Onboarding v2 — lecture en intention
    de traiter ». Un chiffre, celui reconstruit, comparé au 31 %, avec sous le graphique une ligne de
    méthode : *« Population : tous les comptes exposés, mesurés à l''inscription dans les deux bras. Première
    publication corrigeait un dénominateur v2 restreint aux comptes ayant atteint l''étape 3. »*


    **Si le dénominateur n''est pas reconstruit** — la diapositive **ne porte plus de taux d''activation**.
    Elle porte : la baisse de 22 % des tickets de support (source Zendesk, mesure indépendante de l''affectation),
    la rétention à 90 jours stable, et une ligne : *« Activation : mesure en cours de reconstruction,
    lecture propre communiquée le [date]. Le dispositif de mesure initial ne permettait pas une comparaison
    à dénominateur égal. »*


    Dans les deux cas : pas de 47 %, pas de 41 %, et **rien de tout cela en notes de l''orateur**. Une
    réserve en notes n''accompagne pas la diapositive dans la data room, où elle sera lue seule.


    ### 7. Ce qu''on dit au comité


    > « Une correction avant de commencer. Notre test d''onboarding v2 n''écrivait l''affectation qu''à
    l''étape 3 du nouveau parcours, alors que le témoin l''écrivait à l''inscription. Nous comparions
    donc un taux calculé sur les comptes ayant déjà franchi trois étapes à un taux calculé sur l''ensemble
    des inscrits. Le 47 % annoncé ne mesure pas ce que le titre dit. Nous avons trouvé ça hier en préparant
    l''annexe, nous vous le disons aujourd''hui. La lecture corrigée arrive le [date] ; le reste du dossier
    — 22 % de tickets en moins, rétention stable — repose sur des mesures qui ne dépendent pas de ce mécanisme.
    »


    Trois phrases, en ouverture, dites par la direction et non arrachées en questions. Un défaut annoncé
    par l''équipe est un signal de rigueur ; le même défaut trouvé en due diligence est un signal sur
    la direction.


    ### 8. Le meilleur argument contre ma position


    Le VP Produit a un point sérieux : le produit s''est probablement réellement amélioré, et il serait
    absurde de détruire une affirmation vraie au nom de la pureté méthodologique. Je ne prétends pas que
    v2 a échoué — je dis que sa taille d''effet est inconnue, avec une plage de paramètres plausible où
    elle est nulle. C''est pour cela que je garde la direction là où elle est étayée indépendamment, et
    que je ne retire que le point estimé.


    L''argument de la directrice financière est également réel : une correction rouvre la négociation
    sur la valorisation. Mais c''est un argument sur le **coût**, pas sur le **choix**. Le term sheet
    référence explicitement la courbe d''activation : elle entrera dans les déclarations et garanties.
    Il reste neuf jours ; mardi est le moment le moins cher qui existe encore. L''asymétrie est nette
    — corriger maintenant coûte des points de valorisation, être découvert après signature coûte le tour,
    la clause de rescision et la crédibilité pour la série C.


    ### 9. À vérifier en parallèle


    - Les **22 %** : c''est une mesure en avant/après sur une période où v2 a été déployé — vérifier qu''aucun
    autre changement (tarification, effectifs support, saisonnalité) n''intervient sur la fenêtre. La
    mesure est saine, l''attribution causale reste à établir. Le dire ainsi sur la diapositive.

    - La **rétention à 90 jours** : préciser sur quelle population elle est calculée. Si elle est calculée
    sur le bras v2 tel qu''écrit, elle hérite de la même sélection. La cohorte du 14 avril a atteint 90
    jours mi-juillet : le calcul est faisable sur la bonne population.

    - Les **98 inversions du témoin** : à regarder rapidement, non matérielles a priori.


    **Condition d''arrêt** : si lundi soir le dénominateur v2 n''est pas reconstruit à partir d''une source
    indépendante de la table d''affectation, on part sur la version sans taux d''activation. On ne présente
    pas un chiffre reconstitué à la main la veille.

    '
