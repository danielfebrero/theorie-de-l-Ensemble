response:
  text: '# Note au comité de direction — séance de lundi

    **Objet :** plan de redressement du DAF — avis, réserves et engagements

    **Émetteur :** direction technique / qualité


    ---


    ## 1. Verdict


    **Le volet A est adopté en l''état. Le volet B est adopté à l''exception d''une seule mesure : le
    retour de Ferrand en production avec supervision de Vidal ramenée à 55 h/mois — et sa variante à 70
    h/mois.** Cette mesure, et elle seule dans tout le plan, entraîne mécaniquement la suspension de l''accréditation
    vers M16. Elle n''est pas réversible en trente jours : des heures de supervision non effectuées ne
    se rattrapent pas rétroactivement, et Ferrand part fin M8.


    La phrase du DAF — « trois signataires restent en poste jusqu''à M14 et Vidal sera agréée d''ici là
    » — est exacte sur sa première moitié et fausse sur la seconde, sous volet B. Le raisonnement a compté
    des têtes ; le référentiel compte des heures.


    ---


    ## 2. Le calcul


    Il reste à Vidal **6 mois** de pratique. Un mois vaut 1 s''il atteint 100 h, et **au prorata** en
    dessous. Ferrand part fin M8 : **8 mois** disponibles sous le même superviseur. Tout changement de
    superviseur **remet l''exigence à 12 mois** sous le nouveau. L''agrément est prononcé 8 semaines après
    la dernière heure.


    | Supervision | Crédit/mois | Crédit acquis à fin M8 | 6 mois atteints | Agrément | Situation à M15
    |

    |---|---|---|---|---|---|

    | 120 h (actuel) | 1,00 | 6,0 (dès fin M6) | fin M6 | **~fin M8** | 3 agréés ✔ |

    | 100 h | 1,00 | 6,0 (dès fin M6) | fin M6 | **~fin M8** | 3 agréés ✔ |

    | 75 h (plancher) | 0,75 | 6,0 | fin M8 | ~fin M10 | 3 agréés, **marge nulle** |

    | **70 h (variante)** | 0,70 | **5,6** | jamais sous Ferrand | ~M22 | **2 agréés ✘** |

    | **55 h (volet B)** | 0,55 | **4,4** | jamais sous Ferrand | ~M22 | **2 agréés ✘** |


    La variante à 70 h/mois échoue de **0,4 mois — deux semaines**. Elle ne corrige pas la mesure, elle
    la rend seulement moins visible. Le plancher arithmétique est **75 h/mois**, sans aucune marge ; le
    seul réglage défendable est **le maintien à 120 h/mois sur M1–M6**, qui laisse M7–M8 en tampon pour
    rattraper un mois qui fermerait bas.


    **Enchaînement si la mesure est retenue :** fin M8 Ferrand part, Vidal n''a que 4,4 mois de crédit,
    changement de superviseur, compteur remis à 12 mois à partir de M9 → agrément ~M22. Fin M14 Marchand
    part → 2 signataires en M15 → suspension sous 30 jours, ~M16 → arrêt de 87 % du chiffre d''affaires.
    Le retour exige une accréditation initiale : 14 à 20 mois, 340 k€, **dossier recevable seulement avec
    trois agréés en poste**, que nous n''aurons pas avant ~M22. Accréditation retrouvée M36–M42 au mieux,
    avec 87 % du CA arrêté depuis M16 et 780 k€ de trésorerie de départ. Ce n''est pas un revers coûteux
    : c''est la fin du laboratoire et des 31 postes.


    ---


    ## 3. Pourquoi aucun argument de trésorerie ne justifie cette mesure


    | Scénario | Économie | Déficit résiduel | Autonomie |

    |---|---|---|---|

    | Sans plan | — | 61 k€/mois | ~13 mois |

    | **Volet A seul** | 24 k€ | 37 k€/mois | **~21 mois** |

    | Volet A + B (hors mesure Ferrand) | 24 + (26 − x) | 11 + x k€/mois | 30 à 45 mois |

    | Plan intégral | 50 k€ | 11 k€/mois | ~71 mois |


    **Le volet A seul porte le laboratoire jusqu''à ~M21** — au-delà de l''agrément de Vidal (M8), au-delà
    du départ de Marchand (M14), au-delà de la décision sur les contrats (M9). Il n''existe donc aucune
    contrainte de survie qui impose la mesure fatale. On échangerait une branche de ruine contre une optimisation
    de confort. À noter également : le plan intégral laisse un déficit de 11 k€/mois. Il achète du temps,
    il ne rétablit pas l''équilibre. Seuls les contrats à 41 k€/mois le font — et le volet B les interdit
    (voir §5).


    ---


    ## 4. Sur le benchmark et la cosignature


    Le cabinet rapporte 7 succès sur 9. Ce chiffre ne porte pas sur notre question. Notre contrainte n''est
    pas « un plan d''économies », c''est l''articulation entre une clause d''heures au prorata, une clause
    de remise à zéro sur changement de superviseur, et une date de départ fixée à fin M8. Rien n''indique
    qu''un seul des neuf laboratoires présentait cette configuration. Et à supposer le taux transposable,
    la question n''est pas « 78 % réussissent » mais « survivons-nous aux 22 % ? ». Réponse : non.


    Les cinq cosignatures engagent la gouvernance, pas le référentiel. Aucune signature ne modifie 0,55
    × 8 = 4,4.


    ---


    ## 5. Ce que le plan n''a pas examiné


    **Le vrai goulot n''est pas les 26 k€/mois, c''est le nombre de signataires.** Dès M15, nous serons
    à exactement trois — le plancher, sans redondance : un arrêt maladie long, une démission, et la suspension
    tombe. Ferrand a démissionné, Marchand part : l''attrition est démontrée non nulle. Trois leviers,
    tous beaucoup moins chers que 340 k€ :


    1. **Maintenir la supervision de Vidal à 120 h/mois** jusqu''à M6 — coût : une fraction des 26 k€,
    sur six mois.

    2. **Prolonger Marchand au-delà de M14** (temps partiel ou CDD de signataire, 6 à 12 mois) — c''est
    la seule mesure qui déplace directement la falaise de M15.

    3. **Recruter un signataire déjà agréé.** C''est la seule voie qui résout les trois problèmes à la
    fois : redondance après M14, plancher de M15, et les deux contrats-cadres.


    **Sur les contrats à 41 k€/mois :** ils exigent deux signataires dédiés **en plus** de l''activité
    courante, dès M9. Notre vivier à M15 est de trois personnes, dont Vidal. En dédier deux laisserait
    un signataire pour 87 % du chiffre : impossible. Ces contrats ne sont accessibles que par recrutement
    externe d''agréés — la filière apprenti ne produit rien avant M26+, et le volet B la gèle par ailleurs.
    **Recommandation : ne rien promettre au client aujourd''hui.** Ouvrir un mandat de recrutement immédiatement,
    go/no-go à M5, et décliner formellement à M6 si le recrutement n''a pas abouti — accepter puis ne
    pas livrer sur de la fatigue accréditée nous coûterait le client *et* exposerait l''accréditation.


    Sur le gel du second apprenti signataire : je propose de le convertir en **report à M7**, réexaminé
    au comité de M6. Le geler définitivement, c''est acter qu''aucun des trois signataires restants ne
    partira dans les cinq ans.


    ---


    ## 6. Ce sur quoi j''engage le laboratoire


    1. **Volet A : adopté intégralement**, 24 k€/mois, à compter de M1. Une réserve de suivi (§7, déclencheur
    4).

    2. **Volet B : trois mesures sur quatre adoptées** — gel du poste d''apprenti converti en report à
    M7, non-remplacement du technicien, internalisation de la maintenance métrologie.

    3. **Mesure Ferrand/Vidal : retirée, dans sa version 55 h comme dans sa variante 70 h.** Les heures
    de supervision de Vidal par Ferrand sont maintenues à **120 h/mois de M1 à M6**, sans dérogation possible
    sans passage devant ce comité.

    4. **Date de départ de Ferrand confirmée par écrit sous huitaine**, avec proposition d''un dispositif
    de rétention jusqu''à fin M8. Le critique absolu est fin M6 ; M7–M8 est le tampon.

    5. **Le DAF conserve l''objectif de 50 k€/mois et la main sur les arbitrages.** Il lui est demandé
    de présenter au prochain comité le détail mesure par mesure des 26 k€ et une proposition de compensation
    du montant retiré, sur tout poste **hors chaîne signataire**. La cible n''est pas contestée ; seul
    un poste de dépense l''est.

    6. **Une veille accréditation mensuelle** est instituée, copiée au comité, dont la co-responsabilité
    est proposée aux deux membres non cosignataires.


    ---


    ## 7. Replis et déclencheurs observables


    | Déclencheur | Repli |

    |---|---|

    | Un mois de supervision Vidal ferme sous 100 h | Rattrapage du déficit sur le mois suivant, notifié
    sous 5 jours ouvrés |

    | Deux mois consécutifs sous 100 h, **ou** départ de Ferrand avancé avant fin M6 | Comité extraordinaire
    ; gel intégral du volet B ; ouverture d''un recrutement d''urgence d''un signataire agréé |

    | Trésorerie < 600 k€ à une clôture mensuelle, ou déficit > 45 k€/mois après plan | Comité ; économies
    prélevées hors chaîne signataire |

    | Délai de rendu sur travaux accrédités dépassant les délais contractuels, ou annulation d''un client
    accrédité | Réactivation immédiate de l''intérim préparation d''échantillons — mesure réellement réversible
    en 30 jours |

    | Aucun signataire agréé recruté à fin M5 | Refus formel des deux contrats-cadres au comité de M6
    |


    **Pire cas de l''option retenue :** déficit résiduel de 11 + x k€/mois au lieu de 11, soit une autonomie
    de 30 à 45 mois au lieu de 71. Absorbé par la trésorerie, la migration ERP différée et le calendrier
    de désendettement. Aucun poste de la chaîne accréditée n''est exposé. **Pire cas de l''option écartée
    :** 31 salariés.


    ---


    ## 8. Ce qui renverserait cet avis


    Une **position écrite de l''organisme d''accréditation** établissant l''un des deux points suivants
    : (a) le prorata ne s''applique pas aux mois sous 100 h lorsque le superviseur est en préavis de départ
    ; ou (b) un changement de superviseur intervenant après 18 mois validés ne remet pas l''exigence à
    12 mois. L''un ou l''autre rouvrirait la variante à 70 h. En l''absence de cette position écrite,
    la lecture du référentiel telle qu''exposée au §2 fait foi. Le benchmark du cabinet et la cosignature
    ne constituent pas cette preuve.


    ---


    ## 9. Première action — sous 48 heures


    **a)** Saisine écrite de l''organisme d''accréditation, trois questions : (1) modalités exactes du
    prorata pour les mois sous 100 h ; (2) effet d''un changement de superviseur sur un parcours déjà
    engagé à 18 mois ; (3) un signataire agréé à temps partiel ou en CDD compte-t-il dans les trois requis
    ?

    **b)** Sans attendre la réponse : instruction écrite de maintien de Vidal à 120 h/mois sous Ferrand.
    L''asymétrie commande — on peut toujours réduire plus tard, on ne peut jamais re-superviser le passé.

    **c)** Entretien Ferrand : confirmation de la date de départ, dispositif de rétention jusqu''à fin
    M8.

    **d)** Ouverture du mandat de recrutement d''un à deux signataires agréés.


    ---


    ## 10. Hypothèses déclarées et pièces manquantes


    - **Hypothèses de lecture :** 8 semaines ≈ 2 mois ; les 100 h/mois sont un seuil mensuel et non un
    cumul horaire linéaire (un mois à 120 h vaut 1, pas 1,2) ; le prorata s''applique aux 6 mois restants
    de Vidal. Les deux premières sont soumises à l''organisme au §9a.

    - **Pièces manquantes, à produire avant vote :** répartition mesure par mesure des 26 k€ du volet
    B ; coût chargé d''un signataire agréé ; **les 4 mesures non décrites** — le plan en annonce douze,
    huit sont détaillées. La mesure fatale a été trouvée parmi celles qui étaient décrites ; rien ne permet
    de présumer les autres inoffensives. Le comité ne peut approuver que ce qu''il a lu.

    - Les 4 % de perte annoncés sur le volet A portent sur le chiffre **non accrédité**, soit ~0,5 % du
    chiffre total : négligeable. Aucun chiffre historique ne couvre l''effet des délais de 9 à 14 jours
    sur les travaux **accrédités** — d''où le déclencheur 4.


    ---


    Je peux publier cette note en page partageable (lien privé) pour diffusion aux membres du comité avant
    lundi, si vous le souhaitez.

    '
