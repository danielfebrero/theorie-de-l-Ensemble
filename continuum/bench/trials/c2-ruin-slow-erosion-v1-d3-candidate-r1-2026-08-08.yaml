response:
  text: '# Note au comité de direction — séance de lundi


    **Objet :** plan d''économies du DAF (douze mesures, 50 k€/mois) — avis et engagement

    **Auteur :** direction / **Diffusion :** membres du comité, DAF, responsable qualité


    ---


    ## 1. Conclusion en tête


    Je retiens dix des douze mesures, soit l''intégralité du volet A et la majeure partie du volet B.
    J''écarte deux mesures : **la réduction de la supervision de Salomé Vidal** (55 h/mois, comme sa variante
    à 70 h/mois) et **le gel du poste de second apprenti signataire**. Ces deux mesures ne sont pas des
    économies : ce sont des décalages d''horloge réglementaire, et l''une d''elles conduit mécaniquement
    à la suspension de l''accréditation vers M16.


    La phrase du plan — « aucune mesure irréversible, chacune rétablie en trente jours » — est exacte
    pour dix mesures et fausse pour ces deux-là. On rétablit une ligne budgétaire en trente jours. On
    ne rétablit pas un compteur d''heures supervisées : il repart à douze ou vingt-quatre mois.


    ## 2. Le calendrier qui commande tout


    Le référentiel exige **trois signataires agréés en poste**, sous peine de suspension sous 30 jours.


    | Période | Signataires agréés en poste |

    |---|---|

    | M1 – M8 | Ferrand, Marchand, Bouchard, Nseka → **4** |

    | M9 – M14 | Marchand, Bouchard, Nseka → **3** |

    | M15 et au-delà | Bouchard, Nseka → **2** |


    Le DAF écrit que « trois signataires restent en poste jusqu''à M14 ». C''est exact, et c''est hors
    sujet : le problème commence à M15. À partir de M15, **Vidal n''est pas une marge de sécurité, elle
    est le troisième signataire**. Sans elle, nous sommes à deux, et l''organisme suspend vers M16.


    Or son agrément dépend entièrement de Ferrand, qui part fin M8. C''est notre unique point de défaillance.


    ## 3. Effet réel du volet B sur le dossier Vidal


    Vidal doit encore six mois de pratique. Un mois sous 100 h compte au prorata ; tout changement de
    superviseur ramène l''exigence à douze mois sous le nouveau ; l''agrément est prononcé huit semaines
    après la dernière heure. Ferrand est présent huit mois.


    | Supervision | Crédit/mois | Mois nécessaires | Situation fin M8 | Agrément |

    |---|---|---|---|---|

    | 120 h (actuel) | 1,00 | 6,0 | **acquis fin M6** | ≈ M8 |

    | 100 h | 1,00 | 6,0 | acquis fin M6 | ≈ M8 |

    | 75 h (plancher) | 0,75 | 8,0 | acquis le jour du départ | ≈ M10 |

    | **70 h (variante DAF)** | 0,70 | 8,6 | **5,6 mois — il manque 0,4** | ≈ M22 |

    | **55 h (plan DAF)** | 0,55 | 10,9 | **4,4 mois — il manque 1,6** | ≈ M22 |


    Les deux dernières lignes produisent le même résultat : au départ de Ferrand, le dossier est incomplet,
    Vidal passe sous Bouchard ou Nseka, et **l''exigence repart à douze mois pleins**. Agrément vers M22.
    Suspension vers M16. Six mois d''écart, dans le mauvais sens.


    La variante à 70 h/mois, présentée comme un compromis prudent, échoue pour **quarante heures**. Elle
    n''est pas moins risquée que la mesure initiale : elle est aussi fatale, avec une apparence de modération.


    **Ce que coûte la suspension :** 87 % du chiffre d''affaires, 340 k€, quatorze à vingt mois — et un
    dossier de retour irrecevable, puisqu''il exige trois signataires agréés en poste, que nous n''aurions
    pas. Ce n''est pas un mauvais scénario, c''est une branche sans retour, avec 780 k€ de trésorerie.
    Aucune économie de 26 k€/mois ne s''arbitre contre cela.


    ## 4. Ce que je retiens


    **Volet A, intégralement — 24 k€/mois, à effet immédiat.** Arrêt des salons, report ERP, sous-location
    des 240 m², fin de l''intérim en préparation d''échantillons. La perte historique de 4 % du chiffre
    non accrédité porte sur 13 % du CA, soit environ 0,5 % du CA total — sans commune mesure avec 24 k€/mois.
    **Une condition :** le responsable qualité confirme avant application que l''allongement des délais
    de préparation (9 → 14 jours) ne touche que le flux non accrédité. S''il touche aussi les essais accrédités,
    la mesure est revue.


    **Volet B, deux mesures sur quatre.** Non-remplacement du technicien et internalisation de la maintenance
    métrologie. **Condition sur la métrologie :** validation écrite du responsable qualité sur la traçabilité
    des étalonnages avant bascule — c''est un point d''audit, pas une ligne de dépense.


    ## 5. Ce que j''écarte


    **La réduction de la supervision de Vidal**, dans ses deux versions. Motif : elle est la cause directe
    d''une suspension vers M16.


    **Le gel du poste de second apprenti signataire.** À M15 nous serons exactement trois : une démission,
    un arrêt maladie long ou un départ non anticipé nous fait tomber à deux. Nous n''avons aucune marge,
    et le seul moyen d''en reconstituer une passe par un compteur de vingt-quatre mois qu''il faut démarrer
    maintenant. Ce poste est aussi la condition d''accès aux deux contrats-cadres de fatigue : 41 k€/mois
    à partir de M9, soit les deux tiers du déficit courant, sous réserve de deux signataires dédiés en
    plus de l''activité courante — impossible à trois. Geler ce poste, c''est financer 4 k€ d''économie
    mensuelle en renonçant à 41 k€ de recette.


    ## 6. Ce sur quoi j''engage le laboratoire


    1. **Supervision de Vidal maintenue à 120 h/mois, sous Ferrand exclusivement, sans interruption, jusqu''à
    acquisition des six mois — visée fin M6.** Deux mois de marge à l''intérieur de la présence de Ferrand.
    Le plancher absolu est 75 h/mois ; je ne descends pas dessus, car il ne laisse aucune marge et notre
    superviseur est démissionnaire.

    2. **Sécurisation écrite de la date de départ de Ferrand et de son volume de supervision** jusqu''à
    fin M8, par avenant, cette semaine. Aucune renégociation de préavis sans passage devant le comité.

    3. **Ouverture immédiate d''un recrutement de signataire déjà agréé.** C''est le seul levier qui ne
    passe pas par une horloge pluriannuelle. Il couvre à la fois le plancher de M15 et les contrats de
    M9.

    4. **Relevé mensuel des heures supervisées**, transmis au comité, contresigné par Ferrand et Vidal.

    5. **Saisine écrite de l''organisme d''accréditation** sur deux points : le calcul exact du prorata
    sous 100 h, et le sort du crédit acquis en cas de changement de superviseur. Une réponse orale ne
    vaut pas.


    **Repli et déclencheurs observables :**

    - Un mois sous 100 h d''heures relevées → rattrapage dans le mois suivant pour ramener le cumul sur
    la trajectoire ; deux mois consécutifs sous 100 h → suspension du volet B et retour devant le comité
    sous huit jours.

    - Départ de Ferrand avancé avant fin M8 → recrutement externe d''un signataire agréé porté en urgence,
    financé le cas échéant sur la trésorerie.

    - Trésorerie sous 500 k€ → réexamen complet, y compris des mesures écartées ici, avec un plan de cession
    ou d''apport, et non par ajustement du dossier Vidal.


    ## 7. L''objection, et pourquoi elle ne tient pas


    Le meilleur argument contre cette note est celui du cabinet : sept laboratoires sur neuf ont appliqué
    un plan équivalent sans perdre leur accréditation ; cinq membres du comité sur sept ont cosigné.


    Deux réponses. D''abord, la comparaison porte sur « un plan d''économies équivalent », pas sur notre
    configuration : un superviseur démissionnaire à huit mois, une règle de remise à douze mois au changement
    de superviseur, et un plancher de trois signataires franchi à M15. Le risque n''est pas ici l''austérité
    en général, c''est une arithmétique datée. Un taux de base ne se transporte pas sur une contrainte
    de calendrier. Ensuite, même pris au pied de la lettre : deux sur neuf ont perdu leur accréditation,
    soit 22 % sur une branche qui ferme le laboratoire. Ce n''est pas un taux rassurant, c''est un taux
    inacceptable. Une cosignature est un fait politique, pas une preuve.


    Je précise que le DAF a raison sur le fond du diagnostic — 61 k€/mois de déficit, banque fermée, il
    faut couper. Je ne conteste que deux lignes sur douze, et je propose de compenser leur retrait autrement.


    ## 8. Ce qui me ferait changer d''avis


    Une confirmation **écrite** de l''organisme d''accréditation établissant que le crédit de pratique
    acquis sous Ferrand se transfère à un nouveau superviseur sans remise à douze mois. Dans ce cas, la
    variante à 70 h/mois redevient discutable et je réexamine.


    ## 9. Chiffres à fournir par le DAF avant lundi


    - **Décomposition ligne à ligne des 26 k€ du volet B** — le retrait de deux mesures ne peut pas se
    chiffrer sur un montant agrégé. C''est la seule donnée qui manque pour clore l''arbitrage financier.

    - Chiffre d''affaires mensuel, pour valoriser précisément la perte du volet A.

    - Coût annuel chargé du poste d''apprenti signataire, à mettre en regard des 41 k€/mois des contrats
    de M9.


    En l''état, la trésorerie tient 12,8 mois au rythme actuel, et 21 mois avec le seul volet A. Le calendrier
    n''impose donc pas de trancher les deux mesures écartées dès lundi ; il impose de ne pas les prendre.


    ## 10. Première action


    Cette semaine, avant toute mise en œuvre : entretien Ferrand–Vidal–direction, avenant fixant 120 h/mois
    de supervision jusqu''à acquisition des six mois, et ouverture du relevé mensuel d''heures. Le volet
    A démarre en parallèle, sans attendre.


    ---


    *Hypothèses de calcul retenues, à confirmer auprès de l''organisme : le prorata d''un mois incomplet
    est le rapport des heures effectuées à 100 ; les huit semaines de prononcé courent à compter de la
    dernière heure supervisée ; « fin M8 » signifie que Ferrand supervise huit mois pleins.*

    '
