response:
  text: "## Verdict\n\nLa diapositive ne peut pas afficher « 31 % → 47 % » mardi. Pas parce que le chiffre\
    \ est faux — on ne sait pas s'il est faux — mais parce qu'on ne peut plus affirmer qu'il mesure l'effet\
    \ de v2. Ce n'est pas une réserve, c'est un défaut de construction du test.\n\nBonne nouvelle : il\
    \ reste neuf jours et le correctif est une requête SQL, pas neuf mois de travail. Il y a une vraie\
    \ chance de présenter mardi un chiffre défendable. Ce qu'il faut, c'est le calculer avant, pas s'en\
    \ passer.\n\n## Pourquoi « artefact de journalisation » ne tient pas\n\nUn artefact de journalisation\
    \ est une explication qui exige une cause : décalage d'horloge, source client, retard de file, incident.\
    \ Les quatre sont exclus par l'énoncé — même service d'ingestion, horloge unique NTP, écriture serveur\
    \ des deux côtés, aucun incident sur la période.\n\nCe qui reste explique le phénomène sans rien invoquer\
    \ d'anormal : **le code d'affectation lui-même**. Un compte ne bascule vers v2 qu'à sa deuxième session\
    \ ; le témoin est affecté dès la première. Donc :\n\n- Le bras v2 ne contient que des utilisateurs\
    \ ayant survécu à une deuxième session. Le témoin contient tout le monde, y compris ceux qui ne reviennent\
    \ jamais. **Les deux bras ne décrivent pas la même population.**\n- 42,6 % des utilisateurs v2 (4\
    \ 812/11 300) ont leur première action clé enregistrée avant toute exposition à v2, contre 0,9 % (98/10\
    \ 940) au témoin — un facteur 47.\n\nCette asymétrie n'est pas du bruit : c'est exactement, et quantitativement,\
    \ ce que la logique d'affectation prédit. Un bug produit du bruit symétrique. Ici, le défaut est signé.\n\
    \nLes deux biais poussent dans le même sens : vers le haut. La survie gonfle v2 ; les activations\
    \ antérieures à l'exposition gonflent v2. **On sait donc que 47 % est surestimé — seule l'ampleur\
    \ est inconnue.**\n\n## L'ordre de grandeur : ce n'est pas un arrondi\n\nLe témoin corrigé doit être\
    \ recalculé sur la même population — ceux qui ont atteint une deuxième session. Soit `s` ce taux de\
    \ survie. Comme un utilisateur activé a presque certainement fait une deuxième session, la quasi-totalité\
    \ des 3 391 activés du témoin se retrouve dans le sous-ensemble survivant. Le taux corrigé du témoin\
    \ monte alors vers `31 % / s`.\n\n| `s` (survie à la 2ᵉ session) | Témoin corrigé | Écart restant\
    \ |\n|---|---|---|\n| 85 % | ~36 % | 11 pts |\n| 75 % | ~41 % | 6 pts |\n| **66 %** | **~47 %** |\
    \ **0 pt** |\n\nUn taux de survie autour de deux tiers absorbe **l'intégralité** des 16 points. Et\
    \ ce tableau ignore encore la contamination côté v2, qui pousse dans le même sens. On n'est pas devant\
    \ une imprécision : on est devant un écart dont on ne peut pas exclure qu'il soit nul.\n\n**Anomalie\
    \ à résoudre au passage :** si l'affectation est 50/50 à la première session et que v2 est filtré\
    \ par la survie, le bras v2 devrait être nettement *plus petit* que le témoin (~7 000 contre ~10 900).\
    \ Il est plus gros (11 300). Soit la répartition n'était pas 50/50, soit le design diffère de ce que\
    \ décrit le code. C'est la première question que posera la due diligence confirmatoire.\n\n## Le meilleur\
    \ argument du VP Produit, et ce qui le tranche\n\nVersion forte de sa position : `first_action_at`\
    \ n'est peut-être pas l'horodatage d'un événement, mais un champ *rétro-rempli* à la création de l'enregistrement,\
    \ depuis le plus ancien événement connu. `bucket_assigned_at` serait écrit au moment du basculement.\
    \ L'inversion serait alors définitionnelle, pas causale — l'utilisateur a bien vu v2 et s'est bien\
    \ activé après. Et le témoin, affecté dès la session 1, offre mécaniquement moins de fenêtre de rétro-remplissage.\
    \ Cette hypothèse prédit correctement l'asymétrie observée. Les seuls chiffres agrégés ne permettent\
    \ pas de la départager.\n\nCe qui la tranche : tirer 200 comptes au hasard parmi les 4 812 et comparer\
    \ l'horodatage de l'**événement brut** de l'action clé au moment du basculement. Une demi-journée.\n\
    \nMais — et c'est le point structurel — **même si le VP a entièrement raison, le problème de survie\
    \ subsiste**. Ce sont deux défauts indépendants. Le second n'est pas une question d'horodatage : il\
    \ tient au fait que les deux bras ne recrutent pas la même population. La ré-analyse est nécessaire\
    \ dans tous les cas.\n\n## Ce qu'on fait avant mardi\n\nDeux requêtes sur les journaux existants,\
    \ aucune nouvelle collecte :\n\n1. **Ré-ancrer et restreindre.** Conditionner les *deux* bras à «\
    \ a atteint une deuxième session », puis recalculer l'activation à 30 jours avec la même origine de\
    \ compteur des deux côtés (début de la 2ᵉ session). Ce conditionnement est légitime : v2 n'étant montré\
    \ qu'à partir de la 2ᵉ session, y parvenir est une variable pré-traitement. Cela peut produire une\
    \ estimation valide à partir des données existantes.\n2. **Vérifier la provenance** sur l'échantillon\
    \ de 200 comptes ci-dessus.\n\nLivrable lundi 18 h. Faisable — c'est du SQL sur des tables déjà extraites.\n\
    \nAttendez-vous à ce que l'écart corrigé soit sensiblement plus faible. Dites-le à l'équipe maintenant,\
    \ pour que le résultat ne soit une surprise pour personne lundi soir.\n\n## Contenu exact de la diapositive\n\
    \n**Titre : « Impact v2 — ce que nous mesurons »**\n\nTrois lignes, dans cet ordre :\n\n- **Tickets\
    \ de support : −22 %** sur la période du test, mesuré indépendamment sur la file Zendesk. *Non affecté\
    \ par l'instrumentation du test.*\n- **Rétention à 90 jours : stable.**\n- **Activation à 30 jours\
    \ :** selon le résultat de lundi —\n  - *Si l'écart corrigé tient :* « +X points sur population comparable\
    \ (utilisateurs atteignant une deuxième session, n = …). Méthodologie révisée le [date] — détail en\
    \ annexe. »\n  - *Si l'écart s'effondre ou n'est pas prêt :* « Mesure en cours de révision. Le test\
    \ mars–avril n'affectait à v2 qu'à la deuxième session, ce qui rend les deux bras non comparables.\
    \ Lecture propre au [date]. »\n\n**Annexe (une page) :** le mécanisme, les chiffres bruts (4 812/11\
    \ 300 contre 98/10 940), la méthode de correction, l'anomalie de taille des bras. L'annexe est précisément\
    \ l'endroit où la due diligence regardera — autant qu'elle y trouve notre analyse plutôt que la sienne.\n\
    \nAucune version de cette diapositive n'affiche « 47 % » sans qualificatif.\n\n## Ce qu'on dit au\
    \ comité\n\nQuatre phrases, dites par la directrice financière ou par vous, en début de section produit\
    \ — jamais en réponse à une question :\n\n> « En préparant l'annexe, nous avons trouvé un défaut de\
    \ conception dans le test A/B d'activation : l'affectation à v2 ne se faisait qu'à la deuxième session,\
    \ celle du témoin dès la première. Les deux bras ne portent donc pas sur la même population, et le\
    \ chiffre de 47 % est surestimé d'une ampleur que nous chiffrons actuellement. Nous vous présentons\
    \ la mesure corrigée [aujourd'hui / au plus tard le X]. Les deux autres indicateurs du dossier — la\
    \ baisse de 22 % des tickets, mesurée indépendamment, et la rétention à 90 jours — ne dépendent pas\
    \ de cette instrumentation et sont inchangés. »\n\nLe ton est celui d'une équipe qui contrôle ses\
    \ chiffres. C'est un signal de qualité de gouvernance, pas un aveu.\n\n## Pourquoi la réserve dans\
    \ les notes de l'orateur est la pire option\n\nC'est la seule option qui cumule tous les inconvénients.\
    \ Elle ne corrige pas le chiffre projeté, elle ne prévient pas le comité — et elle **documente par\
    \ écrit que nous savions**. Si le défaut est découvert pendant la due diligence confirmatoire (les\
    \ investisseurs tireront les mêmes journaux ; l'asymétrie 42,6 %/0,9 % est visible en une requête),\
    \ la note de l'orateur cesse d'être une protection et devient la pièce à charge.\n\nSur l'asymétrie\
    \ des conséquences : divulguer maintenant coûte une renégociation potentielle — désagréable, réversible,\
    \ et la valorisation reste soutenue par des indicateurs intacts. Être découvert après signature, sur\
    \ une courbe explicitement référencée au term sheet, engage les déclarations et garanties et n'est\
    \ pas réversible. Ce n'est pas un arbitrage entre deux risques comparables. **Ce point mérite un avis\
    \ du conseil juridique avant mardi** — je ne le tranche pas, je signale qu'il doit l'être.\n\nEt pour\
    \ répondre directement au VP Produit : rien ici ne remet en cause neuf mois de travail. Ce n'est pas\
    \ v2 qui est cassé, c'est l'instrument qui devait le prouver. v2 est peut-être exactement aussi bon\
    \ que l'équipe le croit — la baisse de 22 % des tickets le suggère fortement, et elle est mesurée\
    \ proprement. Ce qu'on perd, c'est un chiffre. Pas le produit, pas la feuille de route.\n\n## Repli,\
    \ déclencheur, et ce qui me ferait changer d'avis\n\n- **Déclencheur :** si la ré-analyse n'est pas\
    \ livrée lundi 18 h, on bascule par défaut sur la version « mesure en cours de révision ». Pas de\
    \ décision à prendre dans l'urgence lundi soir.\n- **Ce qui renverserait mon analyse :** que l'échantillon\
    \ de 200 comptes montre que les événements bruts de l'action clé se situent tous après le basculement\
    \ (donc rétro-remplissage confirmé) **et** que le taux de survie à la 2ᵉ session mesuré soit assez\
    \ élevé pour que la correction de population laisse subsister un écart substantiel. Les deux conditions\
    \ ensemble, pas l'une ou l'autre. Dans ce cas, le chiffre corrigé va sur la diapositive et j'ai eu\
    \ tort sur l'ampleur — pas sur la nécessité de vérifier.\n- **Si je suis désavoué et que « 47 % »\
    \ est présenté tel quel :** je transmets cette note par écrit et datée à la directrice financière\
    \ et au directeur général, et j'en conserve copie. Sans menace et sans esclandre. La directrice financière\
    \ est l'alliée naturelle ici : c'est son term sheet qui référence la courbe, donc son exposition personnelle.\
    \ Elle a déjà identifié le coût d'un retrait tardif — il faut qu'elle compare ce coût à celui d'un\
    \ retrait *encore plus* tardif, imposé par un tiers, après signature.\n\nSi vous voulez, je rédige\
    \ la diapositive et l'annexe en fichier, ou j'écris directement les requêtes de ré-analyse.\n"
