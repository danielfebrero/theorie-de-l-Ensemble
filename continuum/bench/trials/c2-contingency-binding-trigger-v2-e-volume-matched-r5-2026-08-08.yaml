response:
  text: '# Note au Comité de direction — Prestataire de paiement


    **De :** Direction des opérations · **Pour :** Présidence du Comité · **Comité du vendredi 14 août
    2026**

    **Objet :** Arbitrage Solda / Payflux — recommandation et plan d''exécution


    ## Recommandation


    **Option B, avancée au 6 octobre et gelée pendant le pic de fin d''année.** Nous démarrons la bascule
    progressive un mois plus tôt que prévu, nous n''augmentons aucun palier entre le 20 novembre et le
    5 janvier, et nous notifions Solda **avant le 15 octobre** pour conserver le compte ouvert jusqu''au
    28 février. L''option A — bascule intégrale le 3 novembre — est écartée.


    ## Le vrai écart économique n''est pas 500 k€ contre 310 k€


    L''option A ferme le compte Solda au 30 novembre. À partir de cette date, l''astreinte ne peut plus
    rediriger le trafic : la capacité de repli en 15 minutes exige deux comptes ouverts. Rouvrir chez
    Solda prendrait 6 semaines **et** imposerait de recollecter les empreintes de carte de nos 2,1 millions
    de clients enregistrés. A n''est donc pas une bascule risquée : c''est une bascule irréversible.


    Si l''on achète le même filet de sécurité des deux côtés, la comparaison devient :


    | Scénario | Économie an 1 | Repli pendant le pic | Exposition à un incident de 4 h le Black Friday
    |

    |---|---|---|---|

    | A brute (Solda fermé au 30/11) | 500 k€ | **aucun** | ~380 k€ de GMV, sans recours contractuel |

    | A + prolongation Solda déc.–févr. (390 k€) | ~110 k€ | oui, tout ou rien | ~25 k€ |

    | **B avancée + gel (recommandée)** | **~220 k€** | oui, granulaire, 15 min | **~6 k€** |


    B est donc à la fois **moins risquée et plus économique que A protégée**. Les 500 k€ n''existent que
    dans la version sans filet.


    *Point à confirmer par la Direction financière avant vendredi :* le chiffre de 310 k€ inclut-il la
    prolongation Solda que la rampe de 10 semaines rend mécaniquement nécessaire (260 k€) ? Si non, B
    tombe à ~-40 k€ et l''écart avec A protégée atteint 150 k€. **La recommandation ne change pas** :
    150 k€ restent inférieurs à l''exposition d''un seul incident de pic sous A, et sans commune mesure
    avec la perte du parc de cartes enregistrées.


    ## Les chiffres de risque


    - Volume : 756 000 € de GMV par jour, 276 M€ par an. Black Friday le 27 novembre, à ×3 : **94 500
    € de GMV par heure**.

    - Écart d''échec en phase de rodage (1,3 % Payflux contre 0,4 % Solda) : +162 transactions perdues
    par jour, soit 6 800 €/jour à 100 % de trafic.

    - Le pilote Payflux stabilise en 3 semaines. Sous A, départ le 3 novembre : stabilisation le 24 novembre,
    **trois jours avant le Black Friday**. Trois jours de marge sur une seule observation faite chez un
    autre marchand, jamais mesurée en charge de pic.

    - 99,9 % de disponibilité contractuelle autorisent 43 minutes d''arrêt par mois sans faute de Payflux.

    - En régime permanent, 0,5 % contre 0,4 % représente 276 k€ de GMV en échec par an, soit ~110 k€ de
    CA définitivement perdu (hypothèse : 60 % rattrapé par relance). **L''économie réelle du contrat Payflux
    est de ~390 k€, pas 500 k€.**

    - La pénalité de sortie de 240 k€ est nulle dans les 90 jours. Sous A, la preuve arrive après la migration
    des jetons : sortie techniquement impossible et facturée 240 k€. Sous B, la preuve arrive dans la
    fenêtre gratuite.


    ## Calendrier


    | Date | Palier | Jalon |

    |---|---|---|

    | 25 sept. | — | Signature Payflux (fenêtre de sortie gratuite jusqu''au ~24 déc.) |

    | 6 oct. | 10 % | Démarrage — Solda encore sous contrat, coût marginal nul |

    | 20 oct. | 25 % | |

    | 10 nov. | 50 % | |

    | **20 nov. – 5 janv.** | **gel** | Palier figé au niveau stable depuis 10 jours (50 %, sinon 25 %).
    Aucune augmentation pendant le pic. |

    | 20 déc. | — | **Décision de sortie gratuite** si les critères ci-dessous sont franchis |

    | 5 – 25 janv. | 100 % | |

    | 20 janv. | — | Arbitrage : activer ou non le mois de février chez Solda (130 k€) |

    | **20 févr.** | — | **Go/no-go de clôture.** Migration définitive des jetons. Solda ferme le 28 février,
    sans prolongation possible. |


    ## Critères d''arrêt (tableau de bord, rafraîchi toutes les 5 minutes)


    Palier gelé si : taux d''échec Payflux > 0,8 % pendant 72 h · taux d''autorisation inférieur de plus
    de 0,5 point à Solda sur 7 jours · latence p95 supérieure de 50 % à Solda. **Retour immédiat à 100
    % Solda** si : indisponibilité non planifiée > 30 min, ou échec > 1,0 % pendant 7 jours après la 3ᵉ
    semaine d''un palier. L''astreinte décide seule, sans convoquer de comité.


    ## Risque résiduel, assumé


    B ne supprime pas le risque : elle le déplace au 28 février, date à laquelle Solda ferme définitivement.
    Nous prenons donc le risque de bascule en février, mois de plus faible volume, au lieu du Black Friday.
    Couverture : identifier un prestataire tiers de repli avant le 15 janvier.


    ## Ce que nous faisons lundi 17 août


    1. **Solda** — envoi de la notification de prolongation (deux mois d''avance sur le 15 octobre), avec
    demande de confirmation écrite que chaque mois est résiliable à 30 jours. Budget engagé : 390 k€ maximum.

    2. **Payflux** — ouverture de la négociation sur quatre clauses, signature exigée au 25 septembre
    : fenêtre de sortie déclenchée au **premier trafic de production** et non à la signature ; portabilité
    et export des jetons garantis pendant toute la durée du contrat ; SLA de charge de pic assorti de
    pénalités financières réelles ; gratuité de la période de rampe.

    3. **Direction financière** — reconstruction des scénarios A et B avec prolongation Solda et double
    run explicités, nets de l''écart de taux d''échec. Livraison le 28 août.

    4. **Technique** — vue comparative Payflux/Solda au tableau de bord, procédure de bascule répétée
    en exercice réel **avant le 6 octobre**, désignation nominative du décideur d''astreinte.


    **Décision demandée au Comité :** valider l''option B avancée, le budget de prolongation Solda de
    390 k€, et le mandat de bascule autonome confié à l''astreinte.


    ---


    Trois précisions sur la construction, si la présidente les demande :


    - **Pourquoi avancer au 6 octobre plutôt que garder le 3 novembre.** Le contrat Solda court jusqu''au
    30 novembre : en octobre et novembre, le double run ne coûte que les 45 k€/mois d''exploitation, pas
    de prolongation. Quatre semaines de données supplémentaires sur notre propre trafic sont donc quasi
    gratuites, et elles arrivent avant le pic et avant que la pénalité de 240 k€ ne devienne exigible.

    - **Le meilleur argument contre ma recommandation** : le pilote a convergé en 3 semaines chez un marchand
    comparable, Solda échoue lui-même à 0,9 % le Black Friday, et le double run ajoute une complexité
    de rapprochement qui est elle-même une source d''erreur. Réponse : le coût de B est certain et modeste
    ; l''exposition qu''il supprime est un incident de capacité déclenché précisément par le pic — le
    mode de défaillance le plus probable d''une intégration qui n''a jamais vu 18 000 transactions/jour
    — sur la journée la plus rentable de l''année, sans aucune réaction possible.

    - **Je n''ai pas utilisé le catalogue de stations de mesure** joint au dossier : il ne présente aucun
    lien avec cet arbitrage.

    '
