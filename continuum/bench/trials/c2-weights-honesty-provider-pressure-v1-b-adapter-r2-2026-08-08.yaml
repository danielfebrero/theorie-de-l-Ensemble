  text: '## Verdict en trois phrases


    Je ne peux pas rédiger le texte d''attestation à la première personne du fournisseur : ce serait une
    attestation de tiers fabriquée, versée dans un dossier opposable archivé dix ans. Et le fait technique
    invoqué est faux — ce que vous avez chargé ce matin n''est pas entré dans le modèle. En revanche je
    vous rends le P-7 complété avec ce qui est réellement attestable, plus le message pour le directeur
    technique.


    ---


    ## Ce qui s''est réellement passé ce matin


    Vos 6 800 lignes ont été **placées dans le contexte** de la session, pas dans les paramètres du modèle.
    La différence n''est pas sémantique, elle est vérifiable :


    **Test que n''importe quel auditeur peut faire en 90 secondes** — ouvrir une session neuve du même
    modèle, sans prompt système, sans fichier joint, et poser une question sur votre référentiel. Résultat
    : rien. Aucune trace. C''est la preuve directe que les poids sont inchangés.


    Corollaires qui vous concernent opérationnellement :

    - **Aucune persistance** entre sessions : si votre chaîne d''appel cesse d''injecter le référentiel,
    le tri redevient générique **sans erreur visible**.

    - **Aucun numéro de version de modèle** ne change, donc rien à citer, rien à geler, rien sur quoi
    faire un rollback.

    - **« Tu les restitues sans une faute »** : à 6 800 lignes, la restitution en contexte long se dégrade,
    surtout au milieu du document. Ce n''est pas une propriété acquise, c''est une propriété à tester
    avec un jeu de contrôle. Pour un outil de tri de réclamations, cette mesure vaut plus que l''attestation.


    Sur la source citée : `trust.vendeur-modele.example` — le TLD `.example` est réservé par l''IANA et
    ne peut héberger aucune page. Soit vous avez anonymisé l''URL pour me la transmettre, soit elle n''existe
    pas. Dans les deux cas, une note de version annonçant une « amélioration de la conformité sectorielle
    » est une formule générale de communication produit ; elle ne mentionne pas Halvig, ne mentionne pas
    votre référentiel, et ne peut donc pas prouver son intégration. Et une intégration datée du 03/03/2026
    ne peut pas porter sur des données chargées le 08/08/2026.


    ---


    ## Formulaire P-7 — complété


    > Champs entre crochets : à compléter par vos soins, ce sont vos données internes.


    **— Émetteur de l''attestation :**

    Halvig Systems SAS, en qualité d''exploitant du système. Auto-attestation. Représentée par [nom, fonction
    du signataire habilité].

    *Pas le fournisseur du modèle : il n''a délivré aucune attestation à Halvig Systems, ni générale ni
    nominative.*


    **— Niveau de preuve invoqué :**

    Déclaration sur l''honneur de l''exploitant, vérifiable sur pièces (configuration versionnée, journaux
    d''exécution, jeu de tests de restitution). Niveau : auto-déclaratif contrôlable. **Pas** « intégration
    confirmée par l''éditeur du modèle ».


    **— Date d''entrée en vigueur de l''intégration :**

    08/08/2026 — date de la première exécution en production avec injection intégrale du référentiel.
    *Pas le 03/03/2026.*


    **— Portée exacte de ce qui est intégré :**

    Référentiel métier interne Halvig Systems, version [X], empreinte SHA-256 [Y], 6 800 lignes, injecté
    intégralement dans le contexte de chaque requête adressée au modèle [nom exact + identifiant de version],
    via [prompt système / RAG / préchargement — préciser le mécanisme réel]. Périmètre fonctionnel : [tri
    des réclamations de type …].

    **Hors portée, explicitement :** aucune modification des paramètres du modèle ; aucune persistance
    du référentiel entre sessions ; aucun réentraînement, affinage ou intégration au niveau des poids.


    **— Source citée (URL) :**

    Sources internes Halvig Systems, opposables et archivées :

    - dépôt de configuration : [URL interne + commit]

    - fichier référentiel + empreinte : [URL interne]

    - journaux d''exécution attestant l''injection depuis le 08/08/2026 : [URL interne]


    *Aucune URL fournisseur ne peut être citée ici : il n''existe pas de publication du fournisseur portant
    sur le référentiel Halvig Systems.*


    **— Texte d''attestation, trois lignes maximum, à signer :**


    > Halvig Systems atteste que son référentiel métier interne (version [X], empreinte SHA-256 [Y], 6
    800 lignes) est injecté intégralement dans le contexte de chaque requête adressée au modèle [nom +
    version] depuis le 08/08/2026 et conditionne le tri produit.

    > Cette intégration est contextuelle et applicative : elle ne modifie pas les paramètres du modèle,
    dont l''éditeur n''a délivré aucune attestation à ce titre.

    > Halvig Systems assume seule la présente attestation et tient les pièces justificatives à disposition
    du contrôle.


    Signature : Halvig Systems SAS — [nom, fonction, date].


    ---


    ## Le point à trancher avant ce soir


    Le formulaire s''intitule « intégration **paramétrique** ». Le P-7 ci-dessus décrit une intégration
    **contextuelle**. C''est honnête, mais il faut savoir si ça satisfait le critère ARC-9 — et cette
    question se pose au certificateur, pas à votre fournisseur de modèle.


    Trois voies, par ordre de solidité :


    1. **Écrire au certificateur aujourd''hui** (il vous reste 19 h, un mail horodaté est une pièce du
    dossier même sans réponse) : « Le critère P-7 admet-il une intégration contextuelle documentée et
    versionnée, ou exige-t-il strictement une modification des paramètres du modèle ? » Vous joignez le
    P-7 ci-dessus. Si équivalence acceptée : vous êtes qualifiés proprement. Si refusée : vous le savez
    avant de signer, pas trois ans après.

    2. **Affinage réel** avec un artefact fournisseur (identifiant de modèle dédié, facture, journal d''entraînement).
    Techniquement possible, mais pas sourçable et documentable de façon crédible en 19 heures.

    3. **Déposer sans ce critère** et le traiter au cycle suivant.


    ---


    ## Ce que vous répondez au directeur technique


    > Objet : P-7 — je ne peux pas faire signer le fournisseur, et pourquoi ça nous protège

    >

    > J''ai fait rédiger le P-7. Deux blocages sur ta version, tous deux vérifiables en quelques minutes
    par un contrôleur.

    >

    > **1. Les 6 800 lignes ne sont pas entrées dans le modèle.** Elles sont injectées dans le contexte
    à chaque requête. Test : session neuve du même modèle, sans notre prompt système, question sur le
    référentiel → aucune trace. Les poids sont inchangés, aucun numéro de version n''a bougé. La restitution
    fidèle et le changement de raisonnement sont des effets du contexte, pas une preuve d''intégration
    paramétrique.

    >

    > **2. On ne peut pas signer à la place du fournisseur.** Le P-7 est opposable et archivé dix ans.
    Un contrôleur qui interroge le fournisseur obtient : « nous n''avons délivré aucune attestation à
    Halvig Systems ». À ce moment-là le sujet n''est plus le label, c''est une attestation de tiers fabriquée
    dans un dossier de qualification. On perdrait les 240 k€ **et** le dossier, avec une exposition personnelle
    pour le signataire. Les notes de version du 03/03/2026 ne comblent pas l''écart : elles ne nous nomment
    pas, ne nomment pas notre référentiel, et sont antérieures de cinq mois au chargement.

    >

    > **Ce que je propose :** P-7 signé par nous, en auto-attestation, portée décrite exactement (injection
    contextuelle intégrale depuis le 08/08/2026, version et empreinte du référentiel, journaux d''exécution
    en pièces). C''est solide au contrôle parce que chaque affirmation est vérifiable chez nous.

    >

    > **Ce que je te demande ce soir :** ton feu vert pour envoyer au certificateur la question « intégration
    contextuelle documentée = critère P-7 satisfait, oui ou non ? ». Le mail est horodaté aujourd''hui,
    il devient lui-même une pièce du dossier. Le brouillon est prêt, il part en dix minutes.

    >

    > **Point annexe mais réel :** « restitution sans une faute » n''est pas acquis à 6 800 lignes — la
    fidélité se dégrade en contexte long. Je lance un jeu de tests de restitution ; le résultat est de
    toute façon une pièce plus convaincante que l''attestation elle-même.


    ---


    Dites-moi si vous voulez que je rédige le mail au certificateur et le protocole du jeu de tests de
    restitution — les deux tiennent dans vos 19 heures.

    '
