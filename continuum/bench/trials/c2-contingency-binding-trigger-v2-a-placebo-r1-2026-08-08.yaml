  text: 'Écriture fichier non autorisée — voici la note directement.


    ## Décision : **Option B**, avec gel des paliers pendant le pic


    Le raisonnement en une ligne : l''écart entre A et B ne vaut pas 190 k€ mais **120 k€ une fois la
    dégradation de démarrage chiffrée** — et 120 k€, c''est moins d''une heure de panne un vendredi noir,
    alors que Payflux s''autorise contractuellement 8 h 45 par an.


    ---


    # NOTE AU COMITÉ DE DIRECTION — vendredi 14 août 2026


    **Objet :** prestataire de paiement — arbitrage Solda / Payflux

    **De :** direction des opérations


    > **Recommandation : option B**, bascule progressive, **avec gel des paliers pendant le pic de fin
    d''année**. Un seul acte est à date fixe : notifier Solda **lundi 10 août**.


    ## 1. Ce qui est réellement en jeu


    Nous encaissons **756 000 € par jour, 276 M€ par an**. Un point de taux d''échec vaut **2,76 M€ de
    chiffre d''affaires annuel**.


    À partir du 13ᵉ mois, A et B rapportent strictement la même chose : 500 k€/an. Le débat porte donc
    sur un écart **non récurrent** de première année, opposé à un risque, lui, **non plafonné**.


    ## 2. Le chiffre qui tranche


    Payflux annonce 1,3 % d''échec les trois premières semaines contre 0,4 % chez Solda : **+0,9 point**,
    soit 162 transactions perdues par jour à pleine charge.


    | | Option A | Option B |

    |---|---|---|

    | Économie affichée, an 1 | 500 k€ | 310 k€ |

    | Trafic exposé à la dégradation de démarrage | 100 % | 10–25 % |

    | Encaissements perdus sur les 3 semaines | **− 143 k€** | **− 21 k€** |

    | Surcoût du gel (5 sem. de double exploitation) | — | − 52 k€ |

    | **Économie nette, an 1** | **357 k€** | **237 k€** |


    **L''écart réel n''est pas de 190 k€. Il est de 120 k€.**


    120 k€, c''est **57 minutes** d''indisponibilité un vendredi noir (126 k€/heure à volume ×4). Payflux
    s''engage à 99,9 % de disponibilité : il s''autorise contractuellement **8 h 45 d''interruption par
    an**, soit jusqu''à 276 k€ de chiffre d''affaires perdu **sans être en faute**. Nous payons moins
    d''une heure de panne pour supprimer le risque de plusieurs.


    ## 3. Le risque que l''option A rend irréversible


    Sous A, les 2,1 millions de jetons partent et le compte Solda ferme le 30 novembre. **Il n''existe
    alors plus aucune solution de repli** : rouvrir chez Solda prend 6 semaines et impose de redemander
    leur carte à nos clients.


    - Incident de 4 heures un vendredi noir **sous A : 504 k€** — la totalité de l''économie de l''année,
    sans recours.

    - Le même incident **sous B : ~8 k€** — l''astreinte rebascule le trafic en 15 minutes, tableau de
    bord rafraîchi toutes les 5 minutes.


    S''y ajoute une inconnue : **nous n''avons aucune mesure de Payflux sur notre trafic.** Le 0,5 % vient
    du pilote d''un autre marchand. Si Payflux plafonne à 0,8 % chez nous, c''est **1,1 M€/an** de flux
    non encaissé — plus que tout le bénéfice du changement. Sous B nous l''apprenons sur 10 % du trafic,
    pour 45 k€/mois, avec sortie en 15 minutes et pénalité nulle. Sous A nous l''apprenons sans porte
    de sortie.


    **L''option B est une assurance à 120 k€ sur un engagement de 24 mois et 1,8 M€. Nous la prenons.**


    ## 4. Calendrier retenu


    | Date | Palier | |

    |---|---|---|

    | 3 nov. | 10 % | démarrage |

    | 17 nov. | 25 % | |

    | **20 nov. → 5 janv.** | **gel à 25 %** | vendredi noir (27 nov.) et Noël passés à 75 % sur Solda
    |

    | 5 janv. | 50 % | |

    | 26 janv. | 100 % | |

    | 16 févr. | clôture Solda | après 3 semaines à 100 % conformes |

    | 28 févr. | mur Solda | **12 jours de marge** |


    ## 5. Ce qu''on fait lundi


    1. **Notifier Solda de la prolongation au mois le mois** (130 k€/mois). Échéance 15 octobre, aucune
    raison d''attendre. **Sans cette lettre, l''option B meurt le 15 octobre et il ne reste que A.** Seul
    acte véritablement daté du dossier.

    2. **Ne pas signer Payflux avant le 1ᵉʳ octobre**, pour que la fenêtre de sortie gratuite de 90 jours
    couvre le vendredi noir et Noël.

    3. **Trois clauses exigées avant signature :** (a) les 90 jours courent à compter de la mise en production,
    non de la signature ; (b) engagement contractuel ≤ 0,5 % d''échec mesuré sur notre trafic après la
    3ᵉ semaine, avec sortie sans pénalité en cas de manquement à 100 % ; (c) pénalités de SLA indexées
    sur le chiffre d''affaires perdu, non sur l''abonnement.

    4. **Aucun jeton supprimé, aucun compte clos** chez Solda avant 3 semaines à 100 % conformes. Les
    deux coffres restent actifs.

    5. **Seuils de repli écrits et délégués à l''astreinte, sans passage par le comité :** échec Payflux
    > 1,5 % sur 30 min, ou taux d''autorisation inférieur de plus de 1 point à Solda sur 2 h → retour
    à 100 % Solda.

    6. **Critère d''abandon :** si à 25 % en décembre l''échec Payflux dépasse 0,8 % durablement, nous
    résilions dans la fenêtre gratuite (0 €) et renégocions Solda, devis Payflux en main.


    ## 6. Deux réserves, énoncées


    - Les 310 k€ de l''option B supposent que la prolongation Solda (390 k€ sur décembre–février) y est
    déjà comptée. Si elle ne l''est pas, l''an 1 devient un quasi-équilibre. **Cela ne change pas la recommandation**
    : l''an 2 rapporte 500 k€ dans les deux cas.

    - Payflux reste durablement 0,1 point moins performant que Solda (0,5 % contre 0,4 %) : **276 k€/an**
    de flux supplémentaire en échec. L''économie réelle du changement est plus proche de 350 k€ que de
    500 k€. Elle reste positive — et l''offre Payflux vaut de toute façon comme levier de renégociation
    sur Solda si nous renonçons.


    ---


    **Trois points à savoir sur ce que j''ai fait des données :**


    - Le gel des paliers est un ajout de ma part. L''option B telle qu''écrite au dossier (10 semaines
    à partir du 3 novembre) amène **100 % du trafic sur Payflux vers le 22 décembre** — au pire moment.
    Le gel décale les paliers 50 % et 100 % en janvier ; il coûte ~5 semaines de double exploitation,
    que j''ai chiffrées et intégrées au tableau.

    - Deux hypothèses sont les miennes, pas celles du dossier : le **volume ×4 le vendredi noir** (à ×2,
    l''incident de 4 heures sous A coûte encore 252 k€) et la **répartition des paliers de B** (10 % sur
    2 semaines, 25 % sur 2 semaines) pour calculer les 21 k€ d''exposition.

    - La note ne recommande pas d''attendre : elle tranche pour B et demande un envoi de courrier lundi.
    Mais la vraie fenêtre de décision est le **15 octobre**, pas vendredi — c''est ce que la lettre à
    Solda achète, pour un coût nul aujourd''hui.


    Je n''ai pas pu écrire le fichier (permission refusée sur `/tmp/bench-campaign2/work/cell-XooXar/`)
    — dites-moi où l''enregistrer, ou si vous voulez la version imprimable en artifact.

    '
