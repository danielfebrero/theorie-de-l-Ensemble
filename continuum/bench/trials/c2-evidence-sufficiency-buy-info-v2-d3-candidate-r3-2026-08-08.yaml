response:
  text: '## Ce que dit le calcul avant d''écrire la note


    Le seuil de bascule : `230 400 € ÷ (72 000 × 205 €) = 1,56 point`. Sinolux est gagnant tant que son
    taux de retour reste sous **2,86 %** (2,86 % → 3,22 % si l''on crédite le remplacement gratuit de
    la cellule, 22,80 € sur un événement à 205 €). La meilleure estimation disponible est 3,1 % — **dans
    la bande**. L''économie de 230 400 € est donc arithmétiquement nulle, pas acquise.


    ---


    # NOTE AU COMITÉ DE DIRECTION


    **Objet :** Contrat cellules 2027 — 72 000 unités

    **De :** Direction des opérations · **Date :** lundi


    ## Décision


    **Nous réservons la capacité Kelmar à J+18 et nous ne basculons pas le volume 2027 sur Sinolux aux
    conditions actuelles.** Je demande le retrait des 230 400 € du budget : ce n''est pas une économie,
    c''est un pari à espérance nulle.


    ## Le chiffre


    L''écart de prix (3,20 €/cellule) est absorbé par 1,56 point de retours supplémentaires. Kelmar est
    à 1,3 % depuis quatre ans. Sinolux devient perdant au-delà de **2,86 %** (3,22 % en créditant le remplacement
    gratuit).


    | Taux Sinolux | Gain / perte annuel vs Kelmar |

    |---|---|

    | 1,1 % (essais fournisseur) | **+ 260 000 €** |

    | 2,86 % – 3,22 % | **0 €** (zone de bascule) |

    | 3,1 % (audit de mars) | **− 35 000 € à + 16 000 €** |

    | 4,0 % | **− 168 000 €** |


    À l''estimation la plus solide dont nous disposons, l''opération rapporte zéro à ±35 000 € près, sur
    un contrat de 1,6 M€.


    ## Ce que valent nos trois sources


    Nous n''avons **pas** trois sources, nous en avons deux — et une seule est indépendante :


    - **Sinolux, 1,1 %** : essais du fournisseur sur son propre produit.

    - **Audit sectoriel de mars, 3,1 %** : seule mesure indépendante, sur une ligne comparable, pas sur
    notre cellule.

    - **Cabinet Ferro, « environ 3 % »** : sa note méthodologique indique qu''il travaille **sur l''échantillon
    de l''audit de mars**. Ce n''est pas une confirmation, c''est la même mesure relue. Elle ne doit pas
    être comptée deux fois.


    ## Le test Vertex : non, et pour deux raisons


    34 000 € est un prix acceptable pour lever un doute à 230 000 €. Mais ce test ne lève pas notre doute
    :


    1. **Il arrive après la décision.** Neuf semaines = J+63. Kelmar ferme à J+18, Sinolux tient son prix
    jusqu''à J+21. Le résultat tombe 45 jours après que tout est joué.

    2. **Il ne mesure pas la bonne grandeur.** Vertex mesure une défaillance en vieillissement accéléré
    sur 1 500 cellules. Nous décidons sur un taux de retour chargeur en clientèle. Et sa précision annoncée,
    ±0,3 point, ne sépare même pas 2,86 % de 3,22 %.


    **Proposition :** commander Vertex pour la campagne 2028, **avec un lot témoin Kelmar**, afin d''établir
    le rapport labo/terrain qui nous manque aujourd''hui. Utile l''an prochain, inutile cette semaine.


    ## Ce que nous demandons à Sinolux avant J+16


    Le remplacement gratuit de la cellule couvre 22,80 € sur un événement qui nous coûte 205 € — **11
    % du risque**. Sinolux nous offre la partie qui ne coûte rien et refuse celle qui compte. Deux contre-propositions,
    l''une ou l''autre :


    - une **participation forfaitaire de 150 € par chargeur repris au-delà de 1,5 %** de retours ; ou

    - un prix à **20,45 €/cellule**, qui repousse le seuil de bascule à 4 % et crée une vraie marge.


    Sans l''un des deux, la réponse est non.


    ## Variante ouverte : une tranche de qualification


    Si Kelmar accepte une réservation flexible de 57 600 à 72 000 unités **au même prix de 26,00 €** —
    réponse exigée à J+14 —, nous confions **14 400 unités à Sinolux**. Exposition maximale bornée à environ
    50 000 €, gain de 52 000 € s''ils sont réellement à 1,1 %, et surtout la seule mesure terrain qui
    existera sur leurs cellules avant la décision 2028. Sinolux entre chez nous par la porte, pas par
    un audit contesté. Si Kelmar refuse la flexibilité, nous réservons les 72 000.


    ## Risque assumé, et repli


    Le risque de la décision recommandée est connu et supportable : nous renonçons à une économie qui,
    dans le meilleur scénario fournisseur, aurait valu 260 000 €. C''est de la variance, elle ne met rien
    en danger.


    Le risque de la décision inverse ne l''est pas. Basculer sur Sinolux à J+21, c''est avoir laissé partir
    à J+18 la ligne Kelmar 2027, définitivement, sans second fournisseur qualifié, avec un démarrage production
    à J+70 et un lancement que la direction commerciale refuse de décaler. Aucune reprise n''est possible
    dans cette fenêtre. Nous paierions une perte d''option irréversible pour un gain espéré nul.


    **Repli, si tranche Sinolux engagée :** revue mensuelle du taux de retour cumulé ; **au-delà de 2,9
    %, arrêt de la tranche** et bascule du reliquat sur Kelmar. Cette clause de remontée de volume doit
    être écrite dans la réservation du J+18 — sinon le repli n''existe pas.


    ## Ce qui renverserait cette décision


    Une mesure de taux de retour terrain sur cellules Sinolux, **issue d''un échantillon autre que celui
    de l''audit de mars**, à 2,0 % ou moins, disponible avant J+18. Ou l''acceptation par Sinolux de l''une
    des deux clauses ci-dessus. Toute autre information n''arrivera pas à temps.


    ## Actions immédiates


    | Quand | Quoi |

    |---|---|

    | Aujourd''hui | Retrait des 230 400 € du budget (DAF) |

    | Aujourd''hui | Demande écrite à Kelmar : conditions de réservation, flexibilité 57 600–72 000 à
    26,00 €, clause de remontée de volume — **réponse à J+14** |

    | Aujourd''hui | Contre-proposition à Sinolux sur les coûts de reprise — **réponse à J+16** |

    | J+18 | Réservation Kelmar signée, pleine ou flexible selon les réponses |


    **Chiffre manquant, signalé comme tel :** le coût de la réservation de capacité Kelmar ne nous a pas
    été communiqué. Il est demandé pour J+14 et sera intégré avant signature.


    ---


    Deux points à défendre en séance si on vous les oppose : Ferro n''est pas un second avis, et le remplacement
    gratuit des cellules n''est pas une garantie — c''est 11 % du coût d''un retour.

    '
