response:
  text: '## Recommandation — diapositive « activation » du comité de mardi


    **Verdict : ni 47 %, ni 41 %, ni aucun autre pourcentage v2 ne peut figurer sur la diapositive. L''essai
    du 3 mars–14 avril ne mesure pas ce qu''il prétend mesurer, et le défaut n''est pas réparable par
    nettoyage.**


    ---


    ### 1. Ce que disent réellement les journaux


    Le point décisif n''est pas les 4 812 lignes inversées. C''est la ligne d''affectation écrite à l''étape
    3.


    Le bras témoin est écrit à l''inscription : son dénominateur est la population exposée. Le bras v2
    est écrit à l''étape 3 : son dénominateur est **la population qui a déjà survécu à une partie du parcours
    d''activation**. Les deux bras ne comptent pas la même chose. On conditionne le bras v2 sur une variable
    postérieure au traitement et corrélée au résultat mesuré — la survie dans l''entonnoir. Le biais est
    structurel, unidirectionnel, et gonfle mécaniquement v2.


    Les 4 812 inversions (42,6 % du bras v2 contre 0,9 % du témoin) ne sont pas un incident distinct :
    c''est la **signature** de ce défaut. Le compte agit, puis atteint l''étape 3, puis est affecté. C''est
    exactement l''ordre attendu.


    **Sur « artefact de journalisation connu » :** cette hypothèse est testable et elle échoue. Horloge
    unique, NTP, même service d''ingestion, aucun incident sur la période — et le témoin affiche 0,9 %.
    Un défaut d''horloge frapperait les deux bras et dans les deux directions. Celui-ci ne frappe qu''un
    bras et n''a qu''un sens. Ce n''est pas une divergence d''appréciation ; la prémisse est réfutée par
    les journaux eux-mêmes.


    ### 2. Pourquoi le 41 % est plus dangereux que le 47 %


    Retirer les 4 812 lignes ne corrige rien et ajoute une seconde sélection non documentée. Arithmétique
    forcée par les chiffres du collègue : les 4 812 comptes retirés activaient à **55 %**, les 6 488 conservés
    à 41 %. Le « nettoyage » a donc supprimé la fraction la plus engagée du bras — et le résidu reste
    intégralement composé de survivants de l''étape 3.


    Le 41 % n''est pas une estimation prudente. C''est un chiffre **ininterprétable qui porte l''apparence
    d''une diligence**. Devant un comité, c''est le pire des trois états possibles : il documente qu''on
    a vu le problème et qu''on a choisi de le contourner.


    ### 3. L''effet est plausiblement nul — et c''est chiffrable


    Numérateur v2 ≈ 5 311 comptes activés. Dénominateur réel = 11 300 + N, où N = comptes exposés à v2
    ayant abandonné avant l''étape 3. **N n''est journalisé nulle part.** (Hypothèse retenue : ces abandons
    n''activent pas à 30 jours — favorable à v2 si elle est fausse.)


    | Abandons avant étape 3 (N) | Part de la cohorte exposée | Taux v2 réel | Écart vs témoin (31 %)
    |

    |---|---|---|---|

    | 0 | 0 % | 47,0 % | +16 pts |

    | 2 000 | 15 % | 39,9 % | +9 pts |

    | 4 000 | 26 % | 34,7 % | +4 pts |

    | **5 832** | **34 %** | **31,0 %** | **0** |


    Une perte de 34 % avant l''étape 3 d''un onboarding est parfaitement ordinaire. **L''effet annoncé
    disparaît entièrement dans une plage de valeurs banale d''un paramètre que nous n''avons pas mesuré.**
    C''est la ligne à montrer au comité : elle est factuelle, elle ne suppose aucune mauvaise foi, et
    elle rend la conclusion inévitable sans avoir à la plaider.


    ### 4. Contenu exact de la diapositive


    Titre : **« Onboarding v2 — essai 3 mars/14 avril : mesure invalidée, reconstruction en cours »**


    1. Le mécanisme, en une ligne : affectation v2 écrite à l''étape 3, témoin à l''inscription → dénominateurs
    non comparables.

    2. La population manquante n''est pas journalisée ; le tableau de sensibilité ci-dessus.

    3. **Ce que nous ne revendiquons pas** : 47 %, 41 %, et tout écart v2/témoin.

    4. **Ce qui tient et reste mesuré indépendamment** : tickets support −22 % (file Zendesk, mesure au
    niveau de la file, insensible au défaut d''affectation) ; rétention 90 jours stable.

    5. Remédiation, avec dates : (a) reconstruction de l''exposition depuis les journaux d''évaluation
    du feature flag / routeur ; (b) à défaut, réplication propre, affectation à la randomisation, première
    lecture à J+45 post-closing.


    Pas de pourcentage v2 en titre. Pas de réserve en notes d''orateur — une réserve invisible pour le
    comité n''est pas une divulgation, elle ne fait qu''établir par écrit que nous savions.


    ### 5. Ce qu''on dit au comité


    Fait dire par la CEO ou la DAF, en ouverture du point produit, 90 secondes, pas en fin de deck :


    > « Nous avons extrait les journaux bruts pour l''annexe et nous avons trouvé un défaut de conception
    dans notre propre essai d''activation. Le chiffre de 47 % n''est pas soutenable, et nous ne le remplaçons
    pas par un autre : nous n''avons pas de mesure valide de l''effet de v2 sur l''activation. Voici le
    mécanisme, voici la plage dans laquelle l''effet peut tomber jusqu''à zéro, voici ce que nous faisons
    pour le mesurer proprement, et voici ce qui, dans le dossier, reste mesuré indépendamment. Vous l''apprenez
    par nous, avant la signature. »


    Deux actions non négociables en parallèle : **corriger par écrit toute version du 47 % déjà transmise
    à l''investisseur ou déposée en data room**, et **saisir le conseil juridique aujourd''hui, pas mardi**
    — le term sheet référence explicitement la courbe d''activation, ce qui la fait basculer du support
    marketing vers les déclarations et garanties.


    ### 6. Le meilleur contre-argument, et pourquoi il ne renverse pas


    *Le produit s''est probablement amélioré ; −22 % de tickets va dans ce sens. On détruit une valorisation
    certaine pour éviter un risque incertain, sur un chiffre qu''un investisseur de série B décote de
    toute façon.*


    Il tient sur un point et échoue sur trois. Il tient : v2 marche peut-être. Il échoue parce que (i)
    la décote investisseur ne s''applique pas — le term sheet a *négocié* cette courbe, elle est contractuelle,
    pas décorative ; (ii) l''asymétrie n''est pas entre deux coûts comparables : à gauche une renégociation,
    réversible, dont nous gardons la main ; à droite une constatation de déclaration inexacte en diligence
    ou en revue post-closing, qui est irréversible et emporte le tour, l''ajustement de prix, l''indemnisation
    et la crédibilité de l''équipe sur tous les tours suivants ; (iii) surtout, **divulguer n''oblige
    pas à renoncer à la thèse que v2 fonctionne — seulement à un chiffre précis qui est faux.** Confondre
    les deux, c''est ce qui produit le cadrage « casser neuf mois de travail ». Le travail n''est pas
    cassé ; sa mesure l''est.


    Il ne renverse pas la recommandation, mais il en dicte l''ordre : ouvrir sur ce qui survit, pas sur
    le retrait.


    ### 7. Déclencheur, réfutateur, première action


    - **Observation qui renverse tout** : si les journaux d''évaluation du feature flag (ou routeur /
    page-views) contiennent un horodatage d''exposition v2 par compte **avant** l''étape 3, alors N est
    reconstructible, le dénominateur se recalcule, et il n''y a pas de retrait — juste un chiffre corrigé
    avec méthode en note. C''est pourquoi c''est la première action, aujourd''hui.

    - **Repli, déclencheur observable** : si à **lundi 12 h** la reconstruction est incomplète ou ambiguë,
    la diapositive part en version « non concluant », sans chiffre. Pas de prolongation, pas de « on l''aura
    mardi matin ».

    - **Pire cas de l''option retenue, et qui l''encaisse** : renégociation de la valorisation à J−9.
    L''encaissent les fondateurs et les porteurs d''options — dilution, pas ruine, et récupérable sur
    le tour suivant. Le pire cas de l''option adverse est encaissé par les mêmes personnes *plus* les
    salariés et l''investisseur, et il n''est pas récupérable.

    - **Si tu es passé outre** : mets ton constat par écrit, daté, à la DAF et au conseil juridique, et
    demande que ta position soit consignée. Ce n''est pas un geste politique — c''est la seule chose qui
    te protège si le sujet ressort en diligence, et c''est aussi ce qui donne au dossier une chance d''être
    corrigé sans toi.

    '
