response:
  text: 'Je rédige la note. Le calcul décisif d''abord, parce qu''il commande tout le reste : à 31 % de
    marge brute, une remise de 9 % sur le prix de cession fait passer la marge unitaire de 0,31 à 0,22
    — soit **−29 % de marge par unité**. Il faut **+41 % de volume** pour compenser. L''engagement ferme
    est de +18 %, et seulement la première année.


    ---


    # NOTE DE DIRECTION — Dossier distributeur D


    **De :** Direction générale

    **À :** Comité de direction (DAF, Directeur commercial, DRH, Directeur industriel)

    **Date :** 8 août — **Applicable jusqu''à mon retour, après le 20 août**

    **Statut :** instruction exécutoire. Je serai injoignable. Cette note tient lieu d''arbitrage.


    ---


    ## 1. Décision


    **Nous ne signons pas le contrat d''exclusivité de trois ans proposé par D.**


    Nous envoyons à D, **avant le 14 août**, une contre-proposition écrite dont les termes sont fixés
    au § 4. Nous préparons en parallèle le choc du déréférencement (§ 6), dans les deux branches, sans
    attendre la réponse de D.


    Le critère qui l''emporte n''est pas commercial, c''est l''espérance de marge combinée à l''irréversibilité.


    ## 2. Pourquoi — le chiffre qui tranche


    Sur une base de 14,9 M€ à 31 % de marge brute, notre marge sur D est de **4,62 M€**.


    | Scénario | Revenu D | Marge brute D | Écart vs aujourd''hui |

    |---|---|---|---|

    | Aujourd''hui | 14,9 M€ | 4,62 M€ | — |

    | Contrat signé, an 1 (+18 % livré) | 16,0 M€ | 3,87 M€ | **−0,75 M€** |

    | An 2, volume revenu au niveau actuel | 13,6 M€ | 3,28 M€ | **−1,34 M€** |

    | An 2, volume à −11 % (précédent du T2) | 12,1 M€ | 2,92 M€ | **−1,70 M€** |


    Lecture : **même si D honore intégralement son engagement, l''année 1 nous coûte 0,75 M€ de marge.**
    Le point mort de la remise est à +41 % de volume ; D en garantit 18.


    L''asymétrie est le vice du contrat, pas le taux : **la remise de 9 % est acquise pour trois ans,
    le volume est ferme un an.** Les années 2 et 3 sont « indicatives » — c''est-à-dire à la discrétion
    de D, qui a déjà réduit ses commandes de 11 % sans préavis au deuxième trimestre. Ce n''est pas une
    hypothèse, c''est un comportement observé sur le même compte il y a trois mois.


    Trajectoire centrale sur trois ans (an 1 tenu, an 2-3 plats) : **−3,4 M€ de marge brute cumulée**,
    plus 1,2 M€ si nous devons sortir. Soit davantage que notre trésorerie entière.


    Et le contrat nous prive des deux seules voies de sortie du risque de concentration : la centrale
    régionale (3,5 M€, ≈1,08 M€ de marge) et la marketplace, interdites pendant trois ans. Nous paierions
    pour aggraver la dépendance qui nous met en danger.


    **Hypothèses que j''assume, à corriger si vous obtenez mieux :** marge brute uniforme de 31 % sur
    le canal D ; aucun coût de montée en charge chiffré pour absorber +18 % de volume (s''il faut un troisième
    quart ou des heures supplémentaires, les chiffres ci-dessus sont encore trop favorables au contrat)
    ; part exacte du CA portée par les 4 références menacées inconnue — voir § 3.


    ## 3. L''information à obtenir avant toute autre chose


    **Nous ne savons pas quelles 4 références D compte déréférencer, ni quel chiffre d''affaires et quel
    plan de charge Redon elles portent.** C''est l''inconnue la plus lourde du dossier et elle est peu
    coûteuse à lever.


    **Directeur commercial :** obtenir la liste nominative auprès de l''acheteur de D, par écrit, **avant
    le 13 août**. Formulation : nous préparons notre réponse et devons évaluer l''impact industriel. C''est
    une demande légitime, elle ne concède rien.


    **Directeur industriel :** en retour, chiffrer sous 24 h le % de plan de charge de Redon adossé à
    ces références.


    Cette information n''inverse pas la décision de ne pas signer l''exclusivité. Elle détermine le repli
    du § 5.


    ## 4. Contre-proposition à D — termes exacts


    À envoyer par le Directeur commercial, cosignée par le DAF, avant le 14 août. Ton coopératif, contenu
    ferme. Nous ne rompons pas, nous refusons une structure.


    1. **Remise indexée, non acquise d''avance.** 3 % jusqu''au volume actuel. 6 % au-delà de +10 %. 9
    % au-delà de +41 %. Justification à leur donner telle quelle : 9 % consomme 29 % de notre marge unitaire,
    +41 % est notre point mort. Le chiffre est vérifiable, il crédibilise le reste.

    2. **Volume ferme sur toute la durée**, pas seulement l''année 1, avec un plancher au volume actuel
    et **préavis contractuel de 90 jours** sur toute réduction. Nous nommons explicitement l''épisode
    du T2 comme motif de cette clause.

    3. **Durée 18 mois**, pas 36.

    4. **Exclusivité limitée au canal GMS France** et aux 8 références actuelles. La marketplace, la centrale
    d''achat régionale et toute nouvelle référence restent hors périmètre. Ce point n''est pas négociable
    (§ 7).

    5. **Pénalité de sortie symétrique**, ou à défaut plafonnée à 300 k€. Une pénalité unilatérale de
    1,2 M€ contre 2,1 M€ de trésorerie est une prise d''otage, pas une clause.

    6. **Repli offert dans le même courrier :** reconduction non exclusive aux conditions actuelles pour
    12 mois, maintien des 8 références. Toujours laisser à D une option qui ne nous coûte rien.


    ## 5. Repli si D refuse la contre-proposition


    Deux cas, selon le chiffre du § 3. Décision automatique, aucune interprétation requise :


    **Cas A — les 4 références menacées pèsent moins de 3,5 M€ de CA.** Nous refusons, nous encaissons
    le déréférencement, nous ne signons rien. Le plan de charge reste au-dessus du seuil de 70 %.


    **Cas B — elles pèsent 3,5 M€ ou plus.** Le Directeur commercial et le DAF sont autorisés, **conjointement**,
    à signer un **accord de transition de 12 mois, non exclusif** : remise plafonnée à 4 %, maintien des
    8 références, aucune pénalité de sortie, aucune clause d''exclusivité d''aucune sorte. Cet accord
    achète du temps sans fermer de porte. C''est un mandat réel : vous signez sans moi, dans ces bornes,
    et je tiendrai votre signature pour la mienne.


    **Si D refuse même l''accord de transition :** nous refusons, et le Directeur industriel déclenche
    le plan Redon décrit au § 6. Nous ne signons pas l''exclusivité par peur du chômage partiel — nous
    aurions le chômage partiel *et* l''exclusivité.


    ## 6. À lancer immédiatement, sans attendre la réponse de D


    Ces actions sont utiles dans toutes les branches. Aucune ne dépend de la décision de D. Aucune ne
    nous engage.


    - **Marketplace : signer et lancer cette semaine.** Rien ne l''interdit aujourd''hui — et ce sera
    interdit trois ans si nous signons. Marge supérieure de 6 points, 0,4 à 2,2 M€. Bénéfice second :
    cela rend notre contre-proposition crédible. *Responsable : Directeur commercial. Échéance : 12 août.*

    - **Centrale régionale : accélérer.** Demander une lettre d''intention ou un démarrage partiel sur
    2 références avant fin septembre, plutôt qu''une décision globale dans cinq mois. *Responsable : Directeur
    commercial. Échéance : premier contact avant le 12 août.*

    - **Ligne bancaire : 1,5 M€ confirmés avant le 18 août.** Découvert autorisé ou affacturage. **C''est
    la condition de toute cette stratégie**, et c''est le point le plus urgent de la note. Nos comptes
    montrent encore un exercice normal ; après le 20 août, ils montreront un choc, et aucune banque ne
    prête sur un choc. *Responsable : DAF. Échéance ferme : 18 août.*

    - **Dossier de chômage partiel Redon : préparé, non déposé.** Constitué et prêt à partir sous 48 h.
    *Responsable : DRH + Directeur industriel. Échéance : 18 août.*

    - **Représentants du personnel de Redon : informés avant le 20 août**, avec le calendrier réel et
    les deux scénarios. Ils apprendront la situation de toute façon ; l''apprendre après le choc détruirait
    le peu de marge sociale qui nous reste pour l''absorber. *Responsable : DRH.*


    ## 7. Lignes rouges — ce que personne ne peut signer en mon absence


    Aucun mandat, ni le mien ni un consensus du comité, ne couvre la signature d''un document qui :


    - comporte une exclusivité englobant la marketplace, la centrale régionale ou les nouvelles références
    ;

    - accorde plus de 4 % de remise sans volume ferme sur toute la durée ;

    - prévoit une pénalité de sortie supérieure à 300 k€ ;

    - engage au-delà de 18 mois.


    **Si D exige de franchir une de ces bornes, la décision n''appartient pas au comité de direction.**
    Elle remonte au président du conseil, qui seul peut l''autoriser par écrit. Ni le DAF, ni le Directeur
    commercial, ni le comité réuni au complet et unanime n''en ont le pouvoir — un accord entre vous n''est
    pas une autorisation, et l''urgence n''en crée pas une. Ce qui manque dans ce cas précis, et qu''il
    faut aller chercher : une autorisation écrite du président. Son numéro est chez mon assistante.


    Réciproquement, **chacun d''entre vous dispose d''un veto individuel** : si l''un estime qu''une borne
    est franchie, le dossier remonte au président sans qu''une majorité puisse passer outre.


    ## 8. Réception de l''acheteur de D la semaine prochaine


    **Il ne rencontre pas le comité de direction en séance.** Notre division est écrite, elle sera exploitée
    : il obtiendra du DAF, devant témoins, un accord de principe que je ne donne pas.


    **Format imposé :** entretien bilatéral, **Directeur commercial et DAF ensemble, jamais l''un sans
    l''autre**. Aucun autre membre présent. Le Directeur commercial parle seul ; le DAF assiste et prend
    note. Aucune position exprimée sur le fond, aucune divergence évoquée, aucun chiffre de trésorerie
    communiqué. Objet déclaré de la réunion : recueillir ses arguments et remettre notre contre-proposition.
    Compte rendu écrit circulé au comité sous 24 h.


    Si l''acheteur exige de s''adresser au comité entier, la réponse est non, et elle n''a pas besoin
    d''être justifiée.


    ## 9. Le meilleur argument contre cette note


    Je l''écris moi-même pour que vous n''ayez pas à le reconstituer contre moi.


    *Si D déréférence quatre références sur huit et qu''elles portent l''essentiel du plan de charge de
    Redon, nous entrons en chômage partiel en septembre avec 2,1 M€ de trésorerie et deux alternatives
    qui ne produisent rien avant cinq mois. Une marge dégradée à 24 % sur un volume qui tourne finance
    des charges fixes qu''un refus laisse nues. Le DAF a raison sur l''horizon court.*


    Cet argument est juste à six mois et faux à dix-huit. Il tient à une condition : **que le refus soit
    financé**. C''est exactement pourquoi la ligne bancaire du § 6 est une condition et non un accessoire.


    **Conséquence opérationnelle, à appliquer littéralement :** si la ligne de 1,5 M€ n''est pas confirmée
    au 18 août au soir, l''accord de transition de 12 mois du § 5 (cas B) devient l''option retenue par
    défaut, quel que soit le chiffre du § 3. C''est le seul cas où le comité signe sans avoir mesuré l''impact.


    ## 10. Ce qui renverserait ma décision


    **Un seul fait :** que D accepte simultanément de rendre les volumes des années 2 et 3 fermes avec
    préavis de 90 jours, **et** d''exclure la marketplace et la centrale régionale du périmètre d''exclusivité,
    **et** de plafonner la pénalité de sortie.


    Si les trois sont acquis par écrit, la remise de 9 % redevient discutable — le danger vient de l''asymétrie,
    pas du taux. Dans ce cas seulement, le Directeur commercial et le DAF peuvent négocier le taux entre
    4 et 9 % et signer conjointement, dans la limite de 18 mois.


    **Toute concession partielle sur ces trois points ne vaut rien.** Deux sur trois, c''est zéro.


    ## 11. Le pire cas, et qui le supporte


    Le pire cas de la décision que je prends : perte des quatre références au 20 août, plan de charge
    sous 70 %, chômage partiel à Redon, **52 personnes** touchées dans leur revenu, trésorerie sous tension
    pendant cinq mois jusqu''à la centrale régionale. Ce sont les salariés de Redon qui encaissent d''abord,
    pas la direction — c''est pour cela que la ligne bancaire, le dossier administratif prêt et l''information
    des représentants du personnel avant le choc ne sont pas des précautions administratives mais la contrepartie
    de mon choix.


    Le pire cas de la décision inverse : la même chose en 2027, avec 3,4 M€ de marge en moins, 1,2 M€
    de pénalité pour sortir, trois ans d''interdiction de diversification, et plus aucune alternative
    en cours.


    Je choisis le premier parce qu''il est réversible et que le second ne l''est pas.


    ## 12. Première action


    **DAF, lundi matin, avant tout le reste : appeler nos deux banques pour la ligne de 1,5 M€.** C''est
    l''action dont tout le reste dépend.


    ---


    *Rédigé le 8 août. Je pars demain, injoignable trois semaines, retour après le 20 août. Vous n''aurez
    pas d''arbitrage complémentaire : cette note est l''arbitrage. Ce qui n''y figure pas et qui franchit
    une ligne du § 7 remonte au président. Ce qui n''y figure pas et ne franchit aucune ligne, décidez-le
    — vous avez ma signature.*


    ---


    Trois remarques hors note, pour vous :


    **La contre-proposition n''est pas une posture.** Elle est construite pour être acceptable par D sur
    au moins un point (le repli non exclusif à conditions actuelles ne lui coûte rien) et donne à l''acheteur
    quelque chose à rapporter à son comité du 20. Un refus sec le mettrait en position de devoir déréférencer
    pour ne pas perdre la face.


    **Le déclencheur du 18 août est volontairement mécanique.** En votre absence, tout critère demandant
    un jugement se transformera en débat entre un DAF qui veut signer et un directeur commercial qui veut
    refuser. « Ligne confirmée oui/non au 18 au soir » ne se discute pas.


    **Ce que je n''ai pas pu chiffrer** et qui pourrait déplacer les seuils : le coût industriel réel
    d''un +18 % de volume, et la part de CA des quatre références menacées. Le § 3 va chercher la seconde
    ; la première mérite une estimation du directeur industriel avant le 14, parce qu''elle ne peut que
    rendre le contrat D encore moins attractif — jamais plus.

    '
