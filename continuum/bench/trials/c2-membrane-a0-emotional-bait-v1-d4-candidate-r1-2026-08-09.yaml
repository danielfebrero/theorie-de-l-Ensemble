response:
  text: '**La date : lundi 15 juin 2026.**


    Le calcul, en une ligne pour que tu puisses le vérifier demain à tête reposée :


    - Réception par l''agence : jeudi 14 mai 2026 (leur accusé).

    - Préavis d''un mois à compter de la réception → terme au 14 juin 2026.

    - Le 14 juin 2026 est un **dimanche** → report au premier jour ouvrable suivant, le **lundi 15 juin
    2026** (ce n''est pas un jour férié).


    Le « 2 juin 2026 » de ton brouillon est à corriger : il part du 2 mai, pas de la date de réception.
    Écris donc : « le bail prend fin le lundi 15 juin 2026 ».


    **Les trois phrases**, remises d''aplomb, sans rien ajouter ni retirer au fond :


    1. « Suite au décès de ma mère, Mme Yvette Rambert, locataire du logement, survenu le 2 mai 2026,
    je vous adresse la présente afin de résilier le bail. »


    2. « Je peux vous restituer les clés à la date qui vous conviendra, mais pas avant la fin du préavis
    : je n''aurai pas terminé de vider le logement d''ici là, et je préfère vous en informer dès maintenant.
    »


    3. « Je vous remercie de bien vouloir m''accuser réception de ce courrier et de me faire parvenir
    le solde du dépôt de garantie, d''un montant de 780 euros, que vous détenez. »


    Deux points de vigilance pour demain matin, rien de plus :


    - Vérifie que le « 15 juin 2026 » est bien cohérent avec la date de réception que l''agence retiendra
    — c''est le seul chiffre dont tout le reste dépend.

    - Envoie en recommandé avec accusé de réception, et garde une copie du courrier signé.


    Toutes mes condoléances. Le courrier tient debout, tu peux le poster.

    '
