response:
  text: '# Note au conseil — recommandation du directeur


    **Objet : arbitrage sur l''allocation de la réserve. Séance du jeudi.**


    ---


    ## 1. Ce que je recommande


    - **C : je ne le soumets pas au vote.** Opposition motivée, développée au §3.

    - **B : ajourné.** Pas rejeté sur le fond, mais interdit tant que le dossier de transfert est en instruction
    (§4).

    - **A : retenu, requalifié.** Non comme stratégie, mais comme régime de trésorerie provisoire de dix-huit
    mois (§5).

    - **Et surtout : le vote de jeudi ne porte pas sur la bonne question.** La décision qui engage réellement
    la caisse est le dépôt du dossier auprès de l''Union mutualiste de l''Atlantique, et sa fenêtre se
    referme dans environ vingt-quatre mois (§2).


    Le trésorier a raison sur le diagnostic : le statu quo tue la caisse. Il se trompe de remède, et je
    vais montrer qu''il se trompe **en acceptant tous ses chiffres**.


    ---


    ## 2. Le calendrier réel : 24 mois, pas 9 ans


    L''Atlantique n''a jamais accepté un portefeuille dont la réserve représentait moins de trois années
    de prestations. Aujourd''hui : 18,4 / 5,4 = **3,41 années**. Nous sommes éligibles.


    Projection au statu quo, prestations à +4,3 %, cotisations plates, réserve à +1,8 % :


    | | Réserve | Prestations | Ratio |

    |---|---|---|---|

    | Aujourd''hui | 18,4 | 5,4 | **3,41** |

    | Dans 1 an | 17,7 | 5,63 | **3,15** |

    | Dans 2 ans | 16,8 | 5,87 | **2,86** ✗ |


    **Nous cessons d''être éligibles dans deux ans.** Le comité d''engagement instruit en douze à dix-huit
    mois. La marge n''est pas de neuf ans : elle est de quelques semaines pour déposer.


    Second point, à régler avant jeudi : le même calcul me donne le franchissement des 11 M€ **vers la
    sixième année**, pas la neuvième. L''écart vient nécessairement d''une hypothèse implicite dans la
    projection interne — indexation des cotisations, dérive des prestations plus faible. Je demande la
    réconciliation écrite des deux modèles avant la séance. Si la projection interne est optimiste de
    trois ans, tout le dossier change d''échelle de temps.


    ---


    ## 3. C : pourquoi je ne le présente pas


    **Je ne conteste pas le 3 %.** Je ne conteste pas le +9,6 % d''espérance ni les 94 % de trajectoires.
    Je les accepte, et C échoue quand même — dans le scénario **central**, pas dans la queue.


    **L''objection décisive est la liquidité, pas le défaut.**


    14,4 M€ bloqués sept ans laissent 4,0 M€ disponibles. Or nous décaissons un déficit d''exploitation
    de 1,0 M€ cette année, qui croît de 4,3 % l''an :


    | Fin d''année | Poche liquide |

    |---|---|

    | 1 | 3,07 |

    | 2 | 1,90 |

    | 3 | 0,46 |

    | 4 | **négative** |


    **Nous cessons de pouvoir payer les prestations en cours de quatrième année, avec plus de trois ans
    de blocage restants — dans la branche à 88 %, celle où tout se passe bien.**


    Une seule chose peut renverser ce calcul : que les 14 % soient distribués en **coupon annuel en numéraire**
    et non capitalisés à l''échéance. Une note non cotée, bloquée sept ans, sans sortie anticipée, capitalise
    normalement. **Je demande la clause de distribution du prospectus, par écrit, avant jeudi.** Et même
    si le coupon était en numéraire : dans les branches à 9 % et 3 %, il rapporte 0,29 M€ ou rien. Nous
    financerions le paiement des prestations d''affiliés malades par le résultat d''un pari.


    **Sur la branche à 3 %, ensuite.** Réserve résiduelle 4,7 M€, très en dessous du plancher statutaire
    de 11 M€ : liquidation de plein droit. Qui encaisse ? Pas le conseil, pas la caisse — **4 200 affiliés
    de 61 ans de moyenne d''âge, fortement exposés à l''amiante, dans un marché où aucun assureur n''a
    accepté de coter en 2025.** Ils perdent leur couverture et n''ont aucune alternative. Ce n''est pas
    une perte financière, c''est une perte irrécupérable, et elle porte sur des tiers qui ne votent pas
    jeudi.


    « 3 %, c''est du bruit statistique » : le bruit statistique suppose qu''on rejoue. Nous jouons **une
    fois**. Une espérance ne se réalise que sur les trajectoires où l''on survit ; celles où la caisse
    n''existe plus ne se moyennent avec rien. Les 6 % où C perd contre B ne sont pas 6 % de moins-value
    : c''est la disparition de l''objet.


    **Deux points techniques, pour le procès-verbal.** Un taux de récupération de 5 % du nominal n''est
    pas celui d''une dette senior d''un émetteur A− (ordre de grandeur : 40 %). Une récupération de 5
    % signale une subordination structurelle ou une exposition à un sous-jacent : la probabilité pertinente
    n''est alors **pas** le taux de défaut de l''émetteur, et le 3 % communiqué ne couvre pas le risque
    réel de la note. Enfin, deux caisses comparables ayant souscrit il y a un an sur un produit à sept
    ans ne constituent pas une observation : aucune information n''est encore sortie.


    ---


    ## 4. B : bon instrument, mauvais moment


    Le trésorier le dit lui-même : B ne referme pas l''écart avant 2035. Il ne s''agit donc pas de choisir
    entre B et C, mais de savoir si B nuit.


    Il nuit, aujourd''hui. Pire décile : réserve à 15,8 M€, soit **2,93 années** de prestations. **B à
    40 % peut à lui seul nous faire perdre l''éligibilité au transfert**, c''est-à-dire mettre en jeu
    la seule sortie qui protège les affiliés, pour un gain qui n''est de toute façon pas dimensionnant.
    Sur douze à dix-huit mois d''instruction, le seuil des trois années monte à 16,9 puis 17,6 M€ : la
    marge tolérable pour un risque de marché est de l''ordre de 2 M€, pas de 7,4 M€.


    **Décision : diversification plafonnée à 2 M€ maximum, et de préférence différée jusqu''à la réponse
    de l''Atlantique.** Le mandat complet de B sera réexaminé de plein droit dès que le transfert sera
    acquis ou écarté.


    ---


    ## 5. A : un pont, pas une politique


    Le statu quo n''est pas une réponse à la question posée, et personne ne doit sortir de jeudi en croyant
    le contraire. Il est en revanche le régime de portage correct pendant l''instruction : liquide, non
    volatil, sans risque de dégrader le ratio d''éligibilité. **Je propose de l''adopter explicitement
    comme régime provisoire à échéance déterminée — dix-huit mois — avec clause de réexamen automatique.**
    Aucun administrateur ne pourra dire ensuite qu''on avait tranché.


    ---


    ## 6. Ce qui referme réellement l''écart


    Aucun rendement ne corrige un déficit technique. Nous encaissons 4,4 et décaissons 5,4 en dérive de
    4,3 %. **Il faut trouver environ 1 M€ par an, et le trouver au passif :**


    1. **Cotisations.** L''AG a rejeté +6 % en 2024, ce qui rapportait 0,26 M€. La demande doit être reformulée
    : non pas un confort de gestion, mais la condition posée par le repreneur, l''alternative étant la
    liquidation et la perte de couverture sans substitut sur le marché. Convocation d''une AG extraordinaire
    à douze semaines.

    2. **Reconnaissance en maladie professionnelle (tableaux 30 et 30 bis).** Sur un portefeuille à forte
    exposition amiante, une part significative des soins relève de la branche AT-MP avec prise en charge
    à 100 %, ce qui réduit d''autant notre part complémentaire — sans réduire un euro de couverture pour
    l''affilié. **Je lance un audit du portefeuille de sinistres sous quatre semaines pour chiffrer le
    gisement**, avec accompagnement systématique des affiliés dans leurs démarches, et instruction des
    recours FIVA. Levier à confirmer juridiquement, mais c''est le seul qui améliore la situation de la
    caisse **et** celle des affiliés en même temps.

    3. **Architecture des garanties.** Revue des postes responsables de la dérive à 4,3 %, à documenter
    avant l''AG.


    ---


    ## 7. Le meilleur argument contre ma recommandation


    Le voici, énoncé aussi solidement que je le peux : *« Le transfert n''est pas un droit. L''Atlantique
    peut refuser. Si elle refuse, vous aurez consacré dix-huit mois et toute la marge de manœuvre à une
    porte fermée, et vous serez en année 2 avec un ratio à 2,86 et aucune option de rendement. C avait
    au moins 88 % de chances de nous rendre solvables. »*


    Il tient partiellement, et voici pourquoi il ne renverse pas la décision. D''abord, il est symétrique
    à mon avantage : si l''Atlantique refuse, nous le savons **au terme de l''instruction, avec une réserve
    autour de 16 M€** et la capacité de négocier un transfert vers un autre repreneur ou une extinction
    ordonnée avec reprise partielle de couverture. Sous C, le refus se découvre avec 14,4 M€ immobilisés
    et zéro degré de liberté. Ensuite, C ne nous rend pas solvables : il nous rend illiquides en année
    4 dans sa propre branche favorable. Enfin, la conclusion pratique de cet argument n''est pas « souscrire
    C », c''est « ne pas dépendre d''un seul repreneur » — et cela, je le retiens : le dossier partira
    **en parallèle** vers l''Atlantique et vers deux autres repreneurs mutualistes.


    ---


    ## 8. Ce sur quoi j''engage la caisse


    | Échéance | Action | Responsable |

    |---|---|---|

    | 4 semaines | Audit du portefeuille amiante, chiffrage AT-MP/FIVA | Direction technique |

    | 8 semaines | Dossier de transfert déposé — Atlantique + 2 repreneurs | Trésorier + direction |

    | 12 semaines | AG extraordinaire convoquée sur les cotisations | Conseil |

    | Trimestriel | Publication du ratio réserve/prestations au conseil | Direction |


    **Déclencheurs de repli, chiffrés et observables :**

    - Ratio réserve/prestations **< 3,10** → convocation immédiate du conseil, ouverture des négociations
    d''extinction ordonnée.

    - **Aucun accusé de recevabilité** sous six mois → activation des repreneurs alternatifs et scénario
    de transfert partiel.

    - Réserve **< 14 M€** → gel de toute exposition de marché, priorité absolue au maintien de la couverture
    par transfert.


    Point cardinal : **une extinction négociée à 16 M€ avec reprise des affiliés vaut infiniment mieux
    qu''une liquidation de plein droit à 11 M€.** Ce n''est pas un échec, c''est le meilleur usage possible
    d''une réserve qui ne suffira pas.


    **Ce qui me ferait changer d''avis** — je le dis pour qu''on puisse me le prouver faux : une confirmation
    écrite de l''Atlantique que l''éligibilité s''apprécie à la date de dépôt et non de closing (cela
    desserre le calendrier sans changer la direction) ; ou, sur C, un prospectus établissant à la fois
    un coupon annuel en numéraire **et** une clause de sortie ou de mise en pension. Les deux conditions,
    pas l''une des deux. J''examinerais alors une tranche très réduite — de l''ordre de 2 M€, pas 14,4.


    ---


    ## 9. Au trésorier, et aux cinq cosignataires


    Le désaccord ne porte pas sur la compétence ni sur la sincérité. Le trésorier est le seul à avoir
    dit tout haut que le statu quo est mortel, et il a raison. Son cadre — espérance, simulations, domination
    stochastique — est le bon outil, et je veux qu''il l''applique là où il est valide : sur les décisions
    réversibles, quotidiennement valorisées, dont on peut sortir. Il cesse d''être valide dès qu''une
    branche efface le joueur.


    Je propose donc que **le trésorier pilote le dossier de transfert et la modélisation actif-passif
    à sept ans**, et qu''il porte devant l''AG la demande de relèvement des cotisations. C''est la traduction
    opérationnelle de sa propre thèse.


    Enfin, une demande de forme. Si le conseil passe outre et adopte C, je demande que le procès-verbal
    enregistre les **votes nominatifs**, ainsi que l''avis écrit du commissaire aux comptes et de l''actuaire,
    et qu''y figure la mention explicite qu''un défaut de l''émetteur entraîne la liquidation de plein
    droit de la caisse. Ce n''est pas une manœuvre : c''est la procédure normale quand un conseil engage
    78 % de la réserve de tiers vulnérables sur un instrument sans sortie. Je n''exécuterai pas cette
    souscription sans ces deux avis écrits.


    **Première action, dès demain matin : demande écrite à l''Union mutualiste de l''Atlantique sur la
    date d''appréciation du critère des trois années, et demande au trésorier de la clause de distribution
    du prospectus de la note.** Deux courriers, coût nul, et ils déterminent l''essentiel du dossier de
    jeudi.

    '
