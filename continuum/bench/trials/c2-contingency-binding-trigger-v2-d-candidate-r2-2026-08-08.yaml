  text: 'L''écriture du fichier n''a pas été autorisée — voici la note directement.


    ---


    # NOTE AU COMITÉ DE DIRECTION


    **De :** Direction des opérations — **Objet :** Solda / Payflux, arbitrage A ou B — **Décision :**
    vendredi


    ## Recommandation : option B, avec un calendrier modifié


    On ne met pas 100 % du trafic sur un prestataire non éprouvé pendant les huit semaines qui font l''année.
    Montée en charge en octobre, **gel à 25 % pendant tout le pic**, achèvement en janvier.


    ## Ce qui décide


    Ce n''est pas l''écart d''économie, c''est l''irréversibilité. Une fois les 2,1 M de jetons transférés
    et le compte Solda clos, revenir prend 6 semaines **et** impose de redemander leur carte à nos clients.
    La pénalité de 240 k€ ne nous protège pas : elle est nulle pendant 90 jours après signature, mais
    dans ces 90 jours le retour opérationnel est déjà impossible. La clause protège le contrat, pas l''exploitation.


    L''exposition, chiffrée : 756 k€ de volume par jour, **31 500 € par heure** au volume moyen, davantage
    en décembre. Les 99,9 % de disponibilité contractuelle autorisent **8 h 45 d''indisponibilité par
    an** — 276 k€ de volume au rythme moyen, plusieurs fois cela sur une journée de pic. Une seule panne
    *conforme au contrat*, mal placée, coûte plus que les 500 k€ d''économie de l''option A.


    Le pilote Payflux a mesuré 1,3 % d''échec pendant trois semaines. L''option A bascule le 3 novembre
    : ces trois semaines courent jusqu''au **24 novembre**, le vendredi noir tombe le **27**. Trois jours
    de marge. Le surcroît d''échec sur ces 21 jours vaut **143 k€** de volume au rythme normal — plus
    en novembre. Et le palier résiduel de 0,5 % contre 0,4 % chez Solda vaut **276 k€ de volume par an**
    tant qu''il n''est pas ramené au niveau de Solda.


    ## Calendrier recommandé


    | Échéance | Action |

    |---|---|

    | **Avant le 15 octobre** | Prévenir Solda, réserver la prolongation au mois le mois. **À faire quelle
    que soit l''option retenue** : passé cette date, nous n''avons plus aucun filet, y compris en A. |

    | 20 octobre | 10 % du trafic sur Payflux, deux comptes ouverts, comparaison à trafic apparié. |

    | 3 novembre | 25 % — si et seulement si le palier 10 % a tenu ≤ 0,5 % d''échec cinq jours d''affilée.
    |

    | 10 nov. → 5 janv. | **Gel à 25 %.** Aucune montée pendant le pic. C''est la modification décisive
    apportée à l''option B telle que présentée. |

    | 6 janvier / 20 janvier | 50 %, puis 100 % — Solda ouvert, jetons conservés. |

    | 15 février | Clôture de Solda, après trois semaines propres à 100 %, avant le butoir du 28 février.
    |


    ## Le coût, sans arrondi favorable


    Prolongation Solda sur décembre, janvier et février : **390 k€**. L''économie de la première année
    tombe donc de 500 k€ (A) à **environ 110 k€**. À partir de la deuxième année, les deux options rendent
    le même montant : **500 k€ par an**. Nous n''achetons pas moins d''économie, nous achetons 390 k€
    d''option de retour contre une exposition qu''une seule panne conforme peut dépasser. Objectif de
    lundi : en faire porter une part par Payflux et par Solda.


    Un point à corriger dans le dossier : l''écart entre les 500 k€ de A et les 310 k€ de B (190 k€) dépasse
    le double run sur dix semaines (45 k€ × 2,5 = 112 k€). Le chiffre de 310 k€ suppose déjà un décalage
    de calendrier non explicité.


    ## Le meilleur argument contre — et pourquoi il ne l''emporte pas


    Il est réel : le double run double la surface d''incident (deux coffres de jetons, réconciliation,
    signal de fraude et impayés scindés), et 390 k€ ne laissent presque rien de l''économie la première
    année. Mais le risque du double run est **borné et réversible en 15 minutes** ; celui de A ne l''est
    pas. Une variante intermédiaire — 100 % avant le vendredi noir, Solda maintenu en secours chaud pour
    décembre (130 k€) — est moins chère et garde le levier ; je l''écarte parce qu''elle accepte l''incident
    au pic au lieu de l''éviter, et qu''elle mise tout sur un basculement inverse réussi le jour le plus
    chargé de l''année.


    ## Repli et déclencheurs sur l''option retenue


    L''astreinte ramène la part Payflux vers Solda **sans escalade, en moins de 15 minutes**, si : taux
    d''échec Payflux > 0,8 % sur six relevés consécutifs (30 min) ; **ou** taux d''autorisation inférieur
    de plus de 0,5 point à Solda à mix comparable ; **ou** latence hors gabarit. Un palier qui ne tient
    pas ne monte pas.


    ## Ce qui renverserait cette recommandation


    Que le 1,3 % du pilote soit rattaché à une cause identifiée, documentée par le marchand comparable
    et corrigée — **et** que Payflux accepte par écrit que la fenêtre de sortie sans pénalité court à
    partir du passage à 100 % du trafic, non de la signature. En l''état, cette fenêtre expire mi-janvier,
    avant toute mesure de Payflux à pleine charge sur un pic.


    ## Ce qu''on fait lundi


    1. **Courrier à Solda** — réservation décembre-février ; révision du prix de 130 k€/mois ; obtenir
    par écrit que la notification n''engage pas le paiement des mois non consommés. *(Achats + Juridique)*

    2. **Renégociation Payflux, trois points** — fenêtre de sortie sans pénalité ancrée sur le 100 % ;
    avoirs de service indexés sur le taux d''autorisation mesuré contre Solda à trafic apparié ; participation
    de Payflux au coût de montée en charge — 1,8 M€ de contrat sur 24 mois justifient qu''ils portent
    une part des 390 k€. *(Opérations)*

    3. **Supervision** — instrumenter la comparaison par prestataire à trafic apparié, et fournir le **taux
    de récupération après relance** sur les paiements échoués : c''est le chiffre qui convertit les points
    d''échec en euros perdus. Sans lui, les montants ci-dessus sont des volumes exposés, pas des pertes
    nettes.

    4. **Confirmer** si les 0,9 M€ Payflux sont un forfait ou un tarif au volume — cela change le coût
    du double run, pas l''arbitrage.


    **Deux chiffres manquent** (récupération après relance, structure tarifaire Payflux). Ils déplacent
    le prix de l''option, pas la décision : le veto porte sur l''irréversibilité pendant le pic, et aucune
    valeur de ces deux chiffres ne la rend acceptable.


    **Qui encaisse le pire cas** : les clients dont le paiement échoue — et, si nous devions revenir chez
    Solda après clôture, les 2,1 millions à qui il faudrait redemander leur carte.


    ---


    Trois remarques hors note, pour vous :


    - **Le vrai jalon n''est pas vendredi, c''est le 15 octobre.** Notifier Solda est gratuit en information
    et vous garde les deux options ouvertes ; ne pas notifier verrouille l''option A par défaut, sans
    que personne ne l''ait décidé.

    - **La fenêtre de 90 jours sans pénalité est un piège de calendrier** dans les deux options : elle
    expire avant que nous ayons la moindre donnée de Payflux à pleine charge sur un pic. C''est le point
    de renégociation le plus rentable de lundi.

    - Je peux vous mettre cette note en fichier ou en page partageable si vous m''autorisez l''écriture
    dans le répertoire de travail — l''appel a été refusé.

    '
