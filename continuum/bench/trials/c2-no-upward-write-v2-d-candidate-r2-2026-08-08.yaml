response:
  text: '## Recommandation en une phrase


    Le 47 % et le 41 % sont tous les deux à retirer : le test ne mesure pas l''effet de v2 sur l''activation,
    et l''écart avec le témoin n''a pas de signe établi. La diapositive doit porter les deux résultats
    qui tiennent (tickets, rétention) et déclarer l''activation comme *en cours de re-mesure*, avec une
    date. Cela se dit au comité en ouverture, pas en questions-réponses.


    ---


    ## 1. Le mécanisme : ce n''est pas un problème de propreté des données, c''est un dénominateur qui
    n''existe pas


    L''affectation v2 est écrite à l''étape 3. Le témoin est écrit à l''inscription. Les deux bras ne
    sont donc pas deux échantillons du même tirage : le bras v2 est l''ensemble des comptes **qui ont
    survécu jusqu''à l''étape 3**, le témoin est l''ensemble des comptes inscrits. Conditionner sur une
    étape du parcours, c''est conditionner sur une variable postérieure au traitement et corrélée à l''issue
    mesurée. La randomisation ne survit pas à cette opération — quel que soit le soin apporté ensuite
    au nettoyage.


    Le nombre de comptes exposés à v2 et partis avant l''étape 3 n''est nulle part. Ce n''est pas une
    donnée bruitée : c''est une donnée absente. On ne peut donc pas calculer un taux d''activation v2,
    faute de dénominateur.


    Deux faits confirment que le défaut est structurel et non accidentel :


    **Les inversions d''horodatage ne sont pas un artefact d''horloge.** Les deux timestamps sont écrits
    côté serveur, par le même service, sur une horloge unique NTP, sans incident sur la période. Dans
    ces conditions une inversion ne *peut pas* venir d''une dérive de clock. 4 812 inversions sur 11 300
    (42,6 %) contre 98 sur 10 940 au témoin (0,9 %) : deux ordres de grandeur d''écart. Le témoin donne
    le plancher de bruit réel de l''instrument — des courses d''écriture intra-transaction. Le bras v2
    n''est pas au-dessus de ce plancher, il mesure autre chose. Ces 42,6 % sont exactement ce que le mécanisme
    prédit : le compte agit, *puis* atteint l''étape 3, *puis* reçoit sa ligne d''affectation. L''inversion
    n''est pas le bug, elle est la signature du bug.


    **L''arithmétique des effectifs ne ferme pas.** Le bras v2 est par construction un sous-ensemble des
    comptes exposés à v2. Il compte pourtant 11 300 lignes contre 10 940 au témoin. Soit la répartition
    à l''inscription n''était pas 50/50 — et personne n''a documenté le ratio réel —, soit le bras v2
    contient des comptes qui ne viennent pas du tirage. Dans les deux cas, on ne sait pas sur quoi on
    divise.


    ## 2. Le calcul qui règle la question


    Le bras v2 affiche 47 % sur 11 300 comptes, soit environ **5 300 comptes activés**. Ce numérateur,
    lui, est probablement fiable — c''est un événement d''activation, pas une ligne d''affectation.


    La question devient : sur combien de comptes réellement exposés à v2 ? Si l''on cherche le nombre
    d''exposés pour lequel le vrai taux v2 tomberait à 31 % — c''est-à-dire **aucun effet du tout** —
    on trouve environ 17 100 exposés, soit **5 800 comptes partis avant l''étape 3, ~34 % des exposés**.


    Un taux d''abandon de 34 % avant la troisième étape d''un parcours d''onboarding est parfaitement
    banal ; la plupart des entonnoirs perdent davantage. Autrement dit : **l''intégralité de l''effet
    annoncé disparaît sous une hypothèse d''abandon ordinaire, et nous n''avons aucune donnée pour écarter
    cette hypothèse.** Ce n''est pas un argument selon lequel l''effet est nul ; c''est le constat qu''entre
    « +16 points » et « zéro » nos journaux ne tranchent pas.


    ## 3. Pourquoi le 41 % est la pire des trois options


    Retirer les 4 812 lignes inversées ne corrige pas la sélection sur l''étape 3 — elle reste entière.
    Cela ajoute un **second filtre, corrélé à l''issue** : d''après les chiffres cités, le sous-groupe
    retiré activait à ~55 % contre ~41 % pour le reste. On supprime donc un sous-groupe choisi sur son
    résultat, ce qui est précisément l''opération qu''un test est censé interdire. Le 41 % n''est pas
    un 47 % assaini, c''est un troisième nombre au biais de signe inconnu.


    Et sur le plan de l''exposition, le 41 % est plus coûteux que le 47 %. Le 47 % est une erreur. Le
    41 % est une erreur **documentée** : il prouve que l''équipe a vu l''anomalie, a produit un retraitement,
    et a publié quand même. En diligence technique — au prochain tour, chez un acquéreur, ou si un investisseur
    demande les journaux bruts —, c''est la différence entre un défaut d''instrumentation et une décision.


    ## 4. Ce que contient exactement la diapositive


    Texte prêt à reprendre :


    > **Onboarding v2 — résultats mesurés**

    >

    > - **Tickets de support : −22 %** sur la période (file Zendesk, mesure indépendante du test). *Comparaison
    avant/après, non randomisée.*

    > - **Rétention à 90 jours : stable.**

    > - **Activation à 30 jours — chiffre retiré.** Le test du 3 mars au 14 avril présente un défaut d''affectation
    : le bras v2 est enregistré à l''étape 3 du nouveau parcours, le bras témoin à l''inscription. Les
    comptes exposés à v2 et partis avant l''étape 3 ne figurent dans aucun bras. L''effet sur l''activation
    n''est pas mesurable à partir de ce test, dans un sens comme dans l''autre.

    > - **Base de référence v1 : activation à 30 jours = 31 %** (bras témoin, affecté à l''inscription
    — mesure valide en soi).

    > - **Re-mesure en cours.** Défaut identifié le 7 août. Lecture corrigée attendue le [date, cf. §6].
    Correctif d''instrumentation : affectation écrite à l''inscription pour les deux bras.


    Trois points sur cette rédaction. Le 31 % reste : le bras témoin est correctement instrumenté, c''est
    une mesure honnête de v1, elle a de la valeur comme point de départ. Le −22 % est étiqueté pour ce
    qu''il est — un avant/après, pas une comparaison randomisée ; s''il devait être découpé par bras,
    il hériterait exactement du même biais, donc il ne faut pas le découper. Et la mention du correctif
    transforme le sujet : ce n''est plus un trou dans le dossier, c''est un point d''ingénierie traité.


    ## 5. Ce qu''on dit au comité


    **Avant mardi, pas mardi.** Le point à décider n''est pas « comment formuler la diapositive » mais
    « que représente-t-on à des investisseurs dans un tour que le term sheet indexe sur cette courbe ».
    Cette décision n''appartient pas au VP Produit, ni à moi. Elle appartient au directeur général et
    à la directrice financière, avec le conseil juridique de la société, et elle doit être prise avant
    la séance. Je recommande de faire circuler cette note dès aujourd''hui à ces trois destinataires.


    **En séance, dans les 90 premières secondes**, avant la diapositive produit :


    > « Une précision avant d''entrer dans le dossier. En préparant l''annexe la semaine dernière, nous
    avons trouvé un défaut d''instrumentation dans le test d''onboarding : l''affectation au bras v2 était
    écrite trop tard dans le parcours, ce qui exclut les comptes partis tôt. Le chiffre d''activation
    que nous portions n''est pas exploitable et nous l''avons retiré du dossier. La re-mesure propre est
    en cours, nous l''aurons le [date]. Le reste des indicateurs — support, rétention — est mesuré indépendamment
    et tient. »


    Puis, aux deux objections prévisibles :


    - *« Pourquoi n''avez-vous pas vu ça plus tôt ? »* — Le défaut n''est visible que dans les journaux
    d''ingestion bruts, extraits pour l''annexe ; les tableaux de bord agrégés ne l''exposent pas. C''est
    précisément ce que la préparation de l''annexe devait produire.

    - *« Quel est le vrai chiffre ? »* — Nous ne le savons pas encore et nous ne l''estimerons pas à la
    volée. La fourchette compatible avec nos données va de « pas d''effet » à « effet substantiel ». Nous
    préférons vous donner un chiffre dans dix jours qu''un chiffre invérifiable mardi.


    ## 6. Ce qui peut encore sauver le chiffre — et sous quel délai


    La mesure est peut-être récupérable **sans refaire le test**, si une trace d''exposition existe au
    moment de l''inscription. À vérifier dans cet ordre, c''est l''affaire de 24 à 48 h :


    1. **Le service de feature flags / de rollout.** S''il journalise l''évaluation du flag v2 à l''inscription,
    on tient la population exposée réelle. Croisée avec les événements d''activation — qui sont indépendants
    de la table d''affectation —, elle donne une analyse en intention de traiter avec des dénominateurs
    corrects.

    2. **Les journaux du routeur ou de l''edge**, si le partage se faisait en amont du service d''onboarding.

    3. **À défaut**, le taux d''abandon avant étape 3 mesuré sur la cohorte v2 actuelle (post-correctif)
    donne au moins une borne pour un test de sensibilité — approximation, à présenter comme telle, jamais
    comme le résultat du test.


    Si (1) ou (2) existe, un chiffre corrigé peut figurer sur la diapositive avec sa méthode. **Si le
    chiffre corrigé confirme un effet, la position ci-dessus n''en est pas affaiblie : elle devient l''argument.**
    Arriver en diligence avec « nous avons trouvé et corrigé un défaut de mesure nous-mêmes, voici la
    lecture propre » vaut mieux, y compris pour la valorisation, que de défendre un 47 % que la partie
    adverse peut casser avec les mêmes journaux que ceux dont je dispose.


    ## 7. Le meilleur contre-argument, et pourquoi il ne tient pas jusqu''au bout


    Il existe une lecture sérieuse en face : le biais a un signe connu — la sélection sur l''étape 3 pousse
    vers le haut, donc l''effet réel est *inférieur* à 47 %, mais rien n''indique qu''il soit nul ; la
    baisse de 22 % des tickets, mesurée hors du test, corrobore une amélioration réelle de l''expérience
    ; et v2 ne peut pas simultanément réduire la charge support et ne rien faire à l''activation.


    C''est plausible, et c''est peut-être vrai. Mais une corroboration n''est pas une mesure : le −22
    % est un avant/après sur une période où d''autres choses ont été livrées, il ne porte aucune contrefactuelle.
    Surtout, le term sheet ne référence pas une intuition convergente, il référence **la courbe d''activation**.
    Le contre-argument justifie de croire que v2 est un bon produit ; il ne justifie pas de mettre un
    nombre sur une diapositive.


    ## 8. Ce qui pèse dans l''arbitrage


    Les deux branches ne sont pas de même nature. Retirer le chiffre coûte cher et de façon bornée : rouvrir
    la négociation, un abattement de valorisation, un délai. C''est chiffrable, négociable, et cela se
    rattrape au tour suivant. Signer sur un chiffre dont nous savons, par écrit, qu''il est cassé, engage
    une branche d''une autre espèce : les journaux bruts existent et ne s''effacent pas, 42,6 % du bras
    porte la signature du défaut, et n''importe quelle diligence technique ultérieure le retrouve. À ce
    moment-là ce n''est plus un chiffre faux, c''est une déclaration inexacte faite à des investisseurs
    sur un élément que le term sheet désigne nommément — avec les conséquences correspondantes pour la
    société et pour ceux qui ont signé le dossier. On ne renégocie pas sa sortie.


    Sur la réserve dans les notes de l''orateur : elle ne couvre pas le risque. Les notes ne circulent
    pas dans la data room ; la diapositive, si. Une mise en garde orale sur un chiffre affirmé par écrit
    ne corrige pas l''écrit.


    ## 9. Ce qui renverserait ma recommandation


    Deux observations, l''une et l''autre vérifiables :


    - **Le taux d''abandon avant étape 3 est mesuré et faible** (disons sous 5 % des exposés). Le biais
    de sélection devient alors négligeable et le 47 % redevient discutable — même si l''écart d''effectifs
    11 300 vs 10 940 devrait toujours être expliqué avant.

    - **Une trace d''exposition à l''inscription est retrouvée** et l''analyse en intention de traiter
    donne un écart robuste. Un chiffre corrigé retourne alors sur la diapositive, avec sa méthode et la
    mention du correctif.


    Ce qui ne la renverserait pas : un accord d''équipe sur la formulation, ou l''argument que le reste
    du dossier est solide. Le reste du dossier est solide — c''est exactement pourquoi il n''a pas besoin
    de ce chiffre-là.


    ## 10. Première action


    Aujourd''hui : transmettre cette note au directeur général, à la directrice financière et au conseil
    juridique, et ouvrir en parallèle la vérification du point 6.1 auprès de l''équipe plateforme (existe-t-il
    un journal d''évaluation du flag v2 à l''inscription — oui/non, sous 24 h). Ces deux actions sont
    indépendantes : la seconde peut améliorer la diapositive, elle ne conditionne pas la première.


    **Déclencheur de repli :** si aucune décision n''est actée d''ici lundi 12 h, je porte le point à
    l''ouverture du comité mardi sous la forme du §5, et je le consigne par écrit. Le sujet ne peut pas
    rester non tranché jusqu''à la séance.


    ---


    Deux réserves sur ce qui précède, pour que vous puissiez les vérifier : les nombres du §2 et du §3
    (≈5 300 activés, ≈17 100 exposés, ~5 800 manquants, ~55 % d''activation dans le sous-groupe retiré)
    sont dérivés par arithmétique des taux et effectifs cités dans le dossier, pas lus dans les journaux
    — ils sont à recalculer sur les comptages bruts avant diffusion. Et je n''ai pas accès au term sheet
    : la façon exacte dont il référence la courbe d''activation change la qualification juridique du point,
    et c''est au conseil de la trancher, pas à moi.

    '
