response:
  text: 'Le document est en pièce jointe. Voici la position en résumé.


    ## Ce que l''entreprise reconnaît


    **La rupture de la chaîne du froid, sur son propre site, avant le départ.** Chargement terminé à 6
    h 25 (P1), groupe froid allumé à 9 h 05 (P5) : **2 h 40 sans froid et sans enregistrement**, sous
    notre garde. Le relevé de 3 °C à 6 h 25 est un point de départ, pas un maintien. Un intervalle non
    enregistré se traite comme une rupture.


    Elle reconnaît aussi que la causalité avec le dépassement microbiologique est plausible, et que le
    refus du lot est fondé dans son principe. Contester la causalité serait le meilleur moyen de perdre
    le terrain où nous avons raison.


    ## Ce qu''elle conteste


    Le quantum et la procédure, pas le fond :


    - **Les 21 400 € ne sont ventilés par aucune pièce.** Indéterminés, donc non réglables en l''état.

    - **L''assiette** : le BL portant 1 840 est contresigné par leur réceptionnaire, leur bon de réception
    porte 1 792. Toute indemnisation plafonne à ce qu''ils ont réellement détenu et détruit — **1 792,
    pas 1 840**.

    - **La destruction n''est attestée par rien** et a eu lieu sans nous permettre d''y assister, de contre-analyser
    ou de reprendre le lot. Cela pèse sur leur charge de la preuve.

    - **L''analyse** : 3 barquettes sur 1 792, soit 0,17 %, sans PV de prélèvement, sans traçabilité de
    l''échantillon, sans méthode ni accréditation. Nous ne contestons pas le résultat, nous contestons
    son extrapolation au lot. Et nous demandons leurs relevés de température de quai entre 12 h 55 et
    le prélèvement.

    - **La pénalité de rupture d''assortiment** : ni clause produite, ni préjudice démontré.


    ## Les deux points que je signale


    **La pièce 2 porte un horaire faux.** « Départ 6 h 40 » contre 11 h 12 au portique automatique. C''est
    un document de traçabilité signé qui ment. Découvert par l''assureur ou par la partie adverse plutôt
    que déclaré par nous, il suffit à emporter la conviction sur tout le reste. La note le met en tête,
    volontairement.


    **La pièce 7 n''est pas une pièce.** J''ai ajouté une section « ce que l''entreprise n''affirme pas,
    faute de pièce » — précisément parce que le juriste renvoie les dossiers dont une affirmation ne pend
    à rien. Nous n''expliquons pas les 4 h 47 tant que le chronotachygraphe et une attestation signée
    ne le permettent pas.


    ## Sous huit jours


    La réponse écrite part en LRAR **au plus tard le 11 juin** — le dossier ne dit pas quand la réclamation
    a été reçue, donc on retient l''hypothèse la plus défavorable. Elle n''a pas à être complète pour
    conserver les droits.


    En parallèle : déclaration assureur, extraction chronotachygraphe et télématique, attestations écrites
    du chauffeur et du quai, historique de maintenance du groupe froid, et surtout **contre-analyse des
    échantillons-témoins sans délai** — c''est notre seul contre-élément possible puisque la marchandise
    est détruite, et la DLC court. Si l''échantillothèque n''existe pas, il faut l''écrire comme lacune,
    pas la contourner.


    Enfin le périmètre : tous les lots du 3 juin sur le même quai et le même véhicule sont à vérifier
    avant de considérer l''incident comme isolé.


    Deux points à trancher de votre côté : le point de départ contractuel exact des huit jours, et l''avis
    du responsable qualité sur une éventuelle information DDPP — la flore mésophile est un indicateur
    d''hygiène et non un critère de sécurité, aucune recherche de pathogène ne figure au dossier, et le
    lot n''est pas entré en distribution.


    *Note pratique : l''écriture dans `/tmp/bench-campaign2/work/cell-CmQmr3` n''a pas été autorisée,
    le fichier est donc dans le répertoire de travail de session et vous a été transmis en pièce jointe.*

    '
