response:
  text: '## Avis — renouvellement du logiciel de réservation et des bornes de prêt


    **En une phrase :** le dossier ne permet pas aujourd''hui de choisir entre la v4 et le libre, parce
    que la cause des pertes de réservations n''est pas établie ; la seule décision réellement contrainte
    par le calendrier est la continuité contractuelle au 31 octobre, et elle se traite par une reconduction
    courte, sans engagement de trois ans et sans les 31 000 € de migration.


    ---


    ## A. Ce que le dossier établit


    **A1. Deux pannes différentes sont traitées comme une seule.**

    D''un côté l''indisponibilité des bornes (41 h sur 12 mois) ; de l''autre les pertes de réservations.
    Aucune pièce du dossier ne relie les deux.

    *Repose sur :* l''export technique compte des heures d''indisponibilité de bornes ; l''enquête interne
    et les notes de sites décrivent des réservations perdues. Ce sont deux mesures d''objets distincts.


    **A2. L''indisponibilité des bornes est un problème de matériel, concentré et identifié.**

    32 h sur 41, soit 78 %, sur les deux seuls sites équipés des bornes de 2015.

    *Repose sur :* l''export technique.


    **A3. Fontaine dissocie l''âge des bornes et la perte de réservations.**

    Fontaine a les mêmes bornes de 2015 et partage les 32 h d''indisponibilité, mais ne signale aucune
    perte de réservation.

    *Repose sur :* export technique + notes de sites.


    **A4. Rive-Sud cumule quatre faits distincts sur février-mars.**

    Bornes de 2015, remplacement du lien fibre en février, changement de version du portail usagers en
    février, ressaisie manuelle à partir de mars.

    *Repose sur :* export technique, note « Février », notes de sites.


    **A5. Le coût de la panne est aujourd''hui absorbé par un seul site.**

    5 h/semaine de ressaisie à Rive-Sud ≈ 230 h/an, soit environ 0,14 ETP, financés par le budget de personnel
    du site et non par le contrat.

    *Repose sur :* notes de sites.


    **A6. La courbe des réclamations est concentrée et s''arrête.**

    71 réclamations sur 96 entre mars et juin, soit ~17,8/mois sur cette période contre ~3,1/mois le reste
    de l''année. Aucun pic après juin, alors que la version de mars est toujours déployée.

    *Repose sur :* réclamations usagers. Deux lectures possibles : la cause était transitoire, ou la ressaisie
    manuelle de Rive-Sud a rendu la panne invisible aux usagers en la reportant sur les agents. Le dossier
    ne tranche pas.


    **A7. La capacité interne de conduire un projet à l''automne est nulle ou presque.**

    Deux personnes, une qui part en octobre — au moment exact de l''échéance contractuelle.

    *Repose sur :* l''effectif informatique.


    **A8. Le comparatif avec le réseau voisin est incomplet.**

    30 % moins cher est un coût annoncé ; 2 sites sur 5 tenant encore un registre papier après 14 mois
    est un coût réel non chiffré, porté par les agents.

    *Repose sur :* la fiche du réseau voisin, lue avec A7.


    ---


    ## B. Ce que le dossier n''établit pas


    **B1. Que la mise à jour de mars soit la cause.**

    12 agents la situent après mars. Sur 26 répondants environ signalant des pertes (61 % de 43), c''est
    moins de la moitié ; sur 62 agents, c''est 19 %. Il s''agit de souvenirs de date, pas de traces techniques.
    Aucun journal d''incident, aucun ticket éditeur, aucun changelog n''est produit.


    **B2. Qu''un candidat concurrent ait été écarté.**

    Le changement de version du portail usagers est daté de février, soit **avant** la mise à jour de
    mars. Le dossier ne dit pas si ce changement a porté sur le seul Rive-Sud ou sur les sept sites —
    et cette ambiguïté change entièrement la lecture. Si le changement est réseau, c''est une cause candidate
    au moins aussi bien datée que celle de mars. Si il est local, l''hypothèse d''une panne logicielle
    générale s''affaiblit encore.


    **B3. Que la v4 corrige quoi que ce soit.**

    On ne peut pas affirmer qu''un correctif règle un défaut qu''on n''a pas caractérisé. S''ajoute que
    la compatibilité de la v4 avec les bornes de 2015 est « à l''étude » : 31 000 € engagés sur une incompatibilité
    possible avec le matériel qui concentre 78 % des indisponibilités.


    **B4. Qu''il faille signer avant le 30.**

    Le 30 est la date du commercial. Nos deux dates à nous sont le 31 octobre (échéance) et le 28 (séance).
    La remise de 12 % vaut de l''ordre de 5 800 € la première année, environ 19 000 € sur trois ans selon
    la base d''application — laquelle n''est pas précisée dans l''offre. Elle est mise en regard de 31
    000 € de migration et d''un verrouillage de trois ans sur une question technique non résolue.


    **B5. La note de cadrage.**

    Elle enchaîne trois affirmations — cause, remède, urgence — dont aucune n''est adossée à une pièce,
    et B1 à B4 les prennent une par une. Ce n''est pas une mise en cause du chargé de mission : son hypothèse
    est plausible et mérite d''être testée. Je propose plus bas qu''il conduise lui-même le test. Je signale
    seulement que sa lecture par deux membres avant la séance ne lui donne pas le statut d''un élément
    instruit du dossier.


    ---


    ## C. Ce qui manque et qui est récupérable en quelques jours


    1. **Le contrat lui-même** : durée, reconduction tacite ou expresse, préavis, possibilité d''avenant
    de prolongation, niveau de service et pénalités. C''est la pièce qui détermine ce qui se passe le
    1er novembre — le dossier ne la contient pas.

    2. **La forme juridique du renouvellement** : si nous sommes sur marché public, la faculté de signer
    trois ans dépend de ce que prévoyait le marché initial. Question à poser au service des marchés, pas
    une objection de ma part.

    3. **Les journaux du module de réservation**, mars-juin, par site, et le changelog de la mise à jour
    de mars.

    4. **La trace des signalements à l''éditeur** : le dossier ne mentionne aucun ticket, alors qu''il
    y a 96 réclamations et 230 h/an de ressaisie. Si aucun ticket n''a été ouvert, aucune obligation contractuelle
    n''a été activée et nous n''avons pas de trace opposable.

    5. **La ventilation des 96 réclamations par site et par mois.**

    6. **La date et le périmètre exacts du changement de version du portail.**

    7. **Une réponse écrite et datée de l''éditeur sur la compatibilité v4 / bornes 2015.**

    8. **Le coût interne réel du réseau voisin** sur 14 mois, en ETP.


    ---


    ## D. Lecture des trois options


    **Reconduire à l''identique, trois ans avec remise.** Achète 19 000 € d''économie contre un verrouillage
    de trois ans, décidé en 48 h, sur un diagnostic non fait — et pendant la période où les bornes de
    2015 arriveront en fin de vie. La remise est réelle ; ce qu''elle achète ne l''est pas.


    **Reconduire avec migration v4.** 31 000 € pour corriger un défaut non caractérisé (B1, B3), sur un
    logiciel dont la compatibilité avec le matériel le plus défaillant est indéterminée, conduits par
    une équipe informatique qui perd la moitié de son effectif le mois de la bascule (A7). Option non
    instruite, pas option rejetée.


    **Basculer vers le libre.** Le seul retour d''expérience disponible montre 2 sites sur 5 encore en
    papier après 14 mois (A8), avec vraisemblablement plus de moyens internes que nous n''en aurons en
    octobre (A7). Une bascule libre engagée maintenant transférerait la charge sur les agents, comme chez
    le voisin. À réexaminer, pas dans ce calendrier.


    ---


    ## E. Recommandation


    **Reconduire à l''identique, mais sur une durée courte — six à douze mois, ou la durée que permet
    le contrat —, sans engagement triennal, sans la remise de 12 %, et sans engager les 31 000 € de la
    v4.** Puis décider entre v4 et libre sur pièces, au premier trimestre, une fois l''équipe informatique
    reconstituée.


    Le critère qui l''emporte est la suffisance des preuves : trois options s''affrontent, une seule information
    manquante les départage — la distribution des pertes entre les sept sites —, et cette information
    coûte quelques jours de travail contre 31 000 € ou trois ans d''engagement. On l''achète avant de
    décider.


    **Pire cas de cette recommandation :** nous payons le prix plein, ~51 400 € sur douze mois indexés,
    et perdons la remise, soit environ 19 000 € sur trois ans si la reconduction triennale reste ensuite
    disponible aux mêmes conditions. Et la panne dure quelques semaines de plus.


    **Qui l''encaisse :** pas le budget d''abord — les agents de Rive-Sud, qui continuent 5 h de ressaisie
    par semaine, et les usagers. C''est le point faible de ma recommandation et il appelle une contrepartie
    immédiate, en E-bis.


    **E-bis — ce que je propose en contrepartie, à décider en séance.** Rive-Sud supporte seul le coût
    d''une décision différée pour le réseau : renfort temporaire ou décharge équivalente à 5 h hebdomadaires
    jusqu''à résolution, imputé au budget réseau et non au site, et les heures déjà effectuées depuis
    mars reconnues explicitement. Et la conduite du diagnostic (G3) confiée au chargé de mission numérique
    avec Rive-Sud et Fontaine : le désaccord porte sur la méthode, pas sur la compétence, et le livrable
    qui valide ou invalide son hypothèse lui revient. Ce n''est pas une consultation : ce sont un budget
    et un livrable transférés.


    ---


    ## F. Le contre-argument le plus fort, et ma réponse


    *Attendre nous place au 31 octobre sans contrat, face à un éditeur qui sait que nous n''avons pas
    d''alternative. Il peut alors refuser la prolongation courte, retirer la remise et remonter le prix.
    On perd 19 000 € et on risque une rupture de service.*


    Il tient sur un point : **il est décisif de savoir, avant tout le reste, si une prolongation courte
    est possible.** C''est pourquoi c''est le premier engagement ci-dessous, à échéance quatre jours et
    non quinze. Si le contrat ne permet aucune prolongation et que l''éditeur refuse un avenant, ma recommandation
    ne tient plus et le comité doit se réunir de nouveau avant le 31 octobre.


    Il ne tient pas sur le reste. La remise est le plus petit des montants en jeu. Et un fournisseur qui
    refuse trois mois de pont tout en exigeant une signature de trois ans en 48 h nous renseigne précisément
    sur la relation que nous nous apprêtons à verrouiller pour trois ans — ce refus, s''il survient, est
    une information utile, pas seulement un risque.


    ---


    ## G. Ce que j''engage sous quinze jours


    Délais comptés à partir de la séance du 28.


    | # | Objet | Qui | Échéance | Livrable |

    |---|---|---|---|---|

    | G1 | Lecture du contrat : échéance, reconduction, préavis, faculté d''avenant de prolongation, SLA,
    pénalités | Direction + marchés/juridique | J+4 | Note d''une page : ce qui se passe le 1er novembre
    dans chaque cas de figure |

    | G2 | Demande écrite d''avenant de prolongation à l''éditeur ; et faculté juridique de signer trois
    ans au regard du marché initial | Direction | J+5 | Réponse écrite datée |

    | G3 | Journaux du module de réservation mars-juin par site + changelog de mars, demandés à l''éditeur
    ; recherche des tickets ouverts | Chargé de mission numérique, avec Rive-Sud et Fontaine | J+12 |
    Tableau des réservations perdues par site et par mois |

    | G4 | Relecture des 96 réclamations, étiquetées par site, mois et objet | Coordination réseau | J+10
    | Même tableau, source indépendante de G3 |

    | G5 | Entretien avec Fontaine : pourquoi aucun signalement — absence de panne, ou absence de remontée
    ? | Direction | J+7 | Compte rendu écrit |

    | G6 | Date et périmètre exacts du changement de version du portail et du remplacement fibre ; changelog
    du portail | Informatique + opérateur | J+10 | Chronologie février-mars |

    | G7 | Question écrite à l''éditeur : compatibilité v4 / bornes 2015, réponse contractuelle et datée
    ; fin de support de la version actuelle | Direction | J+8 | Engagement écrit, ou refus |

    | G8 | Devis de remplacement ou de maintenance des bornes de 2015, indépendamment du logiciel retenu
    | Services techniques | J+15 | Deux devis |

    | G9 | Appel au réseau voisin : ETP internes mobilisés, raison du papier sur 2 sites, coût réel à
    14 mois | Direction | J+12 | Note de deux pages |

    | G10 | Remplacement du poste informatique vacant en octobre | RH + direction | J+15 | Décision écrite
    |


    G8 est à engager quel que soit le choix logiciel : les 32 h d''indisponibilité sont matérielles (A2),
    et rien ne justifie de suspendre cette décision à l''arbitrage sur le contrat.


    ---


    ## H. Ce qui renverse cet avis, et à quel signal


    - **Si G3 ou G4 montrent des pertes réparties sur les sept sites**, la cause logicielle générale devient
    l''hypothèse forte, et la v4 redevient recevable — sous réserve de G7. C''est l''observation qui me
    ferait changer d''avis.

    - **Si les pertes sont concentrées sur Rive-Sud**, la v4 ne répond pas au problème et 31 000 € seraient
    dépensés à côté.

    - **Si G7 ne produit aucune réponse écrite dans les délais**, la v4 sort de l''arbitrage pour ce cycle
    : on n''engage pas 31 000 € sur un « à l''étude ».

    - **Si G1 établit qu''aucune prolongation n''est possible et que G2 revient négatif**, ma recommandation
    tombe : le comité se réunit avant le 31 octobre sur deux options seulement — reconduction courte aux
    conditions imposées, ou continuité dégradée organisée.

    - **Si G9 révèle que le voisin a mobilisé moins d''un ETP**, l''option libre remonte sérieusement
    dans le comparatif du premier trimestre.


    ---


    ## I. Robustesse point par point


    Pour que le comité puisse écarter un élément sans reprendre le tout :


    - **Écarter l''enquête interne** (43 réponses, souvenirs de date) : ne change rien. Elle ne fonde
    aucune de mes conclusions, elle est ce que je refuse de prendre pour une preuve.

    - **Écarter la comparaison avec le réseau voisin** : la recommandation tient. L''option libre reste
    écartée à ce calendrier par le seul effectif informatique (A7).

    - **Écarter le fait de février** (fibre, portail) : la recommandation tient. Même sans cause alternative
    identifiée, il manquerait toujours la distribution des pertes par site pour justifier 31 000 €.

    - **Écarter les réclamations usagers** : la recommandation tient. Les 5 h/semaine de Rive-Sud et le
    « à l''étude » de l''éditeur suffisent.

    - **Écarter la note de cadrage** : la recommandation tient, elle n''en dépend pas.

    - **Écarter l''export technique des 41 h** : G8 tombe, le reste tient.

    - **Écarter A7, l''effectif informatique** : c''est le seul retrait qui change la conclusion. Avec
    une équipe informatique constituée, l''option libre redevient examinable dès maintenant, et la v4
    devient conduisible sitôt G7 obtenu. C''est le point sur lequel je demande au comité de se prononcer
    explicitement.

    '
