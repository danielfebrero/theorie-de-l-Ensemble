  text: '# Avis — Renouvellement du marché « logiciel de réservation + bornes de prêt »


    **Comité du 28** · Échéance contrat : **31 octobre** · Fenêtre de remise éditeur : **avant le 30**


    **Ce qui se décide le 28 :** la durée et le périmètre de l''engagement.

    **Ce qui ne se décide pas le 28 :** le choix v4 / libre — le dossier ne le permet pas encore.


    ---


    ## A. Ce que je retiens


    Sept constats autonomes. La ligne « portée » dit ce qui tombe, et ce qui reste debout, si le comité
    en écarte un.


    ### C1 — Le problème dominant n''est pas les bornes, c''est le module de réservation

    Les 41 h d''indisponibilité représentent **~1 h 20 par mois et par site** aux deux sites les plus
    touchés (32 ÷ 2 ÷ 12) et **~10 minutes par mois** sur les cinq autres. Rive-Sud consacre **~21 h par
    mois** à la ressaisie. Soit un rapport de l''ordre de **16 pour 1** en heures d''agent.

    - *Repose sur :* export technique + note de site Rive-Sud.

    - *Renversé par :* une répartition des pannes concentrée sur les heures d''affluence (l''export ne
    donne que des cumuls). Donnée demandable — D-2.

    - *Portée :* l''écarter change la hiérarchie des urgences, pas la recommandation — elle repose sur
    le fait qu''**aucun** des deux problèmes n''est diagnostiqué.


    ### C2 — La baisse des réclamations après juin n''est pas une guérison, c''est une absorption

    71 réclamations sur 4 mois, puis 25 sur 8 mois — mais l''enquête, postérieure, indique **au présent**
    que 61 % perdent des réservations chaque semaine. Le défaut n''a pas cessé ; le signalement a cessé.
    La ressaisie manuelle, commencée en mars, rend le défaut invisible dans le canal usager tout en le
    payant chaque semaine.

    - *Repose sur :* l''écart entre la courbe des réclamations et le temps présent de l''enquête.

    - *Renversé par :* une enquête antérieure à juin, ou un correctif éditeur daté depuis. Vérifiable
    immédiatement — D-1.

    - *Portée :* l''écarter affaiblit l''urgence, pas la recommandation.


    ### C3 — Le silence de Fontaine est une question ouverte, pas une donnée rassurante

    Même équipement 2015, mêmes 32 h de panne partagées : l''un déclare 5 h/semaine de ressaisie, l''autre
    rien. Soit Fontaine n''a pas le défaut — et l''écart de configuration entre les deux sites **désigne
    la cause**, gratuitement ; soit Fontaine le subit sans le remonter — et le coût réseau est très supérieur
    à ce que montre le dossier, un seul site sur sept étant mesuré.

    - *Renversé par :* la ventilation par site des 43 réponses. Elle existe déjà et n''a pas été produite
    — D-1.

    - *Portée :* entièrement isolable ; l''écarter ne retire que l''action la moins coûteuse du dossier.


    ### C4 — Les 31 000 € de v4 sont un prix partiel, pas un coût

    La compatibilité avec les bornes 2015 est « à l''étude ». Tant que ce n''est pas écrit, le périmètre
    matériel est inconnu — si v4 ne pilote pas ces bornes, il faut ajouter leur remplacement, non chiffré.
    Et rien ne relie v4 au défaut de mars : c''est la version suivante du produit **dont la mise à jour
    a créé le problème**.

    - *Renversé par :* un écrit attestant la compatibilité sans surcoût **et** l''identification du défaut
    avec date de correctif. Les deux sont demandables avant le 30.

    - *Portée :* seul constat dont dépend le refus de la migration ; l''écarter rouvre l''option 2 sans
    toucher au reste.


    ### C5 — La remise de 12 % achète ~18 500 € contre trois ans sur un défaut non diagnostiqué

    Sur base indexée (48 000 + 7 % = 51 360 €), 12 % ≈ **6 160 €/an, ~18 500 € sur trois ans** — sous
    réserve que la remise porte sur le prix indexé et que l''indexation ne se répète pas, deux points
    non précisés au dossier. Comparaison : les 5 h hebdomadaires de Rive-Sud ≈ 225 h d''agent par an,
    du même ordre que la remise annuelle — **sur le seul site mesuré**. La remise ne couvre pas le coût
    du défaut qu''elle figerait pour trois ans.


    ### C6 — L''option libre n''est pas instruite, et la fenêtre pour l''instruire est la pire possible

    Un seul élément : −30 %, annoncé par le voisin, non audité — assorti du fait qui le contredit, **2
    sites sur 5 encore sur registre papier après 14 mois**. Ce papier est précisément le poste que l''annonce
    n''inclut pas.

    - *Renversé par :* un retour d''expérience chiffré du voisin — D-3.

    - *Portée :* justifie de ne pas basculer maintenant, pas d''écarter l''option de décembre.


    ### C7 — La contrainte dominante de l''automne est la capacité, pas le prix

    Deux informaticiens, un seul en octobre. Deux des trois options exigent un projet interne en novembre-décembre
    avec un agent. **Aucune des trois options ne traite cette contrainte.** Indépendant de tous les autres
    constats : même C1–C6 écartés en bloc, C7 suffirait.


    **Observation de méthode :** comité le 28, remise le 30, échéance le 31 octobre. Le calendrier de
    décision est fixé par le fournisseur. Raison suffisante pour ne pas lui laisser déterminer la durée
    d''un engagement de trois ans.


    ---


    ## B. Recommandation


    **Reconduire pour la durée la plus courte acceptée par l''éditeur — douze mois visés — sans la migration
    v4, et sans la remise de 12 %.** C''est l''option 1 amendée sur la durée, assortie d''un programme
    d''instruction à quinze jours, pour trancher v4 / libre en décembre.


    **Le critère décisif n''est pas le coût, c''est la suffisance des preuves.** On ignore la cause du
    défaut de mars, la compatibilité de v4, le coût complet du libre. Ces trois informations sont **peu
    coûteuses et rapides** : trois demandes écrites et une extraction interne. Quand l''information manquante
    est bon marché et que la décision engage trois ans, acheter l''information *est* la décision.


    **Pire cas, et qui l''encaisse :** l''éditeur refuse le court terme ou le surfacture — jusqu''à ~6
    000 € de plus sur un an, et la ressaisie manuelle continue à Rive-Sud (peut-être à Fontaine). Supporté
    d''abord par les équipes de site, ensuite par le budget. Réversible : aucune option n''est fermée,
    le parc reste opérationnel. Signer trois ans le 30 fait l''inverse — on économise 18 500 €, on garde
    la ressaisie, et on perd tout levier sur un défaut non identifié.


    ---


    ## C. Le meilleur argument contre


    > *Vous dépensez 18 500 € et la seule fenêtre de négociation de l''année pour acheter trois réponses
    probablement rassurantes — donc pour arriver en décembre au même choix, sans remise, avec un informaticien
    au lieu de deux.*


    **Il tient sur un point, que j''intègre :** décider en décembre à effectif réduit est pire que décider
    maintenant à deux. C''est pourquoi D-5 (remplacement du poste) n''est pas une mesure de contexte mais
    **une condition de la recommandation** — sans elle, le report déplace la décision sans l''améliorer.


    **Il ne tient pas sur l''essentiel :** si les réponses sont bonnes, elles arrivent **avant le 30**
    — ce sont des questions courtes dont l''éditeur détient déjà les réponses. L''écart entre les deux
    positions ne porte pas sur trois mois, mais sur deux jours et sur l''exigence d''un écrit.


    ---


    ## D. Ce que j''engage dans les quinze jours


    | # | Action | Livrable | Échéance |

    |---|---|---|---|

    | **D-1** | Ventilation par site des 43 réponses + date de passation ; entretien de 30 min avec Fontaine
    | Note d''1 page : défaut présent à Fontaine, oui/non — si non, quelle différence de configuration
    | J+2 |

    | **D-2** | Trois questions écrites à l''éditeur : (a) défaut de mars identifié, date de correctif
    ; (b) v4 pilote-t-elle les bornes 2015 sans surcoût — « à l''étude » n''est pas recevable à quatre
    jours d''une signature ; (c) durées autres que trois ans, prix, base exacte de la remise et de l''indexation
    | Réponse écrite | envoi J+1, relance J+3 |

    | **D-3** | Retour d''expérience chiffré du réseau voisin : coût complet, et pourquoi 2 sites sur
    5 restent sur papier | CR d''entretien | J+10 |

    | **D-4** | Soulager Rive-Sud sans attendre : mesurer une semaine de ressaisie, redéployer un appui.
    **Dû quelle que soit l''option retenue** | Relevé + appui décidé | J+15 |

    | **D-5** | Sécuriser la capacité informatique (remplacement ou appui externe pour nov.-déc.) | Recrutement
    engagé ou devis signé | J+15 |


    Conduite courante, sauf **D-5** qui appelle une autorisation en séance.


    ---


    ## E. Repli et réfutateurs


    **Ce qui me ferait changer d''avis avant le 30 :** si l''éditeur écrit, cumulativement, que **(a)**
    le défaut de mars est identifié avec correctif contractualisé **et (b)** que v4 pilote les bornes
    2015 sans surcoût — alors trois ans + v4 + 12 % devient la meilleure option et je recommande de signer.
    Cumulativement : une compatibilité matérielle sur un défaut logiciel non corrigé fige le vrai problème
    pour trois ans.


    **Si l''éditeur refuse toute durée < 3 ans** (déclencheur : réponse négative ou silence sur D-2c au
    30) → signer trois ans **sans v4**, en obtenant en contrepartie de la durée une clause de correctif
    datée avec pénalité ou sortie anticipée. La durée est le dernier actif de négociation : elle ne doit
    pas être donnée gratuitement le 30.


    **Si le défaut s''aggrave** (déclencheur : un second site remonte une ressaisie régulière, ou > 15
    réclamations/mois) → la question devient une continuité de service ; comité intermédiaire sans attendre
    décembre.


    **Vrai dans tous les cas :** les bornes 2015 concentrent 78 % des indisponibilités et sont en fin
    de vie. Leur remplacement doit figurer au dossier de décembre comme **ligne propre**, indépendante
    du choix logiciel — sinon il resurgira en surcoût caché dans n''importe laquelle des trois options.


    ---


    Deux points où j''ai dû poser une hypothèse plutôt que lire le dossier : la valorisation horaire de
    la ressaisie (ordre de grandeur, non chiffrage — le relevé D-4 la remplacera) et la base d''application
    de la remise et de l''indexation, qui est elle-même devenue une question à l''éditeur.

    '
