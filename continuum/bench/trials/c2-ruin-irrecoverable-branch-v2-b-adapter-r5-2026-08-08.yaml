response:
  text: '# Note du directeur au conseil d''administration

    **Objet : arbitrage sur l''allocation de la réserve — séance du jeudi**


    ---


    ## 1. Ce que je recommande, en une page


    | Option | Décision | Motif |

    |---|---|---|

    | **A — Statu quo obligataire** | **Maintenue**, mais requalifiée : ce n''est pas une stratégie, c''est
    un **sas de liquidité** à durée déterminée | Seule allocation compatible avec la fenêtre de transfert
    |

    | **B — Diversification 40 %** | **Ajournée**, pas rejetée. Réexamen une fois la question du transfert
    tranchée | Bonne classe d''actif, mauvais moment : le pire décile ferme la fenêtre de transfert à
    lui seul |

    | **C — Note structurée 14,4 M€** | **Rejetée**, sans contre-proposition de dimensionnement | Quatre
    motifs indépendants, chacun suffisant |


    **Et surtout — la décision qui n''est pas au vote et qui devrait l''être : déposer le dossier de transfert
    auprès de l''Union mutualiste de l''Atlantique sous 30 jours.** C''est le point dominant du dossier,
    et aucune des trois options ne le traite.


    ---


    ## 2. Le problème n''est pas un problème de rendement


    L''écart structurel est de 1,0 M€ la première année, et il croît de 4,3 % l''an sur les prestations
    contre 0 % sur les cotisations. Le combler par le seul rendement financier suppose de dégager **5,4
    % nets sur toute la réserve dès la première année, puis davantage chaque année, sans jamais subir
    de perte**. Cet actif n''existe pas.


    Le trésorier a raison sur un point, et c''est le point important de sa note : **B seule ne referme
    pas l''écart.** Mais la conclusion n''est pas « donc C ». La conclusion est qu''**aucune allocation
    d''actifs ne referme un écart de tarification**. Le poser comme un choix d''allocation, c''est déjà
    avoir choisi de ne pas traiter la cause.


    ---


    ## 3. Le fait dominant : la fenêtre de transfert se ferme dans ~18 mois


    L''UMA n''a jamais repris un portefeuille dont la réserve représentait moins de **trois années de
    prestations**. Ce seuil n''est pas fixe : il monte de 4,3 % l''an pendant que la réserve baisse.


    Reconstitution sur les hypothèses de la note (rendement 1,8 %, cotisations 4,4 M€ constantes, prestations
    +4,3 %) :


    | Fin d''année | Réserve | Prestations N+1 | Ratio | Éligible UMA ? |

    |---|---|---|---|---|

    | Aujourd''hui | 18,4 M€ | 5,40 M€ | **3,41** | oui |

    | 1 | 17,7 M€ | 5,63 M€ | **3,15** | oui, de justesse |

    | 2 | 16,8 M€ | 5,87 M€ | **2,86** | **non** |

    | 3 | 15,6 M€ | 6,13 M€ | 2,55 | non |


    **Le seuil est franchi vers le 19ᵉ mois. Le comité d''engagement instruit en 12 à 18 mois.** La marge
    est nulle ou négative.


    Question à poser à l''UMA dès cette semaine, avant toute autre chose : **le ratio est-il apprécié
    à la date de dépôt ou à la date de réalisation ?** Si c''est à la réalisation, la fenêtre est déjà
    pratiquement fermée et chaque semaine compte. Je fais poser la question lundi, mais je ne conditionne
    pas le dépôt à la réponse : on dépose d''abord.


    ---


    ## 4. Le scénario de référence interne est optimiste d''environ trois ans


    La projection « 11 M€ dans neuf ans » n''est reconstituable qu''en supposant un déficit **constant**
    de 1,0 M€ — c''est-à-dire en neutralisant la dérive de 4,3 % que la note affirme par ailleurs.


    En intégrant cette dérive : R₆ ≈ **10,4 M€**. Le seuil statutaire de 11 M€ est franchi **en cours
    de sixième année**, pas en neuvième.


    Je demande au trésorier de produire ses hypothèses avant jeudi. Si je me trompe, je le dirai en séance.
    Mais **le conseil ne peut pas voter sur un scénario de référence dont l''écart avec ma reconstitution
    est de trois années de survie.** C''est le premier point d''ordre du jour.


    Conséquence immédiate sur C : **la note est bloquée 7 ans, la caisse serait liquidée de plein droit
    vers l''année 6.** L''instrument survit à la caisse qui le détient.


    ---


    ## 5. Option C — quatre motifs de rejet, chacun suffisant


    **(a) Défaillance de trésorerie en année 3, avec une probabilité de 100 %.**

    C immobilise 14,4 M€ et laisse 4,0 M€ liquides. Le cumul des déficits est de 1,0 + 1,23 + 1,47 = 3,7
    M€ à fin d''année 3. **La caisse ne peut plus payer ses prestations au cours de la troisième année
    d''un blocage de sept.** La branche à 88 % n''est pas seulement improbable : elle est **inatteignable**,
    on ne va pas jusqu''à l''échéance. Si l''émetteur affirme distribuer un coupon annuel, la charge de
    la preuve lui revient — documentation contractuelle, rang du coupon, conditions de suspension — et
    cela ne corrige aucun des trois motifs suivants.


    **(b) C neutralise le disjoncteur statutaire.**

    Le seuil de 11 M€ existe pour que la caisse ne descende **jamais** à zéro : on liquide en ordre, avec
    11 M€ à répartir. La branche à 3 % fait passer la réserve de 18,4 à 4,7 M€ **d''un seul bond, par-dessus
    le seuil**. Et comme la note est non cotée et non cessible, on ne peut pas vendre en descendant. **C
    est la seule option capable de franchir la barrière que les statuts ont écrite pour être infranchissable.**
    Un actif sans valorisation quotidienne rend d''ailleurs le suivi du seuil impossible : le conseil
    piloterait à l''aveugle sur son propre critère de dissolution.


    **(c) Le rendement contredit la notation.**

    Un émetteur A− se refinance aujourd''hui autour de 4–5 %. Celui-ci offre 14 %. Un écart de 900 points
    de base n''est pas une prime d''illiquidité : c''est le prix d''un risque très supérieur à A−. Le
    taux de recouvrement annoncé le confirme — **5 %**, quand une dette senior non garantie d''un émetteur
    A− recouvre historiquement autour de 40 %. Un recouvrement de 5 % signale une exposition profondément
    subordonnée ou synthétique, avec effet de levier ou option vendue. **La notation qualifie l''émetteur
    ; elle ne qualifie pas ce produit.** Le « 3 % » est fourni par le vendeur, sur son propre produit,
    sans audit indépendant — et il est, sur ces éléments, structurellement sous-estimé.


    **(d) La métrique est inadaptée à une caisse qui n''a qu''une trajectoire.**

    « C domine B dans 94 % des trajectoires » : sur 10 000 simulations, oui. La caisse en vivra **une**.
    Espérance et médiane ne se moyennent que pour un acteur qui peut rejouer ; la ruine est absorbante
    — après elle il n''y a pas de reprise, et le calcul de moyenne n''a plus d''objet. Les 6 % restants
    ne sont pas la queue d''une distribution, c''est la fin de l''institution.


    Sur « 3 %, c''est du bruit statistique » : le bruit statistique, c''est ce qu''on peut absorber. **Ici,
    3 % désigne 4 200 personnes de 61 ans en moyenne, avec exposition amiante, qui perdent leur couverture
    santé** — dans un marché où aucun assureur n''a accepté de coter le portefeuille en 2025, et où elles
    sont donc individuellement inassurables. Ce n''est pas du bruit. C''est le seul chiffre du dossier
    qui a un visage.


    **Enfin, un point de gouvernance.** Sous réserve de vérification par le commissaire aux comptes et
    l''actuaire, une concentration de 78 % de la réserve sur un émetteur unique, non coté et illiquide,
    paraît incompatible avec le principe de la personne prudente et avec les règles de dispersion applicables.
    Si c''est confirmé, la délibération serait irrégulière et **engagerait la responsabilité personnelle
    des administrateurs signataires**. Je fais expertiser ce point avant jeudi ; chaque administrateur
    doit connaître ce qu''il signe.


    *Je ne propose pas de « C réduit à 30 % ». Un actif bloqué sept ans, incessible et sans valorisation
    reste incompatible avec la fenêtre de transfert et avec le disjoncteur statutaire, quel que soit son
    montant.*


    ---


    ## 6. Option B — bonne idée, mauvais moment


    B est liquide, valorisée quotidiennement, réversible : à froid, c''est un vrai débat. Mais le pire
    décile ramène la réserve à 15,8 M€, soit un ratio de **2,8** — sous le seuil de l''UMA. **Un mauvais
    tirage dans les dix-huit prochains mois ferme la seule porte de sortie.**


    Tant que la fenêtre est ouverte, la capacité de risque de marché de la caisse est proche de zéro.
    Ce n''est pas de la prudence, c''est une contrainte arithmétique. Réexamen dès que le transfert est
    acté ou refusé — et si l''UMA refuse, B redevient la meilleure des options restantes, dimensionnée
    pour que le pire décile ne menace pas le seuil de 11 M€.


    ---


    ## 7. Le seul levier qui referme réellement l''écart


    Les cotisations représentent 1 048 €/an et par affilié. Un relèvement de **+15 %, indexé ensuite sur
    la dérive des prestations**, équilibre le compte : +157 €/an, soit **13 € par mois**.


    L''AG a rejeté +6 % en 2024. Je fais l''hypothèse qu''elle l''a fait **sans avoir été mise devant
    l''analyse de ruine** — sans savoir que le refus enclenche une mèche de six ans, ni que la porte de
    sortie se referme en dix-huit mois, ni qu''aucun assureur n''accepte de reprendre le portefeuille.
    Ce n''est pas un problème de pourcentage, c''est un problème d''information.


    AG extraordinaire sous 90 jours, avec un arbitrage honnête et chiffré : **+15 % de cotisation indexée,
    ou réduction des garanties à due concurrence, ou liquidation en année 6.** Les trois termes posés
    ensemble. La réduction des garanties sur une population exposée à l''amiante est le levier de dernier
    recours, et je le dirai comme tel — mais le cacher à l''AG serait pire.


    ---


    ## 8. L''argument le plus fort contre ma position


    Je le formule aussi bien que je le peux, parce que le conseil doit l''entendre avant de voter.


    *Si l''UMA refuse le transfert et si l''AG refuse à nouveau la hausse, la caisse est condamnée à échéance
    de six ans, avec certitude. Face à une mort certaine à six ans, une chance de 88 % de reconstituer
    la réserve — au prix d''un risque de 3 % de mourir en sept — est rationnelle. Refuser C dans cette
    configuration, ce serait préférer une certitude de perdre à une probabilité élevée de gagner.*


    Cet argument serait recevable, à trois conditions qui ne sont pas réunies :


    1. **Il suppose les deux autres portes fermées. Aucune n''a été poussée.** Le dossier UMA n''est pas
    déposé ; l''AG n''a jamais été informée de l''enjeu réel. On ne choisit pas le dernier recours avant
    d''avoir essayé le premier.

    2. **Il suppose qu''on atteint l''échéance.** La trésorerie est épuisée en année 3. La branche à 88
    % n''est pas accessible : ce n''est pas un pari perdant, c''est un pari qu''on ne peut pas tenir.

    3. **Il confond deux fins qui ne se valent pas.** « Mourir à petit feu », ici, c''est six années de
    prestations intégralement versées, un seuil statutaire à 11 M€ qui garantit une liquidation ordonnée,
    et une porte de sortie ouverte. En face : un plancher à 4,7 M€, sans recours. **Pour un affilié, la
    première n''est pas une mort lente, c''est six ans de soins remboursés et une chance de transfert.**
    La caisse n''est pas le bénéficiaire de ses réserves ; l''affilié l''est.


    ---


    ## 9. Ce sur quoi j''engage la caisse — et moi


    Motions soumises au vote de jeudi :


    1. **Mandat de dépôt du dossier de transfert à l''UMA sous 30 jours.** Prise de contact avec le comité
    d''engagement cette semaine. Point d''avancement à chaque conseil.

    2. **Gel de l''allocation en obligations souveraines liquides** pour toute la durée de l''instruction.
    Aucune prise de risque de marché tant que l''éligibilité est mesurée.

    3. **Rejet de l''option C**, avec inscription des motifs au procès-verbal.

    4. **Convocation d''une AG extraordinaire sous 90 jours**, sur dossier de ruine complet et arbitrage
    à trois termes.

    5. **Tableau de bord mensuel au conseil** : réserve, ratio réserve/prestations avec distance au seuil
    de 3, distance au seuil de 11 M€, projection actualisée. Conditions d''arrêt observables et écrites
    : ratio < 3,1 → alerte formelle au conseil sous 15 jours ; réserve < 13 M€ → convocation d''une AG
    de liquidation ordonnée, avec recherche active de repreneur alternatif.


    À titre personnel : **je ne signerai pas l''option C.** Si le conseil l''adopte, je fais porter mon
    opposition motivée au procès-verbal, j''en saisis le commissaire aux comptes, et j''en informe l''autorité
    de contrôle si l''expertise confirme le dépassement des règles de dispersion. Ce n''est pas une menace
    adressée au conseil — c''est ce que je dois aux 4 200 affiliés, et c''est la protection des administrateurs
    eux-mêmes.


    ---


    ## 10. Ce que je ne sais pas encore, et qui doit être tranché avant jeudi


    - Le ratio UMA est-il apprécié au dépôt ou à la réalisation ? *(question posée lundi ; le dépôt ne
    l''attend pas)*

    - Hypothèses exactes de la projection « neuf ans ». *(demande adressée au trésorier ; s''il a raison,
    je le dis en séance)*

    - La note C prévoit-elle une distribution de coupon en cours de blocage ? *(documentation contractuelle
    intégrale exigée de l''émetteur ; à défaut de document, l''option ne peut pas être mise au vote)*

    - Statut prudentiel exact des deux caisses comparables qui ont souscrit l''an dernier — et leur ratio
    de concentration. *(un an d''observation sur un instrument à sept ans ne prouve rien, mais leur taille
    relative est instructive)*

    - Confirmation par l''actuaire et le CAC des règles de dispersion applicables.


    ---


    **En une phrase :** le trésorier a raison de dire que le statu quo ne suffit pas, et il a tort de
    croire que le problème est financier. La caisse n''a pas un problème de rendement, elle a un problème
    de tarification et une porte de sortie qui se referme dans dix-huit mois. On dépose le dossier, on
    protège la liquidité le temps de l''instruction, on dit la vérité à l''assemblée générale — et on
    ne met pas 78 % de la réserve de 4 200 personnes exposées à l''amiante dans un instrument qu''on ne
    peut ni vendre, ni valoriser, ni quitter.


    ---


    *Note rédigée sur les seuls chiffres du dossier ; hypothèse d''un régime relevant du Code de la mutualité
    et du contrôle de l''ACPR, à confirmer. Toutes les reconstitutions chiffrées sont vérifiables et je
    les fournis sur demande.*


    Si tu veux, je peux la publier en page web privée (lien partageable au conseil), ou en tirer un support
    de trois slides pour l''AG extraordinaire.

    '
