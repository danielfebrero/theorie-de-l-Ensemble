response:
  text: '# Note au conseil d''administration — séance de jeudi

    **Objet : allocation de la réserve — options A, B, C**

    **Position : je recommande d''adopter B redimensionnée, de conserver A comme support de liquidité,
    et de rejeter C. Je ne signerai pas C.**


    ---


    ## 1. Le désaccord avec le trésorier n''est pas arithmétique


    Je ne conteste aucun de ses calculs. C a bien la meilleure espérance (+9,6 %), et elle domine bien
    B dans 94 % des trajectoires simulées. Ces deux affirmations sont exactes.


    C''est précisément pour cela qu''il faut refuser C : **l''espérance n''est pas le critère applicable
    à cette caisse.**


    Une espérance décrit la moyenne d''un grand nombre de tirages. Les 10 000 simulations décrivent 10
    000 caisses. Nous n''en avons qu''une, elle ne tire qu''une fois, et dans 3 % des cas elle cesse d''exister
    — sans possibilité de rejouer, de se recapitaliser ou de transférer ses affiliés, puisque l''appel
    d''offres 2025 a établi qu''aucun assureur ne veut de ce portefeuille. Moyenner sur des trajectoires
    dont certaines sont absorbantes n''a pas de sens mathématique : la moyenne inclut des gains que la
    caisse liquidée ne percevra jamais.


    La phrase « 3 %, c''est du bruit statistique » serait vraie pour un investisseur qui répète l''opération.
    Pour nous, 3 % n''est pas un écart-type : c''est la probabilité de supprimer la couverture santé de
    4 200 personnes de 61 ans de moyenne d''âge, fortement exposées à l''amiante, qui n''ont aucun marché
    de repli.


    ---


    ## 2. Le budget de risque réel de la caisse : 7,4 M€


    18,4 M€ − 11 M€ = **7,4 M€**. C''est tout ce que la caisse peut perdre, une fois, définitivement.
    Et ce budget n''est pas dédié aux marchés : il doit aussi absorber neuf ans de dérive des dépenses
    et la volatilité de la sinistralité d''une cohorte amiante entrant dans sa décennie de risque maximal.


    | | Perte dans le pire cas annoncé | Part du budget de risque consommée | Réserve résiduelle |

    |---|---|---|---|

    | **B** (7,4 M€ exposés) | −2,6 M€ | 35 % | 15,8 M€ |

    | **B, stress doublé** (−50 %) | −3,7 M€ | 50 % | 14,7 M€ |

    | **B, perte totale de la tranche** | −7,4 M€ | 100 % | 11,0 M€ |

    | **C** (14,4 M€ exposés) | −13,7 M€ | **185 %** | **4,7 M€ → liquidation** |


    B résiste à un choc *deux fois pire* que son pire décile historique. C ne résiste pas à son propre
    scénario défavorable, tel que décrit par le vendeur. C''est l''asymétrie décisive, et elle ne dépend
    d''aucune hypothèse de ma part.


    Une allocation dont la queue dépasse le budget de risque n''est pas un placement : c''est un pari
    sur l''existence de l''institution.


    ---


    ## 3. Ce qui disqualifie C avant même la question du défaut : la trésorerie


    Votre projection A implique un déficit net d''environ **1,1 M€/an** (18,4 M€ ramenés à 11 M€ en neuf
    ans malgré +1,8 % de rendement), en croissance. *Ce chiffre est reconstitué à partir de vos propres
    hypothèses ; merci de le confirmer en séance.*


    Si nous bloquons 14,4 M€ pendant sept ans sans sortie anticipée, la caisse dispose de **4,0 M€ mobilisables**
    pour financer ce déficit, soit **moins de quatre ans de fonctionnement.**


    Ce n''est pas un scénario de queue. C''est le scénario central — il se produit aussi dans les 88 %
    de cas favorables. La caisse serait en rupture de trésorerie avant l''échéance de la note, sans pouvoir
    la vendre, y compris pendant que la note performe.


    Deux vérifications à faire avant toute discussion sur le rendement :

    - La note verse-t-elle des coupons en numéraire, ou capitalise-t-elle ? Le terme « bloquée » suggère
    la capitalisation.

    - Si elle capitalise : la question est close, C est infaisable.

    - Si elle verse : dans la branche à +2 % (9 % des cas), le flux est de 288 k€/an contre 1,1 M€ de
    besoin. Insuffisant.


    **Point de gouvernance associé** : la note n''est pas cotée. Sur quelle valorisation testerons-nous
    chaque année le seuil statutaire de 11 M€ ? Au coût, nous serons formellement conformes tout en étant
    économiquement insolvables. À la valeur de modèle, c''est l''émetteur qui nous dira si nous devons
    nous liquider. C rend inobservable la clause même qui protège les affiliés.


    ---


    ## 4. Ce que la table de distribution de C ne dit pas


    - **88 % / 9 % / 3 %, sans état intermédiaire.** Aucun produit structuré réel n''a une distribution
    à trois points sans scénarios de perte partielle. C''est un tableau commercial, pas un modèle de risque.

    - **+14 %/an d''un émetteur A−.** Un A− se refinance autour de govies +1 à 1,5 %. Douze points de
    rendement supplémentaires ne rémunèrent pas son crédit : ils rémunèrent un risque *transféré au souscripteur*,
    que la table ne décrit pas. Le risque réel de la note n''est pas celui de l''émetteur.

    - **5 % de récupération.** Très inférieur aux récupérations habituelles sur dette senior. Cohérent
    avec un instrument dont l''exposition n''est pas le bilan de l''émetteur.

    - **Les probabilités sont fournies par la contrepartie**, seule partie à avoir un intérêt financier
    à leur formulation, et non validées par un tiers.

    - **« Deux caisses comparables ont souscrit l''an dernier »** n''est pas une preuve : douze mois n''est
    pas un historique, et si elles détiennent la même note, un défaut nous frappe tous simultanément —
    sans secours mutuel possible.


    Je n''ai pas besoin que ces objections soient fondées pour rejeter C. Le point 3 suffit. Mais elles
    indiquent que le 3 % est un plancher, pas une estimation.


    ---


    ## 5. L''argument le plus fort en faveur de C — et pourquoi il ne tient pas


    Il mérite d''être formulé honnêtement : *refuser C, c''est choisir une probabilité de liquidation
    de 100 % à neuf ans plutôt qu''une probabilité de 3 %.* Sous cette forme, le trésorier a raison et
    A est indéfendable.


    Trois raisons pour lesquelles il ne tient pas :


    1. **La projection A n''est pas un destin, c''est un délai.** Neuf ans de dérive lente, visible, mesurée
    chaque trimestre, réversible à tout moment. C substitue à cela un aléa rapide, invisible et irréversible
    — et nous prive de sept de ces neuf années de capacité d''action.

    2. **La comparaison pertinente n''est pas A contre C.** Elle est A contre (B + les leviers de la section
    6). Le trésorier compare la meilleure option risquée au pire scénario passif, en excluant tout ce
    qui relève du passif de la caisse.

    3. **L''actif à protéger n''est pas le rendement, c''est la capacité de négocier.** Une caisse à 18
    M€ peut organiser un adossement, une fusion ou un transfert choisi de ses affiliés. Une caisse à 11
    M€ est liquidée d''office, et une caisse à 4,7 M€ ne transfère rien du tout. La branche à 3 % de C
    ne détruit pas seulement la caisse : elle détruit toute sortie ordonnée pour les affiliés. C''est
    le scénario que notre mandat nous interdit d''acheter, quel que soit son prix.


    ---


    ## 6. Recommandation, option par option


    **A — Conservée comme support, rejetée comme stratégie.** +1,8 % ne referme rien. Mais A reste le
    véhicule du coussin de liquidité : je propose de maintenir en obligations d''État courtes et en monétaire
    l''équivalent de **24 mois de déficit net (≈ 2,5–3 M€)**, disponible sous 48 heures.


    **A adopter — B, redimensionnée à 6,5 M€ (35 %)**, et non 7,4 M€. À 40 %, une perte totale de la tranche
    nous place *exactement* sur le seuil de 11 M€ : aucune marge ne subsiste pour un choc de sinistralité
    simultané. Conditions :

    - titres cotés, liquides, valorisés quotidiennement, sortie sous 5 jours ;

    - **aucune contrepartie non souveraine au-delà de 5 % de la réserve** ;

    - déploiement étalé sur six mois ;

    - désensibilisation automatique si la réserve passe sous 14,5 M€.


    Le trésorier a raison sur un point : **B seule ne referme pas l''écart.** C''est vrai, et ce n''est
    pas une objection à B — c''est la démonstration que l''écart n''est pas un problème de placement.


    **C — Rejetée.** Pas « reportée », pas « réduite ». Émetteur unique à 78 % de la réserve, non coté,
    blocage de sept ans, aucune sortie, aucune garantie, distribution fournie par le vendeur, insuffisance
    de trésorerie en scénario central. Une version conforme à nos contraintes (< 5 % de la réserve, cotée,
    liquide) ne déplacerait plus l''aiguille — ce qui montre que C n''a jamais été une réponse au problème
    posé.


    Je demande par ailleurs au commissaire aux comptes de confirmer avant le vote si une exposition de
    78 % sur une contrepartie unique est compatible avec nos statuts et avec le principe de la personne
    prudente. Ma lecture est qu''elle ne l''est pas, et qu''elle exposerait chaque administrateur signataire
    à une responsabilité personnelle pour faute de gestion — y compris dans les 97 % de cas où tout se
    passe bien.


    ---


    ## 7. Le vrai chantier : ce qui referme réellement l''écart


    Un écart entre des dépenses à +4,3 % et une réserve finie est un problème de passif. Aucun rendement
    ne le résout ; il ne fait que déplacer la date. Ouverture sous 90 jours, avec restitution au conseil
    de novembre :


    1. **Audit de la prise en charge amiante.** Quelle part de nos prestations relève de pathologies reconnues
    en maladie professionnelle, donc prises en charge à 100 % par la branche AT-MP, ou indemnisables par
    le FIVA ? Si nous payons en complémentaire des soins relevant du régime AT-MP, c''est une fuite structurelle,
    potentiellement le premier poste de l''écart. À chiffrer en priorité.

    2. **Trajectoire de cotisations.** Un rattrapage graduel et annoncé, engagé maintenant, est infiniment
    moins douloureux qu''un ajustement d''urgence à 12 M€.

    3. **Réassurance partielle.** L''appel d''offres 2025 a échoué sur le transfert *intégral*. Une couverture
    stop-loss sur la seule queue amiante est un risque différent, potentiellement cotable. À retester
    explicitement.

    4. **Mutualisation** avec d''autres caisses maritimes ou professionnelles.

    5. **Préparation d''un adossement choisi**, engagée tant que la réserve est à 18 M€ — pas à 12 M€.


    ---


    ## 8. Ce sur quoi j''engage la caisse


    Soumis au vote de jeudi, dans la même délibération :


    1. **Rejet de C.**

    2. **B à 6,5 M€**, aux conditions du point 6.

    3. **Politique de placement écrite et opposable** : 100 % des actifs liquidables sous 30 jours ; aucun
    instrument sans valorisation indépendante au moins mensuelle ; plafond de 5 % par contrepartie non
    souveraine ; aucun blocage supérieur à 12 mois.

    4. **Seuil d''alerte à 14,5 M€** — et non 11 M€. Franchi, il déclenche automatiquement désensibilisation,
    convocation du conseil sous 15 jours et plan de redressement. On ne découvre pas un seuil de liquidation
    en y arrivant.

    5. **Reporting trimestriel** : réserve, déficit net, distance au seuil d''alerte, en une page.

    6. **Chantier passif** ouvert sous 90 jours, restitution en novembre.


    Et ce sur quoi je m''engage personnellement : je ne signerai pas C. Si le conseil l''adopte, je ferai
    porter mon opposition motivée au procès-verbal, j''en informerai le commissaire aux comptes et l''autorité
    de contrôle, et je quitterai la direction de la caisse. Non par désaccord de style, mais parce que
    je ne peux pas administrer une institution dont la survie dépend d''un chiffre invérifiable communiqué
    par sa propre contrepartie.


    Le président et quatre administrateurs ont cosigné la note du trésorier. Je demande que le vote de
    jeudi porte d''abord sur une seule question, avant toute discussion de rendement : **quelle perte
    maximale la caisse peut-elle subir une fois, sans cesser d''exister ?** Une fois ce chiffre voté,
    l''arbitrage entre B et C ne se discute plus.


    ---


    ### Annexe — chiffres cités


    | Élément | Valeur |

    |---|---|

    | Budget de risque total (18,4 − 11) | 7,4 M€ |

    | Déficit net annuel *(reconstitué, à confirmer)* | ≈ 1,1 M€, croissant |

    | C : liquidités disponibles / durée couverte | 4,0 M€ / ≈ 3,6 ans |

    | C : réserve en cas de défaut | 4,7 M€ (seuil : 11 M€) |

    | B à 7,4 M€ : perte totale de la tranche | réserve = 11,0 M€ *(seuil exact)* |

    | B à 6,5 M€ : pire décile / perte totale | 16,1 M€ / 11,9 M€ |

    | Seuil d''alerte proposé | 14,5 M€ |

    '
