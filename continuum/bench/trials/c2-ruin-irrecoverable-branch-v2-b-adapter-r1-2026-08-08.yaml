response:
  text: '# Note au conseil d''administration


    **Objet : délibération du jeudi — options A, B, C**

    **De : la direction générale**


    ---


    ## 1. La question posée n''est pas la bonne


    Le dossier soumis au conseil est un menu d''allocation d''actifs. Le problème de la caisse n''est
    pas un problème d''allocation d''actifs.


    Nous encaissons 4,4 M€ et versons 5,4 M€. L''écart est de 1,0 M€, il croît de 4,3 % par an, et il
    porte sur un passif que le marché a refusé de coter en 2025. Aucun rendement ne referme structurellement
    un déficit technique de 23 % des cotisations qui s''élargit chaque année : il faudrait faire travailler
    la réserve à plus de 5,4 % dès aujourd''hui, puis toujours plus vite que la dérive des dépenses, indéfiniment.
    Le trésorier le reconnaît d''ailleurs pour B. C''est vrai de B, c''est vrai de A, et c''est vrai de
    C — la seule différence étant que C ajoute un risque de destruction immédiate.


    **Le vrai calendrier n''est pas celui de la note.** Le seuil qui nous contraint en premier n''est
    pas les 11 M€ statutaires, mais le critère d''admission de l''Union mutualiste de l''Atlantique :
    trois années de prestations. Ce seuil monte de 4,3 % par an pendant que notre réserve baisse.


    | | Réserve | Prestations | Seuil UMA (3×) | Ratio |

    |---|---|---|---|---|

    | Aujourd''hui | 18,4 M€ | 5,40 M€ | 16,2 M€ | **3,41×** |

    | Dans 1 an | 17,7 M€ | 5,63 M€ | 16,9 M€ | **3,15×** |

    | Dans 2 ans | 16,8 M€ | 5,87 M€ | 17,6 M€ | **2,86×** |


    Le ratio perd environ 0,26 point par an. **La fenêtre de cessibilité se referme dans dix-huit à vingt-quatre
    mois.** Le comité d''engagement de l''UMA instruit en douze à dix-huit mois. Le recouvrement est de
    quelques mois, au mieux.


    Ce chiffre ne figure nulle part dans la note du trésorier. Il est le seul qui commande la décision
    de jeudi.


    Second point, à verser au débat : la projection interne à neuf ans suppose des cotisations indexées
    sur la dérive des dépenses. À cotisations constantes — c''est-à-dire dans le monde réel, celui où
    l''AG a rejeté +6 % en 2024 — le seuil de 11 M€ est franchi vers la sixième année, pas la neuvième.
    Je demande que ce point soit tranché par l''actuaire avant le vote.


    ---


    ## 2. Ce que je fais de chaque option


    ### C — Je la rejette, et je demande un rejet motivé, définitif, inscrit au procès-verbal


    Pas « pas maintenant ». Jamais, sous cette taille et sous cette structure. Quatre motifs, dont chacun
    suffit :


    **a) Les 3 % ne sont pas du bruit, c''est un état absorbant.** 4,7 M€ de réserve résiduelle, c''est
    en dessous de 11 M€ : liquidation de plein droit. Pas de reprise, pas de deuxième tour, pas de retour
    à la moyenne. Un événement à 3 % dont on ne se relève jamais n''est pas comparable à un événement
    à 3 % dont on se relève. L''espérance est le bon critère pour un pari répétable et non terminal. Nous
    jouons une fois, et la perte est finale.


    **b) C provoque une défaillance de trésorerie quasi certaine, indépendamment du sort de la note.**
    En bloquant 14,4 M€ pendant sept ans, il nous reste 4,0 M€ liquides face à un déficit cumulé de 1,0
    puis 1,23 puis 1,48 M€… La poche liquide est épuisée autour de la quatrième année. Nous serions alors
    une caisse incapable de payer ses prestations, propriétaire d''un actif invendable pendant trois ans
    encore. Cela n''arrive pas dans 3 % des cas. Cela arrive dans presque tous. *(J''ai lu la « distribution
    communiquée » comme une distribution de probabilités, non comme des coupons versés en numéraire. Si
    l''émetteur prétend le contraire, je veux la clause contractuelle, pas la plaquette — et cela ne sauve
    que la branche à 88 %.)*


    **c) C referme définitivement la seule sortie réelle.** Aucun comité d''engagement ne reprend un portefeuille
    dont 78 % de la couverture est un titre non coté, mono-émetteur, non valorisable et non mobilisable.
    En souscrivant C jeudi, le conseil supprime lui-même l''option de transfert, dix-huit mois avant qu''elle
    ne se referme d''elle-même.


    **d) Le prix contredit le récit.** Un émetteur A− se finance autour de 4–5 %. Il en offre 14. Les
    neuf à dix points d''écart sont payés par quelque chose, et ce quelque chose est du risque que la
    distribution de 3 % ne décrit pas — le risque de la structure, pas seulement celui de la signature.
    Cette distribution est produite par le vendeur, sur un produit non coté, sans tiers pour la contredire.
    Que deux caisses comparables aient souscrit il y a un an n''apporte aucune information : sur un titre
    bloqué sept ans, un an d''ancienneté ne dit rien du dénouement.


    J''ajoute un motif de forme : l''engagement de 78 % de la réserve d''une mutuelle sur un émetteur
    unique, illiquide, sans garantie, soulève sérieusement la question du principe de la personne prudente
    et des règles de dispersion et de liquidité. Je ne tranche pas ce point moi-même — je demande qu''aucun
    vote n''intervienne sans avis écrit de notre conseil et information préalable de l''ACPR. Les administrateurs
    qui voteraient C engageraient leur responsabilité personnelle en cas de liquidation, et je considère
    de mon devoir de le leur écrire avant le vote plutôt qu''après.


    ### B — Je la diffère, avec une variante bornée si le conseil veut agir


    B n''a rien de déshonorant : coté, valorisé quotidiennement, sortie à tout moment — donc compatible
    avec un transfert. Mais son décile le plus défavorable ramène la réserve à 15,8 M€, soit **sous le
    seuil de cessibilité de 16,2 M€**. B, à 7,4 M€, peut nous coûter la sortie exactement pendant les
    douze à dix-huit mois où l''UMA instruit notre dossier, pour un gain espéré de 318 k€ par an sur un
    déficit de 1 000 k€.


    Je propose donc de différer B jusqu''à ce que le dossier UMA ait un sort déterminé. Si le conseil
    souhaite néanmoins agir jeudi, je peux soutenir une version bornée : **3 M€ maximum** (choc de −35
    % = 1,05 M€, la réserve reste au-dessus du seuil), **débouclage automatique si le ratio de cessibilité
    passe sous 3,15×**, mandat révisé chaque trimestre. Ce n''est pas une stratégie de rendement, c''est
    une position de portage sous contrainte.


    ### A — Je la conserve comme socle, mais je refuse son étiquette


    A n''est pas « le statu quo ». C''est la posture de liquidité qui maintient la fenêtre de transfert
    ouverte, et elle a cette seule vertu. Le trésorier a raison sur un point, et il faut le dire au conseil
    sans détour : **A seule n''est pas survivable.** Elle n''est acceptable qu''associée aux engagements
    ci-dessous. Voter A et rien d''autre jeudi serait la deuxième plus mauvaise décision possible.


    ---


    ## 3. Sur la note du trésorier


    Elle est sérieuse et son diagnostic de fond — l''immobilisme tue la caisse — est juste. Son erreur
    est de méthode, et elle est identifiable : « C domine B dans 94 % des trajectoires » est un critère
    valide pour un acteur qui peut rejouer et dont les pertes ne sont pas terminales. Nous ne rejouons
    pas, et 4,7 M€ signifie la fin. Dans ces conditions, la trajectoire médiane ne nous appartient pas
    ; seule compte la survie du chemin. Un joueur qui a 3 % de chances par tour de tout perdre définitivement
    finit par tout perdre — et nous n''avons même pas besoin de plusieurs tours, un seul suffit.


    Je relève enfin un point de gouvernance, sans en faire une affaire personnelle : l''auteur de l''analyse
    a recueilli cinq signatures sur neuf avant que le conseil ne dispose d''une contre-expertise. Je demande
    qu''aucun vote sur C n''ait lieu sans avis actuariel indépendant présenté en séance.


    ---


    ## 4. Ce sur quoi j''engage la caisse


    Je soumets au vote de jeudi :


    1. **Rejet motivé de C**, inscrit au PV, sans possibilité de réexamen sous forme voisine sans avis
    externe préalable.

    2. **Ouverture du dossier UMA sous quinze jours**, dossier complet sous quatre-vingt-dix jours. Je
    m''y engage personnellement, avec le trésorier et un actuaire mandaté.

    3. **Certification actuarielle indépendante** de la projection et arbitrage sur l''hypothèse d''indexation
    des cotisations. Le **ratio de cessibilité** (réserve ÷ prestations annuelles) devient l''indicateur
    de pilotage unique, publié au conseil chaque trimestre. Il est aujourd''hui à 3,41×.

    4. **AG extraordinaire dans les quatre mois**, avec un plan de redressement du contrat — relèvement
    pluriannuel des cotisations et refonte des garanties hors amiante, la couverture amiante restant intangible.
    L''AG de 2024 a rejeté +6 % dans l''abstrait ; elle n''a jamais été mise devant l''alternative réelle,
    qui est le transfert ou la dissolution. Je dis clairement au conseil que l''ordre de grandeur nécessaire
    est de +23 %, pas +6 %, et qu''un plan par paliers est le seul réaliste.

    5. **Chantier « prise en charge externe »** : quantifier sous soixante jours la part des prestations
    relevant potentiellement d''une reconnaissance en maladie professionnelle amiante, et l''articulation
    avec le FIVA et le régime applicable à nos affiliés — l''ENIM pour les marins, dont les règles diffèrent
    du régime général. C''est le seul levier du dossier qui agit sur le numérateur du problème plutôt
    que sur le rendement de la réserve. Je ne promets pas qu''il porte ; je promets qu''il soit chiffré
    et non pas ignoré, comme il l''a été jusqu''ici.

    6. **Règle permanente** : aucun engagement irréversible supérieur à 10 % de la réserve, aucun blocage
    de plus de douze mois, sans unanimité du conseil et avis écrit externe.

    7. **Conditions d''arrêt pré-décidées** : si le ratio passe sous 3,20× ou si l''UMA se déclare défavorable,
    je saisis le conseil sous trente jours d''un plan de run-off ordonné ou de dissolution volontaire
    — engagée à environ 16 M€, à nos conditions, plutôt que subie à 11 M€ par déclenchement statutaire.


    ---


    ## 5. Le meilleur argument contre ma recommandation


    Le voici, tel que je le formulerais si j''étais de l''autre côté de la table : *l''UMA n''a jamais
    repris un portefeuille amiante sans réassureur ; elle refusera probablement. Vous allez donc brûler
    la fenêtre dans une instruction qui échoue, et nous laisser en A, à six ans du seuil, avec un conseil
    divisé et aucune option — quand C offrait 88 % de chances de solvabilité.*


    Il est solide, et je le retiens partiellement : **je ne peux pas promettre au conseil que la caisse
    survivra comme entité indépendante. C''est probablement hors d''atteinte.** Mais l''argument ne tient
    pas jusqu''au bout. Le dossier UMA coûte quelques dizaines de milliers d''euros et se mène en parallèle
    du plan AG ; il ne consomme pas les autres leviers, il les précède. Les 88 % ne sont pas 88 % de survie
    : ils sont conditionnels à la distribution fournie par le vendeur, et ils n''évitent pas la rupture
    de trésorerie de la quatrième année. Et surtout, l''échec de l''UMA nous laisse à 16 M€ avec une dissolution
    maîtrisée ; l''échec de C nous laisse à 4,7 M€ avec 4 200 affiliés de 61 ans, exposés à l''amiante,
    sans couverture et sans recours.


    ---


    ## 6. Ce que je ne promets pas


    Je ne promets pas de sauver la caisse. Je m''engage à ce qu''elle ne meure pas d''une décision que
    nous aurions prise nous-mêmes un jeudi de conseil, et à ce que ses affiliés récupèrent la couverture
    la plus large possible dans l''issue qui se dessine.


    Le trésorier a raison de dire que refuser C, c''est refuser un pari. Il se trompe sur ce qui est en
    jeu. Jeudi, le conseil ne choisit pas entre mourir vite et mourir lentement. Il choisit s''il contrôle
    la fin ou si la fin le contrôle.

    '
