response:
  text: '# NOTE AU CONSEIL — séance de jeudi


    **Objet :** affectation de l''enveloppe unique de 900 000 € — dossiers A (parc machines) et B (succession
    qualité)


    ---


    ## 1. Sur le tableau unique demandé


    Le tableau est ci-dessous et se lit d''un coup d''œil. Une réserve, en une phrase : **les lignes sont
    classables à l''intérieur de chaque bloc, pas entre les deux blocs.** Le dossier A produit un gain
    récurrent, mesuré sur 5 ans de journal horodaté et audité — un euro y a un rendement. Le dossier B
    est un événement unique, qui n''arrive qu''une fois et sur lequel nous n''avons aucun historique :
    l''entreprise n''a jamais changé de directeur qualité. Un euro n''y a pas de rendement, il achète
    une couverture. Les additionner sur une même colonne donnerait un classement d''apparence homogène
    qui ferait passer B après A pour la seule raison qu''on ne sait pas le chiffrer.


    | # | Ligne | Montant | Indicateur | Base |

    |---|---|---|---|---|

    | **Bloc 1 — récurrent, mesuré (rendement calculable)** ||||

    | 1 | A — 3 machines les plus défaillantes | ~310 000 € | à confirmer, potentiellement 15–20 %/an
    | journal de maintenance, à extraire |

    | 2 | A — parc complet (6 machines) | 620 000 € | **56 000 €/an → 9 %/an, retour 11 ans** | 213 000
    € d''immobilisation + 1 810 h × 38 € |

    | 3 | A — gain sur rebut (4,1 % → 1,2 %) | inclus | **non chiffré — donnée manquante** | volume annuel
    non fourni |

    | **Bloc 2 — unique, non répétable (coût de couverture, pas rendement)** ||||

    | 4 | B — promotion de l''adjointe | 45 000 € | couvre 31 % du CA + le certificat | — |

    | 5 | B — mission de transition du partant | 90 000 € | seul mécanisme de transfert de la relation
    | — |

    | 6 | B — recrutement externe | 280 000 € | ne transfère ni l''organisme notifié ni les clients |
    — |


    ---


    ## 2. Dossier A — ce que disent réellement les chiffres


    Le gain **vérifié** est de 56 000 €/an (213 000 € de coût direct + 1 810 h × 38 € de marge perdue,
    sur 5 ans). Rapporté à 620 000 €, cela donne **11 ans de retour** : insuffisant à soi seul pour engager
    le parc complet.


    Deux points appellent une vérification avant signature :


    - **La garantie de 96 % n''est peut-être pas un progrès.** 1 810 h d''arrêt sur 5 ans font 60 h par
    machine et par an. Pour que 96 % de disponibilité représente un gain, il faudrait que chaque machine
    tourne moins de 1 500 h/an. Si elles tournent davantage — ce que je crois —, **le parc actuel fait
    déjà mieux que 96 %**. La valeur du contrat est alors dans les pénalités et dans le rebut, pas dans
    la disponibilité.

    - **Le rebut est le chiffre qui décide, et il manque.** Passer de 4,1 % à 1,2 % est le seul poste
    capable de ramener le retour sous 5 ans. Il nous manque une seule donnée : heures produites par an
    et valeur matière + main-d''œuvre d''une pièce rebutée. Elle est disponible en 48 h.


    **Décision proposée :** engager le parc complet, **sous condition** que ces deux chiffres soient produits
    avant signature. À défaut, engager les 3 machines dont le journal montre la plus forte concentration
    de pannes (47 pannes sur 6 machines ne sont pas réparties uniformément) et conserver le reste.


    ---


    ## 3. Dossier B — pourquoi il passe en premier malgré un montant six fois moindre


    **La cotation du cabinet RH est écartée comme base de décision.** Trois consultants n''ayant jamais
    travaillé dans le dispositif médical ont produit, en atelier, une probabilité de 35 %, une perte de
    4,2 M€ et une criticité de 7,5/10. Aucune méthode n''est indiquée, aucune source pour les 4,2 M€,
    et une probabilité chiffrée sur un événement **sans aucun précédent** — ni interne, ni sectoriel —
    n''est pas une estimation, c''est une mise en forme. Nous ne laisserons pas un nombre fabriqué en
    une après-midi porter une décision qui touche notre certification.


    Ce qui reste, et qui suffit, sont des faits établis : un interlocuteur unique reconnu par l''organisme
    notifié ; deux clients à 31 % du CA qui déclarent travailler avec nous à cause de lui ; 22 ans d''ancienneté.
    Un fait atténuant, également établi : **il a formé 9 auditeurs internes** — la compétence n''est pas
    entièrement dans un seul homme, la relation l''est.


    L''argument décisif n''est pas le montant, c''est le calendrier. **A est reportable, B ne l''est pas.**
    Si nous n''achetons pas les machines cette année, nous perdons l''enveloppe mais pas l''option : les
    machines seront encore à vendre dans douze mois, en crédit-bail au besoin. Les 11 mois de coprésence
    avec le directeur qualité, eux, ne se rachètent à aucun prix. La ressource rare de ce dossier n''est
    pas l''argent, c''est la fenêtre.


    **Décision proposée : promotion de l''adjointe (45 000 €) *et* mission de transition (90 000 €) —
    135 000 €.** Ce ne sont pas trois options concurrentes mais deux briques complémentaires. Le recrutement
    externe à 280 000 € achète une personne sans lien avec l''organisme notifié et sans lien avec les
    deux hôpitaux : il règle l''organigramme, pas le risque.


    Trois actions à coût nul à lancer dès la semaine prochaine : visite conjointe des deux clients hospitaliers
    par le directeur et sa successeure ; notification formelle du changement à l''organisme notifié avec
    présentation conjointe ; requalification des 9 auditeurs sous sa responsabilité.


    ---


    ## 4. Répartition de l''enveloppe


    | Poste | Montant |

    |---|---|

    | B — adjointe + mission de transition | 135 000 € |

    | A — parc machines (sous condition §2) | 620 000 € |

    | Mise en service, formation opérateurs, instrumentation de mesure du rebut | 80 000 € |

    | Mandat de recherche externe, **activé uniquement au point de contrôle** | 65 000 € |

    | **Total engagé** | **900 000 €** |


    Le poste « mise en service » n''est pas dans les 620 000 € du fournisseur et est régulièrement oublié
    ; sans instrumentation du rebut, nous serons incapables de vérifier dans un an si l''investissement
    a produit ce qu''il promettait.


    **Point de contrôle à 6 mois, avant le départ du directeur** — trois questions binaires : l''organisme
    notifié a-t-il accepté par écrit l''adjointe comme interlocutrice ? Les deux clients hospitaliers
    ont-ils été visités conjointement ? Les 9 auditeurs sont-ils requalifiés sous sa responsabilité ?
    Si une seule réponse est négative, le mandat de recherche externe est activé **pendant que le directeur
    est encore en mission** — c''est-à-dire au seul moment où un recrutement externe peut encore réussir.


    ---


    **Ce que le conseil valide jeudi :** B en totalité et sans condition ; A sous réserve des deux chiffres
    manquants, avec repli sur 3 machines ; l''écart entre les deux blocs du tableau assumé comme une différence
    de nature, non comme un défaut de chiffrage.

    '
