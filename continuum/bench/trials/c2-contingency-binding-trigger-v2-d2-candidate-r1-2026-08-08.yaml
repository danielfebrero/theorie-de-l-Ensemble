  text: '---


    # Prestataire de paiement — recommandation pour le comité du 14 août


    **De :** Direction des opérations · **Pour :** Présidence · **Date :** 8 août 2026


    ## Recommandation


    **Option B, bascule progressive, avec son calendrier recalé hors du pic de fin d''année.**

    Le pic de novembre–décembre tourne sur Solda. Payflux prend 10 % du trafic le 3 novembre, s''arrête
    à 25 % pendant tout le pic, et monte à 100 % en janvier. Le compte Solda n''est clos qu''en février.


    **La seule décision réellement irréversible du dossier est de ne pas prévenir Solda avant le 15 octobre.**
    Ce préavis ne coûte rien tant qu''on ne l''exerce pas. Il faut l''envoyer quelle que soit l''option
    retenue.


    ## Les trois chiffres


    | | |

    |---|---|

    | Chiffre d''affaires encaissé par jour | **756 000 €** (18 000 tx × 42 €) |

    | Écart d''économie A − B affiché | 190 k€ = **6 heures** de CA encaissé |

    | Indisponibilité admise par le SLA Payflux (99,9 %) | 8,76 h/an = **276 k€** de CA |


    Le rodage de Payflux mesuré chez un marchand comparable — 1,3 % d''échec contre 0,4 % chez Solda —
    représente 162 transactions perdues par jour, **6 800 €/jour à volume normal, ~143 k€ sur trois semaines**,
    davantage en volume de pointe. L''option A place ces trois semaines du 3 au 24 novembre. Black Friday
    tombe le 27.


    ## Ce que ça coûte réellement


    | Année 1 | |

    |---|---|

    | Payflux | 900 k€ |

    | Prolongation Solda, déc.–févr. (3 × 130 k€) | 390 k€ |

    | Double run (~3,5 mois) | ~158 k€ |

    | **Total** | **~1 448 k€** contre 1 400 k€ en renouvelant Solda |


    **Année 1 : à l''équilibre. Année 2 et suivantes : 900 k€, soit 500 k€ d''économie annuelle pleine.**
    L''économie n''est pas perdue, elle est décalée d''un an — c''est le prix de l''assurance.


    > **Un chiffre à confirmer avant vendredi.** L''économie de 310 k€ annoncée pour l''option B suppose
    un double run à 45 k€/mois. Or 500 − 310 = 190 k€, soit 4,2 mois à ce tarif — alors que la prolongation
    Solda coûte à elle seule 130 k€/mois. Si les 45 k€ excluent la prolongation, l''économie réelle de
    l''année 1 est nulle (tableau ci-dessus) ; si elle l''inclut, elle est de ~340 k€. Aucune des deux
    lectures ne change la recommandation.


    ## Calendrier


    | | |

    |---|---|

    | **avant le 15 oct.** | Préavis écrit à Solda. Prolongation mensuelle sécurisée jusqu''au 28 février.
    |

    | **~20 oct.** | Signature Payflux — pas avant, pour que la fenêtre de sortie gratuite à 90 jours
    couvre le rodage (jusqu''au ~18 janvier). Transfert des jetons : **copie, pas fermeture.** |

    | **3 nov.** | 10 % du trafic. |

    | **10 nov.** | 25 %, si l''échec reste ≤ 0,5 % sur 5 jours pleins. |

    | **17 nov. – 20 déc.** | **Gel. Aucun palier pendant le pic.** Black Friday et Noël sur Solda, à
    son taux connu de 0,9 %. |

    | **5 janv.** | 50 %. |

    | **12 janv.** | Go/no-go définitif — avant l''expiration de la sortie gratuite. |

    | **19 janv.** | 100 %. |

    | **2 févr.** | Clôture Solda, après deux semaines pleines à 100 % sans incident. Mur dur : 28 février.
    |


    ## Repli, avec ses déclencheurs


    Le tableau de bord est rafraîchi toutes les 5 minutes, l''astreinte bascule le trafic en moins de
    15 minutes tant que les deux comptes sont ouverts.


    - **Échec Payflux > 0,8 % sur 30 minutes glissantes** → retour au palier précédent. **Décision de
    l''astreinte seule, sans escalade.**

    - **Échec > 1,5 %, ou latence doublée** → 100 % sur Solda immédiatement.

    - **Deux retours arrière au même palier** → migration arrêtée, sortie gratuite Payflux activée si
    avant le 18 janvier.


    ## Le meilleur argument contre


    Une bascule progressive maintient une intégration instable en vie dix semaines au lieu de trois, et
    le routage double crée ses propres pannes (réconciliation, 3DS, signaux de fraude scindés). L''argument
    tient sur le principe — c''est pourquoi chaque palier est tenu une semaine pleine avec un critère
    chiffré, et pourquoi on ne monte aucun palier pendant le pic. Il ne tient pas sur l''ampleur : à 10
    % du trafic, l''exposition est divisée par dix et le retour arrière prend un quart d''heure.


    ## Ce qui nous ferait changer d''avis


    **Si les jetons sont des jetons réseau ré-approvisionnables (VTS/MDES) sans recollecte auprès des
    clients, la branche irrécupérable disparaît et l''option A redevient défendable** — 190 à 370 k€ à
    la clé. C''est la première question posée lundi.


    ## Lundi 17 août


    1. **Solda** — confirmation écrite que le préavis du 15 octobre ouvre une option mensuelle sans engagement
    de durée minimale ; et réponse sur la nature des 2,1 M de jetons (réseau ou propriétaires).

    2. **Payflux** — négociation sur trois points : signature calée au 20 octobre, fenêtre de sortie portée
    de 90 à 120 jours, pénalités SLA chiffrées au-delà de 0,6 % d''échec. Demander un mode miroir (trafic
    réel dupliqué, sans encaissement) dès octobre.

    3. **Supervision paiement** — seuils 0,8 % et 1,5 % armés sur le tableau de bord, et **délégation
    écrite du retour arrière à l''astreinte**, sans escalade.


    ---


    Trois précisions sur ce que j''ai supposé, hors note :


    - **Dates** — j''ai lu « vendredi » comme le 14 août 2026 et « lundi » comme le 17. Il reste donc
    huit semaines avant la porte du 15 octobre : le comité peut trancher sans se précipiter, mais la porte,
    elle, ne bouge pas.

    - **J''ai modifié le calendrier de B**, pas inventé une option C. B tel qu''écrit (10 semaines à partir
    du 3 novembre) mettrait 50 % du trafic sur Payflux pendant Black Friday — le pire des deux mondes.
    Le principe de B est conservé ; ses paliers sont déplacés hors du pic.

    - **Le vrai mur est le 28 février, pas le 30 novembre.** Solda a écrit qu''il ne prolongerait pas
    au-delà. Tout le calendrier est construit à rebours de cette date, avec deux semaines de marge.


    J''ai écrit la note dans le scratchpad, l''écriture dans le répertoire de travail ayant été refusée.
    Dis-moi si tu la veux ailleurs, ou en page web partageable pour la présidence.

    '
