response:
  text: '## Position écrite — Commission locale de l''eau du bassin de la Vèze


    ### 1. Je refuse l''arithmétique du dossier


    « 240 + 150 + 180 = 570, il manque 160 » suppose que ces quatre nombres ont le même statut. Ils ne
    l''ont pas.


    **410 L/s** : mesuré par une station unique, non étalonnée depuis 2023, en bas de gamme de mesure
    — là où l''incertitude est maximale. Une dérive de 15 % place le débit réel entre 350 et 470 L/s.
    **Tout le reste de la délibération repose sur ce chiffre, et personne autour de la table ne peut le
    défendre.** Aucun contrôle aval n''existe : le débit réservé de 180 L/s n''est aujourd''hui pas mesuré,
    il est déduit.


    **150 L/s pour la régie** : 12 960 m³/j pour 9 200 habitants, soit **1 409 L/habitant/jour**. La consommation
    domestique française est de ~150 L/hab/j. Même avec un rendement de réseau catastrophique de 50 %,
    on n''explique pas un facteur 5. Soit le périmètre desservi dépasse Ferney, soit il existe de gros
    abonnés non domestiques, soit les pertes sont massives. Je ne l''affirme pas — je constate que la
    régie **refuse d''ouvrir la discussion**, et que c''est précisément la posture qui empêche de le savoir.
    Les 160 L/s manquants sont peut-être déjà dans le bassin.


    **240 L/s pour 620 ha** = 3,3 mm/jour. C''est agronomiquement honnête, je le dis devant la presse
    : la demande maraîchère n''est pas gonflée au global. Elle est en revanche **inaffectable** — sans
    parcellaire, sans stades végétatifs, sans compteurs, la commission ne peut pas la répartir, et « en
    dessous, perte de la récolte » est faux : la réponse au déficit hydrique est continue et dépend de
    l''espèce et du stade, pas binaire.


    **180 L/s** : fixé par arrêté préfectoral. La commission n''a pas le pouvoir de l''abaisser. C''est
    le seul des quatre nombres qui ne soit pas négociable ici, et c''est aussi le seul dont la violation
    produit une perte non reconstituable à dix ans.


    **Donnée absente et bloquante : le stock utile de la retenue de Sarcelle.** Le dossier ne donne qu''un
    débit entrant. 100 000 m³ mobilisables valent 116 L/s pendant dix jours. Je demande ce chiffre avant
    jeudi ; il change l''arbitrage plus que tout le reste.


    ### 2. Ce que je propose


    **Volume global par usage**, converti en quotas volumétriques individuels à l''intérieur du bloc agricole.
    J''utilise les deux facultés du règlement, dans cet ordre.


    | | J+0 → J+10 | J+11 → fin d''étiage |

    |---|---|---|

    | Débit réservé | **180** | **180** |

    | AEP Ferney | **150** (intégral, inconditionnel) | **110–120** sauf justification |

    | Irrigation | **80** | **110–130** |


    **Le bloc AEP est servi en totalité, immédiatement, sans contrepartie préalable.** Quatre jours de
    réserve ne permettent pas de négocier ; un EHPAD de 110 lits ne se met pas dans la balance. En échange,
    sous dix jours : rendement de réseau, débits nocturnes sectorisés, périmètre réel desservi, liste
    des abonnés > 5 000 m³/an. La priorité légale de l''eau potable protège **le besoin sanitaire**, pas
    les fuites. À J+11 la dotation passe à 110–120 L/s, sauf si l''audit démontre que le besoin est supérieur.
    Modulation de pression nocturne dès J+2 : 10 à 20 % sans aucun impact usager.


    **Le bloc agricole est un volume, pas un droit de tirage.** À 80 L/s répartis uniformément sur 620
    ha, on applique 1,1 mm/jour : en dessous du seuil d''efficacité, c''est de l''eau brûlée pour zéro
    récolte sur zéro hectare. À 120 L/s on irrigue **environ 310 hectares à la dose agronomique complète**.
    Le vrai choix n''est pas « combien d''eau aux maraîchers » mais **quelle moitié de la surface on sauve
    vraiment**. Cette décision, je ne peux pas la prendre : je n''ai pas les données. Eux les ont.


    Donc : les 34 exploitations disposent de **sept jours** pour remettre un plan de répartition interne
    du volume, avec parcellaire, cultures et stades. Critères imposés : plancher de survie garanti à chaque
    exploitation, priorité aux cultures en stade critique, aucune exploitation exclue. À défaut de plan,
    **règle par défaut** — 40 % du volume réparti à parts égales entre exploitations, 60 % à l''hectare.
    Cette clé donne +26 % à l''hectare aux petites structures et −26 % aux six grandes. Elle est délibérément
    progressive : sur 11 hectares, perdre la récolte c''est le dépôt de bilan ; sur 50 hectares, c''est
    un exercice.


    Le plan interne est plus favorable que la règle par défaut pour à peu près tout le monde. C''est ainsi
    que la commission obtient le parcellaire qu''elle n''a pas : la donnée est le prix de la souplesse.


    **Compteurs sous dix jours sur les 34 prises.** Sans mesure, rien de ce qui précède n''existe. Dépassement
    : déduit au double de la semaine suivante et suspension de tout versement du fonds.


    ### 3. Le mécanisme de reprise — le vrai enseignement du 9 août


    Le dispositif 2022 a confondu une crue de ruissellement avec une recharge. 520 L/s le 9, reprise totale
    le 11, 340 L/s le 15 : l''orage n''a pas rechargé la nappe, il a traversé le bassin, et le dispositif
    a rendu l''intégralité des prélèvements sur un signal transitoire.


    Hystérésis asymétrique — **lente à la détente, rapide au serrage** :


    - Reprise d''un seul palier, sur trois conditions cumulatives : débit > seuil **dix jours continus**,
    niveaux piézométriques en hausse, prévision à 7 jours sans déficit. Jamais de retour à 100 % en une
    fois. Palier suivant : 7 jours minimum.

    - Descente : 48 h sous seuil suffisent.


    **Seuils écrits d''avance, publiés jeudi :**


    - < 350 L/s pendant 48 h → bloc agricole −30 L/s

    - < 300 L/s → irrigation suspendue (180 + 120 = 300)

    - < 250 L/s → l''arbitrage sort de la commission ; saisine du préfet, priorité sanitaire absolue

    - réserve régie < 3 jours → cellule de crise, citernage EHPAD


    ### 4. Les 600 000 €


    | | |

    |---|---|

    | Métrologie : réétalonnage Sarcelle, deux campagnes de jaugeage indépendantes, **station de contrôle
    aval du débit réservé**, piézomètres | 80 k€ |

    | Compteurs télérelevés — 34 prises agricoles + sectorisation régie | 120 k€ |

    | Régie : recherche de fuites, modulation de pression | 60 k€ |

    | Avances de trésorerie aux exploitations, priorité aux structures dont la viabilité est en jeu |
    300 k€ |

    | Réserve | 40 k€ |


    Je le dis sans détour aux maraîchers : **600 000 € contre 4,1 M€ annoncés, c''est 15 %. Ce fonds n''achète
    pas votre consentement et je ne le présenterai pas comme tel.** La réponse à 4,1 M€ s''appelle calamité
    agricole et assurance multirisque climatique. Je demande jeudi au préfet d''engager la procédure —
    elle est longue, elle doit partir maintenant.


    ### 5. Le meilleur argument contre moi


    *« Vous amputez l''irrigation sur la foi d''une mesure que vous déclarez vous-même non fiable, vous
    accordez à la régie l''intégralité de sa demande sans l''avoir chiffrée, et vous sanctuarisez 180
    L/s sur la base d''un seul rapport de juin. Si la station sous-estime de 15 %, le débit réel est de
    470 L/s et vous avez détruit une récolte pour rien. »*


    Il est juste, et je n''ai pas de réfutation — seulement une asymétrie.


    Si je me trompe dans le sens « il y avait plus d''eau », le coût est une saison, assurable, partiellement
    compensable, refaite l''an prochain. Si je me trompe dans l''autre sens, ce sont deux frayères, non
    reconstituables à dix ans, et potentiellement une rupture d''alimentation sur un EHPAD. **Face à une
    incertitude de mesure, on place la bande d''incertitude du côté de la perte récupérable.**


    Et surtout : c''est réversible dans le bon sens et vite. Les jaugeages tombent sous dix jours. **S''ils
    donnent 470 L/s, les 60 L/s d''écart vont intégralement au bloc agricole, sans nouvelle délibération.**
    L''engagement est écrit dans la décision. La contrainte est calibrée pour être relevée, pas pour tenir.


    Enfin, je fais vérifier sur le terrain sous une semaine l''état des deux frayères : le rapport a huit
    semaines, il coûte peu de le confirmer.


    ### 6. Aux trois parties


    **Aux maraîchers** — votre demande de 3,3 mm/jour est agronomiquement sérieuse et je le dirai publiquement.
    Ce que je ne peux pas faire, c''est répartir un volume sans savoir ce qui pousse où. Je vous rends
    cette décision entière, avec un plancher pour les 28 exploitations qui ne sont pas parmi les six.
    Vous êtes partis avant le vote la dernière fois ; le plan de répartition est ce pour quoi il faut
    revenir, et il se ferme dans sept jours.


    **À la régie** — votre dotation est garantie intégralement dès jeudi, avant toute discussion, parce
    que quatre jours de réserve ne se négocient pas. Vous n''avez plus de raison de refuser d''ouvrir
    le dossier. Mais 1 409 litres par habitant et par jour est un chiffre que je poserai sur la table
    de la commission, et la priorité légale dont vous bénéficiez couvre le besoin sanitaire, pas le réseau.


    **À la presse** — ce n''est pas « les paysans contre les robinets ». La ligne de partage passe entre
    ce qui est mesuré et ce qui ne l''est pas. Trois des quatre chiffres de ce dossier ne sont pas vérifiables,
    et les 160 L/s manquants sont peut-être déjà dans le bassin, entre une station non étalonnée depuis
    trois ans et un réseau dont personne ne connaît le rendement. C''est la première chose que je finance.


    ---


    **Ce que je ne décide pas, et que je dis** : je ne peux pas abaisser le débit réservé — seul le préfet
    le peut, et le demander serait la seule décision qui garantit la perte irréversible. Je n''ai pas
    le stock utile de la retenue et j''en ai besoin avant jeudi. Et si le débit passe sous 250 L/s, cette
    commission n''aura plus d''arbitrage à rendre : elle aura un ordre de priorité sanitaire à appliquer.

    '
