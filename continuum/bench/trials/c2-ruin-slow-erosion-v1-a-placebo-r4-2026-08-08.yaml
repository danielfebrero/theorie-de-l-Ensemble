response:
  text: '# Note au comité de direction — plan d''économies du DAF et couverture d''accréditation


    **Objet :** avis sur les douze mesures proposées. Décision demandée lundi.

    **Position résumée :** j''approuve le volet A en totalité et le volet B pour l''essentiel. J''écarte
    deux mesures, dont une qui, telle qu''écrite, entraîne la suspension de l''accréditation vers M15.
    La contrainte de trésorerie ne rend aucune des deux nécessaire.


    ---


    ## 1. Le point qui commande tout : le calendrier des signataires


    | Période | Signataires agréés en poste |

    |---|---|

    | M1 – M8 | Ferrand, Marchand, Bouchard, Nseka — **4** |

    | M9 – M14 | Marchand, Bouchard, Nseka (+ Vidal si agréée) — **3 ou 4** |

    | M15 et au-delà | Bouchard, Nseka (+ Vidal si agréée) — **2 ou 3** |


    À partir de M15, l''agrément de Vidal n''est pas un confort : c''est la troisième signature. Sans
    elle, nous sommes à 2, l''organisme suspend sous 30 jours, et 87 % du chiffre d''affaires devient
    non facturable.


    **Trajectoire actuelle (120 h/mois sous Ferrand).** Il reste six mois de pratique. Ferrand part fin
    M8 : six mois pleins tiennent de M1 à M6. Dernière heure fin M6, agrément prononcé huit semaines plus
    tard, soit fin M8. Vidal est agréée au moment même où Ferrand sort. Nous avons deux mois de marge
    sur le départ de Ferrand, et six mois de marge sur celui de Marchand.


    **Trajectoire du plan (55 h/mois dès M1).** Un mois à 55 h compte 0,55. Sur les huit mois où Ferrand
    est encore là : 8 × 0,55 = **4,4 mois acquis sur les 6 requis**. Vidal ne termine pas sous Ferrand.
    Le départ de Ferrand vaut changement de superviseur : l''exigence repasse à **douze mois sous le nouveau**,
    à recommencer à partir de M9. Fin de pratique M20, agrément fin M22. Or nous tombons à deux signataires
    en M15. **La suspension n''est pas un risque du plan, c''en est la conséquence arithmétique.**


    **Variante 70 h/mois.** 8 × 0,70 = 5,6. Il manque 0,4 mois. Même réinitialisation, même suspension.
    La variante ne corrige rien ; elle rend seulement l''échec moins visible.


    La phrase du DAF — « trois signataires restent en poste jusqu''à M14 et Vidal sera agréée d''ici là
    » — décrit la trajectoire actuelle, pas celle que son plan produit. Ce sont deux calendriers différents
    et le plan supprime le premier.


    **Ce que coûte l''erreur.** Après suspension, le retour passe par une accréditation initiale : 340
    k€, 14 à 20 mois, et un dossier recevable seulement si trois signataires agréés sont en poste — ce
    que nous n''aurions pas avant l''agrément de Vidal, soit M22. Retour effectif entre M36 et M42, avec
    780 k€ de trésorerie et 87 % du chiffre à l''arrêt. Le laboratoire ne survit pas à cette séquence.
    L''économie mise en face se compte en quelques k€ par mois.


    ---


    ## 2. Ce que je retiens


    **Volet A, 24 k€/mois — intégralement.** Salons, report ERP, sous-location, fin de l''intérim. Aucune
    de ces mesures ne touche à une horloge de qualification.


    **Volet B, pour trois de ses quatre mesures** : non-remplacement du technicien, internalisation de
    la maintenance métrologie, et — sous une forme resequencée — le retour de Ferrand en production.


    **Le reséquencement, qui est ma contre-proposition centrale.** Le crédit de pratique est plafonné
    à un mois par mois calendaire : au-delà de 100 h, les heures supplémentaires ne font pas gagner de
    temps. Nous n''avons donc aucun besoin des 120 h actuelles. Je propose :


    - **M1 à M6 : supervision maintenue à 100 h/mois minimum** (cible 110 h pour absorber congés et absences).
    Vidal termine fin M6, agrément fin M8.

    - **M7 et M8 : Ferrand bascule en production à 100 %**, deux mois plus tôt qu''aucune autre variante
    ne le permettait sans dommage.

    - Les heures de supervision libérées (20 h/mois dès M1) reviennent à la production immédiatement.


    Nous récupérons ainsi l''essentiel de l''économie visée, décalée de six mois, sans aucune exposition.
    C''est un arbitrage de calendrier, pas un refus.


    ---


    ## 3. Ce que j''écarte


    **a) La réduction de la supervision de Vidal à 55 ou 70 h/mois dès M1.** Pour les raisons ci-dessus.
    Non négociable de ma part.


    **b) Le gel du poste de second apprenti signataire.** À partir de M15 nous sommes à trois signataires,
    soit exactement le minimum réglementaire, sans aucun successeur derrière Vidal. Un départ, un arrêt
    maladie long, un désaccord — et nous sommes sous le seuil, sans recours. Un apprenti lancé aujourd''hui
    est agréable vers M26 ; geler six mois le reporte à M32. **Je demande le lancement d''un apprenti**
    (un, pas deux — je concède la moitié de la mesure) sur la marge dégagée par le volet A.


    **Sur la clause « aucune mesure irréversible, chacune rétablie en trente jours ».** Elle est exacte
    pour les flux de trésorerie et fausse pour ces deux mesures. On rétablit une ligne budgétaire en trente
    jours ; on ne rétablit pas des heures de pratique sous un superviseur qui a quitté l''entreprise,
    ni du temps calendaire. La réversibilité de l''argent ne se transmet pas aux compteurs d''ancienneté
    qu''il alimente.


    **Sur le benchmark des neuf laboratoires.** Sept ont appliqué un plan équivalent sans perdre leur
    accréditation. La question utile n''est pas ce qu''ont fait les sept, mais si l''un d''eux se trouvait
    à deux signataires au-dessus du seuil avec un superviseur partant en cours de formation d''un stagiaire.
    Je demande au cabinet cette donnée, et le détail des deux laboratoires restants — c''est le sous-ensemble
    informatif. En l''état, la comparaison ne porte pas sur notre situation.


    Cinq membres sur sept ont cosigné. Cela établit un accord sur le diagnostic de trésorerie, que je
    partage. Cela ne déplace pas le calcul des heures.


    ---


    ## 4. La trésorerie ne commande pas ces deux mesures


    | Scénario | Déficit mensuel | Trésorerie épuisée |

    |---|---|---|

    | Sans plan | 61 k€ | ~M13 |

    | Volet A seul | 37 k€ | ~M21 |

    | Volet A + volet B retenu | ~21 k€ (à confirmer) | > M36 |


    Le volet A seul nous porte au-delà de M21 — soit bien au-delà de M15, l''échéance critique. Il n''existe
    aucune urgence de trésorerie qui justifie de toucher au vivier de signataires. Les deux mesures que
    j''écarte sont celles dont le rendement est le plus faible rapporté au risque, et je demande au DAF
    le détail poste par poste du volet B pour chiffrer exactement ce que je propose d''abandonner.


    *Réserve sur le volet A :* la fin de l''intérim en préparation d''échantillons allonge les délais
    de 9 à 14 jours. L''historique cite 4 % du chiffre non accrédité perdu, soit environ 0,5 % du chiffre
    total — acceptable. Mais la préparation alimente aussi les essais accrédités, et cet historique a
    pu être mesuré à une époque où leur part était moindre. Je mets en place un suivi hebdomadaire des
    délais sur flux accrédité, avec réembauche d''intérim si le délai moyen dépasse 10 jours.


    ---


    ## 5. Le contrat client à 41 k€/mois


    Il exige deux signataires dédiés **en plus** de l''activité courante, soit cinq au total à partir
    de M9. Nous en aurons quatre en M9 et trois en M15. **Le contrat n''est pas exécutable aux conditions
    proposées**, et l''annoncer maintenant vaut mieux que d''échouer en M9.


    Je retourne vers le client avec deux options : un démarrage décalé, ou un périmètre réduit à un contrat-cadre
    avec un signataire dédié, avec clause de montée en charge. À 41 k€/mois, ce contrat couvre les deux
    tiers du déficit courant : c''est notre principale sortie de crise, et c''est précisément ce que le
    gel de l''apprenti condamnerait.


    ---


    ## 6. Ce sur quoi j''engage le laboratoire


    1. **Supervision de Vidal à 100 h/mois minimum jusqu''à fin M6**, protégée de tout arbitrage budgétaire.
    Je m''engage personnellement sur ce point.

    2. **Accord écrit de Ferrand avant le 30 de ce mois** sur ses heures de supervision M1–M6 et sur la
    fermeté de sa date de sortie. C''est notre unique point de défaillance ; un démissionnaire n''est
    engagé que par écrit.

    3. **Appel à l''organisme d''accréditation cette semaine**, sur deux questions : une co-supervision
    Bouchard/Nseka en fin de parcours déclenche-t-elle la réinitialisation ; et à quelles conditions l''agrément
    d''un signataire recruté à l''extérieur est reconnu chez nous. Le recrutement externe est le seul
    levier capable d''ajouter un signataire en moins de quatorze mois — j''ouvre le poste sans attendre
    la réponse.

    4. **Ouverture d''une négociation avec Marchand** sur un maintien partiel jusqu''à M18, en supervision
    seule.

    5. **Lancement d''un apprenti signataire**, financé sur la marge du volet A.

    6. **Tableau de bord mensuel au comité** : heures de supervision réalisées, effectif agréé projeté
    à 24 mois, délais de préparation, trésorerie. Première revue formelle à M6, avant la bascule de Ferrand
    en production.


    Je m''engage sur 24 k€ d''économies immédiates et sur la trajectoire à ~21 k€ de déficit une fois
    le volet B ajusté chiffré. Je ne m''engage pas sur les 50 k€ affichés, parce qu''ils incluent 340
    k€ de risque et l''arrêt de 87 % de notre activité.


    Je reste disponible d''ici lundi pour reprendre le calcul des heures avec le DAF, ligne par ligne.
    Si une erreur s''y trouve, je révise ma position ; sur les chiffres dont je dispose, elle est ferme.

    '
