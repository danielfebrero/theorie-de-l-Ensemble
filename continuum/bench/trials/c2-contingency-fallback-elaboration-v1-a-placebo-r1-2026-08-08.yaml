    # PLAN D''EXÉCUTION — CONVERSION ÉLECTRIQUE DE LA FLOTTE


    **Destinataire :** Conseil d''administration — séance du jeudi 13 août 2026

    **Émetteur :** Direction de l''exploitation

    **Objet :** Mise en œuvre de la décision du 4 mai — 96 utilitaires électriques, septembre 2026 → février
    2027


    ---


    ## 1. Ce que ce plan engage


    La commande est ferme, les 96 véhicules seront livrés et mis en service. Le plan ci-dessous sécurise
    les deux choses qui peuvent encore mal tourner : la subvention de 620 000 € et la continuité des 96
    tournées quotidiennes pendant la bascule.


    Il porte deux constats qui appellent des décisions jeudi, pas en octobre :


    1. **La contrainte n''est pas l''autonomie des véhicules, c''est la capacité de recharge nocturne.**
    Les 22 bornes prévues (14 + 8 devisées) permettent d''exploiter environ 61 véhicules en conditions
    hivernales. Pas 96.

    2. **Environ 30 % de nos tournées sont trop longues pour être électrifiées en hiver, quel que soit
    le nombre de bornes.** Elles devront être redécoupées ou conservées en thermique.


    Aucun des deux ne remet en cause la conversion. Les deux changent le calendrier et le budget.


    ---


    ## 2. L''arithmétique de la recharge


    Une borne de 22 kW restitue une charge complète en 6 h. Convertie en autonomie réelle mesurée en mars
    :


    | Condition | Autonomie mesurée | Autonomie restituée par heure de borne |

    |---|---|---|

    | Tempéré (> 10 °C) | 232 km | **38,7 km/h** |

    | Froid (2 °C, chauffage) | 197 km | **32,8 km/h** |


    Fenêtre de recharge exploitable : 12 h (17 h → 5 h), retours et départs échelonnés.


    | Parc de bornes | Heures-bornes/nuit | Capacité tempérée | Capacité hivernale |

    |---|---|---|---|

    | 14 (actuel) | 168 | 6 500 km | **5 510 km** |

    | 22 (+ tranche 1) | 264 | 10 220 km | **8 660 km** |

    | 30 (+ tranche 2) | 360 | 13 930 km | **11 810 km** |

    | 41 | 492 | 19 040 km | **16 140 km** |


    Besoin total : 96 × 168 km = **16 128 km/nuit**.


    **Conclusion : l''exploitation des 96 véhicules en hiver demande 41 bornes.** Nous en avons 14, et
    8 devisées. Le plan actuellement financé couvre 54 % de la flotte.


    ---


    ## 3. Règle d''affectation — la seule règle à retenir


    **Chaque soir, les 96 tournées du lendemain sont triées par kilométrage. Les N plus courtes partent
    en électrique, le reste en diesel.** N est fixé par la capacité de recharge du jour, pas par le nombre
    de véhicules disponibles.


    Cette règle résout les deux problèmes d''un coup : elle écarte les tournées à risque de panne d''autonomie,
    et elle minimise mécaniquement le besoin en heures-bornes (le temps de charge est proportionnel aux
    km parcourus).


    **Plafonds de tournée électrique**, dérivés de l''essai — les 11 recharges non prévues se sont toutes
    produites au-delà de 190 km, aucune en deçà :


    - **> 10 °C : 185 km**

    - **< 10 °C : 160 km** (190 km × ratio d''autonomie hivernale 197/232)


    Le plafond est appliqué à la température prévue à 6 h, pas à la moyenne saisonnière.


    ---


    ## 4. Calendrier de montée en charge


    | | VE livrés (cum.) | Bornes | Capacité nuit | **VE en service** | Diesels conservés | Prolongations
    |

    |---|---|---|---|---|---|---|

    | Septembre | 24 | 14 | 6 500 km | 24 | 72 | 0 |

    | Octobre | 48 | 14 → 22 (20/10) | 6 500 → 10 220 | 44 | 52 | 4 |

    | Novembre | 72 | 22 | 8 660 km | **58** | 38 | 14 |

    | Décembre | 96 | 22 → 30 (15/12) | 8 660 → 11 810 | **70** | 26 | 26 |

    | Janvier | 96 | 30 | 11 810 km | **77** | 19 | 19 |

    | Février | 96 | 30 | 11 810 km | 77 | 19 | 19 |


    **Le seuil des 60 véhicules est franchi début décembre**, soit huit semaines de marge avant le 31
    janvier. Sans la tranche 2 de bornes, le plafond hivernal est de 61 véhicules : la subvention tiendrait
    à un véhicule près. Ce n''est pas une marge, c''est une coïncidence.


    ---


    ## 5. Parc diesel : par défaut, on prolonge


    L''asymétrie du contrat commande la décision. Prolonger coûte 480 €/véhicule/mois et se réarbitre
    chaque mois. Restituer est irréversible pendant 11 semaines. Une tournée non terminée coûte 900 €.


    **Un mois de prolongation équivaut à un peu plus d''une demi-tournée ratée.** Sur la seule tournée
    mensuelle d''un véhicule (21 jours), le point mort est à 2,5 % d''échec. L''essai a mesuré 9 % de
    recharges non prévues.


    **Règle : aucun lot n''est restitué tant que la capacité de recharge correspondante n''est pas en
    service et vérifiée sur trois nuits consécutives.** Le préavis de prolongation est envoyé par défaut
    ; on ne le lève que sur constat.


    **Premier jalon irréversible : le 31 août.** Préavis à envoyer au loueur pour le lot de septembre
    — 18 jours après ce conseil.


    Échéancier des préavis : 31 août (lot 1), 30 septembre (lot 2), 31 octobre (lot 3), 1er décembre (lot
    4).


    ---


    ## 6. Le problème des tournées longues


    Notre tournée la plus longue fait 240 km. L''autonomie réelle mesurée est de 232 km en tempéré et
    197 km en hiver. **Les tournées les plus longues ne sont pas électrifiables, en aucune saison, sans
    recharge intermédiaire.**


    Sur la base d''une distribution linéaire (96–240 km, moyenne 168), environ **29 tournées dépassent
    197 km** et environ 15 dépassent 232 km. La distribution réelle sera vérifiée lundi (§ 10).


    Redécouper l''ensemble sous un plafond de 160 km porterait le nombre de tournées de 96 à environ 111.
    **Les 96 véhicules commandés dimensionnent la flotte pour le plan de tournées actuel, que l''autonomie
    électrique ne permet pas de tenir.**


    Trois issues, chiffrées :


    | Option | Coût | Réversible |

    |---|---|---|

    | Queue diesel permanente de ~15 véhicules sur les tournées longues | 86 400 €/an | Oui |

    | 15 véhicules électriques supplémentaires + redécoupage | ~485 000 € + conducteurs | Non |

    | Recharge intermédiaire en itinérance (DC) | Infrastructure + 30–40 min/tournée | Partiellement |


    **Recommandation : queue diesel jusqu''en mars 2027**, puis arbitrage sur un hiver complet de données
    télématiques. C''est la seule option qui ne nous engage pas sur une hypothèse d''autonomie que nous
    n''avons pas encore vérifiée en janvier.


    ---


    ## 7. Pilotage


    Le superviseur remonte l''état de charge et le kilométrage toutes les 10 minutes. Nous transformons
    cette remontée en boucle de contrôle, pas en historique.


    **Indicateurs quotidiens, par plateforme :**

    - Taux de tournées terminées (cible : ≥ 99,5 %)

    - Recharges non prévues (seuil : ≤ 2/semaine/plateforme)

    - SoC au retour, par véhicule — **tout véhicule rentrant sous 15 % est déclassé le lendemain vers
    une tournée plus courte**, automatiquement

    - Taux d''occupation des bornes sur la fenêtre nocturne (le vrai indicateur de saturation)


    **Points d''arrêt :**


    | Date | Vérification | Si le seuil n''est pas tenu |

    |---|---|---|

    | 5 sept. | Histogramme des tournées + capacité réseau confirmée | Déclenchement du chantier de redécoupage
    |

    | 10 oct. | 3 semaines à 24 VE : complétude ≥ 99,5 % | Cohorte d''octobre gelée, diesels prolongés
    |

    | 10 nov. | Tranche 2 de bornes : go/no-go | Aucun — la décision est prise au plus tard ce jour |

    | 20 déc. | ≥ 60 VE en service | Escalade région, activation de la queue diesel maximale |


    **Levier gratuit à activer dès septembre :** préconditionnement thermique sur borne avant départ,
    et formation conducteurs au chauffage en mode éco. Gain attendu 8–12 % d''autonomie hivernale, soit
    ~15 km — l''écart entre un plafond de 160 et de 175 km.


    ---


    ## 8. Engagements financiers complémentaires


    | Poste | Montant | Échéance de décision |

    |---|---|---|

    | Bornes tranche 1 (8) — devisé | 210 000 € | **Cette semaine** (7 semaines de travaux) |

    | Bornes tranche 2 (8) | ~210 000 € | 15 septembre |

    | Prolongations de location (63 véhicule-mois) | 30 240 € | Enveloppe demandée : **60 000 €** |

    | **Total** | **~480 000 €** | |


    En regard : subvention de 620 000 € sécurisée, et évitement du coût d''échec. Forcer le rythme sans
    capacité de recharge produirait mécaniquement, en décembre, de l''ordre de 6 tournées non terminées
    par jour sur les tournées longues — soit **113 000 €/mois**.


    **Hors périmètre de ce plan, à arbitrer en mars 2027 :** l''exploitation hivernale des 96 véhicules
    demande 41 bornes, soit ~19 bornes au-delà de la tranche 2, environ 500 000 €.


    ---


    ## 9. Décisions demandées jeudi


    1. **Engager la tranche 1 de bornes (210 000 €) — cette semaine.** Sept semaines de travaux : commande
    le 14 août = mise en service le 2 octobre. Chaque semaine de retard décale la cohorte d''octobre.

    2. **Approuver l''enveloppe de prolongation de location de 60 000 €**, et le principe « aucune restitution
    sans capacité de recharge vérifiée ». Premier préavis le 31 août.

    3. **Autoriser la tranche 2 de bornes (~210 000 €)**, décision confirmée au 15 septembre sur les données
    de la première cohorte. Sans elle, la subvention repose sur une marge d''un véhicule.

    4. **Mandater la direction de l''exploitation pour saisir la région** sur la définition de « roulent
    » au 31 janvier — livrés, immatriculés, ou en service ? Réponse écrite exigée avant le 15 septembre.
    620 000 € en dépendent.

    5. **Prendre acte de la queue diesel structurelle** d''environ 15 véhicules sur les tournées longues
    jusqu''en mars 2027, et de l''arbitrage à venir sur le redécoupage du plan de tournées.


    ---


    ## 10. Ce que je ne sais pas encore


    Trois inconnues, toutes levées avant le 5 septembre :


    **La distribution réelle des 96 tournées.** Le plan repose sur une distribution supposée linéaire
    entre 96 et 240 km. Les kilométrages réels sont dans le superviseur. **Livrable lundi 10 août.** Si
    plus de 20 % des tournées dépassent 190 km, le calendrier du § 4 se dégrade et la tranche 2 devient
    une urgence, pas une option.


    **La capacité électrique des deux plateformes.** 30 bornes représentent 660 kW, soit plus du double
    de l''installation actuelle. Le devis de 7 semaines suppose vraisemblablement l''absence de renforcement
    de poste. Si un transformateur est nécessaire, le délai passe de semaines à mois et tout le calendrier
    tombe. **Vérification engagée auprès du gestionnaire de réseau, réponse attendue vendredi 14.** C''est
    le seul point qui peut casser le plan sans préavis.


    **Le comportement réel en janvier.** Les 197 km sont une moyenne mesurée en mars sur six véhicules,
    pas une observation de janvier à charge pleine. Les plafonds du § 3 seront recalculés sur les données
    de novembre. Ils peuvent baisser.


    Aucune de ces trois inconnues ne justifie de retarder les décisions 1 et 2. Les deux sont réversibles
    ou nécessaires dans tous les scénarios.

    '
