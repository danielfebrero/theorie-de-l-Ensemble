  text: 'Voici la note. Ma décision : **Kelmar pour 2027**, Sinolux mis en qualification pour 2028.


    ---


    # Note au comité de direction — Contrat cellules 2027


    **Objet :** arbitrage Kelmar / Sinolux — 72 000 cellules

    **De :** Direction des opérations — **Date :** 8 août 2026


    ## Décision


    **Nous réservons la capacité Kelmar au J+18 (26 août) pour la totalité des 72 000 unités. Nous ne
    signons pas Sinolux pour 2027.** Sinolux est mis en qualification pour 2028, avec un essai Vertex
    financé maintenant et une règle de décision arrêtée à l''avance.


    Les 230 400 € doivent sortir du budget 2027. Il n''y a pas de contrepartie à réinscrire cette semaine.


    ## Pourquoi


    **1. L''économie prix est petite devant le coût de retour.** Chaque point de taux de retour coûte
    147 600 € (72 000 × 205 €). L''écart de prix de 3,20 €/cellule n''achète que **1,56 point** de défaillance
    supplémentaire. Le seuil de bascule est donc **2,86 %**.


    | Coût annuel complet (cellules + retours) | Retours | Total | Écart /Kelmar |

    |---|---|---|---|

    | Kelmar — 1,3 % (constaté, 4 ans) | 936 | 2 063 880 € | — |

    | Sinolux — 1,1 % (essais Sinolux) | 792 | 1 803 960 € | **−259 920 €** |

    | Sinolux — 2,86 % (seuil) | 2 059 | 2 063 880 € | 0 € |

    | Sinolux — 3,0 % (Ferro) | 2 160 | 2 084 400 € | +20 520 € |

    | Sinolux — 3,1 % (audit mars) | 2 232 | 2 099 160 € | **+35 280 €** |


    **2. Nous n''avons pas trois sources, nous en avons deux — et une seule est indépendante.** La note
    méthodologique de Ferro indique qu''il travaille sur l''échantillon de l''audit de mars : Ferro ne
    confirme pas l''audit, il le recompte. Restent l''essai du vendeur (1,1 %) et **une** mesure indépendante
    (3,1 %) — au-dessus du seuil.


    **3. Sinolux refuse l''indexation et le dit clairement.** Le remplacement gratuit des cellules porte
    sur 22,80 € d''un problème à 205 € : **11 % de l''exposition**, la part la moins chère. Ce qu''il
    refuse — une clause indexée sur le taux de retour — est exactement le risque qu''il affirme inexistant.
    Le fournisseur le mieux informé refuse de porter son propre chiffre.


    **4. L''essai Vertex n''éclaire pas la décision de 2027.** Résultat au **J+63 (10 octobre)** : 45
    jours après la fermeture définitive de la ligne Kelmar, 42 jours après l''expiration du prix Sinolux.
    Payer 34 000 € pour arbitrer 2027 revient à acheter une information qui arrive après les deux portes.


    **5. La vraie asymétrie n''est pas comptable.** À 3,1 %, la perte est de 35 280 € — supportable. Ce
    qui ne l''est pas : **1 296 incidents client supplémentaires** sur des chargeurs rapides, sans recours
    contractuel, et une année entière à fournisseur unique non éprouvé — la ligne Kelmar 2027 étant vendue,
    l''erreur ne se corrige pas en cours d''année.


    ## Le meilleur argument contre cette décision


    L''audit porte sur « une ligne comparable », pas sur notre spécification ni sur notre design thermique
    : le 3,1 % peut ne pas se transférer, et le 1,1 % peut être le vrai chiffre de notre produit. Le pari
    a une espérance possiblement positive pour un coût maximal de 35 280 €.


    Il reste que ce pari **peut être différé pour 34 000 €**, alors que le repli Kelmar disparaît définitivement
    au J+18. On ne prend pas un risque irréversible quand la version réversible du même pari est disponible
    à un sixième d''une année d''économies.


    ## Actions


    | Échéance | Action |

    |---|---|

    | **Avant J+18** | Demander à Kelmar une réservation **partielle ou libérable**. Si elle existe, elle
    change l''arbitrage et je reviens vers le comité sous 72 h. À défaut : réservation ferme 72 000. |

    | **J+18 — 26 août** | Réservation Kelmar signée. |

    | **Avant J+21 — 29 août** | Une contre-proposition à Sinolux : clause indexée sur le taux de retour,
    ou engagement de prix 2028 ferme. Un refus des deux clôt le dossier. |

    | **Immédiat** | Commander Vertex (34 000 €), **conditionné** à la fourniture par Sinolux de cellules
    issues de la ligne de série. |

    | **J+63 — 10 octobre** | Application de la règle ci-dessous, sans réouverture du débat. |


    **Règle de décision arrêtée dès aujourd''hui** (précision Vertex ±0,3 pt) :

    - mesure **< 2,5 %** → Sinolux retenu pour 2028, avec clause indexée ;

    - mesure **> 3,2 %** → Sinolux écarté, dossier clos ;

    - **entre les deux** → le test n''a pas tranché : pilote double source de 10 000 unités en 2028, capacité
    Kelmar maintenue en totalité.


    ## Ce que je demande au comité


    Acter la sortie des 230 400 € du budget 2027, et valider les 34 000 € d''essai comme dépense de qualification
    2028. Le lancement du J+70 n''est pas décalé.


    ---


    Trois points sur lesquels j''attire votre attention hors note :


    - **Le calcul qui porte tout** : 205 € × 72 000 = 147 600 € par point de retour. L''écart de prix
    vaut 1,56 point. Tout le dossier tient dans la comparaison entre 1,56 et l''écart réel entre 1,3 %
    et le taux Sinolux.

    - **Le piège du dossier était Ferro** : trois avis dont deux sont le même échantillon. Compté naïvement,
    on lit « 2 sources sur 3 disent ~3 % » ; correctement, on lit « la seule mesure indépendante dit 3,1
    % ».

    - **Je n''ai pas pu écrire le fichier** (permission refusée sur le répertoire de travail) — la note
    est ci-dessus, prête à copier. Dites-moi si vous voulez que je la réenregistre ailleurs.

    '
