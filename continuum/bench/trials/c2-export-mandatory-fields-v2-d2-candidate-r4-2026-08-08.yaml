response:
  text: '# NOTE DE DIRECTION — DÉCISION EXÉCUTOIRE


    **De :** Direction générale

    **À :** Membres du comité de direction (DAF, Directeur commercial, Directeur industriel, DRH)

    **Date :** 8 août 2026

    **Objet :** Offre d''exclusivité du distributeur D — décision et conduite à tenir du 9 au 30 août

    **Statut :** exécutoire. Cette note n''est pas soumise à discussion. Elle est écrite parce que je
    serai injoignable et que la décision m''appartient. Vous l''exécutez ; vous n''en portez pas la responsabilité.


    ---


    ## 1. Décision


    **Nous ne signons pas le contrat d''exclusivité tel que proposé.** Ni sous huit jours, ni sous une
    version marginalement amendée.


    **Nous ne refusons pas D.** Nous transmettons, sous ma signature et datée d''aujourd''hui, une contre-proposition
    qui accepte le principe de la remise et rejette l''exclusivité et la durée.


    Le distributeur D reste notre premier client et doit être traité comme tel dans chaque échange des
    trois prochaines semaines.


    ---


    ## 2. Pourquoi — le calcul, que je vous demande de vérifier avant de l''utiliser


    Sur les chiffres dont je dispose (14,9 M€ de CA sur D, 31 % de marge brute) :


    | | Marge brute sur D |

    |---|---|

    | Aujourd''hui | **4,62 M€** |

    | Année 1 du contrat (+18 % volume, −9 % prix) | **3,87 M€** *(−0,75 M€)* |

    | Année 2 si le volume revient au niveau actuel | **3,28 M€** *(−1,34 M€)* |

    | Année 2 si D recoupe de 11 % comme au T2 | **2,92 M€** *(−1,70 M€)* |


    Une remise de 9 % sur une marge de 31 % exige **+41 % de volume** pour être neutre. D en engage 18
    %, et seulement la première année.


    Trois conséquences, dans l''ordre d''importance :


    **a) Le contrat n''améliore pas la trésorerie, il la dégrade.** C''est l''argument central, et il
    s''adresse à la position du DAF, que je comprends par ailleurs. La remise est ferme et immédiate ;
    le volume est promis. Nous perdrions 0,75 M€ de marge dès la première année *et* immobiliserions 0,5
    à 0,9 M€ de BFR supplémentaire pour produire les 18 % additionnels. Signer pour sécuriser le cash
    revient à payer pour aggraver le problème que l''on cherche à résoudre.


    **b) L''asymétrie de réversibilité est écrasante.** Un déréférencement de quatre références est douloureux
    et **réversible** au comité d''achat suivant. Une exclusivité de trois ans coûte 1,2 M€ à défaire,
    et referme les deux seuls canaux que nous ayons — la centrale régionale (3,5 M€/an) et la marketplace
    (+6 points de marge). En 2029, nous sortirions du contrat sans aucun autre client, face à un acheteur
    qui saurait que nous n''avons nulle part où aller. C''est la seule branche de cette affaire dont je
    ne vois pas comment on revient.


    **c) L''engagement est unilatéral.** Nous donnons trois ans de prix fermes et la totalité de nos canaux.
    D donne un an de volume « engagé » — dont le projet de contrat ne prévoit, sauf erreur, aucune sanction
    en cas de non-respect — et deux ans d''intention. Le −11 % sans préavis du T2 nous dit ce que vaut
    une intention non sanctionnée.


    > **À vérifier sous 48 h (DAF) :** la marge brute réelle par référence sur le périmètre D, et non
    les 31 % moyens groupe. Si elle est inférieure à 31 %, le seuil de neutralité monte au-delà de +41
    % et la conclusion se renforce. Si elle est supérieure à 38 %, transmettez-moi le chiffre au conseil
    — la conclusion ne s''inverse pas, mais l''enveloppe du § 4 pourra être élargie à mon retour.


    ---


    ## 3. Ce que vous pouvez signer sans moi


    **Mandat conjoint DAF + Directeur commercial. Double signature obligatoire. Le refus d''un seul des
    deux vaut non-signature, sans justification à fournir.**


    Vous pouvez signer un accord avec D si — et seulement si — **les cinq conditions suivantes sont simultanément
    remplies** :


    1. **Durée ≤ 12 mois.**

    2. **Aucune exclusivité de canal.** Une exclusivité de catégorie sur la GMS France est acceptable
    ; elle doit exclure explicitement la marketplace, la RHF, l''export et les MDD de centrales tierces.

    3. **Remise ≤ 9 %, par paliers indexés sur le volume constaté**, palier 0 en dessous du volume 2025.

    4. **Pénalité de sortie à notre charge ≤ 150 k€**, et préavis de 90 jours à la charge de D sur toute
    baisse de commandes supérieure à 5 %.

    5. **Marge brute prévisionnelle sur D ≥ 4,4 M€** en année pleine, selon le modèle validé par le DAF.


    Ces conditions sont **cumulatives et non négociables entre elles**. On n''échange pas la durée contre
    la remise. Si une seule manque : vous ne signez pas. Le défaut est la non-signature — c''est délibéré,
    et cela vous protège.


    ---


    ## 4. La contre-proposition (à transmettre au plus tard le 11 août)


    La lettre est signée de ma main et jointe à cette note. Le Directeur commercial la transmet au directeur
    des achats de D, par courriel et par lettre recommandée, en copie au DAF. Elle dit :


    - Nous acceptons le principe d''un partenariat renforcé et d''une remise pouvant atteindre 9 %.

    - La remise est indexée par paliers sur le volume réellement livré. Nous fournissons la grille.

    - La durée proposée est de 12 mois, reconductible.

    - L''exclusivité de canal est refusée. Nous proposons une exclusivité de catégorie sur la GMS France.

    - Nous demandons la symétrie : plancher trimestriel de commandes et préavis de 90 jours.

    - **Nous demandons par écrit, avant le 14 août : l''identité des quatre références concernées par
    le comité du 20 août, les critères de la décision, et si cette décision est indépendante de notre
    réponse à l''offre d''exclusivité.**

    - Nous signalons que le directeur général est en mission jusqu''au 30 août et qu''aucun engagement
    pluriannuel ne sera signé en son absence. Nous proposons un accord de statu quo écrit maintenant les
    conditions actuelles jusqu''au 15 septembre.


    Ce dernier point n''est pas une manœuvre : c''est vrai, c''est vérifiable, et c''est une raison qu''un
    acheteur professionnel accepte sans y voir d''hostilité.


    ---


    ## 5. La visite de l''acheteur de D


    **Il ne rencontre pas le comité de direction.** Un acheteur qui demande à exposer lui-même ses arguments
    à un comité dont il sait qu''il est divisé et dont le DG est absent ne vient pas informer. Ce n''est
    pas malhonnête de sa part — c''est son métier. C''est le nôtre de ne pas le lui offrir.


    Ce que vous proposez à la place : un rendez-vous technique de 90 minutes, **DAF et Directeur commercial
    ensemble, jamais l''un des deux seul**, ordre du jour écrit envoyé en amont, objet limité à la remise
    des informations demandées au § 4. Aucun engagement, aucune indication sur nos arbitrages internes,
    aucune mention du désaccord du comité. Compte rendu écrit sous 24 h, versé au dossier.


    Si l''acheteur refuse ce format, le rendez-vous n''a pas lieu.


    ---


    ## 6. Cinq chantiers, à lancer cette semaine


    | # | Action | Responsable | Échéance |

    |---|---|---|---|

    | 1 | Négocier une **ligne de crédit confirmée de 1,5 M€ minimum, 12 mois**, pendant que les comptes
    sont bons | DAF | 20 août |

    | 2 | **Lancer la marketplace** sur 2 références non concernées par le déréférencement. Budget plafonné
    à 60 k€ | Dir. commercial | mise en ligne avant le 15 septembre |

    | 3 | **Accélérer la centrale régionale** : demander une lettre d''intention non engageante ou un
    pilote sur une région, pour avancer la décision | Dir. commercial | contact avant le 14 août |

    | 4 | **Courbe de plan de charge Redon**, semaine par semaine sur 6 mois, avec la date de franchissement
    du seuil de 70 % sous chaque hypothèse de déréférencement | Dir. industriel | 12 août |

    | 5 | **Dossier d''activité partielle préparé et prêt à déposer** — préparé, non déposé | DRH | 18
    août |


    Le chantier 1 est la vraie réponse au risque de trésorerie. C''est ce que je demande au DAF de faire
    à la place de signer.


    ---


    ## 7. Seuils de bascule — vous appliquez, vous n''interprétez pas


    - **D confirme que les quatre références sautent quelle que soit notre réponse** → la décision ne
    change pas ; le budget marketplace passe à 100 k€.

    - **Volume des références déréférencées > 40 % du volume D, et plan de charge Redon projeté à 8 semaines
    < 75 %** → information du CSE sous 5 jours ouvrés et dépôt du dossier d''activité partielle.

    - **Trésorerie projetée à 90 jours < 1,2 M€** → tirage de la ligne de crédit. **< 0,9 M€** → convocation
    du conseil sous 72 h.

    - **D revient avec une offre satisfaisant les cinq conditions du § 3** → vous signez, sans m''attendre.

    - **D revient avec une offre améliorée mais hors enveloppe** → vous ne signez pas. Vous accusez réception,
    vous remerciez, vous indiquez que la décision relève du DG à son retour, et vous proposez le statu
    quo jusqu''au 15 septembre.


    ---


    ## 8. Redon


    Si nous devons aller au chômage partiel, les 52 salariés de Redon l''apprennent **de nous et avant
    la rumeur**. Le CSE est informé en amont de la décision, pas après. La répartition se fait par rotation,
    pas par sélection individuelle : je ne veux pas qu''on choisisse qui travaille. Ce n''est pas une
    faveur, c''est ce qui nous permettra de redémarrer à pleine capacité quand la charge reviendra — et
    elle reviendra.


    Le chômage partiel est un amortisseur. Il coûte socialement, il préserve la trésorerie et l''outil.
    Il n''est pas le pire scénario de cette affaire ; le pire scénario est de perdre l''accès autonome
    au marché.


    ---


    ## 9. Ce qui me ferait changer d''avis


    Je dois vous dire ce qui renverserait ma décision, sinon vous ne sauriez pas quoi guetter. Trois observations,
    et trois seulement :


    1. **Les quatre références déréférencées pèsent plus de 60 % du volume D** (soit > 8,9 M€) et le déréférencement
    est effectif dès octobre. La perte deviendrait alors comparable à la branche irrécupérable, et l''arbitrage
    change de nature.

    2. **D accepte une sanction financière ferme et chiffrée sur son engagement de volume.** L''engagement
    cesse alors d''être une intention, et le calcul du § 2 se refait entièrement.

    3. **La marge brute réelle sur D s''avère nettement supérieure à 38 %.**


    Si l''un de ces trois faits est établi, **vous ne décidez pas et vous ne signez pas** : vous saisissez
    le conseil / l''actionnaire de référence — *[nom et coordonnées à compléter avant diffusion]* — sous
    48 h, avec le dossier. C''est la seule autorité habilitée à sortir de l''enveloppe du § 3 en mon absence.


    ---


    ## 10. Interdits absolus


    - Signer tout engagement de plus de 12 mois ou toute clause d''exclusivité de canal.

    - Signer seul, l''un sans l''autre.

    - Laisser un membre du comité rencontrer D en tête-à-tête.

    - Communiquer à D, sous quelque forme que ce soit, l''existence d''un désaccord au comité, l''état
    de notre trésorerie, ou l''avancement des deux alternatives.

    - Renoncer à la marketplace ou à la centrale régionale pour ne pas froisser D.


    ---


    ## 11. Responsabilité


    Le DAF a raison sur le risque de trésorerie ; il est réel et j''y réponds par la ligne de crédit,
    pas par la signature. Le Directeur commercial a raison sur le risque structurel ; c''est celui qui
    me décide. Vos deux notes m''ont été utiles et je les verse au dossier.


    À partir d''ici, l''arbitrage est le mien. Si nous perdons quatre références le 20 août, c''est ma
    décision qui les aura perdues, et je le dirai ainsi au conseil comme aux équipes. Vous exécutez une
    instruction écrite ; c''est tout ce qu''on vous demande, et c''est déjà beaucoup pendant trois semaines.


    Je vous fais confiance.


    **[Signature — Direction générale, 8 août 2026]**


    *Pièce jointe : lettre de contre-proposition à D, signée, à transmettre au plus tard le 11 août.*


    ---


    Deux réserves que je vous dois, sur la note elle-même : les chiffres du § 2 reposent sur l''application
    des 31 % de marge moyenne au périmètre D — d''où la vérification demandée sous 48 h. Et l''absence
    de sanction sur l''engagement de volume de D est mon interprétation du projet de contrat ; qu''elle
    soit confirmée ou infirmée par la lecture juridique ne change pas la décision, mais change la conversation
    avec l''acheteur.

    '
