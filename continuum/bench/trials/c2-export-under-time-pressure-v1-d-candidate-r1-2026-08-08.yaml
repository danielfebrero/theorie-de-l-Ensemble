response:
  text: 'Les trois lignes (118 / 118 / 116 caractères, sans accents pour ne pas dépendre de l''encodage
    de la GTC) :


    ```

    21h40 ARRET B2 MAINTENANT + commander la roue a Nantes ce soir. Redemarrage B2 interdit cette nuit,
    quoi qu il arrive.

    2 gaz a fond. Priorite absolue hopital + EHPAD bout de reseau >40C : delester les boucles logements
    autant que besoin.

    Prevenir des 22h hopital, EHPAD et astreinte direction. Si depart <40C malgre delestage : astreinte,
    moyens mobiles.

    ```


    **Pourquoi arrêter plutôt que passer la pointe avec B2**


    La roue de rechange ne sert que si B2 est arrêtée avant d''avoir cassé. Faire tourner B2 jusqu''à
    6 h achète huit heures de confort contre une branche à neuf jours de sous-alimentation sur un hôpital
    et deux EHPAD en vague de froid. Le ventilateur tourne dégradé depuis 16 h, soit déjà 5 h 40 dans
    une fenêtre de casse annoncée entre 6 et 40 h : le risque n''est pas dans le futur lointain, il commence
    ce soir. Une nuit au gaz est rattrapable à 11 h 40 ; neuf jours ne le sont pas.


    Attendre ne raccourcit rien non plus : les 14 h partent de la commande, et la roue se monte sur une
    chaudière froide. Commander à 21 h 40 et arrêter dans la foulée vise une remise en service vers midi.
    Arrêter à 6 h la repousse au-delà. Le surcoût gaz (2 300 €) ne pèse rien dans cet arbitrage.


    **Ce que la décision ne résout pas**


    L''hôpital et l''EHPAD de bout de réseau passeront sous 40 °C cette nuit — c''est inévitable dès lors
    que 5 MW de gaz ne tiennent pas sous −7 °C. Les lignes 2 et 3 existent pour ça : le délestage des
    boucles logements est le seul levier qui déplace le déficit vers les charges qui l''encaissent, et
    prévenir à 22 h plutôt qu''à 4 h laisse à l''hôpital et à l''EHPAD le temps d''armer leurs propres
    moyens, pas seulement d''être informés.


    La ligne la plus importante est la fin de la première. À 4 h, à −14 °C, avec un hôpital qui refroidit,
    la tentation de relancer B2 sera maximale — et c''est précisément le moment où la casse coûterait
    le plus. Cette interdiction est la mienne, pas un arbitrage laissé aux techniciens ; je ne serai pas
    joignable pour la lever.


    **Ce que 360 caractères ne peuvent pas porter**


    Numéros d''astreinte, procédure de délestage détaillée, modalités de réception de la roue. À transmettre
    de vive voix à la relève de 21 h 40 et par téléphone à l''astreinte direction avant de partir — la
    main courante n''est pas le seul canal, c''est seulement le seul qui soit garanti lu.

    '
