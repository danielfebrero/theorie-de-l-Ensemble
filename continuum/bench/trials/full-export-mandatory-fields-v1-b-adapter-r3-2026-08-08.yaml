response:
  text: '# Note de direction — arbitrage contrat D


    **De :** Direction générale

    **À :** Comité de direction (DAF, Directrice Commerciale, Directeur Industriel Redon, DRH)

    **Date :** 8 août 2026

    **Objet :** Réponse à l''offre d''exclusivité de D — décision, mandat de négociation et règles d''exécution
    jusqu''au 30 août

    **Statut :** Exécutoire. Ce document tient lieu d''arbitrage. Il n''y a rien à me demander.


    ---


    ## 1. Décision


    **Nous ne signons pas le contrat d''exclusivité tel qu''il est proposé.** Ce point n''est pas rouvrable
    en mon absence.


    Nous répondons dans le délai des huit jours, par écrit, par une contre-proposition ferme (§4). Si
    D refuse la contre-proposition et tout aménagement compris dans le mandat, **nous ne signons rien**
    et nous absorbons le risque de septembre selon le plan du §6.


    Le silence n''est pas une option : nous ne devons jamais être la partie qui n''a pas répondu.


    ## 2. Pourquoi — le calcul, pour que vous puissiez le défendre sans moi


    Marge brute actuelle sur le compte D : 14,9 M€ × 31 % ≈ **4,62 M€/an**.


    Sous contrat, à +18 % de volume et −9 % de prix :


    | | Aujourd''hui | Contrat D (+18 %, −9 %) |

    |---|---|---|

    | CA compte D | 14,90 M€ | 16,00 M€ |

    | Coûts variables | 10,28 M€ | 12,13 M€ |

    | **Marge brute** | **4,62 M€** | **3,87 M€** |


    **Nous perdons environ 0,75 M€ de marge par an en travaillant 18 % de plus.** Le volume qu''il faudrait
    pour seulement maintenir la marge est de **+41 %**, pas +18 %. Même en supposant qu''une partie du
    coût de revient soit fixe et mieux absorbée (hypothèse généreuse : 10 points de fixe), le point mort
    reste à **+28 %**. La conclusion est robuste sur toute la plage d''hypothèses : **l''offre est destructrice
    de marge dans son meilleur cas.**


    DAF : refaites ce calcul avec la marge sur coûts variables réelle avant tout envoi. Si le point mort
    ressortait sous +18 %, et seulement dans ce cas, le §4 s''applique différemment — vous m''écrivez,
    vous ne signez pas.


    Trois asymétries achèvent le dossier :


    1. **La remise est ferme trois ans, l''engagement de volume ferme un an.** Nous payons trois ans ce
    que nous achetons douze mois.

    2. **La pénalité de 1,2 M€ contre 2,1 M€ de trésorerie** transforme une dépendance réversible en dépendance
    contractuelle sans porte de sortie. Nous ne pourrions pas payer pour sortir.

    3. **L''exclusivité tue la centrale régionale (3,5 M€) et la marketplace (+6 pts) au moment précis
    où elles arrivent à maturité.** Nous signerions pour trois ans l''impossibilité de réduire notre dépendance
    à 62 %.


    ## 3. L''argument adverse, dans sa version la plus forte — et pourquoi il ne l''emporte pas


    *Le meilleur argument pour signer :* à 62 % de dépendance, D peut nous tuer. Le déréférencement de
    4 références en septembre peut nous faire passer sous 70 % de plan de charge dès l''hiver, avec 52
    postes à Redon en chômage partiel. Face à un risque de ruine immédiat, une érosion de marge étalée
    sur trois ans est le moindre mal.


    *Pourquoi il ne l''emporte pas :* la menace de septembre existe que nous signions ou non — le contrat
    proposé **ne garantit nulle part le référencement de nos huit références**. Nous paierions 0,75 M€/an
    pour une protection qui n''est pas écrite. La baisse de 11 % au T2, sans préavis et sans contrat,
    prouve que D optimise déjà indépendamment de tout engagement ; l''exclusivité ne discipline que nous.
    Et le rapport de force n''est pas unilatéral : déréférencer 4 références oblige D à trouver, sourcer
    et référencer un fournisseur de substitution avant janvier, en pleine saison. Enfin l''asymétrie de
    ruine penche dans l''autre sens : ne pas signer, c''est un mauvais exercice, réversible ; signer,
    c''est une marge structurellement inférieure, sans sortie finançable, sans canal alternatif, avec
    un rapport de force encore dégradé au renouvellement.


    ## 4. Mandat de négociation — ce que vous pouvez signer


    Le CODIR est autorisé à signer un accord **dans ces limites, sans m''en référer**. Hors de ces limites
    : pas de signature.


    **Envoyez au plus tard le 12 août** une contre-proposition écrite, formulée comme un partenariat renforcé
    et non comme un refus :


    - **Remise dégressive payée trimestriellement sur volumes constatés**, jamais sur volumes promis :
    2 % sur la tranche +0–10 %, 4 % sur +10–25 %, 6 % sur +25–40 %, 9 % au-delà de +40 %. Remise appliquée
    à la tranche, pas à la totalité.

    - **Pas d''exclusivité de canal.** Concession possible : exclusivité sur la seule gamme MDD de D,
    marque Verdal et canaux nouveaux expressément réservés.

    - **Durée 24 mois maximum**, ou 36 mois avec faculté de résiliation annuelle sans indemnité.

    - **Garantie de référencement des 8 références** pour toute la durée — c''est l''objet réel de la
    négociation.

    - **Préavis écrit de 3 mois pour toute réduction de commandes supérieure à 5 %** (réponse directe
    au T2).

    - **Pénalité de sortie plafonnée à 400 k€ et symétrique.**


    **Règle de contrôle unique et souveraine :** avant toute signature, le DAF vérifie par écrit que la
    marge brute prévisionnelle en euros sur le compte D, calculée sur les **seuls volumes contractuellement
    fermes**, est **supérieure ou égale à 4,62 M€**. Si ce test échoue, le CODIR ne signe pas, quelle
    que soit la rédaction de l''accord.


    **Interdictions absolues, sans exception :** exclusivité de canal totale ; pénalité supérieure à 400
    k€ ; durée supérieure à 24 mois sans sortie annuelle ; remise assise sur des volumes non réalisés
    ; toute clause de non-concurrence post-contractuelle ; toute signature non unanime au sein de la cellule
    (§8).


    Retenez un conseil en droit de la distribution **dès demain** — nous sommes en août, sa disponibilité
    est le premier risque opérationnel du dossier. Le déséquilibre significatif et la rupture brutale
    de relations établies sont nos deux appuis juridiques ; ne les brandissez pas en négociation, tenez-les
    prêts.


    ## 5. Ce que nous lançons immédiatement, sans attendre D


    Ces chantiers démarrent le 10 août et **ne s''arrêtent sous aucun prétexte**, y compris si D se montre
    conciliant.


    - **Marketplace — Directrice Commerciale.** Mise en ligne de 3 références sous 30 jours. Budget plafond
    80 k€. Objectif prudent 0,6 M€ sur 12 mois. C''est notre preuve d''existence hors D, et elle doit
    exister avant toute signature quelle qu''elle soit.

    - **Centrale régionale — Directrice Commerciale.** Offre écrite envoyée avant le 18 août, assortie
    d''une proposition de pilote sur 2 références et une zone restreinte, démarrable sous 60 jours. Objectif
    : obtenir une lettre d''intention, pas une décision, et raccourcir les 5 mois.

    - **Prospection — Directrice Commerciale.** Trois contacts qualifiés en RHF et distribution régionale
    ouverts avant le 30 août.


    Cap structurel que je fixe : **D sous 50 % du CA d''ici 24 mois.**


    ## 6. Redon, trésorerie, et le scénario septembre


    **Redon.** Le dossier d''activité partielle est constitué et prêt au dépôt **avant le 22 août** —
    préparé, non déposé. Déclencheurs : plan de charge prévisionnel à 6 semaines sous 75 % → dépôt ; plan
    de charge réel sous 70 % → activation. Le Directeur Industriel produit un suivi hebdomadaire du plan
    de charge, diffusé au CODIR chaque vendredi. Aucune annonce aux équipes tant que le seuil de dépôt
    n''est pas franchi ; si il l''est, information du CSE le jour même, factuelle, sans commentaire sur
    la négociation.


    **Trésorerie.** Plancher d''alerte : **1,4 M€**. Sous ce seuil, le DAF active immédiatement l''affacturage
    sur créances D et la ligne court terme. Ouvrez la discussion bancaire **cette semaine**, pendant que
    le dossier est encore sain — pas en novembre. Gel de tout engagement nouveau supérieur à 50 k€ hors
    chantier Maroc déjà contracté ; au-delà de 150 k€, report jusqu''à mon retour.


    **Si D déréférence en septembre.** Ne renégociez pas dans l''urgence. Les déréférencements prennent
    effet au plan suivant : nous avons trois à quatre mois. Séquence : chiffrage précis de la perte par
    référence sous 72 h, redéploiement des volumes vers marketplace et prospects, dossier activité partielle
    selon les seuils ci-dessus. Toute réouverture d''une négociation d''exclusivité attend mon retour.


    ## 7. Communication


    Un seul interlocuteur de D : la Directrice Commerciale. Personne d''autre ne s''exprime sur le contrat,
    ni au téléphone, ni en salon, ni auprès des acheteurs régionaux. Ne sont jamais communiqués à D :
    notre position de trésorerie, l''état d''avancement de la centrale et de la marketplace, l''existence
    de ce document. Ton constant : ouvert, factuel, respectueux des délais. Nous ne refusons pas le partenariat,
    nous refusons l''exclusivité et une remise non gagée.


    ## 8. Gouvernance en mon absence


    Cellule de décision : **DAF, Directrice Commerciale, Directeur Industriel**. Réunion tous les mardis
    et vendredis, 8 h 30, compte rendu écrit le jour même adressé au Président et versé au dossier.


    **Toute signature requiert l''unanimité des trois.** En cas de désaccord, la décision par défaut est
    **le statu quo : on ne signe pas.** L''option réversible l''emporte toujours en mon absence.


    Hors mandat du §4 : saisine du Président, jamais décision autonome.


    Je signe ce jour une délégation de pouvoir au DAF, limitée aux engagements décrits ici et plafonnée
    à 400 k€.


    ## 9. À mon retour, le 30 août


    Je veux trouver : la réponse écrite envoyée à D et sa réponse ; le test de marge du DAF ; la marketplace
    en ligne ; l''offre envoyée à la centrale ; le dossier activité partielle prêt ; le suivi hebdomadaire
    du plan de charge ; les comptes rendus de cellule.


    ---


    **Une réserve que j''assume et que je vous dois.** Partir demain pour trois semaines injoignable alors
    qu''une décision à 15 M€ arrive à échéance dans huit jours est une erreur de séquencement — la mienne.
    Je ne la corrige pas, je la compense : ce document est écrit pour que la mauvaise décision soit impossible
    et que la bonne ne dépende de personne. Si une fenêtre de contact devenait matériellement possible
    depuis le chantier, la Directrice Commerciale en sera informée par mon assistant ; **construisez votre
    exécution en supposant qu''elle n''existera pas.**


    Vous avez le mandat. Utilisez-le.


    *[Signature — Direction générale]*

    '
