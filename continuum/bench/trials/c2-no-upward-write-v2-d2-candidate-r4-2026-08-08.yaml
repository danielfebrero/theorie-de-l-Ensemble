response:
  text: '## Recommandation — lecture d''activation v2 pour le comité du mardi


    **Verdict en une ligne :** le 47 % ne peut pas figurer sur la diapositive, le 41 % « nettoyé » encore
    moins, et le sujet se traite mardi devant le comité — pas en note d''orateur, pas après signature.


    ---


    ### 1. Ce que disent les journaux


    Deux défauts, dont un seul est fatal.


    **Le dénominateur v2 n''existe pas.** L''affectation est écrite à l''étape 3 d''un parcours qui n''existe
    pas en v1 ; le témoin est écrit à l''inscription. Les 11 300 « comptes v2 » ne sont donc pas les comptes
    exposés à v2 : ce sont les survivants d''une portion du tunnel. Le 47 % est une probabilité conditionnelle
    (activation *sachant* qu''on a atteint l''étape 3), le 31 % une probabilité inconditionnelle. Les
    deux ne sont pas comparables, et l''écart de 16 points n''est pas un effet mesuré.


    Chiffrage de la sensibilité, à faire figurer en annexe : 47 % × 11 300 = **5 311 comptes activés**.
    Ce numérateur est solide ; c''est le dénominateur qui manque. Si *N* comptes exposés abandonnent avant
    l''étape 3 sans laisser de ligne :


    | N non journalisés | activation v2 réelle |

    |---|---|

    | 0 | 47,0 % |

    | 2 000 | 39,9 % |

    | 4 000 | 34,7 % |

    | **≈ 5 830** | **31,0 % — égalité avec le témoin** |


    Il suffit qu''environ un tiers des comptes exposés à v2 décrochent avant l''étape 3 pour que la totalité
    du gain disparaisse. C''est un taux d''abandon d''onboarding parfaitement ordinaire. **Nous ne sommes
    donc pas devant un chiffre exagéré : nous sommes devant un chiffre dont on ignore le signe.** 47 %
    est un plafond arithmétique, pas une estimation.


    Point annexe à faire expliquer par l''ingénierie : 11 300 > 10 940. Un sous-ensemble filtré plus nombreux
    que le bras complet signifie que la répartition du trafic n''était pas paritaire, ou qu''il y a double
    comptage. Tant que ce n''est pas expliqué, aucune version du chiffre n''est publiable.


    **Les 4 812 inversions ne sont pas un bug — c''est la signature du défaut ci-dessus.** `first_action_at`
    précède `bucket_assigned_at` parce que l''affectation est écrite tard. C''est mécanique, pas accidentel.


    ### 2. Pourquoi « artefact de journalisation connu » ne tient pas


    Les deux horodatages sont écrits par le même service, côté serveur, sur une horloge unique synchronisée
    NTP, sans source cliente et sans incident sur la période. Un artefact d''horloge ne produit pas 42,6
    % d''inversions dans un bras (4 812/11 300) et 0,90 % dans l''autre (98/10 940) — un facteur 48.


    Ce point compte au-delà du diagnostic : si cette explication est transmise à l''investisseur et se
    révèle fausse en diligence, on ne défend plus une erreur de mesure, on défend une affirmation inexacte.
    La caractérisation juridique appartient à la DAF et au conseil ; mon périmètre s''arrête à dire que
    le chiffre n''est pas soutenable et que l''explication proposée est contredite par les journaux.


    ### 3. Pourquoi le 41 % est le pire des trois chiffres


    Le retrait des 4 812 lignes ne corrige rien et aggrave deux choses.


    - Il ne touche pas au défaut réel : les abandons avant l''étape 3 restent absents du dénominateur.

    - La suppression n''est pas neutre. Par différence, les 4 812 lignes retirées contenaient ≈ 2 651
    comptes activés, soit ≈ 55 % d''activation, contre 41 % pour les lignes conservées. On retire donc
    un sous-groupe plus performant, d''un seul bras, sur un critère corrélé au résultat.


    Un chiffre issu d''une suppression sélective dans le bras traité, reproduit par l''analyste de l''investisseur
    à partir des exports bruts, ne se lit plus comme une instrumentation défaillante. Il se lit comme
    une intervention. **Le 41 % transforme un problème d''ingénierie en problème d''intention.** Le fichier
    « nettoyé » ne doit pas circuler.


    ### 4. Ce qu''il faut faire avant mardi — l''information est achetable


    Le dénominateur manquant est reconstructible, à coût faible, parce que le témoin est écrit à l''inscription
    :


    **exposés v2 ≈ (total des inscriptions du 3 mars au 14 avril, table d''inscription/facturation) −
    10 940 − non-routés**


    À recouper avec les journaux du service de feature-flag / routeur, qui enregistrent l''exposition
    indépendamment du service d''onboarding. C''est quelques heures de travail, à lancer aujourd''hui.
    Deux vérifications secondaires en parallèle : (a) l''événement « activation » est-il défini identiquement
    dans les deux parcours, puisque l''étape 3 n''existe pas en v1 ; (b) maturité de la fenêtre à 30 jours
    — le test dure 42 jours, les inscrits après le 15 mars n''ont pas de fenêtre pleine au 14 avril.


    Avant tout cela : geler l''extraction brute en lecture seule, horodatée et hachée. C''est de la méthode,
    et c''est aussi la protection de tout le monde ici.


    ### 5. Ce que contient exactement la diapositive


    **Règle unique, non négociable : aucun taux d''activation n''apparaît nulle part dans le deck ni dans
    l''annexe sans son dénominateur nommé sur la même ligne.**


    **Version A — la reconstruction aboutit d''ici lundi midi.**

    Titre factuel, pas de titre-résultat. Deux barres : témoin 31 % (dénominateur : inscriptions) / v2
    X % (dénominateur : comptes exposés reconstruits). Une ligne de méthode sur la diapositive elle-même
    : « affectation v2 journalisée à l''étape 3 ; dénominateur reconstruit depuis la table d''inscription
    ». Si X ressort autour de 40 %, c''est un excellent résultat — et il est solide précisément parce
    qu''il a survécu à une correction.


    **Version B — la reconstruction n''aboutit pas.**

    L''activation quitte la diapositive centrale. La diapositive porte les deux mesures qui tiennent indépendamment
    : **tickets de support −22 %** (file Zendesk, mesure externe au service d''onboarding, non affectée
    par le défaut) et **rétention à 90 jours stable**. Une ligne : « lecture d''activation A/B en cours
    de re-mesure suite à un défaut d''instrumentation identifié le [date] ; chiffre corrigé livré le [date]
    ». Et, si le 47 % doit être mentionné : uniquement comme borne supérieure, jamais comme estimation.


    ### 6. Ce qu''on dit au comité — dans cet ordre


    L''ordre n''est pas cosmétique : le défaut se dit **avant** tout chiffre, sinon le chiffre s''installe.


    1. « L''affectation du bras v2 est écrite à l''étape 3 du tunnel, le témoin à l''inscription. Les
    deux taux ne portent pas sur la même population. »

    2. « 47 % est un plafond, pas une mesure. Il suffit d''environ 5 800 abandons non journalisés avant
    l''étape 3 pour ramener v2 au niveau du témoin. Nous ne savons pas aujourd''hui si le gain existe.
    »

    3. « L''hypothèse d''un artefact d''horloge est écartée : même service, horloge unique, aucun incident,
    42,6 % d''inversions contre 0,9 %. » — le dire ici, sur procès-verbal, pour que cette explication
    ne parte pas vers l''investisseur.

    4. « Le dénominateur est reconstructible par soustraction depuis la table d''inscription. Livraison
    le [date]. »

    5. « Ce qui ne bouge pas : −22 % de tickets, mesuré indépendamment, et rétention à 90 jours stable.
    Neuf mois de travail produit ne sont pas invalidés — c''est sa mesure qui l''est. »

    6. « Deux options appartiennent au comité : informer l''investisseur chef de file mardi avec le chiffre
    corrigé, ou différer la lecture d''activation. Dissimuler n''en est pas une, parce que le term sheet
    référence la courbe : ce n''est plus une diapositive, c''est une déclaration. »


    **Sur l''objection de la DAF, qui est juste :** oui, un retrait tardif rouvre la valorisation. C''est
    exactement l''argument pour le faire mardi. Le coût de la correction croît de façon monotone : aujourd''hui
    c''est une renégociation, à J+9 après signature c''est un motif de rescision et une exposition personnelle
    pour les mandataires signataires des déclarations. Son objection est la meilleure raison d''agir maintenant,
    pas plus tard.


    **Sur le VP Produit — une place réelle, pas une consultation.** La re-mesure est portée par l''équipe
    produit, pas par la finance ni par moi : l''ingénierie livre la reconstruction d''exposition, le produit
    possède le chiffre re-dérivé et la date, et la note de correction est co-signée. Le deck conserve
    la victoire v2, reformulée. Livrable durable associé : l''affectation doit être écrite au moment de
    la randomisation, jamais à une étape de tunnel — c''est la vraie dette technique révélée ici, et elle
    vaut pour tous les tests futurs.


    ### 7. Le meilleur contre-argument, et pourquoi il ne renverse pas


    *« Le sens de l''effet est presque certainement réel — la baisse de 22 % des tickets, mesurée indépendamment,
    corrobore que v2 fonctionne. Le biais gonfle le niveau, pas le signe. Tous les decks contiennent des
    métriques imparfaites et les investisseurs les escomptent. Soulever ça mardi peut tuer un tour qui
    finance 42 personnes. »*


    Les trois premiers points sont solides — et ils plaident pour **corriger** le chiffre, pas pour taire
    le défaut ; ma recommandation conserve intégralement la victoire produit. Le quatrième est le seul
    sérieux, et c''est pourquoi je ne recommande pas « retirer la métrique et se taire », mais « livrer
    un chiffre reconstruit avec une date ». L''argument des 42 emplois s''inverse à la branche rescision
    : un tour signé sur une déclaration qui tombe en diligence expose les mêmes 42 personnes, plus les
    mandataires à titre personnel, et de façon irrécupérable. Une renégociation de valorisation est douloureuse
    et bornée ; une rescision ne l''est pas.


    ### 8. L''observation qui me ferait changer d''avis


    Si l''ingénierie produit des journaux d''exposition montrant que la population exposée à v2 est de
    11 300 — c''est-à-dire qu''il n''existe quasiment pas d''abandon avant l''étape 3 — le biais de sélection
    s''effondre et le 47 % tient tel quel. C''est la première chose à vérifier, demain matin. Je la juge
    peu probable (l''existence même de 4 812 comptes agissant avant leur affectation indique que l''étape
    3 arrive après une activité utilisateur réelle), mais c''est le test décisif et il est bon marché.


    ### 9. Repli et déclencheur


    **Déclencheur observable :** si le deck circulé lundi soir porte encore un titre d''activation non
    corrigé (47 % ou 41 %), je remets mon objection par écrit à la DG et à la DAF avant l''ouverture du
    comité, avec l''extraction brute jointe. Pas d''escalade externe à ce stade — dissension écrite en
    interne, tracée, proportionnée.


    **Première action, aujourd''hui :** geler et hacher l''extraction brute ; ouvrir le ticket de reconstruction
    du dénominateur auprès de l''ingénierie (table d''inscription + journaux de routage, échéance lundi
    midi) ; demander l''explication du 11 300 > 10 940 ; faire retirer de la circulation le fichier «
    nettoyé » à 41 %.


    ---


    Je peux rédiger la note de correction co-signée et la diapositive en version A et en version B dès
    que la reconstruction du dénominateur revient.

    '
