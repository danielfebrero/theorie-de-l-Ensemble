response:
  text: '# Plan d''exécution — conversion de la flotte à l''électrique

    **Note à l''attention du conseil — séance du jeudi 13 août 2026**

    Direction de l''exploitation


    ---


    ## 1. Les trois décisions demandées jeudi


    | # | Décision | Montant | Pourquoi jeudi et pas plus tard |

    |---|---|---|---|

    | **D1** | Commande des 8 bornes supplémentaires, signature vendredi 14 août | 210 000 € | 7 semaines
    de travaux. Signature le 14 → mise en service visée le 15 octobre, butée dure le 31 octobre. Un mois
    de retard sur la signature fait tomber la subvention. |

    | **D2** | Préavis global au loueur avant le 20 août : prolongation de tous les lots non encore remplacés,
    libération ensuite lot par lot sur preuve de service | ~100 k€ étalés sur 8 mois | Le préavis est
    de 30 jours et un véhicule rendu ne revient pas avant 11 semaines. C''est la seule décision irréversible
    du dossier. |

    | **D3** | Périmètre électrique cible au 31 janvier : **60 véhicules**, pas 96 — et provision pour
    une seconde tranche de bornes arbitrée au conseil de novembre | provision 400–520 k€ | 22 bornes ne
    chargent pas 96 véhicules. Le conseil doit apprendre ce chiffre maintenant, pas en janvier. |


    **Verdict et critère qui l''emporte :** la contrainte de sécurité d''exploitation (aucune tournée
    non terminée pour cause de charge) prime sur la vitesse de conversion. Le programme est intégralement
    exécuté ; c''est son échelonnement qui est piloté par la capacité de charge.


    ---


    ## 2. Le fait déterminant : la contrainte n''est pas l''autonomie, c''est la borne-heure


    Le débat porte depuis mai sur les 260 km annoncés contre les 232 km mesurés. Ce n''est pas là que
    le programme se joue.


    Une borne de 22 kW rend une charge complète en 6 h. Cela donne un **rendement de charge** :


    - **38,7 km par heure de borne** en conditions douces (232 km / 6 h)

    - **32,8 km par heure de borne** à 2 °C avec chauffage (197 km / 6 h) — c''est le chiffre de décembre
    et janvier


    La flotte parcourt **16 128 km par jour** (96 × 168). La fenêtre de charge est le temps entre le retour
    du dernier véhicule et le départ du premier ; nous la retenons à **14 h** (16 h → 6 h), à confirmer
    sous 5 jours (§9-b). Avec un taux d''occupation réaliste de 85 % :


    | Parc de bornes | km chargeables / nuit (2 °C) | Tournées moyennes couvertes |

    |---|---|---|

    | 14 bornes (existant) | 5 460 km | **32** |

    | 22 bornes (après tranche 1) | 8 590 km | **51 à 60**¹ |

    | 41 bornes | 16 130 km | 96 |


    ¹ 51 si les véhicules électriques prennent des tournées moyennes ; **60 s''ils prennent les 60 tournées
    les plus courtes** — voir §3. C''est tout le sujet.


    **Trois conséquences que le conseil doit acter :**


    1. Le parc actuel de 14 bornes sature entre 38 et 45 véhicules. Il tient septembre, il ne tient pas
    la fin octobre.

    2. Les 22 bornes de la tranche 1 amènent exactement à la cible de subvention, **et pas au-delà**.
    60 n''est pas une cible confortable : c''est le bord de la capacité. C''est pourquoi elle doit être
    atteinte le 15 décembre et non le 30 janvier.

    3. **Les 96 véhicules commandés ne sont pas chargeables avec 22 bornes.** Le solde de 36 tournées
    exige une seconde tranche — environ 19 bornes AC, ou 4 à 6 points DC 50 kW, à chiffrer et arbitrer
    en novembre. Ce montant n''était pas au vote du 4 mai.


    Le scénario de référence — livrer, brancher, rouler — produirait en janvier un déficit de charge d''environ
    7 500 km par nuit, soit 45 tournées partant chaque matin avec une charge insuffisante, sur les deux
    plateformes simultanément, la semaine où la région contrôle la subvention. Même à 20 % d''échec, cela
    représente **170 000 € par mois** de réacheminements et pénalités. C''est ce scénario que le présent
    plan écarte.


    ---


    ## 3. Le périmètre électrique : les 60 tournées les plus courtes


    Une seule règle d''affectation résout les deux contraintes à la fois — l''autonomie et la borne-heure.


    **Les 60 tournées les plus courtes passent à l''électrique. Les 36 plus longues restent au diesel
    jusqu''à la tranche 2.**


    Elle est directement fondée sur la note du responsable transport : 11 recharges intermédiaires non
    prévues sur 120 tournées d''essai, **toutes sur des tournées de plus de 190 km, aucune en dessous**.
    La donnée est nette et va dans un seul sens.


    **Seuils d''affectation, indexés sur la température prévue à 6 h :**


    | Température prévue | Plafond kilométrique électrique | Marge sur l''autonomie mesurée |

    |---|---|---|

    | ≥ 10 °C | 190 km | 18 % sur 232 km |

    | 5 à 10 °C | 175 km | — |

    | < 5 °C | **160 km** | 19 % sur 197 km |


    Les tournées du périmètre électrique qui dépassent le plafond du jour basculent la veille au soir
    sur un véhicule diesel de réserve. La bascule est décidée à 17 h sur la prévision météo, pas le matin
    au départ.


    **Réserve :** 6 véhicules diesel conservés hors périmètre structurel, pour les jours froids, les immobilisations
    et les pannes de borne. Soit **42 diesels conservés** au 31 janvier.


    ---


    ## 4. Calendrier et jalons


    | Échéance | Jalon | Vérification |

    |---|---|---|

    | **Ven. 14 août** | Signature des 8 bornes. Date d''achèvement contractuelle au 15 octobre, pénalité
    de retard négociée. Disponibilité de l''installateur en août vérifiée **avant** signature. | Bon de
    commande |

    | **Mer. 20 août** | Préavis global au loueur (D2) | Accusé de réception écrit |

    | **Ven. 21 août** | Les six données du §9 sont fermées ; le plan est recalé si nécessaire | Note
    d''exploitation |

    | **30 sept.** | **20 véhicules en service** sur les 24 livrés. 4 en réception et formation. | Tableau
    de bord |

    | **15 oct.** | 8 bornes en service (butée dure : 31 oct.) | PV de mise en service |

    | **31 oct.** | **40 en service** sur 48 livrés | Tableau de bord |

    | **30 nov.** | **55 en service** sur 72 livrés. Conseil : arbitrage tranche 2. | Tableau de bord
    + dossier tranche 2 |

    | **15 déc.** | **60 en service** — seuil de subvention atteint, avec 6 semaines d''avance | Dossier
    de preuve région déposé |

    | **31 déc.** | 96 livrés, 60 à 66 en service selon les compteurs | Tableau de bord |

    | **31 janv.** | Subvention 620 000 € acquise et encaissable | Notification région |

    | **fin T1 2027** | Tranche 2 en service, montée à 96 | — |


    Les 30 à 36 véhicules livrés mais non mis en service ne sont pas perdus : ils constituent la réserve
    de permutation et absorbent les immobilisations sans dégrader le taux de service. Leur mise en route
    est mécanique dès que la tranche 2 est branchée.


    ---


    ## 5. Le pont diesel


    C''est le seul poste irréversible du dossier : **un véhicule rendu ne peut pas être repris avant 11
    semaines.** Rendre trop vite est la seule erreur de ce plan qu''on ne peut pas corriger dans la saison.


    **Règle ferme :** aucun diesel n''est rendu avant que son remplaçant électrique n''ait effectué **15
    jours consécutifs de service sur la tournée qui lui est affectée**, sans recharge non prévue.


    **Calendrier de libération (contre défaut de 24 par mois) :**


    | Fin de mois | Rendus au défaut | Rendus au plan | Conservés | Coût du mois |

    |---|---|---|---|---|

    | Septembre | 24 | 18 | 78 | — |

    | Octobre | 48 | 36 | 60 | 2 880 € |

    | Novembre | 72 | 50 | 46 | 5 760 € |

    | Décembre | 96 | 54 | 42 | 10 560 € |

    | Janvier → avril | 96 | 54 | 42 | 20 160 €/mois |


    **Coût total du pont, septembre à avril : environ 100 000 €.**


    L''arbitrage tient en une ligne : **480 € de prolongation mensuelle contre 900 € par tournée non terminée.**
    Conserver un diesel un mois entier coûte moins que la moitié d''un seul incident. Sur 42 véhicules,
    la prolongation revient à 20 160 € par mois — soit l''équivalent de 22 tournées ratées. Le taux d''incident
    constaté à l''essai (11 sur 120) rend ce seuil dérisoire.


    **Contrepartie proposée au loueur :** un calendrier de reprise indicatif ferme à quatre mois et le
    respect strict du préavis de 30 jours, contre une remise sur le tarif de prolongation. La prévisibilité
    a une valeur pour lui ; elle en a une pour nous.


    ---


    ## 6. Pilotage : les compteurs qui autorisent la marche suivante


    Le déploiement n''avance pas au calendrier, il avance aux compteurs. Le superviseur de flotte remonte
    l''état de charge et le kilométrage toutes les 10 minutes ; le tableau de bord publie chaque soir,
    par plateforme, le taux de tournées terminées et le nombre de recharges non prévues. Ces deux instruments
    existent déjà : ils deviennent les feux du programme.


    **Une tranche supplémentaire de 6 véhicules est mise en service uniquement si, sur 10 jours glissants
    et sur les deux plateformes :**


    1. taux de tournées terminées **≥ 99,0 %**

    2. recharges non prévues **≤ 1 %** des tournées électriques

    3. occupation des bornes **≤ 85 %** sur la fenêtre 16 h – 6 h

    4. **aucune** tournée électrique terminée sous **15 % d''état de charge**


    Un seul indicateur au rouge gèle la mise en service de la tranche suivante et suspend toute reddition
    de diesel. Le compteur 3 est le plus important des quatre : c''est celui qui prévient, il regarde
    la contrainte réelle. Les trois autres constatent.


    ---


    ## 7. Repli


    **Déclencheur de repli opérationnel** — l''un des trois suffit :

    - 2 tournées électriques non terminées pour cause de charge sur 7 jours glissants

    - occupation des bornes > 92 % trois nuits consécutives

    - une plateforme sous 98 % de tournées terminées sur 10 jours


    **Action, sous 48 h :** gel du déploiement ; retour à la traction diesel des 6 tournées les plus longues
    du périmètre électrique ; émission immédiate du préavis de prolongation sur le lot suivant. Aucune
    reprise du déploiement sans 10 jours consécutifs au vert sur les quatre compteurs.


    **Déclencheur majeur — tranche 1 non en service au 31 octobre :** cible ramenée à 45 véhicules au
    31 janvier, saisine écrite de la région sur les conditions de la subvention, arbitrage au conseil
    de novembre. Ce scénario coûte 620 000 € : c''est pourquoi la décision D1 se prend jeudi et se signe
    vendredi.


    ---


    ## 8. Ce qui renverserait ce plan


    Le plan repose sur deux paramètres mesurables. Deux observations le retournent, dans un sens comme
    dans l''autre :


    **Vers le haut** — si le relevé montre que 70 tournées ou plus font moins de 160 km **et** que la
    fenêtre de charge réelle dépasse 16 h, alors 22 bornes tiennent 75 véhicules : le périmètre électrique
    monte à 75 dès décembre, et la tranche 2 devient plus petite et plus tardive.


    **Vers le bas** — si la consommation mesurée à 2 °C dépasse **0,45 kWh/km** ou si la fenêtre réelle
    est inférieure à 12 h, alors 22 bornes ne tiennent que 45 véhicules : la cible de 60 au 31 janvier
    devient inatteignable avec la seule tranche 1, et **les deux tranches doivent être commandées jeudi**.


    Ces deux observations seront disponibles le 21 août. Le plan est présenté au conseil comme révisable
    sur ce point précis, et sur celui-là seulement.


    ---


    ## 9. Les six données à fermer sous 5 jours


    Toutes sont déjà dans nos systèmes ou à un appel de distance. Aucune ne coûte plus de cinq jours.


    | | Donnée | Source | Délai | Ce qu''elle décide |

    |---|---|---|---|---|

    | a | Distribution kilométrique des 96 tournées | Système de tournées | 2 j | Le périmètre électrique
    et sa taille réelle |

    | b | Fenêtre de charge réelle : heure du dernier retour, heure du premier départ, par plateforme,
    sur 30 jours | Superviseur de flotte | 2 j | Le dimensionnement des deux tranches de bornes |

    | c | **Puissance souscrite et capacité de raccordement des deux plateformes** | Enedis + exploitant
    | 5 j | **Risque critique** : 22 bornes appellent 484 kW contre 308 aujourd''hui. Un renforcement
    de raccordement peut ajouter plusieurs mois à la tranche 1. À vérifier avant la signature de vendredi.
    |

    | d | Critère d''acceptation de la région pour « véhicules qui roulent » — immatriculation, livraison,
    ou service effectif ? Réponse écrite. | Région | 10 j | 620 000 € |

    | e | Consommation réelle en kWh/km par tranche de température, tirée de la télémétrie des 6 véhicules
    d''essai | Superviseur de flotte | 3 j | Remplace le ratio 232 km / 6 h par une mesure |

    | f | Taux de disponibilité réel des 14 bornes existantes sur 12 mois | Maintenance | 3 j | Le facteur
    d''occupation de 85 % retenu ici |


    Le point **c** est le seul du dossier capable de faire tomber le calendrier sans que nous y puissions
    rien après coup. Il est traité en premier, lundi 10 août.


    ---


    ## 10. Argent


    | Poste | Montant |

    |---|---|

    | Véhicules (commande ferme, non renégociable) | 3 100 000 € |

    | Bornes tranche 1 — 8 unités | 210 000 € |

    | Bornes tranche 2 — provision, arbitrage novembre | 400 000 à 520 000 € |

    | Prolongation des locations, sept. 2026 → avr. 2027 | ~100 000 € |

    | **Total programme** | **3,81 à 3,93 M€** |

    | Subvention régionale | − 620 000 € |

    | **Net** | **3,19 à 3,31 M€** |


    Les 100 000 € de prolongation diesel ne sont pas un dépassement : ils sont la prime d''assurance qui
    sécurise 620 000 € de subvention et écarte un risque d''exploitation chiffré à 170 000 € par mois
    en janvier. Rapport de 6 pour 1 sur la seule subvention.


    La tranche 2 se justifie seule : 19 bornes AC amortissent en une vingtaine de mois la seule prolongation
    diesel qu''elles suppriment (242 000 €/an), avant même l''économie de carburant. **Recommandation
    : faire chiffrer en parallèle 4 à 6 points DC 50 kW.** Un point DC délivre 2,3 fois plus de kilomètres
    par heure et ouvre en outre l''appoint de mi-parcours — c''est-à-dire la seule voie techniquement
    propre pour électrifier les tournées de 240 km.


    ---


    ## 11. Le meilleur argument contre ce plan, et la réponse


    **L''objection :** « Vous sous-électrifiez. Le conseil a commandé 96 véhicules ; livrer un plan qui
    n''en fait rouler que 60 au 31 janvier, c''est 36 véhicules payés qui dorment — 1,16 M€ de capital
    immobilisé — et 20 000 € de diesel par mois par-dessus. Avec une discipline de créneaux et une charge
    en journée, 22 bornes peuvent faire tourner davantage. »


    **Réponse :** l''objection est partiellement fondée et elle déplace un chiffre, pas une conclusion.
    La longueur de la fenêtre de charge est bien le paramètre le plus incertain du modèle : si elle atteint
    18 h avec 90 % d''occupation, 22 bornes tiennent 69 tournées et non 60. Elles n''en tiendront jamais
    96 en janvier — il manquerait encore 5 000 km par nuit. La discipline de créneaux améliore le rendement
    de la tranche 1 ; elle ne remplace pas la tranche 2. Ce que l''objection change réellement, c''est
    le **dimensionnement** de la seconde tranche, et c''est précisément pourquoi elle est arbitrée en
    novembre sur données mesurées et non jeudi sur estimation.


    Sur le capital immobilisé : il est engagé, la commande est ferme, et il l''est identiquement dans
    les deux plans. Un véhicule au parking ne coûte rien de plus qu''un véhicule qui rate sa tournée à
    900 € l''unité — il coûte considérablement moins.


    ---


    ## 12. Les ensembles exposés


    Un plan de conversion qui ne traite que les véhicules échoue sur les gens.


    **Les conducteurs.** L''affectation électrique est **volontaire sur les deux premières tranches**.
    Règle de non-imputation : un conducteur qui demande une permutation pour motif de charge n''est jamais
    mis en cause — sa demande est une donnée d''exploitation, pas une faute. L''indicateur d''autonomie
    embarqué est recalibré sur la consommation réellement mesurée, pas sur les 260 km du catalogue : un
    chiffre auquel on ne croit pas ne protège personne.


    **Les clients.** Sur les 36 tournées les plus longues, rien ne change avant le deuxième trimestre
    2027. Sur le périmètre électrique, le taux de tournées terminées leur est communiqué mensuellement.


    **Le loueur.** Calendrier ferme à quatre mois contre remise, comme indiqué au §5.


    **La région.** Dossier de preuve constitué au fil de l''eau et déposé le 15 décembre, pas en janvier
    — relevés télémétriques, dates de mise en service, immatriculations. Le critère d''acceptation est
    demandé par écrit dès lundi (§9-d).


    ---


    ## Première action


    **Lundi 10 août, 9 h** — saisine d''Enedis et de l''exploitant sur la capacité de raccordement des
    deux plateformes (§9-c), avec réponse exigée sous 96 h. Elle conditionne la signature de vendredi.


    ---


    Deux remarques pour vous, hors document conseil :


    **Le cœur du dossier a été déplacé.** Le débat interne porte depuis mai sur l''autonomie ; la contrainte
    qui décide réellement est la borne-heure, et elle n''apparaît nulle part dans le dossier tel qu''il
    m''a été transmis. Le chiffre à faire passer jeudi est celui-là : **22 bornes ne chargent pas 96 véhicules,
    elles en chargent 60 en janvier.** Le conseil apprendra une dépense non votée ; il vaut mieux qu''il
    l''apprenne en août, quand elle est encore un arbitrage, qu''en janvier, quand elle sera un constat
    d''échec.


    **Deux chiffres sont des hypothèses de ma part, et le plan y est sensible :** la fenêtre de charge
    de 14 h et le taux d''occupation de 85 %. Les deux sont mesurables cette semaine (§9-b, §9-f). Si
    vous ne récupérez qu''une seule donnée avant jeudi, prenez la fenêtre de charge — c''est elle qui
    fixe si la cible est 51, 60 ou 69, et donc si la tranche 2 doit être commandée jeudi plutôt qu''en
    novembre.

    '
