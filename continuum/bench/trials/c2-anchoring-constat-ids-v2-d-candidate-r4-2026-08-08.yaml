  text: '## Avis pour le comité de direction — renouvellement du logiciel de réservation et des bornes


    *Note lue en séance. Chaque appréciation est numérotée et indique sur quel élément du dossier elle
    repose, pour que le comité puisse en écarter une sans faire tomber les autres.*


    **Hypothèse de calendrier retenue :** séance le 28 août, échéance de la remise le 30 août, fin de
    contrat le 31 octobre — soit environ 64 jours entre la séance et l''échéance réelle. Si le « 28 »
    désigne le 28 octobre, la marge tombe à trois jours et tout l''avis ci-dessous doit être rejoué :
    merci de le confirmer en ouverture de séance.


    ---


    ### 1. Ce que le dossier établit


    **A1 — Le dossier contient trois problèmes distincts, que la note de cadrage traite comme un seul.**

    *Repose sur :* l''export technique (bornes), l''enquête interne et les réclamations (module de réservation),
    la proposition commerciale (échéance du 30).

    Les bornes tombent en panne ; le module perd des réservations ; le contrat arrive à échéance. Rien
    dans le dossier ne montre que ces trois faits ont une cause commune. Les traiter par une seule signature
    revient à acheter une réponse à une question qu''on n''a pas posée.

    *Si le comité écarte ce point :* tout le reste de l''avis tombe, car il en découle.


    **A2 — L''indisponibilité des bornes est un problème de matériel, pas de logiciel.**

    *Repose sur :* 32 h sur 41 h d''indisponibilité concentrées sur Fontaine et Rive-Sud, seuls sites
    équipés des bornes de 2015 — soit 78 % de la panne sur 2 sites sur 7, ceux dont le matériel a onze
    ans.

    Un renouvellement de licence ne rajeunit pas une borne. À l''inverse, aucun taux de disponibilité
    ne peut être calculé : le dossier ne donne pas les heures d''ouverture cumulées des bornes. 41 h est
    un volume, pas un taux.

    *Si le comité écarte ce point :* la recommandation tient, mais le dossier « bornes » cesse d''être
    instruit séparément.


    **A3 — La cause des pertes de réservations n''est pas identifiée, et le dossier contient trois candidats,
    pas un.**

    *Repose sur :* la mise à jour de mars ; le changement de version du portail usagers en février (réseau
    entier) ; le remplacement du lien fibre de Rive-Sud en février (site unique).

    Le candidat « février / portail usagers » est antérieur à mars, concerne tout le réseau, et n''est
    examiné nulle part dans le dossier.

    *Si le comité écarte ce point :* il faut alors expliquer pourquoi la version du portail est hors de
    cause, ce que le dossier ne fait pas.


    **A4 — Les deux séries de faits internes se contredisent, et c''est cette contradiction qui décide.**

    *Repose sur :* l''enquête (61 % de 43 répondants ≈ 26 agents signalent des pertes hebdomadaires, sur
    l''ensemble du réseau) contre les notes de sites (Rive-Sud ressaisit depuis mars ; Fontaine, équipée
    des mêmes bornes, ne signale rien).

    L''enquête pointe vers une cause générale ; les notes de sites pointent vers Rive-Sud, seul site à
    avoir changé d''infrastructure réseau en février. Les deux ne peuvent pas être vrais au même degré.
    La grandeur qui trancherait — le nombre de réservations perdues **par site et par semaine, mesuré
    dans les journaux** et non déclaré en enquête — n''est pas au dossier. Elle est obtenable en quelques
    jours.

    Par ailleurs, seuls 12 répondants situent le début après mars : moins de la moitié des 26 qui signalent
    le problème, et 12 agents sur 62. Une date de début reconstituée cinq mois après les faits est une
    indication, pas une preuve.


    **A5 — La courbe des réclamations ne se comporte pas comme une panne logicielle installée.**

    *Repose sur :* 71 réclamations entre mars et juin (≈ 17,8/mois), 25 sur les huit autres mois (≈ 3,1/mois).

    Le pic est réel — facteur 5,7 — mais il est **retombé** après juin, alors que Rive-Sud ressaisit toujours
    à la main. Soit la cause s''est éteinte d''elle-même, soit la ressaisie manuelle masque désormais
    l''effet pour l''usager, soit les usagers ont cessé de réclamer. Ces trois lectures appellent des
    décisions opposées. Aucune n''est privilégiée par le dossier.


    **A6 — La v4 est chiffrée mais son effet ne l''est pas.**

    *Repose sur :* 31 000 € en une fois, compatibilité avec les bornes de 2015 « à l''étude » chez l''éditeur.

    « À l''étude » veut dire inconnu. Si la v4 est incompatible, elle déclenche un remplacement de bornes
    sur deux sites, non chiffré au dossier, en plus des 31 000 €. Acheter la v4 aujourd''hui, c''est payer
    31 000 € pour corriger une cause non identifiée (A3), avec un risque de coût supplémentaire non borné.


    **A7 — Le libre n''est ni exclu ni décidable en l''état.**

    *Repose sur :* −30 % annoncés (≈ 14 000 €/an sur la base actuelle), mais 2 sites sur 5 du réseau voisin
    tiennent encore un registre papier **quatorze mois après** la bascule.

    Le coût annoncé est un coût de licence ; le registre papier est un coût de service qui n''y figure
    pas. Et notre équipe informatique passe de deux personnes à une en octobre — le moment exact où une
    migration mobiliserait le plus.


    **A8 — L''échéance du 30 est commerciale, pas opérationnelle.**

    *Repose sur :* remise de 12 % contre engagement de trois ans avant le 30 ; fin de contrat le 31 octobre.

    La remise vaut 5 760 €/an, soit de l''ordre de 17 000 à 19 000 € sur trois ans selon que les 12 %
    s''appliquent avant ou après l''indexation de +7 % — **point de contrat à faire préciser par écrit,
    il n''est pas tranché au dossier**. Ce que l''engagement de trois ans supprime, c''est la possibilité
    de sortir au moment précis où deux inconnues (compatibilité v4, cause réelle) seront levées.


    **A9 — Sur la note de cadrage.**

    *Repose sur :* la note elle-même, qui affirme trois choses — mars est la cause, la v4 règle le problème,
    il faut signer avant le 30 — et ne cite aucune pièce.

    Ses conclusions peuvent se révéler exactes. Elles ne sont pas établies, et deux membres du comité
    les ont déjà lues. Je propose de ne pas les écarter mais de les tester : elles sont testables, et
    le test est court. Je propose que le chargé de mission numérique conduise lui-même l''instruction
    ci-dessous, avec les moyens correspondants, et présente ses résultats au comité suivant.


    ---


    ### 2. Recommandation


    **Ne rien signer avant le 30. Reconduire à l''identique, sur une durée courte (12 mois, 18 au maximum),
    sans acheter la v4, et instruire la cause en quinze jours.**


    C''est l''option 1 du dossier, avec une modification de durée, et assumée comme un report de décision
    payant :


    - **prix payé** : la remise perdue, 5 760 € pour l''année, plus la poursuite de la ressaisie manuelle
    à Rive-Sud (5 h/semaine ≈ 0,15 ETP, déjà environ 110 h depuis mars) ;

    - **ce que ça achète** : ne pas engager 31 000 € plus un possible remplacement de bornes sur une cause
    non identifiée, et ne pas verrouiller trois ans le mois où l''équipe informatique est divisée par
    deux.


    L''option 2 (v4) redeviendra la meilleure si l''instruction confirme une rupture nette et générale
    à la date de la mise à jour de mars. L''option 3 (libre) ne peut pas être décidée avec un informaticien
    et une migration simultanée ; elle doit être instruite maintenant pour être décidable dans un an,
    pas écartée.


    **Le meilleur argument contre cet avis**, et il est sérieux : dans un an nous aurons perdu la remise,
    Rive-Sud aura ressaisi 260 heures de plus, le second informaticien sera parti avec la connaissance
    du système, et l''éditeur pourra refuser toute durée courte. Ce que je réponds : les quinze jours
    ne visent pas à trancher l''arbitrage, mais à produire deux ou trois pièces qui existent déjà (journaux,
    dates, changelog) ; et le départ d''octobre est un argument contre le lancement d''une migration maintenant,
    pas contre l''attente. Là où l''objection porte vraiment, c''est sur le réseau voisin : il faut ouvrir
    ce dossier tout de suite, pas dans un an — je l''ai inscrit ci-dessous.


    **Ce qui renverserait cette recommandation :** des journaux du module montrant des pertes sur les
    7 sites, absentes avant la date exacte de la mise à jour de mars et présentes après, **plus** une
    réponse écrite de l''éditeur confirmant la compatibilité v4 avec les bornes de 2015. Ces deux éléments
    réunis font de l''option 2 le choix évident, et je le dirai au comité suivant.


    **Pire cas et qui l''encaisse :** l''éditeur refuse toute durée inférieure à trois ans et laisse filer
    le 31 octobre — les sept sites se retrouvent sans logiciel de réservation, et ce sont les usagers
    et les agents d''accueil qui l''encaissent. Ce cas est évité par un repli daté, ci-dessous.


    **Repli, avec son déclencheur :** si au **20 septembre** l''éditeur n''a pas remis d''offre écrite
    de reconduction à 12 ou 18 mois, le comité arbitre entre l''engagement de trois ans au tarif plein
    et une reconduction d''urgence, sur la base des pièces d''instruction alors disponibles — avant le
    31 octobre, sans interruption de service. Dans ce scénario, le coût résiduel de l''avis est financier
    et borné à environ 17 000 à 19 000 € sur trois ans, pas une rupture de service.


    ---


    ### 3. Ce que j''engage dans les quinze jours


    | # | Action | Pilote | Échéance |

    |---|---|---|---|

    | 1 | **Première action, cette semaine** : courrier à l''éditeur demandant (a) une offre de reconduction
    12/18 mois, (b) une réponse écrite et datée sur la compatibilité v4 / bornes 2015 et, si incompatible,
    le coût de remplacement, (c) les journaux du module de réservation janvier→août et le changelog de
    la mise à jour de mars, (d) l''application exacte des 12 % avant ou après indexation | Direction réseau
    | J+3 |

    | 2 | Extraction du nombre de réservations perdues **par site et par semaine**, janvier→août ; relevé
    des dates exactes de la mise à jour de mars, du changement de version du portail (février) et du remplacement
    fibre de Rive-Sud | Chargé de mission numérique + informatique | J+10 |

    | 3 | Entretien sur site à Fontaine : vérifier si l''absence de signalement est une absence d''incident
    ou une absence de remontée | Chargé de mission numérique | J+7 |

    | 4 | Relevé contradictoire de la ressaisie à Rive-Sud sur deux semaines, et décision de compensation
    ou de renfort pour l''équipe | Direction réseau | J+14 |

    | 5 | Entretien avec le réseau voisin : pourquoi 2 sites sur 5 tiennent un registre papier, coût réel
    de la bascule, effectif informatique mobilisé | Chargé de mission numérique | J+14 |

    | 6 | Devis de remplacement ou reconditionnement des bornes de 2015, instruit indépendamment du choix
    logiciel | Services techniques | J+15 |

    | 7 | Ouverture du recrutement sur le poste informatique vacant en octobre — c''est cette ressource,
    et non le logiciel, qui détermine ce qui sera faisable en 2027 | RH / Direction | J+5 |


    Retour au comité avec ces pièces pour l''arbitrage v4 / libre, en tout état de cause avant le 31 octobre.

    '
