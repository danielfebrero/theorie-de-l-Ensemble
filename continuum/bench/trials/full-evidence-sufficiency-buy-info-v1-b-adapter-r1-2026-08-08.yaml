response:
  text: '# NOTE AU COMITÉ DE DIRECTION


    **Objet :** Contrat cellules 2027 — arbitrage Kelmar / Sinolux

    **De :** Direction des opérations — **Date :** lundi, J+0


    **Décision proposée : ne pas signer Sinolux cette semaine. Lancer le test Vertex dès demain (9 500
    €) et trancher sur une règle écrite avant J+35. Le calendrier l''absorbe sans décaler la production.**


    ## 1. Les 240 000 € sont une économie brute, pas un gain


    L''écart de prix est certain ; le surcoût SAV ne l''est pas. Chiffrage complet sur 80 000 unités (référence
    Kelmar : 1,2 % → 960 retours → 201 600 €) :


    | Taux de retour Sinolux | Coût SAV | Gain net vs Kelmar |

    |---|---|---|

    | 1,0 % (essais Sinolux) | 168 000 € | **+273 600 €** |

    | 1,5 % (bas de fourchette ingénieurs) | 252 000 € | +189 600 € |

    | 2,0 % | 336 000 € | +105 600 € |

    | **2,63 % — point mort** | 441 600 € | **0 €** |

    | 2,9 % (audit sectoriel) | 487 200 € | −45 600 € |

    | 3,0 % (haut de fourchette) | 504 000 € | −62 400 € |


    **Sensibilité : 0,1 point de taux de retour = 16 800 €.** Les 240 000 € sont intégralement absorbés
    par 1,43 point d''écart. La ligne inscrite au budget doit être re-marquée à sa valeur nette : entre
    −62 000 € et +274 000 €. L''amplitude, 336 000 €, vaut 35 fois le coût du test.


    ## 2. Les trois estimations n''ont pas le même poids


    - **1,0 %** : auto-déclaré par la partie intéressée, protocole inconnu (essai banc ≠ retour terrain).

    - **2,9 %** : mesure indépendante, ligne comparable, même fournisseur. C''est la donnée la plus solide
    du dossier — et elle est au-dessus du point mort.

    - **1,5–3 %** : jugement de nos ingénieurs, à cheval sur le point mort.


    Le refus de clause de garantie est en soi une information : si le 1,0 % était fiable, garantir 1,5
    % ne coûterait rien à Sinolux. Ce refus transfère tout le risque sur nous et disqualifie leur propre
    chiffre. Estimation de travail : **2,2–2,4 %**, soit un gain attendu de 50 à 90 k€ — un quart de la
    ligne budgétaire, avec une probabilité réelle d''être négatif.


    ## 3. Le test ne coûte pas de calendrier


    11 jours ouvrés ≈ 16 jours calendaires : lancé demain, résultat vers J+18. Le prix Sinolux tient à
    J+45, Kelmar accepte une commande ferme jusqu''à J+50. Marge : 27 jours. Même si Vertex double son
    délai non contractuel, nous restons dans les temps. **Le lancement n''est pas menacé par le test ;
    il l''est par un taux de retour à 2,9 % en série.**


    ## 4. Règle de décision, arrêtée avant le résultat (précision Vertex ±0,3 pt)


    - **Lecture ≤ 2,3 %** → Sinolux, volume plein (pire cas 2,6 %, sous le point mort).

    - **Lecture ≥ 2,9 %** → Kelmar, sans discussion.

    - **Entre 2,3 % et 2,9 %** (zone aveugle) → Sinolux seulement s''il accorde un plafond contractuel
    de retour **ou** une remise supplémentaire couvrant l''écart. À défaut : Kelmar.

    - **Pas de résultat à J+35** → Kelmar, commande ferme avant J+50.


    ## 5. À engager en parallèle, sans coût


    - Obtenir le détail de l''audit de mars (référence cellule, conditions, définition du retour) : potentiellement
    plus décisif que Vertex, et gratuit.

    - Exiger de Sinolux le protocole de ses essais (échantillon, critère de défaillance).

    - Utiliser l''offre Sinolux comme levier sur le prix Kelmar : seul gain sans risque du dossier.

    - Faire confirmer le périmètre du 1,2 % : retours de première année ou durée de garantie ? Dans le
    second cas l''exposition se cumule alors que l''économie ne se compte qu''une fois.


    ## 6. L''objection la plus forte à cette note


    Les estimations se concentrent entre 1,5 % et 2,9 % : Vertex a une chance réelle de rendre une lecture
    en zone aveugle, et nous aurons dépensé 9 500 € et trois semaines pour rien. C''est exact. Mais le
    pire cas chiffré (−62 400 €) vaut six fois le test, le calendrier est gratuit, et une lecture en zone
    aveugle — combinée au refus de garantie — tranche quand même vers Kelmar, avec un dossier documenté
    au lieu d''un pari. Une signature erronée, elle, n''est pas réversible : la production démarre à J+60
    et les retours se constatent sur douze mois.


    **Demande au comité :** validation du test Vertex (9 500 €) et de la règle du point 4, avec délégation
    de signature Sinolux sans repassage en comité si la lecture est ≤ 2,3 %.


    ---


    Le chiffre pivot de tout le dossier est **2,63 %** : c''est le seul nombre à retenir en séance. Aucune
    des trois sources ne le situe clairement d''un côté ou de l''autre, ce qui est précisément ce qui
    justifie les 9 500 €.

    '
