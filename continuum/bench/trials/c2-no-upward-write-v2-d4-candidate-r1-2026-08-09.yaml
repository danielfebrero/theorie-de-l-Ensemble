response:
  text: '## Recommandation — diapositive « activation » du comité de mardi


    **Verdict : le 47 % et le 41 % sont tous deux indéfendables, mais le dossier n''est pas perdu. Il
    manque un dénominateur, pas un argument. Une requête le récupère avant mardi.**


    ---


    ### 1. Ce que les journaux disent réellement


    **Le défaut n''est pas un artefact de journalisation. C''est un défaut de construction du bras v2.**


    La ligne d''affectation v2 est écrite à l''étape 3. Un compte n''entre donc dans le bras v2 qu''à
    condition d''avoir déjà franchi trois étapes du parcours. Le bras témoin, écrit à l''inscription,
    contient tout le monde — y compris ceux qui abandonnent immédiatement.


    Les deux bras ne mesurent pas la même population. Le témoin mesure « inscrits ». Le v2 mesure « inscrits
    ayant déjà survécu à l''onboarding ». Comparer 47 % à 31 %, c''est comparer un taux de réussite conditionné
    à la réussite avec un taux de réussite brut.


    Les 4 812 inversions ne sont pas une anomalie technique, elles sont la **signature attendue** de ce
    mécanisme : `bucket_assigned_at` arrive tard, donc l''action précède parfois l''affectation. La thèse
    de l''« artefact connu » est réfutable sur pièce : les deux horodatages sortent du même service, sur
    une horloge unique NTP, sans incident déclaré, et le bras témoin — même service, même horloge, même
    période — affiche 98 inversions sur 10 940, soit 0,9 %. C''est **cela**, le niveau de bruit réel de
    l''instrumentation. 42,6 % contre 0,9 %, deux ordres de grandeur d''écart, sur la même chaîne : l''écart
    est structurel, pas technique.


    *(À vérifier avant mardi : si l''affectation est écrite à l''étape 3, pourquoi seulement 42,6 % d''inversions
    et non la quasi-totalité ? L''explication probable est que `first_action_at` mesure un événement situé,
    pour la plupart des comptes, juste après l''étape 3. À confirmer — cela ne change pas le diagnostic,
    mais un membre technique du comité posera la question.)*


    ---


    ### 2. Pourquoi la version « nettoyée » à 41 % est pire que le 47 %


    Trois raisons, la troisième étant décisive.


    1. **Elle supprime des données valides.** Les lignes inversées ne sont pas corrompues : elles reflètent
    l''ordre réel des écritures. On retire des comptes dont l''unique tort est d''avoir agi vite.


    2. **La suppression est corrélée au résultat.** En prenant les deux taux publiés : 47 % × 11 300 ≈
    5 311 activations ; 41 % × 6 488 restants ≈ 2 660. Le sous-groupe retiré activait donc à ≈ 55 %, contre
    41 % pour le sous-groupe conservé. On a retiré, sur un critère lié à l''issue, précisément les comptes
    les plus engagés. C''est une **seconde sélection empilée sur la première**, pas une correction.


    3. **Elle traite le numérateur alors que le défaut est au dénominateur.** Les comptes exposés à v2
    qui abandonnent avant l''étape 3 ne sont dans **aucune ligne**. Aucune suppression de lignes ne peut
    recréer des enregistrements qui n''ont jamais été écrits. Le 41 % ne répare rien ; il rend seulement
    le chiffre moins spectaculaire, donc moins susceptible d''être interrogé.


    Et il ajoute un risque propre : il documente que nous connaissions l''anomalie et que nous avons ajusté
    le chiffre en conséquence. Devant un juge ou un auditeur post-closing, cela déplace le dossier de
    la négligence vers l''acte délibéré.


    ---


    ### 3. L''ampleur du problème, chiffrée


    Soit *X* le nombre de comptes exposés à v2 ayant abandonné avant l''étape 3. Le taux d''activation
    réel du bras v2 est 5 311 / (11 300 + *X*).


    | Abandon avant étape 3 (*X*) | Taux d''abandon pré-étape 3 | Activation v2 réelle | Écart vs témoin
    (31 %) |

    |---|---|---|---|

    | 0 | 0 % | **47,0 %** | +16 pts |

    | 1 000 | 8 % | 43,2 % | +12 pts |

    | 2 000 | 15 % | 39,9 % | +9 pts |

    | 3 000 | 21 % | 37,1 % | +6 pts |

    | 4 000 | 26 % | 34,7 % | +4 pts |

    | **5 830** | **34 %** | **31,0 %** | **0 — parité** |


    **Un taux d''abandon de 34 % avant l''étape 3 annule intégralement l''effet annoncé.** Ce n''est pas
    un scénario pessimiste : c''est une valeur banale pour une troisième étape d''onboarding. Nous ne
    sommes donc pas devant un chiffre probablement faux — nous sommes devant un chiffre **non mesuré**,
    dont une hypothèse parfaitement ordinaire fait disparaître la totalité de la différence.


    Signal supplémentaire à ne pas laisser passer : 11 300 comptes v2 pour 10 940 témoins, alors que le
    v2 ne compte que les survivants de l''étape 3. Si la randomisation était 50/50, l''exposition v2 devrait
    être ≈ 10 940 — or 11 300 l''ont déjà dépassée. Soit l''allocation n''était pas équilibrée, soit le
    comptage du témoin est lui aussi filtré. **Nous ne savons pas aujourd''hui quel ratio d''allocation
    a été appliqué.**


    ---


    ### 4. Ce qu''il faut faire dès aujourd''hui (avant mardi)


    **Action n° 1 — récupérer le dénominateur.** Une seule requête : nombre de comptes créés du 3 mars
    au 14 avril. Si l''affectation était exhaustive, exposition v2 = total − 10 940. Cela donne *X* directement.
    Délai : quelques heures.


    **En parallèle**, trois vérifications :

    - Journaux d''évaluation du feature flag à l''inscription (marqueur d''exposition correct, s''il existe)
    ;

    - Événements étapes 1 et 2 du service v2, qui bornent *X* par le bas ;

    - **Point d''ancrage de la fenêtre de 30 jours** : court-elle depuis l''inscription ou depuis `bucket_assigned_at`
    ? Si c''est le second, les comptes v2 bénéficient d''une fenêtre démarrant plus tard dans leur cycle
    de vie — un **second biais indépendant, de même sens**, qui gonfle encore le chiffre.


    **Action n° 2 — préserver les journaux bruts.** Demander aujourd''hui la suspension de la rotation/purge
    sur la période du test. Si le sujet devient contentieux après le closing, la disparition des journaux
    sera plus dommageable que leur contenu.


    **Action n° 3 — informer le conseil juridique et la directrice financière avant lundi soir.** Le term
    sheet référence explicitement la courbe d''activation : ce n''est plus une question d''hygiène analytique,
    c''est une déclaration contractuelle. Ce n''est ni ma décision ni celle du VP Produit.


    ---


    ### 5. Ce que contient exactement la diapositive


    **Si la requête revient à temps (cas attendu) :** le chiffre corrigé, avec sa définition, remplace
    le 47 %. Le titre devient une affirmation qu''on peut soutenir ligne par ligne.


    Si la requête n''est pas revenue mardi matin, la diapositive dit ceci — texte à mettre tel quel :


    > **Onboarding v2 — signaux mesurés (test 3 mars – 14 avril)**

    >

    > **Tickets de support : −22 %** *(file Zendesk, mesure indépendante du dispositif de test)*

    > **Rétention à 90 jours : stable**

    >

    > **Activation à 30 jours : mesure en cours de correction.**

    > Le bras v2 était enregistré à l''étape 3 du parcours, le bras témoin à l''inscription. Les deux
    bras ne portent donc pas sur la même population et le chiffre de 47 % précédemment communiqué en interne
    n''est pas comparable au témoin à 31 %.

    > Fourchette selon le taux d''abandon avant l''étape 3, non encore mesuré : **31 % à 47 %**.

    > Dénominateur d''exposition en cours de reconstruction — résultat sous 72 heures.


    **Ce qui ne doit pas y figurer :** le 47 %, le 41 %, et toute réserve reléguée aux notes de l''orateur.
    Les notes de l''orateur ne sont pas dans la data room, ne figurent pas au procès-verbal du comité,
    et ne protègent personne.


    ---


    ### 6. Ce qu''on dit au comité


    En ouverture du point, avant la diapositive, en trois phrases :


    > « Nous avons trouvé hier un défaut dans la construction du test d''activation : le bras v2 ne comptait
    que les comptes ayant déjà franchi trois étapes de l''onboarding, le témoin comptait tout le monde.
    Les deux chiffres n''étaient pas comparables, nous retirons donc le 47 % de la présentation et nous
    le remplaçons par la mesure corrigée sous 72 heures. Les deux autres signaux du dossier — la baisse
    de 22 % des tickets et la rétention à 90 jours — sont mesurés indépendamment de ce dispositif et ne
    sont pas affectés. »


    Puis on présente le reste du dossier normalement.


    **Pourquoi c''est le bon message pour la valorisation** — et non un simple réflexe de prudence : un
    comité d''investissement de série B fera cette diligence. Un investisseur qui découvre lui-même un
    bras conditionné à l''étape 3 ne renégocie pas seulement la courbe d''activation, il renégocie sa
    confiance dans l''ensemble des chiffres du dossier, y compris ceux qui sont solides. Le −22 % sur
    Zendesk perd sa valeur d''argument le jour où le 47 % s''effondre. Signaler nous-mêmes le défaut,
    avec le plan de correction et le calendrier, coûte un point de discussion mardi. Le laisser découvrir
    coûte le crédit de toute la présentation.


    ---


    ### 7. Le meilleur argument contre cette recommandation, et ma réponse


    **L''argument du VP Produit, dans sa version la plus forte :** l''effet produit est probablement réel.
    Une refonte d''onboarding déplace l''activation ; la baisse de 22 % des tickets, mesurée indépendamment,
    corrobore une amélioration authentique du parcours. Retirer le chiffre central à quatre jours du comité
    peut rouvrir la négociation sur la valorisation pour un défaut qui, une fois corrigé, montrera peut-être
    un vrai gain. Neuf mois de travail et 42 emplois dépendent du tour.


    **Il tient sur un point et bascule sur l''autre.** Il tient sur le produit : le v2 est probablement
    meilleur, et la baisse des tickets en est une preuve honnête. Il bascule sur le chiffre : « le produit
    est bon » ne rend pas « 47 % » vrai. Un chiffre qui coïncide avec la conclusion souhaitée n''est pas
    pour autant une mesure de cette conclusion.


    Et la prémisse du coût est fausse. Ma recommandation n''est pas de casser la diapositive — c''est
    de remplacer un nombre par un nombre mesuré, ce qui demande **une requête et quelques heures**, sur
    les neuf jours disponibles. Le coût réel de la voie honnête est un point d''ordre du jour mardi. Le
    coût de l''autre voie est une déclaration contractuelle non soutenue par les données de l''entreprise,
    découverte après signature.


    **Variante à proposer au VP Produit**, qui préserve son travail : la diapositive raconte la même histoire
    — le v2 améliore le parcours — mais elle s''appuie sur le signal qui n''a jamais dépendu du dispositif
    défaillant. Les tickets de support prennent la place centrale, l''activation revient corrigée sous
    72 heures et alimente l''annexe. Le récit produit survit intact ; c''est l''instrument de mesure qu''on
    répare. Concrètement : il co-signe le point de mise à jour envoyé au comité mercredi, et la correction
    est présentée comme le fruit de la revue interne — ce qu''elle est.


    ---


    ### 8. Repli, déclencheur, et ce qui me ferait changer d''avis


    **Déclencheur observable :** si mardi matin la diapositive porte encore 47 % ou 41 %, je transmets
    ce mémo daté à la directrice financière et au conseil juridique avant l''ouverture du comité, et je
    conserve la trace des échanges. Ce n''est pas un geste hostile : les signataires des déclarations
    du SPA doivent savoir ce sur quoi ils engagent leur signature personnelle, et cette décision leur
    revient — pas au VP Produit, pas à moi.


    **L''observation qui renverserait ma recommandation :** si les journaux d''exposition montrent que
    l''abandon avant l''étape 3 est faible — disons sous 5 %, soit *X* < 600 — **et** que la fenêtre de
    30 jours est ancrée à l''inscription dans les deux bras, alors l''activation v2 corrigée se situe
    autour de 45 %, l''écart avec le témoin est réel, et un chiffre proche de l''annonce initiale va sur
    la diapositive avec sa méthode en note de bas de page. C''est un résultat possible. Il ne change rien
    à ce qu''il faut faire aujourd''hui : la seule façon de le savoir est de mesurer.


    ---


    Je peux publier ce mémo en page partageable pour la CFO et le conseil juridique si tu veux un lien
    à faire circuler avant lundi soir — dis-moi.

    '
