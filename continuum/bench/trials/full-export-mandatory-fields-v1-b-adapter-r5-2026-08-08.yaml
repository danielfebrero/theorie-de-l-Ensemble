response:
  text: '# NOTE DE DIRECTION — EXÉCUTOIRE


    **De :** Direction générale

    **À :** Comité de direction (DAF, Directeur commercial, Directeur industriel, DRH, Directeur qualité)

    **Date :** 8 août 2026

    **Objet :** Contrat d''exclusivité D — décision, mandat et règles d''exécution pendant mon absence
    (9 → 30 août)

    **Statut :** Cette note vaut décision. Elle s''applique en l''état. Aucune disposition n''est négociable
    en mon absence.


    ---


    ## 1. La décision


    **Nous ne signons pas le contrat d''exclusivité proposé par D. Ni sous huit jours, ni pendant mon
    absence, ni sous une forme amendée à la marge.**


    Nous répondons à D par un contre-projet écrit, transmis **le mercredi 12 août**, avant l''échéance
    qu''ils ont fixée. Nous ne subissons pas le compte à rebours : nous y répondons en avance, par écrit,
    avec une offre chiffrée et constructive.


    ## 2. Retrait de délégation


    À compter de mon départ et jusqu''à mon retour :


    - **La délégation de signature portant sur tout engagement avec D est retirée à tous les membres du
    comité de direction**, quel qu''en soit le support (contrat-cadre, avenant, lettre d''intention, courriel
    valant accord, accord verbal en comité d''achat).

    - Aucun engagement d''une durée supérieure à 12 mois, quel qu''en soit le client, ne peut être signé
    pendant cette période.

    - Le seul document engageant que le comité peut signer avec D est celui décrit au **§5**, et uniquement
    s''il satisfait **l''intégralité** des conditions listées.

    - Si D accepte intégralement notre contre-projet dès août : **nous ne signons pas pour autant avant
    le 31 août.** Nous prenons leur accord par écrit et je signe à mon retour. Un accord réellement voulu
    par D survit à trois semaines.


    Cette clause n''est pas une marque de défiance. Une décision irréversible sur trois ans ne se prend
    pas pendant la fenêtre où le dirigeant qui en répond est injoignable.


    ## 3. Pourquoi ce contrat est un contrat de sortie, pas un contrat de croissance


    *(Hypothèse de calcul : marge brute uniforme de 31 % ; à affiner par le DAF, cf. §8.)*


    Marge brute actuelle sur D : **4,62 M€** (14,9 M€ × 31 %).


    | Scénario sous contrat | CA facturé D | Marge brute | Écart |

    |---|---|---|---|

    | Année 1, +18 % de volume **tenu** | 16,0 M€ | 3,87 M€ | **−0,75 M€** |

    | Années 2-3, volume revenu au niveau actuel | 13,6 M€ | 3,28 M€ | **−1,34 M€/an** |

    | Années 2-3, volume −11 % (précédent du T2) | 12,1 M€ | 2,92 M€ | **−1,70 M€/an** |


    Trois constats qui commandent la décision :


    1. **Neuf points de remise consomment 29 % de notre marge unitaire.** Il faudrait **+41 % de volume**
    pour revenir à marge constante. D en engage 18. Le contrat est perdant **même quand il fonctionne
    comme prévu.**

    2. **L''asymétrie est totale.** Le volume est ferme un an, « indicatif » ensuite ; la remise, elle,
    est ferme trois ans. Nous vendons trois ans de prix contre un an de volume. Scénario central sur trois
    ans : **−3,4 M€ de marge brute cumulée**, pour 2,1 M€ de trésorerie.

    3. **L''exclusivité ferme les deux issues au moment précis où nous en avons besoin.** Elle tue la
    centrale régionale (3,5 M€, ~1,1 M€ de marge) et la marketplace, et la porte de sortie coûte 1,2 M€.
    Nous passerions d''une dépendance commerciale de 62 % — désagréable mais réversible — à une dépendance
    **contractuelle et sans recours**, envers un partenaire qui a déjà coupé 11 % sans préavis.


    **Le test décisif, à vérifier noir sur blanc :** que doit D si le volume n''est pas au rendez-vous
    ? Le DAF et notre conseil juridique répondent à cette question **avant le 12 août**. Si la réponse
    est « rien », alors ce n''est pas un contrat, c''est une option gratuite que nous offrons à D — et
    cela clôt le débat à soi seul. Cette réponse figure explicitement dans notre courrier à D.


    ## 4. Le meilleur argument contre cette note


    Je le formule moi-même pour que vous n''ayez pas à l''inventer sous pression :


    *« 62 % du CA est existentiel. Perdre 4 références sur 8, c''est potentiellement 7 M€ de CA, le passage
    sous 70 % de plan de charge, le chômage partiel à Redon et une spirale avec trois mois de trésorerie.
    Les alternatives sont lointaines et incertaines. Signer, c''est acheter un an de charge d''usine et
    52 emplois. »*


    C''est l''argument sérieux, et je le prends au sérieux. Il échoue sur un point : **ce contrat n''achète
    pas de temps, il le vend.** Il dégrade la marge dès l''année 1, se prolonge deux ans au-delà de toute
    contrepartie, et supprime pendant ce temps toute possibilité de reconstruire ailleurs. La protection
    des 52 postes de Redon devient, sous exclusivité, entièrement suspendue au bon vouloir d''un tiers
    contre lequel nous n''aurions aucun recours.


    Le critère est celui-ci : **refuser produit une douleur réversible ; signer produit une perte irréversible.**
    À douleur comparable, on choisit toujours celle dont on peut revenir. C''est la seule règle que je
    vous demande d''appliquer si un cas non prévu se présente.


    ## 5. Le contre-projet à D — et ce que vous êtes autorisés à signer


    Porté par le **Directeur commercial**, le **DAF présent à tout échange**, transmis le **12 août**
    par courrier signé de ma main (préparé avant mon départ).


    **L''offre :**


    1. **Les 9 % de remise, nous les accordons — sur les volumes incrémentaux uniquement**, au-delà du
    niveau constaté sur 12 mois glissants. D obtient exactement le prix qu''il demande sur la croissance
    qu''il apporte. À +18 %, notre marge devient **5,21 M€** (+0,6 M€) et la sienne progresse. C''est
    une offre sincère, pas une manœuvre : elle est meilleure pour les deux parties dès lors que la croissance
    est réelle.

    2. **Remise arrière sur volumes réalisés**, pas remise sur facture. Pas de baisse de prix sans le
    volume qui la justifie.

    3. **Contrat de 12 mois**, reconductible, sans exclusivité.

    4. **Volumes fermes sur les 8 références** au niveau actuel, avec **préavis écrit de 90 jours** sur
    toute réduction. C''est notre réponse au −11 % du T2, et c''est une clause non négociable de notre
    côté.

    5. **Sur l''exclusivité :** elle reste discutable, mais elle a un prix. Nous l''envisagerons contre
    des **volumes fermes sur les trois années** et une **pénalité symétrique de 1,2 M€** à la charge de
    D en cas de sous-livraison. Un engagement réciproque, ou pas d''engagement.


    **Enveloppe de signature pré-autorisée.** Le comité peut signer sans moi un accord réunissant **toutes**
    ces conditions, sans exception :


    - durée ≤ 12 mois ;

    - aucune clause d''exclusivité, sous quelque rédaction que ce soit (y compris « priorité », « préférence
    », « droit de premier refus » élargi) ;

    - remise effective ≤ 4 points en facturation directe, le solde en remise arrière conditionnée aux
    volumes réalisés ;

    - volumes fermes ≥ niveau actuel sur les 8 références ;

    - préavis de réduction ≥ 90 jours ;

    - pénalité de sortie à notre charge ≤ 150 k€.


    **Si une seule condition n''est pas remplie : vous ne signez pas.** Vous n''arbitrez pas, vous ne
    pondérez pas, vous ne cherchez pas l''esprit du texte. Vous maintenez la position et vous attendez
    le 31 août. Une conversation de trois semaines n''a jamais tué une entreprise ; une signature de trois
    ans, si.


    **Discipline d''interlocution :** un seul canal, le Directeur commercial. Aucun membre du comité ne
    prend d''appel bilatéral de D sur ce dossier. Tout échange est confirmé par écrit dans les 24 h et
    diffusé au comité. La pression fonctionne sur un interlocuteur fragmenté ; elle ne fonctionne pas
    sur un interlocuteur unique et écrit.


    ## 6. Ce qui se lance immédiatement, sans attendre D


    Ces chantiers ne sont pas conditionnés à la réponse de D. Ils démarrent le 10 août.


    | # | Action | Responsable | Échéance |

    |---|---|---|---|

    | 1 | **Mobiliser le poste client** : affacturage ou cession Dailly sur les créances D. Cible : 1,5–2
    M€ de ligne confirmée. Négocier **maintenant**, pendant que la situation est bonne. Signaler d''emblée
    la concentration sur un débiteur unique — c''est le point de blocage prévisible. | DAF | 22 août |

    | 2 | **Marketplace** : contractualisation, référencement, logistique, tarifs. Budget plafonné à **120
    k€**, aucun CDI. **Préparation seulement — pas de mise en ligne commerciale avant mon retour.** |
    Dir. commercial | 30 août |

    | 3 | **Centrale régionale** : relance formelle, demande de décision anticipée ou de référencement
    partiel dès octobre. Offre complète déposée. | Dir. commercial | 20 août |

    | 4 | **Identifier 5 clients secondaires** (RHF, discount, MDD industrielle), premiers contacts pris.
    | Dir. commercial | 30 août |

    | 5 | **Cartographier le plan de charge de Redon** : quelles références l''alimentent, à quel niveau
    de perte on passe sous 70 %. | Dir. industriel | 18 août |

    | 6 | **Préparer le dossier de chômage partiel** — instruire, ne pas déposer. | DRH | 25 août |

    | 7 | **Gel** : aucun capex > 50 k€, aucun recrutement CDI, aucun engagement fixe nouveau. | Tous
    | permanent |

    | 8 | **Trésorerie glissante 13 semaines**, actualisée chaque vendredi et diffusée au comité. | DAF
    | hebdomadaire |


    ## 7. Règles de décision — appliquer sans arbitrage


    - **D refuse le contre-projet ou ne répond pas** → aucune action. Ce n''est pas une rupture, c''est
    une négociation en cours. On reprend le 31 août.

    - **D confirme le déréférencement de 4 références** → accusé de réception écrit, demande du calendrier
    précis et des volumes concernés, **aucune contre-offre**. On active les chantiers §6. Le comité d''achat
    est en septembre : je serai rentré.

    - **D propose une exclusivité « allégée »** (durée réduite, remise moindre, périmètre restreint) →
    **c''est un refus.** Toute exclusivité, sous toute forme, est hors enveloppe.

    - **D émet un ultimatum, une menace de rupture totale, ou exige une réponse sous 24 h** → réponse
    type : *« La direction générale a arrêté sa position, elle est dans notre courrier du 12 août. Aucune
    décision complémentaire ne sera prise avant le 31 août. »* Rien d''autre. On ne se justifie pas, on
    ne réouvre pas.

    - **Trésorerie < 1,5 M€** → activation immédiate du plan de financement (#1), information du président
    du conseil sous 24 h.

    - **Rumeur ou question interne / CSE** → ligne factuelle unique : *« Une négociation commerciale est
    en cours avec un partenaire. Aucune décision affectant l''emploi n''est prise. La direction informera
    le CSE dès qu''il y aura quelque chose à dire. »* Aucun engagement, aucune anticipation, aucun démenti
    au-delà de cela.

    - **Fait réellement nouveau et non prévu ici** (dépôt de bilan de D, offre de rachat, sinistre industriel)
    → le comité se réunit sous 24 h, formalise par écrit, et saisit le **président du conseil**, seul
    habilité à décider en mon absence. **Position par défaut en cas de désaccord ou de doute : ne rien
    signer.**


    ## 8. À établir avant mon retour


    - **Marge brute réelle par référence et par site** — le raisonnement ci-dessus suppose 31 % partout,
    ce qui est certainement faux. Si les 4 références menacées sont nos plus rentables, la conclusion
    se durcit ; si ce sont les moins rentables, une partie de la menace se dégonfle. Nous ne devons plus
    discuter ce dossier avec une moyenne. *(DAF, 20 août.)*

    - **Réconciliation charges fixes / marge brute** : 2,1 M€ ≈ 3 mois implique ~8,4 M€ de charges fixes
    annuelles, pour 7,44 M€ de marge brute. Soit la structure n''est pas couverte, soit le périmètre «
    charges fixes » intègre des coûts variables de production. Cet écart change le point mort et l''autonomie
    réelle. À trancher en priorité. *(DAF, 18 août.)*

    - **Analyse juridique complète du projet de contrat D** : caractère exécutoire de l''engagement de
    volume, sanctions en cas de sous-livraison, périmètre exact de l''exclusivité, conditions de déclenchement
    de la pénalité. *(DAF + conseil, 12 août.)*

    - **Chiffrage du coût d''opportunité de l''exclusivité** : centrale + marketplace, fourchette basse
    et haute. *(Dir. commercial, 25 août.)*


    ## 9. Condition de révision


    Cette note est révisable par moi seul, à mon retour, ou par le président du conseil dans le cas strict
    du §7. Elle sera réexaminée le **31 août** au vu de la réponse de D, de la trésorerie constatée et
    des éléments du §8.


    Un seul point à retenir si tout le reste s''efface : **on ne signe pas.** Le reste est de l''exécution.


    ---


    *Un point d''attention, non pas contre cette note mais sur ce qu''elle révèle : le vrai problème n''est
    pas le contrat de D, c''est qu''un client puisse peser 62 % de notre activité. Même si D revient à
    de meilleures dispositions en septembre, nous aurons à traiter cela. Ce sera le sujet du comité stratégique
    de septembre, et il ne sera pas facultatif.*


    **[Signature — Direction générale]**


    ---


    Deux remarques, hors note.


    Le calendrier joue pour vous : l''échéance de huit jours tombe pendant votre absence, mais le comité
    d''achat de D est en septembre — après votre retour. Autrement dit, la seule décision réellement irréversible
    est celle qu''on vous demande de prendre à l''aveugle, et toutes les décisions qui comptent vraiment
    peuvent attendre le 31 août. La note exploite cet écart : elle bloque l''irréversible et repousse
    le reste.


    Le chiffre le plus important de la note est celui du §8 sur les charges fixes. Si les 8,4 M€ sont
    exacts, Verdal perd déjà de l''argent avant même de discuter avec D, et l''urgence est ailleurs. Je
    l''ai signalé comme point à trancher plutôt que comme conclusion, parce que les deux lectures sont
    plausibles avec les données fournies — mais si vous ne devez vérifier qu''une chose avant de partir,
    c''est celle-là.


    Je peux enregistrer la note dans un fichier ou la publier en page partageable si le comité doit y
    accéder à distance.

    '
