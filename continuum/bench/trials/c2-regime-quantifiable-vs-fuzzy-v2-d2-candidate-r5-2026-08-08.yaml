response:
  text: '# Note au conseil — arbitrage de l''enveloppe unique de 900 000 €


    **Objet :** dossiers A (usinage) et B (succession qualité). Décision demandée jeudi.


    ---


    ## 1. Ce que nous proposons de décider


    | Rang | Ligne | Montant | Motif du rang |

    |---|---|---|---|

    | 1 | Transfert de la fonction qualité : promotion de l''adjointe **+** mission de transition du directeur
    sortant | 135 000 € | Seule ligne dont l''échec n''est pas rattrapable |

    | 2 | Mandat de recrutement externe, signé et provisionné, déclenchable sur signal | 145 000 € | Repli
    de la ligne 1, sans valeur s''il n''est pas engagé cet exercice |

    | 3 | Usinage, tranche 1 : les 3 machines les plus défaillantes | 310 000 € | Rendement mesuré, perte
    récupérable |

    | 4 | Usinage, tranches 2 et 3 : les 3 machines restantes | 310 000 € | Même conditions unitaires,
    rendement à confirmer |

    | | **Total** | **900 000 €** | |


    ## 2. Pourquoi il n''y aura pas de tableau unique en euros


    Le président demande un classement des deux dossiers sur le même indicateur de rendement. Nous ne
    le fournissons pas, pour une raison technique et non de principe : les lignes du dossier A ont un
    numérateur mesuré (heures d''arrêt, coût d''immobilisation, marge horaire), les lignes du dossier
    B n''en ont aucun. Les ranger sur la même échelle ne les compare pas, cela place mécaniquement B en
    dernier et fait sortir du conseil la seule décision irréversible des deux.


    Le classement ci-dessus est unique et se lit d''un coup d''œil. Sa règle n''est pas le rendement mais
    l''ordre d''engagement : ce qui ne se rattrape pas d''abord, ce qui se mesure ensuite.


    **Nous retirons également du dossier la cotation du cabinet RH** (35 % de rupture, 4,2 M€, criticité
    7,5). Elle provient de trois consultants n''ayant jamais exercé dans le dispositif médical, réunis
    en atelier, sans base historique et sans précédent interne dans l''entreprise. Ce n''est pas une mesure
    ; portée au procès-verbal, elle sera citée l''an prochain comme telle. Les faits qui fondent la décision
    sur B sont vérifiables sans elle : deux clients représentant **31 % du chiffre d''affaires** déclarent
    la relation attachée à une personne, et cette personne est **le seul interlocuteur reconnu par l''organisme
    notifié**.


    ## 3. Dossier B — décision : engager les deux pistes, pas l''une des trois


    Les RH présentent trois options exclusives. Elles ne le sont pas. La promotion de l''adjointe (45
    000 €) désigne le successeur ; la mission de transition du sortant (90 000 €) est ce qui transfère
    effectivement la relation. Prises séparément, la première laisse l''adjointe sans légitimité acquise
    auprès de l''organisme notifié, la seconde repousse le problème de douze mois. Ensemble, elles ouvrent
    une fenêtre de recouvrement de 23 mois pour 135 000 €, soit moins de la moitié du recrutement externe.


    Condition de forme, non négociable : la mission de transition n''est pas une astreinte de conseil.
    Elle porte co-signature des dossiers réglementaires, présentation conjointe à l''organisme notifié,
    et visite conjointe des deux clients hospitaliers avec transfert nominatif du contact. Un pouvoir
    réel est transféré, pas un accès téléphonique.


    **Pire cas :** l''adjointe n''est pas reconnue, le repli échoue, nous perdons l''interlocuteur de
    certification. **Qui l''encaisse :** l''entreprise et ses 140 salariés, mais aussi les deux hôpitaux,
    sur la continuité d''approvisionnement de dispositifs de diagnostic. C''est la seule branche des deux
    dossiers dont on ne revient pas.


    **Repli et déclencheur observable :** si, au sixième mois de transition, l''organisme notifié n''a
    pas accepté l''adjointe comme interlocuteur désigné par écrit, ou si l''un des deux hôpitaux formule
    une réserve écrite, le mandat de recrutement externe est activé — d''où sa provision en ligne 2.


    ## 4. Dossier A — décision : acheter, mais par tranches ordonnées


    Sur 5 ans, les données auditées donnent 213 000 € de coût direct d''immobilisation et 1 810 heures
    perdues, soit 68 780 € de marge à 38 €/h. Total 281 800 €, environ 56 400 € par an sur le parc complet.
    Rapporté à 620 000 €, ce seul poste rembourse en onze ans : il ne justifie pas à lui seul le renouvellement.


    Le gain de rebut (4,1 % → 1,2 % garanti) est probablement le poste dominant, et nous ne pouvons pas
    le chiffrer : il manque la valeur de production annuelle passée sur ces six machines. **C''est la
    grandeur à apporter jeudi**, elle est disponible en comptabilité analytique.


    Deuxième information manquante et immédiatement disponible : la maintenance est horodatée et auditée,
    donc la répartition des 47 pannes machine par machine existe. Si elles sont concentrées, la tranche
    1 capte l''essentiel du gain pour la moitié du prix. Si elles sont uniformes, les trois tranches se
    valent et l''ordre n''a plus d''importance. Les deux chiffres se sortent avant jeudi et décident du
    séquencement, pas du principe.


    **Pire cas :** nous achetons six machines quand trois suffisaient — environ 310 000 € immobilisés
    à faible rendement, sur un actif revendable. **Qui l''encaisse :** notre trésorerie, personne d''autre.
    C''est un mauvais tirage, pas une ruine, et il ne justifie pas de retarder l''engagement : l''enveloppe
    n''est pas reconductible et les machines ont 14 ans.


    ## 5. L''argument contraire, et pourquoi il ne renverse pas la décision


    Le meilleur argument contre cette répartition : puisque le non-engagé est perdu et que le fournisseur
    garantit 96 % de disponibilité sur 7 ans avec pénalités, prendre le parc complet à 620 000 € et traiter
    la succession en interne à 45 000 € libérerait 235 000 € de marge de manœuvre pour un risque contractuellement
    couvert.


    Il tient sur A — c''est d''ailleurs pourquoi nous engageons les six machines. Il ne tient pas sur
    B : aucune pénalité contractuelle ne couvre la perte d''un agrément, et 235 000 € ne rachètent pas
    22 ans de relation avec un organisme notifié.


    ## 6. Ce qui renverserait ces décisions


    Si l''organisme notifié confirme par écrit que la certification est attachée au système qualité et
    non à la personne, **et** que les deux hôpitaux confirment par écrit une relation contractuelle et
    non personnelle, alors B redevient une succession ordinaire à 45 000 € et l''enveloppe bascule intégralement
    sur A. Ces deux courriers coûtent quelques semaines et rien d''autre.


    **Première action, cette semaine :** demander les deux confirmations écrites, sortir la répartition
    des pannes par machine et la valeur de production associée. Ces trois pièces arrivent avant jeudi
    et arment le vote.


    ---


    Deux points à valider avec la direction financière avant diffusion : que le mandat de recrutement
    conditionnel (ligne 2) soit bien comptabilisé comme engagement de l''exercice sur signature — sinon
    la ligne est fictive et il faut lui trouver un autre emploi ; et le prix unitaire par tranche, que
    j''ai supposé à 620 000 / 6 ≈ 103 300 €, à confirmer auprès du fournisseur.

    '
