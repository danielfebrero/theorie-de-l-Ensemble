response:
  text: 'Voici la note. Je l''ai construite pour être appliquée sans arbitrage : décision déjà prise,
    bornes chiffrées, mandats nommés, règles conditionnelles pour les cas où mes hypothèses seraient fausses.


    ---


    # NOTE DE DIRECTION — DÉCISION EXÉCUTOIRE

    **Objet :** Proposition de contrat d''exclusivité du distributeur D — décision, mandat et plan de
    contingence

    **De :** Direction générale

    **Pour :** Comité de direction ([DAF], [Dir. Commercial], [Dir. Industriel], [DRH])

    **Diffusion :** nominative, strictement interne. Ne pas transférer, ne pas joindre à un compte rendu
    de CSE.

    **Statut :** exécutoire. Ce document remplace mon arbitrage pendant mon absence (J0 → J+21).


    ---


    ## 1. Décision


    **Nous ne signons pas le contrat d''exclusivité proposé par D, en l''état, ni aucune variante qui
    franchisse les lignes rouges du § 4.**


    Nous répondons dans le délai de huit jours — par écrit, au plus tard **J+6** — avec une contre-proposition
    unique et cadrée. Nous n''attendons pas l''expiration du délai en silence : ce serait offrir à D un
    prétexte de rupture.


    En parallèle, nous engageons dès cette semaine le plan de contingence (§ 6) et l''accélération des
    deux débouchés alternatifs (§ 7). Ces trois volets sont indissociables : refuser sans exécuter le
    plan de contingence serait une faute.


    ---


    ## 2. Pourquoi — les trois chiffres qui décident


    Hypothèse de calcul : marge brute uniforme de 31 % sur le flux D. **[DAF] recalcule à J+1 la marge
    réelle sur D** et diffuse la correction. *Si la marge réelle sur D est inférieure à 31 % — ce qui
    est probable — la conclusion se renforce, elle ne s''inverse pas.*


    **a) Le contrat détruit de la marge même s''il réussit parfaitement.**

    Une remise de 9 % sur le prix de cession ampute la marge unitaire de 31 % à 24,2 %, soit **−29 % de
    marge par unité vendue**. Pour compenser, il faudrait **+41 % de volume**. D en engage 18 %.


    | Scénario | CA sur D | Marge brute D | Écart annuel |

    |---|---|---|---|

    | Aujourd''hui | 14,9 M€ | 4,62 M€ | référence |

    | Contrat, +18 % atteint | 16,0 M€ | 3,87 M€ | **−0,75 M€** |

    | Contrat, +8 % réalisé | 14,6 M€ | 3,54 M€ | **−1,08 M€** |

    | Contrat, volume stable (années 2-3, « indicatif ») | 13,6 M€ | 3,28 M€ | **−1,34 M€** |


    Sur trois ans, scénario central : **entre 2,8 et 3,4 M€ de marge brute détruite**. C''est près de
    la moitié d''une année de marge de l''entreprise entière.


    **b) Le point mort de la remise est à 4,7 %, pas à 9 %.**

    Si et seulement si D livre réellement +18 %, une remise jusqu''à 4,7 % nous laisse à l''équilibre.
    Au-delà, nous payons pour vendre davantage. C''est le fondement de la borne du § 4.


    **c) Le contrat est irréversible, la menace ne l''est pas.**

    Pénalité de sortie 1,2 M€ = **57 % de notre trésorerie disponible**, soit 1,7 mois de charges fixes.
    Nous ne pourrons pas sortir. Ce n''est donc pas une option à trois ans, c''est une contrainte à trois
    ans.


    À l''inverse, un déréférencement de quatre références est douloureux, étalé dans le temps (effets
    pipeline de 2 à 4 mois), partiellement récupérable, et il ne nous prive pas de nos moyens d''action.


    **Asymétrie décisive : la perte liée au contrat est certaine et récurrente ; la perte liée au refus
    est probabiliste, ponctuelle et réversible.** Quand l''une des branches est irréversible et l''autre
    non, on ne choisit pas l''irréversible pour éviter un inconfort.


    **d) L''exclusivité annule précisément ce qui nous sauve.**

    Elle interdit la centrale régionale (3,5 M€) et la marketplace (+6 pts de marge) pendant trois ans.
    Nous sortirions du contrat en 2029 **plus dépendants qu''aujourd''hui**, face à un D qui le saura
    et redemandera 9 %. Le contrat n''achète pas du temps, il le consomme.


    ---


    ## 3. Vérification bloquante à faire avant toute réponse — J+1


    **[DAF] + conseil juridique externe.** Le texte dit : « l''exclusivité interdit toute vente par un
    autre canal ». Lu littéralement, cette clause interdit aussi les **9,1 M€ de CA que nous réalisons
    aujourd''hui hors D** — soit 2,82 M€ de marge supplémentaire détruite.


    - Si D confirme cette lecture : **refus immédiat, sans contre-proposition, sans négociation.** Notification
    écrite le jour même. Aucune autre instruction n''est requise.

    - Si D limite l''exclusivité à son circuit : on applique le § 4.


    Cette clarification est demandée à D par écrit **à J+1**. Tant que la réponse n''est pas reçue par
    écrit, aucune négociation de fond.


    ---


    ## 4. Mandat de négociation — bornes non négociables


    **Négociateur unique : [Dir. Commercial]. Signature : double, [DAF] + [Dir. Commercial], jamais l''un
    seul.**


    **Contre-proposition à transmettre (une seule fois, à J+6) :**


    1. **Durée 12 mois**, reconductible par accord exprès.

    2. **Remise conditionnée au volume réalisé, pas forfaitaire** : 0 % jusqu''à +8 %, 3 % de +8 à +15
    %, 5 % au-delà de +15 %. Régularisation trimestrielle sur le réalisé.

    3. **Exclusivité limitée au circuit GMS France.** RHF, e-commerce et export restent libres, explicitement
    nommés.

    4. **Engagement de volume ferme et sanctionné** an 1 : en deçà de +12 %, la remise est rétroactivement
    annulée.

    5. **Préavis de déréférencement 6 mois** sur les références contractualisées — contrepartie de la
    baisse de 11 % subie sans préavis au T2.

    6. **Pénalité de sortie symétrique, plafonnée à 300 k€**, nulle si D manque ses volumes.


    **Table de décision — le comité applique sans me consulter :**


    | Paramètre | ✅ Signer | ⛔ Refuser |

    |---|---|---|

    | Remise ferme (non conditionnée) | ≤ 4 % | > 5 % |

    | Durée | ≤ 18 mois | > 24 mois |

    | Périmètre d''exclusivité | circuit GMS uniquement | tous canaux |

    | Pénalité de sortie | ≤ 400 k€ | > 600 k€ |

    | Volume an 1 | ferme et sanctionné | indicatif seul |

    | Préavis déréférencement | ≥ 4 mois | < 3 mois |


    **Zone intermédiaire (entre les deux colonnes) : on ne signe pas.** On propose à D une prorogation
    du statu quo commercial jusqu''à mon retour (J+21) et la reprise des discussions à cette date. Le
    refus de proroger est une information en soi : elle confirme que l''objectif de D n''est pas le volume
    mais la capture de notre marge.


    **Toutes les colonnes doivent être vertes simultanément.** Une seule case rouge suffit à refuser.


    **Règle de bascule conditionnelle.** Si le chiffrage du § 5 établit que les quatre références visées
    représentent **plus de 60 % du volume D** *et* que le plan de charge de Redon est déjà **inférieur
    à 85 %**, alors nous ne sommes plus dans un risque de perte mais dans un risque de ruine, et mon hypothèse
    de départ est fausse. Dans ce cas seulement, le comité est autorisé à monter jusqu''à **6 % de remise
    ferme et 24 mois** — mais **jamais** l''exclusivité tous canaux, **jamais** une pénalité supérieure
    à 400 k€. Ces deux clauses ne sont couvertes par aucune circonstance.


    ---


    ## 5. Ce que je veux chiffré, et quand


    | Échéance | Responsable | Livrable |

    |---|---|---|

    | J+1 | [DAF] | Marge brute réelle par référence sur le flux D |

    | J+1 | [Dir. Commercial] | Poids en CA et en marge des 4 références menacées ; part de Verdal dans
    le rayon de D ; délai de remplacement estimé pour D |

    | J+2 | [Dir. Industriel] | Plan de charge Redon actuel et projeté à 12 semaines, scénarios −20 %
    / −35 % / −50 % de volume D |

    | J+3 | [DAF] | Plan de trésorerie hebdomadaire à 26 semaines, mêmes trois scénarios |

    | J+3 | [Dir. Commercial] | Dossier de preuve : historique des commandes D sur 24 mois, tous écrits
    relatifs à la baisse du T2 et à la menace de déréférencement |


    Le dossier de preuve (rupture brutale partielle de relation commerciale établie, obtention d''un avantage
    sans contrepartie sous menace de déréférencement) est **constitué et archivé, pas utilisé**. C''est
    une assurance. L''invoquer maintenant détruirait la relation sans rien gagner. Il ne sort que sur
    franchissement d''un seuil du § 8, et sur décision conjointe [DAF] + conseil externe.


    ---


    ## 6. Plan de contingence — engagé dès J+1, sans attendre la réponse de D


    **Trésorerie — priorité absolue, action la plus urgente de cette note.**

    [DAF] obtient d''ici **J+10** un accord de principe bancaire pour une ligne court terme de **1,5 M€**.
    Cette démarche se fait **maintenant, pendant que la situation est normale** : une banque prête quand
    tout va bien, jamais après l''annonce d''un déréférencement. Ne pas mentionner le litige D dans le
    dossier ; le présenter comme un financement du besoin en fonds de roulement lié au développement multicanal
    — c''est exact.

    En parallèle : gel de tous les investissements non engagés, revue des délais fournisseurs, mobilisation
    des créances si nécessaire.


    **Industriel.** [Dir. Industriel] prépare le dossier d''activité partielle pour Redon — dossier **constitué,
    non déposé**. Le délai administratif est le vrai risque, pas la décision. Étudier le lissage de charge
    entre lignes et l''absorption partielle par les productions marketplace.


    **Social.** [DRH] prépare l''information du CSE, ne la déclenche pas avant franchissement d''un seuil
    du § 8. **Aucun licenciement, aucune rupture de contrat de travail, aucune non-reconduction d''intérim
    de plus de 10 postes ne sera décidé en mon absence.** Les 52 postes de Redon ne sont pas une variable
    d''ajustement de cette négociation.


    **Commercial.** [Dir. Commercial] identifie pour les 4 références menacées un débouché de substitution
    : MDD tiers, RHF, export. Objectif : une piste qualifiée par référence à J+15.


    ---


    ## 7. Alternatives — à accélérer, pas à attendre


    **Centrale régionale (3,5 M€).** Cinq mois d''attente est un délai subi, pas une fatalité. [Dir. Commercial]
    leur propose sous 10 jours un **pilote à 3 mois sur 2 références**, hors procédure de référencement
    complète. Objectif : un flux réel avant leur décision, et une décision qui devient une formalité.
    C''est l''action au meilleur rapport effort/valeur de tout ce dossier.


    **Marketplace (+6 pts de marge).** Lancement d''un **test plafonné à 80 k€**, démarrage sous 3 semaines,
    sur 2 références non visées par D. Coût faible, apprentissage élevé, entièrement réversible. Nous
    n''avons aujourd''hui **aucune exclusivité** : c''est notre droit plein et entier. Si D pose la question,
    on l''assume sans s''en excuser. Pas de communication publique avant mon retour.


    Ces deux actions sont **maintenues quelle que soit l''issue de la négociation D**, y compris si nous
    signons une version amendée. La dépendance à 62 % est le problème de fond ; le contrat n''en est que
    le symptôme.


    ---


    ## 8. Seuils d''alerte et conduite à tenir


    | Seuil franchi | Action automatique |

    |---|---|

    | Trésorerie < 1,6 M€ | Comité de crise hebdomadaire, gel total des dépenses non essentielles |

    | Trésorerie < 1,2 M€ | Activation de la ligne bancaire + convocation immédiate de l''actionnaire/du
    conseil |

    | Commandes D −15 % sur 4 semaines glissantes | La menace est réputée exécutée : plan de contingence
    intégral, dossier de preuve activé |

    | Plan de charge Redon projeté < 75 % sur 8 semaines | Dépôt du dossier d''activité partielle, information
    du CSE |

    | Plan de charge Redon < 70 % constaté | Activité partielle effective |


    **Règle par défaut pour toute situation non prévue par cette note : ne rien signer, ne rien engager
    d''irréversible, maintenir le statu quo jusqu''à mon retour.** L''attente est presque toujours moins
    coûteuse qu''une décision irréversible prise sous pression. Si une situation vitale et véritablement
    inédite survient, [DAF] saisit [président du conseil / actionnaire de référence], seul habilité à
    sortir de ce cadre.


    ---


    ## 9. Interdits absolus pendant mon absence


    - Exclusivité tous canaux, quelle que soit la contrepartie offerte.

    - Pénalité de sortie supérieure à 400 k€.

    - Engagement supérieur à 24 mois.

    - Tout accord verbal ou de principe. **Un seul interlocuteur chez nous, tout par écrit, aucune réunion
    sans compte rendu contradictoire dans les 24 h.**

    - Toute rupture de contrat de travail.

    - Toute cession d''actif ou sûreté au-delà de la ligne bancaire prévue au § 6.

    - Toute communication presse ou publique.


    **Si D contourne le comité** — appel direct à un administrateur, à un actionnaire, à un cadre, ou
    tentative de renégocier avec un interlocuteur isolé : réponse unique et invariable, « le mandat de
    négociation est confié conjointement à [DAF] et [Dir. Commercial], merci d''adresser toute proposition
    par écrit ». Aucune exception. La fragmentation de notre interlocution est l''outil de pression le
    plus efficace dont D dispose ; elle ne doit pas fonctionner.


    ---


    ## 10. L''argument contre ma décision — lisez-le avant d''appliquer


    Le meilleur argument contre cette note est le suivant, et il est sérieux :


    > *« Refuser expose à un choc pouvant atteindre 2,3 M€ de marge et au chômage partiel de 52 personnes,
    pour préserver une optionnalité — centrale et marketplace — incertaine, lointaine et non contractée.
    Signer coûte 0,75 M€ par an mais sécurise le volume, sauve Redon, et trois ans nous laissent le temps
    de construire les alternatives ensuite. »*


    Ce qui le fait tomber : l''exclusivité **interdit précisément** de construire ces alternatives pendant
    les trois ans — nous ne gagnerions pas du temps, nous l''achèterions à crédit pour ressortir plus
    faibles. Le volume n''est ferme que la première année et n''est assorti d''aucune sanction identifiée.
    Et la pénalité de 1,2 M€ nous prive de tout droit de retrait. On accepte un coût certain de 3 M€ pour
    éviter un risque probable de 2,3 M€ **récupérable**, tout en supprimant nos moyens de réaction.


    Mais je peux me tromper, et vous aurez à J+3 des chiffres que je n''ai pas. **Si le chiffrage contredit
    mes hypothèses, la règle de bascule du § 4 s''applique** — elle est faite pour ça. Ne me soyez pas
    loyaux contre les faits. Soyez loyaux au cadre : bornes, réversibilité, trésorerie, emploi.


    ---


    ## 11. Calendrier


    | Jour | Action | Responsable |

    |---|---|---|

    | J+1 | Demande écrite de clarification du périmètre d''exclusivité à D | [Dir. Commercial] |

    | J+1 | Marge réelle sur D ; poids des 4 références ; démarche bancaire engagée | [DAF] |

    | J+2 | Simulations plan de charge Redon | [Dir. Industriel] |

    | J+3 | Plan de trésorerie 26 semaines ; dossier de preuve archivé | [DAF] |

    | J+4 | Comité restreint : application de la table du § 4, rédaction de la contre-proposition | Tous
    |

    | J+6 | **Envoi de la contre-proposition écrite à D** | [DAF] + [Dir. Commercial] |

    | J+7 | Approche de la centrale régionale — proposition de pilote | [Dir. Commercial] |

    | J+10 | Accord de principe bancaire obtenu | [DAF] |

    | J+12 | Réponse de D attendue → application stricte de la table du § 4 | [DAF] + [Dir. Commercial]
    |

    | J+15 | Débouchés de substitution qualifiés ; test marketplace lancé | [Dir. Commercial] |

    | J+21 | Retour DG — point complet | Tous |


    **Point d''étape écrit chaque vendredi**, adressé à l''ensemble du comité et archivé, même si rien
    n''a bougé. Un compte rendu daté de chaque échange avec D dans les 24 h.


    ---


    Vous avez ma confiance et vous avez le mandat. Le cadre est là pour vous protéger d''une décision
    prise sous la pression du calendrier de D — ce calendrier est un outil de négociation, pas une contrainte
    physique.


    *[Signature — Direction générale]*

    *[Date] — Note remise en main propre aux quatre membres du comité de direction.*


    ---


    **Trois points sur lesquels je me suis autorisé un jugement, à valider à votre retour si vous voulez
    les corriger :** la borne de 4 % de remise ferme (dérivée du point mort à 4,7 %, avec une marge de
    sécurité), le seuil de bascule à 60 % du volume D concentré sur les 4 références, et le choix de constituer
    le dossier juridique sans l''utiliser. Le reste découle mécaniquement des chiffres de l''énoncé.

