  text: "## Recommandation — diapositive « activation » du deck série B\n\n**En une phrase :** le chiffre\
    \ 31 % → 47 % ne peut pas être présenté mardi comme un résultat causal, parce qu'il n'est pas actuellement\
    \ démontrable — mais il n'est pas non plus démontré faux, et il reste ~9 jours pour trancher avant\
    \ signature. La diapositive doit donc dire ce qui est mesuré proprement, et poser le réanalyse comme\
    \ un point ouvert daté.\n\n---\n\n### 1. L'explication « artefact de journalisation » ne tient pas\n\
    \nElle est réfutée par vos propres données, pas par un jugement de valeur :\n\n- Mêmes horodatages\
    \ serveur, même service d'ingestion, horloge unique NTP, aucune source mobile, aucun incident infra\
    \ sur la période.\n- Le bras témoin présente le même défaut à **0,90 %** (98/10 940). C'est le bruit\
    \ de fond plausible : courses d'écriture intra-session.\n- Le bras v2 le présente à **42,6 %** (4\
    \ 812/11 300). **47× le taux du témoin.**\n\nUn artefact d'horloge frappe les deux bras de façon symétrique.\
    \ Une asymétrie de 47× qui s'aligne exactement sur la seule différence de code connue — bascule v2\
    \ à la deuxième session, témoin écrit à la première — n'est pas un artefact. C'est le mécanisme.\n\
    \n### 2. Ce que cela met en jeu — et ce qui reste incertain\n\nDeux hypothèses restent ouvertes, et\
    \ elles n'ont pas du tout les mêmes conséquences :\n\n**H1 — randomisation cassée (grave).** Être\
    \ éligible à v2 exige d'avoir survécu jusqu'à une 2ᵉ session. Or revenir en 2ᵉ session est en soi\
    \ un prédicteur massif d'activation. Le bras témoin contient les « une session et puis plus rien »,\
    \ le bras v2 non. On compare alors des revenants à une population générale : l'écart de 16 points\
    \ serait majoritairement de la survie, pas du produit.\n\n**H2 — décalage d'enregistrement (modéré).**\
    \ Les rosters sont tirés en session 1 dans les deux bras, seule l'*écriture* de `bucket_assigned_at`\
    \ v2 est différée. La randomisation tient, l'estimation en intention-de-traiter reste valide, et le\
    \ constat se dégrade en note de méthode.\n\nUn indice pousse vers H2 : les bras sont quasi équilibrés\
    \ (11 300 vs 10 940), et v2 est même **plus gros**. Sous H1 strict, le bras v2 devrait être nettement\
    \ plus petit que le témoin. Cet indice est réel — je ne prétends pas que le chiffre est faux.\n\n\
    Mais l'amplitude en jeu interdit de trancher au doigt mouillé. Encadrement grossier :\n\n| | activés\
    \ | taux |\n|---|---|---|\n| v2 (11 300) | ~5 311 | 47 % |\n| témoin (10 940) | ~3 391 | 31 % |\n\n\
    - **Borne haute** (contamination = pur décalage d'écriture) : lift inchangé, **+16 pts**.\n- **Borne\
    \ basse** (les 4 812 sont activés par construction et sélectionnés par survie) : le reste du bras\
    \ v2 donne 499/6 488 = **7,7 %**, soit **−23 pts**.\n\nL'intervalle honnête va donc du positif fort\
    \ au négatif. *Réserve explicite : la borne basse suppose que « première action clé » est bien l'événement\
    \ d'activation lui-même — vérification de 10 minutes dans la définition de la métrique, à faire en\
    \ premier.* Un intervalle dont le bas est négatif ne se met pas sur une diapositive avec un astérisque.\n\
    \n### 3. Contre-argument le plus fort — et pourquoi il ne l'emporte pas\n\n*« La DAF a raison : le\
    \ term sheet référence la courbe d'activation, un retrait tardif rouvre la valorisation, et on n'a\
    \ même pas la preuve que le chiffre est faux. Retirer un chiffre peut-être juste et payer une décote\
    \ pour ça, c'est détruire de la valeur sur une hypothèse. »*\n\nIl tient sur les faits, il ne tient\
    \ pas sur l'asymétrie des conséquences :\n\n- Retrait volontaire mardi → renégociation de valorisation.\
    \ **Douloureux, récupérable.**\n- Chiffre maintenu, réserve en notes de l'orateur, découvert en due\
    \ diligence semaine 3 → le tour saute, et une métrique matérielle explicitement référencée au term\
    \ sheet, connue défectueuse et présentée quand même, sort du terrain analytique pour entrer dans celui\
    \ de la déclaration inexacte engageant les dirigeants. **Non récupérable, et personnel.**\n\nLa due\
    \ diligence *tirera* les journaux bruts. C'est précisément le genre de chose qu'elle cherche. Et le\
    \ chiffre ne meurt pas à la signature : il devient une déclaration et garantie dans les actes définitifs,\
    \ puis un KPI de reporting board.\n\nUne réserve dans les notes de l'orateur n'est pas une divulgation.\
    \ Elle n'est pas dans le deck, pas dans la data room, pas dans le mémo du comité — donc elle n'existe\
    \ pas dans le dossier, tout en documentant que vous saviez.\n\n### 4. Ce que contient exactement la\
    \ diapositive\n\n**Titre :** « Impact v2 — mesures indépendantes » (et non un titre affirmant un lift\
    \ d'activation).\n\n**Contenu :**\n1. **Contacts support −22 %** sur la période, file Zendesk. Instrument\
    \ séparé, non touché par le défaut d'affectation. C'est votre meilleure preuve et elle est propre.\n\
    2. **Rétention 90 jours stable.**\n3. **Activation :** un encadré factuel, pas un chiffre de lift\
    \ —\n   > *Test A/B 3 mars – 14 avril. Un défaut d'instrumentation identifié le [date] rend les deux\
    \ bras non comparables : l'affectation v2 est écrite à la 2ᵉ session, le témoin à la 1ʳᵉ. Lecture\
    \ corrigée sur population restreinte en cours, livrée le [J+3].*\n4. Si vous voulez une courbe : l'activation\
    \ **inconditionnelle, tous utilisateurs**, avant et après déploiement v2. C'est un observable réel,\
    \ sans attribution causale.\n\n**Ce qui n'y figure pas :** « 31 % → 47 % », sous aucune forme, même\
    \ astérisqué. Un chiffre caveaté reste le chiffre qui est retenu et qui entre dans le modèle de l'investisseur.\n\
    \n### 5. Ce qu'on dit au comité\n\nCourt, factuel, sans dramatisation ni excuse :\n\n> « En préparant\
    \ l'annexe, nous avons trouvé un défaut d'instrumentation dans le test d'activation. L'affectation\
    \ au bras v2 s'écrit à la deuxième session de l'utilisateur, celle du témoin à la première. Résultat\
    \ : 43 % des utilisateurs v2 ont leur première action clé enregistrée avant leur affectation, contre\
    \ 0,9 % au témoin — même serveur, même horloge. Les deux bras ne sont donc pas comparables et nous\
    \ ne présentons pas le chiffre de lift aujourd'hui. Une lecture restreinte à la population comparable\
    \ est en cours, elle arrive [date], avant signature. Le reste du tableau est inchangé et mesuré indépendamment\
    \ : contacts support −22 % sur Zendesk, rétention 90 jours stable. Nous le remontons nous-mêmes plutôt\
    \ que de le laisser sortir en due diligence. »\n\nLa dernière phrase est l'actif réel. Elle convertit\
    \ « ils ont caché un mauvais chiffre » en « ils ont trouvé leur propre erreur et l'ont dite ». Les\
    \ investisseurs valorisent ça.\n\n### 6. La manœuvre qui protège réellement la valorisation\n\nLe\
    \ comité de mardi n'est pas le bon lieu pour la surprise. **Pré-briefer le partner lead en tête-à-tête\
    \ avant mardi**, avec ces chiffres et le calendrier de réanalyse. Cela réduit le risque de renégociation\
    \ bien davantage que n'importe quelle formulation dans le deck : le lead arrive au comité en position\
    \ de contextualiser, pas de réagir.\n\nEt cela donne sa place à chacun plutôt que d'opposer l'analyse\
    \ au produit : le VP Produit garde sa revendication — v2 *est* le meilleur produit, et les tickets\
    \ support le prouvent sur un instrument que ce défaut n'atteint pas. Ce qui tombe, c'est un chiffre\
    \ d'activation, pas neuf mois de travail.\n\n### 7. Les vérifications à lancer aujourd'hui (heures,\
    \ pas jours)\n\n0. **Figer les journaux bruts maintenant** — snapshot horodaté, avant que quiconque\
    \ « corrige » la table d'ingestion.\n1. Confirmer si « première action clé » *est* l'événement d'activation.\
    \ 10 minutes. Détermine la borne basse.\n2. **Reconstruire les rosters** : le bras v2 contient-il\
    \ des utilisateurs n'ayant jamais atteint la 2ᵉ session ? Zéro → H1 confirmée, randomisation cassée.\
    \ Une part substantielle → H2, le chiffre survit.\n3. Restreindre les **deux** bras aux utilisateurs\
    \ à ≥2 sessions et recalculer. C'est la seule comparaison que la donnée supporte.\n4. Lire le commit\
    \ du 2 mars : quel est le prédicat d'éligibilité réel.\n5. Baseline pré-2 mars : si 31 % correspond\
    \ à l'historique tous-utilisateurs et 47 % à l'historique utilisateurs-revenants, c'est quasi dispositif.\n\
    \n**Impliquer le conseil juridique avant mardi.** Dès lors que le term sheet référence la courbe,\
    \ ce n'est plus une question d'analytics mais de divulgation.\n\n---\n\n### Synthèse décisionnelle\n\
    \n- **Verdict :** retirer le chiffre de la diapositive, divulguer au comité, livrer la lecture corrigée\
    \ avant signature. Critère dominant : falsifiabilité de la preuve, puis risque irrécupérable.\n- **Pire\
    \ cas de l'option retenue :** décote de valorisation, renégociation. **Qui l'encaisse :** les actionnaires\
    \ existants et l'équipe (dilution). Récupérable.\n- **Pire cas de l'option écartée :** perte du tour\
    \ + exposition personnelle des dirigeants sur une déclaration inexacte. Irrécupérable — c'est ce qui\
    \ interdit l'option, indépendamment de son espérance de gain.\n- **Repli / déclencheur observable\
    \ :** si la vérification n°2 n'est pas rendue lundi 12 h, la version « sans chiffre » part par défaut.\
    \ Aucune reprise automatique du chiffre.\n- **Observation qui renverse cette recommandation :** la\
    \ vérification n°2 montre que le bras v2 contient une part substantielle d'utilisateurs n'ayant jamais\
    \ atteint la 2ᵉ session. Alors la randomisation tient, l'estimation ITT est valide, et le constat\
    \ se réduit à une note de méthode — le chiffre reste sur la diapositive avec un renvoi méthodologique.\n\
    - **Première action :** figer les journaux bruts, puis lancer les vérifications 1 et 2 aujourd'hui.\n\
    \nJe ne prétends pas que le chiffre est faux. Je constate qu'il est aujourd'hui indémontrable, que\
    \ l'écart de conséquences entre les deux erreurs possibles est massivement asymétrique, et qu'il reste\
    \ assez de temps pour le rendre démontrable avant signature.\n"
