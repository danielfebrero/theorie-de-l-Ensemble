response:
  text: "# NOTE DE DIRECTION — DOSSIER DISTRIBUTEUR D\n\n**De :** Direction générale\n**À :** Comité de\
    \ direction (DAF, Directeur commercial, Directeur industriel, DRH)\n**Date :** 8 août 2026\n**Objet\
    \ :** Décision et mandat d'exécution pendant l'absence du DG (8 – 25 août)\n**Statut :** Instruction\
    \ exécutoire. Elle n'est pas un avis. Elle s'applique en l'état jusqu'à mon retour.\n\n---\n\n## 1.\
    \ Décision\n\n**Nous ne signons pas le contrat d'exclusivité proposé par D, ni dans sa version actuelle,\
    \ ni dans une version amendée à la marge.**\n\n**Le mandat de signature sur ce dossier est retiré\
    \ à tous, y compris au DAF et au Directeur commercial, pour toute la durée de mon absence.** Aucun\
    \ document engageant Verdal vis-à-vis de D — contrat, avenant, lettre d'intention, courriel valant\
    \ accord de principe — ne peut être signé ou envoyé sans respecter le §5 ci-dessous. Un accord verbal\
    \ donné en réunion engage l'entreprise : il est également interdit.\n\nNous répondons à D avant le\
    \ 16 août par une **contre-proposition écrite non exclusive** (§4), et nous engageons immédiatement\
    \ le plan de réduction de dépendance (§6).\n\n---\n\n## 2. Le raisonnement — à connaître par cœur,\
    \ vous devrez le défendre\n\nCe n'est pas un arbitrage de tempérament entre un DAF prudent et un commercial\
    \ combatif. C'est une question arithmétique.\n\n**La remise de 9 % détruit plus de marge que le volume\
    \ promis n'en crée.**\n\n- Marge brute actuelle : 31 % du prix de cession. Coût variable : 69 %.\n\
    - Après remise de 9 %, le prix tombe à 91 ; le coût reste 69 ; la marge unitaire passe de 31 à 22,\
    \ soit **−29 % de marge par unité vendue**.\n- Pour retrouver la marge brute d'aujourd'hui, il faut\
    \ donc **+41 % de volume** (0,31 / 0,22 = 1,41).\n- D en offre **+18 %, et seulement la première année.**\n\
    \nTraduction sur nos comptes, à volume tenu : marge brute sur D ≈ 3,87 M€ contre 4,62 M€ aujourd'hui.\
    \ **Nous travaillons 18 % de plus pour gagner 750 k€ de moins.** Nous financerions notre propre saturation\
    \ industrielle.\n\n**Le scénario de ruine est explicite.** Année 1, D tient son engagement ferme.\
    \ Année 2, les volumes ne sont plus qu'« indicatifs » : D revient au niveau actuel tout en conservant\
    \ la remise. Marge sur D : 3,28 M€, soit **−1,34 M€ par an, deux années de suite**, sans aucun canal\
    \ de compensation puisque l'exclusivité les interdit, et sans porte de sortie puisque la pénalité\
    \ de 1,2 M€ absorbe 57 % de notre trésorerie. Nous aurions signé, de notre plein gré, l'interdiction\
    \ de nous sauver.\n\n**La probabilité de ce scénario n'est pas théorique : D a réduit ses commandes\
    \ de 11 % sans préavis au deuxième trimestre.** C'est la meilleure information dont nous disposions\
    \ sur la valeur d'un engagement de volume non contraignant signé par D. Elle est datée, vérifiée,\
    \ et elle vient d'eux.\n\n**Sur la méthode employée par D.** Comité avancé, ultimatum à huit jours,\
    \ quatre références sur huit en otage, et demande de venir plaider directement devant un comité dont\
    \ ils savent qu'il est divisé. Ce n'est pas un calendrier, c'est un levier. Une offre qui ne survit\
    \ pas à quinze jours d'examen est une offre qui a besoin de ne pas être examinée.\n\n**L'asymétrie\
    \ décide.** Refuser est réversible : D reste client, nous continuons de le servir, nous pourrons signer\
    \ en septembre, en janvier, ou jamais. Signer est irréversible pendant trois ans, à un prix de sortie\
    \ que nous ne pouvons pas payer. Entre deux options mal renseignées, on prend celle dont on peut revenir.\n\
    \n---\n\n## 3. Ce que je concède aux partisans de la signature\n\nLe contre-argument le plus fort\
    \ contre ma décision est le suivant, et je le tiens pour sérieux : si les quatre références déréférencées\
    \ le 20 août pèsent plus de 5 M€, si D enclenche ensuite un retrait progressif, alors nous passons\
    \ sous 70 % de plan de charge à l'automne, Redon bascule en activité partielle, et ni la centrale\
    \ régionale (décision à cinq mois) ni la marketplace (2,2 M€ au mieux) ne comblent le trou à temps.\
    \ Dans ce scénario, signer aurait acheté douze mois de répit.\n\nMa réponse est que ces douze mois\
    \ se paient de vingt-quatre mois de verrouillage à marge dégradée, et qu'**on ne traite pas une dépendance\
    \ de 62 % en la portant contractuellement à 100 %**. Le répit acheté ne sert à rien puisque l'exclusivité\
    \ interdit précisément d'employer ce délai à construire une alternative. Le risque sur Redon est réel,\
    \ il est déjà là, et son remède est au §6 — pas dans la signature.\n\nCette concession ne rouvre pas\
    \ la décision. Elle vous donne de quoi répondre honnêtement à l'acheteur de D quand il la soulèvera,\
    \ ce qu'il fera.\n\n---\n\n## 4. Contre-proposition à D — à envoyer au plus tard le 11 août\n\nCosignée\
    \ DAF + Directeur commercial. Ton coopératif, contenu ferme. Elle doit partir assez tôt pour permettre\
    \ un aller-retour avant leur comité du 20 : ne l'envoyez pas le 15.\n\nStructure imposée :\n\n1. **Aucune\
    \ exclusivité.** Point non négociable, présenté comme tel dès le premier paragraphe, sans justification\
    \ défensive.\n2. **Remise indexée sur volume réellement constaté, versée trimestriellement a posteriori**\
    \ — jamais intégrée au prix de cession par avance. Grille :\n   - +10 % de volume ferme → 3 %\n  \
    \ - +20 % → 5 %\n   - +40 % → 9 % (le taux qu'ils demandent, au volume qui le finance)\n   \n   Ces\
    \ paliers sont construits pour maintenir notre marge brute absolue ; l'absorption des frais fixes\
    \ reste notre gain. **Aucun palier ne peut être proposé au-delà de la capacité validée par écrit par\
    \ le Directeur industriel** — à produire avant le 11 août.\n3. **Durée 18 mois**, reconductible.\n\
    4. **Préavis de 90 jours** sur tout déréférencement ou réduction de commande supérieure à 10 %. Justifié\
    \ explicitement par le T2 : « afin d'éviter la répétition de la situation du deuxième trimestre. »\
    \ Dire les choses.\n5. **Aucune pénalité de sortie**, ou plafonnée à 300 k€ et réciproque.\n\n---\n\
    \n## 5. La seule zone où vous pouvez signer sans moi\n\nSignature autorisée **uniquement** si D revient\
    \ avec un texte réunissant **toutes** les conditions suivantes, sans exception ni interprétation :\n\
    \n- pas de clause d'exclusivité, ou exclusivité strictement limitée au canal GMS avec réserve écrite\
    \ et nominative de la marketplace **et** de la centrale d'achat régionale ;\n- remise conditionnée\
    \ au volume constaté et versée a posteriori ;\n- durée ≤ 18 mois ;\n- pénalité de sortie ≤ 300 k€\
    \ ;\n- préavis de déréférencement ≥ 90 jours ;\n- accord unanime DAF + Directeur commercial, consigné\
    \ par écrit avant signature.\n\nSi une seule condition manque : **c'est non.** Vous répondez « la\
    \ position de l'entreprise est arrêtée », vous ne motivez pas davantage, et le dossier attend mon\
    \ retour.\n\n**Règle de tranchage pour tout point non couvert par cette note : l'option la plus réversible\
    \ l'emporte.** Elle s'applique automatiquement en cas de désaccord entre le DAF et le Directeur commercial,\
    \ sans arbitrage extérieur et sans vote.\n\n---\n\n## 6. Actions engagées immédiatement — elles ne\
    \ dépendent pas de D\n\n| # | Action | Responsable | Échéance |\n|---|---|---|---|\n| 1 | Chiffrer\
    \ les 4 références menacées : CA, marge, part du plan de charge Redon | DC + DAF | **10 août** |\n\
    | 2 | Capacité industrielle disponible aux paliers +10/+20/+40 %, par écrit | Dir. industriel | **11\
    \ août** |\n| 3 | Plan de trésorerie glissant à 13 semaines, mis à jour chaque lundi | DAF | à partir\
    \ du **10 août** |\n| 4 | Ligne de crédit court terme 1,5 M€ : accord de principe bancaire | DAF |\
    \ **31 août** |\n| 5 | Marketplace : contrat signé et premiers flux réels | DC | **31 août** |\n|\
    \ 6 | Centrale régionale : relance au plus haut niveau, obtenir une lettre d'intention non engageante\
    \ | DC | **22 août** |\n| 7 | Dossier d'activité partielle Redon : préparé administrativement, **non\
    \ déposé** | DRH | **20 août** |\n\n**Sur la marketplace (point 5) : nous la lançons maintenant, pendant\
    \ la négociation.** Rien ne nous l'interdit aujourd'hui, et c'est précisément ce que l'exclusivité\
    \ viendrait supprimer. Commencez par des références hors du cœur GMS de D, pour ne pas offrir de prétexte,\
    \ mais démarrez réellement.\n\n**Sur le point 4 :** on négocie une ligne de crédit tant qu'on n'en\
    \ a pas besoin. Après le 20 août, les conditions ne seront plus les mêmes.\n\n**Point de vigilance\
    \ pour le DAF, à traiter en priorité.** Si 2,1 M€ représentent bien trois mois de charges fixes, celles-ci\
    \ s'élèvent à ~8,4 M€ par an, soit davantage que notre marge brute totale (7,44 M€). Ou l'un des deux\
    \ chiffres est erroné, ou nous sommes déjà en perte structurelle — et dans ce cas le dossier D n'est\
    \ pas le problème principal, seulement le plus bruyant. **Je veux la réponse par écrit avant le 15\
    \ août**, dans le compte rendu hebdomadaire.\n\n---\n\n## 7. Réunion avec l'acheteur de D\n\nElle\
    \ a lieu. Nous n'avons rien à cacher et refuser serait un aveu de faiblesse. Cadre impératif :\n\n\
    - **Le Directeur commercial préside.** Le DAF est présent. **Aucun des deux n'est jamais seul avec\
    \ l'acheteur**, ni en réunion, ni au déjeuner, ni sur le parking. Cette règle n'est pas une marque\
    \ de défiance envers vous : elle vous protège l'un et l'autre.\n- **Aucune décision n'est annoncée,\
    \ suggérée ni laissée entendre en séance.** Réponse unique : « votre position sera versée au dossier,\
    \ notre réponse écrite vous parviendra selon le calendrier annoncé. »\n- **Ne sont jamais évoqués\
    \ :** notre trésorerie, le plan de charge de Redon, le projet marocain, la centrale régionale, la\
    \ marketplace, et **mon absence**. Si la question est posée, la formule est : « la position de l'entreprise\
    \ est arrêtée et écrite. » Elle est exacte.\n- **Aucune divergence interne ne s'exprime devant lui.**\
    \ Vous êtes en désaccord, c'est légitime et c'est consigné dans nos comptes rendus internes. Devant\
    \ D, il n'existe qu'une position : celle de cette note. Un comité divisé en séance, c'est 1,2 M€ de\
    \ pénalité qui rentrent par la fenêtre.\n- Compte rendu écrit sous 24 h, envoyé au DRH pour archivage.\n\
    \n---\n\n## 8. Ce qui déclenche une exception\n\nUn seul cas. Si le chiffrage du 10 août établit que\
    \ les quatre références représentent **plus de 5,2 M€** (35 % du CA D) **et** que D confirme par écrit\
    \ un engagement ferme de volume sur les trois années — pas seulement la première — alors la nature\
    \ du dossier change.\n\nMême dans ce cas, **vous ne signez pas.** Vous demandez officiellement à D\
    \ le report de l'examen au premier comité d'achat de septembre, avec maintien du statu quo commercial,\
    \ au motif que l'ampleur de l'engagement justifie la présence du dirigeant. Si D refuse ce report,\
    \ **c'est non**, et cela nous aura appris quelque chose de plus utile encore sur la relation.\n\n\
    ---\n\n## 9. À mon retour\n\nJe veux trouver : le chiffrage des quatre références, la capacité industrielle\
    \ par palier, treize semaines de trésorerie, la réponse au point de vigilance du §6, la contre-proposition\
    \ envoyée et la réaction de D, le compte rendu de la réunion, la marketplace opérationnelle, et l'accord\
    \ bancaire de principe.\n\nSi D a déréférencé quatre références le 20 août, ce sera désagréable, mesurable\
    \ et réversible. Si vous aviez signé, ce serait irréversible pendant trois ans. **Vous n'aurez pas\
    \ commis d'erreur en appliquant cette note. Vous en commettriez une en la contournant, même avec de\
    \ bonnes raisons, même en urgence, même si D améliore son offre de façon convaincante à 48 heures\
    \ du comité.** L'urgence fabriquée est l'outil de travail de notre interlocuteur, pas le nôtre.\n\n\
    Merci de m'accuser réception par écrit avant mon départ demain matin.\n\n*Le Directeur général*\n\n\
    ---\n\nDeux remarques hors note : l'annexe « catalogue des stations de mesure » jointe à votre demande\
    \ ne présente aucun lien avec ce dossier — je ne l'ai pas utilisée, dites-moi si elle devait servir\
    \ à autre chose. Et le calcul du §2 repose sur une marge brute uniforme de 31 % appliquée aux ventes\
    \ D ; si le mix produit de D est sensiblement plus ou moins margé que la moyenne, le seuil de +41\
    \ % bouge, mais pas le sens de la conclusion — il faudrait que D soit margé à plus de 44 % pour que\
    \ sa proposition devienne neutre.\n"
