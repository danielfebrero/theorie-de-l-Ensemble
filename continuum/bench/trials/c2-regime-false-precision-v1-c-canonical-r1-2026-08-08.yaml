response:
  text: '# Note au comité de direction — Réseau magasins


    **Objet :** demande actionnaire de 300 000 € de résultat sur l''exercice prochain — quels magasins
    fermer

    **Recommandation : aucune fermeture décidée mardi. Une seule échéance est urgente : le bail de Vitry.**


    ---


    ## 1. Ce que dit vraiment la comptabilité


    Les trois magasins « déficitaires » rapportent tous de l''argent au groupe. Leur résultat est négatif
    parce qu''on leur a facturé une part des 6,4 M€ de frais de siège et de logistique, répartie au prorata
    du chiffre d''affaires. Cette part ne disparaît pas le jour où le rideau tombe : elle est simplement
    refacturée aux 16 magasins restants.


    | | Résultat affiché | Quote-part siège incluse | **Ce que le magasin rapporte réellement** | Coût
    de sortie | Magasin voisin |

    |---|---|---|---|---|---|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** | 0 € (bail échu) | 14 km |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** | 1 100 000 € | 92 km |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** | murs à vendre 1,9 M€ | 23 km |


    **Fermer les trois dégraderait le résultat de 114 000 € par an**, avant même de payer quoi que ce
    soit. Additionné aux 300 000 € demandés, l''écart à combler serait de 414 000 €.


    La comptabilité analytique est juste à l''euro près. C''est la question qui était mal posée : le comité
    n''a pas besoin de savoir *quel magasin porte le plus de frais généraux*, mais *quelles dépenses sortent
    réellement de la caisse du groupe le jour de la fermeture*. Nous ne disposons pas de ce chiffre aujourd''hui.


    **Le seuil est chiffrable et vérifiable.** Pour qu''une fermeture soit seulement neutre sur le résultat,
    il faudrait que disparaisse vraiment : **35 %** de la quote-part de Vitry, **25 %** de celle de Chambéry,
    **20 %** de celle de Nîmes. Une part de la logistique est effectivement évitable (livrer 16 magasins
    coûte moins que 19) ; les fonctions siège, non. C''est le premier chiffre à produire.


    ## 2. Ce qu''une fermeture coûterait en plus


    - **Calendrier social.** Première fermeture de l''histoire de l''enseigne. Consultation du CSE obligatoire
    *avant* toute décision, plan de sauvegarde de l''emploi au-delà de dix licenciements, obligation de
    reclassement : quatre à six mois au minimum. Les coûts (indemnités, remise en état, écoulement du
    stock) tombent l''an prochain ; les économies, elles, ne courent que sur une partie de l''année. **Une
    fermeture décidée mardi dégraderait l''exercice prochain, pas l''inverse.** Annoncer une décision
    avant la consultation nous exposerait par ailleurs à un délit d''entrave.

    - **Chambéry est hors sujet.** Payer 1,1 M€ d''indemnité pour supprimer 32 000 € de contribution annuelle,
    c''est plus de trente ans de retour sur investissement. À 92 km du magasin le plus proche, la quasi-totalité
    du chiffre d''affaires serait perdue, pas transférée. Ce site relève d''un plan de redressement, pas
    d''une fermeture.

    - **Vitry porte une charge qui n''est pas la sienne.** 18 % de ses entrées sont des retraits de commandes
    web, dont le chiffre d''affaires est enregistré sur l''entité e-commerce. Le magasin paie le loyer
    et le personnel d''un point de retrait dont il n''encaisse pas la vente. Sa contribution réelle au
    groupe est donc supérieure aux 63 000 € affichés. Le fermer ferait remonter les coûts de livraison
    de l''e-commerce.


    ## 3. Où sont réellement les 300 000 €


    Aucune combinaison de fermetures ne produit ce montant. Trois gisements le peuvent :


    1. **Les 6,4 M€ de siège et de logistique.** Une réduction de 5 % vaut 320 000 €. C''est le seul gisement
    à la bonne échelle. Il n''exige aucune fermeture.

    2. **Les heures d''ouverture et le planning des 19 magasins.** Nos compteurs enregistrent à la demi-heure
    depuis 24 mois avec une calibration à ±2 % : c''est un excellent outil pour ajuster les effectifs
    au trafic réel. Sur 430 salariés, l''enjeu est significatif. À chiffrer.

    3. **Les 1,9 M€ des murs de Nîmes.** Un actif immobilisé pour une contribution de 19 000 € par an.
    Cession, cession-bail ou relocalisation en format réduit sont à étudier. Attention : c''est un gain
    de trésorerie et de résultat financier, pas de résultat d''exploitation — et la vente est irréversible.


    ## 4. La seule urgence de mardi : le bail de Vitry


    Le bail expire dans sept mois, sortie sans indemnité. Un bail commercial ne se termine pas tout seul
    : sans congé délivré dans les délais (six mois en général), il se reconduit — et nous nous réengageons
    par défaut, potentiellement pour neuf ans. **Le délai pour agir peut donc être de quelques semaines,
    pas de sept mois.**


    C''est une option gratuite dont l''expiration est silencieuse. Nous demandons au comité un mandat
    pour la **protéger** — congé conservatoire ou négociation d''une prorogation courte — sans décider
    aujourd''hui de fermer. Vérification juridique à conduire cette semaine.


    ## 5. Ce que nous engageons dès cette semaine


    | Échéance | Livrable |

    |---|---|

    | **J+5** | Date limite exacte du congé de Vitry (bail + avis juridique) et mandat de protection de
    l''option |

    | **J+15** | Coût évitable ligne à ligne des 6,4 M€ : ce qui disparaît réellement par magasin fermé
    |

    | **J+21** | Mesure du transfert réel, à partir des cinq semaines de fermeture de Nîmes en mars 2024
    |

    | **J+30** | Économie d''un retrait web en magasin par rapport à une livraison à domicile (Vitry)
    |

    | **J+45** | Comité de décision : arbitrage Vitry, dossier immobilier Nîmes, plan Chambéry |


    Sur le **transfert de clientèle**, deux précisions. Les compteurs comptent des entrées, pas des acheteurs
    : ils ne diront jamais combien de clients suivront. Les 41 % de porteurs de carte ayant acheté dans
    deux magasins ne sont pas non plus un taux de transfert — ils ne couvrent que 23 % des tickets et
    décrivent une habitude, pas une réaction à une fermeture. La seule mesure réelle dont nous disposons
    est mars 2024 : le chiffre d''affaires des magasins voisins pendant la fermeture de Nîmes. Nous n''avons
    conservé que les totaux mensuels pour cette période : c''est grossier, sensible à la météo et aux
    promotions, mais c''est une observation, et elle coûte trois semaines de travail.


    ## 6. L''objection la plus forte contre cette note


    *« Cette enseigne n''a jamais fermé de magasin. Reporter, c''est encore reporter. »* L''argument est
    sérieux : ces contributions sont minces, un retournement de marché les fait basculer, et l''incapacité
    à fermer se paie ensuite très cher. Nous y répondons ainsi : nous ne demandons pas un report, nous
    demandons **six semaines et une date de décision ferme**, en protégeant entre-temps la seule sortie
    gratuite du dossier. Décider mardi sur les chiffres actuels ne serait pas du courage : ce serait payer
    pour dégrader le résultat qu''on nous demande d''améliorer.


    ## 7. Ce qui renverserait cette note


    - Si moins de **20 à 35 %** des quotes-parts s''avèrent réellement évitables, aucune fermeture n''est
    justifiable et le dossier se referme.

    - Si l''étude de mars 2024 montre un transfert **supérieur à 60 %** du chiffre d''affaires vers le
    magasin situé à 23 km, la fermeture de Nîmes, combinée à la cession des murs, redevient créatrice
    de valeur et doit être réexaminée en priorité.

    - Si le congé de Vitry est déjà hors délai, l''option n''existe plus et le site sort du périmètre
    pour neuf ans.


    ## 8. Repli


    Si au J+45 les 300 000 € ne sont pas sécurisés sur le siège, la logistique et les plannings, nous
    présentons à l''actionnaire un plan en deux temps — une part sur l''exercice prochain, le solde sur
    le suivant — plutôt qu''une fermeture qui coûte davantage qu''elle ne rapporte. Toute décision de
    fermeture est suspendue à la consultation préalable du CSE : elle ne peut être annoncée mardi, quelle
    que soit la conclusion du comité.


    ---


    Si vous le souhaitez, je peux transformer cette note en page partageable pour l''envoi aux membres
    du comité, ou produire la maquette du chiffrage « coût évitable » attendu au J+15.

    '
