  text: '# Note au comité — mardi 11 août 2026


    **Objet : les trois magasins déficitaires et l''objectif de 300 000 €**


    ## Ce que je propose de décider mardi


    Ne fermer aucun magasin. Ouvrir une seule question — Vitry — à trancher avant le 30 septembre. Et
    chercher les 300 000 € là où ils sont : dans les 6,4 M€ de siège et de logistique.


    ## Les trois « déficitaires » gagnent de l''argent


    Chaque magasin porte une part des 6,4 M€ de frais de siège et de logistique, répartie selon son chiffre
    d''affaires. Ces frais ne disparaissent pas avec le magasin : fermer Vitry ne supprime ni un poste
    au siège, ni un entrepôt. Il faut donc regarder ce que chaque magasin verse réellement au pot commun,
    avant cette quote-part.


    | Magasin | Résultat affiché | Quote-part siège | Verse réellement |

    |---|---|---|---|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |


    Fermer les trois retire **114 000 €** au résultat du groupe — avant le premier euro de coût de fermeture.
    Leurs 402 000 € de quote-part se redéploieraient ensuite sur les 16 magasins restants, environ 25
    000 € chacun : plusieurs magasins aujourd''hui légèrement positifs passeraient dans le rouge. **Chaque
    fermeture fabrique le déficitaire suivant.** C''est ce mécanisme, et non la performance des équipes,
    qui a produit la liste qu''on nous demande de trancher.


    La comptabilité analytique est juste à l''euro près. Elle mesure une répartition, pas une économie
    réalisable.


    ## Magasin par magasin


    **Chambéry — sujet à refermer.** Six ans de bail, aucune clause de sortie, 1,1 M€ d''indemnité : nous
    paierions 1,1 M€ comptant pour perdre 32 000 € par an, et le loyer courrait de toute façon. Le magasin
    le plus proche est à 92 km — aucun client ne suivrait. C''est la seule décision du dossier qui ne
    se défait pas.


    **Nîmes — reste ouvert.** Nous détenons les murs : il n''y a aucun loyer à économiser. Les 1,9 M€
    de valeur vénale existent que le magasin soit ouvert ou fermé. C''est une question de patrimoine —
    traitée plus bas — pas une raison de fermer.


    **Vitry — la seule vraie question.** Le bail échoit dans sept mois, sortie sans indemnité : c''est
    notre unique fenêtre de sortie gratuite avant longtemps, et elle se referme. Deux faits tirent en
    sens contraire.


    - Vitry vaut mieux que ses chiffres : 18 % de ses entrées sont des retraits de commandes web. Le magasin
    en supporte les mètres carrés et les heures ; le chiffre d''affaires est enregistré chez e-commerce.
    Sa contribution réelle dépasse 63 000 €, et nous ignorons de combien.

    - Un magasin du réseau est à 14 km. Si une part suffisante des clients y basculait, la fermeture deviendrait
    gagnante. Nous n''avons jamais fermé de magasin : nous n''en savons rien.


    Je ne demande pas mardi une décision sur Vitry. Je demande le mandat de la préparer pour le 30 septembre.


    **À vérifier avant mardi :** notre vraie date butoir n''est pas l''échéance du bail mais la date limite
    de congé. Si elle est proche, tout le calendrier se resserre.


    ## Ce que nos données disent, et ne disent pas


    - **Les compteurs comptent des entrées, pas des acheteurs.** ±2 %, à la demi-heure, sur 24 mois :
    excellent pour caler les heures de présence sur les heures de trafic ; muet sur la conversion et le
    panier, donc inutilisable pour décider d''une fermeture.

    - **La carte de fidélité couvre 23 % des tickets.** Que 41 % des porteurs achètent dans deux magasins
    ne dit pas qu''ils remplaceraient l''un par l''autre : fréquenter deux magasins par commodité n''est
    pas suivre après une fermeture. Piste, pas preuve.

    - **Mars 2024 — Nîmes fermé cinq semaines — est notre seule observation réelle** de ce qui se passe
    quand un magasin ferme. Elle est dégradée : seuls les totaux mensuels des voisins ont été conservés,
    les cinq semaines chevauchent deux mois, et une fermeture annoncée comme temporaire ne provoque pas
    les mêmes reports qu''une fermeture définitive. Ordre de grandeur, pas taux.


    Deux mesures à produire d''ici le 30 septembre : reconstitution du report de mars-avril 2024 sur les
    voisins de Nîmes, et analyse des porteurs de carte de Vitry — combien fréquentent déjà le magasin
    à 14 km, et pour quelle part de leurs achats. La seconde est dans notre base ; elle coûte quelques
    jours.


    ## Le calendrier social


    430 salariés pour 19 magasins : une fermeture dépasse le seuil des dix licenciements et déclenche
    un plan de sauvegarde de l''emploi — consultation, homologation, contentieux possible. Les coûts tombent
    l''an prochain, les économies l''année d''après. **Une fermeture décidée mardi dégraderait précisément
    l''exercice que l''actionnaire veut redresser.** Hypothèse à faire confirmer par notre conseil, mais
    elle va dans le même sens que tout le reste.


    ## Où sont réellement les 300 000 €


    | Levier | Ordre de grandeur | Responsable | Échéance |

    |---|---|---|---|

    | Siège et logistique | 4,7 % de 6,4 M€ | DAF | jalon chiffré fin février |

    | Loyer de Vitry | à négocier | direction immobilier | avant la date de congé |

    | Heures de présence contre courbe de trafic, 19 magasins | à mesurer | direction réseau | 30 septembre
    |

    | Refacturation des retraits web | 0 € pour le groupe | DAF | 30 septembre |


    Deux précisions. La refacturation des retraits web ne crée pas un euro : elle cesse de fausser nos
    décisions. Et nous n''aurons jamais meilleure position pour renégocier le loyer de Vitry qu''à quelques
    mois d''une sortie sans indemnité — à condition de ne pas annoncer que nous restons.


    ## Ce que je propose de dire à l''actionnaire


    Son échéance est réelle. Deux chemins seulement la tiennent, et l''arbitrage lui appartient :


    - **Vendre les murs de Nîmes.** 1,9 M€, effet certain sur l''exercice demandé, une seule fois — et
    un loyer permanent installé sur un magasin qui n''en payait pas.

    - **Prendre les 300 000 € sur le siège et la logistique.** Récurrent, et probablement pas bouclé en
    douze mois.


    Je recommande le second, avec engagement écrit et jalon à fin février. Et je propose de lui présenter
    les deux plutôt que de trancher à sa place : le délai est le sien, l''arbitrage entre l''an prochain
    et les cinq suivants aussi.


    ## Le meilleur argument contre cette note


    Les frais de siège ne sont pas éternellement fixes : un réseau à 16 magasins finit par soutenir un
    siège plus petit. C''est exact — sur deux à trois ans, pas « dès l''exercice prochain ». Et cet argument
    plaide pour réduire le siège, ce qui se fait sans fermer un seul magasin.


    **L''observation qui renverserait ma recommandation :** que les deux mesures montrent un report durable
    vers le magasin à 14 km générant plus de 63 000 € de marge supplémentaire, retraits web exclus. Alors
    Vitry ferme à l''échéance du bail, et je le proposerai moi-même.


    **Repli.** Si au 30 septembre la mesure n''est pas concluante, ou si le bailleur refuse toute baisse
    : nous ne fermons pas et nous renégocions sur une durée courte avec sortie triennale — l''option se
    reconstitue dans trois ans au lieu d''être perdue pour neuf. Si au jalon de fin février moins de 150
    000 € sont sécurisés sur le siège, le dossier des murs de Nîmes se rouvre devant l''actionnaire.


    **Première action, lundi.** Obtenir du conseil la date limite de congé du bail de Vitry, et lancer
    la requête sur les porteurs de carte de Vitry.


    ---


    Deux points d''hypothèse que j''ai assumés dans la note et que vous voudrez sécuriser : le seuil PSE
    (je déduis d''environ 22 salariés par magasin en moyenne, à confirmer sur les effectifs réels de Vitry)
    et la date limite de congé du bail, qui peut avancer tout le calendrier. Ni l''un ni l''autre ne change
    le raisonnement sur les quote-parts, qui tient seul.

    '
