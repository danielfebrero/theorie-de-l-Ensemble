response:
  text: '# Ma recommandation


    **Je rejette C sans condition, je suspends B dans sa version à 40 %, je maintiens A comme régime de
    garde — et j''engage la caisse sur le dépôt immédiat du dossier de transfert à l''UMA.**


    Le conseil croit arbitrer un rendement. Il arbitre en réalité une fenêtre de sortie qui se referme
    dans moins de deux ans.


    ## Trois constats qui ne figurent pas dans la note du trésorier


    **1. C nous met en cessation de paiement dans sa branche gagnante.** Bloquer 14,4 M€ laisse 4,0 M€
    liquides. Sur 7 ans, le cumul des déficits atteint **12,2 M€**. La poche est vide en année 4 :


    | Fin d''année | 1 | 2 | 3 | 4 |

    |---|---|---|---|---|

    | Poche liquide (M€) | 3,07 | 1,90 | 0,45 | **−1,27** |


    Ce n''est pas le risque à 3 %, c''est la trajectoire à 88 %. *(Réserve : si le coupon de 14 % était
    versé en numéraire — 2,0 M€/an — l''assèchement recule. La note ne le précise pas. C''est la pièce
    à exiger avant tout vote, mais elle ne sauve pas C : le coupon tombe à 0,29 M€ dans la branche à 9
    %, à zéro dans celle à 3 %, et dépend du même émetteur unique.)*


    **2. Le résidu de 4,7 M€ annoncé en cas de défaut est faux.** Il additionne 0,72 M€ (5 % de 14,4)
    et une poche de 4,0 M€ supposée intacte après sept ans — alors que les hypothèses de la note l''épuisent
    en année 4. Le résidu réel est de **0,72 M€**.


    **3. Le plancher est franchi en année 6, pas en année 9.** Avec les paramètres de la note (prestations
    +4,3 %, cotisations fixes, réserve +1,8 %) : 17,7 → 16,8 → 15,6 → 14,2 → 12,5 → **10,4**. Je ne parviens
    à reproduire les neuf ans sous aucune hypothèse cohérente avec nos statuts. À faire produire avant
    la séance : trois ans d''écart, c''est la moitié de notre marge.


    ## Le vrai sujet


    L''UMA exige une réserve ≥ 3 années de prestations. Ratio aujourd''hui : **3,27**. Fin d''année 1
    : 3,02. Fin d''année 2 : **2,74**. Le comité instruit en 12 à 18 mois — **le délai d''instruction
    consomme toute la fenêtre.** Aucun assureur n''a coté ce portefeuille en 2025 : il n''y aura pas de
    seconde occasion. Et souscrire C referme cette porte définitivement — aucun repreneur ne reprend un
    bilan immobilisé à 78 % dans un titre non coté.


    ## Sur les options


    - **C** — refusée. Le « A− » qualifie l''émetteur, pas l''instrument : 14 % quand l''État paie 1,8
    %, et 5 % de récupération là où une dette senior en récupère 30 à 40 %, décrivent un titre subordonné,
    pas un risque A−. Probabilités fournies par le vendeur. « 94 % des trajectoires » est la signature
    d''un pari à queue catastrophique : raisonner en moyenne suppose qu''on rejoue la partie, or sous
    11 M€ la liquidation est de plein droit.

    - **B** — suspendue. (6,1 − 1,8) % × 7,4 M€ ≈ **+0,32 M€/an** contre un déficit de 1,0 M€ qui atteint
    2,5 M€. Le trésorier admet lui-même qu''elle ne referme rien avant 2035 — et elle inscrit une volatilité
    quotidienne au bilan pendant que l''UMA l''examine. Réexamen après décision de l''UMA.

    - **A** — conservée, mais renommée : régime de garde pendant le transfert, pas stratégie.


    ## Ce sur quoi j''engage la caisse


    1. **Dépôt du dossier UMA sous 30 jours**, réserve liquide et non grevée pendant l''instruction.

    2. **AG extraordinaire sous 60 jours** avec les vrais chiffres. En 2024 l''assemblée a voté sans savoir
    que les +6 % rapportaient 0,26 M€ contre 1,0 M€ de déficit — et qu''il faudrait **+22,7 %** pour équilibrer
    la seule année en cours. Aucune allocation ne produit les 5,4 % puis 13,9 % de rendement requis :
    l''ajustement se fait sur les cotisations et le périmètre, ou il ne se fait pas.

    3. **Reporting mensuel**, déclencheur contraignant : ratio < 3,0, ou réserve < 15 M€, ou refus de
    l''UMA → gestion d''extinction pilotée, conseil sous 15 jours, information immédiate des affiliés.


    ## Le meilleur argument contre moi


    *« Si l''UMA refuse, vous aurez perdu deux ans, la fenêtre sera fermée, et vous n''aurez ni rendement
    ni sortie. »* Il tient sur un point — je n''ai pas de troisième filet, je l''assume par écrit. Il
    échoue sur l''autre : il compare un refus possible à un rendement supposé, alors que C ne délivre
    pas de rendement mais une insolvabilité au 40ᵉ mois. Un pari qui échoue dans sa branche gagnante est
    une erreur de construction.


    ## Ce qui me ferait revenir devant le conseil


    Documentation contractuelle établissant coupon en numéraire **et** titre transférable **et** probabilité
    évaluée par un tiers indépendant → réexamen d''une tranche minoritaire, jamais 78 %. Ou confirmation
    écrite que le critère des trois années n''est pas opposable. Ou la projection à neuf ans reproduite
    avec ses hypothèses.


    ## Sur le trésorier


    Sa note dit une chose vraie que personne n''avait écrite : au statu quo, cette caisse meurt. Je propose
    qu''il **conduise la négociation UMA**, que son constat serve d''argument d''ouverture à l''AG sous
    sa signature, et que les cinq signataires forment le comité de suivi mensuel avec pouvoir de saisine
    d''urgence. Le désaccord porte sur le remède, pas sur le diagnostic.


    Et un point que je demande au procès-verbal : **les 4 200 affiliés doivent être informés avant l''AG,
    pas pendant.** Ils supportent le pire cas dans toutes les branches, personne ne les a consultés, et
    ce sont eux qui se présenteront individuellement devant un marché qui a refusé de les coter collectivement.


    **Première action** — avant jeudi : obtenir le term sheet de la note structurée, les critères écrits
    de l''UMA avec ses délais réels constatés, et la projection interne avec ses hypothèses. Jeudi : résolution
    1 en premier point de l''ordre du jour.

    '
