response:
  text: '## Ce que disent les pièces


    Trois écarts se lisent sans interprétation :


    - **P2 dit « départ 6 h 40 », P3 dit sortie à 11 h 12.** La mention manuscrite est fausse de 4 h 32.
    P3 est une écriture machine, P2 un déclaratif.

    - **P1 + P3 + P5 :** le lot est resté **4 h 47 sur le site** après fin de chargement, dont **2 h 40
    sans aucun enregistrement de température**, groupe froid hors tension. Sur le site de l''entreprise,
    avant le portique. Sous sa responsabilité.

    - **P2 dit 1 840, P4 dit 1 792.** 48 barquettes manquantes, et le bon portant 1 840 est **signé par
    le réceptionnaire du dépôt lui-même**.


    La pièce 7 n''est pas une pièce. Un appel téléphonique ne se rattache à rien ; l''assureur renverrait
    le dossier. Elle est écartée jusqu''à déclaration écrite et signée.


    ## Reconnaître, contester


    **Reconnaître** la rupture de traçabilité 6 h 25 – 9 h 05, et rectifier spontanément la mention «
    6 h 40 » auprès de l''assureur. Deux enregistrements automatiques l''établissent, dont l''appareil
    de l''entreprise. Nier reviendrait à se faire démentir par ses propres machines et à risquer la déchéance
    de garantie — sans commune mesure avec 21 400 €.


    Mais reconnaître **un fait de traçabilité, pas une cause.** La reconnaissance ne porte ni sur une
    élévation réelle de température — aucune pièce ne la documente, et P5 relève 2,9–3,6 °C *dès* la remise
    sous tension, ce qui n''est pas la signature d''un caisson réchauffé — ni sur les autres lots.


    **Contester le quantum d''abord**, c''est là que le dossier du dépôt se retourne : son agent a signé
    pour 1 840, son bon porte 1 792. Soit il a reçu 1 840 et il n''y a pas de manquant, soit ses documents
    de réception sont contredits par sa propre signature — et leur valeur probante tombe, y compris pour
    établir la quantité détruite. Or aucun procès-verbal de destruction ne figure au dossier. Ni ventilation
    des 21 400 €, ni clause de pénalité, ni protocole de prélèvement pour P6.


    Sur la causalité, un argument sérieux mais qui reste une hypothèse : 4,2 × 10⁵ UFC/g suppose plusieurs
    générations bactériennes, difficilement compatible avec 2 h 40 en caisson fermé sur 1 840 barquettes
    réfrigérées. À faire trancher par expertise, pas à affirmer.


    ## L''exposition réelle n''est pas 21 400 €


    P3 précise « aucune autre sortie ce jour-là **pour ce véhicule** ». Rien sur les autres véhicules,
    rien sur les autres jours. Si la mise sous tension différée relève de la procédure de quai et non
    d''un incident, on ne parle plus de réclamation mais de retrait-rappel — pour 34 salariés en plats
    préparés frais, c''est la seule branche irrécupérable.


    D''où une contrainte : **ne qualifier l''incident d''isolé dans aucun écrit** avant d''avoir croisé
    portique et enregistreurs sur 30 jours glissants, tous véhicules.


    ## Les huit jours


    Le point de départ du délai n''est pas au dossier — décompté du 3 juin par prudence, **la réponse
    part au plus tard le 11 juin**, LRAR + courriel le même jour.


    Avant elle, dans les 48–72 h : **geler la vidéosurveillance du quai** (écrasée sous 15–30 jours),
    extraire les données **brutes** de l''enregistreur, et récupérer le **contrôle libératoire du lot**.
    Ces deux dernières pièces commandent la fermeté du propos sur la causalité — si le premier relevé
    après 9 h 05 est élevé en descente, ou si la flore était déjà dérivée à la production, l''argument
    tombe et seul le quantum reste. C''est pourquoi le courrier conteste le quantum fermement et ne fait
    de la causalité qu''une demande d''expertise.


    Au client : droit d''audit sans préavis sur les vingt livraisons suivantes et verrouillage physique
    du quai — sous réserve expresse de tous droits.


    Le fichier n''a pas pu être écrit dans le répertoire de travail (permission refusée), il est dans
    le scratchpad et vous a été envoyé.

    '
