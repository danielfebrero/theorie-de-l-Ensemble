response:
  text: '# L''essentiel


    **Ni 47 % ni 41 % ne peuvent aller sur la diapositive.** Le second n''est pas une correction du premier,
    c''est un deuxième chiffre faux — et plus dangereux, parce que le mot « nettoyé » signale une rigueur
    qui n''a pas eu lieu.


    ## Le défaut


    Les deux bras ne sont pas comptés sur la même population. Le témoin est écrit à l''inscription : dénominateur
    = tous les inscrits. Le v2 est écrit à l''étape 3 : dénominateur = **ceux qui ont survécu jusqu''à
    l''étape 3**. Comme l''étape 3 n''existe pas dans v1, il n''y a aucun point de troncature équivalent
    côté témoin. 31 % et 47 % ne mesurent pas la même grandeur.


    ## « Artefact de journalisation » — réfuté


    Il existe bien un artefact connu : **il vaut 0,9 %**, c''est le taux d''inversion du témoin (98/10
    940), mesuré par le même service, sur la même horloge NTP unique, sur la même période. Le v2 est à
    **42,6 %**. Un problème d''horloge frappe les deux bras. Celui-ci n''en frappe qu''un — parce que
    ce n''est pas l''horloge, c''est la conception : ces comptes ont agi *avant* d''être affectés. L''inversion
    n''est pas le bruit à retirer, c''est la preuve du défaut.


    ## Pourquoi 41 % est pire


    En reconstruisant : les 4 812 lignes retirées activaient à **55 %**, contre 41 % pour les 6 488 conservés.
    Le « nettoyage » a supprimé le sous-groupe le plus performant, sur un critère corrélé à la sortie,
    à 42,6 % d''un bras contre 0,9 % de l''autre — tout en conservant intégralement le biais de survie
    initial.


    ## Le chiffre qui décide de tout


    Il manque le **dénominateur d''exposition v2** (combien de comptes ont vu v2, abandons compris). Sensibilité,
    en supposant que les abandons n''activent pas :


    | Abandons avant étape 3 | Activation v2 en ITT |

    |---|---|

    | 0 | 47,0 % |

    | 2 000 | 39,9 % |

    | 4 000 | 34,7 % |

    | **5 832** | **31,0 % — parité** |

    | 7 000 | 29,0 % — en dessous |


    **Si un tiers des exposés ont abandonné avant l''étape 3 — taux banal pour un onboarding — l''effet
    entier disparaît.** Nous ne connaissons pas le signe de l''effet. Signal à vérifier d''abord : 11
    300 comptes *ayant atteint l''étape 3* contre 10 940 *inscrits* au témoin, c''est arithmétiquement
    suspect.


    ## Sur les deux objections


    **Notes de l''orateur : non.** Rédiger la réserve et la placer précisément là où le comité ne la lira
    pas ne réduit pas l''exposition, elle la transforme — c''est la pièce qui établit que le défaut était
    connu, daté et écarté du champ de vision de l''investisseur. Ça fait passer de l''erreur à l''intention,
    et ça sortira.


    **La DAF a raison sur les faits et tort sur la comparaison.** Que le term sheet référence explicitement
    la courbe d''activation n''atténue pas le risque — ça établit la matérialité du chiffre dans la décision
    d''investir. Renégocier la valorisation est douloureux, borné, réversible. Signer sur une métrique
    qu''on sait non interprétable ne l''est pas : annulation du tour, responsabilité personnelle des signataires,
    42 salariés. Aucune espérance de gain ne rachète une branche dont on ne revient pas.


    La réponse à sa préoccupation n''est pas « tant pis » : **proposer de traiter l''incertitude dans
    la structure du deal** — une tranche ou un ajustement indexé sur une re-mesure correctement instrumentée
    à 60/90 jours post-closing. Ça déplace un problème de sincérité, indéfendable, vers un problème de
    structuration, négociable et courant.


    ## Ce qui renverserait ma position


    Une seule observation : si les journaux de routage montrent une exposition v2 entre 11 300 et ~11
    650 (abandon < 3 %), alors 47 % est à peu près un vrai chiffre en intention de traiter et la diapositive
    peut porter un pourcentage. Ni le calendrier, ni les neuf mois de travail, ni la réalité de la baisse
    des tickets ne changent quoi que ce soit.


    ## Première action, ce soir


    Demander à l''infra, par écrit : (1) la config d''allocation au 3 mars — quelques minutes, et à elle
    seule elle tranche la plausibilité ; (2) le journal du routeur `account_id` × variante ; (3) le total
    d''inscriptions sur la période ; (4) le compte distinct d''`account_id` sur l''événement étape 1 de
    v2. Et prévenir la DAF **avant** le comité, pas pendant.


    Deux points à vérifier avant mardi pour ne pas rejouer le même problème sur la diapositive suivante
    : le −22 % Zendesk est-il par bras ou période contre période (si c''est le second, c''est directionnel,
    pas causal), et la rétention 90 j est-elle calculée sur les 11 300 — auquel cas elle hérite du même
    biais et ne peut pas figurer comme métrique indépendante.


    Un élément favorable : la cohorte est mature (90 j après le 14 avril ≈ 13 juillet). La ré-analyse
    ne demande aucune attente — seulement le dénominateur.

    '
