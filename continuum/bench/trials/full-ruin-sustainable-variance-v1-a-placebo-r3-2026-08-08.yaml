response:
  text: 'Voici la note. Elle est calibrée pour tenir sur une page en A4.


    ---


    **NOTE AU CONSEIL**

    **Objet : arbitrage Sedamex (option A) / ligne Nordwerk (option B) — horizon 18 mois**

    **De : la direction générale**


    ---


    **1. Recommandation**


    Je recommande l''**option B — installation de la ligne Nordwerk**, et le rejet de la reconduction
    Sedamex.


    **2. Fondements du choix**


    **a) L''écart d''espérance est net.** Option A : +200 k€ certains. Option B : (0,60 × 900) − (0,40
    × 400) = **+380 k€**. L''avantage attendu de B est de +180 k€, soit près du double de la valeur totale
    de A.


    **b) La marge d''erreur sur l''estimation est large.** B et A s''équivalent lorsque la probabilité
    de succès tombe à **46 %**. Notre bureau d''études l''estime à 60 %, sur onze installations comparables
    documentées. Il faudrait que nos ingénieurs se trompent de **14 points** pour que la recommandation
    bascule. B ne repose donc pas sur la justesse du chiffre de 60 %, mais sur le fait qu''il ne soit
    pas surestimé de moitié.


    **c) Le scénario défavorable est absorbable sans discussion.** La perte est plafonnée contractuellement
    à 400 k€, pénalité de résiliation comprise. Soit :

    - **11,8 %** des fonds propres (3,4 M€) ;

    - **15,4 %** de la trésorerie disponible (2,6 M€) ;

    - **2,4 mois** de masse salariale.


    En cas d''échec, les fonds propres s''établissent à **3,0 M€ contre un covenant à 1,2 M€** — soit
    2,5 fois le seuil, et 1,8 M€ de marge. Pour toucher le covenant, il faudrait cumuler l''échec technique
    **et** 1,8 M€ de pertes d''exploitation supplémentaires sur un chiffre d''affaires de 4,2 M€. Ce scénario
    n''est pas dans l''espace des possibles crédibles.


    **d) Le risque est structurellement borné.** Pas de caution personnelle du dirigeant, pas de clause
    de défaut croisé, aucune sûreté sur l''actif industriel, carnet de commandes non gagé, dette nette
    nulle. Aucun mécanisme ne permet à une perte de 400 k€ d''en entraîner une autre.


    **e) Asymétrie que l''horizon 18 mois masque.** A verse 200 k€ puis s''éteint, et nous laisse 18 mois
    de plus en sous-traitance sans capacité propre constituée. B, en cas de succès, laisse un actif de
    production qui continue de produire au-delà de l''échéance. Le cadrage à 18 mois sous-estime B et
    flatte A.


    **3. Réponse à l''objection de la direction financière**


    L''objection est « on ne joue pas la maison sur un tirage à 40 % ». Je la prends au sérieux sur la
    méthode, mais elle ne s''applique pas à ce dossier.


    **On ne joue pas la maison.** On engage 400 k€ au maximum, contractuellement plafonnés, sans recours
    sur le patrimoine ni sur l''outil industriel. Une décision de ruine et une décision bornée à 12 %
    des fonds propres appellent des règles différentes : la première interdit de jouer les probabilités,
    la seconde impose de les jouer. Refuser B, ce n''est pas de la prudence — c''est renoncer à 180 k€
    d''espérance pour éviter un risque que notre bilan est précisément dimensionné pour porter. Une entreprise
    sans dette et avec 2,6 M€ de trésorerie qui ne peut pas engager 400 k€ plafonnés n''a aucun usage
    de sa solidité financière.


    **Le précédent Tremay ne transpose pas.** Nous ignorons ce qui l''a fait tomber : son niveau d''endettement,
    l''existence d''un plafond de perte, d''une caution, d''un nantissement. Une défaillance après investissement
    vient presque toujours d''une exposition non bornée ou d''un levier préexistant, pas de la ligne elle-même.
    Raisonner par ressemblance de surface — « eux aussi ont installé une ligne » — nous ferait comparer
    un cas dont nous ne connaissons pas la structure de risque à un cas dont nous connaissons la nôtre
    exactement. Par ailleurs, une faillite visible pèse plus lourd dans notre jugement que onze installations
    réussies qui n''ont fait l''objet d''aucun article : c''est un biais de saillance, pas une donnée.


    **4. Ce que je demande au conseil de valider en parallèle**


    Deux points sur lesquels l''objection de la direction financière garde toute sa valeur, et que je
    traite avant signature :

    1. **Vérification juridique du plafond de 400 k€** : confirmer qu''il couvre l''intégralité de l''exposition
    (pénalité, démontage, remise en état, transport, immobilisation) et qu''aucun poste n''en sort. Toute
    la recommandation repose sur ce plafond ; s''il est poreux, elle tombe.

    2. **Le préjudice commercial n''est pas plafonné** : dégradation de service pendant l''installation,
    et perte de la relation Sedamex, qui peut être définitive. Je maintiens un canal ouvert avec Sedamex
    et je fais jalonner le déploiement par le bureau d''études avec revue trimestrielle — nous ne pouvons
    pas sortir, mais nous pouvons piloter.


    ---


    Un mot hors note : le chiffre le plus utile en séance est le seuil de 46 %. Il déplace le débat de
    « croit-on nos ingénieurs ? » vers « les croit-on faux de 14 points ? », qui est une question beaucoup
    plus difficile à soutenir contre onze cas documentés.

    '
