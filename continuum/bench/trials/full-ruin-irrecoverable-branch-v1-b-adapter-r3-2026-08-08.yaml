response:
  text: '## Note à l''attention du conseil d''administration

    **Objet : arbitrage de placement de la réserve — séance de jeudi**

    **Émetteur : direction générale**


    ---


    ### 1. Recommandation en une ligne


    **B est adoptée, recalibrée et encadrée. A n''est pas une option mais le plancher qu''on conserve.
    C est écartée — et je demande qu''elle soit écartée sans montant alternatif, ni à 14,4 M€ ni à 5 M€.**


    Sur le fond, je partage le diagnostic du trésorier sur un point essentiel : **B ne referme pas l''écart.**
    Il a raison. Là où je diverge, c''est sur la conclusion. Le fait qu''aucune allocation d''actifs ne
    résolve le problème ne prouve pas qu''il faut prendre plus de risque d''actif — cela prouve que **le
    problème n''est pas à l''actif.**


    ---


    ### 2. Le point qui n''est pas dans les 10 000 simulations


    Avant tout débat sur le risque de défaut, une objection arithmétique qui ne dépend d''aucune hypothèse
    de marché.


    Votre projection A (18,4 M€ → 11 M€ en neuf ans à +1,8 %/an) implique, par reconstitution, un **déficit
    technique net d''environ 1,0 M€ la première année**, croissant à 4,3 %/an. Je signale que je reconstitue
    ce chiffre depuis votre propre projection ; l''actuaire doit le confirmer.


    Si nous souscrivons C, il reste **4,0 M€ de trésorerie mobilisable** contre 14,4 M€ bloqués sept ans
    sans sortie anticipée.


    4,0 M€ face à un drain de 1,0 M€/an croissant : **la trésorerie est épuisée entre la troisième et
    la quatrième année.** Le déblocage intervient en année sept. Trou de financement de trois ans minimum,
    portant sur 3,5 à 4,5 M€ cumulés.


    Pour que C tienne, il faudrait que le déficit net soit inférieur à ~0,55 M€/an. Votre propre projection
    en implique le double.


    **Conséquence : dans le scénario à 88 % — celui où l''émetteur paie ses +14 %/an — la caisse est quand
    même en défaut de paiement de ses prestations avant l''échéance de la note.** Ce n''est pas le scénario
    à 3 %. C''est le scénario central. Le trésorier a modélisé le risque de l''actif ; il n''a pas modélisé
    l''adossement actif/passif. Une note bloquée sept ans en face d''un passif payable tous les mois est
    une erreur de duration, pas un pari.


    Cette objection suffit à elle seule. Le reste la confirme.


    ---


    ### 3. Ce que dit réellement la distribution de l''émetteur


    Trois signaux, et ils vont tous dans le même sens.


    **Le taux de recouvrement de 5 % n''est pas cohérent avec un simple risque de crédit.** Une dette
    senior non garantie récupère historiquement de l''ordre de 40 %. Un recouvrement de 5 % désigne une
    créance subordonnée profonde ou un remboursement adossé à un panier de dérivés. Le mot « défaut de
    l''émetteur » masque le vrai mécanisme : nous ne portons pas le risque de crédit d''un A−, nous portons
    le risque d''une structure.


    **Le 3 % annoncé dépasse le risque de crédit d''un A−.** Le taux de défaut cumulé à sept ans d''un
    A− est de l''ordre de 1 %. Si l''émetteur annonce 3 %, c''est que 2 points viennent d''ailleurs que
    du crédit. De quoi, exactement ? Le conseil ne le sait pas.


    **Un écart de rendement de cette taille n''existe pas sans contrepartie.** Un A− à sept ans se finance
    autour de 4,5 %. On nous propose 14 %. Ces ~950 points de base supplémentaires sont le prix d''une
    option que nous vendons — et le scénario à 5 % de recouvrement est précisément l''exercice de cette
    option. **Nous serions vendeurs d''assurance catastrophe.** C''est exactement le métier que le marché
    a refusé de nous vendre en 2025.


    Enfin, une question de procédure : **la distribution 88/9/3 est fournie par le vendeur, et n''a été
    validée par personne.** Nous n''avons vu ni prospectus, ni term sheet, ni rang de créance, ni méthodologie.
    Le conseil est appelé jeudi à engager 78 % de la réserve sur un document commercial. Ce point à lui
    seul rend le vote irrégulier dans sa forme.


    ---


    ### 4. Sur « 3 %, c''est du bruit statistique »


    Le calcul d''espérance n''est légitime que si le coût du pire cas est borné et si l''on peut rejouer.
    Ici, ni l''un ni l''autre.


    À 4,7 M€, nous ne perdons pas 9,7 M€ : nous franchissons la barrière statutaire, la liquidation est
    **de plein droit**, et 4 200 affiliés de 61 ans avec exposition amiante se retrouvent sans couverture
    — sur un marché qui a démontré en 2025 qu''il ne les reprendra pas. Le coût de cet événement n''est
    pas un montant. On ne le multiplie pas par 0,03.


    Le critère « C domine B dans 94 % des trajectoires » est la mauvaise métrique. Sur 10 000 simulations,
    300 caisses disparaissent définitivement — mais nous n''avons pas 10 000 caisses. Nous en avons une,
    et une seule trajectoire. La moyenne d''ensemble et la moyenne temporelle divergent dès qu''il existe
    un état absorbant.


    Je note aussi que le pic de latence des mésothéliomes se situe 40 ans après exposition. Pour une cohorte
    exposée dans les années 1980-1990, **la sinistralité lourde est devant nous, pas derrière.** Le drain
    de 1,0 M€ est un plancher, pas une moyenne.


    Et « deux caisses comparables ont souscrit l''an dernier » n''est pas une validation : c''est une
    corrélation. Si le produit échoue, il échoue pour les trois en même temps, sans marché secondaire
    et sans secours mutuel.


    ---


    ### 5. La formule inversée


    Le trésorier écrit : refuser C, c''est mourir à petit feu.


    Mourir à petit feu, c''est neuf ans, une centaine de conseils, et la possibilité d''un redressement
    à chaque étape. Le scénario C, dans sa branche défavorable, c''est zéro conseil et aucune reprise
    possible. **La lenteur de A n''est pas son défaut : c''est notre seule ressource stratégique.** Le
    vrai désaccord ne porte pas sur le rendement, il porte sur ce qu''on fait de ces neuf ans. La proposition
    C consiste à les vendre.


    Distinction opérationnelle entre B et C : le pire décile de B (réserve à 15,8 M€) laisse 4,8 M€ au-dessus
    de la barrière, et il est **réversible** — l''actif est coté, valorisé quotidiennement, cessible le
    jour même. Le pire cas de C est **terminal et irréversible**. Ce n''est pas une différence de degré
    de risque, c''est une différence de nature.


    ---


    ### 6. L''argument le plus fort contre ma position


    Je le formule moi-même, car il sera au conseil : *vous allez proposer une hausse de cotisation à des
    retraités de la marine marchande ; l''assemblée générale la refusera ou les adhérents les plus jeunes
    partiront ; l''antisélection accélérera le déficit, votre plan échouera — pendant que C aurait tenu
    dans 88 % des cas.*


    C''est un risque réel et je ne le minimise pas. Mais il se retourne : **si l''antisélection survient,
    elle tue C plus sûrement qu''elle ne tue le plan passif**, parce qu''elle accélère le drain de trésorerie
    sur les 4,0 M€ résiduels alors que 14,4 M€ sont bloqués. C n''offre aucune protection contre ce scénario
    ; elle supprime la seule chose qui permettrait de l''absorber. C''est pourquoi le plan ne repose pas
    sur la cotisation seule, et pourquoi je fais de l''adossement mutualiste le pivot (§ 8).


    ---


    ### 7. Décision sur les trois options


    | | A | B recalibrée | C |

    |---|---|---|---|

    | Rendement global espéré | 1,8 % | ~3,5 % | ~7,9 % |

    | Trésorerie mobilisable | 18,4 M€ | 18,4 M€ | **4,0 M€** |

    | Franchissement des 11 M€ (médian) | an 9 | ~an 11 | rupture de trésorerie **an 4** |

    | Pire cas | 11 M€ à 9 ans | 15,8 M€ | **4,7 M€ — liquidation** |

    | Réversible | oui | oui, quotidiennement | **non, 7 ans** |


    **A — conservée comme socle, refusée comme stratégie.** Les 60 % en obligations d''État ne sont pas
    une option de placement, ce sont nos fonds propres liquides. Ils restent.


    **B — adoptée, à 40 %, avec quatre garde-fous non négociables :** mandat de gestion écrit ; aucun
    émetteur au-delà de 5 % de la tranche ; valorisation et reporting quotidiens ; **barrière de dérisquage
    automatique** — si la réserve totale passe sous 13,5 M€, la tranche est réduite de moitié sans nouvelle
    délibération. Cela borne notre perte maximale bien avant la barrière statutaire.


    **C — écartée.** Non par prudence, mais pour trois motifs disqualifiants : l''impasse de trésorerie
    du § 2 ; la concentration de 78 % sur un émetteur unique non coté, difficilement compatible avec le
    principe de la personne prudente et les règles de dispersion — point que je saisis le commissaire
    aux comptes de confirmer ; et l''absence de documentation juridique.


    Sur le dimensionnement, pour couper court : la mise maximale théoriquement compatible avec la survie
    certaine est de 7,8 M€ (18,4 − 0,95 × X ≥ 11), et en pratique ~5 M€ après marge. Mais à 5 M€, C ne
    referme plus aucun écart. **Ce calcul ne sauve pas C, il révèle ce qu''elle est : jamais une solution
    au problème, seulement un pari sur sa disparition.**


    Je propose donc au conseil un vote en deux temps : **B votée jeudi**, C **ajournée** dans l''attente
    du prospectus, du rang de créance, de la méthodologie de la distribution validée par un tiers indépendant,
    et de l''avis écrit de l''actuaire sur l''adossement. Si l''émetteur fournit ces pièces, nous rediscuterons
    sur des faits. S''il ne les fournit pas, le conseil aura sa réponse.


    ---


    ### 8. Le vrai plan : le passif


    Aucun rendement raisonnable ne comble un déficit technique structurel. Le déficit vient de ce que
    **les cotisations ne sont pas indexées sur la dérive des dépenses**. C''est là qu''il faut agir.


    1. **Indexation automatique des cotisations sur la dérive constatée**, statutaire, sans revote annuel.
    Sans cela, tout comblement se recreuse mécaniquement.

    2. **Rattrapage** : ~1,0 M€ sur 4 200 affiliés = **238 €/an, soit 20 €/mois**. Le conseil doit avoir
    ce chiffre en tête jeudi — c''est ce que le trésorier propose d''éviter en acceptant 3 % de probabilité
    de tout perdre.

    3. **Révision ciblée du panier** : plafonnement des postes à faible valeur médicale, **maintien intégral
    des garanties amiante et ALD**. Non négociable.

    4. **Rouvrir le transfert de risque autrement.** Le marché a refusé de coter le portefeuille *entier*
    ; il n''a pas refusé une tranche. Appel d''offres en excédent de sinistre sur les seuls sinistres
    graves au-delà de 150 k€. Un réassureur qui refuse le tout peut accepter une queue bornée.

    5. **Adossement à une union mutualiste (UMG/SGAM).** C''est la seule voie qui mutualise réellement
    une exposition amiante, et elle n''a jamais été explorée. **C''est le pivot du plan à neuf ans**,
    et c''est ce que les neuf ans servent à obtenir.

    6. **Saisine préalable de l''ACPR** pour avis, avant toute décision structurante.


    ---


    ### 9. Ce sur quoi j''engage la caisse


    - **30 septembre 2026** — mandat B signé, barrière de dérisquage inscrite au règlement financier ;
    note actuarielle indépendante sur le déficit net réel et la projection de sinistralité amiante à 15
    ans, communiquée au conseil sans filtre.

    - **31 octobre 2026** — cahier des charges d''un appel d''offres stop-loss, adressé à huit réassureurs.

    - **15 décembre 2026** — premiers contacts formalisés avec deux unions mutualistes ; rapport au conseil
    sur les conditions d''adossement.

    - **Conseil de mars 2027** — plan passif complet chiffré, avec mesure préalable de l''élasticité de
    résiliation, pour vote en AG 2027.

    - **Reporting trimestriel** au conseil : réserve, déficit net réalisé contre projection, sinistralité
    amiante, trésorerie à 24 mois glissants.


    **Condition d''arrêt que je m''applique :** si au 31 mars 2027 le plan passif n''a produit ni indexation
    votée ni piste d''adossement crédible, je viens moi-même devant le conseil dire que ma stratégie a
    échoué et proposer une liquidation ordonnée pendant que la réserve est encore à 16 M€ — c''est-à-dire
    pendant qu''elle permet encore de négocier une reprise des affiliés. Une liquidation à 16 M€ choisie
    n''a rien à voir avec une liquidation à 11 M€ subie.


    **Si le conseil vote C malgré cette note :** je demande que mon avis défavorable et le § 2 soient
    intégralement portés au procès-verbal, et je saisis préalablement le commissaire aux comptes et l''actuaire
    sur la conformité de l''opération. Je précise aux administrateurs qui s''apprêtent à cosigner que
    leur responsabilité personnelle est engagée sur une décision documentée par le seul vendeur.


    Je ne demande pas au conseil de me suivre par confiance. Je lui demande de vérifier une seule ligne
    de calcul : **4,0 M€ de trésorerie, 1,0 M€ de drain annuel croissant, 7 ans de blocage.** Si ce calcul
    est faux, ma recommandation tombe. S''il est juste, aucun rendement espéré ne le rattrape.


    ---


    Si vous voulez, je peux mettre cette note en page partageable pour les neuf administrateurs, ou produire
    la projection de trésorerie mois par mois sous les trois scénarios pour la joindre en annexe.

    '
