response:
  text: '# NOTE AU COMITÉ DE DIRECTION


    **Objet :** Contrat cellules 2027 — arbitrage Kelmar / Sinolux

    **De :** Direction des opérations · **Date :** lundi


    ## Décision proposée


    **Réserver la capacité Kelmar à J+18 pour les 72 000 unités. Ne pas basculer sur Sinolux en 2027.
    Ouvrir à Sinolux une qualification chiffrée pour 2028.**


    ## 1. Les 230 400 € sont une économie brute, pas un gain


    Le prix de la cellule n''est pas le coût de la cellule. Chaque chargeur repris coûte 205 €, quel que
    soit le fournisseur. La garantie Sinolux (remplacement gratuit de la cellule défectueuse) retire au
    mieux le prix de la cellule de ce montant, soit 182,20 € nets par retour — elle couvre 11 % de l''événement
    qu''elle prétend couvrir.


    | Scénario | Cellules | Retours | Coût total | vs Kelmar |

    |---|---|---|---|---|

    | **Kelmar 1,3 %** (936 retours) | 1 872 000 € | 191 880 € | **2 063 880 €** | — |

    | Sinolux 1,1 % (essais fournisseur) | 1 641 600 € | 144 302 € | 1 785 902 € | **− 277 978 €** |

    | Sinolux 3,1 % (audit de mars) | 1 641 600 € | 406 670 € | 2 048 270 € | **− 15 610 €** |

    | Sinolux 3,1 %, sans crédit de garantie | 1 641 600 € | 457 560 € | 2 099 160 € | **+ 35 280 €**
    |

    | Sinolux 4,0 % | 1 641 600 € | 524 736 € | 2 166 336 € | **+ 102 456 €** |


    **Le point mort se situe entre 2,86 % et 3,22 %** selon la façon dont on crédite la garantie. La meilleure
    mesure indépendante disponible est à 3,1 % — c''est-à-dire dans l''épaisseur du trait. Nous ne discutons
    pas d''une économie de 230 400 € : nous discutons d''un résultat compris entre −16 k€ et +35 k€, sur
    une base de coût de 2 M€. **C''est zéro.** On ne change pas de fournisseur de manière irréversible,
    sur un fournisseur non qualifié, pour zéro.


    ## 2. Nous avons deux sources, pas trois


    La note méthodologique de Ferro indique qu''il travaille sur l''échantillon de l''audit de mars. **Ferro
    ne confirme pas l''audit : il le reformule.** Il reste donc un chiffre vendeur (1,1 %) et une mesure
    indépendante (3,1 %). Le seul élément qui plaide pour la bascule est produit par la partie qui encaisse
    la bascule.


    ## 3. Le refus d''indexation est le fait le plus informatif du dossier


    Un fournisseur qui croit à ses 1,1 %, pour un contrat de 1,64 M€, signe une clause indexée à 2 % :
    elle ne lui coûte rien. Sinolux la refuse et propose à la place des cellules gratuites à 22,80 € contre
    un événement à 205 €. **C''est une position tarifée, pas une position commerciale.** Elle vaut, à
    mon sens, davantage que les trois estimations réunies.


    ## 4. L''essai Vertex arrive après la décision


    Neuf semaines ≈ J+63. Kelmar ferme à J+18, Sinolux tient jusqu''à J+21. **Les 34 000 € achèteraient
    une information qui arrive 45 jours après l''échéance qui compte.** Elle ne devient utile qu''en la
    réorientant sur 2028 (voir §7).


    ## 5. Le risque qui n''est pas dans les 205 €


    Les 205 € supposent une capacité atelier marginale disponible. À 3,1 %, nous passons de 936 à 2 232
    reprises — 2,4×. À 4 %, 3×. Au-delà d''un certain seuil, l''atelier ne dégrade plus le coût unitaire
    : il dégrade les délais sur les chargeurs neufs, et ce coût-là n''est chiffré nulle part dans ce dossier.
    Ce n''est pas une branche de ruine, et je ne la présente pas comme telle — mais c''est la seule non-linéarité
    du dossier, et elle joue toute entière contre Sinolux.


    ## 6. Le meilleur argument contre ma recommandation


    L''audit porte sur « une ligne comparable », pas sur notre référence ; les essais Sinolux peuvent
    refléter une amélioration réelle. En espérance pure, avec ne serait-ce que 30 % de crédit accordé
    au 1,1 %, la bascule est positive (+53 k€). **Cet argument tient tant qu''on accorde 30 % au chiffre
    du vendeur.** Le refus d''indexation (§3) fait tomber ce crédit sous 15 % : l''espérance retombe à
    +9 k€, soit du bruit, avant même le risque atelier. L''argument ne bascule pas la décision, mais il
    justifie de ne pas fermer la porte à Sinolux (§7).


    ## 7. Recomposition : Sinolux garde une place, sur 2028


    - Financement de l''essai Vertex par Sinolux (ou 50/50) comme **ticket d''entrée qualifiant**, en
    substitution de la clause indexée qu''il refuse.

    - **Engagement écrit de notre part** : résultat ≤ 2,0 % (borne haute 2,3 % avec la précision ±0,3,
    sous le point mort) ⇒ Sinolux devient référence 2028 ou prend une tranche ferme.

    - Résultat > 2,5 % ⇒ dossier clos, sans nouvelle consultation.


    C''est un pouvoir réel transféré — un objectif chiffré, une échéance, un contrat à la clé — et non
    une consultation de courtoisie.


    ## 8. Repli et déclencheur observable


    **Déclencheur :** résultat Vertex ≤ 2,0 % à J+63 ⇒ ouverture de la tranche 2028 selon §7.

    **Déclencheur inverse :** > 2,5 % ⇒ clôture définitive.


    ## 9. Ce qui renverserait cette décision avant J+18


    Une mesure **authentifiée et indépendante, portant sur la référence exactement livrée en 2027** (et
    non sur « une ligne comparable »), échantillon et protocole auditables, à ≤ 2,0 %. Le chiffre interne
    Sinolux, en l''état, n''est pas cette mesure.


    ## 10. Premières actions — cette semaine


    1. **Faire préciser par écrit les termes de la réservation Kelmar** (engagement de volume ferme, ou
    option de capacité avec frais ?). C''est l''inconnue la plus décisive du dossier, elle coûte un appel,
    et elle est dans la fenêtre — contrairement aux 34 000 € de Vertex.

    2. **Vérifier si Kelmar couvre aussi la cellule défectueuse** (hypothèse retenue ci-dessus : non ;
    si oui, l''écart se creuse encore contre Sinolux).

    3. **Négocier Kelmar avec le devis Sinolux en main** avant J+18 : 1 €/cellule concédé = 72 000 € acquis,
    sans risque de qualification.

    4. **Adresser à Sinolux la proposition §7** avant J+21.

    5. **Retirer les 230 400 € du budget 2027.** Ils n''y ont jamais eu leur place : c''était un montant
    brut inscrit avant l''examen du coût de retour. Le montant à réinscrire, sous réserve du point 3,
    est celui obtenu de Kelmar.


    ---


    **Réserve :** j''ai chiffré la garantie Sinolux à sa valeur maximale (22,80 €/retour). Si l''échange
    de cellule est déjà inclus dans les 205 € au titre du « traitement en atelier », la garantie ne vaut
    rien et la ligne pertinente du tableau est la quatrième — perte de 35 280 €.

    '
