response:
  text: 'Je note d''abord que l''annexe jointe (catalogue de stations de mesure environnementale) n''a
    aucun rapport avec ce dossier de flotte — je ne l''ai pas utilisée. Si un document devait l''accompagner,
    il n''est pas arrivé.


    Voici le plan.


    ---


    # PLAN D''EXÉCUTION — CONVERSION ÉLECTRIQUE DE LA FLOTTE

    **Direction de l''exploitation — Conseil de jeudi**


    ## 1. Ce que le plan tient, ce qu''il ne tient pas


    **Tenu :**

    - La subvention de 620 000 € : 62 véhicules en exploitation au 30 novembre, deux mois de marge sur
    l''échéance du 31 janvier.

    - Les 96 véhicules commandés sont réceptionnés et payés selon le calendrier signé. Aucune renégociation.

    - Aucune dégradation du taux de tournées terminées pendant la transition.


    **Non tenu par la commande seule :**

    - La conversion **intégrale** (zéro diesel) n''est pas atteignable en décembre 2026. Elle l''est au
    2ᵉ trimestre 2027. La contrainte n''est pas le véhicule, c''est la borne.

    - État réel fin décembre 2026 : **66 VE en exploitation, 38 diesels conservés** sur les tournées longues.


    Ce point doit être acté jeudi. Toute communication annonçant une flotte 100 % électrique fin décembre
    serait démentie par l''exploitation dès janvier.


    ## 2. La contrainte dure est la charge, pas l''autonomie


    96 tournées pour 96 véhicules : un véhicule fait une tournée par jour. **Toute la charge est nocturne.**
    Il n''existe pas de fenêtre de rattrapage en journée.


    Besoin de charge par véhicule = (km de la tournée ÷ autonomie réelle) × 6 h.


    | Conditions | Autonomie retenue | Tournée 145 km | Tournée 168 km | Tournée 190 km |

    |---|---|---|---|---|

    | Tempéré | 232 km | 3,8 h | 4,3 h | 4,9 h |

    | Froid (2 °C, chauffage) | 197 km | 4,4 h | 5,1 h | 5,8 h |


    Fenêtre exploitable 17h–08h = 15 h, rendement de rotation 85 % → **12,75 h utiles par borne et par
    nuit.**


    | Parc de bornes | Heures utiles/nuit | VE chargeables en hiver (145 km moy.) | VE chargeables en
    hiver (168 km moy.) |

    |---|---|---|---|

    | 14 (actuel) | 178 | 40 | 35 |

    | 22 (après tranche 2) | 280 | **63** | 55 |

    | 30 (tranche 3) | 382 | 86 | 75 |

    | 38 (tranche 4) | 484 | 110 | **95** |


    Lecture : **22 bornes plafonnent l''exploitation à environ 60–63 véhicules électriques**, et seulement
    si ces véhicules roulent sur des tournées courtes. Il en faut 38 pour faire tourner 96 véhicules sur
    le mix actuel. Le dossier soumis au conseil en mai chiffrait 96 véhicules et 22 bornes : ces deux
    chiffres ne se referment pas.


    ## 3. Le levier central : redécouper le plan de tournées en deux étages


    Le kilométrage total est invariant : 96 × 168 = **16 128 km/jour**. Ce qui est libre, c''est sa répartition.


    | Étage | Tournées | Plafond | Moyenne visée | Km/jour |

    |---|---|---|---|---|

    | **VE** | 60 | 160 km | 145 km | 8 700 |

    | **Diesel** | 36 | 240 km | 206 km | 7 428 |

    | Total | 96 | | 168 km | 16 128 ✓ |


    Ce redécoupage est ce qui rend le plan possible. Sur le mix historique (moyenne 168, maximum 240),
    un plafond VE à 160 km ne laisserait qu''une quarantaine de tournées éligibles — **en dessous des
    60 exigés par la subvention**. Le redécoupage crée les 60 tournées courtes qui n''existent pas aujourd''hui,
    en concentrant le kilométrage sur l''étage diesel.


    Coût attendu : +2 à 4 % de kilométrage total (perte d''optimalité géographique), soit environ 400
    km/jour. À chiffrer par le bureau d''études, rendu le 5 septembre.


    ## 4. Plafond de planification VE


    L''autonomie constructeur de 260 km est écartée : l''essai mesure −11 % (232 km) et −24 % par 2 °C
    avec chauffage (197 km).


    - Base de dimensionnement : **197 km** du 1ᵉʳ novembre au 31 mars, **232 km** hors saison.

    - Marge d''exploitation 20 % (détours, congestion, chauffage, vieillissement batterie).

    - **Plafond de planification : 160 km du 1ᵉʳ novembre au 31 mars, 185 km d''avril à octobre.**


    Cohérent avec l''essai : 11 recharges non prévues sur 120 tournées, **toutes au-dessus de 190 km,
    aucune en dessous.**


    **Règle météo :** prévision de minimale < 3 °C → toute tournée VE de plus de 140 km bascule sur l''étage
    diesel pour la journée. Décision prise la veille à 16 h, sur le planning du lendemain.


    ## 5. Calendrier d''exécution


    | Fin de mois | VE livrés (cum.) | VE en exploitation | Bornes | Diesels conservés | Rappel : reprise
    « au fil de l''eau » |

    |---|---|---|---|---|---|

    | Sept. | 24 | 20 | 14 | 84 | 72 |

    | Oct. | 48 | 44 | **22** | 60 | 48 |

    | Nov. | 72 | **62** ← subvention | 22 | 42 | 24 |

    | Déc. | 96 | 66 | 22 | 38 | 0 |

    | Jan.–mars | 96 | 66 | 22 → **30** | 38 | — |

    | Avril | 96 | 80 | 30 | 24 | — |

    | T2 2027 | 96 | 96 | **38** | 0 | — |


    Un buffer de 8 diesels au-delà du strict besoin est maintenu en permanence jusqu''en avril. C''est
    ce qui permet d''absorber une panne, une immobilisation ou une vague de froid sans réacheminement.


    **Enveloppe de prolongation de location : 194 véhicule-mois sur sept.–mars, puis 60 sur avril–juin
    → ~254 × 480 € ≈ 122 000 €.** Je demande 125 000 €.


    Contre quoi ? Si les 36 tournées longues étaient confiées à des VE, le taux mesuré de 9,2 % de recharges
    non prévues donne 3,3 incidents par jour. Même en ne convertissant qu''un tiers d''entre eux en tournée
    non terminée : ~1 000 €/jour, soit 22 000 €/mois, contre 18 240 €/mois pour 38 diesels. Au taux mesuré
    plein, le rapport est de 3,5 pour 1 en faveur du diesel — et ce calcul ignore que les 9,2 % ont été
    relevés en mars, pas en janvier. **La prolongation de location est l''assurance la moins chère du
    dossier.**


    ## 6. Le verrou des 30 jours et des 11 semaines


    C''est le point le plus dangereux du dossier, et il n''est pas financier.


    Un diesel rendu ne revient pas avant 11 semaines. La prolongation exige un préavis de 30 jours. Autrement
    dit : **toute décision de reprise est prise sur des données antérieures d''un mois à la situation
    qu''elle produit, et engage l''exploitation sur les 11 semaines suivantes.**


    Méthode qui en découle :

    - Chaque porte de décision est calée à **J−30 de la reprise du lot** concerné.

    - La règle par défaut est **prolonger**. On ne rend un lot que si les indicateurs des 15 jours précédents
    sont au vert sur les cinq seuils du §9.

    - Le doute se paie 480 € par véhicule et par mois. L''erreur se paie 11 semaines de réacheminement.


    Portes de préavis : **15 août** (lot 1 — à autoriser jeudi), puis 15 septembre, 15 octobre, 15 novembre,
    15 décembre.


    ## 7. Chemin critique : les 8 bornes, et un risque non chiffré au dossier


    7 semaines de travaux. Signature jeudi → mise en service vers le 2 octobre. Chaque semaine perdue
    à la signature est perdue en bout de chaîne ; un glissement au-delà du 15 novembre met les 620 000
    € en risque direct.


    **Alerte à lever avant jeudi — vérification à lancer lundi :** le devis de 210 000 € couvre-t-il le
    **renforcement du raccordement électrique** ? 22 bornes × 22 kW = 484 kW appelés simultanément. Si
    la puissance souscrite des plateformes doit être augmentée, le délai du gestionnaire de réseau est
    de 6 à 12 mois — sans rapport avec les 7 semaines de travaux, et il devient alors le véritable chemin
    critique de la subvention. C''est l''action n° 1 du plan, et la seule qui puisse invalider le calendrier
    avant même qu''il commence.


    **Atténuation immédiate, indépendante du réseau :** pilotage de charge (séquencement et délestage),
    20 à 25 k€, 3 semaines. Il permet d''exploiter 22 bornes sous une puissance souscrite inférieure et
    d''organiser deux vagues de charge. À engager quel que soit le résultat de la vérification.


    À tester en septembre, non acquis à ce stade : limiter la charge à 80 % de SoC. Les derniers 20 %
    sont les plus lents ; 80 % de 197 km = 158 km, soit exactement notre plafond hivernal. Le gain potentiel
    sur le débit des bornes est de l''ordre de 20–30 %. À mesurer sur les 20 premiers véhicules avant
    d''être inscrit au dimensionnement.


    ## 8. Pilotage quotidien


    Le superviseur remonte état de charge et kilométrage toutes les 10 minutes. **Tout ce qui suit est
    calculable sans matériel nouveau.**


    Déjà publiés au tableau de bord du soir :

    1. Taux de tournées terminées — à ventiler désormais par étage (VE / diesel)

    2. Recharges non prévues


    À ajouter avant le 1ᵉʳ septembre :

    3. **SoC à l''arrivée au dépôt** — minimum et 10ᵉ percentile, par étage. C''est la marge réelle, et
    c''est l''indicateur qui manque aujourd''hui.

    4. Km réalisés / km planifiés par tournée

    5. Durée de charge réelle par véhicule, calculée sur les deltas de SoC

    6. Taux d''occupation des bornes sur la fenêtre 17h–08h

    7. **Nombre de véhicules non chargés à 06h00** — indicateur avancé de la saturation, il bascule avant
    que les tournées ne tombent


    ## 9. Règles d''arrêt


    | Indicateur | Seuil | Action, sans arbitrage |

    |---|---|---|

    | Tournées terminées, étage VE | < 98 % sur 5 jours glissants | Les 10 tournées VE les plus longues
    rebasculent diesel ; plafond abaissé de 20 km |

    | SoC p10 à l''arrivée | < 15 % sur 5 jours | Plafond de planification abaissé de 15 km |

    | Occupation des bornes 17h–08h | > 90 % sur 5 nuits | Gel des mises en service VE ; prolongation
    du lot diesel suivant |

    | Véhicules non chargés à 06h00 | ≥ 3 une nuit | Analyse sous 24 h. ≥ 3 sur 3 nuits → gel des mises
    en service |

    | Recharges non prévues | > 2 pour 100 tournées VE sur 10 jours | Revue du découpage de l''étage VE
    sous 5 jours |


    Aucun de ces seuils ne demande de jugement, et tous sont lisibles sur le tableau de bord existant.


    ## 10. L''argument le plus solide contre ce plan


    **Le dimensionnement repose sur une mesure à 2 °C, pas sur l''hiver.** Les 197 km ont été relevés
    en mars, sur six véhicules. Un janvier à −5 °C peut ramener l''autonomie utile à 170–175 km, ce qui
    ferait tomber le plafond de planification à 140 km. À 140 km, les 60 tournées de l''étage VE ne tiennent
    plus dans l''enveloppe de 8 700 km : il en faudrait 62, et l''étage diesel absorberait davantage de
    kilométrage. La subvention se jouerait alors sur des véhicules immatriculés et roulants mais sous-employés.


    Trois réponses, et elles sont dans le plan :


    1. **Le critère régional est « rouler », pas « rouler 160 km ».** 62 VE immatriculés, assurés et enregistrant
    des kilomètres au superviseur satisfont le critère même sur des tournées de 120 km. Nous disposons
    de la preuve télémétrique. **À faire confirmer par écrit par la Région avant le 30 septembre** — action
    n° 2 du plan. Si la Région pose un critère d''usage minimal, tout le calendrier est à revoir, et il
    vaut mieux le savoir en septembre qu''en janvier.

    2. **Le buffer de 38 diesels est précisément l''amortisseur de ce scénario.** Il coûte 18 240 €/mois.
    C''est le prix de ne pas avoir à deviner.

    3. **La première vague de froid, en novembre, donne la mesure réelle avant que la tranche 3 ne soit
    décidée.** On tranche sur données, pas sur hypothèse.


    Second point d''honnêteté : les 24 véhicules livrés en décembre resteront partiellement immobilisés
    jusqu''à la mise en service de la tranche 3, soit environ 775 k€ d''actif inemployé pendant trois
    à quatre mois. La commande étant ferme, l''alternative n''est pas de ne pas les recevoir — c''est
    de commander la tranche 3 dès octobre, en engageant 210 k€ sur des hypothèses que l''hiver n''a pas
    encore validées. **Je recommande la décision en novembre sur données réelles.** Le conseil peut trancher
    autrement ; la porte est datée et le coût de chaque branche est chiffré.


    ## 11. Décisions demandées au conseil jeudi


    1. **Signature des 8 bornes — 210 000 €, jeudi.** Chemin critique de la subvention. Un report d''une
    semaine consomme une semaine de marge sur les 620 000 €.

    2. **Enveloppe de prolongation de location — 125 000 €**, avec délégation de signature des préavis
    lot par lot aux portes J−30.

    3. **Pilotage de charge — 25 000 €**, engagement immédiat.

    4. **Réserve tranche 3 (8 bornes, 210 000 €)** — décision ferme au conseil de novembre, sur les données
    des deux premières vagues de froid.

    5. **Acter la cible réelle** : 62 VE au 30 novembre, 66 fin décembre, conversion intégrale au 2ᵉ trimestre
    2027.


    **Solde financier de la trajectoire :** +620 000 € (subvention) − 210 000 € (bornes T2) − 125 000
    € (location) − 25 000 € (pilotage) = **+260 000 €** avant tranches 3 et 4, et avant le coût évité
    des tournées non terminées.


    ## 12. Les sept premiers jours


    | Jour | Action | Statut |

    |---|---|---|

    | Lundi | Vérification du raccordement électrique (puissance souscrite vs 484 kW) | **Bloquant** |

    | Lundi | Extraction depuis le superviseur de la distribution réelle des 96 tournées sur 12 mois |
    Le chiffre qui manque au dossier : combien de tournées ≤ 160 km aujourd''hui |

    | Mardi | Demande écrite à la Région sur la définition de « véhicule roulant » | Bloquant à 60 j |

    | Mercredi | Mandat au bureau d''études pour le redécoupage en deux étages, rendu le 5 septembre |
    |

    | Jeudi | Conseil | |

    | Vendredi | Préavis de prolongation du lot 1 au loueur | Échéance 15 août |

    | Vendredi | Spécification des 5 indicateurs à ajouter, livraison 31 août | |


    ---


    **Le point qui mérite d''être dit au conseil en une phrase :** la décision de mai est bonne et elle
    est engagée ; ce qui n''a pas été dimensionné avec elle, c''est l''infrastructure de charge, et c''est
    elle — pas les véhicules — qui fixe le rythme réel de la conversion.


    Deux chiffres restent à confirmer avant jeudi et peuvent modifier le plan : la capacité du raccordement
    électrique, et la distribution réelle des longueurs de tournées. Je les aurai lundi soir.

    '
