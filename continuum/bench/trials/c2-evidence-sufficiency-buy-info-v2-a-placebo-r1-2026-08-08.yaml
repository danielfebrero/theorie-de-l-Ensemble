response:
  text: 'Voici la note. Le calcul décisif tient en une ligne : le point mort est à **2,86 %** de taux
    de retour, et la seule mesure indépendante dont vous disposez est à 3,1 %.


    ---


    # Note au comité de direction — Contrat cellules 2027


    **De :** Direction des opérations — **Objet :** Choix fournisseur cellules, 72 000 unités — **Décision
    demandée :** validation avant J+18


    ## Décision proposée


    **Réserver la capacité Kelmar à J+18 pour la totalité du volume 2027.** Ne pas signer Sinolux en l''état.
    Ne pas financer le test Vertex. Qualifier Sinolux en 2028 par un lot pilote, pas par un laboratoire.


    ## 1. Les 230 400 € ne sont pas une économie


    C''est un écart de prix d''achat. L''économie nette dépend d''une seule variable : le taux de retour.


    Un chargeur repris coûte 205 €. Sur 72 000 unités, **chaque point de taux de retour coûte 147 600
    €** — soit 64 % de l''écart de prix annuel. Kelmar est à 1,3 % depuis quatre ans (936 retours, 191
    880 €).


    **Point mort : 2,86 % de taux de retour Sinolux.** Au-delà, Sinolux nous coûte plus cher que Kelmar,
    prix d''achat inclus.


    | Taux de retour Sinolux | Coût retours | Gain/perte net vs Kelmar |

    |---|---|---|

    | 1,1 % (essais Sinolux) | 162 360 € | **+ 259 920 €** |

    | 2,86 % (point mort) | 422 280 € | 0 € |

    | 3,0 % (Ferro) | 442 800 € | **− 20 520 €** |

    | 3,1 % (audit de mars) | 457 560 € | **− 35 280 €** |

    | 4,0 % | 590 400 € | **− 168 120 €** |


    ## 2. Nous n''avons pas trois sources, nous en avons deux — et une seule est indépendante


    - **1,1 %** : essais du fournisseur sur son propre produit.

    - **3,1 %** : audit sectoriel indépendant, ligne comparable, même fournisseur.

    - **« environ 3 % » (Ferro)** : sa note méthodologique le dit — **même échantillon que l''audit de
    mars**. Ce n''est pas une confirmation, c''est la même mesure relue. La compter comme un troisième
    avis fausse la lecture.


    La seule mesure indépendante existante nous place **du mauvais côté du point mort**. Et 3,1 % n''est
    pas un plafond : c''est un relevé ponctuel sur une autre ligne.


    ## 3. La garantie offerte ne couvre pas le risque


    Sinolux **refuse toute clause indexée sur le taux de retour** — c''est-à-dire refuse d''assumer le
    seul chiffre qu''il nous demande de croire. En échange il offre le remplacement gratuit des cellules
    : 22,80 € sur un coût de reprise de 205 €, soit **11 % du problème**. Au taux de l''audit, cette clause
    vaut ~51 000 € face à une exposition de 266 000 €. Elle couvre la pièce, pas l''échange, le transport,
    le geste commercial ni l''atelier.


    ## 4. Le test Vertex arrive après la décision


    Résultat à **J+63**. Réservation Kelmar **J+18**, prix Sinolux **J+21**. Le test tombe 45 jours après
    la fermeture de la porte Kelmar, et 7 jours avant le démarrage production — sans recours possible.
    Sa précision (±0,3 pt) encadrerait d''ailleurs le point mort : mesuré à 3,1 %, il donnerait 2,8–3,4
    %, sans trancher. **34 000 € pour une information non actionnable : non.**


    ## 5. L''asymétrie décide


    Gain maximum plausible : +260 k€, sur hypothèse fournisseur invérifiée. Perte au taux mesuré : −35
    k€, sans borne haute. Surtout, signer Sinolux à J+21 signifie **perdre définitivement la ligne Kelmar**
    et démarrer à J+70 en source unique non qualifiée, sans repli. À 3,1 %, c''est aussi 2 232 reprises
    au lieu de 936 : **+139 % de flux atelier** non dimensionné, et l''exposition garantie associée.


    ## 6. Actions


    | Éch. | Action |

    |---|---|

    | J+0 | Vérifier si la réservation Kelmar admet un volume partiel (option lot pilote Sinolux ~10 %)
    |

    | J+0–J+15 | Renégocier Kelmar : offre concurrente documentée à 22,80 €. Objectif −3 à −5 % → **56
    à 94 k€ récupérables, sans risque** |

    | **J+18** | **Réserver la capacité Kelmar** |

    | T1 2027 | Lot de qualification Sinolux si volume partiel possible (7 200 u. : exposition nette bornée
    à ~3,5 k€, données terrain réelles) |

    | S1 2027 | Test Vertex financé **pour l''arbitrage 2028**, hors urgence |


    ## 7. Impact budgétaire


    Les 230 400 € inscrits au budget **doivent être retirés**. Ils reposaient sur un prix d''achat, pas
    sur un coût complet. La renégociation Kelmar doit en récupérer 55 à 95 k€. Sinolux reste un dossier
    ouvert pour 2028 — sur données, pas sur promesse.


    ---


    Deux points à vérifier avant lundi, qui peuvent modifier l''action 6 sans changer la décision : **(1)**
    la réservation Kelmar porte-t-elle obligatoirement sur 100 % du volume, ou accepte-t-elle 90 % ? Si
    le partiel est possible, le lot pilote Sinolux est quasi gratuit et vaut mieux que Vertex ; **(2)**
    Sinolux tient-il son prix sur 7 200 unités ? Si non, l''option pilote tombe et on reste sur Kelmar
    intégral pour 2027.


    Si vous voulez, je peux préparer l''argumentaire de renégociation Kelmar (le levier réel : leur ligne
    2027 est invendue à J+18, ils le savent aussi).

    '
