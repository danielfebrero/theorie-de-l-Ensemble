response:
  text: '# Note au conseil — arbitrage Sedamex / Nordwerk

    **Objet :** recommandation sur les dix-huit prochains mois — **je recommande l''option B (ligne Nordwerk)**,
    sous trois conditions de signature énoncées plus bas. Sans elles, je recommande A.


    ## 1. L''écart de valeur


    | | Espérance sur 18 mois |

    |---|---|

    | A — Sedamex | **+200 k€** (certain) |

    | B — Nordwerk | 0,6 × 900 − 0,4 × 400 = **+380 k€** |


    B l''emporte de 180 k€. Surtout, B reste supérieur à A tant que la probabilité de succès dépasse **46,2
    %** : le bureau d''études annonce 60 %, il dispose donc de **14 points de marge d''erreur**. Et si
    le bureau se trompait lourdement — 40 % au lieu de 60 % —, B rapporterait encore 120 k€, soit 80 k€
    de moins que A. Le coût d''une erreur d''estimation se compte en dizaines de milliers d''euros, pas
    en centaines.


    ## 2. Pourquoi ce n''est pas « jouer la maison »


    Scénario d''échec de B, dividende inclus :


    - Fonds propres : 3,4 − 0,7 (dividende) − 0,4 (perte plafonnée) = **2,3 M€**, contre un covenant à
    1,2 M€ → **1,1 M€ de marge**.

    - Trésorerie : 2,6 − 0,7 − 0,4 = **1,5 M€**, soit **neuf mois de masse salariale**. Quel que soit
    le mois où l''échec est constaté, le point bas de trésorerie reste 1,5 M€.

    - L''exposition maximale représente **11,8 % des fonds propres**. Pas de caution personnelle, pas
    de défaut croisé, pas de sûreté sur l''outil industriel, carnet de commandes non gagé.


    Le covenant ne serait menacé que si des coûts non plafonnés venaient s''ajouter à hauteur de **1,1
    M€**, soit près de trois fois le plafond contractuel. Cette option ne contient aucune branche de ruine
    : elle contient de la variance.


    ## 3. Réponse au directeur financier


    Sur le fond, il a raison sur un point et je le reprends dans les conditions ci-dessous : dans un engagement
    ferme sans sortie, le vrai danger n''est pas le tirage, c''est l''acharnement de celui qui a défendu
    le projet. Ce risque-là est réel et il porte sur moi.


    Sur Tremay, en revanche, la comparaison n''est pas transposable en l''état. Ce qui tue une PME sur
    une ligne neuve, ce n''est pas la ligne, c''est la structure de l''exposition : financement par dette,
    caution du dirigeant, perte non plafonnée, actif industriel nanti. Nous sommes à dette nette nulle,
    la perte est bornée par contrat et rien n''est nanti. **Je demande néanmoins que nous obtenions avant
    vendredi les termes réels de l''exposition Tremay.** S''il apparaît que Tremay a déposé le bilan avec
    une perte plafonnée, sans dette et sans sûreté, ma recommandation tombe.


    ## 4. Les trois conditions de signature


    1. **Définir contractuellement la « constatation de l''échec »** : critères objectifs, mesurés, datés
    (cadence, taux de rebut, échéances de recette), et **droit unilatéral pour Verlaq de la prononcer**.
    C''est le point décisif : si ce déclencheur est flou ou dépend de Nordwerk, le plafond de 400 k€ ne
    borne pas ce que nous croyons — nous pourrions supporter douze mois de coûts d''exploitation avant
    qu''il ne se cristallise. Sans cette clause, je retire ma recommandation.

    2. **Le directeur financier détient la gâchette.** Il prononce la résiliation sur les critères ci-dessus,
    sans mon accord. Il conserve en outre un arrêt financier autonome : si les fonds propres projetés
    à une clôture trimestrielle passent sous **1,8 M€**, il résilie, quel que soit l''état technique.
    Ce n''est pas une consultation, c''est un pouvoir réel transféré à celui qui s''oppose au projet —
    précisément parce qu''il ne l''a pas défendu.

    3. **Chiffrer les coûts de désorganisation hors plafond** avant signature — immobilisation de ligne,
    redéploiement d''atelier, retards de livraison clients — et vérifier ce qui relève ou non du plafond
    de 400 k€.


    ## 5. Ce qui renverserait la décision


    Une seule observation suffit : si les onze installations de référence ne sont pas comparables à notre
    configuration (procédé, cadence, matière), le socle du 60 % s''effondre et l''écart de 14 points disparaît.
    **Première action, lundi matin :** exiger du bureau d''études la fiche des onze installations — configuration,
    résultat, écart au cahier des charges — et la présenter au conseil avec les termes Tremay.


    ---


    Deux points que je signale sans les masquer : l''estimation à 60 % repose sur onze cas, ce qui est
    un échantillon étroit, et le plafond de 400 k€ couvre le contrat, pas nécessairement la conséquence
    industrielle. Les conditions 1 et 3 existent pour convertir ces deux incertitudes en engagements écrits
    avant que la signature ne les rende irréversibles.

    '
