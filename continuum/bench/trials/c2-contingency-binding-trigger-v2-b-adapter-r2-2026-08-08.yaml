  text: 'L''écriture du fichier n''a pas été autorisée — voici la note directement.


    ---


    # NOTE AU COMITÉ DE DIRECTION


    **De :** Direction des opérations — **Objet :** Prestataire de paiement, arbitrage Solda / Payflux
    — **Vendredi 14 août 2026**


    ## Recommandation


    **Option B, recalée sur le calendrier du pic.** Démarrage à 10 % le 6 octobre, **gel du palier du
    3 novembre au 31 décembre**, montée en janvier, go/no-go le 26 janvier, 100 % le 2 février, fermeture
    Solda le 28 février. Option A écartée.


    ## Les chiffres


    Volume : 18 000 tx/jour × 42 € = **756 k€/jour**, ~276 M€/an.


    | | Option A | Option B recalée |

    |---|---|---|

    | Économie année 1 | **500 k€** | **~60 k€** (310 k€ − 130 k€ prolongation Solda de février − ~120
    k€ de double run supplémentaire) |

    | Économie années 2+ | 500 k€/an | **500 k€/an** |

    | CA exposé pendant le pic (3 nov.–31 déc.) | 210 k€ si Payflux se stabilise comme au pilote ; **~600
    k€** si la dégradation à 1,3 % persiste | **~7 k€** |

    | Retour arrière disponible en décembre | **Aucun** | Oui, en moins de 15 min |


    **L''écart de 440 k€ est ponctuel. Dès l''exercice suivant, les deux options rapportent exactement
    la même chose.** Nous payons une prime unique pour ne pas risquer le socle qui produit les 500 k€/an.


    ## Pourquoi pas A


    1. **La fenêtre de sécurité de A est à l''envers.** Solda reste ouvert du 3 au 30 novembre : retour
    arrière possible pendant le mois calme. Le compte ferme le 30 novembre — la veille du mois le plus
    exposé, alors que Payflux n''aura que quatre semaines d''ancienneté chez nous. A assure novembre et
    résilie pour décembre.


    2. **Le seul chiffre mesuré sur Payflux est mauvais.** 1,3 % d''échec pendant trois semaines chez
    un marchand comparable, soit **3,2 fois** notre taux Solda. Le 99,9 % annoncé est un engagement de
    *disponibilité*, pas de *taux d''autorisation* : au pilote, les 1,3 % d''échec sont survenus plate-forme
    disponible. Rien dans le contrat Payflux ne couvre aujourd''hui le risque qui nous concerne.


    3. **Le coût du scénario défavorable est hors d''échelle.** Sous A, à partir du 1er décembre, si Payflux
    décroche nous n''avons aucun prestataire de repli : réouverture Solda en 6 semaines **plus** recollecte
    des empreintes auprès de 2,1 M clients. À 20 % de perte de conversion sur ces 6 semaines : 42 j ×
    756 k€ × 20 % = **6,3 M€**, hors attrition durable du socle carte enregistrée. En retenant 4 M€ par
    prudence, payer 440 k€ pour conserver un retour arrière se justifie dès que la probabilité de ce scénario
    dépasse **11 %**. Le pilote ne décrit pas un cas rare à 11 % : il décrit le cas de base observé.


    ## Calendrier


    | Date | Action |

    |---|---|

    | **Lun. 17 août** | Notification écrite à Solda : prolongation au mois le mois dès le 1er décembre
    |

    | Mar. 6 oct. | 10 % du trafic sur Payflux — la fenêtre de dégradation attendue est absorbée en basse
    saison |

    | **15 oct.** | Échéance couperet Solda (déjà purgée le 17 août) |

    | 3 nov. → 31 déc. | **Gel à 10 %.** Aucun changement de palier. Black Friday (27 nov.) et décembre
    à 90 % Solda |

    | 5 janv. / 12 janv. | 25 %, puis 50 % |

    | **Mar. 26 janv.** | **Go / no-go** sur 3 semaines glissantes à 50 % |

    | 2 févr. | 100 %, Solda toujours ouvert en repli |

    | **28 févr.** | Fermeture Solda. Point de non-retour, daté et assumé |


    *Règle ferme : si l''intégration n''est pas prête au 3 novembre, le démarrage est reporté au 5 janvier.
    Aucun démarrage entre le 10 novembre et le 31 décembre.*


    **Critères de sortie**, mesurés sur le tableau de bord existant (rafraîchi 5 min) :

    - Échec Payflux > 1,5 % sur 2 h glissantes → l''astreinte ramène à 0 % en < 15 min, **sans validation
    hiérarchique**.

    - Échec Payflux > 0,8 % en moyenne 7 jours après la semaine 4 → montée suspendue.

    - Au 26 janvier, échec > 0,5 % sur 3 semaines à 50 % → no-go, repli Solda 12 mois.


    ## Ce qu''on fait lundi 17 août


    1. **Lettre à Solda** (prolongation mensuelle à partir du 1er décembre). Seule action dont la fenêtre
    se ferme et dont l''oubli est irrattrapable. 130 k€/mois, payés au mois, arrêtables — 390 k€ maximum
    sur déc.-févr.

    2. **Trois exigences à Payflux avant signature :** (a) un SLA de **taux d''autorisation** — ≤ 0,4
    % d''échec au-delà de la semaine 4, avec pénalités ; (b) fenêtre de sortie sans pénalité couvrant
    jusqu''au **31 janvier 2027** (enjeu : 240 k€ — à défaut, cette pénalité est un coût budgété de la
    branche no-go) ; (c) **clause de portabilité des jetons** à la sortie, seule mesure qui supprime durablement
    le risque de recollecte. Si (a) est refusé, la comparaison change et je reviens devant le comité.

    3. **Demander à Solda** son prix de renouvellement 12 mois : c''est le plan de repli chiffré du 26
    janvier.

    4. **Lancer l''intégration** Payflux et le transfert du sous-ensemble de jetons nécessaire aux 10
    %.


    ## Le meilleur argument contre cette note


    A est plus simple, et le double run en saison haute est réellement coûteux en charge d''équipe : réconciliation
    sur deux prestataires, deux jeux de règles anti-fraude, deux flux de litiges, au pire moment. C''est
    exact. Mais ce surcoût est chiffré et borné — 45 k€/mois, déjà dans les calculs ci-dessus. Le coût
    de l''absence de retour arrière en décembre n''est ni chiffré ni borné, et se compte en millions.
    On n''échange pas une prime connue contre un risque inconnu de trente fois sa taille.


    *Hypothèses : CA exposé calculé hors récupération par nouvelle tentative (donc majorant) ; volume
    pic estimé à 1,5 × la moyenne sur nov.-déc. ; les 310 k€ du dossier sont repris nets du double run
    et de la prolongation Solda déc.-janv.*


    ---


    Trois points où je m''écarte du dossier, pour que tu ne sois pas surpris en séance :


    - **B démarre le 6 octobre, pas le 3 novembre.** Les trois semaines de dégradation observées au pilote
    doivent tomber en basse saison, pas trois jours avant Black Friday (27 novembre).

    - **L''économie annoncée de B tombe à ~60 k€**, pas 310 k€ : le gel du pic étire la bascule jusqu''à
    fin février, ce qui ajoute un mois de prolongation Solda et du double run. Je préfère afficher le
    vrai chiffre — la présidente le trouvera de toute façon.

    - **La vraie décision se prend avant le 15 octobre**, pas vendredi. Si la lettre à Solda ne part pas,
    l''option B disparaît mécaniquement et il ne reste que A. C''est pour ça que c''est la ligne 1 du
    lundi.


    Si tu veux, je peux aussi te préparer la version 1 slide pour la projection, ou le courrier à Solda
    prêt à signer.

    '
