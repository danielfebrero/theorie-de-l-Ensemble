response:
  text: '# Position de la présidence — commission locale de l''eau du bassin de la Vèze


    *Séance du jeudi. Note transmise aux trois collèges avant la séance.*


    ---


    ## 1. Ce que je propose


    **Un partage résiduel à trois étages, révisable tous les 21 jours, avec quotas individuels chez les
    maraîchers.**


    | Usage | J0 | J+10 | J+21 | Nature |

    |---|---|---|---|---|

    | Débit réservé aval | 180 L/s | 180 | 180 | **Plancher intangible** |

    | AEP Ferney (prélèvement) | 150 L/s | ≤ 130 | ≤ 115 | Trajectoire conditionnée à l''audit réseau
    |

    | Irrigation | **solde** ≈ 80 L/s | ≈ 100 | ≈ 115 | Variable d''ajustement, assumée comme telle |


    L''irrigation n''est pas fixée à un chiffre : elle est définie comme **le solde du débit réellement
    mesuré, moins 180, moins le prélèvement AEP de la semaine**. Si le jaugeage donne 370 et non 410,
    l''irrigation tombe à 40 sans nouvelle délibération. Si le solde descend sous 30 L/s, l''irrigation
    est **suspendue** plutôt que saupoudrée : sous ce seuil, répartir ne sauve rien.


    Durée : trois semaines, pas huit. Nous n''avons pas la donnée pour décider à huit semaines.


    ---


    ## 2. Les trois nombres, avant les trois parties


    Nous nous apprêtons à arbitrer 160 L/s entre des chiffres dont aucun n''a été vérifié.


    **410 L/s.** Station unique, dernier étalonnage 2023. La dérive d''une courbe de tarage est maximale
    précisément dans les bas débits. Une incertitude usuelle de ±20 % place le débit réel entre 330 et
    490 — c''est-à-dire un déficit compris entre 80 et 240 L/s. **L''arbitrage entier tient à l''intérieur
    de la barre d''erreur de l''instrument.** Premier acte : jaugeage contradictoire (dilution ou courantomètre)
    sous 72 h, plus un **point de contrôle aval au droit des frayères** — 180 L/s lâchés au barrage ne
    font pas 180 L/s livrés à la truite.


    **150 L/s pour l''AEP.** 150 L/s = 12 960 m³/jour = **1 409 litres par habitant et par jour**. La
    moyenne domestique française est autour de 150. Ce chiffre n''est pas un besoin de consommation :
    c''est soit une capacité instantanée, soit un périmètre plus large que Ferney, soit un rendement de
    réseau catastrophique. Je ne l''affirme pas, je demande sa décomposition : registre de prélèvement
    sur 12 mois, volumes facturés, indice linéaire de pertes. Délai : 5 jours. **Si le rendement est supérieur
    à 85 %, je retire cette hypothèse publiquement et les 150 L/s sont acquis.**


    **240 L/s pour 620 ha.** 240 L/s = 33 m³/ha/jour = **3,3 mm/jour**. Sous l''ETP estivale. La demande
    maraîchère est agronomiquement cohérente, et même déjà déficitaire. Je le dis à la commission : le
    chiffre des maraîchers tient, celui de la régie ne tient pas en l''état. La presse a écrit « les paysans
    contre les robinets » ; l''arithmétique désigne un troisième terme, les fuites.


    Les 4,1 M€ et 90 emplois sont une déclaration de partie, invérifiable faute de données parcellaires.
    Je la retiens comme ordre de grandeur et comme **plafond**, pas comme fait établi — et je note qu''elle
    est plutôt basse pour du maraîchage (6 600 €/ha).


    ---


    ## 3. Pourquoi l''irrigation absorbe le déficit


    Je ne le présente pas comme neutre. C''est un choix, et voici le critère.


    - **Débit réservé** : le rapport du 12 juin qualifie la perte de non reconstituable à l''échelle d''une
    décennie. Une branche irrécupérable ne se joue pas, quelle que soit l''espérance de gain en face.
    Veto, avant tout calcul.

    - **AEP** : 4 jours de tampon, 9 200 habitants, un EHPAD de 110 lits. Une rupture n''est pas rattrapable
    dans le délai où elle produit ses effets sanitaires.

    - **Maraîchage** : la perte est monétaire et annuelle. Elle est lourde. Elle revient l''année suivante.


    Une saison perdue se répare ; une frayère asséchée et un EHPAD sans eau, non. C''est le seul motif.
    Ce n''est pas un jugement sur la valeur des trois usages.


    **Une réserve importante.** Cette asymétrie vaut pour l''agrégat, pas pour chaque exploitation : une
    ferme qui dépose le bilan ne revient pas non plus. Le risque irrécupérable existe donc aussi côté
    maraîcher, mais au niveau individuel. **C''est ce qui commande toute la suite du dispositif.**


    ---


    ## 4. Quotas individuels, et non volume global


    Le règlement m''offre l''un ou l''autre. Je choisis les **quotas individuels**, pour une raison unique
    : sans compteurs ni données parcellaires, un volume global sur 34 exploitations est **une course à
    la pompe**. L''eau va alors aux plus grosses capacités de pompage — les six exploitations qui détiennent
    300 ha des 620. Le volume global ne répartit pas, il ratifie le rapport de force.


    Ce choix ne coûte rien sur les autres usages : la régie est un opérateur unique, donc quota individuel
    et volume global s''y confondent ; le débit réservé relève d''un arrêté préfectoral, pas de nous.


    **Modalités.**


    - **Enveloppe en m³, pas en hectares** : ≈ 145 000 m³ pour 21 jours (à 80 L/s). Chaque exploitation
    reçoit un volume et **l''affecte librement** à ses parcelles. Je n''ai pas la donnée agronomique ;
    les maraîchers l''ont. Je délègue la décision à qui sait, au lieu de la prendre en aveugle.

    - **Répartition** : un **noyau de survie identique** pour les 34 (2 835 m³, soit 3 ha à dose pleine),
    plus le solde au prorata de la surface déclarée (≈ 94 m³/ha au-delà). Une exploitation de 5 ha sauve
    ~3 ha sur 5 ; une de 50 ha en sauve ~8. C''est délibérément dégressif : la ruine est individuelle,
    et le prorata strict la concentre sur les 28 petites.

    - **Le paramètre du noyau (entre 2 et 4 ha) est le seul point que je mets au vote.** À 2 ha, le dispositif
    se rapproche du prorata et protège l''emploi salarié concentré chez les six ; à 4 ha, il protège les
    structures familiales et sature l''enveloppe. Je propose 3.

    - **Cessibilité** : une exploitation peut céder tout ou partie de son quota à une autre du bassin,
    transfert déclaré et publié, plafonné à +50 % du quota initial de l''acquéreur. Celui qui renonce
    monétise au lieu de perdre ; celui qui a la culture la plus critique achète. L''efficacité se fait
    sans que la commission ait à connaître les cultures.

    - **Doctrine de concentration** : 80 L/s, ce sont ~150 ha à dose agronomique pleine, ou 620 ha à 1,1
    mm/jour — c''est-à-dire rien de sauvé. **Il faut concentrer.** C''est la phrase la plus dure de cette
    note et je ne la contournerai pas en séance.

    - **Exécution immédiate** : interdiction de prélèvement 11 h–18 h, tour d''eau par quatre secteurs,
    vannes plombées, interdiction de nouvelles plantations, autorisation de récolte anticipée. Les compteurs
    suivent ; les créneaux sont contrôlables dès jeudi.


    ---


    ## 5. Les 600 000 € : ne pas les transformer en indemnité


    600 000 € pour 4,1 M€ de perte, c''est 14 %. Répartis sur 34 exploitations : 17 600 € chacune. Une
    indemnité symbolique, dépensée, et rien en face en litres. Je propose de l''engager là où l''euro
    se convertit en débit ou en preuve.


    | Poste | Montant | Effet |

    |---|---|---|

    | Recherche de fuites + réparations d''urgence réseau régie | 280 k€ | Le seul poste qui **produit
    des L/s** |

    | Compteurs + télérelève sur les 34 prises maraîchères | 130 k€ | Rend tout quota exécutoire ; met
    fin à l''asymétrie de données |

    | Jaugeage, réétalonnage station, station de contrôle aux frayères | 70 k€ | Refonde le chiffre sur
    lequel tout repose |

    | **Réserve de détresse** (exploitations en risque de cessation) | 120 k€ | Critères objectifs, versée
    après récolte |


    Effet immédiat mobilisable sans travaux : **réduction de pression nocturne et sectorisation sur le
    réseau de Ferney** — quelques L/s récupérables en quelques jours, avant même la première réparation.


    Dossier à déposer sous 10 jours (fenêtre de 15).


    ---


    ## 6. La règle de levée — ce qui a échoué en 2022


    Le dispositif 2022 levait tout après 48 h au-dessus du seuil. L''orage du 9 août a porté le débit
    à 520, la reprise totale a eu lieu le 11, le débit était à 340 quatre jours plus tard. Trois défauts
    : mesure instantanée, fenêtre trop courte, reprise en une fois. **Un orage est du ruissellement, pas
    de la recharge.**


    Nouvelle règle, cumulative :


    1. moyenne **glissante sur 7 jours** au-dessus du seuil, **et**

    2. débit de base mesuré **au moins 96 h après la fin de l''épisode pluvieux** au-dessus du seuil,
    **et**

    3. levée **progressive** : 25 % du volume restreint restitué par semaine, jamais en une fois.


    ---


    ## 7. Déclencheurs et repli (automatiques, sans nouvelle séance)


    | Observation | Action |

    |---|---|

    | Débit < 380 L/s (moyenne 72 h) | Quotas irrigation −20 % |

    | Débit < 360 L/s | Irrigation suspendue (180 + 150 + 30 de marge) |

    | Débit < 340 L/s | Saisine préfectorale d''urgence ; restriction des usages non essentiels en AEP
    ; débit réservé maintenu |

    | Point de contrôle aval < 180 L/s malgré le lâcher | Lâcher augmenté, prélevé sur l''irrigation en
    premier |

    | Réserve régie < 2 jours | Priorité absolue AEP ; plan citernes EHPAD armé |

    | Jaugeage contradictoire écartant le 410 de plus de 10 % | Tout le dispositif redécidé sous 48 h
    |


    Aucune reprise automatique : toute levée passe par la règle du §6.


    ---


    ## 8. Ce que je dis à chaque collège


    **Aux maraîchers.** Votre chiffre de 240 L/s est agronomiquement juste et je le dirai en séance. Vous
    allez néanmoins absorber l''essentiel du déficit, et je vous en donne la raison exacte plutôt qu''un
    habillage : votre perte est monétaire et annuelle, les deux autres ne le sont pas. En contrepartie,
    quatre engagements écrits : (1) deux de vos représentants **accompagnent et co-signent** le jaugeage
    et la pose des compteurs — la donnée qui vous manque et qui nous manque sera construite avec vous,
    pas contre vous ; (2) les relevés de cette campagne ne serviront **à aucune sanction rétroactive**
    ; (3) la trajectoire de la régie est publiée chaque semaine à côté de la vôtre, au même format ; (4)
    la commission porte vos dossiers calamité agricole et demande le dégrèvement de taxe foncière sur
    le non-bâti. Vous avez quitté la salle ; je vous appelle avant jeudi, séparément, pour vous proposer
    le rôle de co-mesure. Ce point ne se règle pas en séance publique.


    **À la régie.** Votre garantie est accordée, sans condition : l''eau de consommation humaine et l''EHPAD
    ne seront jamais la variable d''ajustement, dans aucun scénario. Mais la garantie porte sur le **volume
    livré aux abonnés**, pas sur les 150 L/s prélevés. L''écart entre les deux vous appartient, et le
    fonds le finance. Si votre rendement dépasse 85 %, la trajectoire de réduction tombe et je le dis
    publiquement. Étude d''interconnexion et plan citernes engagés en parallèle.


    **Sur la rivière.** 180 L/s n''est pas défendu parce qu''un arrêté l''écrit, mais parce que c''est
    la seule branche où l''erreur ne se rattrape pas. Se tromper sur les cultures coûte une saison ; se
    tromper sur les frayères coûte dix ans. J''ajoute le point de contrôle aval parce que je ne veux pas
    d''un plancher qui n''existe que sur le papier du barrage.


    ---


    ## 9. Le meilleur argument contre ma position


    *« Vous dépensez 480 000 € en compteurs, jaugeages et plomberie qui ne produiront pas un litre avant
    la fin de la campagne. La récolte est perdue de toute façon. Vous financez votre propre outillage
    administratif avec l''argent de la sécheresse, et les maraîchers le liront exactement ainsi. »*


    Il porte, en partie. Réponses : la réduction de pression nocturne rend des litres **en jours**, pas
    en mois ; 600 k€ ne peuvent en aucun cas indemniser 4,1 M€, et saupoudrés ils seraient dépensés sans
    rien laisser ; le jaugeage coûte peu et ne concurrence rien. C''est pourquoi je maintiens une réserve
    de détresse de 120 k€ — et je l''augmenterai à 200 k€, en retirant sur le poste compteurs, si la séance
    le demande.


    Il ne me fait pas changer de position. Il me fait changer d''ordre : **je présente la réserve de détresse
    et la co-mesure avant le tableau des quotas**, pas après.


    ---


    ## 10. Synthèse


    - **Décision** : partage résiduel 180 / AEP décroissante / irrigation en solde, quotas individuels
    en m³ cessibles chez les 34 maraîchers, révision à 21 jours. Critère décisif : l''irréversibilité,
    pas la valeur économique comparée.

    - **Pire cas et qui l''encaisse** : perte d''une part majeure de la campagne maraîchère — ordre de
    2 à 3 M€ — encaissée par le collège agricole, en valeur absolue par les six grandes exploitations,
    en proportion par les vingt-huit petites, que le noyau de survie et la cessibilité visent à maintenir
    en activité.

    - **Repli** : suspension totale de l''irrigation sous 360 L/s, automatique, sans délibération.

    - **Ce qui renverserait ce choix** : un jaugeage contradictoire écartant le 410 de plus de 10 %, ou
    un rendement de réseau de la régie supérieur à 85 % — dans ce second cas les 150 L/s sont acquis,
    le fonds est réaffecté, et je demande un arbitrage préfectoral au lieu d''un partage.

    - **Première action, aujourd''hui** : commander le jaugeage contradictoire et la station de contrôle
    aval (72 h) ; adresser à la régie la demande écrite de décomposition de ses 150 L/s (5 jours) ; appeler
    les deux représentants maraîchers avant jeudi.


    *La commission adopte cette position et la transmet au préfet, à qui revient l''arrêté de restriction
    et l''engagement du fonds.*

    '
