response:
  text: 'Je n''ai pas d''outil de mise en page disponible ici, je vous livre donc la note directement.
    Un point avant lecture : les chiffres fournis conduisent à une conclusion opposée à la demande de
    l''actionnaire, et la note le dit franchement.


    ---


    # NOTE AU COMITÉ DE DIRECTION — mardi 11 août 2026

    **Objet : fermetures de magasins et objectif de 300 000 €**


    **En une phrase.** Aucun des trois magasins listés n''est en perte. Les fermer tous les trois dégraderait
    le résultat d''environ 114 000 € au lieu de l''améliorer de 300 000 €. Une seule chose est urgente
    mardi : ne pas laisser expirer, sans l''avoir vue, l''échéance du bail de Vitry.


    ## 1. Les trois magasins « déficitaires » gagnent de l''argent


    Le résultat par magasin inclut une part des frais de siège et de logistique (6,4 M€ répartis au prorata
    du chiffre d''affaires). **Ces frais existent que le magasin soit ouvert ou fermé : fermer un magasin
    ne ferme pas le siège.**


    Ce qui compte pour décider d''une fermeture, c''est ce que le magasin rapporte une fois payés ses
    propres coûts — loyer, salaires, charges du site. Appelons cela sa *contribution*.


    | Magasin | Résultat affiché | dont quote-part siège | **Contribution réelle** |

    |---|---:|---:|---:|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |

    | **Total** | **−288 000 €** | **402 000 €** | **+114 000 €** |


    La comptabilité analytique est exacte : elle certifie la *répartition* de ces 402 000 €, pas leur
    *disparition*. Si les trois magasins ferment, ces 402 000 € se reportent sur les 16 sites restants,
    dont plusieurs basculeront à leur tour en « perte » comptable. C''est le mécanisme qui transforme
    trois fermetures en six.


    ## 2. Les trois cas


    **Chambéry — à exclure.** 1,1 M€ d''indemnité pour arrêter un site qui rapporte 32 000 € par an, et
    92 km jusqu''au magasin le plus proche : pratiquement aucun client ne serait récupéré ailleurs. Le
    seul travail utile est une recherche de repreneur pour le bail, très inférieure à 1,1 M€, à instruire
    sans urgence.


    **Nîmes — ce n''est pas une question de fermeture.** Nous détenons les murs (1,9 M€). Le magasin rapporte
    19 000 € sur un actif de 1,9 M€, soit 1 % de rendement, *sans payer de loyer*. La vraie question n''est
    pas « faut-il fermer Nîmes » mais « ces 1,9 M€ sont-ils bien employés ici ». Vendre les murs et affecter
    le produit au désendettement allège durablement les frais financiers. Une vente avec bail en retour
    aurait de plus le mérite de trancher : un magasin qui paie un loyer de marché est-il viable ? Attention
    : une plus-value de cession est un gain unique et ne compte pas dans un objectif de résultat récurrent
    — seule l''économie de frais financiers y compte.


    **Vitry — la seule vraie question, et la seule échéance.** Bail échu dans 7 mois, sortie sans indemnité
    : c''est notre unique porte de sortie gratuite. Deux éléments :


    - **18 % des entrées sont des retraits de commandes web.** Vitry supporte le coût de ce service —
    personnel, surface, logistique — et le chiffre d''affaires correspondant est enregistré sur l''entité
    e-commerce. Vitry travaille gratuitement pour une autre entité du groupe : sa contribution réelle
    est supérieure aux 63 000 € affichés.

    - **Fermer Vitry n''est rentable que si les clients se reportent** sur le magasin situé à 14 km. Le
    seuil se calcule en une heure : la fermeture devient favorable au-delà d''un taux de report d''environ
    63 000 € ÷ marge brute de Vitry, soit vraisemblablement moins de 10 % du chiffre d''affaires. Le seuil
    est donc bas — et atteignable. Mais nous ne savons pas aujourd''hui s''il est atteint.


    ## 3. Ce que nous ne savons pas, et qui décide de tout


    Toute la décision tient à un chiffre que personne n''a : **le taux de report**.


    - La carte de fidélité ne le donne pas. 23 % des tickets, dont 41 % de porteurs multi-magasins : cela
    décrit les porteurs de carte, plus mobiles que la moyenne, et ne dit ni quels magasins, ni à quelle
    distance.

    - Les compteurs d''entrée non plus. Malgré 24 mois d''historique à la demi-heure et ±2 % de précision,
    ils comptent des entrées et non des acheteurs — et à Vitry, 18 % d''entre elles ne sont pas des clients
    du magasin. Excellentes données pour les plannings d''équipe ; muettes sur le report.

    - **La seule mesure réelle dont nous disposons est la fermeture de Nîmes, cinq semaines en mars 2024.**
    Nous n''avons gardé que les totaux mensuels des magasins voisins : c''est grossier, cela ne donnera
    qu''un ordre de grandeur à 23 km, et il faudra corriger l''effet de saison. C''est néanmoins la seule
    observation, et elle vaut infiniment mieux qu''une hypothèse.


    ## 4. Une ligne absente de tous les chiffres présentés


    Nous n''avons jamais fermé de magasin. Aucun des montants ci-dessus n''intègre le **coût de la fermeture**
    : indemnités de licenciement (environ 23 salariés par site), reclassements, écoulement du stock, remise
    en état, accompagnement des équipes. Ce coût tombe intégralement sur l''exercice prochain — celui-là
    même où l''actionnaire attend +300 000 €. Autrement dit : même une fermeture économiquement justifiée
    ne rapporte rien la première année.


    ## 5. Où sont réellement les 300 000 €


    300 000 €, c''est **4,7 % des 6,4 M€ de frais de siège et de logistique**. C''est la seule masse assez
    grande pour porter l''objectif, et la seule qui n''ait pas été examinée : l''analytique en certifie
    la répartition, jamais le montant.


    Plan proposé :


    1. **Revue des 6,4 M€, ligne à ligne** — cible 250 à 350 k€ récurrents. C''est le cœur du sujet.

    2. **Renégociation du loyer de Vitry.** L''échéance du bail est un levier de négociation autant qu''une
    porte de sortie ; nous n''avons jamais utilisé le premier.

    3. **Refacturation par l''e-commerce des retraits en magasin.** Neutre pour le résultat du groupe
    — je le dis clairement, cela ne crée pas d''euro. Mais sans cela, nous continuerons à prendre des
    magasins rentables pour des magasins déficitaires.

    4. **Arbitrage des 1,9 M€ immobilisés à Nîmes.**

    5. **Abandon de la répartition au prorata du CA comme base de décision.** Elle reste juste comptablement
    ; elle est trompeuse pour piloter. Passage à un suivi par contribution.


    ## 6. Ce que nous décidons mardi


    | # | Décision | Qui | Quand |

    |---|---|---|---|

    | 1 | **Aucune fermeture décidée ce mardi.** Le dossier n''est pas mûr et les chiffres disent l''inverse
    de ce qu''on leur fait dire. | Comité | 11/08 |

    | 2 | **Vérifier la date limite de congé du bail de Vitry.** En bail commercial, le congé se donne
    six mois avant l''échéance : le délai peut expirer sous 30 jours. Un congé donné n''est pas réversible
    seul — il ouvre la sortie mais ferme le maintien. La bonne manœuvre est donc d''obtenir du bailleur,
    **par écrit**, un report du délai de décision, en contrepartie de l''ouverture d''une négociation
    de loyer. | Direction + conseil | 48 h |

    | 3 | Analyse du report à partir de mars 2024 (Nîmes) + calcul du seuil de report de Vitry | Contrôle
    de gestion | 3 semaines |

    | 4 | Ouverture de la revue des 6,4 M€ | Direction financière | 6 semaines |

    | 5 | Décision Vitry, sur taux de report mesuré et loyer renégocié | Comité | à fixer |


    **Ce que j''assume devant l''actionnaire.** Nous ne renonçons pas aux 300 000 €. Nous refusons de
    les chercher là où ils ne sont pas : trois fermetures qui coûteraient 1,1 M€ de cash, détruiraient
    114 000 € de résultat, reporteraient 402 000 € de frais sur les magasins sains et engageraient une
    centaine de salariés — sans produire le premier euro de l''objectif.


    ---


    **Le point le plus contestable de la note**, pour que vous l''ayez en tête mardi : le seuil de report
    de Vitry est bas (probablement < 10 % du CA). À 14 km, il est plausible qu''il soit franchi. Fermer
    Vitry pourrait donc être justifié — mais alors sur le fondement d''un report mesuré, avec un chiffrage
    du coût social, et pas au titre d''une perte de 118 000 € qui n''existe pas.

    '
