response:
  text: '## Position écrite — répartition de la ressource du bassin de la Vèze


    *Séance du jeudi. Document soumis aux trois parties avant vote.*


    ---


    ### 1. Ce que je propose


    Répartition immédiate des 410 L/s mesurés :


    | Poste | Volume | Écart / demande |

    |---|---|---|

    | Débit réservé aval | **180 L/s** — servi en premier, intangible | 0 |

    | Eau potable | **125 L/s**, dont plancher sanitaire inviolable ~45 L/s | −25 |

    | Irrigation | **105 L/s** | −135 |


    Trois mécanismes indissociables de cette répartition :


    1. **Quotas individuels**, pas volume global par usage.

    2. **Concentration** de l''eau agricole sur une surface réduite, avec mise en jachère déclarée et
    indemnisée du reste.

    3. **Nouvelle règle de levée** des restrictions, qui remplace celle de 2022.


    Aucune marge de sécurité en L/s n''est réservée sur le papier. Ce serait de la décoration : la marge
    nécessaire (±40 L/s au moins, cf. §7) dépasse tout ce qu''on pourrait geler. La protection réelle
    est un déclencheur à l''aval, pas un coussin comptable.


    ---


    ### 2. Les 180 L/s ne sont pas une variable


    Le rapport du 12 juin qualifie la perte des frayères de non reconstituable à l''échelle d''une décennie.
    C''est la seule perte du dossier qui ne se rattrape avec aucune somme d''argent et sur aucun horizon
    utile. Une récolte perdue est une perte grave, réversible en un cycle, partiellement compensable.
    Un cours d''eau vidé de sa population piscicole avec deux frayères asséchées ne revient pas parce
    qu''il pleut en octobre.


    Cette asymétrie décide seule l''ordre de service : le débit réservé est prélevé avant les usages,
    pas après. Et pour être clair sur les compétences — le seuil est fixé par arrêté préfectoral ; la
    commission n''a pas le pouvoir de l''abaisser. Qui veut l''attaquer doit s''adresser au préfet, et
    supporter la charge de contredire le rapport hydrobiologique.


    Je dis ouvertement que c''est un choix de valeur assumé, pas un résultat de calcul : je fais passer
    un dommage irréversible porté par une partie absente de la salle avant un dommage lourd mais réversible
    porté par des parties présentes.


    ---


    ### 3. La dotation potable n''est pas 150 L/s — c''est un besoin, pas un volume historique


    150 L/s = 12 960 m³/jour. Rapporté à 9 200 habitants : **1 409 litres par habitant et par jour**,
    soit environ neuf fois la consommation domestique moyenne française.


    Ce chiffre n''est pas une accusation, c''est une question à laquelle la commission ne peut pas répondre
    seule. Deux lectures possibles :


    - la régie dessert un périmètre plus large que les 9 200 habitants de Ferney — alors le calcul change
    et je le corrige ;

    - le rendement du réseau est médiocre — auquel cas 30 à 40 L/s partent dans le sol pendant qu''on
    demande à 34 exploitations d''abandonner la moitié de leurs surfaces.


    **La charge de la preuve est du côté de la régie.** Tant que le rendement de réseau et le volume distribué
    / volume consommé ne sont pas produits, la commission ne peut pas garantir 150 L/s, parce qu''elle
    ne sait pas ce qu''elle garantirait.


    Ce que je garantis en revanche, écrit dans l''acte et opposable : un **plancher sanitaire absolu d''environ
    45 L/s** (9 200 hab × 250 L/j + EHPAD 110 lits + défense incendie), servi avant l''irrigation en toute
    circonstance et en toute dégradation ultérieure. La régie demande une garantie : elle l''obtient sur
    son besoin, pas sur son historique.


    Les 25 L/s d''écart sont exigibles sans fermer un seul robinet d''usager : modulation nocturne de
    pression, sectorisation et campagne de recherche de fuites, interdiction des usages non essentiels
    (arrosage d''espaces verts, lavage de voirie et de véhicules, remplissage de piscines). C''est un
    minimum, pas un plafond — les données de rendement montreront peut-être davantage.


    ---


    ### 4. Quotas individuels, et pourquoi le volume global est un piège


    Le règlement laisse le choix. Le volume global par usage est ici la pire option, pour une raison mécanique
    : **dans un bassin sans compteurs, un volume global est capté par celui qui pompe le plus vite et
    le plus près.** Il n''attribue rien, il ouvre une course. Six exploitations cultivent 300 des 620
    hectares ; ce sont elles qui disposent des installations les plus puissantes. Un volume global agricole
    leur reviendrait de fait, et les 28 autres découvriraient la répartition en constatant que la rivière
    est vide.


    Un volume global a un second défaut : il rend la décision d''abandon invisible. Or c''est la seule
    décision qui compte cette année, et elle doit être explicite pour être indemnisable.


    **Le trou de données devient le levier.** La commission ne dispose d''aucune donnée parcellaire et
    ne peut pas la contraindre. Elle peut en revanche conditionner l''eau à sa production : chaque exploitation
    qui veut un quota supérieur au socle déclare sous 5 jours ses parcelles, cultures, stades végétatifs,
    et accepte la pose d''un compteur ou d''un compteur horaire scellé sur sa prise. Pas de déclaration
    → socle seul. L''information n''est pas exigée, elle est achetée avec la seule monnaie dont dispose
    la commission.


    Grille, à ratifier une fois les déclarations reçues :


    - **Socle égalitaire** : 0,6 L/s par exploitation (≈ 1,5 ha à dose pleine), soit ~20 L/s pour les
    34. Il garantit à chacune un noyau viable indépendamment de sa taille — c''est ce qui protège les
    28 petites, et il ne coûte que 20 % de l''enveloppe.

    - **Tranche surfacique** : 85 L/s répartis à l''hectare déclaré éligible, **plafonnés à 10 % de la
    tranche par exploitation**. Sans ce plafond, les six grandes absorbent 72 % de l''enveloppe agricole.


    Dans l''intervalle, à compter de jeudi : socle seul plus une avance proportionnelle. Grille définitive
    à J+7.


    ---


    ### 5. Le point qui doit ramener les maraîchers dans la salle


    **Les 240 L/s n''existent pas.** Le choix n''est pas entre 240 et 105. Il est entre 105 étalés et
    105 concentrés.


    240 L/s sur 620 ha représente 3,34 mm/jour — déjà un régime déficitaire pour du maraîchage en canicule.
    La demande n''est pas gonflée ; elle est proche du besoin réel. C''est précisément ce qui condamne
    le rationnement uniforme : 105 L/s répartis sur 620 ha donnent 1,45 mm/jour, une dose qui n''amène
    à récolte à peu près rien et détruit la qualité marchande avant même le rendement. Étaler, c''est
    arroser huit semaines pour ne rien vendre.


    Les mêmes 105 L/s concentrés à dose pleine portent **environ 270 hectares** jusqu''à la récolte. Avec
    une fenêtre d''irrigation nocturne obligatoire (20 h – 8 h), qui supprime 20 à 25 % de pertes par
    évaporation, on atteint **environ 320 à 330 hectares**, soit plus de la moitié de la sole. Ces ~50
    hectares supplémentaires ne coûtent rien à personne : ils sont pris sur l''évaporation, pas sur les
    autres usages. Un tour d''eau organisé plutôt que des prélèvements simultanés y ajoute encore.


    Cette réponse est agronomique et je l''expose comme telle : elle serait affinée par les stades végétatifs
    déclarés — une culture déjà passée au-delà de sa phase critique n''a plus besoin de dose pleine et
    libère de l''eau. C''est un argument de plus pour déclarer.


    **Le pouvoir que je transfère aux maraîchers :** la commission fixe l''enveloppe (105 L/s) et les
    règles (socle, plafond, déclaration, fenêtre nocturne). **Ce sont les 34 exploitations, réunies, qui
    décident entre elles quelles surfaces sont portées et lesquelles sont sacrifiées**, dans un délai
    de 5 jours. La commission ratifie. À défaut d''accord, la grille par défaut s''applique — et elle
    est délibérément moins favorable aux grandes surfaces, pour que l''accord soit préférable à l''arbitrage.
    Ce n''est pas une consultation : c''est la décision la plus lourde du dossier qui leur revient, parce
    qu''ils sont seuls à détenir l''information qui permet de la prendre correctement.


    Sur les 4,1 M€ et 90 emplois : c''est une déclaration produite par la partie qui en bénéficie, invérifiable
    en l''état. Je ne la retiens pas comme un fait établi — et je ne la traite pas non plus comme nulle.
    La procédure de déclaration est justement ce qui permettra de la mesurer.


    ---


    ### 6. Les 600 000 € : à quoi ils servent réellement


    Le fonds ne compense pas la perte — il représente environ 15 % du montant annoncé. Il achète autre
    chose : le passage d''un effondrement subi à un abandon organisé.


    | Poste | € | Objet |

    |---|---|---|

    | Métrologie | 60 000 | Jaugeage indépendant, réétalonnage de la station, point de contrôle aval,
    compteurs sur prises agricoles |

    | Indemnisation jachère | 340 000 | Barème **dégressif par exploitation**, plafonné — pas au prorata
    de l''hectare |

    | Emploi saisonnier | 100 000 | Chantiers d''arrachage, remise en état, replantation d''automne |

    | Réseau potable | 60 000 | Recherche de fuites, sectorisation, modulation de pression |

    | Réserve | 40 000 | Palier de dégradation suivant |


    Le barème dégressif est un choix explicite : au prorata de l''hectare, près de la moitié de l''enveloppe
    irait aux six exploitations qui cultivent 300 ha. Pour elles, la sécheresse ampute un chiffre d''affaires
    ; pour plusieurs des 28 autres, elle décide de l''existence de l''entreprise. Les 100 000 € emploi
    visent la part de la perte que ni l''assurance ni un report ne rattrapent : les 90 saisonniers.


    **L''indemnité n''est versée que contre conformité vérifiée du quota.** 340 000 € conditionnels contrôlent
    mieux les prélèvements que n''importe quelle patrouille.


    ---


    ### 7. La règle de levée — ce qui a réellement échoué en 2022


    Le dispositif levait les restrictions dès 48 h au-dessus du seuil. Le 9 août, l''orage porte le débit
    à 520 ; les prélèvements reprennent en totalité le 11 ; quatre jours plus tard on est à 340.


    Le diagnostic est net : **une fenêtre de 48 h après un orage mesure du ruissellement, pas de la recharge.**
    Le débit de base du bassin n''avait pas bougé d''un litre. La règle a lu un signal qui ne portait
    sur rien, et la reprise intégrale a consommé en quatre jours la marge de plusieurs semaines.


    Nouvelle règle, trois changements :


    1. **Moyenne mobile sur 10 jours**, jamais une valeur instantanée ni une fenêtre courte, et confirmation
    par un indicateur de tarissement (niveau piézométrique, ou débit constaté à J+7 après un pic).

    2. **Hystérésis asymétrique** : le resserrement s''applique immédiatement au franchissement à la baisse
    ; la levée est progressive et ne saute jamais un palier.

    3. **Reprise par paliers** : 40 % puis 70 % puis 100 % du quota, à 7 jours d''intervalle minimum.
    Une fausse reprise coûte alors un palier, pas la totalité de la marge.


    C''est la modification structurelle la plus importante du dispositif, et la seule que les trois parties
    ont un intérêt commun à voir adoptée : c''est le mécanisme qui a fait perdre à tout le monde, en août,
    l''eau que tout le monde réclame aujourd''hui.


    ---


    ### 8. Paliers de dégradation, annoncés à l''avance


    | Débit entrant (moyenne 5 j) | Mesure |

    |---|---|

    | 410 – 380 | Plan ci-dessus |

    | 380 – 350 | L''irrigation absorbe la totalité de l''écart ; interdiction publique des usages non
    essentiels |

    | 350 – 330 | Irrigation suspendue hors survie des pérennes et abris ; potable ramené aux usages sanitaires
    |

    | < 330 | Potable sanitaire + débit réservé seuls. La commission est hors de ses moyens : saisine
    du préfet, actée d''avance |


    **Déclencheur d''arrêt automatique** : si le débit au point de contrôle aval passe sous 180 L/s pendant
    24 h, les prélèvements agricoles cessent sans nouvelle délibération. C''est ce déclencheur, et non
    une marge sur le papier, qui protège le débit réservé de l''erreur de mesure.


    ---


    ### 9. La contre-argumentation la plus solide contre ma position


    **Elle sacrifie la moitié d''une sole maraîchère sur la foi d''un chiffre — 410 L/s — produit par
    une station unique, sans redondance, étalonnée il y a trois ans.** Une dérive de 10 %, banale sur
    une station non réétalonnée, vaut 41 L/s : le quart du déficit. Si le débit réel est de 460, la répartition
    change entièrement, et on aura fait arracher des cultures pour rien.


    Cette objection tient. Elle ne renverse pas la décision, elle en fixe l''ordre :


    - Le jaugeage indépendant est engagé **avant** que les arrachages ne commencent, pas après.

    - **Toute révision confirmée du débit à la hausse va intégralement à l''irrigation**, jusqu''à 240
    L/s, sans repasser par un arbitrage entre usages. Les maraîchers portent le risque de mesure ; ils
    en reçoivent donc la totalité du bénéfice. Cela leur donne un intérêt direct à ce que la métrologie
    soit faite sérieusement — et cela leur donne une raison concrète de revenir dans la salle.

    - Le plancher écologique et le plancher sanitaire n''absorbent ni la hausse ni la baisse. Ce sont
    des seuils, pas des parts.


    ---


    ### 10. Ce que je dis à chaque partie


    **Aux maraîchers.** Je ne peux pas vous donner 240 L/s, ils n''existent pas dans la rivière. Je peux
    faire en sorte que les 105 disponibles sauvent la moitié de vos surfaces au lieu de n''en sauver aucune,
    et je vous laisse décider entre vous lesquelles. Les hectares que vous abandonnez sont indemnisés,
    en priorité pour les plus petites exploitations. Chaque litre retrouvé par la mesure vous revient
    en totalité.


    **À la régie.** Votre besoin sanitaire est garanti par écrit, prioritaire sur l''irrigation en toute
    circonstance, y compris en cas de dégradation. Votre volume historique, lui, ne l''est pas : à 1 409
    litres par habitant et par jour, je ne peux pas le défendre devant les 34 exploitations à qui je demande
    de renoncer à 300 hectares. Produisez votre rendement de réseau, et le débat s''ouvre sur des chiffres.


    **Sur la rivière.** Elle n''a personne dans la salle. Elle est servie la première, et le contrôle
    aval est publié chaque semaine avec un observateur extérieur — l''auteur du rapport du 12 juin ou
    l''OFB. Le seul pouvoir qu''on puisse donner à une partie absente est un droit de constat opposable
    ; je le lui donne.


    **À la presse.** Ce n''est pas un arbitrage entre les paysans et les robinets. C''est un déficit de
    160 L/s dont une partie est peut-être dans les fuites du réseau, une partie dans l''évaporation d''un
    arrosage en plein soleil, et une partie dans une station de mesure que personne n''a vérifiée depuis
    2023.


    ---


    ### 11. Ce qui renverserait ma position, et la première action


    **Renverse le plan :**

    - un jaugeage indépendant s''écartant de plus de 8 % de la station ;

    - un rendement de réseau déjà ≥ 90 % : les 25 L/s ne sont alors pas disponibles, la part agricole
    tombe et l''enveloppe d''indemnisation doit être revue à la hausse ;

    - des déclarations montrant que la majorité des 620 ha a dépassé son stade critique : il faut alors
    moins d''eau pour sauver davantage.


    **Première action, dès demain, avant la séance :** commande du jaugeage indépendant et du réétalonnage
    ; demande écrite à la régie de son rendement de réseau et de son périmètre exact desservi ; envoi
    du formulaire de déclaration aux 34 exploitations avec échéance à 5 jours.


    Ces trois actes ne préjugent d''aucun vote. Sans eux, aucun quota n''est ni juste ni exécutoire.


    ---


    **Réserve de compétence.** L''acte de la commission est une proposition motivée : l''opposabilité
    des quotas aux tiers relève de l''arrêté préfectoral. La force de ce document ne vient pas de son
    pouvoir juridique propre, mais du fait qu''il est le seul texte à mettre les trois parties, leurs
    chiffres et leurs charges de preuve dans la même page.

    '
