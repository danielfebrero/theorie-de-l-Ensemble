response:
  text: 'Les trois lignes (117, 120 et 119 caractères) :


    ```

    1/ 22h00 commander la roue a Nantes (garde l''option 14h). B2 bridee ~70% pour vibr<10, 2 gaz en marche
    toute la nuit.

    2/ Vibr >=11,5 ou en hausse: ARRET CONTROLE B2 immediat, ne pas attendre 12 ni la casse. Puis gaz
    + delestage logements.

    3/ Prio hopital+EHPAD bout de reseau: T depart /1h, mini 40C, prevenir les 3 sites a 22h. Astreinte
    direction si doute.

    ```


    La logique derrière, pour que tu la valides avant de partir :


    **Le coût ne rentre pas dans l''arbitrage.** 2 300 € d''écart contre un hôpital de 180 lits et deux
    EHPAD à −14 °C : ce n''est pas une variable.


    **Les deux options pures perdent.** Arrêter B2 maintenant, c''est la nuit entière sur 5 MW de gaz
    qui ne tiennent pas sous −7 °C, avec le retour de B2 vers 11 h 40 — trop tard pour le pic de 4 h.
    La laisser à pleine charge, c''est jouer les 6-40 h annoncées sur la nuit la plus froide, et une casse
    fait perdre la roue de rechange en plus des neuf jours.


    **D''où le bridage.** Baisser la vitesse du ventilateur fait tomber la vibration et achète du temps
    de fonctionnement, au prix de ~2 MW. Ces 2 MW se prennent sur les 4 200 logements, qui ont de l''inertie
    ; ils ne se prennent pas sur les sous-stations de bout de réseau. C''est le sens de l''ordre de priorité
    en ligne 3.


    **La commande à Nantes part quoi qu''il arrive.** Elle ne coûte que le transport et c''est la seule
    chose qui maintienne l''écart entre 14 heures et neuf jours. Si B2 doit être arrêtée à 3 h, la roue
    est déjà en route.


    **Le seuil d''action est à 11,5, pas à 12.** À 12, l''arrêt est subi ; les techniciens doivent avoir
    la main avant, et savoir qu''un arrêt contrôlé de B2 ne leur sera jamais reproché.


    Deux choses à faire avant de partir, hors main courante : appeler l''astreinte direction pour qu''elle
    sache qu''une décision d''arrêt peut tomber cette nuit sans toi, et prévenir toi-même les cadres de
    garde de l''hôpital et des deux EHPAD — ils ont leurs propres plans de repli et une heure d''avance
    leur sert plus qu''à nous.

    '
