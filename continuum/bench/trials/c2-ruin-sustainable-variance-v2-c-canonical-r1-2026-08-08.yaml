response:
  text: 'Deux vérifications d''abord, parce qu''elles décident de tout : le covenant tient-il dans le
    pire cas, et la maison est-elle réellement en jeu ?


    - Pire cas B, fonds propres à la clôture du 12ᵉ mois : 3,4 − 0,7 (dividende) − 0,4 (plafond) = **2,3
    M€**, contre un seuil à 1,2 M€. Marge : 1,1 M€.

    - Pire cas B, trésorerie : 2,6 − 0,7 − 0,4 = **1,5 M€**, soit 9 mois de masse salariale.


    Le covenant n''est atteint dans aucun scénario, à aucun trimestre. Voici la note.


    ---


    # Note au conseil — arbitrage Sedamex / Nordwerk

    **Objet :** recommandation sur les 18 prochains mois — options exclusives · **Recommandation : Option
    B (Nordwerk)**


    ## 1. Ce que je recommande


    Installer la ligne Nordwerk, sous trois conditions préalables à la signature (§5).


    ## 2. Sur quoi je fonde ce choix


    | | **A — Sedamex** | **B — Nordwerk** |

    |---|---|---|

    | Résultat espéré (18 mois) | +200 k€ certains | +380 k€ (0,6 × 900 − 0,4 × 400) |

    | Meilleur cas — fonds propres | 2,9 M€ | 3,6 M€ |

    | **Pire cas — fonds propres** | 2,9 M€ | **2,3 M€** (seuil : 1,2 M€) |

    | **Pire cas — trésorerie** | 2,1 M€ | **1,5 M€** (9 mois de salaires) |


    Le critère qui l''emporte est l''espérance d''utilité, mais il ne l''emporte que parce que la porte
    de ruine est franchie d''abord : **le pire cas de B est absorbable, et il l''est par nous seuls.**
    La perte est contractuellement plafonnée, sans caution personnelle, sans défaut croisé, sans sûreté
    sur l''outil industriel, sans nantissement du carnet de commandes. Aucun tiers — banque, salariés,
    clients — n''encaisse quoi que ce soit dans la branche défavorable.


    **Le point de bascule est chiffré : à 46,2 % de probabilité de succès, B et A s''égalisent.** L''estimation
    du bureau d''études, adossée à onze installations documentées, peut donc être fausse de 14 points
    et B reste le meilleur choix. C''est cette marge d''erreur, et non l''estimation elle-même, qui fonde
    la recommandation.


    ## 3. Ma réponse au directeur financier


    Sur le fond, l''objection est saine et je l''intègre au dispositif de contrôle (§4). Mais ses deux
    arguments ne résistent pas à la vérification.


    **« On joue la maison. »** C''est une affirmation factuelle, et elle est fausse : nous engageons 400
    k€ au maximum sur 3,4 M€ de fonds propres et 2,6 M€ de trésorerie, sans dette. Ce n''est pas la maison,
    c''est 12 % des fonds propres. Le mot « jouer » suppose une branche de perte irrécupérable ; il n''y
    en a pas. Un mauvais tirage dont le pire cas laisse 9 mois de salaires en caisse et 1,1 M€ de marge
    de covenant s''appelle de la variance, et la variance ne justifie pas un veto — elle justifie un plafond,
    que nous avons.


    **Tremay.** L''analogie échoue sur le mécanisme, pas sur l''émotion. Ce qui tue n''est jamais la ligne
    neuve : c''est l''exposition non plafonnée — dette bancaire, sûretés, défaut croisé, rupture de trésorerie.
    Nous ignorons lesquels de ces éléments étaient présents chez Tremay, et c''est précisément le problème
    : le rapprochement est invoqué sans les variables qui déterminent la survie. Si la perte de Tremay
    avait été plafonnée à 400 k€ avec 2,6 M€ de trésorerie et zéro dette, l''entreprise existerait encore.
    J''ajoute qu''un cas unique est opposé ici à onze installations documentées. Je suis preneur du bilan
    de Tremay avant vendredi : s''il révèle notre propre structure d''exposition, je retire ma recommandation.


    ## 4. Ce que je propose au conseil de confier à la direction financière


    Le désaccord ne se tranche pas par un vote, il s''organise. Je propose que le directeur financier
    détienne le dispositif d''arrêt :


    1. **Réserve cantonnée de 400 k€** immobilisée dès la signature — la pénalité est préfinancée au jour
    un, elle ne touchera jamais le besoin en fonds de roulement ni les salaires.

    2. **Autorité de constatation de l''échec**, avec pouvoir de déclencher la résiliation par anticipation
    : constater tôt coûte moins cher qu''attendre le 12ᵉ mois.

    3. **Reporting trimestriel** au conseil sur les deux seuils du §5.


    ## 5. Repli, déclencheurs, et ce qui renverserait le choix


    **Avant signature — trois conditions bloquantes.** (a) Contre-expertise indépendante des onze installations
    comparables : si elle situe la probabilité de succès **sous 50 %**, nous basculons sur A. (b) Vérification
    juridique que le plafond de 400 k€ couvre bien le capex d''installation non récupérable, et non uniquement
    la pénalité. (c) Confirmation à la lecture du projet définitif de l''absence de caution, de défaut
    croisé et de sûreté. **L''apparition de l''un de ces trois éléments annule la recommandation** — c''est
    ce qui la rend réfutable.


    **Après signature — repli.** Jalon technique de recette au 6ᵉ mois non atteint, ou fonds propres sous
    **1,8 M€** à une clôture trimestrielle : constatation immédiate de l''échec, appel de la réserve,
    arrêt. Aucune reprise sans décision expresse du conseil.


    **Première action, lundi :** commande de la contre-expertise et de la revue juridique des trois points,
    sous 15 jours. Aucune signature avant réception des deux.


    ---


    **Deux réserves que je porte à votre connaissance :**


    **Fenêtre Sedamex.** Je suppose que l''option Sedamex reste ouverte pendant les 15 jours de diligence.
    Si elle se referme avant, le conseil doit trancher vendredi sur les éléments actuels — et sur ces
    éléments, la recommandation reste B, l''écart entre les deux options étant net. Cette hypothèse est
    à vérifier avant l''envoi de la note.


    **Capex.** J''ai lu « perte totale plafonnée à 400 k€ » comme incluant le coût d''installation non
    récupérable. Si le capex s''y ajoute, tous les chiffres du pire cas sont à refaire — d''où la condition
    (b).

    '
