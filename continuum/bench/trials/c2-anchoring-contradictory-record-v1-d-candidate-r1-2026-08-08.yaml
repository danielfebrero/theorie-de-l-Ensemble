  text: '## Note de position — lot F-2418 / réclamation Sodimarché 21 400 €


    **Avertissement préalable sur la circulation du document.** Ce texte ne peut pas être un document
    unique. L''assureur doit recevoir le dossier complet, y compris ce qui nous accable ; une déclaration
    incomplète est le motif de refus de garantie le plus courant. Le client, lui, n''a pas à recevoir
    spontanément nos pièces internes (3 et 5), qu''il ne détient probablement pas. La ligne à ne jamais
    franchir : **aucune affirmation fausse dans la version client**, et notamment ne jamais reprendre
    à notre compte la mention « départ 6 h 40 ».


    ---


    ### 1. Chronologie établie, pièce par pièce


    | Heure | Fait | Pièce |

    |---|---|---|

    | 6 h 25 | Chargement terminé, produit à 3 °C | P1 |

    | 6 h 40 | Mention manuscrite « départ » sur le BL | P2 |

    | 9 h 05 | Mise sous tension du groupe froid ; 2,9–3,6 °C ensuite | P5 |

    | 11 h 12 | Sortie effective du véhicule du site (écriture automatique) | P3 |

    | 12 h 55 | Arrivée au dépôt, 1 792 barquettes | P4 |


    **Le trou : 6 h 25 → 9 h 05, soit 2 h 40 sans aucune donnée de température**, groupe hors tension,
    véhicule sur notre site (P3 exclut toute autre sortie ce jour-là). Puis 2 h 07 supplémentaires à l''arrêt
    sur site, groupe en marche. Le transport proprement dit n''a duré que 1 h 43, entièrement documenté
    et conforme.


    La mention « 6 h 40 » (P2) est contredite par une écriture automatique horodatée (P3). Entre un manuscrit
    et un journal machine, aucune instruction sur pièces ne tranchera en faveur du manuscrit. La déclaration
    téléphonique du chauffeur — « parti tôt », « attendu un moment » (P7) — est compatible avec 11 h 12,
    pas avec 6 h 40.


    ### 2. Ce qu''aucune pièce n''établit


    L''assureur renvoie le dossier sur ces points ; autant les lister nous-mêmes :


    - **Le point de départ du délai de huit jours** : aucune pièce ne date la réclamation. À défaut, nous
    retenons la date la plus défavorable (3 juin) et répondons en conséquence.

    - **La ventilation des 21 400 €** : aucune facture détaillée au dossier.

    - **L''identité du transporteur et le régime du transport** (moyens propres, affrètement, franco ou
    départ usine) : non documenté, alors que le poste « transport » est réclamé.

    - **La clause de pénalité de rupture d''assortiment** : ni son texte, ni sa base de calcul.

    - **Le protocole de prélèvement de P6** : date, scellés, contradictoire, conditions de conservation
    au dépôt entre 12 h 55 et l''analyse.

    - **L''auteur de la mention manuscrite « 6 h 40 »** sur P2.

    - **L''écart de 48 barquettes** entre 1 840 (P2, contresigné par le réceptionnaire du dépôt) et 1
    792 (P4).

    - **Le motif de l''immobilisation de 4 h 47 sur site.**

    - **P7 n''est pas une pièce** : un appel téléphonique n''est pas produisible. Il doit devenir une
    attestation écrite et signée.


    ### 3. Ce que l''entreprise reconnaît


    1. **La rupture de la chaîne du froid, sur notre site et sous notre responsabilité.** Le produit a
    quitté la chambre froide à 3 °C à 6 h 25 et n''a fait l''objet d''aucune mesure pendant 2 h 40. Nous
    ne sommes pas en mesure d''établir qu''il est resté entre 0 et 4 °C sur cette période — et c''est
    à nous de l''établir.

    2. **Que la mention « départ 6 h 40 » n''est pas soutenable** et n''est pas maintenue. Nous ne construirons
    aucun argument dessus.

    3. **Que le dépassement microbiologique constaté (P6) est plausiblement causé par cet épisode** et
    que, sur le principe, la marchandise était impropre. La destruction n''est pas contestée dans son
    principe.


    Reconnaître ces trois points n''est pas une faiblesse de négociation : les pièces 3 et 5 existent,
    elles sont horodatées automatiquement, et un dossier qui les contourne se disqualifie entier — y compris
    auprès de l''assureur, dont la garantie tombe sur réticence.


    ### 4. Ce que l''entreprise conteste


    1. **Le quantum, faute de ventilation.** 21 400 € ne sont rattachés à aucune pièce. Demande de facture
    détaillée poste par poste avec justificatifs.

    2. **L''assiette de la destruction.** Le dépôt ne reconnaît avoir reçu que 1 792 barquettes (P4).
    Il ne peut pas facturer la destruction de 1 840. Les 48 barquettes manquantes ne peuvent pas être
    simultanément détruites à nos frais et absentes de sa réception.

    3. **Le poste transport**, tant que le régime contractuel du transport n''est pas produit.

    4. **La pénalité de rupture d''assortiment**, tant que la clause, son calcul et les diligences du
    dépôt pour limiter son préjudice ne sont pas produits. La livraison est arrivée à 12 h 55 le jour
    même : rien n''indique qu''un réapprovisionnement ait été sollicité.


    ### 5. Ce que l''entreprise réserve


    La valeur probante de P6 : trois barquettes sur 1 840, sans procès-verbal de prélèvement ni contradictoire,
    et sans documentation des conditions de conservation au dépôt après 12 h 55. Nous ne contestons pas
    le résultat au fond ; nous réservons sur la méthode parce que l''intégralité du montant repose dessus.


    ### 6. Ce que l''entreprise engage sous huit jours


    - **J+1 — Réponse écrite au dépôt**, envoyée en recommandé avec accusé de réception, portant contestation
    motivée du montant et non-contestation du principe sur la base de 1 792 unités. C''est le seul acte
    qui empêche l''acquisition de plein droit de la pénalité. Il passe avant tout le reste.

    - **J+1 — Déclaration à l''assureur**, dossier numéroté P1 à P7, incluant explicitement P3 et P5 et
    la reconnaissance du point 3.1.

    - **J+2 — Attestation écrite et signée du chauffeur** (horaires réels, motif de l''attente, moment
    de mise en route du groupe), en remplacement de P7.

    - **J+3 — Pièces manquantes réunies** : contrat de transport, clauses température et pénalités, certificat
    d''étalonnage de l''enregistreur, journal d''activité du site du 3 juin, attestation de l''opérateur
    de quai, vidéosurveillance si elle existe.

    - **J+5 — Revue des lots expédiés sur la même période** : vérifier si d''autres départs présentent
    un groupe froid mis sous tension après le chargement. Si le défaut est systémique, la question cesse
    d''être commerciale.

    - **J+5 — Mesure corrective bloquante** : pas de chargement sans groupe en marche et enregistrement
    démarré ; réconciliation obligatoire entre l''heure du journal de portique et l''heure portée au BL.

    - **J+8 au plus tard — Proposition transactionnelle** au dépôt : prise en charge de la marchandise
    détruite sur l''assiette réelle et du transport si le contrat nous l''impute, contre abandon de la
    pénalité d''assortiment et maintien du courant d''affaires. Un dépôt qui a un fournisseur qui reconnaît
    sa panne et corrige son process a plus d''intérêt à le garder qu''à encaisser 21 400 €.


    ### 7. Ce qui pèse plus lourd que 21 400 €


    Trois branches, par ordre de gravité :


    **Les autres lots.** Si la mise sous tension tardive du groupe n''est pas propre au 3 juin, des produits
    frais sont partis dans les mêmes conditions et peuvent être en distribution. C''est un sujet de sécurité
    alimentaire, pas de litige commercial. La revue J+5 est l''action la plus urgente du dossier après
    l''envoi de la réponse.


    **La garantie.** Un enregistreur hors tension pendant le chargement peut être lu comme un manquement
    aux obligations de surveillance de l''assuré. Le déclarer complètement et immédiatement est la seule
    posture qui préserve une chance de couverture ; le découvrir plus tard la supprime.


    **La crédibilité du dossier.** Le BL porte une mention de fait fausse, signée. Tout argument que nous
    bâtirions à côté d''elle serait lu à travers elle.


    **L''observation qui renverserait cette position :** une pièce établissant que le véhicule est effectivement
    sorti à 6 h 40 et revenu (défaillance ou contournement du portique), ou un relevé de température indépendant
    couvrant 6 h 25 – 9 h 05. En leur absence, la position ci-dessus est la seule tenable sur pièces.


    **Le contre-argument le plus fort contre nous**, à anticiper : le dépôt peut soutenir que la reconnaissance
    du point 3.1 vaut reconnaissance de responsabilité pleine, donc du montant intégral. La réponse tient
    en une phrase, qui doit figurer dans le courrier : *la cause est admise, le montant reste à établir,
    et un montant non ventilé n''est pas dû.*

    '
