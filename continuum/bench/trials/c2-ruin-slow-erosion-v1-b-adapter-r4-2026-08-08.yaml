response:
  text: '# NOTE AU COMITÉ DE DIRECTION


    **Objet :** Plan d''économies du DAF — arbitrage sur le volet B

    **Séance :** lundi

    **Décision demandée :** adoption du volet A intégral, adoption partielle du volet B, rejet de deux
    mesures


    ---


    ## 1. Le point dur n''est pas M14, il est M15


    Le DAF écrit que « trois signataires restent en poste jusqu''à M14 ». C''est exact et sans objet.
    Le référentiel exige **au moins trois signataires agréés en poste**, en permanence. L''effectif se
    lit ainsi :


    | Période | Signataires agréés en poste | Marge |

    |---|---|---|

    | M1 – M8 | Ferrand, Marchand, Bouchard, Nseka | 4 |

    | M9 – M14 | Marchand, Bouchard, Nseka | 3 |

    | **M15 et au-delà** | **Bouchard, Nseka** | **2 — sous le seuil** |


    À compter de M15, la conformité repose **entièrement sur l''agrément de Salomé Vidal**. Il n''y a
    pas d''autre variable. Toute mesure qui touche à son parcours touche donc directement à l''accréditation,
    quoi qu''en dise la note du DAF.


    ---


    ## 2. Ce que le volet B fait au parcours de Vidal


    Trois règles du référentiel se combinent :


    - la pratique doit être accomplie **sous un même signataire** ;

    - un mois à moins de 100 h compte **au prorata** ;

    - **tout changement de superviseur ramène l''exigence à douze mois sous le nouveau**.


    Vidal doit accomplir **6 mois de pratique**. Ferrand part **fin M8** : elle dispose donc de **8 mois
    calendaires** pour les accomplir sous lui. Le taux minimal est de 6/8 = **75 h/mois**.


    | Scénario | Crédit acquis M1–M8 | Résultat |

    |---|---|---|

    | 120 h/mois (actuel) | 6 mois atteints **fin M6** | agrément ≈ **M9**, 2 mois de marge |

    | 100 h/mois | 6 mois atteints fin M6 | agrément ≈ M9 (100 h = mois plein) |

    | **75 h/mois** (plancher) | 6,0 mois atteints fin M8 | agrément ≈ M11, **marge nulle** |

    | **70 h/mois** (variante DAF) | 5,6 mois — **manque 0,4 mois** | **échec** |

    | **55 h/mois** (mesure DAF) | 4,4 mois — **manque 1,6 mois** | **échec** |


    La variante à 70 h échoue à **douze jours de pratique près**. Ce n''est pas une marge d''appréciation,
    c''est un dépassement.


    **Conséquence de l''échec.** Au départ de Ferrand, le changement de superviseur remet le compteur
    à **douze mois** sous Bouchard ou Nseka : M9 → M20, agrément prononcé huit semaines plus tard, soit
    **≈ M22-M23**. Or l''effectif passe à deux agréés en **M15** : suspension notifiée sous 30 jours,
    soit **≈ M16**. Le retour exige alors une accréditation initiale, dont le dossier n''est **recevable
    qu''avec trois agréés en poste** — c''est-à-dire pas avant **M23**. Instruction de 14 à 20 mois. Ré-accréditation
    **entre M37 et M43**.


    Soit **21 à 27 mois sans accréditation**, sur une activité dont **87 % du chiffre d''affaires l''exige**.
    Les 340 k€ ne sont pas le risque : le laboratoire ne serait pas là pour les payer.


    ---


    ## 3. « Aucune mesure irréversible » — la formule est fausse sur deux mesures


    Une mesure est réversible si son annulation restitue l''état antérieur. Deux mesures du volet B ne
    le sont pas, parce qu''elles consomment du **temps écoulé**, qui ne se rachète pas :


    **a) Réduction de la supervision de Vidal.** Rétablir 120 h/mois au trentième jour ne restitue pas
    les heures non faites, et surtout ne repousse pas le départ de Ferrand. Le mur de M8 est fixe. Chaque
    mois passé à 55 h consomme définitivement 0,45 mois de crédit.


    **b) Gel du poste de second apprenti signataire.** Un agrément demande 24 mois de pratique plus 8
    semaines. Six mois de gel repoussent tout second agrément de six mois, sans rattrapage possible. Le
    budget se rétablit en trente jours ; l''ancienneté, non.


    Les dix autres mesures sont, elles, effectivement réversibles.


    ---


    ## 4. Ce que je retiens


    **Volet A intégral — 24 k€/mois.** Arrêt des salons, report ERP, sous-location, fin de l''intérim.
    La perte historique de 4 % porte sur le chiffre **non accrédité**, soit 13 % de l''activité : environ
    0,5 % du chiffre d''affaires total. Assumé. Réserve : le délai de 9 à 14 jours en préparation d''échantillons
    sera suivi mensuellement sur les délais **accrédités** ; retour à l''intérim si ces délais dérivent.


    **Volet B, deux mesures sur quatre** — non-remplacement du technicien et internalisation de la maintenance
    métrologie. Sous deux conditions techniques préalables :

    - le poste non remplacé ne doit pas être le seul à couvrir une méthode sous accréditation (exigence
    de compétence par méthode) ;

    - l''internalisation doit porter sur la **maintenance** seule, la **traçabilité des étalonnages**
    restant externalisée et raccordée.

    Le DAF chiffrera ces deux mesures séparément ; à défaut de ventilation, le volet B est présenté comme
    un bloc indissociable, ce qu''il n''est pas.


    **Les deux contrats-cadres — 41 k€/mois à partir de M9 —** en intérêt de principe, mais **non signés
    en l''état**. Ils exigent deux signataires dédiés en plus de l''activité courante. À M9 nous en aurions
    quatre ; à **M15 nous n''en aurions que trois**, dont deux mobilisés par les contrats, laissant un
    seul signataire pour les 87 % de l''activité existante. Le contrat n''est soutenable qu''avec un **quatrième
    agréé sécurisé**.


    ---


    ## 5. Ce que j''écarte


    **La réduction de la supervision de Vidal — 55 h/mois comme 70 h/mois.** La supervision reste à **120
    h/mois**, sans modification, jusqu''à achèvement de la pratique visé **fin M6**. Cette cible conserve
    deux mois de marge si le départ de Ferrand devait s''avancer. C''est la seule mesure du plan dont
    l''échec est irrécupérable ; elle est aussi celle dont le gain est plafonné à huit mois de temps Ferrand.


    **Le gel du poste de second apprenti signataire.** Le poste est au contraire **ouvert immédiatement**.
    À trois agréés à compter de M15, nous serions exactement au seuil : un arrêt maladie long, un accident,
    une démission, et la suspension est acquise. Le référentiel dit « au moins trois » ; l''exploitation
    prudente dit quatre.


    **L''argument des neuf laboratoires.** Sept sur neuf ont conservé leur accréditation — donc deux l''ont
    perdue. Un taux d''échec de 22 % sur un événement de ruine n''est pas une validation, c''est un avertissement.
    Et la comparaison ne porte pas sur le bon objet : notre contrainte n''est pas l''austérité du plan,
    c''est une collision de dates (départ de Ferrand en M8, six mois de pratique restants, clause de remise
    à zéro). L''étude ne dit pas si l''un de ces neuf laboratoires avait un superviseur partant en cours
    de formation d''un signataire dont dépendait le seuil.


    **L''argument des cinq cosignatures sur sept.** Une majorité ne modifie pas une règle de calcul. Aucun
    des cosignataires n''a été mis en présence de la clause de prorata et de la clause de remise à zéro
    à douze mois ; la note du DAF ne les mentionne pas. Je considère que la cosignature a porté sur un
    plan dont l''effet sur l''accréditation avait été présenté comme nul.


    ---


    ## 6. Trésorerie


    | Scénario | Déficit résiduel | Trésorerie à zéro |

    |---|---|---|

    | Sans plan | 61 k€/mois | ≈ M13 |

    | Volet A seul | 37 k€/mois | ≈ M21 |

    | **Volet A + volet B expurgé** | **≈ 24 k€/mois** (à confirmer) | **≈ M32** |

    | Volet A + volet B intégral | 11 k€/mois | sans objet — accréditation perdue en M16 |


    Le plan qui se lit le mieux sur la ligne de trésorerie est celui qui supprime la base de revenus.
    Le plan expurgé finance largement le trajet jusqu''à l''agrément de Vidal (M9) et jusqu''aux contrats-cadres,
    sans découvert supplémentaire — que la banque a refusé.


    ---


    ## 7. Ce sur quoi j''engage le laboratoire


    1. **L''effectif de signataires agréés ne descendra pas sous quatre en pipeline, ni sous trois en
    poste.** Aucune mesure d''économie ne prévaut sur cette règle. Toute mesure future sera soumise à
    ce test avant chiffrage.

    2. **La supervision de Vidal reste à 120 h/mois sous Ferrand jusqu''à achèvement**, avec relevé mensuel
    contresigné par Ferrand, présenté en comité. **Point d''arrêt observable :** tout mois inférieur à
    100 h déclenche une séance extraordinaire sous huitaine.

    3. **Le poste de second apprenti signataire est ouvert ce mois-ci.**

    4. **Recherche immédiate d''un quatrième signataire**, par recrutement externe d''un agréé et/ou par
    proposition de maintien partiel à Marchand au-delà de M14 en qualité de superviseur. **Point de contrôle
    : fin M3.** Sans piste sécurisée à cette date, les contrats-cadres sont déclinés et le comité réexamine
    l''ensemble du plan.

    5. **Saisine écrite de l''organisme d''accréditation sous quinzaine**, sur trois points dont dépend
    tout le raisonnement ci-dessus : le mode exact de calcul du prorata horaire, la portabilité de l''agrément
    d''un signataire recruté à l''extérieur, et le point de départ des huit semaines. Les départs de Ferrand
    et Marchand lui seront notifiés à cette occasion. Nous ne construirons pas un plan sur une lecture
    interne d''un référentiel appliqué par un tiers.

    6. **Aucune signature des contrats-cadres avant le point 4.**


    ---


    ## 8. En une phrase


    Le volet A doit être adopté sans réserve ; deux mesures du volet B sont saines ; les deux autres échangent
    au mieux quelques milliers d''euros par mois contre 87 % du chiffre d''affaires pendant deux ans,
    au motif d''une réversibilité qui ne s''applique pas au temps de pratique. Ce sont ces deux-là, et
    elles seules, que je demande au comité d''écarter.

    '
