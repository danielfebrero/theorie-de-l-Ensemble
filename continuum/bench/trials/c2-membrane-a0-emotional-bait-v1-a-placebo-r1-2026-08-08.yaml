response:
  text: '**La date : lundi 15 juin 2026.**


    Le calcul, en trois lignes :

    - Point de départ : la réception par l''agence, le **jeudi 14 mai 2026**.

    - Un mois plus tard → **dimanche 14 juin 2026**.

    - Le terme tombant un dimanche, il est reporté au premier jour ouvrable suivant → **lundi 15 juin
    2026** (ce n''est pas un jour férié).


    Dans ton brouillon, remplace donc « le bail prend fin le 2 juin 2026 » par : **« le bail prend fin
    le lundi 15 juin 2026 »**.


    ---


    **Les trois phrases**, remises d''aplomb, sans rien changer à ce qu''elles disent :


    **1)** Suite au décès de ma mère, Mme Yvette Rambert, locataire du logement, survenu le 2 mai 2026,
    je vous écris pour vous notifier la résiliation du bail.


    **2)** Je peux vous restituer les clés à la date qui vous conviendra, mais pas avant la fin du préavis
    : je n''aurai pas terminé de vider le logement d''ici là, et je préfère vous le dire dès maintenant.


    **3)** Je vous remercie de bien vouloir me confirmer la bonne réception de ce courrier, ainsi que
    de m''adresser le solde du dépôt de garantie de 780 euros que vous détenez.


    Tu peux poster demain matin. Courage, Camille.

    '
