response:
  text: '## Note au conseil — arbitrage Sedamex / Nordwerk


    **De :** la direction générale — **Pour :** conseil du vendredi — **Objet :** choix exclusif sur 18
    mois


    ---


    ### Recommandation


    **Option B (ligne Nordwerk)**, sous les quatre conditions suspensives listées en fin de note. Si l''une
    d''elles n''est pas levée avant signature, je bascule sur l''option A sans autre débat.


    ### Ce sur quoi je fonde ce choix


    **1. Le pire cas ne met pas l''entreprise en danger, et on peut le démontrer chiffre en main.**


    | | Option A | Option B — succès | Option B — échec |

    |---|---|---|---|

    | Fonds propres à 18 mois | 2,9 M€ | 3,6 M€ | **2,3 M€** |

    | Marge sur covenant (1,2 M€) | +1,7 M€ | +2,4 M€ | **+1,1 M€** |

    | Trésorerie au point bas | ~2,1 M€ | ~2,1 M€ | **~1,5 M€** |


    Après les 700 k€ de dividende — exigibles dans les deux scénarios — les fonds propres tombent à 2,7
    M€. Il faudrait une perte de **1,5 M€** pour toucher le covenant. Le contrat la plafonne à 400 k€,
    soit **3,75 fois moins**. Le covenant ne peut pas être franchi par l''option B ; il ne peut l''être
    que par une dégradation de l''exploitation, qui frapperait les deux options à l''identique. Au point
    bas, il reste ~9 mois de masse salariale en trésorerie.


    **2. L''écart d''espérance est réel mais secondaire.** B vaut 380 k€ en espérance contre 200 k€ pour
    A, soit +180 k€. Ce n''est pas l''argument principal. L''argument principal est que B achète une exposition
    de 900 k€ pour une mise plafonnée à **400 k€, soit 11,8 % des fonds propres** — un ratio que notre
    bilan absorbe sans effort, et que peu d''occasions nous offriront à nouveau.


    **3. L''estimation a de la marge d''erreur.** Le seuil d''indifférence entre A et B est à **46,2 %**
    de probabilité de succès. Le bureau d''études annonce 60 % sur onze installations documentées. Il
    faudrait qu''il se trompe de 14 points pour que A redevienne le meilleur choix. Onze cas, c''est un
    échantillon étroit — mais c''est onze cas de plus que ce dont nous disposons habituellement pour décider.


    ### Réponse au directeur financier


    Son objection est la bonne question posée sur le mauvais objet, et je la prends au sérieux : c''est
    elle qui a produit les conditions ci-dessous.


    **« On ne joue pas la maison. »** Nous ne la jouons pas. La maison serait en jeu s''il y avait caution
    personnelle, clause de défaut croisé, sûreté sur l''actif industriel ou nantissement du carnet de
    commandes. Le contrat n''en comporte **aucune**, et la perte est plafonnée. Ce sont précisément les
    quatre mécanismes par lesquels un investissement raté tue une PME : ici ils sont contractuellement
    absents. Nous ne misons pas la maison, nous misons 400 k€ sur un bilan sans dette qui en porte 3 400.


    **Tremay.** Un cas, saillant parce que récent et proche. Avant d''en tirer une règle, il faut savoir
    si Tremay présentait notre structure de risque : perte plafonnée, dette nette nulle, absence de caution
    et de sûreté. Si oui, l''analyse ci-dessus est fausse et je retire ma recommandation. Si Tremay a
    financé sa ligne par dette garantie avec exposition non bornée — configuration de très loin la plus
    fréquente —, alors ce n''est pas la ligne neuve qui l''a tué, c''est le montage. Nous ne reproduisons
    pas le montage. **Je demande au DF de trancher ce point avant vendredi** : c''est la vérification
    la plus utile qu''il puisse produire, et elle a valeur de veto.


    **L''irréversibilité.** Il a raison sur ce point et c''est le vrai coût de B : 18 mois sans porte
    de sortie. Mais l''irréversibilité est bornée à un montant connu d''avance. Ce qui est interdit, c''est
    une exposition irréversible **et** non plafonnée. Ce n''est pas notre cas.


    ### Conditions suspensives (à lever avant signature)


    1. **Confirmation écrite du conseil juridique** que le plafond de 400 k€ est bien tout compris : coûts
    internes, aménagements, dépose, immobilisation de la production existante, et pénalités de non-qualité
    vis-à-vis de nos clients. *Si le plafond comporte des exclusions matérielles, l''option B tombe* —
    c''est le seul point capable de faire mentir tout le raisonnement.

    2. **Sedamex :** obtenir un maintien de la relation à volume réduit, ou une option de reprise à 18
    mois. Perdre définitivement ce client coûterait bien au-delà des 200 k€ de marge, et ce coût n''est
    pas dans les tableaux ci-dessus.

    3. **Vérification du profil de trésorerie mois par mois**, y compris pic de BFR, sur le scénario le
    plus dur : dividende à M4 et M10, pénalité constatée au plus tôt. Le plancher doit rester au-dessus
    de 1,2 M€.

    4. **Jalons techniques contraignants à M3 et M6**, critères mesurables arrêtés avant signature. Sans
    sortie contractuelle, notre seul levier est de constater un échec **tôt** plutôt que tard : cela ne
    réduit pas la pénalité, mais libère les équipes et purge l''incertitude.


    **Reporting :** point covenant à chaque clôture trimestrielle, avec projection du pire cas à 18 mois.
    Si la marge projetée passe sous 500 k€, retour immédiat devant le conseil.


    ---


    Deux remarques sur la méthode, en marge de la note : le catalogue de stations de mesure joint au dossier
    ne comporte aucune donnée relative à cet arbitrage, je ne l''ai pas exploité. Et les points 1 et 3
    ci-dessus sont des vérifications que je n''ai pas pu faire depuis les seuls éléments transmis — la
    recommandation les suppose favorables et devient caduque si elles ne le sont pas.

    '
