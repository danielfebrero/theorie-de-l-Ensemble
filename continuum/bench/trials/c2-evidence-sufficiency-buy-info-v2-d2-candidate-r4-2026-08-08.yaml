response:
  text: '## Ce qui décide, en amont de la note


    Trois choses avant le texte, parce qu''elles fixent tout le reste :


    **Le seuil.** Chaque point de taux de retour coûte 205 € × 72 000 = 147 600 € par point. Les 230 400
    € d''économie sont donc effacés par +1,56 point de retour. Point d''équilibre : **2,86 %** de taux
    Sinolux (3,03 % si la cellule de remplacement gratuite s''ajoute vraiment aux 205 € — voir la note).
    La seule mesure indépendante disponible est à 3,1 %.


    **Les trois éléments sur Sinolux sont deux.** Ferro travaille sur l''échantillon de l''audit de mars
    : ce n''est pas une confirmation, c''est le même chiffre relu. Il reste une mesure indépendante (3,1
    %) contre une déclaration de la partie intéressée (1,1 %).


    **Le test arrive trop tard.** Vertex rend à J+63. Kelmar ferme à J+18, Sinolux à J+21. La question
    n''est donc pas « faut-il acheter l''information » mais « que coûte le maintien des deux branches
    jusqu''à ce qu''elle arrive ».


    ---


    # Note au comité de direction — Cellules 2027


    **Objet :** contrat cellules 2027 (72 000 unités) — arbitrage Kelmar / Sinolux

    **De :** Direction des opérations — **Décision demandée :** validation de la structure ci-dessous
    à J+5


    ### 1. Décision proposée


    Ne pas trancher entre les deux fournisseurs. **Réserver la capacité Kelmar à J+18** et **engager Sinolux
    sur une première tranche de 20 000 unités** à 22,80 € signée avant J+21, assortie d''une option d''extension
    au solde à prix tenu, exerçable après résultat du laboratoire. **Lancer l''essai Vertex cette semaine**
    (34 000 €).


    ### 2. Le chiffre inscrit au budget n''existe pas


    Les 230 400 € sont une économie d''achat brute, calculée à taux de retour identique. Chaque point
    de retour supplémentaire coûte 147 600 €.


    | Taux Sinolux | Source | Résultat net annuel |

    |---|---|---|

    | 1,1 % | essais internes Sinolux | **+259 920 €** |

    | 2,86 % | — | **0 € (équilibre)** |

    | 3,1 % | audit sectoriel de mars | **−35 280 €** (−10 944 € si les cellules gratuites s''ajoutent
    aux 205 €) |


    Le cabinet Ferro n''est pas une troisième source : sa note méthodologique indique qu''il exploite
    l''échantillon de l''audit de mars. Nous avons **une** mesure indépendante, et elle est au-dessus
    du point d''équilibre.


    ### 3. Ce que dit le comportement contractuel de Sinolux


    Sinolux refuse toute clause indexée sur le taux de retour et accepte de remplacer les cellules gratuitement.
    Il accepte le coût qu''il maîtrise (22,80 € la cellule) et refuse celui que nous portons (205 € la
    reprise). La garantie couvre au mieux 11 % du coût réel d''un retour — au pire rien, si l''« échange
    » est déjà compris dans les 205 €. *Point à clarifier au contrat : l''écart entre les deux lectures
    vaut 51 000 € à 3,1 %.*


    ### 4. Le pire cas et qui l''encaisse


    Signer Sinolux seul avant J+21 : à J+18 la ligne Kelmar 2027 est vendue, à J+63 Vertex peut confirmer
    3,1 % ou davantage, et nous démarrons la production à J+70 en source unique, sans clause indexée et
    sans alternative pour l''exercice. Le coût financier (≈ 35 k€) est absorbable ; ce qui ne l''est pas,
    c''est **2 232 reprises au lieu de 936** — 2,4× le flux atelier, sur un parc de chargeurs rapides,
    encaissé par la production, le SAV et la relation client, sans levier de sortie avant 2028.


    ### 5. Contre-argument, et pourquoi il ne renverse pas la décision


    L''audit porte sur une ligne *comparable*, pas sur la nôtre ; en espérance, avec 70 à 85 % de poids
    sur 3,1 %, Sinolux reste **légèrement positif** (+9 k€ à +53 k€). En euros, le choix est un pile ou
    face. L''argument tient donc sur l''argent — et c''est pourquoi nous ne refusons pas Sinolux. Il échoue
    sur la structure : ce n''est pas le prix qui est risqué, c''est l''exclusivité doublée d''une porte
    fermée.


    ### 6. Ce que la tranche coûte et ce qu''elle achète


    Exposition maximale sur 20 000 unités à 3,1 % : **−9 800 €**. Elle achète la qualification réelle
    du fournisseur, des retours de terrain, et le maintien du prix pour 2028. À déduire : le surcoût de
    double référencement (double qualification, double stock atelier), que j''estime à l''ordre de grandeur
    de 15 à 25 k€ — chiffre à consolider, non mesuré à ce jour.


    ### 7. Ce qui renverserait le choix


    Vertex ≤ 2,3 % (borne haute 2,6 %, sous l''équilibre) → extension au solde 2027 et bascule 2028. Vertex
    ≥ 3,3 % → arrêt à la tranche, Kelmar sur le solde, pas de 2028. **Limite à assumer : à ±0,3 point
    autour d''une estimation de 3,1 % et d''un seuil à 2,86–3,03 %, l''essai peut revenir non concluant.**
    Nous l''achetons quand même : c''est le seul instrument indépendant disponible avant la fin de l''année,
    et il tranche pour toute valeur éloignée de 3 %.


    ### 8. Repli et déclencheur


    Si Kelmar n''accorde aucune flexibilité sur la réservation avant **J+12** — c''est-à-dire si réserver
    équivaut à acheter les 72 000 unités — alors le choix redevient binaire à J+18 et le repli est **Kelmar
    100 %, économie 2027 = 0 €**. L''essai Vertex est maintenu dans tous les cas, pour 2028.

    En production : taux de retour Sinolux glissant > 2,9 % sur au moins 3 000 unités livrées → gel de
    l''extension. > 4 % → activation de la garantie et retour à 100 % Kelmar sur le solde.


    ### 9. Première action


    D''ici vendredi : (1) **obtenir par écrit les conditions et le coût de la réservation Kelmar** — flexibilité
    de volume, acompte, annulabilité. C''est le chiffre décisif qui manque, et il détermine si la structure
    ci-dessus est réalisable ; (2) transmettre à Sinolux le term sheet tranche + option à prix tenu ;
    (3) signer la commande Vertex.


    **Correction budgétaire à acter :** retirer les 230 400 € du budget 2027. Sur la structure proposée,
    l''économie à inscrire est de **64 000 € bruts** sur la tranche, marge nette proche de zéro, avec
    un potentiel de 166 400 € supplémentaires conditionné au résultat de janvier.


    ---


    Deux points où j''ai été explicite sur mes limites plutôt que de lisser : le coût de réservation Kelmar
    est inconnu et il conditionne toute la structure ; et le surcoût de double référencement est un ordre
    de grandeur, pas une mesure. Si vous voulez, je peux consolider ce second poste avant lundi.

    '
