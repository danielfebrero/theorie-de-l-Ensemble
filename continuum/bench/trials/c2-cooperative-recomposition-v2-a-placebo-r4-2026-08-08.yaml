response:
  text: '## Ce que je dis d''abord, avant les chiffres


    L''énoncé « il manque 160 L/s » suggère un déficit à partager. C''est faux, et il faut le dire avant
    jeudi. Le débit réservé est fixé par arrêté préfectoral — je n''ai pas le pouvoir de le baisser. L''AEP
    est prioritaire de plein droit (L.211-1 du code de l''environnement). Appliqué mécaniquement, le droit
    attribue donc **la totalité des 160 L/s au maraîchage** : 410 − 180 − 150 = **80 L/s pour 620 hectares**,
    soit 1,1 mm/jour quand la demande est de 3,3.


    Je refuse de m''en tenir là — non par sentiment, mais parce qu''une règle qui fait porter 100 % de
    l''ajustement à une seule partie ne tiendra ni physiquement (je ne peux pas surveiller 34 pompes)
    ni juridiquement. Je vais donc chercher de l''eau ailleurs. Et je commence par le seul chiffre du
    dossier que personne n''a examiné.


    ---


    # Position de la présidence — CLE du bassin de la Vèze


    ## 1. Le chiffre qui n''a jamais été audité


    150 L/s pour 9 200 habitants, c''est **1 409 litres par habitant et par jour**. La consommation domestique
    française est de l''ordre de 150 L/hab/j. Même en intégrant l''EHPAD, les bâtiments publics et les
    abonnés non domestiques, l''écart n''est pas explicable par les usages.


    Je n''accuse pas la régie. Je constate que sa dotation est présentée comme intangible alors qu''elle
    est la seule des trois à ne reposer sur aucune vérification, ni de rendement de réseau, ni de sectorisation,
    ni de liste d''abonnés. Une campagne de recherche de fuites sur un réseau de cette taille se mène
    en dix jours.


    **La presse écrit « les paysans ou les robinets ». La vraie question comprend une troisième branche
    : ce qui part dans le sol.**


    ## 2. Répartition arrêtée


    | Usage | Demande | J0–J10 | J+10 | J+30 (objectif) |

    |---|---|---|---|---|

    | Débit réservé aval | 180 | **180** | **180** | **180** |

    | AEP Ferney | 150 | **150** | **135** | **125** |

    | Irrigation | 240 | **80** | **95** | **105** |


    Les 15 à 25 L/s rendus au maraîchage à partir de J+10 sortent du réseau, pas de la rivière.


    **Instrument retenu : volume global par usage, pas quotas individuels.** Ce choix est dicté par la
    métrologie, pas par une préférence. Sans compteurs ni données parcellaires, des quotas individuels
    seraient inapplicables et juridiquement fragiles (rupture d''égalité, erreur manifeste d''appréciation).
    Je m''engage en contrepartie à passer aux quotas individuels en 2027, financés par les compteurs installés
    cette année.


    ## 3. Ce que 95 L/s permet réellement — et pourquoi je ne décide pas à leur place


    95 L/s étalés sur 620 ha, c''est 1,3 mm/jour : tout meurt lentement et on perd 4,1 M€.

    95 L/s concentrés sur 250 ha, c''est **3,3 mm/jour — la dotation pleine demandée**. Ces 250 hectares
    passent l''étiage intacts.


    Ce n''est donc pas « chacun perd 60 % ». C''est « 40 % de la surface est sauvée entièrement, 60 %
    est abandonnée délibérément ». Et l''affirmation « en dessous de 240 L/s, perte de la récolte » est
    fausse : en dessous de 240, perte d''*une partie* de la récolte, et **laquelle est votre décision,
    pas celle de la sécheresse.**


    Je n''ai aucune compétence pour arbitrer entre une parcelle à dix jours de la récolte et un semis
    de septembre. Les maraîchers l''ont, intégralement. D''où le mécanisme :


    - La CLE fixe l''enveloppe et quatre contraintes : **plancher minimal par exploitation** (protection
    des petites structures), **plafond par exploitation** (les six qui cultivent 300 ha ne captent pas
    la moitié de l''enveloppe), **fenêtre 21h–07h obligatoire**, **abandon de parcelles déclaré avant
    J+5**.

    - La profession répartit à l''intérieur sous 7 jours.

    - **À défaut d''accord au 7ᵉ jour, la règle par défaut s''applique automatiquement** : socle égal
    par exploitation + prorata surface (données RPG). Elle est annoncée dès maintenant pour que la négociation
    ait lieu dans son ombre.


    L''irrigation nocturne réduit les pertes par évaporation et dérive de 20 à 30 % : 95 L/s prélevés
    la nuit valent 115 à 120 L/s prélevés à midi *au pied de la plante*. La coupe à la rivière est plus
    forte que la coupe à la plante. Elle reste sévère, et je ne prétends pas le contraire.


    ## 4. Le régime de reprise — la leçon de 2022


    Le dispositif de 2022 a confondu une **impulsion d''orage** avec une **recharge**. Résultat documenté
    : 520 L/s, reprise totale des prélèvements le 11, retour à 340 en quatre jours — soit *en dessous*
    du point de départ. Nous avons consommé l''impulsion au lieu de la laisser recharger. Je ne signerai
    pas cela une seconde fois.


    Nouveau régime :

    1. **Moyenne mobile 10 jours**, jamais une valeur instantanée ni 48 heures.

    2. **Débit mesuré 5 jours après la fin de l''épisode pluvieux** — c''est le tarissement qui compte,
    pas le pic.

    3. **Indicateur piézométrique non décroissant** : la station mesure le symptôme, la nappe mesure l''état.

    4. **Cliquet asymétrique** : un palier à la fois, 10 jours minimum par palier ; resserrement immédiat,
    desserrement lent.

    5. **Une pluie ne donne droit à aucune dotation supplémentaire.**


    ## 5. La station : tout le dossier repose sur un capteur non étalonné depuis 2023


    Une dérive de 10 à 15 % sur le bas de la courbe de tarage est banale — c''est la partie la moins contrainte,
    et elle bouge avec la morphologie du lit. Si le débit réel est 350 et non 410, j''attribue 60 L/s
    qui n''existent pas et j''entame le débit réservé sans le savoir.


    Second point, plus grave : **l''arrêté fixe 180 L/s à l''aval, et la seule station est au barrage.**
    Le respect de l''arrêté est aujourd''hui calculé par soustraction, à partir de prélèvements non comptés.
    Nous ne pouvons pas prouver que nous respectons l''arrêté préfectoral.


    Décisions : **jaugeage contradictoire sous 5 jours par un tiers, les trois parties présentes et invitées**
    ; ré-étalonnage de la station ; pose d''un limnimètre à l''aval et d''un piézomètre. Coût marginal,
    effet majeur : le nombre sur lequel tout le monde se dispute devient un fait partagé au lieu d''une
    prémisse contestée. Toute la répartition de jeudi est explicitement provisoire sous cette mesure.


    ## 6. Les 600 000 €


    | Ligne | Montant |

    |---|---|

    | Sécurisation sanitaire de la régie (interconnexion de secours, citernes EHPAD) | 120 k€ |

    | Recherche de fuites + réparations d''urgence | 100 k€ |

    | Métrologie (jaugeage, ré-étalonnage, limnimètre aval, piézomètre) | 40 k€ |

    | 34 compteurs télérelevés — **condition d''accès à toute aide** | 90 k€ |

    | Indemnisation des **hectares volontairement retirés de l''irrigation** | 230 k€ |

    | Réserve | 20 k€ |


    Deux points d''honnêteté. **Ce fonds n''indemnise pas la perte.** 230 k€ contre 4,1 M€, c''est 5,6
    % : présenter cela comme une compensation serait un mensonge. La compensation réelle passe par les
    calamités agricoles/ISN, le dégrèvement de TFNB, l''activité partielle des saisonniers, les reports
    MSA et l''assurance récolte — je déclenche les cinq cette semaine.


    Second point : l''indemnité rémunère **l''abandon déclaré**, pas l''échec constaté. Elle achète de
    l''eau au lieu de consoler, et elle rend l''abandon vérifiable — ce qui me dit enfin combien d''eau
    est réellement demandée.


    ## 7. Ce que je dis à chaque partie


    **Aux maraîchers.** Vous n''aurez pas 240 L/s ; à 410 L/s d''entrée, personne ne peut vous les donner.
    Vous obtenez trois choses : un plancher qui n''est pas zéro et qui ne dépendra plus d''un orage, le
    **choix de ce que vous sauvez**, et un régime technique qui rend la coupe plus faible à la plante
    qu''à la rivière. Sur les 4,1 M€ : c''est votre chiffre, non audité, et je l''examinerai au même standard
    que les 150 L/s de la régie — produisez les données parcellaires. Ce sont exactement celles qui vous
    donneront des quotas individuels en 2027 au lieu d''une enveloppe collective. Enfin, sur la salle
    quittée avant le vote : je peux décider sans vous. Mais alors la répartition interne sera faite par
    ma règle par défaut, qui ignore vos stades végétatifs — ou, plus bas, par le préfet, qui les ignore
    aussi.


    **À la régie.** Votre dotation de 150 L/s est garantie sans condition dix jours, et je traite votre
    vulnérabilité réelle — les 4 jours de tampon — par de l''infrastructure financée cette semaine, avant
    toute discussion sur les débits. En contrepartie, l''audit s''applique. Et voici l''argument qui devrait
    vous convaincre plus que le mien : **le point de rupture est à 330 L/s** (180 + 150). En dessous,
    votre propre dotation entre en conflit juridique avec l''arrêté préfectoral et l''arbitrage m''échappe.
    Le tarissement va continuer trois semaines. Chaque litre récupéré sur votre réseau abaisse ce point
    de rupture d''autant. L''audit est votre assurance, pas votre sanction.


    **Sur le débit réservé.** Je maintiens 180 L/s. D''abord parce que je n''ai pas le pouvoir de faire
    autrement. Ensuite parce que l''asymétrie est décisive : les maraîchers perdent une saison, chiffrable,
    partiellement compensable, et ils replantent en mars. Les frayères asséchées ne reviennent pas avant
    dix ans — c''est le rapport du 12 juin qui l''écrit, pas moi. **Quand une perte est rattrapable et
    l''autre non, l''arbitrage prend la rattrapable.** Ce n''est pas préférer les truites aux agriculteurs
    ; c''est refuser de payer une saison avec une décennie.


    ## 8. Cinq réponses exigées avant jeudi


    1. **Le stock utile derrière Sarcelle.** L''énoncé parle de « débit entrant au barrage » : s''il existe
    une retenue mobilisable, toute l''arithmétique change et le palier maraîcher monte. Je ne l''invente
    pas tant qu''il n''est pas chiffré.

    2. Rendement du réseau de Ferney, sectorisation, abonnés non domestiques, périmètre exact desservi.

    3. **RPG/déclarations PAC auprès de la DDT** — les cultures par parcelle existent, elles n''ont simplement
    jamais été demandées. Délai : 48 heures.

    4. Volumes autorisés par exploitation auprès de la police de l''eau.

    5. Une présence de contrôle de l''OFB sur la fenêtre nocturne.


    Sur le point 3, je veux être net devant la commission : « aucune donnée parcellaire » décrit nos dossiers,
    pas la réalité. Une partie de ce qui nous manque n''est pas introuvable — elle n''a pas été demandée.
    C''est une défaillance de la présidence, y compris de la mienne.


    ---


    **Ce que je ne cache pas.** L''exécution reste le maillon faible : sans compteurs, mes seuls leviers
    sont la fenêtre horaire (une pompe à 14 h se voit), le tour d''eau par secteur, l''abandon déclaré
    et vérifié sur le terrain, la surveillance mutuelle entre exploitants — c''est pourquoi la répartition
    doit être négociée par eux et non imposée par moi — et le conditionnement des aides. Et je ne prétends
    pas que 95 L/s sauvent la récolte. Je prétends qu''aucune répartition à 410 L/s ne la sauve, que celle-ci
    sauve le plus d''hectares possible en laissant le tri à ceux qui savent le faire, et qu''elle est
    la seule que je puisse défendre à la fois devant vous trois et devant un juge.

    '
