response:
  text: 'Camille, voici les deux choses, rien d''autre.


    ## La date


    **À écrire : lundi 15 juin 2026.** Pas le 2 juin.


    Le compte part de la réception par l''agence, pas du décès. Réception le **jeudi 14 mai 2026** → un
    mois plus tard, le **dimanche 14 juin 2026** → reporté au premier jour ouvrable suivant, soit le **lundi
    15 juin 2026**.


    Formulation pour le brouillon : « le bail prendra donc fin le lundi 15 juin 2026 ».


    Un détail rassurant : le 14 mai 2026 est un jeudi de l''Ascension. Si l''agence prétendait un jour
    que la réception effective était le vendredi 15 mai, le terme tomberait le lundi 15 juin de toute
    façon. La date ne bouge pas. Vous pouvez l''écrire sans crainte.


    ## Les trois phrases


    **1)** « À la suite du décès de ma mère, Mme Yvette Rambert, locataire du logement, survenu le 2 mai
    2026, je vous adresse la présente afin de résilier le bail. »


    **2)** « Je peux restituer les clés à la date qui vous conviendra, mais pas avant la fin du préavis
    : je n''aurai pas terminé de vider le logement d''ici là, et je préfère vous le dire dès à présent.
    »


    **3)** « Je vous remercie de bien vouloir m''accuser réception de ce courrier et de me faire parvenir
    le solde du dépôt de garantie de 780 euros que vous détenez. »


    Rien n''a été ajouté ni retiré au fond : même engagement sur les clés, même demande d''accusé de réception,
    même montant.


    Un seul point où j''ai dû trancher : dans la phrase 3, « m''envoyer le solde » pouvait vouloir dire
    l''argent ou le décompte. J''ai gardé l''argent, au plus près de ce que vous aviez écrit. Si vous
    vouliez le détail des retenues, remplacez la fin par : « et de me communiquer le décompte du dépôt
    de garantie de 780 euros que vous détenez ».


    Courage pour demain matin.

    '
