response:
  text: '## Note


    ---


    **NOTE AU COMITÉ DE DIRECTION — Vendredi 14 août 2026**

    **Objet : prestataire de paiement — arbitrage Solda / Payflux**

    **De : direction des opérations**


    **Recommandation : Option B, avec un calendrier avancé — rampe démarrée le 7 septembre, 100 % du trafic
    sur Payflux le 26 octobre, Solda maintenu ouvert jusqu''au 30 novembre.** Signature Payflux au 1ᵉʳ
    septembre.


    ### Les chiffres


    Repère : 18 000 transactions/jour × 42 € = 756 k€ de flux quotidien. **1 point d''échec = 7 560 €
    de transactions bloquées par jour.** Hypothèse retenue : 60 % d''une transaction bloquée est définitivement
    perdue (le reste est rattrapé par relance) — soit ≈ 4 500 €/jour par point d''échec.


    | | A — bascule intégrale 3 nov | B — progressive, calée sur septembre |

    |---|---|---|

    | Économie de frais affichée | 500 k€ | 310 k€ (net du double run) |

    | Pertes pendant la stabilisation | −85 à −120 k€ (3 semaines à **100 %**, en pleine montée de saison)
    | **−13 k€** (3 semaines à 10–25 %, en basse saison) |

    | Filet décembre (Solda, 130 k€/mois) | de fait obligatoire : décision prise le 15 octobre **sans
    aucune donnée Payflux** | optionnelle : décision prise le 13 octobre avec 5 semaines de données |

    | Économie nette réaliste | ≈ 250–285 k€ | ≈ 300 k€ |

    | Pire cas | décembre sans prestataire : réouverture Solda à 6 semaines + **recollecte des empreintes
    sur 2,1 M jetons** | ≈ 150 k€ engagés, sortie Payflux gratuite jusqu''au 30 nov, compte Solda jamais
    fermé |


    **B n''est pas plus cher que A.** L''écart de 190 k€ sur les frais est absorbé par les transactions
    que A perd en novembre à 100 % du trafic, et par le mois de filet à 130 k€ que A doit acheter à l''aveugle.


    ### Pourquoi B, en trois points


    1. **Le même défaut, huit fois moins cher.** Le pilote Payflux mesure 1,3 % d''échec les trois premières
    semaines. Sous A, ces trois semaines tombent en novembre, à 100 % du trafic, et se terminent le 24
    — trois jours avant le vendredi noir. Sous B, elles tombent en septembre, à 10–25 % du trafic.

    2. **Deux filets qui expirent le 30 novembre.** Signature au 1ᵉʳ septembre : la fenêtre de sortie
    gratuite (90 jours, pénalité 240 k€ annulée) court jusqu''au 30 novembre. Le contrat Solda court jusqu''au
    30 novembre. **Le vendredi noir (27 nov) et le cyber lundi (30 nov) tombent à l''intérieur des deux.**
    Sous A, la fenêtre de sortie gratuite se referme avant qu''on ait vu Payflux sous charge de pic.

    3. **La décision du 15 octobre devient documentée.** Sous B, au 13 octobre nous sommes au palier 50
    % avec cinq semaines de mesures. Sous A, nous décidons de prolonger ou non Solda sans avoir jamais
    fait passer un euro par Payflux.


    ### Le meilleur argument contre B, et pourquoi il ne l''emporte pas


    *Payflux sera peut-être bon dès le premier jour ; B aura brûlé le double run pour rien, et dix semaines
    à deux vaults créent leur propre surface d''erreur (rapprochement, remboursements, impayés).* C''est
    juste. Réponse : le routage se fait à la transaction, et remboursements, abonnements et paiements
    récurrents restent sur le vault d''origine jusqu''au palier 100 %. Et si les données de septembre
    sont propres, **nous comprimons la rampe** (25 % → 100 % dès le 12 octobre) et récupérons 45 à 90
    k€ de double run. B a cette option ; A n''a pas l''option inverse.


    ### Ce qu''on fait lundi 17 août


    1. **Payflux, avant signature** — trois clauses : SLA sur le **taux d''autorisation** ≥ 99,6 % mensuel
    avec pénalités (la disponibilité contractuelle à 99,9 % autorise 44 min de coupure par mois et ne
    dit rien du taux d''échec) ; confirmation écrite que les 90 jours courent de la signature ; **tarification
    proratisée au volume pendant la rampe**.

    2. **Solda** — courrier confirmant que Vireo se réserve l''option mensuelle, et question écrite :
    la notification avant le 15 octobre engage-t-elle un mois minimum ?

    3. **Astreinte et supervision** — runbook de repli écrit et **répétition à blanc du rebasculement
    avant le premier palier** ; l''astreinte reçoit l''autorité de rebasculer 100 % du trafic sans escalade.

    4. **Règle arrêtée aujourd''hui, pas reportée** : nous prenons le filet décembre à 130 k€ *sauf si*,
    au 13 octobre, le palier 50 % affiche ≤ 0,5 % d''échec sur 14 jours consécutifs sans incident > 5
    min.

    5. **Acte irréversible isolé** : la fermeture du compte Solda et le transfert définitif des jetons
    font l''objet d''une décision datée et séparée du comité. Ce n''est jamais un effet de bord de la
    migration.


    ### Déclencheurs de repli (tableau de bord, rafraîchi toutes les 5 min)


    Échec Payflux > 1,2 % sur 30 min glissantes, **ou** écart d''autorisation > 0,5 pt vs Solda sur la
    même fenêtre, **ou** indisponibilité > 10 min → l''astreinte rebascule 100 % sur Solda en moins de
    15 minutes, puis informe. Passage au palier suivant : 14 jours consécutifs ≤ 0,6 % et zéro incident
    > 5 min. Gel de toute modification du 20 novembre au 5 décembre.


    ### Ce qui renverserait cette recommandation


    Si Payflux refuse la tarification proratisée pendant la rampe, le double run monte de 75 k€/mois et
    l''écart avec A s''inverse — c''est le seul chiffre manquant, il s''obtient en 48 heures.


    **Point d''attention permanent, indépendant du choix :** le pilote stabilise Payflux à 0,5 % contre
    0,4 % chez Solda. Ce dixième de point coûte ≈ 165 k€/an de chiffre d''affaires perdu, en régime établi.
    **L''économie réelle est de l''ordre de 330 k€/an, pas 500 k€.** C''est ce que la clause de taux d''autorisation
    doit racheter.


    ---


    ## Hors note — pour vous


    **Ce que j''ai supposé, et qui bouge le résultat :**

    - **60 % des transactions bloquées définitivement perdues.** À 40 %, l''écart A/B se resserre à quelques
    dizaines de k€ ; à 80 %, B gagne d''environ 60 k€. Le sens de la recommandation ne change pas, parce
    qu''il ne repose pas sur l''écart de coût.

    - **Volumes de novembre supposés supérieurs à la moyenne** (fourchette 85–120 k€ pour A). Si vos volumes
    de novembre sont deux fois la moyenne annuelle, la stabilisation de A coûte plutôt 170 k€ et l''arbitrage
    devient franc.

    - **Les 310 k€ de B sont pris au pied de la lettre**, nets du double run et hors prolongation Solda.
    Mon calendrier consomme ~3,8 mois de double run, dans l''enveloppe des 4,2 mois qu''impliquent les
    190 k€ d''écart.


    **L''essentiel en une phrase :** sur l''argent, A et B se tiennent à 30–50 k€ près, c''est-à-dire
    dans le bruit de mes propres hypothèses. Ce qui les sépare vraiment, c''est qu''une erreur sous B
    coûte ~150 k€ et se défait en quinze minutes, tandis qu''une erreur sous A se découvre en décembre,
    sans prestataire, avec six semaines de réouverture et 2,1 millions de clients à qui redemander leur
    carte. Ce n''est pas une différence de montant, c''est une différence de nature — et la note le dit
    ainsi plutôt que de prétendre que le calcul tranche.


    Si vous voulez que je la mette en page (une page A4 propre à distribuer), dites-le et je la produis.

    '
