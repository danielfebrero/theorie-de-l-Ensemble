response:
  text: '# Avis au comité de direction — renouvellement du logiciel de réservation et des bornes de prêt


    **Objet :** contrat arrivant à échéance le 31 octobre — trois options soumises.

    **Position :** ne rien engager sur trois ans avant le 30. Négocier une prolongation courte et instruire
    le défaut de mars comme un manquement au contrat en cours, non comme un achat.


    *Hypothèse de calendrier, à corriger en séance si elle est fausse : « le 28 » et « le 30 » sont ceux
    du mois en cours, ce qui laisse environ neuf semaines entre la séance et l''échéance. Si la séance
    est plus tardive, la marge disparaît et l''engagement n° 1 ci-dessous devient prioritaire sur tout
    le reste.*


    ---


    ## A. Ce que je retiens du dossier


    Chaque constat est autonome : le comité peut en écarter un sans invalider les autres. La section H
    indique ce que devient la recommandation dans chaque cas.


    **C1 — Le dossier confond deux pannes qui n''ont ni la même cause, ni le même calendrier, ni la même
    ligne budgétaire.**

    D''un côté un problème matériel : 32 h d''indisponibilité sur 41 concentrées sur Fontaine et Rive-Sud,
    les deux seuls sites en bornes de 2015 — soit environ 16 h par site contre 1,8 h en moyenne ailleurs.
    De l''autre un problème logiciel apparu après mars. Fontaine porte le même matériel que Rive-Sud et
    ne signale aucune perte de réservation : le vieillissement des bornes n''explique donc pas les pertes.

    *Repose sur :* l''export technique croisé avec les notes de site.

    *Serait renversé par :* une corrélation horodatée entre les fenêtres d''indisponibilité et les pertes
    de réservation, ou l''information que Fontaine subit les mêmes pertes sans les remonter.

    *Conséquence :* traiter ces deux sujets dans un même contrat donne à l''éditeur un levier que le contrat
    ne lui donne pas.


    **C2 — La dégradation du module de réservation est datée, et elle est postérieure à une mise à jour
    de l''éditeur.**

    71 des 96 réclamations tombent entre mars et juin, soit environ 17,8 par mois contre 3,1 le reste
    de l''année — un facteur 5,7. Douze agents situent spontanément le début après la mise à jour de mars.
    Rive-Sud ressaisit depuis mars. Trois sources indépendantes — usagers, agents, site — convergent sur
    la même date.

    *Serait renversé par :* une autre cause datée de mars (changement réseau, migration serveur interne,
    modification du règlement de réservation).

    *Conséquence :* s''il s''agit d''une régression de l''éditeur, la correction est due au titre du contrat
    en cours. Ce n''est pas un motif d''achat.


    **C3 — Le reflux des réclamations après juin n''est pas une preuve de résolution.**

    Rive-Sud absorbe le défaut à la main depuis mars, environ 5 h par semaine. Un défaut absorbé par du
    travail humain cesse d''être visible côté usager sans cesser d''exister. Ordre de grandeur : environ
    225 h par an sur un seul site, soit 5 600 à 6 800 € en coût chargé (hypothèse 25–30 €/h, à valider
    par les RH) — comparable à la remise proposée.

    *Serait renversé par :* un correctif daté livré entre juin et aujourd''hui, ou l''arrêt de la ressaisie
    sans remontée de réclamations.


    **C4 — L''enquête interne établit une gêne réelle, pas son ampleur ni son périmètre.**

    61 % de 43 répondants représente 26 agents ; 19 agents sur 62 n''ont pas répondu ; il n''y a aucune
    ventilation par site, et « au moins une fois par semaine » n''est pas un volume.

    *Ce qui la complèterait :* la ventilation par site et par mois des 96 réclamations, et un relevé daté
    de deux semaines. C''est la donnée manquante la moins chère et la plus décisive du dossier.


    **C5 — La migration v4 est un achat sans objet établi.**

    31 000 € en une fois. Aucune pièce du dossier n''affirme que v4 corrige le défaut de mars. La compatibilité
    avec les bornes de 2015 est « à l''étude », c''est-à-dire inconnue — et l''inconnue porte précisément
    sur les deux sites les plus dégradés. En cas d''incompatibilité, le remplacement des bornes de Fontaine
    et Rive-Sud s''ajoute, et il n''est chiffré nulle part.

    *Serait renversé par :* un engagement écrit de l''éditeur sur la correction de la régression **et**
    sur la compatibilité des bornes 2015.


    **C6 — La solution libre n''est pas exécutable avant le 31 octobre. L''exemple voisin condamne le
    calendrier, pas la solution.**

    Quatorze mois après bascule, 2 sites sur 5 tiennent encore un registre papier — c''est-à-dire que
    la migration n''est pas terminée. Nous avons 7 sites et une équipe informatique qui passe de deux
    à une personne en octobre. Les 30 % sont un coût annoncé, pas un coût constaté, et n''intègrent pas
    le double fonctionnement.

    *Serait renversé par :* un coût réalisé sur 14 mois vérifié auprès du voisin, et une capacité projet
    identifiée chez nous (prestataire ou mutualisation).

    *Position :* écarter maintenant, réexaminer dans douze mois sur données réelles.


    **C7 — La contrainte qui commande le calendrier est l''équipe informatique, pas le contrat.**

    Le départ d''octobre coïncide avec l''échéance. Aucune des trois options ne peut consommer de capacité
    projet en novembre-décembre. Ce départ emporte en outre une perte de connaissance non documentée sur
    le système actuel — une irréversibilité qui ne figure dans aucune des trois options soumises.

    *Serait renversé par :* un remplacement confirmé avec date de prise de poste, ou un marché d''assistance
    déjà notifié.


    **C8 — La remise de 12 % est une échéance de négociation, pas une structure de prix.**

    Elle expire deux jours après la séance alors que le contrat court jusqu''au 31 octobre. Son assiette
    n''est pas précisée : 12 % sur la seule première année représente environ 6 200 € ; sur les trois
    années indexées à +7 % (51 360 + 54 955 + 58 802 = 165 117 €), environ 19 800 €. Personne au dossier
    ne tranche. Soit entre 3,7 % et 12 % du total, échangés contre un engagement de trois ans sur un système
    dont le défaut n''est pas diagnostiqué.

    *Serait renversé par :* une confirmation écrite que la remise ne survit pas à une signature fin novembre
    — auquel cas c''est une vraie contrainte, à arbitrer comme telle.


    ---


    ## B. Ce que le dossier ne dit pas, et qui coûte plus cher que ce qu''il dit


    1. **Les clauses du contrat en cours** : reconduction tacite ? préavis de dénonciation, et à quelle
    date ? engagements de disponibilité couvrant les 41 h, et pénalités associées ? Si un préavis existe
    et approche, c''est l''irréversibilité la plus proche de nous, et elle est absente du dossier.

    2. La ventilation par site et par mois des 96 réclamations.

    3. Le contenu de la mise à jour de mars et l''existence d''une régression connue chez l''éditeur.

    4. La compatibilité v4 / bornes 2015, par écrit et datée.

    5. Le coût de remplacement des bornes de 2015 — onze ans d''âge, hors de tout chiffrage.

    6. L''assiette exacte de la remise.


    Les points 2, 3, 4 et 6 s''obtiennent en moins de deux semaines et pour un coût nul. Le point 1 se
    vérifie en une demi-journée.


    ---


    ## C. Recommandation


    **Ne pas signer d''engagement de trois ans avant le 30.** Demander à l''éditeur une prolongation de
    douze mois du contrat en cours aux conditions actuelles — six mois à défaut — et ouvrir la question
    de la régression de mars comme un dossier d''exécution du contrat existant.


    **Séparer, dès ce comité, la question des bornes de 2015 de celle du logiciel**, et l''inscrire comme
    ligne d''investissement 2027 propre.


    Le critère qui l''emporte n''est pas le coût, c''est la réversibilité : nous sommes invités à nous
    engager pour trois ans, dans les deux jours, sur un système dont ni la cause de la panne ni la compatibilité
    de la version suivante ne sont établies, au moment précis où notre capacité technique est divisée
    par deux. Neuf semaines suffisent à lever ces inconnues.


    **Si aucune prolongation courte n''est obtenable**, le classement des trois options soumises est :
    reconduction à l''identique (durée la plus courte possible, remise obtenue) devant migration v4, devant
    bascule vers le libre.


    | | Continuité au 31/10 | Coût sur 3 ans | Réversibilité | Charge équipe (C7) | Traite le défaut de
    mars |

    |---|---|---|---|---|---|

    | **À l''identique** | assurée | ≈ 165 000 € indexés, 145 000 € remisés | faible sur 3 ans | nulle
    | non (C2) |

    | **v4** | assurée | ≈ 196 000 € + bornes éventuelles non chiffrées | faible, et 31 000 € non récupérables
    | forte, en pleine réduction d''effectif | non établi (C5) |

    | **Libre** | **non assurée** | inconnue ; les 30 % sont annoncés, pas constatés | bascule très coûteuse
    à défaire | hors de portée (C6, C7) | inconnu |

    | **Prolongation 12 mois** | assurée | ≈ 51 000 € pour l''année | totale | faible | ouvre le levier
    contractuel (C2) |


    ---


    ## D. Le meilleur argument contre cette recommandation


    *« Refuser de signer avant le 30 coûte une remise certaine, contre une information qui pourrait ne
    jamais venir. L''éditeur peut très bien ne rien répondre sur mars, refuser toute prolongation, et
    nous laisser signer fin octobre au tarif plein, indexation comprise, remise perdue et relation dégradée.
    »*


    Cet argument est sérieux et je ne le contourne pas. Il ne fait pas basculer l''avis, pour deux raisons.
    D''abord l''asymétrie : la perte est bornée et chiffrable — entre 6 200 et 19 800 € — tandis que l''exposition
    en face ne l''est pas (remplacement possible de bornes sur deux sites, trois ans avec un défaut coûtant
    225 h par an sur le seul site qui le déclare). Ensuite parce que l''argument est testable sans rien
    risquer : il suffit de demander par écrit si la remise tient pour une signature au 30 novembre. Si
    elle tient, la contrainte était factice. Si elle ne tient pas, nous apprenons quelque chose d''utile
    sur la relation, et le comité arbitre en connaissance de cause avant le 10 octobre.


    Un second argument mérite d''être entendu : **Fontaine n''a peut-être vraiment aucun problème**, auquel
    cas l''affaire est locale à Rive-Sud et la thèse de la régression réseau s''effondre. C''est exactement
    ce que le relevé de deux semaines tranchera, en quinze jours et sans dépense.


    ---


    ## E. Repli, avec déclencheurs observables


    - **L''éditeur refuse par écrit toute durée inférieure à trois ans, avant le 15 septembre** → signer
    trois ans, remise obtenue, mais uniquement avec deux clauses écrites : correction de la régression
    de mars sous 90 jours assortie d''une pénalité, et compatibilité des bornes 2015 garantie ou migration
    v4 différée sans frais. Clauses refusées → comité extraordinaire avant le 10 octobre.

    - **Le relevé de deux semaines montre le défaut sur 4 sites ou plus** → régression avérée : mise en
    demeure formelle, la correction devient une obligation contractuelle et non un achat.

    - **Le relevé montre moins de cinq pertes sur l''ensemble du réseau** → le dossier redevient un problème
    local à Rive-Sud, le levier disparaît : revenir à une reconduction simple avec la remise, et traiter
    Rive-Sud en diagnostic technique.

    - **Plancher absolu :** aucune interruption de service sur les sept sites au 31 octobre. Si au 10
    octobre aucune solution n''est sécurisée, nous signons la continuité quelles qu''en soient les conditions
    et nous rouvrons ensuite. Ce plancher prime sur toutes les économies discutées ici — le pire cas d''un
    contrat mal négocié est porté par le budget, celui d''une rupture de service est porté par les usagers
    et par les 62 agents.


    ---


    ## F. Ce que j''engage dans les quinze jours


    *J = lendemain de la séance.*


    | Échéance | Action | Pourquoi |

    |---|---|---|

    | **J+2** | Relecture du contrat : reconduction tacite, préavis et sa date, engagements de disponibilité,
    pénalités applicables aux 41 h | Un préavis manqué rendrait tout le reste sans objet |

    | **J+3** | Extraction des 96 réclamations ventilées par site et par mois | Discrimine régression
    réseau / problème local (C4) |

    | **J+3** | Ouverture d''un relevé structuré sur les 7 sites : chaque réservation perdue notée (date,
    heure, site, poste, opération) — deux semaines | Transforme 61 % d''un sondage en faits comptables
    |

    | **J+5** | Courrier à l''éditeur, réponse écrite sous 10 jours : contenu de la mise à jour de mars
    ; régression connue et son statut ; compatibilité v4/bornes 2015 avec date d''engagement ; conditions
    d''une prolongation de 12 mois ; la remise survit-elle à une signature au 30 novembre | Lève quatre
    inconnues sur six |

    | **J+7** | Appel au réseau voisin : coût réalisé sur 14 mois, durée et charge de la bascule, motif
    du registre papier sur deux sites | Vérifie les 30 % (C6) |

    | **J+8** | Chiffrage RH de la ressaisie de Rive-Sud, intégré au comparatif comme ligne de coût |
    Rend visible un coût aujourd''hui absorbé par un seul site |

    | **J+10** | Reprise documentée du poste informatique avant le départ d''octobre : comptes, intégrations,
    procédures du système de réservation | Irréversibilité identifiée en C7 |

    | **J+12** | Devis indicatif de remplacement des bornes 2015, pour une ligne d''investissement 2027
    distincte | Applique la séparation décidée en C1 |

    | **J+15** | Note d''étape au comité : réponse de l''éditeur, premier relevé, repli activé ou non
    | Ramène la décision devant vous avec des faits |


    **Première action, dès la levée de séance :** la relecture du contrat (J+2). Elle conditionne toutes
    les autres.


    Deux points relèvent d''une décision du comité et non de moi : le mandat de négocier une prolongation
    courte plutôt que de signer avant le 30, et la création de la ligne budgétaire « bornes » distincte
    du logiciel.


    ---


    ## G. Si le comité écarte un élément du dossier


    - **C2 écarté** (la datation de mars) : la recommandation tient — on ne s''engage pas trois ans sans
    savoir si v4 fonctionne avec les bornes de deux sites (C5). Seul le levier contractuel disparaît.

    - **C3 écarté** (le défaut masqué par la ressaisie) : la recommandation tient. On perd un argument
    de coût, pas la logique du délai.

    - **C6 écarté** (le libre infaisable) : rien ne change à court terme, le libre ne peut de toute façon
    pas être livré avant le 31 octobre. On maintiendrait seulement l''option plus fermement ouverte à
    douze mois.

    - **C8 écarté** (la remise jugée décisive) : la recommandation devient — signer trois ans avant le
    30, mais **uniquement** avec les deux clauses écrites du repli. Ne pas signer sans elles.

    - **C1 écarté** (la séparation matériel/logiciel) : c''est le seul retrait qui change la structure
    de l''avis. Bornes et logiciel redeviennent un lot unique, et v4 redevient l''option centrale — sous
    réserve d''une compatibilité qui reste, elle, inconnue.


    ---


    Si vous le souhaitez, je peux produire la version de séance en une page recto-verso (constats + tableau
    + engagements), ou une page partageable avec le comité.

