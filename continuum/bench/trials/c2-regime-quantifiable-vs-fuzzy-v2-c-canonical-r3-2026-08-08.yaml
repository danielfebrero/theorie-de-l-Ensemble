response:
  text: '# NOTE AU CONSEIL — Affectation de l''enveloppe de 900 000 €

    **Séance de jeudi — décision demandée sur les dossiers A (usinage) et B (direction qualité)**


    ---


    ## 1. Le tableau demandé


    Un seul tableau, un seul ordre. En revanche la colonne de droite change de nature selon les lignes,
    et c''est délibéré : voir §2.


    | Rang | Ligne à engager | € engagés | Ce que l''euro achète | Base de la décision |

    |---|---|---|---|---|

    | 1 | **Qualité** — promotion de l''adjointe (45 k€) + mission de transition du directeur sortant
    (90 k€) | **135 000** | Le maintien du lien avec l''organisme notifié et avec 31 % du chiffre d''affaires
    | Asymétrie et irréversibilité — pas un rendement |

    | 2 | **Usinage** — tranches 1 à 3, sur les machines concentrant les arrêts | **310 000** | ≈ 56 k€/an
    de coût direct évité, + rebut (§3) | Rendement mesuré sur 5 ans audités |

    | 3 | **Réserve qualité engagée** — première année du recrutement externe, déclenchée sur critère
    (§4) | **145 000** | Le droit de corriger dans 6 mois sans nouveau tour de table | Option sur une
    décision irréversible |

    | 4 | **Usinage** — tranches 4 à 6 | **310 000** | Coût évité résiduel, plus faible | Enveloppe non
    reconductible (§5) |

    | | **Total** | **900 000** | | |


    ---


    ## 2. Pourquoi le rendement en euros ne peut pas classer les deux dossiers


    Le dossier A repose sur cinq ans de maintenance horodatée et auditée : 47 pannes, 1 810 heures, 213
    000 €. Ces chiffres sont des mesures.


    Le dossier B repose, pour ses euros, sur une cotation d''atelier : trois consultants n''ayant jamais
    travaillé dans le dispositif médical ont produit 35 % de probabilité, 4,2 M€ de perte, 7,5 de criticité.
    Ce ne sont pas des mesures, ce sont des opinions converties en décimales. Passées dans le tableau,
    elles donneraient 1,47 M€ de perte attendue contre 135 k€ de coût, soit un ratio de 11 pour 1 — le
    dossier B arriverait premier de très loin.


    **Il arrive premier quand même, et pour une autre raison.** C''est précisément pourquoi nous écartons
    la cotation : elle donnerait la bonne réponse sur un fondement faux, et installerait le précédent
    qu''un chiffre inventé vaut un chiffre audité. Nous n''en avons pas besoin.


    ---


    ## 3. Dossier A — ce que disent réellement les cinq ans


    - Coût direct d''immobilisation : **213 000 €** sur 5 ans.

    - Marge perdue : 1 810 h × 38 € = **68 780 €**.

    - Total attribuable : **≈ 282 000 € sur 5 ans, soit 56 000 € par an.**


    Rapporté aux 620 000 € du parc complet, cela donne **onze ans de retour** sur un matériel garanti
    sept. **Le dossier ne se justifie pas par ces chiffres seuls.**


    Il se justifie par la ligne manquante : le rebut passe de 4,1 % à 1,2 %, soit 2,9 points. **Chaque
    million d''euros de pièces usinées par an vaut 29 000 € de rebut évité.** À partir d''environ 3 M€
    usinés, le retour tombe sous cinq ans et le dossier devient franchement bon.


    **Cette donnée est dans la maison.** Nous demandons qu''elle soit produite avant le vote, pas après
    — c''est l''affaire de dix minutes et c''est la seule inconnue du dossier A.


    S''ajoute un élément non chiffré mais réel : l''engagement fournisseur de 96 % de disponibilité sur
    7 ans avec pénalités transfère une part du risque hors de l''entreprise. C''est un argument, pas un
    rendement.


    ---


    ## 4. Dossier B — décidé par l''asymétrie, pas par l''espérance


    Nous ne savons pas quelle est la probabilité de perdre un client hospitalier. Personne ne le sait
    : l''entreprise n''a jamais changé de directeur qualité, il n''existe aucun précédent interne ni comparable
    sectoriel. **Toute personne qui vous donnera un pourcentage jeudi l''aura fabriqué.**


    Nous n''en avons pas besoin, parce que les deux côtés ne sont pas comparables :


    - **Coût de la couverture : 135 000 €**, soit 15 % de l''enveloppe.

    - **Ce qui est exposé : 31 % du chiffre d''affaires, la certification de nos dispositifs, et 140 emplois.**
    Une perte de certification ou d''un client hospitalier ne se rattrape pas en douze mois. C''est une
    branche sans retour.


    Quand le pire cas est irrécupérable et que la couverture coûte 15 % de l''enveloppe, on couvre. On
    ne calcule pas.


    **Nous écartons le recrutement externe à 280 000 € comme solution principale** : onze mois ne suffisent
    pas à faire reconnaître un inconnu par l''organisme notifié, et cette option n''achète pas le transfert
    de relation, qui est le cœur du problème. Elle reste notre plan B, financée par la ligne 3.


    **Nous retenons les deux autres pistes ensemble, pas au choix** : la promotion de l''adjointe assure
    la continuité interne, la mission de transition de l''intéressé assure le passage de témoin externe.
    Séparées, aucune des deux ne couvre le risque.


    ---


    ## 5. Ce que nous assumons devant vous


    **Les tranches 4 à 6 (ligne 4) ne se justifient pas par leur propre rendement.** Elles se justifient
    parce que l''enveloppe est perdue si elle n''est pas engagée : la comparaison n''est pas « cette machine
    contre un autre usage de l''argent », mais « cette machine contre rien ». Tout coût évité strictement
    positif l''emporte alors sur zéro. Nous le disons plutôt que de l''habiller.


    **Une contrepartie à négocier avant signature :** obtenir du fournisseur que les tranches 4 à 6 soient
    réservées aux mêmes conditions unitaires, avec livraison échelonnée sur douze mois, la trésorerie
    étant engagée cet exercice. Nous gardons alors la liberté d''arbitrer les trois dernières machines
    à froid, sur les données de panne machine par machine.


    ---


    ## 6. Déclencheurs et point de bascule


    **Sur B — point d''étape à 6 mois** (soit 5 mois avant le départ). Trois conditions, toutes observables
    :

    1. L''adjointe a été présentée à l''organisme notifié et acceptée comme interlocutrice, avec trace
    écrite ;

    2. Elle a conduit seule au moins deux audits internes ;

    3. Un rendez-vous conjoint a eu lieu avec chacun des deux clients hospitaliers.


    **Une seule condition non remplie déclenche le recrutement externe sur la réserve de 145 000 €**,
    sans revenir devant le conseil — c''est exactement à quoi sert cette ligne, l''enveloppe n''étant
    pas reconductible.


    **L''observation qui renverserait la décision B :** une réserve écrite de l''organisme notifié sur
    l''adjointe. Dans ce cas la promotion ne suffit plus, le recrutement externe est lancé immédiatement
    et la mission de transition est prolongée.


    **L''observation qui renverserait la décision A :** une valeur annuelle usinée nettement inférieure
    à 3 M€ *et* une concentration des 1 810 heures d''arrêt sur trois machines. Dans ce cas seul, les
    tranches 4 à 6 sont reportées et la trésorerie correspondante réaffectée en séance.


    ---


    ## 7. Première action


    **Jeudi, avant le vote :** faire produire la valeur annuelle des pièces usinées et la répartition
    des 1 810 heures d''arrêt machine par machine. Ces deux chiffres existent, ils fixent l''ordre des
    tranches et la ligne 4.


    **Jeudi, au vote :** engager les lignes 1 et 3 (280 000 €, dossier qualité) sans condition. Elles
    ne dépendent d''aucune donnée manquante, et le compte à rebours des onze mois a déjà commencé.

    '
