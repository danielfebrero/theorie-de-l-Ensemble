  text: '# NOTE AU CONSEIL — Séance du jeudi

    **Objet : affectation de l''enveloppe exceptionnelle de 900 000 € (dossiers A et B)**


    ---


    ## Ce qui est proposé au vote


    | Affectation | Montant | Nature |

    |---|---|---|

    | **B — Succession direction qualité** : promotion de l''adjointe + mission de transition 12 mois
    | **135 000 €** | Engagement immédiat |

    | **A — Renouvellement des 6 machines**, lot complet | **620 000 €** | Engagement immédiat, livraisons
    échelonnées |

    | **Filet de sécurité succession** (voir § 3) | **145 000 €** | Engagement immédiat, décaissement
    conditionnel |

    | **Total** | **900 000 €** | Enveloppe intégralement engagée |


    L''enveloppe est perdue si elle n''est pas engagée sur l''exercice. Nous proposons donc de l''engager
    en totalité. **Engager n''est pas décaisser** : les livraisons machines et l''activation du filet
    de sécurité s''étalent sur 18 mois.


    ---


    ## 1. Dossier B en premier, parce que c''est le seul risque qui peut arrêter l''entreprise


    Le dossier A porte sur de la performance industrielle. Le dossier B porte sur notre droit de vendre
    : le directeur qualité est le seul interlocuteur reconnu par l''organisme notifié qui certifie nos
    dispositifs, et deux clients hospitaliers pesant 31 % du chiffre d''affaires se disent liés à lui
    personnellement. Une perte de continuité sur la certification ne coûte pas de la marge, elle coûte
    l''accès au marché.


    **Nous recommandons la promotion de l''adjointe (45 000 €) couplée à la mission de transition (90
    000 €), et non le recrutement externe (280 000 €).** La raison n''est pas le prix. La ressource rare
    ici n''est pas l''argent, ce sont les **11 mois de recouvrement** pendant lesquels le titulaire est
    encore là. Ces 11 mois servent à transférer une relation — auprès de l''organisme notifié et des deux
    clients — pas un poste. Un candidat externe arriverait avec zéro capital relationnel et consommerait
    ces 11 mois à comprendre la maison. L''adjointe est dans l''entreprise depuis 3 ans : le transfert
    part d''un socle. Les deux dépenses sont complémentaires, pas alternatives : la promotion désigne
    le successeur, la mission de transition l''accompagne 12 mois après le départ.


    **Conditions à respecter sur la mission de transition** : durée ferme non reconductible, livrables
    définis, et **aucune autorité opérationnelle** — rôle de conseil uniquement. À défaut, on n''organise
    pas une succession, on prolonge une dépendance.


    ---


    ## 2. Dossier A : oui au lot complet, mais deux clauses à renégocier avant signature


    Les chiffres audités donnent, sur 5 ans : 213 000 € de coût direct d''immobilisation, plus 1 810 heures
    d''arrêt à 38 € de marge, soit 68 800 € de marge perdue. **Total ≈ 282 000 € sur 5 ans, soit 56 000
    € par an.** Rapporté à 620 000 €, le retour sur investissement est d''environ **11 ans**. Le conseil
    doit le savoir : sur les seuls arrêts, l''investissement ne se justifie pas.


    Il se justifie sur trois autres bases : un parc de 14 ans qui en aura 20 se dégrade de façon non linéaire,
    le gain de rebut (4,1 % → 1,2 %) n''est pas compté dans les 56 000 €, et un taux de rebut à 4,1 %
    fragilise la validation de nos procédés dans un environnement réglementé. S''y ajoute le fait décisif
    : **l''enveloppe n''a pas d''usage alternatif** — non engagée, elle vaut zéro.


    Deux points à corriger avec le fournisseur avant signature :


    - **L''engagement de 96 % de disponibilité est probablement inférieur à notre performance actuelle.**
    1 810 heures sur 5 ans et 6 machines font 60 heures d''arrêt par machine et par an, soit 96 à 98 %
    de disponibilité selon nos heures d''ouverture. Exiger que le taux garanti soit défini sur la même
    base de mesure que notre historique, et fixé **au-dessus** du réalisé actuel.

    - **Les pénalités doivent être indexées sur 38 € par heure perdue**, pas forfaitaires. Une pénalité
    inférieure à la marge perdue n''est pas une garantie, c''est un affichage.


    **Livraisons par tranches de 2 machines sur 18 mois**, à conditions unitaires inchangées : cela protège
    la production pendant les installations. L''ordre des tranches sera fixé par la répartition des 47
    pannes machine par machine — donnée à produire avant signature. Elle ne change pas le montant, elle
    change ce qu''on remplace en premier.


    ---


    ## 3. Les 145 000 € restants : rendre le pari sur l''adjointe réversible


    Promouvoir en interne est le bon choix, mais c''est un pari sans précédent : nous n''avons jamais
    changé de directeur qualité. Le solde de l''enveloppe sert à payer l''assurance de ce pari — c''est
    le seul emploi qui protège 31 % du chiffre d''affaires. **Répartition indicative, à arrêter par la
    DRH :** mandat de recherche prépayé et activable (≈ 60 000 €) ; codification écrite du système qualité
    et requalification des 9 auditeurs internes (≈ 50 000 €) ; co-visites de l''organisme notifié et des
    deux clients hospitaliers, avec appui d''un expert réglementaire (≈ 35 000 €).


    **Trois jalons de contrôle**, à 8, 5 et 2 mois du départ : reconnaissance formelle de l''adjointe
    par l''organisme notifié, co-visites des deux clients effectuées, 9 auditeurs requalifiés. **Si le
    jalon des 5 mois n''est pas tenu, le mandat de recherche est activé** — avec le titulaire encore présent,
    et non après.


    ---


    ## Ce que le conseil valide jeudi


    1. La promotion de l''adjointe, annoncée en interne **avant** que le départ ne soit public.

    2. L''engagement du lot machines à 620 000 €, signature **subordonnée** à la redéfinition du taux
    garanti et à l''indexation des pénalités à 38 €/h.

    3. L''engagement des 145 000 € de filet de sécurité et les trois jalons de contrôle.


    Un point d''étape en conseil est proposé à 5 mois du départ.

    '
