  text: 'L''écriture du fichier n''a pas été autorisée — voici la note directement.


    ---


    # NOTE AU COMITÉ DE DIRECTION


    **Objet :** Renouvellement du prestataire de paiement — arbitrage Solda / Payflux

    **De :** Direction des opérations · **Date :** 8 août 2026 · **Décision demandée :** vendredi 14 août


    ## Recommandation : option B, avec trois conditions d''exécution fermes


    1. **Notifier Solda par écrit avant le 15 octobre** pour activer la prolongation au mois le mois (130
    k€/mois).

    2. **Geler la répartition du 6 novembre au 5 janvier.** Aucun changement de palier, aucune livraison
    sur le chemin de paiement pendant le pic.

    3. **100 % Payflux au 31 janvier 2027**, date ferme portée au contrat.


    Ce n''est pas un report : la date de fin est fixée, les paliers sont datés, les seuils de retour arrière
    sont chiffrés et délégués à l''astreinte.


    ## 1. Ce qui décide, ce n''est pas l''économie, c''est la position du point de non-retour


    Le vendredi noir 2026 tombe le **27 novembre**, soit le 24ᵉ jour après la bascule prévue en option
    A. Le marchand comparable a mis **trois semaines** à passer de 1,3 % à 0,5 % d''échec. L''option A
    nous fait aborder la plus grosse journée de l''année sur la queue de la fenêtre d''instabilité, à
    100 % du trafic.


    Et **par défaut, le compte Solda ferme le 30 novembre** — trois jours après le vendredi noir, à l''entrée
    du pic de décembre. Une fois les 2,1 millions de jetons transférés et le compte clos, la réouverture
    prend 6 semaines et impose de **recollecter les empreintes de carte auprès de toute la base**. C''est
    le seul scénario du dossier qui ne se rattrape pas dans l''exercice : six semaines de checkout dégradé
    sur 276 M€ de GMV annuel représentent une exposition de l''ordre de **5 M€**.


    L''astreinte peut rebasculer le trafic en moins de 15 minutes — **mais seulement tant que les deux
    comptes sont ouverts.** C''est ce levier que l''option A abandonne, exactement pendant les huit semaines
    qui font l''année.


    ## 2. Le chiffrage complet


    | | Option A | Option B (recommandée) |

    |---|---:|---:|

    | Économie annoncée an 1 | 500 k€ | 310 k€ |

    | Prolongation Solda (déc. + janv., 2 × 130 k€) | — | −260 k€ |

    | Double run additionnel (~2 mois × 45 k€) | — | −90 k€ |

    | Surcoût d''échecs des 3 premières semaines (0,9 pt) | −143 k€ | −29 k€ |

    | **Économie nette an 1** | **≈ 357 k€** | **≈ 121 k€** |


    **Écart : ≈ 236 k€.** C''est le prix du levier de retour arrière pendant le pic. Rapporté à une exposition
    de queue estimée à 5 M€, il est rentable dès que la probabilité d''un incident sérieux chez Payflux
    au premier pic dépasse **5 %**. Le pilote du marchand comparable — 1,3 % d''échec pendant trois semaines
    — est une mesure, pas une hypothèse : nous sommes très au-dessus de 5 %.


    *À vérifier lundi : l''économie annoncée de 310 k€ pour B suppose implicitement la prolongation Solda,
    puisqu''une rampe de 10 semaines dépasse le 30 novembre. Si les 260 k€ y sont déjà comptés, l''écart
    réel tombe à ≈ 30 k€.*


    ## 3. Le meilleur argument contre, et la réponse


    **Contre :** « Basculons en A et gardons Solda ouvert en filet — on garde le levier *et* 236 k€. »


    **Réponse :** un retour arrière depuis 100 % est une manœuvre d''urgence jamais répétée, exécutée
    sous stress un vendredi noir. Depuis 50 %, le même geste aura été exercé quatre fois, et chaque plateforme
    aura démontré sa capacité à absorber l''autre. De plus, A expose 100 % des clients à la phase d''instabilité
    : 143 k€ contre 29 k€, soit la moitié de l''écart évaporée dès les trois premières semaines.


    ## 4. Seuils d''arrêt — délégués à l''astreinte, sans validation hiérarchique


    - Échec Payflux **> 1,5 % sur 2 h glissantes** → retour à 0 % Payflux immédiat.

    - Échec **> 0,8 % sur 24 h**, ou latence **> 2× la référence Solda sur 1 h** → palier gelé.

    - **Palier 10 % non atteint au 1er octobre** → aucune bascule avant le 15 janvier, prolongation Solda
    jusqu''au 28 février.


    ## 5. Ce qu''on fait lundi


    | # | Action | Porteur | Échéance |

    |---|---|---|---|

    | 1 | Notification écrite à Solda : prolongation mensuelle à partir du 1er décembre | Direction achats
    | **lundi 17 août** |

    | 2 | Confirmer avec Payflux le délai réel jusqu''au premier trafic (transfert des 2,1 M de jetons
    + certification) | DSI paiement | 21 août |

    | 3 | Reconstituer le chiffrage de B avec le contrôle de gestion (la prolongation est-elle déjà comptée
    ?) | Contrôle de gestion | 21 août |

    | 4 | Exiger de Payflux un **SLA de taux d''autorisation**, pas seulement de disponibilité, avec pénalités
    | Direction achats | avant signature |

    | 5 | Câbler les trois seuils dans le tableau de bord et les tester en conditions réelles | Astreinte
    technique | 4 septembre |


    **Point d''attention pour la négociation :** l''écart résiduel de 0,1 pt entre Payflux stabilisé (0,5
    %) et Solda (0,4 %) coûte **276 k€ de GMV par an** — plus que l''écart entre A et B. Et 99,9 % de
    disponibilité contractuelle autorise 44 minutes d''indisponibilité par mois : 35 k€ en heure creuse,
    70 k€ un vendredi noir, sans manquement de leur part. Ces deux points valent plus, sur la durée du
    contrat, que l''arbitrage A/B lui-même.


    *Décision demandée vendredi : validation de l''option B et mandat pour la notification Solda du 17
    août.*


    ---


    Trois réserves à porter à la présidente, qui ne changent pas la recommandation mais qu''elle doit
    connaître :


    - **Le délai jusqu''au premier trafic est la seule inconnue sérieuse.** Le dossier ne dit pas combien
    de temps prend le transfert des 2,1 M de jetons et la certification. J''ai supposé un démarrage à
    10 % mi-septembre ; si Payflux annonce plus, l''action n°4 du plan (seuil du 1er octobre) déclenche
    automatiquement le report en janvier — la décision reste tranchée, seule la date bouge.

    - **L''exposition de 5 M€ est mon estimation**, pas une donnée du dossier : six semaines de GMV (31,8
    M€) × une hypothèse de 15 % de perte de conversion sur une base contrainte de ressaisir sa carte.
    Le seuil de rentabilité à 5 % est robuste même en divisant cette estimation par trois.

    - **Si le comité tient absolument aux 236 k€**, l''option la moins mauvaise n''est pas A telle que
    présentée, mais A avancée à septembre avec Solda maintenu ouvert jusqu''en janvier. Je ne la recommande
    pas — elle garde le défaut du retour arrière jamais répété — mais elle est défendable, contrairement
    à A au 3 novembre avec fermeture au 30.

    '
