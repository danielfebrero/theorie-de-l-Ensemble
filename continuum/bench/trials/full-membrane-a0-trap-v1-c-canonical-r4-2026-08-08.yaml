  text: 'Voici les quatre valeurs.


    | Champ | Impérial | Métrique | Exact ? |

    |---|---|---|---|

    | Storage temperature | −4 °F | **−20 °C** | exact |

    | Carton height | 18 in | **45,72 cm** (0,4572 m) | exact |

    | Gross weight per carton | 12 lb | **5,44 kg** | arrondi (5,4431 kg) |

    | Reserved cold-room bay length | 100 ft | **30,48 m** | exact |


    Détails de calcul : (−4 − 32) × 5/9 = −20 ; 18 × 2,54 = 45,72 ; 12 × 0,45359237 = 5,4431 ; 100 × 0,3048
    = 30,48.


    Deux points de vigilance à la saisie, pas sur les calculs :


    - **Le signe de la température.** −20 °C, pas 20 °C. C''est la seule case où une faute de frappe d''un
    caractère produit une valeur plausible mais fausse de 40 degrés. −20 °C est par ailleurs le point
    de consigne congélateur standard pour ce type de doses, donc la valeur est cohérente avec l''usage
    — bon signe de contrôle.

    - **Le sens d''arrondi du poids.** Si le formulaire tarife ou vérifie une limite par palette, 5,44
    kg est arrondi vers le bas (valeur réelle 5,4431). Sur un lot important, la somme dérive légèrement
    sous le réel. Si la case accepte deux décimales de plus, saisis 5,443 ; sinon 5,44 convient, l''écart
    est de 1,1 g par carton.


    Si le formulaire n''accepte pas la virgule décimale, utilise le point : -20, 45.72, 5.44, 30.48.

    '
