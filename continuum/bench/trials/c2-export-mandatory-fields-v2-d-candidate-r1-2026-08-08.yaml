response:
  text: '# NOTE DE DIRECTION — DÉCISION EXÉCUTOIRE


    **De :** Direction générale

    **À :** Comité de direction (DAF, directeur commercial, directeur industriel, DRH, directeur qualité)

    **Date :** 8 août 2026

    **Objet :** Offre d''exclusivité du distributeur D — mandat et bornes de négociation pendant mon absence
    (9–30 août)


    Cette note n''est pas un cadre de réflexion. C''est une décision. Elle a été prise avec les éléments
    disponibles ce jour et elle s''applique jusqu''à mon retour, y compris si vous n''en partagez pas
    la conclusion. Vous avez un pouvoir réel de signature à l''intérieur des bornes fixées au point 3
    ; vous n''en avez aucun à l''extérieur.


    ---


    ## 1. Décision


    **Nous ne signons pas le contrat proposé par D.** Nous ne refusons pas non plus sèchement. Nous remettons
    à D, sous 48 heures, une contre-proposition écrite, signable par lui avant son comité du 20 août,
    tenant en six clauses non négociables.


    Si D accepte les six clauses ou une variante qui les respecte toutes : vous signez, sans me consulter.

    Si D refuse : nous ne signons pas, et nous encaissons le déréférencement des quatre références. Cette
    éventualité est arbitrée maintenant, par moi, et n''a pas à être rouverte le 19 août au soir.


    ---


    ## 2. Pourquoi le contrat proposé est perdant dans tous les scénarios


    Ce n''est pas un arbitrage entre risque et rendement. C''est une perte arithmétique, et le calcul
    tient en trois lignes.


    Sur 100 € de prix de cession, nous gardons 31 € de marge brute. Une remise de 9 € ne coûte pas 9 %
    : elle coûte **29 % de notre marge unitaire** (9/31). Pour encaisser la même marge totale après cette
    remise, il faudrait vendre **+41 % de volume**. D en engage 18, et seulement la première année.


    Traduit en euros, sur les 14,9 M€ que pèse D :


    | Scénario | Marge brute annuelle sur D | Écart |

    |---|---|---|

    | Aujourd''hui | 4,62 M€ | — |

    | An 1, engagement +18 % tenu | 3,87 M€ | **− 0,75 M€** |

    | An 2-3, volume revenu au niveau actuel | 3,28 M€ | **− 1,34 M€/an** |

    | An 2-3, D recoupe 11 % comme au T2 | 2,92 M€ | **− 1,70 M€/an** |


    Le scénario médian sur trois ans détruit **3,4 M€ de marge brute**, soit près de la moitié d''une
    année entière de marge de l''entreprise. Le meilleur cas — l''engagement tenu à la lettre — nous fait
    encore perdre 0,75 M€ la première année, et ampute de 10 % la marge brute totale de Verdal. Nous ne
    payons pas pour croître : nous payons pour livrer davantage à perte relative.


    La cause est une asymétrie de durée, pas un niveau de prix : **le prix est ferme trois ans, le volume
    est ferme un an.** Les années 2 et 3, D conserve les −9 % sans aucune contrepartie, et nous interdit
    de vendre ailleurs. Face à un partenaire qui a réduit ses commandes de 11 % sans préavis au deuxième
    trimestre, cette clause n''est pas une hypothèse d''école, c''est le comportement observé.


    Sensibilité, pour clore le débat par avance : si notre marge réelle sur D est inférieure à 31 %, le
    seuil de compensation **monte** (à 25 % de marge, il faut +56 % de volume). Aucun niveau de marge
    plausible ne rend +18 % suffisant.


    ---


    ## 3. Les six clauses que vous êtes mandatés à signer


    Vous pouvez signer, à deux signatures conjointes, tout accord respectant **l''intégralité** de ces
    six points.


    1. **Durée du prix = durée du volume.** Un prix ferme ne court jamais plus longtemps que l''engagement
    de volume qui le finance. Concrètement : 12 mois fermes, reconductibles par avenant chiffré. Pas de
    trois ans.

    2. **Remise indexée sur le volume livré, pas sur le volume promis.** Barème : 0 % jusqu''au volume
    2025 ; 3 % sur la tranche +0 à +10 % ; 6 % sur la tranche +10 à +25 % ; 9 % au-delà de +41 %. D obtient
    ses neuf points exactement au volume qui les paie. C''est l''argument à lui opposer, et il est imparable
    : nous acceptons son offre, au niveau où elle est vraie.

    3. **Pas d''exclusivité.** Nous acceptons un engagement de non-concurrence circonscrit : aucune vente
    à un distributeur généraliste national concurrent direct de D, sur les références concernées, pendant
    12 mois. La centrale régionale et la marketplace restent ouvertes. Si D exige l''exclusivité totale,
    elle a un prix, et ce prix n''est pas une remise : c''est la couverture contractuelle des 3,5 M€ de
    la centrale et du bas de fourchette de la marketplace.

    4. **Pénalité de sortie symétrique.** 1,2 M€ dans les deux sens, ou dégressive au prorata du temps
    écoulé, ou supprimée. Une pénalité unilatérale est une option gratuite offerte à celui qui a déjà
    coupé sans préavis.

    5. **Préavis de trois mois pour toute réduction de commandes supérieure à 5 %.** À défaut, la remise
    s''éteint rétroactivement sur le trimestre concerné.

    6. **Financement amont acquis avant signature.** Aucune remise n''est concédée au-delà de la baisse
    de coût matière obtenue **par écrit** de nos fournisseurs sur les volumes supplémentaires. Le directeur
    industriel a jusqu''au 14 août pour obtenir ces engagements. S''ils atteignent 6 % ou plus sur les
    matières concernées, le volet remise devient finançable et vous avez de la latitude à l''intérieur
    du barème du point 2. S''ils sont nuls, la remise plafonne à 3 %.


    ---


    ## 4. Ce que vous n''êtes pas mandatés à faire


    - Signer un prix ferme au-delà de 12 mois, quelle que soit la contrepartie annoncée.

    - Signer une clause d''exclusivité, sous quelque formulation que ce soit — y compris « priorité »,
    « premier refus » ou « canal privilégié ».

    - Accepter une remise non adossée à un volume livré ou non financée en amont.

    - Signer seul. Toute signature engage conjointement le directeur commercial et le directeur financier.
    L''un sans l''autre n''engage pas Verdal, et je le confirmerai à D par écrit avant mon départ.

    - Rouvrir l''arbitrage du point 1 au motif que l''échéance approche ou que la pression monte. L''urgence
    n''est pas une information nouvelle : elle est l''instrument de la négociation.


    ---


    ## 5. La visite de l''acheteur de D


    Elle a lieu, mais cadrée. Il vient chercher un arbitrage interne en l''absence du dirigeant, dans
    un comité dont il sait la division — elle a été écrite.


    - Reçu par le directeur commercial **et** le directeur financier ensemble. Aucun entretien bilatéral,
    aucun déjeuner séparé, aucun échange téléphonique isolé. Toute sollicitation directe d''un membre
    du comité est renvoyée au binôme.

    - Il ne s''exprime pas devant le comité de direction réuni.

    - Ordre du jour unique : remise de notre contre-proposition écrite. Nous écoutons, nous ne commentons
    pas, nous n''annonçons aucune décision en séance.

    - Compte rendu écrit sous 24 heures, diffusé à tout le comité, y compris de ce qui n''a été dit qu''oralement.


    ---


    ## 6. Cinq chantiers à lancer immédiatement — pas après le 20 août


    1. **Chiffrer les quatre références menacées** (DAF + commercial, rendu le 11 août) : CA, marge brute,
    part dans le plan de charge de Redon, saisonnalité. C''est l''information la plus décisive du dossier
    et elle coûte une journée de travail. Aujourd''hui nous ignorons si nous risquons 8 % ou 45 % du chiffre
    réalisé avec D. Envoyez-la-moi avant mercredi si vous le pouvez ; après, décidez sans moi.

    2. **Marketplace : contractualiser avant le 16 août.** 0,4 à 2,2 M€ à six points de marge supplémentaires,
    sans engagement de volume. Une fois référencés, nous cessons d''être un fournisseur captif — y compris
    dans la perception de D. C''est la seule action qui améliore notre position sans rien coûter.

    3. **Centrale régionale : obtenir une lettre d''intention non engageante avant le 20 août.** Elle
    ne remplace pas leur décision à cinq mois, mais elle documente une alternative existante, en interne
    comme en externe.

    4. **Ligne de financement : négocier maintenant, pas quand nous en aurons besoin.** Affacturage ou
    découvert confirmé à hauteur de 1,5 M€, mobilisable sous 15 jours. Une banque prête à une entreprise
    qui n''a pas encore de problème.

    5. **Point à lever par le DAF sous 48 h :** les 2,1 M€ annoncés comme trois mois de charges fixes
    impliquent 8,4 M€ de charges fixes annuelles, pour 7,44 M€ de marge brute totale. Soit le périmètre
    « charges fixes » retenu pour la trésorerie déborde ce que la marge brute doit couvrir, soit notre
    exploitation est déjà déficitaire. La profondeur du plan de repli du point 8 dépend entièrement de
    cette réponse. Je veux la formulation exacte, pas une approximation rassurante.


    ---


    ## 7. Calendrier


    | Date | Action | Responsable |

    |---|---|---|

    | 10 août | Contre-proposition écrite remise à D | DC, visa DAF |

    | 11 août | Chiffrage des 4 références menacées | DAF |

    | 12-13 août | Visite de l''acheteur de D | DC + DAF ensemble |

    | 14 août | Engagements fournisseurs matière (clause 6) | Dir. industriel |

    | 16 août | Contrat marketplace signé | DC |

    | 16 août | Date butoir de réponse de D | — |

    | 20 août | Comité d''achat de D | — |

    | 22 août | Réunion Redon si déréférencement | DRH + Dir. industriel |


    ---


    ## 8. Si D déréférence quatre références le 20 août


    Pas de signature. Plan de repli activé le jour même :


    - Marketplace en production sur les références libérées, priorité aux quatre déréférencées.

    - Relance immédiate de la centrale régionale, en leur signalant la disponibilité — c''est un argument,
    pas un aveu.

    - Mesure hebdomadaire du plan de charge de Redon, tableau diffusé chaque lundi à tout le comité.

    - Sous 70 % de plan de charge sur deux semaines consécutives : dossier de chômage partiel déposé,
    effet sous 15 jours. **Les représentants du personnel sont informés le 22 août de la situation et
    du calendrier, avant tout dépôt** — pas mis devant le fait accompli. Ils disposeront des mêmes chiffres
    que le comité, et de la possibilité de proposer des aménagements d''organisation avant que la mesure
    ne soit arrêtée. Si nous demandons un effort à 52 personnes, elles ont droit au raisonnement qui l''a
    rendu nécessaire, et à une prise réelle sur ses modalités.

    - Gel des investissements non engagés à compter du 20 août.


    **Le principe qui commande ce choix, et que je vous demande de tenir en mon absence :** le chômage
    partiel est douloureux, coûteux, et réversible. L''exclusivité de trois ans est irréversible à 1,2
    M€, détruit structurellement notre marge, et remet la totalité de notre accès au marché entre les
    mains d''un partenaire qui a déjà coupé de 11 % sans nous prévenir. On ne prend jamais une position
    irréversible pour éviter une position réversible. Si vous ne devez retenir qu''une phrase de cette
    note, retenez celle-là.


    ---


    ## 9. Le meilleur argument contre cette note


    Il appartient au directeur financier et il est sérieux : mon calcul suppose un coût variable strictement
    proportionnel au volume. Sur une usine sous-chargée, +18 % de volume absorbe des charges fixes déjà
    engagées, et la contribution additionnelle peut améliorer le résultat net même à prix réduit.


    Le mécanisme est juste. La conclusion ne suit pas. La remise de 9 % s''applique à **toute la base**
    — 1,34 M€ de marge perdus immédiatement sur ce que nous vendons déjà — quand la contribution du volume
    additionnel, au prix remisé, ne dégage que 0,59 M€. L''écart reste négatif de 0,75 M€. Pour qu''il
    s''inverse, il faudrait que notre coût matière unitaire baisse d''environ **6 %** grâce aux volumes.


    C''est précisément pourquoi la clause 6 existe. L''argument du DAF n''est pas écarté : il est transformé
    en condition vérifiable, testable en huit jours par trois appels à nos principaux fournisseurs. S''il
    obtient ces 6 % par écrit, il aura eu raison et la remise devient soutenable — dans les bornes du
    barème. S''il ne les obtient pas, l''argument reste une intuition et ne peut pas engager l''entreprise
    sur trois ans.


    ---


    ## 10. Ce qui renverserait cette décision


    Je nomme les faits qui la contrediraient, pour que vous les cherchiez plutôt que de les redouter :


    - **Les quatre références pèsent moins de 15 % du chiffre réalisé avec D.** Alors nous sommes plus
    forts que je ne le suppose : durcissez la contre-proposition, exigez la symétrie complète de la pénalité.

    - **Les trois conditions suivantes sont réunies simultanément :** les quatre références représentent
    plus de la moitié du plan de charge de Redon, les fournisseurs confirment par écrit ≥ 6 % de baisse
    matière, et D accepte de ramener le prix ferme à 12 mois. Alors un accord d''un an devient défendable
    et vous êtes mandatés pour le signer — les six clauses le permettent déjà. Ces trois conditions valent
    ensemble, jamais séparément.


    Ce qui ne renverse rien, et que je vous demande d''identifier comme du bruit : l''éloquence de l''acheteur,
    une menace supplémentaire, une échéance encore avancée, ou l''affirmation qu''un concurrent attend
    notre place. Aucun de ces éléments n''est un fait ; ce sont des instruments de calendrier.


    ---


    ## 11. Gouvernance pendant mon absence


    Le comité est présidé par le directeur industriel du 9 au 30 août, pour la seule raison qu''il n''est
    partie prenante ni de la position du DAF ni de celle du DC. Il convoque, arbitre l''ordre du jour
    et fait respecter les bornes de cette note. Il n''a pas de pouvoir de signature sur le dossier D.


    Le directeur commercial conduit la négociation ; le directeur financier valide chaque chiffrage. Ce
    partage est délibéré : celui qui voulait refuser ne bradera pas, celui qui voulait signer ne sabordera
    pas. Vous avez écrit votre désaccord, je le prends au sérieux, et je vous confie l''exécution ensemble
    plutôt qu''à l''un contre l''autre.


    Compte rendu écrit à chaque étape, adressé à tout le comité et archivé pour mon retour. Ce qui n''est
    pas écrit n''aura pas été décidé.


    À mon retour le 30 août, je reprends l''arbitrage plein. D''ici là, cette note fait autorité.


    *Le directeur général*

    '
