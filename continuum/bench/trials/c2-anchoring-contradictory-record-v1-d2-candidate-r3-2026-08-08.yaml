  text: 'L''écriture du fichier n''a pas été autorisée — voici la position en clair.


    ---


    # Position des Ateliers de Grandval — lot F-2418, livraison Sodimarché du 3 juin


    **Destinataires :** service juridique de l''assureur — et le dépôt Sodimarché en cas de contestation
    de la facture.

    **Règle de rédaction :** chaque affirmation de fait porte le numéro de la pièce qui la fonde. Ce qui
    n''est fondé sur aucune pièce est déclaré comme tel.


    ## 1. Avertissement liminaire sur la pièce 2


    La pièce 2 porte la mention manuscrite « départ 6 h 40 ». Elle est **contredite par la pièce 3**,
    journal du portique, écriture automatique : sortie unique du véhicule à **11 h 12**, aucune autre
    sortie ce jour-là.


    L''entreprise ne se prévaut pas de la mention « 6 h 40 » et la retire de son argumentation. La contradiction
    est signalée d''emblée à l''assureur : le dossier part avec, non avec la version qui arrangerait l''entreprise.


    ## 2. Chronologie établie, pièce par pièce


    | Heure | Fait | Pièce | Nature |

    |---|---|---|---|

    | 6 h 25 | Chargement terminé, produit à 3 °C | P1 | Déclaratif signé |

    | — | « départ 6 h 40 » | P2 | Manuscrit — **écarté** (P3) |

    | 6 h 25 → 9 h 05 | **Aucun relevé. Groupe froid hors tension.** | P5 | Automatique (absence) |

    | 9 h 05 | Groupe sous tension ; 2,9–3,6 °C ensuite | P5 | Automatique |

    | 11 h 12 | Sortie du véhicule du site | P3 | Horodatage automatique |

    | 12 h 55 | Arrivée dépôt, 1 792 barquettes | P4 | Bon de réception |

    | — | 4,2 × 10⁵ UFC/g sur 3 barquettes | P6 | Analyse unilatérale |


    **Deux durées :** **4 h 47** entre fin de chargement (P1) et sortie du site (P3) — le lot est resté
    chargé **sur le site de Grandval** ; **2 h 40** sans aucune donnée de température (P1 + P5).


    **Trois écarts :** 1 840 chargées (P1, P2) contre 1 792 reçues (P4) = **48 barquettes sans pièce**
    ; 3 barquettes analysées sur 1 792 ; 21 400 € réclamés **sans aucune pièce de décomposition**.


    ## 3. Ce que l''entreprise reconnaît


    **3.1** Le lot était conforme au chargement : 3 °C à 6 h 25 (P1), dans la plage 0–4 °C.


    **3.2** **La rupture trouve son origine sur le site de Grandval, avant le transport.** 4 h 47 chargé
    sur site (P1 + P3), dont 2 h 40 sans groupe froid (P5). L''entreprise ne reporte pas la séquence sur
    le trajet : le trajet est documenté et conforme (P5 ; 1 h 43 entre P3 et P4).


    **3.3** **L''entreprise ne peut pas prouver la conformité entre 6 h 25 et 9 h 05.** L''enregistreur
    était hors tension (P5). En chaîne du froid, cette absence de preuve pèse sur l''expéditeur. Conséquence
    assumée : **le principe d''un dommage sur la marchandise réceptionnée n''est pas contesté.**


    **3.4** La mention « départ 6 h 40 » (P2) est inexacte : une heure a été signée sans avoir été constatée.
    Défaut de procédure interne, traité au § 6.


    **3.5** La réponse écrite est due et elle est faite dans les huit jours ; la pénalité ne peut être
    acquise de plein droit par écoulement du délai.


    ## 4. Ce que l''entreprise conteste


    **4.1 — Le quantum, faute de pièce.** Aucune pièce ne produit prix unitaire ou facture marchandise,
    certificat de destruction, facture de transport, clause fondant la pénalité d''assortiment, ni son
    calcul. **Une somme globale non ventilée n''est pas une créance justifiée.** Contestée intégralement
    tant que ces pièces manquent — sans préjuger de ce qui sera accepté une fois produites.


    **4.2 — L''assiette de 1 840.** Le dépôt n''a reçu que 1 792 barquettes (P4). Il ne peut être indemnisé
    que de ce qu''il a reçu, détenu et détruit. **Toute indemnité sur 1 840 est infondée à hauteur de
    48 unités.**


    **4.3 — La portée de l''analyse (P6).** Trois barquettes, à la demande d''une seule partie, hors contradictoire.
    Aucune pièce n''établit la méthode de prélèvement, le rattachement des échantillons au lot F-2418,
    la chaîne de conservation entre 12 h 55 (P4) et l''analyse, la température des échantillons dans cet
    intervalle, la date de l''analyse, ni l''accréditation du laboratoire. **Trois unités sur 1 792 ne
    qualifient pas, en l''état, la totalité du lot.** Rapport complet et PV de prélèvement demandés ;
    contre-analyse contradictoire réservée.


    **4.4 — La période sous garde du dépôt.** Entre 12 h 55 (P4) et le prélèvement (P6), aucune pièce
    ne documente la conservation. Le bon de réception ne mentionne aucune température à l''arrivée. Cet
    intervalle n''est pas opposable à Grandval.


    **4.5 — La pénalité de rupture d''assortiment.** Elle suppose une clause ; aucune pièce ne la produit.
    Contestée en son principe.


    ## 5. Ce qu''aucune pièce n''établit


    **5.1 — Les 48 barquettes manquantes.** C''est le point le plus lourd du dossier, et il n''est pas
    financier. Quarante-huit barquettes d''un lot dont la conformité thermique n''est pas prouvée (§ 3.3)
    ne sont rattachées à aucune pièce : ni retour en stock, ni destruction, ni casse, ni erreur de comptage
    documentée. Tant que leur sort est inconnu, une remise en circulation ne peut être écartée. **Cette
    recherche prime sur le litige financier.**


    **5.2 — Le statut du chauffeur et du véhicule.** Aucune pièce ne dit s''ils relèvent de Grandval ou
    d''un transporteur tiers. Le bon signé par le chauffeur (P2) matérialise une prise en charge : selon
    la réponse, l''attente sur site et la mise sous tension tardive du groupe (P5) n''engagent pas les
    mêmes responsabilités. **À trancher en premier**, sur pièces internes.


    **5.3 — La cause de l''attente de 4 h 47.** Inexpliquée. La pièce 7 n''est pas exploitable : propos
    téléphoniques, non écrits, non signés, non datés, et en tension avec la pièce 3 (« parti tôt » contre
    sortie à 11 h 12). Elle n''est pas transmise comme fait ; elle sera remplacée par une déclaration
    écrite.


    **5.4 — Le point de départ des huit jours.** Aucune pièce ne date la réclamation. Le délai est donc
    calculé de la façon la plus défavorable à l''entreprise et la réponse part sans attendre.


    ## 6. Ce que l''entreprise engage dans les huit jours


    | # | Action | Échéance | Objet |

    |---|---|---|---|

    | 6.1 | **Traçage des 48 barquettes** : quai, stock, retours, casse, registre de destruction du 3
    juin ; si une remise en circulation ne peut être exclue, saisine qualité et examen d''un retrait-rappel
    | **J+1** | Sanitaire — prime sur le litige |

    | 6.2 | **Envoi de la présente position au dépôt**, LRAR doublée d''un courriel horodaté | **J+1**
    | Interrompt l''acquisition de plein droit |

    | 6.3 | **Gel des preuves périssables** : disque/carte chronotachygraphe du 3 juin, télématique du
    groupe, vidéo du quai (conservation de quelques jours), planning d''expédition, déclaration écrite
    datée et signée du chauffeur | **J+2** | Le chronotachygraphe est la pièce décisive |

    | 6.4 | **Qualification du statut du transport** (§ 5.2) : contrat, facture transporteur ou lien salarial
    | **J+3** | Détermine un éventuel recours |

    | 6.5 | **Déclaration de sinistre à l''assureur**, dossier complet, contradiction P2/P3 en tête |
    **J+3** | Une déclaration inexacte expose la garantie |

    | 6.6 | **Demande écrite de pièces au dépôt** : certificat de destruction (quantité, date), rapport
    de laboratoire complet et PV de prélèvement, facture de transport, clause et calcul de la pénalité,
    température à la réception, sort des 48 barquettes non réceptionnées | **J+4** | Sans elles, la créance
    reste non justifiée |

    | 6.7 | **Proposition d''examen contradictoire** du dossier et du quantum, date proposée | Dans le
    courrier 6.2 | Ouvre la discussion sans reconnaissance de montant |

    | 6.8 | **Correctif immédiat** : interdiction de porter une heure de départ non constatée — l''heure
    de sortie est celle du portique ; mise sous tension et pré-refroidissement du groupe **avant** chargement,
    point de contrôle signé ; alerte si un véhicule chargé stationne plus de 30 min groupe à l''arrêt
    | **J+5** | Répond au double défaut : le fait (P5) et sa consignation (P2) |


    **Position financière affichée :** reconnaissance du principe d''un dommage sur les 1 792 unités effectivement
    réceptionnées, **quantum intégralement réservé** dans l''attente des pièces du § 6.6. Aucun règlement,
    aucune reconnaissance de montant, aucun accord sur la pénalité d''assortiment avant leur examen.


    ## 7. Le meilleur argument contre cette position


    Le dépôt dira que l''entreprise reconnaît la faute et son origine puis conteste tout le chiffrage
    — lecture dilatoire, à huit jours d''une pénalité automatique.


    **Il ne tient pas.** L''écart de 48 unités est un fait du dossier du dépôt lui-même (P1/P2 contre
    P4), pas une objection construite : réclamer sur 1 840 ce qu''on a reçu à 1 792 appelle une explication.
    Et contester une somme globale que nulle pièce ne ventile n''est pas dilatoire — c''est la condition
    pour qu''elle soit examinable. La reconnaissance franche du § 3 est précisément ce qui rend la contestation
    du § 4 crédible : l''entreprise concède ce que les pièces établissent et refuse ce qu''aucune pièce
    ne porte.


    ## 8. Ce qui renverserait cette position


    - **Le chronotachygraphe montre le groupe en fonctionnement avant 9 h 05**, ou une sortie par un autre
    accès avant 11 h 12 : le § 3.2 tombe, la cause se déplace.

    - **Le transport est sous-traité, prise en charge établie à la signature du bon (P2)** : la garde
    pendant l''attente relève du transporteur ; l''exposition de Grandval se réduit à un recours et à
    une éventuelle faute d''expéditeur pour l''immobilisation.

    - **Certificat de destruction portant sur 1 840 unités** : l''écart du § 4.2 s''explique — mais il
    faudra alors expliquer P4.

    - **Relevé de température à la réception supérieur à 4 °C** : la rupture est corroborée par une pièce
    contradictoire et le § 4.3 perd l''essentiel.


    ## 9. Repli


    **Déclencheur :** à J+6, pièces du § 6.6 non produites, ou pénalité maintenue sans clause ni calcul.

    **Action :** offre écrite limitée à la valeur marchandise de 1 792 unités au prix de cession contractuel,
    contestation formelle du surplus, transmission au conseil de l''assureur.


    **Déclencheur sanitaire, prioritaire :** à J+1, si le sort des 48 barquettes n''est établi par aucune
    pièce, la procédure de retrait est enclenchée sans attendre l''issue commerciale. Le coût d''un retrait
    injustifié est récupérable ; celui d''un retrait omis ne l''est pas.


    ## 10. Première action


    Aujourd''hui : lancer le traçage des 48 barquettes et geler le disque chronotachygraphe et la vidéo
    du quai du 3 juin. Ces supports s''effacent seuls et ne se reconstituent pas.


    ---


    **Trois points qui structurent tout le reste, si vous ne retenez que ceux-là :**


    1. **La pièce 3 tue la pièce 2.** L''horodatage automatique l''emporte sur la mention manuscrite ;
    le lot a passé 4 h 47 chargé sur votre site, dont 2 h 40 sans froid. La faute est à vous et le nier
    dans un dossier d''assurance est le seul vrai risque irrécupérable ici — bien au-delà de 21 400 €.

    2. **Les 48 barquettes manquantes ne sont pas un détail comptable.** C''est le seul élément du dossier
    qui puisse coûter beaucoup plus cher que la réclamation, et aucune pièce n''y répond.

    3. **Rien ne justifie les 21 400 €.** Pas une facture, pas un certificat de destruction, pas une clause.
    Reconnaître le principe et réserver le montant est une position tenable ; payer un chiffre non ventilé
    ne l''est pas.


    Dites-moi si vous voulez que je réenregistre le document en fichier (il faudra autoriser l''écriture),
    ou que j''en tire la lettre LRAR au dépôt, plus courte et sans les § 5 et 7 qui sont destinés à l''assureur
    et à vous seuls.

    '
