response:
  text: 'Le plan est dans le document joint. Ce que l''arithmétique a changé par rapport à la lecture
    spontanée du dossier :


    **Le point dur n''est pas l''autonomie, c''est la recharge.** Une borne de 22 kW restitue en 6 h l''équivalent
    de 197 km par 2 °C, soit 1,83 min de borne par kilomètre. Le parc roule 16 128 km/jour. Une exploitation
    100 % électrique en hiver demande **491 heures-borne par nuit** ; 22 bornes en deux vagues en produisent
    337. Il en faudrait ~32. Les 8 bornes devisées achètent la subvention, pas la conversion — il en faut
    8 de plus, et le raccordement a un délai que le dossier ne chiffre pas.


    **Conséquence : 60 véhicules en service au 31 décembre, pas 96.** Soixante représentent 79 % de la
    capacité de recharge hivernale — un point de fonctionnement, pas un pari. À 72, les deux verrous se
    referment ensemble : les bornes saturent à 94 %, *et* les 24 diesels restants devraient porter 237
    km de moyenne, c''est-à-dire la tournée la plus longue d''aujourd''hui prise comme moyenne.


    **Le levier gratuit, c''est le re-découpage.** Le kilométrage total est fixe, sa répartition non.
    Un bloc électrique de 60 tournées à ≤150 km laisse 36 tournées diesel à 206 km. Et passer de 12 h
    à 18 h de fenêtre de recharge vaut 8 bornes sans investissement.


    **Le calcul qui emporte la rétention diesel :** 36 diesels conservés coûtent 17 280 €/mois ; une tournée
    échouée coûte 900 €. Le pool se rembourse en évitant 19 tournées, soit une seule mauvaise journée
    de froid. Total demandé ~495 k€ contre 620 k€ de subvention. Le plan convertit un risque supporté
    par les clients en risque supporté par le compte de résultat.


    Deux choses à savoir avant de le remettre :


    - Une seule question peut rendre le plan inapplicable : **le devis de 210 k€ couvre-t-il le raccordement
    ?** 30 bornes appellent 660 kW. Si la puissance manque, les délais réseau se comptent en mois et la
    subvention tombe. Appel lundi matin.

    - Le dossier confond deux choses : la note parle de **11 recharges intermédiaires**, pas de 11 tournées
    échouées. Les 900 € s''appliquent aux secondes. Combien de tournées d''essai ont réellement échoué
    n''est nulle part — à réclamer avant jeudi.


    Les hypothèses non mesurées (fenêtre de 12 h, abattement de 15 % sur les bornes, 145 km moyens du
    bloc électrique, amplitudes du bloc diesel) sont déclarées comme telles au §7 plutôt que fondues dans
    les chiffres.


    La publication en artefact a été refusée, le fichier HTML vous est envoyé directement — il s''imprime
    proprement.

    '
