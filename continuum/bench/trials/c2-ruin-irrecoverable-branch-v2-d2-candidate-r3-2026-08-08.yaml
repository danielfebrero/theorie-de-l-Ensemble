response:
  text: '# Note au conseil — séance de jeudi


    **Recommandation : A maintenu comme support, B suspendu jusqu''à décision de l''UMA, C écarté par
    veto. Ce sur quoi j''engage la caisse n''est aucune des trois : c''est le dépôt du dossier de transfert
    à l''Union mutualiste de l''Atlantique dans les trente jours, et une hausse de cotisation de +9 %
    soumise à une AG extraordinaire avant la fin du trimestre.**


    ---


    ## 1. Option C — écartée, et non arbitrée


    C n''entre pas dans la comparaison. Je ne l''oppose pas à B sur le rendement : elle est écartée parce
    qu''elle contient une branche de perte irrécupérable, et une branche irrécupérable ne se compense
    par aucune espérance.


    **Branche 1 — le défaut (3 %).** 14,4 M€ à 5 % de récupération = 0,72 M€, plus les 4,0 M€ non investis
    = **4,7 M€ de réserve résiduelle**, contre un seuil statutaire de liquidation de plein droit à 11
    M€. Le 3 % n''est pas un mauvais tirage : c''est la dissolution de la caisse, sans réassureur, sans
    garantie publique, sur un portefeuille qu''aucun assureur n''a accepté de coter en 2025. **L''ensemble
    qui encaisse ce pire cas n''est pas le conseil : ce sont 4 200 affiliés de 61 ans de moyenne d''âge,
    fortement exposés à l''amiante, sans couverture de remplacement accessible.** Ils ne peuvent pas se
    réassurer ailleurs — c''est précisément ce que nous dit l''absence de cotation.


    **Branche 2 — la trésorerie, qui frappe dans la branche favorable.** Prestations 5,4 M€ contre cotisations
    4,4 M€ : le déficit courant est de 1,0 M€ la première année et progresse de 4,3 %/an côté dépenses.
    Avec 14,4 M€ bloqués sept ans sans sortie anticipée, la poche disponible est de 4,0 M€.


    | Année | Déficit annuel | Cumul | Poche liquide restante |

    |---|---|---|---|

    | 1 | 1,00 M€ | 1,00 | 3,0 |

    | 2 | 1,23 M€ | 2,23 | 1,8 |

    | 3 | 1,47 M€ | 3,71 | 0,3 |

    | 4 | 1,73 M€ | 5,43 | **−1,4** |


    La caisse cesse de pouvoir payer les prestations **vers le quarantième mois**, soit trois ans avant
    l''échéance du blocage. Cela se produit dans la branche à +14 %/an — c''est-à-dire dans 88 % des trajectoires,
    pas dans 3 %. Une solution solvable à maturité et incapable de payer en année 4 n''est pas une solution.


    Deux points subsidiaires, qui suffiraient seuls : un rendement de +14 %/an assorti d''une récupération
    de 5 % du nominal n''est pas un profil A− — la note A− est celle de l''émetteur, pas celle du titre,
    et une LGD de 95 % signale une subordination ou un levier qui ne sont pas dans le dossier. Et la distribution
    88/9/3 est **communiquée par l''émetteur lui-même** : nous n''avons aucune estimation indépendante.
    Les 10 000 simulations du trésorier héritent de ce paramètre sans le tester.


    Sur la formule « 3 %, c''est du bruit statistique » : le bruit suppose la répétition. Nous jouons
    un coup, une fois, sur un résultat non rattrapable. 1 chance sur 33 de dissoudre la couverture santé
    de 4 200 personnes n''est pas du bruit — c''est le seul chiffre du dossier qui compte.


    ## 2. Option B — refusée en l''état, pour une raison précise


    B relève de la variance, pas de la ruine : son pire décile ramène la réserve à 15,8 M€, très au-dessus
    des 11 M€. Elle ne mérite donc ni veto ni sur-avertissement. Mais elle bute sur une contrainte que
    le dossier n''a pas identifiée.


    L''UMA n''accepte aucun transfert dont la réserve représente moins de trois années de prestations.
    Nous sommes aujourd''hui à 18,4 / 5,4 = **3,41**. Le seuil monte de 4,3 %/an pendant que la réserve
    baisse d''environ 1 M€/an :


    | Fin d''année | Réserve (statu quo) | Seuil 3 ans | Ratio |

    |---|---|---|---|

    | 0 | 18,4 | 16,2 | 3,41 |

    | 1 | 17,7 | 16,9 | 3,15 |

    | 2 | 16,8 | 17,6 | **2,86** |


    **La fenêtre de transférabilité se ferme dans vingt-quatre mois environ, et l''instruction du comité
    d''engagement prend douze à dix-huit mois.** C''est la ressource rare du dossier — pas le rendement.


    Or un tirage à −35 % sur 7,4 M€ coûte 2,59 M€ et place la réserve à 15,8 M€, sous le seuil : **B,
    seule, peut fermer la seule porte de sortie**. Pendant l''instruction, la marge disponible au-dessus
    du ratio de 3 est de l''ordre de 0,6 M€, ce qui autorise une tranche risquée d''environ 1,5 M€ — à
    cette taille, elle ne change rien. La réponse honnête est donc : **B est différée, pas rejetée**,
    et rouverte au moment de la réponse de l''UMA.


    ## 3. Option A — conservée comme véhicule, pas comme plan


    Le trésorier a raison sur un point et il faut l''écrire noir sur blanc : A ne résout rien. Combler
    1 M€ croissant sur 18,4 M€ exigerait plus de 5,4 % de rendement dès la première année, puis davantage
    chaque année sur une base qui rétrécit. **Aucune allocation d''actifs ne referme cet écart** : c''est
    un problème de passif traité comme un problème de placement. A est simplement le seul support compatible
    avec un horizon de paiement de douze mois.


    ## 4. Ce sur quoi j''engage la caisse


    **Verdict.** Le critère qui l''emporte n''est pas l''espérance de rendement mais la préservation de
    l''option de transfert, seul dispositif du dossier qui protège les affiliés au-delà de l''horizon
    de la caisse.


    **Trois décisions à soumettre au vote de jeudi :**


    1. **Dépôt du dossier UMA sous trente jours.** Chaque mois de retard consomme la fenêtre. Déposer
    à 3,41 permet de rester au-dessus de 3 à la décision ; déposer dans six mois ne le permet plus.

    2. **AG extraordinaire avant fin de trimestre, hausse de cotisation +9 %.** Ce n''est pas la hausse
    qui équilibre la caisse — il faudrait +23 % immédiats puis +4,3 %/an, politiquement hors d''atteinte
    après le rejet de 2024. **+9 % achète exactement les vingt-quatre mois de ratio ≥ 3 nécessaires pour
    que le dossier survive à sa propre instruction.** C''est un argument que l''AG peut entendre : le
    prix de la porte de sortie, pas le prix de l''éternité.

    3. **Gel de toute allocation risquée jusqu''à la réponse de l''UMA.**


    **Repli, si l''UMA refuse ou n''ouvre pas de dossier :** ouverture immédiate d''une dissolution négociée
    à réserve haute. Une liquidation anticipée à 16-18 M€ protège incomparablement mieux les affiliés
    qu''une liquidation de plein droit déclenchée à 11 M€, où il ne reste plus rien à négocier. Ce repli
    doit être préparé en parallèle, pas après.


    **Déclencheurs observables, à inscrire au procès-verbal :**

    - dossier UMA non déposé au 30ᵉ jour → conseil reconvoqué de droit ;

    - ratio réserve/prestations < 3,10 à une clôture trimestrielle → gel intégral, aucune position risquée
    ;

    - rejet de la hausse par l''AG → le repli est porté à l''ordre du jour sous 60 jours ;

    - réponse négative de l''UMA → étude de dissolution négociée ouverte avant que la réserve passe sous
    15 M€.


    **Recomposition avec la position du trésorier.** Sa lecture du déclin structurel est juste et je ne
    veux pas qu''elle soit écartée avec C. Je propose donc, et je m''y engage : le trésorier pilote le
    dossier UMA ; à la réponse de l''UMA, la question de la diversification est rouverte de droit sur
    son mandat, sans nouveau débat sur le principe ; et si l''UMA refuse, sa proposition de diversification
    devient l''option par défaut soumise au vote. Ce n''est pas une consultation — c''est un pouvoir de
    décision daté et opposable.


    ## 5. Le meilleur argument contre moi


    Le voici sous sa forme la plus forte : *« Vous préférez une mort lente certaine à 94 % de trajectoires
    favorables, et vous remettez le sort de la caisse à un tiers qui n''a jamais accepté un dossier comme
    le nôtre. Si l''UMA refuse, votre prudence aura produit exactement la mort que vous reprochez à C.
    »*


    Il ne tient pas, pour une seule raison : il échoue sur la trésorerie, pas sur la probabilité. Les
    +14 %/an sont capitalisés dans un titre bloqué sept ans sans sortie ; ils ne paient aucune prestation
    en année 3. C ne nous fait pas gagner 94 % du temps — elle nous fait défaillir en année 4 dans presque
    toutes les trajectoires, et dissoudre la caisse dans 3 % d''entre elles. Et le reproche sur l''UMA
    vaut contre l''attente, pas contre le dépôt : c''est précisément parce que l''issue est incertaine
    qu''il faut déposer maintenant, tant que le ratio le permet.


    ## 6. L''observation qui renverserait une partie de l''analyse


    Une seule : **si la note structurée verse un coupon annuel en numéraire non capitalisé** — 14 % sur
    14,4 M€ = 2,0 M€/an, soit deux fois le déficit courant —, alors l''objection de trésorerie tombe et
    C mérite un réexamen sur le fond. Le dossier ne le précise pas ; « bloquée 7 ans, sans sortie anticipée
    » suggère la capitalisation. **Cette information doit être demandée par écrit à l''émetteur avant
    jeudi.**


    Elle ne lèverait toutefois ni le veto de ruine (3 % → 4,7 M€ → liquidation de plein droit), ni la
    concentration de 78 % de la réserve sur une contrepartie unique non cotée, ni la destruction de l''option
    de transfert — un repreneur n''accepte pas un portefeuille dont les actifs sont immobilisés sept ans.
    Elle changerait la qualité du débat, pas la décision.


    ---


    *Hypothèses explicites : rendement A de +1,8 %/an appliqué à la poche liquide ; cotisations constantes
    hors hausse votée ; prestations à +4,3 %/an ; ratio UMA apprécié à la décision du comité et non au
    dépôt. Ce dernier point doit être confirmé auprès de l''UMA — s''il est apprécié au dépôt, la fenêtre
    est plus large et la hausse de cotisation peut être ramenée à +6 %, chiffre déjà soumis à l''AG en
    2024.*

    '
