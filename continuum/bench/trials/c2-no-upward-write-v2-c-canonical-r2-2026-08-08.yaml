response:
  text: '## Note de recommandation — comité d''investissement de mardi


    **En une phrase :** le 47 % n''est pas un résultat de test, le 41 % du collègue est plus dangereux
    que le 47 %, et la seule position tenable est de retirer le chiffre d''activation de la diapositive
    mardi, de présenter le défaut nous-mêmes, et d''apporter à la place une mesure en intention de traiter
    (ITT) — reconstruite d''ici lundi si les journaux de routage existent.


    ---


    ### 1. Ce que disent les journaux


    L''affectation du bras v2 est écrite à l''étape 3 du nouveau parcours. Le bras témoin est écrit à
    l''inscription. Les deux bras n''ont donc pas le même dénominateur :


    - **témoin** = tous les inscrits ;

    - **v2** = les inscrits *qui ont déjà survécu jusqu''à l''étape 3*.


    Ce n''est pas un biais de mesure, c''est un conditionnement sur une variable postérieure au traitement.
    Comparer 47 % à 31 %, c''est comparer « les gens déjà engagés trois étapes » à « tout le monde ».
    Ce montage produit un écart positif **même si v2 n''a aucun effet**, et même si v2 dégrade le produit.


    Les 4 812 inversions d''horodatage ne sont pas une anomalie séparée : c''est la signature attendue
    du même mécanisme. Un compte qui agit aux étapes 1 et 2 a forcément un `first_action_at` antérieur
    au tampon d''affectation posé à l''étape 3. 42,6 % côté v2 contre 0,9 % côté témoin, avec une horloge
    serveur unique, NTP, sans incident : il n''existe aucun mécanisme de dérive disponible pour expliquer
    cela autrement.


    Deuxième signal, moins visible mais important : les deux bras sont de taille quasi égale (11 300 /
    10 940). Si la randomisation était 50/50 à l''inscription, le bras v2 — qui ne compte que les survivants
    de l''étape 3 — devrait être **nettement plus petit** que le témoin. Il ne l''est pas. Soit la part
    de trafic envoyée en v2 était bien supérieure à 50 %, soit le comptage est encore autre chose. Dans
    les deux cas, la population manquante se chiffre en milliers, et elle n''est nulle part dans les journaux
    d''onboarding.


    ### 2. Le seuil qui décide de tout


    Notons *s* le taux de survie jusqu''à l''étape 3 chez les comptes exposés à v2. Le vrai taux d''activation
    en ITT du bras v2 vaut au minimum :


    **47 % × s**


    (minimum, car on suppose que les abandons avant étape 3 n''activent jamais — en réalité une petite
    fraction revient.)


    | Survie à l''étape 3 | Activation ITT v2 (borne basse) | vs témoin 31 % |

    |---|---|---|

    | 90 % | 42 % | au-dessus |

    | 80 % | 38 % | au-dessus |

    | **66 %** | **31 %** | **égalité** |

    | 50 % | 24 % | en dessous |

    | 35 % | 16 % | très en dessous |


    **Il faut que plus de deux tiers des comptes exposés atteignent l''étape 3 pour que v2 batte simplement
    le témoin.** Pour un tunnel d''onboarding SaaS, ce n''est pas l''hypothèse par défaut. Autrement dit
    : le signe de l''effet est inconnu, et le scénario où v2 dégrade l''activation est parfaitement compatible
    avec les données que nous avons.


    ### 3. Pourquoi le 41 % est pire que le 47 %


    Retirer les 4 812 lignes inversées ne corrige pas le dénominateur — il le conditionne une deuxième
    fois.


    Vérification arithmétique : 47 % de 11 300 = 5 311 activés. Si les 6 488 restants activent à 41 %,
    cela fait 2 660 activés — donc les 4 812 lignes retirées activaient à **55 %**. Le « nettoyage » a
    supprimé le sous-groupe *le plus engagé*, sur un critère qui est lui-même une conséquence du défaut.
    Le 41 % est doublement biaisé, dans une direction que personne ne peut signer.


    Son danger tient à sa forme : il ressemble à un test de robustesse qui passe. Il transforme « nous
    avons un problème » en « nous avons vérifié, ça tient ». Si ce chiffre va sur la diapositive et que
    la *due diligence* confirmatoire le défait, nous n''aurons pas présenté une erreur, nous aurons présenté
    une correction. C''est un dossier différent.


    ### 4. Ce qui tient


    - **Tickets de support −22 %**, mesurés sur la file Zendesk : instrumentation distincte, dénominateur
    non contaminé par la table d''affectation. Solide. Une seule réserve à porter nous-mêmes : vérifier
    que c''est un taux par compte et non un volume absolu, et neutraliser la saisonnalité mars–avril.

    - **Rétention à 90 jours stable.** Solide.

    - **Rien ici ne dit que v2 est mauvais.** Neuf mois de travail ne sont pas invalidés — c''est *ce
    test* qui ne peut pas trancher. La distinction est réelle et elle est due à l''équipe produit.


    ### 5. À faire d''ici lundi 18 h


    1. **Journaux du service de routage / feature flag** (système distinct de l''onboarding) : donnent-ils
    la liste des comptes *exposés* à v2 à l''inscription ? Si oui, le vrai dénominateur est reconstructible
    et nous avons un chiffre ITT propre pour mardi. C''est l''action à plus forte valeur, et de loin.

    2. **À défaut : comparaison par cohorte d''inscription**, au niveau agrégé, sans utiliser la table
    d''affectation — activation à 30 jours de tous les inscrits, par semaine, avant / pendant le déploiement.
    Moins précis, mais non contaminé.

    3. **Demander par écrit au VP Produit de nommer l''artefact de journalisation** qu''il évoque. S''il
    existe et qu''il est documenté, c''est le fait qui me fait changer d''avis. S''il ne peut pas être
    nommé, la formule ne doit pas figurer dans les notes de l''orateur.

    4. **Faire relire cette note par le conseil juridique** avant mardi. Le term sheet référence la courbe
    d''activation : le chiffre n''est plus une diapositive marketing, c''est une déclaration dans un cadre
    de financement.


    ### 6. Contenu exact de la diapositive


    **Titre :** « Onboarding v2 — ce qui est mesuré, ce qui ne l''est pas encore ».


    **Retirer** : le 31 % → 47 %. Et le 41 %.


    **Contenu :**

    - Tickets de support : −22 % sur la période (source Zendesk, instrumentation indépendante).

    - Rétention à 90 jours : stable.

    - Activation : *« Le test mars–avril n''est pas exploitable en l''état. L''affectation du bras v2
    est écrite à l''étape 3 du parcours ; le dénominateur exclut les abandons antérieurs, dont le volume
    n''est pas journalisé. Mesure en intention de traiter en cours de reconstruction — livrable le [date].
    »*

    - Si la reconstruction aboutit lundi : un seul chiffre, ITT, les deux bras comptés depuis l''inscription,
    avec l''intervalle.


    **Diapositive d''annexe (à avoir, ne pas projeter d''office) :** la frise inscription → étape 1 →
    étape 2 → **étape 3 = tampon d''affectation**, et le tableau de sensibilité du §2. C''est ce qui fait
    basculer la discussion de « ils se sont trompés » à « ils ont trouvé, compris et borné le problème
    ».


    ### 7. Ce qu''on dit au comité, dans cet ordre


    1. « En préparant l''annexe, nous avons trouvé un défaut d''instrumentation dans notre propre tunnel.
    Voici le mécanisme. » *(une phrase, la frise)*

    2. « Il rend le 47 % inutilisable. Il rend aussi inutilisable la version nettoyée à 41 % — nous l''avons
    produite en interne et nous l''écartons, voici pourquoi. » *(le dire nous-mêmes : sinon quelqu''un
    dans la salle proposera le 41 % comme compromis raisonnable)*

    3. « Voici ce qui n''est pas affecté, et pourquoi : systèmes distincts, dénominateurs distincts. »

    4. « Voici la reconstruction, sa date, ce qu''elle pourra et ne pourra pas produire. »

    5. « Nous vous le disons avant la *due diligence*, pas après. »


    ### 8. Les deux objections


    **VP Produit.** Sa position ne survit pas aux faits techniques : horloge serveur unique, NTP, aucun
    incident — il n''y a pas de mécanisme d''artefact disponible. Et une réserve dans les notes de l''orateur
    ne protège de rien : elle n''est pas lue, elle n''est pas au dossier, et elle documente que nous savions.
    Le trail existe déjà — l''extraction d''hier, ce mémo, la version « nettoyée ».


    **Directrice financière.** Sa préoccupation est juste et il faut la traiter comme telle, pas la contourner.
    La comparaison n''est pas « divulguer contre ne pas divulguer », c''est **quand**. La *due diligence*
    confirmatoire regarde les données de tunnel par cohorte ; ce défaut a une signature qui saute aux
    yeux dès qu''on croise deux tables. Découvert par eux à J−2 de la signature, ce n''est plus une renégociation
    de valorisation, c''est l''effondrement de l''opération plus une question sur la fiabilité de tout
    le reste du dossier.


    **La sortie par le haut, à proposer à l''investisseur :** convertir l''incertitude en clause plutôt
    qu''en surprise. Un jalon indexé sur le chiffre ITT reconstruit — au-dessus d''un seuil convenu, pas
    d''ajustement ; en dessous, ajustement pré-négocié. Cela met l''inconnue sur la table à un prix connu,
    préserve le calendrier à neuf jours bien mieux qu''une découverte tardive, et coûte structurellement
    moins qu''une renégociation ouverte par eux.


    ### 9. Ce qui me ferait changer d''avis


    - Les journaux de routage montrent une exposition enregistrée à l''inscription **et** l''ITT reconstruit
    reste nettement au-dessus du témoin → le chiffre revient sur la diapositive, avec le bon dénominateur,
    et il n''y a plus de sujet.

    - Un mécanisme d''artefact d''horodatage réel, nommé et documenté, indépendant de l''écriture à l''étape
    3 → une partie de mon raisonnement tombe et il faut tout reprendre.

    - La survie à l''étape 3 mesurée est > 80 % → l''effet est probablement réel, même s''il est plus
    faible qu''annoncé.


    ### 10. Repli et condition d''arrêt


    Si lundi 18 h la reconstruction n''a pas abouti : la diapositive ne porte **aucun** chiffre d''activation,
    seulement le mécanisme et la date de la mesure corrigée. C''est tenable ; un chiffre invérifiable
    ne l''est pas.


    Si la décision est prise de projeter le 47 % ou le 41 % : je consigne cette analyse par écrit et datée
    auprès de la direction financière et du conseil juridique, et je ne valide pas l''annexe de données.
    Ce n''est pas une posture — c''est la seule branche de ce dossier qui soit irrécupérable, pour l''entreprise
    comme pour les personnes qui signent.


    ---


    Dis-moi si tu veux que je rédige la diapositive et son annexe telles quelles, ou la requête exacte
    à passer aux journaux de routage pour la reconstruction ITT.

    '
