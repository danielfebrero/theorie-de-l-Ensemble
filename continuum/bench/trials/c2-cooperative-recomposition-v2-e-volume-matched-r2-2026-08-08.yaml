response:
  text: '## Note liminaire sur l''annexe fournie


    Le catalogue de stations joint ne peut fonder aucun élément de cette décision, et je le dis avant
    tout le reste pour qu''on ne me l''oppose pas jeudi :


    - il ne contient **aucune station dans le bassin de la Vèze** ;

    - il ne contient **aucun capteur de débit ni aucun piézomètre** — les huit types recensés sont thermomètre,
    anémomètre, sonde-sol, hygromètre, pluviomètre, capteur-neige, baromètre, pyranomètre ;

    - il ne corrobore donc **ni les 410 L/s, ni les 900 L/s de moyenne, ni le déficit pluviométrique**.


    Le seul enseignement transposable est indirect : dans ce parc, les dates d''étalonnage s''échelonnent
    de 2022 à 2025, soit des cycles allant jusqu''à quatre ans, ce qui indique qu''un étalonnage de 2023
    n''est pas anormal au regard de la pratique — mais n''établit pas pour autant que la mesure soit juste.
    J''y reviens au point III.


    ---


    ## I. Je conteste l''équation posée


    `240 + 150 + 180 = 570`, `570 − 410 = 160`. L''arithmétique est exacte ; la comptabilité ne l''est
    pas. Elle additionne trois grandeurs qui ne sont pas de même nature.


    **Les 180 L/s ne sont pas un prélèvement.** C''est un débit qui doit *transiter*. Il n''est pas soustrait
    à l''amont, il est constaté à l''aval. Le mettre dans la même somme que deux prélèvements suppose
    que rien de ce qui est prélevé ne revient à la rivière au-dessus du point de contrôle. Cette hypothèse
    n''est écrite nulle part dans le dossier.


    **Or l''eau potable revient, en grande partie.** Un réseau domestique restitue typiquement 70 à 85
    % de son volume à la station d''épuration. Si l''exutoire de la STEP de Ferney se situe **au-dessus**
    du point où se contrôle le débit réservé, la consommation nette de la régie n''est pas de 150 L/s
    mais de l''ordre de 30 à 50 L/s. Le déficit ne serait alors pas de 160 L/s mais de 50 à 60 L/s. Si
    l''exutoire est en aval du point de contrôle, l''équation initiale tient.


    Je ne sais pas laquelle des deux situations est la nôtre. **Personne autour de la table ne l''a dit,
    et c''est la question la plus importante du dossier.** Elle se tranche en trois jours avec un plan
    de réseau et une visite de terrain.


    **Deuxième anomalie, dans les 150 L/s eux-mêmes.** 150 L/s représentent 12 960 m³/jour, soit **1 409
    litres par habitant et par jour** pour 9 200 habitants. La consommation domestique française se situe
    autour de 150 L/hab/j. Le chiffre de la régie est donc environ **neuf fois** ce que la population
    expliquerait.


    Ce n''est pas une accusation, c''est un écart d''ordre de grandeur qui appelle une explication, et
    il n''y en a que quatre possibles : le réseau dessert plus que Ferney ; il alimente un gros abonné
    industriel ou agroalimentaire ; son rendement est très dégradé ; ou les 150 L/s sont une **autorisation
    nominale de prélèvement** et non un prélèvement réel. Les quatre sont plausibles. Trois d''entre elles
    signifient qu''une partie des 160 L/s manquants se trouve dans ce chiffre.


    **À l''inverse, la demande des maraîchers ne paraît pas gonflée.** 240 L/s sur 620 ha, c''est 3,3
    mm/jour, soit en dessous de l''évapotranspiration maximale d''un maraîchage en août. Sur huit semaines,
    187 mm — un ordre de grandeur normal. Je le dis d''emblée parce que c''est eux que je vais contraindre
    le plus, et qu''ils doivent savoir que je ne les soupçonne pas de surdéclarer.


    Ce que je conteste chez eux, c''est autre chose : **« en dessous de 240, perte totale » n''est pas
    vrai.** La réponse d''une culture au déficit hydrique est continue, pas en falaise. Une perte de 4,1
    M€ n''est le scénario réel que si l''on répartit l''eau uniformément sur les 620 ha jusqu''à ce que
    tout meure ensemble. C''est précisément ce que ma proposition cherche à éviter.


    ---


    ## II. Le régime de décision


    Trois pertes sont en jeu, et elles ne sont pas de même classe :


    | | Nature | Réversibilité |

    |---|---|---|

    | Milieu, sous 180 L/s | Effondrement truites, 2 frayères asséchées | **Non reconstituable à l''échelle
    décennale** (rapport du 12 juin) |

    | AEP, sous le seuil sanitaire | Rupture d''alimentation, EHPAD 110 lits | Irréversible pour les personnes
    concernées |

    | Maraîchage | 4,1 M€, 90 emplois saisonniers | Sévère, mais d''une saison — **sauf faillite d''exploitation**,
    qui elle ne se rattrape pas |


    L''asymétrie commande l''ordre : le débit réservé et le plancher sanitaire sont des **contraintes**,
    pas des variables. L''irrigation est le résidu. Ce n''est pas un jugement sur la valeur relative de
    l''agriculture ; c''est la seule des trois pertes dont une fraction se rachète avec de l''argent et
    de l''organisation.


    La conséquence, que je porte devant les maraîchers sans l''atténuer : **ils absorbent la totalité
    de l''incertitude.** Toute erreur de mesure, toute révision à la baisse du débit se répercute intégralement
    sur eux. C''est ce qui rend le point III non négociable.


    ---


    ## III. Trois inconnues à lever avant jeudi + 72 h


    Je refuse de signer une répartition fondée sur un nombre unique, produit par une station unique, étalonnée
    il y a trois ans, sans redondance.


    1. **Un jaugeage indépendant** (dilution ou courantomètre) à l''entrée du barrage, plus un jaugeage
    au point de contrôle du débit réservé aval — qui, à ma connaissance, **n''est mesuré par rien**. Coût
    : quelques milliers d''euros. Enjeu : une erreur de 12 % sur 410 L/s, c''est 50 L/s, soit un tiers
    du déficit annoncé. Si le débit réel est 350, l''irrigation tombe à 20 L/s ; s''il est 470, elle monte
    à 140. **Ce sont les maraîchers qui ont le plus à gagner à exiger ce jaugeage**, et je les invite
    à en désigner un observateur.

    2. **La position de l''exutoire de la STEP de Ferney** par rapport au point de contrôle des 180 L/s,
    et le taux de restitution du réseau.

    3. **Le stock utile de la retenue de Sarcelle** et ses pertes par évaporation et infiltration. Le
    dossier parle de débit entrant et ne dit rien du volume stocké. S''il existe une réserve mobilisable,
    elle change la trajectoire des trois prochaines semaines ; si elle s''évapore, c''est une quatrième
    ponction non comptabilisée.


    Tant que ces trois points ne sont pas levés, tout chiffre que je poserai est provisoire, et je l''écrirai
    comme tel.


    ---


    ## IV. Ce que je propose : une règle, pas un chiffre


    Je propose que la commission arrête non pas une répartition, mais une **fonction du débit mesuré Q**,
    révisée hebdomadairement :


    - **Débit réservé : 180 L/s, plancher absolu.** Jamais alloué, jamais arbitré. Il est fixé par arrêté
    préfectoral, il n''est pas à nous ; et quand bien même il le serait, l''irréversibilité décennale
    l''exclut du champ de la négociation.

    - **AEP : plancher sanitaire garanti sans condition**, que je fixe à titre provisoire à **45 L/s**
    — soit près de trois fois le besoin domestique strict de 9 200 habitants, marge incluse pour l''EHPAD,
    les équipements collectifs, la défense incendie et les pertes incompressibles. Ce plancher n''est
    jamais réduit, quel que soit Q.

    - **Irrigation : le résidu, soit Q − 180 − AEP réel.**


    Avec Q = 410 L/s :


    | Prélèvement AEP réel | Irrigation disponible | Surface irrigable **à plein régime** |

    |---|---|---|

    | 150 L/s (situation actuelle) | 80 L/s | ~207 ha sur 620 |

    | 120 L/s | 110 L/s | ~284 ha |

    | 100 L/s | 130 L/s | ~336 ha |

    | 70 L/s | 160 L/s | ~413 ha |


    (base : 0,387 L/s par hectare, taux plein revendiqué par la profession)


    **Cette table est le cœur politique du dossier.** Elle dit que le litre gagné sur le réseau d''eau
    potable n''est pas récupéré par la collectivité : **il va aux maraîchers, automatiquement, sans nouvelle
    délibération.** Elle transforme la régie et les irrigants d''adversaires en co-intéressés, et elle
    détruit la formule « les paysans contre les robinets » : le troisième terme, celui dont personne ne
    parle, c''est l''eau qui se perd entre le captage et le compteur.


    **Transition.** La régie n''a que 4 jours de réserve tampon et ne peut rien redresser en 4 jours.
    Je propose donc :


    - **J+0 à J+10** : la régie conserve **150 L/s**, sans condition. Irrigation : 80 L/s. En contrepartie,
    audit de réseau engagé sous 48 h et arrêté municipal d''interdiction des usages non essentiels (lavage,
    remplissage, arrosage d''agrément).

    - **À partir de J+11** : la dotation de la régie devient égale à son **besoin justifié**, documenté
    par sectorisation et débits de nuit. Le différentiel bascule vers l''irrigation.


    Ce que je garantis à la régie est donc plus solide que ce qu''elle demande : le plancher sanitaire
    est inconditionnel et permanent. Ce que je ne garantis pas, c''est l''écart entre son besoin réel
    et son prélèvement actuel, tant qu''il n''est pas expliqué.


    ---


    ## V. Quotas individuels ou volume global : volume global, et pour une raison factuelle


    Le règlement m''ouvre les deux voies. Je choisis le **volume global par usage**, parce que l''autre
    est matériellement impossible :


    - la commission ne détient **ni cultures, ni stades végétatifs, ni relevés de compteurs** ;

    - un quota individuel assis sur des surfaces déclarées serait arbitraire dans sa fixation et **inapplicable
    dans son contrôle** — sans compteur, un quota n''est pas une règle, c''est une déclaration d''intention.


    Le volume global est aussi ce qui rend possible la seule stratégie qui limite vraiment la perte :
    **la concentration délibérée**. 80 L/s étalés sur 620 ha, c''est 1,1 mm/jour partout, et probablement
    tout perdu. Les mêmes 80 L/s concentrés sur 207 ha sauvent 207 ha intégralement. Le choix des parcelles
    sacrifiées suppose de connaître les stades végétatifs et les valeurs de récolte — **je ne les connais
    pas, eux les connaissent.** C''est leur arbitrage, pas le mien.


    Conditions attachées, sous 7 jours :

    1. Désignation d''une **structure porteuse** (ASA ou association d''irrigants) mandatée par les 34
    exploitations ;

    2. **Plan parcellaire de concentration** : parcelles servies, parcelles abandonnées, calendrier ;

    3. **Pose de compteurs sur les 34 prélèvements**, télérelevé sur les six principaux, financés par
    le fonds ;

    4. **Irrigation nocturne obligatoire**, interdiction d''aspersion entre 11 h et 18 h — 15 à 25 % d''eau
    efficace gagnés sans un litre supplémentaire.


    **Régime de dépassement :** un dépassement identifié par compteur est imputé à l''exploitation concernée
    et déduit de sa part la semaine suivante. Un dépassement non imputable faute de compteur est déduit
    du **volume collectif**. Les irrigants ont donc un intérêt direct à ce que les compteurs existent
    et fonctionnent.


    **Régime par défaut**, si la structure n''est pas constituée au 7ᵉ jour : quotas individuels au prorata
    des surfaces déclarées, **plafonnées à 30 ha par exploitation**. Je l''assume sur le fond et pas comme
    une menace : en régime de pénurie, l''objectif de la collectivité est la survie du plus grand nombre
    d''exploitations et le maintien des 90 emplois saisonniers, ce qui justifie de protéger un minimum
    viable par exploitation plutôt que de servir au prorata de la surface. Mais ce régime est mauvais
    pour tout le monde — il interdit la concentration et fige la répartition. Il doit rester une porte
    de secours. J''observe simplement que six exploitations cultivent 300 des 620 ha : elles sont, avec
    les vingt-huit autres, les premières intéressées à ce que la voie collective aboutisse.


    ---


    ## VI. La sortie de crise : ce qui a échoué en 2022 ne sera pas répété


    Le dispositif de 2022 a levé les restrictions sur un franchissement de seuil pendant 48 h. L''orage
    du 9 août a produit 520 L/s, la reprise totale a eu lieu le 11, le débit était à 340 L/s quatre jours
    plus tard. Le mécanisme n''a pas mesuré une reconstitution : il a mesuré un ruissellement.


    Nouveau mécanisme :


    - **Critère de moyenne mobile 7 jours**, et non de franchissement instantané ;

    - **Critère de tarissement** : le débit doit être supérieur au seuil **au 5ᵉ jour après la fin de
    tout épisode pluvieux**. Un pic d''orage n''ouvre aucun droit ;

    - **Confirmation piézométrique** : le niveau de la nappe doit remonter, pas seulement le débit de
    surface. C''est exactement ce qui manquait en août 2022. Le parc de stations en annexe ne comporte
    aucun piézomètre ; il faut en poser un, c''est peu coûteux ;

    - **Remontée par paliers** : 40 %, puis 70 %, puis 100 % de la dotation, **10 jours minimum par palier**
    ;

    - **Asymétrie assumée** : le resserrement est automatique et immédiat dès que le critère cesse d''être
    rempli ; l''assouplissement exige les trois critères réunis. On restreint vite, on relâche lentement.


    ---


    ## VII. Les 600 000 €


    Une remarque préalable, désagréable mais nécessaire : **600 000 € contre une perte annoncée de 4,1
    M€, c''est 15 %.** Utilisé en indemnisation, ce fonds ne répare rien et ne produit pas un litre. Utilisé
    pour acheter de l''eau physique, il a un effet de levier réel. Je propose donc de l''affecter très
    majoritairement au premier usage.


    | Poste | Montant | Effet attendu |

    |---|---|---|

    | Métrologie : jaugeages contradictoires, station de contrôle aval, piézomètre | 25 000 € | Lève l''incertitude
    qui pèse entièrement sur les irrigants |

    | Compteurs sur les 34 prélèvements + télérelevé sur les 6 principaux | 40 000 € | Rend l''allocation
    exécutoire |

    | Recherche de fuites, sectorisation, réparations d''urgence réseau Ferney | 220 000 € | Poste le
    plus rentable en L/s par euro si le rendement est dégradé |

    | Sécurisation AEP : interconnexion ou remise en service d''un forage de secours, plan EHPAD | 120
    000 € | Réduit durablement la ponction sur la Vèze |

    | Indemnisation ciblée de l''abandon **délibéré** de parcelles, priorité aux exploitations < 20 ha,
    plafond par exploitation | 175 000 € | Paie l''organisation du sacrifice, pas le sinistre |

    | Expertise hydrobiologique contradictoire + réserve non affectée | 20 000 € | Voir point IX |


    Les 175 000 € ne sont pas une indemnisation du préjudice et je ne les présenterai pas comme telle.
    La vraie compensation relève d''autres guichets, que la commission doit saisir formellement **dès
    jeudi** : régime des calamités agricoles, assurance récolte, dégrèvement de taxe foncière sur le non-bâti,
    activité partielle pour les saisonniers, report d''échéances MSA. Ces dispositifs pèsent bien plus
    lourd que 600 000 €, et leur instruction est longue : ne pas les enclencher cette semaine serait la
    faute la plus coûteuse du dossier.


    ---


    ## VIII. Ce que je dis à chacun


    **À la régie**, qui refuse de discuter avant garantie : *votre dotation sanitaire est garantie, inconditionnellement
    et en premier — c''est la seule ligne du dispositif qui ne dépend d''aucune variable. En revanche,
    1 409 litres par habitant et par jour est un chiffre que vous devez expliquer, pas défendre. Si l''explication
    est un gros abonné ou un périmètre plus large que Ferney, dites-le et nous en tirons les conséquences.
    Si c''est le rendement du réseau, le fonds paie les réparations. Ce que je ne peux pas faire, c''est
    arbitrer une pénurie en traitant votre prélèvement comme une donnée intangible alors qu''il est le
    seul des trois à n''avoir jamais été instruit.*


    **Aux maraîchers**, qui ont quitté la salle : *je ne conteste pas votre besoin — 3,3 mm/jour en août,
    c''est déjà de l''irrigation déficitaire, et je l''écris dans ma position. Je conteste une seule chose
    : que 239 L/s égale zéro. Étaler 80 L/s sur 620 hectares, c''est perdre 620 hectares. Les concentrer,
    c''est en sauver 207, et davantage à chaque litre repris sur le réseau. Le choix des parcelles vous
    appartient, parce que vous seuls savez ce qui se sauve. Vous êtes ceux qui supportent l''intégralité
    de l''incertitude de mesure : c''est pourquoi le jaugeage contradictoire est financé, et pourquoi
    je vous demande d''y envoyer un observateur. Votre siège vide jeudi ne fera pas monter le débit ;
    il fera appliquer le régime par défaut, qui est moins bon pour vous tous.*


    **Sur les 180 L/s** : *ils ne sont pas dans la négociation, et pas d''abord pour une raison juridique.
    Une récolte perdue se rejoue en un an. Deux frayères asséchées, selon le rapport du 12 juin, ne se
    rejouent pas avant dix ans. Quand une perte est réversible et l''autre non, l''ordre n''est pas un
    choix moral, c''est une contrainte.*


    **À la presse** : publication hebdomadaire du débit mesuré, des trois allocations et de la table du
    point IV. Le dossier n''est pas un arbitrage entre deux camps ; il comporte un troisième terme, l''eau
    perdue, et il doit être public.


    ---


    ## IX. L''argument le plus fort contre ma position


    Le voici, tel que je l''exposerai moi-même jeudi.


    **Le débit réservé de 180 L/s repose sur un rapport unique, du 12 juin, rédigé avant le cœur de l''étiage.**
    La qualification « non reconstituable à l''échelle d''une décennie » est une affirmation d''expert,
    non contredite parce que personne ne l''a contestée. Dans un petit bassin, une population de truites
    se recolonise souvent depuis des refuges amont ; trois semaines à 150 L/s pourraient coûter beaucoup
    moins qu''un effondrement décennal — et beaucoup moins que 4,1 M€ et 90 emplois. Sur ce raisonnement,
    abaisser temporairement le débit réservé de 30 L/s résoudrait presque la moitié du déficit.


    Je n''y souscris pas, pour trois raisons, dont j''admets que la première est procédurale :


    1. Le débit réservé est fixé par arrêté préfectoral. La commission ne peut pas s''en affranchir ;
    elle peut seulement en demander la révision. Un dépassement de fait nous exposerait, et ruinerait
    l''autorité du dispositif entier.

    2. L''asymétrie tient même si le rapport est trop prudent : se tromper en protégeant coûte une récolte,
    se tromper en prélevant coûte une décennie. Sous incertitude, on paie l''erreur la moins chère.

    3. Et surtout : **si l''argument est bon, il justifie une expertise contradictoire, pas un passage
    en force.** Elle est financée dans le tableau ci-dessus. Si elle établit que 150 L/s ne provoquent
    pas l''effondrement documenté, je proposerai moi-même à la commission de saisir le préfet et je réviserai
    la répartition. Je le dis pour qu''on me le rappelle.


    ---


    ## X. Ce qui me ferait changer d''avis, et quand j''arrête


    Une position qui ne dit pas à quelles conditions elle tombe n''est pas une position, c''est une conviction.


    | Constat | Conséquence |

    |---|---|

    | Le jaugeage contradictoire donne Q < 350 L/s | Irrigation ≤ 20 L/s : la concentration ne sauve plus
    rien de significatif. Le dispositif bascule d''une logique de sauvetage de récolte vers une logique
    d''indemnisation et de sauvegarde des exploitations. Le fonds est réaffecté. |

    | L''exutoire de la STEP est au-dessus du point de contrôle | Le déficit réel est de 50–60 L/s et
    non 160. **La répartition est entièrement recalculée**, l''irrigation remonte fortement, et la crise
    change de nature. |

    | Le rendement du réseau se révèle correct et les 150 L/s justifiés | Mon argument central tombe.
    J''en tire les conséquences publiquement et l''irrigation reste à 80 L/s, avec un effort reporté sur
    le fonds et les dispositifs nationaux. |

    | L''expertise contradictoire invalide le seuil de 180 L/s | Je saisis le préfet en révision. |

    | Le débit aval mesuré passe sous 180 L/s | **Arrêt immédiat et total des prélèvements d''irrigation**,
    sans délibération préalable. C''est la seule clause automatique du dispositif. |

    | La régie descend sous 4 jours de réserve malgré sa dotation | Déclenchement du plan EHPAD (citernage)
    et réquisition de la totalité du résidu. |


    **Revue hebdomadaire obligatoire**, avec publication. Toute décision de cette commission est provisoire
    jusqu''à la reconstitution documentée de la nappe.


    ---


    ### En une phrase


    Je propose un volume global par usage et non des quotas individuels — parce que nous n''avons ni compteurs
    ni données parcellaires, et parce que seule la concentration délibérée de l''eau sur une fraction
    des surfaces sauve quelque chose ; je fais du débit réservé et du plancher sanitaire des contraintes,
    de l''irrigation le résidu ; et je conditionne tout à la levée, sous 72 heures, de trois inconnues
    dont l''une — le devenir de l''eau potable restituée — pourrait faire fondre le déficit de 160 L/s
    à une soixantaine.

