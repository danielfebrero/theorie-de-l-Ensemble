response:
  text: '# Note au comité de direction — arbitrage prestataire de paiement


    **De :** Direction des opérations · **Le :** 14 août 2026 · **Objet :** Solda / Payflux, options A
    et B


    ---


    ## Recommandation


    **Option B — bascule progressive — amendée sur trois points. Et une décision à prendre avant le 15
    octobre qui ne figure sur aucune des deux options : prévenir Solda pour sécuriser la prolongation
    au mois le mois.**


    Les 500 k€ de l''option A et la capacité de revenir en arrière sont **le même levier**. A n''économise
    500 k€ que parce qu''elle laisse le compte Solda se fermer le 30 novembre — soit le Cyber Monday,
    trois jours après le Black Friday. On ne peut pas encaisser l''économie *et* garder le repli.


    ## Les chiffres qui décident


    Volume : 6,57 M transactions/an, 276 M€ de CA. Chaque **0,1 point** de taux d''échec = **276 k€ de
    CA exposé par an**.


    | | Option A (bascule le 3 nov.) | Option B amendée |

    |---|---|---|

    | Rodage Payflux (1,3 % vs 0,4 %, 3 sem.) | sur 100 % du trafic → **143 k€ exposés** | sur 10 % du
    trafic → **14 k€ exposés** |

    | Écart permanent (0,5 % vs 0,4 %) | 276 k€/an | 276 k€/an *(identique — à contractualiser)* |

    | Repli pendant le pic | **aucun après le 30 nov.** | bascule en < 15 min, deux comptes ouverts |

    | Économie an 1 (dossier) | 500 k€ | 310 k€ − 30 k€ de double run allongé = **280 k€** |

    | Prolongation Solda déc.–janv. | 0 | **− 260 k€** |


    **Le vrai cadrage :** sur les 24 mois d''engagement, Payflux fait gagner **1,0 M€** (1,8 M€ contre
    2,8 M€). Le débat porte sur un surcoût **ponctuel** de 190 à 480 k€ — soit 19 à 48 % du gain de deux
    ans, payé une fois, pour protéger les trente jours qui font l''année.


    **La branche qu''on refuse.** Si Payflux décroche après la fermeture du compte Solda, la réouverture
    prend 6 semaines *et* impose de recollecter 2,1 M d''empreintes de carte. Même en ne comptant qu''une
    moitié de jetons actifs et 10 % d''abandon sur cette friction, c''est **10 à 25 M€ de CA annuel récurrent**
    — 20 à 50 fois l''économie en jeu. Cette branche n''est pas de la variance : elle est irrattrapable,
    et elle est encaissée par nos clients autant que par nous.


    ## Les trois amendements


    1. **Démarrer la rampe le 19 octobre, pas le 3 novembre.** Le rodage de Payflux (1,3 % → 0,5 %) est
    un coût incompressible ; le seul choix est de savoir sur quel volume on le paie. Sur 10 % du trafic
    d''octobre : 14 k€. Sur 100 % du trafic de novembre : 143 k€. Même apprentissage, dix fois moins cher.

    2. **Geler le palier du 20 novembre au 5 janvier.** Aucun changement de palier pendant le pic. Le
    niveau validé au 20 novembre est celui qui tourne le Black Friday (27/11), le Cyber Monday (30/11)
    et Noël — avec les deux comptes ouverts et un retour arrière en quinze minutes.

    3. **Faire porter les 90 jours de sortie sans pénalité sur la bascule à 100 %, pas sur la signature.**
    Signés le 12 octobre, les 90 jours expirent le 10 janvier, avant que nous ayons la moindre donnée
    à plein volume : nous paierions les 240 k€ de pénalité sans jamais avoir vu Payflux à charge réelle.
    Si Payflux croit ses propres chiffres, la clause ne lui coûte rien — **un refus est en soi une information.**


    ## Calendrier


    19 oct. 10 % · 26 oct. 25 % · 9 nov. 50 % · **20 nov. – 5 janv. gel** · 5 janv. 100 % · ~19 janv.
    clôture Solda après deux semaines de stabilité. Six semaines de marge avant le butoir Solda du 28
    février.


    **Repli et déclencheur** (l''astreinte est pré-autorisée à l''exécuter sans arbitrage hiérarchique
    — sinon les quinze minutes sont une fiction) :

    - Paliers 10 % et 25 %, fenêtre glissante 24 h : échec > 0,8 % → gel du palier et diagnostic ; > 2,0
    % → retour au palier précédent.

    - Paliers 50 % et 100 %, fenêtre glissante 60 min sur ≥ 300 transactions : échec > 0,8 % → retour
    au palier précédent en < 15 min.


    *Le tableau de bord à 5 minutes ne devient statistiquement exploitable qu''à partir du palier 50 %.
    À 10 %, il détecte une panne franche, pas un écart de 0,1 point. C''est le palier 50 % qui doit durer.*


    ## Le meilleur argument contre cette note


    **Que B nous laisse à 50 % Payflux le Black Friday : exposition réelle *et* double coût — le pire
    des deux.** Il ne tient pas : à 50 % avec repli en 15 minutes, un incident coûte un quart d''heure
    de trafic dégradé sur la moitié du volume ; à 100 % sans repli, il coûte le pic. La bonne réponse
    au risque n''est pas d''en prendre zéro, c''est de le prendre là où on peut le retirer.


    **Ce qui renverserait ma recommandation :** la donnée brute du pilote Payflux montrant que les 1,3
    % initiaux venaient d''une cause identifiée, corrigée et non reproductible chez nous. Avec cette preuve
    *et* un SLA sur le taux d''autorisation, A redeviendrait discutable — mais jamais sans la prolongation
    Solda.


    **Deux réserves à lever, pas des motifs d''attendre :**

    - Les 310 k€ de l''option B intègrent-ils la prolongation Solda ? Selon la réponse, l''économie nette
    de B est de 20 k€ ou de 280 k€. *(DAF — avant vendredi.)*

    - Les 99,9 % de disponibilité contractuelle de Payflux ne disent **rien** du taux d''échec. Le seul
    engagement qui compte, et qui manque, porte sur le taux d''autorisation.


    ## Lundi 17 août


    1. **Term sheet à Payflux**, réponse exigée au 5 septembre : SLA taux d''autorisation ≥ 99,6 % mensuel
    avec pénalité ; fenêtre de sortie 90 jours à compter de la bascule à 100 % ; facturation au prorata
    du volume routé pendant la rampe.

    2. **Notification Solda rédigée et calée au 1er octobre**, marge de deux semaines sur le butoir du
    15. *Elle part quelle que soit l''issue de la négociation Payflux.* C''est l''assurance la moins chère
    du dossier.

    3. **Demander à Solda une offre révisée** sous pression concurrentielle. Un e-mail, un gain potentiel
    à trois chiffres.

    4. **Supervision paiement** : runbook de repli par palier, et confirmation que le tableau de bord
    ventile le taux d''échec par réseau et par émetteur — un taux global à 1,3 % cache le plus souvent
    une seule route cassée.

    5. **Payflux — données brutes du pilote** : cause des 1,3 %, correctif, délai de résorption. Une incapacité
    à répondre est un signal en soi.


    ---


    *Si le comité refuse le surcoût de réversibilité, l''ordre de préférence est : B amendée > B en l''état
    > A + prolongation Solda > **A seule, à écarter**.*


    ---


    ## Hors note — ce qui a fait pencher la décision


    - **A + prolongation Solda est dominée par B.** Garder Solda ouvert coûte à peu près le même prix
    que le double run, mais expose 100 % du trafic pendant le rodage *et* pendant le pic. Même coût, plus
    de risque. C''est ce qui rend la recommandation tranchée plutôt qu''un arbitrage serré.

    - **La date qui commande n''est pas le 3 novembre, c''est le 15 octobre.** C''est la seule échéance
    du dossier qui ne se rattrape pas, et elle tombe deux semaines *avant* que la moindre donnée Payflux
    existe. Décider de la bascule sans avoir acheté l''option Solda, c''est décider à l''aveugle et sans
    retour.

    - **Le 30 novembre est un piège de calendrier.** L''expiration du contrat tombe pile sur le Cyber
    Monday. Personne ne l''a écrit dans le dossier, et c''est le fait le plus dérangeant qu''il contient.

    - **Les 0,1 point permanents (276 k€/an) valent presque autant que l''écart A/B.** Ils sont identiques
    dans les deux options, donc ils n''arbitrent pas — mais ils rongent plus de la moitié de l''économie
    annoncée si personne ne les contractualise. C''est le point que le comité risque le plus de laisser
    passer.

    - **Le calendrier date le comité au vendredi 14 août**, ce qui laisse deux mois pleins avant le 15
    octobre. Confortable — à condition que le term sheet parte lundi, parce que la négociation du SLA
    et de la clause de sortie est le chemin critique, pas la technique.

    '
