response:
  text: '# NOTE DE DIRECTION — ARBITRAGE ET MANDAT D''EXÉCUTION


    **De :** Direction générale

    **À :** Comité de direction (DAF, Direction commerciale, Direction industrielle, DRH, Supply)

    **Date :** 8 août 2026

    **Objet :** Offre d''exclusivité du distributeur D — décision, mandat borné, plan d''exécution en
    l''absence du DG

    **Diffusion :** membres du codir uniquement. Ne pas diffuser, ne pas citer à l''extérieur.


    ---


    ## 1. Décision


    **L''offre d''exclusivité de D, dans sa forme actuelle, n''est pas signée. Cette décision est prise,
    elle n''est pas déléguée, et elle ne se rediscute pas en mon absence.**


    Elle ne dépend d''aucun chiffrage restant à produire. Voici pourquoi, pour que personne n''ait à refaire
    le raisonnement sous pression.


    Notre marge brute est de 31 %. Une remise de 9 % sur le prix de cession détruit 29 % de la marge unitaire.
    Le volume nécessaire pour revenir à l''équilibre n''est pas +18 % : il est de **+41 %**.


    | Scénario (base : 14,9 M€ de CA D, 4,62 M€ de marge) | CA D | Marge brute D | Écart |

    |---|---|---|---|

    | Aujourd''hui | 14,9 M€ | 4,62 M€ | — |

    | An 1, D tient son engagement +18 % | 16,0 M€ | 3,87 M€ | **−0,75 M€** |

    | An 2-3, volume revenu au niveau actuel | 13,6 M€ | 3,28 M€ | **−1,34 M€/an** |

    | An 2-3, volume −11 % (précédent du T2) | 12,1 M€ | 2,92 M€ | **−1,70 M€/an** |


    Le meilleur scénario de l''année 1 nous coûte 0,75 M€ de marge. Le scénario réaliste sur trois ans
    est de l''ordre de **−3,5 à −3,8 M€**, auquel s''ajoute l''interdiction de développer la centrale
    régionale (≈ 1,1 M€ de marge annuelle à terme) et la marketplace (≈ 0,15 à 0,8 M€, à marge supérieure
    de 6 points).


    Le contrat est structurellement asymétrique : notre exclusivité est ferme trois ans, leur volume est
    ferme un an et « indicatif » ensuite. Nous payons la remise pendant 36 mois contre une promesse de
    12. Le T2, avec −11 % sans préavis, nous dit ce que vaut une trajectoire non contractualisée chez
    D.


    Enfin, le fond du problème n''est pas cette offre : c''est notre dépendance à 62 %. **L''exclusivité
    ne réduit pas ce risque, elle le rend contractuel et irréversible pendant trois ans, au prix de 1,2
    M€ pour en sortir.** C''est la seule chose que je refuse absolument.


    **Cap fixé à la mandature : ramener D sous 50 % du CA en 24 mois.** Toute décision prise en mon absence
    doit aller dans ce sens ou, au minimum, ne pas l''empêcher.


    ---


    ## 2. Ce que le comité est autorisé à signer


    Vous n''avez pas un mandat de refus, vous avez un mandat de contre-proposition. Vous **pouvez** signer
    un accord avec D pendant mon absence, sans me consulter, **si et seulement si** il respecte les sept
    conditions ci-dessous. Toutes, simultanément.


    1. **Pas d''exclusivité générale.** Au maximum une exclusivité de catégorie sur les enseignes nationales
    du périmètre de D, listées nominativement en annexe du contrat. Restent expressément libres : marketplace,
    RHD, export, MDD tierces et **centrales régionales**.

    2. **Remise plafonnée à 4,5 %**, non négociable au-delà. C''est le point de neutralité de marge si
    le volume promis se réalise.

    3. **Remise arrière, trimestrielle, par palier de volume réellement constaté** — pas de baisse du
    prix de base. D touche la remise après avoir livré le volume, pas avant.

    4. **Durée 18 mois maximum**, tacitement reconductible par accord écrit.

    5. **Préavis réciproque de 3 mois** sur toute baisse de commande supérieure à 5 % par rapport au trimestre
    correspondant, assortie d''une indemnisation en cas de non-respect. C''est la réponse directe au T2.

    6. **Symétrie des pénalités.** Si D veut 1,2 M€ de pénalité de sortie, D engage 1,2 M€ sur son volume.
    Sinon, aucune pénalité de part et d''autre.

    7. **Aucune clause de nation la plus favorisée, d''audit de nos autres canaux, ou de droit de préemption
    sur nos nouvelles références.**


    **Règle de signature :** unanimité écrite du DAF, du directeur commercial et du directeur industriel,
    ET conformité aux sept points. Le DAF coordonne, sans voix prépondérante.


    **Règle de blocage :** en cas de désaccord entre vous, ou de doute sur la conformité d''une clause,
    **on ne signe pas**. Le silence vaut refus. C''est un scénario préparé, pas un accident — voir §4.
    Vous n''avez donc jamais besoin d''un arbitre.


    Je note que vos positions divergentes m''ont été adressées par écrit. Ce document est classé, il ne
    circule plus, et il ne sera cité par personne. À compter de cette note, le codir a une position unique
    : celle-ci.


    ---


    ## 3. La visite de l''acheteur


    Elle a lieu. Nous ne refusons pas de recevoir un client qui pèse 62 % de notre activité, et nous avons
    besoin de l''information.


    Mais elle change de nature : **ce n''est plus lui qui vient nous exposer ses arguments, c''est nous
    qui lui remettons notre contre-proposition en main propre.**


    - **Un seul porte-parole**, le directeur commercial. Le DAF et le directeur industriel assistent et
    n''interviennent pas sur le fond.

    - **Ordre du jour écrit envoyé la veille.** Aucune décision, aucune signature, aucun engagement verbal
    en séance, y compris conditionnel.

    - Réponse unique à toute pression sur le calendrier : *« Le dossier est instruit, notre proposition
    écrite est celle que vous avez en main, elle est valable jusqu''au 19 août. »*

    - **Ne jamais laisser entendre que le codir est divisé, ni que le DG est injoignable.** La formule
    est : « la direction générale a arrêté sa position, elle est dans ce document. »

    - **Compte rendu écrit sous 24 h**, signé des trois présents, classé au dossier.

    - **Aucun membre du codir ne communique seul avec D**, sur aucun canal, y compris informel. Tout contact
    entrant est redirigé vers le directeur commercial et tracé.


    L''avancement du comité d''achat au 20 août et le délai de huit jours sont un levier de négociation,
    pas une contrainte physique. On y répond en tenant le délai avec une offre sérieuse : cela déplace
    la charge du refus sur D.


    ---


    ## 4. Plan B : à préparer avant le 20 août, pas après


    Le déréférencement de 4 des 8 références est un risque réel. Il doit être chiffré et couvert **avant**
    la séance, pas subi.


    **À produire sous 72 h (DAF + industriel + supply) :**

    - Poids exact des 4 références exposées : CA, marge brute, tonnage, effet sur le plan de charge de
    Redon en trimestre glissant.

    - Point de bascule précis des 70 %, en volume mensuel.

    - **Encours client D et sa couverture.** C''est ma première inquiétude, avant le déréférencement :
    à 45-60 jours, l''encours D est de l''ordre de 1,8 à 2,5 M€, soit plus que notre trésorerie. Un allongement
    de paiement de leur part nous met en tension plus vite que n''importe quelle perte de volume. Vérifier
    immédiatement la couverture assurance-crédit et l''éligibilité d''une ligne d''affacturage sur cet
    encours ; la mettre en place si elle n''existe pas.


    **À lancer immédiatement :**

    - **Marketplace : mise en ligne engagée cette semaine**, sans attendre le 20 août, sur les références
    les plus exposées. Enveloppe autorisée : 80 k€ de frais de lancement.

    - **Centrale régionale : accélération.** Demande formelle d''un accord de principe partiel ou d''une
    commande pilote sous 8 semaines. Vous êtes autorisés à leur offrir une **exclusivité régionale limitée**
    en échange — c''est notre seul actif de négociation restant, et il ne doit surtout pas être cédé à
    D.

    - **Recensement RHD, export et MDD secondaires** sous 15 jours, avec un objectif chiffré à me présenter.

    - **Redon : dossier d''activité partielle constitué et prêt au dépôt sous 48 h, non déposé.** Ne le
    déclenchez pas de façon préventive. Pour couper court au débat : le coût résiduel d''un dispositif
    d''activité partielle sur 52 postes est très inférieur à la destruction de marge de 1,3 M€ par an
    qu''entraînerait la signature. Un semestre difficile à Redon est réversible ; trois ans d''exclusivité
    à perte ne le sont pas.

    - **Rien n''est annoncé à Redon.** Si une rumeur circule, message factuel unique validé par la DRH
    et le directeur industriel, aucune projection, aucun chiffre.


    **Volet juridique (DAF, sous 5 jours) :** mandater notre conseil pour documenter le faisceau — dépendance
    économique installée à 62 %, baisse de 11 % sans préavis au T2, déréférencement de la moitié des références
    conditionné à la signature d''une exclusivité pluriannuelle avec pénalité. Objectif : une lettre-cadre
    prête sur le terrain de la rupture brutale de relations commerciales établies et du déséquilibre significatif.
    **On ne la brandit pas. On l''a.** Si le déréférencement intervient le 20 août, elle part le 21.


    ---


    ## 5. Garde-fous financiers


    Trésorerie de référence : 2,1 M€.


    - Aucun engagement de dépense discrétionnaire supérieur à **100 k€** sans double signature DAF + directeur
    industriel.

    - **Tout capex non encore engagé est suspendu** jusqu''à mon retour.

    - **Seuil d''alerte : 1,6 M€.** S''il est franchi, le DAF déclenche sans attendre : mobilisation de
    l''affacturage, gel des embauches, décalage des paiements fournisseurs non critiques dans les délais
    contractuels, et information immédiate de l''actionnaire de référence.

    - Reporting trésorerie hebdomadaire au codir, tous les vendredis.


    ---


    ## 6. Ce que je n''autorise pas


    - Signer l''exclusivité en l''état, même « améliorée », même sous une autre appellation.

    - Accepter une remise supérieure à 4,5 % ou une durée supérieure à 18 mois.

    - Accepter une pénalité de sortie non symétrique.

    - Fermer, restreindre ou promettre de restreindre la marketplace, la centrale régionale ou tout canal
    alternatif.

    - Communiquer à l''extérieur — clients, fournisseurs, presse, banques — au-delà du reporting normal.

    - Négocier seul avec D, ou faire état d''un désaccord interne.

    - Faire dépendre l''un de ces points de mon indisponibilité. Mon absence ne crée aucun mandat supplémentaire.


    ---


    ## 7. Événement imprévu


    Si survient un fait qui sort du cadre décrit ici — rupture totale par D, défaillance client majeure,
    sinistre industriel — la règle est double : **option la plus conservatrice, et saisine immédiate de
    l''actionnaire de référence**, qui est le seul niveau d''escalade en mon absence. Personne n''a à
    trancher seul une décision structurelle, et personne n''a à attendre mon retour pour la faire trancher.


    ---


    ## 8. Calendrier


    | Date | Action | Responsable |

    |---|---|---|

    | Lun 10/08 | Accusé de réception écrit à D + annonce de notre proposition | Dir. commercial |

    | Lun 10 – mer 12/08 | Chiffrage 4 références, plan de charge, encours D, couverture crédit | DAF
    + industriel |

    | Lun 10/08 | Lancement marketplace + saisine centrale régionale | Dir. commercial |

    | Sem. 10-14/08 | Réunion acheteur D — remise de la contre-proposition | Dir. commercial |

    | Ven 14/08 | Mandat conseil juridique constitué | DAF |

    | Dim 16/08 | Échéance des 8 jours : contre-proposition envoyée en recommandé + mail | DAF |

    | 17-19/08 | Si offre révisée conforme aux 7 critères → signature à l''unanimité. Sinon, rien. | Codir
    |

    | 20/08 | Comité d''achat D | — |

    | 21/08 | Activation du plan B quelle que soit l''issue | Codir |


    ---


    ## 9. À mon retour


    Trois documents m''attendent : le compte rendu de chaque contact avec D ; le chiffrage définitif de
    l''exposition Redon ; l''état d''avancement des deux canaux alternatifs avec un objectif chiffré à
    12 mois.


    Vous exécutez ce document. S''il vous semble incomplet sur un point précis, appliquez l''option la
    plus conservatrice et documentez-la — je ne reprocherai jamais à ce comité d''avoir trop peu engagé
    Verdal en mon absence.


    *Direction générale*

    '
