response:
  text: '## Position de la présidence — répartition de l''étiage de la Vèze


    ---


    ### 1. Ce que je propose


    | Usage | Demande | Semaines 1–2 | Nature |

    |---|---|---|---|

    | Débit réservé aval | 180 L/s | **180 L/s** | Plancher intangible, mesuré à l''aval des prélèvements
    |

    | Eau potable Ferney | 150 L/s | **150 L/s** | Garantie intégrale et écrite, contre obligation d''audit
    à J+10 |

    | Irrigation (34 exploitations) | 240 L/s | **80 L/s**, + jusqu''à 40 L/s de déstockage conditionnel
    | Volume global par usage + tour d''eau nocturne |


    Six décisions :


    1. **180 L/s à l''aval est un plancher, pas une part.** Il est mesuré à l''aval, pas déduit par soustraction,
    et son franchissement deux jours de suite suspend immédiatement et totalement les prélèvements agricoles.

    2. **La régie obtient sa garantie, tout de suite et par écrit** — 150 L/s pendant 14 jours, et un
    socle sanitaire inconditionnel qu''aucune séance ultérieure ne pourra échanger. En contrepartie, elle
    produit sous 10 jours le rendement de son réseau, ses débits nocturnes minimaux et la ventilation
    de ses 150 L/s par catégorie d''abonnés.

    3. **L''irrigation passe à 80 L/s**, en volume global par usage, réparti par tour d''eau entre trois
    groupes, fenêtre 20 h–8 h uniquement, arrosage diurne interdit. Toute exploitation qui n''a pas déclaré
    sous 5 jours sa surface irriguée, ses cultures, ses stades et son matériel n''a pas de dotation.

    4. **Un déstockage encadré de la retenue** peut porter l''irrigation à 120 L/s, à deux conditions
    vérifiées : volume utile confirmé, et maintien d''une réserve suffisante pour tenir 180 L/s à l''aval
    pendant 30 jours sans aucun apport.

    5. **Le mécanisme de levée de 2022 est abrogé** et remplacé (§5).

    6. **Les 600 000 € sont engagés cette semaine**, dont une avance aux maraîchers dans la fenêtre de
    quinze jours du fonds.


    ---


    ### 2. Pourquoi cet ordre


    Les trois pertes en jeu ne sont pas de même nature. Une récolte perdue est une perte grave, chiffrable,
    et rejouable l''an prochain. Une rupture d''eau potable dans une commune de 9 200 habitants avec un
    EHPAD de 110 lits est une atteinte immédiate à des personnes. L''assèchement des deux frayères est,
    selon le rapport du 12 juin, non reconstituable à l''échelle d''une décennie : c''est la seule branche
    du dossier où la commission peut détruire quelque chose qu''elle ne pourra pas racheter.


    Je ne hiérarchise pas des intérêts, je hiérarchise des réversibilités. Le débit réservé relève par
    ailleurs d''un arrêté préfectoral : la commission ne peut pas l''abaisser, et je ne demanderai pas
    au préfet de le faire.


    ---


    ### 3. Les trois chiffres que la commission n''a pas vérifiés


    **410 L/s.** Une station unique, dernier étalonnage 2023. C''est en bas de courbe de tarage que l''incertitude
    relative est la plus forte. Toute la répartition repose sur ce nombre. Je fais réaliser trois jaugeages
    de contrôle sous 8 jours et j''installe une seconde station à l''aval des prélèvements — sinon nous
    continuons à *déduire* le débit réservé au lieu de le *constater*.


    **150 L/s pour 9 200 habitants.** Cela fait 1 409 litres par habitant et par jour. La moyenne française
    tourne autour de 150. Même en retenant un rendement de réseau médiocre (60 %) et un usage non domestique
    généreux, un service de cette taille se situe habituellement entre 25 et 60 L/s. L''écart est d''un
    facteur 2,5 à 6. Il a peut-être une explication — d''autres communes desservies, des abonnés industriels,
    un régime de remplissage de réservoir — mais la commission ne détient aucune pièce l''établissant.
    Ce n''est pas une accusation : c''est la même exigence de justification que celle que j''adresse aux
    maraîchers, et c''est l''endroit du bassin où se trouve peut-être le plus gros gisement de litres
    disponibles sans coût pour personne.


    **240 L/s pour 620 ha.** En agrégat, ce chiffre est cohérent : 3,3 mm/jour sur la totalité de la surface,
    ce qui correspond à une irrigation pleine en août. Ce n''est donc pas une demande gonflée. Ce qu''il
    suppose, en revanche, c''est que les 620 ha aient tous besoin d''une irrigation pleine en même temps,
    ce qui est faux dès lors que les stades végétatifs diffèrent — et la commission n''a aucune donnée
    parcellaire pour en discuter. Deux ratios interrogent : 4,1 M€ pour 620 ha, soit 6 600 €/ha, et 90
    emplois saisonniers pour 620 ha, sont l''un et l''autre bas pour du maraîchage intensif. Cela suggère
    un ensemble hétérogène de systèmes de production. Or un ensemble hétérogène ne peut pas se perdre
    en bloc à un seuil unique : une réduction d''apport dégrade un rendement de façon graduelle, elle
    ne l''annule pas d''un coup. L''affirmation « en dessous de 240, tout est perdu » est la position
    de négociation la plus coûteuse pour ceux qui la portent : si elle était vraie, tout arbitrage intermédiaire
    serait sans valeur pour eux et la commission n''aurait aucune raison de leur arracher 40 L/s de plus
    au détriment de la rivière. Je la tiens pour fausse, et c''est en la tenant pour fausse que je me
    bats pour porter leur dotation le plus haut possible.


    ---


    ### 4. Le partage entre les 34


    Mon règlement m''offre le choix entre quotas individuels et volume global. Je prends les deux, dans
    cet ordre.


    Un quota individuel qu''on ne peut pas mesurer est une fiction qui ne pénalise que ceux qui le respectent
    : il n''existe aucun compteur. Un volume global sans règle de passage est une course que gagne la
    plus grosse pompe — et six exploitations détiennent 300 des 620 ha.


    Donc : **volume global par usage immédiatement, discipliné par un tour d''eau** (trois groupes, rotation,
    fenêtre nocturne obligatoire). Le tour d''eau est contrôlable à l''œil nu, ce qui le rend applicable
    dès jeudi. L''interdiction du diurne n''est pas une punition : elle récupère de l''ordre de 15 à 25
    % de l''eau appliquée aujourd''hui perdue en évaporation. 80 L/s la nuit ne valent pas 80 L/s à quatorze
    heures.


    **Compteurs sur les 34 prises sous 15 jours, financés par le fonds. À J+21, le régime bascule en quotas
    individuels**, au prorata des surfaces irriguées déclarées, avec un minimum par exploitation financé
    par un rabot proportionnel sur les dotations supérieures à la médiane. Une exploitation de 5 ha amputée
    de 67 % disparaît là où une exploitation de 50 ha survit diminuée ; le prorata pur n''est pas neutre.


    ---


    ### 5. Le mécanisme de levée — là où 2022 a échoué


    Le dispositif de 2022 n''a pas échoué par laxisme, il a échoué parce qu''il mesurait la mauvaise grandeur.
    L''orage du 9 août a produit un pic de ruissellement, pas une recharge. Le débit instantané a franchi
    le seuil, la fenêtre de 48 h a validé un événement de surface, la levée était totale et binaire :
    520 L/s le 9, reprise intégrale le 11, 340 L/s le 15.


    Nouveau mécanisme :


    - **Descente rapide, remontée lente.** Un durcissement se déclenche sur une seule journée de mesure.
    Un assouplissement exige **10 jours consécutifs** au-dessus du seuil en moyenne mobile 7 jours.

    - **Levée graduée** : un palier à la fois, jamais deux paliers à moins de 5 jours d''intervalle. Jamais
    de retour direct à la dotation pleine.

    - **Neutralisation des pics d''orage** : une hausse consécutive à un épisode pluvieux de moins de
    48 h ne démarre le compteur qu''une fois le débit revenu à un plateau stable.

    - **Indicateur de recharge** : ajout d''un suivi piézométrique. C''est la nappe, pas la crête de crue,
    qui dit si la ressource se reconstitue.


    « Trois semaines sans pluie prévue » ne veut pas dire « fin de l''étiage dans trois semaines ». Construire
    la répartition sur cette confusion serait refaire l''erreur de 2022, en plus grand.


    ---


    ### 6. Les 600 000 €


    - **80 000 €** — métrologie : jaugeages de contrôle, réfection de la courbe de tarage bas débit, seconde
    station à l''aval.

    - **120 000 €** — 34 compteurs avec télérelève, et campagne de sectorisation / prélocalisation de
    fuites sur le réseau de Ferney.

    - **350 000 €** — compensation aux maraîchers, calculée à l''hectare **effectivement restreint** et
    non à l''hectare déclaré, avec **avance versée dans les quinze jours**, avant la date où se décide
    le sort des cultures.

    - **50 000 €** — réserve d''urgence potable (traitement mobile, citernage prioritaire EHPAD) si le
    tampon de 4 jours est entamé.


    Je le dis sans habillage : 350 000 € contre un préjudice annoncé de 4,1 M€, c''est 8,5 %. Ce fonds
    ne compense pas la perte. Il finance une trésorerie de passage, et il achète les mesures qui feront
    que l''an prochain la commission ne délibérera plus à l''aveugle.


    ---


    ### 7. Ce qui déclenche quoi


    - Débit aval < 180 L/s deux jours consécutifs → **suspension totale et immédiate** des prélèvements
    agricoles.

    - Tampon de la régie < 2 jours → les 40 L/s de déstockage basculent de l''irrigation vers le potable
    sous 24 h.

    - Jaugeage confirmant un débit réel < 360 L/s → réouverture complète du plan en régime de crise ;
    irrigation limitée à la survie des plants.

    - Jaugeage confirmant > 460 L/s, ou litres libérés par l''audit du réseau → **l''intégralité du surplus
    va d''abord à l''irrigation**, par règle écrite et non par nouvelle négociation.


    ---


    ### 8. Ce qui renverserait ma position


    Trois observations, et je les nomme d''avance pour qu''on puisse me les opposer :


    1. Un jaugeage contradictoire écartant le 410 L/s de plus de 10 %.

    2. Un audit établissant un rendement de réseau supérieur à 85 % à Ferney. Mon hypothèse centrale tomberait
    : il n''y aurait pas de gisement caché, l''arbitrage serait réellement 80 L/s pour l''agriculture,
    et la part de compensation devrait alors monter fortement.

    3. Des données parcellaires montrant qu''une part majoritaire des 620 ha se trouve à un stade où une
    réduction de 60 % signifie effectivement perte totale et non perte de rendement.


    ---


    ### 9. Ce que je dis à chacun


    **À la régie.** Vous refusez de discuter avant garantie : vous l''avez, intégrale, écrite, dès jeudi,
    et assortie d''un socle sanitaire que nulle séance future ne pourra échanger. Rien n''est coupé pendant
    l''audit — il est documentaire et instrumental, il ne touche pas à la distribution. Mais 1 409 litres
    par habitant et par jour est un chiffre qui doit être expliqué, et vous avez dix jours pour l''expliquer.
    Si vos pertes sont ce que je crois, vous détenez les litres que tout le monde cherche.


    **Aux maraîchers.** Vous avez quitté la salle ; je vous écris quand même, parce que vous êtes la seule
    partie qui n''a aucune protection juridique dans ce dossier et que c''est vous qui portez la coupe.
    Je ne vous propose pas un vote consultatif : je vous propose une voix délibérative au comité de réattribution,
    et une créance de premier rang, écrite, sur chaque litre libéré par l''audit ou par la correction
    du jaugeage. Vous obtenez une avance financière avant la date de décision culturale, la nuit pour
    irriguer, et la bascule en quotas mesurés qui mettra fin à la course à la pompe. Ce que je vous demande
    en échange, ce sont vos déclarations sous cinq jours. Sans elles, je défends votre dossier avec les
    chiffres de vos adversaires.


    **À la presse et au public.** Le dossier n''est pas « les paysans contre les robinets ». Un tiers
    de la ressource en litige se trouve peut-être sous les rues de Ferney, dans un réseau que personne
    n''a ausculté, et le chiffre sur lequel toute la répartition repose sort d''une station étalonnée
    il y a trois ans. Les deux demandeurs sont soumis exactement au même standard de preuve, et tous deux
    sont financés pour l''apporter.


    ---


    ### 10. L''objection la plus forte contre ma position


    Elle vient des maraîchers, et elle est largement fondée : *« vous nous coupez de 67 %, sur la foi
    d''une hypothèse non vérifiée concernant le réseau d''un tiers, pendant que la régie obtient 100 %
    de sa demande et la rivière 100 % de la sienne. Vous avez fait de la seule partie non protégée la
    variable d''ajustement. »*


    C''est exact. Je ne prétends pas que ce soit équitable. Je soutiens seulement que les deux parts protégées
    le sont pour des raisons d''ordres différents — l''une par la loi et par l''irréversibilité, l''autre
    par la santé publique — et qu''aucune des deux ne se négocie contre une récolte. L''asymétrie est
    réelle : c''est précisément pourquoi elle est assortie d''une avance financière immédiate, d''un droit
    de priorité écrit sur toute eau récupérée, d''un délai contraint de dix jours imposé à la partie la
    mieux protégée, et d''une voix délibérative dans la réattribution. Ce n''est pas une compensation
    à la hauteur de la perte. C''est le maximum que la commission peut transférer sans détruire ce qui
    ne se reconstruit pas.


    Et si l''audit et le jaugeage reviennent tous deux défavorables, je le dirai en séance : il n''y aura
    plus alors que de l''argent et le préfet.

    '
