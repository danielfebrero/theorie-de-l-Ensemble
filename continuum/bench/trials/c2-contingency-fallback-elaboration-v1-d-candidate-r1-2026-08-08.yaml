  text: '# Plan d''exécution — conversion électrique de la flotte

    **Remis au conseil du jeudi 13 août 2026 — Direction de l''exploitation**


    ---


    ## 1. Résumé décisionnel


    La commande est ferme et le plan qui suit ne la remet pas en cause. Il porte sur la seule variable
    encore ouverte : **la séquence de mise en service**.


    Un constat commande tout le reste : **le facteur limitant n''est pas le véhicule, c''est la borne.**
    Les 96 véhicules seront livrés au 31 décembre. Avec 14 bornes, 32 à 38 d''entre eux peuvent être rechargés
    chaque nuit ; avec les 22 bornes prévues au devis, 51 à 60. Faire rouler 96 véhicules électriques
    exige **35 à 41 bornes**, soit un second lot d''environ 13 bornes qui n''est aujourd''hui ni devisé
    ni budgété.


    Cinq décisions sont demandées jeudi. Trois sont urgentes au sens strict : leur report de deux semaines
    coûte des mois.


    | # | Décision | Engagement | Pourquoi jeudi |

    |---|---|---|---|

    | **D1** | Commander les 8 bornes devisées | 210 000 € | 7 semaines de travaux : commande le 14/08
    → service le 2 octobre, juste à temps pour le lot d''octobre |

    | **D2** | Notifier au loueur la prolongation de l''intégralité du parc diesel, libérations lot par
    lot ensuite | ~11 500 €/mois de décalage | Préavis de 30 jours ; sans notification cette semaine,
    des reprises de septembre deviennent irréversibles pour 11 semaines |

    | **D3** | Lancer l''étude du second lot de bornes et du raccordement | ~15 000 € d''étude, décision
    de commande au 15 octobre | Un renforcement de raccordement réseau se compte en mois, pas en semaines
    |

    | **D4** | Adopter la règle d''affectation par kilométrage et ses seuils | néant | Cadre les 24 premiers
    véhicules dès leur mise en service |

    | **D5** | Faire écrire par la Région le critère exact des « 60 véhicules qui roulent » | néant |
    620 000 € dépendent d''un mot non défini |


    Budget additionnel identifié : **≈ 751 000 €** sur septembre–mars, dont 541 000 € hors devis existant
    (détail au § 6). Le coût de ne pas le faire est d''un ordre de grandeur supérieur (§ 5).


    ---


    ## 2. Le constat qui commande le calendrier


    ### 2.1 Le budget d''heures-borne


    Une charge complète prend 6 h [dossier]. Un véhicule qui a parcouru une fraction de son autonomie
    consomme la même fraction de ces 6 h [hypothèse : charge linéaire à 22 kW, conservatrice — la fin
    de charge est en réalité plus lente].


    Fenêtre de recharge retenue : **12 h** (18 h → 6 h) [hypothèse à confirmer par les horaires réels
    de retour et de départ, § 7].


    | Période | Autonomie retenue | Heures-borne pour une tournée moyenne (168 km) | Bornes nécessaires
    pour 96 VE | Capacité de 14 bornes | Capacité de 22 bornes |

    |---|---|---|---|---|---|

    | Sept.–oct. (doux) | 232 km [essai de mars] | 4,3 h | **35** | 38 VE | 60 VE |

    | Nov.–mars (froid) | 197 km [essai à 2 °C] | 5,1 h | **41** | 32 VE | 51 VE |


    Les 22 bornes prévues couvrent environ **la moitié de la flotte commandée**. L''écart n''est pas marginal
    et aucun réglage d''exploitation ne le comble : échelonner les départs pour porter la fenêtre à 14
    h ramène le besoin de 41 à 35 bornes, sans plus.


    ### 2.2 La seconde limite : l''autonomie sur les tournées longues


    L''essai de mars donne 197 km à 2 °C avec chauffage. Les 11 recharges intermédiaires non prévues sur
    120 tournées portaient **toutes** sur des tournées de plus de 190 km — c''est-à-dire à 96 % de l''autonomie
    mesurée. Le signal est net et cohérent.


    Avec une marge de 15 % [hypothèse : la dispersion individuelle — chargement, conduite, trafic — n''est
    pas mesurée par l''essai], le seuil d''affectation devient :


    - **185 km** de septembre à octobre ;

    - **165 km** de novembre à mars.


    La tournée moyenne fait 168 km et la plus longue 240 km. Le seuil d''hiver passe donc **sous la moyenne**
    : une part substantielle des tournées n''est pas électrifiable en l''état du plan de tournées actuel.


    ### 2.3 Conséquence


    Les deux limites plafonnent ensemble autour de **50 à 60 véhicules en service**. Passer au-delà exige
    de lever les deux : plus de bornes **et** une refonte du plan de tournées (ou une charge intermédiaire
    organisée). La cible « 96 véhicules électriques sur 96 tournées » est une décision distincte, à instruire
    au premier trimestre 2027 — pas une conséquence automatique de la commande votée le 4 mai.


    ---


    ## 3. Trajectoire mensuelle


    | Fin de mois | VE livrés (cumul) | Bornes | VE réellement en service | Diesels conservés | Couverture
    des 96 tournées |

    |---|---|---|---|---|---|

    | Sept. | 24 | 14 | 24 | 96 | 120 (volant de rodage) |

    | Oct. | 48 | 22 (au 2/10) | 36 | 72 | 108 |

    | Nov. | 72 | 22 | 48 | 55 | 103 |

    | Déc. | 96 | 22 | 50 | 48 | 98 |

    | Janv. | 96 | 22 | 56–60 | 40 | 96–100 |


    Le volant décroissant (24 → 4) est intentionnel : il absorbe les pannes, la maintenance et l''erreur
    de calibrage tant que le comportement hivernal réel n''est pas mesuré.


    **Subvention régionale.** 72 véhicules seront livrés au 30 novembre, au-delà des 60 requis. Le seuil
    est donc sécurisé si le critère porte sur la livraison ou l''immatriculation. Si le critère est «
    en service opérationnel », l''objectif de 56–60 véhicules en janvier devient tendu et n''est atteignable
    qu''en affectant aux véhicules électriques les 60 tournées les plus courtes et en échelonnant les
    départs. D''où D5 : ce point doit être écrit, pas supposé.


    ---


    ## 4. Les décisions détaillées


    ### D1 — Commander les 8 bornes (210 000 €)

    Commande le 14 août, réception le 2 octobre. **C''est le chemin critique du trimestre.** Chaque semaine
    de retard de commande immobilise directement des véhicules payés : à partir du 1er novembre, une semaine
    de retard = 16 véhicules qui ne peuvent pas rouler.


    Réserve à lever avant signature : le devis inclut-il le renforcement du poste de livraison ? 22 bornes
    à 22 kW appellent 484 kW souscrits, 35 bornes en appellent 770. Si un renforcement de raccordement
    est nécessaire, son délai — plusieurs mois, hors de notre contrôle — devient le vrai chemin critique
    et invalide le calendrier ci-dessus. **C''est le seul risque du dossier que nous ne pouvons ni piloter
    ni compenser.** Vérification à obtenir avant jeudi (§ 7).


    ### D2 — Geler le calendrier de reprise des diesels

    Notification au loueur le **14 août** : prolongation de l''intégralité du parc au mois le mois, libérations
    notifiées lot par lot avec préavis de 30 jours.


    L''asymétrie est décisive. Un mois de prolongation de 24 véhicules coûte **11 520 €**, soit l''équivalent
    de 13 tournées non terminées. Un véhicule rendu à tort n''est pas récupérable avant **11 semaines**
    : sur cette durée, 24 tournées découvertes exposent à plusieurs centaines de milliers d''euros. On
    n''échange pas une exposition à six chiffres contre une économie à quatre chiffres.


    Libérations ensuite conditionnées aux données réelles, pas au calendrier de livraison : premier lot
    libéré le 15 septembre après deux semaines d''exploitation vérifiée, reprise le 15 octobre.


    ### D3 — Instruire le second lot de bornes

    Étude de dimensionnement et de raccordement lancée immédiatement, sur trois options à comparer :

    1. **13 bornes 22 kW supplémentaires** — ≈ 341 000 € [estimation au prorata du devis existant, 26
    250 €/borne] ;

    2. **bornes DC de puissance supérieure** — un point de charge à 50 kW remplace 2,3 points à 22 kW
    ; à vérifier auprès du constructeur que les véhicules commandés acceptent la charge continue, donnée
    que nous n''avons pas ;

    3. **charge de journée sur point relais** pour les tournées longues, qui traite simultanément la limite
    d''autonomie.


    Décision de commande au **15 octobre**, sur la base de six semaines d''exploitation réelle et non
    de l''essai de mars.


    ### D4 — Règle d''affectation et pilotage

    Les véhicules électriques sont affectés aux tournées **par ordre croissant de kilométrage**, jamais
    par plateforme ni par ancienneté de chauffeur. Aucune tournée dépassant le seuil de la période n''est
    affectée à un véhicule électrique sans dérogation écrite de l''exploitation.


    Le superviseur de flotte (état de charge et kilométrage toutes les 10 min) et le tableau de bord du
    soir fournissent déjà tout le pilotage nécessaire. Trois indicateurs, revus chaque matin :


    | Indicateur | Seuil d''alerte | Action |

    |---|---|---|

    | Recharges non prévues sur véhicules électriques, 5 jours glissants | > 5 % des tournées VE | Abaisser
    le seuil d''affectation de 10 km |

    | Taux de tournées terminées, périmètre VE, 5 jours glissants | < 98 % | Geler la libération du lot
    diesel suivant |

    | Tournée VE non terminée pour cause d''énergie | 1 occurrence | Analyse sous 24 h, tournée reversée
    au diesel jusqu''à conclusion |


    Repère : l''essai de mars affichait 9,2 % de recharges intermédiaires **sans aucune tournée non terminée**.
    Une recharge non prévue coûte du temps ; c''est un signal, pas un incident. Les 900 € se déclenchent
    au non-achèvement, et c''est cette ligne-là qu''on protège.


    **Association des chauffeurs.** Le plan crée deux régimes de conduite et fait porter aux conducteurs
    de véhicules électriques le risque de panne d''énergie. Deux engagements, à annoncer en même temps
    que le plan :

    - les seuils d''affectation sont révisés mensuellement **avec** les représentants des conducteurs,
    qui disposent d''un droit de proposition sur leur valeur — ils détiennent l''information que le superviseur
    ne remonte pas (usage du chauffage, arrêts, chargement) ;

    - aucune tournée non terminée pour cause d''énergie n''est imputée au conducteur, sans exception.


    ### D5 — Faire écrire le critère de subvention

    Demande écrite à la Région avant le 20 août sur la définition de « 60 véhicules qui roulent avant
    le 31 janvier » : livrés, immatriculés, assurés, ou en exploitation effective ? Coût nul, enjeu 620
    000 €. Tant que la réponse n''est pas écrite, nous dimensionnons sur l''interprétation la plus exigeante.


    ---


    ## 5. Le pire cas, qui l''encaisse, et le repli


    **Pire cas du plan proposé.** Les 8 bornes glissent de six semaines (aléa de travaux ou raccordement).
    Le lot d''octobre reste partiellement immobilisé, ~12 véhicules dorment jusqu''à mi-novembre. Coût
    : la prolongation de 12 diesels supplémentaires pendant deux mois, **11 520 €**, plus le capital immobilisé.
    Aucune tournée n''est manquée. **C''est l''exploitation qui l''encaisse, en charge de travail, pas
    le client.**


    **Pire cas du plan alternatif** — rendre les diesels au rythme des livraisons, comme prévu initialement.
    À partir de décembre, 96 véhicules électriques face à une capacité de charge de 51 : environ 45 véhicules
    partent chaque jour insuffisamment chargés ou ne partent pas. À 900 € la tournée non terminée et 21
    jours ouvrés : **jusqu''à 850 000 € par mois**, encaissés par les clients d''abord, par le compte
    d''exploitation ensuite, et par la crédibilité de la conversion en dernier. Les diesels ne sont pas
    récupérables avant 11 semaines. C''est cette branche-là qui est irrécupérable, et c''est pour l''éviter
    que D2 est urgente.


    **Déclencheur de repli, chiffré.** Si le taux de tournées terminées sur le périmètre électrique passe
    sous 98 % sur 5 jours glissants, ou si deux tournées non terminées pour cause d''énergie surviennent
    dans la même semaine : gel immédiat de la libération du lot diesel suivant, retour des tournées concernées
    au diesel, et révision des seuils avant toute nouvelle affectation. La reprise se fait sur décision
    explicite de l''exploitation, jamais automatiquement au terme d''un délai.


    **Le meilleur argument contre ce plan.** « Vous surestimez le problème. L''essai ne montre que 9 %
    de recharges intermédiaires, uniquement au-delà de 190 km, et aucune tournée manquée. Interdisez les
    tournées longues aux véhicules électriques et le sujet disparaît — sans second lot de bornes. »


    Il traite l''autonomie, et sur ce point il a raison. Il ne traite pas la charge, et c''est là qu''il
    casse : même en supposant que les 96 tournées soient toutes ramenées à 120 km, chacune consomme 3,7
    h de borne en hiver, soit 355 h pour la flotte, contre 264 h disponibles avec 22 bornes. **La contrainte
    de charge tient même dans l''hypothèse la plus favorable que l''objection puisse construire** — et
    cette hypothèse est de toute façon exclue, la moyenne étant de 168 km. L''objection reste néanmoins
    utile sur un point : elle justifie de retarder la commande du second lot au 15 octobre plutôt que
    de l''engager jeudi, le temps que six semaines de données réelles remplacent l''essai de mars.


    **L''observation qui renverserait ce plan.** Si l''exploitation de septembre montre, sur les 24 premiers
    véhicules, une consommation d''heures-borne inférieure de plus de 20 % au modèle du § 2.1 — parce
    que la charge à 22 kW est plus rapide qu''estimée, ou parce que les véhicules rentrent avec plus de
    réserve que prévu — alors 22 bornes suffisent à 65-70 véhicules et le second lot devient discutable.
    Cette mesure est disponible dès le 30 septembre, sans instrumentation nouvelle : le superviseur de
    flotte remonte déjà l''état de charge toutes les 10 minutes. Le contrôle est donc programmé avant
    la décision qu''il pourrait annuler.


    ---


    ## 6. Budget additionnel


    | Poste | Montant | Statut |

    |---|---|---|

    | 8 bornes | 210 000 € | Devisé, à engager le 14/08 |

    | Second lot ≈ 13 bornes | ≈ 341 000 € | Estimé, décision au 15/10 |

    | Prolongation location diesel, sept.–mars (≈ 420 véhicules-mois à 480 €) | ≈ 201 600 € | Estimé,
    ajustable au mois |

    | **Total** | **≈ 752 600 €** | dont **≈ 542 600 €** non budgétés |


    Contreparties : subvention de 620 000 € sécurisée, et évitement d''une exposition mensuelle à six
    chiffres sur les tournées non terminées.


    ---


    ## 7. Ce qui reste ouvert — six réponses attendues avant ou en séance


    1. **Distribution des longueurs des 96 tournées** (nombre de tournées par tranche de 20 km). Disponible
    en interne, coût nul, délai 48 h. C''est la donnée qui transforme tous les « environ » de ce document
    en chiffres fermes. *Demandée au responsable transport ce jour.*

    2. **Le devis de 210 000 € couvre-t-il le renforcement du raccordement ?** Puissance actuellement
    disponible sur chaque plateforme ? *Réponse exigée avant le vote D1.*

    3. **Critère exact de la subvention régionale** (D5).

    4. **Horaires réels de retour et de départ** par plateforme — la fenêtre de charge de 12 h est une
    hypothèse ; chaque heure gagnée vaut 8 % de capacité.

    5. **Les véhicules commandés acceptent-ils la charge continue, et à quelle puissance ?** Détermine
    si l''option 2 du D3 divise le coût du second lot.

    6. **Effectif de conduite disponible** si un redécoupage du plan de tournées est envisagé au T1 2027
    — un redécoupage résout l''autonomie, pas la charge, et coûte des chauffeurs.


    ---


    ## 8. Première action


    **Lundi 10 août, 9 h** : envoi au loueur de la notification de prolongation de l''intégralité du parc
    diesel au mois le mois, libérations à notifier lot par lot avec préavis de 30 jours.


    Cette action est engagée avant le conseil, sous ma responsabilité. Elle est réversible dans le sens
    utile — nous pouvons toujours rendre des véhicules plus tard — alors que son absence rend irréversibles,
    pour 11 semaines, des reprises de septembre déjà en cours de programmation. Son coût maximal si le
    conseil arbitre différemment jeudi est d''un mois de location sur les lots concernés.


    ---


    *Réserve de méthode : les chiffres de capacité de charge de ce document reposent sur un modèle de
    charge linéaire à partir des seules données du dossier (6 h pour une charge complète, autonomies mesurées
    en mars). Ils seront remplacés par les mesures réelles du superviseur de flotte au 30 septembre, avant
    toute décision d''engagement du second lot.*

    '
