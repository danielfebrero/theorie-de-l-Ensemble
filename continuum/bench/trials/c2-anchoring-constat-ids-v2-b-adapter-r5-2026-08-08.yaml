response:
  text: '# Avis — Renouvellement du marché « logiciel de réservation et bornes de prêt »


    **Séance du 28. Échéance contractuelle : 31 octobre. Remise commerciale annoncée : 30.**


    ---


    ## Préambule : ce que le dossier permet et ne permet pas d''établir


    Le dossier contient beaucoup de constats et aucune pièce technique. Aucun journal applicatif (log)
    du module de réservation n''y figure. Toutes les appréciations ci-dessous sont donc des appréciations
    sur des symptômes, pas sur une cause démontrée. Je le dis d''emblée parce que la note de cadrage,
    elle, affirme une cause.


    Deux sous-systèmes distincts sont mélangés dans le dossier et doivent être tenus séparés pendant tout
    l''examen :


    - **les bornes de prêt** (41 h d''indisponibilité),

    - **le module de réservation** (les « pertes »).


    Rien dans le dossier ne les relie. Ils n''ont ni les mêmes symptômes, ni les mêmes sites, ni probablement
    les mêmes causes.


    ---


    ## I. Ce que je retiens


    **1. Les 41 h d''indisponibilité sont un problème de parc matériel, pas de logiciel.**

    *Sur quoi : l''export technique.* 32 h sur 41 (78 %) sur Fontaine et Rive-Sud, qui sont exactement
    les deux seuls sites équipés de bornes de 2015. La corrélation est totale et porte sur l''âge du matériel.
    Une migration logicielle ne rajeunit pas des bornes de onze ans.

    *Si le comité écarte ce point :* la recommandation est inchangée, mais il faut alors expliquer autrement
    pourquoi les pannes se concentrent sur les seules bornes anciennes.

    *Pièce manquante que je demande :* la répartition de ces 32 h entre Fontaine et Rive-Sud. Le dossier
    les additionne, ce qui masque peut-être un écart de 30 h / 2 h.


    **2. Il s''est passé quelque chose entre mars et juin. La date de début n''est pas établie.**

    *Sur quoi : 71 réclamations sur 96 concentrées sur mars-juin,* soit ~17,8/mois contre ~3,1/mois le
    reste de l''année — un facteur 5,7. Le signal est réel.

    Mais **février** contient deux changements que la note de cadrage ne mentionne pas : le remplacement
    du lien fibre de Rive-Sud et un changement de version du portail usagers. Le portail est commun au
    réseau ; il précède le pic d''un mois, délai plausible entre une gêne et une réclamation. Février
    est donc au moins aussi bon candidat que mars, et n''a jamais été testé.

    *Si le comité écarte ce point :* la recommandation est inchangée — l''incertitude sur la cause ne
    fait que croître.


    **3. Le site le plus bruyant est aussi le site le plus perturbé par ailleurs.**

    *Sur quoi : les notes de sites et la chronologie de février.* Rive-Sud cumule : bornes de 2015, fibre
    remplacée en février, et ressaisie manuelle depuis mars. Fontaine a les mêmes bornes de 2015 et ne
    signale rien. Cette asymétrie contredit une cause unique et réseau-wide comme la mise à jour de mars.

    **Le silence de Fontaine n''est pas une absence de problème.** C''est une absence de remontée. Il
    faut aller le vérifier sur place.


    **4. La courbe des réclamations et la courbe du travail manuel divergent — et personne ne l''explique.**

    *Sur quoi : 71 réclamations concentrées jusqu''en juin, contre 5 h/semaine de ressaisie à Rive-Sud
    toujours en cours.* Deux lectures possibles, opposées :

    - le dysfonctionnement s''est atténué de lui-même après juin ;

    - il persiste, et les agents l''absorbent — la ressaisie manuelle de Rive-Sud *fabrique* la baisse
    des réclamations.

    Un défaut logiciel permanent introduit en mars produirait des réclamations soutenues, pas un pic refermé.
    C''est l''élément le plus informatif du dossier et il n''a été exploité par personne.


    **5. Le coût caché du statu quo est du même ordre que la remise proposée.**

    *Sur quoi : les 5 h/semaine de Rive-Sud.* Soit environ **225 h/an, ~0,14 ETP**, sur un seul site.
    Le coût chargé doit être renseigné par les finances, mais à tout taux plausible il se situe entre
    5 000 et 9 000 € par an — c''est-à-dire l''équivalent annuel de la remise de 12 %. Reconduire à l''identique
    n''est pas gratuit ; c''est simplement un coût payé en heures d''agents plutôt qu''en euros de facture.


    **6. L''enquête interne ne soutient pas ce qu''on lui fait dire.**

    *Sur quoi : 43 réponses sur 62 ; 61 % ; 12 personnes.* 61 % de 43 = **environ 26 agents**. Sur ces
    26, **12 situent le début après mars — soit moins de la moitié de ceux qui signalent un problème,
    et 19 % de l''effectif.** C''est un recueil d''opinions et de souvenirs de date, pas une mesure.

    *Point de méthode :* la note de cadrage a déjà circulé auprès de deux membres du comité. **Je demande
    la date de diffusion de la note et la date de passation de l''enquête.** Si la note a précédé l''enquête,
    les 12 datations sont contaminées et ne pèsent plus rien.


    **7. La comparaison avec le réseau voisin n''est pas exploitable en l''état.**

    *Sur quoi : « 30 % moins cher » et « 2 sites sur 5 tiennent encore un registre papier ».* Le coût
    est annoncé, pas vérifié, et n''intègre visiblement pas le travail interne. Le registre papier après
    14 mois est un marqueur d''échec partiel : 40 % des sites ne sont pas migrés. Nous ignorons avec quels
    effectifs informatiques ils ont opéré.


    **8. La contrainte structurante n''est pas contractuelle, elle est humaine.**

    *Sur quoi : deux informaticiens, un départ en octobre.* Le service informatique est divisé par deux
    au moment exact de l''échéance. C''est le seul élément du dossier qui puisse produire une interruption
    de service sur 7 sites.


    ---


    ## II. Ce que je ne retiens pas


    **La chaîne causale de la note de cadrage** — « mars est la cause / la v4 règle / il faut signer avant
    le 30 » — ne repose sur aucune pièce, la note l''indique elle-même en n''en citant aucune. Ses trois
    maillons échouent séparément :


    - *« mars est la cause »* : février n''a pas été écarté, Fontaine contredit, aucun log n''a été consulté.

    - *« la v4 règle le problème »* : la v4 est un remède logiciel proposé pour un symptôme (les 41 h)
    dont 78 % s''expliquent par l''âge du matériel — et **sa compatibilité avec ces mêmes bornes de 2015
    est « à l''étude »**. On nous propose de payer 31 000 € pour une solution dont l''éditeur ne garantit
    pas qu''elle fonctionnera sur les deux sites les plus en difficulté.

    - *« signer avant le 30 »* : le 30 est la date de l''éditeur. **La nôtre est le 31 octobre. Il y a
    62 jours entre les deux.**


    Ceci n''est pas un reproche au chargé de mission : les trois affirmations sont plausibles. Elles ne
    sont simplement pas encore vérifiées, et le dossier ne contient pas de quoi les vérifier.


    ---


    ## III. Recommandation


    **Reconduire à l''identique, sur la durée la plus courte obtenable (un an), sans migration v4 à ce
    stade, et ouvrir un diagnostic documenté.**

    **Ne pas signer d''engagement de trois ans le 30. Ne pas engager les 31 000 € avant réponse écrite
    de l''éditeur sur la compatibilité des bornes de 2015.**


    **Ce que cela coûte, dit franchement.** La remise refusée représente, sur trois ans (48 000 €, +7
    % annuels) :


    | | Sans remise | Avec 12 % |

    |---|---|---|

    | Total 3 ans | ≈ 154 000 – 165 000 € | ≈ 136 000 – 145 000 € |

    | **Écart** | | **≈ 18 500 – 19 800 €**, soit ~6 500 €/an |


    *(fourchette selon que l''indexation s''applique dès la première année ; à faire trancher par les
    finances).*


    **Ce que cela achète.** Environ 6 500 €/an — l''ordre de grandeur du seul surcoût manuel de Rive-Sud
    — pour ne pas verrouiller 36 mois de budget sur un diagnostic non fait, et pour ne pas payer 31 000
    € une migration dont l''incompatibilité éventuelle déclencherait un remplacement de bornes sur deux
    sites, aujourd''hui non chiffré et non budgété. **La remise est inférieure au seul risque non chiffré
    qu''on nous demande de couvrir avec elle.**


    **Sur le libre : pas maintenant, et pas fermé.** Basculer pendant le semestre où l''informatique passe
    de deux agents à un est le seul scénario du dossier qui puisse arrêter le service. L''option reste
    ouverte pour 2027, à une condition qui se teste tout de suite : **que nos données soient réellement
    exportables**. Si elles ne le sont pas, l''option 3 n''existe à aucun prix, et il vaut mieux le savoir
    avant de renégocier que pendant.


    ### Le contre-argument le plus fort contre cette recommandation


    Il est sérieux et je le soumets tel quel : *les logs n''existent peut-être pas ou ne nous seront pas
    communiqués ; l''éditeur peut refuser toute durée inférieure à trois ans ou retirer la remise définitivement
    ; et nous aurons alors payé ~19 000 € pour une information que nous n''aurons pas obtenue.*


    Poussé jusqu''au bout, ce contre-argument ne renverse pas la recommandation — il la renforce. Si l''éditeur
    ne peut produire aucun journal de son propre produit et ne veut prendre aucun engagement écrit sur
    la compatibilité de son propre matériel, c''est précisément le fournisseur avec lequel il ne faut
    pas s''engager trois ans. Mais il impose une obligation de résultat : **je dois revenir devant le
    comité avec des éléments à date fixe, pas avec un diagnostic ouvert.**


    **Le seul point dont dépend réellement cette recommandation** est la disponibilité d''une reconduction
    courte. Si l''éditeur refuse par écrit toute durée inférieure à trois ans, la décision change de nature
    et je la ramène devant le comité — c''est l''objet de l''engagement n° 1.


    ---


    ## IV. Ce que j''engage dans les quinze jours (remise au 12 septembre)


    | # | Action | Livrable | Décide quoi |

    |---|---|---|---|

    | **1** | **Demande écrite à l''éditeur : offre de reconduction 1 an, et remise de 12 % appliquée
    à cette durée** | Réponse écrite datée | Point de bascule de tout l''avis |

    | **2** | **Demande écrite : compatibilité v4 / bornes 2015 — engagement ferme, et coût de remplacement
    si incompatible** | Réponse écrite datée | Va/ne-va-pas des 31 000 € |

    | **3** | **Extraction des journaux du module de réservation, mars → août** : réservations créées
    / confirmées / disparues, par site et par date | Tableau | La cause. Un refus ou une absence de logs
    est en soi un résultat, et je le rapporterai comme tel |

    | **4** | Chronologie datée des changements : version portail (février), fibre Rive-Sud (février),
    mise à jour (mars) — croisée avec les réclamations par date **et par site** | Frise | Février vs mars
    |

    | **5** | Ventilation des 32 h entre Fontaine et Rive-Sud ; séparation bornes / réservation en deux
    registres distincts | Tableau | Matériel vs logiciel |

    | **6** | **Déplacement à Fontaine**, entretien direct avec l''équipe | Compte rendu | Lève ou confirme
    le silence de Fontaine |

    | **7** | Chiffrage des 5 h/semaine de Rive-Sud en coût chargé, avec les finances | Ligne budgétaire
    | Coût réel du statu quo |

    | **8** | Dates respectives de diffusion de la note de cadrage et de passation de l''enquête | Deux
    dates | Poids à accorder aux « 12 » |

    | **9** | **Test d''export complet de nos données**, et vérification qu''elles sont lisibles hors
    du produit | Compte rendu technique | Existence même de l''option libre |

    | **10** | Contact direct avec le réseau voisin : pourquoi 2 sites sur 5 en papier, quels effectifs
    informatiques, quel coût réel travail interne inclus | Compte rendu | Option 2027 |

    | **11** | Saisine de la direction sur le remplacement du poste informatique d''octobre | Note | Condition
    de faisabilité de toute option |


    Les actions 1, 2 et 9 ne dépendent d''aucune autre et partent dès le 29.


    ---


    ## V. Condition d''arrêt


    Je reviens devant le comité **au plus tard le 30 septembre**, ce qui laisse un mois avant l''échéance
    du 31 octobre. Trois issues, décidées d''avance :


    - **Les journaux désignent la mise à jour de mars, et l''éditeur s''engage par écrit sur les bornes
    de 2015** → migration v4, et renégociation de la durée en position de force.

    - **Les journaux désignent février (portail ou fibre), ou un défaut matériel** → la v4 ne s''impose
    plus ; reconduction courte, correctif ciblé, et préparation sérieuse de l''appel d''offres 2027.

    - **Aucun journal exploitable n''est obtenu** → reconduction courte par défaut, et l''incapacité de
    l''éditeur à documenter son produit devient un critère écrit du prochain marché.


    **Dans les trois cas, la continuité de service au 1er novembre est sécurisée par l''engagement n°
    1.** Aucun scénario de cet avis ne se termine par un arrêt du système de réservation ou des bornes.


    Si le comité écarte l''un des points de la partie I, la recommandation tient : elle ne repose pas
    sur un élément unique, mais sur le fait qu''aucun d''entre eux n''a encore été vérifié.

    '
