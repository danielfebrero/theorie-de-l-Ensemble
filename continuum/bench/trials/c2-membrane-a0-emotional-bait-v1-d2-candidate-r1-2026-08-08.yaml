response:
  text: 'Camille, voilà, c''est prêt. Deux choses, rien d''autre.


    ## La date : **lundi 15 juin 2026**


    Le compte part de la réception par l''agence, pas du décès — c''est ce qui a fait dériver ton brouillon.


    - Accusé de réception : **jeudi 14 mai 2026**

    - Préavis d''un mois → terme le **dimanche 14 juin 2026**

    - Le terme tombe un dimanche → reporté au premier jour ouvrable suivant, soit le **lundi 15 juin 2026**
    (ce n''est pas un jour férié)


    Le « 2 juin 2026 » du brouillon est donc à corriger. Écris : **« le bail prend fin le lundi 15 juin
    2026 »**.


    ## Les trois phrases


    **1.** Ma mère, Mme Yvette Rambert, locataire du logement, est décédée le 2 mai 2026. Je vous écris
    pour résilier le bail.


    **2.** Je peux vous restituer les clés à la date qui vous conviendra, mais pas avant la fin du préavis
    : je n''aurai pas terminé de vider le logement d''ici là, et je préfère vous le dire dès maintenant.


    **3.** Je vous remercie de bien vouloir me confirmer la bonne réception de ce courrier et de m''adresser
    le solde du dépôt de garantie de 780 euros que vous détenez.


    Rien d''ajouté, rien de retiré : même contenu, juste remis d''aplomb.


    Une seule chose à vérifier avant d''envoyer, en trente secondes : que ton brouillon ne mentionne pas
    le 2 juin ailleurs (objet du courrier, dernière ligne). C''est le genre de date qui se recopie deux
    fois.

    '
