response:
  text: '# Avis sur le renouvellement du contrat logiciel de réservation et bornes de prêt


    **Pour le comité de direction du 28 — échéance contractuelle 31 octobre**


    Une remarque de méthode d''abord : le dossier transmis mélange deux pannes qui n''ont ni la même cause,
    ni le même calendrier, ni le même budget. Tout l''avis qui suit repose sur ce découpage. Les constats
    sont numérotés pour que le comité puisse en écarter un sans avoir à reprendre les autres ; chacun
    indique sur quoi il repose, ce qui le renverserait, et ce qui tombe avec lui.


    ---


    ## 1. Ce que le dossier établit


    **C1 — Il y a deux dossiers, pas un.** L''indisponibilité des bornes suit l''âge du matériel (32 h
    sur les deux seuls sites équipés en 2015). La perte de réservations suit une date de mise à jour logicielle
    (mars). Ce sont deux problèmes indépendants qui n''appellent ni la même décision ni la même ligne
    budgétaire.

    *Repose sur :* export technique + notes de sites.

    *Serait renversé par :* un export montrant des indisponibilités de bornes corrélées à la version logicielle
    plutôt qu''aux deux sites de 2015.

    *Si le comité l''écarte :* tout le reste de l''avis est à reprendre — c''est le seul constat porteur.


    **C2 — La panne matérielle est concentrée et mesurée.** 16 h d''indisponibilité par site sur Fontaine
    et Rive-Sud, contre 1,8 h par site ailleurs — un facteur 9. C''est une fin de vie de matériel de 2015,
    pas un problème de contrat.

    *Serait renversé par :* un artefact de comptage (amplitude horaire ou fréquentation très supérieures
    sur ces deux sites).

    *Si le comité l''écarte :* seule la ligne « bornes » tombe ; les constats logiciels tiennent.


    **C3 — La régression de mars est probable, mais elle n''est pas mesurée.** Trois signaux indépendants
    convergent : 71 réclamations sur 96 concentrées sur mars–juin (soit 17,8/mois contre 3,1/mois le reste
    de l''année), 12 répondants qui datent le début du problème après mars, et Rive-Sud qui ressaisit
    à la main depuis mars. Aucun des trois n''est une mesure : ce sont trois traces d''un même ressenti.

    *Serait renversé par :* une extraction des journaux serveur montrant un taux de réservations perdues
    identique avant et après mars.

    *Si le comité l''écarte :* la reconduction à trois ans redevient défendable et le dossier se réduit
    au matériel.


    **C4 — Le chiffre de 61 % ne dit pas ce qu''on lui fait dire.** 61 % de 43 réponses, c''est 26 personnes,
    soit 42 % de l''effectif ; 19 agents n''ont pas répondu et on ignore pourquoi. Et sur ces 26, 12 seulement
    situent le début après mars. Le chiffre mesure une déclaration, pas un incident. Il ne doit pas être
    présenté en séance comme « 61 % des agents ».

    *Portée limitée :* écarter C4 n''affaiblit pas C3, dont l''appui le plus solide est la courbe des
    réclamations usagers, indépendante de l''enquête.


    **C5 — Fontaine est le point aveugle du dossier.** Même matériel, même logiciel, même mise à jour
    de mars que Rive-Sud — et rien de signalé. Deux lectures incompatibles restent ouvertes : ou le défaut
    est local à Rive-Sud (configuration, pratique de saisie), ou Fontaine ne le remonte pas. Le dossier
    n''en écarte aucune. C''est aussi la vérification la moins chère de tout le dossier : une visite,
    une question.

    *Enjeu :* si Fontaine confirme le défaut, la régression est systémique et devient un levier contractuel.
    Si Fontaine est réellement indemne après vérification directe, le problème est local — et la migration
    v4 ne le corrigera pas.


    **C6 — La baisse des réclamations après juin n''est pas une guérison.** Rive-Sud absorbe environ 5
    h par semaine de ressaisie manuelle depuis mars. Un défaut compensé par du travail humain cesse de
    produire des réclamations sans cesser d''exister. Ce travail ne figure nulle part dans les 48 000
    € : environ 260 h par an sur un seul site, soit à peu près 0,15 ETP. En ordre de grandeur — hypothèse
    de 25 €/h chargés, à corriger par les RH — c''est de l''ordre de 6 500 €/an, c''est-à-dire à peu près
    le montant de la remise qu''on nous propose.


    **C7 — La remise de 12 % est plus petite qu''elle n''en a l''air, et tombe au pire moment.** Base
    indexée : 48 000 × 1,07 = 51 360 €. Moins 12 % : environ 45 200 €, soit **−5,8 % par rapport au prix
    payé aujourd''hui**, pas −12 %. Le dossier ne précise pas si l''indexation continue de s''appliquer
    les années 2 et 3 : en l''état, l''économie sur trois ans **n''est pas calculable**. Et si « le 30
    » désigne bien le 30 du mois de la séance, la fenêtre se referme deux jours après le comité — avant
    que la compatibilité v4 et la cause de mars ne soient établies. Signer, ce serait acheter trois ans
    au moment exact de notre ignorance maximale.


    **C8 — Les 31 000 € de la migration v4 sont un plancher, pas un prix.** Tant que la compatibilité
    avec les bornes de 2015 est « à l''étude », il faut lire : 31 000 € **plus, le cas échéant, le remplacement
    des bornes de Fontaine et Rive-Sud**, non chiffré au dossier.


    **C9 — Le calendrier informatique ferme la bascule vers le libre — cette année.** Nous passons de
    2 à 1 agent en octobre, mois même de l''échéance, sur 7 sites. Le réseau voisin, avec 5 sites, a encore
    2 sites sur registre papier **après 14 mois** : une migration inachevée à 40 %, conduite avec des
    moyens que nous n''aurons pas. Le « 30 % moins cher » est annoncé, non vérifié, et n''intègre ni le
    coût de migration ni ce papier parallèle — le même coût caché qu''à Rive-Sud (C6).

    *À noter :* ce n''est pas un jugement sur la solution libre. C''est un jugement sur octobre.


    ---


    ## 2. Ce que je recommande


    **Ne pas signer les trois ans avant le 30.** Le dossier ne contient aujourd''hui aucun élément qui
    rende ce choix informé, et l''écart de prix en jeu (~6 000 €/an) est plus petit que ce qu''on s''engagerait
    à ignorer.


    Concrètement, trois décisions distinctes, à voter séparément :


    **a) Contrat logiciel — reconduction courte et conditionnée.** Demander à l''éditeur une reconduction
    de 12 à 18 mois au tarif courant, assortie de deux conditions **écrites** : une déclaration de compatibilité
    de v4 avec les bornes de 2015, avec remède contractuel si elle se révèle fausse ; et une analyse par
    l''éditeur de la régression de mars, sur la base des journaux que nous lui fournirons. Objectif :
    sortir la décision structurante du trou de capacité d''octobre.


    **b) Migration v4 — ne rien engager.** Les 31 000 € restent gelés tant que la compatibilité n''est
    pas écrite (C8).


    **c) Bornes de 2015 — ligne séparée.** Fin de vie de matériel sur deux sites, à chiffrer et arbitrer
    sur son propre budget, indépendamment du contrat logiciel. Ne pas laisser cette dépense servir d''argument
    dans la négociation logicielle, ni l''inverse.


    **Et la solution libre ?** Elle est écartée pour octobre, pas écartée tout court. La reconduction
    courte sert précisément à l''instruire pour de bon — avec une visite du réseau voisin et un chiffrage
    en ETP, pas en pourcentage annoncé.


    ---


    ## 3. Le meilleur argument contre cet avis


    *« Vous payez pour attendre. La reconduction courte perd la remise, conserve un produit défectueux,
    et repousse la vraie décision à un moment où nous aurons toujours un seul informaticien et moins de
    levier. L''éditeur peut refuser une durée courte, ou la tarifer au prix fort. Et le contrat expirant
    de toute façon le 31 octobre, c''est maintenant le moment naturel de basculer. »*


    Il tient sur un point : **le risque que l''éditeur refuse toute durée inférieure à trois ans est réel**,
    et le repli ci-dessous existe pour cela. Il ne fait pas basculer la décision, parce que la branche
    « basculer maintenant » est fermée par C9 — pas par une préférence, par un effectif — et parce que
    l''économie discutée (~18 000 € sur trois ans, et encore, non calculable en l''état) est inférieure
    à l''exposition d''un engagement triennal pris avant de savoir si v4 pilote nos bornes.


    ---


    ## 4. Ce qui renverserait cet avis


    Un seul résultat, testable en quinze jours : **si l''extraction des journaux ne montre aucune perte
    de réservations côté serveur, et si Fontaine confirme en direct n''avoir aucune ressaisie manuelle**,
    alors la régression de mars n''existe pas comme défaut produit, le problème est local à Rive-Sud,
    et la reconduction de trois ans à 12 % redevient le choix raisonnable. Je le dis dans cet ordre volontairement
    : c''est le test qui commande, pas l''avis.


    **Repli, si l''éditeur refuse par écrit toute durée inférieure à trois ans** : signer les trois ans
    avec la remise, **mais** en exigeant l''insertion de la clause de compatibilité avec remède et d''une
    faculté de résiliation annuelle. À défaut de faculté de résiliation, ne pas engager les 31 000 € de
    v4 dans le même acte. **Second repli, si l''éditeur ne répond pas d''ici la mi-octobre** : reconduction
    à l''identique pour 12 mois, remise perdue — la continuité du service prime, et 6 000 € ne valent
    pas un trou de service sur 7 sites avec un informaticien.


    ---


    ## 5. Ce que j''engage dans les quinze jours


    **Immédiatement, avant le 30 (deux jours) :** demander par écrit au commercial la **prorogation de
    60 jours de la validité de la remise**, le temps d''instruire la compatibilité v4. Cela ne coûte rien
    et c''est en soi un test : un refus de proroger de 60 jours une remise sur un engagement de trois
    ans est une information sur la nature de l''offre.


    | # | Action | Livrable attendu | Échéance |

    |---|---|---|---|

    | 1 | Extraction des journaux serveur : réservations créées / honorées sur 12 mois glissants, comparaison
    avant / après la mise à jour de mars | Un tableau, un taux | J+10 |

    | 2 | Fontaine : entretien direct sur site, pas questionnaire. Question unique — ressaisissez-vous
    des réservations à la main ? | Une réponse écrite, datée | J+5 |

    | 3 | Rive-Sud : relevé daté des ressaisies sur deux semaines (nombre, durée, type d''incident) |
    La mesure du coût caché, et la pièce à charge à transmettre à l''éditeur | J+14 |

    | 4 | Lettre à l''éditeur : compatibilité v4 / bornes 2015 + proposition de reconduction courte |
    Réponse écrite (son absence est également une information) | J+7 |

    | 5 | Appel au réseau voisin : pourquoi 2 sites sur 5 sont encore sur papier, et combien d''ETP la
    migration a réellement coûté | Note d''une page | J+12 |

    | 6 | Chiffrage de la fin de vie des bornes 2015, hors contrat logiciel | Estimation à deux sites
    | J+15 |


    **Un point qui ne coûte rien et qui compte.** Rive-Sud absorbe depuis mars, en silence et sans que
    cela figure au budget, un défaut que nous nous apprêtions à financer trois ans de plus. Je propose
    que le comité le nomme en séance, que ces heures soient comptées comme charge du réseau et non de
    l''équipe du site, et que le relevé de Rive-Sud devienne la pièce principale de notre dossier face
    à l''éditeur. La médiathèque qui a payé le défaut de sa poche doit être celle qui parle dans la négociation.


    ---


    *Si vous voulez cet avis en document mis en page pour distribution en séance, je peux le produire.*

    '
