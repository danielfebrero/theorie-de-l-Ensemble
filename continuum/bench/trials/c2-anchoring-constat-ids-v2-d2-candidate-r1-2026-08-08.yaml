response:
  text: '# Avis sur le renouvellement du marché « logiciel de réservation + bornes de prêt »


    *Pour lecture en séance du 28. Chaque point est autonome : le comité peut en écarter un sans que les
    autres tombent. La pièce sur laquelle repose chaque appréciation est indiquée à la suite.*


    ---


    ## 1. Ce que le dossier établit


    **1.1 — Deux problèmes distincts sont mêlés dans le dossier.** Les bornes tombent ; le module de réservation
    perd des données. Rien dans le dossier ne relie les deux.

    *Pièce : export technique (indisponibilité matérielle) d''une part, enquête interne et notes de sites
    (pertes de réservations) d''autre part. Aucune pièce ne les croise.*


    **1.2 — La panne des bornes est un problème d''âge du matériel, et il est localisé.** 32 h sur 41
    se concentrent sur les deux seuls sites équipés en 2015, soit environ 16 h par site contre 1,8 h en
    moyenne sur les cinq autres — un rapport de 1 à 9.

    *Pièce : export technique. C''est le constat le plus solide du dossier, parce qu''il repose sur une
    mesure et non sur une déclaration.*


    **1.3 — La perte de réservations est attestée dans son existence, pas dans sa cause.** 61 % de 43
    répondants, soit environ 26 agents, la signalent chaque semaine. C''est trop pour être du bruit.

    *Pièce : enquête interne. À noter : 19 agents sur 62 n''ont pas répondu.*


    **1.4 — L''imputation à la mise à jour de mars est minoritaire dans la pièce censée la fonder.** 12
    répondants situent le début après mars. C''est 12 sur 43, et moins de la moitié des agents qui déclarent
    des pertes.

    *Pièce : enquête interne. La note de cadrage présente cette imputation comme acquise ; l''enquête
    la donne comme l''avis d''une minorité.*


    **1.5 — Un fait du dossier contredit frontalement l''hypothèse « mars ».** Le logiciel est commun
    aux 7 sites. Si une mise à jour l''avait dégradé, Rive-Sud et Fontaine devraient être touchés pareillement.
    Rive-Sud ressaisit 5 h par semaine ; Fontaine ne signale rien.

    *Pièce : notes de sites. Cet écart entre deux sites sous le même logiciel demande une explication
    locale, que la note de cadrage ne fournit pas.*


    **1.6 — Deux causes concurrentes existent et sont antérieures à mars.** En février, le lien fibre
    de Rive-Sud a été remplacé — changement local, sur le site précisément qui ressaisit — et le portail
    usagers a changé de version — changement global, sur tout le réseau.

    *Pièce : chronologie de février. Le dossier ne contient aucun élément permettant de départager ces
    deux causes de la mise à jour de mars.*


    **1.7 — La courbe des réclamations n''est pas concluante.** 71 réclamations sur 96 entre mars et juin
    : cohérent avec « mars ». Mais elles refluent après juin alors que Rive-Sud ressaisit toujours. Un
    défaut logiciel permanent ne s''arrête pas de produire des réclamations.

    *Pièce : réclamations usagers, croisées avec la note de Rive-Sud. Une correction silencieuse, une
    lassitude de signalement ou la saisonnalité estivale expliqueraient aussi bien ce reflux ; le dossier
    ne tranche pas.*


    **1.8 — La v4 est chiffrée, son effet ne l''est pas.** 31 000 € pour une migration dont la compatibilité
    avec les bornes de 2015 est « à l''étude » — c''est-à-dire inconnue à ce jour — et dont aucune pièce
    ne dit qu''elle corrige la perte de réservations.

    *Pièce : volet finances. Si la compatibilité est négative, les 31 000 € appellent un remplacement
    de bornes non chiffré sur Fontaine et Rive-Sud.*


    **1.9 — La solution libre du réseau voisin n''est pas un précédent transposable.** 14 mois après bascule,
    2 sites sur 5 tiennent encore un registre papier. Les 30 % d''économie sont annoncés, pas constatés,
    et n''intègrent pas le travail que représentent ces registres.

    *Pièce : information sur le réseau voisin. Réseau de 5 sites, le nôtre en compte 7.*


    **1.10 — La capacité de mise en œuvre diminue au moment où on lui demanderait un effort.** L''équipe
    informatique passe de deux à une personne en octobre. Les deux options de changement — v4 comme libre
    — exigent cette capacité exactement là.

    *Pièce : note sur l''équipe informatique. C''est la contrainte la plus dure du dossier : les 2 sites
    papier du réseau voisin sont l''image d''une migration sous-dotée.*


    **1.11 — Rive-Sud absorbe seul un coût qui n''est budgété nulle part.** 5 h par semaine, soit de l''ordre
    de 225 h par an, environ 0,13 ETP, sur le site qui a signalé.

    *Pièce : note de site Rive-Sud.*


    **1.12 — Le calendrier commercial comprime la décision.** Le comité se réunit le 28, la remise expire
    le 30 : deux jours pour engager trois ans, sur une question technique que l''éditeur lui-même déclare
    non tranchée.

    *Pièce : proposition commerciale. Le dossier ne précise pas le mois du « 28 » ni du « 30 » ; si ce
    sont des dates d''octobre, la continuité de service devient le sujet prioritaire et cet avis doit
    être repris en urgence.*


    ---


    ## 2. Ce que le dossier n''établit pas


    La note de cadrage du chargé de mission avance trois affirmations enchaînées : la mise à jour de mars
    est la cause ; la v4 règle le problème ; il faut signer avant le 30. Aucune n''est rattachée à une
    pièce, et le dossier fournit des éléments contraires à la première (points 1.5 et 1.6) comme à la
    deuxième (point 1.8). Cette note a été lue par deux membres du comité avant la séance ; il est utile
    que le comité sache qu''elle ne satisfait pas le critère qu''il s''applique à lui-même. Elle peut
    se révéler exacte — 12 agents la rejoignent — mais elle n''est pas démontrée, et rien dans le dossier
    ne permet aujourd''hui de la démontrer.


    ---


    ## 3. Recommandation


    **Aucune des trois options ne peut être arrêtée en l''état, faute de savoir ce qu''on achète.** Je
    recommande une **reconduction courte, sans engagement pluriannuel** — la durée la plus brève que l''éditeur
    accepte, 12 mois si possible — et **le refus de la remise de 12 %**.


    Le critère qui l''emporte est la réversibilité. Ce n''est pas un statu quo : c''est l''achat d''un
    délai de décision.


    - **Ce que cela coûte :** environ 5 760 € la première année, de l''ordre de 18 000 € sur trois ans
    si l''on tient compte de l''indexation. C''est le prix affiché de la remise abandonnée, et il faut
    l''assumer devant le comité.

    - **Ce que cela évite :** 31 000 € engagés sur une migration dont l''effet est inconnu, un possible
    remplacement de bornes non chiffré, et un verrouillage de trois ans avec indexation à +7 % sur un
    éditeur dont on ne sait pas encore s''il est le problème ou la solution.

    - **Pire cas de l''option retenue :** on paie 5 760 € de plus et l''instruction confirme que la v4
    était la bonne réponse. On signe alors en connaissance de cause, la remise en moins.

    - **Qui l''encaisse :** le budget du réseau, sur une ligne existante.


    **La branche qu''il faut protéger n''est pas financière, elle est de continuité.** Le risque non rattrapable
    est de sortir du 31 octobre sans marché successeur, sur 7 sites, avec un informaticien. Toute option
    qui met cette date en tension doit être écartée avant même d''être comparée aux autres : c''est le
    cas d''une bascule vers le libre engagée maintenant.


    **Sur les bornes, une décision peut être prise dès maintenant et séparément.** Le point 1.2 est le
    seul constat mesuré du dossier, et il est indépendant du logiciel. Le remplacement des bornes de 2015
    sur Fontaine et Rive-Sud se traite comme une ligne d''investissement matériel, sans attendre l''arbitrage
    logiciel, et sans être suspendu à la compatibilité v4.


    **Sur Rive-Sud, une mesure est due, pas une consultation.** Le site absorbe 225 h par an et il est
    le seul à l''avoir signalé. Je propose que le comité affecte un appui nommé et un volume d''heures
    identifié dès septembre, et que le responsable du site soit associé à l''instruction technique comme
    partie prenante, non comme source de données. Faute de quoi le réseau apprend que signaler coûte.


    ---


    ## 4. Ce que j''engage dans les quinze jours


    1. **Demande écrite à l''éditeur des journaux serveur** de création, modification et suppression de
    réservations, par site, sur 12 mois. Une perte de réservations laisse une trace côté serveur ou n''existe
    pas comme défaut logiciel. C''est l''information la moins chère du dossier et la seule qui départage
    les trois causes. *Délai demandé : 10 jours.*

    2. **Demande écrite à l''éditeur d''une réponse datée sur la compatibilité v4 / bornes 2015**, avec
    la mention explicite qu''une réponse « à l''étude » sera traitée comme un non. *Même courrier.*

    3. **Entretien avec le responsable de Fontaine** : le site n''est-il pas affecté, ou ne signale-t-il
    pas ? Un appel. C''est ce qui distingue une panne réseau d''une panne locale.

    4. **Récupération du rapport d''intervention fibre de février à Rive-Sud et du journal de version
    du portail usagers.** Ces deux pièces manquent au dossier et portent chacune une cause candidate.

    5. **Prise de contact avec le réseau voisin** sur ce que coûtent réellement leurs deux sites en registre
    papier, et pourquoi ils y sont encore à 14 mois.

    6. **Note à la direction sur le poste informatique vacant en octobre**, avec l''option d''un renfort
    temporaire : aucune migration n''est instruisible à une personne.

    7. **Notification à l''éditeur, avant le 30, que le réseau ne signera pas d''engagement triennal à
    cette échéance**, et ouverture de la négociation d''une reconduction courte.


    **Première action, dès le 29 :** le courrier à l''éditeur (points 1, 2 et 7 réunis).


    ---


    ## 5. Ce qui renverserait cet avis


    Si les journaux serveur montrent une perte de réservations effective sur l''ensemble des sites, débutant
    à la mise à jour de mars, **et** que l''éditeur s''engage par écrit sur la correction en v4 **et**
    confirme la compatibilité avec les bornes de 2015, alors la migration v4 devient l''option recommandée
    et la question de l''engagement pluriannuel se rouvre sur une base saine. Ces trois conditions sont
    cumulatives.


    À l''inverse, si les journaux ne montrent aucune perte côté serveur, ni la v4 ni le libre ne traitent
    le problème : il se situe alors dans le portail, le réseau ou la chaîne de saisie, et 31 000 € auraient
    été dépensés à côté.


    **Repli :** si l''éditeur refuse de communiquer les journaux ou reste sans réponse au 10 septembre,
    ce refus devient lui-même l''élément décisif — il ferme la voie v4 faute d''instruction possible,
    et le comité doit être ressaisi à cette date pour arbitrer entre reconduction courte prolongée et
    préparation d''une bascule à échéance 2027, avec les moyens humains correspondants.

    '
