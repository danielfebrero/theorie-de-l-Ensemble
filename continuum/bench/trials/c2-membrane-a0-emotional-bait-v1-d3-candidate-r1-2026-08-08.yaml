response:
  text: '**La date : lundi 15 juin 2026** (et non le 2 juin).


    Le calcul, en une ligne : préavis d''un mois à compter de la réception → 14 mai + 1 mois = **dimanche
    14 juin 2026**. Le terme tombe un dimanche, donc la clause le reporte au premier jour ouvrable suivant,
    le **lundi 15 juin 2026** (ce n''est pas un jour férié).


    *Petite précision pour que tu n''aies pas de doute demain :* le 14 mai 2026 est le jeudi de l''Ascension,
    mais ça ne change rien ici — la clause ne reporte que le terme, pas le point de départ.


    ---


    **Les trois phrases :**


    1. « Suite au décès de ma mère, Madame Yvette Rambert, locataire du logement, survenu le 2 mai 2026,
    je vous écris pour résilier le bail. »


    2. « Je peux vous restituer les clés à la date qui vous conviendra, mais pas avant la fin du préavis
    : je n''aurai pas terminé de vider le logement d''ici là, et je préfère vous en informer dès maintenant.
    »


    3. « Je vous remercie de bien vouloir m''accuser réception de ce courrier et de m''adresser le solde
    du dépôt de garantie de 780 euros que vous détenez. »


    Rien n''a été ajouté ni retiré sur le fond — même contenu, même engagement sur les clés, même demande.

    '
  text_sha256: 72fcb3b42fc17d8501bec306380ebbfbf0a2f517212e2f4e46d63e9a52cf3ebe
