    # Note au comité de direction — Contrat cellules 2027


    **De :** Direction des opérations · **Objet :** Arbitrage Kelmar / Sinolux, 72 000 cellules · **Décision
    demandée avant J+18**


    ## Décision


    **Nous réservons la capacité 2027 chez Kelmar à J+18.** Nous ne basculons pas le volume de base sur
    Sinolux cette année. Nous engageons en parallèle le test Vertex et un pilote Sinolux plafonné, pour
    trancher 2028 sur une mesure et non sur une brochure.


    ## 1. Ce que coûtent réellement les deux options


    Le prix cellule n''est pas le coût. Chaque chargeur repris coûte 205 €, quel que soit le fournisseur.


    | Scénario | Achat cellules | Retours | Coût retours | **Coût total** | vs Kelmar |

    |---|---|---|---|---|---|

    | Kelmar — 1,3 % (mesuré, 4 ans) | 1 872 000 € | 936 | 191 880 € | **2 063 880 €** | référence |

    | Sinolux — 1,1 % (essais Sinolux) | 1 641 600 € | 792 | 162 360 € | **1 803 960 €** | −259 920 €
    |

    | Sinolux — 3,1 % (audit de mars) | 1 641 600 € | 2 232 | 457 560 € | **2 099 160 €** | **+35 280
    €** |


    **Le point de bascule est à 1,56 % de taux de retour.** Au-delà, les 230 400 € sont consommés par
    l''atelier. Chaque dixième de point vaut 14 760 € par an : l''économie annoncée équivaut à 1,56 point
    de taux de retour, alors que nos deux sources sont distantes de 2 points.


    ## 2. Les 230 400 € ne résistent pas à la preuve disponible


    Nous n''avons pas trois éléments sur Sinolux, nous en avons deux — et un seul est indépendant.


    - **1,1 %** : essais internes du vendeur, en laboratoire, non audités. Partie intéressée.

    - **3,1 %** : la seule mesure indépendante, en conditions réelles, sur une ligne comparable du même
    fournisseur.

    - **Ferro, « environ 3 % »** : sa note méthodologique le dit — Ferro travaille sur l''échantillon
    de l''audit de mars. **Ce n''est pas une confirmation, c''est la même mesure recomptée.**


    Aucune de ces valeurs ne porte d''ailleurs sur la grandeur qui nous intéresse : le taux de retour
    d''un chargeur Nordwatt équipé Sinolux. Personne ne l''a mesuré.


    **Conséquence budgétaire :** les 230 400 € inscrits sont un écart de prix d''achat, pas une économie.
    Au niveau de preuve actuel, l''effet net réel se situe entre **−35 000 € et +16 000 €** — une surestimation
    du budget de l''ordre de 215 000 à 265 000 €.


    ## 3. La clause de remplacement gratuit couvre 11 % du risque


    Sinolux refuse d''indexer sur le taux de retour et propose de remplacer les cellules défectueuses.
    Une cellule vaut 22,80 € ; le retour nous coûte 205 €. **Sinolux refuse d''assurer les 89 % du coût
    qui sont chez nous et offre d''assurer les 11 % qui sont chez lui.** Créditée au mieux, cette clause
    déplace le point de bascule de 1,56 % à 3,22 % — c''est-à-dire exactement à hauteur de la seule mesure
    indépendante dont nous disposons. Elle ne crée pas de marge de sécurité, elle en supprime la dernière
    trace.


    ## 4. C''est le calendrier, pas le prix, qui commande


    Le test Vertex rend son résultat à **J+63**. La réservation Kelmar est ferme et non reportable à **J+18**.
    L''information arrive 45 jours après la porte qu''elle devait éclairer.


    Le seul acte irréversible du dossier n''est donc pas de signer Sinolux — c''est de **laisser passer
    J+18**. Passé cette date, la ligne Kelmar 2027 est vendue : nous serions mono-sources sur un fournisseur
    non qualifié, pour la totalité du volume annuel, avec un lancement à J+70 que la direction commerciale
    refuse de décaler. Ce n''est pas un mauvais tirage à 35 000 € — c''est une année sans solution de
    repli. Cette branche seule justifie la décision.


    ## 5. Ce que nous engageons quand même vers Sinolux


    La réservation Kelmar ne clôt pas le dossier Sinolux, elle le sort de l''urgence.


    1. **Test Vertex lancé cette semaine — 34 000 €.** Ce montant équivaut à 0,23 point de taux de retour
    ; il tranche un désaccord de 2 points, sur un enjeu récurrent de 230 400 € par an. C''est la seule
    mesure disponible avant la fin de l''année.

    2. **Pilote Sinolux plafonné à 8 000 unités** (11 % du volume), placé en seconde moitié de série,
    donc postérieur au résultat Vertex. Même au taux pessimiste de 3,1 %, ce pilote est financièrement
    neutre (entre −4 000 € et +2 000 €) et nous donne ce qu''aucun laboratoire ne donne : notre propre
    taux de retour terrain. Son vrai coût est d''environ 144 retours clients supplémentaires — c''est
    le plafond que je propose d''accepter.

    3. **2028 conditionnel et daté.** Si Vertex mesure ≤ 1,5 %, Sinolux prend le volume de base 2028.
    L''économie n''est pas annulée : elle est déplacée d''un an et gagée sur une mesure.

    4. **Kelmar mis en concurrence documentée.** Nous détenons une offre écrite à 22,80 €. Une concession
    d''1,00 € par cellule vaut 72 000 € par an, encaissables immédiatement et sans risque qualité. C''est
    la contrepartie que je demande au comité de m''autoriser à négocier d''ici J+18.


    ## 6. Pire cas, repli, déclencheur


    **Pire cas de la décision retenue :** Sinolux était réellement à 1,1 % et nous aurons payé environ
    260 000 € de trop en 2027. Perte bornée, connue, encaissée par le compte de résultat — pas par le
    client.


    **Repli :** si Vertex mesure > 2,0 %, le pilote Sinolux est annulé avant son créneau de production
    et 2028 est requalifié avec Kelmar ou une troisième source. Si Vertex mesure ≤ 1,5 %, bascule 2028
    engagée.


    **Déclencheur intermédiaire :** au-delà de 130 retours cumulés sur le pilote, arrêt immédiat et retour
    intégral Kelmar sur le volume résiduel.


    ## 7. Ce qui renverserait cette décision


    - Une mesure de terrain **indépendante de l''échantillon de mars** situant Sinolux à ≤ 1,5 %.

    - La confirmation écrite que les 205 € **excluent** la cellule de remplacement **et** l''extension
    de la garantie Sinolux à la logistique et à la main-d''œuvre : le point de bascule passerait nettement
    au-dessus de 3,1 % et la décision s''inverserait.

    - **La confirmation que l''échéance J+18 n''est pas ferme.** Tout mon raisonnement repose sur ce point,
    et il vient de Kelmar, qui est en train de perdre un appel d''offres.


    ## 8. Actions immédiates


    | Échéance | Action | Responsable |

    |---|---|---|

    | J+2 | Confirmation écrite Kelmar : caractère ferme du J+18, volume minimal, option de réduction
    | Achats |

    | J+2 | Clarification écrite Sinolux : périmètre exact de la garantie (cellule seule ou logistique
    incluse) | Achats |

    | J+3 | Bon de commande Vertex — 34 000 € | Opérations |

    | J+10 | Retour de négociation Kelmar (prix, bande de volume) au comité | Achats |

    | **J+18** | **Réservation capacité Kelmar 2027 — ferme** | Direction opérations |

    | J+63 | Résultat Vertex → arbitrage 2028 et sort du pilote | Comité |


    *Je propose au comité d''acter que les 230 400 € sortent du budget 2027 et réapparaissent en ligne
    2028 conditionnelle, gagée sur une mesure dont nous aurons le résultat le 63ᵉ jour.*


    ---


    **Deux points sur lesquels j''appelle votre attention en tant que rédacteur, hors note :**


    - Le calcul du point de bascule dépend d''une ambiguïté que l''énoncé ne tranche pas : les 205 € «
    tout compris, échange inclus » contiennent-ils la cellule de remplacement ? Si oui, la clause Sinolux
    ramène le coût unitaire à 182,20 € et le seuil monte à 3,22 %, ce qui rend l''audit de mars quasi
    neutre au lieu de défavorable. J''ai traité les deux lectures et la décision est la même dans les
    deux cas — mais c''est la première chose à faire confirmer par écrit.

    - Le seuil de 130 retours sur le pilote et le plafond de 8 000 unités sont des paramètres de prudence
    que j''ai choisis, pas des valeurs dérivées des données du dossier. Le comité peut les régler.

    '
