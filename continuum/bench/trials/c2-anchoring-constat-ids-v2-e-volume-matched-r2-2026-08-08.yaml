response:
  text: '# Avis pour le comité de direction — renouvellement du contrat logiciel de réservation et bornes


    **Objet :** échéance du 31 octobre. Trois options soumises. Avis présenté point par point, chaque
    appréciation rattachée à la pièce sur laquelle elle repose, de façon que le comité puisse en écarter
    une sans que les autres tombent.


    ---


    ## 1. Ce que je retiens du dossier


    **1.1 — Le dossier ne mesure pas une panne, il en mesure deux, et ne les distingue pas.**

    *Pièce : export technique (41 h d''indisponibilité des bornes) + enquête interne (module de réservation).*

    L''indisponibilité des bornes est un fait matériel, horodaté, portant sur du matériel de 2015. Les
    « pertes de réservation » sont un fait déclaratif, portant sur un module logiciel. Rien dans le dossier
    ne relie les deux. Le premier plaide pour un renouvellement de matériel, pas pour une migration logicielle.

    *Si le comité écarte ce point :* les points 1.2 à 1.5 tiennent quand même.


    **1.2 — L''imputation à la mise à jour de mars n''est pas établie par les pièces du dossier.**

    *Pièces : enquête (12 répondants sur 43 situent le début après mars) + chronologie de février (fibre
    Rive-Sud remplacée, portail usagers changé de version).*

    Douze personnes constituent le soutien **maximal** à cette hypothèse, sur 43 répondants et 62 agents.
    Surtout, deux modifications techniques non instruites précèdent d''un mois la date incriminée. Aucune
    pièce ne permet aujourd''hui de départager février et mars.

    *Ce que cela ne dit pas :* que mars est hors de cause. Cela dit que le dossier ne permet pas de l''affirmer.


    **1.3 — La distribution géographique contredit une cause purement logicielle.**

    *Pièces : notes de sites (Rive-Sud ressaisit 5 h/semaine depuis mars ; Fontaine ne signale rien) +
    enquête (61 % des répondants, tous sites confondus).*

    Fontaine et Rive-Sud ont le même matériel de 2015 et le même logiciel. Un seul ressaisit. Deux lectures
    possibles : soit le problème est concentré à Rive-Sud — et c''est février, pas mars, qui est le suspect
    ; soit Fontaine subit le problème sans le remonter. Ces deux lectures sont incompatibles avec la note
    de cadrage, et **personne n''a encore appelé Fontaine pour trancher**. L''absence de signalement n''est
    pas une absence de problème.


    **1.4 — Le pic de réclamations est réel, mais il est retombé.**

    *Pièce : 96 réclamations sur 12 mois, dont 71 entre mars et juin.*

    Soit environ 18/mois sur mars-juin contre environ 3/mois sur le reste de l''année. Le phénomène est
    net et daté ; il n''est plus en cours. Deux explications à départager : le problème s''est résorbé,
    ou les usagers ont cessé de le signaler. Cela change la nature de la décision : nous ne sommes pas
    en situation d''urgence, nous sommes en situation de diagnostic non fait.


    **1.5 — La note de cadrage énonce trois affirmations, dont aucune n''est appuyée par une pièce.**

    *Pièce : la note elle-même.*

    « Mars est la cause » — voir 1.2. « La v4 règle le problème » — la cause n''étant pas établie, la
    capacité de la v4 à la corriger ne peut pas l''être. « Il faut signer avant le 30 » — c''est le calendrier
    commercial de l''éditeur, pas le nôtre : notre échéance est le 31 octobre. Je signale sans y voir
    de mauvaise intention que deux membres du comité ont lu cette note avant la séance ; le comité doit
    savoir qu''elle ne s''appuie sur aucune pièce vérifiable.


    **1.6 — La remise de 12 % vaut moins qu''elle n''en a l''air, et son montant exact n''est pas dans
    le dossier.**

    Sur trois ans avec indexation à 7 % : 51 360 + 54 955 + 58 802 ≈ **165 100 €**. Moins 12 % : ≈ **145
    300 €**, soit un écart d''environ **19 800 €, ~6 600 €/an**. Mais le dossier ne dit pas si la remise
    porte sur les trois années ou sur la première seule (dans ce cas : ≈ 6 200 € au total), ni si l''indexation
    continue de courir pendant le contrat remisé. **Le comité ne peut pas valoriser cette remise en l''état.**

    Ordre de grandeur à comparer : la ressaisie de Rive-Sud représente ≈ 230 h/an, soit ≈ 5 750 €/an à
    25 €/h chargés (hypothèse à valider par les RH). *Le coût d''un seul site en ressaisie est du même
    ordre que la remise annuelle.*


    **1.7 — La contrainte décisive n''est pas financière, elle est humaine.**

    *Pièce : équipe informatique de deux personnes, dont une part en octobre.*

    Toute migration — v4 comme libre — reposerait sur **un agent seul**, au moment même du basculement
    contractuel. Le réseau voisin, avec 5 sites, a 2 sites encore sur registre papier **14 mois après**
    sa migration. Ce taux d''inachèvement (40 %) est la donnée la plus utile du dossier sur le libre,
    davantage que les 30 % d''économie annoncés, lesquels ne comprennent ni coût de migration ni coût
    de support.


    ---


    ## 2. Recommandation


    **Reconduire à l''identique, mais sur une durée courte (12 mois), et refuser l''engagement de trois
    ans.** Ni la v4 ni le libre ne sont défendables tant que la cause n''est pas identifiée et tant que
    l''équipe informatique est à un agent.


    Le raisonnement tient en une phrase : **il est proposé au comité d''engager environ 145 000 € sur
    trois ans pour corriger un dysfonctionnement dont personne n''a établi la cause, auprès de l''éditeur
    qui a livré la mise à jour soupçonnée, avec une compatibilité matérielle encore « à l''étude ».**


    J''assume explicitement le prix de cet avis : **nous laissons passer la remise, soit de l''ordre de
    6 600 €/an au mieux.** Nous achetons en échange la liberté de ne pas être liés trois ans à un fournisseur
    dont la solution n''est pas qualifiée. À ce tarif, cette liberté est bon marché — d''autant que la
    migration v4 (31 000 €) sans engagement écrit de compatibilité avec les bornes de 2015 expose à un
    remplacement matériel sur deux sites, d''un montant que le dossier ne chiffre pas du tout.


    **Réserve honnête :** le dossier ne dit pas si l''éditeur propose une durée de 12 mois. Si le seul
    choix réel est « 3 ans remisés » ou « 1 an au tarif plein », mon avis reste le même — mais le comité
    doit être saisi de l''écart réel, que je rapporterai avant l''échéance.


    ---


    ## 3. Ce que j''engage dans les quinze jours


    1. **Demander à l''éditeur, par écrit, le report de l''offre remisée au 31 octobre.** Un refus est
    en soi une information sur la relation contractuelle. *(J-2)*

    2. **Extraire les journaux du module de réservation, par site et par date, sur 14 mois**, et les croiser
    avec la date exacte du changement de version du portail (février) et celle de la mise à jour (mars).
    C''est la seule pièce qui manque pour trancher entre 1.2 et 1.3.

    3. **Me rendre à Fontaine.** Même matériel, même logiciel, aucun signalement : il faut savoir si le
    problème y existe sans être remonté. *(déterminant pour 1.3)*

    4. **Documenter la ressaisie de Rive-Sud** : volume réel, depuis quelle date précise, sur quel type
    de réservation.

    5. **Exiger de l''éditeur un engagement contractuel écrit** sur la compatibilité v4 / bornes 2015
    — pas une étude — et le chiffrage du remplacement à défaut.

    6. **Demander au réseau voisin un entretien** portant spécifiquement sur ses deux sites restés au
    papier : coût réel, charge interne mobilisée, ce qu''ils referaient autrement.

    7. **Obtenir de l''éditeur la grille tarifaire à 12 et 24 mois**, et la règle exacte d''application
    de la remise et de l''indexation. *(point 1.6)*

    8. **Saisir la DRH du remplacement du poste informatique**, avec une date cible : aucune migration
    n''est envisageable avant.


    ---


    ## 4. Ce qui me ferait changer d''avis


    - Si les journaux montrent une rupture nette **à la date de mars, sur les 7 sites simultanément**
    : la thèse de la note de cadrage est validée, et la v4 redevient l''option à instruire en priorité.

    - Si la rupture est **à février et concentrée sur Rive-Sud** : le problème est réseau/portail, la
    v4 est hors sujet, et 31 000 € sont économisés.

    - Si les journaux sont inexploitables ou inexistants : cela devient en soi le premier critère de choix
    du prochain contrat, quel qu''il soit.


    **Point d''arrêt proposé au comité :** aucune signature d''engagement pluriannuel avant restitution
    des points 2, 3 et 5. Je reviens devant le comité au plus tard **le 30 septembre**, ce qui laisse
    un mois avant l''échéance.

    '
