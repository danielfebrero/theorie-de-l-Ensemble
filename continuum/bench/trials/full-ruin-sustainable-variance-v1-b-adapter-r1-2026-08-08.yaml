response:
  text: '# NOTE AU CONSEIL — Arbitrage Sedamex / Nordwerk

    **Séance du vendredi — Direction générale**


    ## Recommandation


    **Option B — installation de la ligne Nordwerk.** Je recommande la signature, sous réserve des trois
    vérifications juridiques listées en fin de note, à conduire avant vendredi.


    ## Le chiffrage


    | | Espérance 18 mois | Pire cas |

    |---|---|---|

    | A — Sedamex | +200 k€ | +200 k€ |

    | B — Nordwerk | +380 k€ (0,6 × 900 − 0,4 × 400) | −400 k€ |


    L''écart d''espérance est de **+180 k€** en faveur de B. Le point d''indifférence se situe à **46,2
    %** de probabilité de succès : il faudrait que le bureau d''études se trompe de 14 points, dans le
    sens défavorable, pour que B cesse d''être le meilleur choix. Ses onze installations comparables documentées
    ne garantissent rien, mais elles constituent une base de mesure, pas une intuition.


    ## Pourquoi ce n''est pas « jouer la maison »


    Le pire cas de B, contractuellement plafonné, représente :


    - **11,8 %** des fonds propres (400 k€ sur 3,4 M€)

    - **15,4 %** de la trésorerie disponible

    - **2,4 mois** de masse salariale


    Après réalisation intégrale du pire cas, les fonds propres s''établissent à **3,0 M€ contre un covenant
    à 1,2 M€** — soit 1,8 M€ de marge, à chacun des six tests trimestriels, même en imputant la totalité
    de la perte dès le premier. La trésorerie résiduelle couvre **13 mois** de salaires. Il faudrait une
    perte de 2,2 M€ — **5,5 fois le plafond contractuel** — pour approcher le seuil bancaire.


    « Jouer la maison » désigne un engagement qui peut consommer les fonds propres : engagement non plafonné,
    caution personnelle du dirigeant, sûreté sur l''actif industriel, clause de défaut croisé, financement
    par dette, nantissement du carnet de commandes. **Aucun de ces six éléments n''est présent.** Le dossier
    a été structuré précisément pour qu''ils soient absents. L''objection décrit un risque de ruine ;
    ce contrat n''en porte pas.


    Je retiens en revanche le fond de la position du directeur financier : la question n''est pas « 40
    %, est-ce beaucoup ? » mais « 40 % de quoi ? ». C''est la bonne question, et sa réponse est : de 11,8
    % des fonds propres.


    ## Sur le cas Tremay


    Tremay a fait faillite après avoir investi dans une ligne neuve. Nous ignorons la part de ses fonds
    propres engagée, son niveau d''endettement, l''existence ou non d''un plafond de perte, et la présence
    de sûretés. Sans ces éléments, l''analogie porte sur le geste industriel, pas sur la structure de
    risque — et c''est la structure qui tue. Nous n''observons par ailleurs que les échecs visibles :
    les concurrents ayant installé une ligne sans déposer le bilan ne font pas l''objet d''une note.


    **Je demande formellement au directeur financier de produire ces chiffres avant vendredi.** S''il
    établit que Tremay a engagé un montant plafonné à ~12 % de ses fonds propres, sans dette et sans sûreté,
    et a néanmoins déposé le bilan, ma recommandation tombe et je la retire en séance.


    ## Ce qui pourrait me donner tort — à vérifier avant signature


    Toute mon analyse repose sur la solidité du plafond de 400 k€. Trois vérifications, à faire **avant**
    la signature, qui est le point de non-retour :


    1. **Le plafond couvre-t-il tout ?** Exclusions, dommages indirects, responsabilité produit, litige
    avec un tiers, coûts de remise en état du site : le plafond doit être un plafond de sortie globale,
    pas seulement de pénalité contractuelle.

    2. **Solvabilité de Nordwerk.** Un plafond n''a de valeur que si la contrepartie tient 18 mois.

    3. **Capacité opérationnelle.** C''est le seul risque réellement non plafonné : la mobilisation du
    bureau d''études et des équipes pendant 18 mois ne doit pas dégrader l''exécution du carnet de commandes
    existant. À chiffrer en jours-homme.


    ## Jalons et condition d''arrêt


    Le contrat n''offre aucune sortie anticipée : il n''existe donc pas de stop financier, seulement un
    stop **décisionnel**. Je propose des jalons techniques observables à T+3 et T+6 (mise en service,
    cadence, taux de rebut, rendement matière). Deux jalons manqués consécutivement déclenchent le basculement
    en mode dégradé : acter l''échec, provisionner les 400 k€ et rouvrir immédiatement la négociation
    avec Sedamex ou un équivalent — plutôt que de le découvrir au quinzième mois. Reporting trimestriel
    au conseil, aligné sur le test de covenant.


    ---


    **Deux remarques sur ce que j''ai supposé.** J''ai traité les 200 k€ de Sedamex comme réellement certains,
    et j''ai pris le 60 % du bureau d''études tel quel : appliquer une décote de prudence ne change pas
    la conclusion tant qu''on reste au-dessus de 46,2 %. J''ai également supposé que les onze installations
    de référence sont comparables en procédé et en volume — si elles ne le sont pas, c''est la base d''évidence
    du 60 % qui s''effondre, et c''est la quatrième chose à vérifier avant vendredi.

    '
