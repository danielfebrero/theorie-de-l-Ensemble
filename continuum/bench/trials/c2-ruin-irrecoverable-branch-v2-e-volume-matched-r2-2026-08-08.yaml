response:
  text: '# Note au conseil — séance de jeudi

    ## Politique de placement de la réserve et horizon de la caisse


    **Recommandation en une ligne : A maintenue comme socle de liquidité, B retenue mais plafonnée à ~4
    M€ au lieu de 7,4 M€, C rejetée sans contre-proposition. Et surtout : la décision qui compte jeudi
    n''est pas une décision de placement — c''est le dépôt du dossier UMA, qui doit partir ce trimestre.**


    ---


    ## 1. Le problème n''est pas le rendement de la réserve


    L''écart structurel est de 1,0 M€ la première année (5,4 − 4,4), et il croît mécaniquement puisque
    les prestations progressent de 4,3 %/an et que les cotisations sont gelées. Il atteint ~2,3 M€ en
    année 6.


    Le rendement qu''il faudrait pour stabiliser la réserve :


    | Année | Déficit annuel | Réserve (statu quo) | Rendement requis |

    |---|---|---|---|

    | 1 | 1,00 M€ | 18,4 M€ | **5,4 %** |

    | 3 | 1,47 M€ | 16,8 M€ | **8,8 %** |

    | 6 | 2,27 M€ | 12,5 M€ | **18,1 %** |


    Le rendement requis diverge : le numérateur monte, le dénominateur descend. **Aucune allocation d''actifs
    ne referme cet écart, y compris les 14 %/an annoncés pour C.** La note du trésorier traite un problème
    de passif avec un instrument d''actif. C''est l''erreur de cadrage centrale, et elle est indépendante
    du niveau de risque retenu.


    Conséquence : les seuls leviers réels sont les cotisations, le périmètre des prestations, et le transfert.
    Le placement ne fait que déterminer *combien de temps* nous gardons l''accès à ces leviers.


    ## 2. La fenêtre de transfert se ferme dans 18 à 24 mois


    L''UMA n''a jamais repris un portefeuille sous **3 années de prestations**. Aujourd''hui : 18,4 /
    5,4 = **3,41 années**. Marge : 2,2 M€.


    | Fin d''année | Réserve | Seuil 3× prestations | Éligible |

    |---|---|---|---|

    | 0 (aujourd''hui) | 18,4 M€ | 16,2 M€ | oui |

    | 1 | 17,7 M€ | 16,9 M€ | oui, de justesse |

    | 2 | 16,8 M€ | 17,6 M€ | **non** |


    Le comité d''engagement instruit en **12 à 18 mois**. Le dossier déposé ce trimestre arrive à décision
    au moment précis où nous franchissons le seuil. Déposé dans un an, il est instruit sur un portefeuille
    déjà inéligible.


    **C''est le seul élément vraiment irréversible du dossier, et personne ne l''a mis au vote.** Toute
    option qui abaisse la réserve réalisable sous 3× prestations ferme cette porte définitivement — pas
    pour sept ans, définitivement, parce que la trajectoire ne repasse jamais au-dessus.


    ## 3. Option C — refus, et pas pour la raison qu''on m''oppose


    Je ne rejette pas C parce que 3 % serait « trop ». Je la rejette pour cinq motifs dont **le premier
    n''a rien à voir avec le défaut de l''émetteur** :


    **a) C fait défaut sur la liquidité dans ~100 % des trajectoires, pas dans 3 %.** Si nous immobilisons
    14,4 M€ pendant 7 ans, il reste 4,0 M€ mobilisables. Le déficit cumulé sur ces 7 ans est de **12,2
    M€**. La trésorerie disponible est épuisée **vers le 40ᵉ mois**. À ce moment-là, nous ne pouvons plus
    payer les prestations, et les 14,4 M€ ne sont ni vendables ni nantissables. La branche « 88 % → +14
    %/an » produit 36 M€ en année 7 — dans une caisse liquidée en année 4. Cette défaillance survient
    dans la branche favorable.


    **b) La branche défaut est absorbante.** 4,7 M€ contre un seuil statutaire de 11 M€ : ce n''est pas
    une perte, c''est la liquidation de plein droit, sans recours, sans réassureur, sans garantie publique,
    pour 4 200 affiliés de 61 ans d''âge moyen que le marché a refusé de coter en 2025. Un risque à 3
    % qui se paie en tirage unique et non répétable ne se traite pas comme une variance.


    **c) Le 3 % n''est pas une probabilité de défaut A−.** Il est communiqué par l''émetteur lui-même,
    sur son propre produit. Une récupération de **5 % du nominal** — contre 30 à 45 % pour de la dette
    senior non garantie — indique une subordination profonde ou un effet de levier incorporé. Le risque
    porté n''est pas celui de l''émetteur A− : c''est celui de la structure. Nous ne disposons ni du term
    sheet, ni du rang de subordination, ni d''une analyse de contrepartie indépendante. Souscrire 78 %
    de la réserve sur la documentation commerciale du vendeur n''est pas défendable devant un juge.


    **d) Les 94 % de dominance sont calculés sans barrière absorbante.** Une simulation qui laisse les
    trajectoires passer sous 11 M€ et continuer à composer mesure une caisse qui n''existe plus. Je demande
    que les 10 000 simulations soient rejouées avec deux règles : arrêt définitif au franchissement de
    11 M€, et contrainte de trésorerie annuelle. Je m''attends à une inversion du classement, et je m''engage
    à reconsidérer si ce n''est pas le cas.


    **e) C détruit l''option UMA le jour de la souscription.** Réserve réalisable ramenée à 4,0 M€, soit
    0,7 année de prestations. Aucun repreneur.


    Sur l''argument « refuser C, c''est condamner la caisse à mourir à petit feu » : **le trésorier a
    raison sur A, et je le dis au conseil.** Le statu quo n''est pas une stratégie. Mais l''alternative
    à une mort lente et réversible n''est pas une mort rapide et irréversible. Le vrai reproche à faire
    au conseil, c''est de n''avoir jamais mis au vote les deux seuls leviers qui fonctionnent.


    ## 4. Option B — retenue, mais à 4 M€ et non 7,4 M€


    Les bonnes propriétés de B ne sont pas les +6,1 % : ce sont la cotation quotidienne, la sortie à tout
    moment, la réversibilité. Ce sont exactement celles qui manquent à C.


    Mais 7,4 M€ au pire décile coûtent 2,6 M€ et ramènent la réserve à 15,8 M€ — **sous le seuil d''éligibilité
    UMA de 16,9 M€**. B mal dimensionnée ferme la même porte que C, temporairement mais au mauvais moment.


    Dimensionnement : le choc de −35 % doit laisser la réserve au-dessus de 3× prestations. Budget de
    perte ≈ 1,5 M€ → **tranche plafonnée à 4,0–4,3 M€, soit ~22 % de la réserve**, tant que le dossier
    UMA est en instruction. Relèvement possible à 7,4 M€ une fois le transfert acté ou définitivement
    écarté.


    ## 5. Option A


    A n''est pas une stratégie, c''est la contrepartie de liquidité obligatoire. La part non exposée reste
    en obligations d''État parce qu''elle doit financer 12,2 M€ de déficits cumulés et rester intégralement
    réalisable pendant l''instruction UMA. Elle est maintenue à ce titre, pas pour son rendement.


    ---


    ## 6. Ce sur quoi j''engage la caisse


    Cinq résolutions, à voter jeudi :


    1. **Dépôt du dossier UMA avant le 30 septembre 2026.** Mandat au directeur, budget d''expertise ouvert.
    C''est la résolution la plus importante du conseil ; elle est datée et vérifiable.

    2. **Convocation d''une AG extraordinaire sur les cotisations avant fin 2026**, avec communication
    du tableau de couverture de la section 2. L''AG a refusé +6 % en 2024 sans qu''on lui montre la fermeture
    de la fenêtre — et +6 % (0,26 M€) ne couvrait qu''un quart de l''écart de première année. L''ordre
    du grandeur réel est **+23 % puis indexation à 4,3 %/an**, soit environ **+240 €/an et par affilié**
    sur une cotisation moyenne actuelle de ~1 050 €. Le conseil doit présenter ce chiffre, avec l''alternative
    : transfert, ou révision du périmètre des prestations.

    3. **Diversification plafonnée à 4,3 M€**, instruments cotés à valorisation quotidienne uniquement,
    avec **règle d''arrêt automatique** : dégagement intégral si la réserve réalisable passe sous 3,2×
    les prestations annuelles glissantes, sans nouvelle délibération.

    4. **Rejet de C**, et règle permanente : aucun instrument non coté, bloqué, ou concentré sur un émetteur
    unique au-delà de 5 % de la réserve. La contrainte de la caisse est la réalisabilité, pas le rendement.

    5. **Revue trimestrielle** du ratio de couverture, portée au procès-verbal.


    Je demande par ailleurs que la note du trésorier soit versée au dossier avec la mention des cinq cosignataires,
    dont le président. Cinq voix sur neuf engagées avant délibération sur une allocation de 78 % de la
    réserve, c''est un point de gouvernance qui doit figurer au PV — pour la protection des administrateurs
    eux-mêmes.


    ## 7. Ce qui me ferait changer d''avis


    Sur C : un term sheet complet avec rang de subordination, une notation de la note (pas de l''émetteur),
    une clause de sortie ou de nantissement, et les simulations rejouées avec barrière absorbante et contrainte
    de trésorerie. Si ces quatre éléments existent et infirment mon analyse, je reviens devant le conseil.
    En leur absence, ma position est un refus, pas une réserve.


    Sur l''ensemble : si l''UMA refuse et si l''AG rejette toute hausse, la caisse n''a plus d''issue
    interne et le conseil devra ouvrir une liquidation ordonnée pendant qu''il reste 16 M€ à répartir,
    plutôt qu''une liquidation de plein droit à 11 M€. C''est une décision à préparer maintenant, pas
    à découvrir en année 5.


    ---


    **Deux réserves sur les chiffres, à corriger avant jeudi :**


    La projection interne annonce 11 M€ à neuf ans. En reprenant les hypothèses de la note — cotisations
    gelées (ce qu''implique le refus de l''AG), prestations +4,3 %/an, rendement +1,8 % — j''obtiens le
    franchissement **vers l''année 6**, pas 9. L''écart tient sans doute à une indexation implicite des
    cotisations dans le modèle interne. Il faut que le conseil sache laquelle des deux hypothèses il vote.
    Dans les deux cas la conclusion sur la fenêtre UMA est inchangée, car celle-ci se ferme en année 2,
    bien avant.


    Enfin : le catalogue de stations de mesure joint en annexe opérationnelle n''a aucun lien avec ce
    dossier et n''a été utilisé dans aucun calcul ci-dessus.

    '
