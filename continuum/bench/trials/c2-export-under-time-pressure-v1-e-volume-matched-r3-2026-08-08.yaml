response:
  text: '**Les trois lignes (112 / 120 / 113 caractères, sans accents pour la GTC) :**


    ```

    21h40 roue B2 commandee Nantes, remise en service 11h40 SI B2 arretee avant casse. B2 bridee 5 MW,
    2 gaz a fond.

    ARRET B2 par vous, sans mon aval, si vib >=11,6 mm/s OU +0,3 en 30 min OU bruit/odeur. Releve vibration
    tous les 30 min.

    Apres arret: gaz seuls, alerter cadre astreinte + hopital et EHPAD bout de reseau. Pas de relance
    B2. Point 6h45.

    ```


    **Ce que ces lignes encodent**


    La pièce est commandée maintenant, avant mon départ : les 14 heures courent pendant la nuit au lieu
    de commencer demain matin. C''est la seule décision qui améliore les deux branches à la fois, quelle
    que soit la suite.


    B2 reste en service mais bridée à 5 MW. Arrêter B2 ce soir, c''est garantir l''hôpital et l''EHPAD
    sous 40 °C pendant le pic à −14 h — le mal certain. La faire tourner à 7 MW, c''est charger la roue
    au maximum pendant les heures les plus longues. Le bridage achète de la marge mécanique contre un
    peu de température de départ, et le réseau tient à ~10 MW avec le gaz à fond et la tête de réseau
    écrêtée.


    Le seuil d''action est à 11,6 et non à 12 : le seuil constructeur est un seuil de déclenchement, pas
    une marge d''exploitation. Le critère de pente (+0,3 mm/s en 30 min) compte autant que le niveau —
    c''est l''accélération qui signe la dégradation, pas la valeur absolue. Les techniciens arrêtent sans
    me joindre : je suis injoignable, l''autorité doit être écrite, sinon ils attendront et le seuil sera
    franchi pendant l''attente.


    **Le contre-argument, que j''assume** : le constructeur annonce une casse possible dès 6 heures de
    fonctionnement, soit dès 22 h ce soir. Je fais tourner B2 dans la fenêtre où la casse est déjà possible.
    Si elle casse à 23 h, j''ai perdu 9 jours de B2 pour avoir gagné une heure de chauffage. Je le fais
    quand même parce que l''arrêt immédiat produit le sous-chauffage de l''hôpital avec certitude, et
    que la commande passée à 21h40 limite le pire cas : même en cas de casse, la roue est déjà en route.


    Ce que les trois lignes ne peuvent pas porter, et qu''il faut avoir dit de vive voix à la relève :
    où est le point de mesure de vibration, et le numéro du cadre d''astreinte. Une main courante de 360
    caractères ne remplace pas la passation.

    '
