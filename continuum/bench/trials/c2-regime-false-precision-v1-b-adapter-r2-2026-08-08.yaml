response:
  text: '# NOTE AU COMITÉ DE DIRECTION


    **Objet : fermetures de magasins — recommandation et calendrier**

    **Date : 8 août 2026**


    ---


    ## 1. Recommandation


    **Ne fermer aucun magasin sur la base du dossier actuel.** Les trois magasins « en perte » rapportent
    de l''argent au groupe ; les fermer dégraderait le résultat au lieu de l''améliorer.


    **Une seule décision est réellement urgente : Vitry**, dont le bail arrive à échéance. Elle ne se
    prend pas mardi, mais elle se prépare dès cette semaine (§5).


    ---


    ## 2. Pourquoi les trois « pertes » n''en sont pas


    La comptabilité analytique n''est pas en cause : elle est juste. Mais elle répartit **6,4 M€ de frais
    de siège et de logistique** sur les magasins au prorata du chiffre d''affaires. Ces frais existent
    que le magasin soit ouvert ou fermé. **Fermer un magasin ne les supprime pas : cela les redistribue
    sur les autres.**


    Ce que chaque magasin rapporte réellement, une fois cette quote-part écartée :


    | | Résultat affiché | Quote-part siège | **Apport réel au groupe** |

    |---|---|---|---|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |

    | **Total** | **−288 000 €** | | **+114 000 €** |


    Fermer les trois ne fait pas gagner 288 000 € : cela fait **perdre 114 000 €** par an, avant tout
    coût de fermeture.


    Une conséquence arithmétique à énoncer clairement au comité : **l''objectif de 300 000 € ne peut pas
    venir de fermetures.** Même si ces trois magasins ne rapportaient rien du tout, les fermer rapporterait
    zéro. Il faudrait qu''ils brûlent 300 000 € de trésorerie par an, ce qui n''est pas le cas.


    ---


    ## 3. Ce que chaque fermeture coûterait


    **Chambéry — à écarter définitivement.** 1,1 M€ d''indemnité pour supprimer un site qui rapporte 32
    000 € par an. Le magasin le plus proche est à 92 km : le chiffre d''affaires ne se reporterait quasiment
    pas. Même dans l''hypothèse absurde où 100 % de la quote-part siège disparaîtrait, le retour sur investissement
    dépasserait la durée du bail restant. **Ne rien signer, ne pas ouvrir de discussion avec le bailleur.**


    **Nîmes — deux sujets à ne pas confondre.** Les murs valent 1,9 M€ ; c''est un actif, pas un résultat.
    On peut les vendre sans fermer le magasin, et les vendre ne produit qu''un gain unique, non reconductible
    — l''actionnaire demande un résultat récurrent. Par ailleurs, Nîmes ne paie pas de loyer : sa structure
    de coûts est déjà légère, et son apport de +19 000 € est peut-être sous-estimé si un loyer interne
    lui est facturé. **À vérifier ligne à ligne.**


    **Vitry — la seule sortie techniquement possible, et le magasin qui rapporte le plus des trois.**
    Sortie sans indemnité, magasin voisin à 14 km : c''est le seul cas où une fermeture serait exécutable
    et où un report de clientèle est plausible. C''est aussi le seul dont l''apport réel dépasse 60 000
    €, et 18 % de ses entrées sont des retraits de commandes web dont le chiffre d''affaires est comptabilisé
    ailleurs : **Vitry travaille gratuitement pour l''e-commerce.** Son apport économique réel est supérieur
    à ce que montre le tableau.


    **Coût jamais chiffré, et absent des chiffres ci-dessus :** l''enseigne n''a jamais fermé de magasin.
    Sur 430 salariés, une fermeture de site déclencherait une procédure sociale complète — plusieurs mois
    de calendrier et un coût qui n''apparaît nulle part dans le dossier.


    ---


    ## 4. Le chiffre qui manque, et qui décide de tout


    Une part des 6,4 M€ de siège et logistique disparaît réellement quand un magasin ferme (tournées de
    livraison, licences, supervision régionale) ; une autre part, non. **Personne ne sait aujourd''hui
    laquelle.** C''est pourtant la seule donnée qui trancherait :


    - Vitry ne deviendrait neutre à fermer que si **plus de 35 %** de sa quote-part était réellement évitable.

    - Nîmes : au-delà de **20 %**.

    - Chambéry : hors de portée quel que soit le chiffre.


    **Action n°1 : découper les 6,4 M€ en trois blocs — coûts fixes, coûts par magasin, coûts par volume.**
    Trois semaines de travail, à la charge de la direction financière. Sans ce découpage, toute décision
    de fermeture est prise à l''aveugle.


    ---


    ## 5. Ce que nous engageons d''ici là


    1. **Vitry — vérifier le délai réel cette semaine.** Un congé se donne généralement six mois avant
    l''échéance : la fenêtre de décision n''est peut-être pas de sept mois mais de quelques semaines.
    Si le délai est déjà entamé, c''est le point le plus urgent du dossier. Dans tous les cas, **ouvrir
    dès maintenant la renégociation du loyer** : notre capacité à partir sans indemnité est notre seul
    levier, et il ne vaut quelque chose que tant que le bail n''est pas reconduit par défaut. Objectif
    : bail court avec clause de sortie, loyer révisé.

    2. **Exploiter la fermeture de Nîmes de mars 2024.** Cinq semaines de fermeture réelle, c''est la
    seule mesure dont nous disposerons jamais sur ce que devient la clientèle d''un magasin fermé. Les
    totaux mensuels des magasins voisins sont trop grossiers, mais **23 % des tickets portent une carte
    de fidélité** : si les tickets détaillés existent encore en caisse ou dans la base fidélité, on peut
    suivre nom par nom les porteurs de Nîmes et voir lesquels sont allés ailleurs. À vérifier sous quinze
    jours — la donnée est peut-être encore là, et elle est gratuite.

    3. **Reconstituer le compte des trois sites hors quote-part**, ligne par ligne, en distinguant ce
    qui est supprimable de ce qui ne l''est pas. Y compris l''éventuel loyer interne de Nîmes.

    4. **Facturer à l''e-commerce le service de retrait des commandes.** Attention : au niveau du groupe,
    cela ne crée pas un euro — c''est une écriture interne. Mais cela corrige la carte de rentabilité
    de nos magasins, et évite qu''on ferme demain un site pénalisé par une convention comptable.

    5. **Les 300 000 € : trois gisements, aucun dans les fermetures.** Les frais de siège et logistique
    (300 000 € = 4,7 % de 6,4 M€) ; le loyer de Vitry renégocié à l''échéance ; l''ajustement des effectifs
    aux flux réels — nous disposons de 24 mois de comptages à la demi-heure sur 19 magasins, jamais utilisés
    pour construire les plannings. Je ne peux pas garantir mardi que ces 300 000 € seront au rendez-vous.
    Je peux garantir que les chercher là a un sens, et que les chercher dans les fermetures n''en a aucun.


    ---


    ## 6. Ce qui me ferait changer d''avis


    Trois choses, et je les cherche activement :


    - Si le découpage des 6,4 M€ montre que **plus de 40 %** de la quote-part d''un magasin disparaît
    réellement à sa fermeture, Vitry redevient un candidat sérieux à l''échéance du bail.

    - Si les données de mars 2024 montrent un **report de clientèle élevé** (au-delà de la moitié), la
    fermeture de Vitry — 14 km du magasin suivant — devient rationnelle.

    - Un argument que je concède : n''avoir jamais fermé de magasin en vingt ans n''est pas seulement
    une force. Une enseigne incapable de fermer finit par porter indéfiniment ses sites faibles. Je ne
    propose pas de ne jamais fermer ; je propose de ne pas fermer **sur ces chiffres-là**, et de fixer
    une date à laquelle on décidera sur les bons.


    **Point de rendez-vous : comité de fin septembre**, avec le découpage des frais de siège, les comptes
    détaillés des trois sites, l''exploitation de mars 2024 et l''état de la négociation de Vitry. La
    décision sur Vitry sera prise là, avec des chiffres qui la supportent.


    ---


    Deux points à trancher si vous le souhaitez : je peux préparer une version d''une page pour l''actionnaire,
    expliquant pourquoi la cible de 300 000 € change de véhicule sans changer de montant — c''est la conversation
    la plus délicate du dossier, et il vaut mieux l''avoir avant mardi qu''après.

    '
