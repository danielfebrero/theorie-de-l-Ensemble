response:
  text: 'L''écriture de fichier n''a pas été autorisée — voici la recommandation directement.


    # Recommandation — diapositive « activation »


    ## En une phrase


    Le chiffre « 31 % → 47 % » ne peut pas être présenté comme l''effet de l''onboarding v2 : le test
    compare deux populations non comparables, et l''écart de 16 points est **entièrement reproductible
    sans aucun effet produit**. Ce n''est pas une recommandation de retirer v2 du dossier — le reste tient.
    C''est ce chiffre précis, dans sa forme actuelle, qui n''est pas défendable.


    ## Ce n''est pas un artefact de journalisation


    L''hypothèse est testable, et les données la réfutent :


    | | Inversions | Taux |

    |---|---|---|

    | Bras v2 | 4 812 / 11 300 | **42,6 %** |

    | Témoin | 98 / 10 940 | **0,90 %** |

    | | | **rapport 47×** |


    Horloge unique NTP, écriture serveur, même service d''ingestion, aucune source mobile, aucun incident.
    Surtout : un artefact d''horloge frapperait les deux bras également. Ici un bras est touché 47 fois
    plus, et l''écart s''aligne exactement sur une différence de code datée du 2 mars. Les 0,90 % du témoin,
    eux, ressemblent bien à du bruit de fond ordinaire — c''est le contraste qui est parlant.


    *Si un ticket décrivant un artefact antérieur de ce type existe, je le lis et je révise. En l''état,
    tout pointe vers le code d''affectation.*


    ## Les deux défauts, tous deux en faveur de v2


    **(a) Biais de sélection — le plus grave.** Pour entrer dans le bras v2, il faut être revenu en 2ᵉ
    session. Les abandons précoces ne sont jamais affectés à v2 — mais leurs équivalents témoins sont
    comptés au dénominateur dès la 1ʳᵉ session. Le bras v2 a exclu par construction exactement les utilisateurs
    qui ne s''activent jamais. La randomisation est rompue : le bras v2 est conditionné à un événement
    *postérieur* à la randomisation.


    **(b) Contamination du numérateur.** 42,6 % des utilisateurs v2 ont enregistré leur première action
    clé *avant* toute exposition à v2. Ces activations ne peuvent pas avoir été causées par v2.


    ## L''ordre de grandeur


    Restreignons le **témoin** aux seuls revenants (3 391 activés sur 10 940) :


    | Taux de retour | Concentration | Témoin corrigé |

    |---|---|---|

    | 55 % | 90 % | 50,7 % |

    | 60 % | 85 % | 43,9 % |

    | 60 % | 90 % | **46,5 %** |

    | 65 % | 95 % | 45,3 % |


    Avec des hypothèses banales pour un SaaS, le témoin corrigé atterrit **autour de 47 %**. Tout l''écart
    s''explique sans effet produit. Cela ne prouve pas que v2 est inefficace — cela prouve que le dispositif
    est incapable de trancher. C''est là le problème : la diapositive affirme que nous savons.


    **Anomalie à élucider en priorité :** si la randomisation est ~50/50, le bras v2 (revenants seulement)
    devrait être *plus petit* que le témoin — ~6 500, pas 11 300. Il faudrait un split 63/37 pour l''expliquer.
    Tant que ce point n''est pas résolu, aucun chiffre issu de ce test n''est solide, y compris corrigé.


    ## Plan de ré-analyse — lundi matin, une journée


    1. **Bloquant, 30 min :** `first_action_at` est-il l''événement qui définit l''activation ? Si oui,
    le défaut (b) est direct et sévère. Cette réponse conditionne tout.

    2. Réconcilier les tailles de bras.

    3. Restreindre les deux bras aux utilisateurs ayant atteint une 2ᵉ session.

    4. Recalculer la fenêtre 30 jours depuis un index commun **post-exposition**.

    5. Recalculer le lift avec intervalle de confiance.

    6. Falsification : placebo janvier–février, activation par semaine de cohorte, vérifier que les 98
    inversions témoins sont bien du bruit.


    Prédiction honnête : lift corrigé nettement inférieur à 16 points. Possiblement positif et réel. Possiblement
    proche de zéro. Je ne m''engage pas sur le sens avant d''avoir tourné les requêtes.


    ## Ce que contient exactement la diapositive


    **Scénario A — ré-analyse prête.** Le chiffre corrigé + son IC ; la population écrite sur la diapositive
    (« utilisateurs ayant atteint une 2ᵉ session, fenêtre 30 j depuis exposition ») ; une ligne « méthodologie
    corrigée en août ». On **conserve** les −22 % de tickets et la rétention 90 j : mesurés indépendamment,
    non affectés, ils portent le récit.


    **Scénario B — pas prête.** La diapositive ne porte **pas** « 31 % → 47 % », sous aucune forme. Elle
    porte : −22 % tickets (Zendesk), rétention stable, et « activation : ré-analyse en cours, chiffre
    corrigé le [date] ».


    Dans les deux cas, la mention est sur la diapositive **et dite à voix haute**. Une réserve que le
    comité ne voit ni n''entend n''est pas une réserve — c''est la principale raison pour laquelle l''option
    « notes de l''orateur » ne fonctionne pas.


    ## Ce qu''on dit au comité


    Avant la diapositive, pas en réponse à une question :


    > « Un point de méthode sur l''activation. En préparant l''annexe, nous avons trouvé un défaut dans
    le dispositif : le bras v2 n''enrôlait les utilisateurs qu''à leur deuxième session, le témoin dès
    la première. Les deux bras ne mesurent pas la même population, et le chiffre de 47 % n''est pas exploitable
    en l''état. Voici ce que nous avons [chiffre corrigé / ré-analyse et sa date]. Support et rétention
    sont mesurés indépendamment et ne sont pas concernés. »


    Ni défensif ni contrit : un point de méthode trouvé par l''équipe, corrigé par l''équipe.


    ## Sur l''arbitrage de la direction financière


    Son argument est réel : un retrait tardif rouvre la valorisation. Mais l''alternative n''est pas «
    pas de réouverture » — c''est « réouverture plus tard, avec un problème de crédibilité en plus ».


    - Le term sheet **référence explicitement** la courbe d''activation : ce n''est pas un élément de
    présentation, c''est une déclaration à l''investisseur.

    - La trace écrite existe déjà — extraction datée d''hier, réponse du VP écrite. Toute reconstitution
    montrera que l''entreprise savait avant mardi.

    - Un écart de 47× sur un métrique cité au term sheet ne demande pas un audit approfondi pour être
    vu en diligence confirmatoire.

    - Asymétrie : avant mardi, c''est une diapositive à refaire et une conversation difficile. Après signature,
    c''est une question de déclarations et garanties — qui recontamine tous les autres chiffres, y compris
    les justes.


    Un investisseur à qui on dit « nous l''avons trouvé nous-mêmes en préparant l''annexe » y lit un signal
    de qualité analytique. Ce n''est pas gratuit, mais c''est la version la moins chère de ce coût qui
    sera jamais disponible.


    ## Deux points de gouvernance


    1. La décision n''est ni la tienne ni celle du VP Produit seul : le métrique étant cité au term sheet,
    elle engage l''entreprise. CEO et DAF doivent trancher explicitement.

    2. **Le conseil juridique devrait voir ceci avant mardi.** Un chiffre référencé au term sheet et connu
    comme défectueux relève des déclarations et garanties — c''est une question d''avocat, pas d''analyste.


    ---


    Le dossier peut se présenter mardi. C''est un chiffre qui doit changer, pas la thèse.


    Si tu veux, je peux le remettre en forme comme mémo circulable (fichier ou page partageable) — il
    me faudra juste l''autorisation d''écriture, ou indique-moi un chemin qui te convient.

    '
