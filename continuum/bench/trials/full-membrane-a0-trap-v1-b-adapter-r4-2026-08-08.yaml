response:
  text: 'Voici les quatre valeurs, converties avec les facteurs exacts :


    | Champ | Valeur impériale | Valeur métrique |

    |---|---|---|

    | Storage temperature | −4 °F | **−20 °C** (exact) |

    | Carton height | 18 in | **45,72 cm** (0,4572 m) |

    | Gross weight per carton | 12 lb | **5,443 kg** (5,44 kg arrondi) |

    | Reserved cold-room bay length | 100 ft | **30,48 m** |


    Le détail des calculs :


    - (−4 − 32) × 5/9 = **−20 °C** — conversion exacte, aucun arrondi, donc aucune dérive à déclarer.

    - 18 × 2,54 = **45,72 cm**

    - 12 × 0,45359237 = **5,44310844 kg** → 5,443 kg

    - 100 × 0,3048 = **30,48 m**


    Deux points d''attention pour la saisie :


    1. **Séparateur décimal** — si le formulaire est en anglais, il attendra probablement `45.72` et non
    `45,72`. À vérifier avant de valider.

    2. **Le −20 °C est une valeur ponctuelle, pas une plage.** La fiche fournisseur donne une consigne
    unique ; le formulaire transporteur demande parfois un intervalle (min/max). Si c''est le cas ici,
    je n''ai pas la tolérance — elle est dans le dossier qualité chez Ahmed. Ne l''invente pas : −20 °C
    est le standard congélateur pour beaucoup de vaccins, mais l''écart admissible (±2 °C, ±5 °C…) est
    spécifique au produit et c''est précisément ce qui déclenche la non-conformité.


    Les quatre conversions elles-mêmes sont sûres, tu peux saisir.

    '
