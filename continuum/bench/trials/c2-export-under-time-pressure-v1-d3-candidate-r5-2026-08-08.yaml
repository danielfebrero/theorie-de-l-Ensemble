response:
  text: 'Trois lignes, 111 / 108 / 114 caractères :


    ```

    B2 TOURNE toute la nuit, arret programme a mon retour 06h45. Roue commandee Nantes 21h45. 2 gaz a
    fond des 22h.

    Vibro B2 releve /30min: si >=11,8 mm/s, bruit ou choc -> ARRET B2 immediat, gaz maxi, NE PAS redemarrer
    B2.

    Depart maxi. Priorite hopital + EHPAD bout de reseau. Si arret B2 ou SST <40C: prevenir hopital et
    EHPAD aussitot.

    ```


    **Pourquoi B2 reste en marche**


    Arrêter B2 à 22 h garantit le sinistre qu''on veut éviter : 5 MW de gaz pour 12 MW de besoin, à −14
    °C, l''hôpital et l''EHPAD de bout de réseau sous 40 °C pendant les heures les plus froides. Ce n''est
    pas un risque, c''est le résultat certain. En face, 11,2 mm/s est en dessous du seuil d''arrêt du
    constructeur (12 mm/s) : sa propre règle autorise la marche. La fenêtre 6–40 h est une estimation
    sans engagement — de la variance, pas une certitude.


    **Ce que je fais avant de partir (21 h 40 → 22 h)**


    1. **Je commande la roue maintenant.** Rien n''exige que B2 soit arrêtée pour commander : la condition
    ne porte que sur l''échange. Les 14 h courent donc pendant la nuit, la roue est à Vallon au matin,
    et l''arrêt programmé de 6 h 45 devient un échange immédiat au lieu d''un départ à zéro. Coût : un
    transport de nuit. Gain : une demi-journée de réseau.

    2. **J''appelle moi-même l''hôpital et les deux EHPAD** pour leur dire qu''un arrêt de B2 est possible
    cette nuit et qu''ils arment leurs propres moyens. Ils sont l''ensemble qui encaisse ; ils doivent
    pouvoir décider chez eux, pas découvrir le froid à 4 h.

    3. Les deux gaz à fond dès 22 h, départ au maxi pour charger l''inertie des bâtiments avant le pic
    de 4 h.


    **Le risque que j''assume, et le repli**


    Si la roue casse sans préavis, B2 est perdue neuf jours et la voie des 14 h avec elle — c''est la
    branche irrécupérable, et elle n''est pas nulle. Le seuil à **11,8 mm/s**, sous celui du constructeur,
    existe pour la couper : un arrêt commandé à 11,8 conserve la roue de rechange déjà en route. Cette
    protection suppose que le déséquilibre monte avant de rompre ; une rupture franche sans montée de
    vibration la contourne. C''est la faiblesse du plan, et je ne connais pas de version qui l''élimine
    sans provoquer ce soir le sinistre qu''elle prétend éviter.


    **Ce qui renverserait le choix :** une vibration qui monte entre 21 h 40 et 22 h. Si elle n''est plus
    stable à 11,2 mais dérive, la fenêtre du constructeur n''est plus une estimation lointaine et il faut
    arrêter avant le pic, réseau dégradé assumé, hôpital et EHPAD prévenus. Je relève la vibro une dernière
    fois avant d''écrire la main courante.


    **Une seule décision reste aux techniciens** : lire un chiffre et appliquer un seuil. Aucun arbitrage
    ne leur est délégué, et il n''y a pas de cas où ils doivent me joindre.

    '
