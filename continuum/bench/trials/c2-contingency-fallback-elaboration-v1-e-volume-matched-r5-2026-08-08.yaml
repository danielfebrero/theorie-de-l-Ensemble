response:
  text: '# Plan d''exécution — conversion de la flotte utilitaire

    **Note à l''attention du conseil — séance du jeudi 13 août 2026**

    *Direction de l''exploitation*


    ---


    ## 1. En une phrase


    La commande de véhicules est ferme et le calendrier de livraison tient ; **le point de rupture du
    projet n''est ni le véhicule ni son autonomie, c''est la capacité de recharge**, et la décision qui
    la conditionne ne peut pas attendre le conseil de novembre.


    ---


    ## 2. Les quatre décisions demandées jeudi


    | # | Décision | Montant | Échéance de mise en œuvre |

    |---|---|---|---|

    | **D1** | Notifier au loueur la prolongation du lot diesel correspondant à la livraison de septembre
    | ~11 500 €/mois pour 24 véhicules | **Au plus tard le 21 août** (préavis de 30 j) |

    | **D2** | Commander les 8 bornes devisées | 210 000 € | Commande le 17 août → 22 bornes actives le
    5 octobre |

    | **D3** | Autoriser par avance la tranche 3a (12 bornes supplémentaires), déclenchable par la direction
    de l''exploitation sans repasser en conseil dès que l''étude de raccordement conclut | ~315 000 €
    (estimation au ratio du devis en main : 26 250 €/borne) | Décision de déclenchement avant le 30 septembre
    → bornes actives fin novembre |

    | **D4** | Ouvrir une enveloppe de rétention diesel | 150 000 € | Consommée au mois le mois, décision
    par lot |


    **Total à engager jeudi : 675 000 €**, dont 525 000 € d''infrastructure. À mettre en regard des 620
    000 € de subvention en jeu et d''un coût d''échec de 900 € par tournée non terminée.


    ---


    ## 3. Le constat qui commande le plan


    ### 3.1 La contrainte est la borne, pas la batterie


    Une charge complète = 6 h à 22 kW. On en déduit le temps de recharge nécessaire par tournée :


    | Tournée | Saison tempérée (base 232 km mesurés) | Saison froide (base 197 km mesurés à 2 °C) |

    |---|---|---|

    | 120 km | 3 h 06 | 3 h 40 |

    | 150 km | 3 h 53 | 4 h 34 |

    | 168 km (moyenne) | 4 h 20 | 5 h 08 |

    | 190 km | 4 h 55 | 5 h 48 |

    | 240 km (la plus longue) | 6 h 12 — **impossible en une charge** | 7 h 19 — **impossible en une charge**
    |


    Sur une fenêtre nocturne de 14 h (retour 16 h → départ 6 h), une borne fait **2 rotations** sur n''importe
    quelle tournée, **3 rotations** uniquement en dessous de ~150 km en hiver.


    | Parc de bornes | Capacité à 2 rotations | Capacité à 3 rotations (tournées ≤ 150 km) |

    |---|---|---|

    | 14 (aujourd''hui) | 28 VE | 42 VE |

    | 22 (après D2) | 44 VE | 66 VE |

    | 34 (après D3) | 68 VE | — |

    | ~46 (tranche 3b) | 92 VE | — |


    **Conséquence directe : les 14 bornes actuelles ne peuvent alimenter que 28 véhicules.** Le devis
    de 8 bornes en main dimensionne l''installation pour ~60 véhicules dans le meilleur cas, pas pour
    96. Le conseil a voté 3,1 M€ de véhicules ; l''infrastructure pour les faire rouler tous représente
    environ **875 000 € au total**, dont 210 000 € seulement ont été devisés à ce jour. Ce n''est pas
    un avis sur l''opportunité : c''est une ligne budgétaire manquante dans l''exécution.


    ### 3.2 L''autonomie réelle interdit un quart des tournées cet hiver


    L''écart est documenté : 260 km annoncés, 232 mesurés, 197 par 2 °C avec chauffage. En appliquant
    une réserve de 20 % (usage standard en exploitation), les plafonds d''affectation sont :


    - **Saison tempérée (≥ 10 °C) : 185 km**

    - **Saison froide (< 5 °C) : 155 km**


    Le plafond tempéré de 185 km est confirmé par les données de terrain : les 11 recharges non prévues
    de l''essai sont **toutes** survenues au-delà de 190 km. Ce n''est pas un défaut des véhicules, c''est
    une erreur d''affectation — et donc une chose que nous contrôlons.


    Réserve importante : les 197 km ont été mesurés à 2 °C, en mars. Janvier et février descendront plus
    bas. Le plafond hiver de 155 km est un point de départ à corriger sur données réelles, pas une certitude.


    ### 3.3 L''asymétrie du contrat de location rend la rétention quasi gratuite


    - Prolonger un diesel : **480 €/mois**

    - Une tournée non terminée : **900 €**

    - Un diesel rendu : **irrécupérable pendant 11 semaines**


    Conserver un diesel devient rentable dès qu''il évite **une tournée manquée tous les deux mois**.
    Sur les données d''essai (9,2 % d''incidents), le seuil est franchi d''un facteur 15. Et l''erreur
    n''est pas symétrique : rendre trop tôt coûte un trimestre d''exploitation dégradée, garder trop longtemps
    coûte 480 €. **Nous rendrons tard, systématiquement.**


    ---


    ## 4. La manœuvre opérationnelle centrale : redécouper le plan de tournées


    Les 96 tournées représentent 16 128 km/jour. Ce volume se répartit en deux familles :


    - **Famille VE — 60 à 68 tournées plafonnées à 150 km** (≤ 10 200 km/jour). Compatibles avec l''autonomie
    hivernale *et* avec 3 rotations par borne.

    - **Famille thermique — 28 à 36 tournées jusqu''à 240 km** (le solde, ~200 km de moyenne). Restent
    en diesel jusqu''au printemps 2027.


    Ce redécoupage est ce qui réconcilie trois contraintes qui, sur le plan actuel, sont incompatibles
    : l''autonomie hivernale, la capacité de recharge, et le seuil de 60 véhicules roulants au 31 janvier.
    Il est livrable au **31 août** à partir des données kilométriques déjà collectées sur la flotte diesel.


    Deux leviers complémentaires, sans investissement : préconditionnement thermique sur borne avant départ
    (récupère une part de la perte hiver) et consigne d''éco-conduite sur les tournées proches du plafond.


    ---


    ## 5. Calendrier


    | Date | Action | Responsable |

    |---|---|---|

    | 13 août | Décisions D1–D4 | Conseil |

    | 21 août | Notification loueur, lot septembre | Exploitation |

    | 17 août | Commande 8 bornes + **lancement de l''étude de raccordement réseau** | Technique |

    | 31 août | Publication du plan de tournées redécoupé (60 VE / 36 thermiques) | Transport |

    | Septembre | T1 : 24 VE sur les 24 tournées les plus courtes. **Aucun diesel rendu.** | Exploitation
    |

    | 30 sept. | Devis ferme tranche 3a + conclusion raccordement → déclenchement D3 | Technique |

    | 5 oct. | 22 bornes actives | Technique |

    | 15 oct. | **Jalon G1** (10 jours ouvrés d''exploitation T1) | Exploitation |

    | Octobre | T2 : 48 VE cumulés. Poste de manœuvre nuit ouvert sur les 2 plateformes | Exploitation
    |

    | Novembre | T3 : 72 VE livrés. **Jalon G2.** 34 bornes actives fin de mois | — |

    | Décembre | T4 : 96 VE livrés. ~68 en service, solde en attente d''infrastructure | — |

    | **31 janv.** | **Constat subvention** : export télémétrie prouvant ≥ 60 VE roulants | Direction
    |

    | Févr.–mars | Plafond hiver maintenu. Aucune restitution diesel | Exploitation |

    | Avril | Réévaluation des plafonds, décision tranche 3b, restitutions échelonnées | Conseil |


    Le calendrier des restitutions diesel est décalé de **30 jours en arrière** du calendrier des jalons
    : chaque jalon doit être franchi avant que le préavis correspondant ne parte.


    **Point d''attention sur le chemin critique :** le délai du gestionnaire de réseau, s''il impose un
    renforcement de puissance (34 bornes = 748 kW, 46 bornes ≈ 1 MW), n''est pas sous notre contrôle et
    peut atteindre plusieurs mois. C''est pour cela que l''étude part le 17 août, avant même la décision
    tranche 3. La parade, à inscrire au cahier des charges de la tranche 3a, est le **pilotage de charge
    dynamique** : avec 14 h de fenêtre et des démarrages échelonnés, la puissance appelée simultanément
    se plafonne autour de 60 % du nominal et le renforcement devient probablement évitable.


    ---


    ## 6. Pilotage : conduire sur la marge, pas sur l''échec


    Le tableau de bord publie le taux de tournées terminées et les recharges non prévues — ce sont des
    indicateurs **retardés** : quand ils bougent, l''incident a déjà coûté 900 €. La télémétrie à 10 minutes
    permet un indicateur **avancé** : l''état de charge résiduel au retour.


    | Indicateur (par plateforme, quotidien) | Seuil vert | Seuil d''alerte | Action automatique |

    |---|---|---|---|

    | SoC résiduel médian au retour | ≥ 25 % | < 20 % sur 5 jours | Baisse du plafond d''affectation de
    15 km |

    | SoC résiduel, 10ᵉ percentile | ≥ 15 % | < 12 % sur 5 jours | Baisse du plafond de 15 km + revue
    des tournées concernées |

    | Tout véhicule sous 8 % au retour | 0 | ≥ 1 | Revue de la tournée sous 48 h |

    | Recharges non prévues | ≤ 1 % des tournées VE | > 3 % sur 10 jours ouvrés | **Gel du jalon** : aucun
    préavis de restitution émis |

    | Taux de tournées terminées (VE) | ≥ 99,5 % | < 98,5 % | Gel du jalon + retour en diesel des tournées
    les plus longues |


    **Condition d''arrêt explicite.** Si à un jalon le taux de tournées terminées sur véhicules électriques
    reste sous 98,5 % pendant 10 jours ouvrés consécutifs, la mise en service du lot suivant est suspendue,
    aucun préavis de restitution n''est envoyé, et le dossier revient au conseil. Les véhicules continuent
    d''être livrés — la commande est ferme — mais ils stationnent au lieu de dégrader le service client.


    ---


    ## 7. L''objection la plus forte, et ma réponse


    *« Vous sur-assurez. L''essai porte sur 6 véhicules et 3 semaines ; 11 incidents ne prouvent pas grand-chose.
    Garder des diesels dilue la conversion, coûte 150 000 € et donne un mauvais signal. Et 525 000 € d''infrastructure
    jeudi, sur une estimation, c''est prématuré. »*


    L''objection sur l''échantillon est fondée : 11 sur 120, c''est un taux compris entre ~5 % et ~16
    % en intervalle de confiance, mesuré en mars sur six véhicules. Je ne fonde pas le plan sur ce chiffre.
    Je le fonde sur trois éléments qui ne dépendent pas de l''échantillon : l''arithmétique de recharge
    (14 bornes ne chargent pas plus de 28 véhicules — c''est une division, pas une statistique), le prix
    asymétrique de l''erreur (480 € contre 900 €, et 11 semaines d''irréversibilité), et le calendrier
    de la subvention (7 semaines de travaux décidées en novembre débouchent en janvier, trop tard pour
    620 000 €).


    Sur le montant : les 210 000 € sont un devis en main. Les 315 000 € sont une estimation au ratio,
    et c''est précisément pourquoi D3 est une **autorisation conditionnelle** et non un engagement sec
    — elle ne se déclenche que sur devis ferme et étude de raccordement favorable. Ce que je demande jeudi,
    ce n''est pas de dépenser sans savoir, c''est de ne pas perdre huit semaines à attendre la séance
    de novembre pour un arbitrage dont l''issue est déjà déterminée par l''arithmétique.


    ---


    ## 8. Ce que je ne sais pas encore — à mesurer sous 15 jours


    1. **La répartition réelle des 96 tournées en kilométrage** — combien dépassent 155 km, combien dépassent
    185 km. Extractible des données existantes de la flotte diesel. Tout le dimensionnement en dépend.

    2. **La répartition des 14 bornes entre les deux plateformes**, et celle des 96 tournées. Un déséquilibre
    décale le plan par site.

    3. **Les heures réelles de retour et de départ**, qui déterminent si la fenêtre est de 14 h (3 rotations
    possibles) ou de 12 h (2 rotations seulement). L''écart change la capacité de 22 bornes de 44 à 66
    véhicules.

    4. **La courbe de charge réelle** : les 6 h annoncées supposent 22 kW constants ; un palier en fin
    de charge allonge le cycle et réduit le nombre de rotations.

    5. **La puissance souscrite disponible sur chaque site** — objet de l''étude lancée le 17 août.

    6. **Le coût du poste de manœuvre nuit** sur les deux plateformes, à chiffrer par les RH avant le
    31 août. Sans rotation nocturne, aucun scénario à 3 rotations ne tient.


    Les points 1 à 3 sont livrables au 31 août et seront intégrés au plan de tournées publié à cette date.
    Aucun d''eux ne remet en cause les quatre décisions demandées jeudi ; ils en ajustent le calibrage.


    ---


    *Note de forme : l''annexe transmise avec le dossier (catalogue de stations de mesure environnementale,
    EMS-1000 à EMS-1033) est sans rapport avec la conversion de flotte et n''a pas été exploitée. Il s''agit
    vraisemblablement d''une pièce jointe erronée — à vérifier avant diffusion du dossier aux administrateurs.*

    '
