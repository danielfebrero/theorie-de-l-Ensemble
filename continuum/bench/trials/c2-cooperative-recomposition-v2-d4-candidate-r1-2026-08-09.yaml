response:
  text: '# Position de la présidence — commission locale de l''eau du bassin de la Vèze

    ## Séance du jeudi — répartition de la ressource en période d''étiage


    ---


    ## 1. Ce qui n''est pas arbitrable, et pourquoi ce n''est pas mon choix


    **Les 180 L/s de débit réservé ne sont pas une variable de la négociation.** Deux raisons distinctes,
    et il faut les tenir séparées :


    - Ils sont fixés par arrêté préfectoral. La commission n''a pas compétence pour les abaisser. Toute
    délibération qui les traiterait comme une part à répartir serait attaquable, et le serait avec succès.

    - Le rapport hydrobiologique du 12 juin qualifie la perte de non reconstituable à l''échelle d''une
    décennie. Ce n''est pas une perte lourde : c''est une perte qui ne revient pas. Une récolte perdue
    est une année, elle est indemnisable et assurable. Deux frayères asséchées ne se rachètent avec aucun
    fonds départemental.


    **Le besoin vital en eau potable n''est pas arbitrable non plus.** 9 200 habitants et un EHPAD de
    110 lits : l''alimentation des foyers, de l''établissement, de la défense incendie est garantie sans
    condition et servie en premier parmi les usages que j''arbitre.


    Mais « besoin vital garanti » et « 150 L/s garantis » sont deux phrases différentes, et c''est là
    que se trouve le cœur du dossier.


    ---


    ## 2. Le chiffre qui ne tient pas : 150 L/s pour 9 200 habitants


    150 L/s, c''est 12 960 m³ par jour, soit **1 409 litres par habitant et par jour**.


    La consommation domestique française est de l''ordre de 150 L/hab/j. Même en additionnant l''EHPAD,
    les bâtiments publics, les commerces, l''artisanat et un rendement de réseau franchement mauvais —
    disons 50 % de pertes — on n''atteint pas 55 L/s. Le prélèvement de la régie est **de l''ordre de
    trois à cinq fois** ce que sa population expliquerait.


    Trois explications possibles, et une seule d''entre elles est vraie :

    1. la régie dessert un périmètre bien plus large que Ferney ;

    2. le réseau perd la majeure partie de ce qu''il produit ;

    3. un gros consommateur non domestique est adossé au réseau.


    Je n''ai pas la réponse — la régie ne l''a pas fournie. Je pose donc ceci comme la question la plus
    rentable du dossier, pas comme un constat : **une partie des 160 L/s manquants est peut-être déjà
    dans le réseau de Ferney.** Un litre récupéré sur une fuite est un litre qui ne coûte rien à personne.
    C''est la seule ligne du dossier qui *crée* de l''eau au lieu de la déplacer.


    Et c''est pourquoi je ne peux pas accepter la position de la régie. Refuser d''ouvrir la discussion
    tant que la dotation n''est pas garantie, c''est refuser d''ouvrir précisément l''endroit où se trouve
    peut-être la solution. **Je garantis la fonction, pas le volume.**


    **Exigence, sous 5 jours :** périmètre desservi, volumes produits et facturés, indice linéaire de
    pertes, débits de nuit sectorisés, liste des gros abonnés non domestiques. À défaut, je fixe le plafond
    sans ces données, et je le fixe bas — l''absence de données ne peut pas être un avantage.


    ---


    ## 3. Ce que je conteste, et ce que je ne conteste pas, chez les maraîchers


    **Ce que je ne conteste pas.** 240 L/s sur 620 ha représente 3,3 mm/jour. Pour du maraîchage en août,
    ce n''est pas une demande gonflée — c''est une demande serrée, voire déficitaire selon les modes d''irrigation.
    4,1 M€ sur 620 ha font 6 600 €/ha : c''est un ordre de grandeur crédible pour une marge, plutôt bas
    même. 90 emplois pour 620 ha est cohérent. Je le dis à la commission parce que le dossier circule
    avec le soupçon inverse, et que le soupçon est infondé.


    **Ce que je conteste : la marche d''escalier.** « En dessous de 240, on perd tout » n''est pas crédible
    et n''est étayé par rien. La relation entre déficit hydrique et perte de rendement est progressive,
    et elle dépend de la culture et du stade. Une salade à trois semaines de la récolte, une tomate en
    pleine nouaison et un poireau repiqué en juillet n''ont ni le même besoin ni la même valeur au litre.
    Présenter 620 hectares comme un bloc indivisible, c''est refuser l''arbitrage — et c''est ce qui a
    conduit à quitter la salle.


    **Ce que je constate : la commission ne détient aucune donnée parcellaire.** Ni cultures, ni stades,
    ni compteurs. Cela a une conséquence directe sur le choix de l''instrument, au point suivant.


    ---


    ## 4. La décision : volume global par usage, et non quotas individuels


    Mon règlement m''ouvre les deux voies. **Je retiens le volume global par usage.** Trois raisons :


    **Un quota individuel sans compteur est une fiction.** Sans relevés, il n''est ni vérifiable ni opposable.
    Je fabriquerais une règle inapplicable, ce qui est pire qu''une règle dure.


    **Il n''existe aucune clé de répartition neutre, et prétendre le contraire est malhonnête.** Six exploitations
    cultivent 300 ha sur 620. Une répartition à l''hectare leur donne 48 % du volume ; une répartition
    par exploitation leur en donne 18 %. Le choix de la clé *est* la décision politique. Je ne veux pas
    la prendre à leur place en la déguisant en calcul.


    **L''information est chez eux, pas chez moi.** Eux seuls savent quelle parcelle est à trois semaines
    de la récolte et laquelle est perdue de toute façon.


    Donc : **je fixe le volume, ils écrivent la répartition** — c''est un transfert de pouvoir réel, pas
    une consultation. Sous quatre conditions non négociables :


    1. **Plan écrit et signé sous 5 jours**, exprimé non pas en hectares fixes mais en **rangs de priorité
    par parcelle** (rang 1 = sauvé jusqu''au palier le plus bas, rang 2 = sauvé au-dessus de 360 L/s,
    etc.). Le volume disponible va bouger ; un plan à hectares fixes sera caduc en une semaine.

    2. **Déclaration parcellaire jointe** : surface, culture, stade, mode d''irrigation. Elle conditionne
    l''accès à l''indemnisation.

    3. **Compteur posé** sur chaque point de prélèvement avant remise en eau, financé par le fonds. Condition
    d''accès à l''eau *et* à l''argent.

    4. **Plancher de viabilité pour les petites exploitations** : aucune des 28 autres ne peut être ramenée
    à zéro par le plan.


    **Clé applicable par défaut, à défaut de plan signé au cinquième jour** — je l''annonce maintenant
    pour qu''elle soit connue, et je l''annonce délibérément moins bonne qu''un accord : 40 % du volume
    réparti à parts égales entre les 34 exploitations, 60 % au prorata de la surface. Les six grandes
    y obtiennent environ 36 % du volume contre 48 % de la surface. C''est un choix, il est discutable,
    il est sur la table jeudi — et il tombe automatiquement si le plan collectif existe.


    ---


    ## 5. L''allocation


    **Le chiffre décisif, à dire d''entrée aux maraîchers :** avec 75 L/s, l''arithmétique n''est pas
    « 31 % d''eau sur 620 ha ». C''est **100 % d''eau sur environ 195 ha**. Un rationnement uniforme met
    toutes les cultures en déficit et peut tout perdre partout. La concentration en sauve une part. C''est
    toute la raison d''être du plan de priorités.


    | | Immédiat (J+1) | Après audit (J+7), hyp. basse | Après audit, hyp. médiane |

    |---|---|---|---|

    | Débit mesuré | 410 | 410 | 410 |

    | Marge d''incertitude métrologique | −20 | 0 | 0 |

    | Débit réservé (plancher dur) | 180 | 180 | 180 |

    | Eau potable | 135 | 130 | 110 |

    | **Irrigation** | **75** | **100** | **120** |

    | Surface irrigable à plein régime | ~195 ha | ~260 ha | ~310 ha |


    **Sur la marge de 20 L/s.** La station du barrage est l''unique point de mesure et n''a pas été étalonnée
    depuis 2023. Une dérive de 10 % représente 41 L/s — plus du quart du déficit. Si la station sur-estime,
    nous sommes déjà sous le débit réservé sans le savoir. Je réserve donc 20 L/s tant que la mesure n''est
    pas confirmée, et cette marge pèse sur l''usage arbitrable, pas sur le plancher irréversible. **Jaugeage
    contradictoire sous 5 jours**, en présence des trois parties : c''est peu coûteux, c''est rapide,
    et c''est la façon la plus rapide de rendre 20 L/s aux maraîchers. Ils ont intérêt à le demander,
    pas à le craindre.


    **Les 15 L/s immédiats sur le potable** ne demandent aucun audit : suspension sous 48 h de l''arrosage
    des espaces verts, du lavage de voirie, des fontaines non recirculantes, du remplissage des piscines
    et bassins. Ces usages ne relèvent d''aucune fonction vitale.


    **Paliers dégradés, déclenchement automatique, notifiés à l''avance :**


    | Déclencheur observable | Effet |

    |---|---|

    | Débit entrant < 360 L/s, 3 jours consécutifs | Irrigation ramenée à 45 L/s (rangs 1 uniquement)
    |

    | Débit < 330 L/s, 3 jours consécutifs | Irrigation 25 L/s — arrosage de survie seul : plants, pépinière,
    cultures pérennes |

    | Débit < 300 L/s | Irrigation suspendue |

    | Débit < 200 L/s | Le débit réservé lui-même est en cause : saisine immédiate du préfet, hors ma
    compétence |

    | Réserve tampon Ferney < 2 jours | Priorité potable absolue, irrigation coupée sous 24 h |


    Quatre jours de réserve, c''est très mince. **Contingence EHPAD indépendante du réseau** : marché
    d''eau embouteillée et convention de citernage contractés cette semaine, pas le jour où ils seront
    nécessaires. C''est une assurance à quelques milliers d''euros contre la seule branche du dossier
    qui coûte des vies.


    ---


    ## 6. Les 600 000 € : ce qu''ils achètent, et ce qu''ils n''achètent pas


    Je refuse l''usage réflexe — une indemnité forfaitaire répartie au prorata. Elle serait consommée
    en pur transfert, elle validerait un préjudice non vérifié, et l''an prochain nous serions exactement
    au même point avec 600 000 € de moins.


    | Poste | Montant | Justification |

    |---|---|---|

    | Recherche et réparation de fuites, Ferney | 180 k€ | Seule ligne qui *crée* du débit. Meilleur rendement
    en L/s par euro. Profite aux trois parties. |

    | Comptage (34 exploitations + sectorisation réseau) | 60 k€ | Sans compteurs, aucune règle n''est
    vérifiable, ni cette année ni les suivantes. |

    | Métrologie hydrologique : jaugeages, ré-étalonnage, second point de mesure aval | 50 k€ | Tout l''arbitrage
    repose aujourd''hui sur une station unique non étalonnée depuis 2023. |

    | Indemnisation de l''abandon délibéré de surface | 290 k€ | Versée à ceux qui renoncent *dans le
    cadre du plan collectif*, sur déclaration vérifiée et compteur posé. Priorité aux petites exploitations.
    |

    | Contingence EHPAD (embouteillée, citernage) | 20 k€ | Couverture de la branche de perte non compensable.
    |


    **Ce que le fonds ne fait pas, et je le dis sans l''enrober :** 290 k€ répartis sur environ 425 ha
    abandonnés font 680 €/ha, contre 6 600 €/ha de préjudice déclaré. **Le fonds couvre à peu près un
    dixième du dommage.** Il n''achète pas la perte, il achète l''arbitrage — il rend possible que quelqu''un
    renonce, ce qui autrement n''arrive jamais. Le dommage lui-même relève d''un autre canal, et je le
    dis aux maraîchers dès jeudi : **dossier calamité agricole et activation de l''assurance multirisque
    climatique montés en parallèle, dégrèvement de taxe foncière sur le non bâti demandé**. C''est là
    que se trouvent les millions, pas dans les 600 000 €.


    ---


    ## 7. La règle de levée, qui remplace celle de 2022


    Le dispositif de 2022 est l''échec documenté du dossier : 48 h au-dessus du seuil, levée totale, effondrement
    en quatre jours. La raison est physique et il faut la nommer devant la commission — **un orage produit
    un pic de ruissellement, pas une recharge**. Le pic passe dans la rivière ; la nappe, elle, n''a rien
    reçu. Une règle qui lit le pic comme un stock se trompera à chaque orage.


    Règle nouvelle :


    - **Aucune levée automatique.** Chaque desserrement est une décision notifiée de la commission, prise
    sur mesure.

    - **Moyenne glissante sur 10 jours**, jamais une valeur instantanée ni 48 h.

    - **Deuxième condition indépendante de la station du barrage** : remontée du niveau piézométrique.
    Un pic de ruissellement lève le débit sans lever la nappe ; exiger les deux élimine le faux signal.

    - **Desserrement par paliers de 20 L/s**, jamais total.

    - **Cliquet asymétrique** : le resserrement est immédiat, sur un seul jour sous seuil ; le desserrement
    est lent. L''asymétrie n''est pas de la prudence décorative — elle vient du fait que se tromper dans
    un sens coûte une décade d''écosystème et dans l''autre une semaine de rendement.


    ---


    ## 8. Ce qui renverserait ma position


    Je l''écris pour qu''on puisse me le retourner :


    - **Le jaugeage contradictoire.** Si la station dérive de plus de 10 %, tout le bilan change et je
    rouvre l''ensemble sous 48 h — dans les deux sens.

    - **Le périmètre de la régie.** S''il s''avère que la régie dessert bien au-delà de Ferney et que
    ses 150 L/s sont normaux, alors le volume sur lequel je compte n''existe pas, et l''allocation d''irrigation
    ne remonte pas — elle reste à 75-80. Je préfère l''annoncer maintenant que le découvrir au septième
    jour.

    - **Une expertise hydrobiologique contradictoire** sur le seuil de 180. Elle ne relèverait pas de
    ma compétence, mais je la porterais au préfet.


    ---


    ## 9. Le meilleur argument contre moi


    Je le formule aussi fort que je peux, parce qu''il sera dans la salle :


    > *« Vous sacrifiez 4,1 M€ et 90 emplois — des familles, maintenant — pour des truites documentées
    par un seul rapport, et pour des fuites que vous n''avez pas mesurées. Si l''audit du réseau ne trouve
    rien, vous aurez ruiné 34 exploitations sur une hypothèse. »*


    Il porte sur un point, et je le concède : **si l''audit ne trouve rien, je n''ai pas de réserve, et
    l''irrigation reste autour de 100 L/s.** Je ne promets à personne une eau que je n''ai pas.


    Sur le reste, il ne tient pas. Le préjudice de 4,1 M€ est déclaratif, produit par la partie qui en
    bénéficie, et invérifiable en l''absence de toute donnée parcellaire — ce qui ne le rend pas faux,
    mais m''interdit de lui subordonner une perte, elle, documentée. Les 180 L/s ne sont pas à moi : les
    abaisser expose chacune de mes décisions à l''annulation. Et l''asymétrie est décisive : une récolte
    perdue est une année, elle s''assure, elle se replante ; une frayère asséchée est une décennie, et
    elle ne s''indemnise pas.


    En contrepartie de ce que je concède, je prends un engagement écrit : **tout volume récupéré sur le
    réseau va à l''irrigation, pas au confort du potable.** C''est peu, mais c''est ferme, et c''est vérifiable.


    ---


    ## 10. Ce que je dis à chacun, jeudi


    **Aux maraîchers, qui ont quitté la salle.** Partir n''a pas baissé le déficit d''un litre ; ça a
    seulement laissé la clé de répartition se choisir sans vous. Je ne vous impose pas de quotas : je
    vous donne le volume et **c''est vous qui écrivez la répartition** — c''est un pouvoir réel, celui
    que la commission aurait normalement exercé à votre place. Vous siégez au comité hebdomadaire de mesure.
    Les 290 000 € vont à ceux qui renoncent dans le cadre du plan, pas à ceux qui protestent le plus fort.
    Et je vous dis la vérité entière : 75 puis 100 L/s, ce n''est pas 240, et il n''existe aucune version
    de ce dossier où ça le devient.


    **À la régie.** Votre fonction vitale est garantie, sans condition, par écrit, et servie en premier
    parmi les usages que j''arbitre — les foyers, l''EHPAD, la défense incendie ne sont touchés dans aucun
    scénario. Ce que je ne peux pas garantir, c''est 150 L/s, parce que 1 409 litres par habitant et par
    jour ne se justifie pas tout seul. Votre refus de discuter avant garantie ferme la porte derrière
    laquelle se trouve peut-être l''eau qui manque à tout le monde. Vos données au cinquième jour, comme
    les maraîchers rendent les leurs le même jour — j''exige le même effort de preuve des deux côtés.
    Et 180 000 € pour vos fuites : c''est un audit qui vous est payé, pas une sanction.


    **À la presse et au public.** Ce n''est pas « les paysans contre les robinets ». Il y a une troisième
    partie, elle n''a pas de siège dans cette salle, et c''est la seule dont la perte ne revient pas.
    Je propose donc que la fédération de pêche et l''auteur du rapport du 12 juin siègent à la commission
    dès jeudi — pas en audition, avec voix. Et je verse au débat public le chiffre qui manque à tous les
    articles parus : 1 409 litres par habitant et par jour.


    ---


    ## 11. Calendrier et première action


    | Échéance | Acte |

    |---|---|

    | **Demain** | Notification de la suspension des usages non vitaux du réseau (48 h). Commande du jaugeage
    contradictoire. Ouverture des marchés EHPAD (embouteillée, citernage). |

    | **Jeudi, séance** | Adoption de la position ; volumes globaux par usage ; paliers dégradés ; abrogation
    de la règle de levée de 2022 ; entrée de la partie environnementale à la commission ; engagement du
    fonds. |

    | **J+5** | Données régie et déclarations parcellaires + plan collectif de priorités. Résultat du
    jaugeage. À défaut de plan : la clé par défaut s''applique. |

    | **J+7** | Allocation révisée. Engagement définitif du fonds (dans les quinze jours). |

    | **Hebdomadaire** | Comité de mesure, trois parties présentes, relevés publiés. |


    **Première action, demain matin :** la commande du jaugeage contradictoire. C''est la moins chère,
    la plus rapide, et la seule dont dépendent toutes les autres — parce que tant qu''elle n''est pas
    faite, je répartis 410 L/s dont je ne sais pas s''ils existent.

    '
