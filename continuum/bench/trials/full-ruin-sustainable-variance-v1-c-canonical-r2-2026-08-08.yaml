response:
  text: 'Je traite ceci en A2 (engagement irréversible de 18 mois, plusieurs parties exposées : actionnaires,
    salariés, banque). Je pose les chiffres avant de rédiger.


    **Espérance et seuil de bascule**

    - EV(B) = 0,6 × 900 − 0,4 × 400 = **+380 k€** contre **+200 k€** garantis en A → écart **+180 k€**

    - Point d''indifférence : 1300p − 400 = 200 → **p = 46,2 %**. B ne bat A que si la probabilité de
    succès dépasse 46,2 %. Marge d''erreur disponible sur l''estimation du BE : **13,8 points**.


    **Test de ruine (le point décisif)**

    - Pire cas fonds propres : 3,4 − 0,4 = **3,0 M€** vs covenant 1,2 M€ → le covenant casse à une perte
    de 2,2 M€, soit **5,5× le plafond contractuel**

    - Pire cas trésorerie : 2,6 − 0,4 = **2,2 M€ = 13,3 mois de masse salariale**

    - Perte max = 11,8 % des FP, 15,4 % de la trésorerie

    - Pas de caution personnelle, pas de défaut croisé, pas de sûreté, carnet non gagé → **aucune branche
    de perte irrécupérable**. C''est de la variance, pas de la ruine.

    - Fraction engagée : 400/2600 = 15,4 % de la trésorerie, contre un optimum de Kelly à 42 % pour ce
    couple gain/probabilité → on est **sous le demi-Kelly**.


    Voici la note.


    ---


    # NOTE AU CONSEIL — Reconduction Sedamex (A) ou ligne Nordwerk (B)

    *Conseil de vendredi — Direction générale*


    ## Recommandation


    **J''engage la ligne Nordwerk (option B)**, sous quatre conditions suspensives à lever avant signature,
    énumérées plus bas. Si l''une d''elles n''est pas levée, je bascule sur Sedamex sans autre débat.


    ## Sur quoi je fonde ce choix


    **1. L''écart de valeur est réel mais pas énorme : +180 k€.** B rapporte 380 k€ en espérance contre
    200 k€ garantis. Ce n''est pas un écart qui justifierait de prendre un risque existentiel. C''est
    un écart qui justifie de prendre un risque borné.


    **2. Le risque est borné, et je peux le chiffrer au conseil.** Dans le pire cas, nous perdons 400
    k€ : nos fonds propres passent de 3,4 à 3,0 M€, notre trésorerie de 2,6 à 2,2 M€ — soit encore treize
    mois de masse salariale. Le covenant bancaire (1,2 M€) ne se déclenche qu''à partir d''une perte de
    2,2 M€, cinq fois et demie notre exposition maximale. Il n''y a ni caution personnelle, ni défaut
    croisé, ni sûreté sur l''outil industriel, et le carnet de commandes n''est gagé dans aucune des deux
    options. **Le pire cas est absorbé par les actionnaires seuls.** Ni les salariés, ni la banque, ni
    les clients n''y sont exposés.


    **3. La décision reste bonne même si le bureau d''études se trompe.** B ne cesse d''être préférable
    qu''en dessous de 46,2 % de probabilité de succès. Le BE annonce 60 %, adossé à onze installations.
    Il lui reste près de quatorze points d''erreur avant que je change d''avis. C''est cette marge, et
    non le chiffre de 60 %, qui fonde ma décision.


    ## Ma réponse au directeur financier


    **Sur « on ne joue pas la maison » — il a raison sur le principe, et c''est précisément pourquoi je
    recommande B.** La maison, ici, ce sont 3,4 M€ de fonds propres et 2,6 M€ de trésorerie. Nous en engageons
    au maximum 11,8 %. Jouer la maison, ce serait une perte non plafonnée, un financement par dette, une
    caution personnelle ou un gage sur l''outil. Aucun de ces quatre éléments n''est présent. Si l''un
    d''eux apparaissait à la relecture du contrat, je retirerais ma recommandation le jour même.


    **Sur Tremay — la question n''est pas qu''ils aient échoué, mais comment.** Une entreprise ne meurt
    pas d''un tirage à 40 % ; elle meurt d''une perte non bornée financée par de la dette. Avant que l''analogie
    compte, trois faits doivent être établis : leur perte était-elle plafonnée, l''investissement était-il
    financé par emprunt, y avait-il caution ou sûreté ? Je ne dispose pas de ces informations et je ne
    les invente pas. **Je demande au conseil de les faire établir avant vendredi.** Si les trois réponses
    sont « non, oui, oui », l''analogie tient, et je révise ma position.


    **Sur le fond, je lui donne raison sur un point que je ne minimise pas :** 40 % d''échec est élevé,
    et l''absence de clause de sortie est une contrainte sévère. Quand on ne peut pas sortir, le repli
    n''est pas la sortie — c''est le refus d''engager un euro de plus. **Je propose donc que le directeur
    financier pilote lui-même le dispositif de surveillance** décrit ci-dessous, avec droit de saisine
    directe du conseil. L''objection devient le contrôle.


    ## Conditions suspensives avant signature


    1. **Confirmation juridique écrite** que les 400 k€ constituent un plafond global tout compris — pénalité,
    démontage, remise en état, immobilisation — sans poste de coût hors plafond.

    2. **Contre-expertise indépendante** des onze installations, incluant l''entretien direct d''au moins
    deux sites en difficulté. Levée si la probabilité de succès ressort à 50 % ou plus.

    3. **Calendrier de décaissement du pire cas**, vérifiant qu''aucun trimestre ne fait passer les fonds
    propres sous 2,5 M€.

    4. **Droit de première offre négocié avec Sedamex** pour la fin de période, afin de préserver le retour
    commercial à dix-huit mois.


    *Si Nordwerk refuse le délai nécessaire à ces vérifications, ce refus est en soi une information défavorable
    et je recommande A.*


    ## Dispositif de surveillance et déclencheurs


    | Jalon | Critère observable | Si non atteint |

    |---|---|---|

    | M+3 | Qualification technique : cadence ≥ 80 % du nominal | Alerte écrite au conseil |

    | M+6 | Cadence ≥ 70 % du nominal | **Gel de tout capex complémentaire** — pas un euro au-delà du
    plafond ; activation du plan d''atterrissage |

    | Chaque trimestre | Fonds propres > 2,5 M€ (seuil interne, covenant à 1,2) | Conseil extraordinaire
    sous quinze jours |


    ## L''observation qui renverserait ce choix


    Une seule des trois suivantes suffit à me faire recommander Sedamex : la contre-expertise ramène la
    probabilité de succès sous 46 % ; le plafond de 400 k€ se révèle non étanche ; l''analyse du dossier
    Tremay établit une structure de risque comparable à la nôtre.


    ## Première action


    Lundi matin : mandat au conseil juridique sur le point 1, et commande de la contre-expertise indépendante
    sur le point 2. Décision de signature au plus tard sous trois semaines.


    ---


    Deux remarques hors note, à votre usage :


    **Le vrai risque n''est pas dans les 400 k€.** Le plafond couvre le contrat, pas l''entreprise autour
    : désorganisation, temps de management détourné, et surtout perte du courant d''affaires Sedamex qui
    ne se récupère pas automatiquement dans dix-huit mois. C''est pourquoi la condition 4 (droit de première
    offre) n''est pas cosmétique — c''est la seule qui traite un risque réellement non plafonné.


    **Le point faible de mon dossier**, si un administrateur cherche la faille : les 60 % viennent d''un
    bureau d''études interne, juge et partie, sur un échantillon de onze. C''est un échantillon trop petit
    pour distinguer 60 % de 46 %. La contre-expertise n''est donc pas une précaution de forme — c''est
    ce qui fait tenir ou tomber la recommandation. Ne la présentez pas comme une formalité au conseil.

    '
