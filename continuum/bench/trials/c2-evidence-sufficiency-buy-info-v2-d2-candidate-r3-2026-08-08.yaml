response:
  text: 'Avant la note, le point qui décide de tout : le chiffre de 230 400 € est un écart de prix d''achat,
    pas une économie. Il ignore le différentiel de retours, qui est le seul poste où les deux fournisseurs
    diffèrent réellement.


    ---


    # NOTE AU COMITÉ DE DIRECTION

    **Objet :** Contrat cellules 2027 — Kelmar / Sinolux · **De :** Direction des opérations · **Décision
    demandée :** réservation Kelmar à J+18


    ## 1. Décision proposée


    **Réserver la capacité Kelmar à J+18 et commander aujourd''hui le test Vertex (34 000 €).** Ne pas
    signer Sinolux en exclusif cette semaine. La réservation Kelmar n''est pas un choix de fournisseur
    : c''est l''achat de la seule option qui nous laisse encore un choix après J+18.


    ## 2. Pourquoi les 230 400 € n''existent pas


    Le prix d''achat n''est pas le coût. Chaque retour coûte 205 €, quel que soit le fournisseur. Sur
    72 000 unités :


    | Taux de retour | Achat + retours | Écart vs Kelmar |

    |---|---|---|

    | **Kelmar 1,3 %** (stable 4 ans) | 2 063 880 € | référence |

    | Sinolux 1,1 % (essais Sinolux) | 1 785 900 € | **+ 278 000 €** |

    | Sinolux 3,0 % (Ferro) | 2 035 150 € | + 28 700 € |

    | Sinolux 3,1 % (audit mars) | 2 048 270 € | **+ 15 600 €** |


    *(retours Sinolux valorisés à 182,20 € — 205 € moins la cellule remplacée gratuitement)*


    **Point d''équilibre : 2,86 % de retours** — 3,22 % en tenant compte du remplacement gratuit. Au-dessus,
    Sinolux coûte plus cher que Kelmar. Sans la clause de remplacement, Sinolux à 3,1 % nous fait **perdre
    35 280 €**.


    Le seul chiffre mesuré par un tiers, 3,1 %, tombe donc exactement sur la ligne d''équilibre. L''économie
    budgétée n''est pas de 230 400 € : elle est comprise entre **− 35 000 € et + 16 000 €** au niveau
    de preuve actuel. Je demande que la ligne budgétaire soit ramenée à zéro en attendant mesure.


    ## 3. Nous n''avons pas trois sources, nous en avons une


    - **Sinolux, 1,1 %** : déclaration du vendeur sur ses propres essais. Partie intéressée.

    - **Audit sectoriel de mars, 3,1 %** : mesure indépendante — sur une ligne comparable, pas sur la
    nôtre.

    - **Cabinet Ferro, « environ 3 % »** : sa note méthodologique indique qu''il travaille **sur l''échantillon
    de l''audit de mars**. Ce n''est pas une confirmation, c''est la même mesure relue.


    Une mesure indépendante, une auto-déclaration. Et le refus de Sinolux de toute clause indexée sur
    le taux de retour est lui-même une information : le fournisseur ne veut pas porter le risque qu''il
    nous demande de prendre. Son remplacement gratuit couvre 22,80 € sur un incident qui nous en coûte
    205.


    ## 4. Le vrai risque n''est pas les 35 000 €


    Perdre 35 000 € sur l''année est de la variance, pas une ruine. La branche irrécupérable est ailleurs
    : **si nous ne réservons pas Kelmar à J+18, sa ligne 2027 est vendue et nous n''avons plus de second
    fournisseur**, alors que la production démarre à J+70 et que le lancement n''est pas reportable. À
    3,1 %, ce sont 2 232 chargeurs repris contre 936 — 1 300 passages atelier supplémentaires et autant
    de clients touchés sur un produit qui démarre. Cet ensemble-là — atelier, SAV, clients du lancement
    — encaisse le pire cas, pas la ligne achats.


    ## 5. Le test Vertex n''a de valeur que si l''option Kelmar est tenue


    Neuf semaines = **J+63**. Le résultat arrive après J+18 et après J+21 : il ne peut pas éclairer la
    décision Kelmar. Il n''éclaire que l''affectation des volumes, 7 jours avant le démarrage — et seulement
    si nous avons gardé les deux fournisseurs ouverts. C''est ce qui justifie les 34 000 €, et rien d''autre.


    Réserve d''honnêteté : sur 1 500 cellules, un taux réel de 3 % donne ~45 défauts, soit un intervalle
    statistique de ± 0,9 point. La précision annoncée de ± 0,3 point est une répétabilité de laboratoire,
    pas un intervalle de confiance sur le taux de retour terrain. **Le test tranchera nettement s''il
    rend moins de 2,4 % ou plus de 3,4 % ; entre les deux, il ne tranchera pas** et Kelmar l''emporte
    par défaut.


    ## 6. Première action — 72 heures


    **Obtenir de Kelmar le prix d''une réservation partielle ou conditionnelle** (par exemple 40 000 fermes
    + option sur 32 000, ou une indemnité de réservation). C''est la donnée qui manque et elle est décisive
    : si la réservation Kelmar est un achat ferme des 72 000 unités, l''option coûte l''intégralité de
    l''écart et la question est close en faveur de Kelmar. Si elle est partielle, un partage 50/50 plafonne
    la perte à zéro et conserve ~139 000 € d''économie dans le scénario favorable, tout en qualifiant
    un second fournisseur pour 2028.


    En parallèle, avant J+21 : demander à Sinolux de tenir son prix jusqu''à J+65, ou de prendre à sa
    charge les 205 € de reprise au-delà de 1,5 %. Un refus des deux confirme le diagnostic du § 3.


    ## 7. Repli et déclencheur


    Si des cellules Sinolux entrent en production : **au-delà de 2,0 % de retours constatés sur les 5
    000 premiers chargeurs livrés, arrêt de l''affectation Sinolux et bascule sur la réserve Kelmar.**
    Décision opérationnelle, sans nouvel arbitrage comité.


    ## 8. Ce qui renverserait cette recommandation


    Une mesure indépendante du taux de retour Sinolux **inférieure à 2,4 %, sur notre référence de cellule
    et disponible avant J+18**. Elle n''existe pas à ce jour et Vertex ne la produira pas à temps. Si
    elle apparaît, la réservation Kelmar devient une dépense inutile et je recommanderai Sinolux en plein
    volume.


    **Le meilleur argument contre cette note :** en réservant Kelmar nous renonçons peut-être à 278 000
    € pour éviter une perte de 35 000 €, ce qui est un mauvais échange en espérance. Il tient si l''on
    croit le 1,1 % de Sinolux. Or c''est le seul chiffre produit par la partie qui encaisse le gain, et
    la seule mesure indépendante dit le double du point d''équilibre. Je ne recommande pas d''acheter
    un risque de rupture d''approvisionnement sur la foi du chiffre du vendeur.


    ---


    Deux points sur lesquels j''ai tranché sans certitude, signalés dans la note : j''ai porté au crédit
    de Sinolux le remplacement gratuit des cellules (182,20 € au lieu de 205 € par retour) — c''est l''hypothèse
    la plus favorable au nouvel entrant, et elle ne suffit pas à faire gagner Sinolux. Et le coût de la
    réservation Kelmar n''est pas donné dans le dossier : c''est pour cela qu''il est la première action
    et non une hypothèse.

    '
