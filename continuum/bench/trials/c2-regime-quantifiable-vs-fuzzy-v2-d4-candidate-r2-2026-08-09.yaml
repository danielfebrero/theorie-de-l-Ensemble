response:
  text: '**NOTE À LA DIRECTION — conseil de jeudi**

    **Objet : affectation de l''enveloppe unique de 900 000 € — dossiers A (machines) et B (succession
    qualité)**


    ---


    ## 1. Ce qui est proposé au vote


    | Décision | Montant | Ce qui la fonde |

    |---|---|---|

    | Promotion de l''adjointe à la direction qualité, effective sous 60 jours, en doublon avec le titulaire
    pendant ses 11 derniers mois | 45 000 € | Le seul délai disponible est ces 11 mois. Il ne se rachète
    pas plus tard. |

    | Mission de transition du directeur sortant, 12 mois après son départ, avec objectifs nommés (organisme
    notifié, deux clients hospitaliers, 9 auditeurs) | 90 000 € | Prolonge la couverture à 23 mois pour
    90 k€, contre 280 k€ pour un externe qui n''a ni la relation à l''organisme ni celle aux clients.
    |

    | Renouvellement du parc complet, 6 machines — **sous la condition du §4** | 620 000 € | Données de
    maintenance auditées + garantie 96 % sur 7 ans avec pénalités. |

    | Requalification des procédés liée au changement d''équipement, et ligne de contingence succession
    engagée sur l''exercice | 145 000 € | Dépense obligatoire non chiffrée dans le dossier A + seule façon
    de conserver une option de recrutement externe malgré l''enveloppe non reconductible. |

    | **Total** | **900 000 €** | Enveloppe intégralement engagée. |


    ---


    ## 2. Sur le tableau unique demandé


    Un seul classement en euros est possible, mais il serait trompeur et je ne le propose pas. Le dossier
    A repose sur cinq ans de relevés horodatés et audités : ses euros sont mesurés. Le dossier B ne dispose
    d''aucun précédent interne ni d''aucun comparable sectoriel : ses euros seraient inventés. Les ranger
    sur la même colonne donnerait au chiffre le plus fragile l''apparence du plus solide. Le tableau du
    §1 donne le coup d''œil demandé — décision, montant, critère — sans cette confusion.


    C''est aussi pourquoi j''écarte la cotation du cabinet RH (35 %, 4,2 M€, 7,5/10). Elle vient de trois
    consultants sans expérience du dispositif médical, en atelier, sans base de référence. Elle plaide
    dans le sens de la décision proposée, et c''est précisément la raison de ne pas s''en servir : un
    administrateur la démonterait en une question. Le fait dur suffit : deux clients pesant **31 % du
    chiffre d''affaires** déclarent eux-mêmes travailler avec nous à cause d''une personne qui part dans
    11 mois, et un organisme notifié ne reconnaît qu''elle. Aucune probabilité n''est nécessaire pour
    agir là-dessus.


    ---


    ## 3. Dossier B — pourquoi il se décide en premier, et pourquoi il n''est pas cher


    Les trois pistes RH ne sont pas exclusives. La bonne combinaison est la moins coûteuse : **135 000
    €**, soit 15 % de l''enveloppe, pour promotion + transition.


    Le recrutement externe à 280 000 € achète la compétence, pas ce qui est en risque. Ce qui est en risque,
    ce sont trois relations nominatives — l''organisme notifié, les deux hôpitaux, les 9 auditeurs formés.
    Elles ne se transfèrent qu''en présence du titulaire. Un externe arriverait sans elles et devrait
    les reconstruire depuis zéro, exactement comme l''adjointe, mais pour 6 fois le prix et sans les 3
    ans de maison.


    Le dossier B commande le dossier A, et c''est le point le moins visible du conseil : remplacer six
    machines d''usinage déclenche une revalidation des procédés et, selon son ampleur, une information
    de l''organisme notifié. Nous conduirions donc ce dialogue pendant les derniers mois du seul interlocuteur
    qu''il reconnaisse — ou après son départ, sans successeur établi. **Le calendrier d''installation
    doit être arrêté par la nouvelle directrice qualité, pas par le fournisseur.**


    ---


    ## 4. Dossier A — le chiffre qui manque, et le seuil qu''il doit franchir


    Sur les données fournies, le renouvellement complet ne se rembourse pas. Les 213 000 € d''immobilisation
    sur 5 ans font 42 600 €/an ; les 1 810 heures d''arrêt à 38 € de marge font 13 800 €/an. Soit **≈
    56 000 €/an récupérés**, donc environ 390 000 € sur les 7 ans de garantie, pour 620 000 € investis.
    Il manque 230 000 €, soit **32 000 €/an à trouver ailleurs**.


    Cet ailleurs, c''est le rebut : 4,1 % contre 1,2 % garanti, soit 2,9 points. Le dossier ne le chiffre
    jamais, parce qu''il ne donne pas le volume produit par ces six machines. C''est la seule grandeur
    manquante, et elle décide seule.


    **Seuil : le parc complet se justifie si ces six machines produisent plus de ~1,1 M€ par an** (~1,6
    M€ si les 213 000 € incluent déjà la marge perdue, à vérifier). En dessous, on n''achète que trois
    machines — le fournisseur accepte les tranches aux mêmes conditions unitaires, il n''y a donc aucune
    remise perdue à fractionner — et on choisit les trois au pire historique de pannes, que la maintenance
    horodatée permet de désigner nommément.


    **Le directeur industriel remet ce volume mercredi soir.** Sans lui, le conseil vote la tranche de
    trois machines à 310 000 €, et les 310 000 € libérés vont au recrutement externe (280 000 €) plutôt
    qu''à la ligne de contingence.


    ---


    ## 5. Le meilleur argument contre cette note


    « Vous engagez 620 000 € sur un calcul que vous ne savez pas boucler, uniquement parce que l''enveloppe
    expire. » Il est juste, et c''est pourquoi la dépense est conditionnée à un seuil chiffré et à un
    chiffre remis avant le vote, avec une tranche de repli déjà tarifée. Le réflexe de dépense serait
    de voter 620 000 € jeudi sans ce chiffre.


    Second point de vigilance, à traiter avec la DAF avant jeudi : les 145 000 € de contingence ne préservent
    une option de recrutement externe que si « engagé sur l''exercice » couvre un mandat contractuel déclenchable
    en 2027. Si ce n''est pas le cas, cette ligne devient une provision perdue et il faut arbitrer entre
    elle et le recrutement externe **jeudi**, pas dans six mois.


    ---


    ## 6. Ce qui renverse la décision, et à quel signal


    - **Signal observable :** si, **5 mois avant le départ**, l''organisme notifié n''a pas confirmé par
    écrit la nouvelle directrice qualité comme interlocutrice désignée, la ligne de contingence est déclenchée
    et le recrutement externe est lancé sous la couverture de la mission de transition.

    - **Ce qui invaliderait le §4 :** un volume produit par les six machines inférieur au seuil, ou un
    taux de rebut dont la cause est le procédé et non l''état des machines — auquel cas les machines neuves
    ne le corrigent pas et l''arbitrage bascule entièrement vers B.

    - **Pire cas assumé :** l''adjointe n''est pas acceptée par l''organisme notifié et le titulaire n''est
    plus mobilisable. Ce sont les 31 % de chiffre d''affaires hospitalier qui l''encaissent. C''est le
    seul scénario de perte non rattrapable des deux dossiers ; le dossier A, lui, n''expose qu''un capital
    immobilisé.


    **Première action, avant jeudi :** annoncer la promotion au titulaire et à l''adjointe, et obtenir
    du titulaire son accord de principe sur la mission de transition. Un directeur qualité qui apprend
    sa succession par le compte rendu du conseil ne la prépare pas.

    '
