    # Note au comité de direction — Contrat cellules 2027


    **Objet :** choix du fournisseur de cellules, 72 000 unités

    **De :** Direction des opérations · **Décision demandée :** validation avant J+18


    ## Décision proposée


    **Réserver la capacité Kelmar à J+18** et ne pas basculer le volume 2027 sur Sinolux. Ouvrir en parallèle
    une tranche de qualification Sinolux (§5), sous conditions.


    **Conséquence budgétaire immédiate : les 230 400 € doivent sortir du budget 2027.** Ce n''est pas
    une économie, c''est un écart de prix d''achat dont la contrepartie n''est pas mesurée.


    ## 1. Les 230 400 € achètent 1,56 point de taux de retour


    Un chargeur repris coûte 205 €, quel que soit le fournisseur. Un point de taux de retour sur 72 000
    unités = 720 reprises = **147 600 €**. L''écart de prix couvre donc 1 124 reprises supplémentaires,
    soit **1,56 point**. Seuil de bascule : **2,86 %**.


    | Taux Sinolux | Reprises | Coût reprises | **Gain/perte vs Kelmar** |

    |---|---|---|---|

    | 1,1 % (essais fournisseur) | 792 | 162 360 € | **+ 259 920 €** |

    | 2,0 % | 1 440 | 295 200 € | + 127 080 € |

    | **2,86 % (seuil)** | 2 060 | 422 280 € | **0 €** |

    | **3,1 % (audit de mars)** | 2 232 | 457 560 € | **− 35 280 €** |

    | 3,5 % | 2 520 | 516 600 € | − 94 320 € |

    | 4,0 % | 2 880 | 590 400 € | − 168 120 € |


    *Référence Kelmar : 936 reprises, 191 880 €.*


    La décision ne se joue pas sur le prix. Elle se joue entièrement sur un chiffre que nous n''avons
    pas mesuré.


    ## 2. Nous n''avons pas trois sources, nous en avons une


    - **Sinolux, 1,1 %** — essais internes : des essais de laboratoire, pas un taux de retour terrain.
    Ils ne mesurent pas la même grandeur que les 1,3 % de Kelmar, qui sont quatre ans de reprises réelles.
    Émetteur intéressé.

    - **Audit sectoriel, 3,1 %** — mesure indépendante, ligne comparable, grandeur homogène à notre 1,3
    %.

    - **Ferro, « environ 3 % »** — sa note méthodologique le dit : il travaille sur l''échantillon de
    l''audit de mars. **Ce n''est pas une troisième source, c''est une relecture de la deuxième.** La
    convergence apparente 3,1 % / 3 % est un artefact.


    Reste **une seule mesure comparable : 3,1 %**, soit 0,24 point au-dessus du seuil. Et c''est un chiffre
    de ligne mature ; une première année de montée en cadence se situe en haut de la distribution, pas
    au milieu.


    ## 3. Le test Vertex arrive après la fermeture de la porte


    34 000 €, résultat sous neuf semaines = **J+63**. Kelmar ferme à **J+18**, Sinolux tient son prix
    jusqu''à **J+21**. Le résultat tombe 42 jours après la décision, et 7 jours avant le démarrage production.


    Second défaut : ±0,3 point sur une estimation à 3,1 % donne 2,8 – 3,4 %, **à cheval sur le seuil de
    2,86 %**. Le test pourrait coûter 34 000 € et ne pas trancher. Et le vieillissement accéléré mesure
    une défaillance cellule, pas un taux de retour chargeur.


    **Ne pas l''acheter pour cette décision.** Il se justifie au T1 2027, sur le calendrier 2028, où son
    résultat aurait encore une porte ouverte devant lui.


    ## 4. La garantie Sinolux couvre 11 % du problème


    Le remplacement gratuit porte sur la cellule — 22,80 € — sur une reprise qui en coûte 205. Il ne touche
    ni le transport, ni le geste commercial, ni l''atelier. Même valorisé intégralement, le seuil ne remonte
    qu''à 3,22 % : la mesure de 3,1 % reste dans la zone où le gain est nul.


    **Le refus d''indexation est l''information la plus utile du dossier.** Sinolux accepte de couvrir
    la pièce à 22,80 € et refuse de couvrir le retour à 205 €. Celui qui connaît le mieux son taux de
    retour refuse d''en porter le coût.


    ## 5. Ce que je fais des 18 prochains jours


    1. **Négocier Kelmar avec le devis Sinolux sur la table.** Chaque centime obtenu est une économie
    sans contrepartie de risque : 24,50 € = 108 000 €. Meilleur rendement du dossier.

    2. **Une dernière offre à Sinolux avant J+18 :** qu''il prenne à sa charge les 205 € tout compris
    des reprises au-delà de 1,3 %, ou un forfait plafonné à 265 680 €. S''il accepte, la décision s''inverse
    et nous prenons Sinolux.

    3. **Tranche de qualification 20 % (14 400 unités)**, si et seulement si : (a) Kelmar accepte une
    réservation à 57 600 sans pénalité, (b) la traçabilité au numéro de série permet d''attribuer chaque
    reprise à son fournisseur, (c) Sinolux tient 22,80 € sur ce volume. Coût attendu si Sinolux est à
    3,1 % : **~7 000 €** — contre 34 000 € pour Vertex — et cela produit une mesure de terrain sur notre
    propre ligne, disponible pour 2028. Si une condition manque : 100 % Kelmar.


    ## 6. Ce qui renverserait cette décision


    Une mesure de terrain indépendante sur ligne comparable **sous 2,5 %**, ou l''acceptation par Sinolux
    d''une clause portant sur les 205 €. Toute nouveauté d''ici J+18 se teste contre le seuil de 2,86
    %, pas contre le prix d''achat.


    **Pire cas de la décision proposée :** 230 400 € payés en trop à un fournisseur qui se serait révélé
    bon. Coût porté par la marge 2027, visible, borné, rejouable au contrat 2028.

    **Pire cas de la décision inverse :** J+18 passe, la ligne Kelmar 2027 est vendue, et nous démarrons
    à J+70 en source unique sur un fournisseur mesuré à 2,4 fois le taux de l''historique, sans alternative
    avant la fin de l''année et sans report possible. Ce n''est plus un écart de coût, c''est la perte
    du recours.


    **Repli :** suivi mensuel du taux Kelmar ; dérive au-dessus de 1,8 % sur deux mois consécutifs → réouverture
    du dossier et arbitrage 2028 anticipé.


    **Première action :** rendez-vous Kelmar sur le prix cette semaine, courrier à Sinolux sur la clause
    205 € le même jour.


    ---


    Deux points que je n''ai pas pu trancher depuis l''énoncé et qui conditionnent le §5 : la réservation
    Kelmar est-elle fractionnable à 57 600 unités sans pénalité, et le lot minimum Sinolux est-il compatible
    avec 14 400. À vérifier dans les premiers jours — si la réponse est non des deux côtés, la recommandation
    reste 100 % Kelmar, inchangée. Dites-moi si vous voulez la note en fichier (Word/Markdown) ou en page
    partageable, je vous la produis.

    '
