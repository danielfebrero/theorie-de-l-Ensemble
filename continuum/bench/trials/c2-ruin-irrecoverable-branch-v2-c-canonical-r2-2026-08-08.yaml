response:
  text: '## Recommandation au conseil — 8 août 2026


    **En une phrase :** je refuse C, je suspends B, je ne considère pas A comme une stratégie, et j''engage
    la caisse sur le dépôt immédiat d''un dossier de transfert à l''Union mutualiste de l''Atlantique
    — parce que le seul actif de la caisse qui vaille encore quelque chose n''est pas sa réserve, c''est
    son éligibilité au transfert, et que cette éligibilité expire avant tout le reste.


    ---


    ### 1. Le calendrier qui commande tout


    L''UMA n''accepte pas un portefeuille dont la réserve représente moins de trois années de prestations.
    Ce seuil n''est pas fixe : il monte de 4,3 %/an avec les prestations, pendant que la réserve baisse.


    | | Réserve (A, cotisations gelées) | Seuil UMA (3 × prestations) | Marge |

    |---|---|---|---|

    | Aujourd''hui | 18,4 | 16,2 | +2,2 |

    | Fin année 1 | 17,5 | 16,9 | +0,6 |

    | Fin année 2 | 16,3 | 17,6 | **−1,3** |


    La fenêtre d''éligibilité se referme dans **18 à 24 mois**. Le comité d''engagement de l''UMA instruit
    en **12 à 18 mois**. Il ne reste pas de marge de délibération : un dossier déposé après octobre a
    une probabilité sérieuse d''être instruit sur des comptes déjà inéligibles.


    Toute décision qui diminue la réserve, la rend illiquide, ou la rend invendable pendant cette fenêtre
    détruit la seule sortie qui protège réellement les 4 200 affiliés.


    ### 2. La projection interne à neuf ans est fausse


    Neuf ans n''est atteignable que si les cotisations s''indexent à ~4,3 %/an. L''assemblée générale
    a refusé 6 % en 2024. À cotisations gelées — l''hypothèse réelle — voici la trajectoire :


    | Année | 1 | 2 | 3 | 4 | 5 |

    |---|---|---|---|---|---|

    | Déficit annuel (M€) | 1,23 | 1,47 | 1,73 | 1,99 | 2,26 |

    | Réserve fin d''année (M€) | 17,5 | 16,3 | 14,9 | 13,2 | **11,2** |


    Le plancher statutaire de 11 M€ est franchi en **année 5 ou 6**, pas en année 9. Je demande que l''actuaire
    confirme ou infirme cette reconstruction avant jeudi ; si elle tient, c''est le chiffre le plus important
    du dossier, et il n''est aujourd''hui dans aucune note du conseil.


    ### 3. Option C — refusée, et je demande que le refus soit motivé au procès-verbal


    Quatre raisons, dont trois suffisent seules.


    **a. Le blocage survit à l''institution.** La note est immobilisée 7 ans. La caisse atteint son plancher
    de liquidation de plein droit vers l''année 5. Dans la branche à 88 %, la note arrive à échéance **deux
    ans après la dissolution de la caisse**. Un actif qui se débloque après la mort du souscripteur n''est
    pas un placement, c''est une renonciation.


    **b. C provoque une rupture de trésorerie avant l''échéance, y compris quand elle réussit.** Après
    souscription, il reste 4,0 M€ liquides pour financer un déficit de 1,23 puis 1,47 puis 1,73 M€. Si
    la note capitalise sans coupon versé — hypothèse par défaut pour un produit bloqué sans sortie —,
    la caisse est en cessation de paiements **au cours de l''année 3, dans 100 % des trajectoires**, y
    compris les meilleures. Si elle distribue 14 % en numéraire (2,02 M€/an), la trésorerie tient jusqu''à
    l''année 5, puis bascule. Dans la branche à +2 %, rupture en année 4. Première question au trésorier
    : **la note verse-t-elle un coupon en numéraire, oui ou non ?** Tant qu''elle n''a pas de réponse
    écrite de l''émetteur, le conseil ne sait pas ce qu''il vote.


    **c. Le 3 % n''est pas du bruit, c''est une barrière absorbante.** Réserve résiduelle 4,7 M€ contre
    un plancher statutaire de 11 M€ : la branche défaut ne dégrade pas la caisse, elle la dissout de plein
    droit. Aucun assureur du marché n''a accepté de coter ce portefeuille en 2025 : la dissolution ne
    redistribue pas les affiliés, elle laisse 4 200 personnes de 61 ans de moyenne d''âge, fortement exposées
    à l''amiante, sans couverture et sans repreneur. C''est une perte irrécupérable, pas une mauvaise
    année. Une espérance mathématique se calcule sur des tirages répétés ; la caisse ne joue qu''une fois
    et disparaît en cas de perte. Les 10 000 simulations du trésorier sont vraisemblablement conduites
    sans barrière absorbante à 11 M€ et sans contrainte de trésorerie — auquel cas elles répondent à une
    question que la caisse ne se pose pas.


    **d. C n''est attractive qu''à une taille létale.** Avec 5 % de récupération, une souscription reste
    survivable (réserve > 16 M€ en branche défaut) jusqu''à environ 2,3 M€. À cette taille, elle ne change
    rien à l''équation. Elle ne « sauve » la caisse qu''à 14,4 M€, c''est-à-dire exactement à la taille
    où elle peut la tuer. Cette propriété est la démonstration, pas un détail de calibrage.


    **Deux points de diligence à trancher avant jeudi :** (i) une récupération de 5 % du nominal est incompatible
    avec une dette senior d''un émetteur A− (recouvrement historique ~40 %) ; l''exposition est donc structurellement
    subordonnée ou indexée sur un sous-jacent, et l''étiquette « défaut de l''émetteur » décrit mal l''événement
    déclencheur. La distribution 88/9/3 est fournie par le vendeur, non auditée, non cotée, donc non observable
    après souscription — le conseil ne saurait même pas qu''il perd. (ii) 78 % de la réserve sur une contrepartie
    unique non cotée : à faire confirmer par le conseil juridique et l''actuaire au regard du principe
    de la personne prudente et du module de concentration du SCR. Si cette concentration est irrégulière,
    le débat est clos avant même la finance, et les administrateurs qui l''auraient votée engagent leur
    responsabilité personnelle.


    **Sur « refuser C, c''est condamner la caisse à mourir à petit feu » :** le diagnostic du trésorier
    est juste, son remède est inversé. Aucune allocation d''actifs ne résout un déficit de 1,2 M€/an s''élargissant
    vers 2,9 M€/an sur une base de 18,4 M€ — il faudrait un rendement permanent de 7 % puis 16 % sur la
    totalité de la réserve. Ce n''est pas un problème de rendement. C est un pari qui ajourne un problème
    structurel en payant le prix de la seule solution qui existe.


    ### 4. Option B — suspendue pendant l''instruction, redimensionnée ensuite


    Le pire décile de B (−35 % sur 7,4 M€) ramène la réserve à 15,8 M€, soit **sous le seuil d''éligibilité
    UMA de 16,2 M€**. Prendre ce risque pendant les 12 à 18 mois d''instruction, c''est risquer de perdre
    le dossier sur un mouvement de marché. Le trésorier a par ailleurs raison : B seule ne referme pas
    l''écart. B n''est donc ni une solution ni un risque acceptable maintenant.


    Décision : **exposition actions/crédit à zéro jusqu''à la réponse du comité d''engagement.** Si le
    transfert est refusé, B revient à l''ordre du jour, plafonnée à 20 % de la réserve (pire décile compatible
    avec le maintien au-dessus de 16 M€), et non 40 %.


    ### 5. Option A — maintenue comme conservation d''une option, pas comme stratégie


    A ne redresse rien. Elle a une seule vertu, décisive dans les dix-huit mois qui viennent : elle garde
    la réserve liquide, valorisable et cessible. C''est le format sous lequel l''UMA peut la reprendre.
    On la maintient pour cette raison, et on dit au conseil que ce n''est pas un plan.


    ---


    ### 6. Ce sur quoi j''engage la caisse


    1. **Sous 30 jours** — dépôt du dossier de transfert auprès de l''UMA, sur les comptes actuels (ratio
    3,41 ans), avec demande écrite de confirmation des critères d''éligibilité et de la date d''arrêté
    retenue.

    2. **Jeudi** — refus de C acté au procès-verbal avec les motifs ci-dessus, et saisine du conseil juridique
    sur la régularité de la concentration.

    3. **Jeudi** — gel de toute exposition de marché jusqu''à la réponse UMA.

    4. **Sous 60 jours** — AG extraordinaire sur les cotisations, avec l''arithmétique à cotisations gelées
    présentée sans atténuation et l''alternative transfert nommée. Une hausse de 10 % (+0,44 M€/an) ne
    referme pas l''écart mais allonge la fenêtre et constitue, devant le comité d''engagement, la preuve
    qu''un effort interne a été consenti.

    5. **Sous 90 jours** — audit des créances récupérables : part des soins liés à l''amiante juridiquement
    imputables à la branche AT/MP et aux dispositifs d''indemnisation dédiés, et que la caisse prend peut-être
    à sa charge à tort. Sur ce profil d''affiliés, c''est le seul gisement susceptible de peser sur la
    dérive de 4,3 %/an. Hypothèse à vérifier, pas acquise.

    6. **Trimestriel** — publication au conseil de deux indicateurs : réserve / prestations annuelles,
    et mois de trésorerie disponible.


    ### 7. Recomposition — ce que je propose au trésorier et au président


    Ils sont cinq sur neuf ; les écraser par un vote ne fait rien avancer, et leur diagnostic est exact.
    Je leur propose donc : le conseil **adopte formellement leur constat** (la caisse ne survit pas au
    statu quo, la note interne à neuf ans est trop optimiste), le trésorier **conduit la négociation UMA
    et la campagne de cotisations** avec mandat plein, et le conseil **réexamine C en janvier** — après
    réponse de l''UMA, sur une taille non létale, et à condition que l''émetteur ait fourni par écrit
    le mécanisme de coupon, le rang de la créance et la source auditée de la distribution 88/9/3. Le désaccord
    porte sur le remède et sur le calendrier, pas sur la gravité.


    ### 8. Le meilleur argument contre ma position


    *« Le transfert est une hypothèse : l''UMA n''a rien promis, peut refuser, et vous aurez consommé
    dix-huit mois et la fenêtre de B pour rien. C offrait au moins une chance chiffrée. »*


    Il tient partiellement, et c''est le vrai risque de ma recommandation. Ma réponse : le transfert échoué
    laisse une caisse à ~16,5 M€, liquide, avec ses options intactes et B redevenue disponible. C échouée
    laisse une caisse dissoute et 4 200 personnes non assurables sans couverture. Ce ne sont pas deux
    échecs comparables. Et le coût de l''attente est mesuré : 1,2 M€ sur l''année, contre une chance de
    3 % de tout perdre définitivement, pour un surcroît d''espérance d''environ 0,5 M€/an qui ne referme
    même pas l''écart.


    Enfin, sur « deux caisses comparables ont souscrit l''an dernier » : douze mois d''existence sur une
    note de sept ans ne constituent aucune preuve. C''est un biais de survie observé sur un huitième de
    la durée du risque.


    ### 9. Ce qui me ferait changer d''avis


    - **Sur B :** confirmation écrite de l''UMA que l''éligibilité s''apprécie sur des actifs cotés et
    liquides indépendamment de leur volatilité, et qu''un décrochage de marché temporaire ne disqualifie
    pas le dossier. B redevient alors envisageable pendant l''instruction, plafonnée.

    - **Sur le calendrier :** si l''actuaire démontre que la projection à neuf ans tient à cotisations
    gelées, l''urgence retombe d''un cran — mais la fenêtre UMA, elle, ne bouge pas, car elle dépend du
    ratio réserve/prestations, pas de la date du plancher.

    - **Sur C :** rien ne la réhabilite à 14,4 M€. Une branche à 4,7 M€ franchit une barrière absorbante
    ; aucune amélioration de rendement, de notation ou de coupon ne modifie cela. Seule une réduction
    sous ~2,3 M€ la rendrait admissible — taille à laquelle elle est sans objet.


    ### 10. Repli et déclencheurs observables


    - **Comité d''engagement UMA défavorable, ou ratio réserve/prestations < 3,1 ans** → réunion sous
    15 jours ; bascule sur le plan interne : B plafonnée à 20 %, AG cotisations en séance unique, révision
    du panier de prestations.

    - **Trésorerie disponible < 18 mois de déficit projeté** → suspension de tout engagement pluriannuel,
    information immédiate du superviseur.

    - **Réserve < 13 M€** → déclaration au conseil d''un plan de convergence ou de dissolution ordonnée,
    tant qu''une dissolution ordonnée reste possible. En dessous de 11 M€ elle ne l''est plus : elle est
    subie.


    **Première action, si le conseil me suit :** je fais partir lundi la demande d''entrée en instruction
    auprès de l''UMA, sur les comptes arrêtés au 30 juin. Chaque semaine de retard coûte environ 0,02
    point de ratio d''éligibilité, et il en reste moins de deux dixièmes avant la fermeture.

    '
