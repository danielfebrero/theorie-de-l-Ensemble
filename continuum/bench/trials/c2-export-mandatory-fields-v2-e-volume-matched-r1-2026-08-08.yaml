response:
  text: '**NOTE DE DIRECTION — DOSSIER DISTRIBUTEUR D**

    Verdal SAS — 8 août 2026

    De : la Direction générale

    Pour : Comité de direction (DAF, DirCo, Directeur industriel, DRH)

    Objet : mandat exécutoire pendant l''absence du DG (8 → 24 août)

    Statut : **cette note vaut décision.** Elle s''applique en l''état. Aucune de ses clauses n''est suspendue
    par mon indisponibilité, et mon indisponibilité ne vaut pas délégation d''arbitrage.


    ---


    ## 1. Décision


    **Nous ne signons pas le contrat d''exclusivité de trois ans dans sa forme actuelle.**


    Nous ne rompons pas avec D pour autant. Vous répondrez par écrit, avant le 14 août, par une contre-proposition
    ferme et chiffrée. Vous êtes autorisés à signer — sans moi — une version amendée du contrat **si et
    seulement si** elle satisfait les sept conditions du § 4, toutes, sans exception ni interprétation.
    À défaut, vous ne signez rien et vous laissez l''offre expirer.


    Cette décision n''est pas un compromis entre les positions du DAF et du DirCo. Elle tranche.


    ## 2. Pourquoi — le calcul que je vous demande de refaire et de joindre au dossier


    Marge brute 31 % ⇒ coût variable = 69 % du prix de cession actuel. Une remise de 9 % ne coûte pas
    9 % de marge, elle coûte 29 % de la marge.


    | | Marge brute sur D |

    |---|---|

    | Aujourd''hui (14,9 M€) | **4,62 M€** |

    | An 1, contrat signé, volume +18 % tenu | **3,87 M€** (−0,75 M€) |

    | An 2 et 3, volume revenu au niveau actuel | **3,28 M€/an** (−1,34 M€/an) |


    Après remise, le taux de marge tombe à 24,2 %. Pour que l''année 1 soit simplement **neutre** en marge,
    il faudrait **+41 % de volume**, pas +18 %. L''engagement proposé ne couvre donc pas son propre coût,
    même s''il est intégralement tenu.


    Trois asymétries rendent l''objet non signable en l''état :


    1. **La remise est acquise pour trois ans, l''engagement de volume ne porte que sur un an.** Les années
    2 et 3 sont « indicatives » : nous payons trois ans un avantage que nous n''obtenons qu''un an.

    2. **La sanction est unilatérale.** Nous devons 1,2 M€ si nous sortons. D ne doit rien s''il ne tient
    pas son volume ni s''il déréférence. Le T2 en est la démonstration : −11 % de commandes sans préavis,
    sans conséquence.

    3. **L''exclusivité supprime nos deux seules issues** — centrale régionale et marketplace — pendant
    exactement la période où notre dépendance passe de 62 % à 64 % en captivité juridique totale.


    Signer, ce n''est pas acheter de la sécurité : c''est convertir un choc ponctuel et survivable en
    une dépendance irréversible de trois ans, sans porte de sortie, contre une marge dégradée dès le premier
    exercice.


    ## 3. Lecture de la manœuvre — à garder pour vous


    Comité avancé, ultimatum de huit jours, menace de déréférencement chiffrée à la moitié de nos références,
    demande de venir s''expliquer devant un comité dont D sait qu''il est divisé, et tout cela pendant
    l''absence annoncée du DG. Ce n''est pas un calendrier d''achat, c''est une architecture de pression.
    Le fait qu''elle soit habile ne la rend pas illégitime — mais elle interdit de traiter la date du
    20 août comme une donnée physique. **La contrainte de temps est l''objet principal de la négociation.**


    ## 4. Ce que vous êtes autorisés à signer sans moi


    Signature possible **uniquement** si les sept conditions sont réunies **cumulativement**, écrites
    au contrat, sans renvoi à un avenant ultérieur :


    1. **Durée de l''exclusivité ramenée à 12 mois**, reconductible par accord exprès — pas par tacite
    reconduction.

    2. **Remise par tranches, indexée sur le volume réellement facturé** : 3 % jusqu''au niveau 2025,
    6 % entre +1 % et +17 %, 9 % seulement au-delà de +18 % constaté. Pas de remise avancée sur volume
    promis.

    3. **Engagement de volume ferme et chiffré sur toute la durée**, avec dédit à la charge de D en cas
    de non-atteinte.

    4. **Pénalité de sortie symétrique et plafonnée à 400 k€**, ou supprimée des deux côtés.

    5. **Préavis écrit de six mois** pour tout déréférencement, à effet immédiat sur les huit références.

    6. **Carve-out explicite** : sont hors périmètre d''exclusivité la marketplace alimentaire, la vente
    directe/RHF, et les centrales d''achat régionales à couverture non nationale.

    7. **Plafond de dépendance** : clause autorisant Verdal à servir tout canal dès lors que D représente
    plus de 55 % de son chiffre d''affaires.


    Si D accepte les sept, signez : c''est un bon contrat et je l''assume. Si D en accepte six, **vous
    ne signez pas.** Il n''y a pas de « presque ». Aucun membre du comité n''a mandat pour juger qu''une
    condition est « substantiellement satisfaite ».


    Modalité : signature conjointe obligatoire DAF **et** DirCo, sur le document intégral relu par notre
    conseil (Me — cabinet habituel, à mobiliser dès lundi 10 août, honoraires autorisés jusqu''à 25 k€).


    ## 5. Ce que vous n''êtes pas autorisés à faire


    - Signer une exclusivité de plus de 12 mois, quelle que soit la contrepartie.

    - Accepter une pénalité de sortie supérieure à 400 k€.

    - Prendre un engagement verbal, un « accord de principe », un e-mail de confort ou un échange de mails
    qui vaudrait commencement d''exécution.

    - Renoncer à la marketplace ou geler les discussions avec la centrale régionale, même à titre de geste
    de bonne volonté.

    - Accorder une remise hors contrat pour « faire patienter » D.

    - Consentir un allongement de délai de paiement à D.

    - Annoncer quoi que ce soit aux équipes de Redon avant le 20 août (voir § 9).


    ## 6. Règle de désaccord


    Le comité est divisé et l''a écrit. Je ne l''arbitrerai pas à distance, donc j''installe une règle
    qui n''a pas besoin de moi :


    **En cas de désaccord persistant entre le DAF et le DirCo, la position par défaut s''applique : on
    ne signe pas.** Le désaccord ne bloque rien — il produit automatiquement ma décision. Personne n''a
    besoin de convaincre l''autre.


    Pilotage : le DAF pilote trésorerie, dossier activité partielle et relation bancaire. Le DirCo pilote
    la réponse à D et la diversification. Le Directeur industriel pilote le plan de charge. Aucun des
    deux premiers n''a autorité sur le périmètre de l''autre. Un compte rendu écrit hebdomadaire (vendredi
    17 h), archivé, même si rien ne s''est passé.


    ## 7. Réponse à D — calendrier daté


    - **Lundi 10 août** : conseil juridique saisi ; contrôle de gestion produit le chiffrage exact des
    huit références (CA, marge, volume, absorption Redon), livré mardi 11.

    - **Jeudi 13 août** : envoi de la réponse écrite au directeur des achats de D, en copie à son directeur
    commercial. Ton : engagé, non défensif, sans allusion à mon absence.


    Contenu de la lettre, dans cet ordre :

    1. Verdal confirme sa volonté de poursuivre un partenariat structurant avec D et de s''engager sur
    la durée.

    2. Verdal ne peut pas signer une remise de 9 % sur trois ans adossée à un volume ferme sur un an ;
    nous en donnons le motif économique en une ligne (le taux de marge résiduel), sans dévoiler nos coûts.

    3. Nous proposons les sept aménagements du § 4, présentés comme une architecture d''équilibre, pas
    comme des réserves.

    4. Nous nous déclarons prêts à signer avant le 20 août si ces termes sont retenus.

    5. Nous prenons acte que D peut déréférencer quatre références et lui indiquons que, dans cette hypothèse,
    Verdal ouvrira sans délai les canaux alternatifs qu''il a par ailleurs en préparation — factuel, sans
    menace.


    **Ne demandez pas de report du comité du 20 août.** Demander un délai, c''est confirmer que le délai
    nous atteint.


    ## 8. Réunion avec l''acheteur de D


    Elle a lieu, elle est utile, et elle est cadrée :


    - Présents obligatoires : DAF **et** DirCo ensemble, plus le Directeur industriel. Jamais un dirigeant
    seul avec lui, jamais en marge, jamais à table sans les deux autres.

    - Format : nous écoutons, nous prenons note, nous ne répondons pas au fond le jour même. Une seule
    phrase de conclusion autorisée : *« Nous vous répondrons par écrit dans les termes de notre courrier
    du 13 août. »*

    - Compte rendu écrit dans les 24 h, envoyé à D pour accord — cela neutralise les engagements verbaux
    imaginaires.

    - Aucune divergence exprimée devant lui. Il vient chercher la ligne de fracture du comité ; ne la
    lui montrez pas. Vos désaccords se règlent avant la réunion, ou pas devant lui.


    ## 9. Actions parallèles — non négociables, elles démarrent lundi


    - **Marketplace : ouverture immédiate**, deux références test, mise en ligne visée au 31 août. Volume
    modeste, communication nulle. C''est le seul canal activable en moins de trois semaines, il porte
    6 points de marge de plus, et l''exclusivité l''interdirait. L''ouvrir maintenant est aussi ce qui
    rend le carve-out du § 4.6 crédible.

    - **Centrale régionale** : relance formelle cette semaine, demande d''un jalon intermédiaire à 8 semaines
    plutôt qu''une décision à 5 mois. Proposez un pilote payant sur deux références. Objectif : transformer
    une échéance subie en séquence pilotable.

    - **Prospection** : le DirCo identifie d''ici le 24 août trois clients de plus de 500 k€ potentiels
    hors D, avec premier contact engagé.

    - **Coûts** : le DAF gèle tout recrutement non critique et tout investissement non engagé au-delà
    de 50 k€ jusqu''à mon retour.


    ## 10. Trésorerie — seuils à déclenchement automatique


    Charges fixes ≈ 0,7 M€/mois ; disponible 2,1 M€.


    | Seuil | Déclenchement, sans attendre mon retour |

    |---|---|

    | **< 1,8 M€** | Ligne de découvert négociée avec les deux banques ; affacturage remis sur la table
    |

    | **< 1,5 M€** | Gel total des investissements ; renégociation des échéanciers fournisseurs |

    | **< 1,2 M€** | Convocation d''un comité exceptionnel avec le conseil ; information du président
    |


    Point de trésorerie tous les vendredis, écrit, y compris pendant les congés.


    ## 11. Redon et activité partielle


    Le dossier d''activité partielle est **préparé complètement** dès la semaine du 10 août — pièces,
    effectifs concernés, motif, chiffrage — et **déposé uniquement** si le plan de charge prévisionnel
    à 8 semaines passe sous 70 %, constaté par le Directeur industriel et contresigné par le DAF. Préparer
    coûte quelques jours de travail ; ne pas avoir préparé coûterait six semaines de salaires.


    Information des représentants du personnel : **le 21 août au plus tôt**, pas avant, et seulement si
    le seuil est effectivement franchi. Aucune annonce, aucune rumeur, aucune réponse individuelle aux
    questions des équipes d''ici là. Si la question sort : *« Une négociation commerciale est en cours,
    la direction communiquera après le 20 août. »* Nous ne mettrons pas 52 personnes en alerte pour une
    menace qui n''est pas encore un fait.


    ## 12. Si D exécute le déréférencement le 20 août


    - **J+0** : constat écrit, demande de confirmation formelle des références retirées et des dates d''effet.

    - **J+1** : le Directeur industriel recalcule le plan de charge sur 8 et 16 semaines. Le DAF actualise
    le plan de trésorerie à 6 mois.

    - **J+2** : lettre à D confirmant que Verdal reste ouvert au partenariat et engage désormais ses canaux
    alternatifs. Pas de représailles, pas de communication publique.

    - **J+3 à J+15** : accélération marketplace, relance centrale, prospection. Décisions sociales à mon
    retour, sur la base des chiffres, pas de l''émotion.


    Un déréférencement de quatre références sur huit représente vraisemblablement 4,5 à 7,5 M€ de CA annuel,
    soit 1,4 à 2,3 M€ de marge brute. C''est lourd. Ce n''est pas mortel avec 2,1 M€ de disponible, un
    gel des coûts et l''activité partielle. **La signature, elle, engage 3,4 M€ de marge perdue sur trois
    ans plus 1,2 M€ pour sortir — sans droit de recours et sans alternative légale.** Nous choisissons
    le choc réversible contre la captivité irréversible.


    ## 13. Le meilleur argument contre ma décision — et ce qui la renverserait


    Je dois vous le donner honnêtement, parce que vous l''entendrez la semaine prochaine et qu''il est
    sérieux.


    *L''argument du DAF* : refuser expose 4,5 à 7,5 M€ de CA immédiatement ; les alternatives apportent
    au mieux 0,4 à 2,2 M€ cette année, la centrale rien avant janvier. Le trou n''est comblé ni en montant
    ni en délai. Signer sature Redon, évite le chômage partiel de 52 personnes, et achète douze mois pour
    construire la diversification depuis une position stable. Une marge dégradée vaut mieux qu''un volume
    disparu.


    Il a raison sur l''arithmétique de court terme et je ne le conteste pas. Il a tort sur un point décisif
    : le contrat n''achète pas douze mois de stabilité, il achète douze mois d''engagement contre trente-six
    mois d''interdiction. À partir de la signature, D peut réduire ses volumes en année 2 exactement comme
    il l''a fait au T2 — et nous n''aurons ni recours, ni canal de substitution, ni sortie à moins de
    1,2 M€. On ne construit pas une diversification pendant une exclusivité : on la construit maintenant
    ou jamais. Et si notre survie dépendait vraiment de la signature, cela signifierait que nous sommes
    déjà en situation de ruine — auquel cas la réponse est un plan de restructuration, pas une signature.


    **Ce qui renverserait ma décision**, et que vous êtes mandatés pour exécuter sans moi : les sept conditions
    du § 4. Elles ne sont pas des postures de négociation, ce sont les conditions auxquelles l''accord
    redevient économiquement sain. Si D les accepte, signez le jour même.


    ---


    ## 14. Traçabilité


    Tous les échanges avec D sont écrits ou suivis d''un écrit dans les 24 h. Le dossier complet — courriers,
    comptes rendus, chiffrages, avis du conseil — est constitué au fil de l''eau et me sera remis le 24
    août.


    J''assume cette décision et ses conséquences, y compris le scénario du déréférencement. Vous l''exécutez
    ; vous n''en portez pas la responsabilité. Si elle se révèle mauvaise, elle est mienne, et je le dirai
    ainsi au conseil comme aux équipes.


    *Direction générale — Verdal SAS*


    ---


    *Le catalogue de stations de mesure joint en annexe au dossier ne concerne pas ce dossier et n''a
    pas été utilisé ; il semble avoir été agrafé par erreur.*

    '
