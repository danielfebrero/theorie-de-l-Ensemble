    que je l''enregistre quelque part.


    ---


    # Recommandation — diapositive « activation », comité de mardi


    ## 1. En une ligne


    Retirer le 47 % **et** le 41 % « nettoyé », remplacer par un énoncé borné qui divulgue le défaut,
    et prévenir le chef de file **avant** mardi.


    Ce n''est pas un arbitrage entre prudence et ambition. Le chiffre n''est pas exagéré : il n''a pas
    de dénominateur.


    ## 2. Ce que montrent réellement les journaux


    Le bras v2 est écrit à l''étape 3 ; le témoin à l''inscription.


    | | Témoin | v2 |

    |---|---|---|

    | Écriture de l''affectation | inscription | étape 3 du parcours v2 |

    | Contient les abandons précoces | oui | **non** |

    | Population mesurée | tous les inscrits | ceux qui progressaient déjà |


    Le bras v2 ne mesure pas « les comptes exposés à v2 » mais « les comptes exposés à v2 qui étaient
    déjà en train de réussir ». On conditionne sur une conséquence du traitement. Comparé à l''ensemble
    des inscrits témoins, cela produit mécaniquement un écart positif — **y compris si v2 n''a aucun effet**.


    **Les 4 812 inversions ne sont pas une anomalie, c''est la signature de ce mécanisme.** `first_action_at
    < bucket_assigned_at` est exactement ce qu''on doit voir quand l''affectation est écrite après l''action.
    Même service, horloge unique NTP, aucun incident : l''explication par la dérive d''horloge est exclue.
    Et le témoin donne le bruit de fond réel du pipeline — 98/10 940 = **0,9 %**. Le v2 est à **42,6 %**,
    quarante-sept fois plus. Ce n''est pas le même phénomène.


    ## 3. Pourquoi le 41 % est plus dangereux que le 47 %


    Arithmétique sur les chiffres fournis (dérivée, à revalider) :

    - v2 activés : 0,47 × 11 300 ≈ **5 311**

    - après retrait : 0,41 × 6 488 ≈ **2 660**

    - donc les 4 812 lignes retirées activaient à **≈ 55 %**, contre 41 % pour celles conservées


    Le retrait supprime les comptes les plus avancés dans l''entonnoir — la preuve la plus visible du
    défaut — **sans corriger le défaut** : les 6 488 lignes restantes ont toutes une ligne d''affectation,
    donc ont toutes atteint l''étape 3. Le biais est intégralement conservé.


    Le 47 % est une erreur qu''on peut voir en ouvrant les journaux. Le 41 % est la même erreur dont on
    a effacé le marqueur. La différence n''est pas statistique, elle est de nature : la première se corrige,
    la seconde s''explique.


    ## 4. Ce que le chiffre pourrait valoir


    Le vrai taux est `5 311 / (comptes réellement exposés)`. Ce dénominateur n''est pas instrumenté mais
    il est **reconstructible** : `exposition v2 = (total inscriptions 3 mars–14 avril) − 10 940`. Une
    requête sur la table des comptes. Quelques heures.


    Le point mort est déjà calculable : **17 132 comptes exposés suffisent pour que v2 retombe à 31 %,
    soit la parité.**


    | Exposition v2 réelle | Activation v2 | Écart |

    |---|---|---|

    | 11 300 (hypothèse actuelle) | 47,0 % | +16 pts |

    | 13 000 | 40,9 % | +9,9 pts |

    | 15 000 | 35,4 % | +4,4 pts |

    | **17 132** | **31,0 %** | **0** |

    | 19 000 | 28,0 % | −3 pts |


    30–40 % d''abandon avant l''étape 3 d''un parcours neuf n''a rien d''improbable. **Le signe de l''effet
    n''est donc pas établi** — pas seulement son amplitude.


    ## 5. Une seconde incohérence, à vérifier en premier


    **11 300 > 10 940.** Si la répartition était 50/50, l''exposition v2 valait ~10 940 : il serait impossible
    que 11 300 comptes aient atteint l''étape 3. Donc soit la répartition était déséquilibrée (deuxième
    raison d''incomparabilité, indépendante de la première), soit **11 300 compte des lignes et non des
    comptes distincts** — un événement d''étape 3 rejouable produirait des doublons. Dans ce second cas,
    le numérateur est faux en plus du dénominateur.


    `COUNT(DISTINCT account_id)` avant toute autre chose.


    ## 6. Le meilleur argument contre moi


    > *Toute métrique de stade précoce est sale. Les investisseurs valorisent une fourchette, pas un point.
    Retirer le chiffre phare à neuf jours signale du désordre, et ce signal peut coûter plus que la correction
    ne sauve. Le sens de l''effet est probablement bon ; seule l''amplitude est fausse. Et les −22 % de
    tickets le corroborent indépendamment.*


    Ce qui tient : **le calendrier**. Neuf jours, c''est réel — d''où le fait que tout ce que je propose
    tient en 48 h sans nouveau test.


    Ce qui ne tient pas :

    - « seule l''amplitude est fausse » → le tableau du §4 montre la parité à une exposition plausible
    ;

    - « les investisseurs valorisent une fourchette » → vrai, et ça se retourne : une société qui divulgue
    elle-même son défaut se valorise mieux qu''une société prise en défaut au closing. Argument de valorisation,
    pas de morale ;

    - « les tickets corroborent » → ils corroborent que v2 réduit la charge de support. Ils ne disent
    rien de l''amplitude d''activation. S''en servir, c''est refaire la même erreur de conditionnement
    un étage plus haut ;

    - « une réserve dans les notes de l''orateur » → les notes de l''orateur ne sont pas remises au comité.
    Ce n''est pas une divulgation, c''est une trace qui documente qu''on savait.


    Sur la compétence, sans polémique : le VP Produit décide du dossier produit. La qualification d''une
    déclaration faite à des investisseurs dans une opération dont le term sheet référence explicitement
    cette courbe relève du CEO, de la DAF et du conseil, sous les déclarations et garanties du contrat
    de financement. Ce n''est pas un arbitrage produit.


    ## 7. Ce que contient exactement la diapositive


    > ### Onboarding v2 — activation : mesure en cours de révision

    > **Défaut identifié en interne le [date], avant le comité.**

    >

    > Le test du 3 mars au 14 avril ne permet pas d''estimation ponctuelle. L''affectation v2 est enregistrée
    à l''étape 3 du parcours v2, l''affectation témoin dès l''inscription. Les comptes exposés à v2 ayant
    abandonné avant l''étape 3 n''apparaissent dans aucun bras. Les deux populations ne sont pas comparables.

    >

    > **Ce que nous savons**

    > • Témoin : 3 391 activés à 30 j sur 10 940 inscrits (31 %) — dénominateur fiable

    > • v2 : 5 311 activés à 30 j — **dénominateur en cours de reconstruction**

    > • Point mort : à 17 132 comptes v2 exposés, l''écart est nul

    >

    > **Non affecté par ce défaut**

    > • Tickets de support **−22 %** (file Zendesk, mesure indépendante de l''instrumentation du test)

    > • Rétention à 90 jours : stable

    >

    > **Suite :** dénominateur reconstruit d''ici le [date]. À défaut, test relancé avec affectation à
    l''inscription (2 semaines).


    Si la reconstruction aboutit avant mardi et donne un chiffre défendable, la diapositive porte ce chiffre
    **avec sa méthode visible sur la diapositive**, pas dans les notes de l''orateur.


    ## 8. Ce qu''on dit au comité


    En ouverture, pas en annexe, trente secondes :


    > « Avant les chiffres : en préparant l''annexe, nous avons trouvé un défaut d''instrumentation dans
    notre propre test. Le bras v2 n''enregistrait ses comptes qu''à partir de l''étape 3, le témoin dès
    l''inscription — nous comparions des comptes déjà avancés à l''ensemble des inscrits. Nous ne pouvons
    pas défendre le 47 % et nous ne le présentons pas. Voici ce qui reste solide, la borne que nous savons
    établir, et quand vous aurez le chiffre corrigé. »


    Puis on enchaîne sur les tickets et la rétention, qui portent le dossier.


    ## 9. Rendre la décision adoptable par ceux qui y perdent


    - **VP Produit** : la reconstruction du dénominateur et la rédaction du récit corrigé lui reviennent.
    C''est l''instrumentation de son équipe, et le récit devient *« nous l''avons trouvé nous-mêmes, avant
    vous »*. Il ne subit pas la correction, il la signe.

    - **DAF** : le canal et le séquencement vers le chef de file sont **sa** décision — appel dès lundi
    ou divulgation en séance. Arbitrage réel, pas consultation.

    - **Neuf mois de travail** : rien ici ne dit que v2 ne marche pas. Ça dit qu''on ne l''a pas mesuré.
    Les −22 % de tickets, eux, sont mesurés proprement et tiennent debout seuls.


    Ce qui ne se négocie pas : aucun chiffre d''activation issu de cette instrumentation ne va au dossier
    investisseurs.


    ## 10. Repli et déclencheurs


    | Déclencheur observable | Action |

    |---|---|

    | Reconstruction non terminée lundi 18 h | **aucun** chiffre d''activation sur la diapositive — ni
    point ni fourchette |

    | Exposition v2 ≥ 17 132 | résultat = « pas de gain d''activation mesuré » ; appel au chef de file
    avant mardi |

    | `COUNT(DISTINCT account_id)` < 11 300 | le numérateur est faux aussi ; retirer également le compte
    brut d''activations |

    | Quiconque supprime/modifie/réextrait sur les 4 812 lignes | arrêt, escalade CEO + DAF + conseil
    externe — cela transformerait une erreur en acte |


    Pas de reprise automatique : si le repli se déclenche, on ne revient pas à un chiffre sans validation
    explicite CEO + DAF.


    ## 11. Ce qui me ferait changer d''avis


    Une source écrite **à l''inscription ou à l''évaluation du flag**, indépendante de la progression
    : journal d''évaluation de feature flag, journal du routeur, ou affectation déterministe par hachage
    d''`account_id`, établissant que 11 300 est la population exposée complète.


    Si l''affectation était déterministe à l''inscription et que seule **l''écriture** est tardive, la
    population exposée est reconstructible exactement et le test est sauvable. C''est la bonne nouvelle
    possible, et c''est la première chose à vérifier. Même alors, le 47 % resterait faux — il compte des
    lignes écrites, pas des comptes exposés — mais deviendrait corrigeable en une journée. C''est le seul
    scénario où je retire cette note.


    ## 12. Première action — aujourd''hui


    1. **Instantané en lecture seule** des journaux bruts, de la requête d''extraction et des horodatages,
    conservé hors périmètre modifiable, avant tout « nettoyage ». Une heure. C''est l''action la moins
    chère et la seule dont l''omission est irréversible.

    2. **Trois requêtes** : total des inscriptions sur la fenêtre ; `COUNT(DISTINCT account_id)` sur v2
    ; existence d''un journal d''évaluation de flag à l''inscription.

    3. **Note de 200 mots** à la DAF et au VP Produit : le défaut, le fait que le 41 % ne l''écarte pas,
    le point mort de 17 132. Demander 20 minutes avec le conseil du financement.


    ---


    *Chiffres dérivés (5 311, 2 660, 55 %, 17 132) : arithmétique sur les taux et effectifs de l''énoncé,
    à revalider sur les données sources avant diffusion.*

