response:
  text: 'Voici la note. Le point de bascule de tout le raisonnement n''est pas l''espérance de gain, mais
    le plafond de perte : je le dis explicitement au conseil, parce que c''est aussi ce qui rendrait ton
    DAF fondé si la vérification du contrat tournait mal.


    ---


    **NOTE AU CONSEIL — Séance du vendredi**

    **Objet : Arbitrage Sedamex (option A) / Nordwerk (option B) — horizon 18 mois**

    **De : la direction générale**


    ## 1. Recommandation


    Je recommande l''**option B — installation de la ligne Nordwerk**, sous réserve des trois vérifications
    contractuelles du § 4, à lever avant signature.


    ## 2. Ce sur quoi je fonde ce choix


    **L''écart d''espérance est significatif.** Option A : +200 k€ certains. Option B : 0,6 × 900 − 0,4
    × 400 = **+380 k€ en espérance**, soit 180 k€ de mieux, +90 %.


    **Le choix reste bon même si le bureau d''études se trompe largement.** Les deux options s''égalisent
    à une probabilité de succès de **46,2 %**. L''estimation, adossée à onze installations comparables
    documentées, est de 60 %. Nous disposons donc de **près de 14 points de marge d''erreur** avant que
    la décision ne bascule. Je ne demande pas au conseil de croire au chiffre de 60 % ; je lui demande
    de juger s''il est plausible que la probabilité réelle soit inférieure à 46 %. Je ne le crois pas.


    **Le scénario défavorable ne menace aucun équilibre de l''entreprise.** Perte maximale contractuellement
    plafonnée à 400 k€, pénalité de résiliation comprise :


    | | Aujourd''hui | Après échec Nordwerk |

    |---|---|---|

    | Fonds propres | 3,4 M€ | **3,0 M€** (covenant : 1,2 M€) |

    | Trésorerie | 2,6 M€ | **2,2 M€**, soit 13 mois de masse salariale |

    | Dette nette | nulle | nulle |


    Le covenant bancaire conserve **1,8 M€ de marge** après le sinistre : il faudrait perdre 400 k€ sur
    Nordwerk *et* 1,8 M€ ailleurs pour le rompre. La perte représente 11,8 % des fonds propres et 2,4
    mois de masse salariale. Aucune caution personnelle, aucun défaut croisé, aucune sûreté sur l''actif
    industriel, carnet de commandes non gagé.


    **Dimensionnement du risque.** Rapporté aux fonds propres, l''engagement maximal représente environ
    le quart de ce qu''un dimensionnement optimal autoriserait pour un pari de ce profil. Nous sommes
    nettement en deçà de la prise de risque justifiable, pas au-delà.


    ## 3. Réponse à l''objection de la direction financière


    La formule « on ne joue pas la maison sur un tirage à 40 % » désigne un risque réel — mais ce n''est
    pas celui que nous avons devant nous. **La maison n''est pas dans le pari.** Elle y serait avec une
    caution personnelle, un défaut croisé, une sûreté sur l''outil industriel ou une perte non plafonnée.
    Le contrat exclut les quatre. Ce qui est engagé, c''est 11,8 % des fonds propres, sans effet sur la
    continuité d''exploitation, ni sur le covenant, ni sur la paie.


    Sur Tremay : le dépôt de bilan sanctionne une **exposition, pas une probabilité**. La question pertinente
    n''est pas « ont-ils misé sur une ligne neuve ? » mais « quel était leur plafond de perte, leur trésorerie
    et leur dette nette ? ». Un échec technique ne provoque une défaillance que lorsque la perte est non
    bornée ou financée par dette. Nous sommes à dette nette nulle avec une perte bornée par contrat. Par
    ailleurs, un cas unique observé ne prévaut pas sur onze installations documentées.


    Enfin, je souligne que l''option A n''est pas l''option prudente par défaut : renoncer systématiquement
    à des risques bornés et favorables est, sur la durée, la manière la plus sûre de laisser l''entreprise
    décrocher. Elle nous maintient par ailleurs en dépendance de sous-traitance là où B construit une
    capacité propre — argument secondaire, qui ne porte pas la décision.


    ## 4. Conditions à lever avant signature


    L''engagement étant ferme et sans sortie anticipée, toute la protection se joue **avant** la signature.
    Je demande au conseil de subordonner son accord à :


    1. **L''étanchéité du plafond de 400 k€** : définition contractuelle de l''« échec technique », autorité
    qui l''arbitre, et confirmation écrite qu''aucun coût n''échappe au plafond (remise en état du site,
    montée en compétence, reprise de rebuts, indexation).

    2. **L''échelonnement de trésorerie** des décaissements en scénario d''échec.

    3. **Les modes de défaillance** des onze installations de référence, et la comparabilité de nos conditions
    d''exploitation.


    **Si le point 1 n''est pas confirmé, ma recommandation s''inverse et je propose l''option A.** Mon
    avis repose sur le caractère borné de la perte, non sur l''espérance de gain : sans plafond réellement
    étanche, l''objection de la direction financière devient fondée.


    ---


    Si tu veux, je peux le décliner en une version de deux slides pour la séance, ou ajouter un tableau
    de sensibilité montrant l''écart A/B pour des probabilités de succès de 40 % à 70 %.

    '
