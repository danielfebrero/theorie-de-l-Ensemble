response:
  text: '# NOTE DE DIRECTION — DÉCISIONS EXÉCUTOIRES EN L''ABSENCE DU DG


    **De :** [DG] — **À :** Comité de direction (DAF, Dir. Commercial, Dir. Industriel, DRH)

    **Objet :** Proposition d''exclusivité D — mandat, seuils et plan de contingence

    **Période couverte :** du 9 août au 30 août — **Statut :** exécutoire, non consultatif


    ---


    ## 1. Décision


    **Nous ne signons pas le contrat tel qu''il est proposé. Nous ne rompons pas avec D.**


    Sous huit jours, nous répondons — par écrit, dans les délais — par une **contre-proposition**. Le
    CODIR est mandaté pour signer sans moi, mais **uniquement** si les sept conditions plancher du §4
    sont toutes réunies. Une seule manquante : on ne signe pas.


    **Principe qui tranche tout ce que cette note n''a pas prévu : entre deux options, prendre la réversible.**
    Ne pas signer se rattrape à mon retour. Signer nous engage 36 mois et coûte 1,2 M€ pour en sortir.


    ---


    ## 2. Pourquoi : le contrat est perdant dans tous les scénarios qu''il offre


    Sur le périmètre D (14,9 M€ de CA, marge brute supposée à 31 % — voir réserve §11) :


    | Scénario | Marge brute sur D | Écart / aujourd''hui |

    |---|---|---|

    | Aujourd''hui | 4,61 M€ | — |

    | An 1, remise −9 % **et** volume +18 % tenu | 3,86 M€ | **−0,75 M€** |

    | An 2-3, remise −9 %, volume revenu au niveau actuel | 3,27 M€ | **−1,34 M€ / an** |


    Le chiffre à retenir et à mettre dans le courrier à D : **une remise de 9 % sur le prix de cession
    détruit 29 % de notre marge sur ce périmètre. Il faudrait +41 % de volume pour revenir à l''équilibre
    — pas +18 %.**


    Trois conséquences :


    1. **Même si D tient parfaitement son engagement, nous perdons 0,75 M€ la première année.** Le meilleur
    cas offert est un cas perdant.

    2. **L''asymétrie est totale.** La remise de 9 % est acquise à D pour 36 mois ; le volume n''est ferme
    que 12 mois et « indicatif » ensuite. Coût cumulé sur 3 ans : **−2,25 M€ si l''engagement est tenu
    chaque année, −3,4 M€ s''il retombe.** Notre trésorerie est de 2,1 M€.

    3. **Le contrat fabrique le risque social qu''il prétend écarter.** On dimensionne Redon pour +18
    % en année 1, puis le volume redevient indicatif en année 2 — avec la remise, elle, définitivement
    concédée. Le chômage partiel est décalé de douze mois, pas évité.


    À cela s''ajoute le coût du renoncement : l''exclusivité interdit la centrale régionale (3,5 M€ ×
    31 % ≈ **1,08 M€ de marge/an**) et la marketplace (1,3 M€ médian × 37 % ≈ **0,48 M€/an**). Nous paierions
    9 % pour l''obligation de rester à 62 % de dépendance.


    **Question à poser à D par écrit, et dont la réponse conditionne tout :** l''« engagement » de +18
    % est-il assorti d''une pénalité à sa charge en cas de non-atteinte ? Si non, ce n''est pas un engagement,
    c''est une prévision — et nous concédons 9 % en échange de rien.


    ---


    ## 3. Le vrai levier : nous avons plus de temps que D ne le dit


    Faire valider par [cabinet juridique] **avant l''envoi du courrier — c''est la seule dépendance bloquante
    de cette note** :


    - À 62 % du CA sur une relation établie, une réduction ou un déréférencement brutal relève de l''**article
    L442-1 II du code de commerce** (rupture brutale, y compris partielle, de relations commerciales établies).
    Un préavis écrit proportionné à l''ancienneté et à notre dépendance est dû. **La baisse de 11 % au
    T2 sans préavis est très probablement déjà une rupture partielle brutale** — faire dater et documenter
    ce point cette semaine (bons de commande, historique, échanges).

    - L''**abus de dépendance économique** (L420-2) est à instruire au vu du délai de huit jours imposé
    pour un engagement de 36 mois.


    **Ce n''est pas un levier contentieux, c''est un levier de calendrier.** Nous ne menaçons pas D d''un
    procès : nous rappelons factuellement, dans le courrier, qu''un déréférencement de 4 références sur
    8 appelle un préavis contractuel écrit, et nous demandons lequel. Cela déplace la décision de septembre
    vers un horizon de 12 à 18 mois — le temps exact dont la centrale régionale et la marketplace ont
    besoin.


    **Le combat n''est pas « signer ou pas ». C''est obtenir du temps.**


    ---


    ## 4. Mandat de signature — conditions plancher


    Le CODIR peut signer en mon absence si, et seulement si, **les sept** sont écrites dans le contrat
    :


    1. **Remise sur les tranches incrémentales uniquement.** 0 % jusqu''au volume 2025 constaté ; 9 %
    au-delà. (Ainsi structurée, +18 % nous rapporte +0,59 M€ au lieu d''en coûter 0,75.)

    2. **Durée 12 mois**, reconductible par accord exprès. Pas 36.

    3. **Exclusivité restreinte au circuit de D.** Sont explicitement exclus du périmètre : la vente directe
    et les marketplaces, la restauration hors domicile, et les centrales n''appartenant pas au périmètre
    de D. Nous le déclarons ouvertement dans la contre-proposition — pas de zone grise.

    4. **Symétrie des pénalités.** Toute pénalité à notre charge est adossée à une pénalité équivalente
    à la charge de D si le volume livré est inférieur à 95 % de l''engagement.

    5. **Pénalité de sortie ramenée à 400 k€ maximum et dégressive** (aucune pénalité au-delà du 9ᵉ mois).

    6. **Référencement des 8 références garanti** sur toute la durée, tout retrait soumis à un préavis
    écrit de 6 mois.

    7. **Préavis de 3 mois** pour toute réduction de commande supérieure à 5 % sur un trimestre glissant.


    Toute autre rédaction : **ne pas signer**, répondre que la décision relève de mon retour le 30 août.


    Point de vigilance industriel avant tout engagement volumétrique : [Dir. Industriel] confirme par
    écrit que Redon absorbe +18 % sans capex. Sans cette confirmation, la condition 1 est plafonnée au
    volume réellement productible.


    ---


    ## 5. Courrier à D — à envoyer au plus tard le **13 août**


    Signé [Dir. Commercial] et [DAF], relu par le juriste. Ton : coopératif, ferme, sans agressivité.
    Le silence est le seul mauvais choix.


    Contenu, dans l''ordre :

    1. Réaffirmation de l''importance du partenariat et de notre volonté de croître avec eux.

    2. Impossibilité économique de la remise en l''état : **le point de neutralité est à +41 % de volume**,
    chiffres à l''appui.

    3. Notre contre-proposition (§4), présentée comme un dispositif de croissance partagée : *D obtient
    sa remise sur tout ce qu''il fait croître.*

    4. Question écrite sur la contrepartie de l''engagement de volume (§2).

    5. Paragraphe factuel : au vu de l''ancienneté de la relation et de son poids dans notre activité,
    nous demandons que toute évolution du référencement fasse l''objet d''un préavis écrit, et souhaitons
    connaître celui envisagé. Mention explicite de la baisse de 11 % du T2 intervenue sans préavis.

    6. Proposition de réunion la semaine du 25 août.


    ---


    ## 6. Gouvernance en mon absence


    - **Binôme décisionnaire : [DAF] + [Dir. Commercial].** Signature conjointe obligatoire.

    - **Désaccord entre eux = on ne signe pas.** Pas de vote, pas d''arbitrage par un tiers.

    - **Au-delà du mandat du §4** (D refuse tout et pose un ultimatum ferme, ou exige une réponse avant
    le 30 août sur des termes non couverts) : saisir **[Président du conseil / actionnaire de référence]**,
    seule autorité habilitée à dépasser cette note. Coordonnées transmises séparément. Ne pas signer en
    s''appuyant sur une interprétation extensive du présent document.

    - **Compte rendu écrit** de tout contact avec D dans les 24 h, adressé au binôme et au conseil. Aucun
    engagement verbal, aucune réunion en tête-à-tête sans deuxième personne de Verdal.

    - **Interdiction expresse** : évoquer devant D une quelconque difficulté de trésorerie, un risque
    sur Redon, ou mon indisponibilité. Réponse standard si la question est posée : *« Le dossier est instruit
    par le comité, la réponse vous parviendra dans les délais. »*


    ---


    ## 7. À lancer immédiatement, sans condition et sans attendre la réponse de D


    Ces actions ne sont pas des mesures de repli. Elles se font **maintenant** parce que c''est la seule
    fenêtre où rien ne nous l''interdit.


    - **Centrale régionale — [Dir. Commercial], cette semaine.** Demander un test commercial sur 2 références
    ou une lettre d''intention avant la décision plénière. Cinq mois d''attente est une donnée à attaquer,
    pas à subir. Objectif : un signal écrit avant le 30 septembre.

    - **Marketplace — [Dir. Commercial], pilote ouvert avant le 30 août.** Budget plafonné à **60 k€**,
    2 références sélectionnées hors cœur de gamme D. Objectif : prouver le canal, pas maximiser le volume.

    - **Diversification — [Dir. Commercial].** Trois contacts qualifiés d''ici fin août : un distributeur
    alternatif, un acteur RHD, un dossier MDD.

    - **Juridique — [DAF].** Constitution du dossier de preuve de la relation établie et de la baisse
    du T2, sous 5 jours.

    - **Industriel — [Dir. Industriel].** Chiffrage capacité +18 % et coût de flexibilité, sous 10 jours.


    ---


    ## 8. Redon — seuils et ordre des leviers


    [Dir. Industriel] publie **chaque lundi** le plan de charge à 8 semaines glissantes, diffusé au binôme,
    au DRH et au conseil.


    | Seuil | Déclenchement |

    |---|---|

    | **< 85 %** | Réordonnancement, avancement de la maintenance, formation, résorption des heures supplémentaires
    |

    | **< 75 %** | Rapatriement de la sous-traitance sortante, production sur stock des références à DLC
    longue, congés soldés, gel des intérimaires |

    | **< 70 %** | Procédure de chômage partiel engagée, [DRH] informe le CSE **sans attendre mon retour**
    |


    Le chômage partiel est un dernier recours, mais **il ne se retarde pas pour raison politique** : un
    mois de retard coûte plus cher que la décision elle-même. [DRH] est mandaté pour l''engager seul si
    le seuil est franchi.


    ---


    ## 9. Trésorerie


    - Gel de tout capex non engagé, **hors chantier Maroc**, jusqu''au 30 août.

    - Point de trésorerie hebdomadaire du DAF, prévisionnel à 13 semaines.

    - **Seuil d''alerte : 1,5 M€.** En dessous, [DAF] active la ligne de découvert et informe le conseil
    le jour même.

    - **Aucun décaissement supérieur à 150 k€** hors exploitation courante sans accord conjoint du binôme.


    ---


    ## 10. Interdit sans exception pendant mon absence


    - Signer un engagement d''exclusivité de plus de 12 mois.

    - Signer toute clause pénale supérieure à 400 k€.

    - Renoncer par écrit à la centrale régionale ou à la marketplace.

    - Communiquer en interne ou en externe sur un « risque de perte de D ».

    - Procéder à un licenciement.


    ---


    ## 11. Ce que cette note ne couvre pas — à lire


    Trois points d''honnêteté :


    - **Un chiffre est à vérifier par le DAF sous 48 h.** Une trésorerie de 2,1 M€ décrite comme trois
    mois de charges fixes implique ~8,4 M€ de charges fixes annuelles, pour 7,44 M€ de marge brute. Ces
    deux données sont incompatibles avec un résultat positif : soit le périmètre « charges fixes » inclut
    des coûts variables, soit la couverture réelle est inférieure à trois mois. La décision du §1 ne change
    pas dans les deux cas — elle se renforce si la situation est plus tendue — mais **les seuils du §9
    doivent être recalés** dès la vérification faite.

    - **Ma marge sur D est supposée à 31 %.** Si elle est en réalité inférieure — ce qui est probable
    sur un prix de cession distributeur — le contrat est encore plus destructeur : à 26 % de marge, le
    point de neutralité passe de +41 % à +53 % de volume. L''estimation retenue est la plus favorable
    à D.

    - **Refuser a un coût réel et je l''assume.** Si D exécute la menace sur 4 références et qu''aucun
    préavis ne nous est opposable, la perte peut atteindre ~1,8 M€ de marge annuelle — au-delà de ce que
    la centrale et la marketplace compensent la première année. C''est précisément pourquoi le §3 et le
    §7 sont prioritaires sur tout le reste : ils achètent le temps qui rend cette perte absorbable. Si
    D refuse tout préavis et campe sur un ultimatum, **le sujet dépasse ce mandat : saisir le conseil**,
    ne pas trancher seuls.


    ---


    ## 12. En une phrase


    Nous répondons dans les délais, nous ne cédons pas sur le prix, nous ouvrons les deux canaux alternatifs
    pendant que c''est encore possible, et nous transformons une échéance de huit jours en une négociation
    de douze mois.


    **[DG] — 8 août 2026**


    ---


    Si vous voulez, je peux produire dans la foulée le courrier à D (§5) rédigé mot à mot, ou une version
    fichier de cette note prête à diffuser.

