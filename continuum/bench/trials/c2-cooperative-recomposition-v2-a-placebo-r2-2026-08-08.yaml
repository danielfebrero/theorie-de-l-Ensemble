response:
  text: '## Note de position — présidence de la CLE du bassin de la Vèze


    *Pour la séance de jeudi. Trois délibérations sont proposées au vote, en fin de note.*


    ---


    ### 1. L''addition posée dans le dossier est fausse, et c''est le cœur du problème


    `240 + 150 + 180 = 570` additionne trois objets qui n''ont ni le même statut juridique ni le même
    effet sur la rivière.


    **Le débit réservé n''est pas une demande.** C''est une obligation fixée par arrêté préfectoral, que
    la commission n''a pas le pouvoir de réduire — seul le préfet peut y déroger. Le rapport du 12 juin
    qualifie la perte de non reconstituable à l''échelle d''une décennie : ce qui se joue en dessous de
    180 L/s n''est pas un arbitrage, c''est une destruction définitive contre un gain de huit semaines.
    Je le retire du vote.


    **150 et 240 ne coûtent pas la même chose à la rivière.** L''irrigation est consommée à 85–95 % (évapotranspiration).
    L''eau potable revient largement au milieu par la station d''épuration. La question qui commande tout
    le reste tient en une ligne : **l''exutoire de la STEP de Ferney est-il en amont ou en aval du point
    de contrôle du débit réservé, et en amont ou en aval des deux frayères ?** Réponse attendue avant
    jeudi, un appel suffit.


    - S''il est en aval des frayères — hypothèse que je retiens par prudence, car les frayères sont dans
    le tronçon court-circuité juste sous le barrage — la restitution ne sauve rien de ce qui compte, et
    le plan ci-dessous s''applique intégralement.

    - S''il est en amont du point de contrôle, la consommation nette de l''AEP tombe à 30–40 L/s et **le
    déficit réel n''est pas de 160 L/s mais de l''ordre de 20 à 40**. C''est la seule bonne nouvelle possible
    dans ce dossier ; je ne construis pas le plan dessus, mais je veux la réponse.


    **L''arithmétique honnête est donc : 410 − 180 = 230 L/s à partager entre l''eau potable et l''irrigation.**
    Pas 570 à trouver. Une coupe de 41 % sur les usages humains, à répartir.


    ---


    ### 2. Les trois chiffres du dossier sont invérifiés. Tous les trois.


    Je traite les trois parties de façon symétrique, y compris la station.


    **410 L/s.** Une seule station, dernier étalonnage 2023. Les courbes de tarage sont d''autant plus
    fausses que le débit est bas : l''incertitude en étiage est couramment de ±15 %. Concrètement, viser
    180 L/s avec cette station, c''est accepter une chance sur deux d''être en dessous sans le savoir.
    Tant que l''incertitude tient, **je fixe la consigne à 200 L/s au lieu de 180**. Ces 20 L/s de marche
    d''ignorance sont payés par les maraîchers : c''est pourquoi le jaugeage contradictoire est leur intérêt
    direct, pas une lubie administrative. S''il confirme la station, ils récupèrent 20 L/s sous dix jours.
    S''il l''infirme dans l''autre sens, nous découvrirons que nous violons déjà l''arrêté.


    **150 L/s pour 9 200 habitants.** Cela fait **1 409 litres par habitant et par jour**, soit environ
    sept fois la consommation domestique moyenne française. Ce n''est pas une accusation, c''est une division.
    Trois explications possibles : le réseau dessert autre chose que Ferney, il alimente un gros non-domestique,
    ou son rendement est très dégradé. La commission doit savoir laquelle avant de garantir quoi que ce
    soit. Une consommation humaine réelle, EHPAD compris, se situe autour de **30 à 40 L/s**. L''écart
    n''est pas un usage, c''est un gisement.


    **240 L/s.** Cela correspond à 3,3 mm/jour sur 620 ha : agronomiquement cohérent *si* la totalité
    de la surface est en culture au stade de pointe simultanément. En maraîchage, c''est presque jamais
    le cas — décalages de plantation, parcelles en fin de cycle, cultures en arrêt d''irrigation avant
    récolte. Et l''affirmation « en dessous de 240, tout est perdu » n''est pas un fait agronomique :
    la réponse du rendement à l''eau est continue, avec des périodes critiques par espèce. Je demande
    la ventilation par culture et par stade. Elle existe : chaque exploitant l''a en tête.


    ---


    ### 3. Ce que je garantis, ce que je plafonne, ce que je répartis


    **Bloc vital eau potable — 35 L/s, priorité absolue, jamais rationné.** Servi avant tout le reste,
    y compris avant l''irrigation, en toutes circonstances. Aucun foyer, aucun lit d''EHPAD ne sera privé
    d''eau : c''est écrit, c''est ferme, et cela ne dépend d''aucune négociation ultérieure. En complément,
    plan de sécurisation de l''EHPAD signé sous dix jours (convention citerne, stock d''eau embouteillée,
    patients dialysés). La garantie que réclame la régie porte sur la population, pas sur son prélèvement.


    **Plafond de prélèvement AEP — trajectoire contractuelle, non révisable à la hausse :**


    | | Semaine 1 | Semaine 3 | Semaine 5 |

    |---|---|---|---|

    | Plafond AEP | 110 L/s | 85 L/s | 70 L/s |


    Leviers, dans l''ordre de rapidité : arrêt immédiat des usages non prioritaires sur le réseau (espaces
    verts communaux, terrains de sport, fontaines, lavage de voirie, remplissage de piscines) ; modulation
    de pression nocturne — quelques vannes, installées en une semaine, 10 à 15 % de pertes en moins ;
    campagne de recherche de fuites et réparation des casses majeures. Le tampon de 4 jours reste une
    réserve d''incident : il n''est pas mobilisable pour tenir un usage courant, et son niveau est publié
    quotidiennement. Si la régie estime la trajectoire impossible, elle produit son bilan de rendement
    et la ventilation de ses volumes : la charge de la preuve est de son côté, et elle est facile à porter.


    **Irrigation — le résidu, exprimé en volume hebdomadaire, pas en débit :**


    > **V (m³/semaine) = [ Q₇ − consigne réservé − plafond AEP ] × 604,8**


    où Q₇ est la moyenne des débits journaliers des sept derniers jours.


    | Q₇ mesuré | Réservé | AEP | Irrigation |

    |---|---|---|---|

    | 410 L/s (aujourd''hui) | 200 | 110 | **100 L/s** — 60 500 m³/sem. |

    | 410, après jaugeage + palier 2 | 180 | 85 | **145 L/s** — 87 700 m³/sem. |

    | 360 (hypothèse basse, palier 3) | 180 | 70 | **110 L/s** — 66 500 m³/sem. |

    | < 265 | 180 | 70 | noyau prioritaire, goutte-à-goutte seul |

    | **< 215** | 180 | 35 | **zéro** — saisine du préfet |


    Le seuil d''arrêt total est annoncé aujourd''hui, pas improvisé le jour venu. C''est ce qui permet
    aux exploitants d''anticiper leurs abandons pendant qu''ils ont encore le choix.


    **Pourquoi le volume et non le débit :** 100 L/s étalés uniformément sur 620 ha, cela fait 1,4 mm/jour
    — un déficit de 60 % partout, c''est-à-dire la perte de presque tout, y compris de l''eau déjà appliquée.
    Les mêmes 100 L/s concentrés sur 300 ha, c''est la dose pleine et 300 ha sauvés. **Ce n''est pas moi
    qui peux dire lesquels.** Une allocation en volume, modulable dans le temps, permet aussi d''irriguer
    de nuit — 20 à 30 % de pertes par évaporation en moins sur l''aspersion. D''où deux règles fermes
    : **aspersion interdite de 10 h à 20 h**, et tour d''eau par secteur.


    ---


    ### 4. Réponse à la question du règlement intérieur : volume global, sous trois conditions


    Des quotas individuels aujourd''hui seraient construits sur rien — ni cultures, ni stades, ni compteurs.
    Arbitraires, contestables au tribunal administratif, incontrôlables. Je choisis le **volume global
    par usage**. Mais un volume global non encadré, c''est la course à la pompe : les six exploitations
    qui détiennent 300 ha ont les meilleurs équipements et le meilleur accès, et les 28 autres paieraient
    l''ajustement. Trois conditions donc :


    1. **Le volume n''est versé qu''à un organisme collectif constitué**, contre un plan de répartition
    écrit approuvé par la commission avant décaissement. Pas de plan, pas de volume.

    2. **Le plan respecte un socle et une dégressivité** : une dotation de base à l''hectare sur les premiers
    hectares de chaque exploitation, dégressive au-delà d''un seuil de surface. Ce n''est pas une sanction
    des grands ; c''est la reconnaissance qu''une exploitation de 50 ha diversifiée absorbe un choc qu''une
    de 8 ha ne survit pas.

    3. **Compteurs posés sur les 34 points de prélèvement avant la semaine 3**, condition suspensive de
    la troisième dotation. Sans compteurs, aucun quota n''est exécutoire, et nous rejouerons cette séance
    chaque été. Dans l''intervalle, le contrôle passe par le tour d''eau : qui pompe le mauvais jour se
    voit sans compteur.


    Contrôle et sanction : relevés hebdomadaires publics, contrôles inopinés OFB/DDT, et suspension de
    la dotation de la semaine suivante pour l''exploitation en dépassement — individuelle, jamais collective.
    La délibération est transmise au préfet pour reprise en arrêté, seul support d''une sanction opposable.


    ---


    ### 5. Le mécanisme de sortie : ce qui a échoué en 2022 ne sera pas reconduit


    L''orage a produit du ruissellement, pas de la recharge. La station a mesuré un transitoire, le dispositif
    l''a lu comme un retour à la normale, et quatre jours plus tard le débit était à 340. Avec la règle
    proposée, cet épisode aurait déplacé la moyenne glissante de 410 à environ 430 L/s : aucun changement
    de palier. Le mécanisme corrigé :


    - Indexation sur la **moyenne glissante 7 jours** pour le resserrement, **10 jours** pour l''assouplissement.
    Jamais sur le débit instantané.

    - **Cliquet asymétrique** : une restriction s''applique sous 24 h ; une levée exige dix jours consécutifs
    au-dessus du seuil **et** une remontée piézométrique concordante, **et** ne peut franchir qu''un palier
    par semaine.

    - Tout pic isolé supérieur à 1,5 fois la ligne de base des jours précédents est écarté du calcul comme
    transitoire.


    Recalcul et publication **chaque lundi**, en une page : débit mesuré, volume alloué par usage, volume
    réellement consommé par usage.


    ---


    ### 6. Les 600 000 € : ils ne serviront pas à indemniser


    Face à 4,1 M€ annoncés, 600 000 € d''indemnisation représentent 15 % — dérisoires, vécus comme une
    aumône, et ils n''apportent pas un litre. Le fonds va là où il produit de l''eau ou de la preuve :


    | Poste | Montant |

    |---|---|

    | Métrologie : jaugeage contradictoire, seconde station à l''aval, piézomètre de référence | 70 k€
    |

    | Compteurs sur les 34 points, télérelève sur les 10 principaux | 90 k€ |

    | Régie : modulation de pression, recherche de fuites, réparations d''urgence | 260 k€ |

    | Fonds de rachat de volumes entre exploitations (abandon anticipé indemnisé) | 150 k€ |

    | Sécurisation EHPAD et réserve d''urgence | 30 k€ |


    Le calcul qui justifie la ligne la plus lourde : 260 k€ de travaux sur le réseau, s''ils libèrent
    30 L/s, produisent 145 000 m³ sur huit semaines. À la valeur que les maraîchers attribuent eux-mêmes
    à leur eau — 4,1 M€ pour 1,16 Mm³, soit 3,5 €/m³ — cela représente **environ 500 000 € de récolte
    sauvée dès cette saison**, et le gain persiste les années suivantes. Aucune autre affectation de ce
    fonds n''approche ce rendement.


    L''indemnisation, elle, ne relève pas de nous et pèse bien plus lourd : je saisis dès vendredi la
    DDT pour l''engagement de la procédure de reconnaissance des pertes, ouvrant l''indemnisation de solidarité
    nationale, le dégrèvement de TFNB, les reports de cotisations MSA et l''activité partielle pour les
    saisonniers. C''est une lettre, et elle vaut plusieurs fois le fonds départemental.


    ---


    ### 7. Ce que je dis à chacun


    **À la régie.** Vous avez votre garantie, sans contrepartie et dès la première ligne : la consommation
    humaine et l''EHPAD sont servis avant tout, y compris avant la rivière si le préfet doit en arriver
    là. Ce que je ne garantis pas, c''est 150 L/s, parce que 1 409 litres par habitant et par jour ne
    sont pas une consommation. Vous n''êtes pas mise en cause : vous êtes le seul acteur du dossier qui
    peut libérer 40 à 60 L/s sans que personne ne perde quoi que ce soit, et je vous en donne les moyens
    financiers sous quinze jours. Si mon estimation est fausse, vos chiffres la corrigeront — apportez-les
    jeudi.


    **Aux maraîchers.** Vous avez quitté la salle parce que vous attendiez une coupe uniforme, et vous
    aviez raison de la craindre : elle aurait tué les 28 petites exploitations en épargnant les six grandes.
    Je ne peux pas vous donner 240 L/s ; personne ne le peut, ils n''existent pas dans la rivière. Je
    peux vous donner trois choses : le droit de décider vous-mêmes où va l''eau, parce que vous savez
    ce que la commission ignore ; un socle qui protège les plus petits, financé par la dégressivité sur
    les plus grands ; et une trajectoire à la hausse — 100 L/s aujourd''hui, 145 sous dix jours si le
    jaugeage confirme la station, davantage à mesure que le réseau de Ferney cesse de fuir. Chaque litre
    récupéré ailleurs vous revient. Et je vous dis franchement le reste : concentrez, triez tôt, abandonnez
    vite ce qui est perdu. Une parcelle condamnée qu''on arrose encore vole l''eau d''une parcelle sauvable.


    **Sur le milieu, et à la presse.** Il n''y a pas de « choix entre les paysans et les robinets ». Le
    plus gros gisement du dossier n''est ni dans les champs ni dans les robinets : il est dans les fuites
    et dans une station de mesure qu''on n''a pas étalonnée depuis trois ans. Et les 180 L/s ne sont pas
    une part dans un partage : c''est un plancher légal que cette commission n''a pas le pouvoir de voter,
    et derrière lequel il y a une perte que dix ans ne rattrapent pas. Il ne cédera que devant l''eau
    potable, et seulement par dérogation préfectorale. Jamais devant l''irrigation.


    ---


    ### 8. Ce que je ne promets pas


    Le plan ne referme pas les 160 L/s. Il en récupère environ 100 à 130 — 40 à 65 sur le réseau, 15 à
    25 par l''irrigation nocturne, 0 à 20 par la métrologie, 20 à 40 par l''abandon anticipé des parcelles
    condamnées. **Le solde, entre 30 et 60 L/s, est une perte agricole réelle, et il n''y a pas d''artifice
    qui l''efface.** Elle sera concentrée, par construction, sur les surfaces que la profession aura choisi
    de ne pas sauver. Je préfère annoncer cela jeudi plutôt que de le laisser découvrir en septembre.


    ---


    ### Délibérations soumises au vote


    1. **Consigne de débit à l''aval** : 200 L/s jusqu''au jaugeage contradictoire, retour à 180 L/s dès
    sa validation. Le débit réservé est retiré du champ de l''arbitrage.

    2. **Allocation par volume global et par usage**, selon la formule de résidu, la trajectoire de plafond
    AEP et l''échelle de paliers ci-dessus — avec bloc vital AEP de 35 L/s en priorité absolue, et versement
    du volume d''irrigation à un organisme collectif sous les trois conditions énoncées.

    3. **Affectation des 600 000 €** selon le tableau, et saisine du préfet pour reprise en arrêté ainsi
    que de la DDT pour la reconnaissance des pertes.


    **Calendrier :** J+1 saisines préfet et DDT — J+3 tour d''eau applicable, jaugeage commandé — J+7
    réponses de la régie (rendement, exutoire STEP, ventilation) et plan de répartition des maraîchers
    — J+10 recalcul de la consigne, passage possible au palier 2 — J+15 engagement du fonds — J+21 compteurs
    posés, condition de la troisième dotation — **chaque lundi**, recalcul et publication.

    '
