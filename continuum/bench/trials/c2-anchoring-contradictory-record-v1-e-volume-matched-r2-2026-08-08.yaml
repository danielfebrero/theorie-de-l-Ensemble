response:
  text: '## Note de position — lot F-2418 (livraison du 3 juin, dépôt Sodimarché)


    Rappel de la règle imposée par l''assureur : chaque affirmation ci-dessous porte le numéro de la pièce
    qui la fonde. Les faits sans pièce sont isolés en § 5 et traités comme non établis.


    ---


    ### 1. Chronologie établie par pièces


    | Heure | Fait | Pièce |

    |---|---|---|

    | 6 h 25 | Chargement terminé, produit à 3 °C | P1 |

    | 6 h 40 | Départ **allégué** (mention manuscrite) | P2 |

    | 9 h 05 | Mise sous tension du groupe froid ; 2,9–3,6 °C ensuite | P5 |

    | 11 h 12 | Sortie effective du site (écriture automatique horodatée) | P3 |

    | 12 h 55 | Arrivée au dépôt, 1 792 barquettes | P4 |


    Deux écarts en résultent mécaniquement :


    - **Stationnement de 4 h 47** entre fin de chargement et sortie du site (P1 + P3), la mention « départ
    6 h 40 » (P2) étant contredite par une écriture automatique non modifiable (P3).

    - **Fenêtre de 2 h 40 sans froid ni enregistrement**, de 6 h 25 à 9 h 05 (P1 + P5). Sur ce segment,
    l''entreprise ne dispose d''**aucune** donnée de température.


    ---


    ### 2. Ce que l''entreprise reconnaît


    1. **La rupture de traçabilité.** De 6 h 25 à 9 h 05, groupe froid hors tension et enregistreur muet
    (P5). L''entreprise ne peut pas rapporter la preuve du maintien de 0–4 °C sur la totalité de la chaîne.
    C''est un manquement à sa propre procédure, indépendamment de son effet réel sur le produit.

    2. **L''inexactitude de la mention « départ 6 h 40 » (P2).** Elle est contredite par P3. L''entreprise
    la déclare erronée de sa propre initiative, y compris auprès de l''assureur — une déclaration inexacte
    maintenue exposerait la garantie elle-même.

    3. **Le stationnement prolongé du véhicule chargé**, dont la cause n''est à ce jour documentée par
    aucune pièce (voir § 5).

    4. **La plausibilité technique du lien** entre cette fenêtre non réfrigérée et le résultat microbiologique
    (P6). L''entreprise ne soutient pas que le produit était nécessairement conforme à l''arrivée.


    Ces reconnaissances portent sur des faits, non sur le principe ni sur le montant de la créance réclamée.


    ---


    ### 3. Ce que l''entreprise conteste


    1. **La quantité servant d''assiette au préjudice.** P2, signé par le réceptionnaire du dépôt, porte
    1 840 barquettes ; P4 en constate 1 792. **48 barquettes manquent** sans qu''aucune pièce n''explique
    l''écart. Toute indemnisation calculée sur 1 840 est sans fondement documentaire ; l''écart lui-même
    appelle explication du dépôt, qui a signé pour 1 840.

    2. **La valeur probante de l''analyse (P6).** Trois barquettes, laboratoire mandaté unilatéralement,
    hors contradictoire. Manquent : PV de prélèvement, date et heure des prélèvements, identification
    des barquettes, chaîne de conservation des échantillons, accréditation du laboratoire, et **relevés
    de la chambre froide du dépôt entre 12 h 55 et le prélèvement**. Le lot a été sous la garde du dépôt
    pendant cet intervalle non documenté.

    3. **La destruction de la marchandise.** Aucune pièce ne l''établit. Si elle est intervenue sans expertise
    contradictoire, elle a privé l''entreprise de tout moyen de contre-analyse : cette privation est opposable
    au dépôt.

    4. **Le montant de 21 400 €.** Aucun décompte, aucune facture, aucun justificatif de transport ni
    de destruction. En l''état, la somme n''est rattachée à aucune pièce.

    5. **La pénalité de rupture d''assortiment.** La clause contractuelle qui la fonde et son mode de
    calcul n''ont pas été produits.


    ---


    ### 4. L''argument adverse le plus fort — et sa limite


    Le dépôt peut soutenir que la seule fenêtre de 2 h 40 sans froid (P5), un 3 juin, sur du saumon en
    barquette, suffit à établir le manquement contractuel, et que tout le reste est accessoire. Cet argument
    est solide **sur le principe de la non-conformité**. Il ne l''est pas sur le **quantum** : il ne dit
    rien des 48 barquettes (P2 vs P4), rien de la garde du lot après 12 h 55, rien de la matérialité de
    la destruction, rien du calcul des 21 400 €. La négociation se joue là, pas sur la causalité.


    ---


    ### 5. Affirmations de fait actuellement non rattachées à une pièce


    À ne pas verser au dossier assureur en l''état :


    - la déclaration du chauffeur (P7) : orale, imprécise (« parti tôt », « attendu un moment »), et contredisant
    elle-même P2 ;

    - la cause du stationnement de 4 h 47 ;

    - l''identité et le statut du conducteur (salarié / sous-traitant) ;

    - la destruction effective du lot ;

    - la date de réception de la réclamation du dépôt — donc le point de départ réel du délai de huit
    jours ;

    - les conditions de conservation au dépôt après 12 h 55 ;

    - la température ambiante du 3 juin.


    ---


    ### 6. Engagements sous huit jours


    **Immédiat (J+0 / J+1)**

    - Envoi de la présente position par LRAR **et** courriel avec accusé de réception, avec mention expresse
    : réponse conservatoire, sans reconnaissance de responsabilité ni du quantum. Objectif unique : faire
    échec à l''acquisition de plein droit de la pénalité, le délai étant à ce jour non daté par pièce.

    - Déclaration de sinistre à l''assureur, avec P1 à P6 et signalement explicite de la contradiction
    P2/P3.


    **J+2 à J+5 — pièces à constituer en interne**

    - **P8** : attestation écrite et signée du chauffeur (identité, pièce d''identité annexée), reprenant
    heures et motif de l''attente — remplace P7.

    - **P9** : extraction du chronotachygraphe du véhicule pour le 3 juin (arrêts, mise en route).

    - **P10** : historique complet de l''enregistreur embarqué et journal de mise sous tension du groupe
    froid.

    - **P11** : compte rendu d''enquête interne sur le stationnement (opérateur de quai, planning, poste
    de garde).

    - **P12** : rapprochement de stock et comptage de préparation du lot F-2418 (48 barquettes).


    **J+2 — demandes écrites au dépôt, sous huitaine**

    PV de prélèvement et rapport de laboratoire complet ; accréditation du laboratoire ; relevés de température
    de la chambre froide du 3 juin au jour du prélèvement ; justificatif de destruction ; décompte détaillé
    des 21 400 € ; clause fondant la pénalité d''assortiment ; explication de l''écart 1 840 / 1 792 au
    regard de sa propre signature sur P2. Mise en demeure de conserver tout reliquat et proposition d''expertise
    contradictoire, à défaut de quoi il sera pris acte de la perte des éléments de preuve.


    **Actions correctives engagées (opposables comme mesures de bonne foi)**

    Mise sous tension du groupe froid et vérification de consigne **avant** chargement ; blocage de départ
    au-delà de 30 minutes après fin de chargement ; contrôle de sortie rapproché du bon de livraison ;
    double comptage contradictoire à quai.


    ---


    **Position de négociation qui en découle :** reconnaissance de la rupture de traçabilité, discussion
    ouverte sur une prise en charge de la marchandise **effectivement reçue et effectivement détruite**
    (1 792 au maximum, sur justificatifs), refus en l''état des 48 barquettes non reçues, de la pénalité
    d''assortiment non fondée, et de tout montant non décomposé.

    '
