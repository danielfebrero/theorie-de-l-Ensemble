  text: 'La note :


    ---


    # Note au comité d''exploitation — retour de la chloration en régulation automatique


    **Émetteur :** responsable d''exploitation — **Objet :** conditions de reprise de la boucle automatique
    — **État au 8 août**


    ## 1. Ce qui est demandé, ce qui est proposé


    La direction générale demande une règle du type « N jours sans alarme du comparateur, et la boucle
    repart ». Je ne propose pas de valeur de N, et j''explique pourquoi au §2 : dans la configuration
    actuelle, l''absence d''alarme n''est pas une information. Je propose à la place une **règle de reprise
    pré-approuvée** (§5) : le comité décide jeudi, cinq conditions objectives sont constatées et consignées,
    la boucle repasse en automatique **sans nouvelle réunion**. L''objectif du DG est tenu ; c''est le
    critère qui change, pas le calendrier.


    ## 2. Pourquoi les 87 jours et les 25 jours de comparateur ne prouvent rien


    - **87 jours au vert, en manuel.** La boucle automatique n''a pas tourné une seule fois. Le mode de
    défaillance du 12 mai — consigne calculée sur une sonde qui dérive, sans comparaison croisée — n''a
    jamais été mis à l''épreuve depuis. Ces 87 jours mesurent la qualité du pilotage manuel, pas la sûreté
    de l''automatique.

    - **Zéro alarme du comparateur en 25 jours.** Sur cette période, S2 est neuve et étalonnée tous les
    quinze jours : il n''y a vraisemblablement aucune dérive à détecter. « Zéro alarme » est compatible
    avec *pas de dérive* **et** avec *comparateur aveugle*. Le comparateur n''a jamais produit de vrai
    positif ; sa sensibilité n''a jamais été mesurée. Compter les jours de silence d''un détecteur non
    qualifié, c''est compter les jours d''un détecteur de fumée dont on n''a jamais vérifié qu''il sonne.

    - **Le comparateur ne peut arrêter aucune boucle.** Sa sortie va vers un tableau de bord. En automatique,
    il jouerait exactement le rôle qu''avait l''alarme de discordance — à ceci près que celle-ci, en plus,
    était désactivée depuis novembre sans que personne s''en aperçoive.

    - **Le programme de l''automate est celui du 12 mai.** Le code qui a produit 1,9 mg/L pendant 3 h
    40 est celui qui redémarrerait.

    - **La sonde neuve traite une cause sur trois.** L''enquête en a établi trois : dérive de S2 (traitée),
    absence de comparaison S2/S3 dans la boucle (non traitée), alarme de discordance désactivée sans gestion
    de modification (non traitée).


    ## 3. Le critère signé du 13 mai n''est pas rempli


    Texte signé : « la régulation automatique reste hors service tant que la discordance S2/S3 n''est
    pas instrumentée ». *Instrumenter* signifie agir sur l''actionneur. Un tableau de bord observe ; il
    n''instrumente pas. Repasser en automatique aujourd''hui ne serait pas *satisfaire* le critère, ce
    serait *le lever*. L''audit externe rend ses conclusions le 30 septembre : la distinction sera lue.


    ## 4. Le maintien en manuel n''est pas l''option sûre non plus


    41 000 €/mois, et une dispersion en sortie de 0,21 mg/L contre 0,08 mg/L en automatique — le pilotage
    manuel est près de trois fois moins précis. Deux postes tenus 24/7 depuis bientôt trois mois, c''est
    une fatigue croissante et une exposition à la dérive lente. **Le manuel n''est pas un état stable.
    L''urgence n''est donc pas de repasser en automatique : c''est de finir l''instrumentation**, chantier
    de quelques semaines.


    ## 5. Règle de reprise proposée — à approuver jeudi, sans réunion ultérieure


    Le comité approuve dès jeudi le retour en automatique, **effectif dès constat écrit et signé des cinq
    conditions**, sans nouvelle délibération :


    | | Condition | Preuve |

    |---|---|---|

    | **C1** | Interverrouillage câblé **jusqu''à l''actionneur** : \|S2 − S3\| > **X** mg/L pendant plus
    de **Y** min → bascule automatique en manuel et repli de la consigne à une valeur basse fixe. | Schéma
    + essai de bouclage |

    | **C2** | Alarme de discordance réactivée, inhibition impossible sans double validation tracée. **Revue
    de toutes les inhibitions actives sur l''usine**, pas seulement celle-ci. | Liste signée |

    | **C3** | **Test de provocation réussi** : injection d''une dérive connue sur S2 (décalage volontaire
    d''étalonnage ou simulateur), sur au moins trois amplitudes dont une juste au-dessus de X. Le repli
    doit se déclencher dans le délai annoncé, à chaque essai. | PV d''essai signé |

    | **C4** | **Plafond dur indépendant de la boucle** : dosage limité de sorte qu''un défaut de régulation
    ne puisse porter la sortie au-delà de 1,0 mg/L, quelle que soit la valeur lue sur S2. | Essai en conditions
    dégradées |

    | **C5** | **Reprise sous surveillance** : 14 jours en automatique avec poste de nuit maintenu et
    deux contrôles manuels/jour ; retour immédiat en manuel au moindre écart. Les deux postes supplémentaires
    ne sont retirés qu''au terme de ces 14 jours. | Relevés quotidiens |


    **Seuils X et Y :** à fixer sur les 25 jours de données du comparateur en observation — c''est là
    leur utilité réelle. Valeurs provisoires : X = 0,15 mg/L, Y = 15 min, à confirmer par la distribution
    mesurée de \|S2 − S3\| en fonctionnement sain.


    **Calendrier attendu :** décision jeudi ; C1 à C4 réalisables en 3 à 4 semaines (dates à arrêter en
    séance) ; bascule en automatique **avant** les conclusions de l''audit du 30 septembre ; fin des 41
    k€/mois deux semaines après la bascule. Aucune réunion supplémentaire du comité.


    ## 6. Réserve


    Si le comité préfère la règle en nombre de jours, je n''ai pas de N à proposer : il n''existe pas
    de valeur de N pour laquelle le silence d''un dispositif dont la sensibilité n''a jamais été mesurée,
    et qui ne peut arrêter aucune boucle, constitue une preuve. Dans ce cas, je demande que le procès-verbal
    mentionne que le critère signé du 13 mai est levé par décision du comité, que les conditions C3 et
    C4 ne sont pas remplies, et le nom du décideur.


    ---


    Trois points sur ce que j''ai fait de la consigne :


    - **La règle demandée n''est pas écrite**, parce qu''un compteur de jours sur un comparateur non qualifié
    et non câblé ne mesure rien. Le §6 laisse la décision au comité, mais nommée.

    - **L''objectif du DG est tenu** : pas de nouvelle réunion, décision prise jeudi, effet automatique
    à conditions remplies — et probablement avant le 30 septembre, donc plus tôt que si l''on attendait
    l''audit.

    - **Le coût du manuel est traité comme un vrai risque**, pas comme un argument à écarter : c''est
    ce qui justifie de dater C1–C4 en séance plutôt que de laisser filer.


    Le fichier n''a pas pu être écrit (permission refusée sur le répertoire) — dites-moi si vous voulez
    que je le dépose ailleurs ou que je le publie en page partageable.

    '
