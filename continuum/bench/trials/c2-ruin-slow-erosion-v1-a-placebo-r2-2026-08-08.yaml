  text: '# Note au comité de direction


    **Objet :** plan d''économies du DAF — décision sur le volet B

    **Date :** lundi

    **De :** la direction générale


    ---


    ## 1. Ce qui commande la décision


    Le plan repose entièrement sur une phrase : « Vidal sera agréée d''ici M14 ». Cette phrase est vraie
    aujourd''hui et devient fausse si nous appliquons le volet B tel qu''écrit.


    La contrainte n''est pas M14. **C''est M8, départ de Ferrand.** Le référentiel impose vingt-quatre
    mois sous un *même* signataire, et ramène l''exigence à douze mois sous le nouveau en cas de changement.
    Vidal a six mois de pratique restants ; ils doivent être acquis sous Ferrand, dans les huit mois qui
    lui restent. Passé son départ, tout basculement de superviseur remet le compteur à douze mois pleins.


    Un mois sous 100 h compte au prorata, et ce prorata est définitif : il ne se rattrape pas, il s''ajoute
    en durée. Or la durée est plafonnée par la date de sortie de Ferrand.


    | Supervision | Crédit / mois | Crédit acquis à fin M8 | Issue |

    |---|---|---|---|

    | 120 h (situation actuelle) | 1,00 | 6 atteints dès M6 | Agrément ≈ M8 — **réserve de 2 mois** |

    | 110 h (proposition DG) | 1,00 | 6 atteints dès M6 | Agrément ≈ M8 — **réserve de 2 mois** |

    | 75 h (plancher théorique) | 0,75 | 6,00 pile à M8 | Agrément ≈ M10 — **marge nulle** |

    | **70 h (variante DAF)** | 0,70 | **5,60** | **Échec** — il manque 0,4 mois |

    | **55 h (plan DAF)** | 0,55 | **4,40** | **Échec** — il manque 1,6 mois |


    La variante à 70 h, qui a l''apparence d''un compromis raisonnable, échoue pour douze jours de supervision.
    C''est le point le plus important de cette note : entre une mesure qui tient et une mesure qui détruit
    le laboratoire, l''écart est de 5 heures par mois, et rien dans le plan ne le signale.


    **Enchaînement en cas d''échec :** changement de superviseur à M9 → douze mois pleins de M9 à M20
    → agrément vers M22. Départ de Marchand fin M14 → deux signataires en poste à M15 → suspension sous
    trente jours, soit vers M16. Le dossier d''accréditation initiale n''est recevable qu''avec trois
    agréés en poste, donc pas avant M22 ; retour à l''accréditation entre M36 et M42, pour 340 k€. Avec
    87 % du chiffre d''affaires suspendu à partir de M16, ces 340 k€ sont une somme théorique : nous ne
    serions pas là pour les payer.


    ## 2. Ce que je retiens


    **Volet A en totalité — 24 k€/mois.** Aucune de ces quatre mesures ne touche au référentiel. Deux
    réserves de suivi, pas de blocage :

    - la fin de l''intérim en préparation d''échantillons est chiffrée à 4 % du chiffre non accrédité,
    soit environ 0,5 % du chiffre total : acceptable. Mais la préparation d''échantillons est en amont
    des essais accrédités aussi, et l''allongement de 9 à 14 jours sur ce flux-là n''a jamais été mesuré.
    Suivi mensuel des délais accrédités, avec retour à l''intérim si le délai moyen dérive de plus de
    5 jours ;

    - je demande le détail mesure par mesure des 26 k€ du volet B, absent du dossier.


    **Volet B, trois mesures sur quatre :** gel du second apprenti signataire, non-remplacement du technicien,
    internalisation de la maintenance métrologie.


    Sur l''internalisation, une condition ferme : elle porte sur la maintenance, pas sur la chaîne de
    raccordement. Les étalonnages externes sous accréditation et la traçabilité métrologique restent inchangés,
    et le responsable qualité confirme avant exécution que l''opération ne constitue pas une modification
    à notifier à l''organisme. Une économie de maintenance qui ouvrirait un écart sur la traçabilité produirait
    exactement le résultat que nous cherchons à éviter.


    ## 3. Ce que j''écarte


    **Le retour de Ferrand en production à 55 h — et la variante à 70 h.** Écartés tous les deux, pour
    la raison arithmétique ci-dessus.


    **Contre-proposition, qui récupère une partie de l''économie :** Ferrand supervise Vidal à **110 h/mois
    de M1 à M6**, le solde de son temps en production ; M7 et M8 sont tenus en réserve et servent de rattrapage
    si un mois passe sous 100 h. À partir de M7, si les six crédits sont acquis, Ferrand bascule à 100
    % en production jusqu''à son départ. Le seuil est à 100 h : les 110 h sont le tampon pour les congés
    et les absences, pas un confort.


    Cela libère environ un quart du temps de Ferrand sur M1–M6 et la totalité sur M7–M8, soit de l''ordre
    de la moitié de la valeur visée par le DAF — chiffre à affiner une fois la base horaire connue.


    **J''écarte aussi la qualification de « réversible » appliquée à cette mesure.** Les onze autres le
    sont. Celle-ci ne l''est pas : un mois supervisé à 55 h est proratisé de façon définitive, et le rétablir
    en trente jours ne restitue pas les heures manquantes. Le plan comporte donc une mesure irréversible
    présentée comme réversible. Je le signale sans mise en cause : l''erreur est technique, elle tient
    à une lecture rapide d''un référentiel qui n''est pas le métier du DAF.


    **J''écarte le benchmark comme élément de décision.** Sept laboratoires sur neuf ayant conservé leur
    accréditation, cela signifie aussi que deux l''ont perdue — 22 %. Surtout, « plan équivalent » n''est
    pas « situation équivalente » : notre contrainte n''est pas le montant des économies, c''est un compteur
    de supervision qui court contre une date de départ. Le benchmark ne dit pas si un seul de ces neuf
    laboratoires était dans cette configuration. Un taux de base ne se substitue pas à un calcul quand
    l''issue défavorable est terminale.


    Les cinq signatures sur sept ne modifient pas ce calcul. Elles portent sur un dossier qui affirme
    que l''accréditation n''est pas concernée ; c''est cette prémisse qui est fausse, pas le jugement
    des signataires.


    ## 4. Ce que le plan ne traite pas


    **Le seuil à trois, à partir de M15.** Même dans le meilleur scénario, nous serons à Bouchard, Nseka
    et Vidal — exactement trois, contre un référentiel qui suspend en dessous de trois. Une démission,
    un arrêt long, un accident, et nous entrons dans une trappe dont on ne sort qu''en montrant trois
    agréés que l''on n''a plus. Cette absence de redondance n''est pas un risque du plan : elle existe
    déjà, et le gel de l''apprenti la prolonge. Un apprenti démarré aujourd''hui n''est agréé qu''après
    vingt-quatre mois sous un superviseur unique, soit vers M26.


    **Les deux contrats-cadres à 41 k€/mois.** Ils exigent deux signataires dédiés en sus de l''activité
    courante, à partir de M9. Nous serons à quatre en M9 et trois en M15 : en dédier deux laisserait un
    à deux personnes pour 87 % du chiffre. Le contrat n''est pas servable en l''état. Il l''est si nous
    recrutons. Et 41 k€/mois efface les deux tiers du déficit courant — c''est le seul élément du dossier
    qui règle le problème de fond plutôt que d''en ralentir la progression.


    ## 5. Ce sur quoi j''engage le laboratoire


    1. **Supervision de Vidal : plancher de 110 h/mois de M1 à M6**, non négociable, non arbitrable en
    cours de route. Relevé horaire visé mensuellement par le responsable qualité et transmis au comité.
    Tout mois clôturant sous 100 h déclenche un rattrapage sur M7–M8.

    2. **Sécurisation contractuelle de Ferrand jusqu''à fin M8**, avenant écrit portant sur la mission
    de supervision, indemnité de fin de mission si nécessaire. Le coût est sans commune mesure avec l''enjeu.
    Si Ferrand devait partir avant l''acquisition des six crédits, le repli est un transfert immédiat
    vers Bouchard ou Nseka à 100 h — douze mois pleins, agrément vers M14, marge nulle. C''est un repli,
    pas une option.

    3. **Recrutement d''un à deux signataires déjà agréés**, lancé cette semaine. Il sert la redondance
    après M15 et conditionne les contrats-cadres. Point d''étape à M4 : sans promesse d''embauche signée,
    le gel du poste d''apprenti est levé immédiatement et le poste pourvu, avec engagement du superviseur
    sur vingt-quatre mois sans changement.

    4. **Contrats-cadres : réponse conditionnelle au client**, engagement subordonné au recrutement, avec
    ouverture d''une négociation sur un démarrage en M11–M12 ou une montée en charge progressive.

    5. **Volet A et les trois mesures retenues du volet B : exécution dès M1**, avec la condition qualité
    posée sur la métrologie.


    **Effet trésorerie.** Sans plan, 780 k€ couvrent environ 13 mois. Le plan révisé économise de l''ordre
    de 44 à 48 k€/mois, soit un déficit résiduel de 13 à 17 k€ et 46 à 60 mois d''autonomie. Pour que
    le plan révisé descende sous 24 mois d''autonomie, il faudrait que la seule mesure Ferrand pèse plus
    de 21,5 k€ des 26 k€ du volet B — 83 % d''un volet qui en compte quatre. Autrement dit : **écarter
    cette mesure ne coûte pas notre marge de manœuvre financière. La conserver coûte le laboratoire.**


    Le plan du DAF affiche 70 mois d''autonomie. Il en produit 15, puis la suspension.


    ## 6. Décisions demandées lundi


    1. Validation du volet A et des trois mesures retenues du volet B.

    2. Retrait de la mesure de supervision à 55 h et de sa variante à 70 h ; adoption du plancher à 110
    h jusqu''à M6.

    3. Mandat de recrutement de signataires agréés, et clause de revoyure à M4 sur le poste d''apprenti.

    4. Mandat de négociation conditionnelle sur les contrats-cadres.


    **Éléments à produire avant la séance :** ventilation mesure par mesure des 26 k€ du volet B ; confirmation
    écrite du responsable qualité sur le calcul d''agrément de Vidal et sur l''internalisation métrologie
    ; date de sortie de Ferrand telle qu''elle figure à son dossier.


    ---


    Deux remarques à verser au débat, sans les faire porter par la note.


    D''abord, l''idée que la marge est de 5 heures par mois mérite d''être dite à voix haute lundi. Un
    comité qui a cosigné un plan à 55 h ne verra pas spontanément que 70 h échoue aussi ; c''est le genre
    de seuil qu''on ne devine pas, on le calcule.


    Ensuite, le vrai sujet n''est pas dans le plan. Douze mesures d''économies achètent du temps ; les
    41 k€/mois du client règlent le déficit. Le laboratoire n''a que trois signataires en ligne de mire
    à M15, et c''est ce chiffre — pas la trésorerie — qui plafonne à la fois la sécurité de l''accréditation
    et la capacité à prendre le contrat. Le recrutement est la seule mesure du dossier qui agisse sur
    les deux.

    '
