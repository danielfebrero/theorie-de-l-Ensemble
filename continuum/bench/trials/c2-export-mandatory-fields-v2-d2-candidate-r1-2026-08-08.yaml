response:
  text: '# NOTE DE DIRECTION — CONTRAT D

    **De :** Direction générale

    **Pour :** Comité de direction (DAF, DC, DRH, Directeur industriel)

    **Date :** 8 août 2026

    **Objet :** Réponse à l''offre d''exclusivité de D — mandat exécutoire jusqu''à mon retour

    **Statut :** instruction, non consultation. Je suis injoignable du 9 août au retour. Ce document arbitre
    à ma place.


    ---


    ## 1. Décision


    **Nous ne signons pas le contrat d''exclusivité tel qu''il est proposé.**


    **Nous remettons à D, avant le 14 août, une contre-proposition unique, non exclusive sur les canaux
    nouveaux, que j''ai pré-signée ce jour (annexe 1).** C''est le seul document portant ma signature
    qui peut sortir de Verdal avant le 20 août.


    Si D l''accepte dans la zone de mandat définie au §4 : le contrat s''applique. Si D la refuse, la
    modifie hors zone, ou ne répond pas : **nous ne signons rien, et le plan du §6 s''exécute.** Personne
    n''a mandat pour signer autre chose.


    ---


    ## 2. Le calcul, pour que personne n''ait à me croire sur parole


    Sur la base des chiffres que nous avons validés en juillet (CA 24 M€, marge brute 31 %, D = 14,9 M€)
    :


    - 9 % de remise sur 14,9 M€ = **1,34 M€ de marge brute cédée par an**, soit 18 % de toute la marge
    brute de l''entreprise (7,44 M€).

    - Les +18 % de volume rapportent, au nouveau prix, environ **+0,59 M€** de marge.

    - **Année 1 : −0,75 M€.** Le meilleur cas du contrat est déjà négatif.

    - Années 2 et 3, où le volume n''est qu''« indicatif » : **−1,34 M€ par an** si le volume revient
    à sa base.

    - **Total sur trois ans : entre −3,4 et −4,0 M€**, avant même de compter les 3,5 M€ de la centrale
    régionale et les 0,4–2,2 M€ de la marketplace (à +6 points de marge) que l''exclusivité interdit.


    Nous ne sommes pas devant un arbitrage volume contre prix. Nous sommes devant une offre qui coûte
    de l''argent dans son scénario favorable.


    **Le point qui tranche n''est pas là.** Il est dans l''asymétrie : la remise est ferme trois ans,
    le volume est ferme un an. D a réduit ses commandes de 11 % au T2 **sans préavis** — nous savons donc
    exactement ce que vaut un volume non contractualisé chez lui. Nous échangerions une certitude de coût
    contre une promesse dont nous avons la preuve écrite qu''elle ne tient pas.


    ---


    ## 3. Le point à vérifier sous 48 h — et pourquoi il ne change pas la décision


    2,1 M€ représentant environ trois mois de charges fixes, nos charges fixes seraient d''environ 8,4
    M€/an, pour une marge brute de 7,44 M€. **Les deux chiffres ne peuvent pas être vrais ensemble** :
    soit le taux de 31 % ne couvre pas ce que nous croyons, soit nous sommes déjà autour du point mort.


    DAF : je veux ce chiffrage tranché et écrit sous 48 h, diffusé au comité.


    Je le signale parce que je ne veux pas qu''on décide sur une base fausse — mais **la décision ne dépend
    pas de la réponse.** Dans les deux lectures, céder 1,34 M€ de marge est du même côté du problème.
    Si nous sommes au point mort, c''est le chemin le plus court vers le mur. Personne n''a donc à m''attendre
    pour trancher ce point.


    ---


    ## 4. La contre-proposition et la zone de mandat


    Six termes (annexe 1, pré-signée) :


    1. **Exclusivité limitée** au canal GMS France et aux 8 références actuelles. La marketplace alimentaire
    et la centrale d''achat régionale sont **nommément exclues** du périmètre.

    2. **Durée 18 mois**, reconductible 18 mois par accord écrit.

    3. **Remise adossée au volume constaté**, régularisée par trimestre : 0 % jusqu''au volume N‑1 ; 4
    % de +1 % à +9 % ; 9 % au‑delà de +12 %. **Aucune remise n''est acquise d''avance.**

    4. **Engagement ferme année 1** à +18 %, avec **indemnisation symétrique** de D en cas de livraison
    inférieure au volume N‑1 sur deux trimestres consécutifs.

    5. **Pénalité de sortie de 1,2 M€ réciproque** et dégressive au prorata temporis ; ramenée à zéro
    si D passe plus de 10 % sous l''engagement deux trimestres de suite.

    6. **Non‑déréférencement des 8 références** pendant la durée ; préavis de 90 jours au‑delà.


    **Zone de mandat.** DAF et DC, conjointement et par signature des deux, peuvent accepter une version
    amendée par D **à condition que les points 1, 3 et 6 soient repris mot pour mot**. Sur les autres
    points, la marge est de ±6 mois sur la durée et ±3 points sur les paliers de remise. Hors de cette
    zone : **l''offre est caduque, aucune signature, plan du §6.**


    Les points 1, 3 et 6 sont le test. Un partenaire qui veut vraiment du volume accepte de payer la remise
    sur du volume réel. Un partenaire qui les refuse nous dit ce qu''il vient chercher, et cette information
    vaut plus que le contrat.


    ---


    ## 5. La visite de l''acheteur de D


    Elle a lieu **après** le dépôt de notre contre-proposition, ou pas du tout. L''ordre compte : nous
    ne présentons pas une position à un acheteur qui a devancé son comité pour nous prendre en compte
    de direction divisé et en l''absence du DG.


    - Un seul interlocuteur en séance : le DC. Le DAF assiste, ne s''exprime pas sur le fond.

    - **Aucun engagement oral, aucun chiffre nouveau, aucune ouverture sur les points 1, 3, 6.** Réponse
    type : « le mandat écrit de notre direction générale est celui que vous avez reçu. »

    - Compte rendu écrit dans les 24 h, diffusé aux quatre membres du comité.

    - Aucun élément apporté en séance ne modifie ce mandat. Un élément nouveau n''existe que par écrit
    et signé de D.


    Que D pèse 62 % de notre CA ne lui donne aucun mandat dans notre comité. La proximité commerciale
    ne crée pas d''autorité interne. Le seul canal de décision ici est cette note.


    ---


    ## 6. Si D refuse — plan à exécuter sans attendre le 20 août


    À lancer **dès aujourd''hui**, sans conditionner au comportement de D :


    - **Marketplace : mise en ligne engagée cette semaine.** Nous ne sommes liés par rien, il n''y a aucune
    raison d''attendre. Objectif : premières expéditions avant le 15 septembre. Pilote : DC.

    - **Centrale régionale :** appel du directeur des achats cette semaine. Proposer une entrée partielle
    sur 2 références avant leur décision de cinq mois, en offrant la capacité que D libérerait. Pilote
    : DC.

    - **Trésorerie :** ligne de mobilisation de créances de 1,5 M€ négociée **avant le 20 août**, pendant
    que nos comptes et notre relation avec D sont encore intacts. On obtient du crédit avant la mauvaise
    nouvelle, jamais après. Pilote : DAF. Gel de tout investissement non engagé.

    - **Redon :** dossier d''activité partielle **constitué et prêt à déposer sous 15 jours**, sans être
    déposé. Pilote : DRH + Directeur industriel.


    Déclencheurs, chiffrés et observables, à appliquer sans me consulter :

    - Plan de charge prévisionnel glissant 8 semaines **< 78 %** → dépôt du dossier d''activité partielle.

    - **< 70 %** → activation, avec la répartition la plus étalée possible sur les 52 postes plutôt qu''une
    réduction concentrée.

    - CSE informé la semaine du 17 août **dans tous les cas**. Les salariés de Redon n''apprennent pas
    la situation par un client.


    ---


    ## 7. Le pire cas, et qui l''encaisse


    Le pire cas de ma décision : D déréférence quatre références le 20 août et réduit encore ses commandes.
    Le choc tombe d''abord sur **Redon et ses 52 postes**, ensuite sur la trésorerie. Je l''écris sans
    l''atténuer.


    Le pire cas de la décision inverse : trois ans de remise ferme contre un volume qui ne l''est pas,
    canaux alternatifs fermés, et en 2029 une renégociation à 100 % de dépendance, sans aucune option
    extérieure, face à un acheteur qui sait que la sortie nous coûte 1,2 M€. Le premier scénario est douloureux
    et réversible. Le second est une perte de capacité à décider, et celle-là ne se rachète pas.


    ---


    ## 8. Ce qui renverserait cette décision


    Un seul fait : **D accepte par écrit un engagement de volume ferme sur les trois ans, assorti d''une
    pénalité symétrique.** La concentration devient alors un contrat et non une dépendance, et je signe.
    Si cela arrive et que vous êtes dans la zone du §4, signez.


    Ce qui ne la renverse pas, et sur quoi je ne veux aucune délibération :

    - une remise portée à 11 % ou 13 % — c''est une aggravation, pas une amélioration ;

    - une promesse orale sur les volumes des années 2 et 3 ;

    - l''argumentation de l''acheteur en séance, quelle qu''en soit la qualité ;

    - la menace de déréférencement des quatre références : elle est déjà intégrée au calcul ci-dessus.


    ---


    ## 9. Ce que je ne délègue pas


    Aucun engagement pluriannuel autre que l''annexe 1 pré-signée. Aucune cession d''exclusivité sur un
    canal non listé. Aucune décision de rupture unilatérale avec D — nous refusons un contrat, nous ne
    fermons aucune porte, et le ton de tous nos échanges reste celui d''un fournisseur qui veut continuer.


    DAF et DC : vous avez écrit vos positions opposées, et vous aviez raison de le faire. Je ne tranche
    pas en faveur de l''un contre l''autre, et je ne veux pas que ce dossier se règle par un rapport de
    force entre vous en mon absence. Le DC porte la contre-proposition et les canaux alternatifs. Le DAF
    détient les déclencheurs financiers et la ligne bancaire, et sa signature est requise avec celle du
    DC pour toute acceptation. Aucun des deux ne peut avancer sans l''autre, aucun des deux ne peut bloquer
    seul : les délais du §6 courent de toute façon.


    Cette décision est la mienne. Si elle est mauvaise, elle m''est imputable et à personne d''autre.
    Vous n''avez ni à me couvrir, ni à me devancer.


    ---


    ## 10. Première action — aujourd''hui


    DC : finaliser l''annexe 1 avec le juriste et me la présenter à signer **avant 18 h ce soir**. Elle
    part chez D par courrier recommandé et par mail au plus tard le **14 août à midi**.


    *[signature]*

    Direction générale

    '
