response:
  text: '# NOTE AU CONSEIL D''ADMINISTRATION


    **Objet :** Arbitrage Sedamex (A) / Nordwerk (B) — période de 18 mois

    **Date :** vendredi — pour décision

    **Recommandation : Option B (Nordwerk), sous les quatre conditions préalables énoncées au § 4.**


    ---


    ## 1. Le chiffre qui décide


    | | Option A | Option B |

    |---|---|---|

    | Résultat espéré sur 18 mois | **+200 k€** (certain) | **+380 k€** (0,6 × 900 − 0,4 × 400) |

    | Pire cas | +200 k€ | **−400 k€** |

    | Fonds propres à l''échéance | 2,9 M€ | 3,6 M€ (succès) / 2,3 M€ (échec) |


    B rapporte en espérance 90 % de plus que A. Mais l''espérance ne suffit pas à décider : c''est la
    question du § 2 qui tranche.


    ## 2. Le pire cas de B ne met pas l''entreprise en danger — c''est le point central


    Nous partons de 3,4 M€ de fonds propres et 2,6 M€ de trésorerie, sans dette. Le dividende de 700 k€
    est exigible et non révisable : il s''impose **dans les deux options** et ne discrimine donc pas entre
    elles.


    **Covenant (FP > 1,2 M€).** En scénario d''échec de B, et en retenant le traitement comptable le plus
    sévère (dette de dividende constatée dès le vote de juin) : 3,4 − 0,7 − 0,4 = **2,3 M€**. Le coussin
    reste de **1,1 M€, soit 92 % au-dessus du seuil**, à chacune des six clôtures trimestrielles. Aucun
    scénario de B ne s''approche du covenant.


    **Trésorerie.** Pire séquencement (perte constatée avant la première échéance de dividende) : plancher
    à **1,5 M€**, soit environ **neuf mois de masse salariale**, sans dette à servir.


    **Périmètre de la perte.** Elle est plafonnée contractuellement à 400 k€, pénalité comprise. Il n''y
    a **ni caution personnelle, ni défaut croisé, ni sûreté sur l''actif industriel**, et le carnet de
    commandes n''est pas gagé. L''exposition maximale représente **11,8 % des fonds propres et 15 % de
    la trésorerie**.


    ## 3. Réponse au directeur financier


    Son objection est la bonne question, mais elle ne s''applique pas à ce dossier.


    **« On ne joue pas la maison. »** D''accord — et nous ne la jouons pas. Le principe de ne pas accepter
    un pari à 40 % de perte sur un tirage unique vaut lorsque le sinistre est *absorbant* : quand il ferme
    l''entreprise, déclenche le covenant, ou appelle une caution. Ici le sinistre est borné à 400 k€,
    ne touche ni le covenant, ni les actifs, ni le patrimoine du dirigeant. Refuser un pari borné à 12
    % des fonds propres n''est pas de la prudence, c''est un renoncement à la croissance : A ne reconstitue
    pas les 700 k€ distribués et nous laisse à 2,9 M€ de fonds propres, en retrait sur notre point de
    départ.


    **Tremay.** Un cas, sans que nous connaissions sa dette, ses sûretés, ni s''il disposait d''un plafond
    de perte. Un exemple saillant ne mesure pas un risque ; le nôtre est mesuré et plafonné par contrat.


    **L''objection sérieuse est ailleurs — et je la formule moi-même.** Le vrai point faible de B n''est
    pas le montant de la perte, c''est **la fiabilité du 60 %**. C''est une estimation interne tirée de
    onze cas, exposée à un biais de sélection : les installations *documentées* sont plus souvent celles
    qui ont réussi. Le point de bascule est le suivant : **B ne l''emporte sur A que si la probabilité
    de succès dépasse 46 %**. Notre marge d''erreur tolérable sur l''estimation du bureau d''études est
    donc de **14 points** — confortable, mais pas illimitée. Second point faible : l''engagement est irréversible,
    et l''absence de clause de sortie a une valeur négative réelle que A ne supporte pas.


    C''est pourquoi je ne recommande pas B sans conditions.


    ## 4. Conditions préalables à la signature


    1. **Vérifier le dénominateur.** Le bureau d''études documente les onze installations, échecs compris,
    sous revue d''un tiers indépendant. **Si le taux de réussite constaté tombe sous 50 %, nous basculons
    sur A** — sans nouveau débat.

    2. **Confirmation juridique écrite** que le plafond de 400 k€ est bien *all-in* (y compris remise
    en état et frais internes de sortie) et que l''absence de caution, de défaut croisé et de sûreté est
    explicite au contrat.

    3. **Piloter au pire cas.** Les 400 k€ sont provisionnés dans le plan de trésorerie dès la signature.
    Aucun gain n''est reconnu ni engagé avant réalisation.

    4. **Jalons de constatation à M3, M6, M9**, avec critères techniques définis à l''avance. L''absence
    de clause de sortie ne nous prive pas de décision : constater l''échec tôt permet de solder la pénalité,
    libérer les équipes et cesser de consommer du management. Reporting au conseil calé sur les dates
    de test du covenant.


    **En résumé :** B est le meilleur choix parce que sa perte maximale est connue, bornée et absorbable,
    et que son espérance est supérieure de 180 k€. Je demande au conseil de l''approuver sous réserve
    de la condition n° 1, dont je rendrai compte sous quinze jours.

    '
