  text: '# Note au conseil — séance du jeudi

    **Objet : affectation de l''enveloppe non reconductible de 900 000 €**


    ---


    ## 1. Le point qui commande les deux décisions


    Les dossiers A et B sont présentés séparément. Ils ne le sont pas. Changer six machines dans une entreprise
    de dispositifs médicaux impose une requalification des procédés et une information de l''organisme
    notifié. Cette opération est portée par le directeur qualité — celui qui part dans onze mois. **Acheter
    maintenant et installer pendant qu''il est encore là, c''est faire la requalification avec la personne
    qui la maîtrise. Décaler d''un an, c''est la confier à quelqu''un qui n''a jamais dialogué avec l''organisme
    notifié.** Le calendrier, plus que la rentabilité, justifie d''engager A cet exercice.


    ## 2. Dossier B — décision : nomination interne + mission de transition, avec option de repli engagée


    Le risque n''est pas un risque de coût, c''est un risque d''accès au marché. Trois expositions distinctes,
    à traiter séparément :


    - **la relation à l''organisme notifié** : sans interlocuteur reconnu, c''est la certification, donc
    la capacité à vendre, qui est en jeu ;

    - **la compétence d''audit interne** : neuf auditeurs formés par une seule personne ;

    - **deux clients hospitaliers, 31 % du chiffre d''affaires**, qui disent travailler avec nous à cause
    d''un individu.


    Aucune de ces trois expositions ne se compare à un problème de productivité. Un point de rebut se
    rattrape ; une certification perdue, non.


    **Proposition : promotion de l''adjointe (45 000 €) + mission de transition de l''intéressé sur douze
    mois (90 000 €) = 135 000 €.** Les deux options ne s''excluent pas : c''est leur combinaison qui couvre
    les trois expositions, là où le recrutement externe n''en couvre aucune mieux et ajoute un risque
    d''intégration sur onze mois seulement.


    Cette nomination n''est pas un pari aveugle. Elle est assortie de **trois jalons vérifiables à six
    mois** : l''adjointe pilote seule le prochain cycle d''audit interne ; elle est présentée et co-signataire
    auprès de l''organisme notifié ; elle effectue une visite conjointe chez chacun des deux clients hospitaliers.
    **Si un seul jalon n''est pas tenu, le recrutement externe est déclenché** — d''où le point suivant.


    **Option de repli : 100 000 € engagés sur un mandat de cabinet, activable au sixième mois.** Elle
    doit être signée cet exercice, sinon elle n''existera plus quand nous en aurons besoin. À noter :
    les 280 000 € du scénario externe ne pèsent pas tous sur cette enveloppe — le surcoût salarial est
    une charge de personnel récurrente, pas un investissement. Seuls les honoraires doivent être sécurisés
    maintenant.


    ## 3. Dossier A — décision : lot complet, sous trois conditions de signature


    Ce que l''historique audité démontre réellement : 362 heures d''arrêt par an, soit **56 000 € de perte
    annuelle** (42 600 € de coût direct + 13 800 € de marge perdue). Rapporté à 620 000 €, cela fait **onze
    ans de retour** — insuffisant pour justifier l''achat dans des conditions normales.


    Mais les conditions ne sont pas normales : l''argent non engagé disparaît. La question n''est donc
    pas « ce projet franchit-il notre seuil de rentabilité ? » mais « 620 000 € ici valent-ils mieux que
    620 000 € nulle part ? ». La réponse est oui, à condition de vérifier trois choses avant de signer
    :


    1. **Le gain de rebut.** Il n''est pas chiffré au dossier et c''est lui qui fait basculer le calcul.
    Pour un retour en cinq ans, les 2,9 points gagnés doivent représenter environ 68 000 €/an, soit une
    base de production consommée d''environ 2,3 M€/an. La direction financière peut répondre en une heure.
    **Si la réponse est non, nous n''achetons que quatre machines et redéployons le solde sur B.**

    2. **La garantie de 96 %.** Notre parc actuel tourne déjà à environ 60 heures d''arrêt par machine
    et par an. Si nos machines tournent plus de 1 500 heures par an, le fournisseur nous garantit moins
    que ce que le vieux parc délivre déjà. À vérifier avant signature, sinon la garantie et ses pénalités
    ne valent rien.

    3. **La concentration des pannes.** Nous disposons de l''historique machine par machine. S''il apparaît
    que trois machines concentrent l''essentiel des 47 pannes, l''argument d''urgence ne porte que sur
    celles-là.


    **Recommandation : engager le lot complet (620 000 €) — l''engagement contractuel est en un lot, le
    déploiement est échelonné** sur trois vagues de deux machines, pour éviter le choc de production et
    étaler la requalification. Nous achetons en une fois pour le prix et pour le calendrier ; nous installons
    progressivement pour la maîtrise.


    Le solde de **45 000 €** couvre le stock de pièces critiques, la formation des opérateurs et la qualification
    des procédés — dépenses obligatoires, souvent oubliées, qui décident du succès réel de l''opération.


    ## 4. Répartition proposée


    | Affectation | Montant |

    |---|---|

    | A — Renouvellement des six machines (lot unique, déploiement échelonné) | 620 000 € |

    | A — Pièces critiques, formation opérateurs, qualification procédés | 45 000 € |

    | B — Promotion de l''adjointe (2 ans) | 45 000 € |

    | B — Mission de transition du directeur qualité (12 mois) | 90 000 € |

    | B — Mandat de recrutement externe, option activable au 6ᵉ mois | 100 000 € |

    | **Total engagé** | **900 000 €** |


    *Point à confirmer avec le commissaire aux comptes avant jeudi : la mission de transition démarre
    après le départ, dans onze mois. Elle doit être contractualisée cet exercice pour être engagée sur
    cette enveloppe.*


    ## 5. Ce que nous ne savons pas


    Le chiffrage de A repose peut-être sur un double comptage : il faut confirmer que les 213 000 € de
    coût d''immobilisation n''incluent pas déjà la marge perdue. S''ils l''incluent, la perte annuelle
    tombe à 42 600 € et le retour passe à quatorze ans — la condition n° 1 devient bloquante.


    Sur B, nous n''avons ni précédent interne ni comparable sectoriel. Nous ne pouvons donc pas prévoir
    : nous ne pouvons que couvrir. C''est la logique de l''option de repli — et c''est la seule ligne
    de cette note que je considère comme non négociable.


    ## 6. Décisions demandées


    1. Valider la promotion de l''adjointe et la mission de transition, avec les trois jalons à six mois.

    2. Autoriser l''engagement du mandat de recrutement en option.

    3. Autoriser l''achat du lot complet **sous réserve** de la vérification du gain de rebut et de la
    clause de disponibilité ; à défaut, repli sur quatre machines et redéploiement du solde sur B.

    '
