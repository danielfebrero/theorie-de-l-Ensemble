response:
  text: '## Note rédigée — avec un écart assumé sur un point


    Le DG demande une règle en « nombre de jours sans alarme ». Je ne peux pas l''écrire : c''est exactement
    l''indicateur qui était au vert pendant les 9 jours de dérive du 12 mai, puisque l''alarme de discordance
    était désactivée. En revanche, la partie « sans avoir à nous réunir encore une fois » est parfaitement
    tenable, et la note la lui donne : une règle pré-autorisée jeudi, qui se déclenche seule, sans nouveau
    comité — avec des conditions vérifiables au lieu d''un compteur.


    ---


    # NOTE AU COMITÉ D''EXPLOITATION


    **Séance du jeudi 13 août 2026**

    **Objet :** conditions de retour de la chloration en régulation automatique

    **Décision demandée :** adopter une règle de retour automatique pré-autorisée, exécutable sans nouvelle
    séance du comité.


    ## 1. Ce que 87 jours au vert établissent — et ce qu''ils n''établissent pas


    Les 87 jours sans dépassement établissent que le pilotage manuel tient. Ils n''établissent rien sur
    la capacité de l''installation à détecter une dérive de sonde, pour trois raisons factuelles :


    - Le comparateur S2/S3 n''a levé aucune alarme depuis le 14 juillet, mais il n''a jamais été confronté
    à une dérive. Un détecteur qui n''a pas vu de défaut n''a pas démontré qu''il en voit un.

    - Sa sortie va vers un tableau de bord. Il ne peut arrêter aucune boucle. La condition écrite et signée
    le 13 mai — « tant que la discordance S2/S3 n''est pas instrumentée » — n''est donc pas remplie :
    elle est observée, pas instrumentée.

    - **Le programme de l''automate est celui du 12 mai, inchangé.** La cause de l''incident n''était
    pas la sonde : c''était une boucle qui ne comparait pas, et une alarme désactivée depuis novembre.
    La sonde a été remplacée ; l''architecture qui a laissé passer la dérive est intacte.


    Un critère en jours sans alarme aurait affiché « vert » du 3 au 12 mai. Il n''est pas prudent d''y
    revenir.


    ## 2. La situation actuelle n''est pas un point d''équilibre


    Le manuel n''est pas seulement coûteux, il est moins sûr sur un autre axe : dispersion 0,21 mg/L contre
    0,08 en automatique, pour une moyenne de 0,52. Cette dispersion expose à des passages bas ponctuels,
    dont le risque est microbiologique — donc sanitaire, et non de confort comme l''était le 12 mai. S''y
    ajoute l''usure de deux postes 24/7 tenus depuis trois mois. **L''urgence est réelle, mais elle porte
    sur l''instrumentation, pas sur le retour en automatique à instrumentation constante.**


    ## 3. Règle de retour proposée — pré-autorisée, sans nouvelle réunion


    Le comité autorise dès jeudi le retour en automatique, **de plein droit**, dès que les quatre conditions
    suivantes sont constatées et contresignées par le chef d''exploitation et le responsable qualité :


    1. **Autorité d''arrêt** — le comparateur S2/S3 est câblé sur l''actionneur et peut, seul, basculer
    la boucle en dose fixe. Seuils indicatifs à confirmer par les essais : alarme à |S2−S3| > 0,15 mg/L
    sur 10 min ; repli automatique à > 0,25 mg/L.

    2. **Preuve par injection** — 5 essais de dérive simulée sur S2, dont au moins 3 en rampe lente reproduisant
    le profil du 12 mai (et non des échelons). Détection **et** repli effectif en moins de 15 minutes
    dans les 5 cas. Un seul échec ferme la condition.

    3. **Contrôle du mode commun** — titrage DPD manuel hebdomadaire recoupant S2 et S3. Le comparateur
    est aveugle à une dérive simultanée des deux sondes ; ce recoupement est la seule parade, et il reste
    en place après le retour.

    4. **Absence de fausse alarme invalidante** — moins de 2 déclenchements injustifiés sur 14 jours d''observation
    avec autorité d''arrêt active. Au-delà, le seuil est mal réglé et la boucle serait débrayée en pratique.


    Aucune de ces conditions n''est un délai. Elles sont atteintes quand le travail est fait, pas quand
    le calendrier passe.


    ## 4. Calendrier et effet sur les 41 k€/mois


    | Étape | Échéance visée | Effectif | Coût mensuel |

    |---|---|---|---|

    | Spécification de la modification automate | 22 août | inchangé | 41 k€ |

    | Essais sur banc, actionneur inhibé | 5 septembre | inchangé | 41 k€ |

    | Essais par injection sur site (cond. 1–2) | semaine du 8 septembre | inchangé | 41 k€ |

    | **Retour en automatique sous supervision** | **15 septembre** | 1 poste renforcé | **≈ 20,5 k€**
    |

    | Fin de supervision renforcée (cond. 4 remplie) | 30 septembre | nominal | **0 €** |


    Le retour **ne dépend pas** des conclusions de l''audit externe du 30 septembre : le critère signé
    porte sur l''instrumentation, pas sur l''audit. Économie attendue : ~20,5 k€ dès mi-septembre, ~41
    k€/mois à partir d''octobre.


    ## 5. Pire cas de l''option retenue, et qui l''encaisse


    Une dérive de S2 non détectée après le retour, si les essais d''injection ont validé un seuil trop
    lâche. Le repli automatique borne alors l''exposition à ~15 minutes, contre 3 h 40 le 12 mai. Ce sont
    les 96 000 abonnés qui encaissent — c''est pourquoi la condition 2 exige des rampes lentes et non
    des échelons.


    ## 6. Repli et déclencheur


    Retour immédiat en pilotage manuel 24/7, sans nouvelle décision du comité, si l''un de ces faits est
    constaté : un dépassement de 0,8 mg/L ; un écart DPD/sonde > 0,15 mg/L ; un repli automatique non
    expliqué sous 24 h ; une indisponibilité de S3 > 4 h.


    ## 7. L''observation qui renverserait cette note


    Si les essais d''injection montrent que le comparateur ne détecte pas une rampe lente, ou ne la détecte
    qu''au-delà de 15 minutes, le retour au 15 septembre est annulé et le dossier revient devant le comité.
    Symétriquement, si le comparateur détecte une dérive réelle avant le 15 septembre, cela vaudra preuve
    de la condition 2.


    ## 8. Première action


    Notifier lundi 17 août au service automatisme la modification de programme donnant au comparateur
    l''autorité de repli, avec remise de la spécification le 22 août. C''est le seul travail sur le chemin
    critique.


    ---


    **En résumé pour le comité :** la seule chose qui sépare aujourd''hui la régie de 41 k€/mois économisés,
    ce n''est pas un délai d''observation — c''est une modification d''automate qui n''a pas encore été
    lancée. La règle ci-dessus la déclenche et rend le retour automatique dès qu''elle est prouvée, sans
    autre réunion.

    '
