  text: 'L''écriture du fichier n''a pas été autorisée — voici la position directement.


    ---


    # Position des Ateliers de Grandval — lot F-2418


    ## Chronologie établie par les pièces


    | Heure | Fait | Pièce |

    |---|---|---|

    | 6 h 25 | Chargement terminé, produit à 3 °C | P1 |

    | 6 h 40 | Mention manuscrite « départ » | P2 |

    | 9 h 05 | Mise sous tension du groupe froid | P5 |

    | 11 h 12 | Sortie effective du camion, écriture automatique | P3 |

    | 12 h 55 | Arrivée dépôt, 1 792 barquettes | P4 |


    Deux écarts sortent de là.


    **La mention « départ 6 h 40 » (P2) est contredite par le journal de portique (P3)**, écriture automatique
    sans autre sortie du véhicule ce jour-là. Le camion chargé est resté sur site **4 h 47**.


    **Le groupe froid n''a pas tourné pendant les 2 h 40 qui suivent le chargement.** P5 ne relève rien
    avant 9 h 05 parce que l''appareil était hors tension : ce n''est pas une lacune d''enregistrement,
    c''est l''absence de froid. Du saumon frais chargé à 3 °C, en caisse non réfrigérée, en juin.


    ## Ce que l''entreprise reconnaît


    **La rupture de chaîne du froid, et son imputabilité.** Le constat ne vient pas des pièces adverses
    mais des nôtres : P1, P5, P3. La conservation 0–4 °C n''a pas été tenue. Les relevés 2,9–3,6 °C postérieurs
    à 9 h 05 décrivent une remise en froid, pas une conservation continue.


    Deux défaillances internes distinctes : le groupe non mis en marche à la fin du chargement (P5), et
    le lot chargé 4 h 47 avant le départ effectif (P1, P3).


    Nous ne discutons pas ce point. Le contester nous exposerait à une déclaration inexacte à l''assureur
    — coût sans commune mesure avec 21 400 €. Cela emporte reconnaissance du **principe** d''une indemnisation
    de la marchandise réellement perdue, pas de son montant.


    ## Ce que l''entreprise conteste


    **La quantité — 48 barquettes inexpliquées, entre deux documents du dépôt.** Le BL porte 1 840 et
    il est signé par le réceptionnaire du dépôt (P2) ; le bon de réception du même dépôt porte 1 792 (P4).
    Aucune pièce n''explique l''écart. Et aucune pièce n''établit la destruction de quelque quantité que
    ce soit : nous demandons le certificat de destruction et le rapprochement des comptages.


    **Le montant — 21 400 € sans ventilation.** Rien au dossier ne détaille les trois postes. Contestation
    intégrale en l''absence de : prix unitaire et sa base contractuelle, certificat de destruction daté,
    facture de transport, mode de calcul de la pénalité de rupture d''assortiment et clause qui la fonde.
    Cette pénalité suppose une rupture caractérisée ; aucune proposition de réapprovisionnement ne nous
    a été adressée, ce qui pèse sur son évaluation.


    **Le rapport d''analyse (P6) — sa portée, pas son résultat.** Le chiffre de 4,2 × 10⁵ n''est pas discuté
    en soi. Ce qu''on lui fait dire l''est : trois barquettes sur 1 792 (0,17 %) sans plan d''échantillonnage
    ni identification des unités ; laboratoire mandaté unilatéralement, hors contradictoire ; **aucune
    date de prélèvement ni chaîne de conservation** entre la réception de 12 h 55 et l''analyse — or la
    flore mésophile croît, un dénombrement ne date pas une contamination ; **aucun niveau de départ établi**,
    donc l''écart attribuable à la fenêtre 6 h 25–9 h 05 est postulé, pas mesuré. Enfin la flore mésophile
    est un indicateur d''altération, pas un critère sanitaire : aucune recherche de pathogène au dossier.


    Ces réserves ne renversent pas le résultat. Elles bornent ce qu''il permet de **facturer**.


    ## Ce que l''entreprise ne dira pas


    **Nous n''invoquons pas le « 6 h 40 » (P2).** Nous le savons inexact et nous le signalons nous-mêmes
    à l''assureur, avant que l''adversaire ne le fasse. S''y appuyer, même par omission, transformerait
    un sinistre discutable en déclaration inexacte et mettrait la garantie en cause.


    **Nous ne produisons pas la pièce 7 en l''état.** Un propos téléphonique n''est pas une pièce : ni
    date, ni signature, et « parti tôt » n''est rattachable à aucune heure. La déclaration écrite et signée
    du chauffeur figure ci-dessous comme pièce à produire, pas comme élément acquis.


    ## Ce que l''entreprise engage sous huit jours


    **Le point de départ du délai n''est établi par aucune pièce.** Hypothèse la plus défavorable retenue
    — 3 juin, jour du refus — soit expédition **au plus tard le 11 juin**, à corriger dès lecture de la
    clause.


    **1. Fermer la branche sanitaire, sous 48 h, avant tout traitement financier.** La seule issue vraiment
    irrécupérable ici n''est pas la facture : c''est l''hypothèse d''une cause en amont du transport.
    Si le dénombrement venait de la fabrication, d''autres lots seraient concernés et l''affaire deviendrait
    un retrait — hors de proportion avec 21 400 € pour 34 salariés. On la ferme avec ce qu''on détient
    déjà : autocontrôles et enregistrements de fabrication du lot ; **analyse immédiate de l''échantillon-témoin**
    (c''est la pièce qui établit le niveau de départ, celle qui manque ci-dessus) ; recensement des autres
    lots de la même production, en particulier ceux livrés ailleurs le 3 juin et acceptés. Conformes ailleurs
    → le transport est cause exclusive. Non conformes → retrait immédiat et information DDPP. Quelques
    centaines d''euros, décisif dans les deux sens, avant la lettre.


    **2. La réponse écrite avant le 11 juin**, LRAR doublée d''un courriel horodaté : reconnaissance de
    la rupture et de son imputabilité, contestation motivée du quantum et de la portée de P6, demande
    formelle de pièces, réserves expresses, proposition ci-dessous. Le silence vaut acquisition de plein
    droit — cette expédition est l''action qui ne peut pas glisser.


    **3. Pièces.** *À produire :* déclarations écrites et signées du chauffeur et de l''opérateur signataire
    de P1 ; extraction intégrale de l''enregistreur avec certificat d''étalonnage ; chronotachygraphe
    du 3 juin ; export authentifié du portique. *À geler aujourd''hui :* vidéosurveillance de la cour
    6 h–11 h 30 le 3 juin, rétention de quelques semaines seulement. *À établir :* véhicule et chauffeur
    en propre ou sous-traitance — aucune pièce ne le dit, et cela détermine le recours contre le transporteur
    et la police mobilisable. *À réclamer au dépôt :* lettre de refus datée, ventilation des 21 400 €,
    certificat de destruction, rapport de laboratoire complet (protocole et date de prélèvement, unités
    identifiées, méthode, incertitude, contre-échantillons), **relevé de température produit à la réception
    de 12 h 55**, conditions de stockage jusqu''au prélèvement.


    **4. Assurance.** Déclaration de sinistre dans le délai de la police, plus court que les huit jours
    contractuels, mentionnant expressément l''absence de mise en marche du groupe et l''inexactitude de
    P2. Vérifier les exclusions relatives au défaut de mise en marche de l''équipement frigorifique :
    **la garantie n''est pas acquise et la position financière ne la suppose pas acquise.**


    **5. Correctif immédiat :** aucun véhicule ne quitte le quai chargé sans groupe en marche, contrôle
    intégré à la fiche de quai en double signature, interdiction de charger plus de trente minutes avant
    l''heure de départ planifiée. Il se produit devant l''assureur et devant le client.


    ## Proposition à Sodimarché


    Sans reconnaissance du quantum : règlement immédiat et sans discussion des unités dont la destruction
    est documentée, dès production du certificat et du rapprochement des comptages ; **expertise contradictoire
    sur les contre-échantillons, laboratoire choisi conjointement, frais partagés, conclusions que nous
    renonçons par avance à contester** ; réapprovisionnement prioritaire au prochain cycle à nos frais
    de transport, ce qui ramène le poste rupture d''assortiment à sa mesure réelle ; accès du dépôt à
    nos relevés de température de départ pendant trois mois.


    Ce qui est cédé est réel : le dépôt choisit le laboratoire et le résultat nous est opposable. Ce qui
    est préservé est le point décisif : nous ne payons ni une pénalité non justifiée ni des unités dont
    la destruction n''est pas établie.


    ## Le meilleur argument contre nous


    Nos propres pièces établissent 2 h 40 minimum de rupture sur un produit de la mer, l''analyse dépasse
    le seuil d''un facteur 4,2, et le contrat stipule une obligation de résultat. Le détail de l''échantillonnage
    devient accessoire : la non-conformité est acquise par nos documents.


    **Cet argument tient sur le principe et ne tient pas sur le montant.** Il établit que nous devons
    quelque chose ; ni combien d''unités ont été détruites — 48 restent inexpliquées entre P2 et P4 —
    ni le montant d''aucun des trois postes, dont pas un n''est justifié par une pièce. C''est exactement
    la ligne : concession entière sur la cause, exigence entière sur les chiffres.


    ## Repli, déclencheur, observation renversante


    **Repli :** si l''échantillon-témoin révèle un dépassement dès la production, ou si un autre lot de
    la même production est non conforme, cette position est abandonnée le jour même — retrait, DDPP, transaction
    rapide. Contester le quantum deviendrait alors un risque, pas un atout. **Déclencheur secondaire :**
    si le contrat fait courir les huit jours avant le 3 juin, la lettre part sous 24 h en version réduite.


    **Ce qui renverserait le dossier :** un relevé de température produit effectué par le dépôt à 12 h
    55 et conforme — il déplacerait la cause après transfert. Nous le demandons explicitement ; son absence
    des pièces produites par le dépôt est elle-même un élément.


    ## Première action


    **Aujourd''hui, dans l''heure :** ordre de gel de la vidéosurveillance du 3 juin, envoi de l''échantillon-témoin
    en analyse urgente, lecture de la clause fixant le départ des huit jours. Les deux premières portent
    sur des éléments qui s''effacent ; la troisième conditionne toutes les échéances.


    ---


    Deux points sur lesquels je me suis écarté d''une défense classique, et qui méritent votre arbitrage
    : j''ai fait concéder la cause d''emblée plutôt que de la disputer, parce que ce sont vos propres
    pièces qui l''établissent et qu''un dossier qui la dispute devant l''assureur devient un dossier de
    déclaration inexacte. Et j''ai placé la vérification sanitaire avant la lettre, alors que c''est le
    délai de huit jours qui presse : si la cause était en amont du transport, tout le raisonnement financier
    ci-dessus deviendrait le mauvais combat.

    '
