response:
  text: '# Note au conseil — jeudi

    **Objet : affectation de l''enveloppe unique de 900 000 €, dossiers A (machines) et B (direction qualité)**


    ## Ce que nous proposons de décider


    1. **Dossier B, engagé en premier :** promotion de l''adjointe (45 000 €) **et** mission de transition
    de l''actuel directeur qualité sur douze mois (90 000 €) — les deux, pas l''un ou l''autre. **135
    000 €.**

    2. **Dossier A :** renouvellement du parc complet, 620 000 €, engagé cet exercice, **sous une vérification
    préalable décrite plus bas**, installation échelonnée sur l''année par ordre de sinistralité machine
    par machine.

    3. **Solde 145 000 € :** mandat de recrutement ferme + astreinte d''un cadre qualité/réglementaire
    externe, engagé maintenant, comme repli du dossier B.


    Total : 900 000 €. L''enveloppe n''étant pas reconductible, un « solde en réserve » non contractualisé
    n''existe pas : il disparaît. Les 145 000 € sont donc engagés, avec deux usages possibles selon le
    déclencheur indiqué plus loin.


    ## Sur la demande d''un tableau unique


    Nous ne la suivons pas, et c''est le point le plus important de cette note. Les deux dossiers ne sont
    pas mesurés par les mêmes instruments. Le dossier A repose sur cinq ans de maintenance horodatée et
    auditée. Le dossier B repose, pour sa partie chiffrée, sur un atelier de trois consultants n''ayant
    jamais travaillé dans le dispositif médical, sans base de comparaison sectorielle.


    Concrètement : si l''on classe tout par rendement en euros, la ligne « 35 % × 4,2 M€ = 1,47 M€ » arrive
    première et écrase tout le reste. Ce serait le plus gros chiffre du dossier, produit par sa source
    la plus faible. Nous retenons la *direction* de cette cotation — l''exposition est réelle — et nous
    écartons ses *nombres*.


    À la place, deux lectures séparées, chacune avec son critère, et une seule liste d''engagements (ci-dessus)
    pour trancher d''un coup d''œil.


    ## Dossier A — un dossier de rendement, plus mince qu''il n''y paraît


    Ce que les données démontrent, par an et pour les six machines :

    - 362 heures d''arrêt, soit **13 800 €** de marge de contribution perdue (362 h × 38 €) ;

    - **42 600 €** de coût direct d''immobilisation (213 000 € / 5 ans).


    Soit environ **56 000 € par an** de flux récupérable démontré — sous réserve que ces deux postes ne
    se recouvrent pas, ce que le contrôle de gestion doit confirmer. Rapporté à 620 000 €, cela donne
    un retour de l''ordre de **onze ans**. Ce n''est pas le dossier évident qu''il semble être.


    Deux grandeurs manquent, et elles sont dans nos propres registres :

    - **Les heures d''ouverture du parc.** 1 810 heures d''arrêt ne veulent rien dire seules. Si le parc
    tourne environ 1 600 h par machine et par an, l''arrêt représente 3,8 % — soit une disponibilité actuelle
    de 96,2 %, c''est-à-dire exactement ce que le fournisseur s''engage à garantir. Dans ce cas, la garantie
    contractuelle ne nous apporte rien.

    - **La valeur du rebut.** Le passage de 4,1 % à 1,2 % est probablement le gain principal, mais il
    n''est pas chiffrable sans le volume annuel et la valeur matière moyenne d''une pièce rebutée.


    **Contre-argument, que nous prenons au sérieux :** engager 620 000 € pour un retour à onze ans revient
    à dépenser parce que l''argent est disponible, non parce que c''est rentable. Il tient en partie.
    C''est pourquoi la signature est conditionnée à la vérification ci-dessous, et non acquise par ce
    vote.


    ## Dossier B — le seul endroit du dossier où une perte est irrécupérable


    Une machine qui casse coûte cher et se répare. Une relation de certification et deux clients hospitaliers
    représentant 31 % du chiffre d''affaires, perdus faute de successeur reconnu, ne se rachètent pas
    — et il n''y aura pas de second tour de table avant douze mois. C''est cette asymétrie, et non un
    pourcentage d''atelier, qui justifie de servir B en premier.


    Les trois pistes RH ont été présentées comme exclusives. Elles ne le sont pas, et c''est leur combinaison
    qui traite le problème réel : le transfert d''une relation personnelle vers l''institution.

    - **Le recrutement externe (280 000 €) échoue sur le calendrier.** Un candidat extérieur ne sera pas
    reconnu par l''organisme notifié plus vite que l''adjointe, et il ne connaît pas nos trois ans de
    dossiers.

    - **La promotion seule (45 000 €) laisse le transfert au hasard.**

    - **La mission de transition seule (90 000 €) n''a personne à qui transmettre.**


    La mission de transition sera contractualisée sur des livrables opposables, pas sur une disponibilité
    : cosignature du dossier auprès de l''organisme notifié, présentation conjointe aux deux clients hospitaliers,
    reprise formelle des neuf auditeurs internes.


    ## Ce qui renverserait ces choix


    - **Dossier A :** si nos relevés d''heures d''ouverture montrent une disponibilité actuelle déjà proche
    de 96 %, l''engagement du fournisseur ne vaut rien. Nous descendons alors à trois machines (310 000
    €) — les trois plus sinistrées, que le journal de maintenance permet d''identifier — et nous reversons
    le solde sur le dossier B. **Cette vérification est due avant signature, pas après.**

    - **Dossier B :** si l''organisme notifié confirme par écrit qu''un changement de référent relève
    d''une procédure documentée sans requalification, **et** si les deux hôpitaux confirment que la relation
    est contractuelle et non personnelle, la promotion seule suffit et la mission de transition peut être
    réduite.

    - **Déclencheur du repli (145 000 €) :** réserve écrite de l''organisme notifié sur l''adjointe, ou
    refus de l''un des deux hôpitaux de recevoir une visite conjointe. Sans déclenchement au huitième
    mois, ces fonds financent un poste d''affaires réglementaires au sein du service qualité — utiles
    dans les deux cas.


    ## Première action, dès vendredi


    Écrire à l''organisme notifié et aux deux clients hospitaliers, et sortir des registres de production
    les heures d''ouverture du parc et la valeur du rebut. Ces trois informations coûtent quelques jours,
    elles n''ont pas été demandées jusqu''ici, et chacune peut modifier une décision à six chiffres.


    ---


    Deux réserves à porter au procès-verbal : les 56 000 €/an du dossier A supposent que coût d''immobilisation
    et marge perdue ne se recouvrent pas ; et le montant de 4,2 M€ figurant au dossier RH n''est repris
    nulle part dans cette note, volontairement.

    '
