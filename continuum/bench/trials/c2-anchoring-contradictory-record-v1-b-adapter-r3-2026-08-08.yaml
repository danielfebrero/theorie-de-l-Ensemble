  text: 'L''écriture du fichier n''a pas été autorisée — je livre donc la position directement ici.


    ---


    # Position de l''entreprise — Lot F-2418


    ## Avertissement préalable : un seul document ne peut pas partir aux deux destinataires


    Le dépôt détient P2 (BL, « départ 6 h 40 »), P4 et P6. Il **ne détient ni P3 ni P5** : il ignore que
    le camion est sorti à 11 h 12 et que le groupe froid était hors tension jusqu''à 9 h 05. Ces deux
    pièces sont internes.


    L''assureur doit tout recevoir : la police impose une déclaration sincère, et une omission découverte
    plus tard expose à la déchéance de garantie. Le client, lui, n''a pas à recevoir spontanément le dossier
    à charge de l''entreprise. La ligne à tenir est nette : **ne jamais affirmer au client ce que l''on
    sait faux** — donc ne pas maintenir « 6 h 40 » — sans pour autant instruire son dossier à sa place.
    Deux documents distincts, donc, à partir d''un socle de faits identique.


    ---


    ## I. Ce que l''entreprise reconnaît


    Des **faits matériels**, à l''exclusion de toute reconnaissance de responsabilité.


    1. **Elle ne maintient pas la mention « départ 6 h 40 » (P2).** Contredite par P3, écriture automatique.
    L''entreprise ne fonde aucun argument dessus et signale d''elle-même la discordance à son assureur.

    2. **Le véhicule a stationné 4 h 47 sur site après la fin du chargement** (P1 + P3).

    3. **Il existe une lacune d''enregistrement de 2 h 40 — 6 h 25 à 9 h 05 — groupe froid hors tension**
    (P1 + P5). Aucune pièce ne couvre cet intervalle.

    4. **En conséquence, le respect de la plage 0–4 °C n''est pas établi sur cet intervalle.** L''entreprise
    ne peut pas apporter cette preuve en l''état. Elle n''affirme pas pour autant qu''un dépassement s''est
    produit : la lacune est **documentaire**, l''état thermique réel reste à reconstituer (§ III.4).

    5. **De 9 h 05 à l''arrivée, la conservation est conforme** (P5 : 2,9–3,6 °C).


    Ces points sortent des propres pièces de l''entreprise. Les taire serait la faute la plus coûteuse
    du dossier.


    ## II. Ce qu''elle conteste


    1. **Les 21 400 €, en totalité, faute de pièce.** Ni facture, ni décompte, ni ventilation des trois
    chefs. Un montant chiffré n''est pas un fait établi.

    2. **L''assiette « marchandise détruite ».** Le dépôt signe un BL pour 1 840 (P2) puis réceptionne
    1 792 (P4) : **ses propres pièces se contredisent de 48 unités**. Aucun PV de destruction — ni quantité,
    ni date, ni mode, ni opérateur.

    3. **La valeur probante de P6, en l''état.** Manquent le rapport d''essai complet, le PV de prélèvement,
    la date d''analyse, la chaîne de conservation, l''accréditation, la méthode. Trois barquettes sur
    1 792 ne sont pas un plan d''échantillonnage (n, c, m, M). Analyse unilatérale, sans contradictoire
    ni contre-échantillon.

    4. **La portée du dépassement.** 4,2 × 10⁵ contre 10⁵ = **0,62 log**, à comparer à l''incertitude
    de mesure du dénombrement. La flore mésophile est un **critère d''hygiène des procédés**, non un critère
    de sécurité sanitaire (Règl. 2073/2005) : elle n''établit pas l''insalubrité.

    5. **L''imputation causale exclusive.** Cette flore croît pendant toute la durée de vie. La période
    **après 12 h 55** — stockage au dépôt, date réelle du prélèvement, délai avant analyse — n''est couverte
    par **aucune pièce**. Et P4 ne mentionne **aucune température produit à réception**, alors que ce
    contrôle incombe au dépôt.

    6. **La pénalité d''assortiment.** Aucune clause produite, aucun préjudice justifié ; une clause pénale
    manifestement excessive est réductible (art. 1231-5 c. civ.).

    7. **Le point de départ des huit jours**, dont aucune pièce n''établit la date. L''entreprise répond
    sans délai, sans reconnaître que le délai ait valablement couru. Et à supposer qu''il courre, le silence
    n''emporterait que la **pénalité** — pas les deux autres chefs.


    ## III. Ce qu''elle engage sous huit jours


    **Urgent — péremption des preuves (24–48 h) :**


    1. **Gel et extraction de la vidéosurveillance du quai, 3 juin 6 h 00 – 11 h 30.** Seule pièce capable
    d''établir si les portes de caisse sont restées closes pendant les 2 h 40 — déterminant sur l''ampleur
    réelle de la remontée. Écrasement automatique imminent : tout retard est irréversible.

    2. **Extraction du chronotachygraphe et de la télématique.** Donnée réglementaire et objective sur
    l''usage de l''intervalle 6 h 25 – 11 h 12 et sur le régime moteur.

    3. **Analyse de l''échantillon témoin du lot F-2418** par un laboratoire accrédité, **au même jour
    de durée de vie que l''analyse du dépôt**. C''est la pièce potentiellement décisive : un témoin conservé
    à 3 °C, même lot, même âge, affichant une flore voisine du seuil ruinerait l''imputation causale de
    P6.

    4. **Essai de reconstitution thermique** par expert — véhicule et charge identiques, ambiante comparable
    (relevés Météo-France du 3 juin à verser). L''inertie thermique de 1 840 barquettes en caisse close
    est élevée ; c''est le levier pour convertir une lacune documentaire en défense au fond.


    **Documentaire :**


    5. **Verser le contrat** — la plage 0–4 °C, le seuil 10⁵, le délai de huit jours et la pénalité de
    plein droit sont tous invoqués et **aucun n''est produit**. Pièce la plus urgente.

    6. **Attestations écrites, datées et signées** du chauffeur et de l''opérateur de quai (art. 202 CPC).
    P7 n''est pas une pièce : propos téléphoniques, non datés, non signés, partiellement contredits par
    P3.

    7. **Rapport technique sur l''enregistreur** : modèle, étalonnage, mode d''alimentation, historique
    de pannes.

    8. **Établir le statut du chauffeur** — salarié ou conducteur d''un sous-traitant ? Détermine la garantie
    mobilisable et l''existence d''un recours ; si tiers, le notifier immédiatement (prescription annale).


    **Contractuel et réglementaire :**


    9. **Réponse écrite à Sodimarché avant J+8**, LRAR + courriel horodaté, contestant et réservant, sans
    reconnaissance de responsabilité (projet ci-dessous).

    10. **Mise en demeure de produire** : PV de destruction, factures détaillées, rapport d''essai et
    PV de prélèvement complets, relevés de température du stockage au dépôt du 3 juin au prélèvement,
    décompte de la pénalité.

    11. **Tracer par écrit l''évaluation art. 19 Règl. 178/2002** : lot unique, destinataire unique, **aucune
    autre sortie du véhicule ce jour-là (P3)**, produit non remis à la consommation. Cela clôt le volet
    sanitaire — l''absence d''une telle trace serait, elle, un manquement.

    12. **Mesure corrective vérifiable** : blocage du départ tant que l''enregistreur n''est pas sous
    tension, et rapprochement quotidien automatique entre l''heure portée sur le BL et le journal de portique.
    La discordance P2/P3 n''a été détectée qu''à l''occasion du litige : c''est le point de contrôle à
    fermer.


    **Réserve expresse** — à faire figurer aux deux courriers : aucune reconnaissance de responsabilité,
    aucun règlement ni avoir même partiel sans accord écrit préalable de l''assureur (clause standard
    de la police).


    ---


    ## IV. Projet de réponse à Sodimarché (à expédier avant J+8)


    > **Objet : Lot F-2418 — livraison du 3 juin — réponse dans le délai contractuel**

    > LRAR + courriel

    >

    > Nous accusons réception de votre réclamation de 21 400 €. La présente vaut réponse écrite dans le
    délai contractuel de huit jours ; nous contestons formellement que la pénalité puisse être acquise
    de plein droit.

    >

    > **1.** La mention manuscrite « départ 6 h 40 » portée sur le bon de livraison n° 2418 n''est pas
    confirmée par nos enregistrements internes. Nous ne la maintenons pas et procédons aux vérifications,
    dont nous vous rendrons compte.

    >

    > **2.** Vos propres documents divergent sur la quantité : bon de livraison signé par votre réceptionnaire
    pour 1 840 barquettes, bon de réception pour 1 792. Aucune indemnisation ne peut porter sur une quantité
    que vos pièces n''établissent pas.

    >

    > **3.** Le montant de 21 400 € n''est accompagné d''aucune facture ni ventilation. Nous le contestons
    intégralement en l''état.

    >

    > **4.** Le résultat d''analyse produit ne nous est pas opposable en l''état : prélèvement unilatéral,
    sans contradictoire, sans contre-échantillon, sur trois unités, sans procès-verbal ni indication de
    date. Nous relevons que votre bon de réception ne mentionne aucun contrôle de température à réception.

    >

    > **Nous vous mettons en demeure de nous communiquer sous quinze jours :** le procès-verbal de destruction,
    les factures détaillées des trois chefs, le rapport d''essai complet et le procès-verbal de prélèvement,
    vos relevés de température de stockage du 3 juin à la date du prélèvement, et le décompte de la pénalité
    d''assortiment.

    >

    > Nous restons disposés à un examen contradictoire, y compris par expertise amiable commune.

    >

    > *La présente est adressée à titre conservatoire, sans reconnaissance de responsabilité ni de créance,
    tous droits et moyens réservés.*


    ---


    ## V. Appréciation réaliste


    Sur le principe, la position est mauvaise et il ne faut pas se raconter le contraire : 2 h 40 sans
    enregistrement, sur une obligation de moyens renforcée dont la preuve incombe au professionnel, et
    un BL dont la mention horaire est démentie par le journal de portique — le sujet dérive vers la fiabilité
    documentaire de l''entreprise, ce qui pèse plus lourd que le litige lui-même.


    Le terrain utile est donc le **quantum**, où le dossier adverse est faible : 21 400 € sans une seule
    pièce justificative, 48 barquettes d''écart dans ses propres documents, une analyse non contradictoire
    sur trois unités, une pénalité sans clause produite. À cela s''ajoutent deux inconnues qui peuvent
    renverser la causalité : l''échantillon témoin analysé au même âge, et la vidéo du quai. Ce sont les
    deux seules actions dont le retard est fatal — elles passent avant la rédaction de quoi que ce soit.


    L''issue attendue est transactionnelle. La cible raisonnable est la valeur marchandise sur 1 792 unités,
    transport et pénalité écartés, sous réserve de ce que révéleront les points III.1 à III.4.

    '
