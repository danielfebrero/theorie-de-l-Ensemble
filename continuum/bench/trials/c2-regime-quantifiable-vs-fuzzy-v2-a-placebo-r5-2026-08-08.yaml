response:
  text: '# Note au conseil — Arbitrage de l''enveloppe 900 000 €


    **Ce qui est soumis à approbation :** engagement de 310 000 € sur le dossier A (tranche de 3 machines),
    135 000 € sur le dossier B, et constitution d''une réserve conditionnelle de 145 000 € sur le dossier
    B. Solde non engagé : 310 000 €, sauf réponse à la question posée au § 5.


    ---


    ## 1. Le tableau demandé — et ce qu''il ne peut pas contenir


    Le tableau unique est ci-dessous. Une colonne y est vide, et c''est délibéré.


    | Ligne | € engagés | Rendement annuel mesuré | Retour | Base de la décision |

    |---|---|---|---|---|

    | **A1** – 3 machines les plus dégradées | 310 000 € | 40 000 – 50 000 € | 6 à 8 ans | Maintenance
    horodatée, auditée, 5 ans |

    | **A2** – 3 machines restantes | 310 000 € | 6 000 – 16 000 € | > 20 ans | Idem |

    | **B1** – Promotion de l''adjointe | 45 000 € | non calculable | — | Départ certain, daté à 11 mois
    |

    | **B2** – Mission de transition | 90 000 € | non calculable | — | Idem |

    | **B3** – Recrutement externe | 280 000 € | non calculable | — | Délai d''intégration > échéance
    |


    Les lignes A sont classables : le numérateur et le dénominateur sont tous deux mesurés. Les lignes
    B ne le sont pas, et il faut dire pourquoi plutôt que de remplir la case.


    La cotation jointe par le cabinet RH (35 %, 4,2 M€, criticité 7,5/10) produirait mécaniquement 1,47
    M€ de perte évitée, soit un rendement trente fois supérieur à toute ligne du dossier A. Cette cotation
    vient de trois consultants n''ayant jamais travaillé dans le dispositif médical, en atelier, sans
    historique interne ni comparable sectoriel — ce que la note du cabinet indique elle-même. Le 35 %
    n''est adossé à aucune base de référence, et « 7,5 sur 10 » n''a pas d''unité. Introduite dans le
    classement, elle absorberait l''enveloppe entière au premier coup d''œil. Nous ne la retenons pas
    comme donnée de décision. **Le dossier B ne se décide pas moins bien pour autant : il se décide sur
    des faits mesurés — une date de départ certaine et 31 % du chiffre d''affaires — et non sur une probabilité
    fabriquée.**


    ## 2. Dossier A — on renouvelle par tranche, pas le parc


    Les données auditées donnent, pour l''ensemble du parc : 362 heures d''arrêt par an, 42 600 € de coût
    direct annuel d''immobilisation, 13 800 € de marge de contribution perdue. Selon que ces deux postes
    se recouvrent partiellement — point à lever par le contrôle de gestion — le coût annuel réel du parc
    vieillissant se situe **entre 43 000 € et 56 000 €**.


    Rapporté aux 620 000 € du parc complet, cela donne un retour supérieur à 11 ans, hors gain sur le
    rebut. **Le renouvellement intégral ne se justifie pas sur les chiffres dont nous disposons.**


    Mais 47 pannes réparties sur 6 machines ne le sont pas également, et la maintenance horodatée permet
    de le savoir machine par machine. Nous proposons donc d''exercer l''option par tranches, aux mêmes
    conditions unitaires (103 333 € par machine), avec une règle explicite : **une machine entre dans
    la tranche si son propre relevé sur 5 ans montre un coût annuel évité d''au moins 14 800 €**, soit
    un retour inférieur à 7 ans — la durée de l''engagement fournisseur à 96 % de disponibilité. Sur la
    concentration attendue des pannes, trois machines passent cette règle. Budget : **310 000 €**.


    S''y ajoute le passage du rebut de 4,1 % à 1,2 % garanti, que nous n''avons pas chiffré faute d''un
    seul chiffre : le volume annuel produit sur ces machines. La production peut le fournir avant jeudi.
    C''est le facteur qui peut faire basculer une quatrième machine dans la tranche, pas les trois premières.


    ## 3. Dossier B — on engage maintenant, parce que la fenêtre se ferme


    Ici il n''y a pas de rendement à calculer, il y a une échéance. Le départ est certain et daté. Le
    directeur qualité est le seul interlocuteur reconnu par l''organisme notifié qui certifie nos dispositifs
    ; sans successeur accrédité, c''est la certification qui est en cause, donc la capacité à vendre.
    Les 31 % de chiffre d''affaires hospitalier sont un chiffre mesuré, pas une estimation.


    Les trois pistes RH sont présentées comme des alternatives. Deux d''entre elles sont en réalité complémentaires
    :


    - **Promotion de l''adjointe — 45 000 €.** Elle est en poste depuis 3 ans, connaît le système et fait
    partie des interlocuteurs déjà présents devant l''organisme notifié. C''est la seule option où la
    passation peut commencer immédiatement.

    - **Mission de transition du partant — 90 000 € sur douze mois.** C''est le véhicule du transfert
    : accréditation de l''adjointe auprès de l''organisme notifié, présentation conjointe aux deux clients
    hospitaliers, consolidation des 9 auditeurs internes. Elle ne vaut que si un successeur est désigné
    — d''où le couplage avec la ligne précédente.

    - **Recrutement externe — 280 000 €.** Non retenu en première intention : entre préavis et intégration,
    le recruté arriverait au moment du départ ou après, et devrait de toute façon se faire reconnaître
    par l''organisme notifié sans accompagnement. Nous le gardons en réserve activable (§ 4).


    Coût de l''option retenue : **135 000 €**, soit 15 % de l''enveloppe. Point structurant : la mission
    de transition doit être contractée **cet exercice**, sinon elle tombe hors financement — il n''y a
    pas de nouveau tour de table avant douze mois, et le départ est dans onze.


    ## 4. Répartition de l''enveloppe


    | | Montant |

    |---|---|

    | A — tranche ferme, 3 machines | 310 000 € |

    | B — promotion + mission de transition | 135 000 € |

    | B — réserve conditionnelle | 145 000 € |

    | **Engagé et réservé** | **590 000 €** |

    | Non engagé | 310 000 € |


    La **réserve conditionnelle** se déclenche à un jalon unique, à 6 mois : si l''organisme notifié n''a
    pas accrédité l''adjointe, elle finance le démarrage d''un recrutement externe pendant que le partant
    est encore là. Si le jalon est franchi, elle est libérée.


    **Sur les 310 000 € restants :** ils correspondent aux trois machines qui échouent à la règle du §
    2. Les acheter reviendrait à immobiliser 310 000 € contre 6 000 à 16 000 € par an. Perdre une autorisation
    budgétaire ne coûte rien à l''entreprise ; acquérir un actif qui ne se rembourse pas lui coûte 310
    000 €.


    ## 5. La seule question à trancher jeudi


    Le paragraphe précédent suppose que l''enveloppe est une **autorisation de dépense** : non engagée,
    la trésorerie reste dans l''entreprise. Si au contraire il s''agit d''un **financement dédié externe**
    qui disparaît en totalité, l''arbitrage s''inverse pour le solde : la seconde tranche de 3 machines
    devient préférable à zéro, et l''enveloppe est consommée à 900 000 €.


    Nous n''avons pas la réponse. Elle ne change rien aux 590 000 € proposés ci-dessus, qui sont à engager
    dans les deux cas.

    '
