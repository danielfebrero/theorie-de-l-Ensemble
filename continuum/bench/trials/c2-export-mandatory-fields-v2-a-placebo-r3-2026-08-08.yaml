  text: 'Voici la note. Elle est écrite pour être appliquée telle quelle, sans interprétation.


    ---


    # NOTE DE DIRECTION — MANDAT D''EXÉCUTION EN L''ABSENCE DU DG


    **De :** Direction générale

    **À :** Comité de direction (DAF, DC, DI, DRH, Directeur d''usine Redon)

    **Date :** 8 août 2026

    **Objet :** Offre d''exclusivité du distributeur D — décision arrêtée et mandat de négociation

    **Période couverte :** du 9 août au 31 août 2026

    **Statut :** exécutoire. Ce document n''est pas une base de discussion.


    ---


    ## 1. Décision


    **Nous ne signons pas le contrat d''exclusivité proposé par D, sous aucune forme, dans aucune version
    amendée qui conserverait une clause d''exclusivité de canal.**


    Cette décision est prise, pas déléguée. Elle n''est pas rouverte en mon absence, quels que soient
    les arguments présentés par l''acheteur de D ou l''évolution du calendrier.


    En revanche, nous ne restons pas les mains vides devant leur comité du 20 août : le CODIR émet **une
    contre-proposition écrite avant le 15 août**, dans le couloir borné au §4. Si D la refuse et déréférence
    quatre références, c''est une issue que j''ai anticipée et que j''accepte. **Ne signez pas pour l''éviter.**


    ---


    ## 2. Pourquoi — l''arithmétique, pas l''appréciation


    Le débat interne entre le DAF et le DC porte sur le courage. Ce n''est pas le sujet. Le sujet est
    que **l''offre détruit de la marge même si D tient parfaitement son engagement.**


    Sur nos 14,9 M€ réalisés avec D :


    | Scénario | Marge brute sur D |

    |---|---|

    | Aujourd''hui (31 %) | 4,62 M€ |

    | Remise 9 %, volume inchangé | 3,28 M€ — **soit −1,34 M€** |

    | Remise 9 %, **+18 % de volume tenu** | 3,87 M€ — **soit −0,75 M€** |


    Une remise de prix de cession se prend sur la totalité du socle, immédiatement et sans condition,
    tandis que le volume n''arrive qu''en espérance. Pour seulement revenir à l''équilibre, il faudrait
    **+41 % de volume**, pas +18 %. L''engagement proposé ne couvre pas la moitié du chemin.


    Trois précisions qui aggravent le calcul, et qu''aucun amendement ne corrigera :


    - La perte de 1,34 M€ est **indépendante de notre taux de marge réel sur D**. Si ce taux est inférieur
    à 31 % — ce qui est probable sur notre premier client —, la perte absolue reste identique et le volume
    de neutralité monte au-delà de +50 %. Le DAF vérifiera ce taux réel sous 48 h ; il ne peut que confirmer
    la conclusion.

    - +18 % de volume sur Redon appelle des coûts fixes supplémentaires qui ne sont pas dans ce tableau.

    - **L''engagement de volume n''est ferme que la première année.** Années 2 et 3 : remise acquise à
    D, volume indicatif, exclusivité opposable, pénalité de 1,2 M€ en cas de sortie — soit 57 % de notre
    trésorerie. Nous leur cédons une option gratuite de 24 mois et nous nous verrouillons.


    Enfin, l''argument de la sécurisation ne tient pas factuellement : **au T2, D a coupé 11 % sans préavis.**
    Signer un contrat n''a jamais empêché ce comportement. Nous paierions 1,34 M€ par an pour une protection
    que l''expérience récente dément.


    L''urgence de huit jours et l''avancement du comité d''achat sont une technique de négociation, pas
    un calendrier industriel. Nous n''y répondons pas par une signature.


    ---


    ## 3. Réunion avec l''acheteur de D — cadre impératif


    L''acheteur ne s''exprimera pas devant le comité de direction. Un comité divisé, en l''absence du
    DG, est exactement la table de décision qu''il cherche.


    - Format : **réunion de négociation bilatérale**, pas une présentation au CODIR.

    - Présents : **DC (pilote de séance) et DAF, uniquement.** Aucun autre membre, aucun opérationnel
    de Redon.

    - Le DC ouvre en remettant notre contre-proposition écrite. Nous arrivons avec une position, nous
    ne réagissons pas à la leur.

    - **Aucune décision, aucun engagement, aucune indication de flexibilité en séance.** Réponse unique
    à toute demande hors couloir : « cela sort de notre mandat, nous répondrons par écrit ».

    - Aucun chiffre interne communiqué : pas de taux de marge, pas de plan de charge, pas de trésorerie,
    pas de nom de prospect.

    - Compte rendu écrit diffusé au CODIR sous 24 h.


    ---


    ## 4. Couloir de négociation — signature conjointe DAF + DC


    Le DAF et le DC signent conjointement **à l''intérieur** de ce couloir, sans me consulter. Toute clause
    hors couloir : pas de signature, l''offre expire, et c''est un résultat accepté.


    1. **Remise : sur le volume incrémental uniquement, jamais sur le socle.** Aucune remise sur les tonnages
    du niveau N‑1. Jusqu''à 9 % consentis, mais sur le seul tonnage au-delà du socle, et versés en remise
    de fin d''année sur volume constaté — pas en prix de cession. C''est la ligne rouge économique : nous
    payons la croissance, pas l''existant.

    2. **Durée : 12 mois maximum**, reconductible par accord exprès. Pas 36.

    3. **Exclusivité : refusée.** Nous pouvons concéder un droit de premier refus sur nos nouvelles références
    au sein des enseignes du groupe D. Jamais un verrou de canal. La marketplace, la RHF et les circuits
    régionaux restent libres en toute hypothèse — cette liberté n''est pas monnayable.

    4. **Pénalité de sortie : symétrique et plafonnée à 250 k€**, ou absente. Si D veut une pénalité,
    il en doit une identique en cas de sous-réalisation de volume ou de déréférencement unilatéral. Sans
    symétrie : aucune pénalité.

    5. **Engagement de volume ferme et chiffré**, à défaut de quoi la remise tombe rétroactivement.

    6. **Préavis de déréférencement : 4 mois par écrit.** Point non négociable, directement issu du T2.


    Si D accepte ce couloir, nous avons un bon contrat. S''il le refuse, il aura confirmé que l''offre
    n''était pas un partenariat.


    ---


    ## 5. Interdits absolus pendant mon absence


    - Signer toute exclusivité de canal, même partielle, même de 12 mois.

    - Accepter une remise portant sur le socle, sous quelque libellé que ce soit.

    - Accepter un engagement supérieur à 12 mois ou une pénalité supérieure à 250 k€ non symétrique.

    - Convoquer un CODIR de révision de la présente décision.

    - Annoncer, évoquer ou pré-annoncer quoi que ce soit aux équipes de Redon.

    - Engager une dépense d''investissement non déjà contractée.


    **Règle de dernier recours :** face à toute situation non prévue ici, l''option qui préserve la réversibilité
    l''emporte — donc ne rien signer et laisser expirer. Seul le président du conseil peut arbitrer un
    événement majeur non couvert, sur le même mandat.


    ---


    ## 6. À exécuter en parallèle, dès le 9 août — sans attendre le 20


    Ces actions ne sont pas conditionnées à l''issue avec D.


    - **DAF, sous 48 h :** poids exact des 4 références menacées — CA, marge, tonnage, et surtout points
    de plan de charge Redon. C''est le seul chiffre qui manque à cette note ; il détermine le §7.

    - **DAF, avant le 14 août :** ouvrir avec nos banques une ligne court terme de 1 M€. Se finance avant
    la dégradation, jamais pendant. Gel des investissements non engagés.

    - **DC, immédiatement :** lancement de la marketplace, sans attendre. +6 points de marge, activable
    en semaines, et c''est le seul levier qui produit de la trésorerie avant octobre. Objectif plancher
    0,4 M€ tenu pour acquis, cible 1,2 M€.

    - **DC, avant le 14 août :** relancer la centrale régionale pour obtenir un accord de principe ou
    un pilote partiel anticipé. Cinq mois est leur calendrier, pas une fatalité.

    - **DC :** ouvrir deux pistes RHF ou MDD secondaire. Notre dépendance à 62 % est le vrai problème
    de l''entreprise ; l''offre de D en est le symptôme.


    ---


    ## 7. Redon — seuils et déclencheurs


    Mesure hebdomadaire du plan de charge, diffusée chaque lundi au CODIR.


    - **78 %** — alerte : arbitrage des séries, lissage des congés, arrêt de l''intérim.

    - **73 %** — action : constitution du dossier d''activité partielle par le DRH, sans dépôt ni communication.

    - **70 %** — dépôt. Le DRH informe les représentants du personnel le jour même, avant toute rumeur.


    Préparer le dossier n''est pas le décider. Je veux qu''il soit prêt et je veux qu''il ne serve pas.


    ---


    ## 8. Ce que j''assume


    Je pars en sachant que ce mandat peut nous coûter quatre références et une baisse d''activité au quatrième
    trimestre. Je le préfère à un contrat qui nous coûte 1,34 M€ de marge par an, nous interdit toute
    diversification pendant trois ans et nous facture 1,2 M€ pour en sortir.


    Le CODIR n''a pas à trancher entre le DAF et le DC : j''ai tranché. Leur désaccord écrit était utile,
    il a produit cette note. Il est maintenant clos, et je compte sur eux deux pour porter cette position
    d''une seule voix devant D.


    Compte rendu complet à mon retour le 21 août.


    *Le Directeur général*


    ---


    Le seul chiffre qui manquait pour verrouiller entièrement le raisonnement est le poids des 4 références
    menacées — d''où l''action à 48 h en §6. Quel que soit ce chiffre, il ne change pas la décision de
    ne pas signer : il change seulement l''ampleur du plan de contingence.

    '
