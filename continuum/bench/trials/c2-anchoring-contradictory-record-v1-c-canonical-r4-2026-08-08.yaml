response:
  text: '## Le point qui commande tout le dossier


    La pièce 3 (journal du portique, écriture automatique) place la sortie du camion à **11 h 12**. La
    pièce 1 place la fin de chargement à **6 h 25**. La pièce 5 place la mise sous tension du groupe froid
    à **9 h 05**.


    Il existe donc, établi par vos propres pièces, un intervalle de **2 h 40 (6 h 25 → 9 h 05) pendant
    lequel aucune pièce ne documente la température du produit**, suivi de 2 h 07 à l''arrêt sous froid,
    puis 1 h 43 de route. Six heures trente entre chargement et réception, dont la première tranche est
    aveugle.


    La mention manuscrite « départ 6 h 40 » de la pièce 2 est contredite par la pièce 3. Aucune pièce
    n''établit qui a porté cette mention. **Elle ne peut être invoquée dans aucun des deux courriers.**
    Une position qui s''appuierait dessus s''effondre à la première demande de justificatif, et devant
    l''assureur elle vaut fausse déclaration.


    ---


    ## 1. Ce que l''entreprise reconnaît


    | Fait reconnu | Pièce |

    |---|---|

    | Livraison du lot F-2418 au dépôt Sodimarché le 3 juin | P2, P4 |

    | Produit à 3 °C en fin de chargement, à 6 h 25 | P1 |

    | Sortie du site à 11 h 12, sortie unique du véhicule ce jour | P3 |

    | Groupe froid non alimenté avant 9 h 05 | P5 |

    | Absence de tout relevé de température entre 6 h 25 et 9 h 05 | P1 + P5, par soustraction |

    | Réception à 12 h 55 | P4 |


    Traduction à assumer par écrit, sans l''atténuer : **l''entreprise n''est pas en mesure de justifier
    le maintien de la température contractuelle sur la première tranche du transport.** L''obligation
    0–4 °C est une obligation de résultat sur une chaîne documentée ; un intervalle non documenté équivaut,
    en instruction sur pièces, à un intervalle non respecté.


    Ne reconnaissez rien d''autre. En particulier, ne reconnaissez ni le lien de causalité avec le résultat
    de la pièce 6, ni le montant, ni le principe de la destruction.


    ---


    ## 2. Ce que l''entreprise conteste


    **a) Le quantum, en totalité, faute de pièce.** Les 21 400 € ne sont rattachés à aucun document du
    dossier : pas de facture, pas de décompte, pas de valorisation unitaire, pas de justificatif de transport,
    pas de mode de calcul de la pénalité. Le dépôt réclame trois postes distincts et n''en établit aucun.
    Tant que le décompte n''est pas produit, la créance n''est pas liquide.


    **b) La destruction elle-même.** Aucune pièce n''établit qu''elle a eu lieu, quand, par qui, sur quelle
    quantité. Aucun procès-verbal de destruction. Surtout : la marchandise a été détruite **avant toute
    contre-analyse**, ce qui prive définitivement l''entreprise de la faculté de contredire la pièce 6.
    Cette destruction unilatérale est opposable au dépôt, non à vous.


    **c) La portée de la pièce 6.** L''analyse est mandatée unilatéralement, non contradictoire, portant
    sur **3 barquettes sur 1 792**. La pièce ne mentionne ni la date et l''heure du prélèvement, ni l''identité
    du préleveur, ni la chaîne de conservation des échantillons entre le prélèvement et le laboratoire,
    ni le rattachement tracé des unités au lot F-2418, ni le plan d''échantillonnage, ni l''accréditation
    du laboratoire. Elle relève un indicateur d''hygiène (flore mésophile) dépassant un seuil **contractuel**
    — elle ne caractérise aucun germe pathogène et ne fonde donc pas, à elle seule, la nécessité d''une
    destruction plutôt qu''une reprise ou une décote.


    **d) Le créneau 12 h 55 → prélèvement.** Aucune pièce ne documente les conditions de conservation
    **chez le dépôt** entre la réception et le prélèvement. La flore mésophile croît. La part de croissance
    imputable à l''aval n''est ni exclue ni mesurée.


    **e) L''écart de 48 barquettes.** 1 840 expédiées (P1, P2), 1 792 reçues (P4). Le dépôt ne peut réclamer
    la destruction que de ce dont il a accusé réception. Toute indemnité est plafonnée à 1 792 unités,
    et l''écart de 48 doit être expliqué avant tout règlement.


    **f) La pénalité de rupture d''assortiment.** Le contrat n''est pas au dossier. Ni la clause, ni sa
    base de calcul, ni la démonstration du préjudice ne sont produites. Et la rupture d''assortiment procède
    du refus total du lot par le dépôt, décision qui lui appartient et dont il ne peut vous transférer
    intégralement le coût sans l''établir.


    ---


    ## 3. Les huit jours : ce qui part, et dans quel ordre


    Le point de départ du délai n''est établi par aucune pièce : la réclamation du dépôt n''est ni datée
    ni versée. **Calez-vous sur l''hypothèse la plus défavorable** (départ à la date de réception du lot
    ou de la première réclamation orale connue) et exigez par ailleurs la pièce qui fixe ce point de départ.


    **Jour 0 — aujourd''hui**

    1. **Réponse écrite au dépôt, LRAR + copie mail horodatée.** C''est le seul acte qui neutralise l''acquisition
    de plein droit. Elle contient : réponse dans le délai, contestation motivée du quantum et du principe
    de la destruction, demande de production des pièces (ci-dessous), réserves expresses de tous droits,
    et **aucune reconnaissance de responsabilité**. Conservez l''accusé de réception : c''est lui, pas
    le contenu, qui préserve la position.

    2. **Déclaration de sinistre à l''assureur**, avec le dossier complet **pièce 3 incluse**. La rétention
    d''un élément défavorable expose à la déchéance de garantie et coûte infiniment plus que 21 400 €.
    Vérifiez le délai de déclaration de la police (souvent 5 jours ouvrés) et la garantie mobilisée :
    RC produits livrés, RC exploitation, ou marchandises transportées selon qui exécutait le transport.

    3. **Gel des preuves** : export horodaté du journal du portique, extraction brute des données de l''enregistreur
    embarqué (pas une capture d''écran), archivage de la fiche de quai et du BL originaux.


    **Jour 1 à 3**

    4. **Attestation écrite du chauffeur** (art. 202 CPC, signée, pièce d''identité jointe). La pièce
    7 est un propos téléphonique : elle n''existe pas pour l''assureur. L''attestation doit dire précisément
    : où le camion a stationné entre 6 h 25 et 11 h 12, si la caisse était pré-refroidie et fermée, portes
    ouvertes ou non, et pourquoi le groupe n''a été mis sous tension qu''à 9 h 05. Cette réponse décide
    de la qualification — défaut de procédure ou défaillance matérielle — et donc de la mobilisation de
    la garantie.

    5. **Identification du transporteur.** Si le transport était sous-traité, il y a un recours, une lettre
    de voiture à produire et un plafond d''indemnisation du contrat type applicable. Si le transport était
    en propre, la question est close et l''exposition reste entière. Aucune pièce du dossier ne tranche
    ce point : c''est la première chose à établir.

    6. **Vérification interne des autres expéditions du 3 juin** effectuées avec ce véhicule (P3 indique
    une sortie unique pour ce véhicule ce jour-là : à confirmer pour les autres véhicules et pour les
    autres lots issus du même chargement). Contrôle libératoire sur échantillons témoins du lot F-2418
    s''ils existent.


    **Demandes de pièces à formuler dans la réponse (liste fermée, à numéroter) :**

    contrat et annexes qualité opposables — décompte détaillé des 21 400 € avec justificatifs de chaque
    poste — procès-verbal de destruction — rapport de laboratoire complet (méthode, accréditation, procès-verbal
    de prélèvement, chaîne du froid des échantillons, traçabilité au lot) — relevés de température de
    la chambre du dépôt entre 12 h 55 et le prélèvement — explication de l''écart de 48 barquettes — date
    et forme de la réclamation initiale.


    ---


    ## 4. La sortie négociée à préparer en parallèle


    Sodimarché est un dépôt, pas un adversaire de passage. La position soutenable, et qui coûte le moins
    : **reconnaître la rupture documentaire sur la première tranche du transport, proposer la prise en
    charge de la valeur marchande des 1 792 barquettes sur présentation du décompte, refuser la pénalité
    d''assortiment et les frais de destruction non justifiés**, et joindre le plan correctif (mise sous
    tension du groupe asservie au départ de quai, rapprochement systématique fiche de quai / journal portique,
    interdiction de mention manuscrite d''horaire sur le BL). Cette offre ne se formule **qu''après**
    réception du décompte et **après** accord de l''assureur — une reconnaissance anticipée peut lui être
    opposée.


    ---


    ## 5. Deux destinataires, deux usages — la règle à tenir


    Le socle factuel est **identique** dans les deux envois : aucune assertion différente d''un destinataire
    à l''autre.


    - **À l''assureur** : dossier intégral, pièce 3 comprise, y compris l''analyse de l''intervalle non
    documenté. Rien ne se retire.

    - **Au client** : la réponse contractuelle expose ce qui est reconnu, ce qui est contesté et ce qui
    est demandé. Elle n''a pas à verser spontanément les enregistrements internes, mais elle **ne peut
    affirmer aucun horaire contredit par eux**. Concrètement : le mot « 6 h 40 » n''apparaît nulle part.


    ---


    ## 6. Repli, déclencheur, et ce qui renverserait la position


    - **Ce qui renverserait la contestation :** un procès-verbal de prélèvement daté et contradictoire,
    avec chaîne du froid documentée côté dépôt et rattachement tracé des unités au lot. Si le dépôt le
    produit, l''argument aval tombe et la discussion se réduit au quantum.

    - **Ce qui renverserait la reconnaissance :** une attestation du chauffeur établissant caisse pré-refroidie
    et scellée sur 6 h 25 → 9 h 05, corroborée par un relevé (sonde de caisse, plaque eutectique, données
    télématiques). L''exposition ne disparaît pas, mais la causalité redevient discutable.

    - **Repli, déclencheur observable :** si le décompte détaillé n''est pas produit sous 15 jours après
    la réponse, ou si le dépôt émet une facture et l''inscrit en compensation sur les règlements en cours,
    passage immédiat en contestation formelle avec mise en demeure et saisine de l''assureur protection
    juridique.

    - **Pire cas et qui l''encaisse :** 21 400 € ne mettent pas en cause l''entreprise. Ce qui la met
    en cause, ce sont trois irréversibles : le délai de huit jours qui expire sans écrit, la déchéance
    de garantie pour déclaration incomplète, et la perte du référencement. Les trois se traitent aujourd''hui.


    **Première action, maintenant :** la LRAR au dépôt et la déclaration à l''assureur partent le même
    jour, avec la pièce 3 dans le dossier assureur.

    '
