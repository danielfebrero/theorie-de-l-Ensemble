response:
  text: '# NOTE AU CONSEIL — séance de vendredi

    **Objet : arbitrage Sedamex (A) / Nordwerk (B), horizon 18 mois**

    **Recommandation : option B, sous deux vérifications bloquantes avant signature.**


    ## 1. Les chiffres


    | | A — Sedamex | B — Nordwerk |

    |---|---|---|

    | Résultat attendu | +200 k€ certains | **+380 k€** (0,6 × 900 − 0,4 × 400) |

    | Pire cas | +200 k€ | −400 k€, plafonné au contrat |


    Écart d''espérance : **+180 k€ en faveur de B.**


    Point de bascule : B cesse d''être supérieure à A si la probabilité de succès tombe à **46,2 %**.
    Le bureau d''études peut donc se tromper de 14 points — de 60 % à 46 % — avant que la recommandation
    s''inverse. Onze installations documentées supportent cette marge.


    ## 2. Le pire cas n''est pas la maison


    Dans le scénario d''échec, perte plafonnée à 400 k€ :


    - **Fonds propres** 3,4 → 3,0 M€. Covenant à 1,2 M€ : il reste **1,8 M€ de marge**. Testé chaque trimestre,
    il n''est approché à aucun trimestre.

    - **Trésorerie** 2,6 → 2,2 M€, soit **plus de 13 mois de masse salariale** en cash pur, hors exploitation.

    - **Dette nette nulle.** Ni caution personnelle, ni défaut croisé, ni sûreté sur l''actif industriel,
    ni gage sur le carnet.


    L''exposition maximale vaut **11,8 % des fonds propres**, contractuellement bornée. Ce n''est pas
    un risque de ruine, c''est de la variance. Une entreprise sans dette assise sur 2,6 M€ qui refuse
    toute variance bornée ne protège pas son bilan : elle le stérilise.


    ## 3. Réponse au directeur financier


    **Sur la formule.** « On ne joue pas la maison » : je souscris à la règle, et c''est pourquoi je recommande
    B. La maison, ce sont 3,4 M€ de fonds propres, 2,6 M€ de trésorerie et un carnet libre. Ce qui est
    engagé, ce sont 400 k€ plafonnés, sans recours sur le patrimoine du dirigeant ni sur l''outil.


    **Sur Tremay.** Le cas est réel, mais il ne se transporte pas. Un dépôt de bilan ne naît pas d''un
    mauvais tirage : il naît d''une perte **non bornée** — capex financé par dette, caution, défaut croisé,
    trésorerie insuffisante pour absorber le trou. Nous n''avons aucun de ces quatre éléments. Tremay
    démontre le danger d''une exposition ouverte, pas celui d''une ligne neuve. Et un cas saillant sans
    dénominateur pèse moins que onze installations documentées — sous réserve du point 4.


    **Sur ce qu''il a raison de dire.** 40 %, ce n''est pas rare : à ce rythme de décisions, nous vivrons
    un échec. Le pilotage doit donc être armé avant la signature, pas après le premier incident. Je propose
    que **le directeur financier soit propriétaire du dispositif de suivi**, avec autorité pour convoquer
    le conseil hors calendrier. Son opposition est la bonne fonction de contrôle : autant l''installer
    que la contourner.


    ## 4. Deux vérifications bloquantes avant signature


    1. **Le plafond de 400 k€** : confirmation écrite qu''il couvre toutes les causes d''échec technique
    sans exclusion, et qu''aucune pénalité client sur le carnet existant ne se déclenche hors plafond
    en cas de retard de la ligne.

    2. **La comparabilité des onze références** (volumes, matière, intégrateur, taille d''atelier). Si
    moins de six sont réellement comparables à notre configuration, l''estimation à 60 % n''est plus soutenue
    et **je retire la recommandation**.


    ## 5. Ce qui reste, et son encadrement


    Le plafond couvre l''argent, pas le temps de direction : le coût réel d''un échec est l''attention
    détournée. D''où :


    - Recette technique à **M+3** sur cadence et taux de rebut, seuils fixés avant signature.

    - Deux jalons manqués consécutifs → gel de tout investissement complémentaire et réunion du conseil.

    - Alerte interne sur fonds propres à **2,0 M€**, très au-dessus du seuil bancaire.

    - Sedamex : maintenir la relation, ne pas fermer la porte à un retour.


    **Ce qui me ferait recommander A** : une exclusion matérielle dans le plafond, moins de six références
    comparables, ou des pénalités carnet déclenchées hors plafond.


    **Première action** : les deux demandes de vérification partent lundi, réponse exigée sous dix jours
    ; signature seulement après.


    ---


    *Hypothèses de calcul : les deux options sont comparées en incrémental sur la même base 18 mois, et
    les 400 k€ sont traités comme un impact direct sur les fonds propres, sans contribution d''exploitation
    compensatoire — c''est-à-dire dans l''hypothèse la plus défavorable à ma recommandation.*

    '
