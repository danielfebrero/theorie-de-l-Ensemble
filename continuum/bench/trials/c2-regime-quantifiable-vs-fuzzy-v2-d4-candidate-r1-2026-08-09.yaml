response:
  text: '# Note au conseil — arbitrage de l''enveloppe 900 000 €


    **Conseil du jeudi — dossiers A (usinage) et B (direction qualité)**


    ---


    ## 1. Ce que nous proposons de décider


    L''enveloppe couvre les deux dossiers dans leur version décisive. **Il n''y a pas d''arbitrage A contre
    B à faire.** Ce que l''enveloppe ne couvre pas, c''est le parc complet *plus* un recrutement externe
    *plus* une mission de transition — et c''est le recrutement externe que nous écartons.


    - **Dossier B : 135 000 €** — promotion de l''adjointe (45 000 €) **et** mission de transition du
    directeur qualité sortant (90 000 €). Les deux, pas l''un ou l''autre.

    - **Dossier A : 620 000 €** — parc complet, livré en trois tranches conditionnées.

    - **Réserve armée : 145 000 €** — mandat de recrutement externe signé cet exercice, à déclenchement
    conditionnel.


    ---


    ## 2. Le tableau unique demandé


    Le président demande une seule grille lisible d''un coup d''œil. La voici. Elle classe les lignes
    par **l''échéance qui les commande**, et non par un rendement en euros — le point 5 explique pourquoi
    ce classement-là n''existe pas.


    | Ligne | Montant | Échéance qui commande | Ce qui la ferait échouer | Ce que nous observons |

    |---|---|---|---|---|

    | **B1 — Promotion de l''adjointe** | 45 000 € | Effective sous 30 jours : il reste 11 mois de présence
    du sortant | Elle prend le titre sans être présentée à l''organisme notifié ni aux deux CHU | Organisme
    notifié : référent enregistré à son nom avant le 8ᵉ mois |

    | **B2 — Mission de transition du sortant** | 90 000 € | Signée **avant** son départ, pas après |
    Négociée après son départ : prix et disponibilité nous échappent | Un audit complet mené par elle,
    lui présent, avant le 8ᵉ mois |

    | **A — Six machines** | 620 000 € | Fin d''exercice (enveloppe perdue sinon) | Le fournisseur ne
    tient pas les 96 % | Disponibilité mesurée tranche par tranche |

    | **Réserve armée** | 145 000 € | Mandat signé cet exercice | — | Sert au repli, ou au remplacement
    du poste que l''adjointe libère |

    | **Recrutement externe immédiat** | *280 000 €* | — | **Non retenu** : le candidat arrive sans être
    reconnu par l''organisme notifié ni par les deux CHU — soit exactement ce que nous cherchons à acheter
    | — |


    ---


    ## 3. Dossier A — ce que nos propres chiffres disent, et le chiffre qui manque


    Nos données de maintenance, horodatées et auditées, donnent un montant solide : 1 810 heures d''arrêt
    × 38 € de marge = 68 780 €, plus 213 000 € de coût direct, soit **environ 56 000 € par an** de coût
    réel du parc actuel. Rapporté à 620 000 €, cela fait un retour sur onze ans. Faible.


    Mais ce calcul ignore le poste probablement dominant : le rebut passe de 4,1 % à 1,2 % garanti. **Nous
    ne pouvons pas le chiffrer ici parce qu''il manque deux grandeurs que nous possédons : le volume annuel
    produit et la valeur de la pièce rebutée.** C''est le seul chiffre susceptible de ramener le retour
    de onze ans à quatre ou cinq. Il est dans nos systèmes ; il doit être sorti avant jeudi.


    Deux raisons d''engager quand même le parc complet : l''enveloppe est perdue si elle n''est pas engagée
    — l''alternative à la dépense n''est pas de garder l''argent, elle est de le perdre ; et la garantie
    de 96 % sur 7 ans avec pénalités transfère au fournisseur un risque que nous portons seuls aujourd''hui.


    **Condition contractuelle exigée** : livraison en trois tranches de deux machines, aux mêmes conditions
    unitaires, l''ordre des tranches suivant l''attribution des 47 pannes machine par machine — donnée
    que notre historique audité permet d''établir. Réception de chaque tranche conditionnée à la disponibilité
    mesurée de la précédente, pénalités applicables par tranche. Si le fournisseur refuse ce séquencement,
    le prix se renégocie.


    ---


    ## 4. Dossier B — pourquoi 135 000 € passent avant 620 000 €


    Le dossier A est une décision d''argent : au pire, nous immobilisons 620 000 € dans des machines qui
    se revendent. Le dossier B est d''une autre nature. Deux clients représentant 31 % du chiffre d''affaires
    déclarent travailler avec nous à cause d''une personne qui part dans onze mois, et cette personne
    est notre unique interlocuteur reconnu par l''organisme notifié. **Une perte de 31 % du chiffre d''affaires
    pour une entreprise de 140 salariés n''est pas un mauvais exercice : c''est une branche dont on ne
    revient pas.** Elle se traite en premier, quel que soit son prix.


    Les trois pistes RH ne sont pas trois options concurrentes. La promotion de l''adjointe est la succession.
    La mission de transition est la seule chose qui s''achète **pendant** que le sortant est encore là
    — c''est la seule ligne du dossier dont le prix monte avec le retard. Le recrutement externe est le
    plus cher et achète précisément ce qui manque le moins : une compétence qualité. Ce qui manque, c''est
    une reconnaissance par un organisme et par deux hôpitaux, et elle ne se recrute pas, elle se transmet
    en présence du sortant.


    ---


    ## 5. La cotation du cabinet RH : nous ne la retenons pas


    Elle annonce 35 % de rupture, 4,2 M€ de perte, criticité 7,5. Ces trois nombres viennent d''un atelier
    réunissant trois consultants n''ayant jamais travaillé dans le dispositif médical, sur un événement
    dont nous n''avons **aucun précédent interne et aucun comparable sectoriel** — donc aucune base de
    fréquence. Ce sont des chiffres précis portant sur une grandeur que personne n''a mesurée.


    C''est aussi la réponse à la demande d''un indicateur unique. Pour classer B à côté de A sur des euros
    de rendement, il faut un rendement pour B ; le seul disponible est cette cotation. Un tableau unique
    ne trancherait donc pas le dossier : il confierait l''arbitrage au chiffre le moins fiable du dossier
    — et, avec 1,47 M€ d''espérance affichée, il écraserait le dossier A sans que personne ait à le défendre.
    Le tableau du point 2 conserve la lisibilité demandée ; il abandonne seulement le dénominateur commun
    qui n''existe pas.


    ---


    ## 6. Repli, déclencheurs, et ce qui nous ferait changer d''avis


    **Sur B** — Déclencheur observable : si, **au 6ᵉ mois**, l''organisme notifié n''a pas enregistré
    l''adjointe comme référente, **ou** si l''un des deux CHU n''a pas confirmé la succession lors d''une
    visite conjointe avec le sortant, la réserve de 145 000 € déclenche le mandat de recrutement externe,
    avec le sortant encore mobilisable cinq mois. Si le déclencheur ne se produit pas, la réserve finance
    le remplacement du poste que l''adjointe libère — dépense que personne n''a chiffrée à ce jour et
    qui arrivera de toute façon.


    **Sur A** — Ce qui renverserait la décision : si l''attribution des pannes montre qu''elles sont réparties
    uniformément sur les six machines *et* que le rebut s''avère lié au procédé plutôt qu''au matériel,
    le parc complet ne se justifie plus. Nous ramènerions A à deux tranches et redéploierions le solde
    sur B.


    **Pire cas assumé** : le fournisseur ne tient pas ses 96 %. Coût porté par la trésorerie de l''exercice,
    partiellement compensé par les pénalités, machines revendables. Aucune conséquence sur la continuité
    d''exploitation.


    ---


    ## 7. Première action


    **Sous 48 heures, avant le conseil** : extraire de l''historique de maintenance le nombre de pannes
    et d''heures d''arrêt par machine, et le volume produit annuel avec la valeur de la pièce rebutée.
    Ces deux extractions ne coûtent rien, existent déjà, et déterminent l''ordre des tranches du dossier
    A.


    **Le jour même du conseil** : ouvrir la négociation de la mission de transition avec le directeur
    qualité. C''est la seule ligne dont la valeur diminue chaque semaine.

    '
