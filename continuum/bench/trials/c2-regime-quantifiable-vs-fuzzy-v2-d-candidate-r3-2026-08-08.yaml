response:
  text: '# Note au conseil — jeudi


    **Objet : arbitrage des dossiers A et B sur l''enveloppe de 900 000 €**


    ---


    ## 1. Ce que nous proposons de décider


    **Dossier B d''abord, et il ne coûte pas cher : 135 000 €.** Promotion de l''adjointe (45 000 €) *et*
    mission de transition du directeur sortant (90 000 €). Les deux, pas l''un ou l''autre.


    **Dossier A : le parc complet, 620 000 €, livré en deux tranches** — les trois machines les plus défaillantes
    d''abord, les trois autres après recette.


    **Solde : 145 000 €** engagés cet exercice sur le remplacement du poste que l''adjointe libère et
    sur un mandat de recherche externe activable.


    Total : 900 000 €. L''enveloppe n''étant pas reconductible, un euro non engagé vaut zéro : nous n''en
    laissons aucun.


    ## 2. Sur le tableau unique demandé


    Nous ne pouvons pas classer les lignes des deux dossiers par le même indicateur en euros, et il vaut
    mieux dire pourquoi que de le faire mal.


    Le dossier A repose sur cinq ans de maintenance horodatée et auditée. Le dossier B ne dispose que
    d''un seul chiffre : 35 % × 4,2 M€ = 1,47 M€. Ce chiffre vient d''un atelier de trois consultants
    qui n''ont jamais travaillé dans le dispositif médical, sans historique de référence et sans qu''aucun
    de nos deux clients hospitaliers n''ait été interrogé. Mis dans le tableau demandé, il arriverait
    **en tête, au-dessus de chaque ligne auditée du dossier A**. Le nombre le plus fragile commanderait
    la décision.


    Le tableau existe donc, mais avec deux blocs : A se classe par rendement, B ne se classe pas — il
    se franchit ou non. Un dossier qui engage 31 % du chiffre d''affaires pour 135 000 € n''a pas besoin
    d''être classé.


    ## 3. Dossier A — ce que disent les chiffres, et ce qu''ils ne disent pas


    Sur cinq ans : 213 000 € de coût direct, soit 42 600 €/an ; 1 810 heures d''arrêt à 38 € de marge,
    soit 13 800 €/an. **Gain annuel mesuré et certain : environ 56 400 €.** Face à 620 000 € amortis sur
    les 7 ans de garantie, soit 88 600 €/an. L''écart est comblé par le gain sur le rebut (4,1 % → 1,2
    %), dont la valeur dépend du volume d''heures produites — chiffre que la note du fournisseur ne contient
    pas et que nous devons établir. L''opération est positive sur la durée de vie réelle des machines
    (les actuelles ont 14 ans), pas sur les 7 ans de garantie seuls.


    Deux points à corriger avant signature :


    - **La garantie de 96 % ne vaut peut-être rien.** Nos 1 810 heures d''arrêt représentent 60 heures
    par machine et par an. Si une machine tourne 1 600 heures par an, nous sommes déjà à 96,2 % ; en deux
    équipes, à 98 %. Exiger que les 96 % soient définis sur le même dénominateur que notre mesure actuelle,
    et relever le seuil, sinon la clause de pénalité est décorative.

    - **Les 47 pannes ne sont pas réparties également sur les six machines.** Le relevé existe, il est
    audité, il se sort en une journée. C''est l''information la moins chère et la plus décisive du dossier
    : elle détermine quelles machines composent la tranche 1.


    ## 4. Dossier B — pourquoi il passe en premier malgré 135 000 €


    Le certificat est délivré à l''entreprise, pas à une personne : nous ne perdons pas notre marquage
    le jour de son départ. **Point à vérifier avant jeudi** : s''il est notre personne chargée du respect
    de la réglementation au sens de l''article 15 du règlement 2017/745, son remplacement doit être qualifié
    et déclaré — c''est une obligation, pas une option.


    L''exposition réelle est ailleurs : deux clients à 31 % du chiffre d''affaires disent travailler avec
    nous « à cause de lui ». Cette perte-là ne se rattrape pas dans l''exercice. C''est la seule branche
    irrécupérable des deux dossiers, et elle se couvre pour 15 % du prix d''une machine.


    La mission de transition n''est pas un supplément de confort : c''est le seul mécanisme qui transfère
    la reconnaissance. Elle doit être structurée comme un transfert de pouvoir réel, pas comme une supervision
    — l''adjointe conduit les audits en propre à partir du 3ᵉ mois, il est présent sans être l''interlocuteur,
    et le solde de sa mission est payé à l''enregistrement formel de l''adjointe par l''organisme notifié.
    Les neuf auditeurs internes qu''il a formés sont un actif de continuité : ils doivent être associés
    au transfert, pas spectateurs.


    **Nous n''avons pas demandé à l''adjointe si elle veut le poste.** À faire avant jeudi ; si la réponse
    est non, l''arbitrage change entièrement.


    ## 5. Déclencheurs et clauses de repli


    | Événement observable | Action |

    |---|---|

    | Visite conjointe des deux clients hospitaliers avant le 4ᵉ mois — l''un des deux refuse de confirmer
    la continuité | Escalade au conseil, activation du mandat de recherche |

    | Audit conjoint avec l''organisme notifié au 5ᵉ mois ; adjointe non enregistrée comme interlocutrice
    au 7ᵉ mois | Recrutement externe activé sur les 145 000 € |

    | Tranche 1 : disponibilité mesurée < 96 % sur 6 mois | Pénalités appliquées, tranche 2 gelée |

    | Adjointe décline le poste | Recrutement externe (280 000 €), financé en réduisant la tranche 2 |


    ## 6. Ce qui renverserait ce choix


    Si le relevé de maintenance montre que les arrêts se concentrent sur deux machines et non six, la
    tranche 2 perd sa justification et ces 310 000 € doivent aller ailleurs. Et si les deux clients hospitaliers
    indiquent que leur engagement tient au produit et non à la personne, le dossier B redescend à la promotion
    seule.


    Ces deux vérifications coûtent quelques jours. Aucune des deux n''a été faite.

    '
