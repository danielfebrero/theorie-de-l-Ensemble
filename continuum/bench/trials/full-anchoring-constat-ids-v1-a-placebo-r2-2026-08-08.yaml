response:
  text: 'L''avis complet est dans le fichier ci-dessus (la publication en page partageable a été refusée
    — je peux la relancer si vous la voulez). Voici l''essentiel.


    ## Ce que je retiens


    **Le dossier confond deux problèmes.** Une usure matérielle (32 h des 41 h d''indisponibilité sur
    les deux sites équipés en 2015) et un défaut logiciel (pertes de réservation depuis mars). Causes
    différentes, remèdes différents. La v4 ne traite que le second.


    **Et il documente surtout le mauvais.** Les 41 h rapportées au temps d''ouverture font ~0,9 % d''indisponibilité
    sur les sites anciens, 0,1 % ailleurs — plus de 99 % de disponibilité partout. Pendant ce temps le
    défaut de réservation coûte 5 h/semaine à Rive-Sud, soit ~225 h/an, ~6 000 €/an *pour un site*. La
    donnée la plus volumineuse porte sur le problème le moins dommageable.


    **Le trou central : ce coût n''est mesuré que sur 1 site sur 7.** Et il décide de tout. Si le défaut
    est propre à Rive-Sud, les 31 000 € de la v4 se remboursent en cinq ans — l''investissement ne se
    justifie pas. S''il touche trois sites, en moins de deux ans. Les 61 % ne comblent pas ce trou : 26
    agents, une fréquence déclarée, aucune ventilation par site.


    **Fontaine est le point à creuser.** Bornes de 2015, forte panne matérielle, zéro remontée logicielle.
    Soit le site est épargné et le défaut est local — la v4 viserait à côté ; soit il subit sans remonter
    et le coût réseau est bien supérieur ; soit son volume est trop faible. Une demi-journée pour trancher,
    et ça change la recommandation.


    **Deux dates, pas une.** La remise expire le 30 août, le contrat court jusqu''au 31 octobre. Le seul
    coût d''un refus de signer, c''est la remise. Dont la valeur est d''ailleurs incalculable en l''état
    : selon qu''elle porte sur trois ans ou sur la première année, l''économie va de ~6 000 € à ~20 000
    €. Un facteur trois, sur le chiffre qu''on est censé comparer aux 31 000 € de la v4.


    **Le départ informatique d''octobre est la contrainte que le dossier ne traite pas.** Deux personnes
    → une, au moment de la bascule. Le libre est l''option la plus exigeante en informatique au moment
    où l''informatique est la plus faible. Les 2 sites sur 5 encore au papier chez le voisin, quatorze
    mois après, sont probablement le même symptôme.


    ## Ce que je recommande


    **L''option 1, mais sur 6 à 12 mois au lieu de trois ans.** C''est l''option 1 amendée sur un seul
    paramètre — pas une quatrième option que j''introduirais. C''est la seule qui laisse les trois futurs
    ouverts.


    **Ce que ça coûte, à dire au comité sans l''enrober : la remise, soit 6 000 à 20 000 € sur trois ans.**
    C''est le prix de ne pas s''engager trois ans sur un défaut non diagnostiqué et une compatibilité
    matérielle non tranchée. Je crois ce prix justifié, mais l''arbitrage appartient au comité.


    La v4 n''est pas écartée, elle est suspendue à une réponse écrite sur la compatibilité avec les bornes
    de 2015 — attendre ne coûte rien. Le libre n''est pas écarté sur ses mérites, mais sur notre capacité
    à le conduire ; une reconduction courte est précisément ce qui permet de le réexaminer dans douze
    mois.


    ## Les quinze jours


    Deux actions ne peuvent pas attendre la séance : **vérifier sous 48 h la clause de préavis de dénonciation**
    — si le délai est expiré, la reconduction est déjà acquise et toute la délibération change d''objet
    — et **obtenir par écrit l''assiette de la remise et la réponse sur la compatibilité v4**, pour que
    le comité délibère sur des chiffres réels.


    Ensuite : notification formelle du défaut à l''éditeur sous 5 jours (jamais faite, à ma connaissance
    — elle préserve le recours et déplace la discussion d''une remise commerciale vers une correction
    due), levée du point Fontaine à J+7, relevé standardisé des réservations perdues sur les 7 sites ouvert
    à J+3 avec première lecture à J+15, contrôle saisonnier des réclamations n−1, demande écrite de prolongation
    courte, et note à la DG sur la charge ETP des trois options.


    Huit actions internes, sans coût externe, qui lèvent quatre des cinq inconnues avant la mi-septembre.


    Deux réserves sur ma part d''inférence : j''ai lu « le 28 » et « le 30 » comme août 2026, et les montants
    en €/heure chargée, semaines travaillées et heures d''ouverture sont mes hypothèses, signalées comme
    telles en pied de document — elles ne figurent pas au dossier et sont à confirmer avant tout usage
    budgétaire.

    '
