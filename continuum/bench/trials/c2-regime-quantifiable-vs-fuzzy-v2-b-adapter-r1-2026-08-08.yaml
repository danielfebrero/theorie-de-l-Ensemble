response:
  text: '# Note au conseil — arbitrage de l''enveloppe 900 000 €

    **Objet :** dossiers A (parc d''usinage) et B (succession direction qualité) — décisions demandées
    jeudi.


    ---


    ## 1. Sur le tableau unique demandé


    Un seul tableau, oui. Une seule colonne de rendement, non — et c''est le point le plus important de
    cette note.


    Le dossier A repose sur cinq ans de maintenance horodatée et auditée : on peut calculer. Le dossier
    B repose sur un événement que l''entreprise n''a **jamais connu** (aucun changement de directeur qualité
    en 22 ans), sans comparable sectoriel. Il n''y a pas de base de calcul, il y a une exposition.


    Si on force les deux dans la même colonne, la ligne B affiche mécaniquement 0,35 × 4,2 M€ = **1,47
    M€ de « gain espéré »**, elle écrase tout le reste, et le conseil tranche 900 000 € sur un chiffre
    fabriqué. Nous recommandons d''écarter cette cotation, pour trois raisons vérifiables :


    - Elle provient de trois consultants **sans expérience du dispositif médical**, en atelier, sans donnée
    historique.

    - Elle est **incohérente en interne** : la probabilité porte sur « au moins une » relation qui se
    dégrade, la perte de 4,2 M€ correspond à la perte **totale et définitive des deux** (soit exactement
    les 31 % du chiffre d''affaires). Les deux bouts du calcul ne parlent pas du même événement.

    - La « criticité 7,5/10 » n''est pas une grandeur monétaire et ne peut entrer dans un classement en
    euros.


    Nous ne remplaçons pas ces chiffres par d''autres chiffres inventés. Nous traitons B pour ce qu''il
    est : un risque **irréversible** sur 31 % du chiffre d''affaires, dont la couverture est **peu coûteuse**.


    ## 2. Le vrai constat : il n''y a pas d''arbitrage entre A et B


    Les trois pistes RH coûtent 45 000 €, 90 000 € et 280 000 €. Les deux premières sont **complémentaires,
    pas alternatives** (le cabinet les a présentées comme un choix). Promotion de l''adjointe **+** mission
    de transition du titulaire = **135 000 €**, soit 15 % de l''enveloppe. Le parc complet tient dans
    le reste.


    **La contrainte sur le dossier B n''est pas l''argent, c''est les 11 mois.** Chaque mois passé sans
    successeur nommé est un mois de tuilage perdu, non rattrapable par une dépense ultérieure.


    ## 3. Dossier A — ce que dit réellement le dossier, et ce qui manque


    Sur 5 ans, ramené à l''année : 362 h d''arrêt et 42 600 € de coût direct d''immobilisation. Attention
    au double compte : 213 000 € / 1 810 h = 118 €/h, très au-dessus de la marge de 38 €/h — le coût direct
    contient déjà bien plus que la marge perdue. On ne cumule pas les deux.


    Sur 7 ans, le préjudice **mesuré** vaut donc ≈ 298 000 € face à 620 000 € d''investissement. **Les
    pannes seules ne paient pas les machines.**


    Ce qui les paie, c''est le rebut : 4,1 % → 1,2 %, soit 2,9 points. Ce gain n''est chiffré nulle part
    dans le dossier, faute du volume de production. Le calcul de bascule est simple :


    > **L''achat est rentable si ces six machines traitent plus de ≈ 1,6 M€ de valeur de production par
    an.** En dessous, non.


    Cette donnée est dans l''ERP. C''est une requête de quinze minutes, à produire **avant le vote**,
    pas après.


    Deuxième point à verrouiller : la garantie de 96 % de disponibilité doit être exprimée **sur la même
    base horaire que nos 1 810 heures auditées**. Selon le régime de marche, nous sommes peut-être déjà
    à ce niveau — auquel cas la clause de pénalité ne protège de rien. À faire préciser par écrit par
    le fournisseur avant signature.


    ## 4. Répartition proposée


    Classement par **irréversibilité d''abord, rendement mesuré ensuite** — c''est la seule règle qui
    permette de trier des lignes de nature différente.


    | # | Ligne | Montant | Base de la décision |

    |---|---|---|---|

    | 1 | Promotion de l''adjointe, nomination **ce mois-ci** | 45 000 € | Irréversible : 11 mois de tuilage,
    non rachetables |

    | 2 | Mission de transition du directeur sortant, 12 mois | 90 000 € | Idem — seule façon d''acheter
    du temps après son départ |

    | 3 | Transfert de la reconnaissance : dossier successeur auprès de l''organisme notifié, requalification
    des 9 auditeurs, visites conjointes chez les deux clients hospitaliers | ≈ 55 000 € | Fait porter
    la relation par le **système qualité**, plus par une personne |

    | 4 | Réserve conditionnelle de recrutement externe (contrat-cadre engagé, déclenché sur signal) |
    ≈ 90 000 € | Filet si le point de contrôle du mois 6 échoue |

    | 5 | Parc d''usinage — 6 machines | 620 000 € | Rentable **si** seuil de 1,6 M€/an confirmé |

    | — | *Repli si le seuil n''est pas confirmé : 3 machines concentrant les pannes* | *310 000 €* |
    *Le journal de maintenance identifie lesquelles* |

    | | **Total** | **900 000 €** | |


    ## 5. Ce qui déclenche quoi


    - **Avant jeudi :** volume de production des 6 machines (ERP) ; base horaire de la garantie 96 % (fournisseur)
    ; répartition des 47 pannes par machine (journal de maintenance).

    - **Mois 6 :** si l''organisme notifié n''a pas formellement reconnu la nouvelle directrice qualité,
    **ou** si un des deux clients hospitaliers n''a pas été rencontré avec elle, la ligne 4 se déclenche
    — pendant que le titulaire est encore là, pas après.

    - **Question au DAF, à trancher avant le vote :** un contrat-cadre conditionnel compte-t-il comme
    « engagé » sur l''exercice ? Si non, la ligne 4 doit être restructurée en prestation ferme, sinon
    ces 90 000 € sont perdus.


    ## 6. L''objection la plus forte contre cette note


    Que nous sous-payons le dossier B. Une adjointe de 3 ans d''ancienneté ne remplace pas 22 ans de relation
    personnelle avec un organisme notifié, et 135 000 € pour couvrir 31 % du chiffre d''affaires peut
    passer pour de l''économie mal placée face à un recrutement externe à 280 000 €.


    Réponse : un recruté externe arrive sans reconnaissance de l''organisme notifié **non plus** — il
    l''obtient par le même dossier formel que l''adjointe, en partant de zéro sur nos produits. Le recrutement
    externe achète de l''expérience, pas de la continuité. C''est la continuité qui est en jeu. Et c''est
    réversible dans ce sens-là : si la promotion échoue au mois 6, la ligne 4 finance le recrutement ;
    l''inverse — recruter à l''extérieur puis découvrir qu''on a perdu l''adjointe et le tuilage — ne
    l''est pas.


    **Décisions demandées :** nomination de l''adjointe et mission de transition (lignes 1-2), sans condition.
    Parc complet (ligne 5) sous réserve de la confirmation ERP présentée en séance ; à défaut, tranche
    de 3 machines et redéploiement du solde sur les lignes 3-4.

    '
