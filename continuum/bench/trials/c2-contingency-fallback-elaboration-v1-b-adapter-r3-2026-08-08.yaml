response:
  text: '# Plan d''exécution — conversion électrique de la flotte

    **Pour le conseil du jeudi 13 août 2026 — Direction de l''exploitation**


    La commande est ferme, le plan ci-dessous la met en œuvre. Il porte sur une seule question : comment
    mettre 96 véhicules électriques en service sans perdre de tournée ni la subvention.


    ---


    ## 1. Le point dur n''est pas l''autonomie, c''est l''énergie disponible la nuit


    L''autonomie est un problème borné et déjà mesuré. La capacité de recharge, elle, n''a jamais été
    calculée contre le besoin réel. Elle l''est ici.


    **Conversion des données du dossier en heures de borne :**

    une charge complète = 6 h de borne = 232 km en conditions tempérées, **197 km à 2 °C avec chauffage**.
    Le déploiement se fait de septembre à janvier : c''est le chiffre froid qui s''applique. Soit **32,8
    km par heure de borne**.


    Le réseau parcourt 96 × 168 = **16 128 km par jour**. Ce total est invariant : redécouper les tournées
    change leur longueur maximale, pas le kilométrage total, donc pas le besoin d''énergie.


    | | Besoin | Disponible |

    |---|---|---|

    | Énergie nocturne pour 96 tournées (hiver) | **492 h de borne** | — |

    | Fenêtre de charge au dépôt (17 h–7 h) | 14 h | — |

    | Bornes nécessaires | **35 bornes** | 14 aujourd''hui, 22 après la tranche devisée |


    **Les 8 bornes devisées à 210 k€ amènent le parc à 22 bornes, soit 308 h de charge, soit environ 10
    100 km par nuit — 62 % du réseau, soit environ 60 véhicules.** Exactement le seuil de la subvention,
    et rien de plus. Les 36 derniers véhicules du carnet de commande n''ont, en l''état, pas d''énergie
    disponible.


    ### L''hypothèse qui change tout — à vérifier lundi


    Une charge complète en 6 h sur une borne de 22 kW représenterait 132 kWh, soit 50 kWh/100 km pour
    un utilitaire annoncé à 260 km. C''est invraisemblable. La lecture cohérente est que **les véhicules
    chargent à ~11 kW, limités par leur chargeur embarqué, et non par la borne**. Si c''est le cas, chaque
    borne de 22 kW est utilisée à moitié et peut être dédoublée en deux points de 11 kW, pour le coût
    d''un câblage et d''une prise.


    | Scénario | Points de charge à fin octobre | Véhicules servis par nuit (hiver) |

    |---|---|---|

    | A — un véhicule par borne | 22 | ~60 |

    | B — deux points de 11 kW par borne | 44 | ~120 |


    **Action 1, lundi 17 août :** obtenir du constructeur la puissance AC réellement acceptée par le véhicule,
    et de l''installateur la possibilité de dédoubler les 14 bornes existantes. Une demi-journée de travail
    arbitre une décision à 370 k€. Aucune troisième tranche de bornes n''est engagée avant cette réponse.


    ---


    ## 2. Règle d''affectation des tournées


    L''essai donne une frontière nette : **11 tournées sur 120 ont exigé une recharge non prévue, toutes
    au-dessus de 190 km ; zéro échec en dessous.** Le nombre de tournées longues dans l''essai n''est
    pas connu, donc le taux d''échec au-dessus de 190 km se situe entre 37 % et 100 %. En dessous, il
    est nul sur environ 100 observations. C''est suffisant pour fixer une règle.


    - **≤ 180 km → électrique.** Marge de 17 km sur l''autonomie froide mesurée.

    - **180–195 km → électrique sous condition** : uniquement au-dessus de 8 °C annoncés, sinon bascule
    diesel la veille au soir.

    - **> 195 km → diesel.** La plus longue tournée, 240 km, dépasse l''autonomie réelle même en conditions
    tempérées (232 km). Elle n''est pas électrifiable, quel que soit le nombre de bornes.


    L''arithmétique de cette règle est écrasante. Une tournée non terminée coûte 900 €. Un diesel prolongé
    coûte 480 € par mois, soit 22 € par jour ouvré. **Un seul échec paie deux mois de prolongation d''un
    véhicule.** À l''échelle du réseau, faire rouler les 30 tournées longues en électrique coûterait entre
    10 000 et 27 000 € par jour ; les couvrir en diesel coûte 660 € par jour.


    ---


    ## 3. Cible au 31 janvier 2027


    | | Véhicules | Tournées | Km/jour |

    |---|---|---|---|

    | Électrique | 66 | les 66 plus courtes, moyenne ~153 km, max 180 km | ~10 100 |

    | Diesel prolongé | 30 | les 30 plus longues, moyenne ~201 km | ~6 030 |


    Les deux contraintes — autonomie et capacité de charge — désignent le même sous-ensemble de tournées.
    Ce n''est pas une coïncidence commode, c''est ce qui rend la cible tenable : les tournées qu''on ne
    peut pas alimenter sont celles qu''on ne pourrait pas terminer.


    Les 30 véhicules électriques excédentaires sont réceptionnés, immatriculés et stationnés ; leur mise
    en service suit la troisième tranche de bornes (mars) ou intervient immédiatement si le scénario B
    est confirmé.


    ---


    ## 4. Calendrier et portes de décision


    Le seul geste irréversible du plan est la restitution d''un diesel : **un véhicule rendu ne revient
    pas avant 11 semaines**. Chaque lot est donc précédé d''une porte de décision calée sur le préavis
    de 30 jours, avec une fenêtre d''observation qui se ferme 5 jours avant.


    | Date | Action | Condition de passage |

    |---|---|---|

    | **14 août** | Commande des 8 bornes (210 k€), 7 semaines de travaux → mise en service ~2 octobre
    | Décision du conseil |

    | **17 août** | Saisine constructeur/installateur sur le dédoublement des points de charge | — |

    | **20 août** | Distribution des 96 tournées par kilométrage, extraite de l''embarqué | — |

    | **31 août** | Préavis lot 1 — **restitution de 24 diesels** confirmée | 24 tournées ≤ 180 km identifiées
    et affectées |

    | **30 sept.** | Préavis lot 2 — **restitution de 24 diesels** | 22 bornes réceptionnées **et** taux
    de tournées terminées ≥ 99 % sur 15 jours |

    | **31 oct.** | Préavis lot 3 — **restitution de 18, prolongation de 6** | 48 VE en service, recharges
    non prévues < 1 % |

    | **30 nov.** | Préavis lot 4 — **prolongation des 30 derniers diesels jusqu''au 30 avril** | Décision
    par défaut : prolonger. Ne restituer que si le scénario B est confirmé et 90 VE roulent |

    | **15 janv.** | Décision troisième tranche de bornes (~14 bornes, ~370 k€, mise en service ~5 mars)
    | Uniquement si le scénario B est infirmé |

    | **30 avril** | Restitution du solde diesel | Réseau électrifié à 100 % vérifié sur mars–avril |


    Coût de la prolongation : 30 véhicules × 480 € × 5 mois = **72 000 €**. À comparer aux 620 000 € de
    subvention et aux 3,1 M€ engagés.


    ---


    ## 5. Subvention de 620 000 € — chemin critique


    Le seuil de 60 véhicules est atteint mi-novembre en livraison, mais « rouler » n''est pas « être livré
    ». Trois conditions, toutes contrôlables :


    1. **Les 22 bornes en service au 15 novembre au plus tard.** Commande le 14 août, 7 semaines de travaux,
    six semaines de marge. Le risque n''est pas l''installateur mais le raccordement : 22 bornes appellent
    près de 500 kW par plateforme. **Action 2, lundi 17 août : demande de puissance auprès du gestionnaire
    de réseau, dont le délai peut excéder les 7 semaines de travaux.** C''est le seul poste du calendrier
    qui n''est pas sous notre contrôle.

    2. **60 tournées au moins sous 180 km.** À confirmer par la mesure du 20 août. Si la distribution
    est plus étalée que prévu, redécoupage du plan de transport à conduire en septembre, avant que la
    restitution des diesels ne retire la marge.

    3. **La définition écrite de « rouler ».** Immatriculé, assuré, affecté, ou effectivement en tournée
    ? **Action 3 : obtenir la définition par écrit de la Région avant fin août.** 620 000 € ne doivent
    pas dépendre d''une interprétation.


    ---


    ## 6. Pilotage et conditions d''arrêt


    Le tableau de bord publie déjà chaque soir, par plateforme, le taux de tournées terminées et le nombre
    de recharges non prévues. Trois seuils, revue le lundi :


    - **Taux de tournées terminées < 99 % sur 5 jours consécutifs** sur une plateforme → gel du préavis
    de restitution suivant, analyse sous 48 h.

    - **Recharges non prévues > 2 % des tournées électriques sur 10 jours** → abaissement immédiat du
    seuil d''affectation de 180 à 165 km, report des tournées concernées sur diesel.

    - **Un véhicule immobilisé faute de borne disponible au départ** → alerte immédiate à la direction
    ; c''est le signal que la capacité de charge est atteinte, et il précède les échecs de tournée d''environ
    une semaine.


    Le gel est réversible ; la restitution ne l''est pas. En cas de doute à une porte de décision, la
    règle est de prolonger.


    ---


    ## 7. Le meilleur argument contre ce plan


    *« Vous surdimensionnez la prudence. L''essai de mars portait sur six véhicules neufs non rodés, conduits
    par des chauffeurs non formés à l''éco-conduite. L''écart entre 260 et 232 km se referme largement
    avec la formation et la gestion de la charge. Garder 30 diesels cinq mois coûte 72 k€, retarde l''apprentissage
    et immobilise 900 k€ de véhicules achetés. »*


    L''objection est en partie juste et le plan y répond par sa structure, pas par un contre-argument.
    Le nombre de diesels retenus n''est pas fixé une fois pour toutes : il est révisé chaque mois sur
    les données du tableau de bord, à la baisse si les taux le permettent. La formation à l''éco-conduite
    est intégrée au déploiement de septembre. Mais elle porte sur l''écart 260/232 km, marketing contre
    réel ; elle ne déplace pas les 197 km mesurés à 2 °C, qui sont un effet de chauffage et de chimie,
    et c''est ce chiffre-là qui commande la règle des 180 km. Sur les 72 k€ : ils achètent la couverture
    d''un risque évalué entre 1 et 2,7 M€ sur la période. Le rapport ne justifie pas d''hésiter.


    ---


    ## 8. Ce que le plan suppose, et qui doit être vérifié


    Quatre hypothèses portent l''essentiel du raisonnement. Trois sont levées avant le 20 août.


    | Hypothèse | Statut | Effet si fausse |

    |---|---|---|

    | Fenêtre de charge de 14 h au dépôt (17 h–7 h) | À confirmer par l''exploitation | Une fenêtre de
    12 h fait tomber la capacité de 60 à 51 véhicules |

    | Charge limitée à 11 kW côté véhicule | **Non vérifiée — action du 17 août** | Si vérifiée : troisième
    tranche annulée, 370 k€ économisés |

    | ~30 tournées au-dessus de 195 km | Estimée à partir de la moyenne 168 / maximum 240 | **Non mesurée
    — action du 20 août.** Détermine le nombre exact de diesels à prolonger |

    | Consommation linéaire au kilomètre | Approximation | Conservatrice : le froid pénalise davantage
    les tournées courtes |


    ---


    ## 9. Décisions demandées jeudi


    1. **Engager les 8 bornes (210 k€) le 14 août**, avec saisine simultanée du gestionnaire de réseau.

    2. **Approuver la règle d''affectation à 180 km** et le principe d''une flotte mixte jusqu''au 30
    avril 2027.

    3. **Autoriser la prolongation d''un maximum de 30 diesels jusqu''au 30 avril (72 k€)**, la direction
    de l''exploitation étant mandatée pour réduire ce nombre mensuellement sur critères mesurés.

    4. **Provisionner 370 k€ pour une troisième tranche de bornes**, décision reportée au 30 novembre
    et conditionnée à l''issue de la vérification du 17 août.


    Engagement complémentaire net : 282 k€ décidés jeudi, 370 k€ provisionnés et conditionnels, contre
    620 k€ de subvention sécurisés et un risque d''exploitation de l''ordre de 1 à 2,7 M€ neutralisé.


    ---


    Deux remarques sur ce que je vous remets. La ligne la plus lourde du plan — les 370 k€ de bornes supplémentaires
    — repose sur une hypothèse technique que personne n''a encore vérifiée et qui se lève en une demi-journée
    ; c''est pour cela que la décision est reportée à novembre plutôt que présentée jeudi. Et le dimensionnement
    du parc diesel à conserver s''appuie sur une distribution des kilométrages que je n''ai pas : la moyenne
    de 168 km et le maximum de 240 km ne suffisent pas à compter les tournées longues. La mesure est lancée
    et rendue le 20 août, soit onze jours avant le premier préavis irréversible. Si elle révèle une distribution
    plus étalée, c''est le nombre de diesels prolongés qui monte, pas le calendrier qui bouge.


    Je peux vous l''exporter en document partageable si vous voulez le diffuser aux administrateurs avant
    jeudi.

    '
