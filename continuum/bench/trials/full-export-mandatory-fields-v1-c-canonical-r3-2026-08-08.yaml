  text: 'Je joue le rôle du DG et je rédige la note. Avant le texte, le calcul qui commande tout le reste,
    parce que c''est lui qui rend la note exécutable sans arbitrage.


    **La remise de 9 % détruit plus de marge que les +18 % n''en créent.**


    Sur les 14,9 M€ de D, à 31 % de marge : 4,62 M€ de marge brute aujourd''hui.

    Avec −9 % de prix, la marge par unité tombe de 31 à 22 points, soit −29 %. Il faudrait **+41 % de
    volume** pour rester à l''équilibre. On m''en propose 18.


    | Scénario | Marge brute sur D | Δ |

    |---|---|---|

    | Aujourd''hui | 4,62 M€ | — |

    | An 1, engagement tenu (+18 %) | 3,87 M€ | **−0,75 M€** |

    | An 2-3, volume revenu à la base | 3,28 M€ | **−1,34 M€/an** |

    | An 2-3, volume au niveau du T2 (−11 %) | 2,92 M€ | **−1,70 M€/an** |


    Cumul 3 ans dans l''hypothèse médiane : **−3,4 M€**. Plus 1,2 M€ si on veut sortir. Contre 2,1 M€
    de trésorerie. Le contrat vend trois ans de prix contre un an de volume : la remise est contractuelle
    sur 36 mois, l''engagement de volume ne l''est que sur 12.


    C''est la branche de perte irrécupérable. Le veto porte sur ce contrat-là, pas sur D.


    ---


    # NOTE DE DIRECTION — MANDAT EXÉCUTOIRE


    **De :** Direction générale · **À :** Comité de direction (DAF, Directeur commercial, Directeur industriel,
    DRH)

    **Objet :** Contrat d''exclusivité D — décision prise, mandat de négociation et plan de continuité

    **Statut :** décision arrêtée. Le CODIR exécute. Aucune disposition ci-dessous n''est soumise à arbitrage.


    ## 1. Décision


    **Le contrat d''exclusivité de 36 mois proposé par D n''est pas signé. Cette décision est prise ce
    jour par le DG, elle n''appartient pas au CODIR, et elle ne se rediscute pas en mon absence.**


    Motif principal, chiffré ci-dessus : à −9 % de prix, l''équilibre de marge exige +41 % de volume ;
    D en engage 18, et seulement la première année. Motif structurel : l''exclusivité interdit juridiquement
    les deux seules issues à notre dépendance à 62 %. Motif de solvabilité : 1,2 M€ de pénalité de sortie
    représentent 57 % de notre trésorerie — le contrat supprime la porte de sortie au moment précis où
    il augmente la probabilité d''en avoir besoin.


    Ce que le CODIR est mandaté pour faire : négocier et signer un accord avec D **à l''intérieur de l''enveloppe
    de la section 2**, et déployer le plan de continuité de la section 4 **quelle que soit** la réponse
    de D.


    ## 2. Enveloppe de signature (mandat plein à l''intérieur, interdiction absolue à l''extérieur)


    Le CODIR peut signer sans me consulter tout accord respectant **simultanément** les sept bornes suivantes
    :


    1. **Durée : 12 mois**, renouvelable par accord exprès. Pas 24, pas 36.

    2. **Remise : 4 points maximum.** Le point d''équilibre exact est 4,7 points à +18 % de volume ferme
    : au-delà, nous payons D pour travailler. Préférer la structure « remise sur le volume incrémental
    uniquement » (−4 % sur les tonnes au-delà de la base actuelle, prix inchangé sur la base) : à +18
    %, elle nous rapporte +0,72 M€ de marge au lieu de nous en coûter 0,75.

    3. **Non-exclusivité.** Au maximum, exclusivité sur le circuit GMS surgelé que D sert effectivement,
    avec exclusion écrite et nommée de la marketplace et de la centrale régionale.

    4. **Engagement de volume ferme et symétrique.** Le volume engagé par D est contractuel sur toute
    la durée, avec indemnité à la charge de D en dessous de 90 % du volume engagé. Un engagement « indicatif
    » est un engagement inexistant : ne pas l''accepter comme contrepartie d''une remise ferme.

    5. **Pénalité de sortie : 300 k€ maximum**, dégressive au prorata des mois restants, et réciproque.

    6. **Préavis de déréférencement : 6 mois minimum**, par écrit, référence par référence.

    7. **Clause de revoyure prix** si le coût matière varie de plus de 8 %.


    **Interdiction absolue, sans exception et quel que soit l''ultimatum de D :** aucune signature d''un
    engagement de plus de 12 mois, aucune remise supérieure à 4 points, aucune pénalité supérieure à 300
    k€, aucune exclusivité couvrant la marketplace ou la centrale régionale.


    Si D refuse l''enveloppe, **la réponse est non**, et ce non est ma décision, prise aujourd''hui, pas
    la vôtre. Vous n''avez pas à la porter.


    **Modalité de signature :** unanimité des quatre membres du CODIR requise pour signer. Toute autre
    décision de la présente note : trois voix sur quatre.


    ## 3. Calendrier des huit jours


    - **J+1 (Directeur commercial) :** envoi de la lettre de contre-proposition (projet en annexe, à valider
    par le DAF). Ton : partenariat, pas conflit. Message : « nous voulons sécuriser vos volumes sur 12
    mois, voici à quelles conditions économiques c''est soutenable pour nous ».

    - **J+1 (DAF) :** saisine du conseil externe en droit de la distribution. Notre relation est ancienne
    et représente 62 % de notre CA ; la baisse de 11 % au T2 sans préavis et la menace de déréférencement
    de la moitié de nos références relèvent potentiellement de la rupture brutale de relations commerciales
    établies (art. L442-1 II c. com.). Objectif immédiat : **lettre de réserves documentant la relation,
    les volumes historiques et la baisse du T2**, envoyée avant le comité d''achat de septembre. À valider
    par le conseil, mais l''ordre de grandeur compte : l''indemnisation d''une rupture brutale se calcule
    sur marge brute × durée de préavis, et un préavis de 12 à 18 mois sur cette relation représenterait
    4,6 à 6,9 M€. **Cela plafonne le coût réel d''un refus** et change le rapport de force de la négociation.
    Ne pas brandir ce levier ; le constituer.

    - **J+2 (Directeur commercial + Directeur industriel) :** chiffrage exact de l''exposition des 4 références
    menacées — CA, marge brute, tonnage, part du plan de charge de Redon. Ce chiffre conditionne les seuils
    de la section 5 ; sans lui, vous pilotez à l''aveugle. Diffusion à l''ensemble du CODIR.

    - **J+3 (DAF) :** ouverture de la négociation d''une ligne de crédit confirmée ou d''un contrat d''affacturage
    de 1,5 M€. **À faire cette semaine, avant toute nouvelle négative.** Une banque prête quand la nouvelle
    est bonne ; ce point est irréversible dans le temps et c''est la plus grosse erreur possible que de
    le reporter.

    - **J+6 :** point CODIR. Si D n''a pas répondu, relance écrite fixant J+8 comme échéance de notre
    propre offre.

    - **J+8 :** décision selon l''arbre de la section 5.


    ## 4. Plan de continuité — inconditionnel


    Ces actions se déclenchent **que D signe ou non**. Notre problème n''est pas le contrat de D, c''est
    notre dépendance à 62 % : c''est elle qui permet à D de nous poser cet ultimatum, et elle sera identique
    dans douze mois si nous ne bougeons pas.


    **Marketplace (Directeur commercial) — lancement sous 3 semaines.** Périmètre minimal : les 3 références
    à plus forte rotation, pas les 8. Budget plafonné à **120 k€**, dont 40 k€ d''acquisition. Objectif
    plancher an 1 : 0,4 M€. À +6 points de marge, la fourchette 0,4–2,2 M€ vaut 0,15 à 0,81 M€ de marge
    brute. Point de contrôle à 8 semaines : si le CA cumulé est inférieur à 25 k€, on arrête et on ne
    dépense pas le solde du budget.


    **Centrale régionale (Directeur commercial) — ne pas attendre cinq mois.** Proposer dès cette semaine
    un pilote sur 2 références, en volume limité, sans attendre le référencement complet. Un pilote signé
    transforme un dossier en cours en preuve d''existence d''un second canal, ce qui vaut autant en négociation
    avec D qu''en chiffre d''affaires. Potentiel plein : 3,5 M€, soit 1,09 M€ de marge brute.


    **Redon (Directeur industriel) — dès maintenant.** Établir le plan de charge prévisionnel glissant
    à 8 semaines, mis à jour chaque lundi et diffusé au CODIR. Identifier les leviers de flexibilité mobilisables
    avant le chômage partiel : lissage des séries, sous-traitance entrante, décalage de maintenance, congés.


    **DRH — dès maintenant.** Constituer le dossier d''activité partielle et le tenir prêt à déposer.
    Ne pas le déposer aujourd''hui. Informer le CSE de l''ouverture d''une négociation commerciale structurante,
    sans détailler le contenu du contrat.


    ## 5. Arbre de décision à J+8 — appliquer littéralement


    **Cas A — D accepte l''enveloppe (ou contre-propose à l''intérieur).** Signer. Unanimité du CODIR.
    Ne pas chercher à me joindre. Déployer le plan de continuité de la section 4 malgré tout.


    **Cas B — D contre-propose à l''extérieur de l''enveloppe.** Ne pas signer. Répondre par écrit : notre
    offre reste ouverte 30 jours, nous continuons à livrer normalement, nous ne signons pas d''exclusivité.
    Passer en cas C.


    **Cas C — D refuse et maintient la menace de déréférencement.** Ne pas signer. Actions immédiates
    :

    1. Lettre de continuité à D : nous honorons toutes les commandes, aux conditions actuelles, sans interruption.
    On ne se retire de rien.

    2. Envoi de la lettre de réserves préparée par le conseil, avant le comité d''achat de septembre.

    3. Accélération du pilote centrale régionale et du lancement marketplace, budget marketplace relevé
    à 180 k€ sur décision à trois voix.

    4. Application des seuils ci-dessous.


    **Seuils observables — automatiques, sans délibération :**


    | Déclencheur | Action | Responsable |

    |---|---|---|

    | Trésorerie < 1,5 M€ | Gel de tout investissement et de tout recrutement ; activation de l''affacturage
    | DAF |

    | Trésorerie < 1,1 M€ | Dépôt du dossier d''activité partielle ; information formelle du CSE | DRH
    |

    | Plan de charge prévisionnel < 75 % sur 8 semaines glissantes | Dépôt du dossier d''activité partielle
    (le seuil de 70 % est le seuil d''effet, pas le seuil d''action : l''instruction prend des semaines)
    | Dir. industriel |

    | Plan de charge < 70 % | Activation du chômage partiel à Redon | Dir. industriel + DRH |

    | Trésorerie < 0,8 M€ **ou** perte de plus de 30 % du volume D | Convocation du conseil ; le CODIR
    ne décide plus seul au-delà de ce point | DAF |


    **Interdictions pendant mon absence :** aucune cession d''actif, aucun licenciement économique, aucune
    modification de l''outil industriel de Redon, aucune communication externe sur le litige D. Le chômage
    partiel est réversible ; ces quatre décisions ne le sont pas et m''attendent.


    ## 6. Ce qui renverserait cette décision


    Une seule chose : **si D transforme son engagement de volume en engagement ferme, contractuel et sanctionné
    sur les trois années.** Dans ce cas, et dans ce cas seul, une remise pouvant aller jusqu''à 4,7 points
    sur toute la durée devient économiquement défendable, et le CODIR est autorisé à signer sur 36 mois
    — à condition que la clause de non-exclusivité de la marketplace et de la centrale soit maintenue
    et que la pénalité de sortie reste sous 300 k€. Le déséquilibre que je refuse est prix ferme contre
    volume indicatif, pas la durée en elle-même.


    Second signal, à consigner sans y répondre : si D exige une signature sous huit jours en refusant
    toute discussion sur l''enveloppe, c''est une information sur la relation, pas sur le contrat. Elle
    confirme la décision au lieu de l''affaiblir.


    ## 7. Le meilleur argument contre cette note


    Il faut que vous l''ayez lu de ma main plutôt que de le découvrir en séance : en refusant, nous échangeons
    une perte certaine de 0,75 M€ contre une perte possible de 1,4 à 2,3 M€ de marge si les quatre références
    tombent en septembre, avec le plan de charge de Redon qui passe sous les 70 % et 52 postes en chômage
    partiel — et vous encaisserez cela sans moi.


    Il ne tient pas, pour quatre raisons. La signature ne supprime pas ce risque, elle le décale de douze
    mois, puisque le volume n''est engagé qu''un an. L''exclusivité interdit précisément les deux canaux
    qui sont la seule réponse structurelle à ce risque. La pénalité de 1,2 M€ transforme une mauvaise
    année en année sans issue. Et le déréférencement brutal de la moitié de nos références, après 62 %
    de dépendance et une baisse de 11 % sans préavis, a un coût juridique pour D que le refus nous permet
    de faire valoir et que la signature nous ferait abandonner.


    Le chômage partiel est douloureux et il est réversible. Trois ans d''exclusivité à marge négative
    avec 1,2 M€ de barrière de sortie ne le sont pas. Entre une perte récupérable et une perte irrécupérable,
    on choisit la première, même quand elle est plus visible.


    ## 8. Première action


    Directeur commercial : lettre de contre-proposition à D, demain, avant midi. DAF : appel au conseil
    juridique et rendez-vous bancaire, demain.


    Vous avez ma confiance pleine et entière dans l''enveloppe définie. En dehors, la réponse est déjà
    écrite : c''est non.


    *Le Directeur général*


    ---


    **Une chose que je n''ai pas pu faire à votre place :** la part exacte des 4 références menacées dans
    le CA de D et dans le plan de charge de Redon. Toute la section 5 se calibre dessus, et c''est pour
    ça que ce chiffrage est en J+2 et pas plus tard. Si cette part dépasse 55 % du volume de D, remontez
    le seuil de convocation du conseil de 30 % à 20 % de perte de volume.


    Voulez-vous que je rédige aussi le projet de lettre de contre-proposition à D mentionné en annexe,
    et la lettre de réserves ?

    '
