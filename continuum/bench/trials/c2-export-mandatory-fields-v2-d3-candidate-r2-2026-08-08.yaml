response:
  text: "Voici la note. Elle est écrite pour être appliquée telle quelle, sans interprétation.\n\n---\n\
    \n# NOTE D'ARBITRAGE — DÉCISION ARRÊTÉE, EXÉCUTION DÉLÉGUÉE\n\n**De :** Direction générale — **Aux\
    \ :** membres du comité de direction (DAF, DC, DI, DRH)\n**Objet :** Offre d'exclusivité du distributeur\
    \ D — décision prise, mandat d'exécution\n**Date :** 8 août — **Validité :** jusqu'à mon retour, le\
    \ 25 août\n**Régime :** ce document est un mandat, pas un ordre du jour. Il n'y a rien à rediscuter\
    \ en comité. Vous exécutez.\n\n---\n\n## 1. La décision\n\n**Nous ne signons pas le contrat d'exclusivité\
    \ de D, ni sous sa forme actuelle, ni sous une forme amendée qui conserverait une clause d'exclusivité\
    \ ou une pénalité de sortie.**\n\n**Nous ne laissons pas non plus le délai expirer en silence.** Une\
    \ contre-proposition écrite, que j'ai signée ce soir, part chez D le **13 août**, avec accusé de réception\
    \ et copie mail à l'acheteur et à son directeur. Elle doit être entre leurs mains avant l'échéance\
    \ des huit jours et être portée à leur comité d'achat du 20 août. Ses termes sont arrêtés ci-dessous\
    \ et ne sont pas modifiables en mon absence.\n\n## 2. Pourquoi — pour que vous puissiez le défendre\
    \ sans moi\n\nLe défaut du contrat n'est pas la remise de 9 %. C'est que **le prix et l'exclusivité\
    \ sont fermes sur trois ans, alors que le volume n'est ferme que sur un an.** Nous cédons une certitude\
    \ contre une indication.\n\nSur nos chiffres (14,9 M€ chez D, 31 % de marge brute, soit 4,62 M€) :\n\
    \n| | Marge brute D | Écart / aujourd'hui |\n|---|---|---|\n| Aujourd'hui | 4,62 M€ | — |\n| An 1\
    \ signé (+18 % vol., −9 % prix) | 3,87 à 4,61 M€ | −0,75 M€ à **0** |\n| An 2–3, volume revenu à la\
    \ base | 3,28 M€ | **−1,34 M€ / an** |\n| An 2–3, nouvelle coupe de 11 % | 2,47 à 2,92 M€ | **−1,70\
    \ à −2,15 M€ / an** |\n\nLa fourchette de l'an 1 dépend de la part fixe de notre coût de revient :\
    \ à coûts 100 % variables la marge recule de 0,75 M€ ; à 60/40 variable/fixe elle est **exactement\
    \ au point mort**. Ce n'est probablement pas un hasard : sous cette structure, le volume qui annule\
    \ précisément la remise de 9 % est de **+18,15 %**. L'offre de D semble calibrée pour ne rien nous\
    \ laisser la première année et nous coûter 1,34 M€ par an les deux suivantes. **Contrôle de gestion\
    \ : je veux ce ratio variable/fixe vérifié et écrit pour le 11 août.** S'il est proche de 60/40, cette\
    \ phrase figure dans la lettre à D.\n\nLe volume qui rendrait la remise de 9 % neutre à coûts variables\
    \ est de **+41 %**, pas +18 %.\n\nEt surtout : l'exclusivité nous interdit de compenser. Une coupe\
    \ comme celle du T2 — 11 %, sans préavis, déjà survenue une fois — devient, sous exclusivité, une\
    \ perte que la loi du contrat nous empêche de remplacer. La sortie coûte 1,2 M€, soit 57 % de notre\
    \ trésorerie.\n\n**L'asymétrie décisive : refuser produit un dommage réversible — du chômage partiel,\
    \ qu'on arrête. Signer crée un dommage irréversible — trois ans sans droit de compenser, avec trois\
    \ mois de trésorerie.** Nous ne troquons pas une trésorerie de trois mois contre une interdiction\
    \ de trois ans.\n\n## 3. Le meilleur argument contre ma décision, et pourquoi je le rejette quand\
    \ même\n\nIl est réel et le DAF a raison de le porter : **+18 % de volume remplit Redon pendant douze\
    \ mois et met 52 postes à l'abri pendant un an.** Si notre coût est majoritairement fixe, l'an 1 ne\
    \ nous coûte rien et achète la paix sociale.\n\nJe le rejette pour une seule raison : cet argument\
    \ est vrai douze mois et faux trente-six. Il achète un an de plan de charge au prix de deux ans de\
    \ marge amputée **et** de l'interdiction de reconstruire un canal pendant ce temps. On ne sécurise\
    \ pas un site en supprimant les moyens de le sauver l'année suivante.\n\n## 4. La contre-proposition\
    \ — termes non négociables en mon absence\n\n**Le principe, à répéter tel quel à D : la remise suit\
    \ le volume, marche par marche. Nous payons pour ce qui est livré, pas pour ce qui est espéré.**\n\
    \nCe que nous offrons :\n- **2 points de remise inconditionnels** dès la signature (≈ 300 k€/an, c'est\
    \ notre geste réel) ;\n- **+1 point par tranche de 5 % de croissance de volume constatée au-delà de\
    \ +5 %**, appliqué rétroactivement sur le trimestre facturé, **plafonné à 9 points à +40 %**. La remise\
    \ de 9 % que D demande, D l'obtient — au volume où elle se finance ;\n- **grille de prix de 12 mois**,\
    \ revue annuelle, **sans exclusivité, sans pénalité de sortie, sans engagement de durée sur le prix**\
    \ ;\n- **préavis contractuel de 90 jours** pour toute réduction de prévision supérieure à 5 % ; à\
    \ défaut, la remise retombe à 2 points le trimestre suivant. C'est la réponse au T2 ;\n- statut de\
    \ **partenaire principal non exclusif**, affiché comme tel.\n\nCe que nous leur donnons de réel, et\
    \ qui n'est pas de la consultation :\n- **capacité ferme réservée sur Redon** : 65 % de la capacité\
    \ du site, taux de service garanti 98 %, horizon ferme de 6 semaines ;\n- **priorité d'exclusivité\
    \ de 12 mois sur toute nouvelle référence co-développée avec eux** ;\n- **revue de plan trimestrielle\
    \ conjointe**, calcul de la remise indexée en livre ouvert.\n\nIls obtiennent la sécurité d'approvisionnement,\
    \ l'antériorité sur l'innovation et la visibilité. Ils n'obtiennent pas la fermeture de nos canaux.\n\
    \n## 5. Ce qui est délégué, et jusqu'où\n\n**Le DC et le DAF, conjointement et par signature des deux,\
    \ peuvent conclure sans moi** tout accord qui respecte cumulativement :\n1. aucune clause d'exclusivité,\
    \ de non-concurrence de canal, ni de pénalité de sortie, quel qu'en soit le montant ;\n2. durée des\
    \ conditions de prix ≤ 12 mois ;\n3. coût annuel total des concessions, calculé au volume des 12 derniers\
    \ mois, **≤ 300 k€ de marge brute** ;\n4. clause de préavis de 90 jours présente.\n\n**Plafond majoré,\
    \ activable sans moi dans un seul cas :** si la quantification du 11 août établit que les 4 références\
    \ menacées pèsent **plus de 30 % du CA total de Verdal** avec un déréférencement effectif avant le\
    \ 31 octobre, le plafond du point 3 passe à **600 k€** et la durée du point 2 à **24 mois**. Les points\
    \ 1 et 4 restent intacts. Sans exception, sans urgence, sans exception liée à l'urgence.\n\n**Hors\
    \ de ces bornes, personne ne signe.** Vous envoyez la lettre d'offre permanente (« notre proposition\
    \ reste ouverte jusqu'au 30 septembre ») et vous attendez mon retour. Un accord non conclu se rattrape\
    \ ; une exclusivité signée, non.\n\n**Ce qu'aucun d'entre vous n'a le pouvoir de faire :** signer\
    \ une exclusivité ou une pénalité ; engager Verdal au-delà de 24 mois ; annoncer une fermeture de\
    \ site ; procéder à un licenciement ; communiquer à la presse ; modifier les termes de la lettre du\
    \ 13 août.\n\n## 6. La visite de l'acheteur de D\n\nElle est acceptée, et **son format est imposé**.\
    \ Ce déplacement est une manœuvre : il vise un comité divisé, dont il sait le désaccord écrit, en\
    \ l'absence de l'arbitre. Nous le recevons parce que nous voulons ses réponses, pas parce que nous\
    \ voulons ses arguments.\n\n- **Il n'est pas reçu par le comité de direction.** Il est reçu par le\
    \ DC et le DAF, ensemble, une heure, ordre du jour envoyé la veille. Le DI, le DRH et le contrôle\
    \ de gestion ne sont pas dans la salle.\n- **Aucune réponse, aucun chiffre, aucune réaction n'est\
    \ donnée pendant la réunion.** Formule unique : « Notre position écrite vous parviendra le 13. »\n\
    - **Sortent de la salle six questions, réponses écrites exigées avant le 16 août :**\n 1. Quelle partie\
    \ est engagée sur le +18 % ? Quelle sanction en cas d'écart, de part et d'autre ?\n 2. Que pèsent\
    \ les 4 références menacées, en CA 12 mois glissants et en volume ? Quelle date d'effet du déréférencement\
    \ ?\n 3. Quel préavis D accepte-t-il de contractualiser après la coupe de 11 % du T2 ?\n 4. Les 9\
    \ % portent-ils sur les 8 références ou sur les 4 conservées ?\n 5. Que couvre exactement l'exclusivité\
    \ : canaux, zones, MDD, vente directe, marketplace ?\n 6. **D accepte-t-il d'indexer la remise sur\
    \ le volume réellement facturé ?**\n\nLa question 6 est le test. **Si D accepte l'indexation, le contrat\
    \ devient bon et vous le signez sans moi dans les bornes du § 5. Si D refuse d'indexer, D nous dit\
    \ que les volumes des années 2 et 3 n'existent pas.** La réponse de D est l'information que nous n'avons\
    \ pas ; elle vaut plus que sa visite.\n\n- **Compte rendu écrit dans les 24 h**, diffusé aux quatre\
    \ destinataires de cette note. Aucun échange bilatéral avec D en dehors de ce cadre, par personne,\
    \ y compris téléphonique.\n\n## 7. En parallèle, à lancer immédiatement\n\n| Quoi | Qui | Pour le\
    \ |\n|---|---|---|\n| Poids exact des 4 références (CA, volume, marge, part de charge Redon) + ratio\
    \ variable/fixe | DAF + contrôle gestion | **11 août** |\n| Ligne de crédit confirmée 1,5 M€ (revolving\
    \ ou Dailly), négociée sur les comptes actuels | DAF | **22 août** |\n| Marketplace : contrat signé,\
    \ 4 références menacées en ligne les premières | DC | **31 août** |\n| Centrale régionale : demande\
    \ d'avis intermédiaire écrit + offre chiffrée déposée | DC | **20 août** |\n| Plan de charge Redon\
    \ glissant 12 semaines, actualisé chaque lundi | DI | hebdo |\n| Dossier activité partielle constitué,\
    \ non déposé | DRH | **18 août** |\n\nLa ligne de crédit se négocie **avant** que le déréférencement\
    \ soit connu, pas après. C'est la mesure la plus rentable de cette liste.\n\n## 8. Redon — déclencheurs\
    \ et replis\n\nAucune de ces décisions ne nécessite mon arbitrage. Elles se déclenchent seules, sur\
    \ observation chiffrée.\n\n- **Plan de charge projeté < 78 % à 8 semaines** → phase 1 : arrêt de l'intérim,\
    \ avancement de la maintenance et de l'inventaire, pose des congés, redéploiement sur les échantillons\
    \ marketplace et centrale. Décidé par le DI, informé au comité.\n- **Plan de charge projeté < 70 %\
    \ à 6 semaines** → dépôt du dossier d'activité partielle et information du CSE, par le DRH, sans attendre\
    \ mon retour. Le chômage partiel est un outil, pas un échec ; il est réversible.\n- **Nouvelle réduction\
    \ unilatérale de commandes par D > 10 %** → mise en demeure écrite sous 48 h, et bascule immédiate\
    \ des références concernées sur la marketplace.\n- **D retire toute son offre et déréférence au-delà\
    \ des 4 références** → aucune réaction en urgence, aucune contre-offre improvisée. Vous constatez,\
    \ vous documentez, vous appliquez les deux déclencheurs ci-dessus. Le sujet m'attend le 25.\n\n**Pire\
    \ cas de ma décision, et qui l'encaisse :** 4 références déréférencées le 20 août, jusqu'à ~7,4 M€\
    \ de CA exposé si elles pèsent le quart de notre activité, Redon sous 70 %, **52 postes en activité\
    \ partielle**. Ce sont les salariés de Redon qui encaissent d'abord, avant les actionnaires. Je l'écris\
    \ parce que vous devrez le porter. Ce coût est indemnisé, borné dans le temps, et réversible dès que\
    \ la marketplace et la centrale montent en charge. Celui de l'autre branche ne l'est pas.\n\n## 9.\
    \ Ce qui prouverait que j'ai eu tort\n\nSi le contrôle de gestion établit le 11 août que notre coût\
    \ de revient est majoritairement fixe **et** que D accepte le 16 août d'indexer la remise sur le volume\
    \ pour les années 2 et 3, alors l'opération est bonne et ma réticence était mal calibrée — et vous\
    \ signerez, dans les bornes du § 5, sans moi. Ma contre-proposition n'est pas une posture : c'est\
    \ l'expérience qui départage.\n\nInversement, ce qui ne prouve rien : que l'acheteur soit convaincant,\
    \ que le délai soit court, que le comité reste divisé, ou que D se dise déçu.\n\n## 10. Le désaccord\
    \ au sein du comité\n\nIl est écrit, il est légitime, il est clos par cette note.\n\n- Le **DC** conduit\
    \ la relation avec D et rédige toute correspondance.\n- Le **DAF** dispose d'un droit de veto sur\
    \ les seuls engagements de trésorerie et sur le calcul du plafond de 300/600 k€. Il n'a pas de voix\
    \ sur l'exclusivité : elle est refusée par moi.\n- **Toute lettre à D porte les deux signatures.**\
    \ L'un sans l'autre n'engage pas Verdal.\n- **En cas de blocage entre vous, la règle par défaut s'applique\
    \ : on ne signe pas, on envoie la lettre d'offre permanente, on attend le 25 août.** L'absence d'accord\
    \ ne produit jamais une signature.\n- Le **DRH** tient le registre des décisions : date, fait déclencheur,\
    \ décision, signataires. Je le lis le 25.\n\n## 11. Communication\n\nUn seul porte-parole, le DC.\
    \ Message unique, interne comme externe : *« La direction générale a arrêté sa position ; le comité\
    \ est mandaté pour l'exécuter ; nos termes sont sur la table depuis le 13 août. »*\n\n**Personne ne\
    \ dit que je suis injoignable.** Je suis en déplacement industriel et le mandat est écrit. Un contradicteur\
    \ qui apprend qu'il peut attendre attendra.\n\n---\n\n*Ce document tient lieu de décision. Il est\
    \ appliqué en l'état.*\n**Direction générale — 8 août**\n\n---\n\nDeux points sur ce que j'ai supposé,\
    \ pour votre lecture : le partage variable/fixe du coût de revient (60/40 testé, à vérifier — c'est\
    \ la seule vraie inconnue du raisonnement chiffré), et le poids des 4 références menacées, que l'énoncé\
    \ ne donne pas et dont dépend le plafond majoré du § 5. Les deux sont des actions datées de la note,\
    \ pas des angles morts. Le reste des calculs découle des chiffres que tu m'as donnés.\n"
