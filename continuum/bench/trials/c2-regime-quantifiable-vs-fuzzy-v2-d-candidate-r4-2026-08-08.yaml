response:
  text: '# Note au conseil — jeudi


    **Enveloppe 900 000 €. Décision proposée : les deux dossiers sont engagés. Ils ne sont pas en concurrence.**


    ---


    ## 1. Ce que le conseil décide


    | Ligne | Montant | Ce que ça rapporte ou évite, par an | Solidité du chiffre |

    |---|---|---|---|

    | Parc d''usinage — 6 machines | 620 000 € | 56 400 € constatés + gain rebut à confirmer (voir §4)
    | **Forte** — 5 ans de maintenance horodatée et auditée, nos livres |

    | Mission de transition du directeur qualité, 12 mois | 90 000 € | Non chiffrable | Décidé sur l''irréversibilité,
    pas sur un rendement |

    | Promotion de l''adjointe au poste de directrice qualité | 45 000 € | Non chiffrable | idem |

    | Reprise du poste d''adjointe qu''elle libère | ~100 000 € (provision) | — | **À chiffrer par les
    RH avant jeudi** — cette ligne ne figure dans aucune des trois pistes |

    | **Total engagé** | **855 000 €** | | |

    | Solde | 45 000 € | Premier appel si le devis de reprise dépasse la provision | |


    Recrutement externe (280 000 €) : **écarté à ce stade**, conservé comme repli (§5).


    ## 2. Pourquoi je ne fournis pas le tableau unique demandé


    Le classement demandé décide de lui-même : si l''on entre la cotation du cabinet RH, 4,2 M€ × 35 %
    = 1,47 M€ de perte espérée place le dossier B très au-dessus de tout le reste, et le conseil aura
    tranché sur ce nombre.


    Or ce nombre a été produit en atelier par trois consultants n''ayant jamais travaillé dans le dispositif
    médical, sans comparable sectoriel — l''énoncé le précise — et sur une entreprise qui n''a jamais
    changé de directeur qualité. Ni la probabilité ni le montant ne reposent sur une observation. Le dossier
    A, lui, repose sur cinq ans de relevés audités. Les classer sur le même indicateur, c''est laisser
    le chiffre le moins solide commander la ligne la plus solide.


    **Surtout : l''arbitrage n''existe pas.** 620 000 + 235 000 = 855 000 € sur 900 000 €. Les deux dossiers
    passent. La question n''est pas « lequel », mais « à quelles conditions chacun ».


    *Point à vérifier auprès de la direction financière avant jeudi : les 45 000 € et une part des 100
    000 € sont de la masse salariale récurrente. Si cette enveloppe non reconductible ne les couvre pas,
    ils relèvent du budget d''exploitation et le solde disponible augmente d''autant.*


    ## 3. Dossier B — la seule échéance qu''on ne peut pas déplacer


    Les machines peuvent attendre six mois. Le départ, non : 11 mois, date connue.


    Ce qui est exposé n''est pas une perte espérée, c''est **31 % du chiffre d''affaires** et l''agrément
    d''un organisme notifié qui reconnaît une personne, pas une fonction. Pour une entreprise de 140 salariés,
    cette branche n''est pas une mauvaise année, c''en est une dont on ne revient pas. Face à cela, la
    couverture coûte 235 000 €, soit 26 % de l''enveloppe. Quelle que soit la probabilité — y compris
    très inférieure à 35 % — le rapport entre le prix de la couverture et l''exposition rend la dépense
    évidente. **Nous n''avons pas besoin du chiffre du cabinet pour décider, ce qui est heureux : il n''est
    pas utilisable.**


    Le montage promotion + mission donne 23 mois de recouvrement (11 mois en poste, 12 mois de mission)
    et transfère une autorité réelle, pas une consultation : dès le mois prochain, l''adjointe signe,
    dirige les audits internes et est déclarée à l''organisme notifié comme interlocutrice. Le titulaire
    accompagne. **La mission lui interdit explicitement de représenter l''entreprise devant l''organisme
    notifié ou devant les deux clients** — sinon nous payons 90 000 € pour reconduire la dépendance que
    nous cherchons à sortir.


    ## 4. Dossier A — solide, sous réserve d''un chiffre que nous avons


    Constaté sur 5 ans : 42 600 €/an de coût direct de panne, plus 13 800 €/an de marge perdue (1 810
    h × 38 €). Total **56 400 €/an**. Sur les 620 000 €, cela seul rembourse en 11 ans : insuffisant.


    Ce qui fait basculer le dossier, c''est le rebut, 4,1 % contre 1,2 % garanti. Pour que le parc complet
    se rembourse dans les 7 ans couverts par la garantie fournisseur, ce gain doit valoir **au moins 32
    000 €/an**, soit 2,9 points sur environ 1,1 M€ de production annuelle passant par ces six machines.
    **Le contrôle de gestion sort ce chiffre en 48 heures.** S''il dépasse 1,1 M€ — ce qui est probable
    — le parc complet est engagé jeudi. Sinon, nous engageons la tranche des trois machines qui concentrent
    le plus d''heures d''arrêt (les relevés horodatés permettent ce classement, les conditions unitaires
    sont identiques) et le solde va au dossier B et à la métrologie.


    Deux questions au fournisseur avant signature : **sur quelle base horaire les 96 % sont-ils calculés
    ?** Nos 362 h d''arrêt annuelles représentent déjà une disponibilité proche de 96 % — l''engagement
    pourrait ne garantir que l''existant. Et quel est le coût de maintenance des machines neuves, que
    je n''ai pas déduit des 56 400 € ?


    ## 5. Ce qui renverserait ces décisions, et le repli


    - **Sur B** : nous demandons aux deux clients hospitaliers, avant fin du mois, leur réaction à un
    successeur nommé. S''ils indiquent que la relation tient à l''homme et non à l''entreprise, ou si
    l''organisme notifié refuse l''adjointe, le repli est le recrutement externe, lancé immédiatement.
    Il n''a pas à être préfinancé ici : c''est de la masse salariale sur deux exercices.

    - **Déclencheur observable** : l''audit de surveillance conduit par l''adjointe pendant que le titulaire
    est encore en poste. Réserve majeure ou refus de l''organisme notifié → repli armé le jour même.

    - **Sur A** : le chiffre de rebut sous 1,1 M€ de production → tranche au lieu du parc complet.

    - **Risque assumé** : l''adjointe a 3 ans d''ancienneté. C''est le point faible de cette note. Il
    est testable dans les 11 mois qui restent, avec le titulaire présent — ce qui ne sera plus jamais
    le cas.


    ## 6. Premières actions


    1. **Lundi** — contrôle de gestion : valeur du rebut passé par ces six machines sur 12 mois. Direction
    financière : éligibilité des lignes salariales à cette enveloppe.

    2. **Lundi** — RH : devis de reprise du poste d''adjointe.

    3. **Jeudi, au conseil** — nomination de l''adjointe, signature de la mission de transition avec ses
    restrictions, engagement du parc selon le chiffre de rebut.

    4. **Sous 15 jours** — notification du changement d''interlocuteur à l''organisme notifié ; rendez-vous
    avec les deux directions hospitalières.

    '
