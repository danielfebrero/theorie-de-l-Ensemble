  text: '## Analyse chiffrée (le seuil qui décide de tout)


    Un point de taux de retour = 80 000 × 1 % × 210 € = **168 000 €/an**.

    L''économie Sinolux (240 000 €) est donc absorbée par **+1,43 point** de retours.


    **Seuil de bascule : 2,63 %.** En dessous, Sinolux gagne ; au-dessus, Sinolux coûte de l''argent.


    | Taux Sinolux réel | Source | Gain/perte net vs Kelmar |

    |---|---|---|

    | 1,0 % | essais Sinolux | **+273 600 €** |

    | 1,5 % | bas de fourchette ingénieurs | +189 600 € |

    | 2,25 % | milieu ingénieurs | +63 600 € |

    | **2,63 %** | **seuil** | **0 €** |

    | 2,9 % | audit sectoriel mars | −45 600 € |

    | 3,0 % | haut de fourchette ingénieurs | −62 400 € |


    Le point décisif : la seule source qui place Sinolux nettement du bon côté du seuil est **le fournisseur
    lui-même**. L''audit indépendant et le haut de la fourchette de nos ingénieurs sont du mauvais côté.
    On ne sait pas — et 9 500 € achètent la réponse pour 4 % de l''enjeu.


    ---


    # NOTE AU COMITÉ DE DIRECTION

    **Objet : contrat cellules 2027 (80 000 unités) — Kelmar ou Sinolux**

    **Date : lundi — Décision demandée : validation du protocole ci-dessous**


    ## Décision

    **Nous ne signons pas Sinolux cette semaine. Nous ne renonçons pas non plus à Sinolux.** Nous lançons
    dès demain le test de vieillissement Vertex (9 500 €, 1 200 cellules) et nous nous engageons dès aujourd''hui
    sur la règle de décision qui en découlera. Le choix sera arrêté au plus tard à **J+38**, avant les
    deux échéances fournisseurs.


    ## Pourquoi ce n''est pas un arbitrage de prix

    L''écart de 3 €/cellule vaut 240 000 €. Un point de taux de retour vaut 168 000 €. **Le contrat ne
    se joue pas sur le prix d''achat, il se joue sur 1,4 point de taux de retour.** Nos trois sources
    encadrent le seuil de bascule (2,63 %) au lieu de le trancher : 1,0 % (Sinolux), 1,5–3 % (nos ingénieurs),
    2,9 % (audit indépendant sur une ligne comparable du même fournisseur). Nous sommes à pile ou face
    sur une décision à ±300 000 €.


    Deux éléments pèsent dans la lecture : une mesure terrain indépendante prime sur des essais internes
    d''un vendeur, et **le refus de toute clause de garantie sur le taux de retour est en soi une information**
    — Sinolux refuse de porter un risque qu''il annonce à 1,0 %.


    ## Règle de décision, arrêtée avant de connaître le résultat

    Vertex prédit à ±0,3 point. Nous décidons sur la borne haute :


    - **Vertex ≤ 2,3 % → Sinolux**, commande ferme immédiate (marge de sécurité intégrée sur le seuil
    de 2,63 %).

    - **Vertex > 2,3 % → Kelmar**, sans discussion, y compris en zone intermédiaire : entre 2,3 % et 2,9
    % l''espérance de gain est proche de zéro alors que le risque reste entièrement chez nous, sans recours
    contractuel.

    - **Pas de résultat à J+35 → Kelmar par défaut**, commande passée à J+38.


    ## Calendrier — le test ne retarde rien

    11 jours ouvrés ≈ 15 jours calendaires ; résultat attendu vers **J+20**. Le prix Sinolux tient jusqu''à
    J+45, Kelmar exige la commande à J+50, la production démarre à J+60. Même si Vertex double son délai
    annoncé (aucun engagement contractuel de sa part), nous restons dans les temps. **Aucun jour n''est
    prélevé sur le chemin critique du lancement** : la préoccupation de la direction commerciale est légitime
    mais ne s''applique pas ici.


    ## Deux négociations à mener en parallèle, sans coût

    1. **Sinolux** : proposer une clause de partage — au-delà de 1,8 % de retours, Sinolux rembourse 210
    €/unité excédentaire, plafonné. S''ils acceptent, le risque est transféré et nous signons sans attendre.
    Leur réponse, quelle qu''elle soit, est de l''information.

    2. **Kelmar** : les informer qu''une qualification concurrente est en cours et demander un alignement.
    **1 € repris sur les 3 € = 80 000 €/an sans aucun risque** — la moitié du bénéfice espéré, obtenu
    sur le fournisseur dont le taux est prouvé depuis trois ans.


    ## Pire cas de l''option retenue, et qui l''encaisse

    Le pire cas du protocole est de dépenser 9 500 € et de conclure Kelmar : coût réel **9 500 €**, encaissé
    par les opérations. Le pire cas de la signature immédiate est un taux à 3 %, soit **−62 400 € sur
    l''année** et, surtout, 2 400 chargeurs repris chez nos clients — encaissés par le SAV et par la relation
    client, pas par la ligne budgétaire.


    **Repli en cours d''exécution (si Sinolux est retenu)** : suivi hebdomadaire du taux de retour sur
    les 10 000 premières unités livrées ; **franchissement de 2,3 % sur cette cohorte → arrêt des enlèvements
    et bascule sur Kelmar** pour le solde du volume, dans le cadre d''un accord de secours à négocier
    avant la commande.


    ## Ce qui renverserait cette note

    Que Sinolux accepte la clause de garantie décrite au point 1. Le risque cesse alors d''être le nôtre
    et la décision se prend sur le prix, c''est-à-dire en faveur de Sinolux.


    ## Point de sincérité budgétaire

    Les 240 000 € inscrits au budget de l''année **ne sont pas une économie acquise** : c''est le meilleur
    cas d''une distribution dont l''espérance, au milieu de la fourchette de nos ingénieurs, vaut environ
    64 000 €. Cette ligne doit être corrigée quelle que soit la décision de lundi. Une écriture comptable
    ne crée pas un fait industriel.


    ## Premières actions

    - **Mardi** : bon de commande Vertex, expédition des 1 200 cellules (Qualité).

    - **Mardi** : proposition de clause envoyée à Sinolux (Achats).

    - **Mercredi** : rendez-vous Kelmar sur l''alignement de prix (Achats).

    - **J+38** : décision arrêtée en comité restreint selon la règle ci-dessus.


    ---


    Deux points où j''ai tranché faute de donnée dans l''énoncé, à corriger si nécessaire : je compte
    une cellule par chargeur (80 000 chargeurs), et je traite les 210 € comme un coût complet mais hors
    atteinte réputationnelle — ce qui rend l''arbitrage légèrement favorable à Sinolux par construction.

    '
