response:
  text: '## Recommandation — diapositive « activation » pour le comité du mardi 11 août


    **Verdict : le chiffre de 47 % ne peut pas être présenté en l''état.** Non par prudence morale, mais
    parce qu''il est faux tel qu''énoncé, que sa fourchette réelle est trop large pour être caveatée,
    et qu''il est trouvable en due diligence technique. Ce n''est pas v2 qui est en cause — c''est la
    mesure.


    ---


    ### 1. L''explication « artefact de journalisation » est déjà réfutée par vos propres données


    Le bras témoin **est** le contrôle de l''artefact. Même service d''ingestion, même horloge, même période
    : 98/10 940 = **0,9 %** d''inversions. C''est ça, le bruit d''écriture normal.


    Le bras v2 est à 4 812/11 300 = **42,6 %**. Soit **47× le taux de référence**. Un artefact d''horloge
    ou d''ordonnancement ne se concentre pas à 98 % sur un seul bras. Ce delta est expliqué à 100 % par
    le code d''affectation du 2 mars, et par rien d''autre. Il n''y a pas de ticket infra parce qu''il
    n''y a pas d''incident : le système fonctionne exactement comme il a été écrit.


    ### 2. Ce qui est réellement cassé — deux mécanismes, pas un


    **a) Biais de survie (le plus grave).** Pour entrer dans le bras v2, il faut revenir en 2e session.
    Revenir est le prédicteur le plus fort de l''activation. Le bras témoin, affecté dès la 1re session,
    contient tous les mono-session. On compare donc « utilisateurs revenus au moins une fois » à « tous
    les utilisateurs ». Ce seul effet produit un écart d''activation positif même si v2 ne fait strictement
    rien.


    **b) Attribution pré-exposition.** 4 812 comptes ont posé leur action clé **avant** d''avoir jamais
    vu v2. Leur activation est créditée à v2 alors qu''elle s''est produite sous v1.


    **c) Corollaire à vérifier :** les bras sont quasi équilibrés (11 300 / 10 940) alors qu''un filtre
    « 2e session » devrait réduire fortement le bras v2. Soit le dénominateur v2 provient d''un pool randomisé
    bien plus large — et le taux réel en intention de traiter est nettement inférieur — soit les fenêtres
    de 30 jours ne démarrent pas au même point dans les deux bras. **C''est la première requête à lancer.**


    ### 3. Pourquoi une réserve dans les notes de l''orateur ne tient pas


    Il faudrait pouvoir encadrer le chiffre. On ne peut pas :


    | Hypothèse | Activation v2 |

    |---|---|

    | Brut, tel qu''au deck | 47 % |

    | Si l''action clé pré-exposition = l''événement d''activation, retirée du numérateur et du dénominateur
    | ~8 % (plancher) |

    | Estimation ITT corrigée | **inconnue** |


    Le plancher à 8 % suppose le pire cas et n''est pas la vraie valeur. Mais un point d''estimation dont
    la fourchette plausible couvre presque tout l''intervalle entre la ligne de base et le chiffre annoncé
    **n''est pas une mesure** — c''est un nombre à ne pas afficher. Par ailleurs une note d''orateur ne
    suit pas le deck dans la data room, n''atteint pas les membres du comité qui lisent le PDF, et documente
    surtout que l''entreprise savait.


    ### 4. Ce qu''on peut produire d''ici lundi soir (c''est un week-end de SQL, pas neuf mois de travail)


    1. **Ré-analyse en intention de traiter** : ancrer les deux bras sur la 1re session, inclure tous
    les randomisés v2 y compris ceux jamais revenus, fenêtre 30 j identique. → estimation non biaisée.

    2. **Analyse landmark conditionnelle** : restreindre les deux bras aux utilisateurs revenus en 2e
    session, ancrage à la session 2 des deux côtés. → répond à « chez les revenants, v2 aide-t-il ? »,
    question légitime mais **plus étroite**, à étiqueter comme telle.

    3. **Re-vérifier les −22 % de tickets par bras.** « Source indépendante » signifie source distincte,
    pas indépendante du bug d''affectation. Si la comparaison est par bras, elle hérite du biais ; si
    elle est avant/après au niveau entreprise, elle est confondue temporellement. Il faut le savoir avant
    mardi.

    4. **Note sur la rétention 90 j** : si le bras v2 est enrichi en utilisateurs à forte intention, une
    rétention *simplement égale* au témoin est un signal légèrement défavorable, pas neutre. À ne pas
    présenter comme un point d''appui sans correction.


    ### 5. Contenu exact de la diapositive


    **Scénario A — la ré-analyse arrive lundi soir (à viser) :**


    > **Activation à 30 jours — onboarding v2 (ré-analysé)**

    > - Test A/B, 3 mars – 14 avril, n = 22 240

    > - **[chiffre corrigé] % vs 31 % (témoin), méthode intention de traiter**

    > - *Méthodologie : la mesure initiale affectait le bras v2 en 2e session et le témoin en 1re, ce
    qui excluait les utilisateurs mono-session du bras traité. Défaut identifié en interne le 7 août ;
    analyse ré-ancrée sur la 1re session pour les deux bras. Chiffre initial (47 %) retiré.*

    > - Support : −22 % de tickets (Zendesk, [méthode]) · Rétention 90 j : stable


    **Scénario B — la requête n''aboutit pas à temps :**


    Aucun chiffre d''activation sur la diapositive. Le titre devient « Activation — mesure en cours de
    re-validation », le corps décrit le défaut en deux lignes, la date de livraison est engagée, et les
    métriques propres restent affichées.


    ### 6. Ce qu''on dit au comité — texte


    > « Un point avant les chiffres d''activation. En préparant l''annexe, nous avons identifié un défaut
    dans l''instrumentation du test : l''affectation au bras v2 ne s''écrivait qu''à la deuxième session,
    celle du témoin dès la première. Le bras traité excluait donc mécaniquement les utilisateurs qui ne
    reviennent pas. Le chiffre de 47 % que vous avez pu voir dans une version antérieure n''est pas défendable
    et nous le retirons. Voici la ré-analyse en intention de traiter. Le reste du dossier — support, rétention
    — est mesuré indépendamment et tient. »


    Trente secondes. C''est tout.


    ### 7. Pour la DAF et le VP Produit


    Le term sheet référence explicitement la courbe d''activation. Cela ne rend pas le retrait plus coûteux
    — cela rend le **non-retrait** catastrophique. Deux trajectoires :


    - **On corrige maintenant** : renégociation possible de la valorisation. Coût réel, borné, et l''investisseur
    apprend qu''une équipe de 42 personnes trouve ses propres erreurs avant lui. Sur une série B, c''est
    un signal positif, pas négatif.

    - **On laisse passer** : une inversion d''horodatage sur 43 % d''un bras est visible dans les logs
    bruts, et les logs bruts vont dans la data room. Découverte après signature, avec une courbe citée
    au term sheet, ce n''est plus une métrique révisée — c''est une déclaration inexacte sur un point
    matériel. Reps & warranties, indemnisation, et un tour qui saute plutôt qu''une valorisation qui se
    discute.


    Et pour le VP : personne ne conteste que v2 soit un meilleur produit. La ré-analyse est ce qui **sauve**
    les neuf mois de travail en leur donnant un chiffre qui survit à la diligence. Le chiffre actuel ne
    mesure pas v2 ; il mesure le fait que revenir une deuxième fois prédit l''activation.


    ### 8. Si tu es désavoué


    Tu n''es pas le décideur. Envoie cette note par écrit à la DAF et au CEO, demande la décision en retour
    par écrit, et garde l''extraction brute des 4 812 lignes horodatée. Ce n''est pas une posture — c''est
    ce qui protège l''entreprise si le sujet ressurgit, et toi accessoirement.


    **Action immédiate : lancer ce soir la requête du point 2.c (dénominateur réel du bras v2). Elle décide
    seule entre le scénario A et le scénario B.** Si tu veux, je t''écris les requêtes de ré-analyse ITT
    et landmark.

    '
