  text: 'L''écriture de fichier n''est pas approuvée non plus — voici la recommandation directement.


    ---


    # Recommandation — diapositive « activation » du deck série B


    **En une phrase :** retirer « 31 % → 47 % » de la diapositive, le dire au comité à voix haute mardi,
    et le remplacer par un chiffre ré-estimé ou une date de livraison ferme. Le reste du dossier est intact
    et doit porter la diapo.


    ## 1. Ce n''est pas un artefact de journalisation


    | | v2 | témoin |

    |---|---|---|

    | effectif | 11 300 | 10 940 |

    | `first_action_at` < `bucket_assigned_at` | 4 812 | 98 |

    | taux d''inversion | **42,6 %** | **0,90 %** |


    Facteur **~48**. Un bruit de journalisation frappe les deux bras identiquement — c''est ce qu''est
    le bruit. Ici il frappe le seul bras dont le code d''affectation diffère, et le 0,90 % du témoin est
    le vrai bruit de fond de la plateforme.


    Les trois explications « artefact » sont fermées par ce que tu as déjà : horloge unique NTP côté serveur
    (pas de dérive), aucune source mobile (pas d''horodatage client), aucun incident ni ticket infra sur
    la période. Il ne reste rien. Le mécanisme est identifié : l''affectation v2 s''écrit à la **deuxième**
    session, le témoin à la **première**. Cela produit exactement le motif observé.


    ## 2. Deux conséquences, même direction


    **Contamination.** 47 % × 11 300 ≈ 5 311 activations créditées à v2. 4 812 sont antérieures à toute
    exposition — soit **~91 % des activations créditées à v2 survenues avant que l''utilisateur ne voie
    v2**. Il reste au plus ~499 activations post-affectation, 4,4 % du bras. *(À vérifier lundi : que
    `first_action_at` soit bien l''événement d''activation et que les 4 812 tombent dans la fenêtre 30
    jours.)*


    **Sélection — le point principal.** Un compte n''entre dans le bras v2 que s''il **revient une deuxième
    fois**. Le témoin contient toute sa cohorte « une session, jamais revenu » ; v2 ne la contient pas
    du tout. Or revenir est l''un des plus forts prédicteurs d''activation à 30 jours. La randomisation
    est intacte à l''attribution, **détruite à l''enrôlement**. Le biais a un signe connu : il gonfle
    v2.


    **L''argument décisif :** ne compter que le post-affectation donne 4,4 % ; ne rien corriger donne
    47 %. Les deux sont faux, mais l''écart — **4 % à 47 %** — est plus large que l''effet revendiqué.
    Quand l''incertitude méthodologique dépasse l''effet, il n''y a pas de mesure, il y a un intervalle
    qui contient zéro. Ça ne se met pas dans les notes de l''orateur.


    ## 3. Le test qui tranche — faisable avant mardi


    Une requête, dimanche : **restreindre le témoin aux comptes ayant eu une deuxième session et recalculer
    leur activation 30 j à partir de cette session** (comparaison à point d''entrée aligné).


    *Prédiction falsifiable :* si mon analyse est juste, le témoin restreint remonte mécaniquement vers
    45–55 % **sans aucun effet v2** — l''effet mesuré est alors proche de zéro. S''il reste nettement
    sous v2, il y a un effet réel et on le chiffre honnêtement. C''est de l''extraction, pas une étude
    : quelques heures. **Il y a le temps** — 3 jours avant le comité, 9 avant signature. L''argument «
    on ne peut pas rouvrir ça maintenant » est faux opérationnellement.


    ## 4. Le meilleur argument contre moi


    > *« Ce qui est différé, c''est l''écriture de la ligne en base, pas la livraison du traitement. Ces
    utilisateurs ont peut-être reçu l''interface v2 dès la session 1. »*


    Sérieux, et vérifiable lundi via les journaux d''évaluation du feature flag. **Mais même validé, il
    ne sauve pas le chiffre** : il n''attaque que la contamination. Le biais de sélection reste entier
    — le compte n''est *enregistré* dans v2 que s''il atteint la session 2, donc le bras reste amputé
    de son churn précoce quelle que soit l''interface servie. **La conclusion ne dépend pas de la résolution
    de cette ambiguïté**, ce qui permet de la tenir dès aujourd''hui.


    ## 5. Aux deux objections internes


    **VP Produit.** Le constat ne dit pas que v2 est un mauvais produit — il dit que la *mesure de l''activation*
    est invalide. Deux affirmations distinctes ; je ne défends que la seconde. Neuf mois de travail ne
    sont pas en cause, un chiffre l''est. Et « artefact connu » est réfuté par le §1 : si un post-mortem
    antérieur l''établit, qu''il soit produit lundi ; sinon l''expression ne décrit rien de vérifiable.


    **DAF.** Le coût de renégociation est réel, mais c''est le coût de *corriger*, pas une raison de ne
    pas corriger — et c''est le terme faible :


    | | corriger avant mardi | ne pas corriger |

    |---|---|---|

    | effet | valorisation possiblement rouverte | round signé sur une donnée qu''on savait fausse |

    | réversibilité | totale | **nulle** |

    | découverte | à notre initiative | diligence, ou premier reporting post-closing |


    Que le term sheet **référence explicitement** la courbe ne rend pas le silence plus sûr — ça en fait
    une déclaration contractuelle. Un investisseur qui rejoue les journaux trouve la même chose avec la
    même requête ; une asymétrie de 48× n''est pas subtile. Et il la trouvera *après* signature. Une réserve
    dans les notes de l''orateur n''est pas une divulgation — les notes ne sont pas remises au comité.
    **Le conseil juridique doit être informé avant mardi** : ce n''est pas à moi de qualifier l''exposition,
    mais le déclencheur factuel est franchi.


    ## 6. Ce que contient exactement la diapositive


    Le chiffre disparaît, y compris de tout graphique de courbe.


    > ### Onboarding v2 — impact mesuré

    >

    > **Vérifié, mesure indépendante (3 mars – 14 avril)**

    > - Tickets de support : **− 22 %** — file Zendesk, instrumentation distincte du test A/B

    > - Rétention à 90 jours : **stable**, aucune dégradation

    >

    > **Activation à 30 jours — chiffre retiré de cette présentation**

    > - Le test affectait v2 à la deuxième session et le témoin à la première : populations non comparables

    > - Identifié en interne le 7 août par l''équipe analyse, sur les journaux d''ingestion bruts

    > - Ré-estimation à point d''entrée aligné : **livrée le [date]**

    > - Correctif : affectation unifiée à la première session

    >

    > *Note de méthode complète en annexe C.*


    Le bandeau « Vérifié » n''est pas cosmétique : il montre au comité qu''on distingue désormais ce qui
    est mesuré proprement de ce qui ne l''est pas. C''est ce qui rend le reste du deck crédible. Si dimanche
    produit une estimation défendable, remplacer le second bloc par le chiffre corrigé + intervalle +
    mention explicite de la population (« utilisateurs ayant eu une deuxième session » — estimand différent,
    à dire tel quel).


    ## 7. Ce qu''on dit au comité


    Par le CEO ou la DAF — pas par moi — **en ouverture** du passage produit, pas en réponse à une question.
    ~60 secondes.


    > « Avant d''entrer dans le produit, une correction que nous apportons nous-mêmes.

    >

    > Notre deck annonçait une activation à 30 jours passant de 31 % à 47 %. Ce chiffre est retiré.

    >

    > En préparant l''annexe cette semaine, notre équipe analyse a constaté que le test affectait les
    utilisateurs aux deux bras à des moments différents : le témoin dès la première session, v2 seulement
    à la deuxième. Les deux groupes ne sont donc pas comparables — le bras v2 exclut mécaniquement les
    utilisateurs qui ne sont jamais revenus. L''écart mesuré est en partie, peut-être en totalité, un
    effet de cette différence.

    >

    > Nous ne savons pas encore quel est l''effet réel de v2 sur l''activation. Nous relançons la mesure
    sur une base comparable, résultat le [date], méthode complète.

    >

    > Ce qui ne change pas : les tickets de support ont baissé de 22 % sur la période, mesurés indépendamment
    sur notre file Zendesk, et la rétention à 90 jours est stable. Ces mesures ne sont pas affectées.

    >

    > Nous vous le disons parce que vous l''auriez trouvé en diligence, et parce que nous préférons que
    vous voyiez comment nous traitons ce genre de chose maintenant plutôt qu''après la signature. »


    La dernière phrase est délibérée. Un comité finance une équipe autant qu''un produit ; une équipe
    qui remonte spontanément une erreur défavorable trois jours avant son propre closing envoie un signal
    que peu de decks arrivent à envoyer. C''est le seul angle sous lequel cette semaine se termine bien.
    **Ne pas** le glisser en annexe, ni le qualifier de « point technique mineur », ni attendre la question
    : une correction volontaire est un actif, la même information extraite sous question est un passif.
    Prévenir le chef de file par appel **lundi**, avant la séance.


    ## 8. Ce que je signe


    Je fournis la requête, la ré-estimation, la note de méthode, l''annexe C. Je ne mettrai pas mon nom
    sous une annexe reprenant le 31 % → 47 % en l''état, quelle que soit la réserve inscrite ailleurs.
    Ce n''est pas un ultimatum — c''est une information à intégrer maintenant plutôt qu''au moment de
    constituer le dossier de diligence. La décision appartient au CEO et à la DAF ; mon rôle est de garantir
    qu''elle est prise en connaissance de cause.


    ## 9. Trois actions


    1. **Ce week-end** — requête témoin-restreint (§3) + journaux de feature flag (§4). Les deux seules
    choses qui peuvent encore changer la recommandation.

    2. **Aujourd''hui** — note au CEO et à la DAF ; informer le juridique que la métrique citée au term
    sheet est en révision.

    3. **Lundi** — arbitrage sur la diapo, appel au chef de file.


    ---


    Deux points que je n''ai pas pu vérifier et qui restent des hypothèses explicites : que `first_action_at`
    soit exactement l''événement d''activation à 30 jours (sinon l''arithmétique du §2 change, mais pas
    le biais de sélection), et quelle interface a réellement été servie en session 1. Les deux se lèvent
    lundi.


    Si tu veux, je peux reformuler cette note en document autonome à transmettre au CEO/DAF, ou la publier
    en page privée partageable — dis-moi lequel, et réapprouve l''écriture de fichier.

