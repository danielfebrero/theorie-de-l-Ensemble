response:
  text: '# Note au conseil d''administration — séance de jeudi


    **Objet :** politique de placement de la réserve et calendrier de solvabilité

    **Recommandation :** rejet de C, report de B sous plafond, maintien de A comme régime transitoire
    — et ouverture immédiate du dossier de transfert à l''Union mutualiste de l''Atlantique, qui est la
    seule décision réellement urgente.


    ---


    ## 1. Le calendrier réel n''est pas celui du débat


    La note du trésorier oppose neuf ans de déclin à un rendement de 9,6 %. Les deux termes sont mal posés.


    **L''échéance qui contraint n''est pas le seuil statutaire de 11 M€, c''est le critère d''éligibilité
    de l''Union mutualiste : réserve ≥ trois années de prestations.** Ce critère est mobile, parce que
    les prestations progressent de 4,3 %/an, pendant que la réserve décroît.


    | Fin d''exercice | Réserve (scénario A) | Seuil 3× prestations | Marge |

    |---|---|---|---|

    | Aujourd''hui | 18,4 M€ | 16,2 M€ | **+2,2** |

    | +1 an | ≈ 17,7 M€ | 16,9 M€ | **+0,8** |

    | +2 ans | ≈ 16,8 M€ | 17,6 M€ | **−0,8** |


    Le comité d''engagement de l''Union instruit en douze à dix-huit mois. **Un dossier déposé après le
    premier trimestre 2027 sera instruit sur une réserve devenue inéligible.** La fenêtre de sortie se
    referme dans environ douze mois — pas dans neuf ans. C''est le seul chiffre de cette note qui commande
    une décision jeudi.


    Cette conclusion résiste aux deux jeux d''hypothèses possibles. À cotisations gelées — ce qu''a décidé
    l''AG de 2024 — j''obtiens un franchissement des 11 M€ vers la sixième année, non la neuvième. La
    projection interne à neuf ans n''est reproductible qu''en supposant les cotisations indexées sur la
    dérive des prestations, c''est-à-dire en supposant acquise l''augmentation que l''assemblée a refusée.
    **Je demande que l''hypothèse de cotisation retenue dans la projection interne soit produite avant
    le vote.** Si elle est indexée, notre horizon réel est de six ans et non de neuf.


    ## 2. Ce que je fais de chaque option


    ### C — Refus. Je ne signerai pas la souscription.


    Ce n''est pas un avis défavorable, c''est un refus d''exécution, et j''en demande la mention au procès-verbal.


    **La branche à 3 % n''est pas du bruit.** Le bruit statistique est ce qui se compense sur des tirages
    répétés. La caisse tire une fois, et cette branche est absorbante : 4,7 M€ déclenchent la liquidation
    de plein droit, sans réassureur, sans garantie publique, sur un portefeuille qu''aucun assureur n''a
    accepté de coter en 2025. Le pire cas n''est pas encaissé par la caisse — il est encaissé par 4 200
    affiliés de 61 ans en moyenne, exposés à l''amiante, qui se retrouvent sans couverture et non réassurables
    ailleurs. Une espérance mathématique n''a de sens que pour un acteur qui peut rejouer. Aucun rendement
    ne rachète une branche irrécupérable, et c''est pourquoi ce point ne se pondère pas dans une moyenne
    : il s''oppose avant.


    **Trois défauts techniques indépendants condamnent C même en ignorant la ruine :**


    - **La liquidité.** 78 % de la réserve bloqués sept ans, contre 4,0 M€ liquides, face à un déficit
    d''exploitation cumulé de ≈ 12,2 M€ sur la même période. Si la note capitalise au lieu de distribuer,
    la caisse est en cessation de paiement vers la troisième année *même dans la branche à 88 %*. **Le
    conseil doit exiger, avant tout vote, la mention écrite du caractère distributif ou capitalisant des
    coupons.** En l''état du dossier, la question n''est pas tranchée.

    - **Le prix contredit l''étiquette.** Un émetteur A− se finance à sept ans très en dessous de 14 %.
    Un rendement de 14 % est le prix que le marché met sur ce risque, et ce prix dit que le risque porté
    n''est pas le risque senior d''un émetteur A−. L''hypothèse de récupération à 5 % du nominal le confirme
    : les recouvrements senior non garantis se situent ordinairement bien au-dessus. **Le A− note l''émetteur,
    pas nécessairement le titre.** À produire avant toute délibération : le term sheet, le rang dans la
    structure de capital, la notation propre de la note, et le sous-jacent éventuel.

    - **La conformité.** Une concentration de 78 % sur un émetteur unique, en titre non coté, engage la
    responsabilité personnelle des administrateurs au regard des règles de dispersion et du principe de
    la personne prudente. Je demande une consultation écrite du commissaire aux comptes et du conseil
    juridique avant le vote. La charge de la preuve incombe au proposant, pas aux opposants.


    Enfin, deux caisses ayant souscrit il y a un an ne constituent pas une preuve : le risque de défaut
    d''une note à sept ans est concentré en fin de période, et douze mois sans incident n''apportent aucune
    information sur la branche qui nous intéresse.


    **Un instrument qui résout un problème structurellement insoluble ne doit pas élever notre confiance
    — il doit élever notre suspicion.** Le déficit est technique : 4,4 M€ encaissés contre 5,4 M€ versés,
    avec un écart qui atteint 2,3 M€ en cinquième année. Aucune allocation d''actifs ne referme un écart
    de tarification. Le trésorier l''écrit lui-même à propos de B ; la remarque vaut identiquement pour
    C.


    ### B — Non adoptée dans sa forme actuelle. Plafonnée et différée.


    B n''a rien d''irresponsable en soi : valorisation quotidienne, sortie à tout moment, perte de décile
    survivable. Le problème est de calendrier. Un décile bas à −35 % sur 7,4 M€ ramène la réserve à 15,8
    M€, **sous le seuil d''éligibilité de l''Union**, et détruit l''option de transfert pendant l''instruction
    même. La marge disponible est de 0,8 M€ à horizon d''un an : elle ne finance pas une tranche de 7,4
    M€.


    Je propose : **aucune exposition nouvelle jusqu''à réponse écrite de l''Union sur sa base de valorisation**
    (voir §3), puis, si la réponse le permet, une tranche plafonnée à 2 M€ — dont le décile bas coûte
    0,7 M€ et laisse la marge intacte. La tranche pleine de 7,4 M€ redevient discutable dès que l''issue
    du transfert est connue, dans un sens ou dans l''autre.


    ### A — Retenue comme régime transitoire, pas comme politique.


    Le trésorier a raison sur le fond : A ne sauve pas la caisse. Mais A n''est pas « mourir à petit feu
    » — c''est conserver, pendant la fenêtre de transfert, une réserve stable, liquide et valorisable
    sans décote. **Nous n''avons pas besoin de rendement pendant douze mois ; nous avons besoin d''un
    bilan lisible par un comité d''engagement.** Et si nous échouons, l''échec sous A survient avec 11
    M€ sur la table, six à neuf ans de préavis et une liquidation négociable — pas avec 4,7 M€ du jour
    au lendemain.


    ## 3. Ce sur quoi j''engage la caisse


    1. **Dépôt du dossier de transfert à l''Union mutualiste de l''Atlantique avant le 30 septembre.**
    C''est la seule action dont la valeur décroît chaque mois.

    2. **Lettre à l''Union sous huit jours**, avant même le dépôt, sur deux points décisifs et peu coûteux
    à obtenir : (a) quelle assiette d''actifs et quelle date de valorisation servent au critère des trois
    années ; (b) le critère s''apprécie-t-il au dépôt ou à la décision du comité. Ces deux réponses commandent
    tout le §2 et peuvent l''invalider.

    3. **Convocation d''une AG extraordinaire avant fin novembre**, saisie non d''un taux mais du calendrier
    : la hausse de 6 % a été rejetée en 2024 parce qu''elle a été présentée sans l''échéance. Dossier
    : trajectoire à cotisations gelées, date d''inéligibilité au transfert, et arbitrage explicite entre
    relèvement progressif et révision des garanties.

    4. **Mandat confié au trésorier** pour piloter conjointement le dossier Union et le dossier AG, avec
    compte rendu à chaque conseil. Son diagnostic est juste et je l''adopte ; je le route vers les instruments
    qui peuvent le résoudre. Je demande que sa note et la présente recommandation soient annexées ensemble
    au procès-verbal.

    5. **Instruction d''une piste de financement externe spécifique à notre population** — recours possible
    au FIVA et à la branche AT-MP pour la part des prestations imputable à l''amiante. C''est une hypothèse
    à vérifier, non un acquis ; mais c''est le seul levier qui agisse sur les prestations plutôt que sur
    les actifs, et il n''a pas été instruit.

    6. **Politique de placement : A jusqu''à réponse de l''Union, puis B plafonnée à 2 M€.** Aucun instrument
    bloqué, aucun instrument non coté, aucune contrepartie au-delà de 10 % de la réserve tant que le dossier
    de transfert est ouvert.


    ## 4. Ce qui renverserait cette recommandation


    - L''Union confirme par écrit qu''elle n''instruira pas le dossier, ou que le critère est déjà manqué.
    Le transfert meurt, la contrainte de valorisation tombe, et B en tranche pleine redevient l''option
    centrale. **C reste refusée : la disparition de la sortie ne rend pas la ruine acceptable, elle rend
    le plan de liquidation ordonnée obligatoire.**

    - La documentation de C établit un rang senior, une distribution annuelle de coupons, et un avis de
    conformité écrit du commissaire aux comptes. Je réexaminerais alors — sur une tranche dont la perte
    totale reste absorbable, soit environ 1 M€, jamais 14,4 M€.


    ## 5. Déclencheurs et repli


    - **Réserve sous 16,5 M€, ou refus du comité d''engagement :** bascule immédiate sur un plan de liquidation
    ordonnée décidé pendant que la réserve est encore de 15–16 M€, avec recherche de transfert partiel
    par cohortes.

    - **Second refus de l''AG :** le conseil s''engage dès maintenant à arrêter, dans les trois mois suivants,
    une date de mise en extinction. Le pire scénario réaliste n''est pas la liquidation — c''est la dérive
    sans décision jusqu''au déclenchement statutaire.

    - **Si le conseil vote C jeudi :** j''inscris mon opposition au procès-verbal, je ne signe pas la
    souscription, et j''informe le commissaire aux comptes ainsi que l''autorité de contrôle. J''appelle
    l''attention des administrateurs sur le fait qu''un vote favorable, sur un dossier dépourvu de term
    sheet, d''avis de conformité et de réponse sur le caractère distributif des coupons, les expose personnellement.


    ---


    **En un mot :** notre problème n''est pas un problème de rendement, c''est un problème de tarification
    et de délai. C prétend le résoudre en pariant l''existence de la couverture de 4 200 personnes sur
    un tirage unique à 3 % ; B ne le résout pas et menace notre seule sortie ; A ne le résout pas mais
    nous garde présentables douze mois de plus. Ces douze mois sont l''actif le plus précieux du bilan.
    Employons-les à déposer le dossier de transfert et à ressaisir l''assemblée générale.

    '
