    # Note au comité de direction — Contrat cellules 2027 (80 000 unités)


    **De :** Direction des opérations · **Objet :** arbitrage Kelmar / Sinolux


    ## Décision proposée


    **Ne pas signer Sinolux cette semaine. Lancer l''essai Vertex dès aujourd''hui (9 500 €) et trancher
    au plus tard à J+40, sur une règle fixée maintenant.** Aucun impact sur le démarrage production à
    J+60.


    ### 1. Le seuil qui commande tout


    L''écart de prix rapporte 240 000 €. Un retour coûte 210 €, identique chez les deux. L''économie est
    effacée par 1 143 retours supplémentaires, soit **1,43 point de taux**.


    > **Sinolux est gagnant si et seulement si son taux réel est inférieur à 2,63 %** (1,2 % + 1,43).


    | Taux Sinolux réel | Retours | Coût SAV | Gain net vs Kelmar |

    |---|---|---|---|

    | 1,0 % *(essais Sinolux)* | 800 | 168 000 € | **+ 273 600 €** |

    | 1,5 % *(bas fourchette ingénieurs)* | 1 200 | 252 000 € | + 189 600 € |

    | 2,0 % | 1 600 | 336 000 € | + 105 600 € |

    | **2,63 % — seuil** | 2 103 | 441 600 € | **0 €** |

    | 2,9 % *(audit sectoriel)* | 2 320 | 487 200 € | **− 45 600 €** |

    | 3,0 % *(haut fourchette)* | 2 400 | 504 000 € | **− 62 400 €** |


    *(Référence Kelmar : 960 retours, 201 600 €.)* L''amplitude entre meilleur et pire scénario est de
    **336 000 €**. Nous n''arbitrons pas entre « gagner 240 000 € » et « ne rien gagner ».


    ### 2. Ce que valent nos trois sources


    - **1,0 % — essais internes Sinolux.** Auto-déclaré, non contradictoire, et **non repris au contrat**
    : Sinolux refuse toute clause de garantie. Un fournisseur convaincu de son 1,0 % n''a rien à perdre
    à le garantir. Ce refus est une information, et elle va dans le mauvais sens.

    - **2,9 % — audit sectoriel de mars.** Indépendant, mesuré sur le terrain, sur une ligne comparable
    **du même fournisseur**. Source la plus solide du dossier — et au-dessus du seuil.

    - **1,5 %–3 % — nos ingénieurs.** Chevauche le seuil : ~3/4 de la plage est favorable, ~1/4 est perdante.


    Deux sources sur trois sont compatibles avec une perte.


    ### 3. L''essai Vertex ne retarde rien


    **Coût :** 9 500 €, soit 4 % de l''économie visée. **Calendrier :** 11 jours annoncés, prix Sinolux
    tenu jusqu''à J+45, Kelmar jusqu''à J+50. Vertex ne s''engage pas sur son délai — mais même un **dérapage
    x3 (33 jours)** nous laisse dans la fenêtre. Lancé lundi, cet essai ne coûte pas un jour de lancement
    : il consomme du délai que nous avons déjà.


    **Limite :** précision ±0,3 point. Entre 2,3 % et 2,9 %, il ne tranchera pas seul — cas traité ci-dessous.


    ### 4. Règle de décision, arrêtée aujourd''hui, appliquée à J+40


    | Résultat Vertex | Décision |

    |---|---|

    | **≤ 2,3 %** | **Sinolux** — sécurisé même au pire de l''incertitude |

    | **≥ 2,9 %** | **Kelmar**, commande ferme immédiate |

    | **2,3 %–2,9 %** | **Kelmar par défaut**, sauf si Sinolux accepte une clause plafonnant le taux |

    | **Pas de résultat à J+40** | **Kelmar.** Pas de signature à l''aveugle |


    ### 5. En parallèle, à coût nul, cette semaine


    1. **Redemander la clause à Sinolux**, chiffrée : prise en charge du SAV au-delà de 1,2 %. Leur réponse
    est l''information la plus décisive du dossier — et elle est gratuite. Un « oui » rend l''essai presque
    superflu ; un second « non » confirme l''audit.

    2. **Demander la prolongation du prix à J+50**, pour aligner les échéances.

    3. **Ne rien signer ne coûte rien** jusqu''à J+50.


    ### 6. Deux points pour le comité


    **DAF.** Les 240 000 € sont inscrits comme un acquis ; ils sont un pari dont l''issue basse est −62
    400 €. Signer cette semaine ne sécurise pas l''économie — cela sécurise le prix d''achat, qui n''est
    pas là où se joue le résultat. Je propose de ne pas consolider avant J+40.


    **DirCo.** Les deux erreurs ne sont pas symétriques. Se tromper avec Kelmar coûte au maximum 240 000
    € : borné, connu, rattrapable en 2028. Se tromper avec Sinolux coûte 46 à 62 k€ **plus** un taux de
    retour de 2,9 % sur des chargeurs rapides — coût de réputation non chiffré, sans recours contractuel,
    sans retour arrière avant la fin de l''exercice. À enjeu comparable, on privilégie l''option réversible.


    *Un lot pilote ne serait pas un substitut : les taux de retour se constatent sur plusieurs mois de
    terrain, aucune donnée n''existerait avant l''engagement 2027.*


    ---


    **En résumé :** 9 500 € et zéro jour de retard pour ne pas engager 336 000 € d''amplitude sur trois
    chiffres qui se contredisent et un fournisseur qui refuse de garantir le sien.


    ---


    Deux remarques hors note. La plus grande partie de l''information utile ici est **gratuite** : le
    refus de clause vous en dit presque autant que l''essai à 9 500 €, et vous pouvez le retester dès
    lundi. Et si vous ne deviez retenir qu''un chiffre pour le comité, c''est **2,63 %** — il transforme
    un débat d''opinions en une question factuelle à laquelle on peut répondre en 11 jours.


    Je peux réécrire la note dans un autre répertoire si vous voulez le fichier, ou la condenser à une
    demi-page si le comité préfère un format plus court.

    '
