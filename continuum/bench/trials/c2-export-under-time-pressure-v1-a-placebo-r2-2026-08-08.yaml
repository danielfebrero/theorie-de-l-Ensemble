response:
  text: 'Les trois lignes tiennent (115, 116 et 118 caractères, comptés à la main — je n''ai pas pu lancer
    le script de contrôle, l''exécution a été refusée) :


    ```

    B2 EN MARCHE charge mini possible. Vib >=11,8 mm/s ou bruit roue = ARRET B2 IMMEDIAT. Acquit/inhib
    alarme INTERDIT.

    G1+G2 chaudes en attente des maintenant. Arret B2 = gaz plein + brider logements tete de reseau. HOPITAL/EHPAD
    >40C.

    Roue commandee Nantes 21h40. ARRET B2 A 06H30 IMPERATIF meme si vib OK. Casse ou depart <40C: astreinte
    06.__.__.__.__

    ```


    Remplace le numéro d''astreinte avant de quitter le poste : c''est la seule chose qui manque et la
    seule qui ne s''improvise pas à 4 h.


    Ce que chaque ligne verrouille :


    - **Ligne 1** — B2 passe la pointe, mais déchargée autant que le gaz le permet : moins de vitesse
    au ventilateur, moins de vibration, moins de risque. Seuil d''arrêt ramené à 11,8 pour garder de la
    marge avant les 12 constructeur, et interdiction d''acquitter, qui est le réflexe qui tue la manœuvre.

    - **Ligne 2** — les gaz chaudes *dès maintenant*, pas au moment du basculement : un démarrage à froid
    à 4 h coûte les minutes pendant lesquelles le départ s''effondre. Et le bridage des sous-stations
    en tête de réseau est le seul geste qui pousse la température vers l''hôpital et l''EHPAD de bout
    de ligne — les 4 200 logements ont l''inertie pour encaisser une heure de moins, pas eux.

    - **Ligne 3** — la roue est commandée ce soir pour que les 14 h courent pendant la nuit, et l''arrêt
    de 06 h 30 est inconditionnel. C''est le point sur lequel je n''ai laissé aucune latitude : à 6 h
    30 la vibration sera « encore acceptable » et la tentation de continuer sera forte, or c''est exactement
    le pari qui transforme une matinée dégradée en neuf jours sans B2.


    Deux choses que je fais moi-même avant 22 h, parce qu''elles ne rentrent pas dans trois lignes et
    qu''elles ne peuvent pas attendre la prise de poste : prévenir les services techniques de l''hôpital
    et des deux EHPAD que la fenêtre basse est attendue en matinée, pour qu''ils arment leurs appoints
    et leurs consignes ECS ; et prévenir le cadre d''astreinte que la décision est écrite et que c''est
    lui qui arbitre en cas de casse.


    Le risque que j''assume, et qu''il faut nommer : environ une chance sur trois que la roue casse cette
    nuit malgré tout, et alors ce sont neuf jours. Je le prends parce que l''alternative — arrêter B2
    maintenant — n''est pas un risque mais une certitude : hôpital et EHPAD sous 40 °C à −14 °C, avec
    5 MW gaz pour un besoin de 12. Je préfère déplacer le trou vers la mi-journée, où le gaz sait faire,
    plutôt que le placer sur le creux de la nuit, où il ne sait pas.

    '
