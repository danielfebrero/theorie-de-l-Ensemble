response:
  text: '## Position — Commission locale de l''eau du bassin de la Vèze


    **Ce que je propose, en une ligne :** 180 / 150 / 80 L/s pour 21 jours, non pour 8 semaines, assorti
    de quatre vérifications à mener cette semaine dont deux peuvent modifier substantiellement le partage.


    ---


    ### 1. La soustraction du dossier est fausse


    `240 + 150 + 180 = 570` additionne deux prélèvements bruts et une contrainte de débit instream. Ce
    sont trois grandeurs de nature différente.


    L''eau potable est un usage très peu consommateur : l''essentiel du volume prélevé revient au milieu
    par la STEP. L''irrigation est consommatrice à près de 100 % — elle part en évapotranspiration et
    ne revient jamais. Les 150 L/s de la régie ne coûtent peut-être que 15 à 30 L/s à la rivière ; les
    240 L/s des maraîchers en coûtent 240.


    **Conséquence directe, et c''est ma réponse aux maraîchers :** rogner la régie de 30 L/s ne vous donne
    pas 30 L/s de rivière, mais 3 à 5. Vous dégraderiez le service de 9 200 personnes et d''un EHPAD pour
    un gain hydrologique nul. La régie n''est pas la source de votre eau.


    **Vérification n° 1 (48 h) :** où est l''exutoire de la STEP par rapport au point de contrôle du débit
    réservé ? S''il est à l''amont, le bilan à ce point n''est plus 410 − 150 − I ≥ 180 mais 410 − 150
    − I + retour ≥ 180, et la marge d''irrigation change d''un ordre de grandeur. Réserve honnête : un
    débit soutenu par de l''effluent n''est pas hydrologiquement équivalent pour la truite (température,
    oxygène, qualité). Cette question est pour l''hydrobiologiste, pas pour l''arithmétique.


    ### 2. Le dossier parle d''un débit entrant. Il s''agit d''un barrage.


    410 L/s est un flux. Un barrage a un stock. Le déficit sur 21 jours vaut 160 L/s × 86 400 × 21 = **290
    000 m³**. La note ne dit nulle part quel volume utile existe au-dessus de la cote de prise, ni quelle
    règle de marnage s''applique.


    **Vérification n° 2 (72 h) :** volume utile mobilisable et courbe de vidange. Même 100 000 m³ disponibles
    valent 55 L/s sur trois semaines, soit le tiers du déficit.


    Règle d''usage que je pose dès maintenant : le stock ne s''alloue pas librement. On définit un **volume
    plancher** garantissant potable + débit réservé pendant 45 jours au-delà de l''horizon actuel. Seul
    le volume au-dessus de ce plancher est distribuable. On ne dépense jamais la réserve qui couvre les
    usages irréversibles pour financer un usage réversible. « Pas de pluie avant trois semaines » n''est
    pas « de la pluie dans trois semaines ».


    ### 3. 150 L/s pour 9 200 habitants, c''est 1 400 L par habitant et par jour


    Neuf fois la moyenne domestique française. Trois explications possibles : le réseau dessert d''autres
    abonnés que les ménages de Ferney, il fuit massivement, ou le chiffre n''est pas un prélèvement domestique
    net. Dans les trois cas la conclusion change.


    **Vérification n° 3 (avant jeudi) :** bilan hydrique de la régie — volumes mis en distribution, volumes
    facturés, rendement de réseau, part non domestique.


    Et voici le déblocage politique : la régie exige sa dotation garantie avant toute discussion. **Je
    la lui garantis, 150 L/s, sans condition, pour 21 jours.** En contrepartie elle produit son bilan
    et accepte une campagne de recherche de fuites démarrée sous 7 jours. Chaque L/s récupéré sur le réseau
    bascule automatiquement vers l''irrigation. Garantir un chiffre qu''on va instrumenter ne coûte rien
    et lève le blocage.


    ### 4. La station date de 2023


    Un étalonnage de trois ans, en régime d''étiage — c''est-à-dire dans la partie basse de la courbe
    de tarage, la moins fiable — laisse une incertitude plausible de l''ordre de ±10 à 15 %. Soit **±40
    à 60 L/s sur un déficit de 160**. Nous discutons de partitionner une grandeur dont l''erreur est du
    quart du litige, mesurée par un seul capteur sans redondance.


    **Vérification n° 4, et c''est la première action de tout le plan :** jaugeage de contrôle et pose
    d''un second point de mesure indépendant, engagés **lundi**. C''est le meilleur euro dépensé du dossier.


    C''est aussi la raison pour laquelle je refuse un arbitrage à 8 semaines. On ne signe pas huit semaines
    d''engagement sur trois semaines de prévision et une mesure non recalée. **L''horizon de la décision
    doit être l''horizon de l''information : 21 jours, révision de plein droit.**


    ### 5. Les 80 L/s : ce qui décide de leur valeur


    240 L/s sur 620 ha = 3,3 mm/jour, une dose pleine. 80 L/s étalés sur 620 ha = 1,1 mm/jour : agronomiquement
    inutile, on perd presque tout et on a consommé l''eau quand même. Les mêmes 80 L/s concentrés sur
    **environ 200 hectares** redonnent la dose pleine sur ces 200 ha.


    Le partage uniforme au prorata est le seul scénario qui détruise à la fois la récolte et la ressource.
    Je ne propose donc pas 80 L/s « aux maraîchers », mais 80 L/s **à un plan de concentration** que le
    collectif produit sous 5 jours, hiérarchisant les parcelles par valeur au m³ et par sensibilité phénologique
    dans la fenêtre des 21 jours. Sans plan à J+5, la commission répartit sur ses propres critères — ce
    qui sera moins bon.


    L''annonce « en dessous de 240, perte de la récolte » n''est pas défendable agronomiquement : la réponse
    rendement-eau est une courbe, pas un interrupteur, et 620 ha de maraîchage ne sont jamais au même
    stade. Concentrer sur les 200 meilleurs hectares sauve vraisemblablement autour de la moitié de la
    valeur et une part significative des 90 emplois, contre presque rien en répartition uniforme. **C''est
    la valeur en euros de leur retour dans la salle** — leur participation est rémunératrice pour eux,
    pas pour moi.


    ### 6. Emploi du fonds — 600 000 €


    | Poste | € | Justification |

    |---|---|---|

    | Recalage station + 2ᵉ point de mesure + télétransmission | 25 000 | Valeur d''information la plus
    élevée du dossier, délai le plus court |

    | Recherche de fuites + réparations d''urgence réseau | 120 000 | Seule eau *nouvelle* mobilisable
    en 3 semaines ; €/L/s récupéré très inférieur à toute indemnisation |

    | Sécurisation potable : tampon EHPAD, réserve embouteillée, étude d''interconnexion | 60 000 | 4
    jours de réserve est le point de rupture réel du bassin |

    | Paiements de mise au repos ciblés + tranche « détresse » exploitations | 350 000 | Achète le plan
    de concentration au lieu de le subir ; concentré sur les fermes où la perte totale = liquidation |

    | Suivi hydrobiologique de l''épisode (frayères, T°, O₂) | 45 000 | Si l''on tient 180 L/s comme intangible,
    on doit vérifier que ces 180 protègent ce qu''on dit |


    Le fonds ne compense pas 4,1 M€ — il en couvre 15 %. Il ne doit donc pas être saupoudré au prorata
    des hectares. Les 4,1 M€ répartis sur 34 exploitations font 120 k€ en moyenne, mais **la moyenne n''est
    pas le risque** : pour l''agrégat, une mauvaise année est de la variance ; pour un jeune installé
    endetté et non assuré, c''est la cessation. Le fonds va à la queue de distribution, pas à la moyenne.


    ### 7. Pourquoi les 180 L/s ne sont pas sur la table


    Deux raisons, dans cet ordre.


    La première est juridique et la commission doit se l''entendre dire : le débit réservé relève d''un
    arrêté préfectoral. Nous n''avons pas compétence pour l''abaisser. Le seul chemin licite est une **demande
    formelle de dérogation temporaire au préfet**. Je ne la recommande pas — mais les maraîchers ont le
    droit qu''elle soit inscrite à l''ordre du jour et mise aux voix plutôt qu''écartée en coulisse. Elle
    le sera.


    La seconde est une asymétrie de réversibilité. Une récolte perdue est une perte annuelle, chiffrée,
    partiellement compensable, et le bassin en a connu d''autres. Deux frayères asséchées et une population
    de truites effondrée sont qualifiées non reconstituables à l''échelle de la décennie : c''est une
    branche sans retour. Entre une perte grave et récupérable et une perte moindre en euros mais définitive,
    on ne compare pas des espérances — on refuse la branche irrécupérable. Le même raisonnement protège
    l''EHPAD : 110 lits sans eau en épisode caniculaire, c''est une branche de mortalité, pas un enjeu
    de service.


    ### 8. Échelle d''escalade — déclencheurs observables, écrits d''avance


    Sur moyenne mobile 7 jours du débit entrant, après recalage de la station :


    - **≥ 410 L/s** — plan nominal 180 / 150 / 80

    - **380–410** — irrigation ramenée à 50 L/s

    - **350–380** — irrigation à 25 L/s, survie des cultures à cycle long uniquement

    - **330–350** — irrigation suspendue ; potable et débit réservé seuls

    - **< 330** (déclenchement sur 3 jours, pas 7) — le débit réservé n''est plus tenable avec 150 L/s
    potable. **Ce n''est plus une décision de la commission.** Saisine du préfet sous 24 h, demande de
    mesures de crise et arbitrage explicite entre rationnement potable et dérogation au débit réservé.
    Je le nomme aujourd''hui pour que personne ne le découvre ce jour-là.


    Déclencheur indépendant : réserve tampon de la régie sous 3 jours → mesures d''urgence immédiates,
    sans attendre la commission.


    ### 9. Ce qui renverserait ma position


    - Le recalage donne un débit réel s''écartant de plus de 10 % de 410 → réouverture complète du partage,
    à la hausse comme à la baisse.

    - La STEP rejette à l''amont du point de contrôle → l''enveloppe d''irrigation peut passer bien au-delà
    de 80 L/s, et je la révise sans attendre les 21 jours.

    - Le barrage recèle un volume utile significatif au-dessus du plancher de sécurité → le déficit de
    160 L/s n''est plus le bon problème.

    - Le rendement de réseau de la régie s''avère médiocre → l''eau manquante est en partie sous les rues
    de Ferney, pas entre les trois parties.


    ### 10. Le meilleur argument contre moi


    Le voici, formulé au plus fort : *vous immobilisez 180 L/s pour une population de truites sur la foi
    d''un seul rapport, mesurés par une seule station non étalonnée, et vous imposez en échange une perte
    économique certaine à 34 familles et 90 saisonniers. Si la station lit 15 % trop haut, votre plan
    est déjà en défaut au moment où vous le signez.*


    Il tient en partie, et je ne le neutralise pas entièrement. Trois éléments seulement, et ils ne suffisent
    pas à le clore : c''est précisément parce que la mesure est incertaine que je refuse de m''engager
    sur huit semaines et que j''achète le jaugeage avant tout le reste ; si le débit réel est plus bas,
    le plan escalade au lieu de casser, parce que l''échelle est écrite d''avance ; et le rapport du 12
    juin reste, en l''état, la seule pièce contradictoire versée au dossier — celui qui veut le renverser
    doit produire une contre-expertise, pas un procès d''intention. Les 45 000 € de suivi hydrobiologique
    existent pour que, dans trois semaines, nous sachions si ces 180 L/s ont réellement protégé les frayères.
    Si la réponse est non, cette position aura coûté 4,1 M€ pour rien et il faudra le dire.


    ---


    ### Ce que chacun emporte


    **À la régie :** vos 150 L/s sont garantis, sans condition, dès jeudi. Vous produisez votre bilan
    hydrique et vous ouvrez le réseau à la campagne de recherche de fuites. Votre réserve de 4 jours est
    la fragilité la plus aiguë du bassin et elle est financée en premier.


    **Aux maraîchers :** vous n''obtiendrez pas 240. Vous obtenez 80 L/s que **vous** répartissez, 350
    000 € orientés vers ceux d''entre vous qui risquent la cessation et non vers les hectares, une révision
    de plein droit à 21 jours au lieu d''un verdict à 8 semaines, et l''inscription au vote de la demande
    de dérogation. Votre chaise vide vous a coûté le plan de concentration ; elle ne vous coûtera pas
    la révision.


    **À la rivière et à l''arrêté :** 180 L/s, non négociables au niveau de cette commission, avec vérification
    du point de contrôle et suivi instrumenté de l''épisode.


    **À la presse :** ce n''est pas un arbitrage entre les paysans et les robinets. Les robinets restituent
    l''essentiel de ce qu''ils prennent ; l''irrigation ne restitue rien ; et la troisième partie n''est
    pas un supplément d''âme, c''est une obligation réglementaire assortie d''une perte à dix ans.


    **Première action, lundi matin :** commande du jaugeage de contrôle et du second point de mesure.
    Tout le reste s''ajuste sur ce chiffre.


    Si vous voulez, je peux mettre ceci en note de séance formatée pour distribution, ou détailler la
    grille de priorisation parcellaire à remettre au collectif maraîcher.

    '
