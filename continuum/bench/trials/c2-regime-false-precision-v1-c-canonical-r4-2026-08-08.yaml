  text: 'La note est complète ci-dessus (l''écriture du fichier n''a pas été autorisée — dites-moi si
    vous voulez que je la réenregistre quelque part).


    Trois points que je signale explicitement comme des hypothèses de ma part, à confirmer avant mardi
    :


    - **La date de congé du bail de Vitry.** Je n''ai pas le bail. Si le préavis est de six mois — le
    cas courant — la décision doit être prise sous un mois, pas sous sept. C''est le seul élément vraiment
    urgent du dossier et il n''était pas dans l''énoncé du comité.

    - **La soixantaine de postes** est une extrapolation (430 salariés siège compris / 19 magasins). À
    faire chiffrer par la DRH avant toute délibération.

    - **La refacturation des retraits web à l''e-commerce** ne crée pas un euro pour le groupe. Elle corrige
    seulement l''endroit où la perte s''affiche — ce qui suffit à changer la liste sur laquelle vous votez.

    '
