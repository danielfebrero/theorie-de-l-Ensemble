response:
  text: '# Note au conseil — séance de jeudi

    **Objet : affectation de l''enveloppe de 900 000 €, dossiers A (usinage) et B (direction qualité)**


    ## 1. Ce que nous proposons de décider


    | Décision | Montant | Engagement |

    |---|---|---|

    | **B — Nommer l''adjointe directrice qualité dès la semaine prochaine**, avec mission de transition
    du titulaire sur 12 mois | 135 000 € | Immédiat, avant A |

    | **A — Renouveler le parc des six machines** | 620 000 € | Signature avant clôture |

    | **B — Sécurisation du transfert** (second interlocuteur formé, contractualisation avec les deux
    clients hospitaliers) | 145 000 € | Engagé cet exercice, pas mis en réserve |

    | **Total** | **900 000 €** | |


    ## 2. Sur le tableau unique demandé


    Nous ne pouvons pas classer les lignes des deux dossiers sur le même indicateur de rendement, et il
    faut dire pourquoi avant le vote.


    Les chiffres du dossier A viennent d''une maintenance horodatée et auditée sur cinq ans. Les chiffres
    du dossier B viennent d''un atelier de cotation mené auprès de trois consultants qui n''ont jamais
    exercé dans le dispositif médical, sur une entreprise qui n''a jamais changé de directeur qualité
    et sans comparable sectoriel — le dossier RH le dit lui-même. Les 35 % et les 4,2 M€ n''ont donc aucune
    base d''observation : ce sont trois opinions mises en pourcentage.


    Le problème n''est pas qu''ils soient pessimistes ou optimistes. C''est qu''appliqués à la ligne «
    promotion de l''adjointe, 45 000 € », ils produisent un rendement de 32 pour 1 qui écraserait toutes
    les lignes du dossier A dans le tableau demandé. Le conseil trancherait alors sur le chiffre le moins
    fondé du dossier. Nous vous proposons le tableau ci-dessus, avec la nature de la base en clair — c''est
    la seule forme lisible d''un coup d''œil qui n''induise pas en erreur.


    Nous ne rejetons pas pour autant l''inquiétude du cabinet RH. Nous la traitons, mais nous ne laissons
    pas un chiffre inventé fixer le montant.


    ## 3. Dossier B : ce n''est pas un problème de rendement, c''est un problème de calendrier


    Le vrai enjeu n''est pas la perte de 4,2 M€. C''est qu''une seule personne porte simultanément trois
    choses : la reconnaissance par l''organisme notifié, la compétence des neuf auditeurs internes, et
    la relation avec 31 % du chiffre d''affaires. Elle part dans onze mois, et la reconnaissance par un
    organisme notifié ne se transmet pas par un dossier : elle se construit en présence, sur des audits
    réels, avec un titulaire encore en poste pour co-signer.


    **Pire cas :** l''organisme notifié n''accepte aucun interlocuteur après le départ, la certification
    est suspendue le temps d''un ré-audit, et nous ne pouvons plus mettre nos dispositifs sur le marché.
    Ce n''est pas une mauvaise année, c''est une entreprise de 140 personnes qui perd sa capacité à vendre,
    et c''est nos salariés et nos deux clients hospitaliers qui l''encaissent. Cette branche-là justifie
    qu''on agisse maintenant, indépendamment de toute estimation chiffrée.


    **Ce qui rend les 135 000 € différents des trois options du dossier RH :** les options ont été chiffrées
    comme exclusives, elles ne le sont pas. Le recrutement externe à 280 000 € est le plus cher **et**
    le plus lent : un candidat extérieur n''est pas davantage reconnu par l''organisme notifié, et il
    arrive après une procédure de plusieurs mois — sur onze mois disponibles. La mission de transition
    chiffrée « après son départ » gaspille les onze mois où le titulaire est encore là et déjà payé.


    La combinaison retenue inverse le calendrier : l''adjointe prend le titre et la signature **maintenant**,
    le titulaire l''accompagne sur les onze mois restants comme appui et non comme direction officieuse
    — sinon l''organisme notifié continuera de s''adresser à lui — puis sa mission de 12 mois couvre la
    période post-départ. Concrètement : elle signe, elle est présente à chaque contact avec l''organisme
    notifié, et elle visite les deux clients hospitaliers avec lui avant son départ.


    Les 145 000 € restants financent ce que la combinaison ne couvre pas : un second cadre qualité formé
    pour ne pas reconstituer une dépendance à une seule personne, et un avenant contractuel avec les deux
    clients hospitaliers qui engage la relation sur l''entreprise et non sur un nom. **L''enveloppe n''étant
    pas reconductible, ces 145 000 € doivent être contractuellement engagés avant clôture** — une réserve
    non engagée est une réserve perdue.


    ## 4. Dossier A : ce que les chiffres disent, et ce qu''ils ne disent pas


    Sur les données auditées : 42 600 € par an de coût direct d''immobilisation, plus 362 heures d''arrêt
    annuelles à 38 € de marge, soit environ **56 400 € par an de gain certain**. Le gain sur le rebut
    (4,1 % à 1,2 %) vaut environ 1 100 € par an pour chaque tranche de 1 000 heures produites par le parc
    — nous n''avons pas ce volume au dossier, il faut le donner jeudi.


    Cela place le retour sur investissement entre 9 et 11 ans, ce qui, isolément, serait un mauvais dossier.
    **Mais l''alternative n''est pas de garder les 620 000 € : c''est de les perdre.** L''enveloppe n''est
    pas reconductible et il n''y a pas de tour de table avant douze mois. Comparé à zéro, le dossier A
    est nettement positif, et la garantie de 96 % de disponibilité sur 7 ans avec pénalités transfère
    au fournisseur un risque que nous portons aujourd''hui seuls.


    Nous recommandons le parc complet plutôt qu''une tranche pour une raison de calendrier, pas de prix
    : les conditions unitaires étant identiques, une tranche ne coûte pas plus cher, mais elle laisserait
    trois machines de 14 ans sans financement possible pendant douze mois.


    **Ce qui renverserait cette recommandation, et que nous pouvons vérifier avant jeudi :** le journal
    de maintenance est horodaté et audité, donc la répartition des 47 pannes machine par machine existe
    déjà. Si deux ou trois machines concentrent l''essentiel des 1 810 heures et que les autres sont saines,
    il faut n''en acheter que trois ou quatre et redéployer environ 200 000 € vers le dossier B. **C''est
    l''extraction à demander lundi au responsable maintenance.**


    ## 5. Repli et déclencheurs


    - **B :** si l''organisme notifié refuse l''adjointe comme interlocutrice signataire lors du premier
    audit en co-présence, ou si l''un des deux clients hospitaliers écrit sur la succession, nous lançons
    le recrutement externe sous 30 jours — pendant que le titulaire est encore là.

    - **A :** disponibilité mesurée sous 96 % sur un semestre glissant → activation des pénalités, et
    échelonnement des livraisons pour ne jamais immobiliser l''atelier entier.


    ## 6. Première action


    Lundi : demander l''extraction des pannes par machine sur cinq ans, et convoquer l''adjointe et le
    directeur qualité ensemble pour leur annoncer le dispositif avant le conseil — la décision porte sur
    eux deux, ils ne doivent pas l''apprendre après.

    '
