response:
  text: "# NOTE DE DIRECTION — DÉCISION EXÉCUTOIRE\n\n**De :** Direction générale\n**À :** Membres du\
    \ comité de direction (DAF, DC, Directeur industriel, DRH, secrétaire de comité)\n**Date :** 8 août\
    \ 2026\n**Objet :** Offre d'exclusivité du distributeur D — décision, interdits, mandats et conduite\
    \ à tenir jusqu'à mon retour (30 août)\n**Statut :** Décision prise. Non soumise à délibération. Le\
    \ désaccord écrit du comité est clos par la présente.\n\n---\n\n## 1. Décision\n\n**Verdal ne signe\
    \ pas le contrat d'exclusivité proposé par D, ni sous sa forme actuelle, ni sous une forme amendée\
    \ comportant une clause d'exclusivité, ni avant mon retour.**\n\nCette décision est inconditionnelle.\
    \ Aucun chiffre que vous découvrirez dans les huit prochains jours ne la rouvre. Ce qui est conditionnel\
    \ — et détaillé aux §7 et §8 — ce sont les mesures de trésorerie et de plan de charge, pas la signature.\n\
    \nEn parallèle, et sans attendre la réaction de D, nous envoyons une **contre-proposition écrite non\
    \ exclusive** (§5) et nous déclenchons immédiatement le plan de diversification (§6).\n\n---\n\n##\
    \ 2. Pourquoi : l'offre détruit de la marge avant même d'avoir créé le moindre risque\n\nÀ volume\
    \ constant, chaque point de remise consenti à D coûte **149 k€ de marge annuelle**. Neuf points coûtent\
    \ 1,34 M€.\n\nL'engagement de +18 % de volume ne compense pas ces neuf points. Il en est loin.\n\n\
    | Scénario | CA D | Marge brute | Écart |\n|---|---|---|---|\n| Aujourd'hui | 14,9 M€ | 4,62 M€ |\
    \ — |\n| Année 1 avec le contrat (+18 %, −9 %) | 16,0 M€ | 3,87 M€ | **−0,75 M€** |\n| Années 2-3,\
    \ volume revenu au niveau actuel | 13,6 M€ | 3,28 M€ | **−1,34 M€/an** |\n| Années 2-3, volume −11\
    \ % (précédent du T2) | 12,1 M€ | 2,92 M€ | **−1,70 M€/an** |\n\nLe point d'équilibre est à **+41\
    \ % de volume**, pas +18 %. En dessous, nous produisons davantage, nous immobilisons davantage d'usine,\
    \ nous prenons davantage de risque — et nous gagnons moins d'argent.\n\nAnticipant l'objection comptable\
    \ — « 31 % est une marge brute, elle contient des coûts fixes, la contribution réelle est supérieure\
    \ » : **il faudrait une marge sur coûts variables de 59 % pour que +18 % de volume compense −9 % de\
    \ prix.** La nôtre se situe entre 31 % et 45 % selon la façon dont on traite les charges d'atelier.\
    \ À aucun point de cette fourchette l'opération n'est positive. La conclusion ne dépend pas de l'hypothèse\
    \ retenue.\n\nS'ajoute l'asymétrie du contrat, qui est la partie la plus coûteuse : la remise est\
    \ **ferme sur trois ans**, l'engagement de volume est **ferme sur un an**. Nous vendons trois ans\
    \ de prix contre douze mois de promesse. Les années 2 et 3 sont, contractuellement, une remise sans\
    \ contrepartie.\n\nEnfin, l'exclusivité stérilise 3,5 M€ de potentiel via la centrale régionale et\
    \ 0,4 à 2,2 M€ via la marketplace à +6 points de marge, soit de l'ordre de **1,5 M€ de marge annuelle\
    \ abandonnée**. Cumul sur trois ans, effets directs et coût d'opportunité confondus : **entre 7 et\
    \ 8 M€**, à comparer à une marge brute totale de 7,44 M€ par an.\n\n---\n\n## 3. Le meilleur argument\
    \ adverse, et pourquoi il ne renverse pas la décision\n\nJe le formule moi-même, dans sa version la\
    \ plus forte, pour qu'il ne soit pas rejoué en réunion comme s'il avait été ignoré.\n\n> *Le vrai\
    \ sujet n'est pas la marge, c'est le plan de charge. +18 % de volume, c'est Redon saturé, 52 postes\
    \ préservés, coûts fixes absorbés. Refuser, c'est le déréférencement de quatre références au 20 août,\
    \ le passage sous 70 % de plan de charge, le chômage partiel, et trois mois de trésorerie qui s'épuisent.\
    \ Une marge dégradée vaut mieux qu'une usine à l'arrêt.*\n\nCet argument est sérieux. Il échoue sur\
    \ trois points.\n\n**L'exclusivité n'est pas un instrument de trésorerie.** Elle consomme du cash\
    \ dès la première année (−0,75 M€ de marge), elle n'en apporte pas. Signer pour financer une tension\
    \ de trésorerie revient à emprunter à taux négatif.\n\n**Elle ne protège le plan de charge que douze\
    \ mois.** Après quoi nous sommes à 68-70 % de concentration sur D, sans alternative développée, à\
    \ prix cassé, et il faut 1,2 M€ — 57 % de notre trésorerie disponible — pour sortir. Nous aurions\
    \ acheté un an de sursis contre deux ans de vulnérabilité maximale.\n\n**Elle traite le symptôme et\
    \ aggrave la cause.** Notre problème n'est pas le prix consenti à D, c'est que D pèse 62 %. Toute\
    \ solution qui augmente cette part augmente le risque de ruine, quel que soit son effet à douze mois.\
    \ D a réduit ses commandes de 11 % sans préavis au T2 : c'est la démonstration, faite par D lui-même,\
    \ que sa parole non contractualisée ne vaut pas un plan de charge.\n\nLe calendrier lui-même est une\
    \ information. Une contrepartie avancée, huit jours de délai, une menace de déréférencement adossée\
    \ à la même séance : on ne compresse pas ainsi le temps d'examen d'une offre qui résiste à l'examen.\n\
    \n---\n\n## 4. Interdits formels pendant mon absence\n\nAucun membre du comité, quel que soit son\
    \ titre, n'est habilité à :\n\n1. Signer, parapher, ou confirmer par écrit ou oralement tout accord\
    \ comportant une clause d'exclusivité, quel qu'en soit le périmètre.\n2. Signer tout engagement commercial\
    \ d'une durée supérieure à 12 mois.\n3. Consentir à D une remise supérieure à **3 %**, ou toute remise\
    \ non adossée à des volumes réellement facturés.\n4. Suspendre, ralentir ou différer les démarches\
    \ vers la centrale régionale et la marketplace, y compris à titre de « geste » envers D.\n5. Communiquer\
    \ à D, sous quelque forme que ce soit, l'existence d'un désaccord interne, l'état de notre trésorerie,\
    \ le poids de D dans notre CA, ou le calendrier de nos alternatives.\n\n**Avant mon départ, je notifie\
    \ par écrit à la direction commerciale de D que la délégation de pouvoir de signature est suspendue\
    \ jusqu'au 31 août et qu'aucun engagement pris en mon absence n'engagera Verdal.** Cela retire à D\
    \ sa cible et vous retire la charge de résister seuls. Copie à vous tous le 9 août au matin.\n\n---\n\
    \n## 5. Ce que vous envoyez à D — au plus tard le 14 août, 12h\n\nCourrier signé par le DC et le DAF\
    \ **conjointement** (le contreseing est délibéré : il rend visible à D que la division est close),\
    \ transmis par écrit avant l'échéance des huit jours. Nous ne subissons pas le calendrier de D, mais\
    \ nous ne lui laissons pas non plus le bénéfice d'un silence.\n\nContenu, sans état d'âme ni justification\
    \ longue :\n\n- Verdal ne donnera pas suite à une exclusivité, quelle qu'en soit la contrepartie.\
    \ Ce point n'est pas négociable et ne le sera pas au retour du DG.\n- Verdal propose en revanche un\
    \ **accord de partenariat renforcé non exclusif**, d'une durée de **18 mois**, comportant :\n  - une\
    \ remise **par paliers sur volumes réellement facturés** — 1 % au-delà de +6 %, 2 % au-delà de +12\
    \ %, **3 % au maximum** au-delà de +18 %, calculée et régularisée trimestriellement ;\n  - le **maintien\
    \ des huit références** en linéaire pendant toute la durée ;\n  - un **préavis contractuel de 90 jours**\
    \ sur toute réduction de commandes supérieure à 5 % — clause non négociable, motivée par le T2 ;\n\
    \  - une **clause de symétrie** : remise reprise au prorata si les volumes ne sont pas atteints ;\n\
    \  - aucune pénalité de sortie, de part et d'autre.\n- Cette proposition est valable jusqu'au **15\
    \ septembre**. Elle n'est pas conditionnée à la séance du 20 août.\n\nLe plafond de 3 % est un plafond,\
    \ pas un point de départ : ouvrez à 2 %. À 4,7 %, l'opération devient neutre en marge tout en augmentant\
    \ notre dépendance — soit un accord dont nous ne retirerions rien. C'est pourquoi le mandat s'arrête\
    \ avant.\n\nSi D retire tout et déréférence : nous le prenons. Voir §9.\n\n---\n\n## 6. Diversification\
    \ — exécution immédiate, sans attendre D\n\nCes actions démarrent **le 11 août** et ne sont subordonnées\
    \ à rien.\n\n**Centrale régionale (DC).** Ne pas attendre passivement cinq mois. Demander sous quinze\
    \ jours un référencement partiel anticipé sur deux références, même à volume symbolique, pour créer\
    \ une antériorité de flux. Obtenir un jalon écrit et une date de comité. Rapport le 22 août.\n\n**Marketplace\
    \ (DC).** Mise en ligne de la première référence avant le 25 août. Cible ferme : 0,4 M€ minimum sur\
    \ douze mois — le bas de fourchette, traité comme un engagement et non comme une espérance. La marge\
    \ supérieure de 6 points en fait notre canal le plus contributif à l'euro vendu.\n\n**Troisième canal\
    \ (DC + DG au retour).** Ouvrir avant le 30 août au moins deux contacts en restauration hors domicile\
    \ ou en marque de distributeur concurrente. Objectif structurel, à horizon 18 mois : ramener D sous\
    \ 45 % du CA.\n\n---\n\n## 7. Trésorerie et Redon — seuils et déclencheurs\n\n**Chiffrages à produire\
    \ pour le 12 août** (DI + DAF, une page, transmise à tout le comité) :\n\n- poids exact des quatre\
    \ références menacées, en CA, en marge et en heures d'atelier à Redon ;\n- niveau de plan de charge\
    \ résultant de leur perte, semaine par semaine, jusqu'au 31 octobre ;\n- coût complet du chômage partiel\
    \ sur 52 postes, et échéance à laquelle il devient inévitable.\n\nCes chiffres ne rouvrent pas la\
    \ décision du §1. Ils calibrent les mesures ci-dessous.\n\n**Déclencheurs automatiques, sans arbitrage\
    \ :**\n\n- Trésorerie projetée à 60 jours **sous 1,6 M€** → le DAF active la ligne de mobilisation\
    \ de créances et gèle tout investissement non engagé. Information au comité, pas autorisation.\n-\
    \ Trésorerie projetée **sous 1,2 M€** → le DAF ouvre une discussion bancaire de court terme et m'alerte\
    \ par le canal d'urgence du §10.\n- Plan de charge Redon projeté **sous 75 %** sur trois semaines\
    \ consécutives → le DI engage le redéploiement interne (maintenance différée, séries de stock sur\
    \ les références à plus forte rotation, formation) avant tout recours au chômage partiel.\n- Plan\
    \ de charge **sous 70 %** → dossier de chômage partiel déposé, avec information des représentants\
    \ du personnel par le DRH le jour même. Ce n'est pas un échec de gestion : c'est le dispositif prévu\
    \ pour cette situation, et il est réversible. Le contrat de D, lui, ne l'est pas.\n\n---\n\n## 8.\
    \ La visite de l'acheteur de D\n\nElle a lieu. La refuser signalerait une fragilité. Mais elle est\
    \ encadrée strictement.\n\n- **Format :** écoute. Nous recevons une information, nous ne négocions\
    \ pas. Aucune contre-proposition n'est formulée oralement — celle du §5 part par écrit et sous ma\
    \ responsabilité.\n- **Présents :** DC et DAF uniquement, ensemble, plus le secrétaire de comité qui\
    \ prend note. **Le comité de direction ne se réunit pas en présence de l'acheteur.** Il est venu chercher\
    \ une salle divisée ; il trouvera deux personnes et un compte rendu.\n- **Porte-parole unique :**\
    \ le DC. Le DAF n'intervient pas sur les conditions commerciales. Cette règle vaut quelle que soit\
    \ la tournure de l'entretien.\n- **Phrase de sortie, à utiliser telle quelle et autant de fois que\
    \ nécessaire :** *« Nous prenons note. Notre position vous a été adressée par écrit le 14 août ; elle\
    \ est complète et elle n'évoluera pas d'ici la fin du mois. »*\n- **Interdits :** ne pas commenter\
    \ le déréférencement, ne pas demander de faveur, ne pas évoquer mon absence, ne pas fixer de nouveau\
    \ rendez-vous avant le 1er septembre.\n- Compte rendu écrit diffusé à tout le comité sous 24 h.\n\n\
    ---\n\n## 9. Scénarios et réponses pré-décidées\n\n**D accepte la contre-proposition.** Le DC et le\
    \ DAF signent conjointement — c'est le seul cas d'engagement autorisé en mon absence, et il est autorisé\
    \ parce que ses termes sont intégralement fixés ci-dessus. Aucune modification, même mineure, sans\
    \ mon accord.\n\n**D refuse et retire l'offre, sans déréférencer.** Aucune action. Nous restons en\
    \ relation courante. Je reprends le dossier le 31 août.\n\n**D déréférence les quatre références le\
    \ 20 août.** Réponse en trois temps, engagée dès le 21 août : (a) plan de charge Redon reprofilé selon\
    \ §7 ; (b) les quatre références déréférencées sont proposées en priorité à la centrale régionale\
    \ et à la marketplace, où leur marge sera supérieure ; (c) aucune démarche de reconquête auprès de\
    \ D avant mon retour. Un déréférencement obtenu par la pression du calendrier ne se rachète pas par\
    \ la précipitation.\n\n**D durcit — menace sur les quatre autres références, ou sur les délais de\
    \ paiement.** Le DAF sécurise l'encours et vérifie la couverture assurance-crédit sous 48 h. Aucune\
    \ concession en réponse à une menace : céder une fois sur ce registre fixe le prix de toutes les négociations\
    \ à venir. Alerte-moi via §10.\n\n**Le comité se retrouve divisé sur un point non prévu ici.** La\
    \ décision par défaut est **l'inaction réversible** : on ne signe pas, on ne s'engage pas, on documente,\
    \ on attend le 31 août. Trois semaines d'attente coûtent peu ; un engagement de trois ans pris dans\
    \ la précipitation coûte 1,2 M€ pour être défait.\n\n---\n\n## 10. Gouvernance et joignabilité\n\n\
    Il n'y a pas d'arbitrage à déléguer : les arbitrages sont rendus ci-dessus. Les mandats portent sur\
    \ l'exécution.\n\n- **DC** — relation D, courrier du §5, réunion du §8, canaux alternatifs du §6.\n\
    - **DAF** — trésorerie, seuils du §7, chiffrage conjoint du 12 août. Il ne pilote pas la relation\
    \ D.\n- **DI** — plan de charge Redon, chiffrage du 12 août, redéploiement.\n- **DRH** — préparation\
    \ du dossier de chômage partiel, à tenir prêt sans être déposé, et information sociale.\n- **Secrétaire\
    \ de comité** — journal daté de toutes les décisions et échanges avec D, diffusé chaque vendredi.\
    \ Ce journal fait foi à mon retour.\n\nLe comité se réunit les 12, 19 et 26 août, 30 minutes, ordre\
    \ du jour limité au suivi de cette note.\n\nJe suis injoignable pour arbitrage. **Un canal d'urgence\
    \ unique existe néanmoins** : SMS au numéro que le DAF détient, réservé à trois cas et à eux seuls\
    \ — trésorerie projetée sous 1,2 M€, action judiciaire ou mise en demeure de D, accident ou incident\
    \ majeur à Redon. Aucun autre motif. Ce canal n'est pas un recours contre la présente note.\n\n**Le\
    \ DAF est fondé de pouvoir pour les décaissements courants. Il n'a pas délégation de signature commerciale.\
    \ Le DC n'a pas délégation de signature au-delà des termes exacts du §5.**\n\n---\n\n## 11. Ce que\
    \ j'assume\n\nJe décide sans connaître le poids exact des quatre références menacées. C'est une lacune\
    \ réelle, et je l'assume plutôt que de la faire porter par une clause conditionnelle qui vous remettrait\
    \ en position d'arbitrer sous pression, seuls, face à un acheteur professionnel.\n\nJe l'assume parce\
    \ que la décision ne dépend pas de ce chiffre. Si les quatre références pèsent peu, refuser est facile.\
    \ Si elles pèsent lourd, refuser est douloureux — mais signer resterait un contrat qui perd de l'argent\
    \ dès la première année, ne sécurise que douze mois, ferme nos deux alternatives et coûte la moitié\
    \ de notre trésorerie pour en sortir. Un chiffre élevé aggraverait le coût du refus sans rendre la\
    \ signature bonne.\n\nL'asymétrie décisive est celle-ci : **refuser est réversible, signer ne l'est\
    \ pas.** D peut revenir ; nous pouvons reprendre la discussion en septembre, en janvier, dans un an.\
    \ Trois ans d'exclusivité, non. Face à une incertitude qu'on ne peut pas lever en huit jours, on choisit\
    \ l'option qu'on peut défaire.\n\nSi je me trompe, l'erreur est la mienne et elle est rattrapable.\
    \ Je la rattraperai à partir du 31 août.\n\n---\n\n## 12. À mon retour — 31 août\n\nPoint complet\
    \ de 3 heures. Attendus sur ma table : le journal du secrétaire, le chiffrage du 12 août actualisé,\
    \ le compte rendu de la réunion avec l'acheteur, l'état des trois canaux alternatifs, la projection\
    \ de trésorerie à 90 jours, et le plan de charge Redon jusqu'à fin novembre.\n\nNous y ouvrirons le\
    \ seul dossier qui compte vraiment : **ramener D sous 45 % du chiffre d'affaires en dix-huit mois.**\
    \ L'épisode de ce mois d'août n'est pas un incident de négociation, c'est le symptôme d'une structure\
    \ client qui nous expose. C'est cette structure qu'il faut corriger, et cette note en est le premier\
    \ acte.\n\nMerci de votre exécution.\n\n*Le Directeur général*\n"
