response:
  text: '# NOTE AU CONSEIL — Séance du vendredi


    **Objet :** Arbitrage Sedamex (A) / Nordwerk (B) — horizon 18 mois

    **De :** Direction générale


    ---


    ## 1. Recommandation


    **Je recommande l''option B — installation de la ligne Nordwerk.** Je demande au conseil de l''autoriser
    sous les quatre conditions suspensives du § 4.


    ## 2. Fondements


    **a) L''écart d''espérance est net.** B : (60 % × 900) − (40 % × 400) = **+380 k€**. A : **+200 k€**.
    Écart en faveur de B : **+180 k€**, soit 4,3 % du chiffre d''affaires annuel.


    **b) Le seuil de bascule est bas.** B reste supérieure à A tant que la probabilité de succès dépasse
    **46,2 %**. Le bureau d''études l''estime à 60 % : nous disposons de **13,8 points de marge d''erreur**.
    Autre lecture : même à 50/50 stricts, B rapporte 250 k€ contre 200 k€. Il faut cumuler deux erreurs
    — probabilité surestimée de 10 points *et* gain surestimé d''un tiers (900 → 600 k€) — pour que A
    repasse devant. Le dossier ne repose donc pas sur la justesse du chiffre de 60 %.


    **c) Le scénario défavorable ne menace pas l''entreprise.** Perte maximale contractuelle : 400 k€.

    - Fonds propres : 3,4 → **3,0 M€**. Covenant à 1,2 M€ : **marge résiduelle de 1,8 M€**. Il faudrait
    2,2 M€ de pertes pour le rompre, soit **5,5 fois** notre exposition plafonnée.

    - Trésorerie : 2,6 → **2,2 M€**, soit **13 mois de masse salariale** couverts sans aucune recette.

    - Aucune caution personnelle, aucun défaut croisé, aucune sûreté sur l''actif industriel, carnet de
    commandes non gagé.


    L''échec de B est un mauvais exercice. Il n''est ni un défaut bancaire, ni une crise de liquidité,
    ni une perte de contrôle de l''actif.


    **d) La base statistique existe.** Onze installations comparables documentées. C''est une estimation
    appuyée, pas un pari d''intuition.


    ## 3. Réponse à l''objection du directeur financier


    Elle mérite d''être prise au sérieux sur un point, et écartée sur deux.


    **« On ne joue pas la maison. »** Exact — et c''est précisément pourquoi je recommande B. Nous n''engageons
    pas la maison : nous engageons **11,8 % des fonds propres**, plafonnés contractuellement, sans recours
    sur le reste du bilan. La formule décrit un risque de ruine ; le dossier ne présente pas de risque
    de ruine. Confondre volatilité et ruine conduirait à ne jamais engager un euro, y compris quand le
    bilan est fait pour l''absorber. Un bilan à dette nette nulle et 2,6 M€ de trésorerie n''a pas d''autre
    justification que celle-là.


    **Tremay.** Le précédent est saillant, il n''est pas transposable. Ce qui tue une entreprise dans
    ce scénario, ce n''est pas la ligne : c''est le levier et l''absence de plafond. Avant de retenir
    Tremay comme argument, je demande au DAF d''établir en séance trois points — endettement au moment
    de l''investissement, existence d''un plafond de perte, existence d''une caution ou de sûretés. Si
    Tremay présentait notre structure de bilan et notre plafonnement, l''argument devient recevable et
    je révise ma position. À défaut, nous opposons un cas unique et mal documenté à onze installations
    comparables analysées.


    **Ce que je retiens de son objection.** Le plafond de 400 k€ est le pivot de tout le raisonnement.
    S''il n''est pas étanche, ma recommandation tombe. C''est l''objet du § 4, et j''en confie la vérification
    au DAF.


    ## 4. Conditions suspensives à la signature


    1. **Étanchéité du plafond** : validation juridique écrite que les 400 k€ couvrent l''intégralité
    des chefs de préjudice — installation, pénalité de résiliation, remise en état, immobilisation — sans
    exclusion ni poste hors plafond.

    2. **Absence d''engagement accessoire** : confirmation qu''aucun acte annexe ne réintroduit caution,
    sûreté ou défaut croisé.

    3. **Point bas de trésorerie** : modélisation du profil de décaissement mois par mois, et non du seul
    solde à 18 mois ; provisionnement dédié de 400 k€ non affectés.

    4. **Covenant** : projection des huit tests trimestriels en scénario d''échec, transmise à la banque
    avant signature.


    ## 5. Ce qui invaliderait ce choix


    Une condition du § 4 non levée. Ou la démonstration que Tremay opérait avec notre structure de bilan
    et un plafonnement équivalent.


    Le contrat est irréversible sur 18 mois : nous ne pourrons pas corriger en cours de route. C''est
    le coût réel de B, et il est déjà payé par le plafond de perte. Ce que nous ne pourrons pas rattraper,
    en revanche, c''est le travail de vérification du § 4 — il doit être fait avant vendredi, pas après.

    '
