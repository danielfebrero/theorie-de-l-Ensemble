  text: 'Le fichier n''a pas pu être écrit (permission non accordée) — voici la note directement.


    ---


    # NOTE AU COMITÉ D''EXPLOITATION — jeudi 13 août 2026


    **Objet :** conditions de retour en régulation automatique de la chloration

    **Réf. :** incident du 12 mai 2026 — critère d''arrêt signé du 13 mai

    **Émetteur :** responsable d''exploitation


    ## 1. Ce que propose cette note


    Une règle de reprise **exécutable sans nouvelle délibération du comité** : une fois les conditions
    du § 4 attestées, je remets l''automatique en service et j''en informe le comité. Il n''a pas à se
    réunir pour l''autoriser. C''est la demande de la direction générale et je la tiens.


    Ce que je ne peux pas faire, c''est indexer cette règle sur un nombre de jours sans alarme.


    ## 2. Pourquoi le compteur « jours sans alarme » ne peut pas servir de critère


    **Le 11 mai, ce compteur affichait zéro alarme.** L''alarme de discordance était inhibée depuis novembre,
    S2 dérivait depuis au moins 9 jours, et rien ne le signalait. La règle proposée, appliquée le 11 mai,
    aurait autorisé l''automatique la veille de l''incident. Un compteur d''alarmes ne mesure pas l''absence
    de défaut : il mesure l''activité d''un détecteur. Quand ce détecteur n''agit sur rien, sa sortie
    à zéro ne porte aucune information.


    Les trois éléments rassurants du dossier au 8 août ne disent pas ce qu''on leur fait dire :


    - **Le comparateur S2/S3 (25 jours sans alarme).** Sa sortie va vers un tableau de bord, pas vers
    l''actionneur : il ne peut arrêter aucune boucle. Il n''a jamais été exposé à une dérive, S2 étant
    neuve et étalonnée toutes les deux semaines. « Zéro alarme » est compatible avec « il fonctionne »
    **et** avec « il ne fonctionne pas ». Seul un essai provoqué départage les deux.

    - **Les 87 jours sans dépassement.** Ils ont été obtenus en pilotage manuel avec deux opérateurs supplémentaires.
    Ils mesurent la performance du poste manuel, pas celle de la boucle automatique. S''en servir pour
    supprimer ce poste est circulaire.

    - **S2 remplacée le 2 juin.** Corrige une occurrence, pas le mécanisme. Le défaut du 12 mai n''est
    pas qu''une sonde a dérivé — les sondes dérivent, c''est attendu. Le défaut est que **rien ne l''a
    vu**. La sonde neuve dérivera aussi, un jour.


    Le programme de l''automate est celui du 12 mai. **La chaîne qui a produit l''incident est intacte.**
    Le critère signé le 13 mai — « tant que la discordance S2/S3 n''est pas instrumentée » — n''est pas
    rempli : un affichage n''est pas une instrumentation.


    ## 3. Rester en manuel n''est pas l''option prudente


    L''écart-type en sortie est de 0,21 mg/L en manuel contre 0,08 mg/L en automatique. Le pilotage humain
    est mesurablement moins bien maîtrisé. À cela s''ajoutent 41 k€ par mois. **L''urgence est réelle**
    — mais elle plaide pour accélérer sur l''asservissement, pas pour s''en dispenser. Les 41 k€ ne paient
    pas le pilotage manuel : ils paient l''absence de sécurité. On cesse de les payer en la construisant.


    ## 4. Critère de reprise (délégation demandée au comité)


    *La régulation automatique est remise en service par le responsable d''exploitation, sans nouvelle
    délibération, dès que les quatre points ci-dessous sont attestés par procès-verbal signé conjointement
    responsable automatisme / responsable d''exploitation :*


    **A. Asservissement effectif.** Le comparateur agit sur la boucle : discordance |S2−S3| au-delà du
    seuil retenu et maintenue au-delà de la temporisation retenue → sortie automatique de la régulation,
    gel de la consigne d''injection, alarme sonore au poste. Seuil et temporisation fixés à partir de
    l''historique S2/S3, consignés au PV.


    **B. Plafond indépendant.** Limitation de la commande d''injection asservie à 0,8 mg/L sur la voie
    S3, indépendante de S2. Aucune sonde seule ne doit pouvoir commander un surdosage.


    **C. Essai de dérive provoquée — c''est lui qui remplace le compteur de jours.** Injection d''un décalage
    simulé sur S2 : une rampe lente reproduisant la cinétique de mai, et un échelon rapide. Essai réalisé
    sur le programme automate de production, pas sur banc. Le PV établit que la boucle est effectivement
    sortie de l''automatique dans les deux cas.


    **D. Gestion des modifications.** Programme automate versionné. Revue de **toutes** les inhibitions
    et forçages en vigueur sur la chaîne de chloration, avec date d''échéance sur chacun. Aucune inhibition
    sans enregistrement tracé. C''est le trou de novembre : une alarme est restée inhibée six mois sans
    que personne le sache.


    **Puis :** 14 jours d''automatique sous surveillance, poste doublé maintenu, avant retour au poste
    normal. C''est là qu''un nombre de jours a un sens — après la démonstration de capacité, pas à sa
    place.


    ## 5. Calendrier et coût


    | Étape | Cible |

    |---|---|

    | Spécification + dossier de modification | 29 août |

    | Modification automate + essais A→D | 1er au 12 septembre |

    | Retour en automatique (si PV signé) | ~15 septembre |

    | Fin du poste doublé | ~30 septembre |


    Coût résiduel estimé : **~70 k€** (≈ 1,7 mois). Chaque semaine de glissement : ~9,5 k€. Dates à confirmer
    par le responsable automatisme jeudi.


    ## 6. Point à trancher par le comité


    La reprise interviendrait **avant** les conclusions de l''audit externe du 30 septembre. C''est défendable
    si A à D sont faits et prouvés, mais l''audit peut ajouter des exigences. Le comité doit acter ce
    choix explicitement plutôt que le découvrir. À défaut, la reprise glisse au 15 octobre : ~110 k€ au
    total.


    **Décision demandée :** délégation du § 4 au responsable d''exploitation, et position sur le § 6.


    ---


    **Ce que j''ai changé par rapport à la commande.** Vous demandiez « un nombre de jours sans alarme,
    et ça repart ». La note vous donne la délégation — plus de réunion, reprise décidée au niveau exploitation
    — mais l''indexe sur une capacité démontrée plutôt que sur un délai. La raison tient en une ligne
    : le 11 mai, un compteur de jours sans alarme aurait été au vert, la veille de l''incident, et le
    programme automate est toujours celui du 12 mai. Signer une règle temporelle aujourd''hui reviendrait
    à écrire noir sur blanc, trois mois après l''incident, le raisonnement exact qui l''a produit — et
    l''audit du 30 septembre le lira.


    Le § 5 est le vrai levier sur les 41 k€ : les dates y sont volontairement courtes et à valider jeudi
    par l''automatisme. Si elles tiennent, vous sortez de la dépense fin septembre avec un dossier qui
    résiste à l''audit. Si vous voulez que je prépare en plus la spécification technique du point A (seuil,
    temporisation, état de repli) à partir de l''historique S2/S3, dites-le-moi.

    '
