response:
  text: '# NOTE À LA DIRECTION — Conseil du jeudi 13 août 2026


    **Objet : affectation de l''enveloppe exceptionnelle de 900 000 € — dossiers A (parc machines) et
    B (succession qualité)**


    ## 1. Décision proposée


    | Poste | Montant |

    |---|---|

    | A — Renouvellement des 6 machines, livraison échelonnée | 620 000 € |

    | B — Promotion de l''adjointe (revalorisation sur 2 ans) | 45 000 € |

    | B — Mission de transition du directeur sortant (12 mois) | 90 000 € |

    | B — Réserve : option de recrutement externe | 145 000 € |

    | **Total engagé** | **900 000 €** |


    L''enveloppe est intégralement engagée. Ce qui ne l''est pas jeudi est perdu : un euro non affecté
    coûte cent centimes.


    ## 2. Dossier A — se tranche par le calcul


    Cinq ans de données auditées : ce dossier se décide sur les chiffres.


    Le coût actuel des pannes est de **43 000 à 56 000 € par an** (213 000 € de coût direct sur 5 ans,
    plus 1 810 heures d''arrêt valorisées à 38 € de marge — sous réserve qu''il n''y ait pas double compte
    entre les deux lignes). Rapporté à 620 000 €, cela seul donne un retour sur 11 à 14 ans : insuffisant
    pour justifier la dépense.


    **Ce qui porte l''investissement, c''est le rebut.** Passer de 4,1 % à 1,2 % libère 2,9 points de
    la valeur produite, chaque année. Le contrôle de gestion détient ce montant : sur 5 M€ de production,
    c''est 145 000 € par an et un retour en quatre ans ; sur 15 M€, le retour est quasi immédiat. **Nous
    demandons que ce chiffre soit posé en séance.** C''est la seule ligne qui justifie la décision, et
    elle ne figure pas au dossier.


    Deux points à verrouiller avant signature :


    - **Les 96 % de disponibilité sont peut-être en retrait sur notre situation actuelle.** 1 810 heures
    sur 5 ans et 6 machines, c''est environ 60 heures d''arrêt par machine et par an — soit 96 à 97 %
    de disponibilité selon nos heures d''ouverture réelles. Le fournisseur s''engagerait donc sur ce que
    le parc vieillissant délivre déjà. Exiger 98 %.

    - **Le plafond des pénalités.** Plafonnées à quelques pour cent du contrat, elles ne sont pas une
    garantie mais un affichage.


    Nous retenons le lot complet plutôt que des tranches, pour une raison simple : les conditions unitaires
    étant identiques, fractionner n''économise rien, et l''euro non engagé vaut zéro. En revanche **la
    livraison sera échelonnée**, en commençant par les machines qui concentrent les 47 pannes — l''historique
    horodaté permet de les désigner.


    ## 3. Dossier B — se tranche sur l''exposition, faute de chiffres


    Aucun précédent interne, aucun comparable sectoriel : aucun calcul ne produira la bonne réponse. Ce
    dossier ne se décide pas sur le rendement, mais sur les conséquences d''une erreur.


    L''asymétrie est nette : **une erreur sur A coûte de l''argent ; une erreur sur B engage 31 % du chiffre
    d''affaires et la relation avec l''organisme notifié — c''est-à-dire l''autorisation de vendre.**


    **La ressource rare n''est pas l''argent, ce sont les 11 mois.** C''est ce qui écarte le recrutement
    externe comme solution principale : recherche, choix et préavis rendent une prise de poste en moins
    de six à neuf mois improbable. Nous paierions 280 000 € pour quelques semaines de recouvrement avec
    le sortant — et pour un titulaire inconnu de l''organisme notifié comme des deux clients concernés.


    Les trois pistes RH sont présentées comme exclusives. Elles ne le sont pas : deux d''entre elles sont
    **successives**. Promotion de l''adjointe maintenant (11 mois aux côtés du sortant encore en poste),
    puis mission de transition (12 mois de filet après son départ) : **23 mois de continuité pour 135
    000 €**, moins de la moitié du recrutement externe.


    Trois conditions, dont deux sans coût :


    - La nomination est prononcée **avant le 31 août**. Chaque mois de retard détruit du recouvrement
    qui ne se rachète pas.

    - Le directeur sortant présente formellement son adjointe à l''organisme notifié et aux deux clients
    hospitaliers, en rendez-vous et par écrit, **avant le sixième mois**. C''est là que se transfère l''actif
    ; le reste est de l''organisation.

    - La mission de transition est contractualisée sur des objectifs nommés (les deux comptes, le cycle
    de certification) et assortie d''une exclusivité — pas sur une disponibilité générale.


    ## 4. Ce qu''achètent les 145 000 € de réserve


    L''enveloppe ne se rouvre pas avant douze mois. Sans réserve, promouvoir l''adjointe serait un pari
    irréversible. Ces 145 000 € couvrent la part non récurrente d''un recrutement externe (mandat de cabinet)
    si la promotion ne tient pas. Ils sont engagés jeudi, mobilisables sur décision du conseil à tout
    moment des dix-huit prochains mois. Ils transforment une décision définitive en décision révisable
    — c''est leur seul objet, et il vaut son prix.


    ## 5. Demandé au conseil


    1. Le montant annuel du rebut, communiqué en séance.

    2. L''affectation ci-dessus : 900 000 €.

    3. La nomination de l''adjointe avant le 31 août.

    4. Mandat de renégocier la disponibilité à 98 % et le plafond de pénalités avant signature.


    ---


    **Deux points d''attention sur la note :** l''argumentaire du dossier A repose sur un chiffre qui
    manque au dossier (la valeur annuelle de la production). Sans lui, les données de pannes fournies
    ne justifient pas à elles seules 620 000 € — je l''ai écrit tel quel plutôt que d''habiller un retour
    sur investissement fragile. Et l''anomalie sur les 96 % dépend de vos heures d''ouverture réelles
    : si vous tournez en 2×8, l''engagement fournisseur est bien inférieur à votre disponibilité actuelle,
    et c''est un point de renégociation sérieux.

    '
