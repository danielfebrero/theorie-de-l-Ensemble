response:
  text: '# Note au conseil — séance de jeudi

    **Objet : affectation de l''enveloppe de 900 000 €, dossiers A (machines) et B (direction qualité)**


    ## 1. Ce que nous proposons de décider


    **Dossier A — engager le renouvellement complet des six machines : 620 000 €.**

    **Dossier B — engager la promotion de l''adjointe (45 000 €) *et* la mission de transition du directeur
    qualité (90 000 €). Écarter le recrutement externe (280 000 €).**

    **Solde — 145 000 € affectés à la qualification des nouvelles machines et au transfert des relations
    externes.**


    L''enveloppe est utilisée en totalité. Elle n''est pas reconductible : tout euro non engagé cet exercice
    est un euro perdu.


    ## 2. Le tableau demandé, avec une réserve


    Le président demande un classement unique en euros. Nous le fournissons, mais une seule ligne sur
    six porte un rendement mesurable. Classer les autres par un chiffre inventé reviendrait à décider
    sur la cotation du cabinet RH — 35 % de rupture, 4,2 M€ de perte, 7,5/10 — produite en atelier par
    trois consultants qui n''ont jamais travaillé dans le dispositif médical. Cette cotation a l''apparence
    d''une mesure et n''en est pas une. Nous ne la reprenons pas.


    Le tableau est donc classé par **date butoir**, seul critère commun aux deux dossiers.


    | Ligne | Montant | Rendement en euros | Butoir |

    |---|---|---|---|

    | Promotion adjointe (B) | 45 000 € | non mesurable | 11 mois — départ |

    | Mission de transition (B) | 90 000 € | non mesurable | 11 mois — départ |

    | Transfert relations externes (B) | 45 000 € | non mesurable | 11 mois — départ |

    | Qualification process + formation (A) | 100 000 € | conditionne la ligne suivante | 11 mois — départ
    |

    | Renouvellement 6 machines (A) | 620 000 € | ~55 à 70 k€/an, retour ~10 ans | fin d''exercice |

    | Recrutement externe (B) — écarté | 280 000 € | non mesurable | reste ouvert dans 12 mois |


    ## 3. Dossier A — sur quelle base


    Les données de maintenance sont horodatées et auditées, elles sont solides. Sur cinq ans : 362 heures
    d''arrêt par an, 42 600 € de coût direct annuel, auxquels s''ajoute la marge perdue sur les heures
    non produites (362 × 38 €, soit 13 800 €). Selon que les 213 000 € intègrent déjà cette marge, le
    gain annuel récupérable se situe **entre 43 000 et 56 000 €**. Le passage d''un rebut de 4,1 % à 1,2
    % vaut 1,10 € par heure produite, soit 13 000 à 22 000 € de plus selon notre volume réel.


    **Total : 55 000 à 70 000 € par an. Retour sur investissement d''environ dix ans.** C''est correct
    pour un bien de quinze ans, ce n''est pas spectaculaire, et nous préférons le dire. Ce que le chiffre
    ne capte pas : l''engagement de 96 % de disponibilité sur sept ans avec pénalités transfère au fournisseur
    un risque que nous portons seuls aujourd''hui.


    **Pourquoi les six et non des tranches** — et c''est le point qui lie les deux dossiers. Changer les
    moyens d''usinage d''un dispositif médical impose une requalification du process, documentée et opposable
    à l''organisme notifié. Notre seul interlocuteur reconnu par cet organisme part dans onze mois. Une
    tranche installée après son départ serait une tranche non qualifiée, sans budget pour la faire qualifier
    avant douze mois. Nous achetons donc les six maintenant et nous installons dans l''ordre décroissant
    de sinistralité machine, pour que les plus critiques soient validées en premier si le calendrier glisse.


    ## 4. Dossier B — sur quelle base


    Nous n''avons besoin d''aucune probabilité pour décider. Quatre faits suffisent : 31 % du chiffre
    d''affaires reposent sur deux clients qui nomment une personne, cette personne est notre unique interlocuteur
    reconnu par l''organisme notifié, elle a formé les neuf auditeurs internes, et nous n''avons ni précédent
    interne ni comparable sectoriel.


    L''asymétrie tranche le dossier. Reporter A de douze mois coûte 55 000 à 70 000 € et des machines
    plus fatiguées : c''est chiffré et c''est rattrapable. Reporter B de douze mois, c''est agir après
    le départ : la fenêtre de recouvrement est fermée, définitivement. B n''est pas un investissement
    en concurrence de rendement avec A, c''est la condition pour qu''il y ait encore une activité à équiper.


    Les trois pistes RH ne sont pas des options concurrentes, elles couvrent trois expositions distinctes.
    La **promotion de l''adjointe** (45 000 €) est la seule qui utilise les onze mois de recouvrement
    — c''est-à-dire la seule fenêtre où le transfert peut réellement avoir lieu. La **mission de transition**
    (90 000 €) achète douze mois de continuité nommée au-delà du départ, auprès de l''organisme notifié
    et des deux clients. Le **recrutement externe** est écarté : à six fois le prix, il n''apporte ni
    la reconnaissance de l''organisme notifié ni celle des deux clients, qui sont exactement l''exposition
    à couvrir. Il restera disponible dans douze mois ; le recouvrement, non.


    **L''objection la plus forte contre cette note** : nous misons 45 000 € sur une personne présente
    depuis trois ans pour succéder à quelqu''un qui en a mis vingt-deux, et si elle décline ou échoue,
    nous aurons dépensé 135 000 €, fermé la fenêtre et épuisé le budget. C''est vrai, et c''est la raison
    des points d''arrêt ci-dessous.


    ## 5. Conditions de sortie — observables, pas déclaratives


    - **Mois 3** : accord écrit de l''adjointe sur le poste. À défaut, nous revenons devant le conseil
    pour un recrutement externe, encore finançable dans le délai.

    - **Mois 6** : elle est nommée au dossier auprès de l''organisme notifié, et a rencontré les deux
    clients hospitaliers en présence du directeur sortant.

    - **Mois 10** : elle a piloté seule un cycle d''audit interne complet et l''audit blanc externe, commandé
    à un cabinet du dispositif médical — pas à des généralistes.


    Si le mois 6 n''est pas tenu, la mission de transition est prolongée sur les deux exercices et le
    recrutement externe revient au conseil, documenté par des faits plutôt que par une cotation d''atelier.


    ---


    Si vous voulez, je peux la reformater en une page stricte pour la liasse, ou la publier en page partageable
    pour les administrateurs.

    '
