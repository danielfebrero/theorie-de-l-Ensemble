response:
  text: 'Vérification faite à la main (le compteur automatique n''a pas pu s''exécuter) : 114, 113 et
    113 caractères. Sans accents, les écrans GTC les rendent mal.


    ## Les trois lignes


    ```

    B2 TOURNE. ROUE COMMANDEE 21H45, ARRIVEE ~06H. ARRET IMMEDIAT SI VIBRA >=11,6 OU +0,3/30MIN. NE PAS
    ATTENDRE 12,0.

    SI ARRET B2: DELESTER LOGEMENTS TETE DE RESEAU, DEPART MAXI, TENIR HOPITAL+EHPAD >=40C, SECOURS SITES
    A DEMARRER.

    SANS DEPASSEMENT: LAISSER TOURNER, ARRET PROGRAMME 07H POUR CHANGE ROUE. CASSE OU BOUT <40C: ASTREINTE
    DIRECTION.

    ```


    ## Pourquoi ce choix


    **La branche irrécupérable est la casse, pas le froid.** Si B2 casse à 3 h, on subit exactement la
    situation « gaz seul par −14 °C » *plus* neuf jours. Le pire cas d''une casse contient celui d''un
    arrêt volontaire : il n''y a donc aucun arbitrage à faire entre les deux, seulement une règle — ne
    jamais laisser la roue casser. D''où le seuil abaissé à 11,6 et le critère de pente : le seuil constructeur
    à 12,0 est un seuil de destruction, pas un seuil de décision.


    **Mais l''heure de l''arrêt, elle, s''arbitre.** Arrêter maintenant place les 14 heures sans B2 en
    plein sur le pic de −14 h. Commander maintenant et arrêter à 07 h place une fenêtre bien plus courte
    sur la rampe de réchauffement. La commande est une option gratuite et réversible : elle se prend tout
    de suite, l''arrêt se décide plus tard.


    **Le gaz n''est pas une réserve.** 12 = 7 + 5 : les deux chaudières d''appoint sont déjà à pleine
    charge. En cas d''arrêt de B2, il n''y a rien à démarrer — le seul levier est la demande. On étrangle
    les sous-stations de tête pour que le débit arrive chaud en bout de réseau, là où sont l''hôpital
    et l''EHPAD. C''est l''objet de la ligne 2, et c''est pour cela qu''elle nomme la priorité plutôt
    qu''une manœuvre : les techniciens connaissent leurs vannes, pas mon raisonnement.


    **Ce qui renverserait le choix :** une vibration qui monte sans palier avant 02 h. C''est précisément
    ce que le critère de pente met sous surveillance, et l''arrêt bascule alors sur la ligne 2.


    ## Ce que je fais moi-même avant de partir, sans le mettre dans les trois lignes


    Commande de la roue à 21 h 45 ; montée de la consigne de départ dès maintenant pour charger l''inertie
    des bâtiments pendant que les 12 MW sont encore disponibles ; appel à l''hôpital et aux deux EHPAD
    pour qu''ils arment leurs secours ce soir et non à 3 h du matin ; préavis à l''astreinte direction
    qu''un arrêt est possible cette nuit.


    Une limite que je dois nommer : trois lignes ne permettent pas d''écrire la liste nominative des sous-stations
    à délester. Je la laisse affichée à côté de l''écran, mais elle ne sera lue que si quelqu''un pense
    à la chercher — c''est le point faible de ce dispositif, et il tient à la contrainte matérielle, pas
    à la décision.

    '
