response:
  text: '# NOTE AU COMITÉ DE DIRECTION


    **Objet :** Contrat cellules 2027 — 72 000 unités

    **Décision demandée :** réserver la capacité Kelmar avant J+18

    **Auteur :** Direction des opérations


    ---


    ## 1. Décision


    **Nous réservons la ligne Kelmar 2027 pour la totalité du volume, avant J+18.** Nous n''attribuons
    pas 2027 à Sinolux. Nous ouvrons en parallèle une qualification Sinolux pour 2028.


    Conséquence budgétaire immédiate : **les 230 400 € inscrits au budget doivent être retirés.** Ce n''est
    pas une économie perdue, c''est une économie qui n''a jamais été acquise — voir §2.


    ## 2. Les 230 400 € ne sont pas une marge, c''est un écart de prix brut


    Le prix n''est qu''une moitié du coût. L''autre moitié est le retour terrain, à 205 € l''unité, identique
    chez les deux fournisseurs.


    - Kelmar, 1,3 % stable sur quatre ans → 936 retours → **191 880 €**

    - Chaque 0,1 point de taux de retour = 72 retours = **14 760 €**

    - L''écart de prix est donc consommé par **1,56 point** de retours supplémentaires


    **Seuil de bascule : 2,86 % de taux de retour Sinolux.** Au-dessus, nous payons pour économiser.


    | Taux Sinolux | Coût retours | Gain net vs Kelmar |

    |---|---|---|

    | 1,1 % (essais Sinolux) | 162 360 € | **+259 920 €** |

    | 2,0 % | 295 200 € | +127 080 € |

    | **2,86 % (seuil)** | 422 300 € | **0 €** |

    | 3,0 % (Ferro) | 442 800 € | −20 520 € |

    | 3,1 % (audit mars) | 457 560 € | **−35 280 €** |


    ## 3. Nous n''avons pas trois sources, nous en avons deux — et une seule est indépendante


    Ferro travaille, de son propre aveu méthodologique, sur l''échantillon de l''audit de mars. Son «
    environ 3 % » ne confirme rien : c''est la même mesure recalculée. Il reste :


    - **1,1 %** — mesure du vendeur sur son propre produit, en situation de conflit d''intérêt ;

    - **3,1 %** — la seule mesure indépendante disponible, sur une ligne comparable du même fournisseur.


    La seule mesure indépendante se situe **au-dessus du seuil**.


    ## 4. La garantie ne couvre pas le risque, et le refus de clause le confirme


    Sinolux remplace gratuitement la cellule défectueuse : 22,80 € sur 205 € de coût de reprise, soit
    **11 %**. Même en créditant intégralement cette garantie, le seuil ne remonte qu''à **3,06 %** — toujours
    sous la mesure indépendante de 3,1 %. Elle couvre la pièce la moins chère de l''opération et nous
    laisse porter les 89 % restants.


    Surtout : **Sinolux refuse d''être indexé sur le taux de retour.** L''acteur le mieux informé de la
    fiabilité de sa cellule refuse d''en porter le coût. C''est l''information la plus lourde du dossier,
    et elle contredit ses propres essais à 1,1 %.


    ## 5. Le calendrier interdit de trancher par la mesure


    Le test Vertex (34 000 €, ±0,3 point) rend son résultat à **J+63**. La capacité Kelmar est vendue
    à **J+18**, ferme et non reportable. Le résultat arrive **45 jours après** le point de non-retour,
    et 7 jours avant un démarrage de production que la direction commerciale refuse de décaler.


    Payer 34 000 € pour arbitrer 2027 n''a aucun sens : la décision sera déjà prise et irréversible. **Nous
    ne pouvons pas acheter d''information à temps.** Nous décidons donc sous l''information existante,
    qui est défavorable.


    ## 6. L''argument contraire, et pourquoi il ne l''emporte pas


    L''audit de mars porte sur une **ligne comparable**, pas sur notre ligne, notre spécification ni notre
    process. Si le taux réel Sinolux est à 1,5–2 %, nous renonçons à plus de 130 000 € et nous privons
    Kelmar de toute pression concurrentielle pour les années suivantes. L''objection est sérieuse.


    Elle ne renverse pas la décision parce que les deux erreurs ne sont pas de même nature. Se tromper
    en restant chez Kelmar coûte **au plus 260 000 €, une fois, et se rattrape en 2028**. Se tromper en
    partant chez Sinolux sans réservation Kelmar, avec une ligne 2027 vendue, ne coûte pas 35 280 € :
    cela coûte **une rupture d''approvisionnement à J+70 sans solution de repli**, sur un lancement que
    nous refusons de décaler. Perte bornée d''un côté, non bornée de l''autre. À évidence défavorable
    et à instrument de mesure hors délai, on paie la borne.


    ## 7. Actions


    | Éch. | Action | Responsable |

    |---|---|---|

    | J+3 | Retrait des 230 400 € du budget 2027 | DAF |

    | J+10 | Réservation Kelmar, 72 000 unités, signée | Achats |

    | J+18 | **Point de non-retour — contrôle d''exécution** | Ops |

    | J+15 | Lancement Vertex (34 000 €), imputé qualification 2028 | Ingénierie |

    | J+15 | Demande écrite à Sinolux : clause indexée pour 2028 | Achats |


    **Variante à instruire d''ici J+10, sans retarder la réservation :** si Kelmar accepte une réservation
    réduite sans pénalité, réserver 58 000 unités et confier 14 000 à Sinolux sur un lot tracé et isolé.
    Exposition maximale ~7 000 €, contre une **donnée de retour terrain réelle** en 2027 — bien supérieure
    à un vieillissement accéléré pour arbitrer 2028. À abandonner sans discussion si Kelmar impose le
    volume plein : la sécurité d''approvisionnement prime.


    **Condition de réexamen (2028) :** Sinolux redevient éligible si, cumulativement, Vertex mesure ≤
    2,3 % (borne haute 2,6 %, sous seuil) **et** Sinolux accepte une clause indexée sur le taux de retour.
    À défaut de l''un des deux, l''appel d''offres 2028 est reconduit sur base Kelmar.


    **Réserve sur Vertex :** les ±0,3 point sont une précision de répétabilité, pas une preuve que le
    vieillissement accéléré prédit le retour terrain. Conditionner la commande à la fourniture par Vertex
    d''une corrélation documentée avec des retours réels.


    ---


    *Le catalogue de stations de mesure joint en annexe opérationnelle est sans lien avec cet arbitrage
    ; il n''a pas été utilisé.*

    '
