response:
  text: '## Ce que les pièces établissent


    Une seule chronologie est compatible avec les pièces automatiques :


    | Heure | Fait | Pièce |

    |---|---|---|

    | 6 h 25 | Chargement terminé, produit à 3 °C | P1 |

    | 6 h 25 → 9 h 05 | **Aucun relevé de température. 2 h 40 non documentées**, lot sous notre garde,
    sur notre site | P5 (absence) |

    | 9 h 05 | Mise sous tension du groupe froid, 2,9–3,6 °C ensuite | P5 |

    | 11 h 12 | Sortie effective du camion (écriture automatique, sortie unique du jour) | P3 |

    | 12 h 55 | Réception : **1 792** barquettes | P4 |


    Écart P2/P3 : la mention manuscrite « départ 6 h 40 » est contredite par une écriture automatique
    horodatée de notre propre portique, de 4 h 32. Écart P2/P4 : **48 barquettes** entre la quantité contresignée
    par le réceptionnaire (1 840) et la quantité portée au bon de réception (1 792).


    ## Ce que l''entreprise reconnaît


    **1. La sortie a eu lieu à 11 h 12, non à 6 h 40.** La mention portée au BL n° 2418 est inexacte.
    Nous la rectifions spontanément et produisons nous-mêmes le journal de portique. C''est notre pièce
    ; il vaut mieux qu''elle arrive par nous.


    **2. Nous ne disposons d''aucune pièce établissant la température du lot entre 6 h 25 et 9 h 05.**
    Formulation exacte et à ne pas dépasser : ce n''est pas l''aveu d''une rupture, c''est le constat
    d''une lacune documentaire de 2 h 40, pendant laquelle la marchandise était sous notre garde. En tant
    qu''expéditeur, la charge de la traçabilité nous incombe. Nous ne pouvons pas exclure la rupture,
    donc nous ne la contestons pas.


    **3. En conséquence : le refus du lot par le dépôt n''est pas contesté dans son principe**, non plus
    que le résultat des trois barquettes analysées. L''entreprise accepte le principe d''une indemnisation
    de la marchandise effectivement réceptionnée et dont la destruction est justifiée.


    ## Ce qu''elle conteste


    **1. Le quantum global de 21 400 €**, présenté sans ventilation. Aucune pièce ne rattache un euro
    à un poste. Demande de décomposition : valeur unitaire, quantité, transport, base contractuelle de
    la pénalité.


    **2. La quantité indemnisable.** Le dépôt a contresigné 1 840 unités (P2) et en déclare 1 792 (P4).
    Aucune pièce n''explique les 48 manquantes, postérieures au transfert de garde. L''indemnisation ne
    peut porter que sur une quantité établie par pièce.


    **3. L''extrapolation de P6 au lot entier.** Trois barquettes sur 1 840, soit 0,16 %, prélevées par
    un laboratoire mandaté unilatéralement, sans PV de prélèvement au dossier : pas d''heure, pas d''identification
    ni de scellé, pas de contradictoire, pas de conditions de transport des échantillons. Surtout, **aucune
    pièce ne documente les conditions de conservation au dépôt entre 12 h 55 et le prélèvement.** La flore
    mésophile est un indicateur d''hygiène cumulatif : elle ne date pas la rupture et ne l''attribue pas.


    **4. La pénalité de rupture d''assortiment**, dans son principe et son montant, faute de la clause
    invoquée, de la preuve du préjudice réel et de toute pièce établissant que le dépôt nous a mis en
    mesure de substituer le lot.


    **5. Le poste transport**, sans facture ni objet identifié — le transport aller était le nôtre.


    ## Ce qu''on n''écrit pas


    Trois affirmations feraient renvoyer le dossier, et deux nous coûteraient plus que l''enjeu :


    - « Le produit était à 3 °C au départ » — P1 date de 6 h 25, pas de 11 h 12.

    - « La chaîne du froid n''a pas été rompue » — aucune pièce ne le soutient.

    - **P7 en l''état n''est pas une pièce.** Un propos téléphonique non écrit, dont le contenu (« parti
    tôt ») contredit P3, doit être régularisé en déclaration écrite et signée ou retiré du bordereau.
    Ne pas l''envoyer tel quel.


    ## Ce qu''elle engage sous huit jours


    **Acte 0 — dès aujourd''hui, sécurité avant contentieux.** Balayage traçabilité : autres lots chargés
    dans la même session de quai le 3 juin, à la même remorque non réfrigérée. Le lot F-2418 a été refusé
    et détruit, donc sans exposition consommateur ; ce n''est pas le cas d''un lot parti ailleurs. Cette
    vérification prime le litige commercial et son résultat conditionne tout le reste.


    **Acte 1 — la lettre, avant l''expiration du délai.** LRAR + courriel daté. Elle ne règle rien : elle
    empêche la pénalité d''être acquise de plein droit, reconnaît les points 1 à 3, conteste les points
    1 à 5, et annonce les actes ci-dessous. **Le point de départ des huit jours n''est établi par aucune
    pièce au dossier** — faire courir le délai depuis la date portée sur la réclamation elle-même, pas
    depuis sa réception supposée, et joindre la réclamation au bordereau (P8).


    **Acte 2 — acheter l''information décisive.** Analyse immédiate de l''échantillothèque du même lot
    de production F-2418, flore mésophile, laboratoire accrédité. Niveau bas à la production : la cause
    est en aval de la fabrication et la discussion porte sur le partage. Niveau déjà élevé : le sujet
    n''est pas le quai, et il faut le savoir avant de transiger. Coût faible, effet décisif — mais résultat
    à 72 h minimum, donc **postérieur à la lettre** : la lettre doit réserver la position, pas la clore.


    **Acte 3 — combler les lacunes documentaires.** Déclarations écrites et signées de l''opérateur de
    quai et du chauffeur ; export brut intégral de l''enregistreur avec journal des événements d''alimentation
    ; relevé de la chambre froide et de la température ambiante du quai sur 6 h 25 – 9 h 05 ; **vérification
    de l''existence et de l''usage d''une alimentation secteur de quai** (voir repli).


    **Acte 4 — sommation de pièces au dépôt**, avec délai : ventilation du montant, certificat de destruction
    avec quantité et date, facture de transport, clause d''assortiment invoquée, PV de prélèvement du
    laboratoire, relevés de température du dépôt entre 12 h 55 et le prélèvement, explication de l''écart
    de 48 unités.


    **Acte 5 — déclaration à l''assureur** dans le délai de police, avec bordereau numéroté P1 à P19 et,
    en tête, une note signalant explicitement la mention erronée « 6 h 40 ». Une inexactitude signalée
    par nous est un incident documentaire ; découverte par l''assureur, c''est une fausse déclaration
    et un motif de refus de garantie. C''est le seul risque du dossier qui soit sans retour.


    **Acte 6 — correctif immédiat**, opposable et vérifiable : mise sous tension du groupe froid contrôlée
    avant chargement, et heure de départ du BL reprise du portique, jamais portée à la main.


    ## Le repli et ce qui renverserait la position


    **L''observation qui inverse la reconnaissance n° 2 :** une pièce établissant que la remorque était
    branchée sur alimentation de quai avant 9 h 05, ou un relevé montrant le lot en chambre froide jusqu''au
    chargement effectif. L''enregistreur ne mesure que sa propre alimentation ; son silence prouve qu''il
    était éteint, pas que le produit était chaud. Si l''acte 3 produit cette pièce, la lettre doit être
    reprise avant envoi.


    **Le meilleur contre-argument adverse, et sa limite :** que la lacune de 2 h 40 suffise à nous imputer
    la totalité. Elle ne suffit pas — un facteur 4 sur la flore mésophile est aussi compatible avec plusieurs
    heures de conservation approximative au dépôt, dont aucune pièce ne rend compte. Cet argument tient
    pour discuter le partage. Il ne tient pas pour nier la lacune, qui reste nôtre quelle que soit la
    causalité.


    **Le déclencheur de repli :** si l''échantillothèque revient conforme et que le dépôt ne produit ni
    PV de prélèvement ni ses propres relevés de conservation sous quinze jours, passer de la contestation
    du quantum à la contestation de l''imputation.


    **La sortie proposable, si le dépôt produit ses pièces :** indemnisation des 1 792 unités à valeur
    de revient documentée, abandon réciproque de la pénalité d''assortiment, réapprovisionnement prioritaire
    à prix coûtant et protocole correctif conjoint. Cela coûte moins que le contentieux et conserve le
    compte — à condition que l''acte 0 soit revenu négatif.

    '
