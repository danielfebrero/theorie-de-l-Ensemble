response:
  text: '# NOTE AU CONSEIL — séance de jeudi

    **Objet :** affectation de l''enveloppe unique de 900 000 € — dossiers A (machines) et B (direction
    qualité)


    ---


    ## 1. Réponse à la demande d''un tableau unique


    Nous fournissons le tableau demandé (§4). Une réserve doit cependant être posée d''emblée : **les
    deux dossiers ne se mesurent pas avec le même instrument.**


    Le dossier A repose sur cinq ans de maintenance horodatée et auditée. Le dossier B repose sur un fait
    certain (un départ dans 11 mois) et sur des conséquences dont personne, chez nous ni ailleurs, ne
    connaît la fréquence : nous n''avons jamais changé de directeur qualité et aucun comparable sectoriel
    n''est accessible.


    Classer les deux par un même « rendement en euros » n''unifie pas la décision, il déplace simplement
    l''arbitrage dans le choix des chiffres. Démonstration : la cotation du cabinet RH (35 % × 4,2 M€)
    produit une perte évitée de **1,47 M€**, qui placerait mécaniquement toutes les lignes du dossier
    B en tête du classement. Ce chiffre viendrait alors décider à notre place. Or il a été produit en
    atelier par trois consultants n''ayant jamais travaillé dans le dispositif médical, sans historique
    et sans cas de référence. **C''est une opinion mise en chiffres, pas une mesure.** Nous la retenons
    comme signal — le sujet est grave — et nous l''écartons du tableau.


    ## 2. Dossier A — Machines : le calcul est solide, mais incomplet


    Sur les données auditées, parc complet :


    - Arrêts : 362 h/an, soit 42 600 €/an de coût direct d''immobilisation, plus 13 756 €/an de marge
    non produite (362 h × 38 €) → **56 000 €/an au maximum théorique**, ramenés à **~45 000 €/an** en
    tenant compte des 4 % d''indisponibilité qui subsistent dans l''engagement fournisseur.

    - Rapporté aux 620 000 €, cela donne un retour sur **environ 14 ans** — au-delà des 7 ans de garantie.


    **Autrement dit : sur les arrêts seuls, le renouvellement ne se rembourse pas.** La rentabilité du
    dossier tient entièrement à la seconde ligne — le rebut, 4,1 % contre 1,2 % garanti — et c''est précisément
    la ligne que nous ne savons pas chiffrer : le volume annuel produit et le coût unitaire d''une pièce
    rebutée ne figurent dans aucun des documents transmis.


    Deux conséquences :

    1. **Nous n''engageons pas le parc complet cet exercice.** Nous achetons 4 machines sur 6, en commençant
    par celles qui concentrent la part la plus lourde des 47 pannes — la donnée existe, elle est horodatée,
    il faut simplement l''extraire par machine avant jeudi. Douze mois d''exploitation nous donneront
    le gain réel de rebut, et les 2 dernières seront décidées sur mesure et non sur promesse.

    2. **Nous faisons inscrire au contrat le maintien des conditions unitaires** sur les deux tranches
    restantes. Cela ne coûte rien aujourd''hui et préserve l''option.


    ## 3. Dossier B — Direction qualité : ce n''est pas un investissement, c''est une échéance


    Le dossier B n''a pas de rendement, il a une date. Dans 11 mois, nous perdons simultanément le seul
    interlocuteur reconnu par l''organisme notifié, le formateur des 9 auditeurs internes, et le lien
    personnel avec deux clients représentant 31 % du chiffre d''affaires. Ces trois pertes tombent le
    même jour.


    Les trois pistes RH ont été présentées comme des alternatives. **Ce sont en réalité des briques complémentaires**,
    et la moins chère des trois n''est pas la plus faible : la promotion de l''adjointe (45 000 €) est
    la seule qui construise un successeur durable, la mission de transition (90 000 €) est la seule qui
    permette un transfert accompagné auprès de l''organisme notifié et des deux clients. Nous engageons
    les deux, soit 135 000 €.


    Deux points que personne n''a chiffrés et qui sont pourtant le vrai chemin critique :

    - **Le transfert de la reconnaissance externe** (présentation formelle du nouvel interlocuteur à l''organisme
    notifié, audits conjoints, visites clients à deux). Nous plafonnons cette ligne à 70 000 €, à chiffrer
    par la direction avant engagement.

    - **Le recours de repli.** Si la voie interne échoue, nous ne pourrons pas la corriger : l''enveloppe
    sera perdue et il n''y aura pas de nouveau tour de table avant douze mois. Nous engageons donc dès
    cet exercice les 280 000 € du recrutement externe sous forme de mandat activable, avec **décision
    de déclenchement au mois 5**, sur trois critères observables : accord écrit de l''organisme notifié
    sur le nouvel interlocuteur, deux audits internes conduits seule par l''adjointe, rencontre effectuée
    avec les deux clients hospitaliers. Deux critères sur trois non tenus au mois 5 : le mandat part,
    et il reste 6 mois de recouvrement avec le titulaire encore en poste.


    ## 4. Le tableau


    | Ligne | Montant | Base de décision | € rendus par € engagé |

    |---|---|---|---|

    | A — machines les plus défaillantes (4/6) | 414 000 € | 5 ans de maintenance auditée | ~0,7 sur 7
    ans (arrêts seuls) ; à revoir avec le rebut réel |

    | A — 2 machines restantes | 207 000 € | idem | **reporté** — décidé sur mesure à 12 mois |

    | B — promotion de l''adjointe | 45 000 € | échéance certaine à 11 mois | non calculable |

    | B — mission de transition | 90 000 € | échéance certaine à 11 mois | non calculable |

    | B — transfert organisme notifié + clients | ≤ 70 000 € | échéance certaine à 11 mois | non calculable
    |

    | B — mandat externe activable (mois 5) | 280 000 € | irréversibilité de l''enveloppe | non calculable
    |

    | *Cotation cabinet RH (35 % / 4,2 M€)* | *—* | *atelier, hors secteur, sans précédent* | **écartée**
    |


    **Total engagé : 899 000 €** — A : 414 000 € · B : 485 000 €.


    ## 5. L''objection la plus forte, et notre réponse


    *On immobilise 280 000 € — près d''un tiers de l''enveloppe — sur un recrutement qui n''aura peut-être
    jamais lieu, pendant qu''on renonce à deux machines dont les pannes sont, elles, documentées.*


    C''est exact, et c''est assumé pour une seule raison : **les deux lignes ne se rattrapent pas de la
    même façon.** Deux machines non achetées restent achetables — le fournisseur maintient ses conditions
    unitaires, la douleur est mesurée et supportable. Un recrutement de directeur qualité non financé
    après la fermeture de l''enveloppe ne se rattrape pas avant douze mois, dans une entreprise qui aura
    alors perdu son titulaire, son certificateur de référence et son lien avec 31 % de son chiffre d''affaires.
    Nous payons ici un délai sur A pour ne pas prendre un risque irréversible sur B.


    **Ce qui est demandé au conseil jeudi :** valider les trois décisions ; mandater la direction industrielle
    pour l''extraction des pannes par machine et le chiffrage du rebut ; fixer le point d''arrêt du mois
    5 comme point d''ordre du jour, non comme intention.

    '
