response:
  text: 'Le plan est rédigé. Voici ce qu''il dit, et pourquoi.


    **Le dossier attire l''œil sur la mauvaise contrainte.** L''écart d''autonomie (260 annoncés, 197
    par 2 °C) est réel mais ce n''est pas lui qui limite le déploiement. C''est l''heure de borne. Recharger
    l''énergie d''un kilomètre hivernal coûte ~3 minutes de borne (6 h ÷ 197 km). La flotte roule 16 128
    km/jour → **492 heures-borne par nuit**. Nous en avons 168.


    | Bornes | Heures-borne/nuit | VE réellement alimentables |

    |---|---|---|

    | 14 (aujourd''hui) | 168 | 33 |

    | 22 (après devis) | 264 | 51 à 60 selon la longueur des tournées |

    | **36–41 (pour les 96)** | **492** | **non financé** |


    Trois conséquences : les 8 bornes sont le chemin critique de la subvention, pas une option ; 60 véhicules
    consomment 99,6 % de la capacité nocturne à 22 bornes ; et **l''infrastructure des véhicules 61 à
    96 n''existe ni au budget ni au devis** — 370 à 500 k€ manquants, décision de décembre au plus tard.


    **Le seuil opérationnel se déduit de la note reçue hier.** 11 incidents sur 120, tous au-delà de 190
    km, sur une autonomie de 232 : rapport de sûreté 0,82. Appliqué aux 197 km hivernaux → **plafond de
    160 km, soit en dessous de la tournée moyenne de 168**. D''où le cœur du plan : ne pas aplatir les
    tournées mais les rendre bimodales — 36 tournées diesel à 215 km absorbent les kilomètres longs, les
    60 tournées électriques retombent à 140 km de moyenne. Le nombre 36 n''est pas choisi, c''est le complément
    exact de ce que 22 bornes alimentent.


    **Le seul verrou dur du dossier est contractuel.** Un diesel rendu revient dans 11 semaines. Le conserver
    coûte 480 €/mois, une tournée ratée 900 € : un incident évité paie deux mois de conservation. Je découple
    donc le calendrier de reprise du calendrier de livraison — enveloppe plafond 120 000 €, révisable
    à la baisse chaque mois, remboursée en ~15 jours de mauvais temps. Le lot 4 n''a volontairement pas
    de date : ces 24 diesels *sont* les véhicules des tournées que les bornes ne peuvent pas alimenter.


    **Deux vérifications peuvent tout changer, et coûtent un courrier chacune :**

    - Le libellé exact de « 60 véhicules roulent ». Si cela signifie *immatriculés*, 72 seront livrés
    fin novembre et la contrainte disparaît.

    - La puissance de raccordement. 22 bornes appellent 484 kW ; le dossier ne dit pas si les 210 k€ couvrent
    le raccordement, ni le délai du gestionnaire de réseau — couramment 3 à 6 mois, bien au-delà des 7
    semaines de travaux. Si la réponse est mauvaise, le repli est le plafonnement à ~35 VE et la conservation
    de 60 diesels (~180 k€), avec saisine de la Région pour report.


    **Point d''attention de calendrier :** le préavis du lot 1 doit partir le 1ᵉʳ septembre, avant la
    prochaine séance. Sans délégation votée jeudi, 24 véhicules partent par défaut pour 11 semaines. C''est
    la décision qui ne peut pas attendre.


    La publication en ligne a été refusée — le fichier vous est envoyé directement.

    '
