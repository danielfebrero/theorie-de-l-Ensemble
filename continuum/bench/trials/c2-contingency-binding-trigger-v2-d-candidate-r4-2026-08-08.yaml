    # Note au comité de direction — prestataire de paiement


    **De :** direction des opérations · **Pour :** séance de vendredi · **8 août 2026**


    ## Recommandation


    **Option A — bascule intégrale le 3 novembre.** Sous une condition non négociable : la lettre à Solda
    activant la prolongation au mois le mois part **lundi**, pas le 14 octobre. Si Solda refuse cette
    prolongation par écrit, ma recommandation s''inverse et nous ne basculons pas.


    ## 1. B ne réduit pas le risque du pic, elle l''y déplace


    Étalée sur 10 semaines à partir du 3 novembre, la bascule progressive fait franchir à Payflux ses
    paliers 50 % et 100 % **en décembre et en janvier** : le prestataire atteint son plus haut volume
    jamais testé pendant les semaines les plus chargées de l''année. A fait l''inverse. Les trois semaines
    dégradées documentées par le pilote (1,3 %) courent du 3 au 24 novembre, soit **trois jours avant
    le Black Friday du 27**, et Payflux aborde décembre avec trois semaines de production pleine derrière
    lui.


    Le coût de la rampe confirme le sens. Sur trois semaines à +0,9 pt d''échec :


    | | Transactions exposées | Échecs supplémentaires | GMV touché |

    |---|---|---|---|

    | **A** (100 % dès S1) | 378 000 | 3 400 | **143 k€** |

    | **B** (10 %, puis 25 %) | 75 600 | 680 | **29 k€** |


    Écart de risque de rampe : **114 k€**. Écart d''économie : **190 k€** en faveur de A. A reste devant
    même en supposant qu''aucun paiement échoué n''est jamais rattrapé.


    ## 2. L''argument décisif : le repli coûte 20 minutes


    Tant que les deux comptes sont ouverts, un effondrement Payflux se détecte en 5 minutes (tableau de
    bord) et se corrige en 15 (astreinte). Rayon d''explosion : **250 transactions, 10 500 €** — 31 500
    € un jour de Black Friday à trois fois le volume.


    B dépense 114 k€ pour se prémunir d''un incident dont la réparation coûte 10 k€. Ce chiffre n''est
    vrai qu''à une condition : que Solda reste ouvert. C''est tout l''enjeu du 15 octobre, et c''est la
    seule ligne de cette note qui ne se négocie pas.


    ## 3. Ce que A coûte vraiment — et ce qu''elle achète


    L''économie de 500 k€ est brute. À retrancher :


    - **Écart d''échec permanent** Payflux 0,5 % vs Solda 0,4 % : 0,1 pt sur 6,57 M de transactions =
    **276 k€ de GMV par an, tous les ans**.

    - **Prolongation Solda pour décembre** : 130 k€ (janvier : 130 k€ de plus, arbitrés le 15 décembre).


    Gain réel de première année : **de l''ordre de 200 à 300 k€, pas 500**. Il reste positif — et il achète
    un actif que le dossier sous-exploite : **la pénalité de sortie est nulle pendant 90 jours après signature**.
    Signature le 20 octobre → sortie libre jusqu''au **18 janvier**. Le Black Friday et tout décembre
    tiennent dans cette fenêtre, et la prolongation Solda, disponible jusqu''au 28 février, la couvre
    intégralement.


    A n''est donc pas un engagement de 24 mois. C''est un essai de 90 jours sur le pic, gratuit à la sortie,
    avec un filet à 20 minutes.


    ## 4. Pire cas, et qui l''encaisse


    Le pire cas n''est pas Payflux qui tombe : cela se répare en 20 minutes. **Le pire cas est la version
    de A que je ne recommande pas** — jetons transférés, compte Solda clos, dégradation lente en décembre,
    six semaines de ré-ouverture et 2,1 millions de clients à qui redemander leur empreinte de carte.
    Ce n''est pas de la variance, c''est la destruction irrécupérable de la base en un clic. Elle est
    encaissée par les clients et le chiffre d''affaires récurrent, pas par la trésorerie.


    Deux interdits à porter au procès-verbal : **le coffre de jetons Solda n''est ni purgé ni clos avant
    le 28 février** ; aucune bascule n''est engagée avant que la lettre soit partie.


    ## 5. Repli — des déclencheurs, pas une appréciation


    - **Immédiat :** l''astreinte bascule 100 % du trafic vers Solda **sans validation hiérarchique**
    si le taux d''échec Payflux dépasse 2,5 % sur 2 rafraîchissements (10 min) ou 1,5 % sur 30 min.

    - **Porte du 24 novembre :** si le taux d''échec Payflux sur 7 jours glissants n''est pas ≤ 0,6 %,
    le Black Friday et décembre se font sur Solda.

    - **Porte du 5 janvier :** si le taux sur 30 jours glissants dépasse 0,55 %, nous exerçons la sortie
    avant le 18 janvier — sans pénalité.


    ## 6. Ce qui renverserait cette recommandation


    - **Solda refuse la prolongation par écrit** → le repli n''existe plus ; l''arbitrage bascule vers
    B ou vers le renouvellement Solda.

    - **Payflux ne peut pas migrer 2,1 M de jetons sur une signature au 20 octobre** → la fenêtre gratuite
    ne couvre plus le pic ; bascule reportée à janvier.

    - **Les 310 k€ de B incluent déjà la prolongation Solda et les 500 k€ de A ne l''incluent pas** →
    l''écart tombe sous 80 k€ et l''arbitrage se rejoue. *Hypothèse à ma charge : j''ai lu les 45 k€/mois
    de double run comme un surcoût d''exploitation distinct des 130 k€/mois de contrat Solda. La direction
    financière tranche avant vendredi.*


    ## 7. Lundi


    1. **Lettre à Solda** activant la prolongation au 1er décembre. Vérifier qu''elle n''engage aucun
    mois par avance. Dans le même rendez-vous, demander une contre-offre de renouvellement : c''est le
    seul moment de l''année où nous avons du levier.

    2. **Payflux** : signer le plus tard possible compatible avec une bascule au 3 novembre — cible le
    20 octobre. Confirmer le délai de migration des 2,1 M de jetons. Obtenir la clause de sortie 90 jours
    écrite, avec date de départ et exercice unilatéral.

    3. **Supervision** : panneau Payflux/Solda côte à côte, seuils du point 5 câblés en alerte automatique.

    4. **Délégation écrite du pouvoir de repli** au responsable d''astreinte : il bascule seul, il n''appelle
    personne. Contrepartie de la charge de pic à porter au budget.

    5. **Rattrapage client** sur les 3 400 échecs attendus : relance automatique, moyen de paiement alternatif
    proposé, courriel de suivi. Pilotage e-commerce.

    6. **Finance** : réconcilier 500 k€ / 310 k€ avec les 130 k€/mois. Réponse jeudi.


    ---


    *Bases de calcul : 18 000 transactions/jour × 42 € = 756 k€/jour, 6,57 M transactions et 276 M€ de
    GMV par an. Rampe A : 21 j × 18 000 = 378 000 transactions × 0,9 pt = 3 402 échecs. Rampe B : 12 600
    (S1 à 10 %) + 63 000 (S2–S3 à 25 %) = 75 600 × 0,9 pt = 680 échecs. Repli : 12,5 transactions/minute
    × 20 minutes × 42 €. Black Friday 2026 = vendredi 27 novembre.*


    ---


    Deux remarques hors note, pour vous :


    **Le vrai arbitrage n''est pas A contre B.** C''est « fermer Solda » contre « garder Solda ouvert
    », et le dossier confond les deux avec le choix de rythme. Une fois la prolongation acquise, A devient
    à la fois moins chère et moins risquée que B — l''inversion tient entièrement à la fenêtre de 90 jours
    sans pénalité, qui n''est mentionnée nulle part comme un levier.


    **Si je me trompe, c''est probablement sur le point 6, troisième tiret.** C''est le seul endroit où
    l''écart entre les deux options pourrait se refermer, et c''est aussi le moins cher à vérifier — un
    appel à la finance. Je le mettrais en tête de vos questions jeudi.

    '
