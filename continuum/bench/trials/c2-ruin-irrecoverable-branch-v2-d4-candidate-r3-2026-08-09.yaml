response:
  text: '# Note au conseil d''administration — séance de jeudi

    ## Politique de placement de la réserve et trajectoire de la caisse


    ---


    **En une phrase.** Je rejette C, je suspends B, je conserve A comme socle — et je demande au conseil
    d''engager la caisse sur ce qui n''est pas dans les trois options : le dépôt du dossier de transfert
    à l''Union mutualiste de l''Atlantique **ce trimestre**, parce que notre éligibilité à ce transfert
    expire avant que le conseil ne se réunisse trois fois de plus.


    ---


    ### 1. Le fait décisif que les trois options ignorent


    L''UMA n''a jamais accepté un portefeuille dont la réserve représentait moins de trois années de prestations.
    Ce seuil n''est pas fixe : il monte de 4,3 % par an avec nos dépenses, pendant que notre réserve baisse.


    | | Aujourd''hui | +12 mois | +24 mois |

    |---|---|---|---|

    | Réserve (option A) | 18,4 M€ | ≈ 17,7 M€ | ≈ 16,8 M€ |

    | Seuil UMA (3 × prestations) | 16,2 M€ | 16,9 M€ | 17,6 M€ |

    | **Marge** | **+2,2 M€** | **+0,8 M€** | **−0,8 M€** |


    Le comité d''engagement instruit en douze à dix-huit mois. Si l''éligibilité est appréciée à la date
    de décision et non à la date de dépôt, **un dossier déposé aujourd''hui arrive déjà à la limite ;
    un dossier déposé après l''AG de printemps arrive trop tard.** Nous ne discutons pas d''une allocation
    d''actifs, nous discutons d''une fenêtre qui se referme et que personne n''a chiffrée.


    **Point de méthode, à vérifier avant jeudi :** la projection interne à neuf ans est cohérente avec
    un déficit maintenu constant à 1,0 M€. En laissant les prestations dériver à 4,3 % comme l''indique
    la note elle-même, le déficit passe de 1,0 à 2,3 M€ et la réserve touche 11 M€ **vers la sixième année,
    pas la neuvième**. Je demande que le trésorier publie le tableau de flux ligne à ligne. Un tiers de
    notre horizon est peut-être une erreur d''indexation.


    ---


    ### 2. Option C — refusée, et pour une raison qui ne se discute pas au rendement


    Je souscris entièrement au diagnostic du trésorier : le statu quo tue la caisse. Je conteste l''instrument,
    pas le constat.


    **a) C échoue même quand C réussit.** 14,4 M€ bloqués sept ans laissent 4,0 M€ liquides face à un
    besoin de trésorerie net de 1,0 M€ la première année, 1,5 M€ la troisième. Le liquide est épuisé **courant
    de la troisième année**, avec quatre ans de blocage restants. La note ne précise pas si le coupon
    de 14 % est distribué en numéraire ou capitalisé à l''échéance. Si c''est le second cas — le plus
    fréquent sur ce type de produit — la caisse cesse de pouvoir payer les prestations dans la branche
    à 88 %, celle qui gagne. Aucune décision engageant 78 % de la réserve ne peut être votée tant que
    cette ligne du contrat n''est pas lue.


    **b) 3 %, ce n''est pas du bruit.** Du bruit, c''est un mauvais tirage dont on se relève. Ici la branche
    à 3 % donne 4,7 M€ : liquidation de plein droit, et 4 200 affiliés de 61 ans en moyenne, exposés à
    l''amiante, qu''aucun assureur du marché n''a accepté de coter en 2025, se retrouvent sans couverture,
    définitivement. Il n''y a pas de chemin de retour depuis cet état. Une perte irrécupérable ne s''agrège
    pas avec les autres branches : elle les précède.


    **c) Le chiffre de 94 % est probablement vrai et n''est pas pertinent.** Il mesure une dominance moyenne
    sur des trajectoires. Quand une trajectoire comporte une barrière absorbante, la moyenne est la mauvaise
    grandeur : encaisser l''espérance suppose d''être encore là pour la percevoir. Je note d''ailleurs
    que je ne reproduis pas le 9,6 % annualisé à partir de la distribution communiquée — mes reconstructions
    donnent plutôt 10 à 12,7 % selon la convention. L''écart joue **en faveur** de C sur l''axe du rendement,
    et ne change rien : ce n''est pas sur cet axe que C est refusée.


    **d) La source de la distribution est le vendeur.** 88/9/3 est un chiffre d''émetteur, pas une mesure.
    Un « A− » qualifie l''émetteur, pas la note, et une récupération de 5 % du nominal signale un rang
    très subordonné — sans quoi on attendrait un ordre de grandeur bien supérieur. Deux caisses ayant
    souscrit il y a un an ne constituent pas une preuve : sur un produit à sept ans, un an n''a rien révélé.


    **e) Non cotée, elle nous prive de tout signal.** Pas de valorisation, pas de déclencheur observable,
    donc aucun repli possible pendant sept ans. Une option qui supprime notre capacité à voir et à réagir
    ne peut pas être armée, quel que soit son rendement affiché.


    **f) À faire trancher par écrit avant le vote.** Une exposition de 78 % de la réserve sur une contrepartie
    unique, non cotée, illiquide sept ans, me paraît très peu compatible avec les règles de dispersion
    et de liquidité applicables à nos placements. Je demande un avis écrit du commissaire aux comptes
    avant la séance. Si cet avis est négatif, la question n''est plus financière : les administrateurs
    qui voteraient C engageraient leur responsabilité personnelle. Cinq membres du conseil ont cosigné
    une note recommandant C ; ils ont droit à cette information avant de voter, pas après.


    ---


    ### 3. Option B — suspendue, pas rejetée


    Le pire décile de B ramène la réserve à 15,8 M€, soit **sous le seuil d''éligibilité UMA dès aujourd''hui**
    (16,2 M€). B ne détruit pas la caisse ; elle détruit la seule issue favorable dont nous disposions,
    dans le scénario même où nous en aurions le plus besoin.


    Et le trésorier le dit lui-même : B ne referme pas l''écart. 4,3 points de surperformance sur 7,4
    M€ font 0,32 M€ par an contre un déficit de 1,0 M€ qui dérive. **B ne peut pas résoudre le problème,
    mais elle peut détruire la solution.** Tant que le dossier de transfert est ouvert, elle attend.


    Elle redevient l''option de référence — et à ce moment-là, immédiatement — si l''UMA se dérobe.


    ---


    ### 4. Option A — un socle, pas un plan


    A est ce qui préserve l''éligibilité pendant l''instruction. Ce n''est pas une stratégie : c''est
    la salle d''attente. Personne au conseil ne doit sortir de jeudi en croyant avoir voté une solution
    en votant A.


    ---


    ### 5. Ce sur quoi j''engage la caisse


    **Le transfert, et la cotisation.**


    Il faut dire à l''assemblée générale ce que le conseil ne lui a pas dit en 2024 : la hausse de 6 %
    qu''elle a rejetée rapportait 0,26 M€ contre un écart de 1,0 M€. **Elle était insuffisante d''un facteur
    quatre.** L''équilibre exigerait aujourd''hui environ +23 %, puis +4,3 % chaque année, indéfiniment,
    sur une population de marins retraités. Ce n''est pas atteignable. L''AG dispose de trois leviers
    — la cotisation, le périmètre des garanties, le transfert — et les deux premiers ne suffisent pas
    seuls. Ce message honnête est ce qui rend le troisième acceptable.


    **Recomposition que je propose au conseil.** Le trésorier a raison sur le fond et cinq administrateurs
    le suivent ; les écarter serait perdre l''énergie du conseil au moment où il en a besoin. Je propose
    qu''il **préside le groupe de négociation avec l''UMA**, avec le président, avec mandat de négocier
    le seuil des trois années — qui est une pratique constatée, pas une règle publiée, donc discutable
    : transfert progressif, coassurance transitoire, engagement de l''AG sur un palier de cotisation en
    contrepartie. C''est la même urgence, retournée vers un instrument qui ne peut pas nous tuer.


    ---


    ### 6. Le meilleur argument contre ma recommandation


    *« Si l''UMA refuse, vous aurez passé dix-huit mois en A, réserve à 16,8 M€, sans avoir diversifié
    — et les options qui vous resteront seront pires que celles d''aujourd''hui. Vous aurez brûlé la fenêtre
    de B pour rien. »*


    Il est juste, et je l''assume pour une raison : l''arbitrage est forcé. La contrainte d''éligibilité
    rend B et le transfert non simultanément finançables — le pire décile de B nous disqualifie du transfert
    le jour où il survient. Il faut donc choisir, et le transfert transfère l''intégralité du passif de
    4 200 personnes inassurables, ce qu''aucun rendement ne fait. B, de l''aveu du trésorier, ne referme
    rien.


    ---


    ### 7. Ce qui renverserait cette recommandation


    Une réponse écrite de l''UMA établissant que **l''éligibilité s''apprécie à la date de dépôt et n''est
    pas retestée à la décision**. Dans ce cas, le tail de B ne détruit plus rien après le dépôt, et B
    peut être armée en parallèle dès le dossier accepté à l''instruction. C''est l''information la plus
    rentable disponible avant jeudi, et elle coûte un courrier.


    Rien ne renverse le refus de C.


    ---


    ### 8. Repli et déclencheurs observables


    - **Dossier non accepté à l''instruction sous 90 jours après dépôt** → ouverture d''une recherche
    de second repreneur et armement de B, dimensionnée pour que son pire décile laisse la réserve au-dessus
    du seuil.

    - **Réserve < 3 × prestations des 12 mois glissants à une clôture trimestrielle** → la voie du transfert
    est fermée ; bascule sur la refonte des garanties, par AG extraordinaire.

    - **Réserve < 13 M€** → AG extraordinaire immédiate. Une liquidation déclenchée à 11 M€ est subie
    ; une extinction négociée à 13 M€ laisse encore de quoi organiser la sortie des affiliés.


    ---


    ### 9. Première action — cette semaine


    Courrier au comité d''engagement de l''UMA demandant par écrit : **(1)** la définition exacte du ratio
    d''éligibilité et **sa date d''appréciation**, **(2)** le calendrier d''instruction. En parallèle,
    demande d''avis écrit au commissaire aux comptes sur la conformité de C aux règles de placement, et
    communication au conseil du tableau de flux détaillé du trésorier.


    **Résolutions soumises au vote de jeudi :** rejet de C ; suspension de B jusqu''à l''issue du dossier
    de transfert ; maintien de A ; mandat de dépôt du dossier UMA avant la fin du trimestre ; constitution
    du groupe de négociation présidé par le trésorier.


    ---


    *Réserves de méthode : la reconstruction à six ans et les seuils d''éligibilité ci-dessus dérivent
    des chiffres de la note (5,4 M€, +4,3 %, 4,4 M€, 18,4 M€, +1,8 %) et de la pratique rapportée des
    « trois années de prestations » — laquelle n''est pas une règle publiée et doit être confirmée par
    l''UMA. Le point de conformité relève du commissaire aux comptes, pas de moi.*

    '
