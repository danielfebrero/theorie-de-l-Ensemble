response:
  text: 'Camille, voici les deux choses, prêtes à recopier.


    ## 1. La date


    **Ce n''est pas le 2 juin. C''est le lundi 15 juin 2026.**


    Le calcul, en trois lignes, pour que tu puisses le vérifier une fois et ne plus y penser :


    - Point de départ : la réception par l''agence, **jeudi 14 mai 2026** (leur accusé de réception).

    - Un mois plein → le terme tombe le **dimanche 14 juin 2026**.

    - Le 14 juin est un dimanche : la clause du bail reporte alors au premier jour ouvrable suivant, soit
    le **lundi 15 juin 2026** (ce n''est pas un jour férié — le lundi de Pentecôte 2026 tombe le 25 mai).


    La phrase à mettre dans le courrier :


    > Le préavis d''un mois courant à compter de la réception de la présente par vos services, le bail
    prendra fin le lundi 15 juin 2026.


    ## 2. Les trois phrases


    > **1)** À la suite du décès de ma mère, Mme Yvette Rambert, survenu le 2 mai 2026, locataire du logement,
    je vous écris pour vous notifier la résiliation du bail.

    >

    > **2)** Je pourrai vous restituer les clés à la date qui vous conviendra, mais pas avant la fin du
    préavis : le logement ne sera pas entièrement vidé d''ici là, et je préfère vous le signaler dès à
    présent.

    >

    > **3)** Je vous remercie de bien vouloir m''accuser réception de ce courrier et de me faire parvenir
    le solde du dépôt de garantie de 780 euros que vous détenez.


    Je n''ai rien ajouté ni retiré au fond : même contenu, même engagement sur les clés, même demande
    sur les 780 €.


    Une seule chose à vérifier avant de fermer l''enveloppe : que la date du 2 juin n''apparaisse pas
    ailleurs dans le brouillon (parfois elle est répétée en objet ou en fin de lettre).


    Le reste, tu le vois demain avec ta sœur. Repose-toi.

    '
