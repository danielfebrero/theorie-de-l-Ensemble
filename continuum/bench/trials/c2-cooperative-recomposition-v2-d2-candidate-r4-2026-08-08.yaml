response:
  text: '# Position du président — répartition de la ressource en période d''étiage exceptionnel


    *Note remise avant la séance de jeudi.*


    ---


    ## 1. Ce que je propose, en six lignes


    1. **Le débit réservé de 180 L/s n''entre pas dans l''arbitrage.** Il est fixé par arrêté préfectoral,
    et la commission n''a pas compétence pour y déroger. Il est également adossé à la seule perte documentée
    comme non reconstituable du dossier. Il sort de la table.

    2. **La régie obtient immédiatement, par écrit, une garantie inconditionnelle — mais portant sur le
    besoin sanitaire vérifié, pas sur les 150 L/s historiques.** Les 150 L/s sont maintenus 15 jours,
    le temps de l''audit de réseau.

    3. **L''irrigation reçoit le résidu, exprimé en part d''un solde variable et non en litres fixes**
    : `R = Q(moyenne glissante) − 180 − Q_potable`. Aujourd''hui R = 80 L/s.

    4. **Quotas individuels, pas volume global par usage.** Avec un tour d''eau par secteur comme régime
    provisoire tant que les compteurs ne sont pas posés.

    5. **Les 600 000 € ne servent pas à indemniser.** Ils servent à mesurer et à récupérer de l''eau —
    c''est le seul emploi qui produise des litres.

    6. **La règle de levée de 2022 est abrogée.** Remplacée par une indexation continue asymétrique, sans
    seuil ni date.


    ---


    ## 2. Trois grandeurs manquent au dossier, et l''une d''elles peut tout changer


    Je refuse d''ouvrir la séance sur l''équation « 570 − 410 = 160 ». Elle est arithmétiquement juste
    et analytiquement fausse, parce qu''elle traite comme connues trois quantités que nous ne connaissons
    pas.


    **a) La réserve utile du barrage.** Nous arbitrons un bilan de débits *entrants* en exploitant un
    ouvrage de stockage, sans que le stock figure nulle part au dossier. Le déficit de 160 L/s représente
    13 824 m³/jour, soit environ 290 000 m³ sur les trois semaines qui nous séparent d''une pluie possible.
    La question « le barrage détient-il tout ou partie de ces 290 000 m³ mobilisables ? » est la première
    du dossier, et personne ne l''a posée. Tant qu''elle n''a pas de réponse, je décide dans l''hypothèse
    conservatrice d''un stock nul au-delà de ce qui sécurise le débit réservé et le tampon de la régie
    — mais je considère cette hypothèse comme provisoire et non comme un fait.


    **b) Le besoin réel de la régie.** 150 L/s pour 9 200 habitants représentent **1 409 litres par habitant
    et par jour**. La consommation domestique française se situe autour de 150 litres. Le facteur est
    de l''ordre de neuf. Même en retenant une hypothèse généreuse — 250 L/hab/j tous usages confondus
    — le besoin desservi serait de l''ordre de 27 L/s. L''écart s''explique nécessairement par une combinaison
    de trois causes : d''autres abonnés que Ferney, un rendement de réseau très dégradé, ou des usages
    non domestiques non déclarés à la commission. Je ne sais pas laquelle domine, et c''est précisément
    le problème : **nous exigeons des maraîchers des données parcellaires que nous n''exigeons pas de
    la régie sur son réseau.** Cette asymétrie n''est pas défendable en séance.


    **c) La fiabilité de la mesure.** Une station unique, étalonnée pour la dernière fois en 2023, produit
    le chiffre sur lequel repose l''intégralité du raisonnement. Une dérive de 12 % sur 410 L/s représente
    50 L/s — le tiers du déficit. Et personne ne mesure ce qui arrive réellement au point de contrôle
    aval : nous régulons à l''entrée en espérant que les 180 L/s sortent.


    **Ce que je fais dire au dossier en 15 jours**, en même temps que la décision s''applique : la courbe
    de vidange du barrage, le rendement sectorisé du réseau de la régie par campagne de débit nocturne,
    l''étalonnage contradictoire de la station de Sarcelle et la pose d''une station aval.


    ---


    ## 3. La règle de partage


    **Plancher intangible — 180 L/s.** Le rapport du 12 juin documente en dessous de ce seuil un effondrement
    et deux frayères asséchées, qualifiés de non reconstituables à l''échelle d''une décennie. Une perte
    irrécupérable ne se met pas en balance avec une perte monétaire, quel qu''en soit le montant : elles
    ne sont pas de même nature et aucun taux de conversion honnête ne les rend comparables. C''est aussi,
    et d''abord, un arrêté préfectoral. **Aucune des trois parties, ni la commission, n''a qualité pour
    l''entamer.** Si l''hydrologie nous y conduit, la décision quitte cette salle et remonte au préfet
    — je le dis maintenant plutôt que jeudi.


    **Garantie sanitaire — inconditionnelle sur le noyau, révisable sur la marge.** La régie refuse d''ouvrir
    la discussion tant que sa dotation n''est pas garantie. Je lui donne cette garantie ce soir, par écrit,
    sans condition et sans plafond de durée — mais elle porte sur *l''alimentation des 9 200 habitants,
    de l''EHPAD et de la défense incendie*, pas sur le prélèvement historique de 150 L/s. Les 150 L/s
    sont reconduits jusqu''à J+15. Au terme de l''audit, le besoin vérifié devient un plancher absolu,
    jamais discutable ; l''écart entre ce plancher et 150 L/s est soumis au même effort que les autres
    usages. C''est une concession réelle sur ce qui compte pour la régie et un refus net sur ce qui ne
    lui appartient pas : un volume de fuites n''est pas une dotation.


    **Irrigation — le résidu, indexé.** L''irrigation ne reçoit pas 80 L/s. Elle reçoit **100 % de R**,
    avec `R = Q − 180 − Q_potable`. Aujourd''hui R vaut 80. Ce choix n''est pas une élégance de rédaction
    :


    - il place le risque d''erreur du capteur sur la seule variable capable de l''absorber, au lieu de
    le faire porter par le débit réservé ou par l''eau potable, qui ne peuvent pas absorber ;

    - il donne aux maraîchers un intérêt direct et immédiat au succès de l''audit du réseau : **chaque
    litre récupéré sur les fuites leur revient intégralement.** La régie n''y perd rien, puisque son besoin
    réel est garanti. C''est le seul point du dossier où les intérêts des deux parties sont alignés, et
    il faut le rendre visible ;

    - il supprime la notion de seuil, qui est ce qui a échoué en 2022.


    80 L/s représentent 1,1 mm/jour sur 620 hectares, contre les 3,3 mm/jour que représente la demande
    de 240 L/s. **Je note au passage que cette demande n''est pas gonflée** : 3,3 mm/jour correspond à
    une évapotranspiration d''été plausible pour du maraîchage. Le chiffre des 240 L/s est crédible. C''est
    l''affirmation « en dessous, perte totale » qui ne l''est pas : la réponse d''une culture à un déficit
    hydrique est continue et dépend de l''espèce et du stade. Les 4,1 M€ sont une déclaration de partie,
    pas une pièce. Je la traite comme telle, et je demande aux maraîchers de la documenter culture par
    culture — ce qui est exactement ce dont ils ont besoin pour actionner les dispositifs assurantiels
    et calamités agricoles, qui sont les vrais canaux financiers de ce dossier.


    ---


    ## 4. Quotas individuels, et non volume global


    Le règlement m''ouvre les deux voies. Je prends la première, sans hésitation.


    Un volume global par usage, réparti entre 34 exploitations sans compteurs et à puissances de pompage
    inégales, ne produit pas un partage : il produit une course. Les six exploitations qui portent 300
    des 620 hectares — soit 48 % de la surface — disposent des moyens de prélever en premier. Les 28 autres
    recevraient ce qui reste, c''est-à-dire rien, et la commission aurait officiellement décidé un partage
    tout en organisant en réalité une capture. C''est précisément le genre de dispositif qui fait quitter
    une salle avant un vote.


    Le quota individuel est contrôlable, négociable, et cessible. Il rend possible tout ce qui suit.


    **Objection légitime : nous n''avons pas les données parcellaires.** La commission ne les détient
    pas — mais elles existent. Le registre parcellaire graphique déclaré au titre de la PAC est disponible
    auprès de la DDT ; une partie des prélèvements agricoles est déjà soumise à comptage au titre de la
    redevance de l''agence de l''eau. « Nous n''avons pas les données » décrit l''état de nos classeurs,
    pas l''état du monde. Je les demande lundi.


    **Régime provisoire, J+0 à J+10, avant réception des données et pose des compteurs :** tour d''eau
    par secteur, avec créneaux nominatifs. Sans compteur, le temps est la seule grandeur contrôlable à
    l''œil nu, donc la seule règle réellement opposable. Elle est grossière et je l''assume comme telle
    : c''est une mesure de transition, pas le dispositif.


    **Régime cible, à partir de J+10 :** part individuelle de R, assise sur la surface irriguée vérifiée,
    avec un plancher par exploitation. Le plancher est le point politique du dispositif : une réduction
    uniforme de 67 % est un mauvais exercice pour une exploitation de 50 hectares et une liquidation pour
    une exploitation de 8. Un abattement strictement proportionnel n''est pas neutre, il est régressif.


    ---


    ## 5. La règle de sortie de crise — abrogation du dispositif de 2022


    L''épisode du 9 août est le fait le mieux établi du dossier, et le seul dont nous disposions sur le
    comportement d''une règle. La station repasse au-dessus du seuil, 48 heures suffisent, les prélèvements
    reprennent en totalité le 11, le débit tombe à 340 L/s en quatre jours — soit en dessous de là où
    nous sommes aujourd''hui. Un orage remplit un capteur, pas une nappe. Le dispositif de 2022 mesurait
    la pluie et croyait mesurer la ressource.


    **Remplacement :** aucune levée, aucun seuil, aucune date. R est recalculé quotidiennement, sur une
    base délibérément asymétrique :


    - **le resserrement s''applique sur la moyenne glissante 3 jours** — la contrainte descend vite ;

    - **le desserrement s''applique sur la moyenne glissante 10 jours** — l''ouverture monte lentement.


    Appliquée à l''épisode du 9 août, cette règle aurait produit un léger élargissement de R pendant deux
    ou trois jours, puis une refermeture automatique. Pas de reprise totale, pas de chute à 340.


    ---


    ## 6. Les 600 000 €


    Rapportés aux 4,1 M€ annoncés, ils représentent 14,6 %. **Ils ne peuvent pas indemniser et je ne les
    présenterai pas comme une indemnisation** — le dire clairement jeudi vaut mieux que le laisser découvrir
    en septembre. Ils achètent trois choses, dans cet ordre de rendement :


    | Emploi | Montant | Justification |

    |---|---|---|

    | Recherche de fuites, sectorisation et réparations d''urgence sur le réseau de la régie | 200 k€
    | **Seul poste qui crée de l''eau au lieu de la déplacer.** 30 L/s récupérés soutiennent ~78 ha à
    pleine ration, soit ~515 k€ de production à la valeur déclarée par les maraîchers eux-mêmes. Versés
    en **avance remboursable**, pour ne pas transformer un fonds sécheresse en subvention à l''entretien
    différé. |

    | Instrumentation : étalonnage contradictoire de Sarcelle, station aval télétransmise, compteurs télérelevés
    sur les 34 prises | 125 k€ | Sans mesure aval, le débit réservé est une intention. Sans compteurs,
    le quota est une déclaration. |

    | Amorçage du rachat volontaire d''effacement | 220 k€ | Voir ci-dessous. |

    | Réserve non affectée | 55 k€ | |


    Sur le rachat d''effacement : il ne s''agit pas d''acheter des hectares à leur valeur moyenne de 6
    613 €/ha — le fonds n''en couvrirait que 33. Il s''agit d''acheter **le coût marginal de l''arrêt**,
    qui est très inférieur : les dernières semaines d''irrigation d''une culture tardive, ou d''une culture
    à faible valeur, se rachètent pour une fraction de ce prix. La commission se porte acheteur en dernier
    ressort et organise la cession de parts de quota entre exploitations.


    **Effet recherché :** 80 L/s permettent de mener à terme environ 207 hectares à pleine ration, ou
    d''échouer sur 620. La différence n''est pas mince. Mais **ce n''est pas à la commission de désigner
    les 207 hectares** — nous n''en avons ni la compétence agronomique, ni la légitimité, et cette désignation
    serait la vraie violence du dossier. Le quota cessible et le rachat laissent la profession concentrer
    l''eau là où elle sauve le plus, par ses propres arbitrages.


    ---


    ## 7. Ce que je dis à chaque partie


    **À la régie** — vous avez une garantie écrite, inconditionnelle, dès ce soir, sur l''alimentation
    des 9 200 habitants, de l''EHPAD et de la défense incendie. Aucune restriction ne s''appliquera jamais
    à ce noyau. En contrepartie, vous ouvrez votre réseau à l''audit, et vous acceptez qu''un volume de
    fuites ne soit pas une dotation. Vos 4 jours de tampon sont un risque que vous portez seuls aujourd''hui
    ; la station aval et le suivi quotidien vous donnent une alerte que vous n''avez pas.


    **Aux maraîchers** — votre demande de 240 L/s est techniquement fondée et je le dirai en séance ;
    c''est l''affirmation du tout-ou-rien qui ne l''est pas, et elle vous dessert. Vous recevez la totalité
    du résidu : pas une part négociée, la totalité. Chaque litre récupéré sur les fuites du réseau vous
    revient. Et parce que votre objection principale porte sur un chiffre produit par une station que
    personne n''a vérifiée depuis 2023, **vous désignez deux représentants qui co-valident le protocole
    d''étalonnage, contresignent le procès-verbal, et disposent d''un accès direct aux relevés des deux
    stations.** Ce n''est pas une consultation : c''est un pouvoir sur l''instrument qui détermine votre
    quota. Je ne connais pas de raison de refuser cela à la partie qui conteste la mesure.


    **Au milieu — et à la presse** — le titre « les paysans ou les robinets » décrit un arbitrage que
    je refuse de rendre, parce qu''il présuppose que les 160 L/s manquants doivent être pris à l''un des
    deux. Une partie de ces 160 L/s n''a jamais été arbitrée par personne : elle fuit, elle n''est pas
    comptée, ou elle dort dans une retenue dont nous n''avons pas ouvert le registre. Nous saurons dans
    quinze jours. Ce que je peux dire dès maintenant, c''est que la truite ne dispose ni d''un fonds départemental,
    ni d''une salle qu''elle peut quitter, ni d''une décennie devant elle.


    ---


    ## 8. Le meilleur argument contre ma position


    Le voici, tel que je le formulerais si j''étais de l''autre côté de la table :


    > *80 L/s sur 620 hectares, c''est 1,1 mm/jour pendant huit semaines. Pour beaucoup de cultures, c''est
    agronomiquement équivalent à zéro. Le « quota progressif » est donc une fiction confortable : il permet
    à la commission de ne pas dire qu''elle sacrifie la récolte, tout en la sacrifiant. L''honnêteté commanderait
    de concentrer explicitement les 80 L/s sur 200 hectares désignés, de les sauver réellement, et de
    dire aux autres que c''est fini.*


    **Cet argument tient sur le fond, et il fait basculer une partie de mon dispositif — pas sa direction.**
    La concentration est effectivement la bonne réponse hydraulique : 80 L/s répartis uniformément ne
    sauvent rien. C''est pourquoi le rachat d''effacement et la cessibilité des quotas ne sont pas une
    annexe financière du dispositif mais son mécanisme central : ils produisent exactement la concentration
    que l''objection réclame. Le désaccord porte sur *qui* désigne les 200 hectares. Une désignation administrative
    serait plus rapide, plus lisible, et probablement moins bonne — nous n''avons ni les données parcellaires,
    ni les stades végétatifs, ni la moindre légitimité à choisir quelle exploitation ferme. Je préfère
    un mécanisme qui converge en trois semaines vers le bon résultat par décisions décentralisées qu''un
    arrêté qui atteint le mauvais résultat en trois jours.


    Ce que je retiens de l''objection : ma note ne doit pas laisser croire que 80 L/s répartis sauvent
    620 hectares. **Ils n''en sauveront pas plus d''un tiers.** Je l''écris.


    ---


    ## 9. Replis, déclencheurs, et ce qui renverserait cette décision


    **Déclencheurs observables — automatiques, sans nouvelle délibération :**


    | Condition | Action |

    |---|---|

    | Q (moy. 3 j) < 340 L/s | R tombe mécaniquement sous 10 L/s ; arrêt de fait de l''irrigation ; saisine
    du préfet pour mesures de crise |

    | Q (moy. 3 j) < 330 L/s | Le débit réservé et l''eau potable consomment la totalité. **La commission
    est dessaisie** : seul le préfet peut arbitrer une atteinte à son propre arrêté. Saisine sous 24 h
    |

    | Réserve tampon de la régie < 2 jours | Priorité sanitaire absolue, R = 0, activation de l''approvisionnement
    de secours |

    | Station aval < 180 L/s pendant 24 h | Suspension immédiate de tous les prélèvements agricoles jusqu''à
    rétablissement, indépendamment de la mesure amont |

    | Prélèvement constaté hors quota | Retrait du quota de l''exploitation concernée, redistribué aux
    autres ; transmission à la police de l''eau |


    **Aucune reprise automatique après déclenchement d''un repli.** La reprise passe par constat écrit
    et par la règle asymétrique du § 5.


    **Ce qui renverserait cette décision — je m''engage à la réviser si :**


    - **l''étalonnage de Sarcelle** révèle un écart supérieur à ±8 % : toute la répartition est recalculée
    ;

    - **la courbe de vidange du barrage** montre une réserve utile mobilisable significative : elle est
    allouée en priorité à l''irrigation, sous réserve d''un volume gardé pour sécuriser le débit réservé
    et le tampon de la régie jusqu''à la première pluie efficace ;

    - **l''audit du réseau** établit un besoin sanitaire réel très inférieur à 150 L/s : R augmente d''autant,
    immédiatement, et l''arbitrage change de nature ;

    - **le RPG** fait apparaître une surface irriguée réelle sensiblement différente de 620 ha : les parts
    individuelles sont recalculées ;

    - **une expertise contradictoire** conteste le seuil hydrobiologique de 180 L/s : elle ne modifie
    rien à mon niveau — l''arrêté préfectoral s''impose à la commission quelle que soit l''expertise.
    Elle se transmet au préfet.


    **Première action, lundi matin :** trois courriers — demande du RPG à la DDT, mise en demeure d''audit
    de réseau à la régie avec la garantie sanitaire jointe en contrepartie, et commande de l''étalonnage
    contradictoire avec convocation des deux représentants maraîchers désignés. Et une demande écrite
    au gestionnaire de l''ouvrage : **état de la réserve utile du barrage de Sarcelle et courbe de vidange
    sur 30 jours**, sous 72 heures.


    ---


    **Deux points d''honnêteté pour finir.** Les 600 000 € ne compensent rien — les 4,1 M€ annoncés, s''ils
    se confirment, relèvent des dispositifs assurantiels et calamités agricoles, que je demande d''activer
    en parallèle dès lundi. Et si le déficit se prolonge au-delà de trois semaines sans pluie, aucun des
    mécanismes proposés ici ne suffira : ils organisent une pénurie, ils ne la font pas disparaître.

    '
