  text: 'L''écriture du fichier n''a pas été autorisée — voici la note directement.


    ---


    # Note au comité de direction — Contrat cellules 2027 (80 000 unités)


    **Objet :** arbitrage Kelmar / Sinolux

    **Décision :** ne pas signer cette semaine. Lancer immédiatement le test Vertex (9 500 €) et trancher
    à J+40 selon une règle fixée dès aujourd''hui.


    ### 1. Le seuil qui décide


    Le débat n''est pas « 240 000 € d''économie, oui ou non ». C''est : à quel taux de retour cette économie
    est-elle annulée ?


    - SAV Kelmar (référence) : 80 000 × 1,2 % × 210 € = **201 600 €**

    - Budget SAV disponible pour Sinolux avant annulation du gain : 201 600 + 240 000 = **441 600 €**

    - **Taux de bascule : 2,63 %**


    | Taux retour Sinolux | Coût SAV | Écart vs Kelmar | **Résultat net annuel** |

    |---|---|---|---|

    | 1,0 % (essais Sinolux) | 168 000 € | −33 600 € | **+273 600 €** |

    | 1,5 % (bas fourchette ingénieurs) | 252 000 € | +50 400 € | **+189 600 €** |

    | 2,0 % | 336 000 € | +134 400 € | **+105 600 €** |

    | **2,63 %** | 441 600 € | +240 000 € | **0 €** |

    | 2,9 % (audit sectoriel) | 487 200 € | +285 600 € | **−45 600 €** |

    | 3,0 % (haut fourchette ingénieurs) | 504 000 € | +302 400 € | **−62 400 €** |


    Amplitude entre scénarios : **336 000 €**. Le seuil tombe au milieu de l''intervalle de nos propres
    ingénieurs. Nous ne savons pas de quel côté nous sommes.


    ### 2. Ce que valent les trois sources


    - **Sinolux, 1,0 %** — partie intéressée, conditions d''essai non communiquées. Poids le plus faible.

    - **Audit sectoriel, 2,9 %** — mesure indépendante, sur terrain, même fournisseur, ligne comparable.
    Poids le plus fort. Réserve : « comparable » n''est pas « identique », et les données de mars peuvent
    porter sur un lot depuis corrigé.

    - **Nos ingénieurs, 1,5–3 %** — jugement d''experts, pas une mesure ; il converge vers le haut, pas
    vers 1,0 %.


    **Signal décisif :** Sinolux refuse toute clause de garantie sur le taux de retour. Si leur estimation
    interne était réellement de 1,0 %, cette clause leur coûterait presque rien. Ce refus est l''information
    la plus fiable dont nous disposons, et elle contredit leur propre chiffre.


    ### 3. Le calendrier ne justifie aucune urgence


    Test lancé J+0 → résultat vers **J+15/16** (11 jours ouvrés). Même avec 100 % de dérapage : J+31.


    - Prix Sinolux tenu jusqu''à **J+45** → 29 jours de marge sur le calendrier nominal.

    - Commande ferme Kelmar jusqu''à **J+50**, soit **après** l''échéance Sinolux : le repli reste ouvert
    quoi qu''il arrive.

    - Production à **J+60**, en aval des deux échéances : **le test ne retarde pas le lancement d''un
    seul jour.**


    Les 240 000 € sont inscrits au budget ; ils n''y sont pas acquis.


    ### 4. Règle de décision, arrêtée avant le résultat


    Vertex s''écarte historiquement de ±0,3 point. Soit V le résultat annoncé :


    | Résultat Vertex | Décision |

    |---|---|

    | **V ≤ 2,3 %** (vrai taux ≤ 2,6 %) | Sinolux, volume complet, signature avant J+45 |

    | **2,3 % < V < 2,9 %** (zone grise) | Sinolux **uniquement** avec clause bonus/malus indexée sur
    le taux constaté ; à défaut → 60 000 Kelmar / 20 000 Sinolux |

    | **V ≥ 2,9 %** | Kelmar, volume complet, commande entre J+45 et J+50 |

    | **Pas de résultat à J+40** | Kelmar par défaut |


    **Go/no-go ferme : J+40**, cinq jours avant expiration du prix Sinolux. Règle arrêtée maintenant,
    avant de connaître le chiffre, pour qu''elle ne soit pas réinterprétée quand il arrivera.


    ### 5. Couverture si la zone grise se confirme


    Répartition 60 000 Kelmar / 20 000 Sinolux : économie d''achat 60 000 €, perte maximale à 2,9 % limitée
    à **−11 400 €** (contre −45 600 € en volume plein), gain à 1,0 % de +68 400 €. Elle transforme un
    pari de 336 000 € d''amplitude en une exposition bornée à ~11 k€, et produit 20 000 unités de **données
    de terrain réelles** pour le contrat 2028. À chiffrer : double qualification, et Sinolux peut repricer
    à volume réduit.


    ### 6. Ce qui pourrait me donner tort


    L''argument le plus fort contre cette note : le vieillissement accéléré mesure la dégradation cellule,
    alors que le taux de retour terrain intègre aussi la pose, le transport et l''usage client — la précision
    de ±0,3 point pourrait mal se transférer. Nous risquons de payer 9 500 € pour atterrir en zone grise
    (probabilité que j''estime à un tiers) sans conclusion nette.


    Je l''accepte pour trois raisons : le désaccord entre nos sources porte précisément sur la cellule,
    donc l''instrument est le bon ; 9 500 € = 4 % de l''enjeu, et l''option est gratuite en calendrier
    ; même en zone grise, l''incertitude passe de 1,9 point à 0,6 point, la couverture du §5 absorbant
    le reste.


    ### 7. À engager cette semaine


    1. Commander le test Vertex — **lundi**. Chaque jour perdu se retranche de la marge avant J+40.

    2. Exiger de Sinolux : clause bonus/malus indexée sur le taux constaté à 6 mois, et confirmation écrite
    de la validité du prix jusqu''à J+45.

    3. Sécuriser la capacité Kelmar jusqu''à J+50 et rouvrir son prix en s''appuyant sur l''offre concurrente.

    4. Si Sinolux est retenu : suivi mensuel sur les 10 000 premières unités, bascule Kelmar déclenchée
    au-delà de 1,8 % cumulé à 3 mois.


    **Ce que je ne recommande pas :** signer Sinolux cette semaine. Ce serait engager 80 000 unités sur
    le chiffre de la partie qui refuse de le garantir, alors que le calendrier nous laisse 40 jours pour
    le vérifier pour 4 % de l''enjeu.


    ---


    Deux points à surveiller que la note ne résout pas : les 210 € couvrent le traitement direct du retour,
    pas la perte commerciale ni l''effet sur l''image — la colonne « résultat net » est donc un plancher
    optimiste dans les scénarios hauts. Et à 2,9 %, c''est 2 320 clients touchés dans l''année, ce qui
    pèse au-delà du calcul.


    Dites-moi si vous voulez que je réécrive le fichier (l''autorisation d''écriture a été refusée) ou
    que je le publie en page partageable pour le comité.

    '
