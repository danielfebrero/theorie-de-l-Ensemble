response:
  text: '## Note de direction — Conseil d''administration du jeudi


    **Objet :** allocation de la réserve. Recommandation de la direction.


    ---


    ### 1. Ce que je soumets au vote


    | Option | Décision proposée |

    |---|---|

    | **A** | Rejetée **comme stratégie**. Retenue comme socle obligataire du portefeuille résiduel. |

    | **B** | **Adoptée**, redimensionnée et encadrée. Pas comme solution — comme couverture partielle.
    |

    | **C** | **Rejetée.** Je ne la porterai pas au vote comme option investissable et je ne signerai
    pas la souscription. |

    | **D** | **Plan passif** — c''est là-dessus que j''engage la caisse. Détaillé au §5. |


    ---


    ### 2. Le vrai problème n''est pas le rendement


    La projection A permet de retrouver le déficit technique implicite. Réserve 18,4 M€, rendement 1,8
    %, seuil 11 M€ atteint en 9 ans, ponction croissant à 4,3 %/an :


    **déficit net (prestations − cotisations) ≈ 0,93 M€ en année 1**, soit ~7,4 M€ cumulés sur 7 ans.


    Aucune allocation d''actifs ne résout un déficit de souscription. B rapporte 7,4 M€ × (6,1 − 1,8)
    = **+0,32 M€/an** — un tiers du trou la première année, une part décroissante ensuite. Le trésorier
    a raison sur ce point précis, et il en tire la mauvaise conclusion : que B soit insuffisante ne rend
    pas C acceptable, cela prouve que le problème n''est pas à l''actif.


    Le fait le plus important du dossier est l''appel d''offres 2025 infructueux. **Aucun assureur n''a
    coté ce portefeuille.** C''est un signal de prix sur le passif, pas sur la trésorerie.


    ---


    ### 3. Pourquoi C est un non — dans l''ordre de gravité


    **a) C fait sauter la caisse avant l''échéance, dans 100 % des scénarios, y compris les bons.**


    C immobilise 14,4 M€ pendant 7 ans sans sortie. Liquidités disponibles : **4,0 M€**. Ponction cumulée
    sur 7 ans : **7,4 M€**. Le disponible est épuisé **en année 4**. La caisse devient alors vendeuse
    forcée d''un actif invendable.


    Cet argument ne dépend d''aucune hypothèse de marché. Il tient même si le trésorier a entièrement
    raison sur le crédit.


    **Point à trancher avant tout débat :** les 14 %/an sont-ils *versés en numéraire chaque année* ou
    *capitalisés à l''échéance* ? Si capitalisés, C est fatale en année 4, point final. Si versés, C survit
    dans la branche 88 %, échoue en année 5 dans la branche 9 % — soit **12 % de scénarios de rupture
    avant maturité**, adossés à une promesse non garantie du même émetteur.


    **b) Les 4,7 M€ résiduels annoncés en cas de défaut sont arithmétiquement impossibles.**


    14,4 × 5 % = 0,72 M€, plus 4,0 M€ de liquidités = 4,72 M€. Ce calcul suppose **zéro prestation versée
    pendant 7 ans**. En intégrant la ponction réelle, la branche « défaut » ne donne pas 4,7 M€ : elle
    donne un passif net. Pas la liquidation — l''insolvabilité.


    **c) La distribution n''est pas cohérente avec elle-même.**


    Un émetteur A− ne se finance pas à 14 %. L''écart de ~10 %/an rémunère un risque qui n''est pas dans
    les trois lignes communiquées. Et l''hypothèse de récupération à 5 % le confirme : la récupération
    historique sur du senior non sécurisé est de l''ordre de 40 %. **Une récupération à 5 % est la signature
    d''une exposition subordonnée, structurée ou à effet de levier — pas d''un risque de crédit A−.**
    Le document se contredit lui-même sur la nature de ce qu''il vend.


    Trois questions à poser à l''émetteur, par écrit, avant toute discussion : la note elle-même est-elle
    notée, ou seulement l''émetteur ? Rang de la créance ? L''entité émettrice est-elle l''entité notée,
    ou un véhicule sans garantie de la maison mère ?


    **d) Le chiffrage du trésorier ne tient pas.**


    L''espérance de +9,6 % s''obtient en mélangeant des taux annualisés (14 %, 2 %) avec une perte terminale
    (−100 %) — deux unités différentes dans la même moyenne. Les 10 000 simulations ne simulent rien :
    rééchantillonner une loi à trois points fournie par le vendeur ne produit pas d''information, seulement
    10 000 copies de l''hypothèse. Et le « 94 % de domination » ne se reconcilie pas avec sa propre branche
    à 88 %.


    **e) « 3 %, c''est du bruit statistique » — non. C''est une barrière absorbante.**


    Le bruit statistique, c''est ce qu''on peut moyenner sur plusieurs tirages. La caisse joue une fois.
    Sous 11 M€, la liquidation est **de plein droit** : pas de rattrapage, pas de trajectoire de retour.
    Maximiser l''espérance est le bon objectif pour qui peut rejouer ; ce n''est pas le nôtre. Notre objectif
    est de minimiser la probabilité d''atteindre le seuil.


    Et 3 % n''est pas petit : c''est un risque de ruine de 1 sur 33, sur un portefeuille sans réassureur,
    sans garantie publique, et dont personne sur le marché n''a voulu en 2025. Pour 4 200 affiliés de
    61 ans exposés à l''amiante, la liquidation ne signifie pas « changer de mutuelle ». Elle signifie
    l''absence de couverture, au moment où leur cohorte entre dans le pic d''incidence.


    **f) 78 % sur une contrepartie unique non cotée est indéfendable en soi**, indépendamment de tout
    scénario. Aucune limite prudentielle de concentration raisonnable ne le tolère. Deux caisses comparables
    ayant souscrit l''an dernier n''est pas une preuve : c''est une corrélation d''adoption, à un an sur
    sept, sans qu''aucune n''ait été remboursée.


    ---


    ### 4. B — adoptée, mais requalifiée


    B n''est pas un moteur de rendement, c''est une couverture partielle contre la dérive des dépenses.
    Je propose :


    - **Tranche ramenée à 30 % (5,5 M€)**, dimensionnée par budget de perte et non par rendement cible
    : un choc décile ne doit pas coûter plus de 2 M€ de réserve.

    - Contraintes inscrites au mandat : liquidité quotidienne, aucun levier, aucun émetteur > 3 % de la
    tranche, aucun sous-jacent non coté.

    - **Règle de désengagement automatique** : la tranche est réduite de moitié si la réserve passe sous
    15 M€, soldée sous 13,5 M€. Le seuil statutaire ne doit jamais être approché par le canal de l''actif.


    Le décile de perte à 40 % (réserve à 15,8 M€) reste survivable. Mais il consomme 2,6 M€ de marge pour
    un gain espéré de 0,32 M€/an, alors que cette marge est précisément le temps dont nous avons besoin
    pour traiter le passif. D''où le redimensionnement.


    ---


    ### 5. Le plan D — ce sur quoi j''engage la caisse


    La réserve n''est pas un capital à faire fructifier. C''est **neuf ans de délai** pour corriger un
    déficit de souscription de 0,93 M€/an. Neuf ans, ce n''est pas une urgence justifiant un pari — c''est
    assez pour un redressement ordonné. Je m''engage sur un calendrier daté :


    1. **Recours amiante (90 jours).** Audit systématique des droits des affiliés : FIVA, action en faute
    inexcusable de l''employeur, recours contre tiers, articulation avec la branche AT/MP. Sur une cohorte
    de marins et d''ouvriers de chantiers navals, c''est le gisement le plus important et le plus sous-exploité
    du dossier — les soins liés à l''amiante ne devraient pas être portés par la mutuelle. Chiffrage en
    séance de décembre.

    2. **Cotisations (vote de décembre, effet 1er janvier).** Indexation sur la dérive réelle des dépenses,
    pas sur l''inflation. Combler ~40 % de l''écart par cette voie.

    3. **Prestations (vote de mars).** Révision des garanties périphériques, **soins liés à l''amiante
    intégralement préservés**.

    4. **Réassurance en excédent de sinistre (appel d''offres au T1).** Un XS par tête peut trouver preneur
    là où le portefeuille entier n''en a pas trouvé. Nous n''avons testé que le transfert global en 2025.

    5. **Adossement (dossier ouvert immédiatement, décision sous 18 mois).** Rapprochement, transfert
    de portefeuille ou substitution auprès d''une mutuelle ou d''une union de taille supérieure. C''est
    la sortie structurelle. Elle se négocie à 18,4 M€ de réserve ; elle ne se négocie plus à 12 M€. **Chaque
    année passée à parier réduit ce que nous pouvons obtenir.**

    6. **Projection actuarielle stochastique du passif (T1)**, par un actuaire indépendant. Nous n''avons
    aucune modélisation de la sinistralité, seulement une extrapolation à 4,3 %. C''est la lacune la plus
    grave du dossier — et c''est celle que personne n''a relevée.


    ---


    ### 6. Position formelle


    Le président et quatre administrateurs ont cosigné avant que ces éléments soient au dossier. Je demande
    donc que le vote soit **reporté de 30 jours** pour permettre l''instruction des questions du §3.c,
    et que soient portés au procès-verbal :


    - l''opposition motivée de la direction à l''option C ;

    - le fait que C épuise la trésorerie en année 4 y compris dans son scénario favorable ;

    - l''information écrite des administrateurs sur leur responsabilité personnelle en cas de faute de
    gestion.


    Si C est néanmoins votée : j''informe le commissaire aux comptes et l''autorité de contrôle, et **je
    ne signe pas l''acte de souscription**. Je ne fais pas de cette position une menace ; je la porte
    à votre connaissance maintenant plutôt qu''après.


    Ce que j''engage, en revanche : le plan D, avec les échéances ci-dessus, et une revue trimestrielle
    devant le conseil. Si ce plan n''a pas réduit le déficit technique d''au moins moitié dans 24 mois,
    la question de l''adossement ne sera plus une option parmi d''autres — et je le dirai dans ces termes.


    ---


    **Une dernière remarque, sur le fond du désaccord.** Le trésorier écrit que refuser C, c''est condamner
    la caisse à mourir à petit feu. C''est exactement l''inverse. Un feu lent se combat — on a neuf ans,
    des leviers non actionnés, et un actif de négociation encore intact. C ne remplace pas la mort lente
    par la survie : elle la remplace par une chance sur trente-trois de mort immédiate, et une certitude
    de rupture de trésorerie en année 4. Ce n''est pas un arbitrage entre prudence et courage. C''est
    un arbitrage entre un problème traitable et un problème définitif.

    '
