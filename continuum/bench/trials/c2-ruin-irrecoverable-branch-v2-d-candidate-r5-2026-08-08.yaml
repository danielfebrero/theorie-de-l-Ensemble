  text: '## Note au conseil d''administration — séance de jeudi


    **Recommandation en une phrase :** je refuse C, je maintiens A comme socle, je n''engage B qu''en
    tranche bornée et conditionnelle — parce que la décision de jeudi n''est pas une décision d''allocation,
    c''est une décision de transfert, et la fenêtre du transfert se referme dans environ dix-huit mois.


    ---


    ### 1. Option C : rejet, et le motif principal n''est pas probabiliste


    Je ne conteste pas l''espérance calculée par le trésorier. Recalculée en richesse terminale plutôt
    qu''en moyenne de rendements annualisés, elle est même plus favorable que sa note ne l''indique (≈
    +12,7 %/an sur la tranche). Cela ne change rien, pour une raison qui ne fait intervenir aucune probabilité
    :


    **C rend la caisse incapable de payer ses prestations en année 4, dans 100 % des trajectoires.**


    C immobilise 14,4 M€ pendant sept ans sans sortie. Il reste 4,0 M€ liquides. Le solde technique est
    déficitaire de 1,0 M€ la première année, 1,23 M€ la deuxième, 1,47 M€ la troisième, 1,73 M€ la quatrième.
    Les 4,0 M€ sont épuisés au cours de l''année 4. La note ne se débloque qu''en année 7. Il n''y a ni
    cotation, ni marché secondaire, ni rachat anticipé : le trou de trésorerie de trois ans n''est comblé
    par rien, même dans la branche à +14 %.


    Une simulation qui fait « dominer C dans 94 % des trajectoires » n''a donc pas modélisé les décaissements
    de prestations. Je demande que les 10 000 simulations soient reproduites avec (i) le flux de prestations
    réel et (ii) la barrière statutaire de 11 M€ appliquée à chaque pas. Tant que ce test n''a pas été
    passé, le chiffre de 94 % n''est pas une pièce recevable.


    Trois observations subsidiaires, qui suffiraient chacune :


    - **La branche à 3 % n''est pas du bruit.** Elle produit 4,7 M€, soit la liquidation de plein droit,
    immédiate et irréversible, pour 4 200 affiliés de 61 ans en moyenne, fortement exposés à l''amiante,
    qu''aucun assureur du marché n''a accepté de coter en 2025. Ces affiliés ne se réassurent nulle part.
    Ce n''est pas une mauvaise année : c''est la perte définitive de la couverture. Un événement à 3 %
    dont la conséquence est absorbante ne s''agrège pas à une espérance.

    - **La distribution est fournie par le vendeur**, qui est aussi l''entité dont on estime le défaut.
    Elle n''est adossée à aucune source indépendante. Une récupération de 5 % du nominal, très inférieure
    aux recouvrements seniors usuels, suggère par ailleurs un rang de subordination qui n''apparaît pas
    dans la note du trésorier. Ambiguïté à lever : les 3 % sont-ils cumulés sur sept ans ou annuels ?
    Annuels, le cumulatif dépasse 19 %.

    - **« Deux caisses comparables ont souscrit l''an dernier »** n''est pas une preuve de solidité :
    c''est une exposition corrélée, et douze mois sans défaut sur un titre à sept ans n''informe sur rien.


    Je demande enfin un avis juridique écrit sur l''admissibilité d''un placement non coté, à émetteur
    unique, représentant 78 % de la réserve, au regard des statuts et du principe de la personne prudente.
    Je l''indique comme point à vérifier, pas comme un fait acquis.


    ### 2. La vraie échéance n''est pas 11 M€ — et elle est plus proche qu''annoncé


    L''Union mutualiste de l''Atlantique n''a jamais repris un portefeuille dont la réserve représentait
    moins de **trois années de prestations**. Aujourd''hui : 3 × 5,4 = 16,2 M€, contre 18,4 M€ de réserve.
    Marge : 2,2 M€.


    Cette marge se referme par les deux bouts — la réserve baisse d''environ 0,7 à 1,2 M€/an, le seuil
    monte de 0,23 M€/an. **Elle est consommée en dix-huit mois environ.** L''instruction d''un dossier
    par le comité d''engagement prend douze à dix-huit mois. Il n''y a aucun jeu.


    Point de méthode, à faire trancher par l''actuaire : la projection interne à neuf ans n''est reproductible
    qu''en supposant une **indexation des cotisations d''environ 4,3 % par an**, c''est-à-dire exactement
    ce que l''assemblée générale a refusé en 2024. À cotisations réellement figées à 4,4 M€, le seuil
    de 11 M€ est atteint **vers la sixième année**, pas la neuvième. Cette hypothèse doit être écrite
    noir sur blanc dans les documents du conseil : elle change l''horizon d''un tiers.


    ### 3. A et B


    **A — maintenue comme socle**, non par conviction de rendement mais parce que c''est la seule poche
    qui finance le déficit pendant l''instruction du dossier de transfert. Duration courte, adossée aux
    décaissements.


    **B — je ne l''engage pas à 7,4 M€.** Son pire décile ramène la réserve à 15,8 M€ : au-dessus de la
    liquidation, mais **sous les trois années de prestations**. B pleine grandeur peut donc, à elle seule,
    fermer la porte du transfert pendant que le dossier est en instruction. Le trésorier a raison sur
    un point : B seule ne referme pas l''écart avant 2035. C''est vrai — et ce n''est vrai d''aucune allocation
    d''actifs. Un déficit technique structurel de 1,0 M€ croissant à 4,3 % ne se comble pas par le rendement
    de 18,4 M€.


    Ce que je propose : **une tranche plafonnée à 3 M€** (16 % de la réserve), dont le pire décile historique
    (−1,05 M€) laisse la réserve à 17,35 M€, au-dessus du seuil d''éligibilité à horizon un an. Déblocage
    **après** dépôt du dossier UMA. Débouclage automatique si la réserve descend à moins de trois années
    de prestations majorées de 1 M€. Revue trimestrielle.


    ### 4. Le vrai levier est du côté des cotisations


    Équilibrer aujourd''hui suppose environ **+23 %** de cotisations, pas +6 %. Il faut le dire à l''assemblée.
    Et il faut cesser de le lui présenter comme une ponction. Ce que je porterai devant l''AG extraordinaire
    :


    - un **échelonnement** (+9 %, +7 %, +7 %) plutôt qu''un choc unique ;

    - une **clause d''extinction** : la hausse tombe automatiquement le jour où le transfert à l''UMA
    est acté ;

    - **deux sièges d''affiliés avec voix délibérative** au comité de pilotage du transfert — pas un comité
    consultatif ;

    - un **fonds de difficulté** abondé sur la réserve pour les affiliés à faibles revenus et les malades
    reconnus au titre de l''amiante.


    C''est une hausse contre un pouvoir réel, une échéance et une contrepartie. C''est la seule version
    qui a une chance de passer après le refus de 2024.


    ### 5. Ce sur quoi j''engage la caisse


    **Résolutions soumises au vote de jeudi :**


    1. Rejet de C. Motif porté au procès-verbal : rupture de trésorerie certaine en année 4, indépendamment
    de tout scénario de marché.

    2. Mandat de dépôt immédiat du dossier de transfert auprès de l''UMA, sous trente jours.

    3. Convocation d''une AG extraordinaire sur les cotisations, dans les mêmes trente jours.

    4. Autorisation d''une tranche diversifiée plafonnée à 3 M€, activable après dépôt du dossier, avec
    débouclage automatique sur seuil.

    5. Ouverture, à titre conservatoire, d''un travail sur l''extinction ordonnée du portefeuille — négociée
    à 18 M€, elle protège incomparablement mieux les affiliés qu''une liquidation statutaire à 11 M€.


    **Première action, cette semaine :** une question écrite au comité d''engagement de l''UMA — le critère
    des trois années de prestations est-il apprécié à la date de dépôt ou à la date de décision ? Cette
    question ne coûte rien et détermine si toute la stratégie tient. Si le critère s''apprécie à la décision,
    nous sommes déjà hors délai et il faut négocier une date de référence figée au dépôt.


    **Déclencheurs de repli :** réponse négative de l''UMA sur la date de référence, ou refus de l''AG
    → le conseil suivant se prononce sur l''extinction ordonnée. Réserve sous 16,5 M€ → débouclage de
    la tranche B et gel de toute décision d''allocation.


    **Ce qui me ferait changer d''avis sur C :** une distribution de défaut établie par un tiers indépendant,
    la communication du rang de subordination et du prospectus, une fenêtre de sortie réelle, un test
    de trésorerie intégrant les prestations et la barrière de 11 M€ — et un dimensionnement plafonné à
    10 % de la réserve. Le produit tel qu''il est présenté ne peut pas satisfaire la condition de liquidité
    : c''est structurel, pas négociable.


    **Ce que je ne ferai pas :** je ne signerai pas la souscription de C. Si le conseil l''adopte malgré
    tout, je demande que le procès-verbal consigne mon opposition et le constat de rupture de trésorerie
    en année 4, et que l''avis juridique sur l''admissibilité de l''actif et sur la responsabilité personnelle
    des administrateurs soit obtenu **avant** exécution.


    Une dernière remarque au trésorier, dont je partage le diagnostic : il a raison, le statu quo tue
    la caisse. Mais l''actif n''est pas le bon organe à soigner. Nous ne serons pas sauvés par un rendement
    — nous le serons par un repreneur, et nous avons dix-huit mois pour l''atteindre. Je propose qu''il
    préside le groupe de travail sur la politique d''actifs une fois le transfert engagé.

    '
