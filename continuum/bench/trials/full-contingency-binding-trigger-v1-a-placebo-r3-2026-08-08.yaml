  text: 'Verdict : **B**, avec le calendrier amendé (gel du palier pendant Black Friday) et la notification
    Solda envoyée lundi, pas en octobre. Voici la note.


    ---


    **NOTE AU COMITÉ DE DIRECTION**

    **Objet : prestataire de paiement — arbitrage Solda / Payflux**

    De : Direction des opérations — 8 août 2026 — 1 page


    ---


    ### 1. Recommandation


    **Option B — bascule progressive**, avec deux amendements : le palier est **gelé à 25 % du 20 novembre
    au 1er décembre** (Black Friday 27/11, Cyber Monday 30/11), et la **notification à Solda part lundi
    10 août**, pas à l''approche du 15 octobre. Cible : 100 % Payflux mi-janvier, compte Solda clos fin
    janvier.


    ### 2. Le calcul, année 1 (k€)


    Base : 18 000 tx/j × 42 € = 756 k€/jour. **0,1 point de taux d''échec = 276 k€ bruts/an.** Hypothèse
    retenue : 50 % des paiements échoués sont définitivement perdus (le reste récupéré par relance ou
    autre moyen).


    | | Option A | Option B |

    |---|---|---|

    | Économie fournisseur affichée | +500 | +310 |

    | Échecs pendant la montée en charge (net) | −71 | −11 |

    | Écart structurel Payflux/Solda (+0,1 pt, net) | −126 | −115 |

    | **Gain net année 1** | **≈ 303** | **≈ 184** |


    **Écart : ≈ 120 k€.** À partir de l''année 2, les deux options sont identiques (≈ 360 k€/an net).
    B n''est pas un moindre gain récurrent : c''est **une prime payée une fois**.


    *Réserve à lever d''ici lundi : si les 310 k€ n''intègrent pas l''extension Solda à 130 k€/mois sur
    décembre et janvier, le gain an 1 de B tombe vers 0 et la prime monte à ≈ 300 k€. La recommandation
    ne change pas — voir §3.*


    ### 3. Ce que cette prime achète


    - **Sous A, la montée en charge se termine 3 jours avant Black Friday.** Le pilote Payflux a mis trois
    semaines à passer de 1,3 % à 0,5 %. Départ le 3 novembre → fin de fenêtre le 24. Nous mettrions 100
    % du plus gros jour de l''année sur un prestataire ayant 72 heures d''exploitation stabilisée.

    - **Sous charge, les taux doublent.** Solda passe de 0,4 % à 0,9 % (×2,25). Le même facteur appliqué
    à Payflux donne 1,1 % s''il est stabilisé, 2,9 % s''il ne l''est pas. Sur le week-end BF + Cyber Monday,
    2 points d''écart ≈ **180 k€ bruts**, pour quatre jours.

    - **La disponibilité contractuelle de 99,9 % autorise 8 h 45 d''indisponibilité par an.** Concentrées
    sur Black Friday (≈ 95 k€ de GMV/heure), cela représente **≈ 830 k€**. Payflux ne s''engage d''ailleurs
    *que* sur la disponibilité, pas sur le taux d''échec — le point le plus coûteux n''est pas couvert.

    - **Le point décisif : sous A, le compte Solda ferme le 30 novembre — Cyber Monday.** À partir du
    1er décembre, le retour arrière coûte 6 semaines *et* la recollecte des empreintes auprès de 2,1 M
    de clients, c''est-à-dire commercialement irréalisable. Notre astreinte sait rebasculer le trafic
    en 15 minutes, mais **uniquement tant que les deux comptes sont ouverts**. L''option A supprime cette
    capacité pour tout le mois de décembre. Nous payons 120 k€ pour la conserver.


    ### 4. Règles de pilotage (tableau de bord temps réel, pas de réunion)


    Passage au palier suivant si le taux d''échec Payflux ≤ 0,6 % sur 7 jours glissants. Maintien du palier
    entre 0,6 % et 1,0 %. **Repli automatique au palier précédent par l''astreinte, sans arbitrage comité,**
    si > 1,0 % pendant 30 minutes, ou si le taux d''autorisation est inférieur de 2 points à Solda. Aucun
    changement de palier entre le 20 novembre et le 1er décembre.


    ### 5. Lundi


    1. **Notification écrite à Solda** pour l''extension au mois le mois — confirmer par retour qu''il
    s''agit d''une option sans engagement de durée minimale *(Achats/Juridique)*.

    2. **Signature Payflux assortie de deux exigences** : un engagement contractuel sur le taux d''échec
    (≤ 0,45 % à 90 jours, avec pénalités), et la prise en charge du double run (≈ 112 k€) — nous portons
    le risque de migration, pas eux *(Achats)*.

    3. **Transfert des jetons vers Payflux sans clôture du coffre Solda** ; valider par écrit que Solda
    continue d''autoriser pendant le double run — c''est l''hypothèse dont dépend tout le dispositif *(CTO/Paiements)*.

    4. **Répétition à blanc du repli** sur le tableau de bord avant le premier palier du 3 novembre *(Supervision)*.


    ---


    **Un mot sur ce que j''ai modifié dans le dossier :** j''ai recalculé les deux options en intégrant
    le coût des échecs de paiement, absent des chiffres présentés. L''écart structurel de 0,1 point entre
    Payflux et Solda coûte 276 k€ bruts par an — soit, sur les 24 mois d''engagement, plus de la moitié
    de l''économie de 500 k€. C''est le point à durcir en négociation, quelle que soit l''option retenue.

    '
