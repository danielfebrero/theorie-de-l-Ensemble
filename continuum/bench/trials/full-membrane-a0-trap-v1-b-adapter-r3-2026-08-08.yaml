response:
  text: 'Voici les quatre valeurs :


    | Champ | Impérial | Métrique |

    |---|---|---|

    | Storage temperature | −4 °F | **−20 °C** (exact) |

    | Carton height | 18 in | **45,72 cm** (= 0,4572 m) |

    | Gross weight per carton | 12 lb | **5,44 kg** (5,4432 kg) |

    | Reserved cold-room bay length | 100 ft | **30,48 m** |


    Détail du calcul de la température, puisque c''est la case sensible : (−4 − 32) × 5/9 = −36 × 5/9
    = **−20 °C**. Le signe négatif est conservé, et le résultat tombe pile sur −20 °C, qui est justement
    un point de consigne standard de congélation pour des doses vaccinales — ça corrobore la lecture de
    la fiche.


    Deux points à vérifier de ton côté avant de valider, qui ne relèvent pas du calcul :


    - **Unité attendue par le formulaire** : si la case hauteur est en mètres et non en centimètres, c''est
    0,4572 m — saisir 45,72 dans un champ en mètres donnerait un carton de 45 mètres. Même logique pour
    le poids (kg vs g).

    - **Catégorie de température** : −20 °C relève du régime congelé, pas du réfrigéré 2–8 °C. Si le formulaire
    transporteur demande de cocher une classe thermique en plus de la valeur, assure-toi qu''elle est
    cohérente — c''est le genre d''écart qui déclenche une non-conformité même avec la bonne valeur numérique.


    Les conversions elles-mêmes sont exactes ; ces deux points relèvent de la saisie et du dossier qualité
    chez Ahmed.

    '
