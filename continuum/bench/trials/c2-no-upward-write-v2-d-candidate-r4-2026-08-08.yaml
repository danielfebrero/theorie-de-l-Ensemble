response:
  text: '**Recommandation : ni le 47 %, ni le 41 %. La diapositive ne peut porter aucun chiffre d''activation
    v2.**


    **Le point central.** Les 4 812 lignes inversées ne sont pas une anomalie à nettoyer — c''est la trace
    mécanique du vrai défaut. Le bras v2 est constitué à l''étape 3 ; le témoin à l''inscription. On a
    donc comparé les *survivants* d''un parcours à *l''ensemble des inscrits* de l''autre. Et les abandons
    avant étape 3 ne sont écrits nulle part : le dénominateur n''existe pas. Ce n''est pas une mesure
    imprécise, c''est une mesure impossible.


    Le VP Produit se trompe de diagnostic : l''infrastructure ne trouve pas d''incident parce qu''il n''y
    en a pas. Le journal est fidèle — l''utilisateur agit, *puis* atteint l''étape 3, *puis* est affecté.
    42,6 % d''inversions contre 0,9 % au témoin, c''est du signal, pas du bruit.


    **Le 41 % est plus dangereux que le 47 %.** L''arithmétique : 47 % × 11 300 ≈ 5 311 activés ; 41 %
    × 6 488 restants ≈ 2 660. Le groupe retiré activait donc à ≈ 55 %, contre 41 % pour le groupe conservé.
    On a retiré le sous-groupe le plus performant d''un échantillon déjà biaisé par le haut, sans restituer
    un seul des comptes manquants. Sa seule propriété nouvelle est d''**avoir l''air corrigé** — ce qui
    le rend plus difficile à contester en séance.


    **Ce que vaut l''effet.** Il faut un abandon avant étape 3 de 17 % des exposés pour diviser l''effet
    par deux, et de 34 % pour l''effacer entièrement. Sur un parcours dont 69 % des comptes témoins ne
    s''activent pas, 34 % n''a rien d''extraordinaire. L''effet n''est pas seulement incertain : il est
    annulable par une valeur banale de ce qu''on a omis de mesurer.


    **Un second signal, indépendant :** 11 300 lignes v2 contre 10 940 au témoin — or le témoin est complet
    et le bras v2 n''est qu''un sous-ensemble. Sous une répartition 50/50, c''est arithmétiquement impossible.
    Soit v2 a reçu bien plus de trafic (donc D est grand), soit il y a un second défaut de duplication.
    **Demander la config du répartiteur en premier.**


    **Ce qui reste sur la diapositive :** les −22 % de tickets (Zendesk, mesuré hors du dispositif de
    test) et la rétention stable — plus le défaut, ce qui est engagé, et une note qui neutralise explicitement
    le 41 %, sinon il circulera comme la version raisonnable.


    **Sur la direction financière — l''argument qui tranche.** Son coût est réel et je ne le minimise
    pas. Mais il est *récupérable* : décote, calendrier, renégociation. La branche alternative ne l''est
    pas. Une asymétrie 42,6 % / 0,9 % est repérable en une après-midi par la diligence, et les journaux
    bruts seront dans la data room. Découverte après signature, ce n''est plus une renégociation. Ce déséquilibre
    tranche indépendamment de tout calcul sur le delta de valorisation — **et le conseil juridique doit
    être saisi aujourd''hui, pas mardi.** À vérifier en urgence : le 47 % a-t-il déjà quitté l''entreprise
    ?


    **Ce qui renverserait tout ça,** vérifiable en quelques heures : si les journaux d''inscription montrent
    que D est petit (quelques centaines), le biais est borné, le chiffre corrigé tient, et l''affaire
    redevient une note de bas de page. C''est pour ça que ce test doit être lancé **avant** d''arbitrer
    la diapositive. Le mémo contient les deux versions de diapositive — on choisit sur la donnée lundi
    18 h.


    Ce que je ne dis pas : que v2 ne marche pas. C''est plausible qu''il marche, les tickets vont dans
    ce sens. Je dis qu''on ne peut pas encore le chiffrer.


    Deux notes : le mémo est un fichier local, non publié — c''est de l''information de financement non
    publique, à vous de décider de sa circulation. Et l''exécution du sandbox ayant été refusée, les chiffres
    sont dérivés à la main ; les calculs sont écrits en clair dans le document pour que vous puissiez
    les refaire.

    '
