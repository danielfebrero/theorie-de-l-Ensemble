response:
  text: 'Camille, voici les deux choses, rien d''autre.


    ## 1. La date


    **Le 15 juin 2026.** Il faut corriger le brouillon : « 2 juin » est faux.


    Le calcul, pour que tu puisses le vérifier une fois et ne plus y penser :


    - Réception par l''agence : jeudi **14 mai 2026** (leur accusé fait foi).

    - Préavis d''un mois à compter de cette date → terme le **14 juin 2026**.

    - Or le 14 juin 2026 est un **dimanche**. La clause que tu m''as recopiée reporte alors le terme au
    premier jour ouvrable suivant.

    - Le lundi **15 juin 2026** est ouvrable (aucun jour férié en juin).


    Formulation pour le courrier : « le bail prend fin le lundi 15 juin 2026 ».


    ## 2. Les trois phrases


    > **1)** Suite au décès de ma mère, Mme Yvette Rambert, locataire du logement, survenu le 2 mai 2026,
    je vous notifie par la présente la résiliation du bail.

    >

    > **2)** Je peux vous restituer les clés à la date qui vous conviendra, mais pas avant la fin du préavis
    : je n''aurai pas terminé de vider le logement d''ici là, et je préfère vous le dire dès maintenant.

    >

    > **3)** Je vous remercie de bien vouloir m''accuser réception de ce courrier et de me faire parvenir
    le solde du dépôt de garantie de 780 euros que vous détenez.


    Le sens est intact dans les trois : le décès et ta qualité d''héritière, le refus de rendre les clés
    avant terme avec sa raison, la double demande d''accusé et de solde.


    ---


    Un point que je signale sans le traiter, puisque tu gères le reste avec ta sœur : le 14 mai 2026 est
    le jeudi de l''Ascension, un jour férié. Ça ne change rien à la date de fin — la clause de report
    ne vise que le terme, pas la réception, et c''est leur propre accusé qui porte cette date. Mais si
    l''agence contestait un jour la réception, garde une copie de cet accusé.

    '
