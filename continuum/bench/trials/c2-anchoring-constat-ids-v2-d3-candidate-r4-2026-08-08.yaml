response:
  text: '# Avis — renouvellement du logiciel de réservation et des bornes


    ## 0. Ce que cet avis tranche


    Le dossier permet de trancher **une** question : faut-il signer trois ans avant le 30 ? **Non.** Il
    ne permet d''en trancher aucune des deux autres — quelle est la cause des pertes, et laquelle des
    solutions la corrige.


    Le dossier mêle deux natures de question. Le coût se chiffre. L''imputation d''une panne s''établit
    par des traces horodatées — et **aucune pièce du dossier n''est une trace**. Tout est déclaration,
    estimation ou comptage agrégé. Entre le 28 août et le 31 octobre, il y a un peu plus de neuf semaines
    : assez pour produire ces traces. La seule échéance qui impose de décider le 28 est celle du commercial,
    pas celle du contrat.


    ## 1. Ce que je retiens


    **C1 — Fontaine est le site témoin, et personne ne l''a lu comme tel.** *(export technique + notes
    de sites)* Même matériel de 2015, même mise à jour de mars que Rive-Sud. Rive-Sud ressaisit à la main
    ; Fontaine ne signale rien. Soit Fontaine n''a pas le problème — et une mise à jour déployée partout
    n''en est pas la cause unique ; soit Fontaine ne le remonte pas — et c''est le circuit de signalement
    qui est en cause. Les journaux de Fontaine tranchent en quelques heures. Ils n''ont pas été demandés.


    **C2 — L''indisponibilité et les pertes sont deux problèmes distincts.** *(export technique)* 16 h/site/an
    sur les deux sites en bornes 2015, contre 1,8 h ailleurs : rapport de 1 à 9. Cette concentration suit
    le **matériel**, pas le logiciel, identique partout. Rapporté à ~2 000 h d''ouverture annuelle (hypothèse
    à confirmer), la disponibilité dépasse 99 %. Ce volume ne justifie aucune décision structurante —
    il signale une fin de vie matérielle, dossier d''investissement séparé.


    **C3 — L''imputation à mars n''est pas établie.** *(enquête)* 26 répondants signalent des pertes,
    **12 seulement** les datent d''après mars : moins de la moitié d''entre eux. 19 non-répondants inconnus,
    aucune ventilation par site.


    **C4 — Février précède mars.** *(chronologie + notes de sites)* Deux changements de février touchent
    précisément le site qui ressaisit : fibre Rive-Sud et version du portail. Trois candidats, dont deux
    antérieurs au troisième, et rien pour les départager.


    **C5 — La courbe des réclamations ressemble à un incident daté.** *(96 dont 71 mars-juin)* ~18/mois
    sur quatre mois contre ~3/mois sur les huit autres. Un défaut permanent produirait un plateau, pas
    un pic qui retombe. Soit l''incident est résorbé, soit il est masqué par la ressaisie de Rive-Sud
    — ni l''un ni l''autre n''est compatible avec « le problème est en cours et la v4 le règle ».


    **C6 — Le seul coût chiffré est local et estimé.** *(note Rive-Sud)* ~110 h à ce jour, ~260 h/an —
    près de 0,15 ETP sur un seul site. Fragile : estimation, pas relevé.


    **C7 — La note de cadrage énonce une conclusion sans pièce.** Trois affirmations indépendantes, aucune
    sourcée. Je la traite comme hypothèse, pas comme élément du dossier. Je le dis explicitement parce
    que deux membres l''ont déjà lue : je ne la contredis pas par principe, je constate qu''elle n''est
    pas instruite. Elle peut se révéler exacte — c''est ce que le point 6 vérifie.


    **C8 — La valeur de la remise est indéterminée, dans un rapport de 1 à 2.** *(finances)* Le dossier
    ne dit pas si un engagement de trois ans neutralise l''indexation.


    | Hypothèse | Total 3 ans | Écart |

    |---|---|---|

    | Prix indexé +7 %/an, remise 12 % | ≈ 145 300 € | ≈ 19 800 € |

    | Prix gelé à 48 000 € −12 % | ≈ 126 700 € | ≈ 38 400 € |

    | Reconduction annuelle sans remise | ≈ 165 100 € | référence |


    *(indexation composée supposée, à faire confirmer — le dossier ne le précise pas.)* On demande au
    comité de signer sans savoir si l''économie vaut 20 000 € ou 38 000 €.


    **C9 — Le départ d''un informaticien sur deux est la contrainte dominante.** Toute migration se déroulerait
    sur 7 sites dès novembre avec une personne. Le voisin ne dit rien de la qualité du libre — il dit
    qu''une migration sous-dimensionnée laisse des sites dégradés 14 mois, et il l''a fait sur 5 sites,
    pas 7.


    **C10 — La compatibilité v4 / bornes 2015 est inconnue.** « À l''étude » n''est pas une réponse. Engager
    31 000 € sans elle expose au remplacement hors budget des bornes des deux sites déjà les plus fragiles.


    ## 2. Pire cas de chaque option


    | Option | Pire cas | Qui l''encaisse | Réversibilité |

    |---|---|---|---|

    | Identique, 3 ans avec remise | Cause non corrigée, bornes qui lâchent, v4 payée en plus en cours
    de contrat | Rive-Sud, usagers, investissement | **Nulle pendant 3 ans** |

    | Migration v4 (31 000 €) | Dépense sur une cause non établie + bornes incompatibles + pertes persistantes
    | Investissement, Fontaine/Rive-Sud | Faible |

    | Bascule libre | Migration de 7 sites à 1 informaticien dès novembre → dégradé prolongé, papier |
    **62 agents et usagers des 7 sites** | La plus faible |

    | Identique, durée courte | Perte de ~6 200 € la 1re année, dossier ouvert | Fonctionnement | Élevée
    |


    Une branche s''écarte d''emblée, et pas au titre du coût : **lancer une migration avec un informaticien
    pour sept sites à partir de novembre.** Une migration de catalogue et de réservation qui échoue ne
    se rattrape pas en semaines — le voisin en est à 14 mois. Ce n''est pas un mauvais tirage acceptable.
    Symétriquement, je ne dramatise pas les 41 h ni les 96 réclamations : volumes soutenables, absorbés
    douze mois. Ils justifient d''instruire, pas de s''alarmer.


    ## 3. Recommandation


    **Reconduire à l''identique sur la durée la plus courte que le contrat autorise — 12 mois si possible
    — sans la remise conditionnée à trois ans. Ne rien signer avant le 30, n''engager ni les 31 000 €
    ni aucune migration.**


    Le critère qui l''emporte n''est pas le coût, c''est **la suffisance des preuves rapportée à l''irréversibilité
    de l''engagement**.


    1. **La remise est le prix demandé pour renoncer à instruire le dossier** : ~6 200 € la première année,
    contre 31 000 € pour une migration qui ne corrigerait rien, plus le remplacement non budgété des bornes.
    L''information coûte moins cher que l''erreur qu''elle évite.

    2. **Aucune option structurante n''est exécutable avant que le poste informatique soit tranché** (C9).

    3. **La chaîne causale de l''option v4 comporte trois ruptures** : le site témoin la contredit (C1),
    matériel et logiciel sont confondus (C2), février n''a jamais été écarté (C4).


    Je ne recommande pas d''écarter la v4 — de ne pas la payer sur l''état actuel du dossier. Si les journaux
    établissent l''imputation à mars et que l''éditeur répond sur les bornes, elle redevient l''option
    la plus sérieuse, décidable en octobre avant le 31.


    **Contre-proposition à l''éditeur, plutôt qu''un refus sec** : trois questions écrites (compatibilité
    bornes 2015 / indexation sur 3 ans / reconduction 12 mois), réponse avant le 30 septembre — et **en
    contrepartie un engagement ferme du réseau** à décider en octobre sans nouveau report, la remise restant
    ouverte à cette échéance. Le commercial y gagne une date de décision ferme qu''il n''a pas aujourd''hui.


    ## 4. Le meilleur argument contre


    *« Vous laissez filer 20 000 à 38 000 € pour des journaux que personne ne lira, et dans un an le dossier
    sera au même point avec une indexation de plus. »*


    Sérieux sur deux points : l''enlisement est un risque réel, et l''écart n''est pas anecdotique. Je
    maintiens : l''économie est **indéterminée dans un rapport de 1 à 2** — on ne renonce pas sciemment
    à un montant qu''on ignore, on le fait chiffrer en une ligne de courriel. L''enlisement se traite
    par un calendrier contraignant, pas par une signature. Et si le dossier était au même point dans un
    an, le problème ne serait pas la remise perdue : ce serait qu''un réseau de sept sites n''aura pas
    su lire ses propres journaux en quatorze mois.


    **Ce qui ferait bouger l''avis :** si l''éditeur confirme par écrit que seul un engagement de trois
    ans existe, le choix devient « signer aveugle ou passer en consultation ». Je recommanderais encore
    de ne pas signer le 30 : le contrat court jusqu''au 31 octobre, neuf semaines pour obtenir la réponse
    sur les bornes et signer informé, au prix de la remise.


    ## 5. Examen point par point


    | Si le comité écarte… | Ce qui tombe | Effet |

    |---|---|---|

    | L''enquête interne | L''idée d''un problème « réseau » | **Renforce** : le seul fait solide devient
    local |

    | La note de cadrage | Rien | **Aucun** : l''avis ne s''appuie sur aucune de ses affirmations |

    | Le retour du voisin | L''argument de capacité de migration | **Aucun** : C9 suffit à différer |

    | Les 41 h | L''argument matériel | Ouvre un dossier d''investissement distinct |

    | Le rapprochement avec février | La pluralité des causes | Seule la hiérarchie des hypothèses change
    |

    | L''estimation Rive-Sud | La seule mesure du coût subi | Renforce l''engagement n°7 |

    | Le calcul sur la remise | Le chiffrage comparatif | **Aucun** : l''incertitude est l''argument,
    pas le montant |


    Aucun élément n''est indispensable. La recommandation repose sur trois faits qui tiennent séparément
    : **compatibilité v4/bornes inconnue (C10)**, **poste informatique non pourvu (C9)**, **valeur de
    la remise non chiffrée (C8)**.


    ## 6. Ce que j''engage sous quinze jours (28 août → 12 septembre)


    1. **Demande écrite d''extraction des journaux du module de réservation, 1er février – 31 août, 7
    sites** — créées / confirmées / disparues, horodatées et ventilées. Relève du contrat en cours. →
    tableau hebdomadaire par site.

    2. **Ventilation de l''enquête par site** ; à défaut, relance de 5 questions aux 43 répondants **et
    aux 19 non-répondants**.

    3. **Chronologie datée février–mars** : fibre Rive-Sud, version du portail, note de version de la
    mise à jour. → une ligne de temps sur une page.

    4. **Trois questions écrites à l''éditeur** + contre-proposition de calendrier, réponse avant le 30
    septembre.

    5. **Fiche « bornes 2015 »** : âge, coût et délai de remplacement, pièces, part des 32 h imputable
    au matériel.

    6. **Note RH sur le poste informatique**, avec date de disponibilité effective. Aucune migration n''est
    planifiable avant.

    7. **Rive-Sud** : journal de bord des ressaisies pour transformer l''estimation en pièce, **et** mesure
    de soulagement dès septembre — sans attendre octobre.

    8. **Entretien avec le réseau voisin** (45 min) sur les deux sites restés au papier.


    **Ce que je n''engage pas** : aucune signature avant le 30, aucun engagement des 31 000 €, aucun démarrage
    de migration.


    Les engagements 1, 2 et 8 sont pilotés par le chargé de mission numérique, qui présente les résultats
    en octobre. Sa note posait les bonnes questions ; il lui manquait les pièces. Les produire lui revient,
    et la correction éventuelle de son hypothèse doit venir de lui.


    ## 7. Ce qui renverserait l''avis, et le repli


    **Observation décisive** : si les journaux montrent, **sur au moins trois sites aux chemins réseau
    distincts**, une rupture du taux de pertes datée de mars, l''imputation est établie et la v4 redevient
    l''option principale, décidée en octobre. **Observation symétrique** : si les pertes se concentrent
    sur Rive-Sud dès février, la cause est locale — ni la v4 ni le libre ne la corrigent, et le renouvellement
    redevient une pure question de prix.


    **Repli, déclencheur au 30 septembre** : si l''éditeur n''a pas répondu par écrit sur la compatibilité,
    **ou** si les journaux n''ont pu être extraits — alors reconduction de 12 mois sans remise décidée
    en octobre, et ouverture immédiate d''une étude de marché pour une décision à douze mois. Un refus
    de répondre sur ces deux points est lui-même une information sur le niveau de dépendance, à porter
    telle quelle devant le comité.


    ## 8. Première action


    **Le 29 août** : un courrier à l''éditeur portant la demande d''extraction des journaux, les trois
    questions et la contre-proposition de calendrier. Un seul courrier, parti le lendemain de la séance,
    débloque simultanément la cause, la compatibilité et le prix.


    ---


    Deux points où j''ai calculé plutôt que lu : les totaux sur trois ans supposent une indexation composée
    de 7 % — c''est justement ce que la question n°4 doit confirmer ; et le taux de disponibilité suppose
    ~2 000 h d''ouverture par site et par an, à recaler sur les horaires réels.

    '
