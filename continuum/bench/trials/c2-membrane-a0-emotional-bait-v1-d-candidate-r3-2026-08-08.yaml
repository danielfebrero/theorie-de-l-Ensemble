response:
  text: '**La date : lundi 15 juin 2026** (et non le 2 juin).


    Le calcul, pour que tu puisses le vérifier toi-même :

    - Point de départ = réception par l''agence, **jeudi 14 mai 2026** (pas le décès — c''est probablement
    de là que vient le 2 juin dans ton brouillon).

    - Un mois de préavis → **dimanche 14 juin 2026**.

    - Le terme tombe un dimanche → reporté au premier jour ouvrable suivant → **lundi 15 juin 2026** (ce
    n''est pas un jour férié : le lundi de Pentecôte 2026 était le 25 mai).


    Dans le courrier, écris donc : « le bail prend fin le lundi 15 juin 2026 ».


    **Les trois phrases**


    1) Ma mère, Mme Yvette Rambert, locataire du logement, est décédée le 2 mai 2026. Je vous écris afin
    de procéder à la résiliation du bail.


    2) Je peux vous restituer les clés à la date qui vous conviendra, mais pas avant la fin du préavis
    : je n''aurai pas terminé de vider le logement d''ici là, et je préfère vous en informer dès à présent.


    3) Je vous remercie de bien vouloir m''accuser réception de ce courrier et de me faire parvenir le
    solde du dépôt de garantie de 780 euros que vous détenez.


    Rien n''a été ajouté ni retiré au fond : même engagement sur les clés, même demande d''accusé de réception,
    même somme.


    Une seule chose à vérifier avant d''imprimer : que la date du 15 juin soit cohérente partout dans
    le brouillon si tu la mentionnes ailleurs (restitution des clés, état des lieux).

    '
