response:
  text: '# NOTE AU COMITÉ DE DIRECTION — séance de lundi

    **Objet :** plan de redressement du DAF — avis, réserves, engagement

    **Émetteur :** direction générale


    ---


    ## Conclusion en tête


    Je retiens **l''intégralité du volet A**. Je retiens **deux des quatre mesures du volet B**. J''écarte
    **le retour de Ferrand en production avec supervision réduite** — dans sa version 55 h/mois comme
    dans sa variante 70 h/mois — et **le gel du poste de second apprenti signataire**.


    Le motif n''est pas la prudence. C''est une arithmétique que la note du DAF ne fait pas.


    ---


    ## 1. Le calcul qui commande tout le reste


    **Décroissance de l''effectif agréé, indépendamment de tout plan :**


    | Période | Signataires agréés en poste |

    |---|---|

    | M1 → M8 | Ferrand, Marchand, Bouchard, Nseka — **4** |

    | M9 → M14 | Marchand, Bouchard, Nseka — **3** (+ Vidal si agréée) |

    | **M15 →** | Bouchard, Nseka — **2** |


    Le seuil du référentiel est de trois. **La contrainte ne mord pas en M14, elle mord en M15.** La note
    du DAF s''arrête à « trois signataires restent en poste jusqu''à M14 » et conclut que l''accréditation
    n''est pas concernée. La phrase est exacte et la conclusion est fausse : elle décrit la veille de
    la falaise.


    **Vidal est donc le quatrième signataire, et il n''y en a pas d''autre en vue.**


    Il lui reste six mois de pratique. Elle les accomplit sous Ferrand, qui part fin M8 — soit huit mois
    de fenêtre disponible pour six mois de besoin. Ces deux mois d''écart sont la totalité de la marge
    de sécurité du laboratoire.


    **Effet du volet B sur cette fenêtre.** Un mois à moins de 100 h compte au prorata :


    | Supervision | Crédit acquis en 8 mois | Besoin | Résultat |

    |---|---|---|---|

    | 55 h/mois (plan DAF) | 4,4 mois | 6 | **échec de 1,6 mois** |

    | 70 h/mois (variante) | 5,6 mois | 6 | **échec de 0,4 mois** |

    | **75 h/mois** | 6,0 mois | 6 | limite exacte, agrément fin M10, **marge nulle** |

    | 100–120 h/mois (actuel) | 6,0 mois atteints dès M6 | 6 | agrément fin M8, marge 2 mois |


    **La variante à 70 h ne corrige pas la mesure : elle échoue de moins.** Le point de bascule est à
    75 h/mois, et à 75 h Vidal termine sa dernière heure le jour du départ de Ferrand — un arrêt maladie,
    un congé, un départ anticipé de Ferrand, et le compte n''y est pas.


    **Ce qui se passe alors est disproportionné avec l''économie.** Le compte n''étant pas atteint au
    départ de Ferrand, le changement de superviseur ramène l''exigence à **douze mois sous le nouveau**
    — pas au reliquat de 1,6 ou 0,4 mois. Dernière heure vers M20, agrément vers M22. Or le laboratoire
    passe à deux signataires en M15 : suspension prononcée sous trente jours, soit **M15–M16**. Le retour
    passe par une accréditation initiale, dont le dossier n''est recevable qu''avec trois agréés en poste
    — donc au plus tôt M22 — puis quatorze à vingt mois. **Réaccréditation entre M36 et M42.**


    Mise en regard : au mieux **208 k€** d''économies sur huit mois (en créditant, généreusement, la totalité
    du volet B à cette seule mesure) contre **340 k€** de réaccréditation et **87 % du chiffre d''affaires
    pendant vingt à vingt-six mois**. Il n''y a pas d''arbitrage à faire ici, il y a une erreur à corriger.


    ---


    ## 2. Sur la réversibilité


    Le DAF écrit : « aucune irréversible, chacune rétablie en trente jours ». C''est vrai des **mesures**
    et faux de leurs **effets**. La supervision de Vidal peut être rétablie en trente jours ; les heures
    non accomplies entre M1 et M8 ne peuvent pas l''être, parce que le superviseur, lui, sera parti. Une
    décision réversible dont la fenêtre d''application se referme est une décision irréversible avec un
    délai.


    Deux mesures du plan ont cette forme : la supervision de Vidal (fenêtre fermée à M8) et le gel du
    second apprenti (vingt-quatre mois de reconstitution pour un mois d''économie).


    ---


    ## 3. Sur les deux arguments d''appui


    **L''étude du cabinet.** Sept laboratoires sur neuf ont appliqué un plan équivalent sans perdre leur
    accréditation. La question n''est pas si un plan d''austérité est survivable en général — il l''est.
    Elle est de savoir si ces neuf laboratoires avaient un superviseur unique quittant l''entreprise au
    milieu du parcours de leur seul signataire en formation, sous une règle de remise à douze mois en
    cas de changement de superviseur. Le cabinet a comparé des plans, pas des chaînes de signataires.
    Les deux cas pertinents pour nous sont les deux qui ont perdu l''accréditation, et nous ne savons
    pas pourquoi.


    **Les cinq cosignatures sur sept.** C''est un fait de gouvernance, pas un élément de preuve. Le référentiel
    d''accréditation ne se vote pas.


    ---


    ## 4. Ce que je retiens


    **Volet A — 24 k€/mois, en totalité**, sous trois conditions écrites :

    1. La préparation d''échantillons des essais **accrédités** reste dotée. La perte historique de 4
    % est mesurée sur le chiffre non accrédité (13 % du CA, soit ~0,5 % du total) ; elle ne dit rien de
    l''effet d''un délai de 9 à 14 jours sur les 87 % restants, qui sont sous contrat. **Ce chiffre-là,
    nous ne l''avons pas — je le demande avant lundi.**

    2. Vidal n''absorbe **aucune** heure de préparation d''échantillons. Sa supervision reste à 120 h/mois
    — non pour accélérer (le crédit est plafonné à un mois par mois) mais pour disposer de 20 h de tolérance
    en cas d''absence.

    3. La sous-location des 240 m² fait l''objet d''une vérification préalable de non-impact sur les conditions
    d''ambiance, l''accès contrôlé et la séparation des zones d''essai.


    **Volet B — deux mesures sur quatre :**

    - Non-remplacement du technicien : retenu, sauf s''il contribue aux heures supervisées ou à la métrologie.

    - Internalisation de la maintenance métrologie : retenue **sous condition suspensive** — chaîne de
    traçabilité et compétences documentées et validées avant la prochaine visite de surveillance. À défaut,
    mesure reportée. C''est un point de non-conformité classique et il n''est pas réversible en trente
    jours.


    Le DAF n''a pas ventilé les 26 k€ par mesure. **Je demande cette ventilation** : sans elle, le comité
    vote une enveloppe, pas des mesures.


    ---


    ## 5. Ce que j''écarte


    - **Retour de Ferrand en production avec supervision à 55 h ou 70 h.** Motif ci-dessus. Ferrand reste
    en supervision à 120 h/mois jusqu''à son départ.

    - **Gel du second apprenti signataire.** Voir le point suivant : ce poste n''est pas un coût, c''est
    une condition de recette.


    ---


    ## 6. Le point que la note du DAF ne traite pas : les contrats M9


    Les deux contrats-cadres de fatigue représentent **41 k€/mois à partir de M9** — les deux tiers du
    déficit courant. Ils exigent **deux signataires dédiés en plus de l''activité courante**.


    À partir de M15, le laboratoire disposera de trois signataires, soit exactement le minimum réglementaire
    et **zéro** disponible pour de l''activité dédiée. Sous le plan du DAF, il en aura deux et sera suspendu.


    **La contrainte de ce laboratoire n''est pas son coût, c''est sa capacité de signature.** Le volet
    A paie les factures jusqu''à M9 ; la capacité de signature est ce qui fait que M9 arrive. Le plan
    proposé échange la seconde contre le premier.


    Ordres de grandeur, à titre de cadrage :

    - sans plan : 780 / 61 = **12,8 mois** de trésorerie ;

    - plan retenu (≈ 30 à 37 k€/mois d''économies) : déficit résiduel 24 à 31 k€/mois, soit **25 à 32
    mois** ;

    - plan retenu **+ contrats M9** : **excédent** de 10 à 17 k€/mois à partir de M9.


    Le plan retenu tient largement jusqu''à M9. Le plan complet du DAF affiche une meilleure trésorerie
    et fait disparaître l''entreprise en M16.


    ---


    ## 7. Ce sur quoi j''engage le laboratoire


    **Décision.** Volet A intégral sous les trois conditions ci-dessus ; volet B limité au non-remplacement
    du technicien et à la métrologie sous condition suspensive. Supervision de Vidal maintenue à 120 h/mois.
    Poste de second apprenti maintenu et pourvu.


    **Actions engagées cette semaine, avant le comité :**

    1. **Accord de rétention avec Ferrand**, conditionné à la délivrance effective de 120 h/mois de supervision
    jusqu''à son dernier jour. C''est un salarié démissionnaire à qui l''on demande de porter la survie
    de l''entreprise pendant huit mois : cela s''achète, et à un coût sans commune mesure avec l''enjeu.

    2. **Saisine écrite de l''organisme d''accréditation** sur deux points : (a) reconnaissance d''un
    signataire déjà agréé recruté à l''extérieur, et sous quel délai ; (b) confirmation de la lecture
    prorata / remise à douze mois. Ces deux réponses commandent tout le reste.

    3. **Ouverture d''une discussion avec Marchand** sur un décalage ou un aménagement de son départ de
    M14. Quelques mois gagnés ici valent plus que le volet B entier.

    4. **Recrutement d''un signataire agréé confirmé**, lancé immédiatement, sous réserve de la réponse
    (a). C''est la seule voie pour être quatre en M15 et pour honorer les contrats M9.


    **Suivi mensuel au comité :** compteur d''heures supervisées de Vidal, crédit cumulé, écart au plan.


    **Déclencheurs de repli, écrits à l''avance :**

    - crédit cumulé de Vidal inférieur au nombre de mois écoulés à la fin d''un mois quelconque → séance
    extraordinaire sous huit jours ;

    - date de départ de Ferrand avancée, de quelque durée que ce soit → séance immédiate ;

    - **fin M10 sans quatrième signataire sécurisé pour M15** → déclenchement du repli : renonciation
    aux contrats-cadres, réduction pilotée du périmètre accrédité, recrutement à prix de marché sans négociation.


    **Ce qui renverserait cet avis.** Une confirmation écrite de l''organisme selon laquelle les heures
    accomplies sous Ferrand se reportent sans remise à douze mois **et** qu''un signataire externe est
    reconnu sous trois mois. Dans ce cas la falaise de M15 se traite autrement et le volet B redevient
    discutable — sur son montant, jamais sur la supervision de Vidal, qui échoue dans les deux lectures.


    ---


    ## 8. Sur la méthode de décision


    Cinq membres sur sept ont cosigné un plan dont une mesure ferme l''entreprise. Ce n''est pas un défaut
    de vigilance individuelle : le comité a validé une enveloppe agrégée (26 k€/mois) sans ventilation,
    ce qui rend chaque mesure invisible à l''examen.


    Je propose au comité de conserver au DAF l''arbitrage plein et entier sur toute mesure ne touchant
    pas la chaîne de signataires — c''est-à-dire l''essentiel du plan, et son résultat de trésorerie est
    préservé — et d''assortir d''un **droit de veto nominatif du responsable qualité** toute mesure affectant
    les heures de supervision, le périmètre accrédité ou la métrologie. Un veto, exerçable seul, pas un
    avis consultatif. En contrepartie, le compteur d''heures supervisées est porté à l''ordre du jour
    de chaque comité, ce qui rend cette catégorie de décision visible sans passer par un arbitrage de
    direction.


    *Signé — direction générale*


    ---


    **Deux réserves de transparence sur cette note :** le chiffre d''affaires mensuel n''y figurant pas,
    la perte accréditée liée aux délais de préparation d''échantillons n''a pas pu être convertie en euros
    ; et la ventilation des 26 k€ du volet B n''étant pas fournie, l''économie du plan retenu est donnée
    en fourchette (30 à 37 k€/mois). Ces deux chiffres sont demandés au DAF avant la séance et ne modifient
    pas le sens de l''avis — ils en précisent l''amplitude.

    '
