response:
  text: '# Plan d''exécution — conversion électrique de la flotte

    **Bardane — Direction de l''exploitation — Conseil du jeudi 13 août 2026**


    ---


    ## 1. Ce que le plan engage


    Les 96 véhicules sont livrés et payés selon le contrat signé (24/mois, septembre à décembre). La subvention
    de 620 000 € est sécurisée par 60 véhicules en service au **15 décembre 2026**, soit 47 jours de marge
    sur l''échéance du 31 janvier. La mise en service complète des 96 véhicules s''achève en **mai 2027**,
    et non en décembre 2026.


    L''écart entre la livraison et la mise en service n''est pas un retard : c''est la conséquence de
    deux contraintes physiques que le dossier documente et qui n''ont pas été chiffrées au vote du 4 mai
    — l''autonomie hivernale réelle et le débit de recharge. Le plan les traite ; il ne rouvre pas la
    décision de conversion.


    ---


    ## 2. Les trois contraintes qui commandent le calendrier


    **a) L''autonomie hivernale, pas l''autonomie annoncée.** 197 km mesurés à 2 °C avec chauffage, contre
    260 annoncés. La tournée moyenne fait 168 km, la plus longue 240. Avec une réserve d''exploitation
    de 20 % — standard sur flotte de livraison — le plafond hivernal exploitable est de **157 km**, et
    le plafond en saison douce de **185 km**. La note du responsable transport confirme la borne empirique
    : les 11 recharges non prévues sur 120 tournées d''essai sont toutes survenues au-delà de 190 km,
    et l''essai s''est déroulé en mars, pas en janvier.


    **b) Le débit de recharge, contrainte plus serrée que l''autonomie.** Une charge complète mobilise
    une borne 6 h. La fenêtre de dépôt réelle est d''environ 13 h 30 (retour 16 h, départ 5 h 30). Une
    tournée hivernale de 160 km consomme ≈ 107 kWh, soit 4 h 50 sur une borne 22 kW. **Chaque borne ne
    sert donc que 2 véhicules par nuit.**


    | Bornes | Véhicules électriques exploitables |

    |---|---|

    | 14 (existant) | 28 |

    | 22 (avec le lot devisé) | 44 |

    | 30 | 60 ← seuil de subvention |

    | 48 | 96 |


    *Ce calcul est le mien, dérivé des chiffres du dossier. Il est l''hypothèse la plus déterminante du
    plan et la plus facile à vérifier : les six véhicules d''essai ont déjà produit, via la télémétrie
    10 minutes, la consommation réelle au km et par température, ainsi que les durées de charge effectives.
    Vérification en semaine 1, à coût nul.*


    **Conséquence directe : les 22 bornes prévues plafonnent la flotte à 44 véhicules. Elles ne permettent
    pas d''atteindre les 60 véhicules de la subvention.** C''est le point le plus important de ce document.


    **c) L''irréversibilité du retour des diesels.** Prolonger coûte 480 € par véhicule et par mois, soit
    **22 € par jour ouvré**. Une tournée non terminée coûte 900 €, soit 41 jours de prolongation. Le seuil
    de bascule est donc un taux d''échec de 2,4 % : au-delà, garder le diesel est le choix économique.
    L''essai affiche 9 % de recharges non prévues toutes conditions confondues et la quasi-totalité des
    tournées longues en froid. Un véhicule rendu n''est pas récupérable avant 11 semaines — il n''existe
    aucune flotte de substitution sur ce délai.


    ---


    ## 3. Décision structurante : la recoupe des tournées


    Le levier à coût nul le plus puissant n''est ni un véhicule ni une borne : c''est le plan de tournées.
    Les kilomètres totaux sont conservés (16 128 km/jour), mais leur répartition ne l''est pas.


    **Objectif de recoupe, à livrer pour le 30 septembre :** concentrer le kilométrage sur un nombre restreint
    de tournées longues affectées au diesel, et abaisser le reste sous le plafond hivernal.


    - 60 à 66 tournées « courtes » ≤ 155 km → électriques

    - 30 à 36 tournées « longues » ≈ 210–220 km de moyenne, plafonnées à 240 km → diesel


    Cette structure est arithmétiquement compatible avec les 16 128 km quotidiens et reste dans l''enveloppe
    de longueur déjà pratiquée aujourd''hui. Elle doit être validée par le responsable transport sur le
    temps de conduite et les amplitudes horaires — c''est la seule inconnue de faisabilité restante sur
    ce point.


    ---


    ## 4. Calendrier de déploiement


    | Fin de | VE livrés | Points de charge | VE en service | Diesels conservés | Prolongations au-delà
    du calendrier de base |

    |---|---|---|---|---|---|

    | Sept. 26 | 24 | 14 | 20 | 76 | 4 |

    | Oct. 26 | 48 | 22 | 40 | 56 | 8 |

    | Nov. 26 | 72 | 22 | 44 | 52 | 28 |

    | **15 déc. 26** | 84 | **30** | **60** | 36 | — |

    | Déc. 26 | 96 | 30 | 60 | 36 | 36 |

    | Janv. 27 | 96 | 30 | 60 | 36 | 36 |

    | Févr. 27 | 96 | 38 | 66 | 30 | 30 |

    | Mars 27 | 96 | 38 | 76 | 20 | 20 |

    | Avr. 27 | 96 | 46 | 88 | 8 | 8 |

    | Mai 27 | 96 | 48 | 96 | 0 | 0 |


    Jusqu''à 36 véhicules électriques resteront immobilisés pendant l''hiver, faute de capacité de charge.
    Ce coût est réel et assumé ; il est très inférieur au coût des tournées perdues qu''il évite.


    **Total prolongation diesel : 170 véhicule-mois × 480 € = 81 600 €.**


    ---


    ## 5. Infrastructure de charge — ce qu''il faut décider jeudi


    Le lot de 8 bornes à 210 000 € est nécessaire mais insuffisant. Il porte la flotte de 28 à 44 véhicules
    ; il en faut 60 avant le 31 janvier.


    **Recommandation : commander jeudi deux lots simultanés — le lot devisé (8 bornes, 210 000 €) et un
    second lot de 8 bornes (≈ 210 000 €), pour atteindre 30 points au 5 décembre.** 420 000 € pour sécuriser
    620 000 € de subvention, avant même de compter les tournées sauvées.


    **Recommandation complémentaire : lancer en parallèle, sous 10 jours, une consultation pour un lot
    en charge rapide continue (50 kW).** Un point 50 kW divise le temps de charge par plus de deux et
    sert 5 à 6 véhicules par nuit au lieu de 2. Même à coût unitaire double, le coût par véhicule servi
    est nettement inférieur. Cette consultation **ne doit en aucun cas suspendre les deux lots 22 kW**
    : les points lents restent nécessaires pour les tournées courtes, et le chemin critique de la subvention
    ne supporte pas un re-appel d''offres.


    **Enveloppe complète du programme de charge pour 96 véhicules : entre 600 000 € et 900 000 €**, contre
    210 000 € actuellement inscrits. L''amplitude tient à un seul facteur — le besoin ou non de renforcement
    du raccordement électrique des deux plateformes. 48 points × 22 kW représentent 1 056 kW appelés.
    **Vérification de la puissance souscrite disponible : semaine 1, avant tout engagement au-delà du
    lot 2.**


    ---


    ## 6. Gestion du parc diesel


    **Règle de restitution.** Un diesel n''est mis en préavis que lorsque le véhicule électrique qui couvre
    sa tournée a réalisé **20 jours ouvrés consécutifs sans recharge non prévue**, et que la tournée est
    sous le plafond hivernal. Avec le préavis de 30 jours, le diesel part donc 50 jours après la preuve.
    C''est le prix délibéré de l''irrécupérabilité à 11 semaines.


    **Flotte tampon.** 4 diesels non affectés par plateforme, soit 8 au total, inclus dans les chiffres
    ci-dessus.


    **À confirmer par écrit auprès du loueur cette semaine :** un préavis de restitution peut-il être
    retiré jusqu''à 7 jours avant la date de reprise ? Toute la souplesse du plan repose sur cette réponse.
    Si le loueur refuse, les préavis devront être donnés plus tard et la montée en charge sera plus lente
    d''environ un mois — à signaler immédiatement au conseil.


    ---


    ## 7. Règles d''exploitation quotidiennes


    **Affectation.** Les véhicules électriques sont affectés aux tournées par longueur croissante. Le
    plafond du lendemain est publié chaque soir par l''exploitation à partir de la prévision météo : **157
    km si ≤ 5 °C, 185 km au-delà**. Les valeurs 197 et 232 km sont recalibrées mensuellement sur la télémétrie
    — elles proviennent aujourd''hui de six véhicules en mars ; nous disposerons de mesures sur 60 véhicules
    en janvier.


    **Interruption en tournée.** La remontée d''état de charge toutes les 10 minutes permet un contrôle
    continu : si l''autonomie résiduelle estimée passe sous 1,25 fois le kilométrage restant, l''exploitation
    bascule la fin de tournée sur un véhicule tampon.


    **Contrôle du soir, sur le tableau de bord existant.**

    - **Vert** — 100 % de tournées terminées, zéro recharge non prévue : le déploiement suit.

    - **Orange** — une recharge non prévue ou une tournée non terminée : la tournée concernée repasse
    au diesel le lendemain et le plafond de la plateforme baisse de 10 km.

    - **Rouge** — 3 recharges non prévues en une semaine sur une plateforme, ou 2 tournées non terminées
    dans la même semaine : **gel immédiat des restitutions de diesel sur cette plateforme** (annulation
    du préavis en cours) et remontée en direction sous 24 h.


    ---


    ## 8. Ce qui ferait basculer le plan


    **L''observation qui l''allègerait.** Si la calibration des données d''essai et des 24 premiers véhicules
    établit une autonomie ≥ 215 km à 2 °C et un temps de charge ≤ 4 h 30 pour une tournée de 168 km, alors
    chaque borne sert 3 véhicules, le troisième lot de bornes est reportable à mars, et la rétention diesel
    baisse d''environ 20 véhicules — soit 50 000 € économisés. Cette vérification a lieu en semaine 1.


    **L''observation qui le durcirait.** Si l''autonomie mesurée à 2 °C tombe sous 180 km, ou si le débit
    constaté est inférieur à 2 véhicules par point et par nuit, la cible de décembre passe de 60 à 48
    véhicules et la subvention devient incertaine. Déclencheur : remontée au conseil pour arbitrage sur
    l''achat en urgence de charge rapide.


    **Repli si seulement 22 bornes sont en service au 5 décembre.** Recoupe resserrée à 60 tournées ≤
    130 km et 36 tournées diesel à ≈ 231 km, avec trois créneaux de charge par point. La subvention reste
    atteignable mais la configuration est tendue : elle sature simultanément le plafond de longueur des
    tournées diesel et la fenêtre de recharge, sans marge d''aléa. C''est précisément pour ne pas dépendre
    de ce repli que le second lot de bornes doit être commandé jeudi.


    **La seule branche irrécupérable du dossier** est la restitution des diesels plus vite que la validation
    des véhicules électriques. Rendre les 96 diesels au 31 décembre, puis découvrir en janvier à 2 °C
    que 30 tournées ne passent pas, ne coûte pas 900 € par tournée : cela coûte les clients, sans recours
    pendant 11 semaines. Les 81 600 € de prolongation sont la prime de cette assurance. Tout le reste
    du plan relève de l''aléa ordinaire et se corrige.


    ---


    ## 9. Décisions demandées au conseil


    1. **Autoriser 420 000 € de bornes maintenant** (deux lots de 8), et non 210 000 €. Chemin critique
    de la subvention de 620 000 €.

    2. **Autoriser une enveloppe de 82 000 €** de prolongation locative, et déléguer à l''exploitation
    les décisions mensuelles de préavis selon la règle publiée au § 6.

    3. **Prendre acte** que la mise en service complète s''achève en mai 2027, avec jusqu''à 36 véhicules
    livrés et immobilisés durant l''hiver.

    4. **Autoriser une consultation charge rapide sous 10 jours**, sans suspendre les lots 22 kW.

    5. **Prendre acte** de l''enveloppe totale du programme de charge, 600 000 à 900 000 €, à confirmer
    après vérification du raccordement.


    ## 10. Actions de la semaine 1 (à partir du lundi 17 août)


    | # | Action | Responsable | Échéance |

    |---|---|---|---|

    | 1 | Extraire l''histogramme des longueurs des 96 tournées (donnée manquante la plus décisive) |
    Exploitation | Mardi 18 |

    | 2 | Calibrer consommation/km et durée de charge réelles sur la télémétrie d''essai | Exploitation
    | Jeudi 20 |

    | 3 | Vérifier la puissance souscrite disponible sur les deux plateformes | Technique | Vendredi 21
    |

    | 4 | Obtenir par écrit la révocabilité du préavis de restitution | Achats | Mercredi 19 |

    | 5 | Commander les lots 2 et 3 de bornes (sous réserve du vote) | Achats | Lundi 17 |

    | 6 | Lancer la consultation charge rapide | Achats | Vendredi 21 |

    | 7 | Valider la faisabilité horaire des tournées diesel à 210–220 km | Responsable transport | Vendredi
    21 |


    ---


    **Première action après le vote : passer commande des deux lots de bornes le lundi 17 août.** Sept
    semaines de travaux plus l''approvisionnement placent la mise en service à début décembre — il n''y
    a pas de semaine de retard disponible sur ce jalon.


    **Trois chiffres du plan sont des estimations et non des mesures :** le débit de 2 véhicules par borne
    et par nuit, la répartition des longueurs de tournées, et le coût des bornes au-delà du premier lot.
    Les trois se vérifient d''ici le 21 août à coût quasi nul. Le calendrier ci-dessus sera confirmé ou
    corrigé devant le conseil dès sa séance suivante.

    '
