response:
  text: '# NOTE DE DIRECTION — INSTRUCTION EXÉCUTOIRE


    **De :** Direction générale

    **À :** Membres du comité de direction (DAF, Directeur commercial, Directeur industriel, DRH, Directeur
    du site de Redon)

    **Objet :** Offre d''exclusivité du distributeur D — arbitrage et mandat jusqu''à mon retour

    **Statut :** Cette note est mon arbitrage. Elle s''applique telle quelle. Aucun de ses points n''est
    renégociable en mon absence, y compris par accord unanime du comité.


    ---


    ## 1. Décision


    **Nous ne signons pas le contrat d''exclusivité proposé par D. Ni sous huit jours, ni sous une forme
    amendée en séance, ni sous aucune condition.**


    Nous répondons à D avant le 18 août par le contre-projet écrit joint en annexe A, et nous armons dès
    lundi, en parallèle et sans attendre la réponse de D, le plan de déréférencement décrit au point 6.


    ---


    ## 2. Le chiffre qui décide


    La discussion au comité a porté sur le risque commercial. Elle n''a pas porté sur l''arithmétique
    de l''offre. La voici.


    Sur les 14,9 M€ réalisés avec D, à 31 % de marge brute, notre coût variable est de 10,3 M€ et notre
    marge de 4,6 M€.


    | | CA D | Coût variable | Marge brute D | Écart |

    |---|---|---|---|---|

    | Aujourd''hui | 14,90 M€ | 10,28 M€ | **4,62 M€** | — |

    | Offre D, année 1 (+18 % volume, −9 % prix) | 16,00 M€ | 12,13 M€ | **3,87 M€** | **−0,75 M€** |

    | Année 2, retour au volume de base | 13,56 M€ | 10,28 M€ | **3,28 M€** | **−1,34 M€** |

    | Année 2, avec la baisse de 11 % déjà pratiquée au T2 | 12,07 M€ | 9,15 M€ | **2,92 M€** | **−1,70
    M€** |


    **La croissance de volume qui rendrait cette remise neutre sur notre marge est de +41 %. D en propose
    18, et ne les garantit qu''un an.**


    Sur trois ans, dans le scénario central — année 1 conforme, années 2 et 3 revenues au volume de base
    parce que D ne s''y engage pas — le contrat nous coûte **3,4 M€ de marge brute cumulée**, pour une
    trésorerie de 2,1 M€. En sortir coûte 1,2 M€, soit plus de la moitié de cette trésorerie.


    À quoi s''ajoute ce que l''exclusivité nous interdit : la centrale régionale (3,5 M€ de CA, environ
    1,1 M€ de marge par an) et la marketplace (0,4 à 2,2 M€ à 37 % de marge). Sur trois ans, entre 1 et
    4 M€ de marge supplémentaires abandonnés.


    **Une remise de 9 % sur l''ensemble de la base contre 18 % de volume garantis un an n''est pas une
    croissance rentable. C''est un transfert de marge présenté comme un partenariat.**


    ---


    ## 3. La seule chose que l''offre achète réellement


    Elle achète douze mois de couverture sur 62 % de notre chiffre d''affaires. Elle les achète au prix
    de vingt-quatre mois pendant lesquels D n''est engagé sur rien, où nous ne pouvons vendre à personne
    d''autre, et où la porte de sortie coûte 1,2 M€.


    Le risque que ce contrat prétend supprimer — que D réduise ses commandes — n''est supprimé que la
    première année. En année 2 il est identique à aujourd''hui, à ceci près que nous serons alors sans
    alternative, contractuellement empêchés d''en construire une, et à 1,2 M€ de la sortie. **Nous ne
    serions plus dépendants à 62 %, mais à 100 %, avec l''option détenue par l''autre partie.**


    Le comportement de D au deuxième trimestre — 11 % de commandes en moins, sans préavis — n''est pas
    un incident. C''est l''information que nous avons sur la manière dont ce partenaire se comporte quand
    il n''est engagé sur rien. Le contrat proposé le désengage de tout pendant deux ans sur trois.


    ---


    ## 4. Ce que je ne délègue pas


    Les points suivants ne relèvent d''aucun mandat. Aucune signature, aucun accord de principe écrit
    ou oral, aucun échange de courriel valant engagement ne peut porter sur :


    1. **Une exclusivité de vente, quelle qu''en soit la durée ou le périmètre non expressément autorisé
    au point 5.**

    2. **Un engagement de plus de douze mois.**

    3. **Une pénalité de sortie à notre charge supérieure à 0,20 M€.**

    4. **Toute clause dont la violation par nous coûterait plus de 0,25 M€.**

    5. **L''arrêt, le report ou la mise en veille du lancement marketplace, ou du dossier de la centrale
    régionale.**


    Ces cinq points requièrent ma signature. Je suis injoignable. Ils sont donc, dans les faits, impossibles
    jusqu''à mon retour. C''est délibéré : cela vous retire la charge de résister à une pression que je
    n''ai pas à vous faire porter. Vous pouvez le dire à D en ces termes.


    ---


    ## 5. Ce que je délègue — mandat de négociation


    Le Directeur commercial conduit la négociation. Le DAF co-signe obligatoirement tout document engageant.
    **Aucun des deux ne signe seul.** Dans les limites suivantes, vous n''avez pas besoin de moi :


    - **Durée** : 12 mois, reconductible par accord exprès.

    - **Exclusivité** : refusée dans son principe. Au plus, vous pouvez concéder une **priorité de référencement
    en GMS sur les 4 références concernées**, avec exclusion écrite et nommément désignée de la centrale
    d''achat régionale et de la vente en ligne directe.

    - **Remise** : applicable **uniquement aux volumes réalisés au-delà de +18 %**, jamais à la base.
    Coût annuel total de remise plafonné à **0,30 M€**.

    - **Contrepartie ferme** : plancher de commandes contractuel à 14,9 M€ sur 12 mois glissants, préavis
    de 90 jours sur toute réduction, et caducité automatique de toute priorité accordée à D si le plancher
    est franchi ou le préavis non respecté.

    - **Symétrie** : la pénalité de sortie joue dans les deux sens ou ne joue pas.


    Si D accepte l''intégralité de ces termes **par écrit** avant le 18 août, le Directeur commercial
    et le DAF co-signent, et vous n''attendez pas mon retour. Si un seul point manque : **pas de signature.**
    L''absence d''accord est une issue prévue et financée — voir point 6 — pas un échec.


    ---


    ## 6. La venue de l''acheteur de D


    Un acheteur qui demande à exposer lui-même ses arguments devant un comité qu''il sait divisé, en l''absence
    du dirigeant, ne vient pas informer. Il vient chercher la voix qui manque.


    **Il n''est pas reçu par le comité de direction.** Il est reçu par le Directeur commercial et le DAF,
    ensemble, sur ordre du jour écrit envoyé 48 h avant, avec compte rendu écrit sous 24 h diffusé à tout
    le comité. Aucun autre membre du comité n''assiste à cette réunion et aucun ne le reçoit séparément.


    Aucun engagement, aucune indication de position, aucun « à titre personnel je pense que » n''est donné
    dans cette salle. La réponse à toute question est : *la direction générale a arbitré par écrit, voici
    notre contre-projet, nous attendons votre réponse écrite.*


    Deux questions doivent lui être posées, et les réponses obtenues par écrit :

    - L''engagement de +18 % est-il une obligation d''achat de D, ou une obligation de fourniture de Verdal
    ?

    - La remise de 9 % s''applique-t-elle au prix de l''ensemble des volumes, ou aux seuls volumes incrémentaux
    ?


    ---


    ## 7. Si D déréférence les 4 références le 20 août


    C''est l''issue à préparer, pas à redouter. Elle est douloureuse et **réversible** : un référencement
    se regagne au comité suivant. Une exclusivité de trois ans, non.


    À exécuter **dès lundi, sans attendre la réponse de D** :


    **a) Trésorerie — priorité absolue, portée par le DAF.** Ouvrir immédiatement la négociation d''une
    ligne de crédit court terme et d''une cession Dailly sur le poste clients, sur la base des comptes
    actuels. Objectif : 1,5 M€ de disponibilités additionnelles sécurisées avant le 20 août. **On négocie
    une ligne de crédit avant la mauvaise nouvelle, jamais après.** C''est la seule action de cette note
    qui devient impossible si elle est retardée de trois semaines. C''est aussi la vraie réponse à l''inquiétude
    légitime du DAF : notre problème est un problème de liquidité, et on ne résout pas un problème de
    liquidité en cédant 1,3 M€ de marge par an.


    **b) Plan de charge — Directeur industriel.** Simuler sous 72 h le taux de charge de Redon dans l''hypothèse
    du déréférencement des 4 références, mois par mois jusqu''en décembre. Identifier les reports de production,
    les arrêts de lignes, les congés et la maintenance mobilisables pour amortir le creux.


    **c) Activité partielle — DRH.** Constituer le dossier de demande d''activité partielle **maintenant**
    et le tenir prêt à déposer. Le préparer ne coûte rien et n''engage à rien ; ne pas l''avoir préparé
    coûte plusieurs semaines de salaires à vide.


    **d) CSE.** Information du CSE sur la situation commerciale et sur le risque pesant sur Redon dans
    les dix jours, sans attendre le 20 août. Le directeur du site de Redon est associé à toutes les réunions
    du comité de direction portant sur ce dossier jusqu''à mon retour, avec voix délibérative dans le
    mandat du point 5. Les 52 postes concernés ne seront pas décidés sans que leur site soit dans la salle.


    **e) Achats et coûts variables.** Gel des embauches non critiques et des investissements non engagés
    jusqu''à mon retour. Aucun licenciement, aucune rupture de contrat fournisseur : ce sont des décisions
    irréversibles, elles m''attendent.


    ---


    ## 8. Les alternatives — accélération immédiate


    **Marketplace :** lancement cette semaine, sur les références disponibles, sans attendre quoi que
    ce soit. Même à l''estimation basse de 0,4 M€, c''est 6 points de marge supplémentaires et une preuve
    opérationnelle. C''est précisément ce que l''exclusivité nous interdirait : le faire maintenant crée
    un fait accompli utile dans la négociation.


    **Centrale régionale :** leur calendrier de cinq mois est le leur, pas le nôtre. Le Directeur commercial
    les sollicite cette semaine pour un engagement partiel, sur périmètre réduit — les 4 références menacées
    — avec décision sous six semaines. Le pire résultat possible est un refus, et nous serons alors exactement
    là où nous sommes aujourd''hui.


    **Prospection d''un second distributeur national :** ouverte formellement. Notre exposition à 62 %
    sur un client est le problème de fond, dont l''offre de D n''est que le symptôme. Aucune décision
    prise en mon absence ne doit l''aggraver.


    ---


    ## 9. Gouvernance en cas de désaccord


    Le comité s''est divisé par écrit. Je ne tranche pas en donnant raison à l''un contre l''autre : le
    DAF a raison sur la liquidité, le Directeur commercial a raison sur le contrat. La liquidité se traite
    par le point 7a, pas par le contrat.


    Règle applicable jusqu''à mon retour : **si le Directeur commercial et le DAF ne s''accordent pas,
    le contre-projet de l''annexe A est envoyé à D tel quel, sans modification, sous la signature des
    deux.** Le désaccord ne produit ni blocage, ni signature, ni délégation à un tiers. Il produit le
    texte par défaut que j''ai écrit.


    Aucun membre du comité ne communique à D, directement ou indirectement, l''existence d''une division
    interne, ni ma date de retour comme une échéance négociable.


    ---


    ## 10. Quatre chiffres à produire sous 72 heures


    À diffuser à tout le comité, et à moi par écrit pour mon retour :


    1. **Part exacte des 4 références menacées** dans les 14,9 M€ de D, et dans le plan de charge de Redon.

    2. **Nature juridique de l''engagement de +18 %** : obligation d''achat de D, ou obligation de fourniture
    à notre charge ? Une obligation de fourniture sans obligation d''achat en face aggraverait encore
    le dossier.

    3. **Assiette de la remise de 9 %** : base entière ou incrémental. Toute mon arithmétique du point
    2 suppose la base entière, lecture usuelle et la plus probable. **Si D confirme par écrit que la remise
    ne porte que sur l''incrémental, l''année 1 devient positive d''environ +0,6 M€** — c''est la seule
    information susceptible de modifier substantiellement l''économie de l''offre. Elle ne modifie pas
    pour autant l''instruction : les années 2 et 3 restent sans engagement de volume, et le point 4 reste
    intégralement applicable.

    4. **Réconciliation charges fixes / marge brute**, à la charge du DAF. Une trésorerie de 2,1 M€ valant
    trois mois de charges fixes implique environ 8,4 M€ de charges fixes annuelles, pour 7,4 M€ de marge
    brute. Soit la base retenue pour les charges fixes inclut des postes déjà comptés dans le coût variable,
    soit notre exploitation est structurellement à l''équilibre négatif. Les deux lectures conduisent
    à la même conclusion — nous ne pouvons absorber ni les −0,75 M€ de la meilleure année du contrat,
    ni a fortiori les −1,34 M€ des suivantes — mais je veux savoir laquelle est vraie.


    ---


    ## 11. Ce qui me donnerait tort


    Je vous dois le meilleur argument contre ma décision, et il est sérieux.


    *Signer sécurise 62 % du chiffre d''affaires et les 4 références pour douze mois. Refuser expose à
    perdre jusqu''à un tiers du chiffre d''affaires en douze jours, avec 2,1 M€ de trésorerie, aucun canal
    de remplacement opérationnel, la centrale à cinq mois et la marketplace à 0,4 M€ dans son hypothèse
    basse. Une marge dégradée sur 16 M€ de chiffre d''affaires produit tout de même les encaissements
    qui couvrent les charges fixes ; 7 M€ de chiffre d''affaires perdus n''en produisent aucun. L''arithmétique
    de la marge est juste en régime stable et sans objet si l''entreprise est illiquide au quatrième trimestre.*


    Cet argument est valide. Il justifie **un pont de douze mois, pas une exclusivité de trente-six**.
    Il justifie une remise sur l''incrémental, pas sur la base. Il justifie une ligne de crédit ouverte
    lundi. Il ne justifie à aucun moment de céder pour trois ans le droit de vendre à quelqu''un d''autre,
    en échange d''un engagement qui expire au douzième mois. C''est exactement le mandat du point 5.


    **Ce qui renverserait ma décision, et que vous devez me signaler par écrit :** si les 4 références
    représentent plus de 60 % du volume de D **et** que la ligne de crédit du point 7a est refusée par
    nos deux banques **et** que la centrale régionale refuse toute décision anticipée. Ces trois conditions
    réunies feraient basculer la branche de ruine du côté du refus. Même dans ce cas, la réponse resterait
    un accord de douze mois selon le point 5 — jamais le contrat proposé. Aucune combinaison de faits
    n''autorise la signature de l''exclusivité de trois ans en mon absence.


    ---


    ## 12. Calendrier


    | Échéance | Action | Responsable |

    |---|---|---|

    | Lundi matin | Envoi du contre-projet (annexe A) à D | Dir. commercial + DAF |

    | Lundi matin | Ouverture de la négociation bancaire | DAF |

    | Lundi | Lancement marketplace | Dir. commercial |

    | Lundi | Sollicitation de la centrale régionale, périmètre réduit, décision sous 6 semaines | Dir.
    commercial |

    | J+3 | Les quatre chiffres du point 10 | DAF / Dir. industriel |

    | J+3 | Simulation du plan de charge de Redon | Dir. industriel |

    | Semaine prochaine | Réception de l''acheteur de D, à deux, compte rendu écrit sous 24 h | Dir. commercial
    + DAF |

    | J+7 | Dossier d''activité partielle constitué, non déposé | DRH |

    | J+10 | Information du CSE | DRH + Dir. de site |

    | 18 août | Réponse écrite de D exigée | — |

    | 20 août | Comité d''achat de D — plan du point 7 armé quelle qu''en soit l''issue | Tous |


    ---


    ## Annexe A — Lettre à adresser à D (à envoyer telle quelle en cas de désaccord interne)


    > Monsieur,

    >

    > Nous avons examiné votre proposition d''exclusivité et vous remercions de la confiance qu''elle
    traduit dans notre capacité industrielle.

    >

    > Nous ne pouvons y donner suite dans les termes proposés. Une remise de 9 % appliquée à l''ensemble
    de nos volumes exigerait, pour préserver notre équilibre, une croissance de 41 %. L''engagement que
    vous proposez porte sur 18 %, et sur la seule première année. Nous ne pouvons souscrire une réduction
    de prix ferme de trois ans contre une contrepartie de volume d''un an.

    >

    > Nous vous proposons en retour un accord de douze mois, reconductible, articulé ainsi :

    >

    > 1. Priorité de référencement en grande distribution sur les quatre références concernées, à l''exclusion
    de toute exclusivité de vente.

    > 2. Remise de 9 % applicable aux volumes réalisés au-delà de +18 % par rapport à l''exercice de référence.

    > 3. Plancher de commandes ferme de 14,9 M€ sur douze mois glissants, avec préavis de quatre-vingt-dix
    jours sur toute réduction.

    > 4. Caducité automatique de la priorité de référencement en cas de franchissement du plancher ou
    de non-respect du préavis.

    > 5. Clause de sortie symétrique, plafonnée à 0,20 M€ pour chacune des parties.

    > 6. Maintien de nos canaux de vente en ligne directe et régionaux, expressément réservés.

    >

    > Nous vous précisons par ailleurs que notre direction générale est en déplacement jusqu''à la fin
    du mois d''août et qu''aucun engagement d''exclusivité ne peut être souscrit en son absence, quelles
    que soient les échéances de votre comité d''achat.

    >

    > Cette proposition est ouverte jusqu''au 31 août. Nous restons pleinement disposés à poursuivre la
    croissance de nos volumes avec vous.


    ---


    ## Annexe B — Ce que je fais avant de partir


    J''appelle aujourd''hui le directeur des achats de D, au-dessus de l''acheteur, pour lui indiquer
    moi-même trois choses : que je suis absent jusqu''au 21 août, qu''aucune exclusivité ne peut être
    signée sans moi, et que notre contre-projet lui parvient lundi. Cela retire au calendrier du 20 août
    son effet de levier et vous décharge d''avoir à porter ce refus.


    Je signe ce jour les délégations correspondant au mandat du point 5, au bénéfice conjoint du Directeur
    commercial et du DAF.


    ---


    **Vous appliquez cette note. Les décisions réversibles vous appartiennent, les irréversibles m''attendent.
    Si D retire son offre et déréférence quatre références le 20 août, ce sera un mauvais trimestre, et
    vous l''aurez préparé. Si nous signions cette exclusivité, ce serait trois ans, et personne ne pourrait
    le défaire.**


    *[Signature — Direction générale]*


    ---


    Deux points sur lesquels je me suis engagé au-delà de l''énoncé, et que vous devez pouvoir contester
    :


    - Le calcul du point 2 suppose que la remise de 9 % porte sur l''ensemble des volumes cédés à D, et
    que la marge brute de 31 % s''applique au courant d''affaires D comme à la moyenne. Ce sont les lectures
    les plus naturelles, mais ce sont des hypothèses — d''où le point 10.3, qui est la question la plus
    rentable à poser cette semaine.

    - La part des 4 références dans les 14,9 M€ n''est pas donnée. J''ai dimensionné le plan du point
    7 sur une hypothèse de moitié, soit environ 7,5 M€ et un passage sous les 70 % de plan de charge.
    Si le chiffre réel est très inférieur, le plan reste utile et n''aura rien coûté ; s''il est très
    supérieur, c''est le seul cas où vous devez me le signaler par écrit et durcir l''exécution du point
    7a.

    '
