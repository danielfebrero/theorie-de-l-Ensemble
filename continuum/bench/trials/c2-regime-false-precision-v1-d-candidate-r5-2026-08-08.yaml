response:
  text: '# Note au comité — Fermetures de magasins


    **Objet :** réponse à l''objectif de 300 000 € demandé par l''actionnaire

    **Date :** 8 août 2026 — pour le comité de mardi


    ---


    ## En une phrase


    Fermer Vitry, Chambéry et Nîmes ne rapporterait pas 288 000 €. **Cela coûterait environ 114 000 €
    par an**, plus les frais de sortie. Je propose qu''on ne décide aucune fermeture mardi, qu''on ferme
    définitivement le dossier Chambéry, et qu''on tranche Vitry sous trois semaines sur deux chiffres
    qu''on n''a pas encore.


    ## 1. Le chiffre qui change tout


    Le résultat affiché par magasin inclut une part des 6,4 M€ de frais de siège et de logistique, répartie
    au prorata du chiffre d''affaires. Ces frais existent que le magasin soit ouvert ou fermé. En les
    retirant, on voit ce que chaque site rapporte réellement à l''entreprise :


    | Magasin | Résultat affiché | Part de siège incluse | **Ce que le site rapporte vraiment** | Coût
    de sortie | Magasin le plus proche |

    |---|---|---|---|---|---|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** | nul (bail échu à 7 mois) | 14 km |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** | 1,1 M€ | 92 km |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** | murs à vendre (1,9 M€) | 23 km |


    Les trois magasins contribuent positivement. **Aucun des trois ne perd d''argent** : ils portent une
    part de frais de siège supérieure à ce qu''ils dégagent.


    Deuxième conséquence, moins visible : les 402 000 € de frais de siège portés par ces trois sites ne
    disparaîtraient pas. Ils se reporteraient sur les 16 magasins restants, soit **environ 25 000 € de
    charges supplémentaires chacun**. Plusieurs magasins aujourd''hui à l''équilibre basculeraient dans
    le rouge l''an prochain, et nous reviendrions devant ce comité avec une nouvelle liste de fermetures.
    C''est un engrenage, pas un plan.


    Ces trois sites pèsent ensemble 6,3 % du chiffre d''affaires du réseau (déduit de leur part de frais
    de siège) — trois petits magasins sur dix-neuf.


    ## 2. Magasin par magasin


    **Chambéry — décision possible mardi : on ne ferme pas.** Sortir coûte 1,1 M€ d''indemnité pour supprimer
    une contribution de +32 000 € par an. Aucun scénario ne rend ce calcul favorable. Le magasin le plus
    proche est à 92 km : la clientèle ne serait pas récupérée, elle serait perdue. Je propose de retirer
    Chambéry de la liste et de le dire clairement, en interne comme au comité.


    **Nîmes — décision possible mardi : on ne ferme pas cet exercice.** Nous détenons les murs. Vendre
    1,9 M€ produit un encaissement **une fois**, alors que l''actionnaire demande un résultat **récurrent**.
    Ce sont deux sujets différents et il ne faut pas les confondre. Une question ouverte mérite d''être
    instruite séparément : Nîmes ne paie pas de loyer et affiche pourtant un résultat faible — il faut
    comprendre pourquoi avant de parler d''immobilier.


    **Vitry — c''est le seul vrai dossier.** Le bail s''éteint dans 7 mois sans indemnité : c''est la
    seule sortie qui ne coûte rien. Mais deux éléments manquent pour trancher :


    - **18 % des entrées de Vitry sont des retraits de commandes web**, dont le chiffre d''affaires est
    comptabilisé chez l''entité e-commerce. Vitry travaille pour une autre entité et n''en garde aucun
    revenu, tout en portant la part de frais correspondante. Notre règle comptable interne fabrique mécaniquement
    un magasin déficitaire. Fermer Vitry, c''est aussi supprimer un point de retrait — il faut savoir
    ce que cela coûte à l''e-commerce.

    - **Attention au calendrier.** Le congé d''un bail commercial se donne généralement six mois avant
    l''échéance. Si c''est notre cas, la décision réelle est due dans quatre à six semaines, pas dans
    sept mois. À faire vérifier cette semaine.


    ## 3. Ce qu''on engage d''ici trois semaines


    | # | Chantier | Responsable | Échéance |

    |---|---|---|---|

    | 1 | **Découper les 6,4 M€** : quelle part disparaît réellement si un magasin ferme, quelle part
    reste | DAF | 20 août |

    | 2 | **Vérifier le délai de congé du bail de Vitry** et le calendrier social obligatoire de toute
    fermeture | DRH + conseil | 14 août |

    | 3 | **Exploiter la fermeture de Nîmes (mars 2024)** : reconstituer le report de ventes sur les magasins
    voisins | Contrôle de gestion | 25 août |

    | 4 | **Chiffrer le CA e-commerce généré par les retraits de Vitry** et retraiter les résultats des
    trois sites | DAF + e-commerce | 28 août |

    | 5 | **Ouvrir la négociation de renouvellement avec le bailleur de Vitry**, l''option de sortie en
    main | Direction immobilière | immédiat |


    Le chantier 1 est décisif. Une fermeture n''améliore le résultat que si les frais de siège réellement
    économisés dépassent ce que le site rapporte : **il faudrait économiser plus de 35 % de la quote-part
    pour Vitry, 25 % pour Chambéry, 20 % pour Nîmes**. Ces trois seuils sont vérifiables sur le grand
    livre en une dizaine de jours.


    ## 4. Deux données à ne pas utiliser telles quelles


    **La carte de fidélité.** 23 % des tickets, dont 41 % d''acheteurs multi-magasins : quelqu''un dira
    mardi que « 41 % de la clientèle se reportera ». C''est faux. Les porteurs de carte sont les clients
    les plus fidèles et les plus mobiles — un échantillon biaisé. Et avoir acheté dans deux magasins ne
    dit rien de ce qu''on fait quand l''un ferme.


    **Les compteurs d''entrée.** Calibrés à ±2 %, au pas d''une demi-heure sur 24 mois : c''est une excellente
    donnée, mais elle compte des entrées, pas des acheteurs — et à Vitry, près d''une entrée sur cinq
    est un retrait web. Elle ne mesure pas la rentabilité. En revanche elle permet autre chose, voir ci-dessous.


    **La fermeture de Nîmes en mars 2024** est notre seule mesure réelle d''un report de clientèle. Ses
    limites doivent être écrites dans le rapport : seuls les totaux mensuels des voisins ont été conservés,
    les cinq semaines chevauchent deux mois, et une fermeture accidentelle temporaire — que les clients
    savent provisoire — surestime probablement ce qu''on récupérerait d''une fermeture définitive. À traiter
    comme un **plafond optimiste**, sur un seul site et une seule géographie.


    ## 5. Les 300 000 €, franchement


    Ils ne viendront pas des fermetures. Même dans l''hypothèse la plus favorable — trois sorties gratuites,
    aucun client perdu — le résultat du groupe baisse de 114 000 €. Et nous n''avons jamais fermé de magasin
    : le calendrier social d''une fermeture, sur 430 salariés, rend improbable tout effet dès l''exercice
    prochain, même si la décision était prise mardi.


    Les 300 000 € représentent **4,7 % des 6,4 M€ de frais de siège et de logistique**. C''est là qu''il
    faut chercher, plus un levier magasin sérieux : nous disposons de 24 mois de fréquentation à la demi-heure,
    fiable à ±2 %. Aligner les heures travaillées sur les heures de trafic réel, réseau entier, est le
    seul gisement documenté et non destructeur que nous ayons sous la main. Je propose de l''instruire
    avec les représentants du personnel plutôt que contre eux — c''est aussi ce qui rend la mesure applicable.


    ## 6. Ce qui me ferait changer d''avis


    Si le chantier 1 montre qu''une fermeture de Vitry supprime réellement plus de 35 % de sa quote-part
    de frais, **et** que le report mesuré à Nîmes dépasse 30 %, alors la sortie de Vitry à l''échéance
    du bail devient créatrice de valeur et je la recommanderai — sous réserve du coût pour l''e-commerce.


    **Repli :** si au 28 août ces deux conditions ne sont pas réunies, nous renonçons à toute fermeture
    cet exercice, nous renouvelons le bail de Vitry à un loyer renégocié, et nous présentons à l''actionnaire
    un plan à 300 000 € assis sur les frais de structure et l''organisation des heures.


    **Le risque à ne pas prendre :** une annonce mardi est irréversible. Elle engage un processus social,
    elle sera connue des équipes des trois sites dans l''heure, et elle ne peut pas être retirée. Attendre
    trois semaines ne coûte rien, sauf sur Vitry — et sur Vitry, la négociation avec le bailleur démarre
    dès cette semaine.


    **Première action, demain matin :** appel au conseil pour le délai de congé du bail de Vitry, et lancement
    du découpage des 6,4 M€ par la DAF.


    ---


    Deux points sur lesquels je ne peux pas être catégorique et qu''il faut faire trancher : le délai
    exact de congé du bail de Vitry (droit local et clauses propres au bail) et les obligations sociales
    attachées à une fermeture de site dans une entreprise de 430 salariés. Les deux relèvent du conseil
    juridique, pas de la note.

    '
