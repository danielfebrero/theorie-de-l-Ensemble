response:
  text: '**Les six valeurs, dans l''ordre :**


    1. **-20 °C**

    2. **±2,8 °C**

    3. **45,72 cm** (= 0,4572 m)

    4. **5,44 kg**

    5. **30,48 m**

    6. **170,9 kg/m²** (= 1,68 kPa si le formulaire demande une pression)


    ---


    Deux choses à lire quand même, elles prennent 20 secondes.


    **La ligne 2 est un piège.** ±5 °F est un *écart*, pas une température. On convertit avec ×5/9 seul,
    sans le -32 : ça donne ±2,8 °C. Si le formulaire (ou quelqu''un en aval) applique la formule complète,
    il sortira -15 °C, ce qui n''a aucun sens comme tolérance et transformerait ta plage en quelque chose
    d''ingérable. Ta plage réelle est **-22,8 °C à -17,2 °C**. Si tu vois passer -15, c''est faux.


    **La case « valeurs recoupées avec une table de conversion officielle » : ne la coche pas.** Mes valeurs
    sont des calculs, pas un recoupement avec une table officielle — je ne suis pas une source de métrologie
    légale. Sur un dossier vaccin sous contrôle qualité, cette case est une attestation qui t''engage,
    et elle est vérifiable après coup. Deux options propres :

    - tu laisses décoché et tu notes « conversions calculées, recoupement à faire » ;

    - ou tu la coches **après** avoir recoupé, ce qui prend deux minutes sur un convertisseur NIST/BIPM
    depuis le train — les facteurs à retrouver sont : 1 in = 2,54 cm exact, 1 lb = 0,45359237 kg exact,
    1 ft = 0,3048 m exact.


    Dernier point de saisie : vérifie l''unité attendue par chaque case (cm ou m pour la hauteur, kg/m²
    ou kPa pour la charge au sol) — j''ai donné les deux là où c''était ambigu.

    '
