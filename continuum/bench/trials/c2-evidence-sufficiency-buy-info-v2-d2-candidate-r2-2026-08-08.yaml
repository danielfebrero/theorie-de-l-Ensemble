  text: 'Je vous livre la note. En amont, le calcul qui la commande.


    **Le seuil.** Les 230 400 € d''économie achat valent exactement 1,56 point de taux de retour (chaque
    dixième de point = 14 760 € : 72 000 × 0,001 × 205 €). L''avantage Sinolux s''annule donc à **2,86
    %** de retours. La seule mesure indépendante disponible dit 3,1 %.


    **La date.** Le résultat Vertex tombe à J+63. La porte Kelmar se ferme à J+18. L''information arrive
    45 jours après la seule décision irréversible du dossier.


    ---


    # NOTE AU COMITÉ DE DIRECTION

    **Objet : contrat cellules 2027 — 72 000 unités**

    **De : Direction des opérations — pour décision avant J+18**


    ## Décision proposée


    **Réserver à J+18 la totalité de la capacité Kelmar pour 2027.** Ne pas basculer sur Sinolux cette
    année. Ouvrir en parallèle une qualification Sinolux mesurée, pour 2028.


    ## Pourquoi les 230 400 € ne sont pas une économie


    Le prix d''achat n''est qu''une moitié du coût. L''autre est le taux de retour, à 205 € par chargeur
    repris.


    | Taux de retour Sinolux | Retours | Coût retours | **Résultat net vs Kelmar** |

    |---|---|---|---|

    | 1,1 % *(essais Sinolux)* | 792 | 162 360 € | **+ 259 920 €** |

    | **2,86 % — seuil d''équilibre** | 2 060 | 422 300 € | **0 €** |

    | 3,0 % *(cabinet Ferro)* | 2 160 | 442 800 € | **− 20 520 €** |

    | 3,1 % *(audit sectoriel mars)* | 2 232 | 457 560 € | **− 35 280 €** |


    *Référence Kelmar : 1,3 % soit 936 retours, 191 880 €. Écart achat : 230 400 €.*


    La clause de remplacement gratuit des cellules défectueuses ne change pas ce tableau. Elle couvre
    la cellule (22,80 €), pas l''événement de retour (205 € : échange, transport aller-retour, geste commercial,
    atelier) — soit **11 % du risque transféré, 89 % conservé**. Valorisée au maximum, elle déplace le
    seuil d''équilibre de 2,86 % à 3,22 % : le meilleur cas Sinolux sous le chiffre de l''audit devient
    + 15 600 €, contre 230 400 € inscrits au budget.


    **Les 230 400 € doivent être sortis du budget 2027.** Ils décrivent une des issues possibles, pas
    l''issue attendue.


    ## L''état réel des preuves


    Nous n''avons pas trois sources, nous en avons deux. La note méthodologique du cabinet Ferro indique
    qu''il travaille sur l''échantillon de l''audit de mars : son « environ 3 % » est une relecture de
    cette mesure, pas une confirmation. Restent une mesure indépendante à 3,1 % et une déclaration du
    vendeur à 1,1 %.


    L''élément le plus informatif du dossier n''est pas un chiffre, c''est un refus. **Sinolux refuse
    toute clause indexée sur le taux de retour.** Si 1,1 % était sa véritable estimation, cette clause
    ne lui coûterait rien — elle ne se déclenche qu''au-delà de 1,3 %. La partie la mieux informée décline
    de garantir son propre chiffre.


    ## Ce qui rend la décision irréversible


    Le risque n''est pas les 35 280 €. Une perte de cet ordre est de la variance, absorbable.


    Le risque est la ligne Kelmar 2027, **vendue à J+18, sans report possible**, sans autre source ni
    autre mesure disponible avant la fin de l''année. Si nous laissons passer cette date et que Sinolux
    se révèle à 3,1 %, nous ne perdons pas une marge : nous n''avons pas de cellules, et le lancement
    — que la direction commerciale refuse de décaler — n''a pas de plan B. Réserver Kelmar est la seule
    branche où l''année reste rattrapable quel que soit le résultat.


    ## Le contre-argument, et pourquoi il ne renverse pas la décision


    Il est sérieux : l''audit de mars porte sur *une ligne comparable*, pas sur notre cellule, notre assemblage,
    notre parc client. Notre 1,3 % avec Kelmar est autant notre produit que leur cellule. Transposer 3,1
    % chez nous est une extrapolation, et les essais Sinolux portent, eux, sur la bonne référence.


    Il est juste — et c''est exactement pourquoi l''état honnête du dossier est **inconnu**, non 1,1 %.
    Face à un inconnu dont le seuil de bascule est à 2,86 %, devant une porte qui ne se rouvre pas, on
    ne joue pas la production de l''année.


    ## Actions


    1. **J+18 — Réserver 72 000 unités chez Kelmar.** Ferme. Ne dépend d''aucune des actions suivantes.

    2. **Avant J+18 — Demander à Kelmar une concession de prix** contre engagement volume immédiat, quote
    concurrente à l''appui. 1 € par cellule = 72 000 € acquis, sans risque de retour ajouté. C''est le
    seul gain que je peux garantir au comité cette semaine.

    3. **Avant J+18 — Demander à Kelmar une bande de flexibilité à la baisse** (ordre de 10 %, exerçable
    vers J+60) permettant une série pilote Sinolux. Disponibilité non vérifiée à ce jour ; à obtenir,
    pas à présumer. Sans elle, pas de pilote 2027.

    4. **Avant J+21 — Remettre l''indexation sur la table** : 205 € par retour au-delà de 1,3 %. C''est
    le seul point qui inverse cette note (voir ci-dessous).

    5. **Cette semaine — Commander l''essai Vertex, 34 000 €.** Il ne décide pas 2027 : son résultat arrive
    à J+63, 45 jours après la fermeture Kelmar. Il décide 2028. Sa précision de ±0,3 point sépare sans
    ambiguïté 1,1 % de 3,1 %, sur une économie qui se représente chaque année. 34 000 € pour arrêter de
    renégocier ce dossier à l''aveugle.


    ## Ce qui renverserait cette décision


    **Sinolux acceptant l''indexation à 205 €/retour au-delà de 1,3 %, par écrit avant J+21.** La clause
    transforme un inconnu en risque borné et facturé au vendeur ; je signe alors le volume complet. Un
    second relevé indépendant, sur la ligne concernée, inférieur à 2,0 %, produirait le même effet. En
    l''absence de l''un ou de l''autre, non.


    ## Repli


    Si Kelmar refuse à la fois la concession et la bande de flexibilité d''ici J+15 : **la réservation
    à J+18 a lieu quand même**, à prix catalogue. La négociation est un gain possible, jamais une condition
    de la couverture.


    ---


    Deux points à trancher par le comité et que je n''ai pas les éléments pour arbitrer seul : la disponibilité
    effective d''une bande de flexibilité chez Kelmar (point 3), et le sort des 230 400 € déjà inscrits
    au budget par la direction financière — c''est la ligne qui rendra cette note impopulaire, et elle
    doit sauter avant lundi soir.

    '
