response:
  text: '# Note au comité — fermetures de magasins


    **Objet :** décision demandée mardi. **Recommandation : ne fermer aucun magasin mardi, et retirer
    définitivement Chambéry et Nîmes de la liste.** Un seul candidat reste ouvert, Vitry, et sa décision
    doit être prise dans les quatre semaines pour une raison de bail, pas de résultat.


    ---


    ## 1. Les trois magasins « en perte » gagnent de l''argent


    Le résultat par magasin inclut une quote-part des frais de siège et de logistique — 6,4 M€ répartis
    entre les 19 magasins au prorata du chiffre d''affaires. Cette quote-part n''est pas une dépense du
    magasin : c''est une part d''une dépense du groupe qu''on lui attribue. **Fermer le magasin ne fait
    pas disparaître la dépense — elle est simplement reportée sur les autres.**


    | | Résultat publié | Quote-part siège | Ce que le magasin rapporte réellement |

    |---|---|---|---|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |

    | **Total** | **−288 000 €** | **402 000 €** | **+114 000 €** |


    Les trois sites couvrent leurs propres loyers, salaires et charges, et dégagent en plus 114 000 €
    qui financent le siège. Fermer les trois ne rapporte pas 288 000 € : cela **coûte 114 000 €** de résultat
    dès la première année, avant tout coût de fermeture.


    Il faut le dire au comité sans détour : l''objectif de 300 000 € et la liste des trois magasins rouges
    se ressemblent (288 000 €) parce qu''ils sont la même erreur de lecture, pas parce que l''un finance
    l''autre.


    **Effet second, à ne pas manquer :** les 402 000 € de frais de siège se reporteraient sur les 16 magasins
    restants. Les sites aujourd''hui légèrement positifs basculeraient en négatif sur le papier. Le comité
    de l''an prochain aurait à nouveau trois ou quatre magasins rouges à fermer, avec 114 000 € de moins
    pour payer le siège. C''est un cycle, pas un redressement.


    ## 2. Les trois situations ne sont pas comparables


    **Chambéry — à écarter définitivement.** Six ans de bail restants, aucune clause de sortie, indemnité
    estimée à 1,1 M€. Le magasin du réseau le plus proche est à 92 km : en cas de fermeture, le chiffre
    d''affaires n''est pas transféré, il est perdu. Payer 1,1 M€ comptant pour supprimer une contribution
    de +32 000 € par an est indéfendable quel que soit le scénario commercial. La question ne doit pas
    revenir.


    **Nîmes — deux questions distinctes.** Nous détenons les murs (1,9 M€). Le magasin ne paie pas de
    loyer : sa structure de coûts est déjà la plus légère des trois, et son résultat négatif provient
    en quasi-totalité de la quote-part de siège. La vraie question n''est pas « faut-il fermer Nîmes »
    mais « 1,9 M€ immobilisés dans ce site sont-ils bien employés ». Une cession avec maintien de l''exploitation
    (vente puis location) libère la trésorerie sans détruire les 19 000 € de contribution ni les emplois
    — à instruire séparément, hors du sujet fermetures. À noter : la vente des murs produit un gain exceptionnel
    une seule fois, elle n''améliore pas le résultat récurrent que demande l''actionnaire.


    **Vitry — le seul dossier ouvert, et pour un motif de calendrier.** Le bail arrive à échéance dans
    7 mois avec sortie sans indemnité. C''est la seule fenêtre de sortie gratuite du réseau, et elle se
    ferme : un bail commercial suppose un congé donné plusieurs mois avant l''échéance. **Si le délai
    est de six mois, il nous reste environ un mois pour agir** — à faire confirmer par le conseil dès
    lundi, car c''est cette date, et non le comité de mardi, qui commande le calendrier. Point d''attention
    : donner congé n''est pas neutre, cela nous prive du droit au renouvellement. Il faut demander au
    conseil si un congé peut être retiré, ou un bail court négocié, avant de le délivrer.


    ## 3. Le résultat de Vitry n''est pas mesuré correctement


    Deux conventions comptables pèsent sur Vitry sans rapport avec sa performance :


    - **181 000 € de quote-part de siège**, on l''a vu ;

    - **18 % de ses entrées sont des retraits de commandes web.** Vitry paie le personnel, le loyer et
    la surface qui servent ces clients ; le chiffre d''affaires correspondant est enregistré sur l''entité
    e-commerce. Le magasin rend un service de logistique gratuit à une autre entité du groupe.


    Additionnées, ces deux conventions sont du même ordre de grandeur que la perte affichée de 118 000
    €. **Tant qu''elles ne sont pas corrigées, nous ne savons pas si Vitry est le plus mauvais magasin
    du réseau ou un magasin correct mal facturé.** Fermer sur cette base serait fermer un magasin dont
    nous n''avons pas lu les comptes.


    Précision utile au comité : les compteurs d''entrée sont fiables (±2 %), mais ils comptent des entrées,
    pas des acheteurs. Leur précision ne corrige aucun des deux biais ci-dessus.


    ## 4. Ce que nous engageons d''ici au comité de décision


    Quatre travaux, tous réalisables en quatre semaines avec des données que nous détenons déjà.


    1. **Délai de congé de Vitry** (juridique, sous 5 jours). Date limite exacte, réversibilité du congé,
    possibilité d''un bail court. C''est la contrainte qui cadre tout le reste.

    2. **Part réellement économisable des 6,4 M€** (contrôle de gestion, sous 3 semaines). Ligne à ligne
    : ce qui disparaît si un magasin disparaît (tournées de livraison, encadrement régional) et ce qui
    reste (direction, informatique, marketing). Sans ce chiffre, aucune économie de fermeture ne peut
    être annoncée. Repère : 300 000 € représentent 4,7 % de cette base — c''est le seul gisement à la
    taille de l''objectif.

    3. **Taux de report réel de la clientèle** (marketing, sous 3 semaines). La carte de fidélité couvre
    23 % des tickets et 41 % des porteurs achètent déjà dans au moins deux magasins : nous pouvons compter
    directement combien de clients de Vitry fréquentent aussi le magasin situé à 14 km. À croiser avec
    les cinq semaines de fermeture de Nîmes en mars 2024 — seuls les totaux mensuels des voisins subsistent,
    c''est grossier, mais c''est la seule fermeture jamais observée dans l''enseigne.

    4. **Coût social complet d''une fermeture** (DRH, sous 3 semaines). Environ 23 salariés par magasin
    : au-delà de 10 suppressions, la procédure collective s''impose. Ce coût ne figure dans aucun des
    chiffres ci-dessus et dépasse couramment l''économie annuelle attendue. À 14 km, des propositions
    de reclassement sont réellement possibles — ce qui réduit à la fois le coût et le risque.


    **Sur ce dernier point, une position de principe.** L''enseigne n''a jamais fermé de magasin : ce
    que nous ferons à Vitry fixera la référence pour les dix ans à venir. Si la fermeture est décidée,
    elle doit s''accompagner d''un engagement de reclassement sur le site à 14 km, chiffré et opposable,
    et d''une information des représentants du personnel avant que la rumeur ne circule — pas d''une consultation
    une fois la décision prise.


    ## 5. Risques, repli, et ce qui nous ferait changer d''avis


    **Le pire cas de cette recommandation :** nous manquons la fenêtre de sortie gratuite de Vitry et
    restons engagés sur un nouveau bail. Il est borné par le point 1, traité sous cinq jours ; si le conseil
    confirme que le congé doit partir avant que les mesures 2 et 3 ne soient disponibles, nous délivrons
    un congé conservatoire et négocions en parallèle un bail court — nous ne fermons toujours pas, nous
    conservons l''option.


    **Ce qui l''encaisse en cas d''erreur :** l''entreprise, pour un montant de l''ordre du loyer annuel
    de Vitry. À comparer aux 1,1 M€ et aux 114 000 € annuels que le plan initial engagerait immédiatement,
    de façon irréversible, et aux 23 emplois par site concerné.


    **L''observation qui renverserait la recommandation :** si le travail n° 2 établit qu''une part importante
    des 6,4 M€ est réellement liée aux magasins et disparaît avec eux, alors la contribution de +114 000
    € se réduit d''autant et Vitry — puis, seulement à ce moment-là, Nîmes — redevient un candidat sérieux.
    C''est le chiffre à produire, et le seul qui puisse justifier une fermeture.


    **Ce qui ne changera pas :** Chambéry reste ouvert. Aucune valeur des travaux en cours ne rend rentable
    le versement de 1,1 M€ pour supprimer un contributeur positif sans report de clientèle possible.


    **Enfin, sur l''objectif de 300 000 €.** Il ne sera pas atteint par des fermetures l''exercice prochain
    : la seule sortie disponible intervient au mieux à mi-exercice, et son effet net est aujourd''hui
    inconnu et possiblement négatif. Il est atteignable sur la base de 6,4 M€ de frais de siège et de
    logistique, et par la facturation à l''e-commerce du service de retrait rendu par les magasins. Nous
    proposons de présenter ce chemin à l''actionnaire, plutôt qu''un plan de fermetures qui dégraderait
    le résultat qu''il demande.


    **Décision demandée mardi :** retirer Chambéry et Nîmes de la liste ; lancer les quatre travaux ;
    fixer la date du comité de décision sur Vitry en fonction du délai de congé.

    '
