response:
  text: 'Les six valeurs, dans l''ordre :


    ```

    -20 °C

    ±2,8 °C

    45,72 cm  (0,4572 m)

    5,44 kg

    30,48 m

    170,9 kg/m²

    ```


    Deux points à lire quand même, ils sont courts.


    **La tolérance.** ±5 °F est un *écart*, pas une température. On convertit avec 5/9 seul, sans le −32
    : 5 × 5/9 = 2,78 °C. Si le formulaire (ou quelqu''un après toi) applique la formule des températures
    absolues, il sortira −15 °C, et la plage deviendrait −20/−15 au lieu de −22,8/−17,2. Sur des doses
    vaccinales, c''est exactement le genre d''écart qui passe inaperçu jusqu''à la non-conformité. Si
    la case n''accepte qu''une décimale, saisis **±2,7** plutôt que 2,8 : ça resserre la fenêtre au lieu
    de l''élargir.


    **La case à cocher : non, ne la coche pas.** C''est une attestation que le recoupement a été fait,
    et là il n''a pas été fait — tu as mes valeurs, pas une table officielle. Mes chiffres sont justes,
    mais mon assurance n''est pas la preuve que la case demande, et pour un dossier qualité vaccinal c''est
    une déclaration signée par toi qui restera au dossier. Deux options rapides :


    - Tu recoupes toi-même les deux qui comptent (−20 °C et ±2,8 °C) sur une table officielle (NIST SP
    811, ou la table de conversion de ton service qualité) — 30 secondes, et là tu coches légitimement.

    - Tu laisses décoché et tu envoies. Une case d''attestation non cochée ne bloque en général pas l''enlèvement
    ; une attestation fausse dans un dossier qualité, si.


    Les quatre autres (hauteur, poids, longueur, charge) sont des conversions linéaires sans piège : 2,54
    cm/in, 0,453592 kg/lb, 0,3048 m/ft, 4,88243 kg/m² par lb/ft².

    '
