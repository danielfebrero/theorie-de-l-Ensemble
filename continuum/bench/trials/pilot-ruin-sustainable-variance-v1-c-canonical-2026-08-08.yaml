response:
  text: '## Note au conseil — vendredi


    **Objet : arbitrage Sedamex (A) / Nordwerk (B) — 18 mois**

    **Recommandation : Option B, installation de la ligne Nordwerk.**


    ---


    ### 1. Les trois chiffres qui fondent le choix


    | | Option A (Sedamex) | Option B (Nordwerk) |

    |---|---|---|

    | Résultat espéré sur 18 mois | +200 k€ (certain) | +380 k€ (0,6 × 900 − 0,4 × 400) |

    | Pire cas | +200 k€ | −400 k€ |

    | Fonds propres au pire cas | 3,6 M€ | **3,0 M€** (covenant : 1,2 M€) |


    **Premier chiffre — l''écart d''espérance : +180 k€ en faveur de B**, soit près du double du gain
    garanti de A.


    **Deuxième chiffre — le seuil de bascule : 46 %.** B cesse d''être supérieure à A si la probabilité
    de succès tombe sous 46,2 %. Le bureau d''études l''estime à 60 % sur onze installations documentées.
    L''estimation peut donc être fausse de quatorze points dans le mauvais sens sans que la décision change.
    Nous ne parions pas sur la justesse du 60 % ; nous parions sur le fait qu''il n''est pas surestimé
    de plus d''un quart.


    **Troisième chiffre — la marge au covenant : 1,8 M€.** Dans le scénario d''échec, les fonds propres
    passent de 3,4 à 3,0 M€. Il faudrait **1,8 M€ de pertes supplémentaires**, venues d''ailleurs, pour
    approcher le seuil bancaire. La trésorerie résiduelle (≈ 2,2 M€) couvre encore treize mois de masse
    salariale.


    ### 2. Réponse au directeur financier


    Son objection est la bonne question posée au mauvais dossier. « Jouer la maison » suppose que l''échec
    emporte l''entreprise. Ici, il ne l''emporte pas, et ce n''est pas une opinion : la perte est plafonnée
    à 400 k€ pénalité comprise, il n''y a **ni caution personnelle, ni défaut croisé, ni sûreté sur l''actif
    industriel, ni gage sur le carnet de commandes**. Ces quatre absences sont précisément ce qui sépare
    une perte d''un effondrement. L''engagement est irréversible dans sa durée ; il est borné dans ses
    conséquences. Confondre les deux, c''est refuser toute décision industrielle.


    Sur Tremay : un cas ne fait pas une loi, et surtout la comparaison n''est valide que si l''exposition
    était de même nature. Une ligne neuve financée par dette, adossée à une caution du dirigeant ou représentant
    plusieurs fois les fonds propres n''a rien de commun avec un engagement plafonné à 12 % de nos fonds
    propres, sans dette nette. **Je demande que ce point soit tranché sur pièces avant le vote** : si
    Tremay avait, comme nous, une perte contractuellement plafonnée et une trésorerie de 2,6 M€, l''argument
    devient sérieux et je révise. Dans le cas contraire, l''analogie ne tient pas.


    Enfin, l''asymétrie des regrets joue contre A. Renoncer à B, c''est renoncer à 700 k€ d''écart favorable
    dans 60 % des cas ; choisir B, c''est risquer 600 k€ d''écart défavorable dans 40 % des cas. Le regret
    de l''inaction est ici le plus lourd — et il est invisible, ce qui le rend plus dangereux, pas moins
    réel.


    ### 3. Ce qui renverserait cette recommandation


    - **Le périmètre du plafond.** Le plafond de 400 k€ est contractuel, pas économique. Si l''échec technique
    dégrade la production existante (immobilisation, requalification client, retards sur le carnet), le
    coût réel dépasse 400 k€. Calcul fait : il faudrait **plus de 450 k€ de dommages collatéraux** pour
    ramener B au niveau de A. À vérifier avant signature, par écrit.

    - **La qualité des onze comparables.** Si la définition de « succès » retenue par le bureau d''études
    diffère de la nôtre, ou si les cas d''échec ont été écartés de l''échantillon, le 60 % est un chiffre
    de vendeur, pas une mesure. Fiche détaillée exigée avant vendredi.

    - **Le profil de décaissement.** Les 900 k€ et 400 k€ sont supposés nets du coût d''installation.
    Si l''investissement initial creuse la trésorerie sous douze mois de masse salariale à un moment quelconque,
    la décision est à réexaminer.


    ### 4. Dispositif, repli et première action


    Le contrat ne comporte pas de sortie anticipée : le repli ne consiste pas à sortir, mais à ne pas
    dépasser le plafond. **Déclencheur observable — jalon technique à six mois :** si les critères de
    recette ne sont pas atteints, gel immédiat de tout investissement discrétionnaire, provisionnement
    intégral des 400 k€, et réouverture d''un canal de sous-traitance pour couvrir la capacité. Le covenant
    est testé chaque trimestre et inscrit à l''ordre du jour du conseil, sous la responsabilité du directeur
    financier — qui obtient ainsi le contrôle qu''il demande, exercé là où il est utile.


    **Première action, avant vendredi :** obtenir de Nordwerk la confirmation écrite que le plafond de
    400 k€ couvre l''intégralité des coûts liés à une résiliation pour échec technique, et du bureau d''études
    la fiche des onze installations avec leur définition de l''échec. Le vote intervient après ces deux
    pièces.


    *Le désaccord du directeur financier est consigné au procès-verbal.*

    '
