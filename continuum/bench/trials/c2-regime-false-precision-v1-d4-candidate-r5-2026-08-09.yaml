  text: 'La note, prête à être remise :


    ---


    # Note au comité — Vitry, Chambéry, Nîmes


    **Objet :** fermetures envisagées et objectif de +300 000 € de résultat dès l''exercice prochain

    **Pour décision :** comité de mardi


    ## En une phrase


    Les trois magasins « déficitaires » rapportent en réalité **114 000 € par an** à l''enseigne. Les
    fermer dégraderait le résultat au lieu de l''améliorer. Les 300 000 € existent, mais ils sont dans
    les 6,4 M€ de frais de siège et de logistique, pas dans les magasins.


    ## 1. Ce que dit vraiment la comptabilité analytique


    Le résultat par magasin est juste à l''euro près. Il inclut une quote-part de siège et de logistique,
    découpée entre les 19 magasins au prorata du chiffre d''affaires. Cette quote-part n''est pas une
    dépense du magasin : c''est une dépense de l''enseigne, présentée en dix-neuf morceaux. **Fermer un
    magasin ne la supprime pas — elle se reporte sur les dix-huit autres.**


    Ce que chaque site rapporte réellement, une fois payés son loyer, ses salaires et toutes ses charges
    propres :


    | | Résultat affiché | Quote-part siège | **Apport réel** |

    |---|---|---|---|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |


    Les trois sont positifs. Fermer les trois retirerait **114 000 €** au résultat, avant tout coût de
    fermeture. Au lieu des +300 000 € demandés, l''écart serait de 414 000 € — dans le mauvais sens.


    Il n''y a pas d''erreur comptable. Il y a une clé de répartition lue comme un verdict.


    ## 2. Trois situations que le classement « les trois plus négatifs » confond


    **Chambéry — la fermeture est arithmétiquement exclue.** Six ans de bail restants, aucune clause de
    sortie, indemnité estimée 1,1 M€. Le site rapporte 32 000 € par an, soit 192 000 € sur la durée restante
    du bail. Payer 1,1 M€ pour arrêter d''encaisser 192 000 € n''est pas un arbitrage, c''est une perte
    sèche de l''ordre de 900 000 €. Le sujet de Chambéry est son compte d''exploitation, pas sa fermeture.


    **Nîmes — le vrai sujet est l''immeuble, pas le magasin.** Nous détenons les murs (1,9 M€) et ne payons
    donc aucun loyer : les 19 000 € d''apport sont flattés par cette absence. Un local de cette valeur
    se loue autour de 130 à 150 000 € par an aux rendements courants — chiffre à confirmer par expertise,
    mais l''ordre de grandeur suffit. **Autrement dit, 1,9 M€ d''actif produisent 19 000 €, soit 1 % de
    rendement.** C''est la seule anomalie économique réelle du dossier. Elle se traite en monétisant l''actif,
    pas en fermant un magasin qui couvre ses charges.


    **Vitry — la seule porte ouverte, et un chiffre faux.** Bail échu dans 7 mois, sortie sans indemnité
    : c''est la seule option gratuite du dossier, et elle a une date limite (préavis à confirmer sous
    quinzaine). Mais 18 % des entrées de Vitry sont des retraits de commandes web : le magasin supporte
    le personnel et la surface de ce service, dont le chiffre d''affaires est enregistré sur l''entité
    e-commerce. Son apport réel est donc **supérieur à 63 000 €**, et sa fermeture ne ferait que déplacer
    ce coût logistique. L''échéance du bail doit servir à **renégocier le loyer**, pas à partir.


    ## 3. Ce que nous ne savons pas faire


    L''enseigne n''a jamais fermé de magasin. Un site représente en moyenne 22 salariés : au-delà de 10
    licenciements, un plan de sauvegarde de l''emploi est obligatoire, avec consultation préalable du
    CSE — plusieurs mois de procédure, et un coût que personne n''a chiffré (ordre de grandeur : 400 à
    600 000 € pour un site). **Aucune fermeture décidée mardi ne produirait d''économie sur l''exercice
    prochain.** Elle produirait une charge.


    Point de droit : annoncer une décision de fermeture avant consultation du CSE nous exposerait à un
    délit d''entrave. Le comité peut arrêter une orientation, pas une fermeture.


    ## 4. Ce que nous proposons de décider mardi


    **Aucune fermeture.** Ce n''est pas un report : c''est une décision fondée sur le fait que les trois
    sites contribuent positivement.


    **Les 300 000 € viennent des frais de structure.** L''objectif représente **4,7 % des 6,4 M€** de
    siège et de logistique. Une réduction de 5 % de ce poste délivre la totalité de la cible, sans fermeture,
    sans indemnité, sans PSE. C''est l''engagement à porter devant l''actionnaire.


    Quatre chantiers, un responsable nommé chacun :


    1. **Plan structure −5 %** (DAF) — cible 300 000 €, plan détaillé sous 6 semaines.

    2. **Renégociation du bail de Vitry** (immobilier) — décision de préavis sous 15 jours ; objectif
    : loyer révisé, et refacturation à l''e-commerce du coût des retraits.

    3. **Expertise et arbitrage des murs de Nîmes** (DG) — valeur, plus-value latente, option de cession
    avec bail arrière. Une plus-value est un gain non récurrent : à présenter comme tel à l''actionnaire.

    4. **Protocole de redressement des trois sites sur deux trimestres** (direction réseau) — les compteurs
    d''entrée (±2 %, pas de la demi-heure, 24 mois) ne mesurent pas la rentabilité, mais permettent d''ajuster
    les plannings sur les courbes de fréquentation réelles. Les trois directeurs de magasin construisent
    le plan et disposent de moyens identifiés — pas d''une simple information.


    ## 5. Ce qui renverserait cette recommandation


    Une donnée manque, et elle est déterminante : **quelle part des 6,4 M€ disparaîtrait réellement si
    un magasin fermait** (livraisons, encadrement régional, systèmes). Personne n''a séparé le siège fixe
    de la logistique liée au nombre de sites.


    Les seuils sont calculables dès aujourd''hui. Une fermeture cesse d''être perdante si la part réellement
    évitable dépasse **35 %** de la quote-part pour Vitry, **25 %** pour Chambéry, **20 %** pour Nîmes.
    Si le contrôle de gestion établit un dépassement, le dossier **Vitry** se rouvre — et lui seul, l''indemnité
    de Chambéry et la valeur des murs de Nîmes restant décisives. Délai demandé : 3 semaines.


    Si la fermeture revient à l''ordre du jour, les cinq semaines d''arrêt de Nîmes en mars 2024 sont
    la seule observation disponible sur le report de clientèle ; seuls les totaux mensuels des voisins
    ayant été conservés, elle donne un ordre de grandeur, pas une mesure. À l''inverse, les 41 % de porteurs
    multi-magasins ne peuvent pas servir : ils portent sur les 23 % de clients encartés, c''est-à-dire
    les plus fidèles, et surestiment mécaniquement le report.


    ## 6. Risques de la recommandation


    **Pire cas :** le plan structure n''atteint que la moitié de la cible et l''actionnaire constate un
    manque de 150 000 € en fin d''exercice. La direction générale et la DAF en répondent — pas les magasins,
    qui n''en sont pas la cause.


    **Repli et déclencheur :** si à la fin du deuxième trimestre le plan structure a produit moins de
    120 000 € d''économies engagées, nous activons la cession des murs de Nîmes, dont le produit sécurise
    l''exercice.


    **Première action, dès mercredi :** demande écrite au contrôle de gestion de la ventilation évitable
    / non évitable des 6,4 M€, et vérification de la date de préavis du bail de Vitry.


    ---


    Deux remarques hors note :


    - Je n''ai pas pu écrire le fichier — la permission d''écriture dans le répertoire de travail m''a
    été refusée. Dites-moi si vous voulez que je réessaie ailleurs, ou une version Word/PDF.

    - Le seul chiffre que j''ai introduit sans source dans votre dossier est le loyer de marché théorique
    de Nîmes (130–150 k€) et le coût d''un PSE (400–600 k€). Les deux sont signalés comme ordres de grandeur
    dans la note ; ils ne changent pas les conclusions, mais l''expertise de Nîmes doit trancher le premier
    avant tout arbitrage sur les murs.

    '
