    # NOTE DE DIRECTION GÉNÉRALE — INSTRUCTION EXÉCUTOIRE


    **De :** Direction générale · **À :** Comité de direction (DAF, Directeur commercial, DRH, Directeur
    industriel, Directeur de site Redon) · **Copie :** Président du conseil

    **Date :** 8 août 2026 · **Objet :** Offre d''exclusivité du distributeur D — décision, mandat, plan
    de repli

    **Portée :** Cette note vaut instruction. Elle couvre la période du 9 au 30 août. Je serai injoignable.
    **Mon silence ne vaut pas accord.**


    ## 1. La décision


    **Nous ne signons pas le contrat d''exclusivité. Ni maintenant, ni sous une forme adoucie, ni après
    la visite de l''acheteur.**


    Je transmets aujourd''hui même, sous ma signature, une **contre-proposition écrite** à la direction
    commerciale de D (copie à l''acheteur), dont le texte est au chapitre 4. Elle est sur leur table avant
    le 16 août.


    En parallèle, et sans attendre leur réponse, nous armons dès cette semaine les canaux que l''exclusivité
    nous interdirait.


    ## 2. Pourquoi — le calcul


    Marge brute actuelle sur D : 14,9 M€ × 31 % = **4,62 M€**.


    | Scénario | CA sur D | Marge brute | Écart |

    |---|---|---|---|

    | Aujourd''hui | 14,9 M€ | 4,62 M€ | — |

    | Remise 9 %, volume inchangé | 13,56 M€ | 3,28 M€ | **−1,34 M€** |

    | Remise 9 % **+ les 18 % promis** | 16,00 M€ | 3,87 M€ | **−0,75 M€** |

    | Année 2, remise acquise, volume revenu à −11 % (précédent du T2) | 12,07 M€ | 2,92 M€ | **−1,70
    M€** |


    Trois conclusions, non négociables parce qu''arithmétiques :


    1. **Même en supposant que D tienne ses +18 %, nous perdons 0,75 M€ de marge la première année.**
    L''offre n''est pas favorable dans son meilleur cas.

    2. **Pour que la remise de 9 % soit neutre, il faudrait +41 % de volume, de façon permanente.** On
    nous en propose 18 %, pendant un an.

    3. **Le prix baisse pour trois ans ; le volume n''est engagé que pour un.** Les années 2 et 3 sont
    « indicatives ». Nous savons ce que vaut un volume indicatif chez D : au T2, ils ont retiré 11 % sans
    préavis.


    Ce qui doit décider n''est pas la perte de marge, c''est ceci : **en année 2, prix amputé de 9 %,
    volume non engagé, tous les autres canaux contractuellement fermés, et un billet de sortie à 1,2 M€
    — 57 % de notre trésorerie.** Sur deux ans, cette configuration coûte environ 3,4 M€ de marge contre
    2,1 M€ de trésorerie, et nous n''avons plus le droit d''aller chercher un euro ailleurs. Ce n''est
    pas un mauvais résultat, c''est une perte dont on ne revient pas, et ceux qui l''encaissent sont les
    180 salariés, dont les 52 postes de Redon.


    Le refus est douloureux mais réversible : nous perdons du volume, nous avons trois mois de trésorerie,
    et nous gardons le droit de vendre à qui nous voulons.


    **À garder en tête pendant toute la négociation :** D nous offre 9 % pour obtenir **plus** de nos
    produits, et menace de déréférencer quatre références la même semaine. Les deux affirmations ne peuvent
    pas être vraies ensemble. Cela ne veut pas dire que le déréférencement est un bluff — nous le traitons
    comme réel, chapitre 7 — mais que les huit jours et le comité avancé au 20 août sont un instrument
    de négociation, pas un fait de nature.


    ## 3. Ce que personne n''est autorisé à faire en mon absence


    1. **Personne ne signe d''exclusivité de canal**, quelle qu''en soit la durée, la remise ou le périmètre.

    2. **Personne ne signe de clause de pénalité de sortie**, quel qu''en soit le montant.

    3. **Aucun engagement verbal.** Tout ce qui est dit à D et tout ce que D nous dit est confirmé par
    écrit sous 24 h, versé au dossier partagé « Dossier D — août 2026 ».

    4. **Un seul porte-parole vers D : le directeur commercial.** Tout courrier sortant est **co-signé
    par le DAF**. Aucun des deux n''écrit seul à D.

    5. **Aucun engagement de volume, de prix ou de capacité** au-delà du chapitre 4.


    **La seule signature autorisée :** si D nous retourne le texte du chapitre 4 **mot pour mot, sans
    aucune modification**, le DAF et le directeur commercial le signent conjointement. Un chiffre changé,
    une date déplacée, une phrase ajoutée : **on ne signe pas**, on accuse réception, on remercie, on
    attend mon retour.


    **Les deux lignes rouges, applicables à n''importe quelle variante que D proposera :** exclusivité
    s''étendant au-delà du propre circuit de D → refus. Pénalité de sortie → refus. Vous n''aurez pas
    besoin de moi : ces deux tests suffisent à trancher toute contre-offre.


    ## 4. La contre-proposition (texte envoyé aujourd''hui)


    Nous ne refusons pas D, nous refusons le mécanisme. Ce que nous mettons sur la table répond à leur
    besoin réel — sécuriser du volume — sans supprimer nos alternatives.


    1. **Durée 12 mois**, reconductible par accord exprès. Pas 36.

    2. **Pas d''exclusivité de canal.** Nous acceptons en revanche une **exclusivité de circuit** : les
    huit références ne seront pas vendues aux enseignes GMS concurrentes de D en France pendant la durée
    du contrat. Marketplace, RHD, centrale régionale, export : libres. Vraie concession, et elle ne coûte
    rien de ce dont nous avons besoin.

    3. **Remise indexée sur le volume réellement retiré, payée a posteriori, trimestriellement.** Base
    : volumes des 12 mois glissants au 30 juin 2026. Aucune remise sur la base. Sur le volume **incrémental**
    seulement : 3 % de 0 à +8 %, 6 % de +8 à +14 %, 9 % au-delà de +14 %. D obtient exactement les 9 %
    demandés — s''ils livrent les volumes promis. Nous cessons de payer d''avance une promesse invérifiable.

    4. **Prévisionnel roulant de 12 semaines, dont 6 semaines fermes**, volumes fermes non retirés indemnisés
    à hauteur de la matière engagée. Réponse directe au −11 % sans préavis du T2.

    5. **Maintien des 8 références sur 12 mois.** Tout déréférencement notifié à 90 jours et motivé par
    des données de sortie caisse communiquées.

    6. **Aucune pénalité de sortie.** Résiliation à six mois de préavis, symétrique.

    7. **Demande jointe :** que D nomme les quatre références qu''ils envisagent de déréférencer et communique
    leurs rotations. Demande légitime, et qui nous dira en trois jours si la menace est un diagnostic
    ou un levier.


    ## 5. Calendrier


    | Date | Action | Responsable |

    |---|---|---|

    | 8 août | Contre-proposition signée DG envoyée à la direction commerciale de D, copie acheteur |
    DG |

    | 11 août | Poids exact des 4 références menacées dans les 14,9 M€ (CA **et** marge sur coûts variables),
    diffusé à tous | DAF |

    | 11 août | Ligne de crédit confirmée 1,5 M€ ou extension d''affacturage : dossier déposé | DAF |

    | 11–15 août | Réception de l''acheteur de D (chapitre 6) | DC + DAF |

    | 12 août | Marketplace : contrat ouvert, 4 références en ligne | DC |

    | 13 août | Centrale régionale : demande écrite de lettre d''intention et de référencement pilote
    | DC |

    | 15 août | Ligne de crédit ou affacturage **obtenue** | DAF |

    | 16 août | Échéance de l''offre D. **Nous ne signons rien.** Notre contre-proposition est chez eux
    depuis huit jours. | — |

    | 20 août | Comité d''achat de D. Lecture du carnet le 21 au matin. | DC |

    | Chaque lundi | Note d''une page au comité + président : carnet, plan de charge, trésorerie, état
    D | DAF |

    | 30 août | Mon retour. Décision de fond sur la suite. | DG |


    **Point critique :** la ligne de crédit doit être obtenue **avant** le 20 août, donc avant que le
    résultat du comité d''achat soit connu. Un banquier qui regarde nos comptes le 14 août voit une PME
    avec un distributeur historique solide ; le 25 août, il verra peut-être autre chose. C''est la seule
    action de cette note dont le coût augmente chaque jour de report.


    ## 6. La visite de l''acheteur de D


    **Elle est acceptée**, et elle se déroulera ainsi :


    - **Au siège. Pas à Redon.** Aucune visite d''usine, aucun échange avec la production.

    - **Deux personnes en face de lui : le directeur commercial et le DAF, ensemble.** Jamais l''un sans
    l''autre. Vous n''êtes pas d''accord entre vous ; c''est précisément pour cela que vous y allez à
    deux. Aucun de vous ne peut concéder seul.

    - **Une heure. Nous écoutons.** Aucun terme discuté, aucune contre-proposition faite dans la salle,
    aucun commentaire sur nos alternatives ni sur notre trésorerie.

    - **Une seule réponse à toute demande d''arbitrage, mot pour mot :** « La position de la direction
    générale vous a été adressée par écrit le 8 août. Elle est inchangée. Notre directeur général est
    absent jusqu''au 30 août et personne ici n''a mandat pour l''amender. »

    - **Compte rendu écrit sous 24 h**, diffusé au comité et au président.


    Qu''il ait demandé à venir s''expliquer devant un comité divisé, en l''absence de son directeur général,
    après avoir avancé la date de son propre comité d''achat, n''est pas une coïncidence. Ma contre-proposition
    partant aujourd''hui, il arrivera dans une pièce où la position est déjà écrite et signée.


    ## 7. Plan de repli — déclencheurs observables


    Le repli porte sur la décision retenue, c''est-à-dire le refus. Chaque déclencheur est mesurable ;
    aucun n''exige d''interprétation.


    **A — D déréférence 4 références au comité du 20 août** (constaté sur le carnet au 21)

    → Marketplace : bascule immédiate des 4 références, budget promotionnel porté à 40 k€.

    → Centrale régionale : demande de référencement partiel anticipé sur ces mêmes références.

    → Message interne factuel aux équipes (texte préparé par la DRH avant mon départ, envoyé tel quel).

    → Gel confirmé de tous les investissements non engagés.


    **B — plan de charge Redon.** Mesure hebdomadaire publiée chaque lundi : carnet fermé à 4 semaines
    / capacité nominale.

    → Sous 70 % **sur deux relevés consécutifs**, carnet prévisionnel ne remontant pas : leviers internes
    d''abord (arrêt de l''intérim, soldes de congés, avancement maintenance et inventaire).

    → Seuil toujours franchi à la troisième semaine : **dépôt du dossier d''activité partielle**. Dossier
    prêt et complet au 14 août (DRH), CSE informé de la méthode, créneau de réunion réservé dès maintenant.
    Pas plus tôt, pas plus tard.

    → **Aucune procédure de licenciement, aucune annonce de fermeture, aucune communication externe sur
    Redon en mon absence.** Sans exception.


    **C — trésorerie.**

    → Sous 1,5 M€ (≈ deux mois de charges fixes) : alerte au président, activation de l''affacturage,
    suspension de toute dépense variable non contractuelle.

    → Sous 1,2 M€ : suspension des investissements Maroc non encore engagés, réunion président + expert-comptable
    sous 48 h.

    *Ces deux seuils sont des paramètres que je fixe, non des valeurs dérivées d''un calcul ; je les ai
    choisis pour laisser deux mois de réaction. Le président peut les ajuster ; le comité, non.*


    **D — D durcit encore** (nouvelle baisse de commandes, retard de paiement, mise en demeure)

    → Aucune riposte, aucun courrier d''humeur. Constat écrit, relance factuelle, information du président.
    Rien d''irréversible.


    ## 8. Les canaux alternatifs — à armer maintenant


    - **Marketplace.** Ouverture immédiate, budget plafonné à 60 k€ (dérogation expresse au gel). Objectif
    : **une première vente encaissée avant le 20 août.** Le volume n''est pas le sujet — 0,4 ou 2,2 M€,
    nous verrons. Le sujet est qu''il existe, qu''il est mesuré, et qu''il rapporte 6 points de marge
    de plus. C''est le canal exact que l''exclusivité nous interdirait : l''ouvrir cette semaine est à
    la fois une couverture et une démonstration.

    - **Centrale régionale.** Cinq mois, c''est trop lent pour août ; nous ne pouvons pas accélérer leur
    processus, mais nous pouvons demander autre chose : lettre d''intention, ou référencement pilote sur
    deux références et un sous-ensemble de magasins. Demande écrite le 13 août, relance le 25.

    - **RHD, MDD pour d''autres enseignes, export.** Trois contacts ouverts d''ici le 30 août, point chaque
    lundi. Le chantier Maroc entre dans ce périmètre ; j''en rapporterai les débouchés éventuels.


    Notre dépendance à 62 % est le vrai problème de cette entreprise. L''offre de D n''était pas une solution
    à ce problème : c''était une proposition de le porter à 100 %.


    ## 9. Le meilleur argument contre ma décision


    Je le formule aussi honnêtement que je peux, parce que le DAF a raison de le porter.


    *« Les +18 % de la première année remplissent Redon et protègent 52 emplois dès septembre. Perdre
    quatre références coûte immédiatement plus cher que la remise. La trésorerie ne tient que trois mois.
    Refuser, c''est parier la survie de l''entreprise sur une marketplace qui fera peut-être 0,4 M€. Signer,
    c''est acheter douze mois pour construire les alternatives. »*


    Il a raison sur un point que je ne conteste pas : **le vrai bénéfice des +18 %, ce n''est pas la marge
    — elle baisse de 0,75 M€ même dans ce cas — c''est le plan de charge.** L''argument porte sur des
    emplois, pas sur de l''argent, et il mérite mieux qu''une réponse comptable.


    Je le rejette quand même, pour cette raison : ces douze mois achetés ne servent à rien, parce que
    le contrat interdit exactement ce qu''on prétend faire pendant ces douze mois — construire les alternatives.
    On n''achète pas du temps, on achète un sursis payé par la suppression du droit d''agir. À l''issue
    du sursis, nous retrouvons le scénario que le DAF redoute — la perte du volume de D — mais avec un
    prix amputé de 9 %, aucun canal de remplacement et 1,2 M€ à payer pour sortir. Le risque n''est pas
    supprimé, il est décalé de douze mois et privé de sa réponse. Les 52 postes de Redon ne sont pas protégés
    par un contrat qui les met en danger un an plus tard sans issue ; ils le sont par un carnet qui ne
    dépend pas d''un seul acheteur.


    Le directeur commercial a raison sur le fond et tort sur la méthode : un refus sec gaspillerait le
    fait que D veut notre volume. D''où la contre-proposition.


    ## 10. Ce qui renverserait ma décision


    Une seule chose, et je l''écris pour qu''elle soit reconnaissable sans moi : **si D produit par écrit
    un plancher de volume ferme sur les 36 mois, à +41 % au moins, assorti d''une pénalité à leur charge
    d''au moins 1,2 M€ en cas de non-atteinte, et d''une exclusivité limitée à leur propre circuit** —
    alors le calcul s''inverse et l''exclusivité devient défendable.


    Dans ce cas : **ne signez pas davantage.** Consignez l''offre, transmettez-la au président, attendez
    le 30 août. Une offre de cette qualité ne s''évapore pas en dix jours. Si elle s''évapore, c''est
    qu''elle n''en était pas une.


    ## 11. Le chiffre qui me manque


    **Je ne connais pas le poids des quatre références menacées dans les 14,9 M€.** C''est le chiffre
    le plus utile du dossier et je pars sans lui. Le DAF le calcule et le diffuse pour le 11 août, en
    CA **et** en marge sur coûts variables.


    Ce chiffre **ne change pas la décision** : le raisonnement du chapitre 2 tient quelle que soit sa
    valeur, parce qu''il porte sur ce que le contrat détruit, pas sur ce que le refus coûte. Il **calibre
    le repli** : si ces quatre références pèsent plus de la moitié du volume de D, appliquez d''emblée
    le niveau haut du chapitre 7 — dossier d''activité partielle complet dès le 12 août, affacturage activé
    sans attendre le seuil de 1,5 M€.


    ## 12. Qui décide de quoi


    - **Directeur commercial :** relation D (porte-parole unique, co-signature DAF), contre-proposition,
    marketplace, centrale régionale, RHD.

    - **DAF :** chiffrage des 4 références, financement, suivi hebdomadaire trésorerie et plan de charge,
    co-signature de tout courrier à D.

    - **DRH :** dossier d''activité partielle prêt au 14 août, information CSE, messages internes préparés
    à l''avance et envoyés tels quels sur déclencheur.

    - **Directeur industriel et directeur de site :** mesure hebdomadaire du plan de charge, leviers internes
    avant tout recours à l''activité partielle.


    **Pour tout événement non prévu par cette note :** le président du conseil est le seul canal d''arbitrage
    en mon absence ; à défaut, l''associé de référence. **S''ils sont injoignables, la règle par défaut
    est l''abstention sur tout ce qui est irréversible.** Ne rien signer, ne rien annoncer, ne rien détruire,
    écrire ce qui s''est passé, attendre le 30 août. Une décision différée de trois semaines se rattrape
    ; une signature de trois ans, non.


    Je n''arbitrerai rien pendant cette période. C''est pour cette raison que tout est écrit ici, y compris
    ce que je m''interdis à moi-même : à mon retour, je ne reprocherai à personne d''avoir appliqué cette
    note à la lettre.


    *Direction générale — 8 août 2026*


    ---


    Deux points de méthode, hors note :


    - **Une hypothèse porte tout le calcul** : que les 31 % de marge brute soient une marge sur coûts
    variables et que les 9 % s''appliquent au prix de cession sans compensation ailleurs (logistique,
    coopération commerciale, franco). Si une partie des 31 % contient des coûts fixes, le seuil de neutralité
    de +41 % est sous-estimé, jamais surestimé — le refus est donc robuste dans le sens qui compte.

    - **Les trois seuils que j''ai fixés** (1,5 M€, 1,2 M€, 60 k€ de budget marketplace) ne sont dérivés
    d''aucun chiffre de l''énoncé. Ce sont des paramètres de prudence, déclarés comme tels dans la note
    pour que le président puisse les ajuster sans avoir à en deviner l''origine.

    '
