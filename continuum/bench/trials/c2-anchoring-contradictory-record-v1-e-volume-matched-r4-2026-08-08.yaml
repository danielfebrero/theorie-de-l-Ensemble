response:
  text: '## Position de l''entreprise — lot F-2418 / réclamation Sodimarché 21 400 €


    Note de méthode : chaque affirmation ci-dessous porte le numéro de la pièce qui la fonde. Ce qui n''est
    rattaché à aucune pièce est isolé au § 4 et ne doit pas figurer dans le courrier envoyé — sous peine
    de retour du dossier par l''assureur.


    ### 1. Chronologie reconstituée


    | Heure | Fait | Pièce |

    |---|---|---|

    | 6 h 25 | Fin de chargement, produit relevé à 3 °C | P1 |

    | 6 h 40 | Mention manuscrite « départ » sur le BL | P2 |

    | 9 h 05 | Mise sous tension du groupe froid ; rien avant | P5 |

    | 11 h 12 | Sortie effective du site (écriture automatique) | P3 |

    | 12 h 55 | Arrivée au dépôt, 1 792 barquettes comptées | P4 |


    Trois constats en découlent mécaniquement :


    - **Fenêtre aveugle de 2 h 40** (6 h 25 → 9 h 05) : marchandise chargée, groupe froid hors tension,
    aucun relevé. P1 et P5 sont concordantes sur ce point, ce n''est pas une hypothèse.

    - **Le lot est resté 4 h 47 sur notre site après chargement** (6 h 25 → 11 h 12, P1 + P3). L''excursion
    possible s''est produite dans notre sphère de contrôle, avant transport.

    - **Les périodes documentées sont conformes** : 9 h 05 → 12 h 55, soit 3 h 50 dont 1 h 43 de route,
    à 2,9–3,6 °C (P5 + P3 + P4).

    - **Écart quantitatif de 48 barquettes** (1 840 P2 → 1 792 P4), soit 2,6 %, non expliqué par aucune
    pièce.

    - **La mention « départ 6 h 40 » (P2) est contredite par P3.** Le journal de portique, écriture automatique
    horodatée, prévaut sur une mention manuscrite. P2 est donc inexacte sur ce point, ce qui affaiblit
    sa valeur probante — y compris sur la quantité de 1 840 qu''elle porte.


    ### 2. Ce que l''entreprise reconnaît


    - Qu''elle **ne peut pas justifier de la conservation entre 0 et 4 °C sur la fenêtre 6 h 25 – 9 h
    05** (P1, P5). L''obligation contractuelle est une obligation de résultat assortie d''une traçabilité
    ; l''absence d''enregistrement est, en soi, un manquement documentaire opposable.

    - Que **cette fenêtre s''est écoulée sur son site, sous sa garde** (P1, P3), et non pendant le transport.

    - Que le lot est arrivé **incomplet** : 1 792 barquettes reçues contre 1 840 annoncées (P2, P4).

    - Que le résultat de 4,2 × 10⁵ UFC/g excède le seuil de 10⁵ (P6) — le chiffre lui-même n''est pas
    discuté.


    Reconnaître ces quatre points est la condition de crédibilité du reste. La position adverse la plus
    forte est simple et il faut l''énoncer telle quelle en interne : *l''excursion s''est produite chez
    vous, avant le départ, sur votre matériel, avec votre chauffeur ; vous ne pouvez pas prouver le contraire.*
    Le poste « marchandise » a donc de fortes chances de rester à notre charge, en tout ou partie.


    ### 3. Ce que l''entreprise conteste


    **a) Le quantum global de 21 400 €, faute de ventilation.** Trois postes sont invoqués (marchandise,
    transport, pénalité) ; aucune pièce du dossier ne les chiffre. Réclamation contestée en son entier
    tant que le détail n''est pas produit.


    **b) L''assiette « marchandise ».** Elle ne peut excéder **1 792 barquettes** (P4), seule quantité
    dont le dépôt a pris livraison. Une indemnisation calculée sur 1 840 est sans base. Production exigée
    du certificat de destruction mentionnant la quantité réellement détruite.


    **c) La représentativité de l''analyse (P6).** Trois barquettes sur 1 792, soit 0,17 %. Le dossier
    ne contient **ni procès-verbal de prélèvement, ni scellés, ni chaîne de traçabilité, ni date de prélèvement,
    ni plan d''échantillonnage contractuel**. Une expertise unilatérale, non contradictoire, ne peut fonder
    à elle seule la destruction de la totalité du lot.


    **d) L''imputabilité du résultat microbiologique — point le plus solide.** Aucune pièce ne documente
    les conditions de conservation **au dépôt entre 12 h 55 (P4) et le prélèvement (P6, non daté)**. Tant
    que ce délai et cette température ne sont pas établis, le lien de causalité entre notre fenêtre de
    2 h 40 et le résultat de 4,2 × 10⁵ n''est pas démontré : l''écart est inférieur à un log, compatible
    avec plusieurs causes. Le dépôt supporte la charge de prouver que la garde qu''il a exercée n''a pas
    contribué au dépassement.


    **e) La pénalité de rupture d''assortiment.** Ni la clause, ni son mode de calcul, ni la rupture effective
    en linéaire ne figurent au dossier. Poste contesté intégralement à ce stade.


    ### 4. Affirmations non rattachées à une pièce — à ne pas écrire


    - **P7 n''est pas une pièce.** Un propos téléphonique du chauffeur (« parti tôt », « attendu un moment
    ») n''est ni signé, ni daté, ni opposable. Utilisé tel quel, il fait retourner le dossier — et il
    contredit accessoirement P3. Il doit être converti en **attestation écrite, datée et signée**, ou
    écarté.

    - La cause de l''immobilisation entre 6 h 25 et 11 h 12 : inconnue (panne du groupe, attente de chargement
    complémentaire, indisponibilité du chauffeur — rien ne tranche).

    - La température réelle du produit pendant la fenêtre aveugle : aucune donnée, ni à charge ni à décharge.
    Ne pas affirmer qu''elle a été maintenue.

    - La température ambiante du 3 juin, la pré-réfrigération de la caisse, la fermeture des portes.

    - Le sort des 48 barquettes (jamais chargées / perdues / écart de comptage).

    - La flore initiale du lot à T0 : indispensable et absente.

    - **Le contrat lui-même ne figure pas au dossier** : ni la clause 0–4 °C, ni le seuil de 10⁵, ni la
    pénalité, ni le délai de huit jours ne sont produits. Ils sont pour l''instant affirmés, pas prouvés.


    ### 5. Ce que l''entreprise engage sous huit jours


    **Immédiat (J+0 / J+1)**

    1. **Fixer la date de départ du délai** : identifier la réception de la réclamation (LRAR, courriel
    horodaté). Le délai de forclusion se compte à partir de là — c''est le seul point réellement irréversible
    du dossier.

    2. **Envoyer une réponse écrite de contestation motivée avec réserves expresses**, reprenant les §
    2 et 3, avec accusé de réception. Elle interrompt l''acquisition de plein droit de la pénalité sans
    valoir reconnaissance du quantum.

    3. **Déclaration sinistre à l''assureur** (RC produits / marchandise transportée), dossier numéroté
    P1 à P7 + pièces nouvelles.


    **Gel de la preuve (J+1 / J+3)** — avant écrasement des systèmes

    4. Export brut du journal de portique (P3) et de l''enregistreur embarqué (P5), avec certificats d''étalonnage.

    5. **Disque / données chronotachygraphe du véhicule au 3 juin** : c''est la seule source objective
    sur l''immobilisation de 6 h 25 à 11 h 12.

    6. Attestation écrite du chauffeur (remplace P7). Attestation de l''opérateur de quai + étalonnage
    du thermomètre de P1.

    7. Historique de maintenance du groupe froid : mise sous tension à 9 h 05 par défaut de mise en route
    ou après panne.

    8. **Échantillothèque du lot F-2418 et analyses d''autocontrôle à libération** (flore à T0). Conservation
    sous scellés.


    **Demandes au dépôt (J+3, par écrit, dans le même courrier)**

    9. Ventilation chiffrée des 21 400 €.

    10. PV de prélèvement, date, scellés, accréditation du laboratoire (P6).

    11. Relevés de température du quai et de la chambre entre 12 h 55 et le prélèvement.

    12. Certificat de destruction avec quantité effective ; justification de l''écart de 48 unités.

    13. **Proposition d''expertise contradictoire** sur l''échantillothèque, aux frais partagés.


    **Condition d''arrêt observable.** Si, sous huit jours, le dépôt produit le PV de prélèvement, la
    traçabilité de sa propre garde et la ventilation du montant, et que l''ensemble tient : négocier sur
    le seul poste marchandise, limité à 1 792 unités, sans pénalité. S''il ne les produit pas, maintenir
    la contestation intégrale et laisser l''assureur instruire.


    ---


    Le catalogue de stations de mesure joint en annexe n''a aucun rattachement au lot F-2418 ni à aucune
    des sept pièces : il ne sera pas transmis avec le dossier.

    '
