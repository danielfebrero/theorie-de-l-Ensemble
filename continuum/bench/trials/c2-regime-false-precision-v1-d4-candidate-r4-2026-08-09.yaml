response:
  text: '# Note au comité — fermetures de magasins


    **Objet :** réponse à l''objectif actionnaire de +300 000 € de résultat dès l''exercice prochain

    **Recommandation en une phrase :** ne fermer aucun des trois magasins déficitaires au motif qu''ils
    sont déficitaires — ils rapportent tous les trois de l''argent au groupe ; la seule décision réellement
    urgente mardi concerne Vitry, et pour une raison de calendrier de bail, pas de performance.


    ---


    ## 1. Ce que dit réellement la comptabilité


    Le résultat par magasin inclut une quote-part des frais de siège et de logistique (6,4 M€ répartis
    au prorata du chiffre d''affaires). Cette quote-part est une **écriture de répartition, pas une dépense
    qui s''arrête quand le magasin ferme**. Le siège, les systèmes, les entrepôts et la direction restent
    là le lendemain.


    Ce que chaque magasin apporte réellement, une fois ses propres loyers, salaires et charges payés :


    | | Résultat affiché | Quote-part siège | **Apport réel au groupe** |

    |---|---|---|---|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |


    **Les trois magasins « en perte » contribuent ensemble +114 000 € par an.** Les fermer tous les trois
    ne rapporte pas 288 000 € : cela dégrade le résultat de 114 000 €, et redistribue 402 000 € de frais
    de structure sur les 16 magasins restants — dont plusieurs deviendront « déficitaires » à leur tour,
    par pure mécanique comptable.


    C''est le point central de cette note : **la certification à l''euro près porte sur des chiffres exacts,
    mais la clé de répartition au prorata du CA n''est pas une mesure de ce qu''une fermeture économise.**


    ## 2. Les trois cas, un par un


    **Chambéry — non, sans réserve.** Six ans de bail restants, aucune clause de sortie, 1,1 M€ d''indemnité.
    Payer 1,1 M€ comptant pour arrêter une activité qui rapporte 32 000 € par an est destructeur dans
    tous les scénarios. Le magasin le plus proche est à 92 km : le chiffre d''affaires ne serait pas récupéré
    ailleurs, il disparaîtrait. C''est la seule option du dossier qui engage une somme irrécupérable.


    **Nîmes — non, et ne pas confondre deux sujets.** Les murs valent 1,9 M€. La vraie question n''est
    pas « faut-il fermer le magasin » mais « ce patrimoine est-il correctement employé ». Ce sont deux
    décisions distinctes, avec deux calendriers différents ; les mélanger conduit à fermer un magasin
    rentable pour encaisser un actif. Une cession éventuelle produirait par ailleurs un gain **exceptionnel
    et non récurrent** — ce n''est pas ce que demande l''actionnaire, qui parle de résultat.


    **Vitry — c''est le seul dossier du mardi, pour une raison de délai.** Bail échu dans 7 mois, sortie
    sans indemnité : c''est la seule porte de sortie gratuite du réseau, et elle se referme. Le congé
    doit vraisemblablement être délivré dans les toutes prochaines semaines — **à faire confirmer par
    le conseil avant mardi**. C''est cette échéance, et elle seule, qui met Vitry à l''ordre du jour.


    Deux éléments corrigent le chiffre de Vitry, en sens inverse l''un de l''autre :


    - **18 % des entrées sont des retraits de commandes web**, dont le chiffre d''affaires est enregistré
    sur l''e-commerce. Vitry porte des coûts pour une activité dont il ne perçoit pas la recette : sa
    contribution de 63 000 € est sous-évaluée, et si le magasin ferme, ces retraits devront être servis
    autrement — à un coût qui ne disparaît pas.

    - **Le magasin le plus proche est à 14 km**, et 41 % des porteurs de carte ont acheté dans au moins
    deux magasins. Une part du chiffre d''affaires serait donc récupérée — et récupérée avec une bonne
    marge, puisque le magasin d''accueil a déjà payé ses murs et son personnel.


    **Le test est là :** fermer Vitry n''est favorable que si le magasin de 14 km récupère assez de ventes
    pour remplacer 63 000 € de contribution, plus le coût de réaffectation des retraits web. Nous ne pouvons
    pas trancher aujourd''hui parce qu''il nous manque **la marge brute de Vitry et le partage de ses
    charges entre fixe et variable** — deux chiffres que la comptabilité analytique n''a jamais eu à produire.


    ## 3. Ce que nous proposons de décider mardi


    1. **Chambéry et Nîmes : sortis de la liste de fermeture**, et l''annoncer aux équipes. Le silence
    coûte plus cher que la décision.

    2. **Nîmes : ouvrir un dossier séparé sur les murs**, échéance libre, sans lien avec l''exploitation.

    3. **Vitry : ne pas décider la fermeture, décider le calendrier.** Confirmer sous 8 jours la date
    limite de congé avec le conseil, et arrêter la position au plus tard 15 jours avant cette date, sur
    la base des deux analyses ci-dessous.

    4. **Ouvrir le chantier des 300 000 €** là où ils se trouvent (§5).


    Rappel de procédure : une fermeture de site ne peut pas être décidée avant information-consultation
    du CSE, et un licenciement collectif à notre taille déclenche un plan de sauvegarde de l''emploi.
    Concrètement, **une fermeture décidée en juillet ne produit pas d''économie pleine sur l''exercice
    prochain.** Cela seul disqualifie la fermeture comme réponse à l''objectif.


    ## 4. Ce qu''on lance dès mercredi


    - **Coûts réellement évitables** (contrôle de gestion, 3 semaines) : pour chacun des trois sites,
    quelle part des 6,4 M€ disparaît vraiment si le site ferme — tournées de livraison, stock, licences,
    encadrement régional. C''est ce chiffre, et non la quote-part au prorata du CA, qui doit fonder toute
    fermeture future.

    - **Mars 2024 à Nîmes** (2 semaines) : les cinq semaines de fermeture après le dégât des eaux sont
    **la seule mesure réelle que l''entreprise possède** du report de clientèle vers les magasins voisins.
    Seuls les totaux mensuels ont été conservés : l''estimation sera large, mais une fourchette mesurée
    vaut mieux que l''hypothèse implicite d''aujourd''hui. C''est l''analyse la plus rentable du dossier.

    - **Marge brute et structure de charges de Vitry** (1 semaine), y compris le coût des retraits web.


    Trois points de méthode à ne pas oublier : les compteurs (±2 %, 24 mois) comptent des **entrées, pas
    des acheteurs** — ils sont excellents pour dimensionner les horaires, inutilisables pour décider d''une
    fermeture ; les 41 % de multi-magasins portent sur les porteurs de carte, clients par nature plus
    fidèles, et constituent donc un **plafond**, pas une moyenne ; et refacturer les retraits web au magasin
    ne change rien au résultat du groupe — cela ne fait que déplacer une ligne d''une entité à l''autre.


    ## 5. D''où viennent les 300 000 €


    Pas des magasins. Aucune combinaison de fermetures dans ce réseau ne les produit, et les trois candidats
    évidents vont dans le sens inverse. L''objectif représente **4,7 % des 6,4 M€ de frais de siège et
    de logistique** — c''est là que le sujet se joue, avec la marge commerciale et la tarification interne
    de l''e-commerce. Nous proposons d''ouvrir ce chantier mardi avec une revue ligne à ligne des 6,4
    M€, et un point d''avancement mensuel.


    ## 6. Risques, repli, et ce qui nous ferait changer d''avis


    **Pire cas de la recommandation :** nous laissons passer la fenêtre gratuite de Vitry alors que la
    fermeture était justifiée. Coût : un bail à renégocier, quelques dizaines de milliers d''euros par
    an, et l''attente de la prochaine échéance. **Qui l''encaisse : le résultat du groupe.** À comparer
    au pire cas de la fermeture immédiate des trois : −114 000 € de résultat récurrent, 1,1 M€ de trésorerie
    sortie, un PSE, et trois villes où l''enseigne disparaît — **encaissé par 430 salariés et par la trésorerie,
    sans retour possible.**


    **Repli, avec déclencheur observable :** si l''étude « mars 2024 » situe le report de clientèle **sous
    le seuil calculé** pour Vitry, ou si le conseil confirme que le congé ne peut plus être délivré proprement,
    nous ne délivrons pas de congé et négocions un renouvellement court avec faculté de sortie anticipée.


    **L''observation qui renverserait cette note :** si l''analyse des coûts évitables montre qu''un site
    consomme en logistique et en encadrement **plus que sa contribution** — plus de 63 000 € pour Vitry
    — alors la fermeture devient créatrice de valeur et nous le dirons sans détour. Nous n''avons simplement
    pas ce chiffre aujourd''hui, et la répartition au prorata du CA ne le fournit pas.


    **Enfin, une proposition sur la méthode :** l''enseigne n''a jamais fermé de magasin. Les 17 autres
    directeurs regarderont moins la décision que la manière. Nous suggérons d''accorder aux trois sites
    un mandat de redressement de six mois avec des objectifs écrits et les moyens correspondants, et de
    garantir par écrit aux équipes de Vitry un poste dans le réseau en cas de sortie. Ce n''est pas une
    consultation de courtoisie : c''est un délai réel et un engagement réel, et c''est le prix pour que
    la prochaine décision difficile soit encore possible.


    **Première action, mercredi 8h :** mandat au contrôle de gestion sur les coûts évitables, et appel
    au conseil sur la date limite du congé de Vitry.

    '
