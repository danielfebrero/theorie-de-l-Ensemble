response:
  text: '## Note


    ---


    **NOTE AU COMITÉ DE DIRECTION**

    **Objet :** Contrat cellules 2027 — arbitrage Kelmar / Sinolux

    **De :** Direction des opérations — **Décision requise à J+18**


    ---


    **Décision proposée.** Nous réservons la capacité Kelmar à J+18 sur 60 000 unités et plaçons 12 000
    unités chez Sinolux à J+21. Nous n''achetons pas le test Vertex. Nous retirons du budget les 230 400
    € inscrits.


    ---


    **1. Les 230 400 € ne sont pas une économie, c''est un pari sur un chiffre que personne n''a mesuré.**


    L''écart de prix est réel : 3,20 € × 72 000 = 230 400 €. Mais chaque reprise coûte 205 €, et chaque
    **0,1 point** de taux de retour supplémentaire coûte **14 760 €**. L''économie est absorbée à **2,86
    %** de retours, soit 1,56 point au-dessus des 1,3 % de Kelmar.


    | Taux Sinolux | Source | Résultat net 2027 |

    |---|---|---|

    | 1,1 % | essais Sinolux | **+ 259 920 €** |

    | 2,86 % | seuil d''équilibre | 0 € |

    | 3,1 % | audit sectoriel de mars | **− 35 280 €** |

    | 4,0 % | dégradation | − 168 120 € |


    La garantie de remplacement gratuit ne change pas la nature du problème : elle couvre la cellule (22,80
    €, soit 11 % des 205 €), pas la reprise. Elle déplace le seuil d''équilibre à 3,2 % au mieux. Autrement
    dit : **la seule mesure indépendante dont nous disposons se situe à l''intérieur de la zone d''équilibre,
    pas en dessous.** Sur la meilleure estimation disponible, l''écart entre les deux fournisseurs est
    proche de zéro, avec une dispersion de ± 260 000 €. Le choix ne se tranche pas sur le prix.


    **2. Nous avons deux sources, pas trois.**


    Ferro travaille sur l''échantillon de l''audit de mars : son « environ 3 % » n''est pas une confirmation
    indépendante, c''est la même mesure relue. Restent une déclaration de la partie intéressée sur son
    propre banc (1,1 %) et une mesure publiée par un tiers sur une ligne comparable du même fournisseur
    (3,1 %). La convergence apparente entre deux des trois chiffres est un artefact.


    S''ajoute un signal : Sinolux refuse toute clause indexée sur le taux de retour et propose à la place
    la garantie la moins chère possible. La partie la mieux informée décline de porter le risque qu''elle
    affirme inexistant.


    **3. Le test Vertex arrive 45 jours après la porte.**


    Résultat sous neuf semaines, soit J+63. La réservation Kelmar est ferme à J+18, le prix Sinolux expire
    à J+21, la production démarre à J+70. Sa valeur pour la décision 2027 est nulle. Par ailleurs, ± 0,3
    point autour de 3 % couvre le seuil d''équilibre : même à temps, il ne trancherait pas. 34 000 € à
    ne pas engager.


    **4. Ce que fait le fractionnement.**


    Il capte 38 400 € d''économie, borne l''exposition à environ 6 000 € si le taux réel est de 3,1 %
    (50 000 € dans une hypothèse à 5 %), et surtout il produit la mesure que le marché n''a pas : 12 000
    cellules en service réel valent mieux que 1 500 cellules en vieillissement accéléré, arrivent pendant
    2027, et éclairent le contrat 2028 où les 230 400 € annuels sont de nouveau sur la table.


    **5. Deux réponses à obtenir avant J+18 — elles peuvent changer la décision.**


    - **À Kelmar (lundi, par écrit) :** 26,00 € tient-il à 60 000 unités ? Si Kelmar re-tarife le volume
    partiel au-delà de +0,50 €/cellule, le fractionnement perd son intérêt : nous basculons sur Kelmar
    en totalité et qualifions Sinolux sur un lot de rechange hors contrat.

    - **À Sinolux (lundi, échéance J+21) :** indexation sur le coût complet de reprise (205 €, pas la
    cellule), **ou** prolongation du prix jusqu''à J+70 avec cofinancement Vertex, **ou** montée en volume
    2028 indexée sur les retours mesurés en 2027. **Si Sinolux accepte l''indexation à 205 €, nous lui
    confions le volume principal** : le risque revient alors à celui qui affirme qu''il n''existe pas.


    **6. Repli et point de bascule.**


    Déclencheur observable : retours cumulés du lot Sinolux **supérieurs à 1,0 % à 90 jours de service**
    → arrêt de toute extension 2028 et requalification. **Inférieurs à 0,4 %** → ouverture de 2028 à Sinolux
    jusqu''à 50 %.


    Observation qui renverserait ce choix : une mesure indépendante — ni Sinolux, ni dérivée de l''échantillon
    de mars — situant le taux sous 2,5 % avant J+18.


    **7. Point non financier à vérifier sous 48 h (interne, gratuit).**


    Capacité de l''atelier à traiter 2 200 reprises/an contre 936. C''est la seule branche qui transformerait
    une perte chiffrée en incident opérationnel. À vérifier avant l''engagement de J+18.


    **Première action, lundi matin :** les deux courriers ci-dessus, et retrait de la ligne 230 400 €
    du budget — elle a été inscrite sur un taux de retour que nous n''avons jamais mesuré.


    ---


    Deux hypothèses portent la recommandation et sont explicites dans la note : que Kelmar tienne 26,00
    € sur un volume partiel (à confirmer lundi), et que les 205 € couvrent bien la cellule de remplacement.
    Si les 205 € l''excluent, le seuil d''équilibre passe à 3,03 % — la conclusion ne bouge pas : le seuil
    reste dans l''intervalle de la mesure indépendante.

    '
