response:
  text: '## Recommandation — lecture d''activation onboarding v2, comité du mardi


    ### 1. Le point qui décide de tout


    Le test ne compare pas deux populations comparables. Le bras témoin est écrit à l''inscription ; le
    bras v2 est écrit à l''étape 3. Les 11 300 « comptes v2 » ne sont donc pas les comptes exposés à v2
    — ce sont **les comptes exposés à v2 qui ont déjà réussi une partie du parcours**. Le dénominateur
    v2 est conditionné à un succès partiel ; le dénominateur témoin ne l''est pas.


    Ce n''est pas un biais qu''on corrige, c''est une unité de randomisation cassée. Le 47 % ne mesure
    pas l''effet de v2 : il mesure l''effet de v2 *chez les gens qui n''ont pas abandonné*. On ne peut
    ni borner l''ampleur ni garantir le signe de l''écart avec les journaux actuels.


    ### 2. Les 4 812 inversions ne sont pas une anomalie de journalisation


    C''est la signature du défaut, pas un bruit à nettoyer.


    - 4 812/11 300 = **42,6 %** au bras v2, contre 98/10 940 = **0,9 %** au témoin — un facteur ~48.

    - Les deux horodatages viennent du même service, sur une horloge unique NTP, sans incident ni ticket.
    Une dérive d''horloge ne peut pas être corrélée au bras : elle frapperait les deux de la même façon.

    - En revanche, l''architecture prédit exactement ce qu''on observe : le compte agit, *puis* atteint
    l''étape 3, *puis* reçoit sa ligne d''affectation. `first_action_at < bucket_assigned_at` est le comportement
    normal du système tel qu''il est construit.


    **Vérification à faire (30 minutes)** : pour un échantillon des 4 812, comparer `first_action_at`
    à l''horodatage de l''événement « étape 3 ». Si la première action tombe systématiquement avant l''étape
    3, la thèse de l''artefact est close.


    ### 3. Le 41 % est pire que le 47 %, pas mieux


    Retirer les 4 812 lignes supprime précisément les comptes qui démontrent le biais, et les supprime
    sur un critère corrélé au résultat (avoir agi tôt). C''est une **deuxième sélection empilée sur la
    première**, sur un échantillon amputé de 43 %. Le chiffre paraît plus prudent et sa provenance l''est
    moins.


    Il y a aussi un coût de perception : en due diligence, « nous avons trouvé l''anomalie et retiré les
    lignes » se lit beaucoup plus mal que « nous avons trouvé l''anomalie et l''avons signalée ». Le 41
    % ne doit apparaître nulle part.


    ### 4. Le chiffre qui manque, et le seuil qui compte


    Le nombre de comptes exposés à v2 ayant abandonné avant l''étape 3 n''est nulle part. C''est la seule
    inconnue qui gouverne la conclusion. Si on l''appelle N, et en supposant (borne haute du biais) que
    ces comptes n''activent pas :


    | N (abandons pré-étape 3) | Activation v2 réelle |

    |---|---|

    | 0 | 47 % |

    | ~1 650 | 41 % |

    | ~3 450 | 36 % |

    | **~5 830** | **31 % — l''écart disparaît entièrement** |


    Autrement dit : **si environ un tiers des comptes exposés à v2 ont décroché avant l''étape 3, il n''y
    a pas de lift.** Pour un tunnel d''onboarding, une perte d''un tiers avant l''étape 3 n''est pas un
    scénario extrême — c''est le scénario ordinaire. (Si ces abandons activent quand même à ~10 %, le
    seuil de bascule monte vers ~8 600 ; la conclusion qualitative ne change pas.)


    Deux requêtes à lancer aujourd''hui :


    1. **Récupérer N** depuis une source indépendante du service de bucketing : journaux d''évaluation
    du feature flag, logs de requêtes sur la route v2, ou table de comptes du service d''authentification.
    Puis : `total inscriptions période − témoin (10 940) − v2 assignés (11 300)` = résidu non affecté.

    2. **Contrôle de cohérence** : 11 300 > 10 940 alors que le bras v2 ne peut que *perdre* des comptes
    par rapport à son exposition. Si le split visé était 50/50, c''est arithmétiquement impossible et
    il y a un second problème (doublons, ré-entrées, ou lignes manquantes au témoin). À clarifier avant
    de citer le moindre chiffre.


    Si N est récupérable, on peut recalculer une estimation en intention de traiter (ITT) sur la vraie
    exposition. **C''est le seul chiffre publiable, et il pourrait rester bon.** Ma recommandation n''est
    pas « supprimer le chiffre », c''est « le chiffre doit être gagné par cette requête ».


    ### 5. Contenu exact de la diapositive


    **Si N est récupéré et l''ITT recalculé d''ici lundi soir :**


    > **Onboarding v2 — lecture révisée**

    > Activation à 30 jours (intention de traiter, population exposée complète) : **XX % vs 31 % témoin**

    > *Le premier calcul (47 %) excluait les comptes ayant quitté le parcours avant l''étape 3, du fait
    d''un défaut d''instrumentation. Chiffre ci-dessus recalculé sur la population exposée complète, N
    = [total]. Correctif déployé le [date].*

    > Tickets support : **−22 %** (mesure indépendante, file Zendesk)

    > Rétention à 90 jours : **stable**


    **Si N n''est pas récupérable d''ici lundi soir :**


    > **Onboarding v2 — résultats**

    > Tickets support : **−22 %** (mesure indépendante, file Zendesk)

    > Rétention à 90 jours : **stable**

    > Activation à 30 jours : **lecture invalidée par un défaut d''affectation dans le test mars–avril.
    Mesure propre livrée le [date, ≈5 semaines après le correctif].**


    Dans les deux cas : pas de 47 %, pas de 41 %, et **pas de réserve dans les notes de l''orateur**.
    Une réserve en notes est la pire option disponible : elle laisse le chiffre dans le deck — c''est-à-dire
    dans ce que le term sheet référence — tout en créant la preuve écrite que nous savions. Cela transforme
    une erreur en déclaration inexacte consciente.


    ### 6. Ce qu''on dit au comité (30 secondes, en ouverture du point produit)


    > « Une correction avant d''entrer dans les chiffres. En préparant l''annexe, nous avons trouvé un
    défaut d''instrumentation dans le test d''onboarding : l''affectation au bras v2 était écrite au milieu
    du parcours et non à l''inscription, ce qui exclut du calcul les comptes ayant décroché tôt. Le 47
    % annoncé n''est donc pas comparable au témoin. [Version A : Nous avons reconstruit la population
    complète, le chiffre corrigé est XX %. / Version B : Nous reconstruisons la population complète ;
    la mesure propre arrive le X.] Le correctif est déployé. Le reste du dossier n''est pas affecté :
    la baisse de 22 % des tickets support est mesurée indépendamment sur Zendesk, et la rétention à 90
    jours est stable. »


    Ton factuel, on mène avec le correctif, pas d''excuses appuyées. Un comité d''investissement qui voit
    une équipe trouver son propre défaut et le déclarer neuf jours avant la signature en tire une lecture
    positive sur la qualité de la data ops — c''est un actif, pas seulement un coût.


    ### 7. Pour la DAF : l''asymétrie est le seul argument qui compte


    Le risque n''est pas « on perd un chiffre ». Il est asymétrique :


    - **On déclare** → conversation sur la valorisation, désagréable, réversible, et on garde la main
    sur le récit.

    - **La diligence le trouve** → ce n''est plus une renégociation, c''est un tour qui casse, plus une
    allégation de présentation trompeuse.


    Et c''est trouvable de façon triviale : un taux d''inversion d''horodatage de 42,6 % sur le bras traité
    saute aux yeux de la première équipe de data diligence qui ouvre la table d''affectation. Le fait
    que le term sheet référence explicitement la courbe d''activation rend la divulgation **plus** urgente,
    pas moins : cela établit la matérialité du chiffre et le rend très susceptible d''être couvert par
    les *reps and warranties*. Signer des déclarations qu''on sait fausses est exactement ce qui crée
    une exposition personnelle pour les dirigeants et un recours post-closing pour l''investisseur.


    Une branche coûte des points de valorisation. L''autre est irrécupérable et engage des personnes nommément.


    ### 8. Le meilleur contre-argument à ma position


    Il est sérieux et il mérite d''être posé au comité s''il est vrai : *le biais est peut-être petit*.
    Si l''étape 3 est très en amont du parcours et que la perte pré-étape 3 est de l''ordre de 5 %, le
    lift réel reste largement à deux chiffres, et nous aurons sacrifié une négociation certaine contre
    un risque théorique.


    Ma réponse : c''est une affirmation empirique, et elle est testable avant mardi. C''est la requête
    du §4. **Si l''exposition montre moins de ~1 650 abandons pré-étape 3, le VP Produit a raison sur
    le fond** et la diapositive porte un chiffre solide — mieux étayé qu''avant. Le désaccord ne porte
    donc pas sur le jugement, il porte sur un fait qu''on peut établir en une journée. Ce qui n''est pas
    défendable, c''est de publier le chiffre *sans* avoir posé la question, alors qu''elle est bon marché
    et que nous savons désormais qu''elle se pose.


    ### 9. Condition d''arrêt


    Le chiffre d''activation ne monte sur la diapositive que si les trois conditions sont réunies **lundi
    18 h** : (a) N récupéré depuis une source indépendante du service de bucketing, (b) ITT recalculé
    sur la population exposée complète, (c) calcul relu par quelqu''un hors de l''organisation produit
    — finance ou ingénierie. Si l''une des trois manque, la version B s''applique, sans nouvelle discussion
    mardi matin.


    **Correctif technique, à déployer indépendamment du deck** : écrire l''affectation au moment de la
    randomisation, à l''inscription, pour les deux bras, depuis un service qui ne dépend pas du tunnel
    d''onboarding. Pour la re-mesure : détecter un écart de 5 points sur une base de 31 % demande ~1 400
    comptes par bras (~1 semaine d''inscriptions au rythme actuel) ; la contrainte réelle est la fenêtre
    d''observation de 30 jours, d''où une lecture propre à ~5 semaines. Un indicateur d''activation à
    7 ou 14 jours peut donner un signal directionnel bien avant, utilisable en suivi post-closing auprès
    de l''investisseur.


    ---


    Si tu veux, je peux packager ceci en note d''une page pour circulation au comité, ou écrire les requêtes
    SQL de reconstruction de N dès que tu me dis quel service tient les logs de feature flag.

    '
