response:
  text: '# NOTE AU CONSEIL — séance du vendredi

    **Objet :** arbitrage Sedamex (A) / Nordwerk (B), horizon 18 mois

    **De :** la direction générale

    **Recommandation : Option B — installer la ligne Nordwerk**, sous les trois conditions préalables
    du § 5.


    ---


    ### 1. L''écart d''espérance


    | | Option A (Sedamex) | Option B (Nordwerk) |

    |---|---|---|

    | Résultat espéré, 18 mois | **+200 k€** garantis | 0,6 × 900 − 0,4 × 400 = **+380 k€** |


    Écart en faveur de B : **+180 k€**. Le point d''indifférence entre les deux options se situe à **46,2
    %** de probabilité de réussite (1 300 p = 600). Le bureau d''études estime 60 %, sur onze installations
    documentées. Nous disposons donc de **près de 14 points de marge d''erreur** sur cette estimation
    avant que B ne cesse d''être supérieure à A.


    ### 2. Mais ce n''est pas l''espérance qui emporte ma décision — c''est la borne de perte


    Une espérance favorable ne justifie **jamais** un engagement irréversible si la branche défavorable
    est mortelle. Ici, elle ne l''est pas, et cela se vérifie ligne à ligne :


    | | Aujourd''hui | Après échec complet de B |

    |---|---|---|

    | Fonds propres | 3,4 M€ | **3,0 M€** — covenant à 1,2 M€, couverture 2,5× |

    | Trésorerie | 2,6 M€ | **2,2 M€** |

    | Dette nette | 0 | 0 |


    Perte maximale 400 k€ = **11,8 % des fonds propres, 15 % de la trésorerie, 2,4 mois de masse salariale.**
    Après l''échec, il resterait encore 1,8 M€ de pertes absorbables avant de toucher le covenant.


    Surtout, **il n''existe aucun canal par lequel un échec technique se transformerait en défaillance
    de l''entreprise** : pas de caution personnelle du dirigeant, pas de clause de défaut croisé, aucune
    sûreté sur l''actif industriel, carnet de commandes non gagé, dette nette nulle, plafond contractuel
    ferme. C''est la structure de l''engagement, pas l''optimisme du bureau d''études, qui fonde ma recommandation.


    ### 3. Réponse au directeur financier


    **« On ne joue pas la maison sur un tirage à 40 %. »** La règle est juste ; elle ne s''applique pas
    à ce dossier. Jouer la maison, ce serait une caution personnelle, un défaut croisé, une sûreté sur
    l''outil, un financement par dette, ou une perte non plafonnée. Aucun de ces canaux n''est présent.
    Nous ne jouons pas la maison : nous jouons 2,4 mois de masse salariale, plafonnés par contrat.


    **Tremay.** La question pertinente n''est pas « ont-ils misé sur une ligne neuve ? » — c''est **«
    leur perte était-elle plafonnée ? »**. Une PME ne meurt pas d''un pari perdu, elle meurt d''un pari
    non borné : financé par dette, adossé à une caution, ou assorti d''un défaut croisé. Je propose que
    nous établissions la structure réelle de leur engagement avant de signer. **Si Tremay avait une exposition
    structurellement identique à la nôtre — plafonnée, sans recours, sans contact avec son covenant —
    je retire ma recommandation devant le conseil.** C''est l''observation qui renverse ce choix, et je
    m''y engage.


    **Là où le DAF a raison.** L''irréversibilité de dix-huit mois est réelle et je ne la minimise pas.
    Et notre avantage résiste mal à un **pessimisme conjoint** : il faudrait que la branche d''échec coûte
    850 k€ au total (soit plus du double du plafond, en incluant nos coûts internes de désorganisation)
    pour que B cesse de battre A ; mais si l''on combine une probabilité réelle de 50 % **et** 200 k€
    de coûts internes non couverts par le plafond, le classement s''inverse. C''est la seule fragilité
    sérieuse du dossier — et c''est exactement ce que les conditions ci-dessous visent.


    ### 4. Repli et déclencheur


    Il n''y a pas de sortie contractuelle : le repli n''est donc pas « sortir », c''est « cesser d''aggraver
    ». **Déclencheur observable :** trésorerie sous 1,8 M€, **ou** deux jalons techniques manqués consécutivement,
    **ou** coût cumulé dépassant le plafond de 400 k€. Effet : gel immédiat de tout investissement discrétionnaire,
    retour au conseil sous 15 jours, report de charge sur la sous-traitance existante. Le DAF tient ce
    déclencheur et pilote le tableau de bord trimestriel (test de covenant, plancher de trésorerie, jalons).


    ### 5. Trois conditions préalables à la signature


    1. **Revue des échecs parmi les onze installations comparables** — appeler les sites concernés, vérifier
    qu''ils sont indépendants (intégrateurs différents) et qu''il ne s''agit pas d''un échantillon de
    survivants. Coût : quelques k€ et deux semaines. Signer sans l''avoir fait est le seul risque véritablement
    asymétrique du dossier.

    2. **Demander par écrit à Nordwerk un échéancier de réception technique** avec jalons. Même un refus
    nous informe.

    3. **Vérification de la structure d''engagement de Tremay** (§ 3).


    *Si l''offre Nordwerk expire avant l''achèvement de ces travaux, le conseil arbitre vendredi et ma
    recommandation reste B.*


    **Première action :** lundi matin, mandat au bureau d''études pour la revue des échecs et courrier
    à Nordwerk. Retour au conseil sous quinze jours, signature sous réserve à cette échéance.


    ---


    Deux chiffres méritent d''être retenus en séance : **46,2 %** (le seuil de probabilité en dessous
    duquel B perd son avantage — nous en sommes à 14 points) et **1,8 M€** (les pertes encore absorbables
    *après* l''échec de B avant de toucher le covenant). Dites-moi si vous voulez que je resserre la note
    pour une lecture en cinq minutes, ou que je développe l''annexe chiffrée du § 3.

    '
