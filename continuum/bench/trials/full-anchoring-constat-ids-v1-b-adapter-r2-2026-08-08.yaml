response:
  text: '# Avis — Renouvellement du logiciel de réservation et du parc de bornes


    **Pour le comité de direction du 28 · Échéance contractuelle : 31 octobre**


    Chaque constat ci-dessous est autonome : le comité peut en écarter un sans que les autres tombent.
    Pour chacun, j''indique l''élément du dossier sur lequel il repose et ce qui le renverserait.


    ---


    ## 1. Ce que je retiens du dossier


    **C1 — Le dossier mélange deux pannes distinctes.**

    L''indisponibilité des bornes est un problème de matériel vieillissant ; la perte de réservations
    est un problème logiciel daté de mars. Rien ne les relie dans les éléments transmis.

    *Repose sur :* les 32 h sur les deux seuls sites en bornes 2015, contre l''apparition des pertes de
    réservation en mars sur un parc logiciel commun aux 7 sites.

    *Serait renversé par :* une corrélation temporelle entre les pannes de bornes et les pertes de réservation
    sur un même site — vérifiable en croisant les deux journaux.


    **C2 — L''indisponibilité des bornes est réelle, concentrée, et d''ampleur modérée.**

    32 h sur 2 sites contre 9 h sur 5, soit environ 16 h/site/an contre 1,8 h — un facteur 9. Le parc
    2015 est en fin de vie. Mais 16 h par an et par site ne justifient pas à elles seules un changement
    de système.

    *Repose sur :* l''export technique.

    *Serait renversé par :* une répartition très inégale dans l''année (par exemple 25 h sur un seul mois),
    qui signalerait une défaillance en cours plutôt qu''une usure.


    **C3 — La régression de mars est probablement réelle, mais son périmètre n''est pas établi.**

    71 réclamations usagers sur 96 concentrées entre mars et juin, une ressaisie manuelle à Rive-Sud depuis
    mars, 12 agents qui datent l''origine de mars : trois sources indépendantes convergent sur la même
    date.

    *Repose sur :* la convergence de ces trois sources, dont deux ne dépendent pas de la mémoire des agents
    (les réclamations, la ressaisie).

    *Serait renversé par :* un autre changement survenu en mars (réseau, SIGB, réorganisation d''accueil)
    — à écarter explicitement.


    **C4 — L''écart Fontaine / Rive-Sud est le point aveugle du dossier.**

    Même version logicielle, même génération de bornes, même taux de panne matérielle : un site ressaisit
    5 h par semaine, l''autre ne signale rien. Une des deux affirmations est fausse, ou le problème n''est
    pas logiciel mais local (paramétrage, procédure d''accueil, poste de travail).

    *Repose sur :* la juxtaposition des notes de sites.

    *Serait renversé par :* une visite sur place à Fontaine établissant soit une absence réelle de pertes,
    soit un contournement silencieux. **C''est la vérification la plus rentable du dossier et elle coûte
    une demi-journée.**


    **C5 — L''enquête interne mesure une perception, pas des incidents.**

    61 % de 43 répondants, c''est environ 26 agents. Le taux de réponse de 69 % n''est pas neutre : on
    répond davantage quand on a un grief. Et plusieurs agents d''un même site peuvent décrire le même
    incident.

    *Repose sur :* la structure même de l''enquête (déclarative, non instrumentée).

    *Serait renversé par :* un comptage d''incidents horodatés confirmant l''ordre de grandeur déclaré.


    **C6 — La chute des réclamations après juin n''est pas une preuve de résolution.**

    25 réclamations sur les 8 autres mois. L''hypothèse la plus économique est que la ressaisie manuelle
    de Rive-Sud, démarrée en mars, absorbe désormais le défaut avant qu''il n''atteigne l''usager. Le
    problème serait masqué, pas corrigé — et payé en temps agent : environ 130 h depuis mars, soit ~6
    500 €/an à un seul site.

    *Repose sur :* la coïncidence entre le début du contournement et l''extinction des réclamations.

    *Serait renversé par :* un correctif éditeur livré entre juin et juillet, avec numéro de ticket.


    **C7 — La v4 n''est pas chiffrable aujourd''hui.**

    31 000 € est un prix partiel tant que la compatibilité avec les bornes 2015 est « à l''étude ». Si
    elle n''est pas assurée, il faut ajouter le remplacement du parc de deux sites, non chiffré au dossier.
    Et rien n''indique que la v4 corrige la régression de mars.

    *Repose sur :* la formulation de l''éditeur lui-même.

    *Serait renversé par :* un engagement écrit de compatibilité, ou un devis de remplacement des bornes
    qui rendrait l''opération finançable en connaissance de cause.


    **C8 — La solution libre n''est pas comparable en l''état.**

    « 30 % moins cher » est un coût de licence annoncé, pas un coût complet : il n''inclut ni la reprise
    de données, ni l''intégration, ni la conduite du changement. Le signal le plus informatif du réseau
    voisin n''est pas son prix, c''est que 2 sites sur 5 tiennent encore un registre papier **14 mois
    après**. Une migration inachevée à 14 mois est un échec de mise en œuvre ou un manque fonctionnel
    ; dans les deux cas c''est le coût que nous devons connaître.

    *Repose sur :* le fait rapporté des registres papier.

    *Serait renversé par :* une explication documentée de ces deux sites (choix local, cas d''usage marginal)
    — à obtenir des sites eux-mêmes, pas de leur direction.


    **C9 — La capacité informatique est la contrainte dominante, et elle est indépendante de tout le reste.**

    L''équipe passe de deux à une personne en octobre. La migration v4 comme la bascule vers le libre
    exigeraient toutes deux leur pic de charge exactement à ce moment. Aucune des deux n''est exécutable
    dans ces conditions.

    *Repose sur :* le calendrier de départ.

    *Serait renversé par :* un remplacement effectif recruté et opérationnel, ou une prestation externe
    d''accompagnement chiffrée et budgétée.


    **C10 — La remise de 12 % est une contrainte du vendeur, pas du réseau.**

    Le contrat court jusqu''au 31 octobre ; seule la remise impose de décider le 28. Et son assiette n''est
    pas précisée : appliquée à la seule première année, elle vaut environ 6 200 € ; appliquée aux trois
    années indexées, environ 19 800 €. Un écart de 1 à 3 sur le chiffre même qui sert à presser la décision.

    *Repose sur :* l''énoncé de l''offre commerciale et le calcul d''indexation à +7 %.

    *Serait renversé par :* une remise écrite, chiffrée en euros sur les trois ans, et détachée de la
    date du 30.


    ---


    ## 2. Ce que je recommande


    **Ne pas signer d''engagement de trois ans avant le 30. Demander à l''éditeur une prorogation de 6
    à 12 mois aux conditions actuelles, et décider ensuite sur pièces.**


    C''est une quatrième option, absente des trois soumises. Je l''assume : les trois options sur la table
    demandent toutes de trancher aujourd''hui une question qui ne peut pas l''être — la v4 est indécidable
    tant que la compatibilité n''est pas écrite (C7), le libre est inexécutable tant que l''équipe est
    à une personne (C9), et la reconduction à l''identique sur trois ans nous lie à un défaut dont nous
    ne connaissons ni l''étendue ni le correctif (C3, C6).


    **Dépendance :** cette recommandation tient si **un seul** de C7, C8 ou C9 tient. Le comité peut écarter
    les sept autres constats sans qu''elle tombe. C9 seul suffit, et C9 ne dépend d''aucune donnée contestable.


    **Si le comité refuse la quatrième option**, mon classement des trois est : reconduction à l''identique
    (sur la durée la plus courte négociable) > v4 > libre. La reconduction est la seule qui ne consomme
    pas de capacité informatique que nous n''avons pas.


    **L''argument le plus fort contre ma recommandation, et je le prends au sérieux :** la remise est
    un gain certain, immédiat, et sans doute non reconductible ; je propose de la sacrifier contre une
    réduction de risque qui reste hypothétique. Si la vérification de Fontaine montre que Rive-Sud est
    un cas isolé d''origine locale, alors le logiciel n''a pas de défaut généralisé, la reconduction de
    trois ans était le bon choix, et nous aurons payé jusqu''à 19 800 € cette prudence. C''est le scénario
    qui me donnerait tort, et c''est précisément pourquoi la vérification de Fontaine passe avant tout
    le reste. J''ajoute qu''une prorogation refusée par l''éditeur est un renseignement en soi sur la
    relation contractuelle qu''on nous propose de prolonger de trois ans.


    ---


    ## 3. Ce que j''engage dans les quinze jours


    Délais comptés à partir de la séance ; les points 1 et 2 seront lancés avant si le calendrier le permet,
    pour que le comité délibère sur des faits plutôt que sur des hypothèses.


    | # | Action | Échéance | Résultat observable |

    |---|---|---|---|

    | 1 | Lecture du contrat en cours : reconduction tacite, préavis de dénonciation, réversibilité et
    export des données | J+3 | Réponse écrite : le 31 octobre est-il une rupture de service ou une simple
    date ? |

    | 2 | Visite sur site à Fontaine (pas un courriel) : les réservations sont-elles perdues et absorbées
    sans être signalées ? | J+5 | Note d''une page, tranchée : oui ou non |

    | 3 | Courrier à l''éditeur, réponse écrite exigée sous 10 jours : (a) compatibilité v4 / bornes 2015,
    engagement ferme ; (b) qualification de la régression de mars, n° de ticket et calendrier de correctif
    ; (c) assiette et durée exactes de la remise ; (d) possibilité d''une prorogation de 6 à 12 mois |
    J+2 envoi, J+12 relance | Les réponses écrites, versées au dossier |

    | 4 | Comptage instrumenté sur 10 jours ouvrés, 7 sites : fiche d''incident normalisée (date, site,
    poste, notice, action corrective) | J+15 | Un nombre d''incidents/jour mesuré, substitué au « 61 %
    déclaré » |

    | 5 | Chiffrage du contournement Rive-Sud en ETP et en euros, et vérification qu''aucun autre site
    n''en tient un sans le dire | J+10 | Ligne budgétaire du coût caché actuel |

    | 6 | Contact du réseau voisin — les deux sites au registre papier directement, pas seulement leur
    direction | J+12 | Motif documenté des registres papier |

    | 7 | Saisine RH sur le remplacement du poste informatique d''octobre | J+5 | Décision de recrutement
    actée ou refusée, par écrit |


    **Condition d''arrêt.** Si à J+15 l''éditeur n''a pas répondu par écrit sur la compatibilité v4, la
    v4 est retirée du dossier — nous ne délibérerons pas une seconde fois sur un chiffre incomplet. Si
    le comité décide malgré cet avis de signer avant le 30, je demande que le point 2 (Fontaine) soit
    exécuté avant signature : c''est 48 heures et cela conditionne la valeur de trois ans d''engagement.


    **Point de bascule.** Deux résultats changeraient ma recommandation : (a) Fontaine confirme l''absence
    réelle de pertes → le défaut est local, la reconduction longue redevient raisonnable ; (b) l''éditeur
    produit un engagement écrit de compatibilité v4 **et** un correctif daté pour la régression de mars
    → la v4 redevient une option chiffrable, à condition que le point 7 ait abouti.

    '
