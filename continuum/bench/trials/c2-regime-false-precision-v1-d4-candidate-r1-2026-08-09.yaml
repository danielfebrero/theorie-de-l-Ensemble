response:
  text: '## Note au comité de direction


    **Objet :** magasins déficitaires — décision de fermeture

    **Recommandation : ne fermer aucun magasin ce trimestre. Le chiffre qui justifierait une fermeture
    n''existe pas encore, et les trois candidats rapportent de l''argent au groupe.**


    ---


    ### 1. Les trois magasins « déficitaires » sont bénéficiaires


    Le résultat par magasin inclut une quote-part des 6,4 M€ de frais de siège et de logistique, répartie
    au prorata du chiffre d''affaires. Cette quote-part ne disparaît pas quand un magasin ferme : elle
    se reporte sur les autres.


    | Magasin | Résultat affiché | Quote-part siège incluse | Ce que le site rapporte réellement au groupe
    |

    |---|---|---|---|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |

    | **Total** | **−288 000 €** | **402 000 €** | **+114 000 €** |


    Chacun des trois couvre ses loyers, ses salaires et ses charges propres, et laisse un excédent qui
    finance le siège. Fermer les trois ne rapporte pas 288 000 € : cela retire 114 000 € de résultat,
    et redistribue 402 000 € de frais centraux sur les 16 magasins restants. Mécaniquement, le comité
    verrait l''an prochain apparaître de nouveaux magasins « déficitaires » — ceux qui sont aujourd''hui
    juste au-dessus de zéro. C''est un engrenage, pas un redressement.


    **À signaler :** l''objectif de 300 000 € est très proche de la somme des trois déficits affichés
    (288 000 €). Si c''est de là qu''il vient, il repose sur une lecture comptable, pas sur un gisement
    d''économies.


    ### 2. Ce que coûterait réellement chaque fermeture


    - **Chambéry** — 6 ans de bail sans clause de sortie, indemnité estimée 1,1 M€. Payer 1,1 M€ comptant
    pour supprimer un site qui rapporte 32 000 € par an. Le magasin le plus proche est à 92 km : aucun
    report de clientèle à espérer. **Écarté sans réserve.**

    - **Nîmes** — murs en propriété, 1,9 M€ de valeur vénale. Quelqu''un proposera de vendre pour « faire
    » les 300 000 € en une fois : c''est un produit exceptionnel, pas une amélioration de la performance,
    et il ne se reproduit pas l''année suivante. Un lease-back apporterait la trésorerie mais créerait
    un loyer qui dégrade le résultat récurrent. C''est du financement, pas de l''exploitation.

    - **Vitry** — seule sortie gratuite du réseau (bail échu dans 7 mois), mais c''est aussi le meilleur
    contributeur des trois. Et 18 % de ses entrées sont des retraits de commandes web, dont le chiffre
    d''affaires est enregistré sur l''e-commerce : le site rend un service qu''il faudrait racheter ailleurs.
    Sa contribution réelle est donc supérieure à 63 000 €.


    Un point d''exécution : avec 430 salariés, une fermeture déclenche une procédure de licenciement collectif.
    Entre information-consultation, délais et indemnités, l''économie éventuelle ne serait pas pleine
    sur l''exercice prochain — l''objectif ne serait pas tenu même si la logique était bonne.


    ### 3. Sur quoi nous ne pouvons pas nous appuyer


    Les compteurs d''entrée sont fiables à ±2 %, mais ils comptent des **entrées, pas des acheteurs**.
    Sur Vitry, 18 % sont des retraits web. Toute conclusion du type « la fréquentation baisse donc le
    magasin est condamné » est irrecevable en l''état. Ces données restent excellentes pour une chose
    : caler les plannings d''heures sur les flux réels, à la demi-heure, sur 24 mois.


    Nous n''avons par ailleurs **aucun repère interne sur une fermeture** : l''enseigne n''en a jamais
    fait. Le coût d''exécution est aujourd''hui inconnu, pas faible.


    ### 4. L''objection la plus sérieuse


    *Si le siège coûte 6,4 M€ et que ce coût est incompressible, alors un magasin qui ne couvre pas sa
    part est subventionné à vie par les autres, et le réseau est surdimensionné.*


    Cette objection est recevable. Elle se tranche par un seul chiffre, que nous n''avons pas : **quelle
    part des frais centraux disparaît réellement quand un magasin ferme** (tournées logistiques, encadrement
    régional, licences, assurances). Si cette part évitable dépasse la contribution du site — 63 000 €
    à Vitry, 32 000 € à Chambéry, 19 000 € à Nîmes — la recommandation s''inverse pour ce site. C''est
    l''observation qui renverserait cette note, et c''est le premier travail engagé ci-dessous.


    ### 5. Ce que nous engageons


    1. **Frais centraux évitables par fermeture** — contrôle de gestion + logistique, ligne à ligne, livré
    sous 3 semaines. Chiffre décisif.

    2. **Coût d''exécution d''une fermeture** — indemnités, procédure, stocks, remise en état, avec le
    conseil social. Sous 3 semaines.

    3. **Taux de report entre magasins** — Nîmes est resté fermé 5 semaines en mars 2024 : c''est la seule
    mesure réelle dont nous disposons. Seuls les totaux mensuels des voisins subsistent, la mesure sera
    grossière et marquée par la saisonnalité de mars ; elle sera livrée avec ses limites, pas maquillée.
    Sous 3 semaines.

    4. **Bail de Vitry** — ouvrir la négociation immédiatement. L''échéance sans indemnité dans 7 mois
    est notre seule vraie position de force du réseau ; elle perd toute valeur si nous attendons. Objectif
    de baisse chiffré fixé cette semaine.

    5. **Plan de 300 000 € récurrents**, sur les deux gisements réels : les 6,4 M€ de frais centraux (−5
    % = 320 000 €) et l''ajustement des heures aux flux mesurés sur l''ensemble du réseau. Jalons mensuels
    validés par le comité.

    6. **Les trois sites sont informés** du périmètre, de l''échéance et des objectifs de contribution
    qui leur sont fixés — avec leurs équipes, qui tiennent les lignes de coûts concernées. Ils l''apprennent
    maintenant et participent, plutôt que de le découvrir dans quatre mois.


    ### 6. Repli


    Si, au **31 décembre**, le plan de 300 000 € a produit moins de 150 000 € d''économies engagées et
    vérifiées, l''arbitrage est rouvert immédiatement — avec, cette fois, les trois chiffres manquants
    en main. Vitry devient alors un candidat réel, à l''échéance naturelle de son bail et sans indemnité.


    **Première action, cette semaine :** commande du chiffrage des frais centraux évitables (point 1)
    et ouverture de la négociation du bail de Vitry (point 4).


    ---


    Deux points restent des hypothèses assumées, faute de pièces : le −5 % sur les frais centraux est
    un objectif, pas un gisement identifié ; et le calendrier d''une procédure sociale est une estimation
    qui doit être confirmée par le conseil.

    '
