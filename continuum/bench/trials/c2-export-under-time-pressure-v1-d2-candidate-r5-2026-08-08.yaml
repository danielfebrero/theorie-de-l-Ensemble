response:
  text: '## Les trois lignes


    ```

    B2 maintenue en marche, charge STABLE (pas de rampe), 2 gaz a fond. Roue commandee 21h40, remise en
    service B2 ~12h.

    Vibra B2 >=11,8 ou bruit/odeur anormal: ARRET CONTROLE immediat, pas de redemarrage. Sinon arret controle
    a 06h00.

    Si B2 arretee: prevenir hopital+EHPAD bout reseau AVANT, delester logements pour tenir depart >40C.
    Astreinte cadre.

    ```


    116, 114 et 116 caractères. Sans accents : les mains courantes GTC anciennes les rendent mal, et un
    « ARRÊT » illisible à 3 h ne vaut rien.


    ## Pourquoi ce choix


    **Le point décisif :** les 14 heures courent depuis la **commande**, pas depuis l''arrêt. J''ai donc
    commandé la roue avant de partir. Arrêter B2 maintenant ne ramènerait pas la remise en service plus
    tôt que midi — mais garantirait 5 MW gaz face à −14 °C, alors que le gaz ne tient le réseau que jusqu''à
    −7 °C. Autrement dit : arrêter ce soir ne gagne rien sur la réparation et rend certain le dommage
    qu''on cherche à éviter, sur l''hôpital et l''EHPAD précisément. On garde donc B2 pour passer le creux
    de 4 h, et on l''arrête à froid à 06 h, ce qui laisse la marge de refroidissement avant l''échange.


    **Le seuil à 11,8 et pas 12 :** 12 mm/s est l''arrêt constructeur, c''est-à-dire déjà la limite. La
    roue de rechange n''est utilisable que si B2 est arrêtée **avant** la casse. Un arrêt à 11,8 est un
    arrêt contrôlé ; un arrêt à 12 est une course avec la casse. Les 0,2 mm/s sont le prix du chemin de
    retour.


    **Le pire cas et qui l''encaisse :** casse non annoncée sous 11,8 mm/s — B2 neuf jours dehors, en
    froid, avec 5 MW pour 4 200 logements, un hôpital et deux EHPAD. Ce risque n''est pas supprimé, seulement
    réduit. C''est pourquoi la ligne 3 s''écrit « si B2 arrêtée » et non « si arrêt à 06 h » : elle couvre
    les deux cas, l''arrêt décidé et la casse.


    **Prévenir avant de délester :** l''hôpital et l''EHPAD sont en bout de réseau, ce sont eux qui prennent
    la chute de température de départ. Les prévenir *avant* leur laisse le délai pour armer leurs propres
    moyens ; les prévenir après, c''est leur annoncer un fait accompli à 4 h du matin.


    **Ce que je n''ai pas pu mettre :** le coût (3 200 € contre 900 €) ne figure nulle part — à −14 °C
    avec un hôpital en bout de réseau, il ne départage rien, et une ligne dépensée pour lui serait une
    ligne volée à la consigne d''arrêt.


    **Hypothèse à vérifier à ma reprise (~6 h 40) :** que les 14 h annoncées par le magasin de Nantes
    incluent bien transport *et* échange sur une chaudière arrêtée à 06 h. Si le magasin conditionne le
    délai à un arrêt plus précoce, l''arrêt de 06 h devra être avancé — c''est le seul paramètre qui ferait
    basculer le plan, et il ne se vérifie qu''au téléphone, à l''ouverture.

    '
