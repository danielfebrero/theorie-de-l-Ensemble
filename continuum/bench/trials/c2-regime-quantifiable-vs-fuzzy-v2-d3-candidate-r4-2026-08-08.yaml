response:
  text: '# Note au conseil — jeudi

    **Objet : affectation de l''enveloppe de 900 000 €, dossiers A (usinage) et B (direction qualité)**


    ## 1. Ce que nous demandons au conseil


    Engager la totalité de l''enveloppe cet exercice, en quatre lignes, dans cet ordre :


    | Ordre | Ligne | Montant | Ce que l''euro achète | Rendement annuel démontré |

    |---|---|---|---|---|

    | 1 | Nomination de l''adjointe comme directrice qualité désignée | 45 000 € | 11 mois de recouvrement
    avec le titulaire — le maximum disponible | non chiffrable (§2) |

    | 2 | Mission de transition du titulaire, **contractée en septembre**, exécutée après son départ |
    90 000 € | 12 mois de présence contractuelle au-delà du départ | non chiffrable (§2) |

    | 3 | Renouvellement du parc, 6 machines | 620 000 € | ~67 000 €/an d''arrêts et de rebuts évités
    → retour en 9,3 ans | 67 000 €/an |

    | 4 | Mandat de recrutement externe, provisionné en repli | 145 000 € | la sortie de secours du §5,
    financée d''avance | 0 si non déclenché |

    | | **Total** | **900 000 €** | | |


    Le tableau est classé par ordre d''engagement, pas par rendement. Le paragraphe suivant dit pourquoi.


    ## 2. Sur le tableau unique demandé


    Le président demande une colonne unique en euros. Elle est ici, remplie pour le dossier A, où elle
    repose sur cinq ans de maintenance horodatée et auditée. Elle est vide pour le dossier B, et il faut
    dire ce qui s''y trouverait si nous recopiions la cotation du cabinet RH : 35 % × 4,2 M€ = **1 470
    000 € de perte évitée**. Les deux lignes de B passeraient alors en tête, à un facteur cinq devant
    le renouvellement du parc, et le conseil trancherait d''un coup d''œil — sur le seul chiffre du dossier
    qui n''a aucune base.


    Ce chiffre a été produit en atelier par trois consultants dont aucun n''a travaillé dans le dispositif
    médical, sur une entreprise qui n''a jamais changé de directeur qualité et pour laquelle aucun comparable
    sectoriel n''est accessible. Il n''y a ni historique interne, ni référence externe : les 35 % ne sont
    l''estimation de rien. Nous ne les inscrivons pas dans la colonne.


    **Le refuser ne réduit pas le risque, et c''est le point.** Le risque du dossier B est réel et il
    est structurel — un interlocuteur unique reconnu par l''organisme notifié, deux clients hospitaliers
    à 31 % du chiffre d''affaires. Il n''est simplement pas de même nature que celui du dossier A, et
    un tableau qui les range sur le même indicateur ne les compare pas : il fait gagner le plus mal mesuré.


    ## 3. Dossier B — pourquoi il s''engage en premier


    Le pire cas du dossier A est cher et récupérable : une machine tombe définitivement, nous réparons,
    sous-traitons ou achetons en urgence. C''est de la variance.


    Le pire cas du dossier B ne l''est pas. Si le titulaire part sans que la relation à l''organisme notifié
    soit transférée à une personne nommée, la branche à craindre n''est pas la perte des deux clients
    — c''est la remise en question de la continuité de certification. Sans certification, nous ne vendons
    plus rien, et il n''y a pas de nouveau tour de table avant douze mois. Ce sont les 140 salariés qui
    l''encaissent, puis les hôpitaux qui s''approvisionnent chez nous. Onze mois est un délai qui ne se
    renégocie pas.


    **Les trois pistes RH ne sont pas des alternatives : elles portent sur deux objets différents.** L''adjointe
    répond à la question du successeur ; la mission de transition répond à la question du transfert. Nous
    prenons les deux, pour 135 000 €.


    Le recrutement externe à 280 000 € ne remplace ni l''un ni l''autre. Un candidat identifié maintenant
    arrive au mieux au sixième mois : cinq mois de recouvrement au lieu de onze, six fois le prix, et
    il n''hérite ni de la relation à l''organisme notifié ni de celle des deux hôpitaux — c''est-à-dire
    exactement les deux choses en jeu. Il faudrait de surcroît lui adjoindre la mission de transition,
    soit 370 000 €, ce qui sort une tranche de machines de l''enveloppe.


    **Deux points d''exécution, non négociables :**


    La mission de transition se signe **en septembre, pas au départ**. À onze mois moins un jour, le titulaire
    a toute la latitude de refuser ou de repricer. Le prix est le même aujourd''hui ; l''incertitude,
    non.


    La transmission aux deux clients hospitaliers se fait en visite conjointe, titulaire et adjointe ensemble,
    avant le départ — pas par un courrier d''annonce. Ces clients travaillent avec nous « à cause de lui
    » : ce qu''on leur doit, c''est un interlocuteur présenté, pas informé.


    ## 4. Dossier A — ce que les chiffres montrent vraiment


    Sur cinq ans audités : 362 heures d''arrêt par an, 42 600 € de coût direct annuel, plus 13 800 € de
    marge non produite (362 h × 38 €). La réduction du rebut de 4,1 % à 1,2 % libère environ 11 000 €
    de temps machine par an. **Total démontrable : environ 67 000 € par an, soit un retour sur 620 000
    € en 9,3 ans.** C''est long, et le conseil doit le savoir : sur les seuls chiffres du dossier, l''opération
    se rembourse à peu près au terme de la vie des équipements.


    Nous la recommandons quand même, pour une raison qui n''est pas dans le tableau : nous fabriquons
    du matériel de diagnostic. Un rebut à 4,1 % coûte de la matière ; un défaut non détecté qui part chez
    un hôpital coûte un rappel. Le dossier ne chiffre pas cette part — il manque le volume annuel de pièces
    usinées et le coût matière chargé d''une pièce rebutée. Ces deux nombres sont dans notre ERP et devraient
    figurer dans la note ; ils n''y sont pas, et nous le signalons plutôt que de les estimer.


    **Un levier de négociation à activer jeudi matin.** Le fournisseur garantit 96 % de disponibilité
    sur 7 ans avec pénalités. Or 1 810 heures d''arrêt sur cinq ans, rapportées à six machines, représentent
    de l''ordre de 3,5 % d''indisponibilité — soit une disponibilité actuelle d''environ 96,5 %. *(Hypothèse
    : ~1 700 heures de fonctionnement par machine et par an. Le chiffre exact est dans l''ERP ; il doit
    être vérifié avant le conseil.)* Si elle se confirme, **la garantie phare de l''offre est inférieure
    à notre situation actuelle et ne vaut rien.** Le taux de rebut de 1,2 % est annoncé comme garanti,
    mais sans pénalité associée. Nous demandons l''échange, à prix inchangé : les pénalités contractuelles
    basculent de la disponibilité vers le taux de rebut. C''est la seule ligne du dossier A qui porte
    la valeur.


    ## 5. Ce qui renverserait ce choix, et ce que nous ferions alors


    **L''observation qui renverse :** que l''adjointe ne tienne pas la position d''interlocutrice principale.
    Le test est disponible et gratuit — elle conduit le prochain échange avec l''organisme notifié comme
    interlocutrice principale, le titulaire présent mais silencieux.


    **Le déclencheur :** si au cinquième mois cet échange ne s''est pas tenu, ou s''il s''est mal tenu,
    ou si l''un des deux clients hospitaliers décline le contact nommé lors de la visite conjointe — le
    recrutement externe est lancé immédiatement.


    **Le financement du repli est déjà en place :** c''est la ligne 4 du tableau, 145 000 €, qui couvre
    la première année d''un recrutement externe. C''est pourquoi nous engageons un mandat de recherche
    dès cet exercice plutôt que de laisser cette somme se perdre. *Point à valider par la direction financière
    avant jeudi : qu''un mandat de recherche signé et provisionné constitue bien un engagement au titre
    de l''exercice. Si ce n''est pas le cas, les 145 000 € vont au renforcement de la métrologie et le
    repli est refinancé autrement — mais le repli, lui, reste.*


    ## 6. Première action


    Lundi : sortir de l''ERP les heures de fonctionnement par machine et la répartition des 47 pannes,
    et demander au fournisseur le basculement des pénalités sur le taux de rebut. Les deux tiennent en
    une journée et arrivent avant le conseil.

    '
