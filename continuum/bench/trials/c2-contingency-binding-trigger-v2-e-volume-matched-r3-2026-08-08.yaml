    # Note au comité de direction — Prestataire de paiement


    **De :** Direction des opérations · **Pour :** Présidence du comité · **Date :** 8 août 2026


    ## Recommandation


    **Option B, avancée de deux mois : bascule progressive démarrée le 7 septembre, 100 % du trafic sur
    Payflux le 3 novembre.**


    Le contenu de B est le bon ; la date proposée ne l''est pas. B tel que calendé (départ 3 novembre,
    fin mi-janvier) est la pire des trois trajectoires : il monte en charge *pendant* le pic et consomme
    deux mois de prolongation Solda. Démarré le 7 septembre, B arrive à 100 % le **3 novembre — la même
    date que l''option A**. La différence n''est pas la date d''arrivée : c''est ce qu''on sait en y arrivant,
    et ce qu''on peut faire si ça se passe mal.


    ## Les quatre chiffres qui tranchent


    **1. Une bascule intégrale place la fenêtre d''instabilité connue de Payflux juste avant le Black
    Friday.** Le pilote mesure 1,3 % d''échec les trois premières semaines. À 100 % du trafic dès le 3
    novembre, l''écart de 0,9 pt contre Solda coûte 162 transactions/jour, soit **143 k€ de GMV sur trois
    semaines** (~71 k€ nets d''une hypothèse de 50 % de relances abouties) — et la fenêtre se referme
    le 24 novembre, trois jours avant le Black Friday. À 10 % du trafic, la même fenêtre coûte 14 k€.


    **2. Le repli n''existe plus après la bascule.** 2,1 M de jetons transférés et compte Solda clos =
    6 semaines de réouverture *plus* une recollecte des empreintes de carte auprès des clients. Ce n''est
    pas une ligne de coût, c''est un événement de modèle économique. En décembre (volume estimé 1,5×,
    1,13 M€ de GMV/jour), un mois dégradé à 2 % d''échec coûte **562 k€**. Une journée d''interruption
    complète coûte 1,13 M€.


    **3. Les 99,9 % contractuels de Payflux autorisent 44 minutes d''indisponibilité par mois sans manquement.**
    Au volume d''un jour de pic, ces 44 minutes valent **69 k€**. Face à cela, nous n''avons aucune mesure
    de Payflux sur *notre* trafic — un pilote chez un autre marchand, et une clause. Face à Solda, nous
    avons douze mois de mesures sur le nôtre.


    **4. La clause de sortie à 90 jours est sans valeur sous l''option A.** Juridiquement ouverte, opérationnellement
    morte : au moment où le Black Friday nous dira ce que vaut Payflux, Solda sera clos. Sous B, avec
    signature au 1er septembre, la fenêtre sans pénalité court **jusqu''au 30 novembre — elle couvre le
    Black Friday**, Solda encore ouvert. C''est une option gratuite que seule B permet d''exercer.


    ## Ce que ça coûte


    | Poste (an 1) | Option A | Option B avancée |

    |---|---|---|

    | Économie brute vs renouvellement Solda | 500 k€ | 500 k€ |

    | Payflux démarré 2 mois plus tôt (sept.–oct.) | — | −150 k€ |

    | Double run 45 k€/mois (sept. → déc.) | — | −180 k€ |

    | Prolongation Solda décembre (assurance pic) | — | −130 k€ |

    | Pertes transactionnelles, fenêtre d''instabilité | −71 k€ | −7 k€ |

    | **Économie nette an 1** | **~430 k€** | **~40 k€** |

    | **Économie an 2 et suivantes** | 500 k€ | 500 k€ |


    **L''écart est de 390 k€ sur un seul exercice.** C''est le prix d''une option sur le trimestre qui
    fait notre année, contre une exposition de 562 k€ pour un seul mois dégradé et un scénario défavorable
    non assurable. À partir de l''an 2, les deux options sont identiques. Nous recommandons de payer les
    390 k€.


    ## Le contre-argument, et pourquoi il ne tient pas


    *« A encaisse 500 k€ tout de suite ; B en dépense 92 % en assurance. »* Exact sur un an, faux sur
    la durée : l''économie est récurrente, la décaler d''un exercice coûte un exercice, la rater coûte
    le pic. L''argument secondaire — « le ramp étale l''instabilité plus longtemps » — est faux arithmétiquement
    : le pilote montre une instabilité fonction du temps écoulé, pas du volume. À 10 % puis 25 % puis
    50 %, nous absorbons l''équivalent de 0,85 semaine à pleine charge, contre 3 semaines sous A.


    ## Point de vigilance à porter au contrat


    Le régime établi de Payflux (0,5 %) reste **0,1 pt au-dessus de Solda (0,4 %)**. Cet écart vaut 276
    k€ de GMV par an, ~138 k€ nets — de façon permanente. **L''économie réelle n''est donc pas 500 k€/an
    mais ~360 k€/an.** À exiger avant signature, pendant que Payflux veut le contrat : un SLA de taux
    d''autorisation (échec ≤ 0,45 % en régime établi, mesuré sur le trafic Vireo, assorti d''avoirs de
    service).


    ## Ce qu''on fait lundi


    | Quand | Quoi | Qui |

    |---|---|---|

    | **Lun. 10 août** | Ouvrir la négociation Payflux : SLA taux d''autorisation ≤ 0,45 %, et **signature
    calée au 1er septembre** pour que la sortie sans pénalité couvre le Black Friday | Achats |

    | **Lun. 10 août** | Instrumenter le tableau de bord par prestataire ; alerte astreinte automatique
    si échec Payflux > 0,8 % sur 30 min | Supervision paiement |

    | **Lun. 10 août** | Plan de transfert des jetons **par tranches** — interdiction formelle de transférer
    les 2,1 M en un lot ou de clore Solda avant le 31 décembre | Technique |

    | **1er sept.** | Signature Payflux | Direction générale |

    | **7 sept.** | 10 % du trafic sur Payflux (~1 800 tx/jour) | Technique |

    | **Avant le 15 oct.** | **Notifier Solda de la prolongation au mois le mois.** Jalon non négociable
    : la notification ne coûte rien tant qu''aucun mois n''est consommé ; ne pas notifier ferme définitivement
    le seul repli existant | Achats |


    ## Portes de décision et conditions d''arrêt


    - **25 sept.** (3 sem. à 10 %) — échec ≤ 0,6 % → passage à 25 %. Échec > 1,0 % → retour à 0 % et sortie
    sans pénalité.

    - **9 oct.** — ≤ 0,55 % sur 2 semaines → 50 %.

    - **23 oct.** — ≤ 0,5 % sur 2 semaines consécutives → 100 % au 3 novembre. Sinon on reste au palier
    et on renouvelle Solda.

    - **Gel du 15 nov. au 5 janv.** — aucune modification de répartition pendant le pic, sauf repli d''urgence
    (levier 15 min, astreinte 24/7).

    - **15 déc.** — décision de conserver ou non Solda en janvier (130 k€).

    - **Clôture Solda : 31 déc. ou 31 janv.** Mur absolu confirmé par écrit : **28 février**, non reconductible.
    Aucune ligne de ce plan n''en dépend au-delà du 31 janvier.


    ---


    *Hypothèses : 18 000 tx/jour × 42 € = 756 k€ de GMV/jour, ~276 M€/an. 0,1 pt d''échec = 276 k€ de
    GMV/an. Récupération par relance estimée à 50 % (à confirmer par la supervision). Volumes : Black
    Friday 3× la normale, décembre 1,5×. Payflux 75 k€/mois. Le chiffre de 310 k€ circulé pour l''option
    B n''intègre pas le coût de prolongation Solda ; le tableau ci-dessus le reconstruit poste par poste.*


    ---


    Trois points sur lesquels attirer votre attention avant vendredi :


    - **Deux hypothèses sont à valider par la supervision paiement**, et elles déplacent les chiffres
    : le taux de récupération par relance (j''ai retenu 50 %) et les multiplicateurs de volume au pic
    (3× / 1,5×). Si la relance récupère 80 %, l''écart entre A et B se resserre d''environ 40 k€ — pas
    assez pour changer le verdict.

    - **Le jalon du 15 octobre est le seul irréversible du dossier** et il ne dépend d''aucune des deux
    options : notifier Solda ne coûte rien tant qu''aucun mois n''est consommé, ne pas notifier supprime
    tout repli. Il devrait figurer au relevé de décisions même si le comité choisit A.

    - **Le catalogue des stations de mesure joint en annexe n''a aucun lien avec ce dossier** et n''a
    pas été utilisé.

