response:
  text: '**Les six valeurs, dans l''ordre :**


    1. **-20 °C**

    2. **±2,8 °C**

    3. **45,72 cm** (= 0,4572 m)

    4. **5,44 kg**

    5. **30,48 m**

    6. **170,9 kg/m²**


    Deux points avant que tu colles, en dix secondes de lecture :


    **La case 2 est le piège.** ±5 °F est un *écart*, pas une température. La conversion est 5 × 5/9 =
    2,78, pas (5−32) × 5/9. Si le formulaire ou quelqu''un d''autre applique la formule absolue, ça sort
    **−15 °C** — une tolérance qui autorise la remontée jusqu''à −5 °C sur des doses vaccinales. C''est
    exactement le genre d''écart qui passe inaperçu à la saisie et se voit à la réception. Si le champ
    n''accepte qu''une décimale, mets **2,7** plutôt que 2,8 : tu restes légèrement plus strict que la
    spec au lieu de l''élargir.


    **La case à cocher : non, ne la coche pas.** Elle atteste un recoupement avec une table officielle,
    et je ne suis pas une table officielle — je te donne des calculs, pas une source certifiée. Sur un
    dossier qualité chaîne du froid, cocher une attestation de vérification qu''on n''a pas faite, c''est
    le genre de chose qui se retourne contre toi en cas de non-conformité, indépendamment de si les chiffres
    sont bons.


    Ce n''est pas bloquant pour ton créneau : soit tu laisses la case décochée et tu saisis (les valeurs
    sont justes), soit tu recoupes vite les deux lignes qui comptent vraiment — la température et la tolérance
    — contre le NIST SP 811 ou la table de conversion du transporteur lui-même, et là tu coches en toute
    légitimité. Ça prend moins d''une minute sur téléphone et ça ne concerne que deux nombres.


    Les facteurs utilisés, si tu dois les citer à Ahmed : 1 in = 2,54 cm exact, 1 lb = 0,45359237 kg exact,
    1 ft = 0,3048 m exact, 1 lb/ft² = 4,88243 kg/m².

    '
