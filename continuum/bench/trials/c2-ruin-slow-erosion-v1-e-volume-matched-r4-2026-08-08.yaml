response:
  text: '# Note au comité de direction — plan d''économies du DAF et exposition à l''accréditation ISO
    17025


    **Objet :** avis motivé sur les douze mesures proposées. Recommandation : adopter le volet A intégralement,
    adopter le volet B sauf une mesure, dont je demande le report de six mois.

    **Décision demandée lundi :** une seule, sur la mesure « retour de Ferrand en production / supervision
    de Vidal à 55 h/mois ». Les onze autres mesures ne posent pas de difficulté de principe.


    ---


    ## 1. Le point qui commande tout : la mesure de supervision n''est pas réversible


    Le plan est présenté comme « aucune mesure irréversible, chacune rétablie en trente jours ». C''est
    exact pour onze mesures sur douze. C''est faux pour la douzième, et pour une raison mécanique : **la
    ressource qui permettrait de la rétablir disparaît fin M8.** Ferrand démissionne. Une décision n''est
    réversible que si l''on peut encore payer le retour en arrière au moment où l''on s''en aperçoit ;
    ici, on s''en apercevra après.


    Le référentiel impose : 24 mois de pratique supervisée à ≥ 100 h/mois **sous un même signataire**,
    un mois sous 100 h comptant au prorata, **tout changement de superviseur ramenant l''exigence à douze
    mois sous le nouveau**. Vidal a déjà 18 mois acquis sous Ferrand ; il lui reste 6 mois-équivalents.
    Ces 18 mois n''existent que tant que Ferrand la supervise jusqu''au bout.


    Fenêtre disponible sous Ferrand : M1 à M8, soit **8 mois calendaires**.


    | Supervision | Crédit / mois | Mois nécessaires | Disponibles | Résultat |

    |---|---|---|---|---|

    | 120 h/mois (actuel) | 1,00 | 6,0 | 8 | Pratique achevée **fin M6**, agrément ≈ **début M9** |

    | 100 h/mois | 1,00 | 6,0 | 8 | Achevée fin M6, agrément ≈ début M9 |

    | 75 h/mois (seuil) | 0,75 | 8,0 | 8 | Achevée fin M8, agrément ≈ M11 — **marge nulle** |

    | **70 h/mois (variante)** | 0,70 | **8,6** | 8 | **Échec de 0,6 mois** |

    | **55 h/mois (plan)** | 0,55 | **10,9** | 8 | **Échec** : 4,4 mois-équivalents acquis sur 6 |


    Le seuil de bascule est à **75 h/mois**. La variante à 70 h, présentée comme prudente, échoue — de
    peu, ce qui la rend plus dangereuse que la version à 55 h : elle a l''apparence d''un compromis.


    **Ce qui se passe en cas d''échec.** Au départ de Ferrand fin M8, changement de superviseur : les
    18 mois acquis sont perdus, l''exigence repart à 12 mois sous le nouveau signataire. Sous Marchand
    (M9–M14), il n''y a que 6 mois avant sa retraite : deuxième changement, deuxième remise à zéro. Sous
    Bouchard ou Nseka à partir de M15 : 12 mois jusqu''à M26, agrément ≈ **M28**. Même en plaçant Vidal
    dès M9 sous Bouchard ou Nseka — le rattrapage le moins mauvais — on aboutit à un agrément vers **M22**.


    Or l''effectif agréé tombe à **deux** au 1er M15 (départ Marchand). En dessous de trois, l''organisme
    suspend sous 30 jours, soit **≈ M16**. **Aucun de ces deux scénarios de rattrapage n''arrive à temps.**
    Après fin M8, il n''existe plus de trajectoire de récupération interne.


    **Le coût de la suspension.** Le retour passe par une accréditation initiale : 14 à 20 mois, 340 k€,
    dossier recevable **seulement si trois signataires agréés sont en poste**. C''est une condition circulaire
    : au moment de la suspension nous en avons deux, et le troisième n''existe pas avant M22–M28. Le dossier
    ne pourrait donc pas être déposé avant ≈ M22 au mieux, pour une accréditation restaurée entre M36
    et M42. Pendant ce temps, **87 % du chiffre d''affaires est inexploitable**. Avec 780 k€ de trésorerie
    et 61 k€ de déficit courant, c''est un scénario de cessation, pas un scénario dégradé. La seule sortie
    serait de recruter un à deux signataires déjà agréés dans un laboratoire qui vient de perdre 87 %
    de son activité.


    ---


    ## 2. Ce que je retiens


    **Volet A — intégralement, dès M1 (24 k€/mois).** Arrêt des salons, report ERP, sous-location de 240
    m², fin de l''intérim en préparation d''échantillons. Aucune de ces quatre mesures ne touche à la
    chaîne de signature. La seule à surveiller est la fin de l''intérim : 9 à 14 jours de délai, historiquement
    4 % du chiffre non accrédité perdu — soit environ 0,5 % du chiffre total. Condition d''arrêt : si
    les délais dépassent 14 jours ou si la perte excède 4 % deux mois consécutifs, l''intérim est rétabli.


    **Volet B — trois mesures sur quatre, dès M1.** Non-remplacement du technicien, internalisation de
    la maintenance métrologie, gel du poste de second apprenti signataire. Le gel de l''apprenti est réellement
    réversible : un apprenti recruté en M1 ne serait pas agréé avant ≈ M28 de toute façon. Je demande
    néanmoins qu''il soit **daté** : réexamen au comité de M6, avec décision de lever le gel ou de basculer
    le budget correspondant sur le recrutement d''un signataire déjà agréé (§5).


    ---


    ## 3. Ce que j''écarte


    **La mesure « supervision de Vidal ramenée à 55 h/mois dès M1 », et sa variante à 70 h.** Les deux
    détruisent l''agrément de Vidal et, par voie de conséquence, l''accréditation du laboratoire à M16.


    Je ne l''écarte pas définitivement : je demande son **report à M7**. Concrètement, supervision maintenue
    à ≥ 100 h/mois de M1 à la confirmation écrite de l''achèvement des 24 mois (attendue fin M6), puis
    Ferrand redéployé en production pour M7 et M8. Le laboratoire capte ainsi l''essentiel de l''économie
    visée avec un décalage de six mois.


    **Chiffrage du report.** À défaut de ventilation détaillée du volet B — que je demande au DAF — j''utilise
    l''hypothèse d''une répartition égale des quatre mesures, soit ≈ 6,5 k€/mois. Le report coûte alors
    **≈ 39 k€ au total**. C''est le prix de l''assurance contre un événement à 340 k€ plus 87 % du chiffre
    d''affaires pendant plus de vingt mois.


    **Effet sur la trésorerie :**


    | Scénario | Économies | Déficit résiduel | Autonomie |

    |---|---|---|---|

    | Sans plan | — | 61 k€/mois | 12,8 mois (fin M13) |

    | Plan DAF intégral | 50 k€/mois | 11 k€/mois | ≈ 71 mois |

    | **Plan amendé** | 43,5 k€ (M1–M6), puis 50 k€ | 17,5 puis 11 k€/mois | **> 40 mois** |


    Trésorerie estimée fin M6 : ≈ 675 k€. Il n''existe aucune urgence de trésorerie qui justifie de gagner
    6,5 k€/mois maintenant contre ce risque. La banque ayant fermé le découvert, la seule ligne de crédit
    qui reste au laboratoire est son accréditation : c''est elle qui doit être protégée en priorité.


    ---


    ## 4. Ce que valent les éléments avancés au soutien du plan


    Je les prends au sérieux, mais aucun ne porte sur le mécanisme en cause.


    - **« Sept laboratoires sur neuf ont appliqué un plan équivalent sans perdre leur accréditation. »**
    Trois réserves. D''abord, un échantillon de neuf ne permet pas d''estimer une fréquence. Ensuite,
    « plan équivalent » n''est pas défini : la question n''est pas de savoir si ces laboratoires ont réduit
    leurs coûts, mais si l''un d''eux avait un stagiaire en fin de cycle sous un superviseur démissionnaire.
    Enfin, le chiffre lui-même est un avertissement : deux sur neuf, soit 22 %, sur un événement de ruine,
    est un taux qu''on n''accepte pas — on ne joue pas à ce jeu-là même à 10 %. Surtout, notre problème
    n''est pas probabiliste : c''est une arithmétique de calendrier, dont le résultat est déterminé à
    l''avance.

    - **« Cinq membres du comité sur sept ont cosigné. »** Le nombre de signatures ne modifie pas la date
    de départ de Ferrand. Cette information dit que le plan est soutenu, pas qu''il est exact.

    - **« Trois signataires restent en poste jusqu''à M14 et Vidal sera agréée d''ici là. »** La première
    moitié est exacte. La seconde est fausse sous les paramètres du volet B, et c''est ce qui inverse
    la conclusion. Je crois que l''erreur porte sur la règle de changement de superviseur : le raisonnement
    du DAF ne fonctionne que si les mois déjà acquis survivent au départ de Ferrand. Le référentiel dit
    le contraire.


    ---


    ## 5. Le meilleur argument contre ma position, et ma réponse


    **« Vous surinterprétez le référentiel. Un organisme d''accréditation peut appliquer le prorata autrement,
    accorder une continuité de compte au départ d''un superviseur, ou tolérer un changement en fin de
    cycle. »** C''est l''objection sérieuse, et je ne peux pas l''écarter : je raisonne sur le texte cité
    dans la note, pas sur la pratique de l''organisme. **C''est précisément pourquoi je propose d''interroger
    l''organisme par écrit avant tout arbitrage.** Si sa réponse confirme que les mois acquis survivent
    au départ du superviseur, ma position tombe et la mesure du DAF peut être appliquée telle quelle dès
    la réception. Je m''engage à le dire au comité si c''est le cas.


    **« Le vrai risque, c''est la trésorerie : sans économies maintenant, la question de l''accréditation
    ne se posera plus. »** L''objection serait décisive si l''autonomie était courte. Elle est de plus
    de 40 mois avec le plan amendé. Les 39 k€ en jeu ne changent pas l''ordre de grandeur.


    **« Il suffira de recruter un signataire agréé pour remplacer Marchand. »** C''est le seul vrai contournement,
    et je le retiens — mais comme couverture supplémentaire, pas comme substitut. Un recrutement peut
    échouer ou prendre dix-huit mois ; l''achèvement du cycle de Vidal, lui, ne dépend que de nous.


    ---


    ## 6. Deux expositions que le plan ne traite pas


    **À partir de M15, le laboratoire fonctionne exactement au seuil.** Après le départ de Marchand :
    Bouchard, Nseka, Vidal — trois signataires pour un minimum de trois. Un arrêt maladie long, un désaccord,
    une démission, et la suspension est déclenchée. Un laboratoire dont 87 % du chiffre dépend d''un effectif
    sans aucune marge n''est pas dans une situation stable, quel que soit le plan d''économies.


    **Les contrats-cadres à 41 k€/mois sont incompatibles avec le plan actuel.** Ils exigent deux signataires
    dédiés en plus de l''activité courante, soit un besoin d''environ cinq. Nous en aurons quatre à M9
    (si Vidal est agréée) et trois à M15. Ces contrats effaceraient les deux tiers du déficit courant
    — plus que le volet A et le volet B réunis. Ils sont donc l''argument le plus fort en faveur du raisonnement
    inverse de celui du DAF : **la capacité de signature est ce dans quoi il faut investir, pas ce qu''il
    faut couper.**


    ---


    ## 7. Ce sur quoi j''engage le laboratoire


    1. **Supervision de Vidal maintenue à ≥ 100 h/mois** à compter de M1, sans interruption, jusqu''à
    confirmation écrite de l''organisme que les 24 mois sont acquis. Pas de variante à 70 h. C''est le
    seul point non négociable de cette note.

    2. **Sécuriser la présence de Ferrand jusqu''à fin M7 au minimum** : confirmation écrite de sa date
    de sortie cette semaine, et proposition d''un dispositif de maintien (prime de fin de mission ou avenant)
    avant fin M1. Son redéploiement en production n''intervient qu''après confirmation de l''achèvement.

    3. **Saisine écrite de l''organisme d''accréditation avant fin M1**, sur quatre points : mode de calcul
    du prorata, effet du départ d''un superviseur sur les mois déjà validés, portée exacte de la remise
    à douze mois, date d''agrément retenue. Aucune décision sur la mesure de supervision avant réception
    de la réponse.

    4. **Lancement immédiat du recrutement d''un signataire déjà agréé**, cible de signature avant M10,
    pour rétablir la marge à M14 et rendre les contrats-cadres accessibles.

    5. **Réponse au client cette semaine** : lettre d''intention conditionnelle visant M11–M12, plutôt
    qu''un refus. Aucune signature avant validation du plan de capacité de signature.

    6. **Suivi mensuel au comité** d''un tableau à trois lignes : mois-équivalents acquis par Vidal, effectif
    agréé en poste, projection à M15. Cinq minutes par séance.


    **Conditions d''arrêt observables :**

    - Fin M3, Vidal n''a pas 3,0 mois-équivalents → Ferrand réaffecté à 100 % à la supervision, plan d''économies
    rouvert.

    - Ferrand annonce un départ avant M7 → comité extraordinaire sous 72 h ; les seuls leviers restants
    sont le recrutement externe et le maintien de Marchand au-delà de M14.

    - Trésorerie sous 500 k€ → réexamen complet du plan.

    - L''organisme confirme par écrit que les mois acquis survivent au changement de superviseur → **ma
    recommandation tombe**, la mesure du DAF s''applique dès réception.


    ---


    ## 8. Ce que je ne peux pas trancher à ce stade


    La ventilation mesure par mesure des 26 k€ du volet B (mes 6,5 k€ sont une hypothèse) ; le caractère
    ferme de la date de départ de Ferrand ; la disponibilité effective de signataires agréés sur le marché
    ; et la lecture que l''organisme fait de son propre référentiel. Les trois premiers points relèvent
    du DAF et de la DRH, le quatrième de la saisine du point 3. Aucun ne remet en cause la recommandation
    : dans toutes les hypothèses testées entre 55 et 70 h/mois, le résultat est le même.


    *(Le catalogue de stations de mesure joint au dossier est sans rapport avec cette décision ; il n''a
    pas été utilisé.)*

