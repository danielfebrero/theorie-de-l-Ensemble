response:
  text: '# Note au conseil — arbitrage de l''enveloppe de 900 000 €

    **Objet : dossiers A (machines) et B (succession qualité) — décisions demandées**


    ---


    ## 1. Ce que nous demandons au conseil


    1. **Engager le dossier B sous quinze jours**, pour 135 000 € (promotion de l''adjointe + mission
    de transition), et réserver 280 000 € de mandat de recrutement externe à déclenchement conditionnel.

    2. **Acheter 4 machines sur 6**, et non le parc complet : 413 333 €.

    3. **Ne pas classer les deux dossiers dans un ordre unique.** Le tableau demandé est fourni ci-dessous,
    mais son classement n''est valable qu''à l''intérieur du dossier A.


    ---


    ## 2. Le tableau unique demandé


    | # | Ligne | Montant | Gain annuel | Rendement | Base du chiffre |

    |---|---|---|---|---|---|

    | 1 | A — 4 machines les plus défaillantes | 413 333 € | ~45 000 € | 10,9 %/an | Maintenance horodatée,
    auditée, 5 ans |

    | 2 | A — les 2 machines restantes | 206 667 € | ~11 000 € | 5,3 %/an | Idem |

    | — | B — promotion de l''adjointe | 45 000 € | non calculable | — | Aucune donnée |

    | — | B — mission de transition | 90 000 € | non calculable | — | Aucune donnée |

    | — | B — recrutement externe | 280 000 € | non calculable | — | Aucune donnée |


    **Deux avertissements sur ce tableau.**


    Le gain du dossier A est un *coût évité*, pas un profit : 213 000 € d''immobilisation sur 5 ans (42
    600 €/an) plus 1 810 h × 38 € de marge perdue (13 756 €/an), soit ~56 400 €/an répartis selon la concentration
    des pannes. La meilleure ligne du tableau se rembourse en 9 ans. Ce n''est pas un tableau d''investissements
    rentables, c''est un tableau de saignées à arrêter.


    Les lignes B portent « non calculable » et non un zéro. Le seul chiffre disponible — 35 % de rupture,
    4,2 M€ de perte, 1,47 M€ de perte attendue — vient de trois consultants n''ayant jamais travaillé
    dans le dispositif médical, en atelier, sans historique, sans cas comparable. Inséré dans ce tableau,
    il écraserait toutes les autres lignes et emporterait seul les 900 000 €. **Nous refusons de faire
    trancher le conseil par un nombre qui n''a pas de source.** Il signale une inquiétude ; il ne mesure
    rien.


    ---


    ## 3. Dossier B — c''est le calendrier qui décide, pas le rendement


    Nous n''avons pas besoin de la probabilité des consultants. Nous avons nos propres livres : **31 %
    du chiffre d''affaires** chez deux clients qui déclarent travailler avec nous à cause d''une personne,
    et **un seul interlocuteur reconnu par l''organisme notifié**. Ces deux faits viennent de notre comptabilité
    et de nos dossiers de certification.


    La question n''est donc pas « quel rendement ». Elle est : *combien acceptons-nous de payer pour ne
    pas mettre en jeu un tiers de notre activité ?* À 135 000 €, la question ne se discute pas.


    Trois éléments rendent ce dossier non reportable :


    - **Onze mois, et l''enveloppe court sur douze.** Il n''y a pas de second tour de table. Reporter
    B, c''est le supprimer.

    - **Le levier disparaît au départ.** Une mission de transition se négocie avec un salarié en poste,
    pas avec un retraité. Elle doit être signée maintenant, même si elle s''exécute après.

    - **L''irréversibilité n''est pas symétrique.** Une machine non achetée cette année s''achète l''année
    prochaine. Une passation non faite ne se rattrape pas.


    Les trois pistes RH ne sont pas des alternatives : l''adjointe assure la continuité interne et les
    9 auditeurs ; la mission de transition achète le transfert vers l''organisme notifié et la réintroduction
    chez les deux clients. Nous engageons les deux. Le recrutement externe est une assurance, pas un plan
    B redondant : mandat signé maintenant, déclenchement au mois 6 sur critères écrits (organisme notifié
    ayant accepté l''interlocutrice, un audit client passé sans l''intéressé). S''il ne se déclenche pas,
    les 280 000 € ne sont pas dépensés.


    ---


    ## 4. Dossier A — 4 machines, pas 6


    Le fournisseur propose **les mêmes conditions unitaires en tranches**. Il n''y a donc aucun rabais
    de volume à perdre. Acheter les 6 aujourd''hui plutôt que 4, c''est payer **206 667 € pour éviter
    environ 11 000 €/an** de coûts sur les deux machines les *moins* défaillantes du parc. Attendre un
    an sur ces deux-là est douze fois moins cher que les acheter maintenant.


    Les 47 pannes et 1 810 heures ne sont pas réparties uniformément sur six machines. Le journal étant
    horodaté et audité, le classement machine par machine se sort en une demi-journée. Les 4 retenues
    doivent être celles qui portent l''essentiel des arrêts.


    **Deux réserves à porter au procès-verbal.** L''engagement de 96 % de disponibilité doit être comparé
    à notre taux réel actuel, que nous ne savons pas calculer faute de connaître les heures d''ouverture
    du parc — il n''est pas exclu qu''il soit déjà proche de 96 %. Et l''écart de rebut, 4,1 % contre
    1,2 %, n''est pas chiffré faute de volume produit et de valeur matière : c''est pourtant le seul poste
    capable de faire passer ce dossier d''un retour à 9 ans à un retour acceptable.


    ---


    ## 5. Répartition de l''enveloppe


    | Poste | Montant | Engagement |

    |---|---|---|

    | B — adjointe + mission de transition | 135 000 € | Immédiat |

    | B — mandat de recrutement externe | 280 000 € | Signé, déclenchement mois 6 |

    | A — 4 machines | 413 333 € | Commande sous 60 jours |

    | A — qualification IQ/OQ/PQ, formation opérateurs | 71 667 € | Avec la commande |

    | **Total** | **900 000 €** | |


    La dernière ligne n''est pas un solde de confort. En dispositif médical, une machine neuve ne produit
    pas tant qu''elle n''est pas qualifiée sous notre système qualité — **et c''est le directeur qualité
    qui signe cette qualification**. Les deux dossiers ne sont pas indépendants : installer quatre machines
    au mois 10, sans successeur crédible auprès de l''organisme notifié, est le pire scénario possible.
    La qualification doit être conduite pendant qu''il est encore là, ou couverte par sa mission de transition.


    ---


    ## 6. Avant jeudi


    Deux chiffres à produire, une demi-journée chacun : **le classement des 6 machines par heures d''arrêt**
    (journal de maintenance) et **le coût annuel du rebut à 4,1 %** (ERP : volume produit × valeur matière).
    Le premier fixe quelles machines on achète. Le second peut justifier d''en acheter davantage — auquel
    cas nous reviendrons devant vous, arbitrage à faire contre la réserve de recrutement.


    **Ce que nous ne savons pas :** si l''adjointe sera acceptée par l''organisme notifié, si les deux
    clients hospitaliers suivront, et quelle est notre disponibilité machine réelle. Aucun de ces trois
    points ne s''améliore en attendant.

    '
