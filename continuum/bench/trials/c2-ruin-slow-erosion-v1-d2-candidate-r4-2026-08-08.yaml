response:
  text: '# NOTE AU COMITÉ DE DIRECTION


    **Objet :** Plan d''économies du DAF — avis et engagements

    **Séance :** lundi

    **Classement :** décision engageant la continuité d''exploitation


    ---


    ## 1. Ce que je retiens


    **Le diagnostic de trésorerie du DAF est juste, et son plan est majoritairement bon.** 780 k€ de trésorerie,
    61 k€/mois de déficit : sans action, l''extinction est à ~12,8 mois. Il faut agir en janvier, pas
    en juin.


    Je retiens :


    - **Le volet A en entier** (24 k€/mois), sous deux réserves de rédaction (§4).

    - **Trois des quatre mesures du volet B** : gel du poste de second apprenti signataire, non-remplacement
    d''un technicien, internalisation de la maintenance métrologie — cette dernière avec une exclusion
    explicite (§4).


    Avec le volet A seul, le déficit tombe à 37 k€/mois et l''autonomie passe à ~21 mois. Avec A + B amputé
    de la mesure Ferrand, le déficit tombe entre 11 et 37 k€/mois selon la part exacte de cette mesure
    dans les 26 k€ — chiffre que je demande au DAF de ventiler avant lundi. **Dans tous les cas de figure,
    nous ne sommes pas dans une urgence à six mois.** C''est ce qui rend la mesure suivante inutile à
    prendre.


    ---


    ## 2. Ce que j''écarte


    **J''écarte la réduction de la supervision de Salomé Vidal à 55 h/mois, ainsi que la variante à 70
    h/mois.** Les deux font perdre l''accréditation. Ce n''est pas une appréciation de risque, c''est
    une arithmétique de calendrier.


    ### Le calcul


    Vidal doit encore 6 mois de pratique. Un mois sous 100 h compte au prorata. Ferrand part fin M8 :
    il reste **8 mois** de supervision possible sous lui.


    | Scénario | Crédit acquis par mois | Crédit à fin M8 | Pratique achevée sous Ferrand ? |

    |---|---|---|---|

    | Statu quo (120 h) | 1,00 | 6,0 atteint dès **fin M6** | **Oui**, avec 2 mois de marge |

    | Variante DAF (70 h) | 0,70 | 5,6 | **Non** — manque 0,4 |

    | Plan DAF (55 h) | 0,55 | 4,4 | **Non** — manque 1,6 |


    Le seuil mathématique est de **75 h/mois** (6 ÷ 8). En dessous, la pratique n''est pas terminée quand
    Ferrand s''en va. **La variante à 70 h échoue donc aussi** — elle passe sous le seuil de 5 heures,
    et cet écart de 5 heures coûte l''accréditation. C''est le point le plus important de cette note :
    le compromis proposé n''en est pas un, il tombe du même côté de la falaise.


    ### La conséquence en chaîne


    Départ de Ferrand avec pratique inachevée → **changement de superviseur → l''exigence repasse à 12
    mois sous le nouveau**. Les 4,4 (ou 5,6) mois accumulés ne se reportent pas. Vidal repart à zéro en
    M9, finit au mieux fin M20, agréée vers M22.


    Or Marchand part fin M14. À M15 nous ne sommes plus que deux signataires agréés (Bouchard, Nseka).
    **Suspension prononcée sous 30 jours.** Elle emporte 87 % du chiffre d''affaires.


    ### Pourquoi c''est irrécupérable et non réparable


    Le retour se fait par accréditation initiale : 14 à 20 mois, 340 k€, **dossier recevable seulement
    si trois signataires agréés sont en poste**. Après suspension, il n''y a plus d''activité accréditée
    à faire signer ; Bouchard et Nseka n''ont aucune raison de rester dix-huit mois. La condition de recevabilité
    devient alors hors d''atteinte de façon définitive. Ce n''est pas un mauvais tirage à encaisser :
    c''est une branche dont on ne revient pas. La trésorerie ne finance ni 340 k€, ni 14 à 20 mois sans
    87 % du chiffre.


    ### La phrase du DAF, corrigée


    Le DAF écrit que « l''accréditation n''est pas concernée : trois signataires restent en poste jusqu''à
    M14 et Vidal sera agréée d''ici là ». La première moitié est exacte. **La seconde est fausse sous
    son propre plan** — c''est le plan lui-même qui empêche l''agrément de Vidal d''arriver à temps. Les
    deux propositions sont vraies séparément et contradictoires ensemble.


    ### « Aucune mesure irréversible, chacune rétablie en 30 jours »


    Cette garantie confond la réversibilité d''une **mesure** et celle de ses **conséquences**. Remettre
    Vidal à 120 h en M9 est administrativement instantané et ne rétablit rien : l''événement destructeur
    n''est pas la baisse d''heures, c''est le départ de Ferrand, qui est exogène, daté, et qui ne se rejoue
    pas. Une mesure réversible peut être adossée à un événement irréversible ; c''est le cas ici.


    ---


    ## 3. Ce que valent les preuves invoquées


    **L''étude du cabinet (7 laboratoires sur 9).** Elle porte sur la mauvaise grandeur. La question n''est
    pas « un plan d''économies équivalent fait-il perdre l''accréditation », c''est « combien de ces laboratoires
    avaient un stagiaire signataire en cours de cycle sous un superviseur démissionnaire à huit mois ».
    Sans cette ventilation, l''échantillon ne dit rien de notre situation. Et pris au pied de la lettre,
    il annonce 2 échecs sur 9 : un taux d''échec de 22 % sur un pari dont la perte est le laboratoire
    n''est pas un argument favorable.


    **Les cinq cosignatures sur sept.** Elles mesurent l''accord du comité, pas la conformité au référentiel.
    Le référentiel ne vote pas.


    **Ce qui manquerait pour me faire changer d''avis :** une position écrite de l''organisme d''accréditation
    établissant que les heures acquises sous Ferrand se reportent sur un nouveau superviseur. Cette pièce
    n''existe pas aujourd''hui ; le texte dit l''inverse. Je la demande quand même (§5) — c''est l''information
    la moins chère et la plus décisive du dossier.


    ---


    ## 4. Réserves sur les mesures retenues


    **Internalisation de la maintenance métrologie.** À retenir, mais avec exclusion écrite : les **étalonnages
    et vérifications qui portent la traçabilité métrologique** restent confiés à un prestataire accrédité.
    Les internaliser créerait une non-conformité à la prochaine évaluation — un second chemin vers la
    suspension, indépendant du compte de signataires. La mesure garde l''essentiel de son économie sur
    la maintenance préventive et curative.


    **Sous-location de 240 m².** Un bail de sous-location n''est pas résiliable en 30 jours ; la mention
    « chacune rétablie en trente jours » ne s''y applique pas. Deux exigences : durée courte ou clause
    de reprise, et périmètre excluant la surface nécessaire aux bancs de fatigue (cf. §6).


    **Arrêt de l''intérim en préparation d''échantillons.** Le chiffre de 4 % est donné sur le chiffre
    **non** accrédité, soit ~0,5 % du total. Mais des délais allongés de 9 à 14 jours en préparation frappent
    aussi la production accréditée, c''est-à-dire les 87 %, et cette part n''est pas mesurée. Je demande
    un suivi mensuel des délais et du taux de commandes accréditées perdues, avec réactivation de l''intérim
    si ce taux dépasse 2 %.


    **Gel du second apprenti signataire.** Maintenu à court terme, pour une raison qui n''est pas budgétaire
    : un second stagiaire consommerait 100 h/mois de supervision en concurrence directe avec Vidal. À
    lever dès l''agrément de Vidal prononcé (~M9) — un cycle apprenti dure 26 mois, il ne produira rien
    avant M35, il ne résout donc ni M14 ni les contrats-cadres.


    ---


    ## 5. Ce sur quoi j''engage le laboratoire


    **Engagement 1 — La supervision de Vidal reste à 100 h/mois minimum jusqu''à achèvement de sa pratique.**

    Cible opérationnelle 110 h. Achèvement attendu fin M6, agrément prononcé fin M8. **Les mois M7 et
    M8 sont tenus en réserve** et ne sont pas pré-affectés à la production : ils absorbent un arrêt maladie
    ou une absence de Ferrand. Ferrand bascule en production à compter de M7 pour le solde de son préavis,
    ou plus tôt si le crédit acquis le permet.


    **Engagement 2 — Sécuriser Ferrand contractuellement avant le 31 janvier.**

    Tout le plan repose sur la présence effective d''un démissionnaire pendant six mois à 100 h de supervision.
    C''est aujourd''hui un point de rupture unique et non couvert. Avenant de transition avec contrepartie
    financière, périmètre de supervision nommé, et date de sortie ferme.


    **Engagement 3 — Saisir l''organisme d''accréditation cette semaine, par écrit, sur deux points.**

    (a) Un signataire agréé recruté dans un autre laboratoire accrédité conserve-t-il son agrément sur
    notre portée, et sous quel délai et quelles formalités ? (b) Confirmation de la lecture du prorata
    et de la remise à douze mois en cas de changement de superviseur, appliquée au dossier Vidal.

    Le point (a) est une hypothèse que je signale comme telle : **tout le dispositif de repli du §5-4
    en dépend**, et je ne l''ai pas vérifiée. Le refus des 55 h et des 70 h, lui, n''en dépend pas.


    **Engagement 4 — Ouvrir le recrutement d''un quatrième signataire agréé.**

    Même plan tenu, nous sommes à exactement 3 signataires à partir de M15, sans aucune marge : une maladie,
    une démission, et la suspension tombe. Trois n''est pas un effectif, c''est un plancher réglementaire.
    Ce recrutement est aussi la seule voie vers les contrats-cadres (§6).


    **Engagement 5 — Ventilation des 26 k€ du volet B par mesure, avant lundi.**

    Le report de la mesure Ferrand coûte, dans l''hypothèse la plus défavorable où elle représenterait
    la totalité du volet B, 26 k€ × 6 mois = **156 k€**, laissant la trésorerie à ~558 k€ à M6. À comparer
    aux 340 k€ de réaccréditation, aux 14 à 20 mois d''arrêt et à l''impossibilité pratique de reconstituer
    le dossier. L''écart n''est pas discutable.


    ---


    ## 6. Les contrats-cadres à 41 k€/mois


    Ils exigent deux signataires dédiés **en plus** de l''activité courante. Effectif agréé prévu : 4
    à partir de M9 (Marchand, Bouchard, Nseka, Vidal), puis **3 à partir de M15**. Nous ne pouvons pas
    les honorer sans recrutement externe.


    Position recommandée : **lettre d''intention conditionnelle**, démarrage négocié à M11–M12, montée
    en volume indexée sur les prises de poste, sans engagement ferme tant que deux signataires agréés
    ne sont pas recrutés. Signer avant de savoir staffer, ce serait détourner des signataires de la production
    accréditée courante — c''est-à-dire mettre en cause les 87 % pour aller chercher 41 k€.


    Ces contrats effacent à eux seuls le déficit résiduel. Ils sont la vraie sortie de crise, et ils passent
    par le recrutement, pas par les économies.


    ---


    ## 7. Repli et déclencheurs


    | Déclencheur observable | Action, sans nouvelle délibération |

    |---|---|

    | Crédit de pratique de Vidal en retard de plus de 0,25 mois sur la trajectoire, à n''importe quelle
    fin de mois | Rattrapage sur M7–M8 ; information du comité sous 5 jours |

    | Ferrand indisponible ou partant avant fin M6 | Recrutement immédiat d''un signataire agréé ; suspension
    de toute nouvelle mesure du volet B |

    | Agrément de Vidal non prononcé au 30 du M10 | Recrutement d''un signataire agréé à finaliser avant
    fin M13 |

    | Taux de commandes accréditées perdues > 2 % sur un mois | Réactivation de l''intérim en préparation
    d''échantillons |

    | Trésorerie < 450 k€ | Réexamen complet du plan, y compris cession d''actifs |


    Aucune reprise automatique d''une mesure écartée : elle repasse par le comité.


    ---


    ## 8. Ce que je propose au comité de trancher


    Le comité peut parfaitement décider autrement — c''est sa prérogative, et cinq de ses membres ont
    déjà cosigné. Ce que je demande alors, c''est que la décision soit prise en connaissance du calcul
    du §2 et consignée comme telle : **le plan du DAF, dans ses deux variantes, place le laboratoire à
    deux signataires agréés en M15 et déclenche la suspension.**


    Ce que je propose est un décalage de six mois sur une seule des douze mesures, en échange de la conservation
    de l''accréditation. Le reste du plan est adopté.


    **Première action, cette semaine :** courrier à l''organisme d''accréditation (Engagement 3) et convocation
    de Ferrand pour l''avenant de transition (Engagement 2). Les deux sont sans coût et conditionnent
    tout le reste.

    '
