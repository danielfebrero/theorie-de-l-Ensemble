response:
  text: '## Note liminaire


    L''annexe technique jointe (catalogue de 34 stations de mesure environnementale, EMS-1000 à EMS-1033)
    ne concerne pas ce dossier : aucune de ses données n''entre dans l''avis ci-dessous. Je le signale
    pour que le comité ne suppose pas qu''elle a été pesée.


    Calendrier retenu : comité le 28, remise éditeur expirant le 30, échéance contractuelle le 31 octobre
    — soit environ neuf semaines entre la séance et l''échéance réelle. C''est le fait le plus important
    du dossier : **la seule date contraignante est le 31 octobre ; celle du 30 est une date commerciale.**


    ---


    # 1. Ce que le dossier établit, point par point


    Chaque appréciation est donnée avec la pièce sur laquelle elle repose et l''effet de son retrait.


    **1.1 — Trois problèmes distincts sont traités dans ce dossier comme un seul.**

    (a) l''indisponibilité matérielle des bornes ; (b) les pertes de réservation ; (c) l''économie du
    contrat. Rien dans le dossier ne les relie.

    *Repose sur :* la comparaison de l''export technique (bornes) et de l''enquête interne (module de
    réservation) — deux périmètres différents.

    *Si le comité écarte cet élément :* tout le reste de l''avis change de nature, car les options seraient
    alors comparables entre elles. C''est le seul point que je demande au comité de ne pas écarter sans
    motif explicite.


    **1.2 — L''indisponibilité des bornes est un problème de parc matériel, pas de logiciel.**

    32 h sur 41 h se concentrent sur les deux seuls sites équipés des bornes de 2015 : environ 16 h par
    site contre 1,8 h en moyenne sur les cinq autres, soit un facteur 9.

    *Repose sur :* l''export technique seul.

    *Si le comité écarte cet élément :* la migration v4 reste néanmoins sans effet démontré sur les bornes,
    puisque sa compatibilité est « à l''étude ».


    **1.3 — L''origine des pertes de réservation n''est pas établie, et Fontaine le montre.**

    Fontaine a les mêmes bornes de 2015 que Rive-Sud et ne signale rien. Rive-Sud ressaisit 5 h par semaine.
    Si la cause était la mise à jour de mars — commune à tout le réseau — les deux sites seraient touchés.
    La concentration sur un seul site oriente vers ce qui n''a changé qu''à Rive-Sud.

    *Repose sur :* les notes de sites, croisées avec l''export technique.

    *Si le comité écarte cet élément* (par exemple en jugeant que Fontaine ne remonte simplement pas ses
    incidents) : alors le silence de Fontaine n''est pas une donnée, et il faut aller le chercher — ce
    que prévoit le point 5.3. Dans les deux lectures, on ne peut pas conclure aujourd''hui.


    **1.4 — Deux causes concurrentes coïncident avec le démarrage constaté.**

    En février, à Rive-Sud : remplacement du lien fibre **et** changement de version du portail usagers.
    En mars : mise à jour du logiciel. Trois changements en deux mois sur le même site, dont deux antérieurs
    aux symptômes.

    *Repose sur :* la chronologie de février et la date de la mise à jour de mars.

    *Si le comité écarte cet élément :* il reste que la note de cadrage désigne une cause parmi trois
    candidates sans écarter les deux autres.


    **1.5 — L''enquête ne soutient pas la thèse de la mise à jour de mars ; elle la contredit plutôt.**

    43 réponses sur 62. 61 % des répondants, soit environ 26 agents, signalent des pertes. Sur ces 26,
    **12 seulement** situent le début après mars — donc une majorité de ceux qui constatent des pertes
    ne les rattachent pas à la mise à jour. Par ailleurs 19 agents n''ont pas répondu, et une enquête
    mesure des perceptions, pas un volume de réservations perdues.

    *Repose sur :* les chiffres de l''enquête interne, lus intégralement.

    *Si le comité écarte cet élément* (enquête jugée trop faible pour conclure) : elle est alors également
    trop faible pour fonder une dépense de 31 000 €. Le retrait de cette pièce affaiblit la note de cadrage,
    pas cet avis.


    **1.6 — Le profil des réclamations est compatible avec un incident résorbé, pas avec une panne courante.**

    71 réclamations sur 96 entre mars et juin, 25 réparties sur les huit autres mois. Le reflux après
    juin a deux lectures : la cause s''est éteinte, ou la ressaisie manuelle de Rive-Sud masque le symptôme.
    Le dossier ne permet pas de trancher.

    *Repose sur :* le décompte des réclamations, croisé avec la note de Rive-Sud.

    *Si le comité écarte cet élément :* aucune conséquence sur la recommandation, qui ne s''appuie pas
    dessus.


    **1.7 — La remise de 12 % est de valeur limitée face à l''indexation, et son coût de renoncement est
    borné.**

    48 000 € indexés à 7 % donnent environ 154 300 € sur trois ans ; avec 12 %, environ 135 800 €, soit
    **environ 18 500 € d''écart**. La troisième année remisée (≈ 48 400 €) coûte déjà plus que la première
    année non remisée : la remise rachète à peu près deux ans d''indexation, pas davantage. Elle est aussi
    inférieure au coût de la v4 (31 000 €).

    *Repose sur :* les données financières, calcul détaillé disponible en séance.

    *Si le comité écarte cet élément* (par exemple si l''indexation ne s''applique pas dans un contrat
    pluriannuel — point à vérifier, cf. 5.5) : l''écart monte, mais reste borné et connu, face à un engagement
    de trois ans pris sur un diagnostic absent.


    **1.8 — La solution libre n''est pas évaluable en l''état, et le précédent voisin est un signal négatif.**

    14 mois après bascule, 2 sites sur 5 tiennent encore un registre papier : la migration n''est pas
    achevée. Le « 30 % moins cher » porte sur le coût annoncé, sans charge interne.

    *Repose sur :* la seule information disponible sur le réseau voisin.

    *Si le comité écarte cet élément :* l''option reste écartée à court terme par la contrainte du point
    1.9.


    **1.9 — La capacité interne est la contrainte réelle et elle est décroissante.**

    Deux personnes, une partant en octobre. Conduire en octobre-novembre une migration v4 ou une bascule
    vers le libre, à un ETP, pendant la période d''échéance contractuelle, est hors d''atteinte.

    *Repose sur :* la composition de l''équipe informatique.

    *Si le comité écarte cet élément* (renfort ou prestation externe budgétés) : les options 2 et 3 redeviennent
    examinables — mais à l''échéance suivante, pas dans neuf semaines.


    ---


    # 2. Sur la note de cadrage


    Elle enchaîne trois affirmations : la mise à jour de mars est la cause ; la v4 la corrige ; il faut
    signer avant le 30. Aucune n''est adossée à une pièce du dossier, et la deuxième est contredite par
    l''éditeur lui-même, qui met la compatibilité v4 avec les bornes de 2015 « à l''étude ».


    Ce n''est pas un reproche à son auteur : c''est l''hypothèse la plus naturelle à formuler, et elle
    peut se révéler exacte. Mais elle est aujourd''hui une hypothèse, et deux membres du comité l''ont
    lue comme un constat. Je demande qu''elle soit présentée en séance comme la première hypothèse à tester,
    non comme l''état des lieux.


    ---


    # 3. Recommandation


    **Reconduire à l''identique, pour une durée courte (12 mois visés), sans migration v4 et sans bascule
    vers le libre à cette échéance ; renoncer à la remise de 12 %.**


    Motifs, dans l''ordre :


    1. On ne peut pas acheter la correction d''une panne qu''on n''a pas nommée. La v4 à 31 000 € est
    vendue contre une cause non établie (1.3–1.5) et ne traite pas la cause démontrée, matérielle (1.2).

    2. L''engagement de trois ans est la seule décision réellement irréversible du dossier. Signer, c''est
    immobiliser environ 136 000 € et fermer les deux autres options jusqu''en 2029, sur l''état d''information
    actuel. Renoncer à la remise coûte environ 18 500 €, montant connu et borné, et laisse tout ouvert.

    3. Neuf semaines suffisent à faire le diagnostic ; elles ne suffisent pas à faire une migration à
    un ETP (1.9).

    4. Le risque à écarter absolument est la rupture de service au 31 octobre sur sept sites. Une reconduction
    courte l''écarte ; c''est le seul point sur lequel je demande une décision ferme le 28.


    **Ce que la recommandation ne dit pas :** elle ne rejette ni la v4 ni le libre. Elle les renvoie à
    une décision instruite, à l''échéance de 2027, avec le diagnostic en main et une équipe reconstituée.


    **Hypothèse à lever en séance :** le dossier ne dit pas si l''éditeur accepte une reconduction de
    12 mois. Si un refus est opposé, la position de repli est une reconduction d''un an au tarif plein
    sans remise, ou à défaut la durée la plus courte proposée — mais **sans la v4 dans le même acte**,
    quelle que soit la durée retenue.


    ---


    # 4. Le meilleur argument contre cet avis


    Il mérite d''être exposé au comité : si la mise à jour de mars est bien la cause, attendre coûte 5
    h par semaine à Rive-Sud — soit déjà environ 110 h depuis mars, et près de 260 h par an — plus l''usure
    de la relation aux usagers ; on perd 18 500 € de remise ; et l''on paiera la v4 de toute façon, plus
    cher, dans un an.


    Ma réponse : le diagnostic demandé se mesure en jours, pas en mois, et il est presque entièrement
    à la charge de l''éditeur (5.1). Surtout, même en tenant la thèse de mars pour vraie, **aucune pièce
    du dossier ne dit que la v4 corrige ce défaut** — l''éditeur ne l''a pas écrit. Payer 31 000 € plus
    un engagement de trois ans pour un correctif non promis n''est pas une action rapide : c''est la version
    coûteuse de la même incertitude. Si le point 5.1 confirme la thèse de mars et que l''éditeur s''engage
    par écrit sur la correction, la v4 pourra être décidée en connaissance de cause, sans qu''il soit
    besoin d''avoir signé trois ans.


    ---


    # 5. Ce que j''engage dans les quinze jours


    Échéance : J+15 après la séance du 28, soit environ six semaines avant le 31 octobre.


    **5.1 — Extraction des journaux serveur du module de réservation** (demande écrite à l''éditeur, sous
    48 h, en visant une clause d''accès aux données).

    Réservations créées / confirmées / échouées, **par site et par mois, de janvier à août**. C''est le
    test décisif : pertes réparties sur les 7 sites à partir de mars → la mise à jour est en cause ; pertes
    concentrées sur Rive-Sud → la fibre ou le portail le sont. *Livrable : tableau croisé site × mois.*


    **5.2 — Chronologie datée au jour près.** Date exacte de la mise à jour de mars, du remplacement du
    lien fibre, du changement de version du portail. Si les pertes de Rive-Sud précèdent la mise à jour,
    la thèse de la note tombe sans autre analyse. *Livrable : frise d''une page.*


    **5.3 — Relevé actif à Fontaine, quinze jours.** Journal simple des réservations non retrouvées, tenu
    par les agents. Le silence de Fontaine doit devenir une donnée ou cesser d''être invoqué (1.3). *Livrable
    : décompte daté.*


    **5.4 — Reprise des 96 réclamations**, classées par site, par mois et par objet (réservation perdue
    / borne indisponible / autre). Objectif : savoir si le reflux après juin est réel ou masqué par la
    ressaisie de Rive-Sud. *Livrable : tableau de classement.*


    **5.5 — Trois questions écrites à l''éditeur, réponse datée exigée sous 10 jours :**

    - la v4 est-elle compatible avec les bornes de 2015 — oui, non, ou à quelle date la réponse sera connue
    ;

    - la v4 corrige-t-elle un défaut identifié de perte de réservations, avec référence du correctif ;

    - prix d''une reconduction de 12 mois, et l''indexation de 7 % s''applique-t-elle en contrat pluriannuel.

    Une réponse évasive sur la première question est en soi une réponse : elle exclut la v4 à cette échéance.


    **5.6 — Chiffrage du parc de bornes 2015**, indépendamment du contrat logiciel : coût de remplacement
    des bornes de Fontaine et Rive-Sud, à porter en investissement 2027. C''est là que se trouvent 78
    % de l''indisponibilité constatée (1.2).


    **5.7 — Sécurisation de la continuité au 31 octobre** : ouverture formelle de la négociation de reconduction
    courte dès le 29, pour que l''absence d''accord soit connue au plus tard à J+15 et non en octobre.


    ---


    # 6. Condition d''arrêt


    Cet avis se révise, sans nouvelle séance, dans deux cas :


    - **5.1 montre des pertes sur les sept sites à partir de mars, et 5.5 apporte un engagement écrit
    de l''éditeur sur la correction en v4** → la v4 redevient recommandable, à instruire avec un calendrier
    tenant compte du départ d''octobre. La remise de 12 % sera perdue ; c''est le prix, connu, d''avoir
    décidé sur pièces.

    - **L''éditeur refuse toute reconduction inférieure à trois ans et ne fournit pas les journaux** →
    le comité est alors saisi d''une décision différente de celle du 28 (dépendance à un fournisseur qui
    ne rend pas ses données), et je le convoque à nouveau avant le 30 septembre.


    Dans tous les autres cas, la reconduction courte s''exécute et le dossier revient au comité en janvier
    2027 avec le diagnostic établi et le chiffrage du parc de bornes.

    '
