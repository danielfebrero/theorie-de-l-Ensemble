  text: '# Note au conseil — arbitrage de l''enveloppe 900 000 €


    **Séance du jeudi — décision demandée sur les deux dossiers**


    ---


    ## Le cadrage préalable


    L''enveloppe n''est pas reconductible : ce qui n''est pas engagé cet exercice disparaît. La question
    n''est donc pas « A ou B », mais **dans quel ordre servir les deux, et où placer le solde**. Un euro
    non affecté n''est pas un euro économisé — c''est un euro perdu. Cela change le niveau d''exigence
    : un investissement moyennement rentable reste très supérieur à un budget qui s''évapore.


    Deux natures de risque, très différentes. Le dossier A est un problème de **coût** : chiffré, audité,
    réversible par tranches. Le dossier B est un problème d''**existence** : 31 % du chiffre d''affaires
    et la continuité de notre certification tiennent aujourd''hui à une seule personne, qui part dans
    onze mois. On sert d''abord ce qui peut tuer l''entreprise, ensuite ce qui la coûte.


    ---


    ## Décision 1 — Dossier B : succession qualité, 135 000 € engagés maintenant


    **Ce qu''on décide :** promotion de l''adjointe (45 000 € sur deux ans) **et** mission de transition
    du directeur sortant (90 000 € sur douze mois). Les deux, pas l''un ou l''autre.


    Ce n''est pas un compromis, c''est le seul montage qui produit **23 mois de recouvrement** : onze
    mois côte à côte avant le départ, douze mois d''accompagnement après. Aucune autre option n''offre
    cette durée.


    Nous écartons le recrutement externe à 280 000 €. L''organisme notifié ne reconnaît pas un diplôme,
    il reconnaît **une personne** ; nos deux clients hospitaliers nomment un individu, pas une fonction.
    Recruter à l''extérieur remplace un inconnu par un autre inconnu, coûte six fois plus cher, et consomme
    la part de l''enveloppe dont le dossier A a besoin. Il reste néanmoins notre repli — voir la réserve
    ci-dessous.


    **Point d''exécution, non négociable sur le calendrier :** le contrat de mission de transition doit
    être signé **sous quinze jours**. Le pouvoir de négociation du directeur sortant augmente à mesure
    que la date approche ; les 90 000 € d''aujourd''hui coûteront davantage dans huit mois.


    *Réserve technique à lever avec la direction financière avant le vote :* nous supposons qu''« engager
    » signifie signer et provisionner, non décaisser sur l''exercice. Si la règle impose le décaissement,
    la ligne B tombe à ce qui est effectivement versé cette année et le solde bascule vers la réserve
    succession.


    ---


    ## Décision 2 — Dossier A : renouvellement complet, 620 000 €


    **Ce qu''on décide :** commande ferme des six machines, livraison échelonnée sur dix-huit mois, en
    commençant par les machines qui concentrent les pannes.


    Il faut dire au conseil ce que les chiffres établissent réellement. Sur cinq ans : 362 heures d''arrêt
    par an, soit 13 800 € de marge perdue, plus 42 600 € de coût direct annuel. **Gain annuel prouvé :
    environ 56 000 €.** Rapporté à 620 000 €, cela fait onze ans de retour. Pris isolément, ce dossier
    ne passerait pas.


    Le reste du gain est dans le rebut — 4,1 % contre 1,2 % garanti — que nous ne savons pas encore chiffrer.
    Pour ramener le retour à cinq ans, l''économie de rebut doit valoir environ 68 000 € par an, ce qui
    suppose une base de coût de production concernée supérieure à **2,3 millions d''euros annuels**. Ce
    chiffre est vérifiable en une demi-journée par le contrôle de gestion. Il doit l''être avant jeudi.


    Nous recommandons l''engagement même si ce test est négatif, pour trois raisons : la garantie de 96
    % de disponibilité sur sept ans avec pénalités transfère une partie du risque au fournisseur ; les
    conditions unitaires sont acquises aujourd''hui et pas dans douze mois ; et un parc de 14 ans devra
    être remplacé de toute façon, sans nouveau tour de table avant un an. Mais le conseil doit voter en
    sachant qu''il achète d''abord de la **sécurité de production**, pas un rendement.


    ---


    ## Répartition de l''enveloppe


    | Ligne | Montant |

    |---|---|

    | Dossier A — six machines, commande ferme, livraison échelonnée | 620 000 € |

    | Dossier B — promotion adjointe + mission de transition | 135 000 € |

    | Réserve succession — mandat cabinet conditionnel, déclenché sur signal | 145 000 € |

    | **Total** | **900 000 €** |


    La réserve n''est pas de la trésorerie dormante : c''est un mandat de recrutement signé avec clause
    suspensive, engagé cet exercice, activé seulement si la succession décroche.


    ---


    ## Ce qui déclenche le repli


    Trois points d''observation, datés, sur le dossier B :


    - **Mois 4** — l''organisme notifié a-t-il accepté l''adjointe par écrit comme correspondante déclarée
    ? Sans accusé écrit : activation de la réserve.

    - **Mois 6** — les deux clients hospitaliers ont-ils été rencontrés en présence de l''adjointe et
    informés du dispositif de transition ? Réserve exprimée par l''un d''eux : escalade en conseil.

    - **Mois 8** — l''adjointe a-t-elle conduit seule deux audits internes et un échange avec l''organisme
    notifié ? Sinon : recrutement externe lancé pendant que le sortant est encore là.


    **Ce qui renverserait la décision A :** un relevé de maintenance montrant que trois machines portent
    l''essentiel des 47 pannes et que les trois autres sont saines. Dans ce cas, l''échelonnement des
    livraisons devient l''outil d''ajustement, sans remise en cause de la commande.


    **Pire cas assumé :** l''adjointe n''est pas reconnue, un des deux clients part. Ce sont 140 salariés
    qui l''encaissent. C''est précisément pourquoi B passe avant A, et pourquoi la réserve existe.


    ---


    ## Première action


    Vendredi matin : lettre du directeur général à l''organisme notifié déclarant la succession et demandant
    l''ouverture de la procédure de reconnaissance de l''adjointe. C''est le seul délai que nous ne maîtrisons
    pas — il court à partir de cette lettre, pas de la décision du conseil.

    '
