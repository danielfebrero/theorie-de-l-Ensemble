response:
  text: '# NOTE AU COMITÉ D''EXPLOITATION


    **Séance du jeudi 13 août 2026**

    **Objet :** conditions de retour de la chloration en régulation automatique

    **Réf. :** incident du 12 mai ; critère signé du 13 mai


    ---


    **1. Ce qui m''est demandé, et ce que je propose à la place**


    Il m''est demandé d''inscrire ici une règle du type « N jours sans alarme et la boucle repart ». Je
    ne peux pas la proposer sous cette forme : elle compterait des jours pendant lesquels rien n''est
    mesuré. Je propose en §4 une règle qui produit l''effet recherché — **plus aucune réunion après jeudi**
    — et qui comporte bien un nombre de jours, mais placé après l''armement des sécurités et non à sa
    place.


    **2. Ce que mesurent les 87 jours**


    Ils mesurent la performance du pilotage manuel. Ils ne disent rien de la boucle automatique : **le
    programme de l''automate est celui du 12 mai, inchangé.** Repasser en automatique aujourd''hui, c''est
    remettre en service exactement le programme qui a tenu 3 h 40 une consigne fausse sans que rien ne
    l''arrête.


    **3. Ce que mesure l''absence d''alarme du comparateur**


    Le comparateur tourne depuis 25 jours, pas 87. Sur ces 25 jours aucune dérive n''est survenue : il
    n''a rien eu à détecter. **Zéro alarme d''un détecteur jamais éprouvé et panne silencieuse de ce détecteur
    produisent le même relevé.** C''est le scénario de novembre à l''identique : l''alarme de discordance
    était réputée présente, elle était morte, personne ne l''a su pendant six mois. Par ailleurs sa sortie
    va vers un tableau de bord : il n''arrête aucune boucle. Le critère signé du 13 mai — « instrumentée
    » — n''est donc pas satisfait à ce jour.


    **4. Le statu quo n''est pas le côté prudent**


    Point que je dois porter au comité, et qui commande le calendrier : en manuel, l''écart-type est de
    **0,21 mg/L pour une moyenne de 0,52**. Deux écarts sous la moyenne placent la sortie à 0,10 mg/L.
    Le risque de mai était le surdosage — 210 plaintes, 26 heures de restriction, tout cela se rattrape.
    Le risque du régime actuel est le **sous-dosage sur 96 000 abonnés**, qui ne se rattrape pas. Il faut
    sortir du manuel vite. C''est pourquoi je ne propose pas d''attendre l''audit du 30 septembre.


    **5. Règle R-CL-01 — retour en automatique sans nouvelle délibération**


    *Palier A — sortie du pilotage manuel*

    - **A1.** Seuil haut matériel sur le chlore en sortie, indépendant de S2 et du programme : > 0,8 mg/L
    pendant 15 min → arrêt d''injection et repli sur dose fixe. Non désactivable par l''automate. *(Cette
    seule mesure aurait ramené l''incident de mai de 3 h 40 à 15 minutes.)*

    - **A2.** Repli sur dose fixe essayé en ligne, deux fois, chronométré, tracé et signé.

    - **A3.** Essai d''injection : offset volontaire imposé à S2 (banc puis en ligne à seuil abaissé),
    trois essais, le repli doit se déclencher.

    → **Effet automatique : passage en automatique surveillé, un poste conservé de nuit. ≈ 20 k€/mois
    économisés.**


    *Palier B — retour au régime nominal*

    - **B1.** Comparateur câblé vers l''actionneur : |S2−S3| au-delà du seuil pendant la durée retenue
    → repli + alarme opérateur. Seuil chiffré à partir de la dispersion S2/S3 réellement relevée du 14
    juillet au 13 août (ordre de grandeur 0,15 mg/L, à confirmer sur le relevé).

    - **B2.** Seuil haut et comparateur inscrits au registre des fonctions de sécurité, **test fonctionnel
    mensuel obligatoire**, preuve écrite, et test non exécuté = alarme d''exploitation. C''est la mesure
    qui ferme la faille de novembre.

    - **B3.** Programme automate versionné, modifications tracées, retour arrière possible.

    - **B4.** Puis **21 jours** en automatique surveillé sans alarme de discordance et sans dépassement
    de 0,8 mg/L.

    → **Effet automatique : régime nominal, suppression des deux postes. Rien à voter.**


    *Suspension automatique :* toute alarme de discordance, tout dépassement, tout repli déclenché → retour
    en manuel et compteur B4 remis à zéro. Réserve de l''auditeur externe sur la boucle avant le 30 septembre
    → suspension jusqu''à ses conclusions ; le dossier d''armement lui est transmis le jour même de l''armement.


    **6. Calendrier et coût**


    13 août décision · 22 août spécification et seuil chiffrés · 5 septembre palier A → sortie du manuel
    · 19 septembre palier B armé · 10 octobre régime nominal. Chaque semaine de retard coûte **9 500 €**
    ; le chiffrage des travaux d''automatisme, à produire pour le 22 août, sera sans commune mesure.


    **7. Le meilleur argument contre cette note**


    « La boucle n''a jamais été dangereuse, la sonde l''était ; elle est neuve et étalonnée tous les quinze
    jours ; l''automatique avec une bonne sonde est plus sûr que le manuel dispersé — repassez lundi.
    » Cet argument est solide et il porte sur le **calendrier**, pas sur l''armement : c''est précisément
    pourquoi le palier A est court et ne dépend d''aucun développement logiciel. S''il faut aller plus
    vite encore, c''est A1 seul qu''on avance, pas B qu''on supprime.


    **8. Ce qui renverserait cette note**


    Si le relevé du comparateur au 13 août montre qu''il a réellement détecté et signalé un écart — et
    non affiché des courbes plates —, le palier B est largement engagé et le calendrier se comprime. À
    l''inverse, si l''essai d''injection A3 échoue, l''argument « le comparateur ne trouve rien » s''effondre.
    Dans les deux cas, il faut le savoir avant de rebasculer, pas après.


    **9. Décision demandée jeudi — une seule**


    Adopter R-CL-01, qui se substitue au critère du 13 mai. Aucune réunion ultérieure n''est nécessaire
    : les deux paliers se déclenchent sur constat écrit du responsable d''exploitation.


    ---


    Une remarque hors note : je n''ai pas écrit la règle en nombre de jours seuls, parce qu''un compteur
    de jours branché sur un détecteur qui n''a jamais été éprouvé compte exactement la même chose qu''un
    compteur branché sur rien — et c''est le mécanisme qui a produit l''incident de mai. La règle proposée
    donne au DG ce qu''il cherche vraiment (sortie du manuel en 4 semaines, fin des 41 k€ en 9, zéro réunion
    supplémentaire) et contient bien un nombre de jours, placé là où il mesure quelque chose. Le chiffrage
    des travaux d''automatisme et le seuil B1 sont les deux valeurs que je n''ai pas pu renseigner faute
    de données : elles sont marquées comme à produire pour le 22 août.

    '
