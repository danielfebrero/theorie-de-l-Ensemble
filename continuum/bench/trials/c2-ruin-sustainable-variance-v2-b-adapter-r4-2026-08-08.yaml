response:
  text: '# Note au conseil — arbitrage Sedamex / Nordwerk

    **Objet :** recommandation sur les 18 prochains mois — **Options A et B exclusives**

    **Date :** vendredi — décision demandée en séance


    ---


    ## 1. Recommandation


    **Je recommande l''option B (ligne Nordwerk)**, sous réserve des deux vérifications de la section
    5, à conduire avant signature.


    ## 2. Ce que disent les chiffres


    Espérance sur la période, à plan d''affaires équilibré par ailleurs :


    | | Option A | Option B |

    |---|---|---|

    | Résultat | +200 k€ certain | +900 k€ (60 %) / −400 k€ (40 %) |

    | Espérance | **+200 k€** | **+380 k€** |


    Comparaison différentielle B − A : +700 k€ en cas de succès, −600 k€ en cas d''échec, soit **+180
    k€ d''espérance en faveur de B**.


    **Seuil d''indifférence : 46,2 %.** En deçà de cette probabilité de succès, A redevient supérieure.
    L''estimation du bureau d''études est de 60 %. La marge est de 13,8 points — réelle, mais pas confortable.
    C''est le seul chiffre qui compte vraiment, et c''est celui qu''il faut auditer (section 5).


    ## 3. Le risque réel, chiffré


    Le dividende de 700 k€ est exigible et non révisable : il s''impute dans **les deux** options et ne
    fait pas partie de l''arbitrage.


    | Scénario | Fonds propres au plancher | Marge sur covenant (1,2 M€) | Trésorerie au plancher |

    |---|---|---|---|

    | Option A | 2,9 M€ | +1,7 M€ | 2,1 M€ |

    | Option B, succès | 3,6 M€ | +2,4 M€ | 2,8 M€ |

    | **Option B, échec** | **2,3 M€** | **+1,1 M€** | **1,5 M€** |


    Dans le pire cas de B — échec technique, pénalité exigible au 12ᵉ mois, cumulée au second acompte
    de dividende du 10ᵉ mois — les fonds propres restent **91 % au-dessus du covenant** et la trésorerie
    couvre **9,1 mois de masse salariale** sans aucune recette. Le covenant n''est franchi à aucune clôture
    trimestrielle testée.


    La perte maximale représente **11,8 % des fonds propres et 15,4 % de la trésorerie**. Elle est plafonnée,
    pénalité comprise.


    ## 4. Réponse au directeur financier


    Son objection est la bonne question posée aux mauvais chiffres. « Jouer la maison » suppose au moins
    une de ces six conditions. **Aucune n''est réunie :**


    1. caution personnelle du dirigeant — absente ;

    2. clause de défaut croisé — absente ;

    3. sûreté sur l''actif industriel — absente ;

    4. carnet de commandes gagé — non, dans aucune des deux options ;

    5. perte non plafonnée — non, plafond ferme à 400 k€ ;

    6. perte excédant la marge de covenant — non : 400 k€ contre 1,5 M€ de marge disponible.


    Sur **Tremay** : un dépôt de bilan n''est pas un taux de base, c''est un cas. Et un cas dont la structure
    diffère de la nôtre sur le point décisif — une entreprise de taille comparable ne dépose pas le bilan
    sur une perte plafonnée à 12 % de ses fonds propres. Tremay a vraisemblablement financé sa ligne par
    dette, sans plafond de perte, avec des sûretés. Je propose que le DAF nous rapporte en séance la structure
    de financement de Tremay : si elle comportait nos six protections, je retire ma recommandation. Sinon,
    l''analogie ne tient pas.


    Ce qui reste juste dans son objection, et que je fais mien : **l''engagement est irrévocable pendant
    18 mois.** L''irréversibilité impose la rigueur sur la probabilité, pas le refus d''un risque borné.


    ## 5. Conditions suspensives avant signature


    **a) Intégrité du plafond.** Faire confirmer par le conseil juridique, par écrit, que les 400 k€ couvrent
    tout : pénalité, démontage, remise en état, indemnisation fournisseurs, indexation. **Une fuite dans
    le plafond détruit toute l''analyse ci-dessus** — c''est le risque principal du dossier, avant même
    le risque technique.


    **b) Audit du taux de base.** Exiger du bureau d''études les onze installations en données brutes
    : combien de succès, quel critère de succès, quels critères de comparabilité. Sur 11 cas, l''intervalle
    de confiance encadrant 60 % descend sous notre seuil de 46,2 %. **Si moins de 7 des 11 installations
    ont réussi, ou si le périmètre de comparabilité est lâche, je bascule sur l''option A.**


    ## 6. Points d''arrêt en exécution


    - Jalons techniques contractualisés aux mois 3, 6 et 9, revus en conseil.

    - **Constatation rapide de l''échec le cas échéant** : la perte étant plafonnée quelle que soit la
    date, l''intérêt est de constater tôt et de redéployer, non d''attendre le 12ᵉ mois.

    - Test de covenant simulé à chaque clôture trimestrielle, communiqué au banquier par anticipation.


    ---


    **En synthèse :** B rapporte 180 k€ d''espérance supplémentaire pour une perte maximale bornée qui
    laisse l''entreprise solvable, conforme à son covenant et capable de payer neuf mois de salaires.
    Ce n''est pas la maison qui est mise en jeu — c''est un huitième des fonds propres, contre une chance
    sur deux d''ajouter 21 % du chiffre d''affaires. Je recommande de signer, après les deux vérifications
    ci-dessus.

    '
