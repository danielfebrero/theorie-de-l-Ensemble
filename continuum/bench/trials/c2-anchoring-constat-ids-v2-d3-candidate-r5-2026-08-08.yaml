    # Avis — renouvellement du marché « réservation + bornes de prêt »


    Comité du 28 · échéance contractuelle 31 octobre


    ---


    ## 1. Ce que le dossier établit, et ce qu''il n''établit pas


    Sept constats, chacun rattaché à sa pièce. Ils sont indépendants : écarter l''un n''invalide pas les
    autres.


    **C1 — Le dossier décrit deux pannes distinctes, pas une.**

    *Pièce :* export technique (41 h d''indisponibilité **des bornes**) d''un côté ; enquête interne (le
    **module de réservation** « perd » des réservations) de l''autre.

    Une indisponibilité de borne est un problème matériel ; une réservation perdue est un problème de
    chaîne logicielle. Aucune pièce du dossier ne les relie. Les traiter comme un seul problème, c''est
    ce qui rend une solution unique plausible.

    *Ce qui le renverserait :* un journal montrant que les pertes coïncident avec les fenêtres d''indisponibilité.


    **C2 — L''imputation à la mise à jour de mars n''est pas soutenue par le dossier.**

    *Pièces :* Fontaine a les mêmes bornes de 2015 et a reçu la même mise à jour de mars, et ne signale
    rien (notes de sites). Et sur les 26 répondants qui signalent des pertes hebdomadaires (61 % de 43),
    **12 seulement** les datent d''après mars — donc 14 ne les datent pas d''après mars.

    Ces deux faits, pris ensemble, sont incompatibles avec une cause unique introduite en mars.

    *Ce qui le renverserait :* des incidents horodatés, par site, montrant une rupture nette en mars.


    **C3 — Rive-Sud cumule deux changements de février que les autres sites n''ont pas.**

    *Pièce :* remplacement du lien fibre **et** changement de version du portail usagers en février ;
    Rive-Sud est le seul site à ressaisir à la main.

    C''est la piste causale la mieux étayée du dossier — et elle est **locale**, pas réseau.


    **C4 — Le silence de Fontaine n''est pas une preuve d''absence de problème.**

    *Pièce :* 32 h des 41 h d''indisponibilité sont concentrées sur Fontaine et Rive-Sud ; Fontaine ne
    remonte rien.

    Soit Fontaine absorbe sans déclarer, soit son organisation masque le symptôme. À vérifier avant de
    s''appuyer sur Fontaine comme site témoin — l''essentiel de C2 repose sur ce site.


    **C5 — Le pic de réclamations est retombé ; la charge de Rive-Sud, non.**

    *Pièce :* 71 réclamations sur 96 entre mars et juin, 25 sur les huit autres mois — mais Rive-Sud ressaisit
    toujours 5 h par semaine.

    Deux lectures possibles : incident transitoire résorbé, **ou** symptôme absorbé par la ressaisie manuelle
    (les agents encaissent, les usagers ne réclament plus). Ces deux lectures n''appellent pas la même
    décision. C''est le premier point à trancher.

    Ordre de grandeur : 5 h/semaine ≈ **225 h d''agent par an**, non budgétées *(hypothèse : 45 semaines
    travaillées)*.


    **C6 — La v4 ne répond de façon établie à aucun des deux problèmes.**

    *Pièce :* compatibilité avec les bornes de 2015 « à l''étude » chez l''éditeur ; et aucune pièce n''attribue
    les pertes à une cause que la v4 corrigerait.

    31 000 € engagés en une fois sur un défaut non caractérisé et une compatibilité non confirmée.


    **C7 — La note de cadrage enchaîne trois affirmations dont aucune n''est adossée à une pièce.**

    « La mise à jour de mars est la cause » → contredit par C2. « La v4 règle le problème » → non établi,
    C6. « Il faut signer avant le 30 » → échéance commerciale, pas opérationnelle (C8).

    Je propose de la retenir comme **hypothèse à tester** — elle est la formulation la plus précise du
    dossier, et le protocole ci-dessous la teste — et non comme prémisse de la délibération. Le comité
    peut écarter ce seul point : aucun des constats C1 à C6 n''en dépend.


    **C8 — L''échéance du 30 n''est pas l''échéance du dossier.**

    Le contrat court jusqu''au 31 octobre. La remise expire **deux jours après la seule séance du comité**.
    Le dossier dispose d''environ deux mois ; la remise, de deux jours.


    ---


    ## 2. Ce que la remise achète réellement


    | | Année 1 | Année 2 | Année 3 | Total |

    |---|---|---|---|---|

    | Sans remise (+7 %/an) | 48 000 € | 51 360 € | 54 955 € | **154 315 €** |

    | Avec 12 % *(hyp. : sur la base)* | 42 240 € | 45 197 € | 48 361 € | **135 798 €** |


    Gain ≈ **18 500 € sur trois ans**, soit ~6 200 €/an — contre un engagement de **136 000 €** sans levier
    de renégociation, sur un diagnostic non établi. Le rapport est défavorable d''un ordre de grandeur.

    L''assiette exacte de la remise (base seule, ou base indexée) **n''est pas au dossier**. À obtenir
    par écrit.


    ---


    ## 3. Les trois options : pire cas, et qui l''encaisse


    **Reconduire à l''identique (durée courte).** Coût connu, ne corrige rien. Pire cas : douze mois de
    plus de ressaisie (~225 h agent) et l''indexation. *Encaissé par :* les agents de Rive-Sud. **Réversible.**


    **Reconduire + v4 (31 000 €).** Pire cas : la v4 ne corrige pas des pertes dont la cause est locale
    et réseau (C3), et n''est pas compatible avec les bornes de 2015 (C6) — 31 000 € dépensés, les deux
    problèmes intacts. *Encaissé par :* le budget d''investissement. **L''argent ne revient pas.**


    **Basculer vers le libre au 31 octobre.** Pire cas : bascule de 7 sites avec **un** informaticien,
    deux mois après la décision, sans reprise de données éprouvée — interruption du prêt et de la réservation
    à l''échelle du réseau. *Encaissé par :* 62 agents et les usagers. Le réseau voisin, quatorze mois
    après, a encore 2 sites sur 5 au registre papier : c''est le taux d''échec partiel d''une bascule
    menée avec plus de temps que nous n''en avons.

    Ce n''est pas un verdict sur le libre. C''est un verdict sur **ce calendrier et cet effectif**.


    Le départ d''un des deux informaticiens en octobre est le fait qui contraint le plus les trois options.
    Il n''apparaît nulle part dans la note de cadrage.


    ---


    ## 4. Recommandation


    **Ne pas signer le 28. Ne pas engager la v4. Ne pas basculer au 31 octobre.**


    Reconduire à l''identique sur une **durée courte** — douze mois, ou le minimum que le marché autorise
    — et employer les deux mois restants à établir la cause. La décision structurante se prend sur un
    diagnostic, pas sur une échéance commerciale.


    Sur la remise : **demander par écrit son maintien jusqu''au 15 octobre**, contre l''engagement du
    comité à statuer avant cette date. Un éditeur qui refuse de décaler de six semaines une remise de
    12 % nous renseigne sur ce qu''il pense de sa position ; un éditeur qui accepte ne nous a rien coûté.


    **Le critère qui emporte la décision** est la falsifiabilité des preuves — c''est le seul poste sur
    lequel les trois options se départagent, puisque aucune ne repose aujourd''hui sur une cause identifiée.


    **Le contre-argument le plus fort, et pourquoi il ne bascule pas.** Attendre coûte ~6 200 €/an de
    remise perdue, l''indexation, et 225 h d''agent à Rive-Sud — pour un diagnostic qui pourrait confirmer
    exactement ce que dit la note de cadrage. C''est exact, et c''est le coût assumé de cet avis. Il ne
    bascule pas parce que ce coût est **borné et réversible**, alors que le coût symétrique — trois ans
    à 136 000 € sur une cause fausse, ou 31 000 € pour une v4 incompatible — ne l''est pas.

    *Ce qui le ferait basculer :* une pièce datée établissant la corrélation mars/pertes sur au moins
    deux sites. Elle n''est pas au dossier. Elle est produisible en quinze jours.


    ---


    ## 5. Ce que j''engage dans les quinze jours


    1. **J1–J3 · Extraction des journaux** du module de réservation, 1ᵉʳ janvier → aujourd''hui, par site
    et par date, avec en regard les fenêtres d''indisponibilité des bornes. *Livrable : un tableau daté.*
    C''est la pièce qui manque à tout le dossier.

    2. **J1 · Demande écrite à l''éditeur**, trois questions, réponse sous 8 jours : (a) maintien de la
    remise au 15 octobre ; (b) engagement écrit de compatibilité v4 / bornes 2015, avec date ; (c) assiette
    exacte de la remise. Une absence de réponse est une réponse, et sera rapportée telle quelle.

    3. **J2–J8 · Entretiens sur site** à Rive-Sud et à Fontaine (responsable + deux agents de banque de
    prêt chacun) : reconstituer ce qui a changé en février et mars, et vérifier si Fontaine constate sans
    déclarer (C4).

    4. **J3–J10 · Test de non-régression** : rejouer une série de réservations depuis Rive-Sud et depuis
    un site sans changement fibre/portail. Sépare la cause réseau de la cause applicative.

    5. **J8 · Relance ciblée des 19 non-répondants**, deux questions seulement : constatez-vous des pertes,
    et depuis quand. Corrige le défaut principal de l''enquête (C2).

    6. **J10 · Relevé réel** de la charge de ressaisie de Rive-Sud, en heures constatées sur deux semaines,
    pas estimées.

    7. **J12 · Note de synthèse au comité** : cause établie ou non établie, et ce que cela implique pour
    chacune des trois options.


    Le chargé de mission numérique est associé aux points 1 et 4 : sa note porte l''hypothèse la plus
    précise du dossier, et ce sont les deux tests qui la valident ou l''écartent. Rive-Sud est associé
    au point 6, et sa charge de ressaisie sera portée au dossier comme **un coût du marché en cours**,
    pas comme un ajustement de service.


    **Repli et déclencheurs**

    - *Refus de l''éditeur de décaler la remise au-delà du 15 octobre* → on y renonce, reconduction courte,
    et le refus est versé au dossier de remise en concurrence.

    - *Journaux inexistants ou conservés moins de 30 jours* → le diagnostic par les traces est clos ;
    le test de non-régression (point 4) devient la preuve principale, et la limite est documentée comme
    un défaut du fournisseur.

    - *Aucune cause établie au 30 septembre* → ni v4 ni bascule ; reconduction courte seule, remise en
    concurrence lancée en janvier avec un cahier des charges exigeant la journalisation.

    - *Un troisième site touché par des pertes* → escalade immédiate au comité, sans attendre le J12.


    **L''observation qui renverserait cet avis :** des journaux montrant une rupture datée de mars sur
    au moins deux sites, avec un correctif v4 identifié et une compatibilité bornes 2015 confirmée par
    écrit. Dans ce cas la v4 devient l''option recommandée, et la remise mérite d''être négociée.


    **Première action, dès demain matin :** la demande écrite à l''éditeur (point 2) — c''est celle dont
    le délai de retour est le plus long.

    '
