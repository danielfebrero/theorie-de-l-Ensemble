  text: '# Avis — Renouvellement du contrat logiciel de réservation et bornes de prêt


    *Séance du 28 · échéance contractuelle 31 octobre*


    Chaque point ci-dessous est numéroté pour pouvoir être écarté isolément. La section F indique lesquels
    sont porteurs de la recommandation et lesquels ne le sont pas.


    ---


    ## A. Ce que le dossier établit — et à quel degré


    **C1. Deux problèmes distincts sont mélangés dans le dossier.** `[établi]`

    L''indisponibilité des bornes (matériel) et la perte de réservations (module logiciel) n''ont ni la
    même localisation, ni la même chronologie, ni la même cause probable. Fontaine cumule de l''indisponibilité
    borne et ne signale aucun problème de réservation ; Rive-Sud cumule les deux.

    - **Repose sur :** export technique (32 h sur les deux sites à bornes 2015) vs. notes de sites et
    chronologie de mars.

    - **Renversé par :** une analyse montrant que les pertes de réservation surviennent pendant les fenêtres
    d''indisponibilité borne. Ce croisement n''a pas été fait.


    **C2. L''indisponibilité des bornes est un problème mineur en volume.** `[établi]`

    41 h sur 12 mois et 7 sites, soit environ 0,3 % du temps d''ouverture cumulé ; 0,8 % sur les deux
    sites concernés. À comparer aux ~230 h/an que Rive-Sud consacre à la ressaisie manuelle — près de
    six fois l''indisponibilité totale du parc, sur un seul site.

    - **Repose sur :** export technique + note Rive-Sud, hypothèse de ~2 000 h d''ouverture annuelle par
    site.

    - **Renversé par :** une concentration des 16 h sur les heures de pointe ou sur quelques jours, qui
    changerait l''impact usager sans changer le volume. À vérifier dans l''export horodaté.


    **C3. Une dégradation réelle du module de réservation est apparue vers mars.** `[indiqué, convergent]`

    71 réclamations usagers sur 96 concentrées sur mars–juin (≈18/mois contre ≈3/mois le reste de l''année),
    12 agents situant spontanément le début après la mise à jour, et une ressaisie manuelle engagée à
    Rive-Sud précisément à cette date.

    - **Repose sur :** trois sources indépendantes qui convergent sur la même date.

    - **Renversé par :** un changement d''organisation en mars (nouveau circuit de réclamation, campagne,
    ouverture d''un service) qui expliquerait le pic sans défaut logiciel.


    **C4. La retombée des réclamations après juin n''est pas une preuve de résolution.** `[indiqué]`

    Deux explications concurrentes non départagées : la ressaisie manuelle de Rive-Sud absorbe le défaut
    depuis mars, et juillet–août est une période de basse activité.

    - **Repose sur :** concomitance de la baisse avec le contournement et avec l''été.

    - **Renversé par :** un correctif éditeur daté de juin dans le journal des versions. À demander par
    écrit.


    **C5. Le silence de Fontaine n''est pas une information de même nature que le signalement de Rive-Sud.**
    `[non établi]`

    Un défaut documenté (5 h/semaine, chiffré) et une absence de signalement ne se pèsent pas pareil.
    Fontaine peut être épargné, ou ne pas remonter.

    - **Repose sur :** asymétrie des sources.

    - **Renversé par :** l''extraction des journaux de réservation par site, qui tranche en quelques jours.


    **C6. Le chiffrage « 61 % » ne doit pas être présenté comme 61 % du réseau.** `[correction de lecture]`

    43 répondants sur 62 : 61 % des répondants ≈ 26 agents, soit 42 % de l''effectif au maximum, et une
    déclaration de perception, non un comptage d''incidents. Les 19 non-répondants sont inconnus, pas
    neutres.


    **C7. Le calendrier RH est le facteur le plus contraignant du dossier.** `[établi]`

    Deux informaticiens, un départ en octobre, échéance contractuelle le 31 octobre. Aucun scénario de
    migration ne dispose d''une fenêtre de réalisation crédible sur ce trimestre.


    ---


    ## B. Les trous du dossier


    1. **La compatibilité v4 / bornes 2015 est « à l''étude ».** C''est-à-dire inconnue, sur les deux
    sites qui portent 78 % de l''indisponibilité.

    2. **Rien n''indique que la v4 corrige le défaut de mars.** La migration est présentée comme une réponse
    à un problème dont le lien avec elle n''est nulle part établi.

    3. **Le périmètre de la remise de 12 % est ambigu** : appliquée aux trois années, elle vaut ≈19 800
    € ; appliquée à la seule première, ≈6 200 €. Écart : ≈13 600 €, non tranché.

    4. **Le coût de migration vers le libre n''est pas chiffré**, alors que l''exemple voisin (2 sites
    sur 5 en double saisie après 14 mois) indique qu''il est significatif et durable.

    5. **Que se passe-t-il le 1er novembre sans signature ?** Interruption de service, mode dégradé, prolongation
    possible : non documenté. C''est le seul point capable de renverser la recommandation en quelques
    jours.


    **Repères financiers.** Reconduction 3 ans avec indexation 7 % : ≈165 100 € ; remise pleine : ≈145
    300 €. Avec v4 : ≈176 300 €. Libre annoncé : ≈100 800 € sur 3 ans, hors migration et hors surcoût
    agent.


    ---


    ## C. Les trois options


    | Option | Appréciation | Élément décisif |

    |---|---|---|

    | **Reconduire à l''identique, 3 ans, ‑12 %** | Achète ≈19 800 € de remise au prix d''un verrouillage
    de 3 ans sur un module défaillant non qualifié, sans levier ultérieur | La remise se paie en optionalité,
    au moment précis où l''on en a le plus besoin |

    | **Reconduire + v4 (31 000 €)** | Non défendable en l''état | On paie 31 000 € sur une compatibilité
    inconnue avec les deux sites problématiques, pour corriger un défaut dont rien ne dit qu''elle le
    corrige |

    | **Basculer vers le libre** | Écartée pour ce trimestre, pas sur le fond | Une bascule avec un informaticien,
    en deux mois, alors que le voisin n''a pas fini en quatorze — c''est le scénario de rupture de service
    |


    ---


    ## D. Recommandation


    **Ne pas prendre de décision à trois ans le 28.** Le dossier ne la porte pas.


    Je recommande de **négocier la reconduction la plus courte que l''éditeur accepte** (12 mois, à défaut
    la durée minimale possible), **sans la remise de 12 %**, assortie de deux clauses : engagement correctif
    daté sur le module de réservation, et sortie sans pénalité si l''engagement n''est pas tenu. Le libre
    reste candidat — dans une consultation instruite en 2027, pas dans une bascule improvisée en octobre.


    C''est la variante courte de l''option 1. Elle coûte ≈19 800 € de remise non captée sur trois ans.
    Elle achète : la qualification du défaut de mars, une réponse écrite sur la v4, le recrutement informatique,
    et une mise en concurrence réelle.


    **Le contre-argument le plus fort — je le porte en séance.** L''éditeur peut refuser une durée courte
    ou la tarifer au prix fort ; et rien ne garantit qu''avec un seul informaticien on soit mieux informé
    dans douze mois — auquel cas on revient ici avec moins de levier et une indexation de plus. Ce risque
    est réel. Il ne se neutralise que par des livrables nommés et datés (section E) : sans eux, une reconduction
    courte n''est pas une décision, c''est un report.


    **Condition d''arrêt.** Si au 20 septembre l''éditeur n''a pas répondu par écrit sur la compatibilité
    v4/2015 et que l''extraction des journaux n''est pas faite, on prend par défaut la durée la plus courte
    disponible, sans remise, et on ferme le sujet v4 pour cet exercice.


    **Ce qui renverserait la recommandation.** Deux choses, une seule suffit : (1) l''impossibilité contractuelle
    de prolonger, avec arrêt du prêt automatisé au 1er novembre — la signature devient contrainte ; (2)
    une garantie écrite de compatibilité v4/2015 **plus** un plan de correction daté du défaut de mars
    — la v4 à trois ans avec ‑12 % redevient le choix rationnel.


    ---


    ## E. Engagements sous quinze jours (28 → 12 septembre)


    1. **Courrier à l''éditeur, sous 48 h**, exigeant par écrit : périmètre exact de la remise (1 an ou
    3) ; réponse datée sur la compatibilité v4/bornes 2015 ; journal des versions de mars et juin ; anomalies
    connues sur le module de réservation ; tarif d''une reconduction 12 mois.

    2. **Extraction des journaux de réservation par site sur 12 mois** — convertit « 61 % déclarent »
    en incidents comptés, et tranche le cas Fontaine (C5).

    3. **Relevé chronométré à Rive-Sud sur deux semaines** — remplace l''estimation de mémoire par une
    mesure.

    4. **Vérification juridique** : conditions de dénonciation, reconduction tacite, et situation réelle
    du service au 1er novembre sans signature (point B5).

    5. **Appel direct à la DSI du réseau voisin** : coût complet constaté, durée réelle, et pourquoi deux
    sites tiennent encore le papier.

    6. **Ouverture immédiate du recrutement informatique** — sur le chemin critique de tous les scénarios,
    y compris celui de ne rien changer.


    Aucun engagement financier n''est pris avant le retour du point 1.


    ---


    ## F. Séparabilité — à l''usage du comité


    La recommandation repose sur **C7** (calendrier RH) et **B1–B2** (compatibilité et efficacité v4 inconnues).
    Ces trois éléments suffisent seuls.


    Le comité peut écarter l''enquête interne (C3, C6), l''exemple du réseau voisin, et même les réclamations
    usagers : la recommandation tient encore, la note de Rive-Sud établissant à elle seule un défaut réel
    non qualifié. Inversement, écarter C7 ou obtenir une réponse ferme sur B1–B2 rouvre le débat sur les
    trois options — et c''est précisément ce que les quinze jours servent à provoquer.

    '
