response:
  text: '**Trois points sur lesquels attirer votre attention avant la séance :**


    1. **Le nœud du dossier n''est pas « quelle solution », c''est « pour combien de temps ».** Les trois
    options proposées embarquent chacune un engagement pluriannuel ; la durée est la seule variable qu''on
    peut encore bouger avant le 31 octobre, et personne ne l''a mise sur la table.


    2. **Deux chiffres du dossier ne mesurent pas ce qu''on leur fait dire.** Les 41 h d''indisponibilité
    sont un problème de matériel vieillissant sur deux sites, pas le problème logiciel dont on débat ;
    et la baisse des réclamations après juin est probablement l''effet des 5 h/semaine de ressaisie de
    Rive-Sud, pas d''une résolution.


    3. **La valeur de la remise est inconnue par un facteur trois** (5 760 € ou 18 518 € selon l''assiette).
    C''est le seul argument avancé pour signer sous 48 h, et il n''est pas chiffré.


    Je n''ai pas converti les 5 h/semaine de Rive-Sud en euros : le taux horaire n''est pas au dossier,
    et une estimation inventée aurait affaibli le reste. Si vous me donnez le coût agent chargé, je complète
    le §C9 avant le 28.

    '
