response:
  text: 'Une remarque avant la note : le poids exact des 4 références menacées, la marge réelle sur le
    compte D et la capacité industrielle disponible ne figurent pas dans les éléments dont je dispose.
    J''ai vérifié que la décision ne bascule pour aucune valeur plausible de ces paramètres — elle est
    donc écrite fermement, avec les chiffrages manquants inscrits comme actions à J+3.


    ---


    # NOTE DE DIRECTION — DÉCISION ET MANDAT D''EXÉCUTION


    **Objet :** Proposition de contrat d''exclusivité du distributeur D — décision, mandat, procédure
    de crise

    **De :** Direction générale

    **À :** Comité de direction — exécution obligatoire

    **Date :** 8 août 2026

    **Période couverte :** 9 août – 30 août 2026 (absence du DG)

    **Statut :** Cette note vaut instruction. Elle n''est pas un document de travail.


    ---


    ## 1. Décision


    **Nous ne signons pas le contrat proposé par D. Nous ne rompons pas non plus avec D.**


    Le comité transmet à D, **au plus tard le 16 août**, une contre-proposition écrite dont les termes
    figurent en section 4. Il dispose d''un mandat de signature strictement borné (section 5). Hors de
    ces bornes, aucune signature n''est autorisée en mon absence, quelle que soit la pression exercée.


    En parallèle et **sans lien avec l''issue de la négociation**, le comité exécute le plan de résilience
    de la section 3. Ce plan n''est pas conditionnel. Il s''exécute même si D accepte notre contre-proposition
    dès la première semaine.


    ---


    ## 2. Pourquoi — les trois chiffres qui fondent la décision


    **a) Le point mort volumétrique est à +41 %. D propose +18 %.**


    Une remise de 9 % sur le prix de cession retire 9 points de marge en valeur absolue. Sur un taux de
    marge brute de 31 %, la marge unitaire passe de 31 à 22 points. Pour retrouver notre marge actuelle
    en euros, il faudrait vendre **41 % de volume supplémentaire**. D en engage 18 %, et pour un an seulement.


    Ce calcul est robuste : si la marge réelle sur le compte D est inférieure à 31 %, le point mort monte
    (56 % à 25 % de marge). Aucune hypothèse plausible ne le ramène sous 18 %.


    **b) Le meilleur scénario contractuel est une perte.**


    | Scénario | Marge brute sur D | Écart annuel |

    |---|---|---|

    | Aujourd''hui | 4,62 M€ | référence |

    | An 1, volume +18 % **tenu** | 3,87 M€ | **−0,75 M€** |

    | An 2–3, volume revenu à la base | 3,28 M€ | **−1,34 M€/an** |


    Cumul sur trois ans : **−2,3 M€ si D tient +18 % chaque année** (ce à quoi il ne s''engage pas), **−3,4
    M€ dans le scénario réaliste**. Il n''existe aucune trajectoire où ce contrat crée de la valeur. La
    seule question est donc : ce coût achète-t-il une sécurité qui le vaut ?


    **c) Il n''achète pas de sécurité — il supprime la nôtre.**


    - L''engagement est **asymétrique** : nous nous lions fermement trois ans, D se lie fermement un an.
    Les années 2 et 3 sont « indicatives » — c''est-à-dire que la remise est acquise et le volume ne l''est
    pas.

    - « Indicatif » a déjà une signification connue chez D : **−11 % de commandes au deuxième trimestre,
    sans préavis.** Nous savons déjà comment D traite ce qui n''est pas ferme.

    - La pénalité de sortie de 1,2 M€ représente **57 % de notre trésorerie**. Un contrat dont la sortie
    coûte plus que la moitié de notre cash n''est pas réversible : nous le subirions jusqu''au terme,
    quoi qu''il advienne.

    - L''exclusivité fait passer notre dépendance de **62 % à 100 %**, et stérilise pour trois ans la
    centrale régionale (3,5 M€) et la marketplace (0,4–2,2 M€ à +6 points de marge), soit jusqu''à 1,5
    M€ de marge annuelle abandonnée.


    Une assurance dont la prime dépasse la trésorerie totale, qui ne peut être résiliée, et qui **aggrave
    le risque qu''elle prétend couvrir**, n''est pas une assurance.


    **d) Une observation sur le calendrier, que le comité doit avoir en tête.**


    Le comité d''achat de D se tient en septembre. La véritable échéance est donc postérieure à mon retour.
    Le délai de huit jours n''a pas de cause opérationnelle : il est calé sur mon absence. Le comité doit
    traiter la pression temporelle comme une variable de négociation, pas comme une contrainte physique.


    **e) Ce que révèle la proposition elle-même.**


    D ne propose pas de nous quitter. Il propose de nous garder trois ans en exclusivité. Un distributeur
    qui veut changer de fournisseur ne verrouille pas celui qu''il quitte. Nous sommes plus nécessaires
    à D que ne le suggère le ton de sa demande — huit références, un outil industriel qualifié, des volumes
    engagés. Le comité négocie depuis une position moins faible qu''il ne le ressentira.


    ---


    ## 3. Plan de résilience — exécution immédiate, sans condition


    Ces huit actions s''exécutent quelle que soit l''évolution de la négociation. Aucune ne peut être
    suspendue « en attendant de voir ». Elles sont ce qui change durablement le rapport de force.


    | # | Action | Responsable | Échéance |

    |---|---|---|---|

    | 1 | **Sécuriser le cash.** Négocier une ligne court terme confirmée de 1,5 à 2 M€ et/ou une ligne
    d''affacturage. Objectif : porter la couverture de 3 à 6 mois de charges fixes. **À faire cette semaine,
    tant que la situation se présente comme normale** — une banque prête avant le conflit, pas pendant.
    | Dir. financier | **13 août** |

    | 2 | **Mesurer l''exposition D.** Encours client D, couverture assurance-crédit, délais de paiement
    réels sur 12 mois. Aucun dépassement d''encours toléré à partir de maintenant. | Dir. financier |
    11 août |

    | 3 | **Chiffrer.** CA et marge par référence, dont les 4 menacées. CA-plancher correspondant à 70
    % de plan de charge à Redon. Capacité industrielle réellement disponible pour absorber +18 %. | Contrôle
    de gestion | 11 août |

    | 4 | **Accélérer la centrale régionale.** Solliciter un rendez-vous décisionnel avant fin septembre.
    Proposer un démarrage partiel ou un test sur 2 références. Ne concéder aucune clause supposant une
    exclusivité. | Dir. commercial | 16 août |

    | 5 | **Lancer la marketplace.** En test, **sur des références hors des huit référencées chez D**,
    ou sous une déclinaison de gamme distincte. Objectif : premier chiffre d''affaires facturé avant fin
    septembre. Le choix des références hors périmètre D est impératif : il rend le lancement défendable
    si D l''apprend. | Dir. commercial + marketing | 23 août |

    | 6 | **Constituer le dossier juridique.** Historique complet des commandes, documentation de la baisse
    de 11 % du T2 et de son absence de préavis, conservation de tous les échanges. Avis écrit sur la clause
    d''exclusivité et sur l''étendue des pouvoirs du comité. **Constituer, ne pas brandir** (voir section
    7). | Dir. juridique / conseil externe | 16 août |

    | 7 | **Préparer le volet social.** Dossier d''activité partielle Redon instruit et prêt à déposer,
    **sans dépôt**. Calendrier d''information du CSE établi. Le délai administratif ne doit pas s''ajouter
    au délai commercial. | DRH | 18 août |

    | 8 | **Ouvrir un second canal GMS.** Identifier deux enseignes ou centrales nationales concurrentes
    de D et un acteur de la restauration hors foyer. Prises de contact exploratoires. C''est la seule
    action qui traite la cause : ni la centrale régionale ni la marketplace ne remplacent 14,9 M€. | Dir.
    commercial | 23 août |


    ---


    ## 4. Contre-proposition à transmettre à D avant le 16 août


    Le comité adresse à D une réponse écrite, dans le délai demandé — nous respectons la forme, pas le
    fond. Le courrier confirme notre volonté de poursuivre et d''approfondir la relation, et propose :


    1. **Durée :** 18 mois, reconductible 12 mois par accord exprès des deux parties. Pas 36 mois.

    2. **Remise :** 0 % sur le volume de référence (base : 12 derniers mois glissants). **9 % sur chaque
    euro au-delà de +10 %** de cette base ; 12 % au-delà de +25 %. Calcul et versement trimestriels, sur
    volumes réellement facturés. *La remise rémunère la croissance, elle ne la préfinance pas.*

    3. **Exclusivité :** accordée sur le **canal grande distribution nationale uniquement**, et uniquement
    sur les références effectivement référencées et commandées. Toute référence déréférencée sort de l''exclusivité
    sous 30 jours. Vente directe, marketplace et restauration hors foyer expressément exclues du périmètre.

    4. **Symétrie :** volume plancher **ferme** de D sur toute la durée (≥ 95 % de la base), préavis de
    6 mois pour tout déréférencement, indemnisation de Verdal sur la marge perdue si le plancher n''est
    pas atteint. *Ce que nous engageons fermement doit répondre à un engagement ferme.*

    5. **Sortie :** pénalité supprimée, ou symétrique et plafonnée à 3 % du CA de l''exercice écoulé (≈
    0,45 M€), applicable aux deux parties.

    6. **Prix :** clause de révision indexée matières premières et énergie, à la hausse comme à la baisse,
    révision semestrielle.

    7. **Paiement :** délais actuels maintenus ou réduits. **Toute dégradation du délai de paiement annule
    la remise de plein droit.** Avec trois mois de trésorerie, un allongement de délai nous met en danger
    plus vite qu''une remise.


    ---


    ## 5. Mandat de signature


    Le mandat est confié au **Directeur financier, titulaire**, avec **co-signature obligatoire du Directeur
    commercial**. Le comité en collège ne signe pas : sous pression, un collège cède plus facilement qu''un
    mandataire tenu par une liste.


    **Le comité peut signer sans moi si et seulement si les sept conditions suivantes sont simultanément
    réunies :**


    - [ ] Durée ≤ 24 mois

    - [ ] Coût total de la remise **≤ 350 k€ sur 12 mois glissants**, quel que soit le volume réalisé
    — plafond en valeur absolue, écrit au contrat, vérifiable

    - [ ] Aucune exclusivité portant sur la vente directe ou la marketplace

    - [ ] Pénalité de sortie ≤ 400 k€ **et** symétrique

    - [ ] Volume plancher ferme et opposable sur toute la durée du contrat

    - [ ] Délais de paiement non dégradés

    - [ ] Avis écrit favorable du conseil juridique sur l''ensemble du contrat


    **Si une seule condition manque, on ne signe pas.** Il n''existe pas de « presque conforme », pas
    de dérogation par vote du comité, pas d''exception motivée par l''urgence. La liste est la limite
    de mon mandat, pas une base de discussion interne.


    ### Interdictions formelles


    Le comité **ne peut en aucun cas** :


    - signer une exclusivité de 25 mois ou plus ;

    - accepter une pénalité de sortie supérieure à 400 k€ ou non symétrique ;

    - accorder une remise portant sur le volume de base ;

    - ralentir, suspendre ou différer les actions 4, 5 et 8 de la section 3, sous quelque prétexte que
    ce soit, y compris à la demande de D ;

    - engager un investissement capacitaire lié au +18 % avant signature ;

    - informer D de l''existence, de l''état ou du calendrier des discussions avec la centrale régionale,
    la marketplace ou tout autre canal ;

    - menacer D d''une action juridique (voir section 7).


    ---


    ## 6. Branches


    **A — D accepte, ou reste dans les bornes de la section 5.**

    Signature par les deux mandataires, après avis juridique écrit. Compte rendu au CSE selon le calendrier
    de l''action 7. Le plan de résilience continue de s''exécuter intégralement.


    **B — D contre-propose hors des bornes mais continue de négocier.**

    Aucune signature. Le comité propose un **accord-pont de 6 mois sans exclusivité** : conditions commerciales
    actuelles maintenues, engagement de bonne foi des deux parties, poursuite des discussions. Ce pont
    couvre le comité d''achat de septembre et mon retour. C''est la réponse standard à une pression calendaire
    : on déplace l''échéance au lieu de céder sur le fond.


    **C — D maintient la menace de déréférencement de 4 références.**

    Aucune signature. Réponse écrite : Verdal prend acte, confirme sa volonté de poursuivre la relation,
    demande l''application du préavis contractuel et le maintien des conditions générales. **Ne pas relancer,
    ne pas surenchérir, ne pas améliorer l''offre après un refus** — une concession sous menace enseigne
    à D que la menace fonctionne, et il y aura un comité d''achat chaque année. Bascule immédiate en plan
    de charge dégradé, activation des seuils de la section 8.


    **D — D rompt totalement, suspend ses commandes, ou retarde ses paiements.**

    Plan de crise : mobilisation immédiate des lignes de financement, dépôt du dossier d''activité partielle
    Redon, information du CSE sous 48 h, saisine du conseil juridique sur le fondement de la rupture brutale
    de relations commerciales établies (art. L.442-1 II C. com. — le dossier de l''action 6 sert ici),
    contact des cibles de l''action 8 en priorité absolue. **Et rappel du DG** selon la procédure de la
    section 9.


    ---


    ## 7. Sur la posture


    Le comité négocie sans hostilité et sans excuse. D n''est pas un adversaire : c''est un partenaire
    dont l''intérêt diverge du nôtre sur un point précis, et qui utilise les moyens dont il dispose. Nous
    faisons de même, calmement.


    Le dossier juridique se constitue en silence. Il ne s''évoque ni en réunion, ni par écrit, ni par
    allusion. Sa valeur réside entièrement dans le fait que D ignore qu''il existe. Un dossier brandi
    devient une escalade ; un dossier constitué reste une option.


    De la même façon, les canaux alternatifs se développent sans annonce. Nous ne cherchons pas à impressionner
    D. Nous cherchons à ne plus dépendre de lui.


    ---


    ## 8. Seuils d''alerte — observables, sans interprétation


    Le contrôle de gestion produit un point hebdomadaire, tous les lundis, sur ces trois indicateurs.
    Le franchissement d''un seuil déclenche l''action correspondante **automatiquement**, sans débat de
    comité :


    | Indicateur | Seuil | Déclenchement automatique |

    |---|---|---|

    | Trésorerie disponible | **< 1,4 M€** | Gel de tout investissement et de tout recrutement ; tirage
    sur les lignes de l''action 1 |

    | Plan de charge Redon | **< 75 % sur 3 semaines consécutives** | Dépôt du dossier d''activité partielle
    |

    | Commandes D | **< 80 % de la moyenne des 6 derniers mois, sur 4 semaines** | Passage en branche
    D ; rappel du DG |


    Ces seuils sont volontairement placés **avant** les points de rupture (2,1 M€ de trésorerie, 70 %
    de plan de charge). Un seuil qui se déclenche au moment du dommage ne sert à rien.


    ---


    ## 9. Procédure d''exception


    Je serai injoignable, pas inatteignable. Une note qui ne prévoit aucun retour de contact n''organise
    pas l''autonomie du comité, elle organise l''irresponsabilité de son auteur.


    **Trois déclencheurs, et trois seulement, autorisent mon rappel :**


    1. Franchissement du seuil « commandes D < 80 % » (branche D) ;

    2. Rupture, suspension de commandes ou retard de paiement significatif de la part de D ;

    3. Situation exigeant une signature hors des bornes de la section 5, que le comité estime nécessaire
    à la survie de l''entreprise.


    **Protocole :** message au numéro laissé à l''assistante de direction, avec la mention « VERDAL —
    DÉCLENCHEUR [1/2/3] ». Je rappelle sous 24 h. Un point de situation écrit m''est adressé chaque lundi,
    sans attendre de réponse de ma part.


    Sur le troisième déclencheur, je suis explicite : **si le comité juge la survie de l''entreprise engagée
    et ne peut me joindre dans les 48 h, il décide. Je couvrirai sa décision.** Le mandat est strict pour
    résister à la pression commerciale, pas pour interdire de sauver l''entreprise.


    ---


    ## 10. Le meilleur argument contre cette note


    Le comité y pensera. Autant qu''il l''ait sous les yeux, traité.


    > *« Vous surestimez notre capacité d''encaissement. D ne va pas se contenter de déréférencer quatre
    références : il peut partir entièrement. 14,9 M€ disparaissent, il nous reste 2,1 M€ de trésorerie
    et trois mois. La centrale régionale décide dans cinq mois et n''est pas acquise ; la marketplace
    pèse 1 M€ dans le meilleur des cas. La remise de 9 % coûte 1,34 M€ par an — c''est cher, mais c''est
    le prix de la survie. Vous nous demandez de refuser une mauvaise affaire au risque de n''avoir plus
    d''affaire du tout. »*


    Cet argument est sérieux, et il est en partie exact : **un départ total de D nous tue, et rien dans
    cette note ne le nie.** C''est précisément pourquoi la consigne n''est pas de refuser, mais de ne
    pas signer *ce* contrat tout en maintenant la relation à tout prix. La branche C interdit l''escalade.
    La section 7 interdit la provocation. L''action 1 achète les mois que la trésorerie ne donne pas.


    Où l''argument est faux : il traite la signature comme une protection contre le départ de D. Elle
    n''en est pas une. Après signature, D n''est engagé fermement qu''un an, il conserve la faculté de
    déréférencer, et nous perdons toute possibilité de compenser ailleurs. **Nous aurions payé 1,34 M€
    par an pour un risque qui demeure, en supprimant nos moyens d''y faire face.** Le scénario réellement
    catastrophique n''est pas « D part » — c''est « D reste, aux conditions de D, et nous avons renoncé
    à trois ans de diversification pour l''obtenir ».


    Et il ignore le fait le plus solide du dossier : **D nous propose de le garder trois ans.** Ce n''est
    pas le comportement d''un distributeur prêt à partir.


    ---


    ## 11. Ce que j''attends à mon retour


    Le 30 août, je veux trouver : une contre-proposition transmise dans les délais, une ligne de financement
    confirmée, deux contacts GMS engagés, un premier chiffre d''affaires marketplace en cours de facturation,
    un dossier d''activité partielle prêt et non déposé — et **aucune signature qui ne respecte pas intégralement
    la section 5**.


    Si le comité ne peut obtenir qu''une seule de ces choses, que ce soit la dernière.


    *Le Directeur général*

    '
