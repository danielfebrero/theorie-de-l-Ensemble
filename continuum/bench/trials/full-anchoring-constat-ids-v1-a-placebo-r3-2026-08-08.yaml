response:
  text: '## Avis — Renouvellement du marché « réservation + bornes de prêt automatique »

    **Comité de direction du 28 — lecture point par point**


    Chaque point ci-dessous est autonome. Écarter l''un d''eux ne fait pas tomber les autres ; les dépendances
    éventuelles sont signalées explicitement. Pour chaque appréciation figurent l''élément du dossier
    sur lequel elle repose et l''élément qui la renverserait.


    ---


    ### I. Ce que je retiens du dossier


    **1. Le dossier mélange deux problèmes distincts. Les traiter ensemble fausse la décision.**

    Il y a d''un côté une **indisponibilité matérielle** (41 h, dont 32 h sur Fontaine et Rive-Sud, seuls
    sites en bornes 2015 — soit ~16 h par site contre ~1,8 h sur les cinq autres, un rapport de 1 à 9).
    De l''autre, une **perte de réservations d''origine logicielle**. Ce ne sont pas les mêmes causes
    ni les mêmes remèdes.

    *Repose sur :* Fontaine cumule les bornes 2015 et une part majeure de l''indisponibilité, mais ne
    signale aucune perte de réservation. Rive-Sud signale les deux. Si le matériel causait les pertes,
    Fontaine remonterait le même symptôme.

    *Serait renversé par :* une remontée de Fontaine établissant qu''elle subit les mêmes pertes sans
    les déclarer. C''est alors le circuit de signalement qui est en cause, et non le logiciel. **Point
    le plus décisif du dossier, et le moins coûteux à vérifier** (engagement n° 4).


    **2. La datation « mars » est solide, mais pas pour la raison qu''on croit.**

    Elle ne tient pas aux 12 répondants — un souvenir rétrospectif, dans une enquête qui suggérait probablement
    la réponse. Elle tient à deux traces datées et indépendantes : le pic de réclamations (71 sur 96 entre
    mars et juin, soit ~18/mois contre ~3/mois le reste de l''année) et la ressaisie manuelle à Rive-Sud,
    engagée en mars. Trois sources convergentes, dont deux non déclaratives.

    *Serait renversé par :* une date de déploiement effective postérieure au pic, ou un autre événement
    de mars (bascule de catalogue, changement réseau).


    **3. Le problème a peut-être déjà décru — et personne ne l''a vérifié.**

    25 réclamations sur les huit mois hors mars-juin. Trois lectures possibles : correctif silencieux
    de l''éditeur, contournement devenu la norme (on ressaisit, on ne réclame plus), ou renoncement des
    usagers à réserver. **Ces trois lectures n''appellent pas la même décision** : la première désamorce
    l''urgence, la troisième est la plus grave et la seule qui ne se voie pas dans les réclamations.

    *Se tranche par :* courbe mensuelle des réclamations croisée au **volume mensuel de réservations**.
    Si le volume baisse, c''est le renoncement.


    **4. L''enquête ne dit pas « 61 % du réseau ».**

    43 réponses sur 62 ; 61 % de 43 ≈ 26 agents, soit 42 % de l''effectif. Les 19 non-répondants ne sont
    pas présumés indemnes. Le chiffre est un **plancher**, pas une mesure — je recommande de ne pas l''énoncer
    en séance sous la forme « 61 % ».

    *Ne renverse aucun autre point* : les traces de réclamations et de ressaisie tiennent indépendamment
    de l''enquête.


    **5. La contrainte qui commande tout : un seul ETP informatique à partir d''octobre.**

    Ni la migration v4 ni la bascule vers le libre ne se conduisent à un ETP sur octobre-décembre, période
    qui est aussi celle de l''échéance contractuelle.

    *Repose sur :* le réseau voisin, 5 sites contre nos 7, conserve après **14 mois** un registre papier
    sur 2 sites — c''est-à-dire une bascule inachevée à 40 %.

    *Serait renversé par :* un engagement écrit de remplacement du poste avec prise de fonction avant
    octobre, ou une AMOA externe budgétée. En l''absence de l''un des deux, le point 5 disqualifie à lui
    seul l''option libre à cette échéance.


    **6. Les 31 000 € de la v4 achètent aujourd''hui une incertitude.**

    La compatibilité avec les bornes 2015 est « à l''étude » — donc non garantie **précisément sur les
    deux sites qui concentrent 78 % de l''indisponibilité**. Et rien dans le dossier n''établit que la
    v4 corrige le défaut de réservation, lequel provient d''une mise à jour du même éditeur.

    *Serait renversé par :* un engagement contractuel de compatibilité et la mention explicite du correctif
    dans les notes de version.


    **7. Le « 30 % moins cher » du voisin n''est pas un coût complet.**

    C''est un coût *annoncé*, non audité, et il n''intègre pas la charge de contournement — les deux registres
    papier. Nous mesurons chez nous ce que cette charge coûte : les 5 h hebdomadaires de Rive-Sud représentent
    ~225 h par an, soit ~0,14 ETP, et déjà ~115 h consommées depuis mars.

    *Serait renversé par :* un coût complet du voisin sur 14 mois incluant le temps agents. S''il reste
    inférieur de 30 % charges comprises, l''option libre redevient sérieuse — mais se heurte toujours
    au point 5.


    **8. La remise de 12 % avant le 30 est une échéance commerciale, pas l''échéance du dossier.**

    Le contrat court jusqu''au **31 octobre** : deux mois d''instruction sont disponibles. La remise porte
    sur un engagement de trois ans dont **la base de calcul n''est pas précisée**. Selon la réponse, elle
    vaut entre ~20 000 € (12 % sur un prix indexé chaque année : ~165 000 € ramenés à ~145 000 €) et ~38
    000 € (12 % sur le tarif actuel gelé : ~127 000 €). Un écart du simple au double sur un chiffre présenté
    comme acquis.

    *Appréciation :* ce montant est le **prix affiché de l''instruction**. Il est inférieur au risque
    d''un engagement triennal sur un module dont le défaut n''est ni qualifié ni corrigé contractuellement.


    ---


    ### II. Ce que je recommande


    **Aucune des trois options ne peut être arbitrée le 28.** Non par prudence de principe, mais parce
    que deux faits qui les départagent manquent, et que **les deux sont obtenables avant le 31 octobre**
    : l''origine réelle du défaut de mars (point 1 et 3) et la capacité informatique effective à partir
    d''octobre (point 5).


    Je recommande une **quatrième voie : reconduction courte et conditionnée**.


    - **Reconduction de 12 mois fermes** (ou la durée la plus courte obtenable), sans engagement pluriannuel.

    - **Refus de la remise de 12 %** dans sa forme actuelle, qui n''est accessible qu''au prix d''un verrou
    de trois ans.

    - **Clause de service sur le module de réservation** adossée à la mesure de Rive-Sud : correction
    qualifiée sous délai, avoir contractuel à défaut. Le levier de négociation existe précisément parce
    que l''éditeur veut une signature de trois ans — il ne sera jamais plus favorable qu''en septembre.

    - **Décision v4 / libre reportée à janvier**, sur dossier instruit.


    Pourquoi pas les trois options telles que posées : reconduire à l''identique revient à ratifier le
    défaut sans obligation de correction ; la v4 fait payer 31 000 € sans garantie ni sur les deux sites
    fragiles ni sur le défaut lui-même ; le libre est inconduisible à un ETP.


    **Décision matérielle à disjoindre :** le remplacement des bornes 2015 de Fontaine et Rive-Sud se
    justifie quelle que soit l''option logicielle — 32 h d''indisponibilité sur 41 y sont concentrées.
    À chiffrer séparément, sous la seule réserve de compatibilité avec la solution cible.


    ---


    ### III. Ce que j''engage dans les quinze jours (28 août – 12 septembre)


    **Avant le 30 août — deux courriers, aucune signature :**


    1. **Au commercial** : base de calcul exacte de la remise ; prix d''une reconduction de 12 mois fermes
    ; maintien ou non d''une remise sur durée courte. *Un refus de chiffrer une durée de 12 mois est en
    soi une information à rapporter au comité.*

    2. **À l''éditeur, support** : journal des incidents et correctifs du module réservation de mars à
    août, et **date exacte de déploiement** de la mise à jour de mars. Tranche le point 2.


    **Sous quinze jours :**


    3. **Courbe mensuelle** des 96 réclamations **croisée au volume mensuel de réservations** sur 12 mois.
    Tranche le point 3 — notamment l''hypothèse du renoncement.

    4. **Entretien à Fontaine**, 30 minutes, responsable de site et deux agents de banque : constatent-ils
    des pertes non déclarées, et quel est leur circuit de signalement ? Tranche le point 1.

    5. **Relevé à Rive-Sud** sur deux semaines : nombre de réservations ressaisies et temps réel. Convertit
    une estimation en donnée et fournit l''assiette de la clause de service.

    6. **Demande écrite à l''éditeur** : engagement de compatibilité v4 / bornes 2015 (oui, non, ou date),
    et mention du défaut de mars dans les notes de version v4. **Sans réponse écrite au 12 septembre,
    la v4 sort du champ** — on ne présentera pas au comité une dépense de 31 000 € sur une compatibilité
    invérifiée.

    7. **Entretien avec la DSI du réseau voisin**, une heure : coût complet sur 14 mois charges agents
    comprises, et motif du maintien du papier sur 2 sites.

    8. **Point RH** : date de publication du poste informatique et date réaliste de prise de fonction.
    Conditionne le point 5, donc l''ensemble des options de transformation.


    ---


    ### IV. Ce que le dossier ne permet pas d''affirmer aujourd''hui


    - Que les bornes 2015 sont à l''origine des pertes de réservation (point 1).

    - Que le défaut de mars persiste aujourd''hui (point 3).

    - Que la v4 le corrige (point 6).

    - Que la solution libre coûte 30 % de moins toutes charges comprises (point 7).

    - Que la remise vaut 20 000 € ou 38 000 € (point 8).


    **Ce que je demande au comité de trancher le 28** : le seul mandat de négociation d''une reconduction
    courte et conditionnée, et une date de retour — proposition : séance de janvier, sur les huit éléments
    ci-dessus instruits.

    '
