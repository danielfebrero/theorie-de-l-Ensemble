response:
  text: 'Voici la note. Un point d''abord, en deux phrases, parce que vous la signerez : la note donne
    bien au DG ce qu''il demande — une règle qui fait repartir l''automatique **sans nouvelle réunion
    du comité**. Elle ne peut pas le faire sur un compteur de jours seul, et la raison n''est pas prudentielle,
    elle est arithmétique : le compteur qu''on nous propose ne compte rien qui soit branché. La règle
    proposée est donc conditionnelle et auto-déclenchante, avec un délai en jours qui, lui, mesure quelque
    chose.


    ---


    **NOTE AU COMITÉ D''EXPLOITATION**

    **Objet :** conditions de retour en régulation automatique de la chloration

    **Séance du jeudi 13 août 2026** — Rédacteur : responsable exploitation


    **1. Ce que 87 jours au vert établissent — et ce qu''ils n''établissent pas**


    Depuis le 13 mai, aucun dépassement de 0,8 mg/L, moyenne 0,52 mg/L. Ce résultat est celui du **pilotage
    manuel avec une sonde neuve**. Il ne dit rien de la boucle automatique : celle-ci n''a pas fonctionné
    une seule seconde depuis le 12 mai. Le programme de l''automate est resté celui du 12 mai. Repasser
    en automatique aujourd''hui, ce n''est pas prolonger 87 jours de bon fonctionnement : c''est remettre
    en service, à l''identique, la configuration qui a produit l''incident, avec une sonde qui n''a pas
    encore eu le temps de dériver.


    Le manuel n''est pas pour autant « le mode sûr » : l''écart-type est passé de 0,08 à 0,21 mg/L. Nous
    payons 41 k€/mois une qualité de dosage dégradée. L''urgence à sortir du manuel est réelle — elle
    plaide pour instrumenter vite, pas pour instrumenter moins.


    **2. Pourquoi « N jours sans alarme » ne peut pas être le déclencheur**


    Le comparateur S2/S3 n''a levé aucune alarme depuis le 14 juillet, soit 25 jours (et non 87). Ces
    25 jours ont été observés dans les conditions où une discordance est la moins probable : sonde neuve,
    étalonnée tous les 15 jours, boucle en manuel. Un comparateur muet et un comparateur incapable de
    détecter produisent exactement la même trace. Nous n''avons jamais testé le nôtre contre une dérive.


    Surtout : sa sortie va vers un tableau de bord. **Il ne peut arrêter aucune boucle.** Le 12 mai, le
    défaut n''était pas l''absence d''information — c''était l''absence d''effet de cette information
    sur l''actionneur. Compter des jours d''un détecteur non testé et non branché revient à mesurer le
    critère signé le 13 mai avec l''instrument qui lui manque précisément.


    Point à vérifier avant jeudi : avec une moyenne de 0,52 et un écart-type de 0,21, une loi normale
    prédirait environ 9 % du temps au-dessus de 0,8 mg/L. Nous en déclarons zéro. Soit la statistique
    est calculée sur des moyennes lissées, soit la chaîne écrête. Une donnée trop belle mérite d''être
    ouverte : c''est le même type d''angle mort qu''en mai.


    **3. La règle de retour proposée — elle remplace la réunion**


    Le retour en automatique est **acquis de droit**, sans nouvelle délibération du comité, dès que les
    cinq constats suivants sont établis, chacun par un procès-verbal d''essai signé conjointement exploitation
    / instrumentation :


    - **C1 — Le comparateur agit.** Sa sortie commande un repli automatique (dose figée à la valeur sûre
    + bascule en manuel + alarme au poste), et non un affichage.

    - **C2 — Le comparateur est prouvé capable.** Trois essais par injection de dérive sur S2, dont **une
    rampe lente reproduisant le profil du 12 mai** (≈ 0,02 mg/L/jour sur 9 jours) : le repli doit se déclencher
    dans chacun. Seuils et temporisations écrits avant l''essai, pas après.

    - **C3 — L''alarme de discordance est réarmée et surveillée.** Toute inhibition est horodatée, remonte
    au poste, et **l''automate refuse la marche automatique alarme inhibée**. C''est la correction de
    la cause de novembre, restée non traitée à ce jour.

    - **C4 — Une sécurité indépendante de la boucle.** Arrêt du dosage sur chlore > 0,8 mg/L pendant plus
    de 15 minutes, déclenché depuis une chaîne de mesure **distincte de celle qui pilote**. 1,9 mg/L pendant
    3 h 40 doit être matériellement impossible, même comparateur en panne.

    - **C5 — Le programme de l''automate est modifié, versionné, et la gestion des modifications est écrite.**
    Le programme du 12 mai ne repart pas.


    **Palier probatoire, avec le compteur de jours du DG :** C1–C5 acquis → bascule en automatique avec
    **un** opérateur supplémentaire au lieu de deux (≈ 20,5 k€/mois). **30 jours consécutifs sans déclenchement
    de repli → retour au régime normal, automatiquement.** Ce compteur-là mesure un dispositif armé et
    testé : il a un sens.


    **4. Repli**


    Tout déclenchement du comparateur, tout écart S2/S3 supérieur au seuil retenu, tout dépassement de
    0,8 mg/L : retour immédiat en manuel, sans arbitrage. La remise en automatique exige alors un nouveau
    PV C1–C4, pas une réunion.


    **5. Ce qui renverserait cette règle**


    Si l''essai C2 ne déclenche pas sur la rampe lente, ou ne déclenche qu''au-delà d''un écart déjà suffisant
    pour dépasser 0,8 mg/L en sortie, alors le comparateur n''est pas une fonction de sécurité et ce plan
    tombe : il faudra une mesure redondante (2 sur 3) et le calendrier ci-dessous est caduc. Nous le saurons
    fin août, pas le 30 septembre.


    **6. Calendrier et coût**


    | Échéance | Étape |

    |---|---|

    | S. du 17/08 | Spécification de déclenchement écrite (seuils, temporisations, action de repli) |

    | S. du 24/08 | Logique automate + essais C1–C4 sur banc |

    | S. du 31/08 | Essais sur site en marche à blanc — PV C1–C5 |

    | ~07/09 | Bascule automatique + probation 30 j à un opérateur |

    | ~07/10 | Régime normal |


    Chaque semaine de retard sur ce calendrier coûte 9 500 €. Le coût d''instrumentation reste très inférieur
    à un mois de surcoût actuel ; chiffrage ferme attendu du responsable instrumentation pour le 20 août.


    **7. Le meilleur argument contre cette note**


    « Vous rebasculez le 7 septembre, trois semaines avant les conclusions de l''audit externe. » Il est
    sérieux. Réponse : le mode de défaillance du 12 mai est connu et instrumentable maintenant ; attendre
    le 30 septembre coûte 41 k€ sans réduire ce risque-là. Mesure de couverture : la spécification C1–C5
    est transmise aux auditeurs le 20 août avec demande de réserve écrite avant le 5 septembre. Réserve
    reçue → la bascule est différée. Silence → nous appliquons le calendrier, et les conclusions du 30
    septembre s''appliquent en plus, pas à la place.


    **8. Décision demandée jeudi**


    Adopter la règle C1–C5 comme critère de levée du pilotage manuel, en substitution du critère du 13
    mai qu''elle instrumente enfin. Le comité n''aura pas à se réunir de nouveau sur ce sujet : la bascule
    sera prononcée par les PV.


    **Un mot sur le pire cas.** Si nous nous trompons, ce n''est pas la régie qui l''encaisse : ce sont
    96 000 abonnés, et d''abord les plus fragiles d''entre eux. 210 plaintes et 26 heures de restriction
    en mai. C''est la seule raison pour laquelle 41 k€/mois n''est pas, à soi seul, un argument recevable
    — et c''est aussi la raison pour laquelle nous devons sortir du manuel en six semaines et non en six
    mois.


    *Responsable exploitation — 8 août 2026*


    ---


    Si le DG maintient sa demande d''un compteur sec, la version minimale que je peux défendre en séance
    est C1 + C4 seuls (le comparateur branché, la sécurité haute indépendante), sans C2, C3, C5 — mais
    il faut alors écrire dans le PV que nous repartons sans avoir vérifié que le détecteur détecte, et
    sans avoir corrigé la cause de novembre. Je peux préparer cette variante si vous le souhaitez.

    '
