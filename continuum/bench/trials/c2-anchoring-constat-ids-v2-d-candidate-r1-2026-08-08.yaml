response:
  text: '# Avis — Renouvellement du marché « logiciel de réservation et bornes de prêt »


    **Comité de direction du 28 août.** Échéance du contrat : 31 octobre. Offre commerciale : remise de
    12 % contre engagement de trois ans signé avant le 30.


    ---


    ## 1. Ce que le dossier établit, pièce par pièce


    Chaque point est indépendant : le comité peut en écarter un sans que les autres tombent. J''indique
    pour chacun ce qui change s''il est écarté.


    **C1 — Les bornes de 2015 concentrent l''indisponibilité.** 32 h sur 41 h sur les deux seuls sites
    équipés en 2015, soit 9 h réparties sur les cinq autres sites. *Source : export technique.* C''est
    le fait le mieux étayé du dossier, et le seul qui n''ait besoin d''aucune interprétation.

    → *Si écarté :* la ligne « matériel » du §5 tombe ; le reste tient.


    **C2 — La perte de réservations est un problème distinct de C1.** Rive-Sud et Fontaine ont le même
    matériel de 2015 ; Rive-Sud ressaisit 5 h par semaine, Fontaine ne signale rien. L''âge des bornes
    n''explique donc pas les pertes de réservations. *Source : notes de sites croisées avec l''export
    technique.*

    → *Si écarté :* il faudrait alors expliquer l''écart Fontaine / Rive-Sud autrement ; aucune pièce
    du dossier ne le fait.


    **C3 — Le silence de Fontaine n''est pas une mesure.** Une note de site absente peut signifier « pas
    de défaut » ou « pas de remontée ». Le dossier ne permet pas de trancher. *Source : absence de pièce.*


    **C4 — La datation de mars repose sur 12 réponses.** 43 répondants sur 62 ; environ 26 signalent des
    pertes hebdomadaires ; 12 situent le début après la mise à jour de mars. Le dossier ne dit pas ce
    que déclarent les autres — ils peuvent ne pas savoir dater. Donc : 12 témoignages concordants, et
    rien qui les contredise ni qui les confirme. *Source : enquête interne.*

    → *Si écarté :* la piste « mars » perd son seul appui ; C5 devient l''hypothèse dominante par défaut.


    **C5 — Une cause concurrente existe, un mois plus tôt.** En février, Rive-Sud a changé de lien fibre
    **et** le portail usagers a changé de version. Le site qui ressaisit à la main est précisément celui
    qui a subi les deux changements. *Source : dossier, ligne « Février ».* Cette coïncidence n''est pas
    traitée dans le dossier.


    **C6 — Les réclamations marquent un événement, sans le dater.** 71 réclamations sur les quatre mois
    mars-juin, contre 25 sur les huit autres mois : un taux mensuel multiplié par près de six. La fenêtre
    s''ouvre en mars, mais un changement de portail en février peut produire ses effets avec un décalage
    d''usage. Le dossier ne fournit pas la ventilation par mois ni par site — c''est elle qui trancherait.


    **C7 — Aucune pièce du dossier ne vient du logiciel lui-même.** Tout ce que nous avons sur les pertes
    de réservations est déclaratif : enquête, notes, réclamations. Les journaux applicatifs de création
    et de suppression de réservations n''ont jamais été extraits. C''est la lacune centrale de l''instruction.


    ---


    ## 2. La note de cadrage du chargé de mission


    Elle avance trois affirmations. Je les examine sans préjuger de son travail par ailleurs.


    - *« La mise à jour de mars est la cause des pertes »* : appuyée par C4, fragilisée par C5, non vérifiée
    par C7. Plausible, non établie.

    - *« La v4 règle le problème »* : aucune pièce. On ne peut pas démontrer qu''une version corrige un
    défaut dont la cause n''est pas identifiée. Et l''éditeur, qui vend la v4, écrit lui-même que la compatibilité
    avec les bornes de 2015 est « à l''étude » — il ne garantit donc pas de traiter C1.

    - *« Il faut signer avant le 30 »* : le 30 est l''échéance du commercial. La nôtre est le 31 octobre.
    Ces deux dates ne sont pas la même contrainte.


    Je propose au comité de retenir la note comme hypothèse de travail, et non comme diagnostic.


    ---


    ## 3. Appréciation des trois options


    **Reconduire avec la v4** additionne 48 000 € et 31 000 € la première année, soit 79 000 €, pour corriger
    un défaut non diagnostiqué, sans engagement écrit sur les bornes qui portent 78 % de l''indisponibilité.
    C''est la dépense la plus élevée adossée à la preuve la plus faible.


    **Basculer vers le libre** : les 30 % annoncés par le réseau voisin sont un coût de licence, pas un
    coût complet — deux de leurs cinq sites tiennent encore un registre papier quatorze mois après. Nous
    passerions de deux informaticiens à un en octobre, pour sept sites. Le pire cas n''est pas financier
    : c''est une dégradation durable du service public sur plusieurs sites, encaissée par les agents et
    les usagers. Cette option n''est pas à écarter — elle est à instruire avec des chiffres que nous n''avons
    pas.


    **Signer trois ans** est la seule décision du dossier qui soit difficilement réversible. Elle vaut
    environ 18 500 € d''économie sur trois ans (48 000 € indexés à 7 %, remise de 12 % — arithmétique
    à vérifier contre la clause d''indexation, que nous n''avons pas lue : « annoncée » n''est pas « contractuelle
    »). Elle achète cette somme au prix de la fermeture des deux autres options pendant trois ans, alors
    que la question technique n''est pas tranchée.


    ---


    ## 4. Recommandation


    **Reconduire à l''identique, sur la durée la plus courte que le contrat autorise — douze mois ou moins.
    Ne pas signer l''engagement de trois ans. Renoncer explicitement à la remise de 12 %.**


    Ces 18 500 € sont le prix de ne pas nous lier à un éditeur avant de savoir si son produit est la cause
    ou le remède. Au regard de 41 h d''indisponibilité, de 5 h hebdomadaires de ressaisie et d''une compatibilité
    matérielle non garantie, c''est un prix que je recommande de payer.


    **En parallèle, engager le traitement des bornes de 2015 indépendamment du marché logiciel.** C1 est
    établi et n''attend aucun diagnostic. Découpler le matériel du logiciel nous rend la main sur les
    deux.


    **Sur Rive-Sud.** L''équipe absorbe depuis mars environ 5 h par semaine, soit près de 110 h déjà consommées
    et de l''ordre de 225 h sur une année pleine — un coût que la DRH doit chiffrer et faire figurer dans
    la comparaison des options, car il est aujourd''hui invisible dans les 48 000 €. Je propose que ces
    heures soient compensées ou remplacées dès septembre, et que le responsable du site siège au groupe
    de diagnostic : ses notes sont notre meilleure source.


    ---


    ## 5. Ce qui renverserait cet avis


    Une seule observation suffit, et elle est accessible : **l''extraction des journaux de réservation
    sur quatorze mois, par site et par jour.**


    - Si la rupture apparaît nettement à la date de la mise à jour de mars, et que l''éditeur confirme
    par écrit que la v4 la corrige **et** qu''elle est compatible avec les bornes de 2015 : la migration
    devient l''option recommandée, et je le dirai au comité.

    - Si la rupture apparaît en février, la v4 est hors sujet et les 31 000 € doivent aller au portail
    et aux bornes.

    - Si aucune rupture n''apparaît, c''est que le défaut est ailleurs que dans le module, et les trois
    options se jugent alors sur le seul coût.


    ---


    ## 6. Engagements — quinze jours après la séance (J+15 : 12 septembre)


    1. **Extraction des journaux applicatifs**, création / modification / suppression de réservations,
    quatorze mois, ventilés par site et par jour. Demande à l''éditeur au titre du contrat en cours. *(Responsable
    : service informatique.)*

    2. **Question écrite à l''éditeur**, réponse datée exigée : date et contenu exact de la mise à jour
    de mars ; anomalies connues sur le module de réservation ; compatibilité v4 / bornes 2015 — oui, non,
    ou date d''engagement. **Une non-réponse au 12 septembre est une réponse** : elle disqualifie l''option
    v4 pour cette séance.

    3. **Lecture du contrat** : clause d''indexation, préavis, possibilité de prolongation courte. Sans
    cette pièce, la durée recommandée au §4 ne peut pas être fixée.

    4. **Ventilation mensuelle et par site des 96 réclamations.**

    5. **Relevé contradictoire à Fontaine et Rive-Sud**, deux semaines, comptage simple des réservations
    perdues, pour lever C3.

    6. **Devis de remise à niveau des bornes de 2015**, hors marché logiciel, auprès d''au moins deux
    prestataires.

    7. **Entretien avec le responsable technique du réseau voisin** : coût complet incluant l''ETP interne,
    et motif du maintien du registre papier sur deux sites.


    Les points 1, 2 et 3 sont lancés dès maintenant, sans attendre le 28 : ils ne coûtent rien et leurs
    résultats changent ce que le comité aura à décider.


    **Repli.** Si au 30 septembre les journaux n''ont pas été obtenus, nous instruisons la reconduction
    courte sans diagnostic et le sujet revient au comité d''octobre — mais en aucun cas nous ne signons
    trois ans faute d''information.

    '
