response:
  text: '## Note au comité de direction


    **Objet :** plan de réduction du DAF — position et engagements

    **Date :** lundi

    **Régime de la décision :** deux problèmes de nature différente sont ici traités sur un seul indicateur
    (l''économie mensuelle). Ils doivent être séparés avant d''être recomposés : la trésorerie est un
    problème chiffrable et réversible ; l''accréditation est un problème de seuil, à sortie binaire et
    non rattrapable. Aucune économie mensuelle ne se compare à une perte d''accréditation, parce que les
    deux ne se mesurent pas dans la même unité.


    ---


    ### 1. Verdict


    Je retiens le volet A en totalité. Je retiens deux des quatre mesures du volet B. **J''écarte la mesure
    « retour de Ferrand en production avec supervision de Vidal ramenée à 55 h/mois », ainsi que sa variante
    à 70 h/mois, et j''écarte le gel du poste de second apprenti signataire.** Je ne signe pas les deux
    contrats-cadres dans les termes proposés.


    La note du DAF conclut que l''accréditation n''est pas concernée. Cette conclusion vérifie la mauvaise
    échéance. Le mur n''est pas M14. Il est **fin M8**, date de départ de Ferrand.


    ---


    ### 2. Le calcul qui fonde ce refus


    Vidal doit encore valider six mois de pratique. Un mois sous 100 h compte au prorata. Le départ de
    Ferrand fin M8 ouvre un changement de superviseur, qui **ramène l''exigence à douze mois sous le nouveau
    superviseur**. Il lui reste donc huit mois calendaires pour acquérir six mois de crédit. Au-delà,
    le compteur ne ralentit pas : il repart de zéro.


    | Heures/mois | Crédit acquis/mois | Crédit fin M8 | Résultat |

    |---|---|---|---|

    | 120 (situation actuelle) | 1,00 | 6,0 atteint dès **fin M6** | agrément ≈ fin M8, **2 mois de marge**
    |

    | 100 | 1,00 | 6,0 fin M6 | agrément ≈ fin M8, 2 mois de marge |

    | 75 (seuil théorique) | 0,75 | 6,0 exactement fin M8 | agrément ≈ fin M10, **marge nulle** |

    | **70 (variante proposée)** | 0,70 | **5,6 — il manque 0,4** | **remise à 12 mois** |

    | **55 (mesure proposée)** | 0,55 | **4,4 — il manque 1,6** | **remise à 12 mois** |


    Le seuil de viabilité est à 75 h/mois **sans un seul mois de retard**. La variante à 70 h/mois n''est
    pas un compromis prudent : elle est du mauvais côté de la falaise, et l''écart y est trop faible pour
    être vu autrement que par le calcul.


    Enchaînement en cas de remise à zéro : douze mois sous Bouchard ou Nseka à partir de M9 → fin M20,
    agrément ≈ M22. Or l''effectif passe à deux signataires à M15. Suspension notifiée sous 30 jours,
    soit **M15–M16**. Le retour se fait par accréditation initiale : 14 à 20 mois, 340 k€, **dossier recevable
    seulement si trois signataires agréés sont en poste** — c''est-à-dire pas avant M22. Dépôt M22, décision
    M36–M42. Trois ans sans couvrir 87 % du chiffre d''affaires, avec 31 salariés à porter. Ce n''est
    pas un mauvais tirage : c''est une branche sans retour, et elle interdit l''exécution quelle que soit
    l''économie associée.


    ---


    ### 3. Ce que « réversible en trente jours » ne couvre pas


    La mesure est rétablissable en trente jours. Son effet ne l''est pas. Rétablir la supervision de Vidal
    à 120 h/mois en M9 ne rend pas Ferrand disponible : il est parti. Le gel du second apprenti est rétablissable
    en trente jours ; le délai qu''il crée est de vingt-quatre mois plus huit semaines, soit environ vingt-six
    mois de pipeline perdus mois pour mois. **Une mesure réversible peut produire un état qui ne l''est
    pas.** Le critère « aucune irréversible » a été appliqué aux mesures, pas à leurs conséquences ; c''est
    là que la note du DAF décroche.


    ---


    ### 4. Ce que valent les éléments d''appui


    Le cabinet a comparé neuf laboratoires : sept ont conservé leur accréditation. Deux ne l''ont pas
    conservée. Sur une issue qui ferme l''entreprise, deux sur neuf est un taux d''échec de 22 %, et c''est
    ce chiffre-là qui décide, pas le premier. Par ailleurs « plan équivalent » n''est pas défini : la
    seule caractéristique qui compte ici est une réduction d''heures de supervision pendant le préavis
    du superviseur unique d''un apprenti en cours de cycle. Je demande au cabinet de dire, par écrit,
    combien des neuf laboratoires présentaient cette configuration. Tant que la réponse n''est pas connue,
    le benchmark ne porte pas sur notre question.


    Cinq cosignatures sur sept établissent un accord, pas un fait. Le calcul du § 2 ne devient pas faux
    s''il est minoritaire.


    ---


    ### 5. Ce que je retiens, ligne à ligne


    **Volet A — retenu intégralement, 24 k€/mois, dès M1.** La perte historique de 4 % porte sur le chiffre
    non accrédité, soit 13 % du total : environ 0,5 % du chiffre d''affaires, de l''ordre de 1 à 2 k€/mois
    à notre taille. Réserve à lever : ce chiffre mesure la casse hors accréditation, alors que la préparation
    d''échantillons alimente aussi les essais accrédités. Je demande au responsable production les délais
    de file d''attente en préparation sur les douze derniers mois, séparés accrédité / non accrédité,
    avant M1.


    **Volet B — non-remplacement d''un technicien : retenu**, sous réserve écrite que le poste ne se situe
    ni dans la chaîne de préparation, ni dans les heures qui permettent aux signataires de superviser.


    **Volet B — internalisation de la maintenance métrologie : retenue sous condition suspensive.** La
    traçabilité des étalonnages est un point d''audit direct du référentiel. Validation écrite du responsable
    qualité sur le maintien de la chaîne de raccordement avant exécution, faute de quoi la mesure tombe.


    **Volet B — gel du second apprenti signataire : écarté.** C''est la seule mesure qui reconstruit de
    la marge, et elle est aussi la clé des 41 k€/mois évoqués au § 6.


    **Volet B — retour de Ferrand en production : écarté** aux deux valeurs proposées.


    Économie retenue : 24 k€ certains, plus la part du volet B conservée (j''attends du DAF le détail
    des 26 k€ ligne à ligne avant lundi). **Dans l''hypothèse la plus défavorable où seul le volet A tient,
    le déficit passe à 37 k€/mois et la trésorerie couvre 21 mois** — au-delà de M8, au-delà de M14, au-delà
    de l''agrément de Vidal. Autrement dit : la mesure qui met l''accréditation en jeu achète du temps
    que nous avons déjà. L''arbitrage n''est pas serré.


    ---


    ### 6. Les deux contrats-cadres


    41 k€/mois représentent les deux tiers du déficit courant. Ils ne sont pas signables tels quels. Ils
    exigent deux signataires dédiés **en plus** de l''activité courante, soit cinq au total. Nous en aurons
    trois de M9 à M14, et trois à partir de M15 si et seulement si Vidal est agréée. Construire un cinquième
    signataire demande vingt-quatre mois plus huit semaines à partir d''un apprenti placé aujourd''hui.
    Je propose au client un démarrage échelonné — un contrat, à une date à négocier — et je conditionne
    toute signature au dégel du poste d''apprenti. Cette offre est l''argument le plus fort contre le
    volet B, pas un sujet séparé.


    ---


    ### 7. Ce sur quoi j''engage le laboratoire


    1. **Supervision de Vidal maintenue à 120 h/mois sous Ferrand**, sécurisée par avenant à son préavis,
    jusqu''à validation écrite de ses six mois. Elle ne change pas de superviseur : un changement remettrait
    le compteur à douze mois. C''est l''engagement auquel j''attache ma signature.

    2. **Si Ferrand n''est pas maintenable jusqu''à fin M8 sur son contrat actuel**, nous lui achetons
    les heures de supervision par contrat de prestation. Une prestation de supervision de huit mois coûte
    moins que 340 k€ et trois ans d''arrêt.

    3. **Second apprenti signataire recruté avant fin M2, placé sous Bouchard ou Nseka** — jamais sous
    Marchand ni Ferrand, dont le départ réinitialiserait son cycle.

    4. **Recherche d''un signataire déjà agréé pour succéder à Marchand, lancée en M1.** De M9 à M14 nous
    serons exactement au plancher de trois : une absence longue, une démission, un débauchage suffisent.

    5. **Volet A exécuté dès M1.**

    6. **Première action, sous cinq jours ouvrés :** saisine écrite de l''organisme d''accréditation sur
    trois points — le départ du superviseur réinitialise-t-il le cycle lorsque la pratique est achevée
    ou quasi achevée ; le prorata s''apprécie-t-il mois par mois ou sur un cumul d''heures ; quel est
    le décompte exact des mois déjà validés pour Vidal. Ces réponses sont peu coûteuses et décident de
    tout le reste ; les obtenir vaut mieux que trancher sans elles.


    **Ce qui renverserait ma position :** une confirmation écrite de l''organisme sur l''un des deux premiers
    points. Si le prorata s''apprécie sur un cumul d''heures, ou si un départ de superviseur en fin de
    cycle n''entraîne pas de remise à zéro, la variante à 70 h/mois redevient discutable et je le dirai.
    En l''absence de cette réponse écrite, la lecture littérale du référentiel s''impose.


    **Hypothèse déclarée :** je lis « il lui reste six mois de pratique » comme six mois de crédit restant
    à acquérir à 100 h/mois au moins, et « fin M8 » comme la date de la dernière heure supervisée de Ferrand.
    Si l''exigence résiduelle est exprimée en heures et non en mois, tout le § 2 est à refaire — c''est
    le premier point de la saisine.


    **Déclencheurs de repli, à suivre en comité mensuel :**

    - Un mois de supervision de Vidal sous 100 h → réallocation sous cinq jours ouvrés. Deux mois consécutifs
    → passage en comité extraordinaire et achat d''heures à Ferrand.

    - Départ de Ferrand avancé avant fin M8 → contrat de supervision immédiat ; à défaut, gel de toutes
    les mesures d''économie et priorité au recrutement d''un signataire agréé.

    - Trésorerie sous 500 k€ ou déficit au-dessus de 45 k€/mois constaté à M6 → réouverture du volet B
    **sur les seules lignes sans effet sur les signataires**, et action sur les recettes.

    - Annonce de départ de Bouchard ou Nseka → le plancher est perdu dès M15 ; procédure d''urgence immédiate.


    ---


    ### 8. Le meilleur argument contre cette note


    Il existe et je le formule : le volet B rapporte 26 k€/mois, la trésorerie est réelle, la banque a
    fermé la porte en janvier, et je propose de renoncer à la moitié du plan sur la base d''une lecture
    littérale d''un référentiel que sept laboratoires sur neuf ont apparemment contournée sans dommage.
    Si l''organisme applique la règle avec souplesse, j''aurai coûté au laboratoire une partie de sa marge
    de sécurité.


    Il ne tient pas, pour une raison : les deux risques ne sont pas de même nature. Me tromper dans mon
    sens coûte quelques mois de trésorerie sur une réserve de vingt et un mois, et se corrige. Me tromper
    dans l''autre sens ferme le laboratoire et ne se corrige pas — le référentiel verrouille lui-même
    la sortie, puisque le dossier de retour exige les trois signataires que la suspension aura fait perdre.
    Entre une erreur récupérable et une erreur qui supprime le joueur, il n''y a pas d''arbitrage à faire.


    Ce que le plan appelle « la même économie » recouvre en réalité deux choses : 24 k€ qui coûtent des
    délais, et 26 k€ dont une part coûte l''entreprise. Le comité peut décider de payer le premier prix.
    Il ne peut pas décider du second sans le savoir, et c''est l''objet de cette note.

    '
