response:
  text: '# Note au conseil — Caisse de prévoyance des Marins du Ponant


    ## Verdict


    **C : non, à tout montant, aux conditions présentées. B : gelée jusqu''à réponse de l''UMA, puis rouverte
    sous plafond. A : maintenue comme support par défaut, pas comme stratégie.** L''engagement réel de
    la caisse porte ailleurs : sur le dépôt immédiat d''un dossier de transfert à l''Union mutualiste
    de l''Atlantique, dont la fenêtre d''éligibilité se referme dans 12 à 20 mois.


    ---


    ## C — veto, pour deux raisons indépendantes


    **1. La branche à 3 % n''est pas un mauvais tirage, c''est une porte à sens unique.** Elle produit
    une réserve de 4,7 M€, sous le seuil statutaire de 11 M€ : liquidation de plein droit. Ce que la caisse
    perd alors, elle ne le récupère par aucune trajectoire ultérieure — et ce n''est pas la caisse qui
    encaisse, ce sont 4 200 affiliés de 61 ans de moyenne d''âge, fortement exposés à l''amiante, sur
    un portefeuille qu''aucun assureur n''a accepté de coter en 2025. Ils ne se réassurent nulle part.
    Le conseil ne dispose pas de ce risque-là : il l''emprunte à des gens qui n''ont pas voté.


    Une espérance ne s''applique qu''à un joueur qui reste à la table sur les 10 000 trajectoires. Dans
    3 % d''entre elles, la caisse n''existe plus. Le « C domine B dans 94 % des trajectoires » est vrai
    et sans portée : il mesure la richesse terminale d''un survivant, pas la survie.


    **2. C échoue aussi dans sa branche centrale — celle à 88 %.** C''est le point que la note du trésorier
    ne traite pas. La caisse verse 5,4 M€ et encaisse 4,4 M€ : elle brûle 1,0 M€ de trésorerie la première
    année, en progression de 4,3 %/an. Bloquer 14,4 M€ pendant 7 ans laisse 4,0 M€ liquides face à un
    besoin cumulé de l''ordre de 12,2 M€ sur la même période. La poche liquide est épuisée en cours de
    troisième année. La caisse se retrouve alors incapable de payer des prestations alors que son bilan
    affiche une réserve confortable — et détentrice d''un titre non coté, bloqué, dont toute cession forcée
    se ferait à casse, si elle est seulement possible. Un rendement de 14 % non distribuable ne paie aucune
    prestation.


    **Sur le « bruit statistique ».** Trois observations, à vérifier avant jeudi si le conseil veut malgré
    tout instruire :

    - Un émetteur A− ne se finance pas à 14 %. Si le rendement offert est de 14 %, le risque rémunéré
    n''est pas celui d''une dette senior A−. La notation porte sur l''émetteur ; l''exposition porte sur
    la structure.

    - Une récupération de 5 % du nominal confirme ce diagnostic : le taux de recouvrement d''une dette
    senior se situe usuellement autour de 40 %. À 5 %, l''instrument est profondément subordonné ou adossé.
    Le 3 % annoncé décrit alors un défaut d''émetteur, pas la probabilité de perte de l''instrument.

    - La distribution 88/9/3 est communiquée par la contrepartie qui vend le produit. Elle n''est ni auditée,
    ni cotée, ni contredite par un tiers. « Deux caisses comparables ont souscrit l''an dernier » n''est
    pas une preuve : sur une note à 7 ans, douze mois n''ont rien révélé.


    Aucun de ces trois points n''est nécessaire au refus. Le premier motif suffit et ne se négocie pas.


    **Aucun dimensionnement ne sauve C.** Même réduite à 6 M€ pour préserver la trésorerie, elle immobilise
    7 ans un capital sur un horizon où le plancher statutaire est atteint avant l''échéance.


    ---


    ## B — gelée, puis plafonnée


    Le pire décile de B ramène la réserve à 15,8 M€ : au-dessus du plancher de 11 M€, remboursable, quotidiennement
    valorisé, sortie à tout moment. **Ce n''est pas de la ruine, c''est de la variance, et je ne la traite
    pas comme un veto.**


    Mais B, à 7,4 M€, referme la seule porte de sortie. L''UMA n''a jamais accepté un transfert dont la
    réserve représentait moins de trois années de prestations. Ce seuil vaut 16,2 M€ aujourd''hui, 16,9
    M€ dans un an. Un choc de −35 % sur 7,4 M€ coûte 2,6 M€ et fait passer la caisse sous la barre pendant
    l''instruction du dossier. La marge disponible en année 1 est d''environ 0,8 M€, ce qui plafonne la
    tranche investissable autour de **2,4 M€** — pas 7,4.


    Décision : **zéro exposition nouvelle tant que l''UMA n''a pas répondu.** Si l''UMA refuse, la contrainte
    d''éligibilité disparaît, et B se rouvre alors à pleine taille — c''est à ce moment-là qu''elle a
    un sens.


    Le trésorier a raison sur un point et il faut le dire au conseil : B seule ne referme pas l''écart.
    Elle rapporte environ 0,32 M€/an de plus que A. L''écart à combler est de 1,0 M€ et croît de 4,3 %/an.


    ---


    ## Le chiffre qui n''est pas sur la table


    **Aucune allocation d''actifs ne résout ce problème, parce que le problème n''est pas à l''actif.**
    Pour couvrir le déficit de la première année, il faut relever les cotisations de **+23 %**, puis les
    indexer à 4,3 %. La hausse de 6 % rejetée en 2024 valait 0,26 M€ : un quart du trou de la première
    année. Le débat sur le placement occupe le conseil depuis des mois parce qu''il est le seul levier
    que le conseil actionne seul.


    **Une divergence à réconcilier avant jeudi.** Avec les paramètres de la note (prestations +4,3 %,
    cotisations plates, rendement +1,8 %, déficit prélevé sur la réserve), je trouve un franchissement
    du seuil de 11 M€ **en année 6**, pas en année 9 : 17,7 / 16,8 / 15,6 / 14,2 / 12,5 / 10,4 M€. Ce
    sont mes hypothèses de calcul, pas un audit de la projection interne — elle suppose peut-être une
    indexation des cotisations ou un rendement supérieur. La réconciliation ne change ni le classement
    des options ni le veto sur C. Elle change l''urgence, et donc le calendrier ci-dessous.


    ---


    ## Ce sur quoi j''engage la caisse


    1. **Sous 10 jours** : demande écrite à l''UMA précisant si l''éligibilité (réserve ≥ 3 ans de prestations)
    s''apprécie à la date de dépôt ou à la date de décision du comité d''engagement. De la réponse dépend
    tout le reste : avec une instruction de 12 à 18 mois et une éligibilité qui expire vers le 18ᵉ mois,
    une appréciation à la date de décision signifie que la fenêtre est déjà fermée.

    2. **Sous 30 jours** : dépôt du dossier de transfert. C''est la première action, et elle est datée.

    3. **Placements** : maintien intégral en obligations d''État jusqu''à réponse de l''UMA. Aucune souscription
    de C. Plafond de 2,4 M€ sur B si le conseil veut engager une diversification avant la réponse.

    4. **Assemblée générale extraordinaire avant fin de trimestre**, sur les chiffres réels : le déficit,
    la durée de vie restante de la réserve, le taux de relèvement qui la stabilise, et l''alternative
    côté prestations. Les affiliés doivent arbitrer entre cotiser davantage, réduire des garanties ou
    être transférés — pas être consultés après coup sur une décision prise. Cela suppose de leur transférer
    un pouvoir réel : le vote sur le scénario, et un siège d''observateur des affiliés dans la négociation
    UMA.

    5. **Repli, avec déclencheur observable** : suivi trimestriel du ratio réserve / prestations annuelles.
    **Sous 3,1, gel immédiat de toute prise de risque nouvelle et bascule sur le scénario prestations.**
    Sous 13 M€ de réserve, convocation d''un conseil extraordinaire sans attendre l''échéance ordinaire.


    ---


    ## Ce qui renverserait cette recommandation


    - **L''UMA confirme par écrit** que 18,4 M€ suffisent et que l''éligibilité s''apprécie au dépôt →
    tout le dispositif s''accélère et B reste gelée jusqu''à la signature.

    - **L''UMA refuse** → le transfert sort du plan ; B se rouvre à pleine taille, et l''arbitrage devient
    cotisations contre prestations, à porter devant l''AG dans les 6 mois.

    - **Sur C, rien de ce qui a été produit ne suffirait** : il faudrait une distribution auditée par
    un tiers indépendant, un mécanisme de sortie, et un montant dont le pire cas laisse la réserve au-dessus
    de 11 M€ tout en couvrant 12 M€ de besoins de trésorerie sur 7 ans. Ces conditions sont mutuellement
    incompatibles avec un blocage de 7 ans.


    ## Le meilleur argument contre moi


    *« Vous refusez 9,6 % d''espérance pour éviter 3 % de risque, et vous condamnez la caisse à mourir
    en six ans au lieu de neuf. »*


    Il est sérieux, et il tombe sur un fait : dans la branche à 88 %, C ne verse rien pendant 7 ans. La
    caisse est en cessation de paiements en année 3 même quand le pari est gagnant. C n''achète donc pas
    des années de vie — elle en retire. Et si le trésorier a raison de dire que le statu quo ne suffit
    pas, la conclusion qu''il en tire est un saut : entre « A ne suffit pas » et « donc C », il manque
    l''examen des leviers qui existent réellement — le transfert et les cotisations — dont aucun n''apparaît
    dans sa note.


    ## Une réserve de procédure


    Cinq signatures sur neuf engagent 78 % de la réserve sur un instrument non coté, irréversible pendant
    7 ans, sur la seule distribution fournie par le vendeur, sans expertise indépendante ni cotation de
    marché. Quelle que soit l''issue du vote, je demande que soient portées au procès-verbal : l''absence
    d''audit indépendant de la distribution, la contrainte de trésorerie sur 7 ans, et le fait que la
    branche à 3 % déclenche la liquidation statutaire. Les administrateurs doivent voter en sachant ce
    qu''ils engagent, y compris à titre personnel.


    ---


    Je peux mettre ceci en note formatée pour le dossier du conseil, ou produire le tableau de trésorerie
    année par année à joindre en annexe — dites-moi lequel vous est utile d''ici jeudi.

    '
