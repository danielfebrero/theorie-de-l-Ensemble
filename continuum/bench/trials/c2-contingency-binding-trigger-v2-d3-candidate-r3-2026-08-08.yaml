response:
  text: 'La note, prête à être remise :


    ---


    # NOTE AU COMITÉ DE DIRECTION — Prestataire de paiement


    **De :** Direction des opérations — **Pour :** la présidente — **Comité :** vendredi


    ## Recommandation


    On va chez Payflux, en bascule progressive — **option B, sur un calendrier corrigé**. On rejette A.
    La décision qui engage tout le reste est unique et non conditionnelle : **notifier Solda le 13 octobre
    pour tenir le compte ouvert jusqu''au 16 février.**


    ## Le motif est une date, pas un taux d''échec


    Le 15 octobre est la seule échéance irréversible du dossier. Passée cette date, le compte Solda ferme
    le 30 novembre et ne se rouvre pas : six semaines de délai et re-collecte des empreintes auprès de
    2,1 millions de porteurs.


    L''option A bascule le 3 novembre. Elle nous oblige donc à renoncer au retour arrière **le 15 octobre,
    soit dix-neuf jours avant le premier euro de trafic Payflux en production.** Nous prendrions la décision
    irréversible sans une seule donnée de production. C''est le motif du rejet — pas l''écart de taux
    d''échec, qui ne pèse que 40 à 70 k€ sur les trois semaines de rodage (378 000 transactions × 0,9
    pt × 42 €, dont un tiers de perte définitive).


    **B telle qu''écrite n''est pas praticable non plus.** Sans date de départ, adossée au 3 novembre
    comme A, sa montée 50 % → 100 % tombe dans la semaine de Noël. Et son économie affichée de 310 k€
    n''intègre pas la prolongation Solda, obligatoire dès lors qu''on ne bascule pas avant le 30 novembre.


    ## Les chiffres, refaits (k€, douze premiers mois)


    | | A — 3 nov. | B corrigée, prudente | B corrigée, accélérée |

    |---|---:|---:|---:|

    | Payflux | 900 | 900 | 900 |

    | Solda mois-le-mois (130/mois) | 0 | 390 (déc.–fév.) | 130 (déc.) |

    | Double run (45/mois) | 0 | 215 | 150 |

    | **Total** | **900** | **1 505** | **1 180** |

    | **Écart vs renouvellement Solda (1 400)** | **−500** | **+105** | **−220** |


    À partir de l''année 2 : **500 k€/an d''économie dans tous les cas.** L''écart avec A la première
    année — 280 à 605 k€ — est le prix du droit de revenir en arrière.


    *Hypothèses : Payflux facturé à la mise en service (à confirmer par écrit) ; 45 k€/mois de double
    run sur la durée réelle du recouvrement.*


    ## Ce que ce prix achète


    Si la bascule échoue après clôture de Solda : six semaines pendant lesquelles tout paiement en jeton
    enregistré exige une ressaisie de carte. Sur 60 % de trafic en jeton et 10 à 20 % de perte à la ressaisie,
    **1,9 à 3,8 M€ de chiffre d''affaires**, hors attrition durable de la base. Quatre à huit fois le
    gain visé. La part réelle du trafic en jeton n''est pas au dossier ; elle est demandée lundi.


    ## Le meilleur argument contre cette recommandation


    Faire tourner deux prestataires pendant le pic est en soi une source d''incident : réconciliation,
    règles de fraude dédoublées, routage des remboursements, au moment où l''équipe a le moins d''attention
    disponible. Il ne renverse pas la décision, il en fixe deux règles : **aucun changement de configuration
    du 20 novembre au 5 janvier**, hors retour arrière ; et **un exercice de repli réel au palier 25 %,
    le 9 octobre**, qui transforme le repli de promesse en fait mesuré — avant l''échéance du 15.


    ## Calendrier


    - **4 sept.** — signature Payflux sous trois conditions : fenêtre de sortie gratuite recalée à 90
    jours **après bascule à 100 %** (telle que rédigée, elle expire avant que nous ayons la moindre donnée
    à 100 %) ; SLA 99,99 % du 20 nov. au 24 déc. avec pénalité — le 99,9 % contractuel autorise 8,7 h
    d''indisponibilité par an sans garantir qu''elles ne tomberont pas le 27 novembre ; prise en charge
    par Payflux des mois de recouvrement, en contrepartie de l''engagement 24 mois.

    - **22 sept.** 10 % — **6 oct.** 25 % — **9 oct.** exercice de repli — **13 oct. notification Solda**
    — **20 oct.** 50 %.

    - **3 nov., bifurcation :** si le taux d''échec Payflux est ≤ 0,5 % sur les 21 derniers jours à 50
    % et si le repli du 9 octobre a tenu sous 15 minutes → 100 % le 10 novembre, un seul mois de prolongation
    Solda, économie année 1 ramenée à 220 k€. Sinon → gel à 25 % jusqu''au 5 janvier, 100 % le 20 janvier.

    - **16 fév.** — clôture Solda, après 30 jours à 100 % sans incident. Mur dur : 28 février, la prolongation
    n''est pas reconductible.


    ## Ce qui renverserait la décision


    Au palier 25 %, sur 14 jours consécutifs, un taux d''échec Payflux **supérieur à 0,55 %** — soit au-delà
    du plateau qu''annonce son propre pilote. Nous ne basculons pas, nous renouvelons Solda et nous exerçons
    la sortie gratuite avant le 90ᵉ jour, à coût nul.


    ## Repli et déclencheur


    Le tableau de bord est rafraîchi toutes les 5 minutes et l''astreinte redirige le trafic en moins
    de 15 minutes tant que les deux comptes sont ouverts.


    - Échec > 0,8 % sur la part Payflux pendant 3 heures consécutives → **l''astreinte ramène à 0 % sans
    escalade ni validation du comité.** Cette autorité lui est déléguée par écrit : c''est elle qui porte
    la charge du double run, c''est elle qui tient la manette.

    - Anomalie de réconciliation sur les 2,1 M de jetons → 0 % Payflux et gel de la clôture Solda.

    - Indisponibilité Payflux > 30 min entre le 20 nov. et le 24 déc. → 100 % Solda jusqu''à la fin du
    pic.

    - Aucune reprise automatique : le retour sur Payflux est signé par la direction des opérations.


    ## Lundi


    1. **Notification Solda** envoyée, en demandant par écrit : résiliation mois par mois avec 30 jours
    de préavis, et confirmation que le renouvellement à 1,4 M€/an reste ouvert jusqu''au 1ᵉʳ février.

    2. **Conditions transmises à Payflux** (les trois ci-dessus), réponse attendue sous dix jours.

    3. **Part du trafic en jeton enregistré** demandée à la donnée — c''est le chiffre qui dimensionne
    le pire cas.

    4. **Ingénierie :** plan de duplication des jetons sans clôture Solda, créneau réservé pour l''exercice
    du 9 octobre.


    ---


    Trois points que je n''ai pas mis dans la note mais que tu dois avoir en tête vendredi :


    - **Le 310 k€ du dossier est faux, pas approximatif.** L''écart entre A et B n''est pas de 190 k€
    : les 390 k€ de prolongation Solda ne figurent nulle part dans le chiffrage de B, alors qu''ils sont
    mécaniquement dus. Si quelqu''un au comité a produit ce chiffre, mieux vaut que ce soit toi qui le
    corriges en séance.

    - **Le délai d''intégration Payflux n''est pas au dossier.** Tout mon calendrier tient sur une signature
    au 4 septembre et un premier palier au 22. Si l''intégration demande huit semaines, le palier 25 %
    arrive après le 15 octobre et on notifie Solda à l''aveugle — ce qui reste le bon choix, mais ôte
    l''argument de la donnée. À vérifier avant vendredi.

    - **La clause à obtenir vraiment, c''est le décalage de la fenêtre de sortie.** Les 90 jours courent
    depuis la signature : ils brûlent pendant l''intégration, quand nous n''avons aucune donnée. Recalés
    sur la bascule à 100 %, ils valent 240 k€ d''optionalité et ne coûtent rien à Payflux si son produit
    tient. S''il refuse ce seul point, c''est en soi une information sur ce qu''il pense de son taux d''échec.


    Je n''ai pas pu écrire le fichier (permission non accordée) — dis-moi si tu veux que je le dépose
    quelque part.

    '
