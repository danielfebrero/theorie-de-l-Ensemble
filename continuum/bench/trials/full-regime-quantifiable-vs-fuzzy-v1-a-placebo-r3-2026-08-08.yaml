response:
  text: '# Note au conseil — arbitrage de l''enveloppe de 900 000 €


    **Objet :** dossiers A (parc d''usinage) et B (succession direction qualité) — décisions demandées
    jeudi


    ---


    ## Ce que nous proposons de décider


    | Poste | Montant engagé |

    |---|---|

    | **B** — Nomination de l''adjointe + mission de transition du directeur sortant | **135 000 €** |

    | **A** — Renouvellement des 6 machines, commande unique, livraison échelonnée | **620 000 €** |

    | **Réserve fléchée** (voir §4) | **145 000 €** |

    | **Total** | **900 000 €** |


    ---


    ## 1. Nous traitons B en premier, et ce n''est pas un détail de présentation


    A est une décision d''argent : elle peut être dimensionnée, découpée, ajustée. B est une décision
    de calendrier : elle ne peut pas l''être. Il reste onze mois de présence conjointe possible, et cette
    fenêtre ne se rouvrira jamais.


    Ce que nous perdons au départ du directeur qualité n''est pas une compétence — elle s''achète — mais
    trois relations qui ne s''achètent pas : sa reconnaissance personnelle par l''organisme notifié, la
    qualification des neuf auditeurs internes qu''il a formés, et deux clients hospitaliers pesant 31
    % du chiffre d''affaires qui déclarent travailler avec nous à cause de lui.


    Ces trois relations ne se transfèrent que par co-présence : un successeur présenté à l''organisme
    notifié lors d''un audit réel, avec le sortant à ses côtés ; des visites conjointes chez les deux
    clients ; une passation documentée du système d''audit interne. Chaque mois de retard sur la nomination
    retire un mois à cette période de recouvrement.


    ## 2. Pourquoi la promotion plutôt que le recrutement externe


    Le recrutement externe (280 000 €) ne répond à aucun des trois risques. Un cabinet met quatre à six
    mois à produire un candidat ; celui-ci arriverait avec cinq mois de chevauchement au mieux, sans lien
    avec l''organisme notifié, sans légitimité auprès des neuf auditeurs, et présenté aux deux clients
    hospitaliers comme le remplaçant de l''homme pour lequel ils restent. C''est l''option la plus chère
    et la plus incertaine, dans une entreprise qui n''a aucun précédent pour juger.


    La promotion de l''adjointe (45 000 €) a une faiblesse réelle : trois ans d''ancienneté, aucune expérience
    de la relation avec l''organisme notifié. La mission de transition du sortant (90 000 € sur douze
    mois) est exactement l''assurance qui couvre cette faiblesse. Les deux options ne s''opposent pas,
    elles se complètent : **135 000 € pour un dispositif qui traite les trois risques, contre 280 000
    € pour un dispositif qui n''en traite aucun.**


    Nous demandons donc au conseil de décider jeudi : nomination immédiate de l''adjointe comme directrice
    qualité désignée (prise d''effet au départ), avenant signé ce mois-ci, et contrat de mission du sortant
    signé **avant** son départ, pas après. Trois jalons contractualisés : présentation à l''organisme
    notifié lors du prochain audit avec le sortant présent ; visites conjointes des deux clients hospitaliers
    sous quatre mois ; transfert formalisé de la qualification des auditeurs internes.


    ## 3. Dossier A : le chiffre ne tranche pas seul, le calendrier de l''enveloppe si


    Les données auditées sur cinq ans donnent : 213 000 € de coût direct d''immobilisation, plus 68 780
    € de marge de contribution perdue (1 810 heures × 38 €), soit environ **56 000 € par an**. Rapporté
    à 620 000 €, le retour sur investissement ressort à **onze ans** — et jusqu''à quatorze ans et demi
    si le chiffre de 213 000 € intègre déjà la marge perdue, point à vérifier.


    Onze ans, c''est médiocre. Trois éléments non chiffrés jouent en sens inverse : la dégradation d''un
    parc de 14 ans s''accélère, les cinq prochaines années ne ressembleront pas aux cinq précédentes ;
    le gain sur le taux de rebut (4,1 % contre 1,2 % garanti) est réel mais nous ne pouvons pas le chiffrer
    sans le volume produit — nous ne fondons donc pas la décision dessus ; et la garantie de 96 % de disponibilité
    sur sept ans avec pénalités transforme une charge aléatoire en engagement du fournisseur.


    **La vraie question n''est pas « 620 000 € sont-ils bien placés ici », mais « ce parc doit être renouvelé
    dans la décennie, et l''argent n''existe que cet exercice ».** Le découpage en tranches ne rapporte
    rien : les conditions unitaires sont identiques, et une seconde tranche supposerait un financement
    dans plus de douze mois que personne ne peut garantir. Renoncer aux trois machines les plus saines
    aujourd''hui, c''est y renoncer durablement.


    Nous proposons donc de **commander les six machines cet exercice, avec livraison échelonnée sur 12
    à 18 mois**, les machines classées les plus défaillantes par l''historique audité étant remplacées
    en premier. L''argent est engagé maintenant ; la production n''est jamais arrêtée en bloc. Point à
    confirmer auprès du fournisseur avant jeudi : les conditions unitaires et la garantie de sept ans
    tiennent-elles sur une commande unique à livraison différée ?


    ## 4. Le solde de 145 000 € — et une mise en garde


    L''écart entre nos deux options sur B est exactement égal au solde disponible. Ce n''est pas une raison
    de le dépenser : **une enveloppe perdue n''est pas un coût, une enveloppe mal engagée en est un.**


    Nous proposons de le flécher, dans cet ordre : d''abord les coûts d''accompagnement du dossier A —
    installation, outillage, métrologie, formation opérateurs — dont il faut vérifier avant jeudi s''ils
    sont inclus dans les 620 000 € ; ensuite, sur le reliquat, un mandat conditionnel de cabinet de recrutement,
    signé maintenant et déclenchable uniquement si le point d''étape à six mois montre que la passation
    échoue. C''est le prix de notre droit à nous être trompés sur B, et c''est le seul moyen de le conserver,
    puisqu''aucun financement ne sera disponible dans douze mois.


    Si le conseil juge que ces emplois ne justifient pas 145 000 €, nous recommandons de ne pas les engager
    plutôt que d''inventer une dépense.


    ---


    **Trois vérifications à obtenir avant jeudi :** (1) le périmètre exact des 620 000 € ; (2) la tenue
    des conditions fournisseur en livraison échelonnée ; (3) la date du prochain audit de l''organisme
    notifié — si elle tombe après le départ du directeur qualité, le dispositif de transition doit être
    renégocié en conséquence, et cette question prime sur tout le reste de cette note.

    '
