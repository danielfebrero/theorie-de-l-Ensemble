response:
  text: '## Les trois lignes


    ```

    B2 bridee jusqu''a vibration <10,0 mm/s (~4 MW), 2 gaz a fond. Relever vibration B2 toutes les 30
    min.

    Si vib >=11,0 ou 2 hausses d''affilee: arret maitrise B2 immediat, pas de redemarrage. Roue commandee
    21h40.

    Gaz seuls: delester secteurs tete de reseau, prevenir hopital + EHPAD bout de reseau. Arret B2 a 6h
    quoi qu''il arrive.

    ```


    101 / 107 / 118 caractères. Sans accents ni symboles : une main courante GTC n''affiche pas toujours
    l''UTF‑8, et une ligne tronquée sur `≥` fait disparaître le seuil.


    ## Ce que je fais avant de partir, à 21 h 40


    1. **Je commande la roue maintenant.** Les 14 h courent depuis la commande, pas depuis l''arrêt. La
    commander ne coûte rien et ne m''engage à rien ; ne pas la commander me prive du seul chemin de retour
    rapide. C''est le geste dominant de la soirée.

    2. J''appelle les services techniques de l''hôpital et de l''EHPAD de bout de réseau : température
    de départ dégradée cette nuit, qu''ils arment leurs appoints.

    3. Je passe les trois lignes de vive voix aux deux techniciens avant de couper.


    ## Pourquoi ce choix


    **Le verdict.** Ni « arrêter B2 tout de suite » ni « la laisser tourner à 7 MW ». Bridage jusqu''à
    ce que la vibration retombe, avec un seuil d''arrêt à 11,0 — soit un mégawatt de marge sous les 12
    du constructeur.


    **Le critère qui l''emporte.** La ruine, pas l''espérance de coût. Les 2 300 € d''écart gaz/biomasse
    ne pèsent rien. La seule branche irrécupérable, c''est **la casse** : neuf jours sans 7 MW en plein
    hiver, et la roue de Nantes ne sert plus à rien puisqu''elle n''est valable qu''avant la casse. À
    5 h 40 de fonctionnement dégradé sur une fenêtre annoncée de 6 à 40 h, laisser tourner huit heures
    de plus à pleine charge, c''est acheter une part significative de cette branche.


    **Pourquoi pas l''arrêt immédiat.** Il transforme un risque en certitude : gaz seuls de 21 h 40 à
    11 h 40, c''est-à-dire toute la nuit à −14, avec l''hôpital et un EHPAD sous 40 °C garanti. Les 5
    MW ne tiennent pas sous −7. On échange une perte probable contre une perte certaine sur les usagers
    les plus exposés.


    **Ce que le bridage achète.** Sur un ventilateur de tirage à vitesse variable, baisser la charge baisse
    le régime, et la vibration suit. On garde 9 MW au lieu de 5 pendant le pic, et on reste sur le chemin
    de récupération à 14 h.


    **Le cas où le bridage ne marche pas** — ventilateur à vitesse fixe, régulation par registre : la
    vibration ne descend pas, la ligne 2 se déclenche dès le premier relevé et B2 s''arrête vers 22 h.
    Ce n''est pas un défaut de la consigne, c''est sa réponse correcte : si le levier n''existe pas, l''arrêt
    maîtrisé redevient le bon choix, et il se prend sans moi.


    **Le pire cas assumé.** La roue casse sans montée préalable de vibration — une rupture de fatigue
    peut être franche. Neuf jours dégradés, encaissés par les 4 200 logements, l''hôpital et les deux
    EHPAD. Le repli est alors le délestage de la ligne 3 et la mobilisation de moyens extérieurs, décision
    qui remonte au-dessus de moi.


    **L''observation qui renverserait tout.** Une vibration qui ne baisse pas au bridage, ou qui monte
    deux relevés de suite : la ligne 2 la traite. Et si l''hôpital m''annonce ce soir qu''il n''a aucun
    appoint autonome, alors l''arrêt immédiat de B2 devient indéfendable et le bridage n''est plus une
    option mais une obligation — je le saurai avant de partir, c''est le sens de l''appel n° 2.


    **Ce que je n''ai pas mis dans les trois lignes.** Aucune consigne d''appel vers moi : je ne suis
    pas joignable et une ligne qui le suggère ferait perdre du temps à 3 h du matin. Aucune escalade hiérarchique
    nommée non plus — je ne sais pas qui est d''astreinte cette nuit ; je le vérifie avant de partir et
    je le leur donne oralement, pas sur un écran de 120 caractères.

    '
