  text: '## Note de position — lot F-2418 (Sodimarché, livraison du 3 juin)


    **Destinataires : assureur (déclaration de sinistre) ; Sodimarché en cas de contestation de facture.**

    Le document est unique et les faits qui y figurent sont identiques pour les deux lecteurs. Rien n''y
    est écrit qui serait retiré devant l''un ou l''autre : une version divergente découverte plus tard
    détruirait davantage que la somme en litige.


    ---


    ### 1. Le point qui commande tout le dossier


    Trois pièces, mises côte à côte, décrivent une immobilisation non réfrigérée sur notre propre site
    :


    - fin de chargement **6 h 25**, produit à **3 °C** (pièce 1) ;

    - groupe froid sous tension **à partir de 9 h 05** (pièce 5), rien avant ;

    - sortie du portique **11 h 12** (pièce 3), écriture automatique, aucune autre sortie du véhicule
    ce jour-là.


    Soit **2 h 40 sans réfrigération documentée** après chargement, et **4 h 47 d''immobilisation** avant
    départ, en juin. Sur cette fenêtre, l''entreprise ne dispose d''**aucune pièce** attestant le respect
    de la plage 0–4 °C.


    Les relevés conformes (2,9–3,6 °C) ne couvrent que la période postérieure à 9 h 05 (pièce 5). Ils
    ne prouvent pas la conformité antérieure : une croissance microbienne survenue pendant une remontée
    de température n''est pas effacée par le retour au froid.


    **La mention manuscrite « départ 6 h 40 » du bon de livraison (pièce 2) est contredite par la pièce
    3.** Elle est signée de notre chauffeur. Nous la signalons nous-mêmes à l''assureur plutôt que de
    la laisser découvrir : produite sans réserve, elle exposerait à un reproche de déclaration inexacte
    dont le coût dépasserait les 21 400 €. Elle doit être traitée comme une mention anticipée et erronée,
    non comme un élément de preuve du dossier.


    ---


    ### 2. Ce que l''entreprise reconnaît


    1. **L''immobilisation du 3 juin entre 6 h 25 et 11 h 12** (pièces 1 et 3), dont au moins 2 h 40 sans
    réfrigération active (pièce 5). Fait matériel, établi par nos propres enregistrements, survenu sur
    notre site et sous notre contrôle.

    2. **L''absence de preuve de conformité thermique** sur cette fenêtre. Nous ne pouvons pas soutenir
    que le produit est resté entre 0 et 4 °C : nous n''avons rien à opposer.

    3. **La contradiction interne du bon de livraison** sur l''heure de départ (pièces 2 et 3).

    4. **Le principe d''un refus fondé** si l''analyse (pièce 6) est validée dans sa procédure de prélèvement
    — le dépassement du seuil contractuel de 10⁵ UFC/g y ouvre droit.


    Cette reconnaissance porte sur des faits, pas sur un montant.


    ---


    ### 3. Ce que l''entreprise conteste


    1. **Le quantum de 21 400 €**, non ventilé. Aucune pièce ne détaille marchandise, transport et pénalité.
    Une somme globale n''est pas une créance justifiée.

    2. **L''assiette de la marchandise détruite.** Le bon de livraison porte 1 840 barquettes (pièce 2),
    le bon de réception 1 792 (pièce 4) : **48 barquettes d''écart, non expliqué, dans les documents du
    dépôt lui-même**. La réclamation ne peut en tout état de cause porter sur plus de 1 792 unités. L''écart
    affecte par ailleurs la fiabilité du comptage adverse.

    3. **La destruction elle-même**, dont aucun procès-verbal ne figure au dossier. Une marchandise déclarée
    détruite sans preuve de destruction n''est pas indemnisable.

    4. **La force probante de l''analyse (pièce 6)** en l''état : laboratoire mandaté unilatéralement,
    trois barquettes sur 1 792, sans procédure contradictoire, sans date ni heure de prélèvement, sans
    identification de l''agent préleveur, sans scellés, sans conditions de conservation des échantillons
    entre la réception (12 h 55, pièce 4) et l''analyse. Nous ne contestons pas le résultat : nous contestons
    qu''il soit, sans ces éléments, rattachable au lot livré.

    5. **La pénalité de rupture d''assortiment**, dont ni la clause ni le préjudice réel ne sont produits.


    ---


    ### 4. Ce qui n''est rattaché à aucune pièce


    Signalé ici pour ne pas être glissé ailleurs comme un fait acquis.


    - **Le point de départ du délai de huit jours.** La réclamation de Sodimarché ne figure pas au dossier
    ; sa date de réception n''est établie par rien. Le délai est traité comme courant depuis la date la
    plus défavorable.

    - **Le contrat** n''est pas au dossier : ni la clause de température, ni le seuil de 10⁵, ni la pénalité
    d''assortiment, ni le point de transfert des risques ne sont produits. Toute l''analyse juridique
    en dépend.

    - **Le motif de l''immobilisation.** La pièce 7 est le compte rendu d''un appel téléphonique — « parti
    tôt », « attendu un moment ». Ce n''est pas une pièce : c''est un propos rapporté, non signé, non
    daté, sans mention des conséquences d''une fausse attestation.

    - **La température ambiante du 3 juin** sur le site, l''exposition du véhicule, l''état des portes
    : rien.

    - **Le sort des 48 barquettes** manquantes.

    - **La première valeur enregistrée après 9 h 05** — l''information la plus décisive du dossier, et
    elle est entre nos mains (voir §5).


    ---


    ### 5. Ce que l''entreprise engage dans les huit jours


    **Sous 24 heures**


    - **Réponse écrite à Sodimarché**, LRAR et courriel avec accusé de réception, reprenant les §2 et
    §3 : reconnaissance de l''immobilisation, contestation motivée du quantum, demande de justification.
    L''objet est d''abord d''interrompre l''acquisition de plein droit de la pénalité — le silence coûte
    21 400 € sans discussion.

    - **Déclaration de sinistre à l''assureur**, pièces 1 à 7 jointes, pièce 5 comprise et non expurgée,
    avec le signalement de la mention « départ 6 h 40 ».

    - **Extraction brute de l''enregistreur embarqué** par le prestataire télématique : courbe complète,
    export horodaté non modifiable, et en particulier **la première valeur relevée à 9 h 05**. Si elle
    est proche de 3 °C, la caisse est restée froide et la causalité se discute. Si elle est élevée avec
    descente progressive, la rupture est acquise. Cette pièce est peu coûteuse, disponible immédiatement,
    et elle décide de la position.


    **Sous 48 heures**


    - **Attestations écrites** de l''opérateur de quai et du chauffeur, en la forme de l''article 202
    du code de procédure civile, pour substituer une pièce au propos téléphonique (pièce 7).

    - **Demande écrite au dépôt** : ventilation poste par poste des 21 400 € ; procès-verbal de destruction
    ; rapport d''analyse complet (méthode, date et heure de prélèvement, scellés, préleveur, conservation
    des échantillons) ; explication de l''écart 1 840 / 1 792 ; conditions de stockage entre 12 h 55 et
    le prélèvement ; copie des clauses invoquées.

    - **Traçabilité des 48 barquettes** : identification et localisation.


    **Sous 5 jours**


    - **Recherche de pathogènes** (*Listeria monocytogenes*, *Salmonella*) sur l''échantillothèque du
    lot F-2418, et demande des mêmes résultats au laboratoire du dépôt. La flore mésophile est un indicateur
    d''hygiène, pas un critère sanitaire : elle fonde le refus contractuel, elle ne qualifie ni n''exclut
    un risque.

    - **Décision documentée sur la notification à la DDPP** (règlement CE 178/2002, art. 19), prise sur
    les résultats pathogènes et la localisation des 48 unités, pas par réflexe et pas par défaut.

    - **Contrôle des autres expéditions du 3 juin** : écart entre fin de chargement et sortie portique
    pour chaque véhicule. Si la pratique s''est répétée, le dossier n''est plus un lot.


    **Sous 8 jours**


    - Proposition transactionnelle à Sodimarché (§7).


    ---


    ### 6. Repli et déclencheur


    **Déclencheur observable :** la première valeur de l''enregistreur après 9 h 05.


    - **> 4 °C** → la rupture est établie par nos propres données. On abandonne toute contestation de
    principe et on négocie exclusivement sur le quantum, l''assiette (1 792 maximum) et la preuve de destruction.

    - **≤ 4 °C** → on demande une expertise contradictoire sur l''échantillothèque et on conteste le lien
    de causalité, l''immobilisation restant reconnue.


    **Ce qui renverserait la position adverse :** un procès-verbal de prélèvement contradictoire régulier,
    daté, avec scellés. À défaut, l''analyse reste une pièce unilatérale.


    **Ce qui renverserait la nôtre :** une pièce établissant que le groupe froid tournait avant 9 h 05
    — nous n''en avons aucune, et nous n''en supposons pas.


    ---


    ### 7. Voie transactionnelle


    À proposer avant l''échéance, sans attendre l''issue de la contestation : prise en charge par l''entreprise
    des postes vérifiables — marchandise réellement détruite sur justificatif, dans la limite de 1 792
    unités, et transport — contre abandon de la pénalité d''assortiment. En contrepartie, et c''est le
    point qui a une valeur pour le dépôt : **accès de Sodimarché à nos journaux de portique pour ses propres
    lots**, avec alerte automatique si l''écart entre fin de chargement et sortie dépasse trente minutes.
    Cela transfère un contrôle réel, pas une information.


    Cette voie ne conditionne pas la réponse sous huit jours et ne vaut ni reconnaissance du quantum ni
    renonciation aux demandes du §5.


    ---


    ### 8. Contre-argument examiné


    *« L''entreprise concède trop vite. L''analyse repose sur trois barquettes choisies par la partie
    adverse, sans contradictoire ni traçabilité de prélèvement, et l''écart de 48 unités démontre que
    son propre comptage est défaillant. Il fallait tout contester. »*


    Il tient sur le quantum, sur l''assiette et sur la preuve de destruction — c''est pourquoi ces trois
    points sont contestés au §3.


    Il ne tient pas sur la chaîne du froid. La pièce qui nous accable est la nôtre. Contester la rupture
    tout en détenant la pièce 5 et en produisant un bon de livraison portant une heure de départ fausse
    serait, devant l''assureur, plus coûteux que la créance : c''est la garantie qui serait en jeu, pas
    les 21 400 €. La reconnaissance partielle n''est pas une concession, c''est ce qui rend le reste de
    la contestation crédible.

    '
