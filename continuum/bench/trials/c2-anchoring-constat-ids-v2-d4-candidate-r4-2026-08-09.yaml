response:
  text: '# Avis — Renouvellement du contrat logiciel de réservation et bornes de prêt


    **Pour le comité de direction du 28** · Réseau des médiathèques de Val-de-Sarre


    ---


    ## 1. Ce que je retiens du dossier


    Chaque constat est numéroté et repose sur une pièce identifiée. Le comité peut en écarter un sans
    que les autres tombent ; j''indique à chaque fois ce qui change si c''est le cas.


    **C1 — L''indisponibilité des bornes est un problème de parc, pas de logiciel.**

    Pièce : export technique. 32 h sur 41 se concentrent sur Fontaine et Rive-Sud, seuls sites équipés
    des bornes de 2015. Les cinq autres sites, même logiciel, totalisent 9 h sur douze mois.

    *Si le comité l''écarte* : il faut alors expliquer pourquoi cinq sites sous la même version ne connaissent
    pas la même indisponibilité.


    **C2 — La cause des pertes de réservation n''est pas établie, et la piste de mars est la moins soutenue.**

    Pièces : notes de sites + chronologie de février. Fontaine a le même logiciel, la même mise à jour
    de mars et le même parc de bornes que Rive-Sud, et ne signale rien. Ce qui distingue les deux sites,
    ce n''est pas la mise à jour de mars — c''est que Rive-Sud a vu, en février, son lien fibre remplacé
    et le portail usagers changer de version.

    Le silence de Fontaine admet deux lectures : soit le problème n''y existe pas (la cause est locale
    à Rive-Sud), soit il n''y est pas remonté (notre chaîne de remontée est défaillante). Aucune des deux
    ne soutient la thèse de mars.

    *Si le comité l''écarte* : c''est le constat central ; l''écarter suppose une pièce qui montre le
    problème sur des sites sans changement de février.


    **C3 — L''enquête interne mesure une perception, pas une chronologie.**

    Pièce : enquête, 43 réponses sur 62. 61 % des répondants signalent des pertes — soit environ 26 personnes,
    42 % des agents. Sur ces 26, 12 seulement situent le début après mars. Aucun de ces 26 ne quantifie
    le volume perdu. L''enquête est rétrospective et postérieure à la circulation d''une note qui affirme
    déjà la réponse.


    **C4 — Le pic de réclamations est réel mais ne discrimine pas.**

    Pièce : 96 réclamations, dont 71 entre mars et juin (≈ 18/mois contre ≈ 3/mois le reste de l''année).
    Ce pic suit février aussi bien que mars. Sa retombée après juin est compatible avec deux explications
    opposées : la cause s''est éteinte, ou elle est masquée depuis mars par la ressaisie manuelle de Rive-Sud.
    Sans ventilation par site, il ne tranche rien. C''est la pièce la plus utile du dossier et la moins
    exploitée.


    **C5 — Le coût le mieux établi du dossier n''apparaît nulle part au budget.**

    Pièce : note de Rive-Sud. 5 h de ressaisie par semaine depuis mars, soit environ 110 h déjà consommées
    et 220 h par an si cela continue — de l''ordre de 0,13 ETP, supporté par un seul site.


    **C6 — La remise est petite devant ce qu''elle engage.**

    Pièce : finances. Sur trois ans à +7 %, la dépense courante est de l''ordre de 165 000 € ; 12 % représentent
    environ 19 800 €, soit ~6 600 € par an. Cette remise ne couvre pas la migration v4 (31 000 €). Elle
    expire le 30, alors que le contrat court jusqu''au 31 octobre : l''urgence est commerciale, pas opérationnelle.
    Le dossier ne dit ni l''assiette de la remise, ni si l''indexation continue de s''appliquer par-dessus.


    **C7 — La v4 n''est pas évaluable en l''état.**

    Pièce : chiffrage éditeur. Elle est censée régler un problème qui n''est pas diagnostiqué (C2), et
    sa compatibilité avec les bornes de 2015 est « à l''étude » — donc le remplacement éventuel des bornes
    de Fontaine et Rive-Sud n''est pas chiffré. Voter 31 000 € revient à voter un montant dont on ignore
    s''il est complet.


    **C8 — La bascule vers le libre n''est pas exécutable à cette échéance.**

    Pièces : réseau voisin + effectif informatique. Quatorze mois après sa migration, le voisin laisse
    2 de ses 5 sites au registre papier. Notre équipe technique passe de deux personnes à une en octobre,
    le mois même de l''échéance. Le « 30 % moins cher » porte sur une ligne annoncée, pas sur un coût
    complet incluant migration, reprise de données et exploitation.


    **C9 — La note de cadrage ne peut pas fonder la décision.**

    Elle avance trois affirmations sans citer aucune pièce. La première est contredite par C2, la deuxième
    n''est pas testée (C7), la troisième est exacte mais sans portée décisionnelle (C6). Le fait qu''elle
    ait déjà été lue par deux membres du comité ne lui ajoute pas de valeur probante.


    ## 2. Les quatre pièces qui manquent


    1. La ventilation des 96 réclamations **par site et par mois**.

    2. Une mesure directe du taux de perte de réservations (aucun chiffre au dossier ne porte sur ce qui
    motive la décision).

    3. La réponse écrite de l''éditeur sur la compatibilité v4 / bornes 2015, avec coût si négative.

    4. Les clauses du contrat actuel : durée minimale, reconduction tacite, préavis, assiette de la remise.


    Les quatre s''obtiennent en moins de quinze jours et pour un coût quasi nul. C''est ce qui rend indéfendable
    de trancher le 28 sur trois ans.


    ## 3. Appréciation des trois options


    | Option | Appréciation | Repose sur |

    |---|---|---|

    | Reconduire à l''identique | Acceptable **si la durée est courte**. Sur trois ans, c''est engager
    ~145 000 € pour économiser ~19 800 € sur un diagnostic non fait. | C6, C9 |

    | Reconduire + v4 | À écarter **pour le 28**. Le seul chiffre dur du dossier (C1) désigne le matériel,
    et la v4 pourrait imposer de le remplacer sans que ce coût soit connu. | C1, C2, C7 |

    | Basculer vers le libre | Écartée **sur ce calendrier**, pas sur le fond. Migrer sept sites avec
    un informaticien, entre le 31 octobre et le renfort, expose le réseau à une rupture de service. |
    C8 |


    ## 4. Recommandation


    **Ne pas signer d''engagement de trois ans le 28.** Reconduire au plus court que le contrat autorise
    — douze mois de préférence — **sans la v4**, et porter l''arbitrage de fond à un comité de décembre,
    sur diagnostic.


    La question soumise au vote du 28 devrait être **la durée de la reconduction**, pas le choix de la
    solution. Le dossier permet de trancher la première ; il ne permet pas de trancher la seconde.


    Le volet matériel doit être instruit séparément du volet logiciel : le remplacement des bornes de
    2015 se chiffre et se décide quel que soit l''éditeur retenu.


    ## 5. Le meilleur argument contre cet avis


    *Si les pertes sont bien logicielles et systémiques, chaque mois de report coûte 5 h par semaine à
    Rive-Sud et alimente les réclamations. Une reconduction de douze mois nous ramène dans un an devant
    la même décision, sans remise, à l''échéance, face à un éditeur en position de force.*


    Il tient sur la description du risque, pas sur la conclusion. Le diagnostic ne demande pas douze mois
    mais deux à trois semaines de mesure : la reconduction courte n''ajourne pas le diagnostic, elle refuse
    l''engagement long. Et si la thèse logicielle est confirmée, nous arrivons en décembre avec un dossier
    de mise en concurrence étayé plutôt qu''avec un contrat de trois ans signé sur une note sans pièces.
    Perdre 19 800 € est un coût certain ; s''engager sur 145 000 € et 31 000 € supplémentaires à partir
    d''un diagnostic faux est un coût plus grand, et non réversible avant 2029.


    ## 6. Repli et déclencheurs


    - **Si l''éditeur n''a pas répondu par écrit sur la compatibilité v4 / bornes 2015 avant le 25** →
    la v4 est retirée de l''ordre du jour du 28.

    - **Si le contrat n''autorise aucune durée inférieure à trois ans et que l''éditeur refuse une reconduction
    de douze mois** → prendre douze mois au prix plein ; à défaut, signer trois ans **sans la v4**, celle-ci
    restant une option distincte décidée après diagnostic, et inscrire la mise en concurrence au programme
    2027.

    - **Si l''éditeur ne fournit pas les journaux applicatifs sous dix jours ouvrés** → mesure conduite
    en interne (comptage des écarts sur les sept sites) et refus versé au dossier de mise en concurrence.

    - **Si une interruption de plus de 8 h consécutives survient sur un site avant le 28** → point d''urgence
    traité hors de cette procédure.


    ## 7. Ce qui renverserait cet avis


    La ventilation des 71 réclamations de mars-juin réparties sur au moins cinq des sept sites, ou des
    pertes mesurées sur un site sans bornes de 2015 et sans changement de février. La cause serait alors
    systémique : la sortie de l''éditeur deviendrait l''axe principal et la mise en concurrence serait
    lancée sans attendre décembre.


    En sens inverse, si 70 % ou plus de ces réclamations se concentrent sur Rive-Sud, le dossier se referme
    sur un correctif local et une reconduction longue redevient défendable.


    ## 8. Ce que j''engage dans les quinze jours


    | Éch. | Action | Livrable | Porteur |

    |---|---|---|---|

    | J+2 | Lecture juridique du contrat : durée minimale, reconduction tacite, préavis, assiette de la
    remise, base d''indexation | Fiche d''une page | Direction / marchés |

    | J+2 | Une lettre à l''éditeur, cinq questions : compatibilité v4/bornes 2015 (oui-non-coût), changelog
    de mars, extraction des journaux de réservation sur 12 mois, liste des tickets ouverts depuis janvier,
    validité de la remise après le 30 — **réponse écrite exigée avant le 25** | Courrier + accusé | Direction
    |

    | J+3 | Ventilation des 96 réclamations par site et par mois | Tableau | Chargé de mission numérique
    |

    | J+3 → J+15 | Relevé quotidien sur les 7 sites : réservations créées / réservations retrouvées, 10
    jours ouvrés | Taux d''écart par site | Chargé de mission + un référent par site |

    | J+4 | Visite de Fontaine : établir s''il existe un contournement local ou une non-remontée | Note
    d''une page | Chargé de mission |

    | J+7 | Chiffrage du remplacement des bornes de 2015 (Fontaine, Rive-Sud), indépendant du choix logiciel
    | Deux devis | Services techniques |

    | J+10 | Entretien avec le réseau voisin : effectif technique pendant la migration, cause du maintien
    du papier sur 2 sites, coût complet constaté | Compte rendu | Direction |

    | Immédiat | Rive-Sud : reconnaissance des heures de ressaisie et renfort ponctuel, sans attendre
    le 28 | Décision de service | Direction |

    | Immédiat | Ouverture du recrutement du poste informatique libéré en octobre | Fiche de poste publiée
    | RH |

    | J+12 | Note au comité : état des réponses, coût complet des trois options sur trois ans, question
    soumise au vote | Note d''une page | Chargé de mission |


    Le pilotage du diagnostic revient au chargé de mission numérique : sa note n''est pas retenue comme
    fondement de la décision, mais la mesure qu''elle appelle est exactement ce qui manque, et il est
    le mieux placé pour la conduire.


    ---


    Deux réserves de méthode, à la disposition du comité : le chiffrage de la remise suppose que l''indexation
    de 7 % s''applique dès la première année et que la remise porte sur les trois annuités — l''assiette
    réelle n''est pas au dossier (point 1 des engagements). Et le silence de Fontaine est traité comme
    une information à vérifier, jamais comme une absence de problème.


    Si vous le souhaitez, je peux en faire une page mise en forme pour la distribution en séance.

    '
