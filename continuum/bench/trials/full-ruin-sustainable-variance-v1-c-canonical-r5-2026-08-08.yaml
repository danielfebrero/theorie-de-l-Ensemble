response:
  text: '# Note au conseil — Vendredi

    **Objet : arbitrage Sedamex (A) / Nordwerk (B) — horizon 18 mois**

    **De : la direction générale**


    ---


    ## Recommandation


    **Option B — installation de la ligne Nordwerk — sous trois conditions préalables à la signature**,
    détaillées au point 4. Si l''une des trois n''est pas levée, je recommande A sans hésitation.


    ## 1. Le chiffre qui décide


    En différentiel contre A, B rapporte 700 k€ en cas de succès et coûte 600 k€ en cas d''échec. Espérance
    : **+180 k€ en faveur de B**.


    Le chiffre utile n''est pas cette espérance, c''est le **seuil d''indifférence : 46 %**. En dessous
    de 46 % de probabilité de succès, A l''emporte. Le bureau d''études annonce 60 %. Nous disposons donc
    de **14 points de marge d''erreur** sur son estimation. La question posée au conseil n''est pas «
    croyons-nous au bureau d''études ? » mais « son estimation peut-elle être surévaluée de plus de 14
    points ? ».


    ## 2. La maison n''est pas en jeu


    C''est le cœur de mon désaccord avec la direction financière, et il est vérifiable ligne à ligne :


    | | Montant | Part |

    |---|---|---|

    | Perte maximale contractuelle | 400 k€ | 11,8 % des fonds propres |

    | Fonds propres après pire cas | 3,0 M€ | covenant à 1,2 M€ — **marge de 1,8 M€** |

    | Trésorerie après pire cas | 2,2 M€ | 13 mois de masse salariale |

    | Perte nécessaire pour toucher le covenant | 2,2 M€ | **5,5 fois le pire cas** |


    Et surtout, ce qui *n''existe pas* dans ce contrat : pas de caution personnelle, pas de défaut croisé,
    pas de sûreté sur l''actif industriel, pas de nantissement du carnet de commandes. **La perte est
    bornée et cloisonnée.** Un mauvais tirage dont le pire cas laisse l''entreprise à 3,0 M€ de fonds
    propres et 13 mois de salaires en caisse n''est pas un risque de ruine : c''est de la variance. On
    refuse la ruine, on accepte la variance — sinon on ne décide plus rien.


    ## 3. Réponse à la direction financière


    **« On ne joue pas la maison sur un tirage à 40 % »** — d''accord sur le principe, et c''est précisément
    pourquoi je recommande B. Cette formule confond le montant en jeu et l''exposition réelle. Ce qui
    joue une maison, ce sont les quatre clauses que je viens d''énumérer, et aucune n''est présente ici.


    **Tremay** — je prends l''avertissement au sérieux, mais il faut savoir ce qu''il nous apprend. Tremay
    avait-il un plafond de perte contractuel ? Un financement en fonds propres ou en dette ? Une caution
    du dirigeant ? Quinze mois de trésorerie ? Sans ces réponses, le dépôt de bilan de Tremay nous renseigne
    sur *la structure de son engagement*, pas sur la technologie. Un cas non instruit contre onze installations
    documentées ne renverse rien — mais il devient décisif si l''instruction révèle une structure comparable
    à la nôtre. **Je demande cette vérification avant vendredi ; elle est faisable en quarante-huit heures.**


    **Là où la direction financière a raison, et c''est le vrai risque** : le 60 % vient de notre propre
    bureau d''études, qui n''est pas un tiers neutre. Le danger n''est pas la perte de 400 k€, c''est
    une estimation optimiste de plus de 14 points. C''est ce risque-là que les conditions ci-dessous traitent.


    ## 4. Trois conditions préalables — non négociables


    1. **Contre-expertise indépendante** des onze installations comparables, sous trois semaines, mandatée
    et pilotée par la direction financière. Si elle ramène la probabilité sous 50 %, nous prenons A.

    2. **Lecture juridique du plafond de 400 k€**, exclusions comprises. Si le plafond comporte une brèche,
    l''analyse ci-dessus tombe entièrement.

    3. **Plafond interne d''engagement complémentaire fixé à 150 k€** par décision du conseil, opposable
    à la direction générale. Le contrat plafonne la pénalité, il ne plafonne pas ce que nous dépenserons
    *en interne* pour sauver le projet. C''est par là qu''on dérape. Exposition totale bornée : 550 k€,
    soit 16 % des fonds propres.


    Je propose que la direction financière détienne le mandat de contrôle et le déclencheur d''escalade
    sur les trois. Elle porte l''objection la plus utile du dossier : sa place est au tableau de bord,
    pas en opposition.


    ## 5. Ce qui doit alerter le conseil après signature


    L''engagement est ferme et sans sortie : **tout notre levier se situe avant la signature.** Après,
    il n''y a plus de repli juridique, seulement un repli opérationnel. Déclencheur observable : dépassement
    du plafond des 150 k€ internes, ou dérive de plus de six semaines sur un jalon technique. Dans ce
    cas, la consigne est immédiate et unique : **cesser tout investissement complémentaire et purger la
    position à 400 k€.** Pas de rattrapage, pas de rallonge.


    ## 6. Réserve explicite


    Ce raisonnement suppose l''exploitation courante au moins à l''équilibre hors ces deux options. Si
    le résultat courant des dix-huit prochains mois est structurellement déficitaire, le calcul du covenant
    change et la recommandation doit être réexaminée. Je demande cette confirmation au contrôle de gestion
    avant vendredi.


    **Première action, dès lundi :** mandater la contre-expertise et lancer l''instruction du dossier
    Tremay. Aucune signature avant les trois levées.


    ---


    *Note de méthode (hors document conseil) : le point 2 est le pivot. La direction financière applique
    un veto de ruine à une situation qui n''en présente pas les caractéristiques — perte plafonnée, aucun
    recours sur le patrimoine, covenant à 5,5× de distance. J''ai déplacé le risque là où il est réellement
    : dans l''estimation de probabilité produite en interne, pas dans le montant exposé. D''où des conditions
    qui achètent de l''information plutôt qu''un refus qui n''en achète aucune.*

    '
