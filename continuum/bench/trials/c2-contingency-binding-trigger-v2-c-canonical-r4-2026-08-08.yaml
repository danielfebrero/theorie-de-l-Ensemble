response:
  text: '# Note au comité de direction — vendredi 14 août 2026


    **Objet :** prestataire de paiement, arbitrage Solda / Payflux · **De :** direction des opérations


    ## Recommandation : option B, sur un calendrier révisé de 12 semaines adossé au 28 février. Une seule
    action engageante avant l''automne : notifier Solda avant le 15 octobre.


    ### 1. L''écart entre A et B est petit ; ce qu''il achète ne l''est pas


    A économise 500 k€, B 310 k€ : **190 k€ d''écart affiché, soit 0,07 % de notre volume annuel** (276
    M€ = 18 000 × 42 € × 365).


    Notre actif n''est pas le contrat, ce sont **2,1 millions de jetons de carte**. Chacun porte 131 €
    de volume par an. Sous A, si Payflux ne tient pas, le compte Solda est clos : retour en 6 semaines
    **et** recollecte des empreintes auprès de 2,1 M de clients. Un jeton sur cent qui ne revient pas
    coûte 2,76 M€ de volume annuel. **Il suffit que 0,07 % des jetons ne se ré-enregistrent pas pour effacer
    les 190 k€.** Aucune campagne de recollecte n''échoue à 0,07 %.


    Formulé en pari : A n''est rationnel que si la probabilité que Payflux ne tienne pas est inférieure
    à **1,4 %** (190 k€ / 13,8 M€, en ne perdant que 5 % des jetons). Ce que nous savons de Payflux :
    **un** pilote, chez **un autre** marchand, à 1,3 % d''échec pendant trois semaines — 3,25 fois notre
    taux actuel. Ce n''est pas une base pour parier à 98,6 %.


    **Prudence comptable.** Les 310 k€ supposent un chevauchement plus court que le calendrier ci-dessous.
    Avec trois mois de prolongation Solda (390 k€) et trois mois de double run (135 k€), l''économie année
    1 tombe vers 100–150 k€ et l''écart réel avec A monte à ~400 k€. Le seuil de bascule passe alors de
    1,4 % à 2,9 %. **Rien ne permet d''affirmer qu''il est en dessous. La recommandation ne change pas.**


    ### 2. Deux défauts de l''option A qui ne sont pas dans le dossier


    - **Le SLA ne couvre pas le risque.** Les 99,9 % portent sur la *disponibilité*, pas sur le *taux
    d''autorisation*. Un prestataire peut être disponible 100 % du temps et refuser 1,3 % des cartes —
    c''est exactement ce que son pilote a mesuré. Le SLA donne des avoirs de service, pas des commandes.

    - **Le calendrier de A tient à trois jours.** Bascule le 3 novembre, rodage de trois semaines achevé
    le 24. Black Friday tombe le 27. Si la stabilisation prend quatre semaines au lieu de trois, le pic
    de l''année tourne à 1,3 % d''échec sur 100 % du trafic, sans repli, compte Solda fermé.


    ### 3. Calendrier proposé


    | Date | Action |

    |---|---|

    | **Avant le 15 oct.** | Lettre à Solda. La prolongation n''est pas un coût, c''est une **option**
    ; ne pas notifier la détruit définitivement. |

    | **10 nov.** | Signature Payflux — pas avant. La fenêtre de sortie gratuite (90 j → ~8 fév.) doit
    couvrir tout le ramp, y compris 3 semaines à 100 %. Intégration lancée dès octobre sous lettre d''intention,
    hors horloge contractuelle. |

    | **17 nov. – 7 déc.** | **10 %.** Black Friday à 10 % sur Payflux, 90 % sur Solda dont le pic est
    connu (0,9 %). |

    | **8 – 28 déc.** | **25 %**, palier gelé pendant le pic de Noël. |

    | **29 déc. – 18 janv.** | **50 %.** |

    | **19 janv. – 8 fév.** | **100 %**, Solda ouvert en secours. |

    | **8 fév.** | Go / no-go, dernier jour de sortie sans pénalité. |

    | **28 fév.** | Fermeture Solda. Mur infranchissable, écrit par Solda. |


    **Séquencement.** L''acte irréversible n''est pas le basculement du trafic, c''est la **fermeture
    du compte Solda**. Les jetons sont copiés chez Payflux dès novembre ; le coffre Solda reste vivant
    jusqu''au 28 février. On ne ferme rien avant trois semaines propres à 100 %.


    ### 4. Repli — tableau de bord à 5 min, astreinte à 15 min


    - Échec Payflux > **0,8 %** sur deux fenêtres de 30 min consécutives → retour à 0 % Payflux, palier
    gelé.

    - Écart d''autorisation > **1,5 pt** vs Solda à mix BIN comparable sur 24 h → palier gelé, pas de
    montée.

    - Deux gels sur un même palier → **sortie avant le 8 février**, pénalité nulle, Solda jusqu''au 28
    février, nouvel appel d''offres.

    - Aucune montée automatique : chaque palier exige 7 jours consécutifs sous 0,55 % d''échec.


    ### 5. Ce qui accélérerait — et ce qui renverserait


    Si au palier 25 % (fin décembre, en pleine charge) Payflux tient **sous 0,45 % d''échec** avec une
    latence dans la bande de Solda, on saute le palier 50 %, on passe à 100 % le 5 janvier et on ferme
    Solda le 31. Environ 130 k€ récupérés. **La recommandation n''est pas « aller lentement », c''est
    payer l''information tant qu''elle coûte moins cher que l''erreur, et cesser de la payer dès qu''on
    l''a.**


    ### 6. Trois demandes à porter avant le 15 octobre


    1. **Payflux — fenêtre à 120 jours, ou engagement contractuel sur le taux d''autorisation** (pas la
    disponibilité), sortie sans pénalité si le seuil n''est pas tenu sur 30 jours. Elle déplace les 240
    k€ de pénalité vers Payflux.

    2. **Payflux — prise en charge du double run** (135 k€) contre l''engagement 24 mois. Ils encaissent
    1,8 M€ sur deux ans.

    3. **Solda — alignement des 130 k€/mois sur le prorata contractuel** (116,7 k€) : 40 k€ sur trois
    mois.


    Si les trois passent, l''écart entre A et B tombe sous 50 k€ et le débat s''éteint.


    ### 7. Le meilleur argument contre cette note


    *« Le pilote a déjà montré la stabilisation à 0,5 %. 190 k€ de cash pour un risque hypothétique, c''est
    cher — et B ramène l''inconnu en pleine saison, alors que A l''aurait rodé avant. »*


    Il tient sur un point : B ramène effectivement Payflux dans le pic. Mais il y arrive **à 10 % de trafic,
    plafonné, réversible en quinze minutes**, Solda portant le reste à un taux connu. A y arrive à 100
    %, avec trois jours de marge et aucun repli. L''argument ne bascule vers A que si l''on tient le pilote
    d''un autre marchand pour une garantie sur notre mix de cartes et notre volume. Ce n''en est pas une.


    ---


    ## Ce qu''on fait lundi


    1. **Rédiger la lettre à Solda** (prolongation mois par mois, envoi avant le 15 octobre). Seule action
    engageante ; elle n''oblige à rien d''autre qu''à conserver le choix.

    2. **Ouvrir les trois négociations** du § 6 — Payflux d''abord, la clause de taux d''autorisation
    en priorité.

    3. **Cadrer le ramp avec l''astreinte** : règles de répartition, seuils d''alerte, et **procédure
    de retour à 0 % testée à blanc avant le 10 novembre**. Un repli jamais répété n''est pas un repli.


    ---


    Trois écarts assumés par rapport au dossier tel qu''il vous a été soumis, à valider en séance : le
    ramp passe de 10 à 12 semaines, l''économie de 310 k€ me paraît surévaluée une fois le calendrier
    réel posé (§ 1), et la date de signature Payflux devient un paramètre de décision et non une formalité.

    '
