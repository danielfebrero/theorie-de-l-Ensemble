response:
  text: '## Note


    **NOTE AU COMITÉ DE DIRECTION**

    **Objet :** contrat cellules 2027 — arbitrage Kelmar / Sinolux

    **De :** Direction des opérations — lundi 10 août 2026


    **Recommandation.** Réserver la capacité Kelmar avant J+18 pour les 72 000 unités. N''ouvrir Sinolux
    qu''en seconde source, sur une tranche bornée, et seulement si trois conditions sont réunies d''ici
    J+21. Retirer les 230 400 € du budget 2027.


    **1. Les 230 400 € sont un solde brut, pas un gain.** Chaque reprise coûte 205 €, identiques chez
    les deux fournisseurs. L''écart de prix cellule est mangé point par point par le taux de retour. Seuil
    de bascule : **Sinolux devient perdant au-delà de 2,86 %** (Kelmar : 1,3 % stable depuis quatre ans).


    | Taux Sinolux | Origine du chiffre | Gain / perte vs Kelmar |

    |---|---|---|

    | 1,1 % | essais internes Sinolux | **+260 k€** |

    | 2,86 % | — | 0 (seuil) |

    | 3,0 % | Ferro | −21 k€ |

    | 3,1 % | audit sectoriel de mars | −35 k€ |

    | 4,0 % | scénario dégradé | −168 k€ |


    **2. Nous avons deux sources, pas trois.** La note méthodologique de Ferro indique qu''il travaille
    sur l''échantillon de l''audit de mars : « environ 3 % » n''est pas une confirmation indépendante,
    c''est une relecture. Restent une mesure indépendante à 3,1 % et une auto-déclaration du vendeur à
    1,1 %. Les deux chiffres au-dessus du seuil n''en font qu''un ; l''unique chiffre favorable est produit
    par la partie qui a intérêt à ce chiffre.


    **3. Le refus d''indexation est l''information la plus solide du dossier — et elle est gratuite.**
    Un fournisseur qui croit à 1,1 % accepte une clause indexée sur le taux de retour : elle ne lui coûterait
    rien. Sinolux la refuse et offre à la place le remplacement gratuit de la cellule, soit 22,80 € —
    **11 % du coût d''une reprise**. Il nous laisse les 89 % restants. La garantie couvre exactement la
    part du risque qui n''est pas chère.

    *Réserve à lever avant tout engagement :* si ce remplacement couvre aussi la cellule facturée à l''intérieur
    des 205 €, le seuil remonte à 3,22 % et Sinolux redevient marginalement positif même à 3,1 % (+16
    k€). C''est la seule grandeur manquante qui change le **signe** du résultat ; elle doit être tranchée
    par écrit.


    **4. Le test Vertex arrive après la décision.** Résultat à J+63 (12 octobre) ; la réservation Kelmar
    est due à J+18 (28 août), ferme, et le prix Sinolux tombe à J+21 (31 août). Aucun résultat ne sera
    disponible au moment de trancher. De plus, ±0,3 point est la précision du laboratoire sur le vieillissement,
    pas l''erreur de transfert vers un taux de retour terrain (montage, logistique, usage client) : sur
    un seuil situé entre 2,86 % et 3,22 %, une lecture à 3,0 ± 0,3 ne départage rien. **Nous recommandons
    de le commander quand même — pour 2028**, où 34 000 € achètent un chiffre mesuré avec un an de marge
    avant un arbitrage de même taille. Il ne finance pas la décision de ce mois-ci.


    **5. Décision.**

    a) **Réserver Kelmar avant le 28 août.** C''est la seule action irréversible du calendrier : passé
    J+18 la ligne 2027 est vendue, la production démarre le 19 octobre et le lancement ne glisse pas.

    b) **Tranche Sinolux de 12 000 unités** (38 400 € d''économie) uniquement si, avant le 31 août : (i)
    Kelmar confirme 26,00 € sur 60 000 unités — une hausse de 0,50 € annulerait à elle seule le gain de
    la tranche ; (ii) Sinolux précise par écrit le périmètre du remplacement gratuit ; (iii) ces cellules
    sont planifiées en production après le 12 octobre, donc après Vertex.

    c) **Commander Vertex** (34 000 €).

    d) **Budget : ramener la ligne 2027 de 230 400 € à 0 €.** La tranche, si elle se fait, pèse entre
    −6 k€ et +43 k€ — du bruit sur un poste de 1,87 M€. La direction financière garde la main sur son
    go/no-go et portera l''arbitrage 2028 sur un chiffre mesuré, à date fixe.


    **Pire cas et qui l''encaisse.** Tranche à 4 % : 28 000 € de reprises supplémentaires, absorbées par
    les opérations et par 324 clients repris. À l''inverse, nous renonçons à une économie qui, dans la
    seule hypothèse du vendeur, valait 260 000 €. Le pire cas que cette note écarte est d''un autre ordre
    : Sinolux en source unique, ligne Kelmar vendue, démarrage non reportable.


    **Repli et déclencheur.** Taux de retour observé > 2,5 % sur les 3 000 premiers chargeurs à 90 jours
    de mise en service, ou lecture Vertex > 3,3 % : la tranche n''est pas reconduite, le volume 2028 repart
    chez Kelmar.


    **Ce qui renverserait cette note.** Une mesure indépendante du taux de retour Sinolux, ligne comparable,
    sous 2,5 % — ou l''acceptation par Sinolux d''une clause indexée à 205 € par reprise. L''un ou l''autre
    suffit : nous basculons alors sur le volume complet.


    **Première action, lundi matin.** Obtenir de Kelmar sous 72 heures son prix ferme sur 60 000 unités,
    et de Sinolux le périmètre écrit du remplacement gratuit. Ces deux réponses conditionnent tout le
    reste et doivent être au dossier avant le 28 août.


    ---


    Deux points sur lesquels je me suis appuyé et qui méritent votre attention : le calcul de seuil (2,86
    % strict / 3,22 % si la garantie couvre la cellule des 205 €) rend la décision indéterminée au niveau
    des estimations centrales — ce n''est pas 230 400 € contre 0, c''est ±30 k€ contre la perte du seul
    fournisseur de repli. Et le calendrier rend le test de 34 000 € inutile pour l''arbitrage de ce mois-ci,
    quoi qu''en dise son délai « sous neuf semaines ».

    '
