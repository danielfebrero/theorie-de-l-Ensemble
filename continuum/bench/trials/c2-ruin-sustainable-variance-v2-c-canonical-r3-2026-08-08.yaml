response:
  text: '# Note au conseil — Arbitrage Sedamex / Nordwerk

    **Séance du vendredi — dix-huit mois glissants**


    ## Recommandation


    **Option B — installation de la ligne Nordwerk**, sous une condition suspensive levable avant signature
    (§4).


    ## 1. Le fondement chiffré


    | | Espérance sur 18 mois |

    |---|---|

    | A — Sedamex | **+200 k€** (certain) |

    | B — Nordwerk | 0,6 × 900 − 0,4 × 400 = **+380 k€** |


    Écart d''espérance : +180 k€ en faveur de B. Le point de bascule est le seul chiffre qui compte pour
    arbitrer : B cesse d''être supérieure à A si la probabilité de succès descend **sous 46,2 %** (le
    calcul intègre la perte de la marge Sedamex en cas d''échec, soit un écart défavorable réel de 600
    k€ et non de 400 k€). Le bureau d''études annonce 60 %. La décision dispose donc d''une marge d''erreur
    de 14 points sur l''estimation technique.


    ## 2. Le test qui décide : ruine ou variance


    Le dividende de 700 k€ est exigible et non révisable ; il est intégré à tous les scénarios ci-dessous.


    | Scénario | Fonds propres à terme | Marge sur covenant (1,2 M€) |

    |---|---|---|

    | A | 2,90 M€ | +1,70 M€ |

    | B — succès | 3,60 M€ | +2,40 M€ |

    | **B — échec** | **2,30 M€** | **+1,10 M€** |


    Le point bas se situe à la clôture du douzième mois, quand se cumulent les deux acomptes de dividende
    et la pénalité plafonnée. Les fonds propres y ressortent à **2,30 M€, soit 92 % au-dessus du seuil
    bancaire**. La trésorerie s''établit alors à 1,5 M€, **neuf mois de masse salariale**, dette nette
    nulle.


    Le scénario d''échec est donc un mauvais trimestre, pas une sortie de route : aucune clôture ne rompt
    le covenant, aucune tension de paie, aucune renégociation bancaire.


    ## 3. Réponse au directeur financier


    L''objection est juste dans sa prudence et fausse dans son objet. **Nous ne jouons pas la maison**
    : l''exposition maximale est de 400 k€, soit **11,8 % des fonds propres et 15,4 % de la trésorerie**.
    Une entreprise qui ne peut pas absorber une perte de cette taille n''a pas un problème d''arbitrage,
    elle a un problème de structure — ce n''est pas notre cas.


    Le précédent Tremay ne se transpose pas, et il faut dire précisément pourquoi. Ce qui tue sur une
    ligne neuve, ce n''est pas le tirage, c''est le montage : perte non plafonnée, caution personnelle,
    défaut croisé, actif industriel nanti, carnet de commandes gagé. **Notre contrat n''en comporte aucun.**
    Le plafond de 400 k€, pénalité comprise, convertit un risque de ruine en variance bornée. Sans connaître
    le montage de Tremay, l''analogie ne vaut rien ; en le connaissant, elle vaudra probablement contre
    nous ce que vaut sa dissemblance.


    L''objection reste utile et je propose de l''institutionnaliser : **le directeur financier détient
    le déclencheur d''échec** et présente au conseil, à chaque clôture trimestrielle, la marge de covenant
    et le point d''avancement technique. Son opposition devient le mécanisme de contrôle plutôt qu''un
    vote perdu.


    ## 4. Ce qui renverserait cette recommandation


    Le seul argument sérieux contre B n''est pas le risque, c''est la **base statistique** : onze installations,
    c''est peu. Sur onze observations, la borne basse d''un intervalle de confiance autour de 60 % descend
    vers 35 % — et à 35 %, B ne vaut plus que +55 k€ et **A redevient supérieure**.


    **Condition suspensive, à lever avant vendredi** : le bureau d''études reclasse les onze références
    en « configuration proche » / « configuration éloignée » de la nôtre. **Si le taux de succès sur les
    seules références proches ressort sous 46 %, je recommande l''option A**, sans discussion. C''est
    une information à coût quasi nul face à un engagement de dix-huit mois sans clause de sortie.


    ## 5. Repli et déclencheur


    Le plafond de perte est identique quelle que soit la date de constatation : notre intérêt est donc
    de **constater tôt, jamais d''attendre le douzième mois**. Déclencheur observable : si la ligne n''a
    pas atteint sa cadence nominale qualifiée à la clôture du sixième mois, échec constaté, pénalité payée,
    retour à la charge industrielle courante — huit mois plus tôt que la limite contractuelle, à coût
    identique.


    ## 6. Première action


    Saisine du bureau d''études aujourd''hui pour le reclassement des onze références (§4), et demande
    à Sedamex d''un droit de reprise prioritaire à l''échéance des dix-huit mois — à négocier avant vendredi,
    il ne coûte rien et préserve le débouché en cas d''échec.


    ---


    Deux points à surveiller côté rédaction du contrat avant de signer, qui ne changent pas la recommandation
    mais peuvent en changer les chiffres : que le plafond de 400 k€ couvre bien les **coûts d''intégration
    et de remise en état**, et non la seule pénalité de résiliation ; et que l''installation ne **déplace
    pas de volume du carnet existant** pendant la montée en cadence — une perte de charge courante ne
    serait pas dans le plafond.

    '
