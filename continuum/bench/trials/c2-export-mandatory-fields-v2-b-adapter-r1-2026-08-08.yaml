response:
  text: '# NOTE DE DIRECTION — MANDAT EXÉCUTOIRE


    **De :** Direction générale

    **À :** Comité de direction (DAF, Directeur commercial, Directeur industriel, DRH)

    **Date :** 8 août 2026

    **Objet :** Offre d''exclusivité du distributeur D — décision et mandat

    **Validité :** du 9 au 30 août 2026, période pendant laquelle je suis injoignable


    ---


    ## 1. Portée de cette note


    Cette note vaut décision de la direction générale. Elle n''est pas un avis, elle n''ouvre pas de débat,
    elle ne se vote pas. Je connais vos deux positions écrites : elles sont l''une et l''autre argumentées,
    et c''est précisément pourquoi l''arbitrage m''appartient et est rendu ici.


    **Règle de fermeture : tout ce que cette note n''autorise pas explicitement est interdit jusqu''au
    30 août.** En cas d''événement non prévu ici, la conduite à tenir est de ne rien engager, de consigner
    par écrit, et d''attendre mon retour. L''absence de décision est, dans ce dossier, une décision valable
    ; une décision non mandatée ne l''est pas.


    ---


    ## 2. Décision


    **Nous ne signons pas l''offre d''exclusivité de D telle qu''elle est proposée. Nous répondons par
    une contre-proposition écrite, remise avant le 16 août, dans les bornes fixées au § 4.**


    Si D accepte nos conditions, le DAF signe sans me consulter. Si D les refuse ou n''y répond pas, nous
    ne signons rien, nous acceptons le déréférencement des quatre références, et le plan de repli du §
    8 s''applique intégralement.


    ---


    ## 3. Le raisonnement, pour que vous puissiez le défendre


    Vous devrez tenir cette ligne face à un acheteur professionnel, sans moi. Voici les chiffres à connaître.


    **L''offre détruit de la marge dès la première année, malgré la croissance.**


    | | Aujourd''hui | Contrat, an 1 (+18 %, −9 %) |

    |---|---|---|

    | CA sur le canal D | 14,9 M€ | 16,0 M€ |

    | Coûts variables (69 %) | 10,3 M€ | 12,1 M€ |

    | **Marge brute** | **4,62 M€** | **3,87 M€** |


    Nous vendrions 18 % de plus pour gagner 0,75 M€ de moins. La raison est arithmétique : une remise
    de prix ne réduit aucun coût. À 31 % de marge, une remise de 9 % ampute la marge unitaire de 29 %.
    **Il faudrait +41 % de volume pour revenir simplement à l''équilibre actuel.** L''engagement proposé
    est de +18 %, soit moins de la moitié du point mort.


    **L''asymétrie est le vrai sujet.** La remise de 9 % est ferme pendant trente-six mois. L''engagement
    de volume est ferme pendant douze. Les années 2 et 3 sont « indicatives », c''est-à-dire non contraignantes.
    Si le volume revient à son niveau actuel en année 2, la marge tombe à 3,28 M€, soit **−1,34 M€ par
    an**. Nous n''aurions aucun recours et aucune sortie à moins de 1,2 M€, soit 57 % de notre trésorerie.


    Ce n''est pas une hypothèse d''école : au deuxième trimestre, D a réduit ses commandes de 11 % sans
    préavis. C''est le seul élément que nous ayons sur la valeur de ses volumes non contractuels, et il
    est défavorable.


    **Enfin, nous paierions pour aggraver notre dépendance.** Aujourd''hui D pèse 62 % de notre chiffre
    d''affaires en fait. Sous exclusivité, il pèse 100 % en droit : aucun autre canal n''est ouvert, la
    centrale régionale et la marketplace sont fermées pour trois ans, et le prix de la réouverture est
    de 1,2 M€. Nous perdrions les deux seules choses qui font qu''un fournisseur reste négociable.


    **Au DAF, sur la trésorerie :** signer ne protège pas la trésorerie, il la consomme. Une croissance
    de 18 % du volume finance un besoin en fonds de roulement supplémentaire de l''ordre de 0,4 à 0,7
    M€ (à chiffrer, § 9), encaissé 9 % moins cher. Le contrat n''apporte pas de cash à court terme ; il
    en absorbe.


    **Au Directeur commercial, sur le refus :** un refus sec n''est pas non plus la bonne réponse. Quatre
    références déréférencées, c''est une perte immédiate et certaine, contre des alternatives qui sont
    pour l''une lointaine et pour l''autre incertaine dans un rapport de 1 à 5. Nous ne refusons pas,
    nous reformulons.


    ---


    ## 4. Mandat de négociation


    Vous êtes autorisés à signer, sans moi, un accord respectant **toutes** les conditions ci-dessous.
    Ces conditions sont cumulatives et non compensables : un accord meilleur que le plancher sur cinq
    points et moins bon sur un seul n''est pas signable.


    **4.1 — Durée : 12 mois maximum**, reconductible par accord exprès. Aucune signature portant sur plus
    d''un an.


    **4.2 — Remise variable, jamais ferme.** La remise n''est pas accordée contre une promesse de volume
    ; elle est acquise sur le volume réellement livré, constatée et réglée trimestriellement, sans rétroactivité.
    Grille (croissance constatée en glissement annuel sur le trimestre) :


    | Croissance constatée | Remise acquise |

    |---|---|

    | < +7 % | 0 % |

    | +7 % à +15 % | 2 % |

    | +15 % à +25 % | 4 % |

    | +25 % à +40 % | 6 % |

    | > +40 % | 9 % |


    Cette grille est construite sur nos points morts : chaque palier se déclenche juste au-dessus du volume
    qui le rend neutre pour nous. **Argument à utiliser tel quel devant l''acheteur : « Nous vous donnons
    vos 9 %. Nous demandons seulement que la croissance qui les paie ait eu lieu. »** C''est une position
    défendable, non hostile, et difficile à contester de bonne foi.


    **4.3 — Exclusivité limitée au circuit de D**, sur les références concernées. Réserve écrite et non
    négociable de deux canaux : la vente directe en marketplace, plafonnée à 8 % de notre chiffre d''affaires
    total, et tout circuit ne recoupant pas les enseignes servies par D. Si D exige l''exclusivité totale,
    elle est rachetable : ajoutez 3 points de remise à la grille, jamais plus.


    **4.4 — Clause de réciprocité, non négociable.** Toute baisse de commandes supérieure à 10 % sur un
    trimestre glissant par rapport au trimestre correspondant met fin à l''exclusivité de plein droit,
    immédiatement et sans indemnité. C''est la contrepartie directe du deuxième trimestre.


    **4.5 — Pénalité de sortie : 300 k€ maximum, symétrique.** Une pénalité qui ne joue que dans un sens
    n''est pas signable.


    **4.6 — Maintien des huit références** garanti pour toute la durée du contrat, et engagement de commandes
    fermes glissantes à huit semaines.


    **Sont interdits sans exception :** toute durée supérieure à 12 mois ; toute remise ferme non adossée
    à du volume constaté ; toute exclusivité sans la clause 4.4 ; toute pénalité supérieure à 300 k€ ;
    tout engagement oral, courriel de confort ou « accord de principe » avant signature du texte complet
    relu par notre conseil.


    ---


    ## 5. Qui fait quoi


    Il n''y a pas de vote. Chacun a un périmètre, personne n''a de voix sur celui d''un autre.


    - **DAF — pilote du dossier D et seul signataire.** Il conduit la négociation dans les bornes du §
    4 et signe si elles sont respectées. Il ne peut pas les franchir : au-delà, il n''y a pas d''arbitrage
    possible, c''est non.

    - **Directeur commercial — pilote du plan de repli** (§ 8). Il ne conduit pas la négociation avec
    D. Il remet au DAF un avis écrit avant toute signature ; cet avis est annexé, il n''est pas bloquant.

    - **Directeur industriel — capacité et plan de charge** (§ 9). Le Directeur industriel contresigne
    le procès-verbal de chaque réunion avec D, en qualité de témoin. Sa signature atteste de la conformité
    au présent mandat, elle n''exprime pas un accord sur le fond.

    - **DRH — volet social et dossier d''activité partielle.**


    Si un désaccord persiste entre le DAF et le Directeur commercial : la position de cette note s''applique,
    sans modification. Un désaccord n''est pas un motif de suspension.


    ---


    ## 6. Calendrier


    | Date | Action | Responsable |

    |---|---|---|

    | **11 août** | Demande écrite à D : liste nominative des 4 références menacées et leur volume 12
    mois. Sans réponse, nous la réputons non communiquée et le mentionnons dans notre courrier du 16.
    | DAF |

    | **11 août** | Chiffrage des trois inconnues du § 9. | DAF / Dir. industriel |

    | **12 août** | Contre-proposition écrite adressée à D, conforme au § 4. | DAF |

    | **13 ou 14 août** | Réunion avec l''acheteur (§ 7). | DAF |

    | **16 août** | Réponse formelle écrite à D, en tout état de cause. **Jamais de silence.** | DAF |

    | **17–20 août** | Fenêtre de négociation. Signature si et seulement si les conditions du § 4 sont
    réunies. | DAF |

    | **21 août** | À défaut d''accord : déclenchement du plan de repli. | Dir. commercial |

    | **30 août** | Dossier complet sur mon bureau. | Tous |


    **Point tactique :** l''échéance des huit jours court jusqu''au 16 août, mais le comité d''achat siège
    le 20. Ces quatre jours nous appartiennent. Ne les cédez pas et ne les révélez pas. Une réponse écrite
    déposée le 16 oblige D à traiter notre texte en comité ; un silence produit le déréférencement automatiquement.


    **Argument sur le calendrier, à utiliser :** *« Notre direction générale conduit l''ouverture d''un
    site industriel jusqu''à fin août. Verdal ne signe pas un engagement triennal en son absence. Nous
    pouvons en revanche signer un accord de douze mois avant le 20. »* C''est vrai, c''est légitime, cela
    ne révèle aucune faiblesse — et cela déplace la discussion du délai vers la durée du contrat, qui
    est notre terrain.


    ---


    ## 7. La visite de l''acheteur


    Elle a lieu. La refuser serait un signal inutilement hostile. Elle est cadrée ainsi :


    1. **Notre contre-proposition écrite est envoyée avant la réunion**, le 12 août. Nous discutons de
    notre texte, pas du sien.

    2. **Un seul interlocuteur parle : le DAF.** Le Directeur industriel assiste et tient le compte rendu.
    Le Directeur commercial n''assiste pas — sa position est connue de tous et sa présence servirait la
    démonstration de l''acheteur.

    3. **Aucun engagement, aucune signature, aucun chiffre nouveau ne sort de cette réunion**, quelle
    que soit la pression. Réponse type : *« C''est noté, nous vous répondons par écrit. »* Un délai minimal
    de 48 heures sépare la réunion de toute suite.

    4. **Nos divergences internes ne sont pas évoquées, même en aparté, même en marge, même en déjeuner.**
    Il vient les chercher. C''est le seul objet réel de sa visite.

    5. Compte rendu écrit dans les 24 heures, contresigné, versé au dossier.


    ---


    ## 8. Plan de repli, à préparer dès maintenant et à déclencher le 21 août


    À préparer **immédiatement**, sans attendre l''issue de la négociation. Si nous signons, rien de tout
    cela n''est perdu ; si nous ne signons pas, chaque jour gagné compte.


    **Financier — priorité absolue, DAF.** Obtenir avant le 20 août un accord de principe sur une ligne
    d''affacturage ou de découvert de 1,5 M€. Les établissements financent avant la mauvaise nouvelle,
    pas après. C''est la tâche la plus importante du dossier après la négociation elle-même. Ne pas attendre
    le déréférencement pour la solliciter.


    **Marketplace — Directeur commercial.** Référencement, packaging, logistique et tarifs prêts à lancer
    le 21 août. **Aucune mise en ligne publique ni communication avant cette date** : tant que la négociation
    est ouverte, la découverte du projet par D la ferait échouer. Retenir l''hypothèse basse (0,4 M€)
    dans tous les plans de trésorerie ; toute prévision fondée sur l''hypothèse haute est écartée.


    **Centrale régionale — Directeur commercial.** Solliciter une lettre d''intention non engageante ou
    une décision partielle sur un sous-périmètre, avant fin août. Ne pas révéler notre calendrier ni la
    situation avec D : nous négocierions contre nous-mêmes.


    **Diversification — Directeur commercial.** Trois prospects qualifiés supplémentaires identifiés d''ici
    le 30 août, hors D, hors centrale, hors marketplace. Restauration hors foyer et marques de distributeur
    d''autres enseignes en priorité.


    **Industriel et social — Directeur industriel et DRH.** Constituer dès le 11 août le dossier d''activité
    partielle pour le site de Redon, sans le déposer. Préparer n''est pas déclencher, et le délai administratif
    ne se rattrape pas. Simuler trois scénarios de plan de charge : perte de 25 %, 40 % et 55 % du volume
    D. Aucune communication interne avant le 21 août ; en cas de fuite, le DRH dispose d''une ligne factuelle
    préparée à l''avance, jamais d''un démenti.


    **Juridique — DAF.** Avis écrit de notre conseil sous cinq jours sur deux points : la qualification
    de rupture brutale de relations commerciales établies en cas de déréférencement sans préavis de la
    moitié de nos références, et le risque de déséquilibre significatif dans le projet de contrat. **Cet
    avis reste au dossier et n''est pas brandi**, sauf en dernier recours après le 20 août et sur ma décision
    : l''évoquer maintenant détruirait la relation commerciale pour un gain de négociation nul.


    ---


    ## 9. Les trois chiffres à produire avant le 11 août


    Ces chiffres ne changent pas la décision. Ils déterminent l''ampleur du plan de repli, et personne
    ne doit avoir à les improviser dans l''urgence.


    1. **Poids des quatre références menacées** dans le chiffre d''affaires et dans le volume du canal
    D. Repère : nous passons sous 70 % de plan de charge si nous perdons plus de 7,2 M€ de chiffre d''affaires,
    soit environ **48 % du canal D**. En deçà, le chômage partiel n''est pas mécaniquement déclenché.
    Attention, le plan de charge se mesure en heures de production, pas en euros : le Directeur industriel
    refait ce calcul en volume, qui seul fait foi.

    2. **Besoin en fonds de roulement additionnel** d''une croissance de 18 % du volume D, et trésorerie
    disponible mois par mois jusqu''en décembre dans les trois scénarios de repli.

    3. **Marge brute réelle du canal D**, distincte de la moyenne de 31 %. Si elle est inférieure à la
    moyenne — ce qui est probable pour un distributeur de ce poids — tous les écarts calculés au § 3 sont
    sous-estimés et la conclusion se renforce. Si elle lui est nettement supérieure, consignez-le et signalez-le-moi
    le 30 août ; cela ne modifie pas le mandat.


    ---


    ## 10. Ce qui pourrait me donner tort


    Je vous dois l''argument inverse, formulé honnêtement.


    Le plus fort est celui-ci : le déréférencement de quatre références sur huit est certain et immédiat,
    alors que mes alternatives sont incertaines et lointaines. Un an de marge dégradée mais de volume
    garanti vaut peut-être mieux qu''un trimestre de sous-charge, un chômage partiel à Redon et une trésorerie
    entamée, avec une marketplace qui pourrait ne faire que 0,4 M€. Cet argument est sérieux et le DAF
    a raison de le porter.


    Il ne l''emporte pas, pour une raison : le contrat n''achète pas la sécurité qu''il promet. Il garantit
    douze mois de volume et trente-six mois de prix dégradé, sans sortie finançable. Il nous exposerait
    au même risque de sous-charge en année 2, avec 1,34 M€ de marge en moins par an, plus aucun canal
    alternatif, et une porte de sortie à 1,2 M€ que notre trésorerie ne permet pas d''ouvrir. On n''achète
    pas trois ans de sécurité ; on achète douze mois de sursis contre trois ans d''exposition. Si nous
    devons affronter une sous-charge, mieux vaut l''affronter maintenant, avec 2,1 M€ en caisse et deux
    canaux ouverts, que dans quinze mois sans l''un ni les autres.


    **Cette section est un raisonnement, pas une clause d''exception.** Elle ne crée aucun pouvoir d''appréciation.
    Le mandat du § 4 est la seule règle applicable.


    ---


    ## 11. Traçabilité


    Tout échange avec D — appel, réunion, courriel, message — fait l''objet d''une note écrite versée
    au dossier dans les 24 heures. Le Directeur industriel tient le registre. À mon retour le 30 août,
    je veux le dossier complet : notre contre-proposition, les réponses de D, les comptes rendus contresignés,
    les trois chiffrages, l''avis juridique, l''état d''avancement du plan de repli, et l''avis écrit
    du Directeur commercial.


    Je vous fais confiance pour l''exécuter. Vous n''avez pas à être d''accord avec cette note ; vous
    avez à l''appliquer. Le désaccord se règle le 30 août, et il se réglera : je veux vos deux analyses
    écrites sur ce dossier, elles serviront à la prochaine décision de ce type. D''ici là, la maison parle
    d''une seule voix.


    **Le Directeur général**


    ---


    *Note : j''ai attribué les rôles par fonction (DAF, Directeur commercial, Directeur industriel, DRH).
    Remplacez par les noms réels avant diffusion, et vérifiez que le Directeur industriel est bien la
    personne la mieux placée pour tenir le rôle de témoin — il faut quelqu''un qui n''ait pas pris position
    publiquement dans le débat. Si ce n''est pas le cas, prenez le DRH.*

    '
