response:
  text: 'Voici la note. Elle donne au comité une règle de bascule automatique sans nouvelle réunion —
    mais la variable de déclenchement n''est pas un nombre de jours, et le §3 dit pourquoi.


    ---


    # NOTE AU COMITÉ D''EXPLOITATION — 8 août

    **Objet :** conditions de retour de la boucle de chloration en régulation automatique

    **Rédacteur :** exploitation — **Décision demandée :** validation d''un critère de bascule opposable,
    exécutable sans nouvelle séance


    ## 1. Position


    Le retour en automatique est souhaitable et doit être **accéléré**, pas retardé. Le pilotage manuel
    coûte 41 k€/mois (≈ 9,5 k€ par semaine, 119 k€ engagés depuis le 13 mai) et **dégrade la qualité de
    dosage** : écart-type 0,21 mg/L contre 0,08 mg/L en automatique. Le régime actuel est plus cher *et*
    moins bon. Il n''y a aucun argument pour le prolonger au-delà du strict nécessaire.


    ## 2. Ce que mesurent les 87 jours au vert


    Ils mesurent que **S2 neuve ne dérive pas** et que **deux opérateurs dosent correctement à la main**.
    Ce sont deux bonnes nouvelles, sans rapport avec la cause du 12 mai.


    L''incident n''a pas été causé par une sonde qui dérive — une sonde dérive, c''est attendu. Il a été
    causé par le fait que **rien n''était en position d''arrêter la boucle quand elle a dérivé** : pas
    de comparaison S2/S3 dans la boucle, alarme de discordance inhibée depuis novembre. Ces trois conditions
    défaillantes sont, au 8 août, dans le même état qu''au 12 mai : **le programme de l''automate n''a
    pas été modifié**. Compter des jours en manuel ne teste pas un dispositif qui n''est pas en service.


    ## 3. Le comparateur : observation ≠ instrumentation


    Le comparateur tourne depuis le 14 juillet et n''a levé aucune alarme. Ce résultat ne se distingue
    pas de celui d''un comparateur en panne : depuis 25 jours il n''y a **aucune discordance à détecter**
    (S2 neuve, étalonnée), il n''a donc jamais été éprouvé. Un détecteur silencieux et un détecteur mort
    produisent la même sortie. Tant qu''on ne lui a pas présenté une dérive connue, on ne sait pas ce
    qu''il détecte.


    Surtout : **sa sortie va vers un tableau de bord, pas vers l''actionneur.** Il ne peut arrêter aucune
    boucle. Le critère signé le 13 mai dit « instrumentée », pas « observée ». Un afficheur n''est pas
    une instrumentation ; c''est ce qui existait déjà le 12 mai sous forme d''une valeur S3 lisible en
    supervision, que personne n''a comparée.


    **Aucun nombre de jours ne peut donc être inscrit dans cette note.** Une règle « N jours sans alarme
    et ça repart » ferait dépendre le redémarrage d''un compteur alimenté par un organe dont on ignore
    s''il compte. Après un second incident, ce document serait lu par l''ARS et par l''audit externe comme
    la trace écrite d''une décision prise en connaissance de cause.


    ## 4. Règle de bascule proposée — sans nouvelle réunion


    La boucle repasse en automatique **dès que les quatre conditions suivantes sont constatées et consignées**,
    sans autre validation que la signature du responsable qualité et de l''exploitation :


    1. **Chaînage à l''actionneur** — sur discordance S2/S3 au-delà du seuil retenu et maintenue au-delà
    de la temporisation retenue, la boucle bascule seule en repli sûr : gel de la consigne à la dernière
    valeur validée + dosage proportionnel au débit, alarme à l''astreinte. *Jamais l''arrêt du dosage*
    — le sous-chloré est la branche grave.

    2. **Épreuve par injection de dérive** — offset connu injecté sur S2, dans les deux sens, à trois
    amplitudes. Bascule en repli constatée dans le délai spécifié. Procès-verbal d''essai. Rejeu du profil
    réel du 12 mai en simulation.

    3. **Réarmement et inventaire des alarmes** — alarme de discordance active et vérifiée ; **liste exhaustive
    des alarmes inhibées sur l''usine**, avec justification ou réarmement. Une inhibition de novembre
    a survécu six mois sans être vue : rien ne dit qu''elle était seule.

    4. **Verrou de modification** — toute inhibition d''alarme devient tracée et à durée bornée, avec
    expiration automatique.


    Puis, **et alors seulement** : 14 jours en automatique sous supervision renforcée (un opérateur, pas
    deux), comparateur armé, avant retour au régime normal.


    ## 5. Coût, calendrier, conséquences


    | | |

    |---|---|

    | Travaux requis | chaînage automate + essais + inventaire alarmes |

    | Charge estimée | quelques semaines — **aucune dépendance à l''audit du 30 septembre** |

    | Économie par semaine gagnée | 9,5 k€ |

    | Si l''on attend le 30 septembre | 73 k€ supplémentaires, sans contrepartie technique |


    **Pire cas de la solution proposée :** le chiffrage de la charge dérape ; on continue de payer 41
    k€/mois quelques semaines de plus. Encaissé par la régie, réversible.


    **Pire cas de la règle « N jours » :** dérive de S2 dans le sens haut-lecture / bas-réel, sous-chloration
    non détectée, absence de résiduel sur le réseau. Encaissé par 96 000 abonnés, et sur le plan sanitaire,
    non réversible. C''est ce déséquilibre — et lui seul — qui justifie de ne pas écrire le compteur de
    jours.


    **Repli :** si le point 2 échoue (le comparateur ne fait pas basculer la boucle), retour immédiat
    au régime manuel, sans nouvelle décision.


    **Ce qui renverserait cette note :** la démonstration que le comparateur agit déjà sur l''actionneur
    — c''est-à-dire une modification du programme de l''automate postérieure au 12 mai. À notre connaissance
    il n''y en a aucune ; ce point est vérifiable en une heure et doit l''être avant jeudi.


    **Première action :** chiffrer d''ici mardi le chaînage comparateur → actionneur et le protocole d''injection
    de dérive, pour arbitrage jeudi.


    ---


    Deux choses à signaler sur cette note, monsieur le directeur général :


    Elle ne contient pas la règle que vous avez demandée. Un seuil en jours aurait été un chiffre précis
    portant sur la mauvaise grandeur : il compte le comportement d''une sonde neuve, alors que le 12 mai
    a été causé par l''absence d''organe d''arrêt. La grandeur qui manque n''est pas une durée, c''est
    une épreuve.


    Elle vous donne en revanche ce que vous cherchiez vraiment : **une bascule sans nouvelle réunion du
    comité**, sur un critère vérifiable au procès-verbal, et un chemin qui sort du manuel *plus vite*
    qu''un compteur de jours — lequel, en pratique, vous aurait fait attendre l''audit du 30 septembre
    par prudence, soit 73 k€ de plus. Le §4 point 3 (inventaire des alarmes inhibées) dépasse le périmètre
    de S2 : je l''ai inscrit parce qu''une inhibition passée inaperçue six mois est un défaut de gestion
    des modifications, pas un incident de capteur — retirez-le si vous préférez le traiter séparément.

    '
