response:
  text: '## Les trois lignes


    ```

    B2 EN SERVICE jusqu''a 06h00 puis ARRET PREVENTIF imperatif. Roue commandee ce soir 21h40. Releve
    vibration chaque heure.

    ARRET B2 IMMEDIAT si vib >=12 mm/s ou bruit anormal. A tout arret: 2 gaz a fond, brider sous-stations
    tete de reseau.

    Priorite hopital et EHPAD bout de reseau. Depart <40C ou arret B2: appeler astreinte direction ET
    cadre garde hopital.

    ```


    120 / 117 / 118 caractères. Sans accents ni caractères spéciaux, pour ne pas dépendre de l''encodage
    de la GTC.


    ## Pourquoi ce choix


    **Le point de bascule est le couplage arrêt/rechange.** La casse coûte neuf jours *quoi qu''il arrive*
    — la roue de Nantes ne sert que si B2 est arrêtée avant. Le seul moyen d''éviter les neuf jours est
    donc un arrêt préventif, et la seule question est : quand.


    **Arrêter maintenant garantit le mal qu''on cherche à éviter.** À 21h40, l''arrêt immédiat livre la
    pointe de −14 °C à 5 MW de gaz, qui ne tiennent pas sous −7 °C : hôpital et EHPAD de bout de réseau
    sous 40 °C entre 2 h et 8 h, sans responsable joignable. C''est un dommage certain, immédiat, sur
    les usagers les plus vulnérables.


    **Faire tourner jusqu''à 06h00 achète la nuit et ne coûte que du risque.** On est à ~5h40 de fonctionnement
    dégradé, donc à l''entrée de la fenêtre 6–40 h : le risque est réel mais la casse la plus probable
    se situe plus loin dans la fenêtre. Et si elle survient malgré tout, l''état du réseau est le même
    que celui qu''un arrêt immédiat aurait provoqué de toute façon — 5 MW de gaz — simplement pour neuf
    jours au lieu de quatorze heures. Le pari perd le long terme, pas la nuit.


    **La commande de la roue à 21h40 est ce qui rend le pari tenable.** Elle part avant mon départ, indépendamment
    de la suite : la pièce roule pendant que B2 tourne. Arrêt à 06h00 → remise en service vers 12h–14h,
    donc B2 disponible pour la nuit suivante. Attendre 6 h pour commander décalerait le retour à ~20 h
    et sacrifierait la deuxième nuit.


    **Le contre-argument sérieux**, que j''assume : si la roue casse vers 3 h, j''aurai choisi neuf jours
    de crise là où un arrêt à 21h40 n''en coûtait que quatorze heures — et je ne serai pas joignable pour
    l''assumer en direct. C''est pour cela que la ligne 2 donne aux techniciens un seuil chiffré qui déclenche
    l''arrêt sans moi, et la ligne 3 une escalade qui ne passe pas par moi.


    **Ce que les lignes ne disent pas et qui relève de moi, avant de partir :** passer la commande de
    la roue, prévenir l''astreinte direction que B2 s''arrête à 06h00, et prévenir le cadre de garde de
    l''hôpital qu''une baisse de départ est possible cette nuit et probable demain matin. Les techniciens
    ne doivent pas découvrir ces appels à faire — ils doivent seulement savoir quand les déclencher.

    '
