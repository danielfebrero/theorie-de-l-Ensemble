response:
  text: '# Note au comité — Fermetures de magasins

    **Objet : la décision demandée pour mardi**

    **Date : 8 août 2026 — 2 pages**


    ---


    ## 1. Ce que nous recommandons


    **Ne fermer aucun magasin mardi.** Non pas pour reporter la décision, mais parce que le calcul la
    contredit : fermer Vitry, Chambéry et Nîmes ferait **baisser** le résultat du groupe d''environ **114
    000 €**, avant même le coût des fermetures. L''objectif de 300 000 € ne se trouve pas là.


    Trois décisions sont en revanche à prendre mardi, et une est urgente :

    - **Vitry** : faire vérifier cette semaine la date limite de congé du bail. Un bail commercial se
    dénonce en général six mois avant l''échéance. Si c''est le cas ici, notre fenêtre de sortie sans
    indemnité se referme **dans un mois environ, pas dans sept**. C''est le seul point réellement contraint
    par le calendrier.

    - **Nîmes** : ouvrir le dossier de valorisation des murs (1,9 M€), séparément de la question de l''exploitation.

    - **Siège et logistique** : lancer le plan de réduction des 6,4 M€, qui est le seul gisement à la
    taille de l''objectif.


    ---


    ## 2. Les trois magasins « en perte » gagnent de l''argent


    Le résultat par magasin inclut une quote-part des 6,4 M€ de frais de siège et de logistique. **Ces
    frais ne disparaissent pas avec le magasin** : ils se reportent sur les dix-huit autres. Le chiffre
    qui compte pour une décision de fermeture est donc le résultat *avant* cette quote-part — ce que le
    magasin rapporte réellement une fois payés son loyer, ses salaires et ses charges propres.


    | | Résultat affiché | Quote-part siège | **Gain réel pour le groupe** |

    |---|---|---|---|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |

    | **Total** | −288 000 € | 402 000 € | **+114 000 €** |


    Ces trois magasins sont plus faibles que la moyenne du réseau — c''est vrai, et cela mérite un plan.
    Mais chacun rapporte plus qu''il ne coûte. **Fermer les trois, c''est perdre 114 000 € et devoir en
    trouver 414 000 € ailleurs pour tenir l''objectif.**


    ---


    ## 3. Ce que coûterait chaque fermeture


    **Chambéry** est le pire candidat : 1,1 M€ d''indemnité de résiliation pour perdre 32 000 € par an,
    et 92 km jusqu''au magasin suivant — aucun report de clientèle n''est crédible. À écarter définitivement.


    **Nîmes** : nous détenons les murs, donc pas de loyer à économiser. Le magasin rapporte 19 000 € par
    an sur un actif de 1,9 M€ — un rendement de 1 %. C''est le vrai sujet Nîmes, et ce n''est pas un sujet
    de fermeture (§6).


    **Vitry** est le seul cas discutable : sortie gratuite et un magasin à 14 km, distance à laquelle
    une partie de la clientèle se reporte réellement. Mais c''est aussi le magasin dont les chiffres sont
    les plus faussés : **18 % de ses entrées sont des retraits de commandes web, dont le chiffre d''affaires
    est enregistré sur l''entité e-commerce.** Vitry supporte le personnel et la surface de ce service
    et n''en encaisse rien. Son gain réel est supérieur aux 63 000 € affichés, et sa fermeture transférerait
    ce coût sur le magasin voisin ou sur des frais de port.


    ---


    ## 4. Pourquoi une fermeture ne peut pas produire 300 000 € l''an prochain


    Même en supposant qu''une fermeture soit structurellement justifiée, elle ne tiendrait pas le calendrier
    de l''actionnaire. Une fermeture de magasin déclenche une procédure sociale de plusieurs mois, des
    indemnités de licenciement, un déstockage à prix cassés, et des frais de remise en état. **Tous ces
    coûts tombent l''année 1 ; les économies éventuelles ne viennent qu''après.** Aucun de ces coûts ne
    figure dans les chiffres qui vous ont été remis — nous ne les avons pas encore chiffrés, et c''est
    un manque à combler avant tout arbitrage.


    Le levier « fermeture » est donc négatif l''an prochain quelle que soit l''hypothèse retenue.


    ---


    ## 5. Où sont réellement les 300 000 €


    Les frais de siège et de logistique représentent **6,4 M€**. L''objectif de l''actionnaire en représente
    **4,7 %**. C''est le seul poste du dossier dont l''ordre de grandeur correspond à la question posée,
    et le seul qui ne détruit ni chiffre d''affaires ni zone de chalandise.


    Nous proposons de traiter ce poste comme le vrai sujet du comité : une revue ligne à ligne, avec un
    responsable nommé par bloc de dépense et une cible chiffrée par bloc.


    ---


    ## 6. L''argument contraire — et notre réponse


    **L''argument le plus fort contre notre recommandation** est le suivant : à moyen terme, les frais
    de siège ne sont pas fixes. Un réseau de 16 magasins peut fonctionner avec un siège plus léger qu''un
    réseau de 19. Et Nîmes immobilise 1,9 M€ pour un rendement de 1 % — ce capital serait mieux employé
    ailleurs. Ces deux points sont justes.


    Notre réponse : ils ne conduisent pas à fermer.

    - Si le siège peut maigrir, **faisons-le maigrir directement** — sans attendre de fermer trois magasins
    qui rapportent 114 000 € pour s''y autoriser.

    - Si les 1,9 M€ de Nîmes doivent être libérés, **vendons les murs sans fermer le magasin**. Attention
    toutefois : après une vente avec relocation, nous paierions un loyer de l''ordre de 100 à 130 000
    € par an, ce qui rendrait Nîmes réellement déficitaire. C''est un arbitrage capital contre résultat,
    à poser explicitement à l''actionnaire. Il mérite d''être posé : **veut-il 300 000 € de résultat,
    ou un retour sur le capital immobilisé ?** Les deux réponses n''appellent pas les mêmes décisions,
    et la seconde ne coûte aucun emploi.


    ---


    ## 7. Ce que nous engageons d''ici trente jours


    1. **Cette semaine** — vérification juridique de la date limite de congé du bail de Vitry. Si le délai
    est de six mois, le comité doit trancher avant mi-septembre.

    2. **J+15** — compte de résultat par magasin republié en deux colonnes : gain réel du magasin, puis
    quote-part de siège affichée à part. Fin de la confusion entre les deux.

    3. **J+15** — chiffrage du coût social et opérationnel d''une fermeture type, seul chiffre manquant
    pour arbitrer.

    4. **J+30** — reconstitution de l''épisode de Nîmes de mars 2024. C''est notre seule observation réelle
    de ce qui se passe quand un magasin disparaît. Trois sources : totaux mensuels du magasin à 23 km,
    chiffre d''affaires e-commerce par code postal, et achats des porteurs de carte de la zone dans les
    autres magasins. **Deux limites à énoncer d''avance** : les cinq semaines chevauchent des frontières
    de mois alors que nous n''avons conservé que des totaux mensuels ; et une fermeture temporaire annoncée
    comme telle fait patienter les clients au lieu de les déplacer — elle mesure donc le **plancher**
    du report, pas son niveau.

    5. **J+30** — plan de réduction des 6,4 M€ avec responsable et cible par bloc.


    **Sur les données dont on nous dit qu''elles sont solides** : les compteurs d''entrée (±2 %, au pas
    de la demi-heure sur 24 mois) comptent des entrées, pas des acheteurs. Leur précision ne compense
    pas cela. Ils sont excellents pour dimensionner les plannings, inutilisables pour estimer un chiffre
    d''affaires perdu. De même, les 41 % de porteurs multi-magasins ne portent que sur 23 % des tickets,
    et les porteurs de carte sont par nature plus fidèles : c''est un indice réel de flux entre magasins,
    pas une mesure généralisable.


    ---


    ## 8. À quelle condition nous rouvrons le dossier


    Cette note ne clôt pas la question des fermetures, elle la disqualifie **pour mardi et pour l''objectif
    de l''an prochain**.


    Nous proposons deux conditions de réouverture, observables :

    - **Si au 30 septembre** le plan siège n''a pas identifié 300 000 € avec des responsables nommés,
    le dossier fermeture revient au comité — avec, cette fois, les coûts sociaux chiffrés.

    - **Si l''un des trois magasins passe en gain réel négatif** sur deux trimestres consécutifs, il devient
    un vrai candidat, indépendamment de sa quote-part de siège.


    Enfin, un point de méthode que nous devons au comité : l''enseigne n''a jamais fermé de magasin. Une
    première fermeture est irréversible et coûte plus cher que ne le prévoit toute organisation qui n''en
    a jamais fait. Cette raison ne suffirait pas à s''y opposer si les chiffres la justifiaient — ils
    ne la justifient pas.

    '
