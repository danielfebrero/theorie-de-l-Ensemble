response:
  text: '# Note au comité de direction — Laboratoire Verlaine

    **Objet : plan d''économies du DAF — arbitrage sur le volet B**

    **Date : lundi / Diffusion : membres du comité**


    ---


    ## 1. Synthèse


    Le plan du DAF est bon sur onze de ses douze mesures. La douzième — la réduction de la supervision
    de Salomé Vidal à 55 h/mois dès M1 — déclenche la perte de l''accréditation ISO 17025 à M15. La variante
    à 70 h/mois la déclenche également.


    Ce n''est pas une appréciation de risque. C''est une conséquence arithmétique du référentiel, vérifiable
    ligne à ligne ci-dessous, et je demande au comité de la vérifier plutôt que de me croire.


    **Je propose : appliquer le volet A intégralement, appliquer trois des quatre mesures du volet B,
    et maintenir la supervision de Vidal à 100 h/mois minimum jusqu''à la clôture de son dossier (M6).**
    Le retour de Ferrand en production est décalé, pas annulé.


    ---


    ## 2. Le calcul


    Le référentiel impose **trois signataires agréés en poste**. Effectif : Ferrand (sort fin M8), Marchand
    (sort fin M14), Bouchard, Nseka.


    | Échéance | Signataires en poste | Plancher |

    |---|---|---|

    | M1 → M8 | Ferrand, Marchand, Bouchard, Nseka = **4** | ✅ |

    | M9 → M14 | Marchand, Bouchard, Nseka = **3** | ✅ (au plancher) |

    | **À partir de M15** | Bouchard, Nseka = **2** | ❌ |


    **Tout repose donc sur l''agrément de Vidal avant fin M14.** Trois clauses du référentiel gouvernent
    cette date :


    1. 24 mois de pratique à ≥ 100 h/mois **sous un même signataire** ;

    2. un mois à moins de 100 h compte **au prorata** ;

    3. **tout changement de superviseur ramène l''exigence à douze mois sous le nouveau** ;

    4. agrément prononcé **huit semaines après la dernière heure**.


    Vidal a 18 mois acquis sous Ferrand ; il lui reste 6 mois. **Ferrand part fin M8.** Elle dispose donc
    de huit mois calendaires pour acquérir six mois de crédit sous lui.


    **Scénario actuel (120 h/mois maintenu) :** crédit plein, dossier clos fin M6, agrément prononcé fin
    M8. Quatre signataires à partir de M9, trois après le départ de Marchand. Le plancher n''est jamais
    franchi.


    **Scénario du DAF (55 h/mois dès M1) :** crédit de 0,55 mois par mois. Fin M8, Vidal a **4,40 mois**
    sur les 6 requis. Ferrand est parti. Elle passe sous un nouveau superviseur : **l''exigence repart
    à douze mois**. Agrément au plus tôt vers M23 — et vers M32 si le rythme de 55 h est maintenu. **Fin
    M14, deux signataires. Suspension sous 30 jours, soit M15.**


    **Variante à 70 h/mois :** fin M8, Vidal a **5,60 mois**. Il lui manque 0,40. Même bascule, même date
    de suspension. La variante ne corrige rien : elle échoue de deux semaines de pratique.


    **Le seuil est à 75 h/mois** (6 ÷ 8 mois). À 75 h, le dossier se clôt exactement le dernier jour de
    présence de Ferrand, sans un jour de marge — une absence, un congé, un départ négocié plus tôt et
    le dossier bascule. C''est pourquoi je recommande 100 h et non le seuil.


    ---


    ## 3. Ce que coûte la bascule


    Suspension à M15 → 87 % du chiffre d''affaires ne peut plus être facturé. Le retour passe par une
    accréditation initiale : **14 à 20 mois, 340 k€, et dossier recevable seulement si trois signataires
    agréés sont en poste.** Or nous en aurions deux, et le troisième demanderait au minimum douze mois
    de pratique plus huit semaines.


    Le dossier de retour est donc **irrecevable au moment où nous en aurions besoin**. Ce n''est pas une
    perte de 340 k€ et de 18 mois : c''est une sortie sans porte de retour identifiée. Trente et un salariés,
    le portefeuille clients et les créanciers l''encaissent.


    ---


    ## 4. Ce que j''écarte dans la note du DAF, et pourquoi


    **« Aucune mesure irréversible, chacune rétablie en trente jours. »** La réversibilité d''une décision
    n''est pas la réversibilité de ses effets. Rétablir la supervision au trentième jour ne restitue pas
    les 0,45 mois de pratique non acquis, et le calendrier de Ferrand ne se rejoue pas. La seule mesure
    du plan dont l''effet court sur un compteur à échéance fixe est précisément celle que j''écarte.


    **« Trois signataires restent en poste jusqu''à M14 et Vidal sera agréée d''ici là. »** Les deux propositions
    sont exactes prises séparément. La seconde cesse de l''être dès lors que la première mesure du volet
    B modifie les heures qui la produisent. La note traite l''agrément de Vidal comme une donnée d''entrée
    alors qu''il est une sortie du plan.


    **Sept laboratoires sur neuf.** La question utile n''est pas combien ont réussi, mais combien avaient
    un superviseur unique quittant l''entreprise à l''intérieur de la fenêtre de formation de leur unique
    candidat signataire. Si le cabinet ne peut pas répondre à cette question, la comparaison ne porte
    pas sur notre situation. Les deux échecs pèsent ici plus lourd que les sept réussites, parce que nous
    n''avons ni découvert bancaire ni second métier : 87 % de concentration, c''est une branche de perte
    irrécupérable, pas de la variance.


    **Cinq cosignatures sur sept.** Une cosignature atteste d''un accord, pas d''une vérification. Je
    demande que le calcul du §2 soit refait au tableau lundi, en séance, avant tout vote.


    ---


    ## 5. Les contrats-cadres


    41 k€/mois à partir de M9 excède notre déficit courant. C''est la seule sortie structurelle du déficit
    présentée dans ce dossier, et elle mérite d''être défendue — mais pas à la date proposée.


    Ils exigent **deux signataires dédiés en plus de l''activité courante**. À M9 nous en aurons quatre
    au total ; à M15, trois, c''est-à-dire le plancher réglementaire lui-même. Dédier deux signataires
    à une activité nouvelle en étant au plancher revient à faire dépendre l''accréditation d''un arrêt
    maladie.


    Par ailleurs, **le gel du poste de second apprenti signataire (volet B) ferme la seule filière qui
    permettrait de les servir** : un apprenti démarré à M1 est agréé vers M26 ; démarré à M7, vers M32.
    Ce gel économise quelques milliers d''euros par mois et ferme un accès à 492 k€/an.


    Je propose de répondre au client : engagement de principe, **date de démarrage à arbitrer à M9** une
    fois l''agrément de Vidal prononcé, avec un premier contrat à un signataire dédié plutôt que deux.
    Ne pas laisser cette offre s''éteindre par silence.


    ---


    ## 6. Ce sur quoi j''engage le laboratoire


    **Décision 1 — Volet A : adopté intégralement, 24 k€/mois, effet M1.** Arrêt des salons, report ERP,
    sous-location, fin de l''intérim. Le rallongement de 9 à 14 jours coûte historiquement 4 % du chiffre
    non accrédité, soit environ 0,5 % du chiffre total. Réversible, proportionné, sans effet sur un compteur
    d''agrément.


    **Décision 2 — Volet B : trois mesures sur quatre adoptées, effet M1.** Non-remplacement du technicien,
    internalisation de la maintenance métrologie, retour de Ferrand en production **à partir de M7**,
    une fois le dossier Vidal clos.


    **Décision 3 — Supervision de Vidal maintenue à 100 h/mois minimum de M1 à M6.** Non négociable en
    l''état des informations disponibles. Dossier clos fin M6, agrément prononcé fin M8.


    **Décision 4 — Gel du poste d''apprenti suspendu 60 jours**, le temps de la réponse de l''organisme
    au §7. Si un signataire agréé ailleurs peut être recruté et compté immédiatement, le gel est confirmé
    et le recrutement remplace l''apprentissage. Sinon le poste est ouvert : c''est notre seule redondance
    après M14 et la seule filière vers les contrats-cadres.


    **Coût de l''écart au plan.** Le volet B n''est pas ventilé mesure par mesure — je demande cette ventilation
    au DAF pour lundi. Borne haute absurde (la ligne Ferrand représenterait la totalité des 26 k€) : déficit
    à 37 k€/mois pendant six mois, soit **558 k€ de trésorerie fin M6**, puis 11 k€/mois. Hypothèse réaliste
    : environ 670 k€ fin M6. Dans les deux cas la trésorerie tient et la banque n''est pas sollicitée.
    Le plan du DAF, lui, porte la trésorerie à 71 mois de couverture pour un laboratoire qui n''a plus
    le droit d''émettre de rapports à partir de M15.


    **Pire cas de ma proposition, et qui l''encaisse :** environ 150 k€ de trésorerie consommée en plus
    sur six mois, dans l''hypothèse haute. Le laboratoire l''encaisse sur ses fonds propres, sans concours
    bancaire. Récupérable.


    **Repli et déclencheur observable :** indicateur mensuel présenté à chaque comité — nombre de signataires
    agréés en poste, heures de supervision réellement effectuées par Vidal dans le mois, date d''agrément
    projetée. **Déclencheur : si à une fin de mois quelconque le nombre projeté de signataires en poste
    à M15 tombe sous trois**, ou si la date de départ de Ferrand avance, ou si Vidal cumule plus de 20
    h d''absence sur un mois — comité extraordinaire sous 5 jours, aucune mesure d''économie supplémentaire
    d''ici là.


    **L''observation qui renverserait cette note :** une réponse écrite de l''organisme d''accréditation
    établissant que la pratique acquise sous un superviseur **survit à son départ** sans remise à douze
    mois. Dans ce cas le volet B s''applique intégralement, y compris les 55 h/mois — Vidal serait alors
    agréée vers M13, avant le départ de Marchand — et je retire la décision 3. Mon interprétation est
    la lecture prudente de la clause ; elle n''est pas la seule possible, et elle se tranche par écrit
    en quelques jours plutôt que par un vote lundi.


    **Première action, cette semaine, avant le comité si possible :**

    1. Trois questions écrites à l''organisme d''accréditation : (a) le départ du superviseur emporte-t-il
    la remise à douze mois ? (b) un signataire agréé dans un autre laboratoire accrédité est-il comptabilisé
    immédiatement chez nous ? (c) confirmation de la règle de prorata et de l''absence de report des heures
    au-delà de 100 h/mois. **Absence de réponse à 45 jours = réponse défavorable.**

    2. Sécuriser par écrit auprès de Ferrand sa présence et sa supervision à ≥ 100 h/mois jusqu''à fin
    M6, contre prime de fin de mission si nécessaire. Toute la construction repose sur cette date : elle
    doit cesser d''être une intention.

    3. Ouvrir avec Marchand la question d''un report ou d''un temps partiel de trois à six mois au-delà
    de M14.

    4. Demander au DAF la ventilation des 26 k€ du volet B.


    ---


    ## 7. Le meilleur argument contre cette note


    Il est le suivant, et le comité doit l''entendre avant de voter : *« Vous retenez la lecture la plus
    punitive d''une clause ambiguë. "Changement de superviseur" vise probablement une réaffectation volontaire
    en cours de formation, pas le départ d''un salarié. Sept laboratoires sur neuf ont fait ce plan. Si
    vous vous trompez, vous brûlez 150 k€ et six mois d''économies pour rien, avec une banque qui a déjà
    dit non. »*


    Il tient sur la lecture de la clause. Il ne tient pas sur la décision, pour deux raisons.


    L''asymétrie d''abord : si je me trompe, nous perdons de la trésorerie récupérable et il en reste
    558 k€ au pire. Si le DAF se trompe, le laboratoire ferme sans porte de retour. On ne joue pas ces
    deux paris avec la même exigence de preuve.


    La bonne réponse ensuite : nous n''avons pas à parier sur la lecture. La décision 3 n''est pas un
    engagement de six mois, c''est une **option de soixante jours**. Si l''organisme répond que la pratique
    survit au départ du superviseur, nous basculons à 55 h/mois dès M3 — Vidal est alors agréée vers M13
    — et l''écart au plan du DAF se réduit à deux mois d''une seule ligne budgétaire. Nous ne perdons
    presque rien à avoir eu tort. Nous perdons tout à ne pas avoir demandé.


    ---


    *Note préparée pour le comité du lundi. Le calcul du §2 est reproductible à partir du seul référentiel
    d''accréditation et de la note du DAF : je demande qu''il soit refait en séance.*


    ---


    Deux points que je signale hors note, pour vous : la ventilation des 26 k€ du volet B est le seul
    chiffre qui me manque pour clore le coût de la proposition, et les questions à l''organisme conditionnent
    aussi bien la décision 4 que la réponse au client. Si vous voulez, je peux rédiger le courrier à l''organisme
    et la réponse au client, ou publier cette note en page partageable pour la diffusion au comité.

    '
