response:
  text: '# Recommandation — diapositive « activation » du comité de mardi


    **En une phrase :** le 47 % et le 41 % sont tous deux inutilisables, non parce qu''ils sont imprécis
    mais parce que le dénominateur du bras v2 n''existe nulle part ; la diapositive doit porter les métriques
    qui tiennent (tickets, rétention) et annoncer une ré-analyse datée de l''activation — pas une réserve
    en notes de l''orateur.


    ---


    ## 1. Le vrai défaut n''est pas un artefact d''horodatage


    Il faut séparer les deux constats, parce qu''ils n''ont pas le même statut.


    **Le défaut structurel :** la ligne d''affectation v2 est écrite à l''étape 3, le témoin à l''inscription.
    Les deux bras ne sont donc pas deux échantillons du même univers. Le bras témoin = tous les inscrits.
    Le bras v2 = les inscrits **qui ont déjà survécu à une partie du parcours**. On compare un taux d''activation
    calculé sur des survivants à un taux calculé sur une population complète. Ce n''est pas un biais de
    mesure qu''on corrige, c''est une comparaison qui n''a pas de sens sous cette forme.


    **Le symptôme :** les 4 812 lignes inversées (42,6 % du bras v2 contre 0,9 % du témoin). Même serveur,
    même service d''ingestion, horloge unique NTP, aucun incident. Il n''y a pas d''explication technique
    disponible — et il n''en faut pas : c''est la conséquence mécanique attendue du point précédent. Le
    compte agit avant d''atteindre l''étape 3, donc `first_action_at` précède `bucket_assigned_at`. Les
    4 812 lignes ne sont pas un bug à côté du problème, elles en sont la signature. Les 0,9 % du témoin
    sont le bruit résiduel normal.


    Conséquence directe : **le nombre de comptes exposés à v2 ayant abandonné avant l''étape 3 n''est
    écrit nulle part.** Le numérateur est connu, le dénominateur est manquant et non reconstructible depuis
    ces journaux. Aucun retraitement de ces journaux ne produira un chiffre défendable.


    ## 2. Le 41 % est plus faux que le 47 %, pas plus prudent


    Retirer les 4 812 lignes ne nettoie rien : cela restreint encore l''échantillon, sur un critère corrélé
    au résultat mesuré.


    Vérification arithmétique (en supposant 47 % sur 11 300 et 41 % sur les 6 488 restants) :


    - activés totaux : 0,47 × 11 300 ≈ **5 311**

    - activés dans le sous-ensemble conservé : 0,41 × 6 488 ≈ **2 660**

    - activés parmi les 4 812 supprimés : 5 311 − 2 660 ≈ **2 651**, soit **55 % d''activation**


    Le collègue a donc supprimé le sous-groupe **le plus** activé. La suppression est informative sur
    l''issue : c''est exactement le cas où l''exclusion est interdite. Le 41 % ne borne rien, ne majore
    rien, ne minore rien. Devant un comité d''investissement, il est plus dangereux que le 47 % parce
    qu''il porte l''étiquette « retraité » et donne l''apparence d''une correction faite.


    ## 3. Le signe de l''effet est inconnu — ordre de grandeur


    Notons *N* le nombre réel de comptes exposés à v2. Le taux d''activation vrai est 5 311 / *N*.


    | Survie à l''étape 3 | *N* implicite | Activation v2 réelle |

    |---|---|---|

    | 100 % | 11 300 | 47,0 % |

    | 80 % | 14 125 | 37,6 % |

    | **66 %** | **17 132** | **31,0 % — égalité avec le témoin** |

    | 60 % | 18 833 | 28,2 % |

    | 50 % | 22 600 | 23,5 % |


    **Si moins de ~66 % des comptes exposés à v2 atteignent l''étape 3, v2 est moins bon que le témoin.**
    Sur une étape 3 d''onboarding, un taux de survie sous 66 % est banal. On ne sait donc pas seulement
    de combien v2 gagne : on ne sait pas s''il gagne.


    Signal corroborant : le bras v2 (11 300 survivants de l''étape 3) est **plus grand** que le bras témoin
    (10 940 inscrits). Si la répartition visait 50/50, cela impliquerait une survie à l''étape 3 proche
    de 100 %, ce qui n''est pas crédible. Soit la répartition était très déséquilibrée, soit *N* dépasse
    largement 11 300 — les deux méritent d''être vérifiés avant mardi, et l''un comme l''autre invalide
    la lecture actuelle.


    ## 4. Ce qu''on lance aujourd''hui — la seule chance de récupérer un chiffre


    Le dénominateur est peut-être récupérable **hors** des journaux d''affectation :


    1. **Table d''inscriptions** sur 3 mars – 14 avril, indépendante des lignes de bucket. Total inscrits
    − 10 940 (témoin) = comptes exposés à v2, si toute l''inscription était répartie entre les deux bras.

    2. **Journaux du service de feature-flag / routeur** : le point de décision qui a servi v2 précède
    l''étape 3 et laisse en général sa propre trace.

    3. **Événements d''étape 1 / première vue du nouveau parcours**, qui existent avant l''écriture du
    bucket.


    Si l''un des trois donne *N*, on a un chiffre défendable avant mardi. Fenêtre : 48 h, propriétaire
    nommé, résultat quel qu''il soit. Si aucun ne donne *N*, la mesure est perdue et l''expérience doit
    être relancée avec affectation écrite au moment de la randomisation — 4 à 6 semaines, et c''est un
    rattrapage post-closing, pas un préalable.


    ## 5. Contenu exact de la diapositive


    Remplacer la diapositive « activation » par :


    > **Onboarding v2 — résultats mesurés**

    > - Tickets de support : **−22 %** sur la période (file Zendesk, mesure indépendante du test) — comparaison
    avant/après sur l''ensemble de la file, non ventilée par bras

    > - Rétention à 90 jours : **stable**

    > - Activation à 30 jours : **mesure en cours de reconstruction.** L''instrumentation du test enregistrait
    l''affectation v2 en cours de parcours et non à l''inscription ; les deux bras ne sont pas comparables
    en l''état. Chiffre communiqué le **[date, ≤ 6 semaines]**.


    Aucun chiffre d''activation. Ni 47, ni 41, ni fourchette. Une fourchette dont la borne basse passe
    sous le témoin n''est pas une fourchette, c''est un aveu déguisé en donnée.


    Note sur les −22 % : c''est une mesure avant/après sur toute la file, pas un contraste expérimental
    entre bras. Elle est réelle et indépendante, mais elle n''établit pas la causalité. On l''écrit ainsi
    sur la diapositive. Sinon on reproduit sur la métrique de repli exactement l''erreur qu''on est en
    train de corriger — et c''est la première chose qu''un investisseur attentif testera.


    ## 6. Ce qu''on dit au comité


    Trente secondes, porté par le CEO ou la DAF, pas par l''analyste, et **avant** la section produit
    :


    > « En préparant l''annexe, nous avons trouvé un défaut d''instrumentation dans le test d''onboarding.
    L''affectation au bras v2 était écrite en cours de parcours et non à l''inscription : les comptes
    exposés qui abandonnent tôt n''apparaissent dans aucun bras. Le chiffre de 47 % que vous avez vu en
    amont porte sur un sous-ensemble de survivants ; nous ne pouvons pas le défendre, et nous ne pouvons
    pas non plus affirmer le sens de l''effet. Nous le retirons. Nous reconstruisons la mesure et nous
    revenons avec un chiffre au [date]. Le reste du dossier — baisse des tickets, rétention 90 jours —
    est inchangé et mesuré indépendamment. »


    Puis on répond aux questions avec le tableau du §3. Le fait de l''avoir trouvé soi-même, huit jours
    avant, et de l''avoir dit sans qu''on le demande, est un signal de qualité d''équipe. Ce signal a
    une valeur réelle en négociation ; il s''annule intégralement si l''information sort autrement.


    Avant mardi : information de la DAF et du CEO aujourd''hui, et revue par le conseil juridique de la
    formulation retenue, puisque le term sheet référence explicitement la courbe. Ce n''est pas un arbitrage
    d''analyste.


    ## 7. Le meilleur argument contre cette recommandation


    Il est sérieux, et il faut le poser franchement : *le biais pourrait jouer en faveur de v2 ; le produit
    est probablement réellement meilleur — la baisse de 22 % des tickets va dans ce sens ; et retirer
    le chiffre phare à neuf jours du closing rouvre la valorisation pour ce qui n''est peut-être qu''un
    défaut d''instrumentation réparable en quelques semaines. Une réserve en notes de l''orateur préserve
    l''option de corriger sans casser le tour.*


    Ce qui le fait tomber :


    - **Il n''est pas vérifiable.** Il postule une survie à l''étape 3 supérieure à 66 % sans aucune donnée.
    Si on avait cette donnée, on aurait le dénominateur, et le débat n''existerait pas.

    - **Asymétrie de ruine.** Retrait maintenant : la valorisation se rediscute, c''est chiffrable et
    réversible, et la baisse des tickets reste au dossier. Découverte après closing d''un chiffre qu''on
    savait indéfendable et référencé au term sheet : ce n''est plus une renégociation, c''est un défaut
    sur les déclarations et garanties, avec un risque pour l''entreprise et personnellement pour les signataires.
    Le coût du premier est borné ; celui du second ne l''est pas.

    - **La réserve en notes de l''orateur ne protège personne.** Elle laisse le 47 % dans le document
    que le comité lit, imprime et cite. Ce n''est pas une divulgation, c''est une trace de connaissance
    du défaut — la pire combinaison possible.

    - **Le format des journaux d''ingestion est trivialement auditable en due diligence.** Le ratio 42,6
    % contre 0,9 % de lignes inversées est visible en une requête. Cette information sortira ; la seule
    variable est de savoir qui la présente.


    Condition d''arrêt de cette recommandation, à surveiller jusqu''à lundi soir : si l''une des trois
    sources du §4 produit un *N* propre et que l''activation v2 recalculée sur ce *N* dépasse nettement
    31 %, alors on remet un chiffre sur la diapositive — le vrai, avec sa méthode et son dénominateur
    en note visible. C''est le seul scénario où le chiffre revient.


    ---


    Le catalogue de stations de mesure joint ne comporte aucun élément se rapportant à cette question
    ; je ne l''ai pas utilisé.

    '
