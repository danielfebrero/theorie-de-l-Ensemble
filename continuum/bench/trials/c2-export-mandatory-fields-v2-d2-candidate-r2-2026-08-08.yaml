  text: 'Voici la note. Elle est écrite pour être **appliquée sans arbitrage** : un comité divisé ne peut
    pas exécuter une opinion, seulement une règle. Tout y est donc formulé en conditions vérifiables,
    avec un seuil de signature mécanique.


    ---


    # NOTE DE DIRECTION — MANDAT D''EXÉCUTION EN L''ABSENCE DU DIRECTEUR GÉNÉRAL


    **Objet :** Offre d''exclusivité du distributeur D — décision et conduite à tenir du 8 au 20 août

    **De :** Direction générale

    **Pour exécution par :** Comité de direction (DAF, Directeur commercial, Directeur industriel)

    **Date :** 8 août 2026

    **Statut :** Décision arrêtée. Non discutable en mon absence. Accusé de réception écrit de chaque
    destinataire exigé sous 24 h.


    ---


    ## 1. Décision


    **Nous ne signons pas le contrat d''exclusivité de trois ans proposé par D.**


    Nous ne refusons pas D pour autant. Nous répondons dans le délai imparti par une **contre-proposition
    écrite**, dont les conditions d''acceptation sont fixées au § 4. Si D accepte l''intégralité de ces
    conditions par écrit avant le 16 août, le comité signe. Si une seule manque, le comité ne signe pas.
    Il n''y a pas de troisième cas et personne n''a à trancher.


    ## 2. Pourquoi ce contrat est refusé : il est déficitaire à ses propres termes


    Le débat au comité porte sur le risque commercial. Ce n''est pas le sujet. Le contrat est **arithmétiquement
    destructeur de marge, même si D honore intégralement son engagement de volume.**


    Sur la base d''une marge brute de 31 % (hypothèse : le mix D est au niveau de la moyenne entreprise
    — **à vérifier sous 48 h**, cf. § 6) :


    | | CA | Marge brute | Écart annuel |

    |---|---|---|---|

    | Situation actuelle | 14,9 M€ | **4,62 M€** | référence |

    | Année 1, +18 % de volume tenu, −9 % de prix | 16,00 M€ | **3,87 M€** | **−0,75 M€** |

    | Années 2-3, volume revenu au niveau actuel | 13,56 M€ | **3,28 M€** | **−1,34 M€ / an** |


    Le chiffre qui clôt la discussion : à −9 % de prix de cession, **il faut +41 % de volume pour seulement
    retrouver la marge d''aujourd''hui.** D en engage 18, et uniquement la première année. Le contrat
    demande donc moins de la moitié du volume nécessaire à sa propre neutralité. Il n''y a aucun scénario,
    même favorable, où il crée de la valeur.


    Cumul sur trois ans dans l''hypothèse centrale : **−3,4 M€ de marge**, soit 163 % de notre trésorerie
    disponible. La pénalité de sortie de 1,2 M€ représente 57 % de cette même trésorerie : au moment où
    le contrat deviendrait insupportable, nous n''aurions plus les moyens d''en sortir. **C''est la branche
    irrécupérable, et c''est elle qui commande la décision.**


    Ajouter que la montée en volume de +18 % consomme du besoin en fonds de roulement — matières et créances
    — *avant* de produire quoi que ce soit. Nous financerions notre propre perte de marge.


    ## 3. Trois faits que le comité doit avoir en tête face à l''acheteur


    **a) L''offre et la menace se contredisent.** D exige +18 % de volume et menace de déréférencer quatre
    références sur huit dans huit jours. Les deux portent sur le même catalogue. Ces deux intentions ne
    peuvent pas être simultanément sincères. Cette contradiction est à poser à l''acheteur, par écrit,
    et sa réponse nous renseignera plus que sa présentation.


    **b) L''engagement est asymétrique.** Nous nous engageons sur 36 mois sous peine de 1,2 M€. D s''engage
    sur 12 mois sans pénalité décrite, et « à titre indicatif » ensuite. Au deuxième trimestre, D a réduit
    ses commandes de 11 % sans préavis : nous avons déjà la démonstration de ce que vaut un engagement
    non pénalisé de leur part. Ce n''est pas un procès d''intention, c''est un antécédent daté.


    **c) Le calendrier est un instrument.** Comité avancé, fenêtre de huit jours, acheteur qui demande
    à venir s''exprimer devant un comité dont il sait la division écrite, pendant l''absence du dirigeant.
    Une offre qui doit être signée avant d''avoir pu être analysée est tarifée sur notre pression, pas
    sur notre valeur. Si ce contrat crée réellement de la valeur pour D, il existera encore le 21 août.


    **Asymétrie décisive :** refuser est réversible — D peut revenir, une référence se re-référence au
    comité suivant, et rien ne nous interdit de contracter avec D en octobre. Signer est irréversible
    trois ans, coûte 1,2 M€ pour en sortir, et **ferme juridiquement les deux seules sorties de notre
    dépendance à 62 %** : la centrale régionale et la marketplace. Sous incertitude, on prend la branche
    réversible.


    ## 4. Contre-proposition : les sept conditions de signature


    Le comité adresse à D, **au plus tard le 12 août** et donc **avant la visite de l''acheteur**, une
    contre-proposition écrite. Le comité est autorisé à signer si et seulement si les sept conditions
    suivantes sont réunies **cumulativement et par écrit** :


    1. **Durée : 18 mois maximum**, au lieu de 36.

    2. **Périmètre d''exclusivité limité** à la distribution alimentaire physique. La marketplace et la
    centrale d''achat régionale sont explicitement exclues du périmètre. À défaut : non-exclusivité avec
    statut de fournisseur préférentiel et droit de première offre.

    3. **Plancher de marge.** La remise est calculée par paliers de sorte que **la marge brute en valeur
    du compte D ne soit jamais inférieure à celle de l''exercice de référence** (4,62 M€ annualisés, à
    ajuster après vérification du § 6). Concrètement : aucune remise en deçà de +18 % de volume, remise
    progressive ensuite, 9 % pleins seulement au-delà de +41 %.

    4. **Engagement de volume ferme et chiffré sur toute la durée**, pas « indicatif ».

    5. **Symétrie de la pénalité.** Si D commande en deçà de l''engagement, D indemnise la marge perdue,
    à hauteur plafonnée au même montant que notre propre pénalité de sortie.

    6. **Maintien contractuel des huit références** pendant toute la durée.

    7. **Préavis de 90 jours** pour toute réduction de commande. Le −11 % de T2 ne doit pas pouvoir se
    répéter.


    **Pénalité de sortie ramenée à 0,4 M€ maximum et réciproque.**


    Toute signature exige la **co-signature du DAF et du Directeur commercial**. Aucune signature isolée
    n''est valable. Aucune modification de ces sept conditions n''est possible en mon absence : elles
    ne sont pas un point de départ de négociation, elles sont le seuil.


    ## 5. Conduite de la réunion avec l''acheteur de D


    La réunion a lieu — refuser de recevoir serait une rupture, et nous n''en faisons pas une. Elle se
    tient dans le cadre suivant, sans exception :


    - **Date fixée par nous**, après l''envoi de notre contre-proposition. L''acheteur vient répondre
    à notre texte, pas exposer le sien à un comité divisé.

    - **Présents : DAF et Directeur commercial ensemble**, plus le Directeur industriel qui rédige le
    compte rendu. Jamais un interlocuteur seul face à l''acheteur, en réunion comme au téléphone.

    - **Objet : écoute.** Aucun engagement verbal, aucun chiffre qui ne figure pas déjà dans notre courrier
    du 12 août, aucune signature, aucun paraphe sur aucun document.

    - **Phrase de clôture, à dire telle quelle :** « Nous avons pris note. Notre position est celle de
    notre courrier du 12 août. Toute évolution doit nous parvenir par écrit avant le 16 août. »

    - **Compte rendu écrit envoyé à D sous 24 h**, reprenant ce qui a été dit. Rien ne doit pouvoir être
    tenu pour acquis implicitement.


    **Point de gouvernance, à notifier à D par écrit dès le 11 août :** *le pouvoir de signature sur ce
    dossier est réservé à la direction générale, qui est en déplacement et rentre après le 20 août.* C''est
    exact, et cela déplace la contrainte de calendrier de notre côté vers le leur. Un comité dont on sait
    qu''il ne peut pas signer cesse d''être une cible.


    ## 6. Travaux à conduire immédiatement — sous 48 h


    **DAF :**

    - Chiffrer le poids exact des quatre références menacées : CA, marge brute, part du plan de charge
    de Redon. **C''est le chiffre qui manque à cette note et il ne change pas la décision, mais il calibre
    tout le reste.**

    - Vérifier le taux de marge réel du compte D, distinct de la moyenne à 31 %.

    - Ouvrir une négociation de ligne de crédit **maintenant**, avant le 20 août — pendant que le bilan
    montre encore D à 62 %. Après un déréférencement, le même dossier se négocie beaucoup moins bien.


    **Directeur commercial :**

    - Lancer la mise en ligne sur la marketplace sans attendre. Nous ne sommes tenus par rien. L''estimation
    « 0,4 à 2,2 M€ » n''est pas une prévision, c''est une absence d''information : un test payant sous
    trois semaines la transforme en chiffre. Priorité de mise en ligne aux quatre références menacées.

    - Rappeler la centrale régionale : demander une décision partielle, un pilote ou une lettre d''intention
    à échéance rapprochée. Cinq mois d''attente n''est pas une donnée, c''est un point de négociation.

    - Établir le CA récupérable hors D, référence par référence (RHF, export, autres enseignes).


    **Directeur industriel :**

    - Projeter le plan de charge de Redon sur septembre-novembre selon deux scénarios : maintien, et perte
    des quatre références.


    ## 7. Ce que nous devons à Redon


    Le pire cas de ma décision, il faut le nommer : si D réduit fortement, le plan de charge de Redon
    passe sous 70 % et **52 personnes en supportent les conséquences**. Ce ne sont pas elles qui gagnent
    quoi que ce soit à la marge que nous protégeons.


    En conséquence :

    - **Le CSE de Redon est informé le 11 août**, avant le comité d''achat de D, pas après. Sur les faits
    : l''offre, notre réponse, le risque sur le plan de charge, et le calendrier. Ils apprennent la situation
    de nous et avant l''événement, pas par le marché.

    - **Le dossier d''activité partielle est préparé dès maintenant**, sans attendre le seuil. Le délai
    administratif se compte en semaines ; le préparer n''engage à rien et ne pas le préparer coûte un
    mois.

    - **Point hebdomadaire avec les représentants du personnel** pendant toute la période, tenu par le
    Directeur industriel.

    - **Les premiers volumes issus de la marketplace et de la centrale sont affectés à Redon en priorité.**
    C''est un engagement, pas une intention.


    ## 8. Déclencheurs et replis — préautorisés, à appliquer sans me consulter


    | Déclencheur observable | Action, automatique |

    |---|---|

    | Plan de charge Redon projeté < 75 % sur 4 semaines consécutives | Dépôt du dossier d''activité partielle
    |

    | Déréférencement des 4 références confirmé le 20 août | Mise en ligne complète marketplace + offre
    pilote à la centrale + ouverture prospection RHF/export |

    | Trésorerie < 1,5 M€ | Tirage de la ligne de crédit **et gel de tout investissement non engagé, y
    compris la part non engagée du chantier Maroc.** Cette décision est prise, elle ne se rediscute pas
    à mon retour. |

    | Commandes D de septembre < budget −25 % | Notification écrite à D d''un manquement à l''esprit de
    la relation + convocation d''une revue contractuelle |


    **Soupape unique.** Si — et seulement si — D confirme **par écrit** son intention de rompre la totalité
    de la relation d''approvisionnement, et non de déréférencer quatre références, le comité peut signer
    un accord de transition : **6 mois maximum, 4 % de remise maximum, sans exclusivité, sans pénalité
    de sortie.** Rien d''autre. Cette soupape ne rouvre en aucun cas le contrat de trois ans.


    ## 9. Ce qui me donnerait tort


    Je le formule pour que le comité le cherche activement plutôt que d''appliquer une consigne à l''aveugle.
    Ma décision est fausse si l''un de ces trois faits est établi :


    1. Les quatre références menacées représentent **plus de 45 % du volume D** et sont techniquement
    non redéployables sur un autre canal — auquel cas la perte de marge à court terme dépasse la perte
    contractuelle à trois ans, et c''est la soupape du § 8 qui s''applique.

    2. Le taux de marge réel du compte D est **significativement supérieur à 31 %** — le calcul du point
    mort à +41 % s''en trouverait déplacé et devrait être refait avant le 16 août.

    3. D accepte les sept conditions du § 4. Dans ce cas, on signe : le contrat aura cessé d''être ce
    qu''il est aujourd''hui.


    En dehors de ces trois cas, **on ne signe pas**.


    ## 10. Sur la division du comité


    Elle est écrite, elle est légitime, et elle n''a pas à être résolue en mon absence. Je la répartis
    plutôt que de l''arbitrer :


    - **Le DAF porte la contre-proposition et la relation avec D.** Il veut préserver ce compte : il est
    donc le mieux placé pour faire aboutir un accord qui le préserve à des conditions tenables.

    - **Le Directeur commercial porte l''accélération des canaux alternatifs.** Marketplace, centrale,
    RHF. C''est là que sa conviction produit de la valeur.

    - **Le Directeur industriel porte le plan de charge, Redon et le compte rendu de la réunion avec D.**


    Chacun a une ligne à tenir, aucun n''a d''arbitrage à rendre. La règle du § 4 tranche à votre place,
    et c''est délibéré : je ne vous laisse pas une décision à prendre sous pression, je vous laisse un
    seuil à vérifier.


    ---


    **Première action, dès demain matin :** accusé de réception écrit des trois destinataires, et notification
    à D — par courrier avec accusé de réception — que la réponse de Verdal leur parviendra par écrit le
    12 août, et que le pouvoir de signature sur ce dossier relève de la direction générale.


    *Direction générale — Verdal*


    ---


    **Deux réserves, en clair :** la note tient sur l''hypothèse que la marge du compte D est proche des
    31 % moyens ; le § 6 en fait la première vérification et le § 9.2 en tire la conséquence si elle tombe.
    Et le poids réel des quatre références menacées n''est pas connu à l''heure où j''écris — c''est le
    seul chiffre manquant qui pourrait déplacer le curseur, d''où la soupape bornée du § 8 plutôt qu''une
    consigne rigide.

    '
