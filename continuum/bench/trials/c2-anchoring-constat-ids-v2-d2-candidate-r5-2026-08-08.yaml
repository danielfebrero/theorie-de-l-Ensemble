response:
  text: '## Avis pour le comité de direction — renouvellement du contrat logiciel de réservation et bornes
    de prêt


    *Chaque appréciation ci‑dessous est rattachée à l''élément du dossier qui la porte, et chaque point
    indique ce qui tombe — et ce qui ne tombe pas — si le comité l''écarte.*


    ---


    ### I. Ce que je retiens du dossier


    **1. Le dossier traite deux problèmes distincts comme s''il n''y en avait qu''un.**

    Repose sur : l''export technique (41 h d''indisponibilité, dont 32 h sur Fontaine et Rive‑Sud, seuls
    sites équipés des bornes de 2015) et l''enquête interne (pertes de réservations).

    Le premier est un problème de matériel vieillissant : 78 % de l''indisponibilité se concentre sur
    les deux sites au parc le plus ancien, soit environ 16 h par site et par an. Le second est un problème
    logiciel. Une migration v4 ne rajeunit aucune borne ; un remplacement de bornes ne répare aucune réservation
    perdue. Les traiter dans une seule décision fait payer chaque problème au prix de l''autre.

    *Si le comité écarte ce point :* le reste de l''avis tient, mais il faut alors dire explicitement
    lequel des deux problèmes le renouvellement est censé résoudre.


    **2. L''imputation à la mise à jour de mars n''est pas établie, et un concurrent sérieux n''a pas
    été écarté.**

    Repose sur : l''enquête (43 réponses sur 62 ; 61 % signalent des pertes, soit environ 26 agents ;
    12 seulement situent le début après mars) et sur la chronologie de février (remplacement du lien fibre
    de Rive‑Sud **et** changement de version du portail usagers).

    L''imputation repose donc sur 12 datations déclaratives sur 62 agents, sans aucune donnée machine,
    alors que deux autres changements techniques précèdent immédiatement la période incriminée. Ce n''est
    pas une réfutation : c''est une causalité non instruite.

    *Si le comité écarte ce point :* il reste que 19 agents n''ont pas répondu et qu''aucun journal applicatif
    n''a été produit — l''imputation resterait non documentée.


    **3. Le dossier contient déjà le test qui trancherait, et il n''a pas été fait.**

    Repose sur : les notes de sites (Rive‑Sud ressaisit à la main depuis mars, ~5 h/semaine ; Fontaine
    ne signale rien) croisées avec l''export technique.

    Fontaine et Rive‑Sud ont le même parc de bornes et le même logiciel. Ce qui les sépare est l''événement
    de février, propre à Rive‑Sud. Une mise à jour éditeur déployée sur tout le réseau devrait produire
    un symptôme sur tout le réseau. La concentration du symptôme sur le site qui a changé de fibre en
    février oriente vers une cause locale, pas vers l''éditeur.

    Réserve explicite : « Fontaine ne signale rien » ne signifie pas « Fontaine ne subit rien ». Tant
    que Fontaine n''a pas été interrogée directement, cette inférence est une hypothèse forte, pas un
    constat.

    *Si le comité écarte ce point :* la recommandation ne change pas, car elle repose d''abord sur le
    point 5, mais l''urgence du diagnostic augmente.


    **4. La chute des réclamations après juin n''est expliquée par aucune pièce.**

    Repose sur : 96 réclamations sur 12 mois, dont 71 entre mars et juin.

    Si un défaut logiciel non corrigé causait des pertes hebdomadaires — ce que l''enquête affirme encore
    aujourd''hui — les réclamations ne devraient pas retomber en juin. Soit quelque chose a été corrigé,
    soit le recueil des réclamations s''est relâché, soit l''effet est saisonnier. Les trois hypothèses
    ont des conséquences opposées sur la décision. Le dossier ne ventile les réclamations ni par site
    ni par objet.


    **5. Le point qui décide de la v4 est ouvert, et il porte précisément sur les deux sites les plus
    dégradés.**

    Repose sur : migration chiffrée à 31 000 € en une fois, compatibilité avec les bornes de 2015 « à
    l''étude » chez l''éditeur.

    Engager 31 000 € pendant que le fournisseur qualifie lui‑même la compatibilité d''« à l''étude »,
    c''est accepter que Fontaine et Rive‑Sud — 78 % de l''indisponibilité — se retrouvent éventuellement
    hors périmètre après paiement. Le coût de ce scénario n''est pas au dossier ; il n''est pas nul, il
    est simplement non chiffré.

    *C''est le point le plus lourd de l''avis.* Si le comité l''écarte, la recommandation ci‑dessous n''est
    plus fondée et doit être reprise.


    **6. La remise est bornée et connue ; ce qu''elle achète ne l''est pas.**

    Repose sur : 48 000 €/an, indexation +7 %, remise 12 % contre trois ans signés avant le 30.

    Sur trois ans indexés, l''engagement s''établit à environ 154 000 € sans remise, environ 136 000 €
    avec — soit de l''ordre de 18 000 € d''écart, sous réserve des termes exacts, que le dossier ne donne
    pas (assiette de la remise, application à l''indexation, à la migration). Cet ordre de grandeur est
    inférieur au coût de la migration qu''il est censé accompagner, et sans commune mesure avec le risque
    du point 5. Par ailleurs, la ressaisie manuelle de Rive‑Sud représente à elle seule environ 220 h
    par an ; à coût agent chargé — hypothèse de ma part, non fournie par le dossier — l''ordre de grandeur
    approche celui de la remise annuelle. Résoudre Rive‑Sud vaut probablement plus que la remise.

    Enfin : le comité siège le 28, la remise expire le 30, le contrat court jusqu''au 31 octobre. L''échéance
    qui contraint la séance est celle du fournisseur, pas celle du service.


    **7. Sur le libre, le facteur décisif n''est pas le coût.**

    Repose sur : réseau voisin passé au libre il y a 14 mois, −30 % annoncés, 2 sites sur 5 encore au
    registre papier ; équipe informatique de deux personnes dont une part en octobre.

    Quatorze mois après bascule, 40 % des sites du voisin n''ont pas convergé. Nous serions à un agent
    informatique pour sept sites et 62 agents au moment même de la bascule. L''écart de coût annoncé ne
    compense pas cette contrainte d''effectif. Le libre n''est pas à écarter sur le fond ; il est à écarter
    **maintenant**, faute de main‑d''œuvre pour le conduire.


    **8. La durée n''est pas au dossier — alors que c''est la variable qui décide.**

    Trois options sont soumises, mais une seule a une durée explicite : les trois ans du commercial. La
    durée la plus courte que l''éditeur accepte, et à quel prix, n''est nulle part. Le comité est donc
    invité à choisir entre des options dont l''engagement temporel n''est pas comparable.


    **9. Sur la note de cadrage.**

    Elle avance trois affirmations enchaînées — mars est la cause, la v4 corrige, il faut signer avant
    le 30 — et ne cite aucune pièce. Aucune des trois n''est absurde ; aucune n''est aujourd''hui documentée.
    Le fait qu''elle ait déjà été lue par deux membres du comité ne lui ajoute rien : une note lue reste
    une hypothèse tant que les pièces manquent. Je propose qu''elle serve de mandat d''instruction plutôt
    que de conclusion, et que son auteur pilote la vérification (point IV).


    ---


    ### II. Recommandation


    **Reconduire à l''identique, sur la durée la plus courte que l''éditeur accepte — 12 mois visés —,
    sans signer les trois ans, sans engager la v4 à ce stade.** La décision v4 / libre est reportée à
    une séance datée, instruite par la mesure.


    **Critère qui l''emporte :** l''irréversibilité de l''engagement rapportée à l''état des preuves.
    Deux des trois options exigent de trancher aujourd''hui une question technique que le fournisseur
    lui‑même n''a pas tranchée (point 5), sur une causalité non instruite (points 2‑3). Le coût de l''attente
    est borné et connu (~18 000 € sur trois ans) ; le coût de l''engagement anticipé ne l''est pas.


    **Ce que cette recommandation n''affirme pas :** ni que la v4 soit inutile, ni que le libre soit hors
    de portée. Elle affirme que ni l''un ni l''autre ne peut être décidé avec le dossier tel qu''il est.


    ---


    ### III. Ce qui renverserait cet avis


    - **Vers la v4 :** les journaux applicatifs montrent des pertes commençant en mars **sur plusieurs
    sites, Fontaine comprise**, et l''éditeur confirme par écrit que la v4 corrige ce défaut **et** reste
    compatible avec les bornes de 2015. Les deux conditions, pas une seule.

    - **Vers le maintien pur et simple :** les journaux montrent des pertes limitées à Rive‑Sud et démarrant
    en février. L''éditeur n''est alors pas le problème, et 31 000 € seraient dépensés à côté.

    - **Vers la signature des trois ans :** l''éditeur refuse par écrit toute durée courte à un prix soutenable
    — voir le repli ci‑dessous.


    ---


    ### IV. Pire cas de l''option recommandée, et qui le porte


    **Pire cas :** l''éditeur refuse toute reconduction courte, la remise de 12 % est perdue, et le comité
    doit trancher en octobre sous contrainte, à un coût supérieur d''environ 18 000 € sur trois ans. Ce
    coût est porté par le budget du réseau, sans effet sur le service aux usagers.


    **Ce qui n''est en aucun cas acceptable :** arriver au 31 octobre sans couverture contractuelle. Sept
    sites sans logiciel de réservation, alors que Rive‑Sud est déjà en ressaisie manuelle, est la seule
    branche réellement irrattrapable de ce dossier. Toutes les actions ci‑dessous sont ordonnées à cette
    contrainte.


    **Repli et déclencheur :** si, à J+10 après la séance, l''éditeur n''a pas donné par écrit ses conditions
    pour une durée courte, je saisis la directrice pour une séance extraordinaire avant le 15 octobre,
    avec deux options seulement : signature de trois ans à la remise alors obtenable, ou mode dégradé
    organisé. Aucune reprise automatique de la présente recommandation dans ce cas.


    ---


    ### V. Ce que j''engage dans les quinze jours


    | # | Action | Livrable attendu | Qui |

    |---|---|---|---|

    | 1 | Courrier à l''éditeur, **envoyé sous 48 h** : (a) durée la plus courte acceptée et son prix
    ; (b) réponse écrite datée sur la compatibilité v4 / bornes 2015 — oui, non, ou conditions et coût
    ; (c) maintien de la remise sur une reconduction courte | Réponse écrite, J+10 | Direction + achats
    |

    | 2 | Extraction des journaux du module : réservations créées / honorées / perdues, **par site et
    par semaine, janvier à ce jour** | Tableau comparatif Fontaine / Rive‑Sud / 5 autres sites, encadrant
    février et mars | Informatique |

    | 3 | Ventilation des 96 réclamations par site, par objet et par mois ; explication de la baisse après
    juin | Note d''une page | Chargé de mission numérique |

    | 4 | Entretien structuré à Fontaine — la question posée, pas l''absence de signalement présumée :
    ressaisie manuelle non déclarée ? contournements ? | Compte rendu | Chargé de mission numérique |

    | 5 | Mesure à Rive‑Sud : nature exacte des 5 h/semaine, poste par poste | Relevé sur deux semaines
    | Responsable de site, Rive‑Sud |

    | 6 | Position écrite de la DRH sur le départ informatique d''octobre : remplacement, calendrier,
    appui externe | Note | Direction |

    | 7 | Contact du réseau voisin : pourquoi 2 sites sur 5 tiennent encore un registre papier | Compte
    rendu d''échange | Chargé de mission numérique |


    **Première action, dès la levée de séance :** le courrier à l''éditeur (ligne 1). C''est la seule
    action dont dépendent à la fois le repli et l''échéance du 31 octobre.


    ---


    ### Sur la conduite de l''instruction


    Trois points de méthode, qui ne coûtent rien au calendrier :


    - **Le chargé de mission numérique pilote les lignes 3, 4 et 7.** Son hypothèse est testable, et c''est
    à lui qu''il revient de la documenter. L''avis ne la contredit pas : il lui donne les moyens d''être
    établie.

    - **Rive‑Sud dispose de la mesure qui tranche** (ligne 5) et porte depuis mars une charge de ~5 h/semaine.
    Je propose que le comité arrête en séance une mesure d''allègement immédiate pour ce site — appui
    ponctuel ou priorisation — sans attendre la décision d''octobre. Le site qui supporte le défaut ne
    doit pas attendre que le défaut soit qualifié.

    - **Fontaine est interrogée, pas déduite.** Son silence est traité comme une question ouverte, ce
    qu''il est.


    Chacun des neuf constats de la partie I peut être écarté par le comité sans emporter les autres. Seul
    le point 5 — compatibilité v4 / bornes de 2015 — est porteur de la recommandation : s''il est écarté,
    l''avis doit être repris.

    '
