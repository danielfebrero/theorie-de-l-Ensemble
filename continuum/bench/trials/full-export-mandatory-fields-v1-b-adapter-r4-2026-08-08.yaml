response:
  text: '# NOTE DE DIRECTION — DOSSIER DISTRIBUTEUR D

    **De :** Direction générale

    **À :** Comité de direction (DAF, Direction commerciale, Direction industrielle, DRH, Direction qualité)

    **Date :** 8 août 2026

    **Objet :** Contrat d''exclusivité D — mandat exécutoire pendant l''absence du DG (9 au 30 août)

    **Statut :** Instruction. Ce document a valeur de décision. Il ne se discute pas, il s''applique.


    ---


    ## 0. Le point le plus important à comprendre avant de lire le reste


    Mon absence court du 9 au 30 août. L''échéance de D est le **16 août**. Le comité d''achat de D, celui
    qui peut déréférencer quatre de nos huit références, se tient **en septembre — après mon retour**.


    Conséquence : **une seule décision irréversible peut être prise pendant mon absence, et c''est la
    signature.** Tout le reste — le déréférencement, l''arbitrage industriel de Redon, la riposte commerciale
    — se joue quand je serai là. Le calendrier que D nous impose est construit pour obtenir une signature
    de trois ans dans la seule fenêtre où l''entreprise ne peut pas arbitrer. Ce n''est pas une coïncidence,
    c''est une technique.


    **Règle générale, valable pour toute situation non prévue par cette note : en cas de doute, d''ambiguïté
    ou de désaccord entre vous, l''option par défaut est de ne rien signer et de ne rien engager.** Ne
    pas signer est réversible ; signer ne l''est pas, ou coûte 1,2 M€. Aucune pression de calendrier,
    aucun appel de D, aucune « dernière offre » ne renverse cette règle.


    ---


    ## 1. Décision : nous ne signons pas le contrat proposé


    Ce n''est pas un refus de contracter avec D. C''est le refus de **ce** contrat. Les raisons sont arithmétiques,
    pas relationnelles.


    **a) La remise de 9 % détruit de la marge même si le volume promis est livré.**

    À 31 % de marge brute, une remise de 9 % sur le prix de cession fait tomber la marge unitaire de 31
    à 22 points, soit **‑29 %**. Pour maintenir la marge brute en euros, il faudrait **+41 % de volume**.
    On nous en propose 18.


    | Scénario (base : 14,9 M€ de CA sur D, 4,62 M€ de marge brute) | Marge brute résultante | Écart annuel
    |

    |---|---|---|

    | Aujourd''hui, sans contrat | 4,62 M€ | — |

    | Contrat signé, +18 % livrés | 3,87 M€ | **‑0,75 M€** |

    | Contrat signé, volume stable (années 2-3) | 3,28 M€ | **‑1,34 M€** |

    | Contrat signé, ‑11 % comme au T2 | 2,92 M€ | **‑1,70 M€** |


    Scénario central sur trois ans : **‑3,4 M€ de marge brute cumulée**, sur une marge annuelle totale
    de 7,44 M€. Nous payons pour vendre plus.


    **b) L''asymétrie est le cœur du problème, pas le prix.**

    Le volume est ferme un an et « indicatif » deux ans. La remise, elle, est ferme trois ans. L''exclusivité
    est ferme trois ans. La pénalité de 1,2 M€ est ferme trois ans. Nous achetons **douze mois de garantie
    au prix de trente-six mois de captivité**. Ce que vaut un volume « indicatif » chez D, nous le savons
    déjà : ‑11 % au deuxième trimestre, sans préavis.


    **c) La pénalité de sortie est calibrée sur notre trésorerie, pas sur notre chiffre d''affaires.**

    1,2 M€ contre 2,1 M€ disponibles : 57 % de notre trésorerie. Une clause de sortie que nous ne pouvons
    pas financer n''est pas une clause de sortie. Signer, c''est supprimer notre propre option de sortie.


    **d) L''exclusivité tue les deux seules issues que nous ayons.**

    Centrale régionale (3,5 M€) et marketplace (0,4 à 2,2 M€, +6 points de marge) représentent ensemble
    jusqu''à 5,7 M€ et le seul chemin pour ramener D sous 50 % du CA. L''exclusivité les interdit pendant
    trois ans. **On nous demande de renoncer au remède en échange d''un délai.**


    **e) Point à clarifier avant toute discussion :** le texte est ambigu sur le sens de l''« engagement
    de volume ». Si c''est **D** qui s''engage à acheter +18 %, l''analyse ci-dessus tient. Si c''est
    **Verdal** qui s''engage à livrer +18 %, le contrat est encore plus défavorable : nous prendrions
    un engagement de capacité industrielle et une pénalité, en payant 9 % pour le privilège. **Exiger
    la clarification par écrit avant tout échange de fond.** Tant qu''elle n''est pas obtenue, il n''y
    a pas d''offre à évaluer.


    ---


    ## 2. Le meilleur argument contre ma décision — et pourquoi il ne l''emporte pas


    Je le formule aussi honnêtement que possible, parce que vous l''entendrez, de la bouche de D et peut-être
    entre vous :


    > *Si D exécute sa menace, quatre références sur huit tombent. La perte peut atteindre 5 à 7 M€ de
    CA en quelques mois. Redon passe sous 70 % de plan de charge, 52 postes basculent en chômage partiel,
    et les alternatives n''arrivent pas avant cinq à douze mois. Face à cela, 0,75 M€ de marge en moins
    la première année est un prix modeste pour douze mois de visibilité. Signons, et servons-nous de ce
    répit pour nous diversifier.*


    C''est l''argument sérieux, et il en existe une version encore plus dure : le chômage partiel abîme
    durablement l''outil et le climat social, ce qui ne se rattrape pas avec un tableur.


    Il ne l''emporte pas, pour une raison unique et décisive : **l''exclusivité nous interdit précisément
    d''utiliser le répit qu''elle prétend nous vendre.** On achète du temps qu''on n''a pas le droit de
    dépenser. Un raisonnement qui conclut « il nous faut douze mois pour construire des alternatives »
    conclut logiquement à un contrat **de douze mois sans exclusivité totale** — c''est-à-dire exactement
    la contre-proposition du §3. Il ne conclut jamais à trente-six mois d''interdiction de se diversifier.


    Et le calendrier tranche : le déréférencement se décide en septembre, quand je serai rentré et que
    nous pourrons arbitrer avec les chiffres réels en main. La signature, elle, se décide le 16 août,
    sans moi. Nous ne réglons pas un risque de septembre par un engagement irréversible d''août.


    ---


    ## 3. Ce qui part avant le 16 août : contre-proposition écrite


    Réponse **dans le délai** — nous ne sommes ni en retard ni en fuite — mais **pas une signature**.
    Le texte de la lettre est en annexe A, prêt à l''envoi. Elle part **au plus tard le 14 août**, signée
    par le mandataire (§9), après relecture par notre conseil.


    Sept points de négociation, dans cet ordre de priorité :


    1. **Durée : 12 mois**, reconductible d''un commun accord. 18 mois recevables.

    2. **Remise indexée sur le volume constaté, en paliers rétroactifs** : 0 % jusqu''à +6 %, 3 % de +6
    à +15 %, 6 % de +15 à +25 %, 9 % au-delà de +25 %. Principe non négociable : *la remise se paie sur
    le volume livré, jamais sur le volume annoncé.*

    3. **Exclusivité limitée par périmètre** : au circuit de distribution de D et aux seules références
    actuellement référencées. Carve-out explicite pour la vente directe / marketplace et pour tout canal
    distinct (RHD, centrale régionale, export).

    4. **Plancher de volume ferme sur toute la durée**, pas « indicatif ». Sans plancher en année 2, il
    n''y a pas de contrepartie à l''exclusivité en année 2.

    5. **Symétrie des pénalités** : toute pénalité à notre charge a son miroir à la charge de D si le
    plancher n''est pas tenu. Un contrat où une seule partie peut partir gratuitement n''est pas un contrat,
    c''est une option qu''on nous fait payer.

    6. **Préavis de déréférencement : 6 mois minimum**, écrit, référence par référence.

    7. **Conditions de paiement inchangées**, aucune compensation croisée, aucune clause d''accès à nos
    données de coûts, aucun droit de préemption sur nos nouveaux clients.


    Demander en parallèle un **accord de statu quo commercial écrit** : poursuite des commandes aux conditions
    actuelles pendant la négociation. Son refus est en soi une information, à me remonter.


    ---


    ## 4. Lignes rouges — non signables, quelles que soient les circonstances


    Aucun membre du comité, aucun mandataire, ne peut engager Verdal sur l''un de ces points en mon absence
    :


    - Exclusivité supérieure à **18 mois**.

    - Exclusivité **tous canaux** ou fermant la marketplace et la centrale régionale.

    - Remise **fixe**, non indexée sur le volume réellement livré.

    - Pénalité de sortie **supérieure à 300 k€** ou **non symétrique**.

    - Absence de **plancher de volume ferme** au-delà de la première année.

    - Toute clause donnant à D un droit de regard sur nos coûts, nos clients ou nos investissements.

    - Tout engagement, même verbal, pris hors du canal du §9.


    ---


    ## 5. Condition unique de bascule


    Je prévois une seule situation où la signature d''un contrat dégradé devient recevable sans moi, parce
    que refuser de l''envisager serait de l''entêtement, pas de la fermeté. **Les quatre conditions doivent
    être réunies simultanément, et vérifiées par écrit :**


    1. La matrice références × volumes × sites (§6, livrable J+3) démontre que le déréférencement des
    quatre références fait passer Redon **sous 70 % de plan de charge dès novembre 2026** ;

    2. **et** la ligne de financement du §7 a été **refusée par les deux banques** ;

    3. **et** D accepte le carve-out marketplace **et** le plancher de volume ferme ;

    4. **et** la durée reste **≤ 24 mois** avec pénalité **≤ 600 k€ symétrique**.


    Dans ce cas seulement, signature possible à l''unanimité des trois mandataires, procès-verbal écrit
    motivé. Si une seule des quatre conditions manque : **on ne signe pas**. Il n''existe aucune autre
    exception, et cette clause ne peut pas être « interprétée largement ».


    ---


    ## 6. Ce qu''il faut savoir avant de discuter (livrables datés)


    Nous négocions actuellement sans connaître notre propre exposition. C''est inacceptable et c''est
    corrigé cette semaine.


    - **J+3 (11 août) — Direction commerciale + contrôle de gestion :** matrice des 8 références × CA
    × marge × volume × site de production, avec identification nominative des 4 références menacées et
    de leur poids réel sur le plan de charge de Redon. Trois scénarios : perte des 4, perte de 2, statu
    quo.

    - **J+5 (13 août) — Direction industrielle :** point de bascule des 70 % à Redon, exprimé en tonnage
    mensuel, et liste ordonnée des leviers avant chômage partiel (résorption de l''intérim, réinternalisation
    de sous-traitance, production de stock pour les canaux alternatifs, lissage des congés, redéploiement
    inter-sites).

    - **J+8 (16 août) — DAF :** prévision de trésorerie hebdomadaire glissante sur 26 semaines, dans les
    trois scénarios ci-dessus.


    Ces trois documents m''attendent à mon retour. Ils conditionnent aussi le §5.


    ---


    ## 7. Trésorerie et financement — priorité absolue


    **C''est l''action la plus urgente de cette note, avant même la négociation.** Notre faiblesse dans
    ce dossier n''est pas commerciale, elle est financière : trois mois de charges fixes ne permettent
    pas de tenir un bras de fer, et D le sait.


    - **DAF, sous 10 jours :** engager la mise en place d''une **ligne de crédit confirmée et/ou d''un
    contrat d''affacturage de 1,5 M€ minimum**, auprès d''au moins deux établissements, en mettant en
    avant nos alternatives commerciales — pas notre dépendance. On lève une ligne quand on n''en a pas
    besoin ; dans deux mois, ce sera trop cher ou impossible.

    - **Plancher de trésorerie : 1,5 M€.** Aucune décision, aucun décaissement, aucun engagement ne peut
    faire passer la trésorerie disponible sous ce seuil pendant mon absence.

    - **Gel de tout capex non déjà engagé**, hors sécurité, réglementaire et maintenance critique, jusqu''à
    mon retour.

    - **Chantier Maroc : décaissements plafonnés au budget déjà voté**, aucun dépassement, aucun engagement
    nouveau. Je gère cela sur place ; ne prenez aucune décision d''extension en mon absence.


    ---


    ## 8. Alternatives — on accélère maintenant, pas après septembre


    Le meilleur argument de négociation n''est pas un argument, c''est un deuxième client.


    - **Centrale régionale (3,5 M€) — Direction commerciale, cette semaine :** demander un rendez-vous
    de haut niveau et proposer un **pilote sur deux références**, décidable sous 8 semaines, découplé
    de la décision globale. Une exclusivité régionale limitée et courte est monnayable pour obtenir une
    réponse anticipée. Objectif : un signal écrit avant fin septembre.

    - **Marketplace — lancement immédiat, budget plafonné à 120 k€ :** démarrer petit et vite, sur des
    références différenciées (grammage ou packaging distincts) afin de ne pas créer de conflit frontal
    avec D pendant la négociation. L''objectif de cette phase n''est pas le chiffre d''affaires, c''est
    de **créer un fait accompli et une donnée réelle** sur la demande, avant toute discussion d''exclusivité.

    - **Prospection élargie :** ouvrir sous 30 jours au moins trois pistes parmi second distributeur national,
    RHD, MDD industrielle, export Maghreb.

    - **Cap fixé :** D sous **45 % du CA à 12 mois**, sous **40 % à 24 mois**. Cet objectif entre dans
    les objectifs de la direction commerciale à compter de septembre.


    ---


    ## 9. Volet juridique — à préparer, à ne pas brandir


    Notre position de droit est meilleure que ne le suggère le rapport de force commercial. Deux points,
    à instruire **discrètement** :


    - **Rupture brutale de relations commerciales établies** (art. L. 442-1, II du code de commerce).
    Une relation ancienne représentant 62 % de notre chiffre d''affaires appelle un préavis substantiel.
    La baisse de 11 % sans préavis au T2 est un précédent à documenter.

    - **Déséquilibre significatif** (art. L. 442-1, I, 2°) : pénalité unilatérale de 1,2 M€ sans miroir,
    volume ferme d''un seul côté.


    **Instructions :** notre conseil constitue dès cette semaine le dossier de preuve — historique des
    commandes sur cinq ans, échanges écrits, chronologie du T2, courriers du dossier en cours. Toute communication
    avec D passe désormais par écrit, factuelle et horodatée.


    **Interdiction formelle d''évoquer ces fondements auprès de D en mon absence**, sous quelque forme
    que ce soit, y compris allusive. C''est une assurance, pas une arme. Sortie au mauvais moment, elle
    transforme un partenaire dur en adversaire, et nous n''avons ni la trésorerie ni le temps d''un contentieux
    à ce stade. Je déciderai moi-même, à mon retour, si et quand elle est mobilisée.


    ---


    ## 10. Gouvernance pendant mon absence


    - **Mandataire unique pour ce dossier :** le **DAF**, avec délégation de signature limitée au strict
    périmètre de cette note. Rien au-delà.

    - **Décisions du §5 :** unanimité obligatoire du DAF, de la direction commerciale et de la direction
    industrielle. **En cas de désaccord, la décision est automatiquement « on ne signe pas ».** Pas de
    vote à la majorité, pas d''arbitrage par ancienneté.

    - **Interlocuteur unique de D :** la direction commerciale. Personne d''autre ne répond à D — ni sur
    le fond, ni « à titre personnel », ni en commercial de terrain. Diffusez cette consigne aux équipes
    de vente et à l''ADV dès demain.

    - **Aucun engagement oral.** Chaque échange avec D fait l''objet d''un compte rendu écrit dans les
    24 heures, adressé aux trois mandataires, versé au registre du dossier.

    - **Si D durcit** (ultimatum, arrêt de commandes, contact d''un membre du conseil ou d''un actionnaire)
    : cela ne change rien à cette note. Accuser réception par écrit, ne rien concéder, consigner, m''attendre.

    - **Registre de décisions daté**, tenu par le DAF, remis à mon retour le 31 août avec les trois livrables
    du §6.

    - **Social :** aucune annonce, aucune procédure, aucune information au CSE concernant Redon en mon
    absence. Si les indicateurs se dégradent au point de rendre une information-consultation obligatoire,
    la DRH prépare le dossier **sans le déclencher** et m''attend. Le chômage partiel est ma décision,
    et elle se prend avec les chiffres de septembre.


    ---


    ## Annexe A — Lettre à D (à envoyer au plus tard le 14 août)


    > Madame, Monsieur,

    >

    > Nous vous remercions de votre proposition de contrat d''exclusivité triennale, que nous avons examinée
    avec l''attention que mérite une relation aussi ancienne et aussi importante que la nôtre.

    >

    > Nous souhaitons développer nos volumes avec vous et sommes prêts à nous y engager contractuellement.
    La structure proposée n''est en revanche pas soutenable en l''état : une remise de 9 % appliquée sur
    trois ans, adossée à un engagement de volume ferme sur une seule année, ne permet pas d''équilibrer
    l''accord. Nous ne pouvons pas signer un texte dont nous savons dès aujourd''hui qu''il nous mettrait
    en difficulté en année deux.

    >

    > Nous vous proposons donc, sans modifier l''ambition commune :

    > — une durée initiale de douze mois, reconductible ;

    > — une remise progressive indexée sur les volumes effectivement livrés, atteignant 9 % au-delà de
    +25 % ;

    > — une exclusivité portant sur votre circuit de distribution et sur les références actuellement référencées
    ;

    > — un engagement de volume réciproque sur toute la durée, assorti de clauses symétriques ;

    > — un préavis de six mois en cas de modification du référencement.

    >

    > Nous vous demandons par ailleurs de bien vouloir confirmer par écrit le sens exact de l''engagement
    de volume de +18 % figurant dans votre projet, la rédaction actuelle étant susceptible de deux lectures.

    >

    > Nous restons disponibles pour travailler ce texte dès la semaine prochaine et vous confirmons la
    poursuite normale de nos livraisons dans l''intervalle.

    >

    > Veuillez agréer…


    ---


    ## Annexe B — Ce que je veux trouver à mon retour, le 31 août


    1. Le contrat de D **non signé**, ou signé dans le seul cadre strict du §5 avec procès-verbal motivé.

    2. La contre-proposition envoyée et sa réponse, quelle qu''elle soit.

    3. Les trois livrables chiffrés du §6.

    4. L''état d''avancement de la ligne de financement de 1,5 M€.

    5. La marketplace ouverte, même modestement, avec ses premières données réelles.

    6. Le rendez-vous avec la centrale régionale tenu ou calé.

    7. Le registre de décisions complet.


    ---


    **Un mot pour finir.** Nous perdrons peut-être des références en septembre, et ce sera dur. Ce que
    nous ne pouvons pas nous permettre, c''est de renoncer pour trois ans à notre capacité de nous en
    remettre. Un client qui exige une signature en huit jours, sur trente-six mois, pendant l''absence
    du dirigeant, ne cherche pas un partenariat : il verrouille une dépendance. Notre travail, ces trois
    prochaines semaines, n''est pas de gagner ce bras de fer — c''est de ne pas le perdre définitivement
    avant que j''aie pu le mener.


    Tenez la ligne. En cas de doute : on ne signe pas.


    *[Signature — Direction générale]*

    '
