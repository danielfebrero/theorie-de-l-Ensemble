response:
  text: '# NOTE DE DIRECTION — DÉCISION ARRÊTÉE


    **De :** Direction générale

    **À :** Directeur financier, Directeur commercial, Directeur industriel, Directrice RH, Responsable
    juridique

    **Date :** 8 août 2026 — **Objet :** Offre d''exclusivité D — décision, mandats et conduite jusqu''au
    31 août

    **Statut :** cette note n''est pas soumise à délibération. Elle est exécutoire. Le comité ne vote
    pas sur ce dossier.


    ---


    ## 1. La décision


    **Nous ne signons pas le contrat d''exclusivité de trois ans. Ni sous huit jours, ni sous une forme
    amendée, ni pendant mon absence.**


    **Nous adressons à D, demain 9 août, sous ma signature, une contre-proposition écrite** (termes exacts
    en annexe) : accord commercial de 12 mois, remise indexée sur volumes réellement livrés, **sans exclusivité**.


    **Nous acceptons par avance le déréférencement des quatre références au comité du 20 août.** Ce n''est
    pas un échec du plan : c''est le prix, chiffré et provisionné, de la décision ci-dessus.


    Aucun d''entre vous ne détient délégation pour signer une exclusivité, un engagement pluriannuel ou
    une clause pénale. Cette délégation n''est pas donnée, elle est retirée pour la durée de mon absence.
    Si l''offre expire le 16 août, elle expire.


    ---


    ## 2. Pourquoi — le calcul, que chacun doit pouvoir refaire


    Nos ventes à D : 14,9 M€, marge brute 31 %, soit **4,62 M€ de marge**.


    **9 points de prix, c''est 29 % de notre marge.** Le coût variable ne baisse pas quand le prix baisse.


    | Scénario | CA D | Marge brute D | Écart |

    |---|---|---|---|

    | Aujourd''hui | 14,9 M€ | 4,62 M€ | — |

    | An 1 signé, **+18 % livrés comme promis** | 16,0 M€ | 3,87 M€ | **−0,75 M€** |

    | An 2, volumes revenus à la base | 13,6 M€ | 3,28 M€ | **−1,34 M€** |

    | An 2, volumes −11 % (comme au T2) | 12,1 M€ | 2,92 M€ | **−1,70 M€** |


    Le point décisif : **il faudrait +41 % de volume pour que 9 % de remise soit neutre sur notre marge.
    D en propose 18.** L''offre est perdante par construction, même si D tient parole intégralement la
    première année. Nous vendrions plus, nous fabriquerions plus, nous userions plus l''outil, et nous
    gagnerions moins.


    Et nous ne l''achèterions qu''un an : l''engagement de volume est ferme 12 mois, « indicatif » ensuite.
    La remise, elle, est ferme 36 mois. Nous concéderions **trois ans de prix contre un an de volume**.
    Ce que vaut un engagement « indicatif » de D, nous l''avons appris au T2 : −11 % de commandes, sans
    préavis.


    Cumul sur trois ans, hypothèse médiane : **−3,4 M€ de marge brute**. Sortie : 1,2 M€, soit 57 % de
    notre trésorerie. Et pendant ces trois ans, l''exclusivité nous interdit la centrale régionale (3,5
    M€) et la marketplace (0,4 à 2,2 M€ à 37 % de marge) — entre 3,9 et 5,7 M€ de chiffre d''affaires
    et environ 1,5 M€ de marge, l''ordre de grandeur exact de ce qu''il nous faudrait pour cesser de dépendre
    de D.


    **Le calendrier est un argument en soi.** Comité avancé, huit jours, quatre références en otage, et
    l''acheteur qui demande à venir vous voir précisément la semaine où je suis absent et où votre division
    est écrite. Une offre qui ne survit pas à un examen calme n''est pas une offre à examiner sous contrainte.


    ---


    ## 3. Le meilleur argument contre ma décision — et pourquoi il ne l''emporte pas


    Je le formule mieux que ne le fera l''acheteur de D, pour que vous le reconnaissiez quand il le dira.


    *« Avec 2,1 M€ et trois mois de charges fixes, se battre contre 62 % du chiffre d''affaires, c''est
    jouer l''entreprise. Signer coûte 0,75 M€ de marge mais sécurise douze mois de plan de charge, sauve
    Redon et ses 52 postes, et nous achète exactement le temps qu''il faut pour construire les alternatives.
    Une marge dégradée dans une usine qui tourne vaut mieux qu''une belle marge dans une usine à l''arrêt.
    »*


    Cet argument est sérieux. Le directeur financier a raison sur les faits qui le composent. Il échoue
    sur un seul point, mais il est fatal : **la clause d''exclusivité interdit d''utiliser les douze mois
    qu''elle prétend nous acheter.** On ne peut pas à la fois invoquer le temps nécessaire à la diversification
    et signer le texte qui l''interdit pendant trois ans. Signer ne supprime pas le risque : il le décale
    de douze mois et confisque entre-temps tous les instruments qui permettraient de l''affronter. En
    août 2027, la même conversation aura lieu — avec un client à 68 % au lieu de 62, aucun canal alternatif,
    aucune référence externe, et 1,2 M€ à payer pour partir.


    Si D acceptait la remise sans l''exclusivité, la discussion serait ouverte. C''est précisément ce
    que notre contre-proposition met sur la table. Le refus porte sur la clause qui rend l''échange auto-destructeur,
    pas sur la relation.


    ---


    ## 4. Ce qui part demain — annexe contractuelle


    Lettre signée de ma main, datée du 9 août, remise en main propre et par courriel avec accusé, adressée
    à l''acheteur **et** à son directeur des achats. Ma signature avant départ n''est pas un détail :
    elle interdit à D de plaider que Verdal est sans pilote.


    **Termes de la contre-proposition — non négociables, à prendre ou à laisser :**


    1. **Durée : 12 mois.** Reconductible par accord écrit exprès. Pas de tacite reconduction.

    2. **Remise arrière, pas baisse de prix.** Prix de cession inchangé. Ristourne de fin de période calculée
    sur volumes **effectivement livrés** : 0 % en dessous de la base 2025 ; 3 % à +10 % ; 6 % à +18 %
    ; 9 % à partir de +35 %. La remise se mérite au réel, elle ne s''anticipe pas au contrat.

    3. **Pas d''exclusivité.** Nous accordons un **droit de première offre** sur toute nouvelle référence
    (15 jours) et l''engagement de ne pas référencer les mêmes recettes chez ses trois concurrents nationaux
    nommément désignés. La marketplace, la restauration hors foyer et les centrales régionales sont explicitement
    hors périmètre.

    4. **Symétrie.** Volume plancher engagé par D, assorti d''une indemnité en cas de manquement, du même
    ordre de grandeur que celle qu''il nous demande. S''il refuse toute réciprocité, il confirme lui-même
    que le « +18 % » n''a pas de valeur : c''est une option gratuite pour lui, pas un engagement.

    5. **Préavis de 6 mois écrit sur tout déréférencement.** Applicable immédiatement.

    6. Pas de pénalité de sortie. En cas de rupture fautive, droit commun.


    **Une seule question à lui poser, et notez sa réponse mot pour mot :** *« Êtes-vous prêt à engager
    fermement, sur trois ans, le volume qui justifie 9 % ? »* Sa réponse vous dit tout ce qu''il faut
    savoir sur ce contrat, et vous dispense de toute autre discussion.


    ---


    ## 5. Ce que vous pouvez signer, ce que vous ne pouvez pas


    **Vous pouvez signer**, conjointement DAF + DC, sans m''attendre :

    - La contre-proposition de l''annexe, **si D l''accepte sans modifier une virgule**, après visa du
    juridique. Une seule clause modifiée, même « de forme », même à notre avantage apparent : hors mandat,
    on attend mon retour.

    - Les commandes, livraisons et avoirs courants, aux conditions tarifaires actuelles.


    **Vous ne pouvez pas signer, ni promettre, ni laisser entendre :**

    - Toute exclusivité, sous quelque durée, périmètre ou dénomination que ce soit.

    - Tout engagement au-delà de 12 mois.

    - Toute clause pénale ou indemnité de sortie.

    - Toute baisse de prix de cession catalogue.

    - Toute lettre d''intention, accord de principe, courriel de confirmation, side letter ou « accord
    moral » — y compris oral, y compris présenté comme non contraignant.


    **Règle de clôture, valable pour tout cas non prévu par cette note : ne rien faire d''irréversible.**
    L''inaction est ici une décision autorisée, pas une défaillance. Le dossier m''attend.


    ---


    ## 6. La visite de l''acheteur


    Elle a lieu, mais pas dans le format demandé. **Il ne s''exprime pas devant le comité de direction
    réuni.** Un acheteur qui vient plaider devant un organe divisé en l''absence de son arbitre ne vient
    pas informer, il vient chercher une fissure.


    Cadre impératif :

    - Reçu par le **directeur commercial**, le DAF présent en observateur silencieux. Personne d''autre.
    Une heure.

    - La contre-proposition lui est remise **en début de séance**, avant tout exposé. La réunion porte
    sur ce texte ou sur rien.

    - **Aucune réponse, aucune réaction, aucune appréciation donnée en séance**, y compris sur le ton
    de la conversation. Formule unique : *« C''est notre position, elle est écrite et signée. Nous vous
    répondrons par écrit. »*

    - Compte rendu écrit sous 24 h, diffusé aux cinq destinataires de cette note.

    - Aucun échange bilatéral avec D pendant mon absence : ni le DAF, ni le DI, ni personne d''autre que
    le DC. Toute sollicitation entrante est redirigée vers le DC et consignée.


    Si D exige le format « exposé au comité » comme condition, la réponse est non, par écrit, en une phrase.


    ---


    ## 7. Les réactions de D sont déjà arbitrées


    | Ce que fait D | Ce que vous faites |

    |---|---|

    | Accepte la contre-proposition à l''identique | Vous signez. Visa juridique, deux signatures, information
    immédiate à tous. |

    | Refuse et maintient l''ultimatum du 16 | L''offre expire. Aucune contre-contre-proposition. Lettre
    confirmant la continuité de fourniture aux conditions actuelles et notre disponibilité après le 31
    août. |

    | Déréférence 4 références le 20 août | Plan §8 activé. Aucune concession en réaction, aucune remise
    de rattrapage. Lettre rappelant le préavis d''usage et le −11 % du T2. Ton neutre. |

    | Améliore l''offre mais garde l''exclusivité (6 %, 2 ans, etc.) | Hors mandat. Accusé de réception,
    dossier parqué jusqu''à mon retour. L''exclusivité est une ligne rouge, pas un curseur. |

    | Menace d''arrêter tout | Toujours pas de signature. §8 au maximum, alerte bancaire écrite le jour
    même, information des associés. Une rupture totale coûte aussi à D : nos huit références occupent
    ses linéaires et il n''a pas de fournisseur de substitution immatriculé sous 90 jours. |

    | Propose un « petit geste » informel pour débloquer | Interdit. Voir §5. |


    ---


    ## 8. Plan de repli — déclenchement automatique, sans arbitrage


    **Trésorerie**

    - D''ici le 14 août : négocier et **confirmer une ligne de crédit de 1,5 M€**. On la demande maintenant,
    pendant que les comptes sont bons — pas après le 20. Mandat plein au DAF.

    - Gel immédiat de tout investissement non engagé contractuellement. Aucune exception.

    - Si trésorerie < 1,5 M€ : tirage de la ligne, sans attendre.

    - Vérifier notre couverture assurance-crédit sur D avant toute cession de créances ; ne pas mobiliser
    le poste D si l''assureur a dégradé la note.


    **Plan de charge — Redon**

    - Suivi hebdomadaire, chiffre publié tous les vendredis aux cinq destinataires.

    - Le dossier d''activité partielle est **préparé et instruit dès cette semaine** — l''instruction
    prend plus de temps que la dégradation. Le préparer n''est pas l''activer.

    - Déclenchement : **plan de charge < 70 % deux semaines consécutives**. Alors seulement, et sans me
    consulter. Mesure réversible, à privilégier sur toute mesure définitive.

    - **Aucun licenciement, aucune rupture de contrat, aucune annonce de fermeture pendant mon absence.**
    Sans exception.

    - La directrice RH informe les représentants du personnel de la situation avant le 20 août, factuellement.
    Ils l''apprendront de toute façon ; qu''ils l''apprennent de nous.


    **Chiffrage à produire pour le 11 août** (DC + contrôle de gestion) : quelles sont les 4 références
    menacées, leur CA, leur marge, leur poids dans le plan de charge de Redon, et le point mort par ligne.
    **Ce chiffrage ne change pas la décision du §1** — il dimensionne le repli. Ne le présentez à personne
    comme un élément de réexamen.


    **Point de vigilance à vérifier :** 2,1 M€ pour trois mois de charges fixes implique environ 8,4 M€
    de charges fixes annuelles, à comparer à 7,44 M€ de marge brute totale. Si ce ratio est exact, notre
    structure absorbe déjà mal les charges fixes — et une concession de prix pérenne de 0,75 à 1,3 M€
    par an nous fait basculer. Le DAF confirme ou corrige ce chiffre pour le 12 août et diffuse la correction.
    Si le ratio est confirmé, il renforce la décision ; il ne l''inverse dans aucun cas.


    ---


    ## 9. Les alternatives ne sont plus « en cours », elles sont lancées


    - **Marketplace : ouverture immédiate.** 6 points de marge en plus, aucune raison d''attendre, et
    la meilleure preuve que nous savons vivre hors de D. Budget autorisé : **120 k€** (référencement,
    photos, logistique, premier stock). Décision du DC seul. Objectif : premières ventes avant le 30 septembre.

    - **Centrale régionale : accélération.** Proposer un référencement partiel ou un pilote sur 2 références
    avant leur décision plénière. Cinq mois est leur calendrier, pas le nôtre. Contact pris avant le 12
    août.

    - **Prospection RHF et MDD tiers** : ouvrir trois pistes qualifiées avant le 31 août. Le DC rend compte
    le vendredi.


    Rien de tout cela n''est possible si nous signons. C''est le vrai sujet de ce dossier.


    ---


    ## 10. Gouvernance pendant les trois semaines


    Vous avez écrit votre désaccord. C''était juste : un comité qui dissimule ses divisions est inutile.
    Mais le débat est clos, et je l''ai tranché — c''est mon travail, y compris à distance, y compris
    contre l''avis d''un des deux.


    - **Le directeur commercial** conduit la relation D et l''exécution commerciale. Interlocuteur unique.

    - **Le directeur financier** détient le mandat plein sur la trésorerie, la ligne de crédit et les
    relations bancaires. Son désaccord sur le §1 ne se rejoue pas par ces leviers ; je compte sur lui
    pour l''appliquer sans réserve, et je sais qu''il le fera.

    - **Le directeur industriel** publie le plan de charge hebdomadaire. **La directrice RH** tient le
    dossier Redon.

    - **Chacun accuse réception de cette note par écrit avant mon départ**, ce qui vaut engagement de
    l''appliquer. Cet accusé, et non le vote, est l''acte du comité sur ce dossier.

    - Point hebdomadaire le vendredi 9 h, 30 minutes, ordre du jour fixe : trésorerie / plan de charge
    / D / alternatives. Compte rendu écrit d''une page.

    - Toute décision prise hors de cette note est consignée avec son motif. Je la reprendrai à mon retour,
    et je l''assumerai avec vous si elle a été prise de bonne foi dans le cadre du §5.


    Je suis injoignable jusqu''au 31 août. Ne construisez aucun plan qui suppose de me joindre : il n''y
    aura pas d''exception, pas de canal de secours, pas de « juste cette fois ». Cette note est faite
    pour que vous n''en ayez pas besoin.


    Si D retire son offre le 16 août, vous n''aurez rien raté. Vous aurez évité de payer trois ans de
    prix pour un an de promesses, en renonçant au seul moyen de ne plus jamais avoir cette conversation.


    **Le Directeur général**


