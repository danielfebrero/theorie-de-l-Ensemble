response:
  text: '# Note au conseil d''administration — séance de jeudi


    **Objet : allocation de la réserve. Recommandation du directeur.**


    ## 1. Verdict


    **Je refuse C. Je retiens B, mais à 2,4 M€ et non 7,4 M€. Et je considère que le vote de jeudi ne
    porte pas sur la bonne question.**


    Le conseil s''apprête à voter une allocation d''actifs. Notre problème n''est pas une allocation d''actifs.
    Aucun des trois rendements proposés ne referme l''écart — le trésorier l''écrit lui-même à propos
    de B, et c''est vrai des trois. Avec un déficit technique de 1,0 M€/an qui croît de 4,3 %/an sur une
    base de 18,4 M€, il faudrait un rendement supérieur à 5,4 % **et croissant** sur la totalité de la
    réserve. B mixé donne 3,5 %. La question réelle est : **à qui appartiendront ces 4 200 personnes dans
    dix ans, et sous quelle couverture.** Il n''existe qu''une réponse solvable, et elle a une date d''expiration.


    ## 2. Le seul actif qui se périme : la fenêtre de transfert


    L''Union mutualiste de l''Atlantique n''a jamais accepté un portefeuille dont la réserve représentait
    moins de trois années de prestations. Notre ratio aujourd''hui : 18,4 / 5,4 = **3,41 ans**. Il ne
    se dégrade pas seulement parce que la réserve baisse, mais parce que le dénominateur monte de 4,3
    %/an.


    | Échéance | Réserve | Prestations | Ratio |

    |---|---|---|---|

    | Aujourd''hui | 18,4 M€ | 5,4 M€ | **3,41** |

    | +12 mois | 17,7 M€ | 5,63 M€ | **3,15** |

    | +24 mois | 16,8 M€ | 5,87 M€ | **2,86** |


    Le ratio passe sous 3,0 vers **le 18ᵉ mois**. L''instruction de l''UMA prend **12 à 18 mois**. Autrement
    dit : un dossier déposé aujourd''hui arrive à la décision à la limite exacte de l''éligibilité ; un
    dossier déposé dans six mois arrive après. La liquidation à 11 M€ est dans neuf ans, mais **la porte
    de sortie se ferme dans dix-huit mois**. Nous avons construit tout notre raisonnement sur le mauvais
    chronomètre.


    Point de fait à lever cette semaine, et il est peu coûteux : le seuil de trois ans est-il apprécié
    **à la date de dépôt** ou **à la date d''engagement** ? Un appel au comité d''engagement tranche.
    Si c''est à la date de dépôt, nous avons de l''air ; si c''est à la date d''engagement, nous n''avons
    plus de marge de manœuvre du tout. Je fais cet appel avant jeudi et j''apporte la réponse en séance.


    ## 3. Option C : refusée, pour trois raisons indépendantes


    Chacune suffit seule.


    **a) C tue la caisse même si la note tient ses promesses.** C''est de l''arithmétique, pas une opinion.
    Bloquer 14,4 M€ laisse 4,0 M€ liquides face à des déficits cumulés de 12,2 M€ sur les sept ans de
    blocage :


    | Fin d''année | Liquidités restantes | Déficit de l''exercice |

    |---|---|---|

    | 1 | 3,07 M€ | 1,00 M€ |

    | 2 | 1,90 M€ | 1,23 M€ |

    | 3 | 0,46 M€ | 1,47 M€ |

    | 4 | **−1,26 M€** | 1,73 M€ |


    **Nous cessons de pouvoir payer les prestations au cours de la quatrième année**, en détenant un actif
    performant et invendable. Et comme la note serait portée au nominal, la réserve comptable resterait
    au-dessus de 11 M€ pendant que la caisse serait en défaut de paiement : le plancher statutaire cesse
    de protéger quoi que ce soit dès que la réserve est illiquide. Cette branche n''est pas dans les 3
    % du trésorier. Elle est dans les 97 %.


    **b) La branche de 3 % n''est pas du bruit, c''est une perte irrécupérable.** Elle ramène la réserve
    à 4,7 M€, très en dessous de 11 M€, donc **liquidation de plein droit** — automatique, sans délibération,
    sans recours. Qui l''encaisse : 4 200 affiliés de 61 ans de moyenne d''âge, fortement exposés à l''amiante,
    qu''aucun assureur n''a accepté de coter en 2025. Ils ne redeviennent pas assurables ; ils deviennent
    non couverts, définitivement, au moment de leur vie où ils en ont le plus besoin. Une variance dont
    le pire cas reste soutenable ne mérite pas de veto — celle-ci n''est pas soutenable, donc elle en
    mérite un, et ce veto ne se négocie pas contre du rendement.


    **c) C détruit la seule sortie.** Aucun repreneur n''instruit un bilan dont 78 % consiste en une note
    non cotée, mono-émetteur, bloquée sept ans. Souscrire C, c''est renoncer au transfert pour sept ans
    — c''est-à-dire pour toujours, puisque la fenêtre en fait dix-huit mois.


    **Sur la note du trésorier.** Trois objections précises, sans procès d''intention — ses calculs sont
    justes, c''est la grandeur mesurée qui est fausse. (1) « C domine B dans 94 % des trajectoires » :
    la fréquence de domination n''a aucune valeur décisionnelle quand les 6 % restants contiennent un
    état absorbant. Nous ne maximisons pas une richesse terminale, nous maximisons une probabilité de
    survie sous barrière. (2) La distribution de probabilités est **communiquée par l''émetteur** : l''émetteur
    est ici l''unique source de la probabilité de son propre défaut. C''est la classe de preuve la plus
    faible qui existe, et une notation A− ne la remplace pas — elle porte sur le crédit, pas sur une structure
    non cotée sans garantie des dépôts. (3) « Deux caisses comparables ont souscrit l''an dernier » :
    un an n''est pas sept, et une exposition partagée n''est pas une validation — c''est une corrélation
    supplémentaire.


    **Enfin, un point à faire trancher par le commissaire aux comptes avant tout vote** : une concentration
    de 78 % sur une contrepartie unique non cotée me paraît difficilement compatible avec les règles de
    dispersion prudentielle et le principe de la personne prudente. Je ne l''affirme pas — je n''ai pas
    l''analyse juridique. Je demande qu''elle soit produite avant jeudi. Si elle confirme l''irrégularité,
    le débat est clos indépendamment de tout ce qui précède, et la responsabilité personnelle des administrateurs
    signataires est engagée.


    ## 4. Option B : oui, dimensionnée à la fenêtre


    B est saine dans son principe : cotée, valorisée quotidiennement, liquide. Mais 7,4 M€ exposent la
    caisse à un pire décile de −2,6 M€, qui ramènerait la réserve à 15,8 M€ — **sous les 16,9 M€ requis
    pour rester éligible au transfert à l''horizon de douze mois**. Nous ferions capoter notre propre
    dossier en cours d''instruction, par un mouvement de marché ordinaire.


    **Je propose 2,4 M€ (13 % de la réserve)** : c''est le montant maximal dont le pire décile historique
    laisse le ratio au-dessus de 3,0 pendant toute la durée de l''instruction. Réexamen à la décision
    de l''UMA — si le transfert aboutit, la question disparaît ; s''il échoue, le calcul de risque change
    réellement et le conseil rouvre le dossier.


    ## 5. Option A : ce n''est pas une option, c''est le décor


    Le statu quo n''est pas un choix qu''on vote, c''est ce qui se produit si nous ne faisons rien d''autre.
    La formule du trésorier — « condamner la caisse à mourir à petit feu » — est exacte pour A. Elle ne
    rend pas C acceptable pour autant ; elle établit seulement que le vrai travail est ailleurs que dans
    le portefeuille.


    ## 6. Les cinq signataires


    Le président et quatre administrateurs ont cosigné. Une majorité étroite qui refuserait C laisserait
    un conseil coupé en deux, qui rejouerait ce vote à chaque trimestre difficile. Je ne demande pas au
    conseil de désavouer son trésorier : sur le diagnostic — la caisse ne survit pas au statu quo — **il
    a raison, et c''est lui qui l''a dit le premier**.


    Je propose donc, et je m''y engage : **le trésorier reçoit mandat écrit de conduire la négociation
    avec l''UMA**, avec la signature du dossier de transfert, et **il préside le comité de placement**
    qui calibre la tranche B et me rend compte trimestriellement au conseil. C''est un pouvoir réel, pas
    une consultation. En contrepartie, la souscription mono-émetteur illiquide sort du champ des mandats
    — le veto porte sur la classe d''actif, pas sur la personne.


    ## 7. Ce sur quoi j''engage la caisse


    **Ce que je fais des trois options :** A — refusée comme stratégie, subie comme décor. B — retenue,
    plafonnée à 2,4 M€. C — refusée, veto motivé, non négociable contre du rendement.


    **Ce que j''engage, et que je porte personnellement :**


    1. **Première action, lundi** : dépôt du dossier de transfert auprès du comité d''engagement de l''UMA.
    Pas une lettre d''intention — le dossier. C''est la seule action dont le retard est irréversible.

    2. **Convocation d''une assemblée générale extraordinaire sous soixante jours** sur un relèvement
    des cotisations indexé sur la dérive des prestations. L''AG a rejeté 6 % en 2024 parce qu''on lui
    a présenté une hausse ; je lui présenterai l''alternative réelle, chiffrée : liquidation de plein
    droit et perte définitive de couverture pour des affiliés que le marché refuse de coter. Ce n''est
    pas un argument commercial, c''est le dossier.

    3. **Repli, avec déclencheur observable** : si l''UMA refuse, ou si le ratio réserve/prestations passe
    sous 3,0 avant acceptation du dossier, je convoque le conseil sous quinze jours pour ouvrir un plan
    de convergence — révision du panier de garanties et extinction ordonnée négociée. Pas un nouveau pari
    sur la réserve.

    4. **Seconde barrière** : réserve sous 14 M€ → convocation obligatoire du conseil, transfert accepté
    aux conditions disponibles quelles qu''elles soient. En dessous de ce seuil, nous ne choisissons plus,
    nous subissons.

    5. **Ce qui me ferait changer d''avis sur C** — je le pose pour que le conseil puisse me contredire
    sur des faits et non sur une conviction : une distribution de défaut **auditée par un tiers indépendant
    de l''émetteur**, ET une solution de liquidité couvrant 12,2 M€ de déficits cumulés sur sept ans.
    Les deux, pas l''une. À ma connaissance, ni l''une ni l''autre n''existe. Qu''on me les apporte et
    je révise ma position en séance.

    6. Si le conseil vote C malgré cet avis, **je demande l''inscription de mon opposition motivée au
    procès-verbal**, et je recommande à chaque administrateur de faire de même après avoir lu l''analyse
    du commissaire aux comptes. Ce n''est pas une posture : sur une exposition de cette nature, le PV
    est la seule pièce qui protégera individuellement ceux qui auront eu raison.


    ---


    **En une phrase pour la séance** : nous avons neuf ans avant la liquidation mais dix-huit mois avant
    la fermeture de la seule sortie, C nous met en cessation de paiement dès la quatrième année même dans
    son scénario favorable, et le rôle du portefeuille n''est pas de nous sauver — il est de ne pas nous
    disqualifier pendant que nous nous faisons reprendre.

    '
