response:
  text: '# NOTE AU CONSEIL — séance de jeudi

    **Objet : affectation de l''enveloppe unique de 900 000 €**


    ## 1. Ce que nous proposons de décider


    1. **Dossier B, engagé en premier et immédiatement : 135 000 €** — promotion de l''adjointe (45 000
    €) **et** mission de transition du directeur qualité (90 000 €), les deux, pas l''un ou l''autre.
    Contrat de transition signé cet exercice, exécuté à cheval sur son départ.

    2. **Dossier A : 620 000 € pour le parc complet**, sous réserve de deux vérifications chiffrées à
    obtenir avant signature (§4). Si l''une échoue, repli sur 3 machines.

    3. **Solde : 145 000 € réservés au plan de repli du dossier B**, mandat de recrutement signé avec
    déclenchement conditionnel (§5).


    ## 2. Le tableau unique demandé


    Il est ci-dessous, en une seule page. Deux blocs, parce que les lignes ne sont pas mesurées avec le
    même instrument.


    **Lignes classables — rendement adossé à une mesure vérifiable**


    | Rang | Ligne | Montant | Gain annuel établi | Retour | Source de la mesure |

    |---|---|---|---|---|---|

    | 1 | A1 — Parc complet, 6 machines | 620 000 € | 56 000 € | 11 ans sur données prouvées, ≤ 7 ans
    si le gain rebut est confirmé | 5 ans de maintenance horodatée et auditée |

    | 2 | A2 — Tranche de 3 machines | 310 000 € | non calculable en l''état | — | les 47 pannes ne sont
    pas ventilées par machine ; ventilation disponible en une heure |


    *Détail du gain A1 : 213 000 € de coût direct d''immobilisation sur 5 ans = 42 600 €/an ; 1 810 heures
    perdues = 362 h/an × 38 € = 13 800 €/an de marge. Les deux s''additionnent (le coût direct déclaré
    ressort à 118 €/h, il ne peut pas être de la marge à 38 €/h), sous confirmation du contrôle de gestion
    qu''il n''y a pas de recoupement.*


    **Lignes non classables — aucune mesure de rendement n''existe**


    | Ligne | Montant | Pourquoi pas de rang |

    |---|---|---|

    | B1 — Promotion de l''adjointe | 45 000 € | Condition d''exercice, pas investissement à rendement
    |

    | B2 — Mission de transition | 90 000 € | idem |

    | B3 — Recrutement externe | 280 000 € | idem, et le plus lent des trois |

    | Cotation du cabinet RH (35 % × 4,2 M€ = 1,47 M€) | — | Écartée : voir §3 |


    ## 3. Pourquoi la cotation du cabinet ne figure pas au classement


    Nous ne contestons pas le risque. Nous contestons le chiffre.


    Ces 1,47 M€ proviennent d''un atelier de trois consultants n''ayant jamais travaillé dans le dispositif
    médical, sur un événement dont l''entreprise n''a **aucun précédent** et le secteur **aucun comparable
    accessible**. Il n''y a donc pas de taux de base : le 35 % n''est pas une estimation, c''est une opinion
    convertie en décimales. La criticité « 7,5 sur 10 » n''a pas d''unité et ne peut pas être rapprochée
    d''un euro.


    Deux tests suffisent au conseil :


    - **Ce chiffre ne change aucune décision.** À 1,47 M€, le dossier B écrase le classement — mais les
    options B réelles coûtent 135 000 €. On ne peut pas dépenser davantage face au risque : il n''y a
    rien de plus à acheter.

    - **Il fait basculer le classement sans rien apprendre.** Un atelier voisin aurait dit 10 % ; le dossier
    B tomberait en dernier et nous laisserions filer la certification. Un indicateur dont l''entrée est
    arbitraire et la sortie décisive n''est pas une aide à la décision.


    Enfin, les consultants ont mesuré le mauvais canal. Ils ont chiffré la perte de deux clients (31 %
    du CA). L''exposition réelle passe par l''organisme notifié : sans interlocuteur reconnu, c''est la
    certification de nos dispositifs — donc **la totalité** de notre droit de vendre — qui est en jeu,
    pas 31 %. C''est précisément l''erreur qu''un atelier hors secteur ne pouvait pas éviter.


    **Conclusion :** placer cette ligne dans la même colonne que les données machines ne la rendrait pas
    comparable. Cela ferait hériter au chiffre faible la crédibilité du chiffre solide.


    ## 4. Dossier A — deux vérifications avant de signer


    Le dossier est bon, la donnée est auditée, mais **le rendement affiché n''est pas celui qui est écrit
    dans l''offre.**


    - **Le gain n''est pas la disponibilité, c''est le rebut.** Les 1 810 heures d''arrêt représentent
    60 heures par machine et par an. Si l''atelier tourne en deux équipes, notre disponibilité actuelle
    est déjà d''environ 98 % : la garantie « 96 % sur 7 ans » est en dessous de notre performance réelle
    et les pénalités ne se déclencheront jamais. **À demander avant jeudi : les heures d''ouverture annuelles
    par machine.** Et à renégocier : porter le seuil à 98,5 %, ou déplacer la pénalité sur le taux de
    rebut — c''est là qu''est la valeur, et c''est aujourd''hui une promesse sans sanction.

    - **Un seul chiffre décide du périmètre.** Les gains prouvés (56 000 €/an) donnent un retour à 11
    ans. L''écart de rebut (4,1 % → 1,2 %, soit 2,9 points) comble le reste, mais nous ne connaissons
    pas la valeur de production passant par ces six machines. **Seuil : au-delà d''environ 1,1 M€ par
    an, le parc complet se rembourse dans les 7 ans de la garantie.** En dessous, on n''achète que trois
    machines. Le contrôle de gestion sort ce chiffre en une heure.


    **Sur le fractionnement :** les conditions unitaires étant identiques, étaler ne coûte rien en prix
    — mais l''enveloppe n''est pas reconductible et il n''y a pas de tour de table avant douze mois. Acheter
    par tranches revient donc à renoncer aux machines restantes pendant un an, sur un parc de 14 ans d''âge.
    L''étalement n''est ici pas une prudence, c''est un abandon. Si le seuil est franchi : parc complet.


    ## 5. Dossier B — ce que l''argent ne peut pas racheter


    La ressource rare n''est pas l''enveloppe, ce sont les **onze mois de présence** du directeur qualité.
    L''argent non engagé est perdu en fin d''exercice ; son temps aussi, et lui ne reviendra pas.


    Les deux actifs à transférer — la reconnaissance par l''organisme notifié et la relation avec les
    deux clients hospitaliers — sont attachés à une personne. Ils ne se transmettent que **par co-présence**,
    pas par recrutement. Le candidat externe à 280 000 € arriverait sans lien avec l''organisme notifié,
    sans historique client, et après plusieurs mois de recherche : sur le seul axe qui compte, le délai,
    c''est la plus mauvaise des trois options.


    D''où la combinaison, à 135 000 € :

    - **Promotion de l''adjointe maintenant**, pour qu''elle exerce pendant qu''il est encore là ;

    - **Mission de transition signée maintenant**, exécutée après le départ, pour tenir le lien pendant
    la première année pleine de la titulaire.


    **Un point à vérifier sous 48 heures** : l''adjointe est entrée il y a 3 ans. Le règlement 2017/745
    impose des critères d''expérience à la personne responsable du respect de la réglementation, et tout
    changement doit être notifié à l''organisme. Si elle ne satisfait pas ces critères, la promotion seule
    ne tient pas et le recrutement externe redevient nécessaire — c''est le seul cas où l''on dépense
    les 280 000 €.


    **Jalons observables, qui déclenchent le repli :**

    - **Mois 3** : l''organisme notifié a accepté par écrit la nouvelle interlocutrice.

    - **Mois 6** : elle a conduit l''audit de l''organisme en interlocutrice principale, lui en retrait
    ; les deux clients hospitaliers ont été visités ensemble ; les 9 auditeurs internes lui sont rattachés.

    - **Si le jalon du mois 6 n''est pas tenu**, la réserve de 145 000 € finance la première année du
    recrutement externe, sans attendre le prochain tour de table.


    ## 6. Répartition


    | | |

    |---|---|

    | Dossier B — promotion + mission de transition | 135 000 € |

    | Dossier A — parc complet (ou 310 000 € en repli) | 620 000 € |

    | Réserve de repli B, mandat conditionnel | 145 000 € |

    | **Total engagé** | **900 000 €** |


    Cette réserve n''est justifiée que par le jalon du mois 6. Si le règlement financier ne permet pas
    d''engager un mandat conditionnel cet exercice, il faut le dire au conseil et laisser le solde s''éteindre
    : dépenser 145 000 € pour ne pas les perdre serait la seule vraie erreur possible dans ce dossier.

    '
