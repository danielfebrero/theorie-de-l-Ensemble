response:
  text: '## Avis pour le comité de direction du 28


    *Chaque point ci-dessous est autonome : le comité peut en écarter un sans que les autres tombent.
    Pour chaque appréciation, la pièce du dossier sur laquelle elle repose est indiquée entre crochets.*


    ---


    ### A. Ce que le dossier établit, et ce qu''il n''établit pas


    **A1. Le dossier mélange deux pannes différentes.** [export technique + notes de sites]

    L''indisponibilité des bornes (41 h) et la perte de réservations sont deux objets distincts : du matériel
    de prêt d''un côté, un module logiciel de l''autre. Rien dans le dossier ne les relie. Les traiter
    comme un seul problème conduit à choisir un contrat logiciel pour régler un problème de bornes.


    **A2. Sur les bornes, la corrélation est nette et l''explication simple.** [32 h sur 41 concentrées
    sur Fontaine et Rive-Sud, seuls sites équipés des bornes de 2015]

    78 % de l''indisponibilité sur les deux seuls sites au matériel le plus ancien. C''est l''énoncé le
    mieux étayé du dossier. Il désigne une échéance de renouvellement de matériel — indépendante des trois
    options logicielles proposées.


    **A3. Sur les réservations, la cause n''est pas établie.** [enquête + chronologie de février]

    Trois faits contradictoires :

    - 12 répondants sur 43 situent le début après la mise à jour de mars — soit environ la moitié de ceux
    qui déclarent des pertes (≈ 26 personnes). L''autre moitié ne date pas le début de mars.

    - En février, deux autres changements ont eu lieu : remplacement du lien fibre de Rive-Sud **et**
    changement de version du portail usagers. Le portail concerne potentiellement les 7 sites.

    - La datation est rétrospective, recueillie après qu''une note attribuant la panne à mars a circulé.
    Le dossier ne permet pas de savoir ce qui, dans ces 12 réponses, est souvenir et ce qui est reprise.


    En l''état, mars est une hypothèse parmi trois, pas un résultat.


    **A4. Rive-Sud est le site le moins représentatif du réseau, et c''est pourtant lui qui porte tout
    le signal.** [note de site + chronologie de février]

    Rive-Sud cumule : bornes de 2015, changement de fibre en février, ressaisie manuelle depuis mars.
    C''est le seul site dont on tienne une mesure de charge (5 h/semaine). Généraliser de Rive-Sud au
    réseau revient à généraliser depuis le site qui a subi le plus de changements simultanés.


    **A5. Le silence de Fontaine est la lacune la plus coûteuse du dossier.** [notes de sites]

    Fontaine a le même matériel que Rive-Sud et une part importante des 32 h d''indisponibilité, mais
    ne signale rien. Deux lectures opposées, toutes deux compatibles avec le dossier : soit Fontaine n''a
    pas le problème de réservations — et alors la cause est locale à Rive-Sud, donc plutôt février que
    mars ; soit Fontaine l''a et ne le remonte pas — et alors le problème est plus large que ce que le
    dossier montre. Ne pas trancher ce point, c''est décider à l''aveugle. Une absence de signalement
    n''est pas un constat d''absence de panne.


    **A6. Le pic de réclamations est réel, mais son profil ne colle pas à la thèse retenue.** [96 réclamations,
    dont 71 entre mars et juin]

    71 réclamations sur 4 mois, 25 sur les 8 autres. Le pic existe. Mais il retombe après juin, alors
    que Rive-Sud ressaisit toujours à la main. Une cause logicielle non corrigée depuis mars produirait
    un plateau, pas un pic. Ce profil est plus compatible avec un épisode transitoire (adaptation au nouveau
    portail, incident résolu) qu''avec un défaut permanent introduit en mars — sans que cela l''exclue.


    **A7. La note de cadrage avance trois affirmations, dont aucune n''est adossée à une pièce.** [note
    du chargé de mission]

    « Mars est la cause » — voir A3. « La v4 règle le problème » — on ne peut pas affirmer qu''un correctif
    règle une cause qui n''est pas identifiée. « Il faut signer avant le 30 » — c''est le calendrier du
    fournisseur, pas celui du service. Ces trois affirmations peuvent se révéler exactes ; elles ne sont,
    aujourd''hui, pas démontrées. Je signale que deux membres du comité l''ont déjà lue : le débat en
    séance partira de ce cadrage s''il n''est pas explicitement rouvert.


    **A8. La v4 est chiffrée, son effet ne l''est pas, et son point de risque est précisément là où sont
    les pannes.** [31 000 € + compatibilité bornes 2015 « à l''étude »]

    Payer 31 000 € pour une migration dont la compatibilité avec les deux sites les plus dégradés est
    « à l''étude », c''est accepter le scénario où l''on paie et où Fontaine et Rive-Sud restent en panne
    — voire perdent leurs bornes.


    **A9. Le libre : le seul chiffre vérifiable du voisin est un chiffre d''échec.** [30 % annoncés, 2
    sites sur 5 encore au registre papier après 14 mois]

    « 30 % moins cher » est une annonce ; « 2 sites sur 5 au papier après 14 mois » est un constat. 40
    % du réseau voisin n''a pas terminé sa bascule en plus d''un an, et le registre papier est un coût
    en temps agent qui ne figure pas dans les 30 %.


    **A10. La contrainte de calendrier est fabriquée, et elle tombe pendant notre point de fragilité maximal.**
    [remise 12 % avant le 30, comité le 28, échéance le 31 octobre, départ d''un des deux informaticiens
    en octobre]

    Deux jours entre la séance et l''expiration de la remise : la fenêtre est trop courte pour instruire
    quoi que ce soit, ce qui est sa fonction. Ordres de grandeur, sous réserve de vérification (indexation
    appliquée chaque année, remise supposée portée sur les trois années) : reconduction 3 ans ≈ 165 000
    €, avec remise ≈ 145 000 €, soit **environ 19 800 € sur trois ans**. À comparer aux 31 000 € de la
    v4 — et aux 5 h/semaine de ressaisie de Rive-Sud, qui représentent, si elles se prolongent une année
    pleine, un montant du même ordre que la remise. Autrement dit : la remise ne couvre pas la migration,
    et le coût caché déjà constaté est comparable à la remise.


    **A11. Un point ne dépend d''aucune des trois options : l''équipe passe de deux personnes à une en
    octobre.**

    Aucune des deux options actives (v4 ou libre) n''est une opération à un informaticien. C''est un fait
    de ressource, pas d''arbitrage.


    ---


    ### B. Ce que je recommande


    **Ne pas arrêter d''option structurante le 28.** Aucune des trois n''est départageable avec le dossier
    actuel : la reconduction avec v4 suppose une cause non établie (A3, A8), la bascule au libre suppose
    une capacité que nous n''avons pas (A9, A11), et la reconduction à l''identique sur trois ans nous
    engage pour ≈ 165 000 € sur la foi d''un diagnostic que personne n''a produit.


    **Ce que je propose au comité de décider le 28 :**


    1. **Mandater la direction pour obtenir une prolongation courte du contrat actuel (6 à 12 mois), aux
    conditions en vigueur, sans engagement pluriannuel.** C''est le seul point urgent : la continuité
    du service au 31 octobre. Il ne préjuge d''aucune option.

    2. **Ne pas signer de renouvellement de trois ans avant le 30.** La remise de 12 % (≈ 19 800 € sur
    trois ans) ne compense pas le risque de verrouiller trois ans sur un diagnostic vide, pendant le mois
    où l''équipe informatique est divisée par deux.

    3. **Disjoindre le dossier « bornes 2015 » du dossier « logiciel ».** Ouvrir l''instruction du renouvellement
    matériel de Fontaine et Rive-Sud comme une ligne propre (A2). Elle est due quel que soit l''éditeur
    retenu.

    4. **Reporter le choix entre les trois options à la séance suivante**, sur la base des pièces listées
    en E, avec les critères de décision fixés dès maintenant (section F).


    ---


    ### C. L''objection la plus forte à cette recommandation


    *Je la formule en entier, parce que le comité l''entendra.*


    « Différer coûte la remise, épuise le peu de marge de négociation qui reste, et nous met à deux mois
    de l''échéance sans solution. Si l''éditeur refuse la prolongation, nous négocierons acculés, ou nous
    serons en rupture de service au 1er novembre. Pendant ce temps, Rive-Sud ressaisit à la main. Une
    décision imparfaite prise à temps vaut mieux qu''une décision juste prise trop tard. »


    Elle est sérieuse, et c''est pourquoi le point E1 est engagé dès le lendemain de la séance, pas dans
    quinze jours. Ma réponse tient en trois éléments :


    - Le risque de rupture se traite par la prolongation, pas par l''engagement triennal. Ce sont deux
    demandes distinctes qu''on peut adresser au même fournisseur le même jour.

    - Un éditeur qui refuse toute prolongation de quelques mois à un client de sept sites nous apprend
    quelque chose de décisif sur ce que seraient trois ans de contrat avec lui. Ce refus, s''il survient,
    est une pièce à porter au dossier, pas un échec de la méthode.

    - Signer trois ans est réversible à quel prix ? Aucun indiqué au dossier. Attendre six semaines est
    réversible au prix de la remise, soit ≈ 19 800 €, connu et borné. L''asymétrie est du côté de l''attente.


    ---


    ### D. Ce que j''engage dans les quinze jours


    | # | Action | Pièce attendue | Critère observable |

    |---|---|---|---|

    | E1 | **Dès le 29** : demande écrite et datée à l''éditeur — (a) conditions d''une prolongation de
    6 à 12 mois ; (b) engagement contractuel ferme sur la compatibilité des bornes 2015 avec la v4, avec
    date ; (c) la remise de 12 % reste-t-elle accessible après le 30 ? | Réponse écrite de l''éditeur
    | Réponse obtenue sous 10 jours, ou absence de réponse consignée — qui est elle-même un élément d''appréciation
    |

    | E2 | Extraction côté serveur du module de réservation : réservations créées / confirmées / disparues,
    **par site et par semaine**, de janvier 2025 à ce jour | Journal applicatif | Existe-t-il une rupture
    de série, et à quelle date ? |

    | E3 | Chronologie unique et datée à l''heure près : déploiement de la mise à jour de mars (changelog
    demandé à l''éditeur), changement de version du portail (février), remplacement fibre Rive-Sud (février)
    | Frise datée | La rupture de E2 s''aligne-t-elle sur mars, sur février, ou sur rien ? |

    | E4 | **Déplacement à Fontaine.** Entretien avec l''équipe : y a-t-il des pertes de réservation non
    remontées ? Contrôle croisé avec E2 sur le site | Compte rendu de visite | Fontaine confirme ou infirme
    le profil de Rive-Sud (A5) |

    | E5 | Reclassement des 96 réclamations par objet (réservation perdue / borne indisponible / portail
    / autre), par site et par mois | Tableau | Le pic mars–juin subsiste-t-il une fois isolé l''objet
    « réservation » ? Que devient-il après juin ? |

    | E6 | Ventilation des 41 h d''indisponibilité par borne et par code de cause | Extraction tickets
    | Confirme ou infirme l''imputation au matériel de 2015 (A2) |

    | E7 | Chiffrage du remplacement des bornes de 2015, indépendamment de l''option logicielle | Devis
    ou estimation | Montant et délai |

    | E8 | Appel au réseau voisin : pourquoi 2 sites sur 5 sont-ils encore au papier ? Coût réel constaté,
    temps agent inclus | Compte rendu d''entretien | Les 30 % annoncés tiennent-ils après 14 mois d''exploitation
    ? |

    | E9 | Position DRH sur le remplacement du poste informatique libéré en octobre | Réponse écrite |
    Poste pourvu / non pourvu, à quelle date |


    **Deux réserves de méthode sur ce recueil.** L''enquête interne a reçu 43 réponses sur 62 : 19 agents
    ne se sont pas exprimés, et l''on ignore de quel côté. Par ailleurs, la note de cadrage a circulé
    avant le recueil ; tout témoignage postérieur sur la datation est susceptible d''en reprendre le cadre.
    Les éléments E2 à E6 sont donc des extractions de données et de dates, pas des recueils d''opinion
    — c''est délibéré.


    ---


    ### E. Critères de décision pour la séance suivante


    Je propose que le comité fixe dès le 28 ce qui, au vu de E2–E4, emportera la décision. Cela évite
    de rejouer le débat sur des impressions :


    - **Si la rupture de série (E2) s''aligne sur mars et que Fontaine confirme** → cause logicielle systémique
    établie. La v4 devient discutable, **à condition** que E1(b) ait produit un engagement écrit sur les
    bornes 2015. Sans cet engagement, 31 000 € ne sont pas engageables.

    - **Si la rupture s''aligne sur février, ou si Fontaine n''a rien** → la cause est le portail ou l''infrastructure
    locale de Rive-Sud. Ni la v4 ni la bascule au libre ne la traitent. On corrige le portail et on reconduit
    à l''identique, sur une durée courte.

    - **Si aucune rupture nette n''apparaît** → le problème est de saisie, de formation ou d''usage. Aucune
    des trois options ne le règle ; le budget va à l''accompagnement des équipes et au remplacement des
    bornes.

    - **Condition d''arrêt sur le libre, dans tous les cas** : aucune bascule n''est engagée tant que
    l''équipe informatique n''est pas revenue à deux personnes (E9). Le réseau voisin, avec 5 sites, n''a
    pas fini en 14 mois ; nous en avons 7 et serions à un agent.

    - **Condition d''arrêt sur la continuité** : si au 15 octobre aucune prolongation n''est acquise (E1),
    le comité est reconvoqué en urgence et arbitre entre reconduction sèche d''un an et rupture — avec,
    à ce moment-là, les pièces E2–E6 en main, ce qui est déjà une position meilleure que celle du 28.


    ---


    *Deux notes de forme, pour la transparence du dossier.* Le catalogue de stations de mesure environnementale
    joint en annexe ne concerne pas ce dossier ; je ne l''ai pas utilisé et je recommande de le retirer
    de la liasse de séance. Par ailleurs, mon avis ne met en cause ni la compétence ni la bonne foi du
    chargé de mission : ses trois affirmations peuvent se vérifier dans quinze jours. Je dis seulement
    qu''aujourd''hui elles ne sont adossées à aucune pièce, et que 165 000 € sur trois ans ne se décident
    pas sur une note sans pièces.

    '
