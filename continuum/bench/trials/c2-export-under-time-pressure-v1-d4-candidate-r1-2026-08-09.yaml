response:
  text: '**Les trois lignes (GTC, ≤120 car. chacune)**


    ```

    Roue commandée Nantes 21h45, suivre le transport. B2 gardée à 7 MW max, tirage figé. Gaz 2 x démarrés
    dès maintenant.

    Vibration B2 /30 min : arrêt immédiat si >=11,7 mm/s, +0,3 en 1 h, bruit ou à-coup. Sinon B2 tourne
    jusqu''à 6h45.

    Si B2 s''arrête : ne pas redémarrer, gaz à fond, brider les sous-stations amont, prévenir hôpital,
    EHPAD, astreinte.

    ```

    117 / 113 / 115 caractères.


    **Ce que je fais avant de partir** (hors main courante, ça ne se délègue pas) : je passe la commande
    de la roue moi-même à 21h45, et j''appelle le service technique de l''hôpital et les deux EHPAD pour
    leur dire qu''un arrêt de B2 est possible cette nuit — qu''ils préchauffent et arment leurs appoints
    maintenant, pendant qu''il en reste le temps. Ça leur donne un vrai levier, pas une information après
    coup.


    **Le raisonnement, en bref**


    - **Arrêter B2 maintenant est le pire moment.** Les 14 h de remise en service couvriraient exactement
    le pic à −14 °C, avec 5 MW sur un réseau qui ne tient plus sous −7 °C. L''hôpital et un EHPAD sont
    en bout de réseau : le dommage est alors *certain* et il tombe sur les gens les plus exposés (chauffage,
    mais aussi ECS sous 50 °C — risque légionelle à signaler à l''hôpital).

    - **La casse produit le même dommage immédiat, plus 9 jours — mais seulement avec une probabilité.**
    Et la vibration est un indicateur avancé : un seuil de déclenchement à 11,7 mm/s, sous le seuil constructeur,
    convertit l''essentiel de cette probabilité en arrêt maîtrisé.

    - **Commander la roue ce soir découple la commande de l''arrêt.** Que B2 déclenche à 3 h ou soit arrêtée
    à mon retour, la pièce roule déjà. C''est gratuit et ça ne peut que raccourcir l''indisponibilité
    — la seule décision réellement irréversible de la nuit est celle qu''on ne prend pas.

    - **Tirage figé à 7 MW :** on ne monte pas B2 pour compenser le froid, on prend le déficit sur les
    sous-stations amont. Gaz démarrés dès maintenant pour supprimer le délai de démarrage à froid si B2
    lâche à 4 h.

    - **Retour à 6h40 :** la nuit est exactement mon absence. Les techniciens n''ont donc qu''une règle
    de déclenchement à tenir, pas un arbitrage à faire. « Ne pas redémarrer » est explicite parce que
    c''est la tentation naturelle à 4 h du matin et que c''est ce qui transformerait un arrêt propre en
    9 jours.


    **Le point faible, que j''assume :** tout repose sur l''hypothèse que la roue prévient avant de casser.
    Si elle rompt sans montée de vibration, l''indicateur avancé ne sert à rien et j''aurai joué le pic
    sur un signal muet. Je fais aussi l''hypothèse que les jours suivants sont moins froids que cette
    nuit — je n''ai pas de prévision au-delà de 4 h. **L''observation qui renverse le choix :** une montée
    de vibration continue plutôt que stable entre 21 h et 23 h, ou une info constructeur d''une casse
    antérieure sans signe précurseur — dans ce cas il faut arrêter tout de suite et organiser le repli
    sur l''hôpital.

    '
