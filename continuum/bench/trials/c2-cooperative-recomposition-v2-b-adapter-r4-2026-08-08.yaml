response:
  text: '## Note de position — Commission locale de l''eau du bassin de la Vèze


    **Objet : répartition de la ressource en période d''étiage sévère — proposition soumise au vote de
    jeudi**


    ---


    ### 1. Ce que la soustraction ne dit pas


    570 − 410 = 160 est une arithmétique, pas une décision. Avant de la trancher, je conteste trois de
    ses termes, et je demande que trois vérifications soient conduites **avant jeudi** :


    **a) Le 410 L/s.** Il provient d''une station unique, étalonnée pour la dernière fois en 2023. Une
    dérive de 10 à 15 % en bas de gamme est banale sur une station non réétalonnée : le débit réel est
    quelque part entre **350 et 470 L/s**. L''incertitude métrologique vaut à elle seule la moitié du
    déficit que nous prétendons arbitrer. Je demande un **jaugeage indépendant (ADCP) sous 10 jours**,
    financé sur le fonds.


    **b) Le point de contrôle du débit réservé n''est pas mesuré.** Nous mesurons le débit *entrant*,
    alors que l''obligation préfectorale porte sur l''*aval*. Nous pilotons la seule valeur juridiquement
    opposable en aveugle. Installation d''une station de contrôle à la section de référence : sous 15
    jours.


    **c) Le bilan ignore les retours.** L''irrigation est consommatrice à 85-90 % (évapotranspiration).
    L''eau potable ne l''est pas : l''essentiel du prélèvement de la régie revient à la rivière par la
    station d''épuration. **Où est le rejet de la STEP par rapport à la section de contrôle et aux deux
    frayères ?** Si le rejet est en amont, une part importante des 150 L/s de la régie n''a jamais quitté
    le bilan, et le « déficit de 160 » est surestimé de plusieurs dizaines de litres par seconde. C''est
    une vérification cartographique de 48 heures ; c''est la plus rentable du dossier.


    Et un chiffre que personne n''a posé sur la table : 150 L/s pour 9 200 habitants, c''est **12 960
    m³/jour, soit 1 400 litres par habitant et par jour** — environ neuf fois la consommation domestique
    française moyenne. Ce volume n''est pas de l''eau au robinet. C''est du rendement de réseau, des usages
    non domestiques raccordés, ou les deux. Tant que la régie ne produit pas la décomposition de ses 150
    L/s, elle ne peut pas prétendre que sa dotation est incompressible.


    ### 2. Ce qui n''est pas arbitrable


    **Les 180 L/s de débit réservé ne sont pas dans la négociation**, pour trois raisons cumulatives :


    - Ils relèvent d''un arrêté préfectoral. La commission n''a pas compétence pour les abaisser ; une
    délibération qui le ferait serait annulée, et nous nous retrouverions sans plan du tout, en pleine
    crise.

    - Le rapport hydrobiologique du 12 juin documente en dessous de ce seuil une perte qualifiée de non
    reconstituable à l''échelle d''une décennie. Une récolte perdue se rejoue l''an prochain ; deux frayères
    asséchées, non.

    - Je ne demanderai pas de dérogation pour circonstances exceptionnelles. Une dérogation échangerait
    une perte économique d''une saison contre une perte écologique de dix ans. Ce n''est pas un arbitrage,
    c''est un transfert de la facture vers ceux qui ne siègent pas ici.


    Symétriquement, **un socle sanitaire est garanti sans condition** : les besoins vitaux de 9 200 habitants
    et d''un EHPAD de 110 lits représentent de l''ordre de 20 à 40 L/s. Je propose de le fixer à **45
    L/s, servis en priorité absolue en toutes circonstances**, y compris si le débit continue de chuter.
    C''est peu, c''est garanti, et c''est écrit.


    ### 3. La décision : volume global par usage — et pourquoi pas de quotas individuels


    Le règlement m''offre les deux. **Je choisis le volume global**, non par facilité mais parce que les
    quotas individuels sont, en l''état, inapplicables : nous n''avons **ni parcellaire, ni cultures,
    ni stades, ni compteurs**. Un quota volumétrique sans compteur est une fiction juridique — non contrôlable,
    donc non opposable, donc annulable au premier recours. Arrêter des quotas individuels aujourd''hui,
    ce serait produire du droit décoratif.


    Mais un volume global nu est tout aussi mauvais : entre 34 exploitations non comptées, il organise
    la course à la pompe, et les six exploitations qui portent 300 des 620 hectares la gagneront. Le volume
    global est donc **assorti d''une clé interne obligatoire** (§ 5).


    ### 4. Répartition proposée (débit entrant 380-430 L/s — situation actuelle)


    | Usage | Demande | Attribution | Effort |

    |---|---|---|---|

    | Débit réservé aval | 180 | **180** | 0 % |

    | Eau potable (dont socle sanitaire 45 garanti) | 150 | **110** | −27 % |

    | Irrigation | 240 | **105** | −56 % |

    | Marge d''incertitude métrologique | — | **15** | gelée jusqu''au jaugeage |

    | **Total** | | **410** | |


    Les 15 L/s gelés sont **attribués en priorité à l''irrigation** si le jaugeage confirme ou révise
    à la hausse le débit entrant. Les 40 L/s retirés à la régie ne touchent aucun robinet : ils sont à
    prendre sur les pertes de réseau (recherche de fuites, modulation de pression nocturne) et sur les
    usages non essentiels et non domestiques raccordés.


    **Échelle graduée pré-annoncée** (moyenne mobile 7 jours du débit entrant), pour que personne ne découvre
    sa dotation trop tard :


    | Débit entrant | Réservé | AEP | Irrigation |

    |---|---|---|---|

    | ≥ 480 | 180 | 150 | 150 |

    | 430-480 | 180 | 130 | 130 |

    | **380-430** | **180** | **110** | **105 (+15 gelés)** |

    | 330-380 | 180 | 90 | 70 |

    | 280-330 | 180 | 70 | 30 |

    | < 280 | 180 | 65 | 0 (ressources de secours AEP) |


    Annoncer l''échelle maintenant est la mesure la plus utile économiquement aux maraîchers : un exploitant
    qui sait en août qu''il descendra peut-être à 30 L/s arrête d''engager des intrants sur des parcelles
    condamnées. Un exploitant prévenu en septembre a payé les intrants **et** perdu la récolte.


    ### 5. Clé interne agricole : concentrer, ne pas diluer


    105 L/s = 9 072 m³/jour. Étalés sur 620 ha, cela fait **1,5 mm/jour**, contre 4 à 6 mm/jour d''évapotranspiration
    en août. Répartis également, ces 105 L/s ne sauvent rien : ils produisent 620 hectares de récolte
    perdue au lieu de 200 hectares de récolte réussie. Ce n''est pas une préférence, c''est une division.
    Le même volume irrigue correctement **environ 180 à 230 hectares**.


    Par conséquent :


    1. **La profession dispose de 5 jours** pour proposer elle-même sa clé de répartition sous le plafond
    global : quelles parcelles sont irriguées, lesquelles sont délibérément abandonnées, quel tour d''eau.
    Elle détient l''information que nous n''avons pas (cultures, stades, valeurs). Cette proposition doit
    être accompagnée des déclarations parcellaires — c''est le prix de l''autogestion.

    2. **À défaut, la commission applique une clé par défaut** : un socle de 0,8 L/s par exploitation
    (protège le seuil de survie des petites structures, qui n''ont aucune diversification), le solde au
    prorata de l''hectare déclaré. Je signale le risque juridique d''une modulation trop forte au regard
    de l''égalité devant les charges publiques : le socle est plus défendable qu''un barème dégressif.

    3. **Rationnement par le temps et l''équipement, pas par le volume** — seule modalité contrôlable
    sans compteurs : tour d''eau par secteur (1 jour sur 4), plages horaires **21 h - 9 h uniquement**
    (l''irrigation nocturne restitue 20 à 30 % d''efficience : c''est du débit gagné, pas seulement du
    débit retiré), aspersion diurne interdite, débit instantané plafonné par diamètre de buse plombé et
    vérifiable à l''œil.

    4. **Sanction opérationnelle** : une exploitation contrôlée hors de son créneau perd son créneau suivant.
    Un plan sans moyen de contrôle est un plan qui garantit le pire résultat — réservé franchi *et* eau
    mal employée.


    ### 6. Le dispositif de levée de 2022 était défaillant : il est remplacé


    L''orage du 9 août a fait 520 L/s, les prélèvements ont repris le 11, le débit est retombé à 340 en
    quatre jours. Un orage restitue du ruissellement, pas de la nappe. Le critère « 48 h au-dessus du
    seuil » mesurait un pic et croyait mesurer un état. Nouveau dispositif :


    - Levée sur **moyenne mobile 10 jours**, jamais sur un événement.

    - **Second critère indépendant et non falsifiable par un orage : le niveau piézométrique** doit être
    stable ou en hausse sur 10 jours.

    - **Levée par paliers** (un palier de l''échelle du § 4 à la fois), minimum 10 jours entre deux paliers.
    Le resserrement, lui, est immédiat : hystérésis asymétrique assumée.

    - **Condition d''arrêt automatique** : si la station aval enregistre moins de 180 L/s pendant 24 heures
    consécutives, **tout prélèvement agricole est suspendu sous 12 heures, sans réunion et sans délibération
    nouvelle**. Cette clause est votée jeudi, précisément pour ne pas avoir à la voter dans l''urgence.

    - Fin du dispositif : 30 septembre, ou 15 jours après retour durable au-dessus de 480 L/s, la date
    la plus tardive prévalant.


    ### 7. Les 600 000 € : acheter des comportements, pas indemniser un échec


    Répartis en indemnisation, 600 k€ couvrent 15 % des 4,1 M€ annoncés : symbolique, et ils ne satisferont
    personne. Affectation proposée :


    - **150 k€** — compteurs télérelevés sur tous les points de prélèvement autorisés, jaugeage indépendant,
    station de contrôle aval. *C''est la condition pour que l''été 2027 se joue en quotas individuels
    équitables plutôt qu''en volume global grossier.*

    - **330 k€** — **rachat de mise en jachère ciblée** : on paie l''abandon délibéré des parcelles à
    plus faible marge, avec **conditionnalité au maintien des contrats saisonniers** (activité partielle,
    chantiers de substitution). Les 90 emplois sont la part réellement irrécupérable de la perte agricole
    ; le chiffre d''affaires, lui, est reportable et partiellement assurable. Le fonds va donc aux emplois,
    pas aux hectares.

    - **60 k€** — sécurisation AEP : bâche autonome et contrat de citernage pour l''EHPAD (4 jours de
    réserve pour 110 personnes vulnérables est un point de rupture inacceptable — **cette mesure est engagée
    sans attendre le vote**), campagne de recherche de fuites.

    - **60 k€** — moyens de contrôle et réserve.


    ### 8. Ce que je dis à chacun


    **Aux maraîchers, qui ont quitté la salle.** Votre absence ne suspend pas l''étiage, mais elle ne
    vous prive de rien : je vous remets la seule décision que vous êtes mieux placés que nous pour prendre
    — la répartition interne de votre volume. En contrepartie, j''attends vos données parcellaires. Vous
    demandez 240 L/s en annonçant une perte totale en dessous : je n''ai aucun élément pour vérifier ce
    seuil, et l''agronomie ne connaît pas de fonction en marche d''escalier. Vous obtenez 105 L/s, plus
    15 conditionnels, plus une échelle qui vous dit dès aujourd''hui ce qui vous attend à 350 L/s, plus
    330 000 € orientés vers vos saisonniers. C''est moins que ce que vous demandez et plus que ce qu''un
    contentieux vous rapportera en octobre.


    **À la régie, qui refuse de discuter.** Votre garantie est accordée avant la discussion, pas après
    : 45 L/s de socle sanitaire, servis en premier quel que soit le débit, plus le citernage de l''EHPAD
    financé cette semaine. En échange, vous produisez sous 7 jours la décomposition de vos 150 L/s et
    votre rendement de réseau. 1 400 litres par habitant et par jour n''est pas une dotation sanitaire,
    et je ne peux pas la défendre publiquement sans en connaître la composition.


    **À la presse et au public.** Le dossier n''oppose pas « les paysans » aux « robinets ». Aucun robinet
    ne sera fermé. L''arbitrage réel oppose ce qui se rejoue dans un an à ce qui ne se rejoue pas avant
    dix ans — et le premier litre à trouver n''est ni dans un champ ni dans un évier : il est dans les
    fuites du réseau et dans l''eau évaporée par l''aspersion de 14 heures. Le bilan complet, y compris
    l''incertitude sur notre propre mesure, sera publié.


    ### 9. L''objection la plus forte contre ma position


    C''est celle-ci : *« vous sacrifiez 4,1 M€ et 90 emplois réels et documentés à une population de truites,
    sur la foi d''une mesure dont vous admettez vous-même qu''elle peut être fausse de 15 %. »*


    Elle est sérieuse et je l''assume ainsi : je ne sacrifie pas 4,1 M€, je constate que le débit disponible
    est de 410 L/s et que 180 d''entre eux sont juridiquement hors de ma main. Sur les 230 restants, j''ai
    déplacé l''effort vers l''usage dont le dommage est monétisable, partiellement assurable et rejouable,
    et j''ai concentré l''argent public sur la fraction du dommage qui ne l''est pas — l''emploi. Et parce
    que la mesure peut effectivement être fausse, le plan est construit pour l''être : marge gelée, jaugeage
    sous 10 jours, révision programmée, et l''écart favorable revient aux maraîchers, pas au budget.


    **Ce qui me ferait réviser cette position :** un jaugeage indépendant établissant un débit réel supérieur
    à 460 L/s ; ou la démonstration que le rejet de la STEP est en amont de la section de contrôle, auquel
    cas une part du « déficit » est comptable et non physique. Dans l''un ou l''autre cas, je convoque
    une séance extraordinaire sous 72 heures et l''irrigation remonte d''un palier. Je n''ai pas besoin
    d''un nouveau vote pour desserrer : je l''ai prévu dans la délibération.


    ---


    **Ce qui est soumis au vote jeudi :** la répartition du § 4, l''échelle graduée, la clause d''arrêt
    automatique à 180 L/s aval, la délégation de clé interne à la profession sous 5 jours, l''affectation
    du fonds. **Ce qui est déjà engagé sans attendre le vote :** le citernage de l''EHPAD, le jaugeage
    indépendant, la localisation du rejet de la STEP et des frayères.

    '
