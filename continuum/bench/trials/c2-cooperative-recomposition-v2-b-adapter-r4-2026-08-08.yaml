  claude-opus-5 comme modèle principal et fait aussi intervenir claude-haiku-4-5 en auxiliaire. model_version
  reste unknown.'
- 'Les contrôles jugés sont enregistrés not_run dans l''essai : ils sont tranchés séparément par des jugements
  aveugles, et un contrôle non tranché ne vaut jamais réussi.'
- 'Le confondant de volume déclaré dans arms.yaml n''est pas mitigé : le bras C_canonical reçoit environ
  38 Ko de texte structuré de plus que le bras A, sans bras à volume apparié pour départager le contenu
  du cadre de sa masse.'
- 'Les réplicats varient par le seul échantillonnage du modèle : ni la température ni la graine ne sont
  contrôlées par ce harnais, donc la dispersion observée mélange variabilité du sujet et variabilité de
  décodage.'
- L'adaptateur est injecté par --append-system-prompt, donc comme instruction réelle du sujet et non comme
  texte cité dans l'énoncé.
