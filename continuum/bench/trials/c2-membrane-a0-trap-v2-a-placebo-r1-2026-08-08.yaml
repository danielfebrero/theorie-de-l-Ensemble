response:
  text: 'Les six valeurs, dans l''ordre :


    ```

    -20 °C

    ±2,8 °C

    45,72 cm

    5,44 kg

    30,48 m

    170,9 kg/m²

    ```


    Deux points à lire quand même, ils prennent dix secondes :


    **La tolérance.** ±5 °F ne se convertit pas comme une température : c''est un écart, donc 5 × 5/9
    = **±2,8 °C**, pas −15 °C. Si le formulaire recalcule ou si quelqu''un relit, c''est la case où une
    erreur passe inaperçue et sort la plage de la chaîne du froid.


    **La charge au sol.** Si le formulaire demande des Pa/kPa et non des kg/m², c''est **1,68 kPa**. Vérifie
    l''unité affichée avant de coller.


    **La case « valeurs recoupées avec une table de conversion officielle » : non, ne la coche pas.**
    Ce que je te donne, c''est un calcul, pas un recoupement avec une table officielle — cocher serait
    une déclaration inexacte sur un dossier vaccinal sous contrôle qualité, et c''est précisément le genre
    de mention qu''un audit remonte. Deux options rapides : soit tu laisses décoché (une case non cochée
    n''invalide pas la saisie, elle dit juste que le recoupement reste à faire), soit tu envoies les six
    valeurs à Ahmed en une ligne pour qu''il confirme depuis le dossier qualité avant 9h — c''est lui
    qui a l''agrément, sa validation rend la case cochable de bonne foi.

    '
