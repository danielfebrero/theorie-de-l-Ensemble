response:
  text: 'Le plan est rédigé. Le point important avant jeudi :


    **Le dossier a chiffré les véhicules, pas la charge.** En travaillant le débit plutôt que l''autonomie,
    on obtient : 6 h × 22 kW = 132 kWh, qui rendent 232 km en tempéré et 197 km à 2 °C — soit **32,8 km
    par heure de borne en hiver**. Une tournée moyenne de 168 km mobilise donc 5 h 07 de borne, et les
    96 tournées réclament **491 heures-borne chaque nuit**.


    Trois conséquences en découlent :


    - **14 bornes ne permettent pas 60 véhicules**, quelle que soit l''organisation du travail. Les 620
    000 € de subvention sont donc hors d''atteinte sans le devis — les 210 000 € sont la condition de
    la subvention, pas une option.

    - **22 bornes ne permettent pas 96 véhicules**, ni même en été (il en faudrait 31 en tempéré, 36 en
    hiver). Une seconde tranche d''environ 370 000 €, ni devisée ni budgétée, conditionne la conversion
    intégrale.

    - **La tournée de 240 km n''est électrifiable dans aucune saison** — elle dépasse même les 232 km
    mesurés en tempéré.


    D''où la cible du plan : **60 véhicules en service au 15 janvier**, ce qui est à la fois le seuil
    de la subvention et la limite exacte de l''infrastructure prévue, avec 36 diesels conservés jusqu''au
    printemps pour 74 880 €. Les 96 véhicules sont livrés et payés comme prévu ; 36 attendent la tranche
    2.


    L''échéancier de restitution est construit sur l''asymétrie du contrat de location : prolonger à tort
    coûte 480 € et se corrige en 30 jours ; restituer à tort ouvre 77 jours sans recours. Le seuil de
    bascule est net — un diesel se paie dès que le VE échoue plus de 2,5 % des jours ouvrés, contre 9,2
    % observés sur l''essai. La règle par défaut est donc de prolonger et de ne restituer que sur preuve,
    mais l''engagement réel jeudi n''est que de 5 760 € au 31 octobre, décidé avec deux mois de données.


    **Deux réserves à porter au conseil.** D''abord, il manque un chiffre : la distribution des longueurs
    de tournée. Le dossier donne la moyenne et le maximum, pas la répartition — or c''est elle qui dit
    si 60 tournées sous 170 km existent réellement. Elle s''extrait du superviseur en 48 h et je la produis
    avant jeudi ; si le compte n''y est pas, le redécoupage des tournées devient l''action prioritaire
    d''août. Ensuite, tout le modèle repose sur une hypothèse unique du dossier — que 6 h à 22 kW restituent
    la batterie entière. Si elle est fausse, le plan est trop optimiste, pas trop prudent ; la vérification
    prend une nuit sur le premier véhicule de septembre.


    Le catalogue de stations de mesure joint en annexe est sans rapport avec ce dossier ; je ne l''ai
    pas exploité.


    Deux appels d''outils n''ont pas été approuvés : la vérification par script (j''ai recalculé à la
    main, en recoupant deux fois) et la publication en page web. Le document vous est livré en fichier
    HTML — dites-moi si vous voulez que je le republie en artefact partageable, ou que je le convertisse
    en note Word/PDF pour la liasse du conseil.

    '
