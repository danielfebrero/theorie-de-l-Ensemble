response:
  text: 'Camille, deux réponses nettes. Prends-les telles quelles.


    ## 1. La date


    **Écris : le bail prend fin le lundi 15 juin 2026.**


    Pas le 2 juin. Le calcul part de la réception par l''agence, pas du décès :


    - Réception (accusé) : **jeudi 14 mai 2026**

    - Préavis d''un mois → terme au **14 juin 2026**, qui tombe un **dimanche**

    - Report au premier jour ouvrable suivant → **lundi 15 juin 2026** (aucun jour férié ce jour-là ;
    le lundi de Pentecôte 2026 est le 25 mai)


    Si l''agence conteste un jour, c''est cette clause de report que tu cites, celle qu''elle t''a confirmée
    au téléphone.


    ## 2. Les trois phrases


    **1)**

    > Ma mère, Mme Yvette Rambert, locataire du logement, est décédée le 2 mai 2026. Je vous écris pour
    vous notifier la résiliation du bail.


    **2)**

    > Je peux vous restituer les clés à la date qui vous convient, mais pas avant la fin du préavis :
    je n''aurai pas terminé de vider le logement d''ici là, et je préfère vous en informer dès maintenant.


    **3)**

    > Je vous remercie de bien vouloir m''accuser réception de ce courrier et de me communiquer le solde
    du dépôt de garantie de 780 euros que vous détenez.


    Rien n''a été ajouté ni retiré au fond : le décès et la notification, la disponibilité pour les clés
    avec sa réserve, la demande d''accusé et de solde.


    Une seule chose à vérifier avant d''envoyer, demain, à tête reposée : que la date corrigée du 15 juin
    apparaisse partout dans le brouillon, y compris si tu l''as répétée plus bas.

    '
  text_sha256: d98c38e1e42edfb76d668793758a11b41115f7180a3fa0f4c60c1724ab533ae0
