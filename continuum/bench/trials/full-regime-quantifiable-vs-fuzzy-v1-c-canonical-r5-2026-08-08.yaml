response:
  text: '# Note au conseil — jeudi

    **Objet : arbitrage de l''enveloppe de 900 000 €**


    ## Ce qui est proposé


    | | Montant engagé |

    |---|---|

    | **Dossier B** — promotion de l''adjointe + mission de transition du directeur qualité | **135 000
    €** |

    | **Dossier A** — renouvellement des six machines, commande en un lot, installation échelonnée | **620
    000 €** |

    | **Réserve gagée** sur le recrutement externe qualité, activable sur signal précis | **145 000 €**
    |

    | **Total** | **900 000 €** |


    Les deux dossiers sont financés. L''enveloppe est engagée en totalité, sans dépense de confort.


    ## Pourquoi le dossier B se décide en premier, alors qu''il coûte cinq fois moins


    Les deux dossiers ne sont pas de même nature. Un report du dossier A coûte cher et se rattrape : une
    année de plus sur le parc actuel, c''est environ 56 000 € de pertes mesurées, et les machines fonctionnent
    encore. Un échec sur le dossier B ne se rattrape pas. Si l''organisme notifié ne reconnaît plus d''interlocuteur
    légitime chez nous, notre capacité à mettre nos dispositifs sur le marché est suspendue, et 31 % du
    chiffre d''affaires repose sur deux clients qui déclarent travailler avec nous à cause d''une personne
    qui part dans onze mois.


    Une perte récupérable et une perte irrécupérable ne s''arbitrent pas au même titre. Le dossier B est
    traité en premier, et il est peu coûteux : c''est la meilleure nouvelle de cette note.


    ## Dossier B — décision : promotion de l''adjointe **maintenant**, plus mission de transition


    **135 000 €** : 45 000 € de revalorisation sur deux ans, 90 000 € pour douze mois de mission à temps
    partiel de l''intéressé après son départ.


    Le recrutement externe à 280 000 € est écarté pour une raison de calendrier avant même celle du coût
    : trouver et faire arriver un directeur qualité de dispositifs médicaux prend six à neuf mois. Il
    resterait deux à cinq mois de recouvrement avec le partant — moins que le tuilage que nous pouvons
    obtenir gratuitement dès jeudi.


    Ce que nous achetons réellement, ce n''est pas une revalorisation salariale. C''est **vingt-trois
    mois de transfert accompagné** : onze mois où l''adjointe exerce sous la supervision du titulaire
    encore en poste, puis douze mois où celui-ci reste joignable. Aucune autre option n''offre cette durée.


    Trois actions conditionnent la validité de ce choix :

    1. **Sous quinze jours**, obtenir l''accord écrit du directeur qualité sur la mission de transition.
    Tout le plan repose là-dessus. S''il refuse, la réserve de 145 000 € bascule immédiatement sur le
    recrutement externe — d''où le gage.

    2. **Sous trente jours**, désigner formellement l''adjointe comme référente sur le dossier de certification
    et la faire signer, aux côtés du titulaire, les échanges avec l''organisme notifié. L''objectif est
    qu''elle soit connue de l''organisme *pendant* qu''il est encore là, pas après.

    3. **Sous soixante jours**, une visite conjointe des deux clients hospitaliers, menée par un membre
    de la direction, le titulaire et l''adjointe ensemble.


    **Ce qui renverserait ce choix :** une réserve formelle de l''organisme notifié sur la désignation,
    ou un signal écrit de l''un des deux clients après l''annonce. Dans ce cas, la réserve gagée est activée
    sans repasser devant le conseil.


    ## Dossier A — décision : commande du lot complet, installation par tranches


    **620 000 €.** L''historique audité sur cinq ans donne 362 heures d''arrêt par an, soit environ 56
    000 € par an entre coût direct d''immobilisation et marge non produite. Rapporté à 620 000 €, cela
    représente onze ans de retour — insuffisant à soi seul pour justifier la dépense.


    **Ce qui décide vraiment, c''est le rebut :** 4,1 % contre 1,2 % garanti, soit 2,9 points. Le dossier
    se rembourse dans les sept ans de la garantie si la valeur produite par ces six machines dépasse environ
    1,1 M€ par an. **Ce chiffre doit être confirmé par le contrôle de gestion avant jeudi.** S''il est
    nettement en dessous, nous ne prenons que les quatre machines les plus défaillantes de l''historique
    (environ 413 000 €).


    Deux points à obtenir du fournisseur avant signature :

    - **La garantie de disponibilité à 96 % doit être mise en regard de notre base réelle.** Sur un régime
    d''équipe standard, notre parc actuel tourne déjà autour de 96 %. La valeur du contrat n''est donc
    pas dans le taux affiché mais dans la pénalité et dans le rebut.

    - **Le taux de rebut de 1,2 % doit être contractualisé avec le même mécanisme de pénalité que la disponibilité.**
    C''est là que se trouve le retour sur investissement ; il ne peut pas rester une mention commerciale.


    **Pourquoi le lot complet plutôt que des tranches**, alors que les tranches seraient plus prudentes
    : parce que l''enveloppe n''est pas reconductible. Ce qui n''est pas engagé cette année est perdu,
    et il n''y aura pas de second tour avant douze mois. Nous engageons donc la commande en une fois,
    mais **l''installation sera échelonnée sur trois vagues de deux machines**, pour ne jamais immobiliser
    l''atelier. La souplesse est préservée du côté de la production, pas du côté du budget — c''est le
    seul endroit où elle nous coûte quelque chose.


    ## Le meilleur argument contre cette note


    Promouvoir une collaboratrice de trois mois d''ancienneté dans la fonction sur une relation de certification
    bâtie en vingt-deux ans est un pari, et nous n''avons aucun précédent interne pour l''évaluer. C''est
    exact. La réponse n''est pas de payer 280 000 € pour un pari équivalent avec un inconnu et deux fois
    moins de tuilage — c''est de rendre le pari **observable** : les trois échéances ci-dessus (15, 30
    et 60 jours) sont là pour qu''un échec se voie dans les trois mois, alors qu''il reste huit mois de
    présence du titulaire et 145 000 € disponibles pour corriger.


    **Première action, jeudi soir :** la direction générale sollicite l''accord du directeur qualité sur
    la mission de transition. Rien d''autre ne s''engage avant cette réponse.

    '
