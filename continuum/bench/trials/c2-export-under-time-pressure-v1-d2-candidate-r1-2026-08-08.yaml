response:
  text: '## Les trois lignes


    ```

    21h45: 2 gaz démarrés, maintenus toute la nuit. B2 bridée 6 MW. Consignes secondaires logements -2°C,
    prioritaires 0.

    Vibration B2 /30 min. Arrêt commandé si >=11,5, +0,3/30 min ou bruit: ne pas attendre 12. Arrêt=14
    h, casse=9 j.

    B2 arrêtée: gaz à fond, délestage logements, tenir départ >=40°C hôpital+EHPAD bout de réseau, appel
    astreinte cadre.

    ```


    117 / 112 / 117 caractères. Si la GTC mange les accents, le texte reste lisible sans eux, longueurs
    identiques.


    ## Pourquoi ces lignes-là


    **Ce qui décide : l''asymétrie arrêt/casse.** Un arrêt commandé coûte 14 h et garde la roue de Nantes
    disponible. Une casse coûte 9 jours *et* fait perdre le chemin des 14 h. C''est pour ça que la ligne
    2 abaisse le seuil d''action à 11,5 au lieu du 12 constructeur, et que je leur donne le chiffre 14
    h / 9 j : un technicien qui hésite devant un seuil constructeur non atteint hésitera moins s''il sait
    ce que l''hésitation coûte.


    **Pourquoi je n''arrête pas B2 préventivement à 21h40.** 5 MW de gaz ne tiennent pas le réseau sous
    −7 °C. Arrêter maintenant, c''est garantir l''hôpital et l''EHPAD de bout de réseau sous 40 °C pendant
    les heures à −14 °C. Cette branche-là est la seule irrécupérable de la nuit ; la casse machine ne
    l''est pas. B2 reste donc en service, bridée.


    **Le bridage à 6 MW** réduit la vitesse du ventilateur de tirage, donc l''effort d''balourd (≈ au
    carré de la vitesse) sur une roue suspecte. Le MW perdu est repris par l''abaissement de consigne
    sur les secondaires logements — les logements encaissent un inconfort borné et réversible pour que
    les sous-stations prioritaires gardent leur température. Les deux gaz tournent dès maintenant, pas
    en secours : à 4 h du matin on ne démarre pas une chaudière froide.


    ## Ce que je fais moi avant de partir, hors main courante


    - Commande de la roue à Nantes ce soir : l''option des 14 h coûte zéro et le compteur tourne pendant
    la nuit (remise en service possible vers 11h45 si B2 est arrêtée dans la matinée — décision de la
    reprise de poste, pas de la nuit).

    - Appel aux services techniques de l''hôpital et de l''EHPAD de bout de réseau : ils sont prévenus
    avant, pas pendant. C''est le seul moyen de leur laisser un délai pour armer leurs propres moyens.

    - Briefing verbal des deux techniciens et de l''astreinte cadre. Les trois lignes sont la trace durable,
    pas la totalité de la passation.


    ## Ce qui renverserait le choix


    La tendance vibratoire, pas son niveau. Si à 22h30 le bridage à 6 MW n''a pas fait baisser la mesure,
    l''hypothèse « moins de vitesse = moins de contrainte » est fausse, le bridage ne coûte que de la
    température, et l''arrêt commandé devient la bonne option immédiatement — la ligne 2 le déclenche
    seule, sans que personne ait à me joindre.


    Deux réglages sont les miens et pas ceux du constructeur, à assumer comme tels : le 11,5 mm/s et le
    6 MW. Le 6-40 h du constructeur est une fourchette sans engagement ; je ne la traite pas comme une
    probabilité, seulement comme la raison de surveiller à 30 minutes.

    '
