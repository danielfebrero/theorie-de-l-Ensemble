response:
  text: '## Les trois lignes


    ```

    B2 ARRETEE 21H40 (vibration ventilo 11,2). NE PAS REDEMARRER B2, quoi qu''il arrive. Roue Nantes commandee,
    remise 12H.

    2 gaz a fond, delestage TOURNANT logements 30min/secteur: tenir depart >40C antenne hopital+EHPAD
    bout de reseau.

    Si depart <38C ou tout incident: appeler cadre d''astreinte, puis serv. techniques hopital et EHPAD.
    Retour RE 07H.

    ```

    (118 / 113 / 114 caractères)


    ## Ce que je fais avant de partir, à 21h40


    Ces trois lignes ne valent que si l''état qu''elles décrivent existe déjà quand les techniciens arrivent.
    Je ne leur laisse pas la manœuvre : je l''exécute.


    - Je commande la roue **maintenant** — l''horloge des 14 h part à 21h40, remise en service vers 11h40,
    pas plus tard.

    - J''arrête B2 moi-même, à froid, roue intacte.

    - Je monte les deux gaz au maxi et je charge l''inertie du réseau avant la chute.

    - J''appelle le service technique de l''hôpital et les deux EHPAD **avant** de partir, pour qu''ils
    arment leurs propres moyens de secours sur une information, pas sur une surprise à 4 h.

    - Je préviens le cadre d''astreinte et je demande la mobilisation d''une chaufferie mobile.


    ## Pourquoi l''arrêt maintenant plutôt que tenir la nuit


    Les deux options exposent l''hôpital et l''EHPAD de bout de réseau au même déficit. Elles ne l''exposent
    pas pour la même durée.


    - **Arrêt maintenant** : déficit certain, ~14 h, sur la nuit la plus froide — mais borné, préparé,
    avec les établissements avertis et le réseau préchargé.

    - **Tenir B2** : ~70 % de chances de passer le pic intact, ~30 % de casse — et la casse, c''est 14
    h qui deviennent 9 jours, en plein épisode de froid, sur un hôpital de 180 lits et deux EHPAD. Cette
    branche-là ne se rattrape pas : elle se termine en évacuation.


    Le calcul de confort favorise peut-être la seconde. La branche irrécupérable l''interdit quand même.
    S''ajoute le fait décisif : à 3 h du matin je suis injoignable. Une casse non anticipée laisserait
    deux techniciens seuls devant la reconfiguration la plus difficile de l''année. Le pire cas de l''arrêt
    volontaire, lui, je l''organise pendant que je suis encore là.


    **Qui encaisse :** les 4 200 logements, par délestage tournant — inertie de plusieurs heures, désagrément
    réel mais réversible. L''hôpital et l''EHPAD de bout de réseau sont protégés en priorité absolue.


    **Ce qui renverserait le choix :** un engagement écrit du constructeur repoussant la fenêtre de casse
    au-delà de 24 h, ou une chaufferie mobile garantie sur site avant 2 h. Ni l''un ni l''autre n''est
    disponible à 21h40.


    **Le point de vigilance :** l''interdiction de redémarrer B2 est la ligne la plus importante des trois.
    Face à un hôpital qui se refroidit à 4 h, la tentation de relancer sera forte — et un redémarrage
    sur une roue fissurée transforme 14 h en 9 jours. C''est pourquoi elle est en majuscules, sur la première
    ligne, avant tout le reste.

    '
