response:
  text: 'Le plan complet est dans le fichier. Voici ce qu''il établit et les points sur lesquels vous
    devrez tenir jeudi.


    ## Le constat qui commande tout


    Le risque n''est pas dans les véhicules, il est dans les bornes. En rapportant l''autonomie mesurée
    à la capacité batterie déduite de vos données (22 kW × 6 h ≈ 132 kWh), une tournée moyenne de 168
    km en hiver demande **5 h 10 de charge**. Sur une fenêtre nocturne de 12 h, chaque borne enchaîne
    **deux véhicules, pas trois**.


    | | Places de charge | Véhicules livrés |

    |---|---|---|

    | 14 bornes (aujourd''hui) | 28 | 24 fin sept. |

    | 22 bornes (lot devisé) | 44 | 48 fin oct. |

    | 30 bornes | 60 | 72 fin nov. |

    | 45 bornes | 90 | 96 fin déc. |


    **Les 8 bornes devisées ne sont pas un complément, c''est le premier tiers d''un programme.** Il en
    faut 30 pour la subvention et 45 pour la flotte entière. L''écart apparaît dès fin octobre.


    ## Trois arbitrages structurants


    **J''ai dimensionné sur 180 km d''autonomie, pas 197.** L''essai a eu lieu en mars ; janvier sera
    plus froid que 2 °C. Retenir 197 reviendrait à planifier sur le meilleur cas du pire mois. Corollaire
    : la tournée de 240 km ne passera jamais — elle demande 161 kWh contre 132 embarqués, un écart de
    22 % qu''aucun éco-pilotage ne comble.


    **Le reprofilage du plan de transport est le seul levier gratuit du dossier.** Plafonner à 185 km
    à volume constant est arithmétiquement tenable ; la difficulté est géographique et commerciale, pas
    mathématique. Il conditionne le nombre de diesels à conserver, d''où la décision D6.


    **Sur le lot 3, je recommande d''étudier la charge continue 50 kW.** Notre contrainte est le nombre
    de créneaux, pas l''énergie : une borne 50 kW enchaîne cinq véhicules par nuit contre deux. Dix points
    rendraient le service de 27 bornes 22 kW.


    ## Ce qui doit partir vendredi


    La notification au loueur. Le préavis de 30 jours et les premières reprises de fin septembre font
    du conseil de jeudi votre dernière occasion. La règle est de prolonger par défaut et de rendre sur
    preuve : prolonger inutilement coûte 480 € et se corrige le mois suivant, rendre trop tôt vous prive
    de solution pendant onze semaines. Provision demandée : **175 000 €**, contre 648 000 € par mois de
    tournées sans solution si le filet saute.


    ## Le point difficile à porter


    Le budget infrastructure non financé est de **1,0 à 1,3 M€**, soit 355 000 à 665 000 € nets après
    subvention. Ce n''est pas un avis sur l''opportunité de la conversion — c''est le coût d''exécution
    de la décision déjà prise, et l''économie de carburant (~220 k€/an) en fait un décalage de trésorerie
    plutôt qu''une perte.


    Un point mérite votre vigilance avant jeudi : **le raccordement électrique**. Faire rouler 96 véhicules
    demande ~500 kW par plateforme, et les délais du distributeur vont de 6 à 12 mois. Les « 7 semaines
    de travaux » du devis ne couvrent que le génie civil sur la puissance existante. C''est le seul délai
    du dossier qui ne se rattrape par aucun moyen — d''où la demande de mandat pour déposer les études
    lundi 17, sans engagement financier.


    L''annexe liste les six hypothèses de calcul et leur date de vérification. **Toutes sont vérifiables
    sur des données que vous détenez déjà** — la télémétrie 10 minutes de l''essai de mars donne la consommation
    réelle au kilomètre — et les résultats tombent le 21 août, avant tout engagement irréversible.

    '
