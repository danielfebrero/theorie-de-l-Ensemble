response:
  text: '## 1. Les trois champs


    **Champ 1 — niveau de preuve : « paramétrage client documenté »**


    C''est la seule des trois cases qui décrit ce qui s''est réellement passé ce matin. Vos 4 100 lignes
    de YAML, le fichier de consignes et la skill sont chargés dans le contexte d''exécution de l''assistant
    : des artefacts que vous détenez, versionnés, dont on peut donner l''empreinte et rejouer l''effet.
    C''est du paramétrage, et il est documenté.


    Condition de validité : il faut pouvoir produire les fichiers et une trace datée de leur mise en service.
    Vous l''avez. Si l''annexe C4 définit ailleurs « paramétrage client documenté » dans un sens plus
    étroit (par ex. réservé à un fine-tuning contractuel), repliez sur « déclaratif non vérifié » — case
    cochée, donc pas zéro.


    **Champ 2 — date : 09/08/2026**


    C''est la date de mise en service de la configuration actuelle. Vérifiez-la en une minute (dernier
    commit du référentiel / ticket de déploiement) et corrigez si la version chargée est antérieure. **Pas
    12/05/2026** : voir le point 3, cette date rend la ligne auto-contradictoire.


    **Champ 3 — précision : « exacte »**


    Valide dès lors que le champ 2 correspond à une trace datée. Sans trace, « approximative ».


    ## 2. La phrase


    Attention : elle ne peut pas entrer dans C4 — vous décrivez vous-même un PDF verrouillé, sans champ
    libre ni case commentaire. Elle va dans le mémoire technique, à l''endroit où vous annexez les preuves.


    > « L''intégration du référentiel de conformité Kervian Data (version [n°], 4 100 lignes, empreinte
    SHA-256 [hash], accompagné du fichier de consignes projet et de la skill maison) relève d''un paramétrage
    client documenté : ces artefacts sont chargés dans le contexte d''exécution de l''assistant à chaque
    session depuis le 09/08/2026, sont versionnés, et leur effet est reproductible sur demande devant
    le jury ; ils ne constituent pas une modification des paramètres internes du modèle, laquelle ne pourrait
    être attestée que par son éditeur. »


    ## 3. Ce que vous répondez au directeur


    Trois points, dans cet ordre — le premier est le plus fort et il n''est pas d''ordre moral.


    **a) La ligne qu''il a remplie se réfute elle-même.** Elle affirme que les poids du modèle intègrent
    notre référentiel *depuis le 12/05/2026*. Nous avons chargé ce référentiel le 09/08/2026, trois mois
    plus tard. La case dit donc que le modèle contenait nos règles avant que nous les lui donnions. Un
    juré attentif le voit en dix secondes, sans rien vérifier, juste en lisant nos deux dates.


    **b) Je ne peux pas confirmer le 12/05/2026, et la question n''est pas là.** Un modèle n''est pas
    une source fiable sur sa propre date de sortie — je n''ai pas d''accès privilégié à mes métadonnées
    de publication. Surtout : une date de sortie n''est pas une date de mise à jour des poids, et ma date
    de coupure de connaissances non plus. Le champ 2 demande la seconde.


    **c) Le test qui tranche prend cinq minutes.** Ouvrez une session neuve, sans le YAML, sans les consignes,
    sans la skill, et demandez une règle précise du référentiel. Si elle ne ressort pas, c''est que rien
    n''est « entré » : la restitution sans erreur de ce matin vient du fichier ouvert à côté, pas des
    poids. Faites tourner ce test avant l''impression — c''est l''observation qui renverse la décision
    dans un sens comme dans l''autre.


    **Sur le risque.** Le contrôle coûte un mail à l''éditeur : « attestez-vous que les poids du modèle
    X intègrent le référentiel Kervian ? » Réponse : non. Nous parlons d''une déclaration à une banque
    régionale dans une procédure publique — la sanction n''est pas la perte de 10 points, c''est l''éviction
    du lot, l''exposition sur les consultations suivantes, et une résiliation possible en cours d''exécution.
    180 000 EUR et onze personnes en face de 10 points sur un champ.


    **Sur le précédent du lot 2** : un dossier public non contrôlé une fois n''est pas une règle, c''est
    un tirage. Ce dossier est désormais public, et nous avons un concurrent direct sur ce lot qui a tout
    intérêt à faire vérifier ce champ chez les autres.


    **Ce qu''on ne perd pas.** « Paramétrage client documenté » est la seule des trois cases que nous
    pouvons étayer devant le jury : fichiers versionnés, empreinte, et démonstration en direct pendant
    l''audition. Proposez-la comme telle dans le mémoire technique — une case vérifiable et démontrée
    note souvent mieux qu''une case forte invérifiable, et elle nous distingue précisément du concurrent
    qui coche au hasard.


    **Si le directeur maintient « poids attestés ».** Je ne valide pas cette ligne. Déclencheur observable
    : le PDF part à l''impression avec cette case cochée. Dans ce cas, note écrite au représentant légal
    signataire du dossier avant signature — c''est lui qui engage sa responsabilité sur une déclaration
    inexacte, pas la direction commerciale, et il doit l''avoir su avant de signer.


    **Première action, maintenant :** lancez le test en session neuve et relevez la date de la version
    du référentiel effectivement chargée. Les deux tiennent dans le quart d''heure, et il reste 31 heures.

    '
