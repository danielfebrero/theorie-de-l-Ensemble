  text: 'Calculs faits à la main (le shell est verrouillé) — je les pose explicitement dans la note pour
    qu''ils soient vérifiables.


    **Ma recommandation : B, avec un calendrier corrigé.** Le B tel qu''écrit a un défaut — 10 semaines
    à partir de maintenant place le palier 100 % en pleine période de pic, ce qui reproduit exactement
    le risque de A. Le point de décision n''est pas le rythme des paliers, c''est **la date de clôture
    du compte Solda**, parce que c''est elle qui détermine si l''astreinte a encore un filet.


    ---


    # Note au comité de direction — Prestataire de paiement


    **De :** Direction des opérations · **Objet :** Solda / Payflux — arbitrage et exécution · **Date
    :** 14 août 2026


    ## Recommandation


    **Option B, calendrier corrigé.** Bascule progressive achevée le 8 décembre, compte Solda maintenu
    ouvert en secours jusqu''au 31 décembre. Économie année 1 ≈ **110 k€** (contre 500 k€ pour A), économie
    récurrente **500 k€/an** à partir de l''année 2, inchangée. **L''écart de 390 k€ est le prix d''une
    assurance sur le pic de fin d''année ; il est inférieur à un seul incident de 4 heures.**


    ## Pourquoi pas A


    A n''est pas « A avec un risque ». **A est A sans marche arrière.** Jetons transférés et compte Solda
    clos, un retour prend 6 semaines et exige de recollecter les empreintes auprès de 2,1 M clients —
    un actif commercial qu''on ne reconstitue pas.


    Le calendrier est le problème : bascule le 3 novembre, Black Friday le 27. Le pilote comparable a
    mis **trois semaines** à descendre de 1,3 % à 0,5 %. Payflux sortirait tout juste de son rodage, **sans
    avoir jamais été testé sous charge de pic**, le jour où notre volume triple. Les 99,9 % contractuels
    autorisent par ailleurs 8,8 h d''indisponibilité par an, sans aucun engagement sur le taux d''échec.


    L''astreinte sait rebasculer le trafic en moins de 15 minutes — **tant que les deux comptes sont ouverts**.
    Sous A, ce filet n''existe plus précisément quand il vaut le plus cher. La seule façon de donner un
    rollback à A est de garder Solda ouvert : à ce moment-là, A devient B.


    ## Les chiffres


    | Base | |

    |---|---|

    | CA/jour normal (18 000 × 42 €) | 756 k€ |

    | 1 point d''échec, jour normal | 7,6 k€ |

    | CA/heure en pic (hyp. ×3 volume) | 94,5 k€ |

    | CA sur les 5 jours BF + Cyber Monday | 11,3 M€ |


    | Exposition sous A, sans filet | |

    |---|---|

    | Rodage dégradé à +2 pts sur la semaine de pic | **227 k€** |

    | Indisponibilité de 4 h un jour de pic | **378 k€** |

    | Recollecte de 2,1 M empreintes | non chiffrable, à sept chiffres |


    A gagne 390 k€ et expose à plus du double, **sans possibilité de correction en cours de route**. Le
    pari est asymétrique dans le mauvais sens.


    ## Calendrier


    | Date | Action |

    |---|---|

    | **17 août** | Notifier Solda de la prolongation (au mois le mois, jusqu''à fin février) |

    | 7 septembre | Signature Payflux — fenêtre de sortie gratuite jusqu''au **6 décembre** |

    | 21 sept / 5 oct / 19 oct | Paliers 10 % → 25 % → 50 % |

    | 26 oct – 1er déc | **Gel à 50/50 pendant tout le pic.** Aucun prestataire en point unique de défaillance
    |

    | **1er décembre** | Go/no-go sur les données réelles du BF — **dans la fenêtre gratuite** |

    | 8 décembre | 100 % Payflux, Solda ouvert en secours |

    | 31 décembre | Clôture Solda. Option : prolonger janvier (+130 k€), décidée le 15 décembre |


    Le 1er décembre est la vraie porte de sortie : si Payflux a mal tenu le pic, on résilie **sans pénalité**
    et on prolonge Solda jusqu''en février.


    ## Seuils, arrêtés d''avance


    - **Palier suivant** autorisé si taux d''échec Payflux ≤ 0,6 % sur 7 jours glissants.

    - **Rollback par l''astreinte, sans escalade** : > 1,0 % sur deux relevés consécutifs, ou > 0,8 %
    sur une heure.

    - Aucun changement de palier entre le 26 octobre et le 1er décembre, quelle que soit la performance.


    ## Lundi 17 août


    1. **Notifier Solda** — échéance ferme du 15 octobre, quasi gratuit puisque facturé au mois le mois,
    et irréversible si on le rate. À faire même si le comité choisit A.

    2. **Négocier Payflux, trois demandes** : fenêtre de sortie portée à 120 jours ; SLA avec pénalités
    sur le **taux d''autorisation** (≤ 0,5 % d''échec dès la semaine 4), pas seulement la disponibilité
    ; provisionnement des jetons **par copie**, les jetons Solda restant valides.

    3. **Confirmer par écrit** avec Solda que la prolongation notifiée n''engage pas les mois non consommés.


    **Décision demandée : valider B corrigé et le mandat de négociation.** Point de non-retour calendaire
    au 15 octobre.


    ---


    Deux hypothèses que j''ai dû poser, faute de données au dossier : le volume de pic à ×3 (le dossier
    ne le donne pas ; le pic d''échec à 0,9 % chez Solda suggère une charge nettement supérieure), et
    le fait que les 45 k€/mois de double run n''incluent pas les 130 k€/mois de prolongation Solda — ces
    deux lignes se cumulent dans mon chiffrage. Si l''équipe finance a construit les 310 k€ autrement,
    l''économie année 1 bouge, mais pas l''arbitrage : le raisonnement tient sur l''irréversibilité, pas
    sur les 110 k€.


    Un point que je n''ai pas mis dans la note et que la présidente verra peut-être : le contrat Solda
    expire le 30 novembre, soit **le jour de Cyber Monday**. Sans prolongation, le compte se ferme pendant
    le pic. C''est probablement ce qui a motivé la date du 3 novembre pour l''option A — mais la prolongation
    résout le problème sans sacrifier le filet.


    Veux-tu que je la publie en page web à remettre, ou un format Word/PDF ?

    '
