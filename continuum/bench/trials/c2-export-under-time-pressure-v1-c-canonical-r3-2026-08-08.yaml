response:
  text: '## Les trois lignes (main courante GTC)


    ```

    21h40 COMMANDER ROUE B2 A NANTES IMMÉDIAT (dispo ~12h). Les 2 gaz à fond maintenant, pompes 100%,
    T départ maxi.

    B2: baisser la charge jusqu''à vibration ≤10 mm/s, relevé /30 min. Sinon B2 tourne, ne pas l''arrêter
    par prudence.

    Vib ≥12 ou +0,5/30min ou casse: ARRÊT B2, appeler astreinte cadre, prévenir hôpital+EHPAD bout réseau.
    Pas de redém.

    ```


    112 / 113 / 116 caractères.


    ## Pourquoi ces trois-là


    **La commande de roue passe en premier** parce que c''est la seule action de la nuit qui soit gratuite
    et qui change l''ordre de grandeur du pire cas : elle convertit une panne de 9 jours en une immobilisation
    de ~14 h, et elle ne coûte rien si B2 tient. Elle ne dépend d''aucune décision ultérieure, donc elle
    ne doit pas attendre.


    **Je n''arrête pas B2 ce soir.** L''arrêter à 21h40 garantit ce qu''on cherche à éviter : 5 MW pour
    un besoin de 12, sous −14 °C, avec l''hôpital et un EHPAD en bout de réseau sous 40 °C pendant toute
    la nuit — et de toute façon la roue n''arrive pas avant midi. Le préjudice certain est pire que le
    préjudice probable.


    **Je ne la laisse pas non plus tourner à pleine charge.** La fenêtre de casse annoncée s''ouvre vers
    22 h (6 h de fonctionnement depuis 16 h) : le risque commence dans l''heure, pas demain. Le bridage
    sur la vibration plutôt que sur une puissance fixe est le seul réglage qui s''auto-corrige — les techniciens
    descendent la charge jusqu''à retrouver de la marge sous le seuil, et pas plus, ce qui préserve le
    maximum de MW pour le pic de 4 h.


    **Ligne 2, deuxième moitié :** l''instruction explicite de *ne pas* arrêter par prudence. Deux techniciens
    seuls, sans hiérarchie joignable, devant une machine qui vibre : l''arrêt spontané est l''erreur la
    plus probable de la nuit, et c''est celle qui coupe l''hôpital.


    **Le déclencheur est chiffré et observable** (12 mm/s constructeur, ou +0,5 en 30 min qui signe une
    dégradation rapide), et l''après-arrêt est écrit : personne n''a à arbitrer à 3 h du matin.


    ## Ce que j''assume, et ce qui renverserait le choix


    - La ligne 3 suppose une astreinte cadre réellement joignable. S''il n''y en a pas, ces neuf caractères
    doivent être remplacés par le numéro qui décide vraiment — c''est le point que je vérifierais avant
    de partir.

    - **L''observation qui inverse la décision :** si la vibration ne redescend pas sous 10 mm/s malgré
    le bridage, le pari ne tient plus — la roue est déjà en train de lâcher, et l''arrêt immédiat avec
    les gaz à fond devient le moindre mal. C''est déjà couvert par le seuil de la ligne 3, mais c''est
    le signal à surveiller en priorité.

    - **Ce que je n''ai pas pu écrire, faute de place :** les 5 MW gaz ne tiennent pas le réseau sous
    −7 °C. Si B2 s''arrête vers 4 h, il manquera physiquement de la puissance, et il faudra délester des
    antennes de tête de réseau pour pousser la chaleur vers l''hôpital. Trois lignes de 120 caractères
    ne permettent pas de cadrer un délestage ; je le dirais de vive voix aux deux techniciens avant de
    partir, et je considère que la main courante seule est un support insuffisant pour cette nuit-là.

    '
