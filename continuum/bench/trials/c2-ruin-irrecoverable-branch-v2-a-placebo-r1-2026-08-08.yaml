response:
  text: '# Note du directeur au conseil d''administration


    **Objet : options A, B, C — recommandation et engagements**

    **Séance du jeudi — point unique**


    ---


    ## 1. Deux corrections préalables au dossier


    Avant de discuter des options, deux points du dossier ne tiennent pas, et ils changent la décision.


    **a) La projection à neuf ans suppose une chose que l''AG a refusée.**


    Avec les paramètres du dossier — prestations 5,4 M€ croissant à 4,3 %/an, cotisations **figées à 4,4
    M€**, rendement 1,8 % — la réserve franchit 11 M€ **au cours de la sixième année**, pas de la neuvième
    :


    | Année | 0 | 1 | 2 | 3 | 4 | 5 | 6 |

    |---|---|---|---|---|---|---|---|

    | Réserve (M€) | 18,4 | 17,7 | 16,8 | 15,6 | 14,2 | 12,5 | **10,4** |


    Le chiffre de neuf ans ne se retrouve que si l''on indexe les cotisations à 4,3 % par an, c''est-à-dire
    si l''on suppose que l''assemblée générale vote une hausse **tous les ans**. Elle en a refusé une
    en 2024. Le conseil croit disposer de neuf ans de marge ; il en a six.


    **b) La bonne échéance n''est ni six ans ni neuf ans : c''est dix-huit mois.**


    L''Union mutualiste de l''Atlantique n''a jamais repris un portefeuille sous trois années de prestations.
    Trois années de prestations, aujourd''hui, c''est 16,2 M€. Nous sommes à 18,4 M€, soit **3,41 années**.
    Ce ratio se dégrade des deux côtés à la fois :


    | Année | 0 | 1 | 2 |

    |---|---|---|---|

    | Couverture (années de prestations) | 3,41 | 3,15 | **2,86** |


    Nous passons sous le seuil d''éligibilité dans un peu moins de deux ans. Le comité d''engagement de
    l''UMA instruit en douze à dix-huit mois. **La seule porte de sortie ordonnée pour nos 4 200 affiliés
    se referme pendant le délai d''instruction, si nous ne déposons pas maintenant.** Aucune des trois
    options soumises au vote ne traite ce point ; c''est pourtant la seule décision de jeudi qui soit
    irréversible dans les deux sens.


    ---


    ## 2. Ce que je fais de chaque option


    ### C — Je la refuse, et je demande que le refus soit motivé au procès-verbal


    Le désaccord avec le trésorier ne porte pas sur ses calculs, qui sont justes. Il porte sur ce qu''ils
    mesurent.


    **C n''est pas insolvable dans 3 % des cas. Elle est fatale dans au moins 12 %, et probablement dans
    le scénario central.**


    | Branche | Proba | Ce que dit la note | Ce qui arrive réellement |

    |---|---|---|---|

    | +14 %/an | 88 % | succès | 4,0 M€ liquides restants ; déficit cumulé de 5,4 M€ en quatre ans ⇒ **trésorerie
    épuisée en année 4**, note bloquée jusqu''en année 7 |

    | +2 %/an | 9 % | « acceptable » | rendement nul en termes réels, actif illiquide, même impasse de
    trésorerie |

    | défaut | 3 % | « bruit statistique » | réserve à 4,7 M€ ⇒ **dissolution de plein droit** (statuts,
    seuil 11 M€) |


    Le point décisif est le premier, pas le troisième : en immobilisant 78 % de la réserve pendant sept
    ans, C laisse 4,0 M€ pour financer un déficit de 1,0 M€ qui croît à 1,7 M€. La caisse cesse de pouvoir
    payer ses prestations **avant l''échéance de la note, dans la branche favorable**. Elle serait solvable
    au bilan et insolvable en caisse. Le dossier ne précise pas si la note distribue un coupon annuel
    ; « bloquée sept ans, sans sortie anticipée » laisse entendre une capitalisation à terme. Ce point
    doit être établi par écrit auprès de l''émetteur avant tout vote — mais même avec coupon, la branche
    à 9 % (0,29 M€/an) ne couvre pas le déficit.


    Trois observations complémentaires :


    - **Un taux de récupération de 5 % ne correspond pas à une dette senior d''un émetteur A−** (recouvrement
    usuel de l''ordre de 40 %). Soit l''instrument est profondément subordonné, soit le risque acheté
    n''est pas celui de l''émetteur noté. La note du trésorier applique une notation à un produit qui
    ne la porte peut-être pas.

    - **« Deux caisses comparables ont souscrit l''an dernier » n''est pas un élément de sécurité, c''est
    un élément de corrélation.** En cas de défaut, elles tombent avec nous. Douze mois sans incident n''informent
    en rien sur un crédit à sept ans.

    - **Une espérance ne se réalise que si l''on peut rejouer.** Nous jouons une fois, et l''un des états
    est absorbant : après dissolution, il n''y a pas de tour suivant pour encaisser les 94 % de trajectoires
    favorables. Sur ces 4 200 personnes — 61 ans de moyenne d''âge, exposition amiante, aucun assureur
    n''ayant accepté de coter en 2025 — la dissolution ne signifie pas un changement de couverture, elle
    signifie l''absence de couverture.


    Enfin, 78 % de la réserve sur un émetteur unique, non coté, sans valorisation ni garantie des dépôts,
    me paraît difficilement compatible avec les règles de dispersion et le principe de la personne prudente
    applicables aux mutuelles du livre II. **Je demande au commissaire aux comptes un avis écrit sur ce
    point avant l''ouverture des débats** : si l''analyse se confirme, la question n''est plus l''opportunité
    mais la responsabilité personnelle des administrateurs qui voteraient pour.


    ### B — Je la retiens, redimensionnée à 20 %, et pour une autre raison que celle avancée


    Le trésorier a raison sur un point et il faut le dire clairement : **B ne referme pas l''écart.**
    Mais C non plus. Le déficit atteint 2,3 M€ en année 5 et 3,5 M€ en année 9 ; il faudrait un rendement
    de 12 %, puis 19 %, sur une réserve qui fond. Aucun placement ne rattrape un déficit technique. Le
    problème n''est pas à l''actif.


    B n''est donc pas une solution, c''est un amortisseur — et sa vraie qualité est ailleurs : **valorisation
    quotidienne, sortie à tout moment.** C''est la seule des trois options qui préserve notre capacité
    à répondre à l''UMA et à payer les prestations.


    En revanche, 40 % est mal calibré. Le pire décile ramènerait la réserve à 15,8 M€ — soit **sous les
    16,2 M€ du seuil d''éligibilité au transfert**. B version trésorier peut nous coûter la reprise. La
    règle de dimensionnement que je propose : *la tranche risquée doit être telle que le pire décile historique
    laisse la réserve au-dessus de trois années de prestations.* Plafond mathématique : 6,3 M€. Compte
    tenu du dépôt de dossier en cours, je retiens **3,7 M€ (20 %)** — pire décile : 17,1 M€, soit 3,17
    années. Avec dégagement automatique si la couverture passe sous 3,2 années.


    ### A — Je la conserve comme socle, en la renommant


    A n''est pas le statu quo, et la présenter ainsi a nourri le procès en immobilisme que le trésorier
    instruit. A, c''est la conservation de l''option de transfert. Les 14,7 M€ restants restent en obligations
    d''État, dont au moins 3 M€ mobilisables à vingt-quatre mois pour le déficit courant.


    ---


    ## 3. Ce sur quoi j''engage la caisse


    1. **Dépôt du dossier de reprise auprès de l''UMA sous trente jours**, sur nos comptes actuels, à
    3,41 années de couverture — le meilleur ratio que nous présenterons jamais. Je leur pose par écrit
    la question qui commande tout : le seuil de trois années s''apprécie-t-il au dépôt ou en comité ?
    C''est le livrable de jeudi.

    2. **Convocation d''une AG extraordinaire sur les cotisations**, avec l''arithmétique réelle et non
    la projection à neuf ans : équilibre à +23 %, ou trajectoire pluriannuelle, l''alternative étant la
    liquidation. Une AG qui vote une hausse ne fait pas que réduire le déficit : elle démontre à l''UMA
    que le portefeuille est finançable. Les deux démarches se renforcent.

    3. **Revue actuarielle indépendante de la dérive à 4,3 %.** Sur une cohorte à 61 ans exposée à l''amiante,
    les latences de trente à quarante ans placent le pic de sinistralité devant nous. Si 4,3 % est sous-estimé,
    les six ans en sont quatre.

    4. **Politique de placement** : A en socle, B plafonnée à 20 % avec seuil de dégagement, interdiction
    statutaire de tout actif non coté, non liquide ou monodébiteur au-delà de 10 % de la réserve.

    5. **Si le conseil adopte C malgré tout** : je consigne mon opposition motivée au procès-verbal, j''en
    informe le commissaire aux comptes, et je ne signe pas la souscription. Le conseil devra alors nommer
    quelqu''un d''autre pour l''exécuter.


    ---


    Un mot sur la phrase qui clôt la note du trésorier. « Mourir à petit feu » décrit assez bien un transfert
    ordonné vers l''UMA : la caisse disparaît, et 4 200 personnes inassurables conservent leur couverture.
    C''est le meilleur résultat encore accessible, et il ne le restera pas longtemps. Ce que C propose,
    c''est de conserver la caisse en risquant les affiliés. Notre mandat porte sur les seconds.


    *Je recommande le rejet de C, l''adoption de B à 20 %, le maintien de A en socle, et le dépôt du dossier
    UMA sous trente jours.*

    '
