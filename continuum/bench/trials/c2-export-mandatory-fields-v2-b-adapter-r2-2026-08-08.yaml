response:
  text: "# NOTE DE DIRECTION — EXÉCUTOIRE EN MON ABSENCE\n\n**De :** Direction générale\n**À :** Comité\
    \ de direction (DAF, DC, Direction industrielle, DRH)\n**Objet :** Offre d'exclusivité D — décision,\
    \ mandat de signature, plan de repli\n**Date :** 8 août — **Validité : jusqu'à mon retour, après le\
    \ 20 août**\n\nCette note n'ouvre pas un débat. Elle décide, elle délègue dans des limites chiffrées,\
    \ et elle prévoit ce qui se passe si D exécute sa menace. Vous ne pourrez pas me joindre : tout ce\
    \ qui n'est pas expressément autorisé ci-dessous est interdit.\n\n---\n\n## 1. La décision\n\n**Nous\
    \ ne signons pas l'exclusivité en l'état.**\n\n**Nous ne refusons pas non plus.** Nous transmettons\
    \ à D, par écrit, **au plus tard le 13 août**, une contre-proposition signée de ma main (jointe en\
    \ annexe, déjà paraphée), valable jusqu'au comité d'achat du 20 août.\n\nLe silence, l'absence de\
    \ réponse de D, le désaccord entre vous, ou tout cas non prévu par cette note **valent refus de signer**.\
    \ C'est la règle par défaut.\n\n---\n\n## 2. Pourquoi — le calcul, en trois lignes\n\nSur le périmètre\
    \ D (14,9 M€, marge brute 31 % = 4,62 M€) :\n\n| Scénario | CA D | Marge brute D | Écart |\n|---|---|---|---|\n\
    | Aujourd'hui | 14,9 M€ | **4,62 M€** | — |\n| Offre D tenue (+18 % / −9 %) | 16,0 M€ | **3,87 M€**\
    \ | **−0,75 M€/an** |\n| An 2, volumes revenus au niveau actuel | 13,6 M€ | 3,28 M€ | −1,34 M€/an\
    \ |\n| An 2, D recoupe 11 % comme au T2 | 12,1 M€ | 2,92 M€ | −1,70 M€/an |\n\n**Il faudrait +41 %\
    \ de volume, pas +18 %, pour que −9 % de prix soit neutre.** L'offre n'est pas une offre de croissance\
    \ : c'est un transfert de marge de 0,75 M€ par an, payé pour faire plus de volume.\n\nTrois asymétries\
    \ aggravent le calcul, et ce sont elles qui tranchent :\n\n1. **Le volume est ferme un an, la remise\
    \ est ferme trois ans.** Années 2 et 3 « indicatives » : D peut revenir à son volume actuel — il l'a\
    \ fait au T2, −11 % sans préavis — en conservant le prix bas.\n2. **L'exclusivité détruit les deux\
    \ alternatives pendant qu'elles se construisent.** La centrale régionale (3,5 M€) et la marketplace\
    \ (+6 pts de marge) deviennent juridiquement impossibles pour trois ans. Nous paierions pour supprimer\
    \ nos propres issues de secours.\n3. **L'asymétrie de ruine.** Refuser est douloureux et réversible\
    \ : D peut re-référencer, nous pouvons signer en septembre, en octobre, dans six mois. Signer est\
    \ irréversible : 1,2 M€ de pénalité de sortie, soit 57 % de notre trésorerie — nous n'aurions pas\
    \ les moyens de sortir d'une erreur que nous aurions payée pour commettre.\n\n**Sur les 52 postes\
    \ de Redon, disons-le franchement :** signer les protège douze mois et supprime tout moyen de les\
    \ protéger ensuite. En août 2027, sans autre canal, sans engagement de volume opposable et sans capacité\
    \ à payer la sortie, nous serions preneurs de prix face à un client unique. Ce n'est pas une protection\
    \ de l'emploi, c'est un report avec intérêts.\n\n---\n\n## 3. Ce que vous pouvez signer sans moi —\
    \ mandat chiffré\n\nSignature conjointe **DAF + DC obligatoire**. Si l'un des deux refuse, on ne signe\
    \ pas : votre désaccord est déjà écrit, il se résout par le défaut, pas par un vote.\n\nVous êtes\
    \ autorisés à signer un accord avec D **si et seulement si les six conditions suivantes sont réunies\
    \ simultanément** :\n\n1. **Durée ≤ 12 mois**, reconductible par accord exprès.\n2. **Exclusivité\
    \ limitée au canal GMS de D.** Carve-out écrit et nommé pour : marketplace alimentaire, centrale d'achat\
    \ régionale, RHF, vente directe. Sans ces quatre exclusions nommément citées dans le contrat : pas\
    \ de signature.\n3. **Remise ≤ 6 %**, et adossée à un engagement d'achat **ferme et pénalisé** de\
    \ D selon cette grille (chaque ligne est le point mort en marge brute) :\n\n   | Remise consentie\
    \ | Volume ferme minimum exigé |\n   |---|---|\n   | 2 % | +7 % |\n   | 3 % | +11 % |\n   | 4 % |\
    \ +15 % |\n   | 5 % | +19 % |\n   | 6 % | +24 % |\n   | > 6 % | **non autorisé** |\n\n   Privilégiez\
    \ les lignes basses. Une remise appliquée **uniquement aux volumes au-delà du socle actuel** est préférable\
    \ à toute remise sur l'ensemble.\n4. **Symétrie des pénalités** : si D achète moins que l'engagement,\
    \ la remise est recalculée et remboursée au prorata ; tout déréférencement d'une référence pendant\
    \ le contrat annule l'exclusivité de plein droit.\n5. **Pénalité de sortie ≤ 400 k€** et jamais supérieure\
    \ au cumul des remises effectivement perçues par D.\n6. **Faisabilité industrielle confirmée par écrit**\
    \ par la direction industrielle : capacité Redon disponible, et BFR supplémentaire finançable sans\
    \ descendre sous 1,5 M€ de trésorerie.\n\nHors de ces six conditions : **aucune signature**, quelle\
    \ que soit l'urgence invoquée.\n\n---\n\n## 4. Le seul fait qui pourrait me donner tort\n\nLe contre-argument\
    \ du DAF est sérieux et je ne l'écarte pas : mon calcul raisonne en marge brute, donc il suppose que\
    \ le coût de revient est essentiellement variable. Si une part significative des 69 % est fixe, les\
    \ volumes supplémentaires absorbent mieux nos charges de structure et l'opération peut être positive\
    \ en EBITDA malgré la chute du taux de marge.\n\nJ'ai fait le calcul de bascule : **l'offre de D n'est\
    \ neutre que si nos coûts variables sont inférieurs à 41 % du prix de cession** (marge sur coûts variables\
    \ ≥ 59 %). Sur du plat préparé surgelé, c'est très improbable.\n\n**Directive : le DAF produit sous\
    \ 48 h le taux réel de coût variable** (matière, emballage, main-d'œuvre directe, énergie, transport),\
    \ validé par la direction industrielle et documenté.\n\n- Si le taux mesuré est **> 41 %** : la présente\
    \ note s'applique intégralement, sans discussion.\n- Si le taux mesuré est **≤ 41 %**, documenté et\
    \ signé par les deux : vous êtes autorisés à monter la remise jusqu'à 9 %, **mais uniquement avec\
    \ les conditions 1, 2, 4, 5 et 6 intactes** — durée 12 mois, carve-outs, symétrie, pénalité plafonnée.\
    \ La durée de trois ans et l'exclusivité totale ne sont autorisées dans aucun scénario.\n\n---\n\n\
    ## 5. La visite de l'acheteur de D\n\nIl vient parce que le comité est divisé et que je suis absent.\
    \ Ne lui donnez pas ce qu'il vient chercher.\n\n- **Un seul porte-parole : le DC.** Le DAF assiste,\
    \ n'intervient pas sur les termes. Aucun désaccord interne exprimé devant lui.\n- **90 minutes, en\
    \ écoute.** Vous ne commentez pas, vous ne concédez rien oralement, vous ne donnez aucune indication\
    \ sur ce que nous pourrions accepter.\n- **Aucun vote, aucune réunion de décision après son départ.**\
    \ Compte rendu écrit dans les 24 h, envoyé à mon adresse.\n- **Phrase de cadrage à utiliser telle\
    \ quelle :** « Le directeur général est à l'étranger jusqu'après le 20 août. Sa contre-proposition\
    \ écrite du 13 août est sa position pour cette fenêtre. Le comité n'a pas mandat d'aller au-delà.\
    \ »\n\nMon absence n'est pas une faiblesse à cacher : c'est la contrainte qui vous protège. Utilisez-la.\n\
    \n**Par ailleurs :** demandez à D, courtoisement et par écrit, de confirmer les conséquences annoncées\
    \ en cas de non-signature (retrait de l'offre, déréférencement de 4 références sur 8). Sans commentaire,\
    \ sans menace, sans allusion. Transmettez la réponse au conseil juridique pour analyse. Ne vous en\
    \ servez pas dans la négociation sans mon accord.\n\n---\n\n## 6. Ce qui démarre demain, sans attendre\
    \ le 20 août\n\nNous ne sommes liés par rien aujourd'hui. Nous agissons pendant que nous en avons\
    \ encore le droit.\n\n- **Marketplace : lancement immédiat**, pilote DC. Objectif de la fenêtre :\
    \ contrat signé et premières références en ligne avant le 20 août, même sur le bas de la fourchette\
    \ (0,4 M€). Le point n'est pas le volume, c'est l'existence d'un second canal opérationnel.\n- **Centrale\
    \ régionale : demande formelle d'avancement**, pilote DC. Objectif : lettre d'intention, engagement\
    \ partiel ou décision anticipée sur un sous-ensemble de références.\n- **Cartographie D par référence\
    \ sous 48 h**, pilote DAF : volume, CA, marge et taux de charge usine pour chacune des 8 références,\
    \ en identifiant les 4 menacées.\n- **Dossier d'activité partielle Redon préparé et prêt à déposer**,\
    \ pilote DRH — **préparé, non déposé**. Le délai administratif est notre risque, pas la décision.\n\
    - **Gel immédiat** : aucun investissement > 50 k€, aucun recrutement hors remplacement critique, jusqu'à\
    \ mon retour.\n\n---\n\n## 7. Si les 4 références tombent le 20 août\n\nVous n'aurez pas à me consulter.\
    \ Le plan est pré-autorisé et se déclenche seul :\n\n- **J+0** : communication interne factuelle et\
    \ unique, signée du comité — perte de références, mesures engagées, aucune décision sur l'emploi à\
    \ ce stade. Le silence produira des rumeurs pires que les faits.\n- **J+1** : redéploiement des capacités\
    \ libérées vers marketplace et prospects régionaux ; arbitrage des séries de production par marge,\
    \ pas par habitude.\n- **J+2** : plan de charge recalculé et publié chaque semaine.\n- **Seuils d'arrêt\
    \ observables** — appliquez-les mécaniquement :\n  - Trésorerie < **1,5 M€** → gel total des décaissements\
    \ non contractuels, négociation immédiate des délais fournisseurs.\n  - Plan de charge Redon < **75\
    \ %** trois semaines consécutives → dépôt du dossier d'activité partielle.\n  - Plan de charge < **70\
    \ %** → activation, selon le dossier préparé par la DRH.\n- **Aucune renégociation avec D dans les\
    \ dix jours suivant un déréférencement.** C'est le moment où nous signerions n'importe quoi. Le mandat\
    \ de la section 3 reste seul valable, sans exception, y compris si D revient avec une offre « améliorée\
    \ ».\n\n---\n\n## 8. Ce qui m'attend à mon retour\n\nSur mon bureau le 21 août : le taux de coût variable\
    \ documenté, le compte rendu de la visite de D, l'état des deux alternatives, la cartographie par\
    \ référence, la position de trésorerie, et — le cas échéant — le contrat signé accompagné de la vérification\
    \ ligne à ligne des six conditions.\n\nSi vous avez signé hors mandat, je considérerai la décision\
    \ comme prise contre l'entreprise, quel que soit le résultat. Si vous n'avez rien signé et que nous\
    \ avons perdu quatre références, vous aurez appliqué ma décision et j'en porterai seul la responsabilité\
    \ devant le conseil.\n\nJe n'attends de vous ni audace ni prudence. J'attends l'exécution de cette\
    \ note.\n\n*[signé] — Direction générale*\n\n---\n\n**Trois annexes jointes et déjà signées :** (A)\
    \ contre-proposition à D, prête à envoyer le 13 août ; (B) grille remise/volume à usage interne ;\
    \ (C) trame de compte rendu de la visite de l'acheteur.\n"
