response:
  text: '# Note au conseil — répartition de l''enveloppe de 900 000 €


    **Objet :** dossiers A (parc d''usinage) et B (succession qualité). Décision demandée jeudi.


    ## Ce que nous proposons


    | Ligne | Montant |

    |---|---|

    | Promotion de l''adjointe qualité (revalorisation sur 2 ans) | 45 000 € |

    | Mission de transition du directeur sortant (12 mois) | 90 000 € |

    | Ligne conditionnelle de recrutement externe, engagée mais non déboursée | 145 000 € |

    | Renouvellement des six machines, achat en lot unique, pose échelonnée | 620 000 € |

    | **Total** | **900 000 €** |


    L''ordre compte : le dossier B se sert le premier, le dossier A prend le solde. La raison n''est pas
    que B soit plus rentable — c''est qu''il est le seul des deux dont l''échec ne se rattrape pas.


    ## Dossier B : la ressource rare n''est pas l''argent, c''est le recouvrement


    Le départ est dans 11 mois, notre prochain tour de table dans 12. La fenêtre pendant laquelle le directeur
    qualité peut encore transmettre se ferme avant que nous ayons de nouveau la main. Ce que nous risquons
    de perdre — la reconnaissance par l''organisme notifié, et la relation avec deux clients hospitaliers
    qui pèsent 31 % du chiffre d''affaires — ne s''achète pas : cela se transfère, en présence de l''intéressé,
    ou pas du tout.


    C''est ce qui disqualifie le recrutement externe à 280 000 €. Un cabinet met trois à six mois à présenter
    un candidat ; l''arrivant disposerait au mieux de cinq mois de recouvrement, et se présenterait à
    l''organisme notifié aussi inconnu que l''adjointe, en ayant coûté six fois plus cher. Nous paierions
    le maximum pour le moins de temps utile.


    Les deux options économiques ne sont pas concurrentes, elles sont complémentaires : **promotion de
    l''adjointe (45 000 €) + mission de transition du sortant (90 000 €) = 135 000 €**. L''adjointe reprend
    le titre et la responsabilité ; le sortant reste douze mois pour accréditer sa successeuse là où seule
    sa signature ouvre les portes. Nous achetons du recouvrement, pas un CV.


    **Nous n''avons aucune preuve que l''adjointe tiendra le poste** — trois ans d''ancienneté, aucun
    précédent interne, aucun comparable sectoriel. C''est précisément pourquoi nous ne tranchons pas cette
    question aujourd''hui : nous l''instrumentons (voir « repli »).


    ## Dossier A : ce que disent réellement les chiffres


    Sur cinq ans d''historique audité : 213 000 € de coût direct, plus 1 810 heures d''arrêt à 38 € de
    marge, soit 68 800 € de marge perdue. Total **282 000 € sur cinq ans, environ 56 000 € par an**. Rapporté
    à 620 000 €, cela fait **onze ans de retour sur les seuls coûts mesurés** — un chiffre médiocre, qu''il
    faut regarder en face.


    Deux éléments le corrigent à la hausse, et un seul est chiffrable ici. L''écart de rebut (4,1 % contre
    1,2 % garanti) vaut 29 000 € par an et par million d''euros de production passant par ces machines
    : la direction industrielle connaît ce volume, nous ne l''avons pas dans ce dossier. À deux millions,
    le retour tombe sous six ans. Second élément, non chiffré : à 14 ans, la courbe de panne monte, elle
    ne se stabilise pas — les cinq années passées sont un plancher, pas une projection.


    **Lot unique plutôt que tranches.** Étaler n''aurait de sens que pour garder de l''argent pour plus
    tard ; il n''y a pas de plus tard, ce qui n''est pas engagé est perdu. Une fois B servi, tranche rime
    avec somme abandonnée. L''achat se fait en un lot, mais la **pose s''échelonne en trois vagues** :
    c''est ce qui nous laisse un point d''arrêt.


    ## Le meilleur argument contre cette note


    « Vous mettez 620 000 € dans un outil à onze ans de retour et 135 000 € dans un risque qui pèse 31
    % du chiffre d''affaires : les proportions sont inversées. »


    Il ne tient pas, pour une seule raison : **au-delà de 135 000 €, l''argent supplémentaire n''achète
    plus rien sur le dossier B.** La troisième tranche de 145 000 € n''est utile qu''en cas d''échec,
    et nous l''engageons pour cela. Verser davantage à B ne réduirait pas le risque, cela réduirait seulement
    l''outil de production.


    ## Repli, et ce qui le déclenche


    - **Mois 4** — l''adjointe doit avoir conduit seule un échange complet avec l''organisme notifié,
    le sortant en observateur, et être inscrite comme référente au dossier de certification. Non atteint
    → la ligne de 145 000 € est activée, recrutement externe lancé, sortant maintenu jusqu''au bout.

    - **Mois 6** — rendez-vous individuel avec chacun des deux clients hospitaliers, l''adjointe présentée
    comme successeure. Réserve écrite de l''un des deux → même déclenchement.

    - **Machines** — première vague de pose sous 96 % de disponibilité sur trois mois glissants → pénalités
    contractuelles activées et vagues suivantes suspendues.


    Aucune reprise automatique : chaque déclenchement revient au conseil.


    ## Ce qui renverserait cette note, vérifiable avant jeudi


    1. **Répartition des 47 pannes par machine.** Si les 1 810 heures se concentrent sur deux ou trois
    machines, remplacer trois machines capte l''essentiel du gain et libère environ 310 000 € pour renforcer
    B. Donnée disponible sous 48 heures dans l''historique déjà audité — à demander aujourd''hui.

    2. **Nature de la reconnaissance par l''organisme notifié.** Si elle est attachée au système qualité
    et non à la personne, confirmé par écrit, le risque B se réduit fortement et la ligne conditionnelle
    se redéploie vers le contrat de service du parc.


    ## Première action


    Aujourd''hui : demander la ventilation des pannes par machine, et faire confirmer par la direction
    financière qu''un mandat de recrutement conditionnel constitue bien un engagement sur l''exercice
    — à défaut, les 145 000 € se convertissent en mission de transition allongée à 24 mois assortie d''un
    acompte ferme de cabinet.


    **Vendredi, quelle que soit la décision de jeudi :** entretien avec le directeur qualité pour lui
    proposer la mission de transition. Son accord n''est pas acquis, et tout le dispositif B en dépend.
    S''il refuse, le recrutement externe à 280 000 € redevient la seule option, et cette note est à rouvrir.

    '
