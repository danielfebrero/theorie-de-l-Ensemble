response:
  text: '## Note de position — répartition de la ressource du bassin de la Vèze

    *Pour la séance du jeudi. Portée : 15 jours, révisée chaque semaine.*


    ---


    ### 1. Le « manque de 160 L/s » n''existe pas sous cette forme


    L''addition 240 + 150 + 180 = 570 met sur le même plan trois grandeurs de nature différente. Je refuse
    d''arbitrer à partir de cette somme.


    - **180 L/s (débit réservé)** est une obligation d''arrêté préfectoral, adossée à un rapport documentant
    une perte non reconstituable à dix ans. Ce n''est pas une demande, c''est un plancher, et il n''est
    pas dans les mains de cette commission. Aucune de nos délibérations ne peut passer dessous.

    - **150 L/s (régie)** est un **prélèvement constaté, pas un besoin évalué**. Rapporté à 9 200 habitants,
    cela fait 12 960 m³/jour, soit **1 409 litres par habitant et par jour**. Un service d''eau potable
    ordinaire produit 250 à 400 L/hab/j pertes de réseau comprises. Soit la régie dessert une population
    ou des usages non déclarés dans ce dossier, soit son rendement de réseau est très dégradé. C''est,
    en L/s disponibles, **la plus grosse anomalie du dossier**, et personne à cette table ne l''a examinée.

    - **240 L/s (maraîchage)** correspond à 33 m³/ha/jour sur 620 ha, soit **3,3 mm/jour**. C''est *en
    dessous* de l''évapotranspiration d''août. Contrairement à ce qui se dit en séance, cette demande
    n''est pas gonflée : c''est un besoin agronomique sincère pour 620 hectares conduits normalement.
    En revanche, l''annonce « en dessous de 240, perte de la récolte » est fausse telle qu''énoncée :
    la réponse des cultures à l''eau est continue, pas en marche d''escalier. Ce qui est vrai, et beaucoup
    plus grave, figure au point 3.


    ### 2. Ce que nous ne savons pas, et que je refuse de masquer


    - La station de Sarcelle est **la seule mesure du bassin, non étalonnée depuis 2023**. Un biais de
    10 % — ordinaire sur une station délaissée — signifie que le débit réel est entre 370 et 450 L/s.
    Toute la répartition repose sur ce chiffre unique.

    - Nous ne mesurons **pas** le débit à l''aval : nous *inférons* le respect des 180 L/s. Nous ne le
    constatons pas.

    - Aucune donnée parcellaire : ni cultures, ni stades, ni compteurs. Nous ne pouvons ni vérifier les
    4,1 M€, ni fixer un quota individuel défendable.

    - Le rendement du réseau de Ferney n''est pas au dossier.


    Je propose donc une répartition qui **réserve 20 L/s non attribués** tant que la station n''est pas
    réétalonnée. Cette marge n''est pas une précaution rhétorique : si la station lit haut, ces 20 L/s
    n''ont jamais existé et nous aurons évité de les distribuer.


    ### 3. Le point technique décisif : ne pas étaler


    Avec la part qui restera à l''irrigation, il y a deux façons de faire, et elles ne donnent pas le
    même résultat.


    - **Répartie uniformément sur 620 ha** : 80 L/s font 1,1 mm/jour. C''est sous le seuil de survie de
    presque toutes les cultures en place. On arrose 620 hectares et on n''en sauve aucun. **C''est le
    scénario à 4,1 M€.**

    - **Concentrée** : les mêmes 80 L/s couvrent intégralement le besoin de **200 hectares environ**.
    Ces 200 hectares font une récolte normale ; 420 sont perdus.


    L''écart entre les deux, sur les chiffres avancés par la profession, est de **l''ordre de 1,3 M€ et
    de plusieurs dizaines d''emplois**. Ce n''est pas un raffinement : c''est la principale valeur que
    cette commission peut créer jeudi.


    Conséquence directe sur le choix d''instrument que notre règlement nous laisse : **le quota individuel
    est la mauvaise option**. Non seulement nous n''avons aucune donnée pour le fonder — il serait attaquable
    au tribunal administratif dès la première notification — mais il produit mécaniquement l''étalement,
    donc le scénario le plus destructeur.


    ### 4. Ce que je propose


    **a) Volume global par usage, indexé sur le débit observé.** Pas d''allocation fixe pour huit semaines
    alors que nous n''avons trois semaines de visibilité.


    | Débit entrant (médiane 10 j) | Réservé | Marge de mesure | Eau potable | Irrigation |

    |---|---|---|---|---|

    | ≥ 480 | 180 | 20 | 150 | 130 |

    | **400 – 480 *(situation actuelle : 410)*** | **180** | **20** | **130** | **80** |

    | 360 – 400 | 180 | 20 | 125 | 35 |

    | 320 – 360 | 180 | 20 | 120 | 0 |

    | < 320 | *hors compétence de la commission — saisine du préfet* | | | |


    Au palier le plus bas, la régie reste à 1 127 L/hab/jour. **Aucun palier de ce tableau ne met en cause
    la sécurité sanitaire de Ferney ni de l''EHPAD** sur les chiffres qui nous ont été communiqués. Si
    ces chiffres sont incomplets, la régie doit le dire jeudi, et le tableau sera refait.


    **b) La répartition interne du volume maraîcher est déléguée au collectif des 34.** Nous fixons l''enveloppe,
    pas les bénéficiaires. C''est la seule manière d''utiliser l''information que nous n''avons pas et
    qu''eux détiennent : quelles parcelles sont à trois semaines de la récolte, lesquelles sont déjà perdues,
    lesquelles peuvent tenir en goutte-à-goutte. Conditions : convention signée sous 7 jours à **double
    majorité** (2/3 des exploitations *et* la moitié des hectares, pour qu''aucun des deux blocs ne dicte),
    **plafond de 15 % du volume par exploitation**. À défaut d''accord au 7ᵉ jour, s''applique une règle
    par défaut au prorata des surfaces irriguées déclarées au registre parcellaire, plafonnée à 10 %.


    **c) Contrôle par tour d''eau avant d''être volumétrique.** Sans compteurs, un volume est inapplicable.
    Pendant quinze jours : irrigation **de nuit uniquement (21h–7h)**, par secteurs alternés. Cela borne
    physiquement le débit instantané, c''est vérifiable à l''œil, et cela réduit de 20 à 25 % la perte
    par évaporation — soit, à volume égal, l''équivalent d''une quinzaine de litres/seconde gagnés à la
    racine.


    **d) Les 600 000 €, employés là où ils achètent des litres ou de la certitude :**


    | Poste | Montant | Ce que ça achète |

    |---|---|---|

    | Sécurisation potable (interconnexion / forage de secours, étude et travaux d''urgence) | 150 k€
    | 15 jours à 3 semaines de délai — **à engager cette semaine ou pas du tout** |

    | Réétalonnage de Sarcelle + station de contrôle à l''aval + compteurs agricoles | 80 k€ | La possibilité
    même de piloter |

    | Recherche de fuites sectorisée et réparations ciblées Ferney | 120 k€ | L''eau la moins chère du
    dossier |

    | Fonds de cession aux exploitations qui renoncent à leur part | 250 k€ | Rend la concentration volontaire
    au lieu d''imposée |


    Je dis franchement ce que ces 250 000 € représentent : **environ 6 % de la perte annoncée**. Ce n''est
    pas une indemnisation, c''est un paiement de coordination. L''indemnisation relève du régime des calamités
    agricoles, de l''assurance récolte et du dégrèvement de taxe foncière ; la commission déposera jeudi
    une demande formelle de reconnaissance et accompagnera les dossiers. Prétendre que le fonds répare
    le préjudice serait mentir, et cela se verrait en séance.


    ### 5. Le dispositif de levée de 2022 est supprimé


    L''orage du 9 août a coûté cher pour une raison précise : un seuil franchi 48 heures mesure un ruissellement,
    pas une recharge. Le nouveau mécanisme est délibérément **asymétrique** :


    - **Le durcissement est automatique et immédiat**, sur la moyenne journalière.

    - **L''allègement n''est jamais automatique** : il exige la **médiane sur 10 jours** au-dessus du
    seuil du palier — une médiane ne bouge pas sur un pic de deux jours, c''est exactement ce qui a manqué
    en 2022 — ET un débit aval constaté ≥ 180 sur toute la période. Il se fait **un palier à la fois**,
    sur décision de la cellule hebdomadaire.


    ### 6. Ce qui déclenche quoi


    - Réserve tampon de la régie **< 3 jours** ou médiane 10 j **< 340** : irrigation suspendue sous 24
    h, EHPAD basculé sur alimentation sécurisée.

    - Station aval **< 180 L/s pendant 24 h** : arrêt immédiat de tout prélèvement agricole jusqu''à vérification
    contradictoire.

    - Médiane 10 j **< 320** : saisine du préfet. À ce niveau, l''eau potable et le débit réservé ne sont
    plus simultanément satisfaisables. **Ce choix-là n''est pas le nôtre**, et il ne doit pas nous être
    imposé par le calendrier : c''est pour cela que la ressource de secours se commande cette semaine
    et non dans trois.


    ### 7. Ce que je dis à chacun


    **Aux maraîchers**, qui ont quitté la salle : vous subissez la plus forte réduction, et votre demande
    de 240 L/s n''était pas exagérée — je l''écris noir sur blanc. En échange, vous obtenez trois choses
    qu''un quota administratif ne vous donnerait jamais : la répartition entre vous est **votre** décision,
    plafonnée pour que les six plus grandes exploitations ne prennent pas la moitié de l''enveloppe ;
    des compteurs qui vous appartiendront et qui feront qu''en 2027 vous discuterez avec des données au
    lieu de déclarations ; et l''appui formel de la commission sur les calamités agricoles. L''alternative
    à votre absence n''est pas un meilleur partage : sous 320 L/s, c''est le préfet qui arbitre par arrêté,
    et l''irrigation y est à zéro.


    **À la régie**, qui refuse de discuter sans garantie : la garantie est accordée d''emblée et sans
    contrepartie préalable — 130 L/s, priorité absolue sur tout autre usage, plus une ressource de secours
    financée. Vous n''avez rien à négocier pour l''obtenir. En contrepartie, vous produisez sous 10 jours
    votre rendement de réseau et vous suspendez les usages municipaux non essentiels. Vos 1 409 L/hab/jour
    seront de toute façon lus par la presse et par le préfet ; mieux vaut que ce soit vous qui les expliquiez.


    **Sur le débit réservé** : 180 L/s tenus, et pour la première fois **mesurés** à l''aval. Les frayères
    sont le seul poste de ce dossier dont la perte ne se rattrape pas avec de l''argent ni avec une bonne
    année.


    **À la presse** : ce n''est pas « les paysans contre les robinets ». Le poste le plus élastique du
    dossier n''est ni l''un ni l''autre, c''est un réseau d''eau potable dont personne n''a examiné les
    pertes, et une station de mesure qu''on n''a pas étalonnée depuis trois ans.


    ### 8. Le meilleur argument contre cette position


    Tout ce qui précède repose sur un capteur unique et non vérifié. Si Sarcelle surestime de 12 %, le
    débit réel est de 360 L/s : nous ne délivrons déjà pas les 180 L/s à l''aval, l''irrigation doit tomber
    à zéro immédiatement, et la collision entre l''eau potable et le débit réservé n''est pas dans trois
    semaines mais dans quelques jours. C''est un scénario crédible, et c''est la raison de la marge de
    20 L/s et du réétalonnage en tête de dépense.


    **Ce qui renverserait cette position** : le résultat de l''étalonnage. Station qui lit bas (débit
    réel ≥ 460) → l''irrigation remonte à 130 L/s et la note est révisée à la hausse. Station qui lit
    haut → passage direct au palier bas et saisine du préfet. Et si le rendement de réseau de Ferney s''avère
    bon — c''est-à-dire si les 150 L/s couvrent des usages réels non déclarés ici — alors 130 n''est pas
    un chiffre sûr, il faut le rétablir, et c''est l''irrigation qui absorbe.


    ### 9. Première action


    Trois engagements dès lundi, avant le vote de jeudi, parce que leur délai est plus long que notre
    marge : commande du réétalonnage et de la station aval ; demande du registre parcellaire et convocation
    du collectif maraîcher avec le mandat de répartition ; engagement de l''étude d''interconnexion sur
    le fonds départemental.


    ---


    Deux choses que je ne propose pas, et pourquoi : la réutilisation des eaux traitées de la station
    d''épuration ne produirait rien cette saison (délais réglementaires sur cultures maraîchères, et l''effluent
    détourné manquerait à la rivière) ; les retenues de substitution sont un dossier 2027. Les inscrire
    ici donnerait l''illusion d''une marge qui n''existe pas dans les huit prochaines semaines.

    '
