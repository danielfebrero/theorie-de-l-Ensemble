response:
  text: '# Note au conseil — Arbitrage Sedamex / Nordwerk

    **Séance du vendredi — 18 mois — recommandation de la direction générale**


    ## Recommandation


    **Option B : installation de la ligne Nordwerk.** Signature après une vérification documentaire de
    dix jours, décrite au dernier paragraphe.


    ## Ce qui fonde ce choix


    **L''espérance.** B rapporte 380 k€ en moyenne (60 % × 900 − 40 % × 400) contre 200 k€ garantis pour
    A. Écart : +180 k€. Mais une moyenne ne décide de rien à elle seule — ce qui décide, c''est ce qui
    se passe dans la mauvaise branche.


    **Le pire cas de B ne met pas l''entreprise en cause.** Séquence la plus dure : dividende de 350 k€
    au 4ᵉ mois, 350 k€ au 10ᵉ, constatation de l''échec et décaissement de 400 k€ au 12ᵉ.


    | | Départ | Pire cas B, après dividende |

    |---|---|---|

    | Fonds propres | 3,4 M€ | **2,3 M€** (covenant : 1,2 M€) |

    | Trésorerie | 2,6 M€ | **1,5 M€** (≈ 9 mois de masse salariale) |

    | Dette nette | 0 | 0 |


    Le covenant conserve 1,1 M€ de marge, soit près de trois fois la perte maximale de B. Il ne mord dans
    aucun scénario de cette option ; ce qui le ferait mordre serait une perte de 1,5 M€ au-delà du dividende,
    et le contrat plafonne à 400 k€. Aucune clôture trimestrielle n''est en risque.


    **La perte est bornée par contrat, pas par estimation.** 400 k€ tout compris, pénalité de résiliation
    incluse. Pas de caution personnelle, pas de défaut croisé, aucune sûreté sur l''actif industriel,
    carnet de commandes non gagé. Nous finançons sur trésorerie propre, sans dette. Il n''existe donc
    pas de branche où Verlaq perd son indépendance, sa capacité de production ou sa continuité d''exploitation.


    **Le seuil de bascule.** B ne devient inférieure à A que si la probabilité de succès tombe sous **46
    %**. Le bureau d''études l''estime à 60 %. Nous disposons de 14 points de marge d''erreur, et même
    en deçà de ce seuil la perte reste plafonnée à 400 k€.


    ## Réponse au directeur financier


    Sa vigilance est fondée et je la partage sur le principe : on ne joue pas la maison sur un tirage
    à 40 %. Mais **ce tirage ne joue pas la maison**, et c''est précisément ce qui sépare notre situation
    de celle de Tremay.


    Le rapprochement avec Tremay compare une ressemblance de surface — « une ligne neuve » — sans les
    termes qui décident. Une ligne neuve ne dépose pas un bilan ; une exposition non bornée le fait. Je
    demande que nous établissions, avant vendredi si possible, comment Tremay était financé : dette, caution,
    sûretés, plafond de perte. Si Tremay avait souscrit un engagement plafonné à 12 % de ses fonds propres
    sans sûreté ni caution, l''analogie tombe. À ma connaissance, ce n''était pas le cas. Un précédent
    unique dont les termes diffèrent ne fait pas une base de décision, quand nous en avons onze documentés.


    **La véritable fragilité de B n''est pas le risque, c''est le chiffre de 60 %.** Il repose sur onze
    installations — un échantillon mince, produit par une estimation interne non auditée. C''est là qu''il
    faut dépenser, pas dans l''abstention.


    **Proposition de gouvernance.** Je propose que le directeur financier pilote le suivi des jalons techniques
    et détienne le pouvoir de déclencher la constatation d''échec, ainsi qu''un droit de saisine directe
    du conseil. Constater tôt ne réduit pas la perte — elle est plafonnée — mais libère douze mois de
    capacité industrielle. Celui qui porte l''objection tient le frein.


    ## Repli, déclencheurs, et ce qui me ferait changer d''avis


    - **Jalon de qualification non atteint au 6ᵉ mois** → constatation immédiate de l''échec, sans attendre
    le 12ᵉ.

    - **Fonds propres projetés sous 1,8 M€** à une clôture trimestrielle → saisine du conseil sous 48
    heures.

    - **Ce qui renverse la recommandation :** si la revue des onze références établit un taux de succès
    documenté inférieur à 46 %, ou si les quatre échecs partagent un facteur technique présent chez Verlaq,
    je recommande A.


    ## Première action


    Mandat au directeur financier et au bureau d''études, sous dix jours et **avant signature** : obtenir
    des onze références leur issue réelle et les causes documentées des quatre échecs. Coût marginal,
    information décisive, dernier moment où elle vaut quelque chose — l''engagement est ferme et sans
    clause de sortie.


    ---


    *Hypothèses déclarées, non vérifiées à ce jour : que le contrat Sedamex ne resterait pas accessible
    après ces dix-huit mois — s''il l''est, l''écart en faveur de B se creuse ; que la valeur de la relation
    commerciale Sedamex au-delà des 200 k€ de marge est faible. Le conseil doit trancher ce second point,
    que je ne sais pas chiffrer.*

    '
