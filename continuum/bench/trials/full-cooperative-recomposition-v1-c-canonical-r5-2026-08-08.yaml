response:
  text: '# Position de la présidence — répartition de l''étiage de la Vèze


    **Séance du jeudi. Note remise aux trois parties, à la préfecture et à la presse locale simultanément.**


    ---


    ## 1. Le verdict


    Je ne propose pas d''arbitrer entre « les paysans et les robinets ». Je propose de **ne prendre aucun
    litre au débit réservé**, et de répartir le déficit de 160 L/s entre les deux usages qui peuvent le
    supporter sans perte définitive.


    | Usage | Demande | Attribution semaines 1-2 | Cible à partir de S3 |

    |---|---|---|---|

    | Débit réservé aval | 180 | **180** | **180** |

    | Régie de Ferney | 150 | **105** | **90** |

    | Irrigation maraîchère | 240 | **125** | **140** |

    | **Total** | 570 | **410** | **410** |


    Le déficit de 160 L/s est absorbé à 72 % par l''irrigation et à 28 % par la régie. Le milieu en absorbe
    zéro.


    Attribution valable **trois semaines**, pas huit. Elle est révisée le 21ᵉ jour sur données vérifiées,
    à la hausse comme à la baisse.


    ---


    ## 2. Pourquoi ce partage-là


    Les trois demandes ne sont pas du même ordre. Je les classe par **récupérabilité de la perte**, pas
    par volume sonore dans la salle.


    **Le débit réservé est la seule perte non rachetable.** Deux frayères asséchées, ce n''est pas reconstituable
    à dix ans — le rapport du 12 juin le documente, et aucune somme mobilisée jeudi ne rachète une population
    de truites en 2036. Une récolte perdue se rejoue en 2027 ; une frayère, non. C''est aussi le seul
    poste que je n''ai juridiquement pas le pouvoir de toucher : il relève de l''arrêté préfectoral.


    **Les 150 L/s de la régie ne sont pas un besoin vital.** C''est le point que la formule « les robinets
    » masque, et il faut le dire en séance :


    - 150 L/s = 12 960 m³/jour pour 9 200 habitants, soit **1 409 L/jour/habitant**. La moyenne domestique
    française est d''environ 150 L.

    - Le besoin domestique strict de Ferney, EHPAD compris, avec les pertes de réseau, se situe autour
    de **30 L/s**.

    - 105 L/s laisse encore **986 L/jour/habitant**, six fois le besoin domestique.


    La coupe de 45 L/s ne touche aucun usage intérieur. Elle porte sur l''arrosage des jardins, les piscines,
    le lavage des véhicules, les fontaines publiques, la modulation de pression nocturne — c''est-à-dire
    sur la part estivale de la pointe, celle qui disparaît sous restriction dans toutes les crises comparables.
    **La réserve tampon de 4 jours n''est pas entamée : elle reste intacte.**


    **Les 240 L/s des maraîchers sont un chiffre agronomique honnête, mais l''énoncé « en dessous, perte
    de la récolte » ne l''est pas.** 240 L/s sur 620 ha = 3,34 mm/jour, soit l''évapotranspiration de
    pointe pour l''ensemble de la surface. Le chiffre tient. Ce qui ne tient pas, c''est le seuil binaire
    : la perte n''est pas une fonction en escalier. 125 L/s, c''est l''irrigation **pleine** de 320 ha
    environ. Le désastre annoncé ne se produit que si les 620 ha reçoivent un déficit uniforme — la pire
    stratégie possible, celle qui tue tout sans rien sauver.


    D''où la condition attachée à l''attribution : **le volume est fixé par la commission, la répartition
    entre parcelles est faite par les maraîchers eux-mêmes.** Concentrer l''eau sur les cultures à forte
    valeur et en stade critique, conduire un déficit contrôlé de 20-25 % sur une deuxième tranche, assumer
    l''abandon de la tranche la moins valorisée. Irrigation obligatoire entre 21 h et 9 h, aspersion interdite
    là où le goutte-à-goutte existe : c''est 20 à 30 % de pertes par évaporation en moins, de l''eau gratuite.
    Avec cette conduite, l''ordre de grandeur de la perte se situe entre 1,2 et 1,6 M€, non 4,1 M€. Ce
    chiffre doit être consolidé avec la chambre d''agriculture sous cinq jours — je l''annonce comme une
    estimation, pas comme un acquis.


    ---


    ## 3. Les deux chiffres sur lesquels je refuse de m''engager sans vérification


    C''est la partie la plus inconfortable de cette note, et je préfère l''écrire moi-même avant qu''on
    me l''oppose.


    **Le 410 L/s vient d''une station unique étalonnée en 2023.** Une courbe de tarage dérive, et elle
    dérive le plus dans le bas du domaine — exactement là où nous sommes. Une erreur de 15 % représente
    60 L/s, soit plus du tiers du déficit, dans une direction que personne ne connaît. **Toute cette répartition
    repose sur un nombre que nous n''avons pas vérifié depuis trois ans.** C''est indéfendable, et c''est
    réparable : une campagne de jaugeage par dilution coûte quelques milliers d''euros et se conduit en
    une semaine.


    **Le volume stocké au barrage de Sarcelle n''apparaît nulle part au dossier.** On nous donne un débit
    entrant ; on ne nous donne pas la réserve utile. Si Sarcelle porte un stock mobilisable, l''arbitrage
    sur trois semaines change de nature. Je demande ce chiffre pour lundi.


    Troisième inconnue mineure mais réelle : les forages privés des exploitations, non déclarés au dossier.
    Ils doivent être recensés et équipés de compteurs — ils font partie de la ressource ou de la fuite,
    et aujourd''hui nous ne savons pas laquelle.


    ---


    ## 4. Les 600 000 € — affectation proposée


    | Poste | Montant | Effet attendu |

    |---|---|---|

    | Jaugeage d''urgence, réétalonnage Sarcelle, 2 points aval + piézomètres | 40 k€ | Vérifier le chiffre
    qui fonde tout, sous 10 jours |

    | Régie : sectorisation, recherche de fuites, réparation des plus grosses, modulation de pression
    | 180 k€ | **−15 L/s au 21ᵉ jour**, restitués à l''irrigation |

    | Sécurisation du noyau vital : bâche de secours, marché de citernage en veille, étude d''interconnexion
    | 40 k€ | Découpler l''EHPAD de la rivière |

    | Enchère inversée d''effacement d''irrigation, ouverte aux 34 exploitations | 300 k€ | Acheter d''abord
    les hectares les moins coûteux à renoncer |

    | Réserve de repli | 40 k€ | — |


    Deux remarques d''honnêteté sur ce tableau.


    Les 180 k€ consacrés aux fuites sont **le meilleur euro dépensé du dossier** : c''est le seul poste
    qui crée de l''eau au lieu de la déplacer, et les litres récupérés vont aux maraîchers, pas à la régie.
    C''est écrit dans la délibération.


    Les 300 k€ ne réparent pas 4,1 M€, ni même 1,4 M€. Sur ~250 ha effacés, cela représente environ 1
    200 €/ha contre un produit brut de 6 600 €/ha. **Ce fonds est une trésorerie de pont, pas une indemnisation**
    — il tombe sous quinze jours, ce qui correspond à la paie des saisonniers, et c''est là toute sa valeur.
    Je saisis en parallèle et dès lundi les dispositifs de calamité agricole, d''assurance récolte et
    de dégrèvement de la taxe foncière sur le non-bâti. Promettre autre chose jeudi, c''est perdre les
    maraîchers une seconde fois.


    Le mécanisme d''enchère inversée mérite d''être expliqué en séance : chaque exploitation propose le
    prix auquel elle accepte de ne pas irriguer telle parcelle. Une exploitation dont les courges sont
    proches de la récolte acceptera peu ; une exploitation en tomates refusera beaucoup. Le fonds achète
    en commençant par le moins cher. Personne ne se voit imposer un hectare par la préfecture, et l''eau
    se retire d''elle-même de là où elle vaut le moins.


    ---


    ## 5. Ce que chaque partie gagne à rester dans la salle


    La séance précédente s''est mal terminée parce que chacun est venu défendre un chiffre. Je propose
    que chacun reparte avec autre chose qu''un chiffre.


    **À la régie**, qui refuse de discuter sans garantie : elle obtient sa garantie. Un **plancher de
    45 L/s inviolable**, inscrit dans la délibération, non révisable par la commission, mobilisable sans
    vote. À ce plancher, Ferney dispose encore de 422 L/jour/habitant. En échange, elle accepte 105 L/s
    de prélèvement et publie ses volumes quotidiens. La garantie porte sur la sécurité des personnes,
    pas sur le maintien du confort estival — c''est la distinction que la régie doit assumer publiquement.


    **Aux maraîchers**, qui ont quitté la salle : ils obtiennent trois choses qu''aucune sortie de séance
    ne leur donne. La maîtrise de la répartition interne des 125 L/s, par tour d''eau qu''ils organisent
    eux-mêmes sous obligation de comptage. La priorité intégrale sur tout litre libéré — par les fuites
    réparées, par le jaugeage, par la pluie. Et de l''argent sous quinze jours plutôt que sous huit mois.


    **Au milieu**, qui n''a personne dans la salle et qui est le seul à ne pas pouvoir renégocier l''an
    prochain : l''arrêté tenu. C''est aussi la seule raison pour laquelle l''ensemble du dispositif est
    légal, et donc la seule raison pour laquelle les deux autres parties conservent une autorisation de
    prélèvement en septembre.


    **À la presse** : je ne commente pas le cadrage à deux camps. Je publie chaque semaine les trois débits
    mesurés, le volume prélevé par chacun et l''écart à la cible. Un dossier de cette nature se perd le
    jour où les chiffres circulent moins vite que les positions.


    ---


    ## 6. Le meilleur argument contre ma position


    Je le formule aussi solidement que je le peux, parce qu''il me sera opposé jeudi et qu''il est sérieux.


    > *Vous amputez l''irrigation de 48 % au nom d''un seuil écologique que vous ne pouvez pas vérifier,
    documenté par un rapport unique du 12 juin, sur la base d''un débit mesuré par une station étalonnée
    il y a trois ans. En face, 4,1 M€ et 90 emplois sont datés, chiffrés et locaux. Si la station lit
    15 % trop bas, il n''y a jamais eu de déficit réel et vous aurez détruit une récolte pour rien. Vous
    appelez « irréversible » une population de truites et « compensable » la trésorerie de 34 exploitations
    dont certaines ne passeront pas l''hiver — pour un exploitant qui dépose le bilan, la perte est aussi
    définitive qu''une frayère.*


    Cet argument tient sur un point et cède sur un autre.


    Il tient sur la mesure, et c''est pourquoi le jaugeage est la **première action** et non une ligne
    de bas de tableau. Si le débit réel s''avère supérieur, l''écart entier va aux maraîchers à la révision
    du 21ᵉ jour — c''est écrit dans la délibération, pas laissé à un arbitrage ultérieur.


    Il cède sur la symétrie qu''il postule. La défaillance d''une exploitation est un drame, et c''est
    pour cela que je mobilise le fonds sous quinze jours et déclenche la calamité agricole. Mais elle
    appelle une réponse en argent public, laquelle existe. La frayère n''a pas de réponse, à aucun prix,
    pendant dix ans. Et une interruption d''eau potable à Ferney serait un événement de mortalité en quatre
    jours. Ce n''est pas un classement moral des trois parties : c''est un classement des recours disponibles
    quand on s''est trompé.


    ---


    ## 7. Repli — déclencheurs observables, applicables sans nouveau vote


    | Si | Alors |

    |---|---|

    | Réserve tampon de la régie < 3 jours (relevé quotidien) | Transfert immédiat de 25 L/s de l''irrigation
    vers la régie |

    | Débit entrant < 340 L/s sur 3 jours consécutifs | Irrigation suspendue ; maintien du noyau vital
    + débit réservé uniquement |

    | Débit entrant < 300 L/s | Saisine du préfet sur le débit réservé lui-même — cette décision n''est
    pas la mienne |

    | Jaugeage non réalisé au 10ᵉ jour | Saisine du préfet : l''ensemble de la répartition repose alors
    sur un chiffre non vérifié |

    | Débit vérifié ≥ 520 L/s | Révision immédiate : régie 130, irrigation 210 — le déficit se dissout
    |


    Aucune reprise automatique du régime normal : la sortie de crise se décide en séance, sur données.


    ---


    ## 8. Ce qui n''est pas dans mon pouvoir — à dire d''emblée


    La commission locale de l''eau planifie et propose ; elle n''exerce pas la police de l''eau. Les restrictions
    d''usage relèvent de l''arrêté sécheresse préfectoral, la dérogation éventuelle au débit réservé du
    seul préfet, et la mise en œuvre du tour d''eau des maraîchers eux-mêmes. **Cette note est une position
    argumentée adressée au préfet et un accord proposé aux parties, pas une décision exécutoire.** Je
    préfère que ce soit dit par moi jeudi matin plutôt que découvert par quelqu''un d''autre jeudi après-midi.


    ---


    ## 9. Ce qui se passe lundi


    **Bon de commande du jaugeage signé lundi matin, avant toute autre chose.** Résultat attendu au 10ᵉ
    jour. Aucune part du raisonnement ci-dessus n''a plus de solidité que ce chiffre-là, et il coûte 40
    k€ à vérifier sur un fonds de 600 k€.


    En parallèle sur la première semaine : demande du volume stocké à Sarcelle ; lancement du marché de
    recherche de fuites ; publication du cahier des charges de l''enchère inversée ; recensement des forages
    privés ; saisine calamité agricole.


    ---


    **Ce qui renverse cette position** : un débit vérifié ≥ 520 L/s, un stock mobilisable à Sarcelle couvrant
    trois semaines de déficit, ou une contre-expertise hydrobiologique établissant que 150 L/s pendant
    quatre semaines ne franchit pas le seuil des frayères. La première de ces trois observations arrive
    au 10ᵉ jour. Les deux autres, je les demande formellement lundi.


    **Ce que je refuse** : arbitrer huit semaines avec les données de six, et faire porter le déficit
    à la seule partie qui n''a envoyé personne défendre son cas.

    '
