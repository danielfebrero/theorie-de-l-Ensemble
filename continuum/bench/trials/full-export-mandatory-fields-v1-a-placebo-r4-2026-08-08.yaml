  text: 'Voici la note. Elle est écrite pour être appliquée telle quelle : décision arbitrée, mandat borné,
    déclencheurs chiffrés.


    ---


    # NOTE DE DIRECTION — MANDAT D''EXÉCUTION EN L''ABSENCE DU DG


    **De :** Direction générale

    **À :** Comité de direction (DAF, Directeur commercial, Directeur industriel, DRH)

    **Objet :** Contrat D — décision, mandat de négociation, plan de substitution, seuils d''alerte

    **Période couverte :** du 9 août au 30 août inclus

    **Statut :** exécutoire. Ce document tient lieu d''arbitrage. Aucune décision hors mandat ne sera
    prise en mon absence.


    ---


    ## 1. Décision


    **Nous ne signons pas le contrat d''exclusivité proposé par D, dans aucune de ses variantes actuelles.**
    Ce n''est pas un report ni une posture de négociation à usage interne : c''est la décision. Personne
    au comité n''est habilité à la revenir.


    Le calcul, que je vous demande de connaître par cœur parce qu''on vous mettra sous pression :


    | | CA sur D | Coût | Marge brute |

    |---|---|---|---|

    | Aujourd''hui | 14,9 M€ | 10,28 M€ | **4,62 M€** |

    | An 1 signé (−9 % prix, +18 % vol.) | 16,00 M€ | 12,13 M€ | **3,87 M€** |

    | An 2–3 signé (volume revenu au niveau actuel) | 13,56 M€ | 10,28 M€ | **3,28 M€** |


    La remise de 9 % coûte plus que le volume ne rapporte. **Il faudrait +41 % de volume, pas +18 %, pour
    que l''opération soit simplement neutre en marge.** L''engagement de D s''arrête à +18 %, et seulement
    la première année : les années 2 et 3, la remise reste acquise, l''engagement disparaît. Scénario
    médian sur trois ans : **−3,4 M€ de marge brute cumulée**, sur une marge brute annuelle totale de
    7,4 M€.


    À cela s''ajoutent : la perte de la centrale régionale (3,5 M€, ≈ 1,1 M€ de marge/an) et de la marketplace
    (+6 pts de marge) pendant trois ans, une dépendance portée de 62 % à ~67 % du CA sans aucune alternative,
    et 1,2 M€ pour sortir.


    Deux précisions d''honnêteté. Un : j''utilise 31 % de marge sur D faute de mieux ; la marge réelle
    sur notre plus gros client est probablement inférieure, ce qui **aggrave** le calcul — DAF, refaites-le
    avec les coûts variables réels sous 72 h et diffusez-le au comité. Deux : produire +18 % à Redon a
    un coût industriel (heures, éventuel investissement) que le tableau ci-dessus ne compte même pas.


    Enfin, l''élément qui emporte la décision au-delà des chiffres : D a réduit ses commandes de 11 %
    sans préavis au T2. C''est une information sur son comportement **après** signature, quand nous serons
    liés pour trois ans, sans autre canal, avec 1,2 M€ de pénalité de sortie. Une baisse de 11 % non contractualisée
    pendant l''exclusivité nous coûterait davantage que la remise, sans recours.


    ---


    ## 2. Ce que nous répondons à D


    Nous répondons dans le délai de huit jours — **par une contre-proposition, pas par un refus, et pas
    par un silence.** Courrier signé par le DAF, agissant par délégation, **expédié au plus tard le 13
    août** (ne pas attendre le 8e jour : partir tôt signale que nous ne subissons pas le calendrier).


    ### Contre-proposition


    **Principe :** la remise n''est pas un prix d''entrée, c''est la rémunération d''un volume réellement
    livré. Nous l''accordons en fin d''exercice, sur volumes constatés, selon un barème qui la finance.


    | Croissance volume constatée | Remise arrière |

    |---|---|

    | +18 % | 4,5 % |

    | +25 % | 6,0 % |

    | +30 % | 7,0 % |

    | +41 % et au-delà | **9,0 %** |


    Message à D, mot pour mot : *« Les 9 % sont disponibles. Ils sont disponibles au volume qui les finance.
    »* Le barème suit la formule r = m × g/(1+g) ; DAF, recalculez-le avec la marge réelle et publiez
    la grille corrigée — l''écart peut être à l''avantage de D, prenez-le, cela crédibilise la démarche.


    ### Lignes rouges — aucune signature au-delà


    1. **Exclusivité limitée** aux distributeurs nationaux GMS. Marketplace, RHD, export et centrale d''achat
    régionale **explicitement exclus par écrit**. Si D refuse le carve-out de la centrale régionale, c''est
    un refus de l''accord.

    2. **Durée ≤ 18 mois.** Exception unique : au-delà de 18 mois seulement si l''engagement de volume
    est ferme et pénalisé sur toute la durée, symétriquement.

    3. **Remise uniquement en arrière**, sur volumes constatés. Jamais sur prix de cession en amont.

    4. **Pénalité de sortie ≤ 300 k€ et symétrique** — due par D dans les mêmes termes s''il descend sous
    son engagement.

    5. **Référencement des 8 références garanti** pour la durée, avec **préavis écrit de 90 jours** pour
    tout déréférencement ou toute baisse de commandes supérieure à 5 %. Ce point n''est pas négociable
    : il répare le T2.


    Réponse de D exigée **avant le comité d''achat de septembre**. S''il refuse en bloc ou repose son
    texte initial à prendre ou à laisser : **nous laissons**, et le plan de substitution passe en régime
    maximum. Ne renégociez pas contre vous-mêmes : une seule contre-proposition, pas de deuxième concession
    en mon absence.


    ### Discipline de relation


    À compter d''aujourd''hui, avec D : tout par écrit, aucun engagement oral, jamais un des nôtres seul
    en réunion ou en visio. Compte rendu écrit dans les 24 h après chaque contact, diffusé au comité.


    ---


    ## 3. Plan de substitution — à lancer maintenant, sans attendre D


    Ce plan n''est pas conditionné à l''issue de la négociation. Il démarre le 11 août.


    **Marketplace (Dir. commercial).** Mise en ligne sous 6 semaines, 3 références — dont **les références
    menacées de déréférencement**, ce sont elles qui ont besoin d''un débouché. Budget autorisé : **120
    k€** (photos, fiches, logistique, 1 ETP redéployé). Objectif construit sur l''hypothèse basse : 0,6
    M€ la première année. Ne budgétez rien sur les 2,2 M€.


    **Centrale régionale (Dir. commercial).** Cinq mois d''attente est un délai que nous ne subissons
    pas passivement. Proposez sous 10 jours un **pilote sur 2 références et 2 à 3 dépôts, démarrage immédiat**,
    sans attendre la décision de référencement complète. Vous êtes autorisé à concéder jusqu''à **4 %
    de remise sur le pilote**. Objectif : transformer une décision binaire à 5 mois en chiffre d''affaires
    partiel dès octobre.


    **Troisième pied (Dir. commercial).** RHD, MDD pour un distributeur concurrent de D, export. **Trois
    prospects qualifiés, rendez-vous tenus, à mon retour.** C''est un livrable, pas une intention.


    Notre dépendance à 62 % est le vrai problème du dossier. Le contrat de D n''en est que le symptôme.


    ---


    ## 4. Trésorerie (DAF)


    **Action prioritaire, cette semaine :** négocier et signer une **ligne de crédit court terme jusqu''à
    1,5 M€**, plus un contrat d''affacturage sur les créances D. À faire **maintenant**, avant le comité
    d''achat de septembre et avant toute mauvaise nouvelle. On lève une ligne quand les comptes sont bons,
    pas quand on en a besoin. Vous avez délégation de signature jusqu''à 1,5 M€ sur ce seul objet.


    Gel immédiat, jusqu''à mon retour : aucun investissement > 25 k€, aucun recrutement hors remplacement
    en production, aucun versement exceptionnel. Point de trésorerie hebdomadaire écrit, tous les vendredis,
    diffusé au comité.


    ---


    ## 5. Redon et l''emploi (DRH, Dir. industriel)


    52 postes. On ne les traite ni dans l''improvisation ni dans le déni.


    **DRH : constituez dès cette semaine le dossier complet d''activité partielle, prêt à déposer, non
    déposé.** Préparez en parallèle la séquence d''information du CSE. Objectif : pouvoir déclencher en
    5 jours si nécessaire. **N''annoncez rien, ne déposez rien tant que le seuil du § 6 n''est pas franchi.**
    Être prêt n''est pas annoncer ; être pris de court serait impardonnable.


    **Dir. industriel :** en cas de creux de charge, produisez du stock sur les références marketplace
    et centrale plutôt que d''arrêter les lignes — plafond **250 k€ de produits finis**, dans les limites
    de DLC. C''est de la charge utile, pas du stock mort.


    ---


    ## 6. Seuils et déclenchements automatiques


    Ces seuils s''appliquent sans arbitrage supplémentaire.


    | Seuil franchi | Action, sans délai |

    |---|---|

    | Trésorerie < 1,4 M€ (point hebdo) | Tirage sur la ligne de crédit + information du président du
    conseil |

    | Plan de charge projeté < 75 % à 8 semaines | Ouverture de l''information CSE |

    | Plan de charge < 70 % | Dépôt du dossier d''activité partielle |

    | D déréférence effectivement des références | Marketplace en priorité absolue, budget porté à 200
    k€ |

    | D propose un texte conforme au § 2 | Signature autorisée par le DAF, après avis écrit des trois
    directeurs |

    | D refuse en bloc | Pas de signature. Plan de substitution en régime maximum. |


    **Dir. commercial, sous 72 h :** identifiez précisément les 4 références menacées et leur CA exact
    chez D. Le chiffre pilote la vitesse du plan de substitution et les mesures de trésorerie. **Il ne
    change pas la décision de ne pas signer** — un contrat qui détruit 3,4 M€ de marge ne devient pas
    bon parce que l''alternative fait peur. Si vous vous surprenez à ré-ouvrir la question de la signature
    en fonction de ce chiffre, relisez cette phrase.


    ---


    ## 7. Gouvernance et limites du mandat


    Le **DAF assure l''intérim de la direction générale**. Il décide, à l''intérieur du présent mandat,
    après avis du Dir. commercial et du Dir. industriel — DRH associé pour tout sujet social. Avis consignés
    par écrit.


    **N''est pas autorisé, quelles que soient les circonstances :** signer le contrat D en l''état ou
    toute variante franchissant une ligne rouge du § 2 ; concéder une exclusivité couvrant la centrale
    régionale ou la marketplace ; engager plus de 200 k€ hors ligne de crédit ; annoncer une mesure sociale
    avant le seuil du § 6 ; céder un actif ou une activité.


    **Escalade :** pour tout événement matériel hors mandat et non différable, le point de recours est
    le **président du conseil**, pas moi — je serai injoignable et je ne veux pas d''une décision suspendue
    à un appel qui n''aboutira pas. Tout le reste attend le 30 août.


    ---


    ## 8. Communication


    **À D :** ferme, factuel, sans agressivité. Nous voulons développer le volume avec eux et nous le
    prouvons par le barème. Nous ne vendons pas notre marge et nous ne signons pas une exclusivité de
    trois ans en huit jours. Ne mentionnez ni la marketplace ni la centrale comme des menaces : ce sont
    des faits, ils apparaîtront dans le carve-out.


    **En interne :** les rumeurs à Redon circuleront. Message unique, porté par le DRH : *« Une négociation
    commerciale est en cours, la direction a arrêté sa position, aucune décision affectant l''emploi n''est
    prise à ce jour. »* Aucun chiffre, aucun calendrier, aucune promesse. Si un seuil du § 6 est franchi,
    le CSE est informé avant le personnel.


    ---


    ## 9. Le point de vigilance que je vous laisse


    La pression du calendrier — huit jours, comité d''achat de septembre, mon absence — est un élément
    de la négociation, pas un hasard. Elle est conçue pour obtenir une signature qu''un mois de réflexion
    ne donnerait pas. Vous la subirez à ma place et vous serez tentés de la faire cesser en signant. C''est
    précisément ce que ce document est là pour empêcher.


    Nous perdons peut-être des références en septembre. Nous ne perdons pas notre indépendance commerciale
    ni notre marge pour trois ans. Le premier se répare, le second ne se répare pas.


    Je fais confiance au comité. Tenez les seuils, tenez les lignes rouges, faites avancer le plan B tous
    les jours. Nous ferons le point le 30 août.


    *[Signature — Direction générale]*


    ---


    Deux points que je signale au-delà de la note : le calcul de marge repose sur 31 % appliqué à D faute
    de données par client — c''est la première chose à faire vérifier, et si la marge réelle sur D est
    plus faible, la conclusion se durcit. Et le carve-out de la centrale régionale est la clause sur laquelle
    l''accord se fera ou se cassera : c''est là que D comprendra qu''il ne s''agit pas d''un simple marchandage
    de prix.

    '
