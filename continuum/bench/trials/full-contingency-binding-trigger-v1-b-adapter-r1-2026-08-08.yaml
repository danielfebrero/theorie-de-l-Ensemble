  text: 'L''écriture de fichier n''est pas autorisée dans ce répertoire — voici la note directement.


    ---


    # NOTE AU COMITÉ DE DIRECTION


    **Objet :** prestataire de paiement — arbitrage Solda / Payflux

    **De :** Direction des opérations · **Décision demandée :** ce vendredi


    ## Recommandation


    **Option B, en version accélérée : rampe démarrée le 7 septembre, 100 % du trafic sur Payflux au 26
    octobre.**


    **Et, quelle que soit l''option retenue : notification écrite à Solda dès lundi pour la prolongation
    mensuelle de décembre (130 k€).** Ce n''est pas une réserve, c''est la condition qui rend l''une ou
    l''autre option acceptable.


    La décision est prise vendredi et elle est ferme : on quitte Solda. Ce qui est progressif, c''est
    le trafic — pas l''engagement.


    ## Le chiffre qui manque au dossier


    Le business case compare 1,4 M€ et 0,9 M€ et s''arrête là. Il omet le coût permanent du différentiel
    de taux d''échec.


    Base : 18 000 transactions/jour × 42 € = **756 k€ de CA/jour**, soit 276 M€/an. **1 point de taux
    d''échec = 7 560 € de CA exposé par jour.**


    Payflux stabilisé à 0,5 % contre 0,4 % chez Solda, c''est +0,1 point, soit **276 k€ de CA exposé par
    an**, ~130 k€ nets en supposant que la moitié des échecs sont rattrapés par une nouvelle tentative
    ou un autre moyen de paiement. **Ce delta consomme un quart de l''économie annoncée, tous les ans,
    pendant 24 mois.** Il n''a été chiffré nulle part.


    ## Comparaison, année 1, filet de sécurité inclus


    | | **A** — bascule 3 nov. | **B** — rampe, 100 % au 26 oct. |

    |---|---:|---:|

    | Économie contractuelle affichée | +500 k€ | +310 k€ |

    | Surcoût d''échecs en montée en charge | −71 k€ | −11 k€ |

    | Delta permanent 0,5 % vs 0,4 % | −130 k€ | −125 k€ |

    | Prolongation Solda décembre | −130 k€ | −130 k€ |

    | **Net année 1** | **+169 k€** | **+44 k€** |


    **L''écart réel entre A et B est de 125 k€** — pas de 190 k€ — une fois les deux options correctement
    assurées. 125 k€, c''est **deux heures de chiffre d''affaires d''une journée de décembre.**


    À partir de l''année 2, les deux options convergent : ~370 k€/an d''économie nette. C''est là qu''est
    le vrai gain, et il ne dépend pas de l''arbitrage de vendredi.


    **Sensibilité :** si le taux de rattrapage est plus bas que les 50 % retenus, les deux options se
    dégradent — mais A trois fois plus vite, parce qu''elle expose 100 % du trafic pendant la phase instable.
    L''écart se resserre encore en faveur de B.


    ## Pourquoi B


    **1. B produit la preuve avant l''engagement.** Le 15 octobre, sous B, Payflux tourne depuis 5 semaines
    et traite 50 % du trafic réel de Vireo : la décision de prolonger Solda se prend sur données. Sous
    A, le 15 octobre, on n''a **pas une seule transaction Payflux en production chez nous** — on achète
    l''assurance à l''aveugle, ou on ne l''achète pas.


    **2. Le calendrier de A est plus serré qu''il n''y paraît.** Bascule le 3 novembre, 3 semaines d''instabilité
    selon le pilote → retour à la normale le 24 novembre. **Le vendredi noir est le 27 novembre.** Trois
    jours de marge, sur la foi d''une observation unique chez un autre marchand. Sous B, on est à 100
    % depuis 32 jours quand le pic arrive.


    **3. Le risque n''est pas symétrique.** Le pire cas de B, c''est un palier gelé et deux mois de double
    run. Le pire cas de A sans filet, c''est le compte Solda clos le 30 novembre, 2,1 millions de jetons
    partis, une ré-ouverture à 6 semaines et **une recollecte des empreintes de carte auprès des clients**
    — c''est-à-dire la fin du paiement en un clic sur notre base d''acheteurs récurrents, en plein pic.
    Un point de perte définitive sur cette base coûte plus que trois années d''économie sur le contrat.


    **4. La disponibilité contractuelle de Payflux ne couvre pas le risque.** Les 99,9 % portent sur la
    disponibilité. Le pilote a mesuré 1,3 % d''échec *pendant que la plateforme était disponible*. **L''engagement
    contractuel ne protège pas contre ce qui nous coûte de l''argent.**


    ## Le meilleur argument contre ma recommandation


    *« B coûte 125 k€ de plus, le pilote montre une stabilisation en 3 semaines, et A laisse 24 jours
    de marge avant le vendredi noir. On paie cher une prudence que les données ne justifient pas. »*


    Il est solide. Ma réponse : la marge de A n''existe que si la rampe se comporte exactement comme chez
    l''autre marchand. Un dépassement de 30 % — une semaine — l''annule entièrement. Et nous savons déjà
    que notre taux d''échec **double le jour du pic** chez un prestataire rodé (0,4 % → 0,9 %) : la phase
    instable et le pic ne s''additionnent pas, ils se multiplient. B n''a pas besoin que la prévision
    soit juste. A en dépend entièrement.


    ## Ce qu''on fait lundi


    1. **Solda — notification écrite de prolongation mensuelle pour décembre**, option janvier décidée
    le 5 décembre. Le 15 octobre n''est pas une date de décision, c''est une **date de forclusion** :
    après, l''option n''existe plus.

    2. **Payflux — négociation avant signature** sur trois points : (a) un SLA sur le **taux d''autorisation**,
    pas seulement la disponibilité, avec avoirs ; (b) prise en charge du double run par Payflux tant que
    son taux d''échec dépasse celui de Solda ; (c) proratisation de la pénalité de 240 k€ si les seuils
    de rampe ne sont pas tenus de leur fait.

    3. **Vérifier par écrit auprès de Solda que l''export des jetons ne déclenche pas la clôture du compte.**
    Toute la réversibilité tient à ce point.

    4. **Instrumenter avant de router** : le tableau de bord doit comparer les deux prestataires **sur
    trafic apparié** (même mix pays / moyens / montants). Sans cela l''écart 0,5 %/0,4 % est invérifiable
    et le SLA inapplicable.

    5. **Publier le calendrier de gel** : aucune modification de répartition entre le 20 novembre et le
    5 janvier.


    ## Conditions d''arrêt


    Exécutables par l''astreinte sans réunion (tableau de bord à 5 min, bascule de trafic en < 15 min
    tant que les deux comptes sont ouverts) :


    - **Échec Payflux > 0,6 % en moyenne glissante 30 min** sur trafic apparié → retour au palier précédent,
    sans validation hiérarchique.

    - **Deux retours en arrière sur un même palier** → palier gelé, arbitrage en comité.

    - **Au 15 octobre**, si Payflux n''a pas tenu ≤ 0,5 % pendant 3 semaines consécutives à ≥ 25 % du
    trafic → prolongation Solda **décembre + janvier**, gel à 50 %, bascule complète en février. Coût
    : 260 k€, très en deçà du gain sur 24 mois.


    **En un mot :** on change de prestataire, on le décide vendredi, on est à 100 % fin octobre — et on
    garde jusqu''en janvier la seule chose qui ne se rachète pas si on se trompe, un compte Solda ouvert.


    ---


    Trois points d''attention sur ce que j''ai dû poser comme hypothèses, à valider avant vendredi :


    - **50 % de rattrapage des échecs** — chiffre de place, pas mesuré chez nous. La supervision devrait
    pouvoir le sortir sur 12 mois ; il pilote toute la colonne « delta permanent ».

    - **Le 310 k€ de l''option B est supposé net du double run** (500 − 310 = 190 k€ ≈ 10 semaines de
    double run + décalage des économies). Si ce n''est pas le cas, B tombe à −60 k€ en année 1 et l''arbitrage
    mérite d''être rejoué.

    - **Le 0,5 % de Payflux vient d''un autre marchand**, pas de nous. C''est pour ça que le SLA sur taux
    d''autorisation est le point n° 1 de lundi : si Payflux refuse de s''engager dessus, c''est l''information
    la plus utile du dossier.

    '
