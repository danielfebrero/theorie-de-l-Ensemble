  text: '# Note au conseil — séance de jeudi


    **Objet : arbitrage A / B / C et orientation de la caisse**


    ---


    ## 1. Recommandation, en trois lignes


    **C : rejet définitif**, et je demande qu''il ne soit pas mis au vote en l''état. **B : ajourné**,
    pas rejeté sur le fond. **A : maintenu**, non comme stratégie mais comme régime de conservation pendant
    l''instruction du transfert.


    Et je propose une quatrième décision, qui est la seule qui compte : **dépôt immédiat du dossier auprès
    de l''Union mutualiste de l''Atlantique**, et convocation d''une AG extraordinaire sur le vrai chiffre
    de cotisation.


    ---


    ## 2. Le fait décisif, que le dossier ne met pas en avant


    L''Union de l''Atlantique n''a jamais repris un portefeuille dont la réserve représentait moins de
    **trois années de prestations**. Ce seuil vaut aujourd''hui 16,2 M€. Notre ratio :


    | | Réserve | Prestations | Ratio |

    |---|---|---|---|

    | Aujourd''hui | 18,4 M€ | 5,40 M€ | **3,41 ans** |

    | Dans 12 mois (option A) | 17,5 M€ | 5,63 M€ | **3,11 ans** |

    | Dans 24 mois (option A) | 16,3 M€ | 5,87 M€ | **2,78 ans** |


    **La fenêtre d''éligibilité se referme dans 18 à 24 mois. Le comité d''engagement instruit en 12 à
    18 mois.** Il n''y a pas de marge. Le dossier doit partir dans les semaines qui suivent le conseil,
    ou cette porte se ferme d''elle-même, sans que personne n''ait eu à voter sa fermeture.


    Cela réordonne complètement l''arbitrage. La contrainte qui nous lie n''est pas le seuil statutaire
    de 11 M€ à l''horizon d''une décennie. C''est un seuil de 16,2 M€ à l''horizon de deux ans, apprécié
    par un tiers, à une date que nous ne maîtrisons pas.


    ---


    ## 3. Une vérification à faire avant le vote


    Je ne retrouve pas la projection à neuf ans. Avec les hypothèses de la note — cotisations à 4,4 M€,
    prestations à 5,4 M€ progressant de 4,3 %, rendement 1,8 % — le seuil de 11 M€ est atteint **en cinq
    à six ans**, pas en neuf. L''écart s''explique si la projection indexe implicitement les cotisations
    sur les prestations : or c''est précisément ce que l''AG a refusé en 2024.


    Le conseil ne peut pas arbitrer entre trois options sur une base de comparaison dont le jeu d''hypothèses
    n''a pas été produit. **Je demande que la note d''hypothèses soit communiquée avant le vote.** Si
    mon calcul est le bon, l''horizon a été surestimé de moitié — ce qui ne renforce pas l''option C,
    cela renforce l''urgence du transfert.


    ---


    ## 4. Option C — pourquoi c''est non


    Le trésorier a raison sur son diagnostic et se trompe sur son inférence. Quatre motifs, dont chacun
    suffit :


    **a) L''espérance mathématique n''est pas le bon critère sous barrière absorbante.** Les 10 000 simulations
    décrivent 10 000 caisses. Nous en sommes une, nous jouons une fois, et nous ne mutualisons pas nos
    trajectoires avec les 9 400 qui réussissent. Dans la branche à 3 %, la réserve résiduelle est de 4,7
    M€ — soit 6,3 M€ **sous** le seuil de liquidation de plein droit. Ce n''est pas une perte, c''est
    la fin de la personne morale, sans chemin de retour. Un +9,6 % annualisé qui intègre un état terminal
    n''est pas un rendement, c''est une moyenne sans signification opérationnelle.


    **b) « 3 %, c''est du bruit » — non, et le 3 % n''est de toute façon pas à nous.** Cette distribution
    est **communiquée par l''émetteur**, c''est-à-dire par la contrepartie qui vend le produit. Ce n''est
    pas une donnée actuarielle, c''est un argumentaire. Elle ne couvre que le défaut de l''émetteur :
    elle ignore le risque de structure, l''absence de cotation, l''absence de valorisation indépendante,
    et le risque que nous soyons vendeurs contraints. Le fait qu''il n''existe aucun état de perte intermédiaire
    entre +2 % et −95 % est en soi le signe d''une illustration commerciale, non d''une distribution.
    Et sur le fond : une mutuelle qui refuserait de souscrire un risque à 3 % de sinistralité extrême
    ne peut pas le porter à son propre bilan.


    **c) L''impasse de trésorerie survient avant même que le risque de crédit ne se pose.** Notre déficit
    technique cumulé sur sept ans s''élève à environ 14 M€. Si 14,4 M€ sont bloqués sans sortie, la réserve
    libre est de 4,0 M€ — **épuisée en année 3**. Nous serions alors comptablement au-dessus de 11 M€,
    et matériellement incapables de payer les prestations. La note ne précise pas si les 14 % sont distribués
    ou capitalisés ; tant que ce point n''est pas documenté contractuellement, l''option n''est pas évaluable,
    et telle qu''elle est présentée elle est insolvable en flux.


    **d) C détruit l''éligibilité au transfert avec une probabilité de 1.** Aucun comité d''engagement
    ne reprendra un portefeuille dont 78 % des actifs sont un titre non coté, non valorisable et non transférable
    pendant sept ans. Y compris dans la branche favorable à 88 %. Le trésorier chiffre le risque de C
    à 3 % ; son coût certain, qu''aucune simulation ne price, est la perte de la seule sortie propre existante.


    **Sur les deux caisses comparables :** douze mois de détention sur un titre à sept ans n''établissent
    rien sur l''issue. Cela établit que l''émetteur a un canal de distribution ciblé sur les mutuelles
    fragilisées. C''est un signal d''anti-sélection, pas une référence.


    **Enfin, un point de gouvernance :** 78 % de la réserve sur un émetteur unique. Je demande que le
    commissaire aux comptes et l''actuaire se prononcent par écrit sur la compatibilité de cette concentration
    avec les règles de dispersion applicables, **avant** toute délibération. Si elle y contrevient, la
    délibération serait nulle et la responsabilité des administrateurs personnellement engagée pour faute
    de gestion.


    ---


    ## 5. Option B — ajournée, pas condamnée


    B est une option honnête, et le trésorier a raison de dire qu''elle ne referme pas l''écart. Mais
    son défaut aujourd''hui est ailleurs : dans le pire décile, la réserve tombe à 15,8 M€, soit **2,93
    années de prestations**. B, dans son scénario adverse, nous fait franchir le seuil d''éligibilité
    au transfert.


    Tant que le dossier Atlantique est à l''instruction, toute volatilité de bilan est un risque asymétrique
    : elle ne nous apporte rien sur un horizon de 18 mois et peut nous coûter l''agrément. **Je propose
    de réexaminer B au moment de la réponse de l''Atlantique** — et en cas de refus, d''en faire l''ossature
    de la stratégie de run-off, calibrée sur le plancher des 11 M€.


    ---


    ## 6. Option A — maintenue, en changeant sa raison d''être


    A ne rapporte rien et ne sauvera pas la caisse. Ce n''est pas ce qu''on lui demande. On lui demande
    de garantir que la réserve vaudra, à une date fixée par un tiers, exactement ce que le bilan annonce.
    Son 1,8 % est indifférent ; sa volatilité nulle est l''objet même.


    Le trésorier appelle cela « mourir à petit feu ». Sur douze mois, c''est le nom technique de « rester
    cessible ».


    ---


    ## 7. Le vrai sujet, que les trois options contournent


    Nous encaissons 4,4 M€ et versons 5,4 M€ en progression de 4,3 %. **Aucune décision d''allocation
    d''actifs ne corrige un déficit technique structurel** ; elle en modifie seulement la vitesse et la
    brutalité. Poser la question en termes de rendement est l''erreur commune à A, B et C.


    L''équilibre exige des cotisations à **5,3–5,6 M€**, soit **+20 % à +28 %**, puis indexées à 4,3 %.
    La hausse de 6 % soumise en 2024 rapportait 264 k€ : elle couvrait **un cinquième** de l''écart de
    la seule première année. L''AG n''a pas refusé la solution — on ne la lui a jamais présentée. Elle
    a refusé un arrondi.


    J''ajoute un point que le conseil doit entendre : avec une moyenne d''âge de 61 ans et une exposition
    amiante lourde, la cohorte entre dans sa fenêtre d''incidence maximale. **La dérive de 4,3 % est probablement
    sous-estimée.** Je demande une projection actuarielle indépendante intégrant la sinistralité amiante
    attendue.


    ---


    ## 8. Ce sur quoi j''engage la caisse


    J''engage la caisse sur sa **capacité à payer ses prestations à l''échéance** et sur la **préservation
    de la cessibilité du portefeuille**. Je ne l''engage pas sur un objectif de rendement, et sur **aucune
    position irréversible** tant qu''une solution de reprise reste ouverte.


    Quatre motions soumises jeudi :


    1. **Dépôt du dossier de transfert** auprès de l''Union mutualiste de l''Atlantique sous 45 jours
    ; mandat au directeur pour le constituer.

    2. **Maintien de l''allocation obligataire** jusqu''à décision de l''Atlantique ; réexamen de B à
    cette échéance.

    3. **Rejet de l''option C**, motivé au procès-verbal sur les quatre points ci-dessus, et sursis à
    toute délibération jusqu''à avis écrit du commissaire aux comptes et de l''actuaire sur la concentration.

    4. **Convocation d''une AG extraordinaire** sur un relèvement de +24 % indexé, présenté avec son alternative
    réelle : ce relèvement, ou le transfert, ou la liquidation.


    Si le conseil adopte néanmoins C, je demande que mon opposition soit inscrite au procès-verbal, et
    j''en informerai le commissaire aux comptes. Je ne signerai pas la souscription.


    Je reste à disposition des administrateurs signataires de la note du trésorier avant jeudi. Son diagnostic
    est juste : le statu quo perd. C''est sa conclusion qui est fausse — et elle transforme une perte
    lente et réversible en une perte rapide et définitive.

    '
