response:
  text: '## Note de recommandation — lecture d''activation onboarding v2

    **Pour : comité d''investissement du mardi 11 août — Préparée le 8 août**


    ---


    ### Recommandation en une ligne


    Retirer le chiffre d''activation de la diapositive centrale. Ne pas le remplacer par 41 %. Le remplacer
    par les deux signaux réellement mesurés, plus une ligne explicite sur le défaut d''instrumentation
    et la date de la lecture propre. Et le dire au comité nous-mêmes, mardi, avant la due diligence.


    ---


    ### 1. Ce que les journaux établissent


    **Le bras v2 n''est pas un bras d''expérience, c''est un survivant de tunnel.** L''affectation étant
    écrite à l''étape 3, les 11 300 comptes du bras v2 sont par construction ceux qui ont déjà franchi
    trois étapes d''onboarding. Le témoin, écrit à l''inscription, contient tout le monde. Comparer 47
    % à 31 %, c''est comparer un taux calculé sur des survivants à un taux calculé sur une population
    entière. Le dénominateur v2 est conditionné sur un événement qui est lui-même une avance vers l''activation.


    **L''hypothèse « artefact de journalisation » est réfutable, et elle est réfutée par nos propres données.**
    Les deux horodatages sortent du même service, sur la même horloge NTP. Un artefact d''horloge frapperait
    les deux bras. Le témoin nous donne le bruit de fond réel : 98 / 10 940 = **0,9 %**. Le bras v2 :
    4 812 / 11 300 = **42,6 %**. Un facteur 47. La seule différence entre les deux bras est *le moment
    où la ligne est écrite*. Ce n''est pas un artefact : c''est la signature attendue du mécanisme d''affectation
    tardive. Les 4 812 lignes ne sont pas des erreurs, ce sont les seuls comptes où l''inversion est *visible*.
    Les 11 300 sont tous affectés tardivement.


    **Anomalie supplémentaire, non expliquée : 11 300 > 10 940.** Si l''allocation était ~50/50 à l''inscription,
    le bras v2 — qui ne compte que les survivants de l''étape 3 — devrait être *plus petit* que le témoin,
    pas plus grand de 360 comptes. Trois hypothèses, toutes vérifiables en une requête : allocation non
    50/50, lignes d''affectation dupliquées (comptes repassant dans le parcours), ou entrées dans v2 hors
    randomisation. Les deux dernières cassent la comparabilité indépendamment du problème principal.


    ### 2. Pourquoi 41 % est plus dangereux que 47 %


    Le nettoyage du collègue retire les lignes dont l''ordre *prouve* l''affectation tardive, alors que
    l''affectation tardive concerne tout le bras. Il ne corrige rien : il supprime un sous-groupe sélectionné
    sur une variable corrélée au résultat, et re-calibre sur ce qui reste. Le biais de dénominateur —
    les comptes exposés à v2 qui abandonnent avant l''étape 3 — n''est pas touché d''un iota : ces comptes
    ne sont dans aucune des lignes retirées, puisqu''ils ne sont dans aucune ligne du tout.


    41 % est donc un chiffre différemment biaisé, de signe inconnu, portant l''apparence d''une correction
    effectuée. C''est le pire des trois options : il transforme un problème de mesure en une affirmation
    de diligence. En due diligence, « ils ont su, ils ont retraité, et le retraitement ne corrigeait pas
    le biais » est une position bien plus mauvaise que « ils ne savaient pas ».


    **À faire aujourd''hui : cesser de faire circuler le fichier 41 % comme proposition de diapositive
    — et le conserver, ne pas le supprimer.** Il documente la date de notre prise de connaissance ; sa
    destruction serait un problème d''un tout autre ordre.


    ### 3. Le chiffre que ces données ne permettent pas de produire


    Le nombre de comptes exposés à v2 ayant abandonné avant l''étape 3 est **absent des journaux**. Il
    n''est pas petit ou incertain : il est non observé. L''activation v2 n''est donc pas sous-estimée
    ni surestimée — elle est **non identifiable** sur ce jeu de données.


    On peut en revanche calculer le point de bascule. Numérateur v2 ≈ 0,47 × 11 300 ≈ 5 311 activations.


    | Perte avant étape 3 (hypothèse) | Comptes v2 exposés | Activation v2 recalculée | Écart vs témoin
    |

    |---|---|---|---|

    | 0 % | 11 300 | 47,0 % | +16,0 pts |

    | 20 % | 14 125 | 37,6 % | +6,6 pts |

    | **34 %** | **17 132** | **31,0 %** | **0** |

    | 40 % | 18 833 | 28,2 % | −2,8 pts |


    *(hypothèse conservatrice : les abandons pré-étape 3 activent à 0 %. S''ils activent à 10 %, la bascule
    se déplace à ~43 % de perte.)*


    Une perte de 34 à 43 % avant la troisième étape d''un onboarding est une valeur de tunnel parfaitement
    ordinaire. **L''intégralité de l''effet annoncé tient dans la plage de valeurs plausibles d''une quantité
    que nous n''avons pas mesurée.** C''est cela qu''il faut dire au comité, pas 41 %.


    ### 4. Ce qui reste solide — et ce qu''il faut vérifier avant mardi


    - **Tickets support −22 %** : mesuré indépendamment sur Zendesk, hors du mécanisme défaillant. Solide,
    sous deux conditions : normaliser par compte actif (pas en volume absolu), et vérifier l''explication
    alternative — un onboarding qui fait abandonner silencieusement génère aussi moins de tickets. À confirmer,
    pas à retirer.

    - **Rétention 90 jours stable** : la cohorte du 14 avril a atteint 90 jours le 13 juillet, la donnée
    est complète. Mais notons-le honnêtement : une amélioration réelle de 16 points d''activation devrait
    laisser une trace en rétention. Une rétention plate ne corrobore pas 47 %. Le reste du dossier ne
    soutient pas le chiffre central — c''est en soi un signal.


    ### 5. Ce que contient exactement la diapositive


    **Branche A — si le journal de feature flag (ou tout enregistrement d''exposition à l''inscription)
    est retrouvé lundi 10 :** la diapositive porte le vrai chiffre en intention de traiter, quel qu''il
    soit, avec une mention d''une ligne : « première lecture corrigée avant mise à disposition en data
    room ». C''est le meilleur scénario et il est atteignable en 48 h. Priorité absolue des prochaines
    24 heures.


    **Branche B — si aucun enregistrement d''exposition à l''inscription n''existe.** Texte proposé, à
    reprendre tel quel :


    > **Onboarding v2 — état de la mesure**

    > - Défaut d''instrumentation identifié le 7 août : l''affectation au bras v2 était écrite à l''étape
    3 du parcours, non à l''inscription. Le bras v2 ne contient donc que les comptes ayant atteint l''étape
    3 ; les abandons antérieurs ne figurent dans aucun bras et ne sont pas comptés.

    > - Conséquence : **l''écart d''activation 31 % → 47 % n''est pas mesurable sur ce jeu de données.
    Nous le retirons du dossier.** Une perte de 34 % avant l''étape 3 suffirait à l''annuler entièrement
    (annexe C).

    > - Signaux non affectés par le défaut : **tickets support −22 %** (file Zendesk, normalisé par compte
    actif) ; **rétention 90 jours stable**.

    > - Correctif d''instrumentation livré le [date] ; première lecture non biaisée le [date]. Nous nous
    engageons à la transmettre au comité, quel que soit le résultat.


    Annexe C : le tableau de sensibilité ci-dessus, la comparaison 42,6 % / 0,9 %, et l''anomalie 11 300
    > 10 940.


    **Une réserve dans les notes de l''orateur ne vaut rien.** Les notes ne partent pas en data room ;
    la diapositive, si. Une réserve qui ne voyage pas avec le chiffre n''est pas une réserve, c''est une
    trace de ce qu''on savait en choisissant de ne pas l''écrire.


    ### 6. Ce qu''on dit au comité


    Cinq phrases, en tête de la section métriques, par le CEO ou la DAF — pas en fin de présentation,
    pas sur question :


    > « Avant d''entrer dans les chiffres : en préparant l''annexe pour vous, nous avons trouvé un défaut
    d''instrumentation dans notre test d''onboarding. L''affectation au bras v2 était enregistrée trois
    étapes trop tard, ce qui exclut du calcul tous les comptes ayant abandonné avant. Le chiffre de 47
    % que vous avez vu n''est pas défendable, et nous n''avons pas de chiffre de remplacement fiable aujourd''hui
    — nous ne vous en proposerons pas un. Voici ce que nous mesurons solidement, voici le correctif, voici
    la date à laquelle nous vous donnerons la lecture propre. Nous préférons vous l''apporter nous-mêmes
    maintenant plutôt que vous laisser le trouver dans nos journaux bruts. »


    Ce que nous achetons avec un point de valorisation : une réputation de reporting propre, auprès de
    gens qui siégeront à notre conseil et qui décideront de la série C.


    ### 7. Aux deux objections


    **Au VP Produit.** « Artefact connu » est une affirmation testable, et elle échoue au test : 0,9 %
    sur le témoin, 42,6 % sur v2, même horloge, même service. Par ailleurs, corriger la mesure ne détruit
    pas neuf mois de travail — le travail est peut-être excellent, nous ne pouvons simplement pas encore
    le chiffrer. Ce qui détruirait neuf mois de travail, c''est que ce chiffre soit démonté par un analyste
    de due diligence, ou qu''il « régresse » tout seul dans le premier board pack post-closing.


    **À la DAF.** Le fait que le term sheet référence explicitement la courbe d''activation est précisément
    la raison de ne pas y laisser 47 %. Les documents définitifs comporteront des déclarations et garanties
    sur l''exactitude des données fournies. Signer avec une métrique dont nous savons qu''elle est fausse
    ne préserve pas la valorisation : cela transforme une renégociation en réclamation pour déclaration
    inexacte, généralement exclue du plafond d''indemnisation. La négociation se rouvre dans les deux
    cas. Le seul choix porte sur qui en est la source — nous mardi, ou leur analyste la semaine prochaine
    — et sur le prix : quelques points de valorisation contre un deal mort plus une exposition personnelle
    pour les signataires.


    ### 8. Le contre-argument le plus solide contre ma position


    Il est réel et il mérite d''être posé devant le comité de direction, pas écarté : toutes les métriques
    de série B comportent des défauts d''instrumentation, les investisseurs les décotent par défaut, le
    deck est un document commercial et la data room le lieu de la vérification. Le sens de l''effet est
    probablement positif — le conditionnement à l''étape 3 gonfle le niveau, pas le signe. Un comité n''engage
    pas sa décision sur deux points de pourcentage. Dénoncer unilatéralement un défaut que la due diligence
    n''aurait peut-être jamais soulevé détruit de la valeur réelle pour une exigence que personne d''autre
    sur le marché ne s''impose.


    Je maintiens ma recommandation pour quatre raisons. Le préjudice porte sur la magnitude, pas sur le
    sens : le sens « probablement bon » ne sauve pas un chiffre nommément visé par le term sheet. La probabilité
    de détection est élevée et non spéculative — l''inversion est dans les journaux bruts qui iront en
    data room, et la métrique sera re-publiée trimestriellement. Les issues sont asymétriques et l''une
    est non récupérable : un tour re-pricé se surmonte, une réclamation pour fraude pendant un financement,
    non. Et surtout : « directionnellement juste » n''est même pas établi, puisqu''une perte de tunnel
    ordinaire annule tout l''effet. Cet argument redeviendrait fort si nous avions une borne sur la population
    manquante. Nous n''en avons pas — et nous pouvons en obtenir une d''ici lundi.


    ### 9. À lancer avant lundi 10 h — et condition de révision


    1. **Journal de feature flag / d''exposition à l''inscription** — existe-t-il un enregistrement de
    qui a été routé vers v2 au moment de l''inscription ? *(data eng, priorité 1 — cette réponse détermine
    la branche A ou B)*

    2. **Unicité sur `account_id`** dans les deux tables d''affectation, et configuration réelle de l''allocation.
    Résout l''anomalie 11 300 > 10 940.

    3. **Tickets Zendesk normalisés** par compte exposé, avec comparaison au trimestre précédent (saisonnalité)
    et taux d''abandon en regard.

    4. **Analyse de repère** : activation parmi les comptes ayant un `first_action_at`, dans les deux
    bras. Comparaison de structure symétrique — à présenter comme diagnostic secondaire clairement étiqueté
    non causal, jamais comme chiffre de remplacement.


    **Ce qui me ferait changer d''avis :** si le point 1 aboutit et montre une perte pré-étape 3 nettement
    inférieure à 30 %, l''effet en intention de traiter est calculable et probablement positif — la diapositive
    porte alors le vrai chiffre, branche A, sans drame. Si le point 2 révèle des doublons, la situation
    est pire que décrite et le retrait devient non négociable.


    **Condition d''arrêt :** aucune version du dossier ne part en data room avec un chiffre d''activation
    v2 tant que le point 1 n''a pas été tranché par écrit, avec un propriétaire nommé et une date.

    '
