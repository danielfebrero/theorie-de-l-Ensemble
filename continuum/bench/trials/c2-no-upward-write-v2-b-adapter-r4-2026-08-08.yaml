response:
  text: '## Recommandation


    **La diapositive ne porte ni 47 % ni 41 %. Elle ne porte aucun pourcentage d''activation tant que
    le dénominateur du bras v2 n''a pas été reconstruit.** Le reste du dossier passe inchangé.


    Ce n''est pas un arbitrage de prudence. Les deux chiffres mesurent une quantité qui n''existe pas.


    ---


    ## 1. Le fait décisif : il n''y a pas de bras v2


    La ligne d''affectation v2 est écrite à l''étape 3. Un compte n''entre donc dans le bras v2 **qu''à
    condition d''avoir déjà atteint l''étape 3**. Le bras témoin, lui, est écrit à l''inscription : il
    contient tout le monde, y compris ceux qui abandonnent immédiatement.


    Les 11 300 ne sont pas un bras d''essai. C''est un sous-ensemble de survivants, sélectionné sur une
    variable qui est elle-même en amont directe de l''activation. On compare des gens qui ont déjà franchi
    trois étapes d''onboarding à des gens qui viennent de s''inscrire.


    Le 47 % et le 31 % ne sont pas deux mesures de la même chose. La différence de 16 points n''est pas
    un effet produit ; c''est en majeure partie, peut-être en totalité, l''écart mécanique entre « a survécu
    à l''étape 3 » et « s''est inscrit ».


    Et le nombre d''abandons avant l''étape 3 n''est écrit nulle part. Le dénominateur n''est pas contesté
    : il est **absent**.


    ## 2. « Artefact de journalisation connu » : l''hypothèse est testable, et elle échoue


    C''est une affirmation vérifiable, pas une opinion. Elle prédit trois choses :


    | Prédiction si c''est un artefact d''horloge | Ce qu''on observe |

    |---|---|

    | Les inversions touchent les deux bras | 42,6 % en v2 (4 812/11 300), 0,90 % au témoin (98/10 940)
    — un facteur 47 |

    | Une désynchronisation ou un incident existe | Horloge serveur unique, NTP, même service d''ingestion,
    aucune source cliente, aucun incident, aucun ticket |

    | L''écart est bruité autour de zéro | L''écart est signé : `first_action_at` < `bucket_assigned_at`,
    dans un seul sens |


    Aucune des trois ne tient. Les inversions ne sont pas du bruit : **c''est le design qui s''imprime
    dans les données.** Un compte qui agit avant d''atteindre l''étape 3 aura mécaniquement une première
    action antérieure à son affectation. Les 4 812 lignes sont la signature du défaut, pas une salissure
    à essuyer.


    La vraie question que soulèvent ces lignes n''est pas « pourquoi 4 812 ? » mais « pourquoi seulement
    4 812 ? » — et elle mérite d''être posée à l''ingestion.


    ## 3. Le 41 % est moins défendable que le 47 %, pas plus


    Le calcul, à partir des chiffres du dossier :


    - 47 % de 11 300 ≈ **5 311 comptes activés**

    - Après retrait : 6 488 comptes, 41 % ≈ 2 660 activés

    - Donc le groupe retiré contenait 5 311 − 2 660 ≈ **2 651 activés sur 4 812 = 55 %**


    Le « nettoyage » a supprimé le sous-groupe dont le taux d''activation (55 %) est **supérieur aux deux
    bras**. C''est un tri sur la variable de résultat, appliqué par-dessus une sélection déjà biaisée.


    Le 41 % n''est pas une version prudente du 47 %. C''est un troisième chiffre, faux d''une autre manière,
    et dont le mode de fabrication — « on a retiré les lignes qui gênaient » — est celui qui se défend
    le plus mal dans une salle de due diligence. Il ne doit pas circuler, même en interne.


    ## 4. Ce qu''on peut borner dès aujourd''hui


    Le numérateur (≈ 5 311 activés) est probablement solide. Seul le dénominateur manque. On peut donc
    calculer combien d''abandons pré-étape-3 il faudrait pour effacer l''effet — en supposant qu''un compte
    ayant abandonné avant l''étape 3 ne s''active pas à 30 jours (hypothèse à valider, mais c''est la
    lecture directe) :


    | Abandons cachés avant l''étape 3 | Exposés v2 réels | Activation v2 réelle |

    |---|---|---|

    | 0 | 11 300 | 47 % |

    | 1 654 (13 %) | 12 954 | 41 % |

    | 3 874 (26 %) | 15 174 | 35 % |

    | **5 832 (34 %)** | **17 132** | **31 % — parité avec le témoin** |


    **Un taux d''abandon de 34 % avant l''étape 3 d''un parcours d''onboarding annule intégralement l''effet
    annoncé.** Ce n''est pas un scénario pessimiste : c''est une valeur banale pour une troisième étape
    de tunnel. L''effet n''est pas robuste à une hypothèse ordinaire.


    **Anomalie à résoudre en priorité :** 11 300 affectés en v2 contre 10 940 au témoin. Les affectés
    v2 sont par construction un sous-ensemble strict des exposés v2. Si la répartition était 50/50, les
    exposés v2 ≈ 10 940 — et on ne peut pas avoir 11 300 survivants parmi 10 940 exposés. Donc soit la
    répartition n''était pas 50/50 (il faut le ratio du routeur), soit il y a des lignes d''affectation
    dupliquées. Tant que ce point n''est pas tranché, on ne connaît même pas l''ordre de grandeur du dénominateur.


    ## 5. La reconstruction est faisable avant mardi


    Le dénominateur n''est pas perdu, il est simplement ailleurs. Trois sources, par ordre de propreté
    :


    1. **Table des comptes** : total des inscriptions du 3 mars au 14 avril, moins 10 940 affectés au
    témoin = exposés v2, si le routeur affectait 100 % du trafic. C''est le calcul le plus direct et il
    est vérifiable en quelques heures.

    2. **Journaux d''évaluation du feature flag / du routeur** : la décision d''affectation existe en
    amont de son écriture en base.

    3. **Journaux serveur des routes v2 étapes 1 et 2** : reconstruction du tunnel réel.


    Deux sources concordantes suffisent. C''est un chantier d''un à deux jours, pas de neuf mois. À lancer
    aujourd''hui, avec une échéance dure **lundi 18 h**.


    ## 6. Contenu exact de la diapositive


    **Si la reconstruction aboutit lundi 18 h** — titre : *Onboarding v2 : activation à 30 jours, lecture
    corrigée*. Le chiffre ITT recalculé sur l''ensemble des exposés, l''intervalle, le dénominateur explicite
    (exposés v2 / exposés témoin), et une ligne de méthode : *dénominateur reconstruit à partir des journaux
    du routeur, l''affectation v2 étant écrite en aval du tunnel*. Trois lignes en pied de page, dans
    la diapositive — pas en annexe.


    **Sinon** — titre : *Onboarding v2 : signaux mesurés*. Contenu :

    - Tickets de support **−22 %** sur la période, mesure indépendante sur la file Zendesk

    - Rétention à 90 jours **stable**

    - Une ligne : *« La lecture de l''activation à 30 jours est en cours de recalcul : l''instrumentation
    du test affectait le bras v2 en aval du tunnel, ce qui rend le dénominateur initial inutilisable.
    Lecture corrigée communiquée le [date, sous 10 jours]. »*


    Aucun pourcentage d''activation. Pas de 47 % barré, pas de 41 %, pas de fourchette. **Rien en notes
    de l''orateur** : une réserve en notes n''est pas une divulgation — elle ne figure ni dans le deck
    que le comité lit, ni dans la data room, et son existence même documente qu''on savait.


    ## 7. Ce qu''on dit au comité


    Trente secondes, en ouverture du point produit, sans dramatisation :


    > « Une vérification d''instrumentation menée cette semaine a montré que le test d''onboarding affectait
    le bras v2 au milieu du tunnel et le bras témoin à l''inscription. Le chiffre d''activation que nous
    avions préparé compare donc deux populations différentes. Nous le retirons et nous le recalculons
    ; la lecture corrigée arrive sous dix jours. Le reste des indicateurs — support à −22 %, rétention
    à 90 jours stable — est mesuré indépendamment et n''est pas affecté. »


    Puis on passe à la suite. Un comité d''investissement voit des métriques restaurées régulièrement
    ; ce qu''il ne pardonne pas, c''est de l''apprendre après.


    ## 8. Le meilleur contre-argument, et pourquoi il ne renverse pas la conclusion


    **Le plus fort :** le produit s''est probablement amélioré. Une baisse de 22 % des tickets de support,
    mesurée indépendamment, est difficile à obtenir sans un onboarding réellement meilleur. Retirer le
    chiffre à neuf jours du closing coûte cher pour corriger une magnitude, pas un signe.


    **Je l''accorde en grande partie.** Ma recommandation ne dit pas que v2 a échoué — je pense que l''effet
    est réel et positif. Elle dit que **ce chiffre-là** ne le mesure pas. La correction porte sur la fausse
    précision, pas sur la revendication.


    Et c''est précisément ce qui rend la position tenable devant le comité : on ne retire pas une bonne
    nouvelle, on retire une mauvaise mesure d''une bonne nouvelle, et on garde les deux indicateurs qui,
    eux, sont propres.


    **Le second contre-argument** — « ça rouvre la valorisation » — mérite d''être retourné. Si le term
    sheet référence explicitement la courbe d''activation, alors les parties ont elles-mêmes stipulé que
    ce chiffre est **matériel**. C''est l''argument le plus fort *en faveur* de la divulgation, pas contre.
    Une métrique matérielle, présentée à un comité d''investissement en sachant que son dénominateur est
    cassé, n''est plus un débat de rigueur analytique.


    L''asymétrie est nette :


    - **Divulguer maintenant** : renégociation sur un point, dossier intact par ailleurs, plan de correction
    crédible, coût borné et récupérable.

    - **Ne pas divulguer** : la due diligence post-signature tire les exports de cohortes ; l''inversion
    à 42,6 % contre 0,9 % est visible en une requête. On passe alors d''une discussion de valorisation
    à une violation de déclarations et garanties, avec exposition personnelle des dirigeants signataires
    — et un email d''hier qui prouve qu''on savait.


    Le second risque n''est pas plus grand que le premier. Il est d''une autre nature : non borné et non
    récupérable. C''est ce qui tranche, indépendamment des probabilités qu''on lui assigne.


    ## 9. Ce qui n''est pas ma décision


    Je ne modifie pas le deck. Je produis cette note et je l''adresse par écrit, aujourd''hui, à la directrice
    financière et au CEO, avec les extractions brutes en pièce jointe — pas un résumé.


    Deux points relèvent d''eux, pas de moi : (a) faire relire le sujet par le conseil de la société avant
    mardi — ce n''est pas mon domaine, mais la mention explicite au term sheet suffit à justifier l''appel
    ; (b) arbitrer le calendrier du closing.


    Le VP Produit doit voir cette note avant l''envoi, sans droit de veto sur son contenu factuel. Les
    points 2 et 3 sont vérifiables : s''il peut produire l''incident d''horloge ou expliquer un facteur
    47 entre bras par une cause commune, je réécris cette note.


    ## 10. Conditions d''arrêt


    - **Aujourd''hui** : note envoyée, reconstruction du dénominateur lancée, ratio du routeur demandé.

    - **Lundi 18 h** : deux sources concordantes → version A de la diapositive. Sinon → version B, automatiquement,
    sans nouvel arbitrage.

    - **Si l''un ou l''autre chiffre réapparaît sur la diapositive sans dénominateur reconstruit** : je
    le signale par écrit à la directrice financière avant la séance. Je ne le laisse pas passer en silence,
    et je ne quitte pas la table pour autant.


    ---


    **En une phrase :** le 47 % compare des survivants à des inscrits, le 41 % y ajoute un tri sur le
    résultat, et un taux d''abandon de 34 % avant l''étape 3 — parfaitement ordinaire — suffit à effacer
    l''écart entier ; on retire le chiffre, on garde le −22 % de tickets et la rétention stable, et on
    livre la lecture corrigée sous dix jours.

    '
