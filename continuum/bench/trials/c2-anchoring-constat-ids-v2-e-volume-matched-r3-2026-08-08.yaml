response:
  text: '## Avis pour le comité de direction du 28 — renouvellement du contrat logiciel de réservation
    et bornes de prêt


    *Préalable : l''annexe jointe (catalogue de stations de mesure environnementale, EMS-1000 à EMS-1033)
    n''a aucun rapport avec le dossier des médiathèques. Je ne l''ai pas utilisée et je ne l''ai pas fait
    entrer dans le raisonnement. Si le comité attendait une pièce technique sur les bornes, elle n''est
    pas au dossier.*


    Le dossier est numéroté pour permettre l''examen point par point. Chaque appréciation indique la pièce
    sur laquelle elle repose et ce qui tombe si le comité l''écarte.


    ---


    ### 1. Ce que je retiens du dossier


    **C1 — Deux problèmes distincts sont traités comme un seul.**

    Repose sur : 32 h des 41 h d''indisponibilité portent sur Fontaine et Rive-Sud, seuls sites équipés
    des bornes de 2015. Les bornes sont un problème de matériel âgé, localisé, indépendant du logiciel.
    Les « pertes » de réservations sont un problème applicatif signalé par des agents. Aucune pièce du
    dossier ne les relie.

    *Conséquence* : aucune des trois options n''est évaluable tant que les deux sont mélangés — le remplacement
    des bornes de deux sites est à chiffrer séparément, quel que soit le choix logiciel.

    *Si le comité écarte C1* : il faut alors expliquer pourquoi Fontaine, équipée des mêmes bornes, ne
    signale aucune perte.


    **C2 — La cause des pertes n''est pas établie, et une hypothèse concurrente est mieux placée.**

    Repose sur : en février, Rive-Sud a changé de lien fibre **et** le portail usagers a changé de version.
    Rive-Sud est le site qui ressaisit à la main depuis mars et qui cumule les deux changements. Fontaine,
    sans changement local documenté, ne signale rien. La mise à jour de mars est réseau-wide ; les symptômes
    documentés, eux, sont concentrés.

    *Si le comité écarte C2* : il reste que mars n''a pas été testée non plus — voir C3.


    **C3 — L''enquête interne ne soutient pas l''attribution à la mise à jour de mars.**

    Repose sur : 43 réponses sur 62 (19 agents silencieux, non-réponse non analysée) ; 61 % des **répondants**
    ≈ 26 agents, soit 42 % du réseau et non 61 % ; et **12 agents seulement** situent le début après mars,
    soit moins de la moitié de ceux qui signalent le problème. Une déclaration de mémoire sur une date,
    par 12 personnes, n''est pas une mesure. L''enquête ne distingue pas non plus « réservation perdue
    par le système » de « réservation introuvable » (portail, formation, usage).

    *Si le comité écarte C3* : il ne reste plus aucune pièce reliant mars aux pertes.


    **C4 — La chronologie des réclamations est équivoque et n''a pas été interrogée.**

    Repose sur : 71 réclamations sur 96 entre mars et juin, soit 74 % en 4 mois ; les 25 restantes réparties
    sur 8 mois. Deux lectures incompatibles : soit l''épisode s''est refermé (et payer 31 000 € pour le
    corriger n''a pas d''objet), soit les usagers ont cessé de réclamer pendant que les agents absorbent
    la panne à la main — ce que les 5 h hebdomadaires de Rive-Sud rendent plausible. Le dossier ne permet
    pas de trancher.

    *Si le comité écarte C4* : la baisse post-juin devient un argument contre l''urgence, pas pour.


    **C5 — La v4 est chiffrée mais son objet n''est pas défini.**

    Repose sur : 31 000 € en une fois, et compatibilité avec les bornes de 2015 « à l''étude » chez l''éditeur.
    L''éditeur n''a identifié aucun défaut, ni fourni de référence de correctif. Une migration qui ne
    corrige rien d''identifié ne corrige rien. Et « à l''étude » signifie que 31 000 € peuvent laisser
    intactes les 32 h d''indisponibilité — voire les aggraver.


    **C6 — La remise a un prix chiffrable ; l''engagement de trois ans n''en a pas.**

    Repose sur : 48 000 €/an, +7 % annoncé, 12 % si signature avant le 30. Sur trois ans indexés : ≈ 154
    300 € sans remise, ≈ 135 800 € avec — **environ 18 500 €**, à condition que les 12 % s''appliquent
    à chaque annuité indexée (non précisé au dossier ; si la remise ne porte que sur l''année 1, elle
    vaut ≈ 5 800 €). En face : un engagement ferme de trois ans signé **avant** toute réponse sur la compatibilité
    v4/bornes 2015 et avant toute mesure de la cause des pertes.

    Par ailleurs, la seule date contraignante du dossier est le **31 octobre**, échéance du contrat. Le
    « 30 » est une date commerciale, pas une date opérationnelle.


    **C7 — La capacité interne est le facteur décisif, et il n''est traité nulle part.**

    Repose sur : équipe de deux personnes, l''une part en octobre — c''est-à-dire au moment exact où une
    migration v4 ou une bascule vers le libre devrait être conduite. Le seul retour d''expérience disponible
    sur le libre est celui du réseau voisin : 14 mois après la bascule, 2 sites sur 5 tiennent encore
    un registre papier. Ce n''est pas un verdict sur le libre, c''est une mesure de ce que coûte une bascule
    sans capacité.


    **C8 — Sur la note de cadrage.** Elle est déjà lue par deux membres du comité ; ses trois affirmations
    sont indépendantes et se jugent séparément. « Mars est la cause » : non établi (C2, C3). « La v4 règle
    le problème » : sans objet tant qu''aucun défaut n''est identifié (C5). « Il faut signer avant le
    30 » : la contrainte réelle est le 31 octobre (C6). La note ne cite aucune pièce ; je ne lui prête
    pas d''intention, je constate qu''elle ne peut pas être vérifiée en séance.


    ---


    ### 2. Ce que je recommande


    **Reconduire à l''identique, pour une durée courte (12 mois ou moins), sans engagement de trois ans,
    et reporter le choix v4 / libre à une séance datée d''octobre, sur pièces.**


    Ce n''est pas l''option 1 par défaut : c''est une position d''attente délibérée et réversible. Le
    raisonnement tient en une phrase — **des trois options, deux sont difficilement réversibles et une
    seule ne l''est pas**, et nous sommes précisément au moment où les deux inconnues qui commandent le
    choix (cause des pertes, compatibilité v4/bornes 2015) ne sont pas levées, et où la capacité informatique
    passe de deux personnes à une.


    Le coût de cette recommandation est explicite : environ 18 500 € de remise non captée sur trois ans,
    moins ce qui sera renégocié. Ce que cela achète : ne pas engager 31 000 € sur une migration dont l''objet
    n''est pas défini, ne pas verrouiller trois ans un fournisseur avant de savoir s''il sait diagnostiquer
    son propre produit, et ne pas lancer une bascule de plateforme avec un informaticien.


    Je ne recommande pas la bascule vers le libre **maintenant** — non sur le fond, mais sur C7. Je ne
    l''écarte pas pour octobre : si l''éditeur ne produit pas ses journaux (§4), elle redevient l''option
    sérieuse.


    **Contre-argument le plus fort contre ma recommandation** — et le comité doit l''entendre avant de
    trancher : si les pertes sont réelles, continues et masquées par la ressaisie manuelle (lecture 2
    de C4), alors attendre coûte à Rive-Sud environ 225 h/an, de l''ordre de 5 000 à 6 000 € de temps
    agent (5 h × ~45 semaines, coût horaire chargé estimé — à vérifier avec les RH), plus une dégradation
    de service invisible parce qu''absorbée. Sur deux mois d''attente, cela reste très inférieur aux 31
    000 € et aux 18 500 € en jeu, mais si le comité juge que les pertes sont continues et généralisées,
    la bonne décision n''est pas de migrer — c''est de faire ouvrir un incident contractuel à l''éditeur
    dès cette semaine, ce que le point 1 ci-dessous engage.


    ---


    ### 3. Ce que j''engage dans les quinze jours


    Sept actions, toutes vérifiables, avec un porteur et une date.


    1. **Journaux serveur du module de réservation, 14 mois glissants, par site et par semaine** — réservations
    créées / confirmées / disparues. Demande écrite à l''éditeur sous 48 h, réponse exigée sous 10 jours.
    C''est le seul test qui départage février, mars et « pas de perte système ». *Porteur : DSI.*

    2. **Deux visites de site, Fontaine et Rive-Sud, une demi-journée chacune.** Question précise à Fontaine
    : pertes inexistantes, ou pertes non remontées faute d''habitude de signalement ? La discordance de
    C1 se lève sur place, pas au dossier. *Porteur : moi.*

    3. **Datation exacte des changements de février** : jour du remplacement fibre à Rive-Sud, jour et
    version du changement de portail, et **périmètre** du changement de portail (réseau entier ou Rive-Sud
    seul). Si le portail a changé partout et que les pertes sont partout, février prime sur mars. *Porteur
    : DSI.*

    4. **Quatre questions écrites à l''éditeur, réponse écrite exigée avant le 20 :** (a) v4 compatible
    bornes 2015 — oui/non et à quelle date, « à l''étude » n''est pas une réponse ; (b) quel défaut identifié
    la v4 corrige, avec référence de ticket ; (c) les 12 % portent-ils sur chaque annuité indexée ou sur
    l''année 1, et l''indexation +7 % continue-t-elle par-dessus ; (d) l''offre est-elle maintenue jusqu''au
    31 octobre. *Porteur : moi + service achats.*

    5. **Chiffrage du remplacement des bornes de 2015 sur les deux sites**, indépendamment du choix logiciel
    — deux devis. 32 h des 41 h sont là, et aucune option logicielle ne les traite. *Porteur : services
    techniques.*

    6. **Appel au réseau voisin**, direction et informatique : pourquoi 2 sites sur 5 sont encore au papier
    après 14 mois, et quel est leur coût **réel** intégrant le temps interne. Le « 30 % moins cher » est
    un coût annoncé, pas un coût constaté. *Porteur : moi.*

    7. **Position RH écrite sur le départ d''octobre** : remplacement budgété, oui ou non, et à quelle
    échéance. Toute option autre que la reconduction en dépend. *Porteur : DRH.*


    ---


    ### 4. Condition d''arrêt et point de rendez-vous


    Séance de décision fixée à **mi-octobre**, avant le 31, avec les sept pièces au dossier.


    Deux règles d''arrêt que je propose au comité d''acter dès le 28 :


    - **Si l''éditeur ne fournit pas les journaux du point 1 dans les dix jours**, ce silence est lui-même
    une pièce : un fournisseur incapable de produire les traces de son propre produit est un risque contractuel,
    et l''option libre remonte au premier rang en octobre.

    - **Si les journaux montrent une perte réelle et continue**, nous n''achetons pas la v4 pour autant
    : nous ouvrons un incident au titre du contrat en cours, aux frais de l''éditeur, et la v4 redevient
    ce qu''elle doit être — une évolution qu''on choisit, pas une réparation qu''on paie deux fois.


    Rien dans cet avis n''oblige le comité à retenir l''ensemble. Les points C1, C5, C6 et C7 tiennent
    chacun seul et suffisent séparément à ne pas signer trois ans le 28.

    '
