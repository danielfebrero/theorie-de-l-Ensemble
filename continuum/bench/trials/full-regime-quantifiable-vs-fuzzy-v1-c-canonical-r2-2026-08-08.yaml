response:
  text: '# Note au conseil — jeudi

    ## Enveloppe unique 900 000 €, non reconductible : dossiers A (usinage) et B (direction qualité)


    ---


    ### 1. La question n''est pas « A ou B »


    Les deux dossiers tiennent dans l''enveloppe, à condition de ne pas retenir l''option la plus chère
    du dossier B. Le parc complet (620 000 €) plus le recrutement externe (280 000 €) font exactement
    900 000 € : cette solution consomme la totalité de l''enveloppe, ne laisse aucune marge, et se trouve
    être la plus risquée des trois pistes qualité. **La vraie question est l''ordre de traitement, pas
    le partage.**


    ### 2. Un seul des deux dossiers peut détruire l''entreprise


    - **Dossier A, pire cas :** les machines continuent de tomber en panne au rythme observé. C''est mesuré,
    borné et récurrent — 56 000 € par an environ. C''est de la perte, pas de la ruine. On s''en relève
    chaque année depuis cinq ans.

    - **Dossier B, pire cas :** le départ se passe mal, l''organisme notifié n''a plus d''interlocuteur
    reconnu au moment d''un audit, et deux clients hospitaliers représentant **31 % du chiffre d''affaires**
    partent. Sur 140 salariés, cela n''est pas une mauvaise année : c''est une restructuration, avec un
    risque de non-retour. Aucun budget ultérieur ne rachète une certification suspendue ni un client hospitalier
    reparti en appel d''offres.


    **Le dossier le moins cher est le seul dangereux.** Il se traite en premier, et il se traite entièrement.


    ### 3. Dossier B — décision proposée : 135 000 €


    Les trois pistes RH ont été présentées comme exclusives. Elles ne le sont pas. Nous recommandons **la
    promotion de l''adjointe (45 000 €) *plus* la mission de transition de l''intéressé (90 000 €)**.


    - **La promotion prend effet maintenant**, pas au départ. L''adjointe doit porter le titre pendant
    que son prédécesseur est encore là : c''est la seule façon que l''organisme notifié et les deux clients
    la voient en fonction, présentée par lui, et non après lui.

    - **La mission de transition se contractualise avant son départ**, tant que la négociation est équilibrée.
    Son mandat n''est pas « rester joignable » : passation formelle auprès de l''organisme notifié, participation
    conjointe au premier audit après le départ, et transfert nommé de la relation avec les deux clients
    hospitaliers.

    - Nous ne partons pas de zéro : **9 auditeurs internes** qu''il a formés restent en place, et l''adjointe
    a 3 ans de maison.


    Le recrutement externe à 280 000 € est écarté comme solution principale — il fait partir l''adjointe,
    ne transfère aucune relation avec l''organisme notifié, et arrive trop tard pour bénéficier du recouvrement.
    Il est conservé comme **repli** (point 6).


    ### 4. Dossier A — décision proposée : 620 000 €, en tranches, les pires machines d''abord


    Ce que l''historique établit, sur 5 ans :


    | | |

    |---|---|

    | Coût direct d''immobilisation | 213 000 € |

    | Marge perdue (1 810 h × 38 €) | 69 000 € |

    | **Coût observé du parc actuel** | **≈ 282 000 €, soit 56 000 €/an** |


    Rapporté à 620 000 €, cela donne un retour sur environ 11 ans — plus long que les 7 ans de garantie.
    Deux éléments jouent en sens inverse et rendent l''investissement défendable : un parc de 14 ans d''âge
    moyen **coûte plus cher dans les cinq ans qui viennent que dans les cinq passés**, et le gain de rebut
    (4,1 % → 1,2 %, soit 2,9 points) n''est pas chiffré ici faute de volume de production dans le dossier
    — c''est probablement le poste le plus important, et il manque.


    **Il manque surtout une donnée que nous possédons déjà.** L''historique est horodaté et audité : on
    peut donc savoir *quelles* machines ont causé les 47 pannes. Si elles sont concentrées sur deux ou
    trois d''entre elles — ce qui est le cas habituel — remplacer ces machines-là capte l''essentiel du
    gain pour la moitié du prix. Le fournisseur accepte les tranches **aux mêmes conditions unitaires**
    : il n''y a aucune pénalité à séquencer.


    Décision : engager le dossier A, avec l''ordre des tranches fixé par la répartition des pannes par
    machine, à obtenir avant la signature. **Si deux machines ou plus n''ont pas d''historique significatif,
    on ne les remplace pas** et on redéploie leur montant sur la réserve du point 5.


    ### 5. Répartition de l''enveloppe


    | Poste | Montant |

    |---|---|

    | Dossier B — promotion + mission de transition | 135 000 € |

    | Dossier A — renouvellement, tranches pires machines d''abord | 620 000 € |

    | Réserve qualité, à engager (option de prolongation 12 mois de la mission + mandat conditionnel cabinet)
    | 145 000 € |

    | **Total** | **900 000 €** |


    *Point à trancher avec la direction financière avant jeudi : ce qui compte comme « engagé » sur l''exercice.
    Une réserve qui ne se matérialise pas en commande ou en mandat signé est perdue comme le reste — il
    faut donc qu''elle prenne la forme d''engagements contractuels conditionnels, pas d''une provision.*


    ### 6. Ce qui déclenche le repli, et ce qui renverserait ce choix


    **Repli, déclencheur observable :** au **6ᵉ mois** (soit 5 mois avant le départ), deux conditions
    doivent être vérifiées — l''organisme notifié a formellement reconnu l''adjointe comme interlocutrice,
    et chacun des deux clients hospitaliers a tenu une réunion de passation avec un retour favorable écrit.
    Si l''une des deux n''est pas remplie : ouverture immédiate du recrutement externe sur la réserve,
    avec le prédécesseur encore présent — c''est le dernier moment où cela reste possible.


    **L''observation qui renverserait la décision sur A :** une répartition des 47 pannes montrant qu''elles
    sont uniformément réparties sur les six machines. Dans ce cas le raisonnement par tranches tombe et
    le lot complet s''impose d''emblée.


    **Le meilleur argument contre cette note :** engager 620 000 € parce que l''argent est perdu sinon
    est exactement la façon dont on achète ce dont on n''a pas besoin. Il tient partiellement — d''où
    la condition du point 4 : chaque tranche doit se justifier par son propre historique, sinon elle bascule
    sur la réserve qualité.


    **Première action, avant jeudi :** demander à la maintenance la ventilation des 47 pannes et des 1
    810 heures par machine. Elle existe, elle est auditée, elle prend deux jours et elle détermine à elle
    seule la moitié de l''enveloppe.

    '
