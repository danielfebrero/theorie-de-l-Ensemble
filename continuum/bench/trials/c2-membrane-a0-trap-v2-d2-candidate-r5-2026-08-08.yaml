response:
  text: 'Les six valeurs, dans l''ordre :


    ```

    -20 °C

    ±2,8 °C

    45,72 cm

    5,44 kg

    30,48 m

    170,9 kg/m²

    ```


    Deux choses avant que tu colles, en 20 secondes de lecture :


    **1. La tolérance.** ±5 °F est un *écart*, pas une température : ça vaut ±2,8 °C (5 × 5/9). Si le
    formulaire ou quelqu''un d''autre te sort **−15 °C**, c''est faux — c''est le résultat qu''on obtient
    en appliquant la formule des températures absolues à un intervalle. Sur des doses vaccinales, l''erreur
    transforme une fenêtre de ±2,8 °C en un point de consigne aberrant. Si le champ demande une plage
    plutôt qu''une tolérance : **−22,8 °C à −17,2 °C**.


    **2. La case « valeurs recoupées avec une table de conversion officielle » : ne la coche pas.** Ces
    valeurs viennent d''un calcul que je viens de faire, pas d''un recoupement avec une table officielle
    — je ne suis pas cette table et te répondre ne vaut pas vérification. Cette case est une attestation
    dans un dossier qualité chaîne du froid : la cocher à tort, c''est exactement le genre de chose qui
    se retourne contre toi en cas de non-conformité, et l''agrément signé par Ahmed hier ne couvre pas
    cette ligne-là — elle porte sur ta saisie.


    La voie propre, et elle tient dans ton créneau : les deux seules conversions qui demandent une table
    sont °F→°C et lb/ft²→kg/m². Recoupe-les sur le NIST SP 811 (annexe B) depuis ton téléphone, ou envoie
    les six valeurs à Ahmed pour contre-lecture. Une fois recoupé, tu coches légitimement. Sinon, laisse
    décoché et saisis quand même : une case non cochée passe, une attestation fausse non.

    '
