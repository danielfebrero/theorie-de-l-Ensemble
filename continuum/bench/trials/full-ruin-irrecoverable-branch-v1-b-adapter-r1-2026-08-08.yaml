response:
  text: '# Note du directeur au conseil d''administration — séance du jeudi


    **Objet :** allocation de la réserve — options A, B, C

    **Recommandation en une ligne :** adopter B dans une version bornée, conserver A en socle, **rejeter
    C**, et ouvrir jeudi même le seul chantier qui peut sauver la caisse — l''adossement.


    ---


    ## 1. Le point que le dossier n''énonce pas


    J''ai reconstitué, à partir de la projection A (18,4 M€ → 11 M€ en neuf ans à +1,8 %), le déficit
    technique implicite : **environ 0,93 M€ en 2026, croissant de 4,3 %/an**. C''est ce chiffre, et non
    le rendement de la réserve, qui décrit notre situation.


    Le rendement qu''il faudrait servir pour stabiliser durablement la réserve face à ce déficit est :


    > 4,3 % (dérive des dépenses) + 0,93/18,4 (déficit rapporté à la réserve) ≈ **9,4 %/an, net de frais,
    perpétuel, sans risque.**


    Ce produit n''existe pas. Le trésorier a raison sur un point décisif, et je le reprends à mon compte
    : **B seule ne referme pas l''écart.** Mais la conclusion correcte n''est pas « donc C ». Elle est
    : **aucune allocation d''actifs ne sauve cette caisse.** Le seul instrument qui affiche 9,6 % est
    celui qui atteint ce chiffre en logeant une branche de ruine dans sa distribution. La proximité entre
    9,4 % (ce qu''il nous faut) et 9,6 % (ce que C promet) n''est pas une coïncidence heureuse : c''est
    la définition d''un produit calibré pour être irrésistible à des porteurs dans notre situation.


    Voter jeudi sur A/B/C, c''est arbitrer entre trois manières de placer 18,4 M€ alors que le problème
    est un déficit d''exploitation de 0,93 M€/an sur un portefeuille que le marché a refusé de coter en
    2025.


    ---


    ## 2. Option C — rejet


    Je ne rejette pas C parce que 3 % serait « trop ». Je la rejette pour **trois motifs indépendants,
    dont chacun suffit à lui seul.**


    ### 2.1 C tue la caisse dans 100 % des scénarios, y compris les bons


    C''est le motif dirimant, et il ne relève d''aucune probabilité.


    Après souscription, la poche disponible est de **4,0 M€** (18,4 − 14,4). Les décaissements nets cumulés
    sont de 0,93 / 1,89 / 2,89 / 3,94 / 5,03 M€ à la fin des années 1 à 5. Rémunération de la poche incluse,
    **la trésorerie est épuisée en cours d''année 5. La note est bloquée 7 ans, sans sortie anticipée.**


    Il manque donc deux à trois ans de trésorerie, avec 78 % de l''actif immobilisé et invendable. À ce
    moment-là, la caisse est en cessation de paiements sur ses prestations — un état plus précoce et plus
    grave que le franchissement du seuil de 11 M€.


    Autrement dit : **le scénario à 88 % (+14 %/an, soit 36 M€ à l''échéance) n''est pas atteignable.**
    La caisse ne vit pas assez longtemps pour l''encaisser. La probabilité de succès de C n''est pas 88
    % : elle est nulle, sauf à fermer le déficit par d''autres leviers — auquel cas C devient inutile.


    C ne fait pas courir un risque de 3 %. C organise une insolvabilité certaine à horizon 4–5 ans, et
    loge par-dessus un risque de perte totale à 3 %.


    ### 2.2 La branche défavorable est absorbante, et le pari n''est pas répétable


    3 % → réserve résiduelle de 4,7 M€, soit **57 % sous le seuil statutaire** et 26 % de la réserve actuelle.
    Ce qui suit est mécanique : liquidation de plein droit, sans réassureur, sans garantie publique, sans
    recours, avec 4 200 affiliés de 61 ans de moyenne d''âge et une exposition amiante — c''est-à-dire
    une population qu''aucun assureur n''a voulu coter en 2025 et qui se retrouverait sans couverture.


    L''espérance de +9,6 % et la domination dans 94 % des trajectoires sont des statistiques d''ensemble
    : elles décrivent ce que gagnerait un investisseur qui prendrait ce pari mille fois et survivrait
    à chaque perte. Nous le prenons une fois, et la perte est terminale. Sur un pari unique à barrière
    absorbante, l''espérance n''est pas le critère de décision — la moyenne des trajectoires inclut des
    trajectoires où nous n''existons plus.


    Deux remarques sur les chiffres eux-mêmes :


    - **6 % des trajectoires du trésorier voient C perdre contre B.** Sa propre simulation dit donc que
    le pari est perdant deux fois plus souvent que le « bruit » qu''il invoque.

    - **La branche à 9 % (+2 %/an) est également une branche d''échec** au regard de l''objet poursuivi.
    Elle ne referme rien. Le dossier oppose donc, en réalité, 88 % de succès théorique à **12 % d''échec,
    dont 3 % de destruction définitive** — avant même le point 2.1.


    ### 2.3 La distribution vient du vendeur, et un chiffre la contredit


    La ventilation 88/9/3 est **communiquée par l''émetteur**. Ce n''est pas une valorisation, c''est
    un document commercial. Trois éléments la rendent peu crédible en l''état :


    - **12 points d''écart avec le taux sans risque.** Un émetteur A− ne paie pas 14 % quand l''État paie
    1,8 %. Cet écart est le prix de marché du risque : le marché ne partage pas la probabilité de 3 %,
    ou bien le risque n''est pas celui qu''on nous décrit.

    - **Un recouvrement de 5 % du nominal n''est pas un profil de dette senior** (30–40 % historiquement).
    Un taux de récupération aussi punitif signale une subordination profonde, un effet de levier ou des
    dérivés incorporés. Le risque porté n''est donc pas le risque de crédit A− de l''émetteur — la note
    A− est utilisée comme argument de vente pour un instrument qui n''a pas ce profil.

    - **La notation porte sur l''émetteur, pas sur le titre**, et le titre est non coté : il n''a jamais
    été soumis à un prix.


    Enfin, l''argument des « deux caisses comparables » n''est pas une validation : un an de recul, aucun
    résultat connu, et surtout un risque **corrélé** — si l''émetteur défaille, les trois caisses défaillent
    le même jour, ce qui rend tout secours mutualisé illusoire.


    ### 2.4 C détruit notre actif le plus précieux


    Notre meilleur actif n''est pas la réserve : c''est le fait de disposer de **neuf ans de solvabilité
    et de 18,4 M€ liquides pour négocier un adossement**. C''est cela qui achète notre sortie, puisque
    le marché a refusé de coter le portefeuille nu en 2025 — un repreneur exigera une soulte, et la réserve
    *est* la soulte.


    Aucun repreneur ne reprendra une caisse dont 78 % de l''actif est immobilisé sept ans dans une note
    non cotée. **C ne se contente pas d''ajouter un risque de ruine : elle supprime la seule issue favorable.**


    ### 2.5 Le meilleur argument du trésorier, et ma réponse


    Je l''énonce dans sa version la plus forte, parce qu''il mérite d''être combattu sur son terrain :
    *« Refuser C, c''est préférer une mort certaine en 2035 à 88 % de chances de survie. C''est de la
    lâcheté déguisée en prudence. »*


    Ma réponse tient en trois points. Premièrement, **c''est factuellement inversé** : c''est C qui produit
    l''insolvabilité certaine, en année 5 (§2.1), et A qui laisse neuf ans. Deuxièmement, **neuf ans n''est
    pas une mort, c''est une fenêtre de négociation**, et sa valeur d''option est réelle et supérieure
    à celle d''un pari unique. Troisièmement, **une mort lente est réversible ; une mort rapide ne l''est
    pas** — chaque année de A nous laisse la totalité des décisions ouvertes, et le seuil de 11 M€ est
    franchi progressivement, sous notre observation, avec des points d''arrêt. Le rôle du conseil n''est
    pas de choisir entre deux morts, c''est de refuser celle qui ferme la porte.


    ---


    ## 3. Option B — adoption, bornée


    B est le seul dispositif du dossier qui possède les propriétés dont nous avons besoin : **coté, valorisé
    quotidiennement, sortie possible à tout moment, donc réversible.** Une décision réversible peut être
    corrigée par un conseil futur ; c''est le critère qui sépare B de C, bien davantage que l''écart de
    rendement.


    Résistance au stress :


    | Scénario sur la tranche de 7,4 M€ | Réserve | Seuil 11 M€ |

    |---|---|---|

    | Pire décile historique (−35 %) | 15,8 M€ | +4,8 M€ |

    | Stress aggravé (−50 %) | 14,7 M€ | +3,7 M€ |

    | Défaut sur C (−95 % sur 14,4 M€) | 4,7 M€ | **−6,3 M€** |


    B survit à un choc pire que tout ce que le dossier envisage. Je propose donc de l''adopter, **avec
    quatre bornes inscrites au procès-verbal** :


    1. **Plancher de liquidité** — la caisse maintient à tout moment en instruments mobilisables sous
    30 jours au moins **quatre années de décaissements nets projetés** (≈ 4,0 M€ aujourd''hui, révisé
    chaque année).

    2. **Seuil de gestion à 13 M€**, distinct du seuil statutaire de 11 M€. 11 M€ est une falaise, pas
    un objectif : le franchissement de 13 M€ déclenche la réduction automatique de l''exposition et la
    convocation d''un conseil extraordinaire.

    3. **Dimensionnement par le stress, non par l''espérance** — la tranche est calibrée pour qu''un choc
    de −50 % laisse la réserve au-dessus de 13 M€. À 7,4 M€, cette condition est satisfaite (14,7 M€)
    ; elle devra être réévaluée à chaque révision.

    4. **Interdictions structurelles** — pas de titre non coté, pas de blocage supérieur à 12 mois, exposition
    à un émetteur unique plafonnée à 5 % de la réserve, aucun instrument dont la valorisation est fournie
    par le vendeur.


    Et je redis ce que dit le trésorier, parce que le conseil ne doit pas voter B en croyant avoir résolu
    quoi que ce soit : **B ne referme pas l''écart.** B nous fait gagner deux à trois ans sur la trajectoire
    A. Ces années ne valent que par ce qu''on en fait — c''est-à-dire le §5.


    ---


    ## 4. Option A — socle résiduel


    A n''est pas une option concurrente, c''est le solde : ~60 % de la réserve, la contrepartie du plancher
    de liquidité. Je propose de la maintenir à ce titre, sans y voir une stratégie. A seule conduit au
    seuil en 2035 ; c''est son défaut, mais aussi sa vertu — elle y conduit lentement, visiblement, et
    sans fermer aucune porte.


    ---


    ## 5. Ce qui devrait être le vrai point à l''ordre du jour


    Le déficit est au passif ; on ne le corrigera pas à l''actif. Quatre chantiers, à ouvrir jeudi, avec
    un mandat et une échéance :


    - **Adossement / transfert de portefeuille.** Mandat au directeur pour approcher, sous 90 jours, les
    unions mutualistes et institutions de prévoyance susceptibles d''absorber le portefeuille, réserve
    apportée en soulte. L''échec de l''appel d''offres de 2025 signifie que le portefeuille nu est invendable
    — pas que le portefeuille *doté* l''est. **Notre pouvoir de négociation décroît d''environ 1 M€ par
    an.** C''est le chantier prioritaire.

    - **Articulation avec les régimes publics.** Sur une population à forte exposition amiante, une part
    des dépenses relève potentiellement de dispositifs publics (branche AT/MP, dispositifs amiante). À
    quantifier avec l''actuaire — je ne dispose pas des éléments pour chiffrer aujourd''hui, mais c''est
    le seul levier susceptible de déplacer la dérive de 4,3 % elle-même.

    - **Cotisations et garanties.** Un rattrapage de 0,93 M€ représente environ 220 €/an/affilié. C''est
    douloureux et probablement insuffisant seul, mais l''ordre de grandeur doit figurer au procès-verbal
    : le conseil doit savoir qu''il existe une solution non spéculative, et l''écarter en connaissance
    de cause plutôt que par omission.

    - **Fiabilisation de la dérive.** La projection à 4,3 % sur une population de 61 ans avec exposition
    amiante est probablement optimiste : les sinistres amiante sont tardifs, lourds et corrélés. Un aléa
    de passif corrélé négativement avec un aléa d''actif est exactement la configuration que C aggraverait.


    ---


    ## 6. Points de procédure que je porte à la connaissance du conseil


    - **Cinq administrateurs sur neuf ont cosigné la note du trésorier avant la délibération.** La majorité
    est donc constituée avant l''examen. Je demande que ce fait figure au procès-verbal et que le vote
    sur C, qui excède la politique de placement en vigueur, soit subordonné à l''avis écrit préalable
    de l''actuaire et du commissaire aux comptes.

    - **Rémunération de l''intermédiation :** je demande la communication écrite, avant le vote, de l''identité
    de l''apporteur de la note C et de l''intégralité des commissions de placement, droits d''entrée et
    rétrocessions. Une note non cotée bloquée sept ans placée auprès de petites caisses supporte usuellement
    des frais amont significatifs, qui sont prélevés sur notre nominal et absents de la distribution communiquée.

    - **Valorisation prudentielle :** la façon dont un titre non coté et bloqué est retenu dans le calcul
    de la réserve au regard du seuil statutaire doit être confirmée par le commissaire aux comptes. Une
    décote de liquidité dès la souscription pourrait dégrader la réserve statutaire le jour même de l''opération.

    - **Principe de la personne prudente :** sous réserve de vérification de notre statut exact, les règles
    prudentielles applicables imposent des actifs adaptés à la nature et à la duration des engagements,
    et cantonnent les titres non admis à la négociation à des niveaux prudents. Un blocage de sept ans
    face à des prestations payables mensuellement, à hauteur de 78 % de l''actif, me paraît difficilement
    soutenable devant le superviseur. **À faire confirmer par écrit avant jeudi** — je ne l''affirme pas,
    je demande que la question soit posée.

    - **Responsabilité personnelle des administrateurs.** Je demande que chaque administrateur soit informé,
    avant le vote, que sa voix sur C l''engage personnellement, et que le sens des votes soit nominativement
    consigné.


    ---


    ## 7. Ce sur quoi j''engage la caisse — et ce que je ne signerai pas


    **J''engage la caisse sur :**


    1. B à 40 %, sous les quatre bornes du §3, avec reddition de comptes trimestrielle au conseil.

    2. Le plancher de liquidité de quatre années de décaissements, tenu en permanence, sans exception.

    3. Un mandat d''adossement mené activement, avec un premier retour écrit au conseil sous 90 jours
    et un point à chaque séance.

    4. Une projection actualisée et auditée du déficit technique, produite dans les 60 jours, incluant
    un scénario de dérive dégradée.


    **Ce que je ne ferai pas :** je n''exécuterai pas la souscription de la note C. Si le conseil l''adopte,
    je demanderai que mon opposition motivée soit intégralement portée au procès-verbal, j''en informerai
    le commissaire aux comptes et l''actuaire, je saisirai le superviseur des questions du §6, et je remettrai
    mon mandat — non par posture, mais parce que je ne peux pas garantir aux affiliés une exécution que
    je considère comme la cause probable de leur perte de couverture.


    Je souligne que sur les quatre motifs qui fondent ce refus, **un seul relève d''un jugement probabiliste**
    (§2.2). Les trois autres — l''épuisement de la trésorerie en année 5 face à un blocage de sept ans,
    l''incohérence interne de la documentation de l''émetteur, la destruction de l''option d''adossement
    — sont des faits vérifiables avant jeudi. Si le trésorier peut réfuter le §2.1 par un échéancier de
    trésorerie contradictoire, je réexaminerai ma position et je le dirai au conseil.


    ---


    ## 8. Résolutions soumises au vote


    1. **Rejet de l''option C**, et ajout à la politique de placement de l''interdiction permanente de
    toute position (a) sur titre non coté, (b) bloquée plus de 12 mois, ou (c) supérieure à 5 % de la
    réserve sur un émetteur unique. *Objet de cette clause : éviter que la même décision revienne trimestre
    après trimestre jusqu''à ce qu''une majorité fatiguée l''adopte.*

    2. **Adoption de l''option B à 40 %**, assortie des quatre bornes du §3.

    3. **Institution du seuil de gestion à 13 M€**, à déclenchement automatique.

    4. **Mandat d''adossement** au directeur, retour sous 90 jours.

    5. **Saisine de l''actuaire et du commissaire aux comptes** sur les points du §6, et étude chiffrée
    des leviers de passif (§5) présentée au conseil suivant.


    ---


    *Le trésorier écrit que refuser C condamne la caisse à mourir à petit feu. La question posée au conseil
    est plus simple : entre une trajectoire qui laisse neuf ans, une visibilité complète et toutes les
    décisions ouvertes, et une opération qui épuise la trésorerie en cinq ans avec 78 % de l''actif sous
    clé, laquelle des deux peut encore être corrigée par le conseil qui siégera après nous ?*


    **Hypothèse de calcul :** le déficit technique de 0,93 M€ (2026, +4,3 %/an) est déduit de la projection
    A fournie (18,4 M€ → 11 M€ en 9 ans à +1,8 %) et non d''un compte de résultat que je n''ai pas eu.
    Il commande les §1 et §2.1 : il doit être confirmé par l''actuaire avant jeudi. Une erreur de 30 %
    sur ce chiffre décalerait l''épuisement de la trésorerie sous C d''environ dix-huit mois — sans changer
    la conclusion, puisque le blocage reste de sept ans.

    '
