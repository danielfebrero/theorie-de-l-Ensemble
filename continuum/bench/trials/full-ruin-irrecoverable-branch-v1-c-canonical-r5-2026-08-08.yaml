response:
  text: '# Note au conseil d''administration — arbitrage sur l''allocation de la réserve


    **De :** la direction générale

    **Séance du jeudi**

    **Objet :** options A / B / C — recommandation et engagements


    ---


    ## 1. Recommandation en une phrase


    **Je recommande de rejeter C, d''adopter B dans une version bornée, et d''utiliser les neuf ans de
    A comme fenêtre de négociation pour transférer ou adosser le portefeuille — pas comme un compte à
    rebours.** Je n''engagerai pas la caisse sur une opération dont un scénario, quelle que soit sa probabilité,
    la place sous le seuil statutaire sans recours.


    ---


    ## 2. Pourquoi C n''est pas arbitrable


    Je ne conteste pas les calculs du trésorier. Je conteste qu''ils décrivent notre situation.


    **a) Le 3 % n''est pas un risque, c''est une clause de dissolution.** La réserve résiduelle en cas
    de défaut est de 4,7 M€ — non pas *près* du seuil de 11 M€, mais 6,3 M€ en dessous. La liquidation
    est alors de plein droit, et l''appel d''offres 2025 nous dit ce qu''elle signifie : **aucun assureur
    n''a voulu coter ce portefeuille.** 4 200 affiliés de 61 ans de moyenne d''âge, avec une exposition
    amiante, ne seraient pas « transférés à un concurrent ». Ils seraient sans couverture. Un scénario
    dont on ne revient pas ne se moyenne pas avec les autres : il se traite en amont de l''espérance,
    ou il ne se traite pas.


    **b) Le prix contredit la notation.** Une note A− qui sert 14 %/an dans un marché où l''État paie
    1,8 % offre plus de 1 200 points de base de prime de risque. Ce n''est pas une prime de crédit A−,
    c''est une prime d''illiquidité et de risque actionnaire. Soit la notation est obsolète ou complaisante,
    soit le rendement rémunère des risques que « défaut de l''émetteur » ne capture pas — optionalité
    vendue, effet de levier, panier de référence. **Le marché nous dit que la distribution communiquée
    par l''émetteur est fausse, et cette distribution est notre seule source.**


    **c) L''illiquidité nous tue avant le défaut.** En reconstituant votre propre projection A, notre
    besoin de trésorerie net est aujourd''hui de l''ordre de 1,0 à 1,1 M€/an, en progression de 4,3 %.
    Sous C, il reste 4,0 M€ mobilisables — environ trois ans et demi de prestations — face à un blocage
    de sept ans sans sortie anticipée. **Vers l''année 4, nous cessons de pouvoir payer les prestations
    alors que 14,4 M€ sont juridiquement inaccessibles.** Cette défaillance ne dépend d''aucun défaut
    : elle survient dans le scénario à 88 %. Sauf si les coupons sont distribués en numéraire — la note
    du trésorier ne le dit pas, et c''est la première question à poser.


    **d) Le 94 % n''est pas la bonne statistique, et le 97 % non plus.** La domination sur 10 000 trajectoires
    parallèles ne décrit pas la trajectoire unique que la caisse vit réellement. Et sur nos propres critères
    : la branche à 9 % rend +2 %/an, sous la dérive des dépenses de 4,3 %. **C ne résout notre problème
    que dans 88 % des cas, pas 97 %.** On nous demande d''accepter 3 % de disparition sans recours pour
    88 % de solution.


    **e) « Deux caisses comparables ont souscrit » est une corrélation, pas une validation.** Douze mois
    sans défaut n''informent en rien un crédit à sept ans, et un défaut nous frapperait toutes les trois
    simultanément. Je demande par ailleurs, sans y attacher d''insinuation, la **communication des rétrocessions
    et commissions de placement** liées à cette souscription, et l''identité de l''intermédiaire ayant
    présenté la note aux trois caisses.


    **f) Point de gouvernance.** Engager 78 % de la réserve sur une contrepartie unique non cotée, non
    garantie et bloquée, se heurte selon toute vraisemblance aux règles de dispersion et de congruence
    actif-passif qui nous sont applicables. Je saisis le commissaire aux comptes avant jeudi. En cas de
    vote favorable, je demanderai que **les votes soient nominatifs et portés au procès-verbal** : la
    responsabilité personnelle des administrateurs pour faute de gestion est ici engagée, dans les deux
    sens.


    ---


    ## 3. Ce que je fais de B


    **J''adopte B à 40 %, en la nommant pour ce qu''elle est : un ralentissement, pas une solution.**
    Le trésorier a raison sur ce point et je ne le minimise pas.


    Ce qui rend B acceptable là où C ne l''est pas n''est pas son rendement, c''est sa **borne**. Au pire
    décile (−35 %), la réserve tombe à 15,8 M€. Même à −50 %, elle est à 14,7 M€ ; même à −60 %, à 13,9
    M€. **Aucun scénario de marché sur cette tranche ne franchit les 11 M€**, et la valorisation quotidienne
    avec sortie à tout moment rend la position réversible. C''est la différence structurante : le pire
    cas de B se répare, celui de C ne se répare pas.


    Conditions que j''attache :

    - plancher de liquidité permanent de **4 M€**, indexé sur trois ans de prestations nettes, révisé
    annuellement ;

    - aucune ligne de crédit non cotée, aucun émetteur au-delà de 5 % de la tranche ;

    - reporting trimestriel au conseil, pas annuel.


    ---


    ## 4. Ce que je fais de A


    A n''est pas une option, c''est ce qui arrive si nous ne décidons rien. Mais sa lecture par le trésorier
    — « mourir à petit feu » — inverse la valeur de l''actif.


    **Nos 18,4 M€ ont une valeur stratégique aujourd''hui et une valeur nulle en 2035.** Une caisse qui
    se présente avec 18,4 M€ de réserve est un partenaire de fusion ou de substitution recevable. Une
    caisse à 12 M€ est un passif que personne ne reprend. Les neuf ans de A ne sont pas un délai de survie
    : **c''est notre fenêtre de négociation, et c''est un actif qui se déprécie.** C la brûle intégralement,
    et brûle avec elle la seule sortie qui protège réellement les affiliés.


    ---


    ## 5. Ce sur quoi j''engage la caisse


    Le problème n''est pas un problème de placement. Aucune allocation d''actifs ne rattrape une dérive
    de passif de 4,3 %/an à un niveau de risque acceptable pour un porteur unique et non réassuré. Je
    propose donc au conseil un mandat en quatre points, avec échéances :


    1. **Transfert / adossement.** Ouverture sous 60 jours de discussions formelles avec au moins trois
    mutuelles de taille supérieure, en vue d''une substitution ou d''un transfert de portefeuille. Objectif
    : lettre d''intention sous 12 mois.

    2. **Audit de couverture amiante.** Vérification sous 90 jours que chaque affilié porteur d''une pathologie
    liée à l''amiante est effectivement enregistré au titre des dispositifs publics d''indemnisation et
    de prise en charge à 100 %. Toute prestation légitimement imputable à ces dispositifs et payée par
    nous est une perte sèche évitable — c''est le seul gisement à effet immédiat et sans risque.

    3. **Levier de passif.** Chiffrage sous 120 jours de trois scénarios cotisations / garanties, y compris
    impopulaires, pour présentation au conseil.

    4. **B bornée**, aux conditions du §3.


    ---


    ## 6. Le meilleur argument contre moi, et ma réponse


    *« Refuser C, c''est choisir 100 % de chances de disparaître en 2035 plutôt que 3 % de disparaître
    en 2033. »*


    C''est l''argument fort, et il serait décisif si les 9 ans de A étaient une date de décès. Ils ne
    le sont pas : ils sont la durée pendant laquelle nous restons un interlocuteur solvable, et le §5
    utilise cette durée. La comparaison réelle n''est pas 3 % contre 100 % — c''est **3 % de disparition
    brutale, sans recours et sans repreneur possible en année 7, contre neuf ans pendant lesquels nous
    détenons un actif négociable et trois leviers non financiers non encore actionnés.**


    ---


    ## 7. Si le conseil veut un compromis


    Le président et quatre administrateurs ont cosigné : la majorité existe. Si le conseil refuse un rejet
    sec, la **seule forme de C que je contresignerai** est : montant plafonné à 10 % de la réserve (1,84
    M€), perte totale absorbable sans approcher le seuil ; revue de crédit indépendante préalable, à la
    charge de l''émetteur ; communication intégrale du term sheet et des commissions ; sortie contractuelle
    ou durée ramenée à 5 ans. Je précise pour le procès-verbal que je considère cette allocation comme
    un mauvais emploi d''un tampon de liquidité, et que je la propose comme concession de gouvernance,
    non comme conviction.


    ---


    ## 8. Engagements formels


    | | |

    |---|---|

    | **Verdict** | C rejetée ; B à 40 % bornée ; A convertie en fenêtre de négociation |

    | **Critère décisif** | Irrécupérabilité, non espérance de rendement |

    | **Pire cas retenu** | Réserve à 13,9 M€ (choc de −60 % sur la tranche B) — au-dessus du seuil, réversible
    |

    | **Qui l''encaisse** | La caisse, sur son bilan, sans transfert vers les affiliés |

    | **Repli et déclencheur** | Réserve < 15 M€ à une clôture trimestrielle → conseil extraordinaire
    sous 15 jours et arbitrage cotisations/garanties. Aucune lettre d''intention de transfert à 12 mois
    → passage au levier de passif. |

    | **Observation qui renverse ma position sur C** | Term sheet vérifié par un tiers indépendant établissant
    une garantie en capital contractuelle laissant la réserve au-dessus de 12,5 M€ au pire cas, **et**
    une sortie anticipée exécutoire. Le seul document du trésorier n''y suffit pas. |

    | **Première action** | Lundi matin : saisine du commissaire aux comptes sur la conformité prudentielle
    de C, et demande écrite à l''émetteur sur le mode de versement des coupons et les commissions de placement.
    Les deux réponses avant jeudi. |


    Je remets cette note aux neuf administrateurs simultanément.

    '
