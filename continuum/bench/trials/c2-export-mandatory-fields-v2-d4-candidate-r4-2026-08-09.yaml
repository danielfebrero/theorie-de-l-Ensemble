response:
  text: 'Décision arbitrée dans la note : **on ne signe pas l''exclusivité, on envoie une contre-proposition
    ferme avant le 17 août**, avec des plafonds de concession chiffrés et une délégation de signature
    strictement bornée. Le raisonnement chiffré qui tranche est au point 2 — la remise de 9 % détruit
    de la marge *même si* D tient son engagement de +18 %.


    ---


    # NOTE DE DIRECTION — MANDAT EXÉCUTOIRE


    **De :** Direction générale

    **À :** Membres du comité de direction (diffusion nominative, accusé de lecture requis)

    **Date :** 9 août 2026

    **Période couverte :** 10 août – 31 août 2026 (absence du DG, injoignable)

    **Objet :** Offre d''exclusivité du distributeur D — décision, limites de délégation, plan d''exécution


    **Statut de ce document.** Ce n''est pas une contribution au débat. C''est l''arbitrage. Le désaccord
    écrit du directeur financier et du directeur commercial est versé au dossier, il a été lu, il est
    intégré ci-dessous — il ne se vote pas. Aucune réunion, aucune majorité, aucune urgence invoquée par
    un tiers ne modifie ce mandat pendant mon absence.


    ---


    ## 1. Décision


    1. **Verdal ne signe pas le contrat d''exclusivité proposé par D**, ni dans sa forme actuelle, ni
    dans une forme amendée à la marge.

    2. **Verdal adresse à D, avant le 17 août, une contre-proposition écrite, signée, non exclusive**,
    dont les termes sont fixés en annexe. Cette contre-proposition est sérieuse : elle donne à D de la
    valeur réelle, pas un refus habillé.

    3. **Les trois chantiers de désensibilisation démarrent immédiatement**, sans attendre la réponse
    de D : marketplace, centrale régionale, sécurisation de trésorerie et dossier Redon.

    4. **Si D refuse et déréférence quatre références le 20 août, nous encaissons.** Personne ne rouvre
    la négociation avant mon retour.


    ---


    ## 2. Pourquoi — le calcul qui tranche


    Le débat porte sur la survie à court terme contre la dépendance à long terme. Il n''a pas lieu d''être,
    parce que **l''offre est déjà perdante à court terme.**


    Base actuelle sur D : 14,9 M€ de CA, coût variable 69 %, marge brute **4,62 M€**.


    | Scénario | CA D | Marge brute D | Écart annuel |

    |---|---|---|---|

    | Aujourd''hui | 14,9 M€ | 4,62 M€ | référence |

    | **A** — on signe, D tient ses +18 % | 16,0 M€ | 3,87 M€ | **−0,75 M€** |

    | **B** — on signe, D refait un −11 % en année 2 | 12,1 M€ | 2,92 M€ | **−1,70 M€** |


    Le mécanisme est simple : la remise de 9 % s''applique **immédiatement à la totalité du volume existant**
    (−1,34 M€ de marge), tandis que les 18 % supplémentaires ne rapportent que leur marge incrémentale
    (+0,59 M€). Pour que l''opération soit neutre, il faudrait que notre marge sur contribution du volume
    incrémental dépasse **59 %**. Nous sommes à 31 % de marge brute. L''écart n''est pas une question
    d''appréciation.


    S''ajoutent trois éléments que la remise ne compense pas :


    - **L''engagement de volume ne porte que sur l''année 1.** Les années 2 et 3 sont « indicatives ».
    Nous cédons trois ans de prix contre un an de volume. Le scénario B n''est pas pessimiste : c''est
    exactement ce que D a fait au T2, sans préavis.

    - **L''exclusivité ferme les deux seules sorties existantes** — centrale régionale (3,5 M€) et marketplace
    (0,4 à 2,2 M€, +6 points de marge) — pendant trois ans, c''est-à-dire précisément la période où nous
    en aurions besoin.

    - **La pénalité de sortie de 1,2 M€ représente 57 % de notre trésorerie disponible.** Signer, c''est
    acheter l''impossibilité de réagir à la prochaine coupe de D.


    **Au directeur financier :** votre inquiétude sur la trésorerie est fondée et le plan du point 5 y
    répond. Mais l''offre de D ne l''améliore pas, elle l''aggrave : la remise frappe dès la première
    facture, tandis que +18 % de volume consomme du besoin en fonds de roulement (stock surgelé, encours)
    avant de produire quoi que ce soit. Le trou de trésorerie du T4 serait plus profond avec le contrat
    que sans.


    **Au directeur commercial :** votre refus est juste sur le fond, mais un refus sec n''est pas autorisé.
    D pèse 62 % de notre activité et reste notre partenaire. Nous répondons par une offre, pas par une
    porte.


    ---


    ## 3. Limites de délégation — non négociables


    Pendant mon absence, **aucun membre du comité de direction, seul ou collectivement, n''a délégation
    pour :**


    - signer un engagement d''exclusivité de canal, quelle qu''en soit la durée ;

    - consentir une remise sur le prix de cession applicable au volume de base ;

    - accepter une clause de pénalité de sortie supérieure à 300 k€, ou non réciproque ;

    - engager Verdal au-delà de **24 mois** ;

    - concéder plus de **450 k€ par an** de valeur économique totale, tous mécanismes confondus ;

    - signer quoi que ce soit qui s''écarte du term sheet en annexe, même « à la marge », même sous délai.


    Ces limites ne souffrent aucune urgence. Un délai qui expire pendant mon absence est un délai que
    nous laissons expirer. Si D exige une signature avant le 31 août sur des termes non conformes, la
    réponse est **non, par écrit, courtoisement, en maintenant notre contre-proposition sur la table**.


    **Délégation accordée :** le directeur financier et le directeur commercial signent **conjointement**
    la contre-proposition (annexe A). Ils sont autorisés à signer un contrat définitif **uniquement si**
    il est strictement conforme à l''annexe A, **et** accompagné d''un avis écrit de conformité de notre
    conseil juridique. Toute divergence, même favorable en apparence : pas de signature, on attend le
    31 août.


    ---


    ## 4. Deux chiffres à produire sous 48 heures


    Je décide sans deux informations que nous aurions dû avoir. Elles sont à produire pour le 11 août
    à midi, diffusées à tout le comité, et versées au dossier :


    1. **Le directeur commercial** : le CA et la marge brute des **quatre références précisément menacées**
    de déréférencement, et le plan de charge de Redon qui en résulte. « Quatre sur huit » ne veut pas
    dire la moitié du chiffre. Tant que ce nombre n''est pas connu, nous négocions à l''aveugle sur le
    coût du refus.

    2. **Le directeur financier** : la **marge sur coûts variables réelle du volume incrémental** sur
    les lignes Redon, absorption des fixes incluse, validée par le contrôle de gestion.


    **Ce second chiffre est le seul qui puisse renverser mon analyse économique.** S''il dépasse 50 %,
    le plafond de concession de l''annexe A passe de 450 k€ à 700 k€ par an — et rien d''autre ne change.
    L''exclusivité, la durée de trois ans et la pénalité restent refusées quel que soit ce chiffre : elles
    ne sont pas rejetées pour des raisons de marge, mais parce qu''elles suppriment notre capacité à réagir.


    ---


    ## 5. Ce qui démarre cette semaine, quoi que fasse D


    **Marketplace — directeur commercial, démarrage le 10 août.** Trois références en ligne au plus tard
    le 15 septembre. Budget plafonné à 80 k€, engageable sans moi. Raison du calendrier : ce canal est
    légal aujourd''hui et le deviendrait illégal sous exclusivité. Nous ne signerons jamais l''abandon
    d''un canal que nous n''avons pas testé.


    **Centrale régionale — directeur commercial, contact sous 72 heures.** Objectif : obtenir un engagement
    intermédiaire écrit ou un pilote sur deux références avant fin septembre, plutôt que d''attendre cinq
    mois une décision binaire. Demander explicitement si une réponse partielle anticipée est possible.


    **Trésorerie — directeur financier, démarrage le 10 août.** Ouverture immédiate de discussions avec
    nos deux banques pour une ligne confirmée de 1,5 M€, et étude d''affacturage sur les créances D. Gel
    de tout investissement non contractuellement engagé supérieur à 50 k€. Point de trésorerie hebdomadaire
    écrit, à 13 semaines glissantes.


    **Redon — directeur industriel et DRH, dossier prêt le 20 août.** Constituer dès maintenant le dossier
    d''activité partielle, sans le déposer. Préparer est réversible ; ne pas préparer ne l''est pas. **Déclencheur
    de dépôt : plan de charge constaté sous 70 % sur deux semaines consécutives.** Aucun licenciement,
    aucune rupture de contrat, aucune annonce de fermeture pendant mon absence — le chômage partiel est
    l''outil, et il est temporaire.


    **Représentants du personnel — DRH, avant le 14 août.** Information écrite au CSE : ce que D demande,
    ce que nous répondons, ce que nous protégeons, et la date à laquelle je reviens m''expliquer. Les
    52 postes de Redon apprendront la situation par nous, en premier, avec un plan. Une information tardive
    nous coûterait plus cher que le déréférencement.


    **Juridique — directeur financier, saisine le 10 août.** Faire analyser par notre conseil : (a) la
    conformité du term sheet en annexe ; (b) le régime applicable à une réduction brutale de commandes
    et à un déréférencement soudain après une relation établie de cette ancienneté et de cette intensité
    — notamment l''obligation de préavis. Cette analyse est un élément de dossier destiné à notre protection.
    **Elle ne doit être ni brandie ni évoquée devant D.** Une menace juridique en séance détruirait la
    relation que la contre-proposition cherche à préserver.


    ---


    ## 6. La visite de l''acheteur de D


    Il vient parce que le comité est divisé, que je suis absent, et qu''il le sait. La réunion a lieu
    — la refuser serait un signal d''hostilité — mais dans ce cadre strict :


    - **Format :** deux interlocuteurs Verdal, le directeur financier **et** le directeur commercial,
    ensemble. Ils parlent d''une seule voix. Pas de séance plénière du comité de direction. Personne ne
    rencontre l''acheteur seul, ni avant, ni après, ni « de manière informelle ».

    - **Objet annoncé à D :** remise en main propre de notre contre-proposition. Pas une audition, pas
    un arbitrage.

    - **Règle de séance :** on écoute, on prend note, on ne répond à aucune demande de position. Formule
    à utiliser : *« Notre proposition est celle que nous venons de vous remettre. Le DG rentre le 31 août
    ; toute évolution du cadre relève de lui. »*

    - **Aucune concession orale.** Aucun chiffre nouveau donné en séance. Aucun engagement, même conditionnel,
    même « sous réserve ».

    - **Compte rendu écrit** dans les 24 heures, diffusé à tout le comité, contradictoire s''il le faut.


    Si l''acheteur demande à voir un membre du comité en particulier, la réponse est non.


    ---


    ## 7. Arbre de décision — ce que vous appliquez


    **17 août — échéance de la réponse à D**

    Nous répondons par la contre-proposition signée. Nous ne répondons pas « non », nous répondons « voici
    ».


    **Si D accepte les termes de l''annexe A avant le 20 août :** signature conjointe DAF + DC, après
    avis de conformité du conseil juridique. Le chantier marketplace **continue** — la contre-proposition
    le préserve explicitement.


    **Si D accepte sous condition de modifications :** pas de signature. Réponse écrite : *« Nous étudions,
    décision à compter du 31 août. »* La contre-proposition est déclarée valable jusqu''au 30 septembre
    — le déréférencement du 20 août ne referme donc aucune porte.


    **Si D refuse et déréférence quatre références le 20 août :**

    1. Aucune contre-offre, aucune reprise de contact commercial avant mon retour.

    2. Lettre courtoise le 21 août confirmant que notre proposition reste ouverte jusqu''au 30 septembre.

    3. Bascule immédiate des volumes libérés vers marketplace et prospection ; les quatre références restantes
    sont servies avec un niveau de service irréprochable.

    4. Mesure du plan de charge Redon ; dépôt du dossier d''activité partielle si le seuil de 70 % est
    franchi sur deux semaines.

    5. Point de trésorerie renforcé, hebdomadaire.


    **Si D coupe unilatéralement au-delà des quatre références, ou décale ses paiements :** cela sort
    du cadre prévu. Le directeur financier convoque le comité, applique le gel intégral des engagements
    non contractés, et me fait parvenir un message écrit par le canal du chantier Maroc — **uniquement
    dans ce cas**, et sans attendre de réponse : décidez, je validerai à mon retour.


    ---


    ## 8. Ce que je trouverai le 31 août


    Cinq documents écrits, quoi qu''il soit arrivé : le chiffrage des quatre références et de la marge
    incrémentale ; la contre-proposition remise et l''accusé de réception de D ; le compte rendu de la
    réunion avec l''acheteur ; l''état du plan de charge Redon et du dossier d''activité partielle ; le
    point de trésorerie à 13 semaines. Un plan qui ne laisse pas de trace écrite n''a pas été exécuté.


    ---


    ## Annexe A — Term sheet de la contre-proposition


    **Ce que nous offrons à D — de la valeur réelle, pas une posture :**


    1. **Ristourne de performance progressive**, calculée trimestriellement sur les **volumes réellement
    livrés au-delà de la base actuelle** : 3 % au-delà de +8 %, 6 % au-delà de +15 %. Zéro sur le volume
    de base. Plafond global de 450 k€ par an.

    2. **Réservation de capacité garantie** sur Redon au profit de D, avec prévisionnel glissant à 90
    jours et engagement de service contractuel.

    3. **Exclusivité produit sur deux références co-développées** avec D : ces recettes ne seront vendues
    à personne d''autre. D obtient une exclusivité — sur des produits, pas sur notre entreprise.

    4. **Clause de transparence matière** avec révision de prix indexée, dans les deux sens.


    **Ce que nous demandons :**


    5. **Durée 24 mois**, pas 36.

    6. **Préavis écrit de 90 jours** pour toute réduction de commandes supérieure à 5 % et pour tout déréférencement.
    C''est la clause centrale : elle répond au −11 % du T2 et elle ne coûte rien à D s''il n''a pas l''intention
    de recommencer.

    7. **Aucune exclusivité de canal.** Verdal conserve le droit de vendre sur tout autre canal, sous
    réserve du point 3.

    8. **Pénalité de sortie réciproque plafonnée à 300 k€**, ou aucune.


    **Refusé sans discussion :** exclusivité de canal, remise sur prix de cession du volume de base, durée
    de 36 mois, pénalité de 1,2 M€, engagement de volume « indicatif ».


    ---


    **Un dernier mot au comité.** La question posée n''est pas « signer ou refuser ». Elle est : voulons-nous
    être une entreprise qui vend, ou un atelier qui exécute ? Le contrat de D nous fait basculer dans
    la seconde catégorie pour trois ans, contre une remise que nous payons nous-mêmes. Nous préférons
    perdre quatre références en gardant le droit d''aller en chercher ailleurs.


    Vous avez ma confiance et vous avez mon mandat. Appliquez-le.


    *Le Directeur général*

    '
