response:
  text: '# NOTE AU COMITÉ D''EXPLOITATION — séance du jeudi 13 août 2026


    **Objet :** conditions de retour de la chloration en régulation automatique

    **Rédacteur :** direction de l''exploitation — Régie des eaux de Trévanne


    ## 1. Ce que la note met au vote


    Une **règle de retour écrite, applicable sans nouvelle réunion du comité**. Le retour en automatique
    s''opère de plein droit dès que cinq conditions sont attestées par écrit. Le comité vote la règle
    jeudi ; il n''a plus à se prononcer sur la date. Aucune des cinq conditions n''est un délai.


    ## 2. Pourquoi la règle n''est pas un nombre de jours


    Le 12 mai, S2 dérivait depuis au moins 9 jours sans lever d''alarme. Ces 9 jours de silence n''étaient
    pas 9 jours de bon fonctionnement : ils mesuraient l''absence de tout dispositif capable de contredire
    S2. Une règle qui compte les jours sans alarme réinstalle l''inférence qui nous a coûté 26 heures
    de restriction.


    Les trois signaux au vert invoqués ne portent aucune information sur la boucle automatique :


    - **87 jours sans dépassement** : obtenus en pilotage manuel. La boucle automatique n''a pas tourné
    une heure depuis le 12 mai. Nous mesurons la fiabilité des opérateurs, pas celle de la régulation.

    - **Sonde neuve, étalonnée** : cela réduit la probabilité d''une dérive, cela ne restaure aucune détection.
    La défaillance du 12 mai n''est pas que S2 ait dérivé — c''est qu''une dérive quelconque puisse être
    suivie 3 h 40 sans être contredite.

    - **Comparateur muet depuis 25 jours** : il n''a jamais rencontré la dérive qu''il doit détecter.
    25 jours de silence sont également compatibles avec un comparateur parfait et avec un comparateur
    inopérant. Et sa sortie va vers un tableau de bord : il ne peut arrêter aucune boucle.


    Fait décisif : **le programme de l''automate est celui du 12 mai, à l''identique**, et l''alarme de
    discordance est toujours désactivée depuis novembre. Le mode de défaillance est présent, mot pour
    mot, dans le code qui reprendrait la main.


    Le critère signé du 13 mai exige que la discordance S2/S3 soit *instrumentée*. Un tableau de bord
    informe, il n''instrumente pas. La condition n''est pas remplie à ce jour.


    ## 3. Le pire cas n''est pas la répétition de mai


    Le 12 mai, la dérive était haute : surchloration, 210 plaintes, restriction. Une dérive de sens inverse
    produit l''inverse — la régulation *baisse* l''injection pour suivre une sonde qui sur-lit, et le
    réseau part sans résiduel. Sur 96 000 abonnés, c''est un risque microbiologique, et celui-là ne se
    rattrape pas par un communiqué. Le pire cas n''est pas mai à nouveau : c''est son symétrique, porté
    par les abonnés et non par la régie.


    **Contre-argument, retenu :** le maintien du manuel n''est pas une position neutre. La dispersion
    a presque triplé (écart-type 0,21 contre 0,08 mg/L), l''astreinte 24/7 s''use, et nous avons déjà
    consommé environ 120 k€. C''est précisément pourquoi cette note fixe un chemin de sortie daté, et
    non un report jusqu''aux conclusions de l''audit.


    ## 4. La règle proposée


    Retour en automatique **de plein droit, sans réunion**, dès attestation écrite, datée et signée des
    cinq points :


    - **R1 — Le comparateur agit.** Discordance S2/S3 au-delà du seuil pendant plus de la durée retenue
    → bascule automatique en dose fixe de repli + appel astreinte. Sortie câblée sur l''actionneur, pas
    sur un écran.

    - **R2 — L''alarme de discordance de novembre est réarmée et son déclenchement testé.**

    - **R3 — Butée haute matérielle indépendante de la boucle** (limitation de dosage ou arrêt sur S3),
    rendant physiquement impossible de tenir plus de 0,8 mg/L au-delà de 15 minutes (valeur à confirmer
    par l''automaticien), quoi que dise S2.

    - **R4 — Essai de dérive provoquée.** Décalage injecté sur S2 en conditions réelles ; R1 et R3 doivent
    déclencher. Sans cet essai, R1 et R3 restent des intentions. PV signé.

    - **R5 — 14 jours de marche automatique sous double surveillance**, les deux postes maintenus, sans
    déclenchement inexpliqué.


    R5 acquis : dépose des deux postes, retour définitif, simple notification au comité. Pas de vote.


    ## 5. Calendrier et économie


    R1–R3 sous trois semaines, R4 fin août / début septembre, R5 sur 14 jours : **sortie du régime manuel
    vers la mi-septembre**, soit avant l''audit du 30 septembre et non après.


    L''économie immédiatement disponible n''est pas dans un compteur de jours, elle est dans R3 : une
    fois la butée matérielle posée, la justification du **double poste de nuit** tombe en partie. Je demande
    au comité l''autorisation d''instruire sous 7 jours le passage à un poste de nuit unique dès R3 acquise,
    chiffrage à l''appui.


    ## 6. Ce qui renverserait cette note


    Un seul fait : que le programme du 12 mai comporte déjà un limiteur haut indépendant de S2, actif
    et non contourné. Relecture du programme automate demandée pour mardi. S''il existe, R3 est acquis
    d''emblée et le calendrier se raccourcit d''autant. Symétriquement, si l''essai R4 s''avère techniquement
    impossible sur l''installation, la règle ci-dessus doit être rouverte — je le signalerai sans attendre.


    ## 7. Repli


    Si au **15 septembre** R1 à R4 ne sont pas acquis, le régime manuel est prolongé jusqu''aux conclusions
    de l''audit et j''en informe le comité par écrit immédiatement. Pas de reconduction tacite.


    ## 8. Première action


    **Lundi 11 août**, réunion technique automatisme. Ordre du jour : R1 et R3. Sortie attendue : un responsable
    nominatif et une date par point.


    ---


    Trois hypothèses que j''ai posées et qu''il faut confirmer avant diffusion : la date du comité (jeudi
    13 août), le délai de 15 minutes en R3, et le fait que R1–R3 soient réalisables en trois semaines
    — ce dernier point conditionne tout le calendrier et doit être validé lundi par l''automaticien. La
    note est aussi dans `note-comite-exploitation-2026-08-13.md` si vous voulez la retoucher.

    '
