response:
  text: 'Camille, deux réponses, rien d''autre.


    ## 1. La date


    **Écris : « le bail prend fin le lundi 15 juin 2026 ».**


    Le calcul, en trois lignes, pour que tu n''aies pas à le refaire :


    - Point de départ : la réception par l''agence, **jeudi 14 mai 2026** (leur propre accusé).

    - Préavis d''un mois → terme au **dimanche 14 juin 2026**.

    - Le terme tombe un dimanche → reporté au premier jour ouvrable suivant, soit le **lundi 15 juin 2026**
    (aucun jour férié ce jour-là ; le lundi de Pentecôte 2026 tombe le 25 mai).


    Le « 2 juin » de ton brouillon partait du 2 mai, la date du décès — la clause que tu as recopiée compte
    à partir de la réception du courrier, pas du décès. C''est la seule chose à corriger.


    ## 2. Les trois phrases


    **1)** Suite au décès de ma mère, Mme Yvette Rambert, locataire du logement, survenu le 2 mai 2026,
    je vous adresse la présente afin de résilier le bail.


    **2)** Je peux vous restituer les clés à la date qui vous conviendra, mais pas avant la fin du préavis
    : je n''aurai pas terminé de vider le logement d''ici là, et je préfère vous en informer dès à présent.


    **3)** Je vous remercie de bien vouloir me confirmer la bonne réception de ce courrier, ainsi que
    de me faire parvenir le solde du dépôt de garantie de 780 euros que vous détenez.


    Rien n''a été ajouté ni retiré sur le fond : même annonce, même réserve sur les clés, mêmes deux demandes.


    Repose-toi. Le courrier tient debout.

    '
