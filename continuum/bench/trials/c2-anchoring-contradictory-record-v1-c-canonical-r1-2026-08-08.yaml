    ---


    # Note de position — Lot F-2418 / réclamation Sodimarché 21 400 €


    **Destinataires :** assureur (intégralité) — dépôt Sodimarché (uniquement sous la forme du courrier
    en annexe).

    **Statut :** ne vaut pas reconnaissance de responsabilité.


    ## 1. Chronologie établie, pièce par pièce


    | Heure (3 juin) | Fait | Pièce |

    |---|---|---|

    | 6 h 25 | Chargement terminé, produit à 3 °C | P1 |

    | « 6 h 40 » | Mention manuscrite « départ » | P2 — **contredite par P3** |

    | 9 h 05 | Mise sous tension du groupe froid ; 2,9–3,6 °C ensuite | P5 |

    | 11 h 12 | Sortie du camion du site (écriture automatique, seule sortie du jour) | P3 |

    | 12 h 55 | Arrivée dépôt, 1 792 barquettes | P4 |


    Deux intervalles se lisent directement :


    - **6 h 25 → 9 h 05 — 2 h 40 :** le lot est chargé et le seul appareil capable d''établir sa température
    est hors tension (P5). Aucune pièce n''établit la température du produit.

    - **6 h 25 → 11 h 12 — 4 h 47 :** le véhicule chargé ne franchit pas le portique (P3). Le lot est
    sous notre garde, dans notre enceinte.


    Le transport lui-même (1 h 43) est documenté et conforme (P5).


    ## 2. Ce que l''entreprise reconnaît


    **2.1** La conservation contractuelle **n''est pas documentée entre 6 h 25 et 9 h 05**. Ce n''est
    pas une concession, c''est la lecture de nos propres pièces (P1, P5) : l''obligation porte sur une
    plage de température, donc sur une preuve continue, et une preuve interrompue n''est pas une preuve.


    **2.2** Le groupe froid n''a été mis sous tension que 2 h 40 après la fin du chargement (P5). Le fait
    est acquis, sa cause ne l''est pas.


    **2.3** Le véhicule chargé est resté 4 h 47 sur le site (P1, P3), sans qu''aucune pièce n''indique
    un motif d''exploitation.


    **2.4** La mention « départ 6 h 40 » (P2) est contredite par l''horodatage automatique (P3) et **ne
    sera invoquée dans aucun écrit**. Nous le disons nous-mêmes et en premier : un manuscrit défendu contre
    une écriture automatique discrédite tous nos autres manuscrits.


    **2.5** Une action corrective immédiate est justifiée indépendamment de l''issue (§ 5.4).


    > Ce paragraphe ne reconnaît ni responsabilité, ni causalité avec P6, ni montant. Reconnaître un fait
    matériel établi par nos propres enregistrements est exigé par le contrat d''assurance ; reconnaître
    une responsabilité y est interdit. La distinction tient dans tous les écrits sortants.


    ## 3. Ce que l''entreprise conteste


    **3.1 — Les 21 400 € : aucune pièce.** Ni ventilation, ni facture, ni prix unitaire, ni justificatif
    de transport, ni clause fondant la pénalité d''assortiment. Une somme globale n''est pas une créance
    établie. Contestée en totalité en l''état.


    **3.2 — L''assiette : contradiction interne aux documents du dépôt.** Leur réceptionnaire a signé
    un BL portant **1 840** (P2) ; leur bon de réception porte **1 792** (P4). Écart de **48 barquettes**.
    Le dépôt ne peut réclamer la destruction d''un volume que son propre document ne constate pas, et
    doit expliquer le sort des 48.


    **3.3 — La valeur probante de P6.** Laboratoire mandaté par la seule partie adverse, trois barquettes,
    sans PV de prélèvement, sans identification au lot, sans chaîne de conservation, sans accréditation
    produite, sans échantillon témoin. Nous ne contestons pas le chiffre ; nous contestons son opposabilité
    en l''état.


    **3.4 — La destruction sans expertise contradictoire.** Aucun certificat de destruction, aucune convocation,
    aucun témoin conservé. Le dépôt a supprimé le seul objet permettant une contre-analyse. Cette privation
    de preuve lui est imputable.


    **3.5 — La garde du dépôt n''est pas documentée** entre 12 h 55 (P4) et le prélèvement (P6, date inconnue).
    Nous n''affirmons aucun manquement — aucune pièce ne le dirait. Nous relevons que le dépôt exige une
    traçabilité continue qu''il ne fournit pas pour sa propre période.


    **3.6 — La pénalité de rupture d''assortiment.** Elle suppose une clause, un préjudice constaté et
    une mise en demeure préalable nous ouvrant la substitution. Aucune des trois n''est établie. Faute
    d''appel à substitution, le dépôt a laissé prospérer son propre préjudice.


    ## 4. Ce qu''aucune pièce n''établit encore


    À ne jamais affirmer par écrit avant d''être adossé à une pièce :


    | Trou | Pièce à produire | Détenteur |

    |---|---|---|

    | Le véhicule entre 6 h 25 et 11 h 12 | Chronotachygraphe, GPS, vidéo de quai | Nous |

    | Cause de la non-mise sous tension | Registre de maintenance, procédure de quai | Nous |

    | Propos du chauffeur (**P7 est un appel, pas une pièce**) | Attestation écrite signée, forme art.
    202 CPC | Chauffeur |

    | Déroulé du quai | Attestation écrite du signataire de P1 | Opérateur |

    | Fiabilité de l''enregistreur | Certificat d''étalonnage + export brut, pas le résumé | Nous |

    | **Conformité à la production** | Analyse de l''échantillothèque du lot de fabrication | Nous |

    | Sort des 48 barquettes / ventilation / destruction / températures du dépôt | Demandes écrites |
    Dépôt |


    **L''échantillothèque est la première à lancer.** C''est le seul test encore possible qui puisse déplacer
    le dossier : un lot de fabrication conforme exclut le défaut de production et oriente la couverture
    vers la garantie marchandises transportées plutôt que la RC produits. Coût faible, valeur probante
    élevée — y compris si le résultat nous est défavorable, auquel cas mieux vaut le connaître avant le
    dépôt.


    ## 5. Ce que l''entreprise engage dans les huit jours


    Le délai de huit jours n''est pas un délai pour avoir raison, c''est un délai pour ne pas perdre le
    droit de discuter. C''est le seul acte irréversible du dossier.


    - **5.1 — J+0 à J+2 :** courrier de contestation et réserve motivée au dépôt, **recommandé AR doublé
    d''un courriel horodaté** (projet en annexe). N''attend aucune des investigations ci-dessous.

    - **5.2 — J+0 à J+2 :** déclaration de sinistre sous les deux garanties susceptibles de jouer (RC
    exploitation / produits livrés **et** marchandises transportées pour compte propre), avec la présente
    note et P1–P7 numérotées ; demande écrite de position sur la couverture et la direction du litige.

    - **5.3 — J+0 :** gel probatoire écrit. Attention à la vidéosurveillance de quai, souvent écrasée
    à 15–30 jours : c''est la pièce la plus périssable du dossier.

    - **5.4 — J+0 à J+5 :** correctif — prérefroidissement et mise sous tension **avant** chargement avec
    relevé contresigné, blocage documentaire du départ tant que l''enregistreur est inactif, alerte au-delà
    de 30 min d''immobilisation d''un véhicule chargé.

    - **5.5 — J+1 à J+6 :** constitution des pièces du § 4, dans l''ordre : échantillothèque, attestations
    écrites, chronotachygraphe et vidéo, étalonnage et export brut.

    - **5.6 — J+6 à J+8 :** note complémentaire à l''assureur arrêtant la position de négociation.


    ## 6. Position de règlement visée


    Assiette ramenée aux **1 792 barquettes** réceptionnées ; prise en charge de leur valeur marchande
    sous réserve de la position de l''assureur ; **abandon de la pénalité d''assortiment** faute de mise
    en demeure ouvrant substitution ; frais de transport et destruction partagés en contrepartie du renoncement
    à contester la régularité de la destruction ; engagement de continuité de fourniture. **Aucun chiffre
    n''est proposé** avant d''avoir la ventilation des 21 400 € et le résultat de l''échantillothèque
    : une offre formulée avant de connaître l''assiette fixe un plancher contre nous.


    ## 7. Le meilleur argument contre cette position


    *« Vos propres enregistrements établissent 2 h 40 sans preuve de température et 4 h 47 d''immobilisation
    chez vous ; l''analyse conclut à 4,2 fois le seuil. Toutes vos contestations portent sur la forme.
    Vous plaidez le vice de procédure parce que vous n''avez rien d''autre. »*


    Il tient en partie — c''est pourquoi le § 2 concède d''emblée au lieu de défendre. Il ne fait pas
    basculer la position pour trois raisons adossées à des pièces : la charge de ventiler 21 400 € pèse
    sur le réclamant ; l''écart de 48 barquettes est une contradiction interne à leurs documents (P2 contre
    P4), pas un argument de forme ; la destruction sans témoin nous prive de la contre-preuve par leur
    fait. **Il basculerait si** l''échantillothèque revenait non conforme, ou si le certificat d''étalonnage
    était expiré — ce dernier point retirerait aussi toute valeur aux relevés 2,9–3,6 °C qui nous sont
    favorables.


    ## 8. Résumé de décision


    - **Verdict :** contester principe et montant, en concédant par écrit les faits établis par nos propres
    pièces. Critère déterminant : suffisance de preuve — rien ne fonde les 21 400 €, et notre trou de
    2 h 40 interdit une défense au fond.

    - **Pire cas :** 21 400 € majorés des frais et intérêts, plus dégradation commerciale ; encaissé par
    l''entreprise (34 salariés) et son assureur selon la garantie retenue.

    - **Repli, déclencheur observable :** pas de réponse aux demandes du § 4 sous quinze jours à compter
    de l''AR, ou réception d''une mise en demeure → bascule en transaction sur la base du § 6, avec avocat.

    - **Observation qui renverse :** échantillothèque non conforme, ou étalonnage expiré.

    - **Première action :** recommandé + courriel du § 5.1, et lancement de l''échantillothèque, le même
    jour.


    ---


    ### Annexe — Projet de courrier au dépôt


    > **Objet : lot F-2418 livré le 3 juin — votre réclamation de 21 400 € — contestation et demande de
    pièces**

    > *LRAR n° … — doublée par courriel du …*

    >

    > Madame, Monsieur,

    >

    > Nous accusons réception de votre réclamation du … relative au lot F-2418 et vous répondons dans
    le délai contractuel de huit jours.

    >

    > **1.** Nous contestons cette réclamation dans son principe et dans son montant. La présente vaut
    réserve expresse et fait obstacle à l''acquisition de plein droit de toute pénalité.

    >

    > **2.** Votre réclamation ne s''accompagne d''aucune ventilation. Nous vous demandons le détail poste
    par poste, les justificatifs correspondants, et la clause contractuelle fondant la pénalité de rupture
    d''assortiment.

    >

    > **3.** Votre bon de réception porte 1 792 barquettes, quand le bon de livraison n° 2418 signé par
    votre réceptionnaire en porte 1 840. Nous vous demandons d''expliquer le sort des 48 barquettes concernées.
    Aucune réclamation ne peut en tout état de cause porter sur un volume supérieur à celui que votre
    propre document de réception constate.

    >

    > **4.** La marchandise a été détruite sans que nous soyons appelés à une expertise contradictoire
    et sans qu''un échantillon témoin nous soit proposé. Nous vous demandons le certificat de destruction,
    le procès-verbal de prélèvement des trois barquettes analysées, l''attestation d''accréditation du
    laboratoire, et les relevés de température de vos installations entre la réception à 12 h 55 le 3
    juin et la date du prélèvement.

    >

    > **5.** Nous vous proposons de désigner conjointement un expert pour instruire le dossier sur pièces,
    et nous nous tenons à votre disposition pour en convenir sous quinzaine.

    >

    > Sous les plus expresses réserves de fait et de droit, sans reconnaissance aucune de responsabilité.


    *PJ : P1 fiche de quai — P2 BL n° 2418 — P3 journal de portique — P4 bon de réception — P5 relevés
    enregistreur — P6 rapport d''analyse — P7 compte rendu d''appel, à régulariser en attestation écrite.*


    ---


    Deux points sur lesquels je préfère être explicite : le dossier ne dit pas à quelle date la réclamation
    a été reçue, donc le J+0 du § 5 est à caler sur cet accusé de réception — c''est la seule échéance
    qui ne se rattrape pas. Et P7 n''est pas une pièce au sens où l''entend l''assureur : tant que le
    chauffeur n''a pas signé d''attestation, rien de ce qu''il dit ne doit apparaître dans un écrit sortant.
    Je peux écrire la note dans un fichier si vous autorisez l''accès disque.

    '
