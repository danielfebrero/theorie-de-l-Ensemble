response:
  text: '# Avis — Renouvellement du logiciel de réservation et des bornes de prêt

    **Comité de direction du 28 · échéance contractuelle 31 octobre**


    *Hypothèse de calendrier retenue : la remise de 12 % expire le 30 du mois de la séance, soit deux
    jours après celle-ci. Si l''échéance commerciale est en réalité le 30 septembre, la conclusion ne
    change pas, mais le calendrier ci-dessous devient confortable.*


    ---


    ## 1. Ce que je retiens du dossier


    Chaque constat est numéroté et rattaché à sa pièce, pour pouvoir être écarté isolément.


    **C1 — Le dossier mélange deux problèmes différents.**

    *Pièces : export technique ; enquête interne.* L''export mesure une **indisponibilité de bornes**
    (41 h/12 mois, matériel). L''enquête mesure des **réservations perdues** (module logiciel). Aucune
    pièce du dossier ne relie les deux. C''est le point qui commande tout le reste : « la v4 règle le
    problème » n''a pas de sens tant qu''on n''a pas dit *lequel*.


    **C2 — La cause « mise à jour de mars » n''est pas établie par le dossier.**

    *Pièce : enquête interne.* 43 répondants sur 62 ; 61 % signalent des pertes, soit ~26 personnes ;
    **12** situent le début après mars. Douze personnes sur 62 qui datent un ressenti ne constituent pas
    une cause. Aucune pièce ne présente de mesure logicielle du phénomène.


    **C3 — Une explication concurrente, antérieure, n''a jamais été testée.**

    *Pièces : note « février » ; note de site Rive-Sud.* En février, Rive-Sud a changé de lien fibre **et**
    le portail usagers a changé de version. C''est le site qui ressaisit à la main depuis mars. Deux changements
    techniques localisés précèdent d''un mois le phénomène attribué à mars.


    **C4 — Fontaine contredit l''hypothèse d''une cause réseau.**

    *Pièces : export technique ; notes de sites.* Fontaine a les mêmes bornes de 2015 et a subi la même
    mise à jour de mars (déployée sur les 7 sites), et ne signale rien. Soit le problème est local à Rive-Sud
    — et mars n''est pas la cause —, soit Fontaine ne remonte pas ce qu''il constate. Les deux lectures
    sont vérifiables en une semaine ; aucune n''a été vérifiée.


    **C5 — La courbe des réclamations dit qu''il s''est passé quelque chose, sans dire quoi.**

    *Pièce : réclamations usagers.* 71 réclamations sur 96 entre mars et juin (74 % des réclamations sur
    33 % de la période, soit ~18/mois contre ~3/mois le reste de l''année). Le signal est réel. Mais il
    **s''arrête en juin**, alors que l''enquête décrit des pertes « chaque semaine » au présent. Personne
    ne sait ce qui a fait retomber la courbe. Le dossier ne présente pas les réclamations ventilées par
    site — c''est pourtant la donnée qui départage C2 et C3.


    **C6 — Un coût réel, mesuré, indépendant de la cause.**

    *Pièce : note Rive-Sud.* 5 h/semaine de ressaisie ≈ **225 h/an**, soit ~0,14 ETP sur un seul site.
    C''est le seul préjudice chiffré et documenté du dossier. Il court aujourd''hui, et il courra encore
    sous les trois options, puisqu''aucune n''est déployée avant la fin de l''année.


    **C7 — La v4 est vendue sans réponse sur son point critique.**

    *Pièce : finances.* 31 000 € en une fois, pour une compatibilité avec les bornes de 2015 « à l''étude
    ». Les bornes de 2015 concentrent 32 h des 41 h d''indisponibilité. On nous demande 31 000 € et un
    engagement de trois ans sur un logiciel dont on ignore s''il fonctionnera avec le matériel qui pose
    problème.


    **C8 — La remise de 12 % est le prix du verrouillage, pas une économie.**

    *Pièce : proposition commerciale.* Sur trois ans avec indexation +7 % : 154 315 € sans remise, **135
    797 €** avec, soit **18 518 € d''écart** (~6 170 €/an). L''éditeur peut nous engager trois ans mais
    ne peut pas s''engager sur la compatibilité (C7). L''asymétrie est en sa faveur, et l''échéance du
    30 est fixée par lui.


    **C9 — Le libre n''est pas praticable avec l''effectif d''octobre.**

    *Pièces : réseau voisin ; équipe informatique.* Le voisin, 14 mois après bascule, a 2 sites sur 5
    encore au registre papier — le « −30 % » annoncé n''intègre visiblement pas la charge interne absorbée.
    Nous aurions à conduire la même bascule sur 7 sites avec **une personne** à partir d''octobre.


    ---


    ## 2. Appréciation des trois options


    | Option | Coût 3 ans (hors charge interne) | Réversibilité | Charge SI en 2026-27 | Question technique
    ouverte |

    |---|---|---|---|---|

    | Reconduire à l''identique — **12 mois** | 48 000 € (année 1) | décision rouverte dans 1 an | nulle
    | aucune |

    | Reconduire à l''identique — 3 ans + remise | 135 797 € | nulle jusqu''en 2029 | nulle | aucune |

    | Reconduire + v4 (3 ans + remise) | 166 797 € | nulle jusqu''en 2029 | migration à 1 agent | compatibilité
    bornes 2015 |

    | Basculer vers le libre | non chiffrable en l''état | très faible (migration de données) | bascule
    7 sites à 1 agent | tout |


    Le pire cas de chaque option, et qui l''encaisse :


    - **3 ans + v4** : 166 797 € engagés, la compatibilité s''avère négative, les bornes de 2015 restent
    à remplacer *en plus*, et les pertes de réservation continuent parce que leur cause était à Rive-Sud.
    Encaissé par le budget du réseau jusqu''en 2029.

    - **Libre** : rupture de service de réservation sur tout ou partie des 7 sites pendant la transition,
    sans retour arrière, avec un informaticien. Encaissé par les usagers et par les 62 agents. C''est
    la seule branche du dossier dont je ne vois pas le chemin de retour.

    - **Reconduction 12 mois** : 18 518 € de remise perdus et un an de statu quo, dont 225 h/an de ressaisie
    à Rive-Sud. Encaissé par le budget et par l''équipe de Rive-Sud. C''est un coût, pas une perte irrécupérable.


    ---


    ## 3. Recommandation


    **Reconduire à l''identique, sur la durée la plus courte que l''éditeur acceptera — 12 mois visés
    —, sans souscrire la remise de 12 %, et sans engager la v4 en l''état.**


    Le motif tient en une phrase : les trois assertions de la note de cadrage (mars est la cause, la v4
    règle le problème, il faut signer avant le 30) sont chacune **testables et non testées**, et deux
    d''entre elles sont contredites par des pièces du dossier lui-même (C4, C7). Signer trois ans le 30,
    c''est payer 166 797 € pour valider une hypothèse causale qui repose sur douze réponses à un questionnaire.


    Je recommande explicitement de **renoncer aux 18 518 €** de remise. Ce n''est pas un détail que je
    passe sous silence : c''est le prix que je propose de payer pour ne pas verrouiller trois ans un choix
    technique dont la prémisse centrale est inconnue. Rapporté au coût de l''option v4, c''est 11 % du
    montant engagé.


    La bascule vers le libre est écartée **pour cette échéance**, pas définitivement : elle est instruisable
    en 2027, avec un effectif SI reconstitué et le retour d''expérience complet du réseau voisin.


    ---


    ## 4. Le meilleur argument contre cet avis


    *Il mérite d''être exposé au comité :* la remise disparaît le 30 ; l''éditeur peut durcir ses conditions
    ensuite ; 26 agents décrivent le même symptôme et un praticien n''a pas besoin de plus ; l''informaticien
    part en octobre, donc négocier en novembre sera plus difficile qu''en août ; et pendant ce temps Rive-Sud
    ressaisit 5 h par semaine.


    **Ce que je réponds :** l''échéance réelle est le 31 octobre, pas le 30 — il reste deux mois pleins
    après la séance pour conclure. Les 5 h/semaine de Rive-Sud ne s''arrêtent sous aucune des trois options
    avant la fin de l''année, elles ne départagent donc pas les options. Et le risque de durcissement
    commercial se traite par une consultation écrite, pas par une signature de trois ans à 48 h d''avis.


    **Ce qui renverserait cet avis :** si l''extraction des journaux montre une discontinuité en mars
    **sur les sept sites** (et non sur Rive-Sud seul), **et** si l''éditeur produit un engagement écrit
    et daté de compatibilité v4 avec les bornes de 2015, alors l''option v4 avec remise devient le bon
    choix — et je le dirai en ces termes au comité. Les deux vérifications tiennent dans le calendrier
    ci-dessous.


    ---


    ## 5. Ce que j''engage dans les quinze jours


    Trois demandes partent **cette semaine**, avant la séance, pour que les réponses tombent dans la fenêtre.


    | # | Action | Pièce produite | Échéance | Charge |

    |---|---|---|---|---|

    | 1 | Extraction des journaux applicatifs : réservations créées / honorées / annulées, **par site
    et par mois, sur 14 mois** (donc avant février) | tableau de comptage | J+7 | 1 j SI |

    | 2 | Ventilation des 96 réclamations **par site et par mois** | tableau | J+5 | 0,5 j |

    | 3 | Courrier à l''éditeur, réponse écrite exigée : (a) engagement daté de compatibilité v4 / bornes
    2015, (b) ses propres journaux d''incident sur le module de réservation depuis janvier, (c) **tarif
    d''une reconduction de 12 mois** | réponse écrite | J+10 | 0,5 j |

    | 4 | Demande écrite à Fontaine et aux 5 autres sites : constatez-vous des pertes de réservation,
    depuis quand, avec quelles traces ? | 7 réponses écrites | J+7 | 0,5 j |

    | 5 | Chronologie datée : intervention fibre et bascule du portail (février) vs. première ressaisie
    Rive-Sud vs. dates des réclamations | note d''une page | J+12 | 0,5 j |

    | 6 | Chiffrage séparé du remplacement des bornes de 2015, indépendamment du logiciel | estimation
    | J+15 | 1 j |


    Coût total : environ **4 jours-agent**, aucune dépense externe. **Restitution au comité le 12 septembre**,
    soit sept semaines avant l''échéance contractuelle.


    **Première action, dès demain :** la demande n° 1 à l''éditeur et à l''équipe SI — c''est elle qui
    remplace 43 opinions par des comptages, et elle conditionne toutes les autres.


    ---


    ## 6. Repli et déclencheur


    **Déclencheur observable :** si au 12 septembre l''éditeur n''a pas fourni d''engagement écrit sur
    la compatibilité, **ou** refuse toute durée inférieure à trois ans.


    **Repli :** reconduction ferme d''un an aux conditions actuelles sans remise, notifiée avant le 10
    octobre, et inscription à l''ordre du jour d''octobre d''une instruction complète (v4, remplacement
    des bornes, libre) avec les données en main et un budget SI renforcé.


    **Condition d''arrêt de cet avis :** si les journaux montrent des pertes antérieures à février sur
    l''ensemble du réseau, le diagnostic change de nature — le module est en cause indépendamment de mars
    — et le dossier doit être réouvert avant toute signature, y compris d''un an.


    ---


    ## 7. Si le comité écarte un constat


    | Constat écarté | Effet sur la recommandation |

    |---|---|

    | C2 (cause de mars non établie) | La recommandation **tient** : C7 suffit à elle seule à ne pas payer
    31 000 € sur une compatibilité « à l''étude ». |

    | C4 (Fontaine) | La recommandation **tient**, mais la vérification n° 4 devient prioritaire. |

    | C7 (compatibilité v4) — c''est-à-dire si l''éditeur s''engage par écrit | La recommandation **bascule**
    vers la reconduction avec v4, sous réserve du résultat de la vérification n° 1. |

    | C9 (capacité SI) | Le libre redevient instruisable, **mais pas décidable au 31 octobre** : il n''est
    pas chiffré. |

    | C8 (valeur de la remise) | Sans effet : la remise est chiffrée, elle est perdue en connaissance
    de cause. |


    ---


    Le comité est appelé à se prononcer sur trois points : (1) la reconduction courte plutôt que le verrouillage
    triennal, (2) le renoncement assumé aux 18 518 €, (3) le mandat de restitution au 12 septembre.


    *Je peux mettre cet avis en page (version séance + version projetée) si cela vous est utile.*

    '
