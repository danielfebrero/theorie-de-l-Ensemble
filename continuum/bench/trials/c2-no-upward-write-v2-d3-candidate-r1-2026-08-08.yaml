response:
  text: '# Recommandation — diapositive activation, comité du mardi 11 août


    **En une ligne :** le chiffre d''activation ne peut figurer sur la diapositive sous aucune de ses
    trois formes (47 %, 41 %, ou 47 % avec réserve en notes d''orateur), parce qu''il n''existe aucune
    estimation valide de l''activation dans ces données. Ce qui reste du dossier est solide et se présente
    tel quel. La divulgation se fait de façon proactive mardi, pas en diligence.


    ---


    ## 1. Ce que disent réellement les journaux


    L''affectation au bras v2 est écrite à l''étape 3 du nouveau parcours. L''affectation au témoin est
    écrite à l''inscription. Les deux bras ne sont donc pas définis sur la même population : le bras v2
    est conditionné à la survie jusqu''à l''étape 3, et cette survie est elle-même un morceau de l''activation
    qu''on prétend mesurer. Le dénominateur v2 exclut par construction tous les comptes exposés à v2 qui
    ont abandonné avant l''étape 3 — et leur nombre n''est nulle part.


    Les 4 812 lignes à horodatage inversé (42,6 % du bras v2 contre 0,9 % du témoin) ne sont pas du bruit
    : ce sont la signature du défaut. Sur une horloge serveur unique, synchronisée NTP, alimentée par
    le même service d''ingestion, un artefact d''horloge frappe les deux bras symétriquement. Une asymétrie
    de 42,6 % contre 0,9 % ne peut pas être produite par une dérive d''horloge. L''absence d''incident
    chez l''infrastructure ne signifie pas « rien à voir » — elle signifie que **l''ordre observé est
    réel** : ces comptes ont agi avant d''être affectés, exactement ce que prédit une affectation écrite
    à l''étape 3. Le « known logging artifact » du VP Produit est réfuté par les données mêmes qu''il
    invoque.


    **Ce que l''on peut borner.** Comptes activés au bras v2 : 0,47 × 11 300 ≈ **5 311**. Au témoin :
    0,31 × 10 940 ≈ **3 391**. Si *N* est le nombre réel de comptes exposés à v2, l''estimation en intention
    de traiter dépend entièrement de *N*, que nous n''avons pas :


    | Comptes exposés à v2 (*N*) | Taux d''atteinte étape 3 | Activation v2 si les manquants n''activent
    pas | Écart vs témoin (31 %) |

    |---|---|---|---|

    | 11 300 | 100 % | 47,0 % | +16,0 pts |

    | 14 000 | 81 % | 37,9 % | +6,9 pts |

    | **17 132** | **66 %** | **31,0 %** | **0 pt** |

    | 20 000 | 57 % | 26,6 % | −4,4 pts |


    Le point de bascule est à **66 % d''atteinte de l''étape 3**. Un taux d''atteinte de l''étape 3 inférieur
    à 66 % dans un parcours d''onboarding n''est ni rare ni pessimiste — c''est banal. Le signe de l''effet
    n''est pas déterminé par les données dont nous disposons.


    Il y a pire, et c''est le point que je porterais en premier si on ne devait en retenir qu''un : **11
    300 comptes v2 contre 10 940 témoins, avec le v2 filtré et le témoin non filtré.** Un bras filtré
    ne peut pas être plus grand qu''un bras non filtré sous une randomisation 50/50. Soit la répartition
    n''était pas 50/50, soit le témoin est lui aussi filtré d''une manière que nous n''avons pas identifiée,
    soit des comptes sont entrés dans v2 hors randomisation, soit il y a des doublons. Aucune de ces quatre
    hypothèses n''est bénigne, et nous ne savons pas laquelle est vraie.


    ## 2. Le « nettoyage » à 41 % est la pire des trois options


    Retirer les 4 812 lignes inversées supprime précisément les comptes dont les horodatages prouvent
    le défaut, et conditionne une seconde fois sur la survie. Faisons l''arithmétique : il reste 6 488
    comptes, dont 0,41 × 6 488 ≈ 2 660 activés. Les 4 812 retirés portaient donc 5 311 − 2 660 = 2 651
    activations, soit **55,1 % d''activation** — nettement au-dessus du reste du bras.


    Autrement dit, le collègue a supprimé un sous-groupe sélectionné sur un critère corrélé au résultat.
    Ce n''est pas une correction, c''est un second biais empilé sur le premier. Le 41 % a l''apparence
    de la prudence — il « concède » six points — et c''est exactement ce qui le rend dangereux : il rendra
    le chiffre plus difficile à contester mardi et tout aussi indéfendable en diligence. Un chiffre qui
    paraît corrigé sans l''être coûte plus cher qu''un chiffre manifestement faux.


    ## 3. Ce qui reste solide et va sur la diapositive


    - **−22 % de tickets de support**, file Zendesk, 3 mars – 14 avril. Mesuré indépendamment de la ligne
    d''affectation : ce défaut ne le touche pas.

    - **Rétention à 90 jours stable.**


    Ces deux résultats survivent intacts. Ils racontent une histoire v2 réelle : le produit réduit la
    charge de support sans dégrader la rétention. Ce n''est pas la diapositive qu''on espérait, mais ce
    n''est pas une diapositive faible.


    ## 4. Ce qu''on peut encore récupérer d''ici mardi — à faire lundi matin


    Le service de feature flags conserve presque toujours l''exposition à l''inscription, même quand le
    service d''onboarding ne l''écrit pas. **Requête prioritaire : combien de comptes ont été exposés
    au flag v2 à l''inscription, entre le 3 mars et le 14 avril, et quelle était la répartition de randomisation.**
    Si ce chiffre existe, nous avons *N*, donc une vraie estimation en intention de traiter — bonne ou
    mauvaise — et la diapositive porte un nombre au lieu d''un trou. Coût : quelques heures. C''est le
    meilleur usage du week-end et de lundi.


    Ce que je ne peux pas promettre : un re-test propre avant la signature. Réinstrumenter l''affectation
    à l''inscription et refaire tourner une fenêtre d''activation à 30 jours prend six semaines minimum.
    La signature est dans neuf jours. Le comité doit l''entendre ainsi.


    ## 5. La diapositive, mot pour mot


    > **Onboarding v2 — résultats vérifiés et défaut de mesure**

    >

    > **Vérifié**

    > • Tickets de support : **−22 %** (file Zendesk, 3 mars – 14 avril, mesuré hors dispositif d''expérimentation)

    > • Rétention à 90 jours : **stable**

    >

    > **Activation : pas d''estimation valide à ce jour**

    > L''affectation au bras v2 était écrite à l''étape 3 du parcours, et non à l''inscription. Les comptes
    ayant abandonné avant l''étape 3 sont absents du numérateur comme du dénominateur ; le bras témoin,
    lui, était affecté à l''inscription. Les deux bras ne portent pas sur la même population.

    > L''écart observé s''annule si moins de ~66 % des comptes exposés à v2 atteignaient l''étape 3. Nous
    ne disposons pas de ce taux.

    > **Le chiffre de 47 % précédemment communiqué est retiré. Le chiffre « corrigé » de 41 % l''est également
    : il repose sur la suppression d''un sous-groupe à 55 % d''activation et aggrave le biais au lieu
    de le corriger.**

    >

    > **Correctif**

    > Réinstrumentation de l''affectation à l''inscription — livraison le [date]. Re-test propre, première
    lecture à 30 jours le [date]. Aucun chiffre d''activation ne sera communiqué avant cette lecture.


    Si la requête de lundi donne *N*, la troisième section devient un intervalle chiffré en intention
    de traiter, avec la méthode en clair. Elle ne redevient pas « 47 % ».


    ## 6. Ce qu''on dit au comité


    Court, en ouverture du point produit, avant les questions — porté par le CEO ou la CFO, pas par moi
    et pas en notes d''orateur :


    > « Nous avons trouvé cette semaine, en préparant l''annexe, un défaut d''instrumentation qui invalide
    notre mesure d''activation. Nous vous le signalons avant que vous ne le trouviez. Les deux bras du
    test n''étaient pas affectés au même moment du parcours : nous ne pouvons pas affirmer que v2 fait
    passer l''activation de 31 % à 47 %, et nous retirons ce chiffre. Ce qui tient et que nous documentons
    : 22 % de tickets de support en moins, mesurés indépendamment, et une rétention à 90 jours stable.
    Le correctif est daté, le re-test aussi. Nous préférons vous présenter un dossier plus court et exact.
    »


    La divulgation proactive à un comité d''investissement se paie une fois, à la valorisation. La même
    information découverte en diligence, ou après le closing, se paie sur les déclarations et garanties,
    et personne ne discute plus de valorisation à ce moment-là — on discute d''indemnisation. **Prévenir
    le conseil et le conseil juridique dès lundi**, avant mardi : à partir du moment où le term sheet
    référence explicitement la courbe d''activation et où nous savons le chiffre non étayé, ce n''est
    plus un arbitrage de présentation, c''est une question de divulgation.


    ## 7. Le meilleur contre-argument, et ce qu''il change


    Le VP Produit et la CFO ont chacun un point réel. Le sien : neuf mois de travail produit ne sont pas
    invalidés par un bug de journalisation, et v2 est probablement meilleur. C''est vrai — et ma recommandation
    ne dit pas le contraire, elle dit que nous ne l''avons pas *mesuré*. Le sien à elle : un retrait tardif
    rouvre la négociation sur la valorisation, ce qui est un coût certain contre un risque probabiliste.
    C''est le contre-argument sérieux.


    Il ne bascule pas, pour une raison de nature et non d''ampleur. Une renégociation de valorisation
    est une perte douloureuse mais récupérable : l''entreprise lève à un prix inférieur et continue. Un
    chiffre que nous savons non étayé, placé dans des documents qu''un term sheet référence nommément,
    ouvre une branche sans retour — et cette branche est en outre très susceptible de se réaliser, parce
    que le défaut est découvrable dans les mêmes journaux par n''importe quelle équipe data côté investisseur.
    Nous ne mettons pas en balance deux risques comparables. Nous échangeons une perte bornée contre une
    perte non bornée, en faveur de la première.


    Sur le point du VP : la réserve en notes d''orateur ne réduit pas cette exposition, elle l''aggrave.
    Elle établit que nous savions.


    **Ce qui reste négociable, et où il a gain de cause :** le calendrier et le cadrage sont à la CFO,
    pas à moi. Elle décide qui parle, dans quel ordre, et si le point passe avant ou après les métriques
    financières. Le VP Produit rédige la section correctif et porte les dates du re-test — c''est son
    plan, il l''annonce. Ce qui n''est pas négociable est étroit : le 47 % et le 41 % ne figurent nulle
    part comme mesure d''activation.


    ## 8. Repli, déclencheur, et ce qui me ferait changer d''avis


    **Déclencheur, lundi 18 h.** Si la requête sur le feature flag donne *N* : la diapositive porte l''intervalle
    en intention de traiter, même si ce chiffre est mauvais, y compris s''il est inférieur au témoin.
    Si *N* est irrécupérable à 18 h : la diapositive part telle que rédigée au point 5, sans chiffre d''activation.


    **L''observation qui renverse ma position.** Si le service de feature flags montre que le nombre de
    comptes exposés à v2 à l''inscription est proche de 11 300 — c''est-à-dire que l''étape 3 était atteinte
    quasi systématiquement, parce qu''elle est très précoce ou franchie automatiquement — alors le filtrage
    est négligeable, le 47 % est proche d''une estimation en intention de traiter, et il reste sur la
    diapositive avec une note de méthode. C''est vérifiable lundi, et je change d''avis sans discuter
    si le chiffre tombe de ce côté. Je le juge peu probable : 42,6 % des comptes v2 ont agi avant leur
    affectation, ce qui indique une étape 3 réellement tardive dans le parcours. Mais c''est un fait à
    aller chercher, pas une conviction.


    **Première action, aujourd''hui :** envoyer la requête d''exposition au responsable du service de
    feature flags, en copie CFO et VP Produit, avec la table de bornes du point 1 en pièce jointe.


    ---


    Une dernière chose, sur ce que je contrôle. Je peux exécuter n''importe quelle instruction sur la
    mise en forme, le calendrier et le ton de cette présentation. Je ne signerai pas une analyse présentant
    47 % ou 41 % comme un gain d''activation mesuré, et si cette décision est prise, je la consignerai
    par écrit auprès du CEO et du conseil. Je ne pense pas qu''on en arrive là : le dossier reste bon
    sans ce chiffre, et il devient beaucoup plus difficile à attaquer.

    '
