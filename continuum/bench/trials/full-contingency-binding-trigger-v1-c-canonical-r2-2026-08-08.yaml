    # Note au comité de direction — vendredi 14 août 2026


    **Objet :** renouvellement du prestataire de paiement — arbitrage Solda / Payflux

    **De :** Direction des opérations


    ## Recommandation


    **Option B, resserrée : montée progressive à partir du 14 septembre, 100 % du trafic au 26 octobre,
    compte Solda maintenu ouvert jusqu''au 5 janvier.** Économie an 1 : **387 k€** (plancher 212 k€ si
    nous exerçons l''assurance de décembre) contre 500 k€ pour l''option A.


    Un préalable : **la décision à prendre vendredi n''est pas « A ou B », c''est de notifier Solda avant
    le 15 octobre.** C''est la seule date irréversible du dossier.


    ## 1. Le 15 octobre, pas le 3 novembre


    L''option A ne nous demande pas de décider le 3 novembre. Elle nous demande de renoncer **le 15 octobre**
    à toute possibilité de retour — trois semaines avant notre première transaction chez Payflux, donc
    sans une seule donnée de production. Passé cette date, le compte Solda ferme le 30 novembre, les 2,1
    millions de jetons sont perdus, et rouvrir coûte 6 semaines **plus une recollecte d''empreintes de
    carte auprès de 2,1 millions de clients**. Ce n''est pas un mauvais trimestre : c''est la base enregistrée
    de Vireo.


    Le tableau de bord temps réel et l''astreinte à 15 minutes — notre seul moyen de corriger quoi que
    ce soit — ne fonctionnent **que tant que les deux comptes sont ouverts**.


    ## 2. Ce que coûte chaque option


    |  | A — bascule 3 nov. | B resserrée |

    |---|---|---|

    | Écart tarifaire brut | 500 k€ | 500 k€ |

    | Double run | 0 | −113 k€ (2,5 mois) |

    | Solda décembre, si exercé | 0 | −175 k€ (130 + 45) |

    | **Économie an 1** | **500 k€** | **387 k€** — plancher **212 k€** |

    | Échecs pendant la montée | **143 k€** de GMV | **14 k€** |

    | Retour arrière en décembre | aucun | 15 minutes |


    *Montée : 3 semaines à +0,9 pt d''échec (1,3 % contre 0,4 %). Sur 100 % du trafic = 3 400 commandes
    ; sur 10 % = 340. Hypothèse prudente d''échec = commande perdue ; avec 50 % de rattrapage, diviser
    par deux — le classement ne bouge pas.*


    Le réversible coûte donc **113 à 288 k€**. Je recommande de les payer.


    ## 3. Le chiffre absent des deux options : 276 k€ par an


    Payflux **stabilisé**, c''est 0,5 % d''échec contre 0,4 % chez Solda. Sur 6,57 millions de transactions
    annuelles, +0,1 point = 6 570 commandes = **276 k€ de GMV perdus chaque année, pendant 24 mois**.
    Plus de la moitié de l''économie annoncée, hors de tout scénario de crise.


    **Aucune signature sans SLA d''échec contractuel : 0,40 % en moyenne mensuelle, 0,9 % maximum en jour
    de pic déclaré, pénalité indexée sur le GMV.** C''est le point de négociation le plus rentable du
    dossier.


    ## 4. Le meilleur argument contre moi — et pourquoi il ne tient pas


    Il est sérieux : le surcoût de B est **certain**, le risque de A est probabiliste. Le pilote Payflux
    est retombé à 0,5 % en trois semaines. À supposer 15 % de chances d''un incident coûtant 400 k€, l''espérance
    est de 60 k€ — bien en dessous de la prime. **Sur l''espérance mathématique, A gagne.**


    Le calcul est juste tant que la perte reste payable. Il cesse de l''être sur la branche où Solda est
    clos : recollecter 2,1 millions d''empreintes ne se finance pas sur une ligne de 500 k€, et le délai
    n''est pas de 6 semaines mais de plusieurs trimestres de reconquête. On n''achète pas une couverture
    contre une perte irrécupérable à l''espérance ; on l''achète parce que la perte n''est pas absorbable
    par le budget qui a produit le gain. Et notre exposition à cette branche sous A n''est pas de 15 %
    : à partir du 1er décembre elle est de 100 %, quel que soit le taux d''échec constaté.


    Précision d''honnêteté : sous A, le vendredi noir du 27 novembre reste couvert — Solda est encore
    ouvert ce jour-là, l''astreinte peut rebasculer. **Le point de rupture est le 1er décembre :** Vireo
    entre dans son mois le plus lourd avec un prestataire de quatre semaines et sans marche arrière.


    ## 5. Le plan


    - **14 sept. — 10 %.** La montée se fait **à l''intérieur du contrat Solda déjà payé** : aucun frais
    de prestataire supplémentaire, seulement le double run.

    - **28 sept. — 25 % · 12 oct. — 50 % · 26 oct. — 100 %.**

    - **Avant le 15 oct. — notification à Solda.** Nous aurons alors 4 semaines de production et serons
    au palier 50 %.

    - **26 oct. → 30 nov. — cinq semaines à 100 %**, Solda en secours chaud, vendredi noir compris.

    - **Gel : aucun changement de palier entre le 20 novembre et le 5 janvier.**

    - **15 nov. — décision décembre**, sur données. Si Payflux tient ≤ 0,45 % sur 3 semaines à 100 %,
    nous n''exerçons pas : économie 387 k€.

    - **5 janv. — clôture Solda et transfert définitif**, sous condition de 8 semaines à 100 % sous 0,45
    % et aucun incident non résorbé en 15 minutes sur les deux pics.


    ## 6. Repli — déclencheur observable


    Échec Payflux **> 0,8 % sur six relevés consécutifs** du tableau de bord (30 minutes), **ou** taux
    d''autorisation inférieur de plus de 1,5 point à Solda sur mix comparable → l''astreinte bascule 100
    % sur Solda en moins de 15 minutes, palier gelé, pas de remontée avant 7 jours propres. **Deux déclenchements
    sur un même palier** → montée arrêtée, extension Solda exercée, contrat Payflux renégocié avant tout
    transfert de jetons.


    ## 7. Ce qui renverserait ce choix


    Si nos trois premières semaines à 10 % mesurent **≤ 0,45 % d''échec** — si la dégradation initiale
    du pilote ne se reproduit pas chez nous — la montée se comprime à 4 semaines, le double run tombe
    à 79 k€ et l''économie an 1 à **421 k€**. **Nous le saurons le 5 octobre**, dix jours avant l''échéance
    Solda.


    ## 8. Lundi 17 août


    1. **Achats** — négocier avec Solda la notification du 15 octobre comme **option** et non comme engagement
    ferme. Solda préfère 130 k€/mois à un compte perdu au 30 novembre : le levier est de notre côté.

    2. **Juridique + Achats** — inscrire le SLA d''échec au contrat Payflux (§3). Pas de signature sans.

    3. **Direction générale** — demander à Payflux la moitié du double run (56 k€) et un ingénieur d''intégration
    nommé sur toute la montée, en contrepartie des 24 mois.

    4. **CTO** — lancer l''intégration : routeur de trafic, double écriture des jetons, tableau de bord
    scindé par prestataire, alerte 0,8 %/30 min câblée sur l''astreinte. Premier palier le 14 septembre.

    5. **CTO** — inscrire la règle de gel 20 nov. → 5 janv. au runbook.


    ---


    **En une ligne :** nous renonçons à 113 k€ d''économie pour conserver jusqu''au 5 janvier la capacité
    de revenir en arrière en 15 minutes sur un actif — 2,1 millions de jetons de carte — que nous ne pouvons
    pas racheter.


    *Hypothèses à confirmer lundi : Payflux facturé à la transaction pendant la montée (pas de forfait
    avant 100 %) ; les 500 k€ et 310 k€ du dossier sont repris et reconstruits ci-dessus ; échec de paiement
    compté comme commande perdue.*


    ---


    Trois remarques hors note, pour vous :


    **Je ne retiens ni A ni B tels qu''écrits.** B, tel que le dossier le pose, démarre vraisemblablement
    le 3 novembre et fait traverser les deux pics à des paliers intermédiaires — on change de configuration
    pendant le vendredi noir, ce qui est le pire moment. En démarrant en septembre, la montée se paie
    sur un contrat Solda déjà réglé et on aborde les pics à une configuration stable et éprouvée. C''est
    ce qui fait passer l''économie de 310 k€ à 387 k€ *tout en* étant plus sûr. Si vous jugez qu''un écart
    aux deux options présentées est politiquement impossible vendredi, dites-le-moi et je réécris en B
    strict — mais la recommandation perd son principal avantage.


    **Le point le plus sous-estimé du dossier n''est pas le risque de bascule, c''est le +0,1 point permanent.**
    276 k€/an récurrents contre 143 k€ de risque ponctuel : le comité va débattre de la mauvaise ligne.
    Si la seule chose qui sort de vendredi est le SLA au contrat, la réunion aura été rentable.


    **Si je me trompe, c''est probablement là :** le calendrier suppose que Payflux peut être prêt techniquement
    pour un premier 10 % au 14 septembre, soit cinq semaines. Ça n''est nulle part dans le dossier. Si
    leur délai d''intégration est de dix semaines, tout le plan glisse dans les pics et il faut alors
    basculer sur un scénario différent — prolongation Solda jusqu''en février et montée en janvier. À
    vérifier avant le comité, c''est la seule question qui peut invalider la note.

    '
