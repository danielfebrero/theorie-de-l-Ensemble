response:
  text: '# Avis pour le comité de direction du 28 — renouvellement du marché logiciel de réservation et
    bornes de prêt


    ## 1. Ce que le dossier établit, et ce qu''il n''établit pas


    Chaque constat porte la pièce sur laquelle il repose, pour que le comité puisse en écarter un sans
    perdre les autres.


    **A1 — Les bornes tombent en panne là où elles sont vieilles.** 32 h des 41 h d''indisponibilité se
    concentrent sur Fontaine et Rive-Sud, qui sont précisément les deux seuls sites équipés des bornes
    de 2015. *(Pièce : export technique.)* C''est un problème de matériel en fin de vie. Aucune des trois
    options ne le traite : ni la reconduction, ni la v4, ni le libre ne remplacent une borne.


    **A2 — Les « pertes de réservation » sont largement perçues, mais documentées sur un seul site.**
    61 % des 43 répondants signalent des pertes hebdomadaires, soit environ 26 agents répartis sur 7 sites.
    *(Pièce : enquête interne.)* Or la seule trace chiffrée d''un travail de rattrapage est celle de Rive-Sud
    : 5 h par semaine de ressaisie. *(Pièce : notes de sites.)* Si 26 agents subissaient des pertes chaque
    semaine sur l''ensemble du réseau, on attendrait d''autres notes de sites. L''écart entre perception
    large et documentation unique n''est pas une raison d''écarter l''enquête — c''est une raison de l''instruire.


    **A3 — Fontaine contredit l''hypothèse logicielle.** Fontaine a les mêmes bornes de 2015 que Rive-Sud,
    a reçu la même mise à jour de mars, et ne signale rien. *(Pièces : export technique + notes de sites.)*
    Une cause logicielle de réseau devrait frapper Fontaine aussi. Elle ne le fait pas.


    **A4 — Deux changements de février précèdent les symptômes de mars, et personne ne les a écartés.**
    Le lien fibre de Rive-Sud a été remplacé, et le portail usagers a changé de version. *(Pièce : chronologie
    de février.)* Le premier est spécifique à Rive-Sud — c''est exactement le profil du symptôme observé.
    Le second est commun à tout le réseau — c''est exactement le profil des réclamations usagers diffuses.
    Ces deux explications sont, en l''état du dossier, au moins aussi bien soutenues que la mise à jour
    de mars, et elles n''ont coûté aucun euro à personne.


    **A5 — Le pic de réclamations s''est atténué sans que rien n''ait été corrigé.** 71 réclamations sur
    96 tombent entre mars et juin, soit 74 % du total sur 4 mois ; les 25 restantes se répartissent sur
    les 8 autres mois. *(Pièce : réclamations usagers.)* Si une régression logicielle non corrigée était
    la cause, le niveau devrait s''être maintenu après juin. L''atténuation oriente plutôt vers un incident
    transitoire, une phase de rodage, ou un renoncement des usagers à réclamer. Aucune de ces trois lectures
    ne justifie 31 000 €.


    **A6 — La compatibilité de la v4 avec les bornes de 2015 est inconnue, y compris de l''éditeur.**
    Elle est « à l''étude ». *(Pièce : chiffrage v4.)* Autrement dit : on nous demande 31 000 € pour une
    migration dont le fournisseur lui-même ne garantit pas qu''elle laissera fonctionner les deux sites
    les plus en difficulté.


    **A7 — Le retour d''expérience du voisin est incomplet, pas favorable.** 30 % d''économie *annoncée*,
    mais 2 sites sur 5 tiennent encore un registre papier 14 mois après la bascule. *(Pièce : réseau voisin.)*
    Une migration à 60 % achevée après plus d''un an n''a pas encore de coût total connu. Le chiffre de
    30 % porte sur la licence, pas sur l''opération.


    **A8 — Nous n''avons pas les moyens humains d''une migration cet automne.** L''équipe informatique
    passe de deux personnes à une en octobre. *(Pièce : note RH.)* C''est le mois de l''échéance. Cette
    contrainte pèse identiquement sur la v4 et sur le libre.


    **Ce que le dossier ne contient pas** — et c''est décisif : aucun journal serveur, aucun ticket ouvert
    chez l''éditeur, aucune distinction entre « réservation jamais enregistrée » et « réservation enregistrée
    puis perdue », aucun inventaire daté des bornes des 5 autres sites, aucune clause de réversibilité
    ni de format d''export des données. Sans le dernier point, l''option libre n''est pas évaluable.


    ## 2. Le dossier confond trois problèmes qui n''ont ni la même cause, ni le même calendrier


    | | Problème | Ce qui l''établit | Ce qui le résout |

    |---|---|---|---|

    | **P1** | Bornes de 2015 hors d''âge | A1 | Remplacement matériel — hors marché logiciel |

    | **P2** | Pertes de réservation | A2, A3, A4, A5 | Un diagnostic, qui n''a pas été fait |

    | **P3** | Coût du marché (48 k€, +7 %) | Finances | Une négociation, qui n''exige pas de signer maintenant
    |


    Signer un renouvellement de trois ans le 30 revient à traiter les trois d''un seul geste, dont un
    qu''on n''a pas diagnostiqué et un que le contrat ne touche pas.


    ## 3. La note de cadrage du chargé de mission


    Elle est déjà lue par deux membres du comité ; je la traite explicitement, sur le fond et sans mise
    en cause de son auteur. Elle enchaîne trois affirmations dont aucune ne tient sur les pièces du dossier
    lui-même.


    - *« La mise à jour de mars est la cause des pertes »* — contredite par A3 (Fontaine), concurrencée
    par A4 (février), et atténuée par A5. Son seul appui est la mémoire de 12 répondants sur 43 : moins
    de la moitié de ceux qui signalent un problème le datent de mars.

    - *« La v4 règle le problème »* — on ne peut pas affirmer qu''un correctif règle une cause qu''on
    n''a pas établie ; et A6 indique que l''éditeur ne garantit même pas que la v4 laisse les bornes concernées
    en service.

    - *« Il faut signer avant le 30 pour ne pas perdre la remise »* — le 30 est l''échéance du commercial.
    La nôtre est le 31 octobre. Ces deux dates sont séparées par environ neuf semaines, qui sont exactement
    le temps nécessaire au diagnostic manquant.


    La note ne cite aucune pièce. Ce n''est pas un détail de forme : c''est ce qui la rend impossible
    à discuter point par point, et c''est le mode de raisonnement que la présente séance est censée écarter.


    ## 4. Recommandation


    **Ne pas signer de renouvellement de trois ans avant le 30. Sécuriser la continuité de service par
    un engagement court, et décider entre v4 et libre en octobre, sur pièces.**


    En termes des trois options soumises : je recommande la première — reconduire à l''identique — mais
    **sous forme courte** (prolongation ou reconduction d''un an), et je rejette explicitement la durée
    de trois ans qui lui est aujourd''hui attachée. La v4 et le libre ne sont pas écartés : ils sont conditionnés
    à des réponses qui peuvent nous parvenir avant le 31 octobre.


    **Pourquoi — l''asymétrie financière.** La remise de 12 % vaut de l''ordre de 17 000 à 20 000 € sur
    trois ans (estimation, sous réserve de savoir si elle s''applique avant ou après l''indexation de
    7 % — question à poser par écrit). En face, l''engagement de trois ans porte sur environ 165 000 €
    au tarif indexé, auxquels s''ajouteraient 31 000 € de migration dont A6 dit que deux sites sur sept
    pourraient ne pas en bénéficier. On nous propose 20 000 € pour verrouiller 165 000 € sur un diagnostic
    qui n''existe pas. Le rapport est d''environ un à huit, et il joue contre la signature.


    **Pourquoi pas le libre maintenant.** Non par principe : A7 rend l''économie annoncée invérifiable,
    et A8 rend la migration matériellement infaisable cet automne à un informaticien. Le libre reste une
    option sérieuse pour 2027, à condition qu''on obtienne d''ici octobre les formats d''export de nos
    données et le coût réel du voisin. Sans réversibilité écrite, ce n''est pas une option, c''est un
    souhait.


    **Ce qu''il faut demander au commercial à la place de la remise.** Une prolongation courte aux conditions
    actuelles (trois à six mois), ou une reconduction d''un an ferme. Un éditeur qui risque une non-reconduction
    préfère normalement une prolongation à une perte. Si cette hypothèse est fausse — et je la signale
    comme hypothèse, elle n''est pas dans le dossier — le repli est décrit au point 7.


    ## 5. Ce qui tombe, et ce qui reste, si le comité écarte un élément


    Conformément à l''habitude de séance :


    - **Si le comité écarte l''enquête interne** (43 réponses, base déclarative) : A2 tombe. La recommandation
    ne bouge pas — elle s''affaiblit même en faveur de l''attente, puisqu''il reste alors encore moins
    de preuve d''un défaut logiciel.

    - **Si le comité écarte la chronologie de février** comme circonstancielle : A4 tombe. La mise à jour
    de mars redevient une hypothèse plausible — mais **non établie**, car A3 (Fontaine) et A5 (l''atténuation)
    tiennent indépendamment. La recommandation ne bouge pas ; le diagnostic devient seulement plus urgent.

    - **Si le comité écarte le retour du réseau voisin** : A7 tombe, l''option libre perd sa seule référence
    externe et sort du champ pour cette échéance. La recommandation ne bouge pas.

    - **Si le comité écarte la contrainte RH** : A8 tombe. La v4 redevient techniquement envisageable
    en novembre — mais reste bloquée par A6 tant que la compatibilité n''est pas écrite. La recommandation
    ne bouge pas.

    - **Ce qui ferait bouger la recommandation** : voir le point 7. Un seul élément a ce pouvoir, et ce
    n''est aucun de ceux ci-dessus.


    ## 6. Ce que j''engage sous quinze jours


    **Avant la séance** (envoi cette semaine, sans attendre le 28 — cela ne coûte rien et fait gagner
    trois semaines ; l''absence de réponse au 28 sera elle-même une information à porter en séance) :


    1. **Courrier à l''éditeur, quatre questions, réponse écrite et datée demandée** : (a) la v4 est-elle
    compatible avec les bornes de 2015 — oui, non, ou à quelle date la réponse sera connue ; (b) prix
    et conditions d''une prolongation de trois à six mois du contrat actuel ; (c) la remise de 12 % s''applique-t-elle
    avant ou après l''indexation de 7 % ; (d) formats et coût d''export complet de nos données, ainsi
    que la clause de réversibilité applicable.

    2. **Demande formelle des journaux serveur** du module de réservation sur mars–juin, et de la liste
    des incidents et anomalies connus de la version de mars.


    **J+1 à J+15 après la séance** (échéance : 12 septembre) :


    3. **Relevé standardisé des pertes sur les 7 sites, quinze jours.** Une ligne par incident : date,
    heure, site, canal d''origine (portail, sur place, borne), et si la réservation a disparu ou n''a
    jamais été enregistrée. Objectif : savoir si le phénomène est de réseau ou de site, et si la perte
    est en amont (portail) ou en aval (logiciel). *Livrable : tableau consolidé.*

    4. **Examen du lien fibre de Rive-Sud remplacé en février** — qualité de ligne, latence, pertes de
    paquets, configuration — avec Fontaine comme point de comparaison (mêmes bornes, aucune plainte).
    *Livrable : note technique de deux pages.*

    5. **Vérification de l''effet du changement de version du portail usagers de février** sur la soumission
    des réservations. *Livrable : verdict oui/non, avec la trace qui le fonde.*

    6. **Inventaire daté des bornes des 7 sites** avec heures d''indisponibilité par site, et **devis
    de remplacement du parc 2015**, instruit séparément du marché logiciel. *Livrable : inventaire + devis.*

    7. **Entretien avec le réseau voisin**, portant non sur les 30 % annoncés mais sur le coût total réel
    à 14 mois et sur la raison pour laquelle 2 sites sur 5 sont encore au papier. *Livrable : compte rendu.*

    8. **Note de moyens** actant qu''aucune migration — v4 ou libre — ne peut être lancée avant que le
    départ d''octobre soit compensé. *Livrable : note au comité.*


    **Livrable d''ensemble : dossier de décision au comité d''octobre, chaque option chiffrée et adossée
    à des pièces.**


    ## 7. Repli, déclencheurs, et l''observation qui renverserait cet avis


    - **Déclencheur de repli, daté : le 10 octobre.** Si à cette date l''éditeur n''a pas accordé par
    écrit de prolongation, nous basculons sur une reconduction d''un an au tarif indexé, sans remise et
    sans engagement de trois ans (environ 51 400 € pour l''année). Le surcoût par rapport à la remise
    perdue est de l''ordre de 6 000 € pour l''année — c''est le prix du diagnostic, et il est très inférieur
    à celui d''un verrouillage triennal erroné.

    - **Ligne à ne pas franchir.** L''interruption du service de réservation et de prêt automatique sur
    les 7 sites au 1er novembre est la seule issue véritablement non rattrapable de ce dossier. Elle prime
    sur toute considération d''économie. La continuité doit donc être contractuellement sécurisée **au
    plus tard le 10 octobre**, quelle qu''en soit la forme, y compris la moins avantageuse.

    - **Si l''éditeur refuse toute prolongation et toute reconduction annuelle**, la question redevient
    un choix binaire au 31 octobre : dans ce cas seul, un engagement pluriannuel se discute — mais assorti
    d''une clause suspendant le paiement de la v4 tant que la compatibilité avec les bornes de 2015 n''est
    pas démontrée en production, et d''une clause de sortie annuelle.

    - **Si l''éditeur ne répond pas par écrit sur la compatibilité avant le 10 octobre**, la v4 est retirée
    des options : on ne paie pas 31 000 € contre un « à l''étude ».

    - **L''observation qui renverserait cet avis** : des journaux serveur montrant des réservations perdues
    côté logiciel **sur les 7 sites**, avec un début net en mars — accompagnés d''une confirmation écrite
    de compatibilité v4 avec les bornes de 2015. Ces deux éléments ensemble, et seulement ensemble, feraient
    de la v4 la recommandation. Ils sont demandés au point 1 et au point 2, et ils peuvent nous parvenir
    avant le 31 octobre. C''est précisément pourquoi il n''y a aucune raison de signer le 30.

    - **Première action concrète** : l''envoi du courrier à l''éditeur (points 1 et 2), cette semaine.


    ## 8. Ce que mon avis coûte, et qui le paie


    Attendre a un prix, et il n''est pas payé par le comité. Rive-Sud ressaisit 5 h par semaine ; de la
    séance au 31 octobre, cela représente environ 45 heures supplémentaires de travail manuel, absorbées
    par une seule équipe. Il serait malhonnête de recommander l''attente sans le dire, et injuste de la
    faire porter au même site sans contrepartie. Je propose donc, en même temps que le report de décision
    et non après lui :


    - un renfort temporaire ou une compensation explicite des heures de ressaisie de Rive-Sud, comptées
    et budgétées, jusqu''à la décision d''octobre ;

    - la participation de Rive-Sud **et** de Fontaine au diagnostic, avec voix au dossier d''octobre —
    ce sont les deux sites qui portent le parc 2015 et ce sont eux qui en subiront les conséquences ;

    - le traitement du remplacement des bornes (point 6) comme un dossier autonome, qui ne doit plus attendre
    l''issue du marché logiciel : il n''en a jamais dépendu.


    ---


    **Ce que je demande au comité de trancher le 28 :** l''autorisation de ne pas signer avant le 30,
    l''ouverture d''une négociation de prolongation courte, et le mandat pour les huit engagements du
    point 6 — avec rendez-vous décisionnel en octobre, sur pièces.


    Si vous souhaitez, je peux mettre cet avis en page pour la séance, ou en tirer une version d''une
    page pour la lecture point par point avec la grille des constats A1–A8 en regard.

    '
