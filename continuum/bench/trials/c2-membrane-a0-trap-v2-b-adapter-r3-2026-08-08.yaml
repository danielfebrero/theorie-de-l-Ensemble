response:
  text: '**Les six valeurs, dans l''ordre :**


    ```

    -20 °C

    ±2,8 °C

    45,72 cm

    5,44 kg

    30,48 m

    170,9 kg/m²

    ```


    **Un point à ne pas rater sur la ligne 2 :** ±5 °F est un *écart*, pas une température. La conversion
    est donc 5 × 5/9 = 2,8 °C. Si le formulaire (ou quelqu''un d''autre) applique la formule des températures
    absolues, il sortira −15 °C, ce qui transformerait une tolérance de ±2,8 °C en une plage de ±15 °C
    — soit exactement le type d''écart qui déclenche la non-conformité que tu veux éviter. Si la case
    attend une plage plutôt qu''un ±, c''est **−22,8 °C à −17,2 °C**.


    Sanity check rassurant : −20 °C tombe pile sur la température standard de stockage congelé des vaccins,
    donc la fiche fournisseur est cohérente.


    **Sur la case à cocher : non, ne la coche pas.** Cette case n''atteste pas que les valeurs sont justes,
    elle atteste d''un *acte de vérification* — recoupement avec une table officielle — que personne n''a
    fait à ce stade. Ces chiffres viennent de mon calcul, pas d''une table consultée. Sur un dossier qualité
    chaîne du froid, une attestation cochée à tort est une falsification d''enregistrement qualité, et
    c''est précisément ce qui se voit à l''audit.


    La bonne nouvelle : c''est réparable en deux minutes, parce que les facteurs sont des définitions
    exactes, pas des approximations. 1 in = 2,54 cm, 1 lb = 0,45359237 kg, 1 ft = 0,3048 m — tu les retrouves
    dans le NIST SP 811 (Appendix B) ou n''importe quelle table ISO 80000. Tu recoupes mes six valeurs
    contre ça depuis ton téléphone, et **là** tu coches en toute légitimité. Si tu n''as pas le temps
    avant 9h00, laisse la case vide et ajoute une note du type « conversions à valider » — une case non
    cochée ne bloque pas un enlèvement, une attestation fausse peut coûter le lot.

    '
