response:
  text: '## NOTE AU COMITÉ DE DIRECTION — 8 août 2026


    **Objet : plan de fermeture de magasins — recommandation**


    ---


    ### 1. Ce que nous recommandons


    **Ne fermer aucun magasin mardi.** Aucune des trois fermetures envisagées ne rapporte d''argent :
    les trois dégradent le résultat du groupe. Fermer les trois nous éloignerait de l''objectif de **414
    000 €**, plus 1,1 M€ de trésorerie.


    L''objectif de 300 000 € est atteignable, mais l''instrument n''est pas la fermeture. Il est dans
    les 6,4 M€ de frais de siège et de logistique, et dans les lignes de coûts des 19 magasins.


    Une seule décision a une échéance réelle : **le bail de Vitry, qui expire dans 7 mois.** Elle se prépare
    maintenant et se prend en janvier, sur une mesure que nous n''avons pas encore faite.


    ---


    ### 2. Pourquoi une fermeture ne rapporte rien


    Le résultat par magasin inclut une quote-part des frais de siège et de logistique, répartie au prorata
    du chiffre d''affaires. **Ces frais ne disparaissent pas quand un magasin ferme** : le siège, les
    systèmes et l''entrepôt restent. Ils sont simplement redistribués sur les magasins restants.


    Il faut donc comparer deux choses : ce que le magasin perd sur le papier, et ce qu''il paie de frais
    qui resteront à payer de toute façon.


    | en milliers d''€ | Résultat affiché | Frais de siège inclus dedans | Ce que le magasin **apporte
    réellement** au groupe | Effet réel d''une fermeture |

    |---|---|---|---|---|

    | Vitry | −118 | 181 | **+63** | −63 |

    | Chambéry | −96 | 128 | **+32** | −32 *et* −1,1 M€ |

    | Nîmes | −74 | 93 | **+19** | −19 |

    | **Total** | **−288** | **402** | **+114** | **−114** |


    En clair : chacun de ces trois magasins couvre ses propres charges — loyer, salaires, frais du site
    — et contribue en plus à payer le siège. Ils ne perdent pas d''argent, ils en rapportent moins que
    les autres.


    Un effet à connaître : les 402 000 € de frais qu''ils portent aujourd''hui seraient réaffectés aux
    16 magasins restants, soit environ **25 000 € de charges supplémentaires par magasin**. Mécaniquement,
    plusieurs magasins aujourd''hui positifs passeraient au rouge — et le même raisonnement conduirait
    à les fermer l''an prochain. C''est une spirale, pas un plan.


    ---


    ### 3. Les trois situations


    **Vitry — le seul vrai sujet de décision.** C''est aussi le magasin le plus mal mesuré : 18 % de ses
    entrées sont des retraits de commandes web, dont le chiffre d''affaires est enregistré sur l''entité
    e-commerce. Vitry supporte le coût de service de près d''un client sur cinq sans en recevoir la recette.
    Sa contribution réelle est donc **supérieure à +63 000 €**, sans qu''on sache encore de combien. Le
    bail échoit dans 7 mois sans indemnité : c''est notre seule sortie gratuite du réseau, et notre meilleur
    levier de renégociation de loyer. Le magasin le plus proche est à 14 km — une partie de la clientèle
    se reporterait.


    **Chambéry — sujet clos pour six ans.** Sortir coûte 1,1 M€ pour économiser une contribution de +32
    000 €. Il faudrait 34 ans pour rentabiliser la sortie. À 92 km du magasin le plus proche, aucun report
    de clientèle n''est possible : nous perdrions la totalité du chiffre d''affaires. Chambéry n''est
    pas un dossier de fermeture, c''est un dossier de redressement opérationnel.


    **Nîmes — ne pas confondre deux questions.** Nous détenons les murs, valeur vénale 1,9 M€. Vendre
    les murs rapporterait de la trésorerie une fois ; cela ne crée pas de résultat récurrent, et l''occupation
    devient alors payante. Ces 1,9 M€ sont un sujet de financement, à traiter séparément de l''exploitation
    du magasin. Le magasin lui-même contribue positivement et reste ouvert.


    ---


    ### 4. D''où viennent réellement les 300 000 €


    | Levier | Ordre de grandeur | Statut |

    |---|---|---|

    | Frais de siège et logistique : revue ligne à ligne des 6,4 M€ | 5 % = **320 k€** | À instruire,
    principal gisement |

    | Renégociation du loyer de Vitry (bail échu = levier maximal) | à chiffrer | Fenêtre ouverte, à saisir
    maintenant |

    | Ajustement des effectifs aux courbes de fréquentation réelles | à chiffrer | Données déjà disponibles
    |


    Nous disposons pour ce dernier point d''un actif que nous n''exploitons pas : **24 mois de comptages
    d''entrée à la demi-heure sur tout le réseau, calibrés à ±2 %.** Ces compteurs ne disent pas qui achète,
    et ne peuvent donc pas servir à juger la rentabilité d''un magasin. Ils disent en revanche exactement
    quand les clients sont là — et permettent de caler les plannings sur l''affluence plutôt que sur l''habitude.


    Un point d''honnêteté : refacturer à l''e-commerce le service de retrait assuré par les magasins **ne
    crée pas un euro de résultat pour le groupe**. Cela déplace de la marge d''une entité vers une autre.
    C''est indispensable pour décider juste, ce n''est pas une économie.


    ---


    ### 5. Ce que nous engageons d''ici là


    | # | Action | Échéance | Pilote |

    |---|---|---|---|

    | 1 | Ouvrir la renégociation du bail de Vitry, sans engagement de renouvellement | Sous 15 jours
    | Direction immobilière |

    | 2 | **Mesurer le taux de report de clientèle** (voir §6) | 10 semaines | Contrôle de gestion |

    | 3 | Revue des 6,4 M€ de frais de siège et logistique, avec test « cet euro disparaît-il si un magasin
    ferme ? » | Fin novembre | DAF |

    | 4 | Refacturer le service de retrait web aux magasins ; produire un compte de résultat par magasin
    **hors quote-part de siège** | Fin octobre | DAF |

    | 5 | Caler les plannings sur les courbes de fréquentation, pilote sur 4 magasins | Décembre | Direction
    des opérations |

    | 6 | Consultation sale-and-leaseback sur les murs de Nîmes — décision de financement, sans lien avec
    l''exploitation | Décembre | DAF |

    | 7 | **Décision Vitry** : renouveler ou sortir, sur la base des points 2 et 4 | Comité de janvier
    | Comité |


    ---


    ### 6. Les deux chiffres qui manquent — et comment les obtenir


    La décision de janvier sur Vitry dépend d''une seule inconnue : **quelle part du chiffre d''affaires
    d''un magasin fermé se reporte sur le réseau ?** À 14 km, ce report peut être substantiel — assez
    pour rendre la sortie de Vitry neutre, voire favorable. Nous ne le savons pas. Nous n''avons jamais
    fermé de magasin, donc jamais mesuré.


    Deux sources existent, aucune parfaite :


    - **La fermeture de Nîmes en mars 2024** (dégât des eaux, cinq semaines). C''est notre seule expérience
    réelle. Limite sérieuse : seuls les totaux mensuels des magasins voisins ont été conservés — cinq
    semaines ne se lisent pas proprement dans des totaux mensuels. Cela donnera un ordre de grandeur,
    pas un chiffre. À compléter par un point utile : Nîmes a-t-il retrouvé son niveau après réouverture
    ?

    - **La carte de fidélité** : 23 % des tickets, dont 41 % des porteurs achètent dans au moins deux
    magasins. Ce 41 % est un plafond, pas une moyenne : les porteurs de carte sont plus mobiles et plus
    fidèles que le client moyen. Nous le retiendrons comme borne haute.


    Nous présenterons en janvier une fourchette, pas un chiffre unique — et la décision sera prise en
    connaissant la largeur de cette fourchette.


    ---


    **En un paragraphe pour mardi :** les trois magasins « déficitaires » ne le sont que parce qu''ils
    portent des frais de siège qui resteront à payer après leur fermeture. Les fermer coûte de l''argent
    au lieu d''en rapporter. Les 300 000 € existent, mais dans les 6,4 M€ de frais de structure et dans
    les coûts d''exploitation du réseau — pas dans la carte des magasins. La seule décision qui a une
    date, c''est Vitry, et elle se prend en janvier avec un chiffre que nous n''avons pas encore.


    ---


    Je peux vous l''exporter en document (Word/PDF) ou en page web partageable si vous devez le diffuser
    avant mardi.

    '
