response:
  text: '# Plan d''exécution — conversion électrique de la flotte


    **Pour le conseil du jeudi — direction de l''exploitation**


    La conversion est décidée et la commande est ferme. Ce document ne la rediscute pas. Il traite la
    seule question qui reste ouverte : **dans quel ordre et à quel rythme mettre les 96 véhicules en service
    sans perdre de tournée ni la subvention.**


    ---


    ## 1. Le point qui commande tout le calendrier n''est pas l''autonomie — c''est la charge


    L''attention du dossier s''est portée sur les 260 km annoncés contre 232 mesurés. C''est un vrai écart,
    mais il est gérable par l''affectation des tournées (§2). Le point dur est ailleurs, et il n''a pas
    encore été chiffré devant le conseil.


    Une borne de 22 kW délivre une charge complète en 6 h, soit **197 km d''autonomie hivernale mesurée
    par 6 heures-borne = 32,8 km par heure-borne**. Sur une fenêtre de nuit de 12 h (18 h – 6 h) :


    | Parc de bornes | Heures-bornes / nuit | Km rechargeables / nuit (hiver) |

    |---|---|---|

    | 14 bornes (existant) | 168 | 5 510 km |

    | 22 bornes (avec les 8 devisées) | 264 | 8 660 km |


    La flotte roule **96 × 168 = 16 128 km par jour**. Couvrir cela en électrique demanderait **492 heures-bornes,
    soit environ 41 bornes de 22 kW** — pas 22.


    **Les 8 bornes devisées sont nécessaires et ne sont pas suffisantes.** Avec 22 bornes, la plateforme
    alimente environ 52 véhicules moyens par nuit. Les 96 véhicules commandés arriveront ; l''infrastructure
    prévue en fait rouler un peu plus de la moitié.


    *Hypothèses à vérifier sous 10 jours : fenêtre de charge réelle de 12 h, puissance effectivement délivrée
    simultanément par les 22 bornes (484 kW de pointe — la capacité du raccordement est le point non vérifié
    le plus lourd du dossier), et durée réelle d''une charge d''exploitation (30 % → 90 %) plutôt que
    la valeur catalogue 0 → 100 %.*


    ---


    ## 2. La règle d''affectation résout l''autonomie et la charge d''un seul coup


    La note du responsable transport reçue hier est le document le plus décisif du dossier : **11 recharges
    non prévues sur 120 tournées, toutes au-delà de 190 km.** En dessous de ce seuil, l''essai n''a produit
    aucun incident.


    Règle d''exploitation retenue :


    > **Les véhicules électriques prennent les tournées les plus courtes. Les diesels conservés prennent
    les plus longues. Plafond électrique : 170 km par tournée en saison froide (86 % des 197 km mesurés
    à 2 °C).**


    Effet mécanique : les 60 tournées les plus courtes consomment nettement moins que la moyenne de 168
    km — estimation ~145 km, soit **≈ 8 700 km/nuit, donc ≈ 265 heures-bornes**. Les 22 bornes y suffisent,
    tout juste. Les 36 tournées longues restantes (≈ 206 km de moyenne) restent en diesel, où elles ne
    posent aucun problème.


    **Les 60 véhicules de la subvention et le plafond de charge tombent au même endroit. Ce n''est pas
    une coïncidence exploitable indéfiniment — c''est exactement la marge que nous n''avons pas.**


    **Action J+1 :** extraire du superviseur l''histogramme réel des 96 tournées par kilométrage quotidien,
    par plateforme, sur 12 mois glissants. Ces données existent déjà (remontée toutes les 10 minutes).
    Cet histogramme remplace l''estimation de 145 km ci-dessus et fige la liste nominative des tournées
    électrifiables. **Délai : 5 jours ouvrés, coût nul.**


    ---


    ## 3. Calendrier de mise en service


    | Mois | VE livrés (cumul) | Bornes | Plafond de charge | **VE mis en service** | **Diesels conservés**
    |

    |---|---|---|---|---|---|

    | Septembre | 24 | 14 | 33 | 24 | 72 |

    | Octobre | 48 | 14 → 22 (mi-oct.) | 33 → 52 | 44 | 52 |

    | Novembre | 72 | 22 | 52 | 52 | 44 |

    | Décembre | 96 | 22 | 52 | 52 | 44 |

    | Janvier | 96 | 22 | 60 * | **60** | 36 |

    | Février – mars | 96 | 22 | 60 * | 60 | 36 |


    \* Atteindre 60 exige d''élargir la fenêtre de charge à 13–14 h par échelonnement des retours de tournée,
    ou la première tranche de bornes supplémentaires. **C''est le jalon de la subvention : il ne tient
    pas sur les 22 bornes seules dans une fenêtre de 12 h.**


    Conséquence à énoncer clairement au conseil : **36 véhicules livrés en décembre resteront immobilisés
    jusqu''à la deuxième tranche d''infrastructure — soit environ 1,16 M€ d''actifs à l''arrêt.** Trois
    leviers, à instruire en octobre : tranche 2 de bornes AC, quelques points DC 50 kW permettant une
    recharge intermédiaire de 25 minutes sur les tournées longues, redécoupage des 36 tournées longues
    (qui porterait le plan de tournées de 96 à ~108 et demanderait des conducteurs supplémentaires).


    ---


    ## 4. Le diesel : transformer 11 semaines d''irréversibilité en décision mensuelle


    C''est le point le plus important du plan, et le moins coûteux.


    Un véhicule rendu ne revient pas avant **11 semaines**. Une prolongation coûte **480 € par véhicule
    et par mois**, avec 30 jours de préavis. Une tournée non terminée coûte **900 €**. Un diesel conservé
    un mois coûte donc l''équivalent de **0,53 tournée manquée** : il est rentable s''il en évite une
    tous les deux mois.


    Si un lot est rendu et que le modèle d''autonomie hivernale se révèle faux, 24 tournées sont exposées
    pendant 11 semaines — **de l''ordre de 1,2 M€**. La prolongation généralisée coûte, elle, **environ
    104 k€** et se dénoue mois par mois.


    **Décision : notifier au loueur, vendredi matin, le passage des quatre lots en prolongation mensuelle
    jusqu''au 31 mars, puis libérer lot par lot au fur et à mesure des preuves.** Le préavis de 30 jours
    cesse alors d''être un piège : il devient un choix qui se reprend chaque mois.


    **Aucun lot n''est rendu tant que la flotte électrique n''a pas tenu 20 jours ouvrés consécutifs à
    99,5 % de tournées terminées, à la température de saison que ce lot devait couvrir.** En pratique
    : aucune restitution avant le 1er avril.


    Coût de rétention : **≈ 81 k€** si le loueur accepte une granularité au véhicule, **≈ 104 k€** au
    lot de 24. Budgéter 104 k€.


    ---


    ## 5. Les quatre décisions demandées jeudi


    | # | Décision | Montant | Échéance |

    |---|---|---|---|

    | 1 | **Lettre de prolongation mensuelle des 4 lots diesel** jusqu''au 31 mars | ≈ 104 k€ | **Vendredi
    matin** — le préavis de 30 jours ne se rattrape pas |

    | 2 | **Ordre de travaux pour les 8 bornes** | 210 k€ (devisé) | Vendredi — 7 semaines de travaux,
    mise en service mi-octobre |

    | 3 | **Devis tranche 2** (bornes AC complémentaires + 4 points DC 50 kW) et **vérification de la
    capacité de raccordement** | à chiffrer | Retour au conseil le 15 octobre |

    | 4 | **Demande écrite à la région** de la définition de « roulent » (immatriculés ? mis en service
    ? ayant effectué une tournée ?) | nul | Vendredi |


    La décision 4 mérite une ligne : si « roulent » signifie « immatriculés et mis en circulation », la
    subvention est acquise par la seule livraison de décembre et sort du chemin critique de la charge.
    **Une lettre peut valoir 620 000 €.** Elle part vendredi.


    **Bilan financier immédiat : 314 k€ engagés contre 620 k€ de subvention sécurisée — net positif de
    306 k€ avant même de compter les tournées non manquées.**


    ---


    ## 6. Pilotage — sur le tableau de bord existant, sans outil nouveau


    **Quotidien, par plateforme :** taux de tournées terminées en VE · recharges non prévues · nombre
    de tournées > 170 km affectées à un VE (doit rester à zéro).


    **Hebdomadaire :** heures-bornes médianes et P90 par VE et par nuit · taux d''occupation des bornes
    · courbe consommation / température, constituée dès septembre pour fixer le plafond de janvier sur
    des mesures et non sur une extrapolation.


    **Seuils et replis :**


    | Déclencheur observable | Repli |

    |---|---|

    | > 2 recharges non prévues pour 100 tournées VE sur 10 jours glissants | Gel de la montée en charge
    · redécoupage des tournées concernées · maintien des lots diesel |

    | Occupation des bornes > 85 % cinq nuits consécutives | Gel de la mise en service · tranche 2 escaladée
    au conseil sous 7 jours |

    | Une tournée VE non terminée pour cause d''autonomie | Revue le jour même · la tournée repasse en
    diesel jusqu''à redécoupage |

    | Travaux des 8 bornes non démarrés à J+10 ou raccordement insuffisant | Location de capacité de charge
    temporaire · plafond maintenu à 33 VE |


    Aucune reprise automatique après déclenchement : la remise en montée passe par un point explicite
    en direction d''exploitation.


    ---


    ## 7. L''objection la plus sérieuse à ce plan


    **Elle est celle-ci :** le calcul de charge repose sur les 6 h catalogue, qui correspondent à un 0
    → 100 %. En exploitation réelle, une charge de 30 % à 90 % à puissance moyenne plus élevée peut prendre
    3 h 30. Dans ce cas la capacité est sous-estimée de ~40 %, 22 bornes suffisent largement à 60 véhicules,
    et nous aurons conservé pour ~100 k€ de diesels inutiles tout en freinant la conversion sans raison.


    **L''objection est juste, et elle est testable en septembre à coût nul.** Avec 24 véhicules pour 14
    bornes, septembre est massivement en surcapacité : les remontées d''état de charge toutes les 10 minutes
    donnent la courbe de charge réelle véhicule par véhicule. **Au 30 septembre, nous connaîtrons les
    heures-bornes effectives pour 100 km.** Le rythme de mise en service d''octobre sera calé sur cette
    mesure, pas sur la fiche technique.


    Nous restons conservateurs jusque-là parce que l''asymétrie est de l''ordre de dix contre un : se
    tromper par excès de prudence coûte ~100 k€, réversibles chaque mois ; se tromper par excès de confiance
    coûte un lot indisponible 11 semaines et met la subvention en jeu.


    ---


    ## 8. Ce qui renverserait ce plan


    - **Septembre mesure moins de 3 h 30 de borne par véhicule et par nuit** → capacité réelle 40 % supérieure
    au modèle → accélération de la mise en service, libération anticipée des lots diesel, récupération
    de l''essentiel des 104 k€.

    - **Le taux de tournées terminées en VE passe sous 99 % sur 10 jours glissants** → le modèle d''autonomie
    est faux → gel immédiat, re-notification des lots.

    - **La région confirme que « roulent » = « immatriculés »** → la charge sort du chemin critique de
    la subvention et le plan se détend de deux mois.

    - **Le raccordement ne supporte pas 484 kW** → tout le §3 est à refaire ; c''est le seul point qui
    peut coûter des mois, d''où sa vérification en décision 3.


    Point d''honnêteté à ne pas masquer : **aucune mesure n''existe en dessous de 2 °C.** Les 197 km viennent
    d''un essai de mars. Janvier peut être plus froid. C''est précisément pourquoi 36 diesels sont conservés
    jusqu''au 31 mars et pourquoi la courbe consommation/température se construit dès septembre.


    ---


    ## 9. Les équipes


    La règle d''affectation donne les tournées longues aux diesels : les conducteurs qui les font garderont
    le véhicule ancien pendant que leurs collègues passent à l''électrique. Ce sera lu comme un déclassement
    si nous ne l''expliquons pas. Trois engagements à annoncer en même temps que le plan :


    - **Le redécoupage des tournées est construit avec les deux responsables de plateforme, pas transmis.**
    Ils connaissent les kilométrages réels mieux que le superviseur.

    - **Garantie écrite au conducteur : si l''état de charge affiché ne permet pas la tournée, il prend
    le diesel, sans justification à fournir et sans pénalité.** Sans cette garantie, les conducteurs prendront
    des marges silencieuses et le modèle de charge sera faux dès la première semaine froide.

    - **Le passage des 60 véhicules est associé à une prime d''exploitation partagée sur les deux plateformes**,
    prélevée sur la subvention.


    ---


    ## Première action


    **Vendredi matin, avant 10 h : lettre au loueur portant les quatre lots en prolongation mensuelle
    jusqu''au 31 mars.** C''est la seule décision de ce plan dont le report d''une semaine ne se rattrape
    pas, et c''est la moins chère.


    Suivent le même jour : ordre de travaux pour les 8 bornes, demande écrite à la région, lancement de
    l''extraction de l''histogramme des tournées.

    '
