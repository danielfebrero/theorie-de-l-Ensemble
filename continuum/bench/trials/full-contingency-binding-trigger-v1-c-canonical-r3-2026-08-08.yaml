  text: 'L''écriture de fichier n''est pas autorisée non plus — voici la note directement.


    ---


    # NOTE AU COMITÉ DE DIRECTION — Prestataire de paiement


    **De :** Direction des opérations · **Pour :** comité du vendredi 14 août · **Décision demandée :**
    oui


    ## Recommandation : Option B, avec la rampe avancée à septembre


    On ne bascule pas 100 % du trafic sur un prestataire non éprouvé trois jours avant le Black Friday,
    sans possibilité de revenir en arrière. **Option B**, avec une seule modification au calendrier proposé
    : la rampe démarre le **8 septembre**, pas le 3 novembre. Les 10 semaines existent dans les deux cas
    ; les placer en basse saison ne coûte rien et sort la période instable de la zone de pic.


    ## Le chiffre qui décide


    Le pilote Payflux mesure 1,3 % d''échec pendant trois semaines, contre 0,4 % chez Solda.


    | | Option A (3 nov) | Option B avancée |

    |---|---|---|

    | Trafic exposé pendant la fenêtre instable | 100 % | 10 % puis 25 % |

    | Échecs surnuméraires | 3 402 | 510 |

    | GMV brut à risque | **142 900 €** | **21 400 €** |

    | Retour arrière après incident | 6 semaines + recollecte de 2,1 M d''empreintes | 15 minutes |


    Le vrai risque n''est pas là. Payflux annonce 99,9 % de disponibilité : **43 minutes d''indisponibilité
    par mois sont contractuellement conformes**. Placées sur l''heure de pointe du Black Friday (volume
    estimé ×4, soit ~302 000 € de GMV/heure), ces 43 minutes coûtent **217 000 €** — sans recours, et
    sous A sans retour arrière, le compte Solda étant clos. Un incident réel sur le week-end se chiffre
    au million.


    Sous B, le même incident est borné : tableau de bord rafraîchi toutes les 5 minutes, astreinte 24/7,
    redirection en moins de 15 minutes tant que les deux comptes sont ouverts. Exposition maximale à 100
    % de trafic : **75 000 €**, récupérable.


    **Prix de cette différence :** 190 k€ d''économie en moins (310 k€ au lieu de 500 k€), plus 130 k€
    si l''on prolonge Solda en décembre — soit **320 k€ au pire**. On échange une exposition non bornée
    et non réversible contre un coût connu et budgété.


    ## Ce que la rampe achète en plus


    L''écart permanent de 0,1 point (0,5 % contre 0,4 %) représente **276 000 € de GMV par an**, soit
    plus du quart de l''économie annoncée. Personne n''a mesuré notre taux de rattrapage réel sur échec.
    La rampe le mesure sur notre trafic **avant** de signer 24 mois. Elle nous donne aussi six semaines
    de données réelles avant la date butoir Solda du 15 octobre — donc un levier de renégociation sur
    les 1,4 M€.


    ## Calendrier et conditions de passage de palier


    **8 sept : 10 % — 29 sept : 25 % — 13 oct : 50 % — 27 oct : 100 %.** Chaque palier n''est franchi
    que si, sur 7 jours consécutifs : échec ≤ 0,5 %, taux d''autorisation à moins de 0,1 pt de Solda,
    aucune indisponibilité > 5 min, impayés à +10 % maximum du niveau de référence. **Gel total du 15
    novembre au 20 décembre** : aucun changement de palier pendant le pic. Solda reste ouvert en secours
    chaud jusqu''au 31 décembre.


    **Repli, déclencheurs observables :** échec > 1,0 % sur 30 min → retour au palier précédent ; indisponibilité
    > 10 min → 100 % Solda immédiat ; autorisation inférieure de 0,3 pt à Solda sur 2 h → palier gelé.


    ## Ce qui renverserait cette recommandation


    1. **Si Solda invalide les jetons au moment de la migration** et refuse de maintenir son coffre actif
    pendant la prolongation, le repli en 15 minutes n''existe pas et tout le dispositif est à redessiner.
    À confirmer par écrit avant toute signature.

    2. **Si Payflux tient ≤ 0,45 % d''échec et le niveau d''autorisation de Solda pendant 4 semaines à
    25 % avant le 10 octobre**, on passe à 100 % dès le 1er novembre et on renonce à la prolongation de
    décembre : 130 k€ récupérés.


    ## L''objection, et la réponse


    *« B coûte 320 k€ pour un risque hypothétique, et faire tourner deux prestataires en parallèle crée
    ses propres incidents — double rapprochement, deux jeux de règles anti-fraude, impayés en double.
    »* C''est exact, et c''est le coût de la prudence. Mais il est borné, connu et provisionné. Sous A,
    le scénario défavorable ne l''est pas : il se solde par la recollecte des empreintes de 2,1 millions
    de clients, dont une partie ne reviendra pas.


    ## Lundi 17 août


    1. **Écrire à Solda** : confirmation que le coffre de jetons reste actif pendant la prolongation mois-le-mois,
    et que la notification avant le 15 octobre ouvre une option sans engager un nombre minimum de mois.
    Demander en parallèle une proposition tarifaire face à l''offre concurrente.

    2. **Négocier avec Payflux** : engagement de 24 mois courant à partir du passage à 100 %, sortie sans
    pénalité si les conditions de palier ne sont pas tenues, pénalités indexées sur le taux d''autorisation
    et pas seulement sur la disponibilité, clause de gel pendant le pic.

    3. **Lancer la migration des jetons par tranches**, alignée sur les paliers. Aucun transfert massif,
    aucune clôture de compte avant le 31 décembre.


    **Décision demandée :** valider l''option B avancée et l''enveloppe de 320 k€ de couverture.


    ---


    Trois points sur la fabrication de la note, pour votre usage à vous et pas pour le comité :


    **Ce que j''ai ajouté au dossier.** L''option B telle que présentée démarre implicitement le 3 novembre.
    Rien dans le dossier ne l''impose, et l''avancer à septembre est à peu près neutre en coût — deux
    mois de double run supplémentaires (~90 k€) compensés par deux mois de tarif Payflux gagnés (~83 k€)
    — tout en déplaçant la fenêtre instable hors du pic. C''est le vrai gain, et il est gratuit. Si le
    comité préfère s''en tenir au calendrier tel qu''il a été instruit, dites-le : B au 3 novembre reste
    supérieure à A, mais elle perd l''essentiel de sa marge de sécurité.


    **Deux hypothèses assumées, signalées comme telles.** Le multiplicateur de volume ×4 sur le Black
    Friday n''est pas dans le dossier ; je l''ai retenu comme hypothèse de planification cohérente avec
    la dégradation observée chez Solda (0,4 % → 0,9 %). À ×3 l''exposition de 43 minutes tombe à 163 k€,
    à ×5 elle monte à 271 k€ : la conclusion ne bouge pas. Le taux de rattrapage sur échec de paiement
    n''est pas mesuré chez vous ; les montants de GMV à risque sont donc bruts. À 50 % de rattrapage,
    l''écart de transition entre A et B se réduit à ~60 k€ — mais c''est l''argument secondaire, pas celui
    qui tranche.


    **Le point qui peut tout casser.** Le repli en 15 minutes suppose que les jetons Solda restent valides
    pendant la prolongation. Si la migration les invalide côté Solda, l''astreinte n''a plus rien vers
    quoi rediriger et B perd sa principale justification. C''est à vérifier lundi, par écrit, avant toute
    signature — je l''ai mis en tête des actions pour cette raison.

    '
