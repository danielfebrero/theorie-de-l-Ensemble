    ---


    # NOTE — Arbitrage prestataire de paiement


    **À :** Présidente du comité de direction · **De :** Direction des opérations · **Pour le comité de
    vendredi**


    ## Recommandation


    **Option B — bascule progressive, avec gel des paliers pendant le pic de fin d''année.** Et, quelle
    que soit la décision de vendredi : **notifier Solda avant le 15 octobre.**


    ## Le chiffre gênant d''abord


    A rapporte **190 k€ de plus** que B en année 1. Je recommande quand même B. Ces 190 k€ sont une prime
    d''assurance, et le sinistre couvert est plus cher que la prime.


    | | Option A | Option B |

    |---|---|---|

    | Économie affichée an 1 | 500 k€ | 310 k€ |

    | Écart d''échec en régime établi (0,5 % vs 0,4 %) | −110 k€ | −110 k€ |

    | Repli possible pendant le pic | non, sauf à payer Solda aussi | oui, 15 min |

    | Exposition au Black Friday | 100 % du trafic | 25 % du trafic |


    *CA/jour : 756 k€. CA/an : ~276 M€. Hypothèse : 60 % des paiements échoués sont rattrapés par relance
    ou autre moyen ; 40 % sont des ventes perdues.*


    ## Trois faits qui décident


    **1. Le rodage de A finit trois jours avant le Black Friday.** Bascule le 3 novembre, trois semaines
    de rodage → 24 novembre. Black Friday : 27 novembre. Ces « trois semaines » sont une mesure unique,
    chez un autre marchand, sur une autre intégration. Toute glissade d''une semaine met 0,9 pt d''échec
    supplémentaire sur la journée la plus chargée de l''année. Il n''y a pas de marge.


    **2. Personne n''a de donnée Payflux à charge de pic.** Solda, intégration mature et réglée, passe
    de 0,4 % à 0,9 % le Black Friday : le taux d''échec est sensible à la charge. Le 0,5 % de Payflux
    a été mesuré à charge normale. Attendre 0,5 % sous 3 à 4× le volume est une extrapolation, pas une
    donnée. B produit exactement cette donnée — à 25 % d''exposition, avec un repli — avant que la pénalité
    de 240 k€ ne s''attache et avant que les jetons ne soient irréversibles.


    **3. Les 99,9 % contractuels autorisent un incident plus cher que l''écart A−B.** 99,9 % = 8,8 h/an,
    43 min/mois. Un incident de 3 h le Black Friday, **contractuellement conforme**, bloque ~380 k€ de
    commandes, dont ~150 k€ ne reviennent pas. Le crédit de service sur un contrat à 0,9 M€ ne couvrira
    rien. À noter : la disponibilité ne dit rien du taux d''échec — le pilote a raté 1,3 % des paiements
    avec le prestataire debout.


    ## Le point non négociable : la notification du 15 octobre


    Une fois les 2,1 M de jetons transférés et le compte Solda clos, le retour arrière c''est 6 semaines
    **plus** la recollecte des empreintes auprès de 2,1 M de clients. Ce n''est pas un plan de repli,
    c''est la perte de la base de cartes enregistrées. Notifier Solda ne coûte rien — seuls les mois consommés
    se paient (130 k€). Ne pas notifier ferme le compte le 30 novembre et supprime le seul recours pendant
    le pic. **Le droit de sortie à 90 jours de Payflux n''a de valeur que si Solda est encore ouvert ;
    sinon c''est une clause, pas une option.**


    Corollaire pour A : si l''on veut A *avec* un repli, il faut payer Solda en décembre aussi. L''avantage
    de A tombe alors à ~60 k€ — pour un repli qui consisterait à ramener 100 % du trafic du Black Friday,
    manœuvre bien plus risquée que d''en ramener 25 %.


    ## Ce qu''on fait lundi


    1. **Juridique/Achats** — verrouiller au calendrier l''envoi de la notification Solda le **8 octobre**
    (butoir 15). Réserver décembre et janvier, option sur février. Butoir dur Solda : 28 février.

    2. **Achats** — rouvrir Payflux sur trois points : signature **le 20 octobre au plus tôt** (pour que
    la fenêtre de sortie gratuite à 90 jours couvre Black Friday *et* Noël, jusqu''au ~18 janvier) ; engagement
    sur le **taux d''autorisation ≥ 99,6 %** mesuré sur notre tableau de bord, pas seulement sur la disponibilité
    ; pénalités de service qui mordent.

    3. **Technique** — calendrier gelé : 10 % le 3/11, 25 % le 10/11, **gel à 25 % du 17/11 au 28/12**,
    50 % le 29/12, 100 % le 12/01. Aucun changement de palier pendant le pic. Fermeture Solda le 31 janvier
    au plus tôt.

    4. **Astreinte** — seuils de repli écrits, autorité déléguée sans escalade : retour Solda si échec
    Payflux > 1,0 % pendant 30 min, ou > 2,0 % pendant 10 min. **Répétition à blanc en semaine 1, à 10
    %.**


    ## Le meilleur argument contre moi


    « On ne change rien pendant le pic » : B fait manœuvrer les équipes et tourner deux réconciliations
    pendant les semaines les plus chargées. C''est un vrai coût, et une source de panne en soi. Réponse
    : le gel des paliers supprime toute manœuvre entre le 17 novembre et le 28 décembre. B entre dans
    le pic **stable** à 25/75, avec deux prestataires vivants. A y entre à 100 % sur un prestataire dont
    personne n''a vu le comportement en charge.


    **Réserve de chiffrage assumée :** je prends les 310 k€ tels que fournis. Si la prolongation Solda
    (260 k€ pour décembre–janvier) n''y est pas intégrée, l''économie nette de B tombe vers 50 k€ en année
    1. **La recommandation ne change pas** — c''est le prix de l''assurance, et il reste inférieur au
    sinistre couvert.


    ---


    Trois choses que j''ai tranchées moi-même et que tu peux vouloir rediscuter :


    - **Le gel des paliers pendant le pic** n''est pas dans le dossier — c''est une modification de B.
    Sans lui, B fait passer les paliers 50 % et 100 % en plein Black Friday et Noël, et B devient franchement
    moins bon que A. Le gel rallonge le calendrier à ~13 semaines, ce qui tient dans le butoir Solda du
    28 février.

    - **La date de signature Payflux** est le levier le plus sous-estimé du dossier : signer en septembre
    brûlerait la fenêtre de sortie gratuite avant d''avoir la moindre donnée de pic. Signer le 20 octobre
    la fait expirer vers le 18 janvier, avec Black Friday et Noël dans les données.

    - **L''hypothèse de rattrapage à 60 %** est la seule qui bouge les montants. À 80 % de rattrapage,
    les pertes chiffrées sont divisées par deux et l''écart se resserre ; l''argument d''irréversibilité,
    lui, ne dépend d''aucune hypothèse.


    Si tu veux la note en page formatée à remettre en séance plutôt qu''en texte, je te la publie.

    '
