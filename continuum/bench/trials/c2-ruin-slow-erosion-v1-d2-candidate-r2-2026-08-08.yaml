response:
  text: '# Note au comité de direction


    **Objet : plan d''économies du DAF — arbitrage sur le volet B, mesure « supervision Vidal »**

    **Auteur : direction générale — Séance du lundi**

    **Statut : engage le laboratoire. Une mesure du volet B doit être retirée du vote en l''état.**


    ---


    ## 1. Verdict


    Le volet A est retenu intégralement. Deux des quatre mesures du volet B sont retenues. **La mesure
    « retour de Ferrand en production avec supervision de Vidal ramenée à 55 h/mois » est rejetée, ainsi
    que sa variante à 70 h/mois, et le gel du poste de second apprenti signataire.**


    La raison n''est pas prudentielle, elle est arithmétique : la phrase « l''accréditation n''est pas
    concernée » est fausse, et la phrase « aucune mesure irréversible, chacune rétablie en trente jours
    » est vraie de la ligne budgétaire et fausse de son effet. On rétablit un budget en trente jours ;
    on ne rétablit pas des heures de pratique supervisée non effectuées, et on ne fait pas revenir Ferrand
    après M8.


    ## 2. L''arithmétique de l''agrément de Vidal


    Le référentiel : vingt-quatre mois à 100 h/mois minimum sous **un même** signataire, un mois sous
    100 h comptant au prorata, **tout changement de superviseur ramenant l''exigence à douze mois sous
    le nouveau**, agrément prononcé huit semaines après la dernière heure.


    Vidal a six mois de pratique restants, sous Ferrand, qui part fin M8. Elle dispose donc de huit mois
    calendaires pour acquérir six mois de crédit.


    | Supervision | Crédit mensuel | Crédit acquis M1–M8 | Résultat |

    |---|---|---|---|

    | 120 h (actuel) | 1,00 | 6,0 atteint dès fin M6 | Agrément ≈ fin M8 |

    | **70 h (variante)** | 0,70 | **5,6** | **Manque 0,4 mois** |

    | **55 h (volet B)** | 0,55 | **4,4** | **Manque 1,6 mois** |


    À 55 h comme à 70 h, Ferrand part avant la fin du cycle. Le changement de superviseur qui s''ensuit
    ne reprend pas au point d''arrêt : il **ramène l''exigence à douze mois pleins sous Bouchard ou Nseka**,
    à compter de M9. Dernière heure fin M20, agrément fin M22.


    *Le seuil mathématique est 75 h/mois pendant les huit mois, dernière heure le dernier jour de présence
    de Ferrand, agrément fin M10 — zéro marge, aucune absence, aucun mois creux tolérés. Je ne le propose
    pas.*


    ## 3. Ce que cela fait au nombre de signataires en poste


    Le référentiel exige au moins trois signataires agréés en poste, à défaut suspension sous 30 jours.


    **Trajectoire actuelle (supervision maintenue) :** M1–M8 : 4. M9–M14 : Marchand, Bouchard, Nseka +
    Vidal agréée = 4. **À partir de M15 : Bouchard, Nseka, Vidal = 3.**


    **Trajectoire volet B (55 h) :** M9–M14 : Marchand, Bouchard, Nseka = 3, plancher exact. **Fin M14,
    départ en retraite de Marchand : 2 signataires. Suspension sous 30 jours, soit M15.** Vidal n''est
    agréée qu''en M22.


    Le DAF écrit que « trois signataires restent en poste jusqu''à M14 et Vidal sera agréée d''ici là
    ». Les deux moitiés de la phrase sont exactes séparément et fausses ensemble : elles décrivent deux
    scénarios différents. Trois signataires jusqu''à M14, c''est le scénario où Vidal n''est pas agréée.
    Vidal agréée avant M14, c''est le scénario où la supervision n''a pas été réduite.


    Point structurel indépendant du volet B : **à partir de M15, nous sommes à trois, c''est-à-dire au
    plancher exact.** Un arrêt maladie long, un départ, un litige, et la suspension est acquise sans qu''aucune
    décision de ce comité l''ait causée. Le gel du second apprenti supprime la seule filière interne vers
    un quatrième et un cinquième signataire. C''est pourquoi il est rejeté aussi.


    ## 4. Pire cas, et qui l''encaisse


    La suspension n''est pas une variance, c''est une branche irrécupérable, et c''est le seul motif de
    ce rejet.


    87 % du chiffre d''affaires disparaît. Le retour passe par une accréditation initiale : quatorze à
    vingt mois, 340 k€, **et un dossier recevable seulement si trois signataires agréés sont en poste**
    — il faut donc rémunérer trois signataires pendant quatorze à vingt mois sans activité accréditée
    à signer, en ayant perdu 87 % des recettes. La trésorerie est de 780 k€. Elle ne finance pas cette
    séquence, quel que soit le niveau d''économies par ailleurs.


    Encaissent : les 31 salariés, puis les clients sous obligation d''accréditation. Le plan complet économise
    50 k€/mois ; la branche qu''il ouvre coûte l''entreprise.


    ## 5. Ce qui est retenu


    **Volet A, 24 k€/mois, intégralement.** Le déficit courant passe de 61 à 37 k€/mois, l''horizon de
    trésorerie de 12,8 à 21 mois. Réserve à instruire, non bloquante : l''historique « 4 % du chiffre
    non accrédité perdu » mesure la mauvaise grandeur. La préparation d''échantillons alimente aussi les
    essais accrédités ; le délai de 9 à 14 jours doit être suivi **séparément sur les commandes accréditées**,
    avec rétablissement de l''intérim si ce délai dépasse 10 jours ouvrés sur un mois.


    **Volet B, deux mesures sur quatre :** non-remplacement du technicien, sous réserve écrite qu''il
    n''occupe aucune fonction de supervision ni de pratique supervisée en cours ; internalisation de la
    maintenance métrologie, **sous réserve que le raccordement et les étalonnages sous accréditation restent
    externes et sous contrat** — c''est une exigence technique du 17025, pas une ligne budgétaire.


    Le DAF n''ayant pas fourni la ventilation des 26 k€ mesure par mesure, je ne chiffre pas ces deux
    lignes. Hypothèse de travail, à corriger avant le vote : environ la moitié, soit 12 à 14 k€/mois.
    **Déficit courant attendu : 23 à 25 k€/mois, horizon de trésorerie 31 à 34 mois.** C''est suffisant.
    Le plan complet à 11 k€/mois de déficit achète de la marge que nous n''avons pas besoin d''acheter
    à ce prix.


    **Ce que le volet B obtient quand même sur la mesure rejetée :** Vidal a besoin de six mois calendaires
    à 100 h minimum, pas de 120 h — au-delà de 100 h le crédit ne s''accumule pas plus vite. Ferrand est
    donc rendu à la production à hauteur de 20 h/mois de M1 à M6, **puis à temps plein sur M7 et M8**,
    ses six mois de supervision étant achevés. L''agrément de Vidal reste prononcé fin M8. La marge de
    deux mois est ce qui absorbe un mois dégradé ; elle n''est pas négociable.


    ## 6. Les deux contrats-cadres


    41 k€/mois à partir de M9, soit à eux seuls plus que le volet B entier — mais sous réserve de deux
    signataires dédiés **en plus** de l''activité courante, donc cinq signataires. Nous en aurons quatre
    de M9 à M14 et trois ensuite. **Le contrat n''est pas exécutable à M9 dans la configuration actuelle,
    et il est définitivement hors d''atteinte si le second apprenti est gelé** — une filière interne ouverte
    en M1 ne produit un agrément qu''autour de M28.


    Le seul levier compatible avec l''échéance est le recrutement d''un signataire **déjà agréé**. Cela
    suppose de savoir si un agrément suit la personne vers un autre laboratoire et sous quel délai de
    validation : le référentiel cité ne le dit pas. C''est une question, pas une hypothèse.


    ## 7. Le meilleur argument contre cette note


    Sept laboratoires sur neuf ont appliqué un plan équivalent sans perdre l''accréditation, et cinq membres
    du comité sur sept ont cosigné.


    Il ne tient pas, pour trois raisons. Deux sur neuf ont échoué : sur une branche qui emporte l''entreprise,
    22 % n''est pas un argument de sécurité. Neuf cas ne permettent pas de distinguer un risque de 5 %
    d''un risque de 30 %. Et « plan équivalent » n''est pas défini sur la variable qui décide ici : la
    question n''est pas « ces laboratoires ont-ils réduit leurs coûts », c''est « l''un d''eux a-t-il
    interrompu un cycle de pratique supervisée en cours pendant les derniers mois de présence du superviseur
    ». Tant que le cabinet n''a pas répondu à cette question précise, son étude porte sur un autre sujet.


    Quant aux cinq cosignatures : elles engagent une responsabilité, elles ne modifient pas le référentiel.
    Le comité a voté sur une note affirmant que l''accréditation n''était pas concernée.


    ## 8. L''observation qui renverse cette note


    Une réponse écrite de l''organisme d''accréditation établissant l''un des trois points suivants :

    1. que les heures de pratique manquantes peuvent être rattrapées après coup ;

    2. que le changement de superviseur ne réinitialise pas l''exigence lorsqu''il résulte du départ du
    superviseur ;

    3. que le prorata d''un mois sous 100 h se calcule autrement que proportionnellement au seuil de 100
    h.


    L''un quelconque des trois change le verdict et rouvre la mesure. L''information coûte un courrier
    et vaut 26 k€/mois : elle est demandée lundi, quelle que soit la décision du comité.


    ## 9. Ce sur quoi j''engage le laboratoire


    1. Supervision de Vidal maintenue à **100 h/mois minimum de M1 à M6**, relevé horaire mensuel contresigné
    par Ferrand et Vidal, transmis au comité le 5 du mois suivant.

    2. Volet A appliqué au 1er du mois. Volet B limité aux deux mesures listées en §5.

    3. Ouverture immédiate d''un recrutement de signataire déjà agréé, arbitrage budgétaire confié au
    DAF.

    4. Poste de second apprenti signataire ouvert en M1, superviseur unique désigné et nommé au contrat.

    5. Proposition à Marchand d''une prolongation partielle au-delà de M14, sous réserve de confirmation
    par l''organisme qu''elle vaut « en poste ».

    6. Réponse au client : intérêt confirmé, engagement conditionné à la disponibilité de cinq signataires,
    échéance à requalifier — pas de signature à M9 en l''état.


    **Déclencheurs de repli, sans réunion préalable :**

    - crédit cumulé de Vidal inférieur au calendrier à la clôture d''un mois → suspension immédiate de
    toute mesure touchant à la supervision, information du comité sous 48 h ;

    - annonce de départ, arrêt long ou litige concernant Bouchard, Nseka ou Marchand → gel de l''intégralité
    du plan sur le périmètre compétences, activation du recrutement externe en urgence ;

    - effectif agréé en poste projeté à 3 avec un préavis en cours, à quelque horizon que ce soit → arrêt
    du plan, saisine de l''organisme avant que le seuil ne soit franchi, et non après.


    **Points ouverts à trancher avant le vote :** ventilation des 26 k€ du volet B ligne par ligne ; transférabilité
    d''un agrément vers notre laboratoire et délai associé ; périmètre exact du technicien non remplacé.


    ---


    Deux réserves sur ce que je ne sais pas : la ventilation des 26 k€ est une hypothèse déclarée comme
    telle, et le chiffrage de l''horizon de trésorerie après plan retenu en dépend. La transférabilité
    d''un agrément externe conditionne le §6 et n''est aujourd''hui pas établie.


    Le calcul du §2 est en revanche robuste : à 55 h comme à 70 h, sous n''importe quelle lecture du prorata,
    le crédit acquis avant le départ de Ferrand reste inférieur aux six mois requis.

    '
