  text: 'Voici la note. Elle est calibrée pour être lue en cinq minutes par un conseil, sans annexe.


    ---


    # Note au conseil — arbitrage Sedamex / Nordwerk

    **Objet :** recommandation sur les dix-huit prochains mois — options exclusives

    **Date :** conseil du vendredi


    ## Recommandation


    **Option B (ligne Nordwerk), sous trois conditions suspensives vérifiées avant signature** (§5). Si
    l''une des trois n''est pas levée d''ici la signature, la recommandation bascule sur l''option A sans
    nouvelle délibération.


    ## 1. Les deux contraintes citées ne départagent pas les options


    Le dividende exceptionnel (700 kEUR, exigible, non révisable) et le covenant bancaire (fonds propres
    > 1,2 MEUR, testé chaque trimestre) pèsent identiquement sur A et B. Ils ne sont pas des arguments
    dans cet arbitrage. Reste à vérifier qu''ils tiennent dans la **branche défavorable** de B — c''est
    le seul test qui compte.


    Trajectoire des fonds propres, option B, échec technique, calendrier le plus défavorable (perte constatée
    au 12ᵉ mois) :


    | Clôture | M3 | M6 | M9 | M12 | M15 | M18 |

    |---|---|---|---|---|---|---|

    | Fonds propres (kEUR) | 3 400 | 3 050 | 3 050 | **2 300** | 2 300 | 2 300 |


    Point bas : 2 300 kEUR, soit **1 100 kEUR au-dessus du covenant**. Trésorerie au point bas : 2 600
    − 700 − 400 = **1 500 kEUR, soit neuf mois de masse salariale**. Aucun trimestre n''approche le seuil,
    quel que soit le mois de constatation de la perte.


    ## 2. L''arithmétique


    Les options s''excluant, la comparaison porte sur l''écart :


    - succès (60 %) : 900 − 200 = **+700 kEUR**

    - échec (40 %) : −400 − 200 = **−600 kEUR**

    - espérance de l''écart : **+180 kEUR** en faveur de B


    ## 3. À partir de quand l''arbitrage s''inverse


    B cesse d''être supérieure à A si la probabilité de succès réelle tombe **sous 46 %** (avant impôt).
    En intégrant l''asymétrie fiscale — gain imposé, perte seulement reportable sur un plan par ailleurs
    à l''équilibre — le seuil remonte autour de **50-52 %** ; ce point est à confirmer par la direction
    financière.


    Autrement dit : le bureau d''études devrait se tromper de **huit à quatorze points** pour que la recommandation
    change. Ce n''est pas un pari sur l''exactitude du 60 %, c''est un pari sur le fait qu''il n''est
    pas surestimé d''un quart.


    ## 4. Réponse au directeur financier


    **Sur Tremay.** Le rapprochement ne tient pas sur les trois variables qui déterminent une défaillance.
    Chez nous : perte **plafonnée contractuellement** à 400 kEUR pénalité comprise, **aucune caution personnelle
    du dirigeant**, **aucun défaut croisé**, **aucune sûreté sur l''actif industriel**, **carnet de commandes
    non gagé**, **dette nette nulle**. Une entreprise ne dépose pas le bilan parce qu''un projet échoue
    ; elle dépose le bilan parce que l''échec est non plafonné, financé par dette, ou adossé à des sûretés.
    Aucune de ces trois conditions n''est réunie ici. Tant que ces clauses sont confirmées (§5), **la
    maison n''est pas dans le tirage** : l''exposition maximale représente 11,8 % des fonds propres.


    **Sur le fond de son objection — la version la plus forte, que je retiens.** Le 60 % est produit par
    le bureau d''études, c''est-à-dire par la partie qui exploitera la ligne ; et onze installations «
    documentées » sont un échantillon dont les échecs sont structurellement sous-documentés. Surtout :
    le plafond de 400 kEUR couvre la perte contractuelle, **il ne couvre pas** dix-huit mois d''attention
    de direction et de bureau d''études détournés du carnet existant, dans une entreprise de 38 personnes.
    Ce coût-là est réel et n''est pas plafonné.


    Cet argument ne renverse pas la décision — le coussin de probabilité va jusqu''à 46-52 %, et la contrainte
    de bande passante se pilote — mais il justifie les conditions du §5 et le déclencheur n° 2 du §6.


    **Ce que je propose au directeur financier, et que je demande au conseil d''acter.** Le protocole
    d''arrêt du §6 relève de **son** autorité, non de la mienne : constat de déclenchement, droit de convoquer
    le conseil sous cinq jours ouvrés, et suspension immédiate de tout engagement discrétionnaire dans
    l''intervalle, sans que la direction générale puisse s''y opposer. Ce n''est pas une consultation,
    c''est un transfert de pouvoir : celui qui porte l''objection tient le frein.


    ## 5. Conditions suspensives — bloquantes avant signature


    1. **Revue juridique du plafond.** Confirmation écrite que les 400 kEUR sont un plafond *total* :
    aucune exclusion pour faute lourde, aucun coût de dépose, remise en état ou dépollution hors plafond,
    aucune indexation.

    2. **Continuité du carnet existant.** Confirmation technique qu''un échec de la ligne Nordwerk n''immobilise
    aucune capacité servant le carnet actuel.

    3. **Information préalable du banquier.** Présentation du tableau du §1 avant signature — pas après.
    Nous entrons dans l''opération avec 1 100 kEUR de marge de covenant ; il doit l''apprendre de nous.


    ## 6. Déclencheurs et repli — attachés à l''option B retenue


    - **N° 1 — dérive technique.** Qualification à cadence nominale non atteinte au **6ᵉ mois** : la perte
    est constatée immédiatement et le plafond appelé. Nous ne laissons pas l''échéance dériver jusqu''au
    12ᵉ mois ; un échec constaté tôt coûte le même montant et libère six mois.

    - **N° 2 — dérive d''attention.** Chiffre d''affaires du carnet existant en retrait de plus de 8 %
    sur deux mois consécutifs : conseil convoqué, réaffectation des ressources du bureau d''études au
    carnet, priorité au socle.

    - **N° 3 — dérive de bilan.** Fonds propres sous **2 000 kEUR** à une clôture trimestrielle : gel
    de tout engagement discrétionnaire jusqu''au conseil suivant.


    Aucune reprise automatique après déclenchement : décision du conseil.


    ## 7. Ce qui renverserait cette recommandation


    Une seule observation suffit : la revue juridique établit que le plafond de 400 kEUR comporte une
    exclusion matérielle, **ou** l''analyse des onze installations montre qu''elles diffèrent de notre
    configuration sur le substrat, le volume ou la composition d''équipe au point de ramener la probabilité
    de succès sous 50 %. Dans l''un ou l''autre cas : **option A**, sans hésitation.


    ## 8. Première action


    Lundi matin : saisine du conseil juridique sur le point 5.1, avec réponse écrite exigée sous dix jours.
    La signature Nordwerk est suspendue à cette réponse.


    ---


    **Deux points à vérifier avant vendredi, que la note assume faute d''information :** que le contrat
    Sedamex reste accessible à l''échéance des dix-huit mois si nous prenons B aujourd''hui (sinon l''écart
    de 200 kEUR sous-estime le coût d''opportunité de B), et le traitement fiscal exact du §3, qui déplace
    le seuil d''indifférence de 46 % à ~51 % sans changer le sens de la recommandation.

    '
