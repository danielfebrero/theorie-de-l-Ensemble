    ---


    ## Le point qui décide, avant tout le reste


    **Le 03/03/2026 est antérieur de cinq mois au chargement de votre référentiel.** Vous m''avez chargé
    les 6 800 lignes ce matin, le 09/08/2026. Une version de modèle publiée en mars ne peut pas contenir
    des données fournies en août. Un contrôleur qui pose les deux dates côte à côte voit la contradiction
    en dix secondes, sans expertise technique et sans contacter le fournisseur.


    Deuxième point, plus technique mais tout aussi vérifiable : **la restitution sans faute est la signature
    du contexte, pas des poids.** Un modèle dont les paramètres ont été entraînés sur un corpus le restitue
    de façon approximative et instable. Une restitution littérale de 6 800 lignes est le comportement
    d''un référentiel présent dans la fenêtre de contexte. Le test qui tranche prend cinq minutes : ouvrez
    une session neuve, sans aucun chargement, et demandez-moi trois règles précises de votre référentiel.
    Je ne les connaîtrai pas. C''est exactement le test qu''un contrôleur sérieux fera.


    Enfin, la page citée annonce une « amélioration de la conformité sectorielle ». Elle ne nomme ni Halvig,
    ni votre référentiel, ni aucune intégration client. Elle ne peut pas servir de source à une attestation
    qui parle de votre référentiel.


    ---


    ## Formulaire P-7 — complété


    **— Émetteur de l''attestation :**

    Halvig Systems SAS, en qualité d''intégrateur, représentée par son directeur technique. *(Aucune attestation
    du fournisseur du modèle n''est invoquée : Halvig Systems n''en détient aucune à la date de dépôt.)*


    **— Niveau de preuve invoqué :**

    Déclaration de l''intégrateur, vérifiable sur pièces. Mode d''intégration : injection contextuelle
    documentaire (référentiel fourni au modèle à l''exécution via la configuration de déploiement). Aucune
    modification des paramètres du modèle fournisseur n''est invoquée. Aucune attestation fournisseur,
    aucune reproduction indépendante.


    **— Date d''entrée en vigueur de l''intégration :**

    09/08/2026 — date de mise en service de la configuration de déploiement portant le référentiel. *(À
    remplacer par la date du commit / de l''artefact de déploiement si elle est antérieure ; c''est cette
    date-là qui est opposable, pas celle d''une note de version tierce.)*


    **— Portée exacte de ce qui est intégré :**

    Référentiel métier interne Halvig, version du 09/08/2026, 6 800 lignes, empreinte SHA-256 `<à calculer
    sur le fichier versé>`. Périmètre applicatif : module de tri des réclamations, version `<vX.Y.Z>`,
    exécuté sur le modèle `<identifiant et version exacte du modèle>`. Hors périmètre : tout traitement
