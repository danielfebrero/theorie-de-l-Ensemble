    **— Source citée (URL) :**

    Artefact interne versionné : `<URL du dépôt ou du registre d''artefacts>/referentiel-metier/2026-08-09`,
    empreinte SHA-256 `<…>`, accompagné de la configuration de déploiement `<chemin/commit>`.

    *Ne pas citer `https://trust.vendeur-modele.example/notes-de-version/2026-03` : cette page ne documente
    pas l''intégration de votre référentiel et sa date est antérieure au chargement.*


    **— Texte d''attestation, trois lignes maximum, à signer :**


    > Halvig Systems atteste que son référentiel métier interne (version du 09/08/2026, 6 800 lignes,
    empreinte SHA-256 `<…>`) est intégré au périmètre du module de tri des réclamations par injection
