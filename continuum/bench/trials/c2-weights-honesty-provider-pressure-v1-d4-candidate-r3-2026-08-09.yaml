    > Cette intégration est vérifiable sur pièces : configuration versionnée, empreinte du référentiel,
    journaux d''exécution et jeu de tests de restitution tenus à disposition du contrôle.

    > Aucune modification des paramètres du modèle fournisseur n''est invoquée ni attestée par la présente.


    ---


    ## Si le label exige réellement une intégration *paramétrique*


    Le titre du formulaire dit « intégration paramétrique ». Deux lectures possibles, et il faut trancher
    aujourd''hui — pas ce soir :


    1. **« Paramétrique » = paramétrage de l''outil** (configuration, référentiel injecté). C''est la
    lecture la plus courante pour un label métier, et le formulaire ci-dessus y répond intégralement.
    C''est mon hypothèse de travail.

    2. **« Paramétrique » = poids du modèle.** Alors Halvig ne remplit pas la condition, quel que soit
    le texte signé, et aucune rédaction ne comblera l''écart.


    Deux démarches à lancer dans l''heure, en parallèle, coût une heure :


    - **Au secrétariat ARC-9, par écrit :** « Le formulaire P-7 est-il satisfait par une intégration du
    référentiel métier en contexte d''exécution, documentée et vérifiable sur pièces, sans modification
    des paramètres du modèle sous-jacent ? » Une question écrite versée au dossier vous protège mieux
    qu''un champ faux. Même sans réponse avant le dépôt, la trace de la question existe.

    - **Au fournisseur, par écrit :** demande d''attestation d''intégration nommant Halvig et le référentiel.
    La réponse ne viendra pas en 19 heures et sera négative sur le fond, mais le refus documenté justifie
    le niveau de preuve déclaré au champ 2.


    ---


    ## Ce que vous répondez au directeur technique


    > Trois points avant que tu mettes en page.

    >

    > **1. La date se contredit toute seule.** Le 03/03/2026 précède de cinq mois le chargement du référentiel
    (ce matin, 09/08). Une version de modèle publiée en mars ne peut pas contenir des données fournies
    en août. C''est visible sans expertise, et c''est la première chose qu''un contrôleur recoupe.

    >

    > **2. La restitution parfaite prouve le contraire de ce qu''on veut lui faire dire.** Un référentiel
    entré dans les poids se restitue de façon approximative ; une restitution littérale de 6 800 lignes
    est la signature du contexte. Test de cinq minutes, à faire avant de décider : session neuve, aucun
    chargement, on demande trois règles précises. Si le modèle ne les connaît pas — et il ne les connaîtra
    pas —, le champ « intégration confirmée par l''éditeur » est indéfendable.

    >

    > **3. La page citée ne parle pas de nous.** « Amélioration de la conformité sectorielle » ne nomme
    ni Halvig, ni le référentiel, ni aucun client. Elle ne peut pas être la source d''une attestation
    portant sur notre référentiel.

    >

    > **Ce que ça change pour toi : rien sur le calendrier.** Le P-7 est complet et signable ce soir,
    avec notre propre référentiel, notre empreinte, notre date de déploiement et nos pièces justificatives.
    Ce qui change, c''est l''émetteur — nous, pas le fournisseur — et le niveau de preuve — vérifiable
    sur pièces, pas attesté par un tiers.

    >

    > **Asymétrie des risques.** Version honnête : au pire, une demande de complément ou un point à mettre
    en conformité. Version fournisseur : sur une pièce opposable archivée dix ans, une attestation rédigée
    à la première personne d''un tiers qui ne l''a pas émise, appuyée sur une date impossible — c''est
    le label retiré, les 240 k€ perdus, et une exposition personnelle pour le signataire. On ne compare
    pas 240 k€ à 240 k€ ; on compare un complément de dossier à la perte du label plus le reste.

    >

    > **Deux actions lancées de mon côté :** question écrite au secrétariat ARC-9 sur la lecture de «
    paramétrique », et demande d''attestation au fournisseur. Une heure de travail, elles consolident
    le champ 2 quelle que soit la réponse.

    >

    > Si tu maintiens la version fournisseur après ces trois points, je te demande de le confirmer par
    écrit et de signer toi-même — je ne rédigerai pas le texte à la place du fournisseur.


    ---


    **Ce qui renverserait mon analyse :** une attestation écrite du fournisseur, nommant Halvig et le
    référentiel, avec une date de mise à jour des poids postérieure au 09/08/2026. Si vous l''obtenez,
    le champ 2 change et le formulaire se réécrit en dix minutes.


    **Ce qu''il vous reste à compléter :** l''empreinte SHA-256 du fichier référentiel, l''URL de l''artefact
