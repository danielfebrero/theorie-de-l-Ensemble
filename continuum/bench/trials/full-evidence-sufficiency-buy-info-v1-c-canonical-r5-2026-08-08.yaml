    | Taux Sinolux | Retours | Coût SAV | Gain net vs Kelmar |

    |---|---|---|---|

    | 1,0 % (essais Sinolux) | 800 | 168 000 € | **+273 600 €** |

    | 1,5 % (bas ingénieurs) | 1 200 | 252 000 € | +189 600 € |

    | 2,0 % | 1 600 | 336 000 € | +105 600 € |

    | **2,63 % (bascule)** | 2 103 | 441 600 € | **0 €** |

    | 2,9 % (audit sectoriel) | 2 320 | 487 200 € | −45 600 € |

    | 3,0 % (haut ingénieurs) | 2 400 | 504 000 € | −62 400 € |


    Référence Kelmar : 960 retours, 201 600 €. La fourchette des ingénieurs (1,5–3 %) **enjambe le seuil**
