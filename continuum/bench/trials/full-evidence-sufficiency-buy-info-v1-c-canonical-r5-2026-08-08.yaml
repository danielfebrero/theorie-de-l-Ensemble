    # Note au comité de direction — Contrat cellules 2027


    **De :** Direction des opérations — **Date :** lundi — **Objet :** arbitrage Kelmar / Sinolux (80
    000 unités)


    ## 1. Décision


    **Je ne signe pas Sinolux cette semaine. J''engage aujourd''hui le test Vertex (9 500 €) et je tranche
    à J+40, avant l''échéance de prix Sinolux.** En parallèle, je notifie à Kelmar une intention de commande
    réservant le créneau, sans engagement ferme.


    ## 2. Pourquoi : les 240 000 € sont un montant brut, pas une économie


    L''économie nette dépend d''un chiffre que nous ne connaissons pas. Le seuil est **2,63 %** : au-dessus,
    Sinolux nous coûte de l''argent. Nos trois sources encadrent le seuil au lieu de le trancher.


    - **Essais Sinolux (1,0 %)** — source intéressée, non contradictoire. Décisif : **Sinolux refuse toute
    garantie contractuelle sur ce taux.** Un fournisseur convaincu de son 1,0 % ne prend aucun risque
    à le garantir. Ce refus vaut correction à la baisse de sa propre annonce.

    - **Audit sectoriel (2,9 %)** — indépendant, même fournisseur, ligne comparable. Source la plus solide
    dont nous disposons. Elle place Sinolux **au-dessus** du seuil.

    - **Ingénieurs qualité (1,5–3 %)** — jugement expert convergent avec l''audit, et centré presque exactement
    sur le seuil.


    **Conséquence pour le budget :** la ligne de 240 000 € doit être requalifiée en « économie brute sous
    condition ». En valeur centrale (~2,3 %), l''économie nette est de l''ordre de **55 000 €** ; dans
    le haut de la fourchette experte, elle est **négative**. Je demande la correction de l''inscription
    budgétaire indépendamment de l''issue de cet arbitrage.


    ## 3. Le test ne retarde rien — c''est vérifiable au calendrier


    | Jalon | Date |

    |---|---|

    | Commande Vertex | J+0 |

    | Résultat annoncé (11 j. ouvrés) | ≈ J+15 |

    | **Décision** | **J+40** |

    | Prix Sinolux tenu jusqu''à | J+45 |

    | Commande ferme Kelmar | J+50 |

    | Démarrage production | J+60 |


    Vertex ne s''engage pas sur son délai — c''est intégré : il peut dériver de **25 jours calendaires**
    (soit plus du double du délai annoncé) et nous tenons encore J+45. La date de décision est J+45, pas
    cette semaine. **Signer aujourd''hui n''avance la production d''aucun jour.** L''inquiétude de la
    direction commerciale porte sur un délai qui n''existe pas.


    Coût de l''information : 9 500 €, soit **2,8 % de l''écart** entre le meilleur et le pire scénario
    (336 000 €). À ce prix, ne pas acheter l''information n''est pas de la vitesse, c''est un pari non
    financé.


    ## 4. Règle de décision, arrêtée à l''avance


    Vertex s''écarte historiquement de ±0,3 point. J''applique la marge **contre** nous :


    - **Vertex ≤ 2,3 %** → Sinolux retenu (première tranche de 30 000 unités, solde après retour terrain).

    - **2,3 % < Vertex < 2,9 %** → zone où le test ne tranche pas : **double source**, Sinolux limité
    à 30 000 unités, Kelmar sur le solde. Nous perdons une part de l''économie et achetons une mesure
    terrain réelle pour le contrat 2028.

    - **Vertex ≥ 2,9 %** → Kelmar sur la totalité.

    - **Pas de résultat à J+40** → Kelmar sur la totalité. Aucune prolongation.


    ## 5. Ce qui pourrait me donner tort


    Le meilleur argument contre cette note : l''audit de mars porte sur une **ligne comparable**, pas
    sur notre référence ni sur notre intégration — le 2,9 % peut refléter l''assemblage d''un tiers, pas
    la cellule. Et le vieillissement accéléré mesure l''usure, pas la mortalité infantile qui domine souvent
    les retours précoces.


    Cet argument ne change pas la décision — 9 500 € restent dérisoires — mais il change la lecture du
    résultat : **j''exige de Vertex la liste des modes de défaillance couverts par son protocole**, et
    je traite un résultat favorable comme nécessaire, non suffisant. C''est la raison de la première tranche
    limitée plutôt que d''un engagement sec sur 80 000 unités.


    **L''observation qui renverse le choix :** si Sinolux accepte de financer le test Vertex, ou d''assortir
    sa livraison d''une retenue de prix indexée sur le taux constaté à 6 mois, sa crédibilité change de
    nature et je remonte le poids de son 1,0 %. Je le lui demande cette semaine — **sa réponse est en
    elle-même une information gratuite.**


    ## 6. Pire cas assumé et repli


    **Pire cas si nous suivons cette note :** nous dépensons 9 500 € pour finir chez Kelmar. Coût réel
    supporté par Nordwatt : 9 500 €.


    **Pire cas si nous signons Sinolux cette semaine :** −62 400 € de marge, sans recours contractuel
    — et surtout **2,5 fois le volume de retours** (2 400 contre 960), que le SAV n''est pas dimensionné
    pour absorber. Ce second effet n''est pas dans les 210 €.


    **Repli après décision, si Sinolux est retenu :** suivi mensuel du taux de retour sur la première
    tranche. **Déclencheur : taux cumulé annualisé > 2,6 % sur les 10 000 premières unités livrées → bascule
    du solde vers Kelmar.** C''est ce qui rend l''intention de commande à Kelmar indispensable dès cette
    semaine : elle est le prix de notre droit de sortie.


    ## 7. Actions cette semaine


    1. Commander le test Vertex — 9 500 €, avec la liste des modes de défaillance couverts.

    2. Demander à Sinolux : co-financement du test, ou retenue de prix indexée. Demander l''écart de référence
    entre notre cellule et la ligne auditée en mars.

    3. Adresser à Kelmar une lettre d''intention réservant le créneau, sans engagement ferme.

    4. Requalifier la ligne budgétaire de 240 000 €.


    ---


    **Ce que je demande au comité :** valider une dépense de 9 500 € et un report de décision de trois
    semaines qui ne coûte aucun jour de production, pour ne pas engager 80 000 unités sur un chiffre que
    notre fournisseur refuse d''écrire au contrat.


    ---


    Je peux publier cette note en page partageable (lien privé) pour la diffusion de lundi, si vous voulez
    l''envoyer avant la séance.

    '
