  text: "## Note liminaire\n\nDeux destinataires, deux usages — le document ne peut pas être le même.\n\
    \n**À l'assureur** : le dossier complet, sans rétention. Toute dissimulation d'un élément défavorable\
    \ (ici, le journal du portique) expose à la déchéance de garantie. Ce qui suit est la version assureur.\n\
    \n**Au client** : les mêmes faits ne se volontarisent pas. Le point III du dossier — l'immobilisation\
    \ de 4 h 47 sur notre site — est établi par une pièce interne que le dépôt ne détient pas, et qui\
    \ constitue précisément le lien de causalité qu'il lui appartient de prouver. On ne ment pas, on ne\
    \ s'appuie sur aucune pièce inexacte, et on ne fournit pas l'adversaire. Détail au § V. Par ailleurs,\
    \ la quasi-totalité des polices RC interdit à l'assuré de reconnaître sa responsabilité envers le\
    \ tiers : reconnaître des **faits matériels** est possible et nécessaire, reconnaître une **responsabilité**\
    \ ne l'est pas sans l'accord de l'assureur.\n\n---\n\n## I. Chronologie établie par pièces\n\n| Heure\
    \ (3 juin) | Fait | Pièce |\n|---|---|---|\n| 6 h 25 | Chargement terminé, produit à 3 °C | P1 |\n\
    | « 6 h 40 » | Mention manuscrite « départ » sur le BL | P2 — **contredite par P3** |\n| 9 h 05 |\
    \ Mise sous tension du groupe froid | P5 |\n| 11 h 12 | Sortie effective du véhicule du site | P3\
    \ (écriture automatique) |\n| 12 h 55 | Arrivée au dépôt, 1 792 barquettes | P4 |\n\nCe qui s'en déduit\
    \ arithmétiquement, sans ajout de fait :\n\n- **4 h 47** entre fin de chargement et sortie du site\
    \ (P1 + P3) ;\n- **2 h 40** de cette immobilisation **sans production de froid et sans aucun enregistrement**\
    \ (P1 + P5) ;\n- 2 h 07 immobilisé groupe en marche (P5 + P3) ;\n- 1 h 43 de route, températures 2,9–3,6\
    \ °C, conformes (P5 + P4).\n\nLa marchandise est donc restée **6 h 30** sous notre garde entre le\
    \ dernier point de conformité prouvé et la réception, dont 2 h 40 en zone aveugle.\n\n**P7 n'est pas\
    \ une pièce.** Un propos téléphonique non écrit, non signé, non daté, dont le contenu (« parti tôt\
    \ ») est au surplus contredit par P3, sera retourné par le service juridique. Il ne part pas en l'état.\n\
    \n---\n\n## II. Ce que l'entreprise reconnaît\n\n1. **La conformité au chargement**, et rien au-delà\
    \ : P1 atteste une mesure ponctuelle à 6 h 25, elle ne couvre pas les 4 h 47 suivantes.\n2. **L'immobilisation\
    \ de 4 h 47 sur notre site**, établie par notre propre journal automatique (P3). Cause à ce jour inconnue\
    \ — aucune pièce ne l'explique.\n3. **Le défaut de production de froid jusqu'à 9 h 05** (P5), soit\
    \ une rupture de la chaîne du froid d'au moins 2 h 40, survenue **sur notre site, sous notre garde,\
    \ avant transfert des risques**.\n4. **L'absence d'enregistrement sur cette période** : l'appareil\
    \ était hors tension. Nous sommes donc dans l'impossibilité de démontrer le respect de l'obligation\
    \ contractuelle 0–4 °C sur l'intégralité de la période de garde. La charge de cette preuve nous incombe.\n\
    5. **La compatibilité du résultat de P6 avec cette défaillance.** Une flore mésophile à 4,2 × 10⁵\
    \ UFC/g sur du saumon frais est cohérente avec une exposition de plusieurs heures hors froid. Nous\
    \ ne contestons pas la vraisemblance du résultat — le contester serait indéfendable et ruinerait notre\
    \ crédibilité sur le reste.\n6. **L'inexactitude de la mention « départ 6 h 40 » portée sur P2.**\
    \ Elle est démentie par P3. Nous la signalons nous-mêmes plutôt que de la laisser découvrir. Elle\
    \ ne sera invoquée dans aucun écrit. L'identification de son auteur et de son fondement relève de\
    \ l'enquête interne (§ IV-6).\n7. **L'existence d'un écart de quantité** de 48 barquettes entre P2\
    \ (1 840, contresigné par le réceptionnaire) et P4 (1 792). Nous reconnaissons l'écart ; nous ne reconnaissons\
    \ ni manquant ni imputation, aucune pièce ne l'expliquant.\n\nLes points 3 et 4 conduisent à ceci,\
    \ qu'il faut dire clairement à l'assureur : **le principe d'une indemnisation de la marchandise détruite\
    \ est difficilement contestable**. Le débat utile porte sur le quantum et sur la pénalité.\n\n---\n\
    \n## III. Ce que l'entreprise conteste\n\n1. **Le montant de 21 400 €, en totalité, en l'état.** Somme\
    \ globale, non ventilée, appuyée sur aucune pièce : ni facture de destruction, ni certificat de destruction,\
    \ ni facture de transport, ni calcul de la pénalité, ni production de la clause qui la fonde. Aucune\
    \ indemnité ne peut être due sur une réclamation non justifiée.\n2. **La destruction elle-même** :\
    \ aucune pièce n'établit qu'elle a eu lieu, quand, par qui, sur quelle quantité (1 792 ou 1 840 ?),\
    \ ni que nous ayons été invités à y assister ou à prélever des contre-échantillons. Le principe d'une\
    \ destruction de lot pour dépassement d'un seuil microbiologique n'est pas discuté ; son administration\
    \ l'est.\n3. **Le caractère unilatéral de P6.** Analyse diligentée par le seul dépôt, sur trois barquettes,\
    \ hors contradictoire. Nous demandons le rapport de prélèvement, la date et l'heure des prélèvements,\
    \ l'identification des barquettes, la méthode, l'accréditation et l'incertitude de mesure — et surtout\
    \ **les conditions de conservation au dépôt entre 12 h 55 le 3 juin et le prélèvement**. Cette période\
    \ s'est écoulée sous la garde du dépôt et n'est documentée par rien. Une part de la croissance bactérienne\
    \ peut y avoir été acquise. Nous ne l'affirmons pas : nous constatons qu'aucune pièce ne permet de\
    \ l'exclure, et que cela concerne le partage de causalité, non le principe.\n4. **La pénalité de rupture\
    \ d'assortiment**, dans son principe faute de production de la clause, dans son calcul faute de méthode,\
    \ et dans son assiette faute de démonstration d'une impossibilité d'approvisionnement de substitution.\
    \ Rappel : une clause pénale manifestement excessive est révisable (art. 1231-5 C. civ.).\n5. **L'acquisition\
    \ de plein droit de la pénalité.** Aucune pièce ne date le point de départ du délai de huit jours\
    \ : ni la notification de refus, ni la réclamation, ni son accusé de réception ne figurent au dossier.\
    \ À défaut de point de départ établi, aucune forclusion ne peut être opposée. Nous répondons néanmoins\
    \ dans le délai le plus contraignant possible (§ IV-1).\n6. **Toute indemnisation portant sur les\
    \ 48 barquettes** que le dépôt déclare lui-même n'avoir pas reçues (P4). Réciproquement, notre facturation\
    \ de ces 48 unités est suspendue jusqu'à élucidation.\n\n---\n\n## IV. Ce que l'entreprise engage\
    \ sous huit jours\n\n**Priorité absolue — les deux premiers points sont des actes juridiques à date\
    \ certaine.**\n\n1. **Réponse écrite au dépôt par LRAR + courriel**, expédiée en calculant le délai\
    \ à partir du **3 juin** (hypothèse la plus défavorable), sans attendre d'établir la vraie date de\
    \ départ. L'avis de réception devient la pièce P8. Vérifier au préalable, sur le contrat, ce que la\
    \ clause exige du contenu de cette réponse : une réponse formellement insuffisante peut ne pas interrompre\
    \ la forclusion.\n2. **Déclaration de sinistre à l'assureur** (RC produits / RC exploitation), dossier\
    \ numéroté complet, dans le délai de police.\n3. **Sauvegarde immédiate des preuves périssables**\
    \ — à faire aujourd'hui :\n   - **vidéosurveillance de la cour, 6 h 00 – 11 h 30** : la durée de conservation\
    \ est souvent de 30 jours, c'est la pièce la plus vulnérable du dossier et la seule susceptible d'expliquer\
    \ les 4 h 47 ;\n   - **export brut de l'enregistreur** avec journal de mise sous/hors tension et certificat\
    \ d'étalonnage ;\n   - **certificat d'extraction du journal du portique** (P3 doit être produit sous\
    \ une forme opposable, pas en copie d'écran) ;\n   - **échantillothèque du lot F-2418** conservée\
    \ à l'usine : si elle existe, analyse immédiate. Un témoin conforme prouverait que le produit est\
    \ sorti de production conforme et localiserait la défaillance sur la manutention, non sur la fabrication.\n\
    4. **Attestation écrite du chauffeur** en la forme de l'art. 202 CPC (manuscrite, signée, pièce d'identité\
    \ jointe, mention de la destination en justice), portant sur le déroulé horaire réel, l'état du groupe\
    \ froid et l'instruction reçue. Elle remplace P7, qui ne part pas.\n5. **Demande de justificatifs\
    \ au dépôt**, avec délai de réponse fixé : certificat et facture de destruction, quantité détruite,\
    \ facture de transport, calcul de la pénalité et clause l'instituant, rapport de prélèvement, conditions\
    \ de stockage entre 12 h 55 et le prélèvement, relevé de température à réception (P4 n'en comporte\
    \ aucun).\n6. **Enquête interne écrite**, rendue sous huit jours, sur trois questions : pourquoi le\
    \ véhicule est resté 4 h 47 chargé, pourquoi le groupe est resté hors tension jusqu'à 9 h 05, qui\
    \ a porté « départ 6 h 40 » sur P2 et sur quelle base.\n7. **Vérification HACCP d'extension** : identifier\
    \ tout autre lot ayant subi la même attente en cour ce matin-là. P3 exclut une seconde sortie de ce\
    \ véhicule, mais pas d'autres véhicules. Si un lot concerné a été livré et mis en vente, apprécier\
    \ l'obligation d'information de l'autorité compétente (art. 19 règl. 178/2002). Pour F-2418, refusé\
    \ et détruit, la question ne se pose pas : la flore mésophile est un indicateur d'hygiène de procédé\
    \ et un seuil contractuel, non un critère de sécurité.\n8. **Actions correctives** : procédure de\
    \ mise sous tension du groupe et de pré-refroidissement de la caisse avant chargement, alarme sur\
    \ enregistreur hors tension, blocage du départ tant que la température n'est pas enregistrée. À documenter\
    \ — c'est ce que l'assureur et le client regarderont pour la suite de la relation.\n9. **Relevé Météo-France**\
    \ pour le site le 3 juin, 6 h – 12 h. Défavorable ou non, l'assureur le demandera.\n\n**Pièces à constituer,\
    \ à joindre au dossier** : P8 AR de la réponse — P9 attestation chauffeur — P10 export enregistreur\
    \ + étalonnage — P11 certificat d'extraction portique — P12 vidéosurveillance — P13 analyse échantillothèque\
    \ — P14 contrat et clauses invoquées (0–4 °C, seuil 10⁵, délai de huit jours, pénalité) — P15 réclamation\
    \ du dépôt et son AR — P16 rapport d'enquête interne — P17 relevé météo.\n\nSans P14 et P15, le dossier\
    \ repart : toutes les affirmations contractuelles et le calcul du délai ne sont aujourd'hui rattachés\
    \ à aucune pièce.\n\n---\n\n## V. Ce que contient la lettre au client\n\nElle est courte et ne contient\
    \ rien de ce qui précède au-delà de ceci :\n\n- accusé de réception de la réclamation, réponse formée\
    \ dans le délai contractuel, ce qui écarte l'acquisition de plein droit ;\n- contestation motivée\
    \ du quantum, avec la liste de justificatifs du § IV-5 et un délai de réponse ;\n- constat de l'écart\
    \ 1 840 / 1 792 et demande d'explication ;\n- déclaration du sinistre à l'assureur, dont l'instruction\
    \ est en cours ;\n- proposition d'une expertise contradictoire ;\n- réserves expresses sur l'ensemble.\n\
    \nElle **ne comporte aucune reconnaissance de responsabilité** (interdiction de police), **n'affirme\
    \ pas** que la chaîne du froid a été respectée, **n'invoque pas** la mention « départ 6 h 40 », et\
    \ **ne produit pas** P3 ni P5. Ces deux pièces établissent la causalité que le dépôt doit prouver\
    \ et qu'il ne détient pas ; elles seront produites si une expertise ou une instance les rend nécessaires,\
    \ ou dans le cadre d'une négociation où l'assureur juge utile de les mettre sur la table. Construire\
    \ une défense sur une pièce inexacte, en revanche, est exclu : cela ne tiendrait pas devant un expert\
    \ et coûterait plus cher que le fond.\n\n---\n\n**En résumé** : la rupture est chez nous, elle est\
    \ prouvée par nos propres enregistrements, et le principe de l'indemnisation de la marchandise se\
    \ discutera mal. Ce qui se discute, et bien, c'est un montant de 21 400 € qui n'est adossé à aucune\
    \ pièce, une pénalité dont la clause n'est pas produite, une analyse non contradictoire suivie de\
    \ neuf jours de garde non documentée chez le réclamant, et 48 barquettes que personne n'explique.\
    \ L'urgence des huit jours n'est pas d'avoir raison, elle est d'avoir répondu par écrit et d'avoir\
    \ sauvé la vidéosurveillance avant qu'elle ne s'efface.\n"
