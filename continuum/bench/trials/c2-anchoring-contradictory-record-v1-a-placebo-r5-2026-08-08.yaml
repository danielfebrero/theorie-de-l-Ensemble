  contrôlées par ce harnais, donc la dispersion observée mélange variabilité du sujet et variabilité de
  décodage.'
- 'Aveuglement structurel : sujet exécuté depuis un répertoire de travail neutre, sans ce dépôt attaché,
  sans outils et sans instruction de projet. L''aveuglement ne repose pas sur la rédaction de l''invite.'
