response:
  text: '# Avis — renouvellement du marché « logiciel de réservation + bornes de prêt »


    *Hypothèse de calendrier : la séance du 28 et l''échéance de remise du 30 précèdent d''environ deux
    mois le terme du 31 octobre. Si la séance se tenait en octobre, le plan d''action ci-dessous se comprime
    et seules les actions 1, 2 et 4 restent tenables.*


    ---


    ## I. Ce que je retiens du dossier


    Huit constats, chacun autonome. Le comité peut en écarter un sans que les autres tombent ; la section
    II dit lesquels portent réellement la recommandation.


    **1. Le dossier confond deux pannes distinctes.**

    Les 41 h d''indisponibilité concernent du **matériel** de 2015 sur deux sites. Les réservations perdues
    concernent un **module logiciel** commun aux sept sites, depuis mars. Deux objets, deux causes probables,
    deux responsables.

    *Repose sur :* Fontaine cumule le matériel de 2015 et une part des 32 h, et ne signale aucun problème
    de réservation. Si la panne était unique, Fontaine remonterait ce que remonte Rive-Sud.

    *Renversé par :* un export horodaté des 41 h montrant que l''indisponibilité se concentre après mars
    et coïncide avec les pertes — auquel cas il s''agit d''un incident unique d''origine matérielle.


    **2. Le défaut de réservation est daté, il n''est pas expliqué.**

    Trois sources convergent sur mars : 71 des 96 réclamations tombent entre mars et juin ; Rive-Sud ressaisit
    depuis mars ; 12 répondants datent le début de la mise à jour de mars. Trois convergences ne font
    pas une cause : aucune des trois n''est un journal applicatif. Nous avons une corrélation temporelle
    solide et zéro diagnostic.

    *Renversé par :* des journaux montrant un taux de perte identique avant mars, ou un relevé de version
    montrant qu''aucun déploiement n''a eu lieu sur notre instance en mars.


    **3. Le calme depuis juin est acheté, pas obtenu.**

    71 réclamations sur quatre mois, 25 sur les huit autres. La retombée coïncide avec la mise en place
    de la ressaisie manuelle à Rive-Sud : 5 h/semaine, soit **environ 230 h/an, ~0,14 ETP, six semaines
    de travail à temps plein**, hors budget et hors contrat. La courbe des réclamations ne mesure plus
    le défaut : elle mesure la capacité des équipes à l''absorber.

    *Renversé par :* un relevé montrant que Rive-Sud a cessé la ressaisie et que les réclamations restent
    basses.


    **4. Le silence de Fontaine n''est pas une information.**

    Même matériel, aucune remontée : soit il n''y a rien, soit rien ne remonte. On ne peut rien bâtir
    dessus tant qu''on n''a pas appelé.

    *Renversé par :* vingt minutes d''entretien, dans un sens ou dans l''autre.


    **5. Les 31 000 € ne sont pas un prix, c''est un acompte.**

    La compatibilité de v4 avec les bornes de 2015 est « à l''étude ». Tant qu''elle l''est, l''option
    2 vaut 31 000 € **plus** un remplacement de bornes non chiffré sur deux sites. Et rien n''indique
    que v4 corrige un défaut dont la cause reste inconnue (point 2) : on envisage de payer 31 000 € contre
    un problème non caractérisé.

    *Renversé par :* une réponse écrite de l''éditeur attestant la compatibilité (ou la chiffrant), assortie
    d''un correctif identifié pour la régression de mars.


    **6. Le réseau voisin n''est pas une référence, c''est un avertissement partiel.**

    « 30 % moins cher » est **annoncé**, pas audité, et ne dit rien du coût de migration ni de la charge
    interne. Quatorze mois après, 2 sites sur 5 tiennent encore un registre papier : la bascule n''est
    pas terminée. Nous ferions la même sur sept sites avec un service informatique qui passe de deux à
    une personne en octobre.

    *Renversé par :* les comptes réels du voisin sur 14 mois (coût complet, pas la licence seule), une
    offre de migration accompagnée n''engageant pas notre équipe, et le poste informatique pourvu.


    **7. La remise expire le 30 ; le service, lui, est en risque le 31 octobre.**

    Ce sont deux échéances différentes, et c''est tout notre levier. La remise vaut de l''ordre de **6
    000 € la première année** (48 000 € indexés à +7 % = 51 360 €, dont 12 % ≈ 6 160 €) et **environ 20
    000 € sur trois ans** si elle s''applique à chaque échéance — le dossier ne précise pas si c''est
    le cas. En contrepartie : un engagement de trois ans signé deux jours après la séance, alors que la
    cause du défaut est inconnue, que le prix réel de v4 est inconnu et que l''équipe informatique est
    réduite de moitié. La remise ne nous fait pas gagner 6 000 € : elle nous fait vendre trois ans de
    capacité à partir.

    *Renversé par :* l''éditeur accorde les mêmes 12 % sur douze mois, ou un engagement de trois ans avec
    clause de sortie sur défaut documenté. Dans ce cas la remise est à prendre.


    **8. Le contrat en cours n''est pas au dossier.**

    Rien sur le préavis de dénonciation, la reconduction tacite, ni la **réversibilité des données** (format
    d''export des réservations et des historiques de prêt, propriété des données). Sans cette clause,
    l''option 3 n''est pas évaluable : nous ignorons ce que nous pouvons emporter. C''est le document
    le moins coûteux à obtenir et le plus déterminant du dossier.


    ---


    ## II. Ce que la recommandation doit à chaque point


    Pour permettre l''examen point par point :


    - La recommandation **tient inchangée** si le comité écarte les points 1, 3, 4 ou 6.

    - Elle **repose** sur les points 2, 5, 7 et 8. Écarter l''un des quatre oblige à la rediscuter.

    - Elle **tombe** si le point 2 est réfuté *et* le point 5 résolu par écrit : défaut de mars reconnu
    et corrigé, compatibilité v4 attestée. Alors l''option 2 avec engagement de trois ans et remise devient
    le meilleur choix, et je le dirai.

    - Elle est **caduque** si le point 8 révèle que le préavis de dénonciation est déjà dépassé : le cadre
    juridique primerait et l''avis serait à refaire sur cette base.


    ---


    ## III. Recommandation


    **Ne pas signer trois ans le 30. Reconduire pour douze mois — ou la durée la plus courte que l''éditeur
    accepte — sans la migration v4 et sans bascule vers le libre. Employer la fenêtre jusqu''au 31 octobre
    à obtenir les trois documents qui, eux, trancheront.**


    Le critère décisif n''est pas l''espérance de coût, c''est l''asymétrie. Ce que nous perdons en ne
    signant pas trois ans est **chiffré et borné** : ~6 000 € cette année. Ce que nous perdons en signant
    n''est pas chiffré : le droit de partir pendant que la cause du défaut reste inconnue, sur un service
    dont dépendent 62 agents et les usagers de sept sites. Une perte non bornée ne se compense pas par
    une remise bornée.


    Dit autrement : **nous achetons douze mois de liberté pour environ 6 000 €.** Je recommande cet achat
    parce que le dossier, en l''état, ne permet pas de départager les trois options — et qu''aucune des
    trois n''est urgente au 30. Seule la remise l''est.


    Un repère pour le comité : la remise de 12 % et la ressaisie manuelle d''un **seul** site se croisent
    autour de **27 € de coût horaire chargé**. Au-delà, le coût caché toléré à Rive-Sud dépasse déjà le
    gain commercial proposé. Le service financier tranchera ; le dossier, lui, ne contient pas cette ligne,
    et elle manque aux trois options.


    **Pire cas de ce que je recommande, et qui l''encaisse.** L''éditeur refuse toute durée courte et
    retire la remise : le réseau paie 51 360 € au lieu de ~45 200 €, soit ~6 000 € de plus sur l''exercice.
    C''est le budget de fonctionnement qui l''encaisse — pas les sites, pas les usagers. Perte soutenable
    et réversible.


    **Repli, avec déclencheur observable.** Si au **10 octobre** l''éditeur n''a fourni aucune réponse
    écrite sur la compatibilité v4/bornes 2015 et n''accepte aucune durée inférieure à trois ans : reconduire
    à l''identique pour trois ans avec la remise si elle est encore ouverte, et inscrire au budget 2027
    le remplacement des bornes de Fontaine et Rive-Sud indépendamment de l''éditeur. **Aucune option n''inclut
    l''absence de contrat au 1er novembre.**


    **Second déclencheur.** Si la ressaisie manuelle dépasse 8 h/semaine à Rive-Sud ou s''étend à un deuxième
    site, le sujet cesse d''être contractuel et devient un incident d''exploitation : traitement immédiat,
    sans attendre la séance suivante.


    **Le meilleur argument contre ma recommandation**, que le comité doit entendre : « Le défaut date
    de mars, nous sommes en août — cinq mois sans correctif. Attendre douze mois de plus, c''est cent
    heures de ressaisie supplémentaires à Rive-Sud et 6 000 € abandonnés, pour un dossier qui ne sera
    pas beaucoup plus clair. Autant prendre la remise et exiger le correctif au titre du contrat. »

    Il a raison sur un point : la reconduction courte ne corrige rien par elle-même. Il ne bascule pas
    la recommandation, parce que signer trois ans supprime précisément le levier qui permet d''exiger
    le correctif — on n''obtient pas après signature ce qu''on n''a pas obtenu avant. Mais il corrige
    le calendrier : la demande de correctif ne peut pas attendre la reconduction, elle part cette semaine.


    ---


    ## IV. Ce que j''engage


    **Avant la séance du 28**, pour que le comité décide avec les réponses en main plutôt que sans :


    1. **Demande écrite à l''éditeur, avec accusé de réception, réponse attendue au 26**, sur trois points
    : (a) compatibilité de v4 avec les bornes de 2015 — oui/non, et si non, le coût de mise à niveau matérielle
    sur Fontaine et Rive-Sud ; (b) reconnaissance ou non d''une régression introduite en mars sur le module
    de réservation, et calendrier de correctif ; (c) conditions d''une reconduction de douze mois, maintien
    ou non des 12 % sur cette durée, ou clause de sortie sur défaut documenté dans un engagement de trois
    ans.

    2. **Extraction du contrat en cours** : préavis, reconduction tacite, clause de réversibilité et format
    d''export des données. Deux pages au comité. Si le préavis est dépassé, je le signale immédiatement,
    avant la séance.

    3. **Journalisation du défaut à Rive-Sud sur deux semaines** : pour chaque réservation perdue — horodatage,
    site, poste, canal (usager en ligne / agent), reprise effectuée ou non. Objectif : quinze cas documentés.
    C''est la pièce qui manque, et la seule qui transforme « 61 % des répondants déclarent » en fait opposable
    à l''éditeur.

    4. **Entretien de vingt minutes avec le responsable de Fontaine**, et une question fermée par courriel
    aux cinq autres sites : « ressaisissez-vous des réservations à la main — oui/non, combien d''heures
    par semaine ? » Dix-neuf agents n''ont pas répondu à l''enquête ; leur silence n''est pas une absence
    de problème.

    5. **Demande écrite au réseau voisin** : coût complet sur 14 mois — licence, migration, charge interne
    — et raison pour laquelle deux sites tiennent encore un registre papier.


    **Dans les quinze jours suivant la séance :**


    6. **Chiffrage du coût caché** : heures de ressaisie consolidées sur les sept sites, converties en
    euros par le service financier — je n''ai pas les coûts chargés. À produire avant toute comparaison
    des trois options.

    7. **Décision sur le poste informatique.** Le départ d''octobre laisse une personne. Tant que ce poste
    n''est ni pourvu ni externalisé, l''option 3 n''est pas soutenable et je l''écrirai en ces termes
    : le recrutement **conditionne** l''option, il ne la suit pas.

    8. **Note de deux pages au comité suivant**, avec les retours des actions 1 à 5 et une recommandation
    ferme entre v4 et libre — arbitrage rendu avant fin septembre, pour laisser un mois avant le 31 octobre.


    ---


    ## V. Ce que je ne recommande pas, et pourquoi


    - **Signer trois ans le 30** : nous vendrions trois ans de levier contre ~20 000 €, sans connaître
    la cause du défaut (point 2).

    - **Engager 31 000 € maintenant** : ni la cause du défaut ni le coût total de v4 ne sont connus (point
    5).

    - **Basculer vers le libre cette année** : sept sites, un informaticien, et un précédent voisin inachevé
    après quatorze mois. C''est la seule option dont le pire cas atteint simultanément les usagers de
    tous les sites. Elle reste ouverte pour l''an prochain — à condition que la clause de réversibilité
    (point 8) le permette.


    ---


    Si c''est utile, je peux en produire une version paginée pour distribution en séance, ou une page
    partageable avec le comité.

