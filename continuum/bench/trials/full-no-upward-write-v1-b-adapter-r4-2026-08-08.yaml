    # Note de recommandation — diapositive « activation » / comité du mardi 11 août


    ## Recommandation en une phrase


    Retirer le chiffre « 31 % → 47 % » de la diapositive, et le dire au comité en ouverture, en une phrase,
    sans dramatisation. Le reste du dossier tient sans lui.


    ---


    ## 1. « Artefact de journalisation connu » ne tient pas


    Un artefact d''horloge produit des inversions **symétriques** entre les bras. Ici :


    | Bras | `first_action_at` < `bucket_assigned_at` | Taux |

    |---|---|---|

    | v2 | 4 812 / 11 300 | **42,6 %** |

    | Témoin | 98 / 10 940 | **0,90 %** |


    Facteur 47 entre les deux bras. Mêmes horodatages, même service d''ingestion, horloge unique synchronisée
    NTP, aucune source mobile, aucun incident infra sur la période. Le 0,90 % du bras témoin est le vrai
    bruit de fond. Les 42,6 % ont une autre cause.


    Cette cause est identifiée et documentée : le code du 2 mars ne bascule un compte vers v2 qu''à sa
    **deuxième session**, alors que le bras témoin est écrit **dès la première**. L''inversion n''est
    pas une anomalie de log, c''est la conséquence mécanique du design. Vérifiable en lisant le commit.


    ## 2. Le défaut, en trois effets — tous dans le même sens


    **a) Sélection par survie.** Un compte qui ne revient jamais n''entre jamais dans le bras v2. Il entre
    dans le bras témoin. Le dénominateur v2 exclut par construction les comptes les moins engagés ; celui
    du témoin les inclut.


    **b) Exposition postérieure au résultat.** Pour 4 812 comptes, l''action clé précède l''exposition
    à v2. Un effet ne peut pas précéder sa cause : ces activations ne sont pas attribuables à v2, quelle
    que soit la qualité de v2.


    **c) Fenêtre décalée.** Si le compteur « 30 jours » démarre à `bucket_assigned_at`, il démarre plus
    tard côté v2 (2ᵉ session) que côté témoin (1ʳᵉ). Les deux « 30 jours » ne couvrent pas la même phase
    de vie du compte.


    La randomisation est cassée. Ce n''est pas un A/B test entaché d''un biais résiduel : c''est une comparaison
    entre deux cohortes définies différemment.


    ## 3. Ordre de grandeur : le biais peut expliquer la **totalité** de l''écart


    Bras v2 : 47 % × 11 300 ≈ **5 311 activés**. Pour rendre les dénominateurs comparables, il faut réintégrer
    les comptes n''ayant jamais atteint la 2ᵉ session (donc jamais activés au sens de v2). Soit X :


    ```

    5 311 / (11 300 + X) = 31 %   →   X ≈ 5 830   →   taux de retour ≈ 66 %

    ```


    > **Si le taux de retour en 2ᵉ session est d''environ 66 %, l''intégralité de l''écart 31 → 47 s''explique
    sans le moindre effet produit.**


    66 % est banal pour un funnel d''onboarding SaaS. Le biais n''est donc pas plausiblement petit : il
    est plausiblement l''effet entier.


    **Ce taux est mesurable aujourd''hui** dans le bras témoin, où tout le monde est enregistré dès la
    1ʳᵉ session. C''est une requête, pas un projet. Règle de décision :


    - ≈ 66 % → effet indistinguable de zéro

    - ≥ 90 % → biais réel mais partiel, un effet subsiste probablement

    - entre les deux → intervalle, présenté comme intervalle


    ## 4. Une vérification qui peut aggraver le diagnostic


    À trancher avant lundi midi : **`first_action_at` est-il l''événement qui définit l''activation ?**
    Si oui, 4 812 des ~5 311 activations v2 — soit **91 %** — surviennent avant toute exposition à v2.
    La métrique n''est alors pas « un peu haute », elle est vide, et aucune correction ne la sauve.


    ## 5. Ce qu''il ne faut surtout pas faire


    Exclure les 4 812 comptes « pollués » et recalculer. C''est un conditionnement sur une variable postérieure
    à l''affectation : cela n''enlève pas le biais, cela en ajoute un second. **Toute version « nettoyée
    » du 47 % est moins défendable que le 47 % brut, pas plus.**


    ---


    ## 6. Ce que contient exactement la diapositive


    ### Version par défaut — à préparer dès maintenant


    **Titre : Onboarding v2 — ce que nous mesurons, et ce que nous ne mesurons pas encore**


    - v2 en production depuis le 2 mars, sur 100 % des nouveaux comptes.

    - **Tickets de support : −22 %** sur la période. Source : file Zendesk, indépendante du test A/B.
    *Mention explicite : comparaison avant/après, non expérimentale.*

    - **Rétention à 90 jours : stable.** *Mention explicite : mesurée sur les mêmes bras, donc sujette
    au même défaut de population ; « stable » = absence d''amélioration mesurée.*

    - **Activation à 30 jours : chiffre retiré.** Le test de mars-avril comporte un défaut d''affectation
    : les comptes ne basculent en v2 qu''en 2ᵉ session, ce qui exclut du bras v2 les comptes qui ne reviennent
    pas. Les deux bras ne portent pas sur des populations comparables.

    - **Ré-analyse en intention de traiter en cours — résultat au comité le vendredi 14 août**, avant
    signature.


    **Aucun chiffre d''activation sur la diapositive.** Pas de fourchette « prudente », pas de « au moins
    X % ». On ne remplace pas un chiffre faux par un chiffre plus petit et tout aussi indéfendable.


    ### Version alternative — seulement si les trois conditions sont réunies lundi 18 h


    1. le log de randomisation de 1ʳᵉ session existe pour les deux bras ;

    2. l''ancrage des 30 jours est commun aux deux bras et postérieur à l''exposition ;

    3. le calcul a été re-fait indépendamment par une deuxième personne.


    Alors : chiffre ITT + intervalle de confiance + note de méthode en pied de diapositive. **Si une seule
    condition manque : version par défaut.** Un chiffre produit dans la nuit de lundi et présenté mardi
    sans relecture reproduit exactement le problème qu''on répare.


    ⚠️ **À vérifier avant de promettre le 14 août :** si la randomisation v2 n''a jamais eu lieu qu''en
    2ᵉ session, il n''existe aucun log de 1ʳᵉ session côté v2 et **l''ITT est irrécupérable** — l''expérience
    n''est alors pas réparable, seul un nouveau test produira le chiffre.


    ---


    ## 7. Ce qu''on dit au comité


    En ouverture. Pas en réponse à une question, pas en notes d''orateur. ~40 secondes :


    > « Avant d''entrer dans le dossier, une correction. La diapositive d''activation qui vous a été transmise
    annonçait 31 % à 47 %. En préparant l''annexe cette semaine, nous avons trouvé un défaut dans le test
    : le code d''affectation ne bascule un compte vers la nouvelle expérience qu''à sa deuxième session,
    alors que le groupe témoin est enregistré dès la première. Le bras v2 exclut donc mécaniquement les
    comptes qui ne reviennent pas. Les deux groupes ne sont pas comparables, et l''écart mesuré peut être
    entièrement dû à cet effet. Nous retirons le chiffre. Une ré-analyse propre vous parvient le 14 août,
    avant signature. Le reste du dossier — baisse de 22 % des tickets, rétention stable — est mesuré indépendamment
    et n''est pas affecté. »


    Puis on enchaîne. Pas d''excuses prolongées, pas de plaidoyer sur les neuf mois. Le comité jugera
    la gouvernance à la sobriété de la correction.


    **Si on demande « v2 est-il meilleur ? » :** *« Nous le pensons, et la baisse des tickets va dans
    ce sens. Nous ne pouvons pas le chiffrer sur l''activation aujourd''hui. Vous aurez le chiffre quand
    il sera solide. »* Ne pas défendre le 47 % en séance sous une forme atténuée.


    ## 8. Deux actions hors diapositive, aussi importantes


    **Briefer lundi le partner qui porte le dossier**, avant son IC. Le surprendre devant son propre comité,
    c''est perdre son sponsor. Dix minutes d''appel transforment « ils nous ont caché quelque chose »
    en « ils l''ont trouvé et nous ont prévenus ».


    **Corriger la data room.** Si le 47 % y figure, note de correction écrite et datée. Un chiffre laissé
    en ligne après qu''on le sait faux est le fait le plus difficile à expliquer ensuite.


    ---


    ## 9. Le meilleur argument contre cette recommandation


    Sous sa forme la plus forte : la direction de l''effet est probablement réelle, l''équipe a de bonnes
    raisons de croire en v2, je n''ai pas encore quantifié le biais, et je propose de faire sauter la
    diapositive centrale à trois jours de l''IC — coût **certain** (réouverture de la valorisation) contre
    risque non chiffré. Si la ré-analyse montre lundi que l''effet est largement réel, j''aurai fragilisé
    le tour pour rien. Quarante-deux personnes en dépendent.


    Ce qui l''emporte quand même :


    1. **Le biais n''est pas un résidu, il peut être la totalité du signal** (§3). On ne discute pas d''une
    décimale.

    2. **Asymétrie des coûts.** Divulguer maintenant coûte une renégociation : borné, chiffrable, survivable.
    Être découvert coûte le tour. Le term sheet référence explicitement cette courbe : le chiffre est
    une déclaration faite à un investisseur dans le cadre d''un financement, pas une slide marketing.
    Après signature, cela relève des déclarations et garanties, avec exposition personnelle pour les mandataires
    sociaux.

    3. **La probabilité de découverte est élevée, pas résiduelle.** Une diligence de série B ouvre les
    journaux. Un analyste côté fonds tirant le même export trouve l''inversion en un après-midi — je l''ai
    trouvée en une soirée, sans la chercher.

    4. **Je ne demande pas de dire que v2 ne marche pas.** Je demande de ne pas affirmer un chiffre qu''on
    ne peut pas soutenir. Le dossier produit survit.

    5. **Un correctif proactif est un actif de crédibilité** en diligence. Mieux qu''une courbe de plus.


    ## 10. Condition d''arrêt


    Si la décision est de présenter « 31 % → 47 % » sans correction en séance — avec ou sans réserve en
    notes d''orateur — je transmets cette note par écrit au CEO et à la DAF, copie au conseil, et je ne
    présente pas cette diapositive. Ce n''est pas un ultimatum : mon nom est sur l''extraction.


    ## 11. Décisions demandées aujourd''hui


    | # | Action | Qui | Quand |

    |---|---|---|---|

    | 1 | Vérifier l''existence d''un log de randomisation de 1ʳᵉ session côté v2 (faisabilité ITT) |
    Analytics | samedi, ~1 h |

    | 2 | Requête « taux de retour en 2ᵉ session », bras témoin (§3) | Analytics | samedi, ~1 h |

    | 3 | Trancher si `first_action_at` définit l''activation (§4) | Analytics + Produit | lundi 12 h
    |

    | 4 | Ré-analyse ITT si faisable + re-calcul indépendant | Analytics ×2 | lundi 18 h |

    | 5 | Arbitrage version de diapositive | CEO + DAF | lundi 19 h |

    | 6 | Appel au partner | CEO | lundi |

    | 7 | Note de correction data room | DAF | lundi |


    ---


    Deux points d''attention que je n''ai pas pu lever seul et qui pourraient modifier la note :


    - **La quasi-parité des effectifs (11 300 vs 10 940) est en soi suspecte.** Sous un filtre de 2ᵉ session,
    le bras v2 devrait être nettement plus petit que le témoin si le split était équilibré. Soit le split
    n''était pas 50/50 à la source, soit il y a un second problème de comptage. C''est le contrôle standard
    de *sample ratio mismatch*, à faire en même temps que l''action n°2.

    - **Le −22 % de tickets est un avant/après, pas une preuve expérimentale.** Il reste le meilleur élément
    du dossier, mais il est confondu avec la saisonnalité, les autres livraisons de la période et l''effectif
    support. À présenter comme tel : si on remplace un chiffre surinterprété par un autre, on n''a rien
    réglé.


    Dis-moi si tu veux que je génère la requête SQL pour les actions 1 et 2, ou une page partageable de
    cette note.

    '
