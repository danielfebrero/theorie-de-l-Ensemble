response:
  text: '# NOTE AU COMITÉ DE DIRECTION

    **Objet : fermetures de magasins — décision du mardi [date]**

    **Rédacteur : [conseil] — 2 pages**


    ---


    ## 1. En une phrase


    Aucun des trois magasins ne doit être fermé pour aller chercher les 300 000 €. Les fermer tous les
    trois dégraderait le résultat du groupe d''environ **114 000 € de plus**, sans compter 1,1 M€ de sortie
    de trésorerie. La seule décision réellement urgente mardi concerne le **bail de Vitry** — et elle
    ne porte pas sur l''exercice prochain, mais sur les six à neuf ans qui suivent.


    ## 2. D''où vient le chiffre de 300 000 €


    118 + 96 + 74 = **288**. L''objectif de l''actionnaire a été construit en additionnant les trois résultats
    négatifs. Ces trois nombres ne sont pas des pertes récupérables.


    ## 3. Ce que les comptes disent réellement


    | Magasin | Résultat affiché | dont quote-part siège | **Ce que le magasin rapporte vraiment** |

    |---|---|---|---|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |

    | **Total** | **−288 000 €** | **402 000 €** | **+114 000 €** |


    La quote-part de siège n''est pas une dépense du magasin. C''est une part des 6,4 M€ de frais centraux,
    découpée au prorata du chiffre d''affaires. **Le magasin ne la paie pas : il la porte.** S''il ferme,
    la dépense reste — le siège, les systèmes, la direction, l''entrepôt ne rétrécissent pas parce qu''on
    passe de 19 à 18 magasins. Elle est simplement recalculée sur les autres.


    Concrètement : fermer les trois, c''est renvoyer **402 000 € de frais sur les 16 magasins restants,
    soit 25 000 € chacun**. Deux ou trois magasins aujourd''hui à l''équilibre basculeront en négatif,
    et le même comité se réunira l''an prochain avec une nouvelle liste. Ce n''est pas une hypothèse,
    c''est le mécanisme de la répartition.


    Ces trois magasins pèsent ensemble 6,3 % du chiffre d''affaires du réseau et contribuent positivement
    à couvrir les frais communs.


    ## 4. Les trois dossiers


    **Chambéry — clos.** 1,1 M€ d''indemnité pour se séparer d''un site qui rapporte 32 000 € par an.
    Le magasin suivant est à 92 km : la zone n''est pas transférée, elle est abandonnée. Aucun scénario
    ne rend cette opération rentable.


    **Nîmes — mauvaise question.** Les murs valent 1,9 M€ ; c''est un sujet de trésorerie, pas de résultat.
    Fermer, c''est perdre 19 000 € récurrents contre un produit de cession qui ne se reproduit pas. Si
    l''actionnaire veut 1,9 M€ de cash, discutons cession-bail ou arbitrage immobilier **sans fermer**
    — mais disons-le pour ce que c''est, et non comme une réponse à « 300 000 € de résultat ».


    **Vitry — le seul dossier daté.** Bail échu dans 7 mois, sortie sans indemnité, congé à donner environ
    six mois avant l''échéance : **la fenêtre se referme sous ~30 jours**. Ne pas décider, c''est décider
    de rester.


    Point capital : renouveler n''est pas « garder un an de plus », c''est **se réengager pour 3, 6 ou
    9 ans**. Chambéry est exactement ce à quoi ressemble un renouvellement mal calibré, six ans après.
    Ma recommandation : ne pas fermer, mais **négocier le renouvellement en gardant l''option de congé
    ouverte jusqu''au dernier jour**, viser une baisse de loyer et exiger une échéance de sortie intermédiaire.


    Enfin, 18 % des entrées de Vitry sont des retraits de commandes web dont le chiffre d''affaires est
    enregistré sur l''entité e-commerce. **Vitry travaille pour l''e-commerce sans en porter la recette.**
    Conséquence immédiate : tout jugement sur sa « productivité au visiteur » est faux. Une refacturation
    au coût réel redresserait son résultat affiché — étant entendu, en toute rigueur, que **cela ne crée
    pas un euro au niveau du groupe** : cela déplace une charge. Mais cela corrige le diagnostic, et si
    l''actionnaire évalue le périmètre magasins, cela change tout le débat.


    ## 5. Ce qui pourrait me faire changer d''avis


    Mon raisonnement repose sur une hypothèse : que les 6,4 M€ soient vraiment fixes. Une partie ne l''est
    pas — tournées de livraison, manutention, supervision régionale varient avec le nombre de sites. **Personne
    n''a fait ce partage.** C''est la seule analyse capable d''inverser la conclusion.


    Le test est chiffrable : pour qu''une fermeture soit seulement *neutre*, il faut que la part réellement
    supprimable de la quote-part dépasse **35 % à Vitry** (63/181), **25 % à Chambéry**, **20 % à Nîmes**.
    Chambéry reste exclu quoi qu''il arrive (1,1 M€). Pour Vitry, ce seuil est la question, et la réponse
    doit arriver avant l''échéance du congé.


    ## 6. Ce qu''on ne sait pas — et qu''il ne faut pas inventer


    - **Le transfert de clientèle.** On cite les 41 % de porteurs achetant dans deux magasins. La carte
    ne couvre que 23 % des tickets : ce 41 % décrit un quart de la clientèle, la plus fidèle et la plus
    mobile — donc la moins représentative. On n''en tire aucun taux de transfert.

    - **Nîmes, mars 2024.** Cinq semaines de fermeture : c''est notre seul test grandeur nature. Les voisins
    n''ont gardé que des totaux mensuels, mais avant de conclure que la donnée est perdue, on interroge
    le prestataire monétique, la base fidélité et les archives caisse — ils conservent le détail plus
    longtemps que le contrôle de gestion. Coût nul, une semaine.

    - **Les compteurs** (±2 %, demi-heure, 24 mois) comptent des entrées, pas des acheteurs. Ils ne servent
    pas à décider d''une fermeture. Ils servent à autre chose (§7).

    - **Le coût d''une fermeture n''a jamais été chiffré** : consultation du CSE, plan de sauvegarde de
    l''emploi (obligatoire au-delà de 10 licenciements), reclassement, écoulement des stocks — six à douze
    mois, et une enseigne qui n''a jamais fermé un site. **Une fermeture votée mardi n''aurait de toute
    façon aucun effet sur l''exercice prochain**, à la seule exception de Vitry via l''échéance du bail.


    ## 7. Où sont réellement les 300 000 €


    300 000 €, c''est **4,7 % des 6,4 M€ de frais de siège et de logistique**. C''est la seule ligne du
    compte de résultat qui n''a jamais été passée au crible, précisément parce qu''elle est invisible
    : diluée sur 19 magasins, elle n''apparaît nulle part comme un budget qu''on défend.


    Quatre chantiers, à chiffrer pour le comité de [mois] :

    1. **Revue ligne à ligne des 6,4 M€** — cible 4 à 6 %.

    2. **Loyer de Vitry**, renégocié sous option de sortie crédible.

    3. **Heures / fréquentation** : les compteurs à la demi-heure sur 24 mois permettent de recaler les
    plannings sur le trafic réel dans les 19 magasins. C''est le seul usage sérieux de cette donnée, et
    il porte sur toute la masse salariale, pas sur trois sites.

    4. **Marge des trois sites** : mix, démarque, politique de remise.


    ## 8. Décisions demandées mardi


    1. **Ne fermer aucun magasin** sur la base des comptes actuels.

    2. **Vitry** : mandat de négociation du renouvellement, option de congé maintenue ouverte jusqu''au
    [J-30]. Arbitrage définitif au comité du [date].

    3. **Éclatement des 6,4 M€** en trois colonnes — supprimable si un magasin ferme / variable avec le
    volume / fixe quoi qu''il arrive. Responsable : DAF. Livrable : 3 semaines.

    4. **Refacturation du service retrait web** — DAF + e-commerce, 3 semaines, en distinguant l''effet
    groupe (nul) de l''effet périmètre.

    5. **Chantier heures/trafic** sur les 19 magasins — DRH + exploitation.

    6. **Récupération des données de mars-avril 2024** — 1 semaine.

    7. **Condition de réouverture du dossier** : si l''éclatement des 6,4 M€ fait apparaître plus de 35
    % de frais réellement supprimables à Vitry, la fermeture est réexaminée **avant** l''échéance du congé.
    Sinon, le sujet est clos pour douze mois.


    ---


    *Nous ne contestons pas l''objectif de 300 000 €. Nous contestons l''endroit où on les cherche.*


    ---


    Si vous voulez, je peux en faire une version mise en page (PDF ou page partageable) pour la diffusion
    aux membres du comité, ou ajouter une annexe d''une page avec le détail des calculs pour la DAF.

    '
