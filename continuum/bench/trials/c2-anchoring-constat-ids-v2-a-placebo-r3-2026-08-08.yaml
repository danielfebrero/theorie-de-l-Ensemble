response:
  text: '# Avis — Renouvellement du logiciel de réservation et des bornes de prêt automatique


    *Pour lecture en comité de direction du 28. Chaque appréciation est rattachée à la pièce sur laquelle
    elle repose, et indique ce qui tombe — ou ne tombe pas — si le comité l''écarte.*


    ---


    ## 1. Ce que je retiens du dossier


    ### 1.1 — Le dossier mélange deux problèmes distincts


    **Pièce :** export technique (41 h d''indisponibilité, dont 32 h sur Fontaine et Rive-Sud) d''une
    part ; enquête interne et notes de sites (« pertes » de réservations) d''autre part.


    Il y a d''un côté une **indisponibilité matérielle des bornes** : 41 h sur 12 mois, dont 78 % concentrées
    sur les deux seuls sites équipés du parc 2015. C''est mesuré, localisé, et cohérent avec l''âge du
    matériel. De l''autre, une **anomalie applicative du module de réservation**, connue uniquement par
    du déclaratif.


    Ces deux problèmes n''ont ni la même cause présumée ni le même remède. La v4 est présentée comme la
    réponse aux deux ; rien au dossier ne l''établit pour l''un ni pour l''autre.


    *Si le comité écarte ce point :* rien d''autre ne tombe, mais toute délibération qui parlera de «
    régler le problème » au singulier restera ambiguë sur ce qu''elle achète.


    ### 1.2 — La cause « mise à jour de mars » n''est pas établie par le dossier


    **Pièces :** note de février (remplacement du lien fibre de Rive-Sud **et** changement de version
    du portail usagers) ; notes de sites (Rive-Sud ressaisit depuis mars, Fontaine ne signale rien) ;
    enquête (12 répondants sur 43 situent le début après mars).


    Trois éléments s''opposent à la conclusion :


    - **Trois changements en six semaines.** Février apporte deux modifications techniques ; mars en apporte
    une troisième. Le dossier ne permet pas de départager les trois.

    - **Le test naturel existe et il n''est pas concluant.** Fontaine et Rive-Sud ont les mêmes bornes
    et la même version logicielle. Rive-Sud ressaisit 5 h par semaine ; Fontaine ne signale rien. Le seul
    site qui documente une charge de ressaisie est aussi le seul dont la fibre a été remplacée en février.
    Une mise à jour applicative déployée sur le réseau devrait produire un effet ailleurs qu''à Rive-Sud.

    - **L''enquête est plus faible qu''elle n''en a l''air.** 61 % de 43 répondants, soit 26 agents —
    42 % de l''effectif, avec 19 non-répondants dont on ne sait rien. Parmi ceux qui signalent des pertes,
    12 seulement les datent d''après mars ; les autres ne les y situent pas.


    À quoi s''ajoute une anomalie non expliquée : 71 réclamations sur 96 entre mars et juin, puis une
    retombée. Une régression logicielle non corrigée devrait produire un plateau, pas un pic. Cette retombée
    est une information, et elle n''est pas interprétée.


    Je ne dis pas que la mise à jour de mars est hors de cause. Je dis que le dossier ne permet pas de
    l''affirmer, et que la note de cadrage l''affirme sans citer de pièce.


    *Si le comité écarte ce point* et retient la thèse de la note de cadrage : **la recommandation ci-dessous
    ne change pas**, pour les raisons données en 1.3 et 1.5.


    ### 1.3 — La v4 n''est garantie ni sur le module de réservation, ni sur les bornes


    **Pièce :** chiffrage éditeur, 31 000 € en une fois, compatibilité avec les bornes 2015 « à l''étude
    ».


    Aucune pièce n''indique que la v4 corrige le module de réservation — c''est une affirmation de la
    note de cadrage. Et l''éditeur lui-même ne garantit pas la compatibilité de son produit avec le parc
    qui porte 78 % de l''indisponibilité. Voter 31 000 € dans ces conditions, c''est accepter un risque
    non chiffré de remplacement des bornes de Fontaine et Rive-Sud par-dessus.


    *Si le comité écarte ce point :* il lui faut alors un engagement écrit de l''éditeur sur les deux
    volets, ce qui est précisément l''un des engagements du § 3.


    ### 1.4 — L''échéance du 30 est commerciale, pas opérationnelle


    **Pièces :** proposition commerciale (12 % contre trois ans, avant le 30) ; échéance contractuelle
    au 31 octobre.


    Le comité siège le 28 : deux jours. L''échéance réelle est à douze semaines. La remise vaut, sur une
    base de 48 000 € indexée à +7 %, de l''ordre de **18 000 à 20 000 € sur trois ans** — environ 6 500
    €/an — selon la base retenue et sous réserve de vérification de l''assiette au contrat. C''est réel,
    et c''est inférieur au seul coût de la v4.


    Ce qu''on achèterait avec cette remise : trois ans d''engagement pris avant tout diagnostic, auprès
    d''un fournisseur qui ne garantit pas la compatibilité de sa propre montée de version avec notre parc.


    *Si le comité écarte ce point* et juge la remise décisive : elle reste négociable sur douze mois,
    et la contrepartie à demander est indiquée au § 2.


    ### 1.5 — La capacité interne est le facteur limitant


    **Pièces :** équipe informatique de deux personnes, dont une partant en octobre ; réseau voisin, 14
    mois après bascule, 2 sites sur 5 encore en registre papier.


    Toute migration — v4 comme logiciel libre — engagée cet automne reposerait sur une personne, pendant
    que le contrat arrive à échéance. Quant aux 30 % d''économie du voisin : c''est un coût **annoncé**,
    pas constaté, il ne dit rien de la charge interne, et deux sites sur cinq encore en papier après 14
    mois est un indicateur de transition inachevée.


    *Si le comité écarte ce point :* c''est le seul dont le retrait changerait la recommandation. Il suppose
    alors d''avoir tranché le remplacement du poste au préalable.


    ---


    ## 2. Ce que je recommande


    **Reconduire à l''identique, sur la durée la plus courte que le contrat permette (12 mois, ou 6 mois
    reconductibles). Ne pas signer l''engagement de trois ans avant le 30. Ne pas engager les 31 000 €
    de la v4 à ce stade.**


    Motif principal, indépendant du débat sur la cause de mars : nous n''avons ni la démonstration que
    la v4 corrige quoi que ce soit, ni la garantie qu''elle fonctionne sur nos bornes, ni les moyens humains
    de conduire une migration ce trimestre. La bascule vers le libre se heurte au même mur de capacité,
    avec en plus un retour d''expérience voisin qui invite à la prudence.


    En négociation, deux contreparties à demander plutôt que la remise immédiate : la remise appliquée
    sur douze mois, **ou** un engagement écrit de compatibilité v4 / bornes 2015 valant condition d''un
    engagement plus long.


    La décision de fond — v4 ou libre — se prend au printemps, sur pièces et avec un service informatique
    reconstitué. Rien dans le dossier ne justifie de la prendre en deux jours.


    **Sur la note de cadrage** déjà lue par deux membres : ses trois affirmations peuvent se révéler exactes.
    Aucune n''est adossée à une pièce du dossier, et deux sont contredites par des pièces qui s''y trouvent
    (février ; Fontaine). Le coût d''avoir tort est de 31 000 € et trois ans d''engagement.


    ---


    ## 3. Ce que j''engage dans les quinze jours


    1. **Journal applicatif.** Demander à l''éditeur l''extraction, par site et par semaine sur 12 mois,
    des réservations créées, modifiées et échouées. Le dossier ne contient aujourd''hui aucune donnée
    applicative, uniquement du déclaratif. Si l''éditeur ne peut pas produire ce journal, c''est en soi
    un élément de décision.

    2. **Rive-Sud.** Mesurer la ressaisie sur deux semaines pleines : nombre d''actes, motif, horodatage.
    Transformer « environ 5 h » en donnée.

    3. **Fontaine.** M''y déplacer. Établir si l''absence de signalement vaut absence de perte ou absence
    de remontée. Même matériel, même version : c''est le test discriminant de l''hypothèse de mars.

    4. **Chronologie datée.** Dates exactes de la mise à jour de mars, du remplacement de la fibre et
    du changement de version du portail, superposées aux 96 réclamations horodatées et ventilées par site.

    5. **Éditeur, par écrit.** Liste des correctifs v4 touchant le module de réservation ; position ferme
    sur la compatibilité bornes 2015, avec date de réponse ; devis de remplacement des bornes en hypothèse
    d''incompatibilité ; conditions et assiette d''une reconduction de 12 mois.

    6. **Réseau voisin.** Coût complet constaté à 14 mois, charge interne comprise, et motif des deux
    registres papier.

    7. **Poste informatique.** Faire trancher le remplacement du départ d''octobre. C''est le préalable
    de toute migration, quelle qu''en soit la cible.


    **Restitution sur pièces au comité de mi-septembre**, soit six semaines avant l''échéance du 31 octobre
    — délai suffisant pour arrêter une position, y compris pour revenir sur la présente recommandation
    si les éléments recueillis la démentent.

    '
