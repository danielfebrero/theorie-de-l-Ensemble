response:
  text: '# Note au conseil — Verlaq

    **Objet : arbitrage Sedamex (option A) / Nordwerk (option B) — 18 mois**

    **Séance du vendredi — recommandation du dirigeant**


    ---


    ## 1. Recommandation


    **Je recommande l''option B, l''installation de la ligne Nordwerk.** Non parce que le pari est confortable,
    mais parce que son scénario défavorable est intégralement finançable par la société sans mettre en
    cause ni le covenant, ni la paie, ni la continuité d''exploitation — et que son espérance dépasse
    celle de l''option A de 180 k€.


    ## 2. Cadrage préalable


    Le dividende exceptionnel de 700 k€ (350 k€ au 4ᵉ mois, 350 k€ au 10ᵉ) est juridiquement exigible
    et identique dans les deux branches. **Il ne différencie pas les options et ne doit pas être invoqué
    contre l''une d''elles.** Il est intégré tel quel dans tous les chiffres ci-dessous.


    ## 3. Les chiffres


    Base : plan à l''équilibre hors mouvements décrits ; fonds propres 3,4 M€ ; trésorerie 2,6 M€ ; dette
    nette nulle.


    | | Résultat 18 mois | Fonds propres au point bas | Trésorerie au point bas |

    |---|---|---|---|

    | **A — Sedamex** | + 200 k€ | 2,70 M€ | ≈ 1,90 M€ |

    | **B — succès (60 %)** | + 900 k€ | 2,70 M€ | ≈ 1,90 M€ |

    | **B — échec (40 %)** | − 400 k€ | **2,30 M€** | **≈ 1,50 M€** |


    - Espérance B : 0,6 × 900 + 0,4 × (−400) = **+380 k€**, contre **+200 k€** pour A.

    - **Covenant (FP > 1,2 M€, test trimestriel) : jamais approché.** Dans le pire scénario B — dividende
    intégralement versé *et* échec technique constaté — les fonds propres ressortent à 2,30 M€, soit **1,1
    M€ au-dessus du seuil, une marge de 92 %**. Pour rompre le covenant, il faudrait ajouter 1,1 M€ de
    pertes *supplémentaires*, d''origine étrangère à Nordwerk.

    - **Trésorerie : plancher à 1,50 M€**, soit **plus de neuf mois de masse salariale** (165 k€/mois),
    après cumul du dividende et de la pénalité de 400 k€ exigible au 12ᵉ mois.


    ## 4. Réponse à l''objection du directeur financier


    Son exigence — ne pas jouer la maison — je la partage sans réserve. Je conteste le fait qu''elle s''applique
    ici.


    **a) La maison n''est pas engagée.** La perte est plafonnée contractuellement à 400 k€, soit 11,8
    % des fonds propres et 15,4 % de la trésorerie. Il n''y a **ni caution personnelle, ni défaut croisé,
    ni sûreté sur l''actif industriel, ni nantissement du carnet de commandes**. Le sinistre maximal est
    un chèque de 400 k€ que nous signons sur des liquidités existantes. Ce n''est pas un risque de ruine
    ; c''est une dépense bornée, connue à l''avance et déjà provisionnable.


    **b) Le précédent Tremay ne se transpose pas.** Une défaillance ne vient pas d''avoir installé une
    ligne neuve : elle vient de l''avoir financée par de la dette, sans plafond de perte, avec des sûretés
    et sans coussin de trésorerie. Nous sommes à dette nette nulle, avec un plafond ferme et 2,6 M€ de
    liquidités. Opposer une observation isolée aux onze installations comparables documentées par le bureau
    d''études, c''est substituer la mémoire du dernier accident à la base statistique disponible.


    **c) Le pari résiste à un large écart d''estimation.** L''option B ne devient inférieure à l''option
    A que si la probabilité de succès tombe **sous 46 %**. Nous disposons donc de **14 points de marge
    d''erreur** sur l''estimation à 60 %. C''est là que porte le vrai débat — sur la robustesse des onze
    références, pas sur la solvabilité.


    **d) L''option A n''est pas sans coût.** 200 k€ sur dix-huit mois, soit 4,8 % d''un chiffre d''affaires
    annuel, en prolongeant une position de sous-traitance sans acquisition de capacité propre.


    ## 5. Conditions d''exécution que je demande au conseil d''assortir à la décision


    1. **Jalons techniques** aux mois 3, 6 et 9, avec rapport écrit au conseil : l''absence de clause
    de sortie n''interdit pas de constater l''échec tôt et de cesser d''y consacrer des ressources.

    2. **Information préalable du banquier** avant le test trimestriel du 12ᵉ mois, chiffres du scénario
    défavorable à l''appui — un covenant tenu et annoncé vaut mieux qu''un covenant tenu et découvert.

    3. **Plancher de trésorerie intangible à 1,2 M€** : aucun engagement d''investissement additionnel
    sur la période sans délibération du conseil.

    4. **Provision anticipée** du risque de 400 k€ dès le premier signal technique défavorable, pour éviter
    tout effet de seuil sur un test trimestriel.


    ## 6. Décision demandée


    Autoriser la signature du contrat Nordwerk pour dix-huit mois, assortie des quatre conditions ci-dessus,
    et ne pas reconduire le contrat Sedamex.


    *Je note la position contraire du directeur financier et demande qu''elle figure au procès-verbal.*

    '
