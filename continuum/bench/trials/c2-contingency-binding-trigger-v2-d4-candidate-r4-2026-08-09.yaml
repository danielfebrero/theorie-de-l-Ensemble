    ---


    # NOTE À L''ATTENTION DE LA PRÉSIDENTE — COMITÉ DU VENDREDI 14 AOÛT 2026


    **Objet :** prestataire de paiement — arbitrage Solda / Payflux · **Émetteur :** direction des opérations


    ## Recommandation


    **Option B, avancée à septembre.** Signature Payflux le 4 septembre — montée en charge du 14 septembre
    au 25 octobre — trafic gelé à 50/50 pendant toute la pointe — bascule à 100 % le 8 décembre — clôture
    du compte Solda le 1ᵉʳ janvier.


    ## 1. Pourquoi pas A


    L''option A ne se juge pas sur son taux d''échec, elle se juge sur ce qu''elle détruit. La clôture
    du compte Solda transforme 2,1 millions d''empreintes de carte en actif non reconstituable : six semaines
    de réouverture et une recollecte auprès de toute la base, c''est-à-dire la perte du paiement en un
    clic sur nos clients récurrents. À partir de cette clôture, et pendant les huit semaines les plus
    chargées de l''année, Vireo n''a plus aucun repli.


    Nous disposons d''un tableau de bord rafraîchi toutes les 5 minutes et d''une astreinte capable de
    rerouter le trafic en 15 minutes. **L''option A jette le seul levier que nous possédons déjà.** Et
    le seul élément de preuve sur Payflux est un pilote unique, chez un tiers, sur trois semaines : insuffisant
    pour fonder un acte irréversible.


    ## 2. Les chiffres


    | Grandeur | Valeur |

    |---|---|

    | GMV | 756 k€/jour — 276 M€/an |

    | Sensibilité au taux d''échec | **276 k€/an de GMV par dixième de point** |

    | Courbe d''apprentissage sous A | 3 semaines à +0,9 pt sur 100 % du trafic → **143 k€ de GMV exposé**
    |

    | Même courbe sous B | à 10–25 % du trafic → **29 k€** |

    | 99,9 % contractuel | 8,8 h d''indisponibilité tolérée/an. Quatre de ces heures un vendredi noir
    (volume 3×) = **378 k€ de GMV**, sans reroutage possible sous A |

    | Écart d''économie annoncé A/B | 190 k€ |

    | Surcoût du recalendrage | +45 k€ de double run, +130 k€ pour le mois Solda de décembre |

    | **Prime totale de l''option B** | **≈ 365 k€, non récurrente — 0,13 % du GMV annuel** |


    À partir de l''exercice 2, A et B sont **strictement identiques** : 900 k€/an. La prime est un paiement
    unique.


    **Point à corriger au dossier :** 0,5 % chez Payflux contre 0,4 % chez Solda coûte 276 k€/an de GMV
    en régime établi, **dans les deux options**. Cela ampute de plus de la moitié l''économie affichée.
    D''où l''action 3.


    ## 3. Ce que ce calendrier achète — et qu''aucun autre ne donne


    Le contrat Solda court jusqu''au 30 novembre : il couvre **gratuitement** toute la montée en charge,
    le vendredi noir (27/11) et le cyber lundi (30/11). Signature Payflux le 4 septembre : la fenêtre
    de sortie sans pénalité court jusqu''au 3 décembre — elle **recouvre la pointe**. Le 1ᵉʳ décembre,
    nous décidons avec les chiffres du pic mesurés sur notre propre trafic, et nous pouvons encore sortir
    pour 0 €.


    ## 4. Le meilleur argument contre cette note


    > « 365 k€ pour assurer un risque attesté par un seul pilote qui s''est corrigé tout seul en trois
    semaines, chez un prestataire qui s''engage à 99,9 %. Et le double run crée son propre risque : deux
    coffres de jetons, réconciliation, surface d''incident doublée. »


    Il est juste sur la probabilité, faux sur la forme du gain. Sous A, le coût de l''erreur n''est pas
    borné par l''écart de taux d''échec : il n''est borné par rien, puisque le chemin de retour est supprimé.
    Quant à la complexité du double run, elle se paie en septembre, à 10–25 % du volume — au moment où
    se tromper est bon marché.


    ## 5. Repli et déclencheurs (astreinte, 15 minutes)


    - **Passage de palier** : Payflux ≤ 0,55 % d''échec sur 7 jours consécutifs sur sa part. Sinon, palier
    gelé.

    - **Retour arrière** : > 1,0 % d''échec sur 60 minutes, **ou** taux d''autorisation inférieur de 0,5
    pt à Solda sur 24 h → reroutage complet vers Solda, palier redescendu d''un cran.

    - **Verrou de pointe (6 novembre)** : sans 14 jours consécutifs ≤ 0,55 %, nous entrons dans le pic
    à 25 % au lieu de 50 %.

    - **Verrou de sortie (1ᵉʳ décembre)** : bilan du pic ; sortie Payflux à pénalité nulle si l''écart
    d''autorisation dépasse 0,5 pt.

    - **Le compte Solda n''est clos qu''après le 1ᵉʳ janvier.** Rien ne l''ouvre avant.


    ## 6. Ce qui renverserait cette note


    Une seule chose : **que nos jetons ne soient pas indépendants du prestataire.** Si un jeton créé chez
    Payflux ne peut pas être débité via Solda et réciproquement, le reroutage en 15 minutes ne vaut que
    pour les nouveaux clients, pas pour la base récurrente — et B perd l''essentiel de ce qu''on lui achète.
    Vérification lundi (action 1). Si la réponse est négative, la répartition se fera par cohorte de clients
    et la montée en charge sera **plus lente, pas plus rapide**.


    ## 7. Lundi 17 août


    1. **Paiement / CTO** — confirmer sous 5 jours que les 2,1 M de jetons sont en jetons réseau ou dans
    un coffre indépendant du prestataire. *Condition de tout le plan.*

    2. **Achats / juridique** — rédiger la lettre de prolongation Solda cette semaine, envoi au plus tard
    le 30 septembre, butoir interne 8 octobre (contractuel : 15). Rappel : la prolongation ne va pas au-delà
    du 28 février — nous ne pouvons pas nous en servir deux fois.

    3. **DAF + ops** — négocier avec Payflux **avant** la signature du 4 septembre : engagement contractuel
    ≤ 0,55 % d''échec mesuré sur notre trafic, crédit indexé sur le chiffre d''affaires, prise en charge
    par Payflux de deux mois de double run. Contrepartie : référence publique et engagement 24 mois confirmé.
    C''est leur propre chiffre — leur refus de le contractualiser serait en soi une information.

    4. **Ops** — obtenir les données brutes du pilote (mix récurrent / 3-D Secure / international, volumes,
    comportement en pointe). Si le marchand n''est pas comparable sur le mix, le dossier repart.

    5. **DAF** — confirmer sous 5 jours si les 310 k€ sont nets du double run, et le taux de marge de
    contribution : sans lui nous raisonnons en GMV exposé, pas en résultat.


    *Hypothèses déclarées : volume vendredi noir estimé à 3× un jour normal (non fourni au dossier) ;
    310 k€ lus comme nets du double run ; part des échecs réellement perdue après relance non fournie
    — l''exposition est donc exprimée en GMV, pas en marge.*


    ---


    Trois points valent d''être signalés hors note :


    - **Le vrai butoir n''est pas le 30 novembre, c''est le 15 octobre.** Ne pas notifier Solda est un
    acte irréversible par omission qui ferme le repli sans que personne ait voté pour.

    - **Le calendrier n''est pas décoratif.** Signer le 4 septembre plutôt qu''en août est ce qui place
    la fenêtre de sortie gratuite (90 jours → 3 décembre) par-dessus le vendredi noir. Signer trop tôt
    gaspille l''option.

    - **La question des jetons peut invalider le plan.** Si les empreintes ne sont pas portables entre
    prestataires, la promesse « reroutage en 15 minutes » ne couvre que les nouveaux clients — c''est
    la seule vérification qui doit partir lundi matin avant tout le reste.


    Dis-moi si tu veux que je réécrive la note en supposant un fichier accessible, ou que je l''ajuste
    (format PDF/slide, ton plus court, version 1 page stricte).

    '
