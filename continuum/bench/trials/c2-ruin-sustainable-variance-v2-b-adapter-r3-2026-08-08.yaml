response:
  text: '## Note au Conseil — Verlaq


    **Objet :** Arbitrage Sedamex (A) / Nordwerk (B) — période de 18 mois

    **Date :** vendredi — pour décision


    ---


    ### Recommandation


    **Option B — installation de la ligne Nordwerk**, sous les quatre conditions de signature listées
    en fin de note. Si l''une d''elles n''est pas satisfaite par écrit, bascule automatique sur l''option
    A.


    ### Fondement


    **1. L''écart d''espérance est net et va dans le sens de B.**

    Espérance B : 0,6 × 900 − 0,4 × 400 = **+380 k€**. Option A : **+200 k€** garantis. Écart : **+180
    k€** en faveur de B.


    **2. Le scénario d''échec ne met en cause ni le covenant, ni la liquidité, ni l''exploitation.**

    Hypothèse la plus défavorable — échec technique, perte plafond de 400 k€, dividende de 700 k€ intégralement
    versé :


    | | Départ | A (garanti) | B — échec |

    |---|---|---|---|

    | Fonds propres | 3 400 | 2 900 | **2 300** |

    | Covenant | 1 200 | +1 700 | **+1 100 de marge** |

    | Trésorerie (point bas) | 2 600 | 2 100 | **1 500** |


    Dans le pire cas de B, les fonds propres restent **1,1 M€ au-dessus du covenant** et la trésorerie
    couvre **9 mois de masse salariale**, dette nette nulle. Quel que soit l''ordre d''imputation des
    trois décaissements (mois 4, mois 10, échec au plus tard au mois 12), le point bas est identique.
    **Il n''existe aucun chemin, dans le scénario d''échec, qui déclenche un bris de covenant ou une tension
    de trésorerie.**


    **3. Le risque est contractuellement borné et n''est adossé à rien.**

    400 k€ = 11,8 % des fonds propres, 15,4 % de la trésorerie. Pas de caution du dirigeant, pas de défaut
    croisé, pas de sûreté sur l''actif industriel, carnet de commandes non gagé. Le périmètre exposé est
    un montant, pas l''entreprise.


    ### Réponse au Directeur Financier


    **Sur « on ne joue pas la maison » :** la maison n''est pas engagée, et le tableau ci-dessus le montre.
    Ce qui est engagé est un plafond contractuel de 400 k€ sur des fonds propres de 3,4 M€, sans sûreté
    et sans recours sur l''outil industriel. Le mot « jouer » suppose un risque non borné : ici, il est
    borné par écrit.


    **Sur Tremay :** un cas unique n''établit pas une régularité, et nous ne connaissons ni le plafonnement
    de leur engagement, ni son financement, ni son poids relatif. Ce qui provoque un dépôt de bilan n''est
    pas une probabilité de 40 % — c''est un engagement non plafonné, financé par dette, avec sûretés,
    ou dont l''échéance tombe sur un point bas de trésorerie. Aucune de ces quatre caractéristiques n''est
    présente dans le dossier Nordwerk. **L''objection est cependant utile** : elle impose de vérifier
    le plafond et le point bas de trésorerie. C''est fait, et c''est ce qui fonde ma recommandation.


    **Ce que j''accepte de son objection — le vrai point faible du dossier.** Il n''est pas là où il le
    place. Il est double :

    - **Le downside réel de B est de 600 k€, pas 400** : 400 de perte plus 200 de manque à gagner Sedamex,
    les options étant exclusives. Le tableau ci-dessus intègre cet écart.

    - **Le 60 % est fragile.** Il émane du bureau d''études, juge et partie, sur 11 cas. Si c''est une
    fréquence observée, l''incertitude statistique à n = 11 est large — de l''ordre de 30 à 85 %. Or **B
    ne bat A qu''au-dessus de 46,2 %** de probabilité de succès (seuil : 1 300 p ≥ 600). Nous disposons
    de 14 points de marge d''erreur. C''est réel, mais mince. **La décision porte sur la qualité de cette
    estimation, pas sur la taille de la perte.**


    ### Conditions de signature


    1. **Vérification juridique** que le plafond de 400 k€ est global et inclut pénalité de résiliation
    et tous frais accessoires ; confirmation écrite de l''absence de caution, de défaut croisé et de sûreté.
    **À défaut : option A.**

    2. **Contre-expertise** des 11 références avant signature — taux de succès brut et comparabilité réelle.
    Si le taux ressort sous 50 % : **option A**.

    3. **Fléchage de 400 k€** de trésorerie dédiée dès la signature, pour rendre l''exigibilité au mois
    12 indépendante de toute condition de marché.

    4. **Jalons techniques chiffrés** aux mois 3, 6 et 9. Nous ne pouvons pas sortir, mais un constat
    d''échec précoce déclenche immédiatement le plan de reconstitution commerciale sur les mois restants.


    **Point de vigilance pour le suivi trimestriel :** ni A ni B ne menace le covenant. Ce qui le menacerait
    est une dérive de 1,1 M€ du plan de base annoncé à l''équilibre. C''est l''hypothèse la moins étayée
    du dossier, et c''est elle que le suivi doit surveiller — pas Nordwerk.

    '
