response:
  text: '# NOTE DE DIRECTION — DOSSIER DISTRIBUTEUR D


    **De :** Direction générale

    **À :** Comité de direction (DAF, Directeur commercial, Directeur industriel, DRH)

    **Date :** 8 août 2026

    **Objet :** Contrat d''exclusivité D — décision, mandat d''exécution, plan de repli

    **Statut :** Décision prise. Cette note est exécutoire, pas consultative.


    ---


    ## 1. Décision


    **Nous ne signons pas le contrat d''exclusivité tel que proposé.** J''envoie ce jour, sous ma signature,
    une contre-proposition écrite à D (§3). Le comité l''exécute, ne la modifie pas, et ne dispose d''aucune
    marge d''interprétation au-delà de la grille du §4.


    Je prends cette décision seul et j''en assume seul les conséquences, y compris le déréférencement
    de quatre références au comité d''achat du 20 août. Aucun membre du comité n''aura à porter cet arbitrage.


    ## 2. Pourquoi — le calcul, pas l''opinion


    La remise de 9 % porte sur le prix de cession. À 31 % de marge brute, elle ne prélève pas 9 % de la
    marge : elle en prélève 29 %.


    | Scénario sur le canal D | CA net | Marge brute | Écart |

    |---|---|---|---|

    | Aujourd''hui | 14,9 M€ | 4,62 M€ | — |

    | −9 % prix, volume inchangé | 13,6 M€ | 3,28 M€ | **−1,34 M€** |

    | −9 % prix, **+18 % volume tenu** | 16,0 M€ | 3,87 M€ | **−0,75 M€** |


    **Le volume promis ne compense pas la remise.** Il faudrait +41 % de volume pour revenir à la marge
    d''aujourd''hui. On nous en propose +18 %, et seulement la première année.


    Trois points structurels, plus décisifs que ces chiffres :


    **a) Le contrat est asymétrique sur toute sa durée.** Nous nous engageons fermement sur 36 mois (exclusivité
    + pénalité de 1,2 M€). D s''engage fermement sur 12 mois. Les années 2 et 3, l''engagement est « indicatif
    » : le scénario contractuellement autorisé est un retour au volume de base au prix réduit, soit −1,34
    M€ de marge par an. Perte cumulée probable sur 3 ans : **−3,4 M€**, à comparer à 7,44 M€ de marge
    brute totale annuelle.


    **b) Le T2 nous a déjà donné la réponse.** D a réduit ses commandes de 11 % sans préavis alors qu''il
    n''était engagé sur rien. Le contrat ne change pas cela : il ne comporte aucun préavis de déréférencement,
    aucun engagement ferme après 12 mois. Nous achèterions une protection qui n''existe pas dans le texte.


    **c) Le contrat achète du temps en supprimant l''usage de ce temps.** L''argument de signature — «
    sécuriser la charge d''usine pendant qu''on diversifie » — est contredit par la clause d''exclusivité,
    qui interdit précisément de diversifier pendant 36 mois. Elle stérilise la centrale régionale (3,5
    M€, ~1,08 M€ de marge/an) et la marketplace (+6 points de marge, 0,4 à 2,2 M€). Sortir coûte 1,2 M€.
    Nous serions à 62 % de dépendance, sans alternative légale, face à un acheteur qui saurait qu''aucune
    n''est possible. C''est la position de négociation la plus faible que nous puissions occuper en 2029.


    **L''argument inverse, énoncé honnêtement :** si D déréférence quatre références sur huit et poursuit
    sa décrue, la perte peut dépasser 3 M€ de CA dès l''automne ; nos 2,1 M€ de trésorerie couvrent trois
    mois ; Redon passe en chômage partiel. C''est réel et c''est le risque que je choisis. Je le choisis
    parce que le contrat conduit au même point douze à trente-six mois plus tard, avec une marge amputée,
    1,2 M€ de pénalité pour en sortir, et aucun canal alternatif construit entre-temps. Un choc dont on
    se relève vaut mieux qu''un adossement dont on ne sort pas.


    Enfin : les +18 % de volume exigent d''avancer matières et main-d''œuvre sur des produits payés 9
    % moins cher, avec 2,1 M€ de trésorerie. Le contrat crée lui-même une tension de cash dès le premier
    trimestre.


    ## 3. Ce qui est envoyé à D ce jour (sous ma signature)


    Contre-proposition, en une page, ton coopératif, sans ultimatum :


    1. **Remise indexée au volume réellement livré**, non promise : 3 % jusqu''au volume 2025 ; 6 % au-delà
    de +20 % ; 9 % au-delà de +41 %. Réglée en fin de période sur volumes constatés. Nous partageons la
    baisse de prix quand le volume la finance.

    2. **Durée : 12 mois**, reconductible par accord exprès.

    3. **Exclusivité limitée au circuit GMS France.** La centrale d''achat régionale et la vente en ligne
    directe sont explicitement hors périmètre.

    4. **Préavis de déréférencement : 6 mois**, sur les huit références.

    5. **Pénalité de sortie symétrique** ou supprimée de part et d''autre.

    6. **Engagement ferme de volume plancher** si D veut une exclusivité de circuit.


    Message d''accompagnement : nous confirmons notre volonté de rester leur premier fournisseur sur la
    catégorie, nous sommes disponibles pour un ajustement paramétrique, aucune décision d''exclusivité
    pluriannuelle ne sera prise avant le 2 septembre.


    ## 4. Mandat du comité — limites strictes


    **La délégation de signature est retirée sur ce dossier pour toute la durée de mon absence.** Aucun
    contrat, avenant, lettre d''intention, courriel d''accord de principe ou engagement verbal ne peut
    être donné à D. Cette restriction est absolue et n''est levée par aucune circonstance, y compris l''expiration
    de l''offre.


    **Seule exception :** si D répond par écrit en acceptant intégralement les six points du §3, sans
    réserve, sans modification et sans clause ajoutée, le DAF et le Directeur commercial signent conjointement.
    Toute variation, même mineure, même présentée comme rédactionnelle, sort de la grille : la réponse
    est alors « nous examinerons cela au retour du directeur général, après le 2 septembre ». Vous n''avez
    pas à juger si une variation est acceptable. Elle ne l''est pas.


    **Il n''y a pas de vote sur ce dossier.** Le désaccord écrit entre le DAF et le Directeur commercial
    est enregistré et sans objet : la décision est prise. Le Directeur industriel pilote l''exécution
    opérationnelle de la note et me remet un compte rendu écrit à mon retour.


    **Si l''offre est retirée et les quatre références déréférencées le 20 août :** c''est le scénario
    prévu. Personne n''a à le rattraper. Vous déclenchez le §6.


    ## 5. Visite de l''acheteur de D


    Elle a lieu. Elle est encadrée :


    - **Deux participants, pas le comité :** le Directeur commercial et le Directeur industriel. Le DAF
    n''y assiste pas — la division du comité est ce que cette visite vient chercher, et elle passe par
    la ligne financière.

    - **Mandat d''écoute uniquement.** Formule unique à toute demande de position : « Le directeur général
    a arrêté sa position par écrit avant son départ ; nous transmettons vos éléments. » Aucun chiffre
    interne, aucun commentaire sur notre trésorerie, notre plan de charge, l''avancement de la centrale
    régionale ou de la marketplace, aucune indication sur nos échéances internes.

    - **Aucune réunion en tête-à-tête** avec un membre du comité, aucun déjeuner, aucun échange téléphonique
    bilatéral. Tout passe par le canal à deux.

    - **Compte rendu écrit sous 24 h**, diffusé à tout le comité, y compris ce qui a été suggéré hors
    ordre du jour.

    - Un acheteur qui avance un comité, impose huit jours et demande à plaider devant un comité dont il
    sait la division travaille sur le calendrier, pas sur le fond. Ne lui rendez pas le calendrier.


    ## 6. Plan de repli — à déclencher sans attendre le 20 août


    Ces actions démarrent **lundi**, pas après la réponse de D. Nous n''avons pas d''exclusivité : c''est
    aujourd''hui, et seulement aujourd''hui, que cette liberté a une valeur.


    | # | Action | Responsable | Échéance |

    |---|---|---|---|

    | 1 | Ouvrir la marketplace sur les 4 références menacées, en priorité. Seul levier à effet sous 60
    jours. | Dir. commercial | 22 août |

    | 2 | Centrale régionale : demander une décision partielle ou un pilote sur 2 références, calé sur
    septembre au lieu de janvier. | Dir. commercial | 20 août |

    | 3 | Négocier une ligne de crédit court terme de 1,5 M€ **maintenant**, sur nos comptes actuels.
    Une ligne se négocie avant la difficulté, pas pendant. | DAF | 29 août |

    | 4 | Chiffrer le plan de charge Redon à 4, 8 et 12 semaines dans l''hypothèse « 4 références perdues
    », avec le point de bascule sous 70 %. | Dir. industriel | 18 août |

    | 5 | Préparer le dossier de chômage partiel — préparer n''est pas déclencher. Ne pas le déposer sans
    franchissement du seuil du §7. | DRH + Dir. industriel | 25 août |

    | 6 | Gel des investissements non engagés et des recrutements non signés jusqu''à mon retour. | DAF
    | immédiat |

    | 7 | Prospecter 3 distributeurs régionaux hors circuit D. | Dir. commercial | continu |


    **Communication interne, Redon :** un message le 21 août, quelle que soit l''issue. Contenu : nous
    avons refusé un contrat qui aurait réduit durablement nos marges, nous ouvrons de nouveaux canaux,
    il peut y avoir des semaines creuses cet automne, le comité informera chaque semaine. Rien de plus,
    rien qui ne soit vrai. Le silence, dans une usine, se remplit tout seul.


    ## 7. Seuils et point d''arrêt observables


    Vous n''avez pas à interpréter la situation. Vous mesurez :


    - **Trésorerie < 1,4 M€** ou **plan de charge Redon projeté < 75 % à 8 semaines** → le DAF active
    la ligne de crédit et le dossier de chômage partiel passe en dépôt. Décision mécanique, sans débat.

    - **Trésorerie < 1,0 M€** → convocation du conseil, mes coordonnées de crise via le chef de chantier
    Maroc (à n''utiliser que sur ce seul déclencheur).

    - **Ce qui prouverait que j''ai eu tort :** si D revient avec un engagement de volume ferme et symétrique
    sur 36 mois et une exclusivité limitée au circuit GMS, la signature devient le bon choix — c''est
    exactement pourquoi le §3 le lui propose. Si D refuse une exclusivité assortie d''un volume ferme,
    il aura lui-même démontré que ce contrat ne valait rien pour nous.


    ## 8. Un mot sur les 52 postes


    Le chômage partiel est un dispositif temporaire et réversible. Le contrat, lui, nous engage 36 mois
    avec 1,2 M€ pour en sortir, et ne comporte aucune clause qui protège la charge de Redon au-delà de
    douze mois. Protéger l''emploi ici, ce n''est pas éviter un trimestre difficile : c''est refuser de
    vendre trois ans d''indépendance commerciale contre un an de volume promis.


    Je rentre le 2 septembre. Vous n''aurez rien à arbitrer d''ici là.


    *[Signature — Direction générale]*


    ---


    **Deux points de méthode**, hors note :


    Le catalogue de stations de mesure joint en annexe n''a aucun rapport avec ce dossier — je l''ai écarté.
    S''il devait en faire partie, dites-moi lequel des deux sujets vous vouliez traiter.


    Le calcul de marge du §2 suppose que les 31 % s''appliquent uniformément au canal D et que la structure
    de coûts est essentiellement variable. Si le mix produit chez D est significativement plus ou moins
    margé, ou si une part importante des coûts est fixe et déjà absorbée, le seuil de +41 % bouge — c''est
    le seul chiffre de la note que je referais vérifier par le DAF avant envoi. Les trois arguments structurels
    (asymétrie 36/12 mois, absence de préavis, stérilisation des alternatives) tiennent indépendamment
    de ce calcul.

    '
