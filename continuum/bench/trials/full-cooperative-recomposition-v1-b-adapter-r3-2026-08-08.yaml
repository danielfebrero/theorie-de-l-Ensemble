response:
  text: '## Note de position — présidence de la CLE du bassin de la Vèze


    *Séance du jeudi. Document préparatoire.*


    ---


    ### 1. Le fichier ne peut pas être voté en l''état : un terme de 100 à 130 L/s n''est pas expliqué


    Avant toute répartition, une vérification arithmétique élémentaire.


    La régie déclare 150 L/s pour 9 200 habitants. Cela représente **1 400 L par habitant et par jour**.
    Le besoin domestique courant est de 130 à 150 L/hab/j, soit **≈ 16 L/s** pour Ferney. L''EHPAD, en
    débit, est négligeable (110 lits ≈ 0,4 L/s). En ajoutant généreusement les usages municipaux, scolaires,
    commerciaux et la défense incendie, on atteint 24 L/s de besoin livré. Même avec un rendement de réseau
    médiocre de 60 %, le prélèvement justifié serait de **~40 L/s** ; avec un rendement catastrophique
    de 30 %, **~80 L/s**.


    Pour que 150 L/s soit nécessaire, il faudrait un rendement de réseau de l''ordre de 16 %. Ce n''est
    pas crédible pour un réseau en fonctionnement.


    Je n''accuse pas la régie. Trois explications sont parfaitement légitimes : le périmètre desservi
    dépasse Ferney (syndicat, communes associées) ; un usage industriel ou agro-alimentaire majeur est
    raccordé ; le chiffre est une autorisation nominale et non un prélèvement réel. Mais dans les trois
    cas, **c''est le terme décisif du dossier** : le déficit annoncé est de 160 L/s, et l''écart inexpliqué
    est du même ordre de grandeur.


    Symétriquement, j''ai vérifié la demande agricole : 240 L/s pour 620 ha = **0,387 L/s/ha**, soit environ
    33 m³/ha/jour, contre une ETM de pointe de 50 à 70 m³/ha/jour en maraîchage estival. Leur demande
    est déjà un régime déficitaire, cohérente avec les quotas de dimensionnement usuels. **Le chiffre
    des maraîchers tient. Celui de la régie ne se reconstitue pas.** Je le dirai ainsi jeudi, parce que
    la pression que j''exerce sur chaque partie doit être proportionnée à la solidité de son chiffre,
    et non à sa capacité de nuisance en séance.


    **Décision n°1 :** audit contradictoire du prélèvement de la régie sous 72 heures — périmètre desservi,
    volumes facturés, rendement, comptage en entrée de réseau. Financé par le fonds. Aucune répartition
    définitive avant ce retour.


    ---


    ### 2. Ce que je ne mets pas au vote


    **Le débit réservé de 180 L/s.** Non par préférence pour la truite, mais par asymétrie d''irréversibilité
    : la perte agricole est monétaire, saisonnière et partiellement indemnisable ; la perte du peuplement
    et des deux frayères est qualifiée non reconstituable à l''échelle d''une décennie. Face à une incertitude,
    on prend la perte récupérable.


    **L''alimentation en eau potable.** Priorité inscrite à l''article L.211-1 du code de l''environnement.
    Non négociable dans son *service*. Négociable dans son *prélèvement* — ce n''est pas la même chose,
    et toute la suite tient dans cette distinction.


    **Ce qui reste discutable :** la répartition du solde, le calendrier, la concentration des surfaces,
    l''emploi des 600 000 €.


    ---


    ### 3. Deux données manquantes qui pèsent plus que le débat de jeudi


    **Le stock du barrage.** Le dossier donne le débit *entrant* et ne dit rien du volume stocké. Un barrage
    découple le prélèvement de l''apport. Ordre de grandeur : **100 000 m³ mobilisables = 21 L/s sur huit
    semaines, ou 55 L/s sur trois semaines.** C''est potentiellement le premier levier du dossier, et
    il est absent du fichier. Réserve expresse : le stock est d''abord la sécurité potable de septembre.
    Seul son excédent au-dessus d''un plancher de sécurité défini avec la régie est mobilisable — et le
    mobiliser sur trois semaines en pariant sur la pluie est un emprunt, pas une ressource.


    **La fiabilité du 410 L/s.** Une station unique, étalonnée en 2023. C''est en bas de gamme que la
    courbe de tarage est la plus fragile : les incertitudes de 10 à 20 % y sont courantes, et le lit a
    pu évoluer. Deux conséquences : jaugeage indépendant sous 72 h, et surtout **contrôle du débit réservé
    mesuré à l''aval, jamais déduit par soustraction**. Tant que 180 L/s est un calcul et non une mesure,
    il n''est pas garanti.


    ---


    ### 4. Répartition proposée


    | | Actuel | Semaine 1 | Semaine 3 |

    |---|---|---|---|

    | Débit réservé (plancher, mesuré aval) | 180 | **180** | **180** |

    | Potable — prélèvement | 150 | 150 | **135** puis selon audit |

    | Irrigation | 240 demandés | **80** | **95** |


    *Scénario A — le prélèvement de 150 L/s est confirmé justifié.* Les maraîchers reçoivent 80 à 95 L/s,
    soit 33 à 40 % de leur demande.


    *Scénario B — l''audit révèle 40 à 60 L/s de pertes ou d''usages non prioritaires.* L''irrigation
    monte à **140 L/s, soit 58 %** de la demande. La perte agricole passe d''environ 4,1 M€ à moins de
    1,8 M€.


    **L''écart entre A et B vaut plusieurs fois le fonds de 600 000 €.** C''est pourquoi le premier acte
    n''est pas un vote mais un audit.


    La réduction potable ne porte que sur les pertes et les usages non essentiels — jamais sur les volumes
    livrés aux foyers ni à l''EHPAD. Elle est conditionnée à ce que la réserve tampon *augmente*, jamais
    qu''elle diminue : quatre jours est une marge trop mince pour un mois d''août.


    ---


    ### 5. La décision qui appartient aux maraîchers, et à eux seuls


    C''est le point central, et c''est probablement pourquoi ils ont quitté la salle.


    90 L/s répartis uniformément sur 620 ha = tout le monde à 37 % du besoin = perte quasi totale sur
    la quasi-totalité des surfaces = **les 4,1 M€ quand même**.

    90 L/s concentrés à plein besoin = **≈ 235 hectares récoltés**, soit **1,55 M€ sauvés**. En scénario
    B, 140 L/s = **360 ha, ≈ 2,4 M€ sauvés**.


    **La concentration vaut entre 1,5 et 2,4 M€. C''est le plus gros levier du dossier, plus important
    que le fonds départemental, et il n''appartient pas à la commission.** La CLE attribue un volume ;
    elle ne désigne pas qui sème et qui renonce. Ce serait illégitime et ce serait ingérable.


    Aux 34 exploitations : vous disposez jusqu''à lundi pour produire une règle de répartition collective.
    À défaut, l''allocation est uniforme au prorata de la surface — et vous savez ce que cela produit.
    Ce n''est pas une sanction, c''est le seul défaut honnête possible.


    Pour que cette décision soit tenable, **l''indemnisation va à ceux qui renoncent**, pas à ceux qui
    irriguent. Renoncer devient la position compensée, non la position perdante.


    ---


    ### 6. Emploi des 600 000 €


    | Poste | Montant |

    |---|---|

    | Compensation des renonciations (barème public, sur perte **nette**) | 320 k€ |

    | Audit, sectorisation, recherche de fuites et réparations d''urgence — réseau Ferney | 120 k€ |

    | Sécurisation potable : interconnexion provisoire, citernes, contrat eau embouteillée EHPAD | 60
    k€ |

    | Métrologie : rejaugeage, station de contrôle aval, sondes de température télétransmises | 40 k€
    |

    | Expertise hydrobiologique de terrain et micro-travaux de protection des frayères | 40 k€ |

    | Réserve d''ajustement | 20 k€ |


    Je le dis sans détour aux maraîchers : **320 k€ contre 4,1 M€, c''est 8 %.** Ce fonds n''indemnise
    pas la perte, il rend la décision de concentration possible. La vraie indemnisation passe par la reconnaissance
    de calamité et le régime assurance récolte / ISN — dossier à ouvrir lundi avec la DDT et la chambre
    d''agriculture, avec la CLE comme producteur des pièces hydrologiques. Cela prendra des mois. Ne pas
    l''ouvrir maintenant, c''est le perdre.


    Sur la recherche de fuites : c''est le seul poste qui achète de l''eau à environ 4 000 € le L/s, définitivement.
    Le meilleur rendement du fonds, et de loin.


    ---


    ### 7. Conditions d''arrêt — automatiques, publiées quotidiennement


    - Débit aval < 180 L/s deux jours consécutifs → **suspension immédiate des prélèvements d''irrigation**
    jusqu''à rétablissement.

    - Réserve tampon de Ferney < 3 jours → retour à 150 L/s et suspension de l''irrigation.

    - Rejaugeage donnant un apport réel < 380 L/s → plan rouvert sous 48 h, l''irrigation ajustée en premier.

    - Seuil thermique dans le tronçon écologique, à fixer par l''hydrobiologiste sous 8 jours. **En étiage
    d''août, le facteur létal pour la truite est souvent la température, pas le volume.** 180 L/s d''eau
    chaude ne sauve pas nécessairement le peuplement : le débit n''est pas une garantie suffisante, et
    il faut le dire.

    - CLE hebdomadaire pour la durée de l''épisode. Sortie de crise : apport > 600 L/s cinq jours consécutifs.


    ---


    ### 8. L''objection la plus forte contre ma position


    Elle sera formulée jeudi, et je préfère la porter moi-même à sa pleine force : **le débit réservé
    coûte cher.** À 0,387 L/s/ha, les 180 L/s représentent 465 hectares, soit environ 3,1 M€ de production.
    La contrainte écologique n''est pas gratuite : elle est, en volume, du même ordre que le déficit.
    Prétendre le contraire serait insultant pour des gens qui perdent leur récolte.


    Ma réponse tient en deux points.


    D''abord, ce n''est pas le plancher légal qui prend l''eau des maraîchers. Entre 180 L/s et l''effondrement
    documenté, il n''y a qu''une marge étroite : passer à 160 L/s libère 20 L/s, soit **52 hectares et
    environ 340 000 € de production**. On détruirait une décennie de rivière pour 340 k€ — et on perdrait
    quand même 3,7 M€. L''arbitrage n''est pas serré. **Le vrai gisement est à la régie, et il vaut six
    fois plus.** C''est là que les maraîchers doivent porter le fer, à la table, pas dans le couloir.


    Ensuite, on ne troque pas une décennie contre une saison, même en raisonnement strictement économique,
    dès qu''on dépasse l''horizon de septembre. Et ce n''est pas à moi d''en décider : c''est un arrêté
    préfectoral fondé sur un rapport daté et circonstancié — qui documente l''assèchement de frayères,
    un phénomène de seuil, et non un simple dixième du module.


    Je demande cependant une contre-expertise de terrain sous 8 jours : si le facteur limitant est localisé
    sur quelques points critiques plutôt que sur le débit moyen, et si 20 k€ de travaux ciblés sécurisent
    les frayères à 165 L/s, je prends ces 15 L/s — sur preuve, pas sous la pression de jeudi.


    ---


    ### 9. Ce que je dis à chacun


    **À la régie :** votre dotation sanitaire est garantie par écrit dès ce soir, sans condition, avec
    le dispositif de secours financé. En contrepartie, les 150 L/s sont documentés sous 72 heures. Si
    le chiffre est justifié, je le dirai publiquement et les maraîchers devront l''accepter. Si un tiers
    relève des pertes, alors c''est vous qui aurez trouvé l''eau que tout le monde cherche. Votre refus
    de discuter porte aujourd''hui sur le seul chiffre susceptible de résoudre la crise ; il n''est pas
    tenable une semaine de plus.


    **Aux maraîchers :** la commission ne décide pas de votre perte, elle décide d''un volume. La répartition
    de ce volume, qui vaut 1,5 à 2,4 M€, vous appartient — délai lundi. Et votre adversaire n''est pas
    la truite.


    **Au titre du milieu :** 180 L/s est un plancher mesuré à l''aval, publié chaque jour, avec suspension
    automatique de l''irrigation en cas de franchissement. Je veux en échange l''expertise de terrain
    sous 8 jours, y compris le volet thermique.


    **À la presse :** l''opposition n''est pas entre les paysans et les robinets. Elle est entre trois
    usages et une rivière — et le plus gros volume mobilisable du dossier est peut-être dans un réseau
    qui fuit.


    ---


    *Réserve méthodologique : les paramètres techniques que je n''ai pas dans le dossier — rendement du
    réseau de Ferney, périmètre réel desservi, volume stocké à Sarcelle, coûts unitaires de conversion
    en goutte-à-goutte — sont ici des ordres de grandeur destinés à cadrer la décision. Ils doivent être
    confirmés par l''audit avant toute délibération définitive. Les scénarios A et B sont construits précisément
    pour que le plan reste valide quelle que soit la réponse.*

    '
