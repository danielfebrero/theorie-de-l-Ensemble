  text: '## Note


    Le catalogue de stations de mesure fourni en annexe n''a aucun rapport avec ce dossier ; je ne l''ai
    pas utilisé.


    Voici la note.


    ---


    # Prestataire de paiement — décision de bascule


    **À :** Présidente du comité de direction · **De :** Direction des opérations · **Date :** 8 août
    2026 · **Décision demandée :** vendredi 14 août


    ## Recommandation


    **Option B — bascule progressive — mais démarrée le 21 septembre et non le 3 novembre.** La migration
    vers Payflux est bonne (500 k€/an dès l''année 2, sur un écart de qualité qui ne coûte que ~35 k€
    de marge par an). Ce qui ne va pas dans le dossier, c''est le calendrier : **A comme B placent l''étape
    irréversible au pire moment de l''année.** Nous avons 16 semaines devant nous avant le 30 novembre.
    Ni A ni B ne les utilisent.


    ## Pourquoi pas A


    Le compte Solda reste ouvert jusqu''au 30 novembre : le Black Friday (27 nov.) est donc réversible
    sous A. **Le problème est le 1er décembre.** À cette date, sous A, nous entrons dans le plus gros
    mois de l''année (~30 M€ de GMV) avec un Payflux qui a 4 semaines de vie, dont 3 dans sa fenêtre d''instabilité
    documentée, et **sans aucun retour possible** : rouvrir Solda = 6 semaines + recollecte des empreintes
    auprès de 2,1 M de porteurs. Ce n''est pas un incident à quelques centaines de milliers d''euros,
    c''est une perte de points de conversion sur toute la base de cartes enregistrées.


    A achète 280 k€ d''économie supplémentaire en vendant la seule chose qui compte : la capacité de revenir
    en arrière pendant le pic.


    ## Les chiffres


    - 18 000 txn/j × 42 € = **756 k€ de GMV/jour**, 276 M€/an. **0,1 pt d''échec = 276 k€ de GMV/an.**

    - Fenêtre d''instabilité Payflux (3 sem. à +0,9 pt) : **143 k€ de GMV à 100 % du trafic en novembre**
    ; **~15 k€ si elle est absorbée à 10–25 % en septembre.**

    - Black Friday à ×4 ≈ 3,0 M€ de GMV sur la journée : **1 h d''incident = 126 k€.** Le SLA 99,9 % autorise
    43 min/mois, soit ~90 k€ de GMV en décembre — contractuellement conforme, et déjà coûteux.


    | Poste (12 mois, déc. 26 – nov. 27) | A | **B accéléré** |

    |---|---|---|

    | Payflux | 900 k€ | 900 k€ |

    | Prolongation Solda | 0 | **130 k€** (déc. seul, scénario central) |

    | Double run (21 sept. → 31 déc.) | 0 | **150 k€** |

    | **Économie vs renouvellement (1,4 M€)** | **500 k€** | **220 k€** (90 k€ si janvier ; −40 k€ si
    février) |

    | Réversible pendant le pic | non, à partir du 1er déc. | **oui, < 15 min** |

    | Engagement irréversible | 30 novembre | 31 décembre (butoir 28 février) |

    | Année 2 et suivantes | 500 k€/an | 500 k€/an |


    **Prime de réversibilité : ~280 k€, une seule fois.**


    ## Calendrier


    | Date | Étape |

    |---|---|

    | Lun 17 août | Lettre d''intention Payflux, démarrage intégration + **double tokenisation** (les
    2,1 M de jetons existent chez les deux avant tout basculement) |

    | **Ven 4 sept.** | Signature Payflux — **date choisie pour que la fenêtre de sortie sans pénalité
    expire le 3 décembre**, soit après le verdict Black Friday |

    | Lun 21 sept. | 10 % du trafic |

    | Lun 5 oct. | 25 % |

    | Ven 9 oct. | Courrier Solda : prolongation mensuelle à partir du 1er déc. (**avant le 15 octobre,
    sans quoi tout le plan tombe**) |

    | Lun 19 oct. | 50 % |

    | **Lun 2 nov.** | **100 %** — Solda ouvert, trafic 0, bascule arrière armée |

    | 27–30 nov. | Black Friday / Cyber Monday à 100 % Payflux, **avec retour Solda en 15 min** |

    | Mer 2 déc. | Gate : verdict du pic **à l''intérieur de la fenêtre de sortie à 0 €** |

    | Décembre | Solda en secours (130 k€), trafic 0 |

    | 31 déc. | Migration finale des jetons + fermeture Solda. Report possible jusqu''au **28 février,
    butoir absolu** |


    ## Seuils de retour arrière (câblés sur le tableau de bord, alerte astreinte)


    - Échec Payflux **> 1,2 %** sur 3 relevés consécutifs (15 min) → **100 % Solda**

    - Écart Payflux − Solda **> +0,4 pt** sur 2 h glissantes → gel du palier, retour au palier précédent

    - Latence p95 **> 2× Solda** sur 30 min → 100 % Solda

    - Tout incident **> 15 min entre le 20 nov. et le 31 déc.** → 100 % Solda, gel jusqu''au 2 janvier

    - Passage au palier suivant : **10 jours consécutifs, échec ≤ 0,6 %, aucun incident > 15 min**


    ## Lundi 17 août


    1. **Lettre d''intention Payflux** et démarrage de l''intégration + double tokenisation — *DSI paiement*

    2. **Deux clauses non négociables avant signature** : (a) fenêtre de sortie sans pénalité couvrant
    le 30 novembre ; (b) engagement de performance mesuré chez Vireo (≤ 0,6 % hors pic, ≤ 1,0 % en pic)
    avec droit de sortie en cas de dépassement — *Juridique + DO*

    3. **Courrier Solda** rédigé et daté du 9 octobre : prolongation mensuelle résiliable à 30 jours,
    confirmation écrite du butoir 28 février — *Achats*

    4. **Runbook de bascule arrière** + test à blanc d''un retour 100 % Solda avant le 21 septembre —
    *Astreinte technique*

    5. **Un responsable unique de migration**, point hebdomadaire, chaque passage de palier documenté
    — *DO*


    ## Le meilleur argument contre cette note


    *« Vous payez 280 k€ pour assurer un risque qui a de bonnes chances de ne pas se produire, alors que
    Payflux est structurellement moins bon (0,5 % contre 0,4 %) : soit on renonce, soit on bascule franchement.
    »*


    Réponse : cet écart de 0,1 pt vaut 276 k€ de GMV, soit ~35 k€ de marge par an, contre 500 k€ d''économie
    — **la migration est justifiée, seul son calendrier est en cause.** La prime se paie une fois ; l''erreur
    de calendrier se paierait sur 2,1 M de cartes enregistrées.


    **Ce que ce plan ne résout pas, et qu''il faut assumer :** au 1er mars, Solda est fermé et il n''y
    a plus de filet, quoi qu''il arrive. Ce plan ne supprime pas ce risque — il fait en sorte que tout
    ce que nous devons apprendre sur Payflux soit appris en novembre et décembre, pendant que le retour
    arrière coûte encore 15 minutes.

    '
