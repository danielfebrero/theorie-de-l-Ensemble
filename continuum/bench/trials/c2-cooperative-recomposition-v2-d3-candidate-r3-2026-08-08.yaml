response:
  text: '# Position de la présidence — répartition de la ressource du bassin de la Vèze

    **Séance du jeudi — document préparatoire**


    ---


    ## 1. Ce que je propose


    Un **volume global par usage** arrêté jeudi, immédiatement exécutoire, et des **quotas individuels
    armés à J+10**, dont l''accès est conditionné à la déclaration parcellaire. Ce ne sont pas deux options
    concurrentes : le volume global seul, sans compteurs ni clé de répartition, n''est pas une allocation
    — c''est un coup de pistolet de départ, et les six exploitations qui détiennent 300 des 620 hectares
    gagneront la course aux pompes.


    | Usage | Demande | J0–J7 | J8 et suivants |

    |---|---|---|---|

    | Débit réservé (aval) | 180 | **190 au barrage** | 190, puis 180 **mesurés à l''aval** |

    | Eau potable (régie) | 150 | **150** | besoin sanitaire + pertes vérifiées, **plancher garanti**
    |

    | Irrigation | 240 | **70** | 70 + chaque L/s libéré par l''audit réseau |

    | | 570 | 410 | 410 |


    Les 190 L/s au barrage ne sont pas un excès de prudence : l''arrêté fixe 180 **à l''aval**, et personne
    ne mesure l''aval. Entre le barrage et le point de contrôle, la retenue perd par évaporation et infiltration
    ce que nul n''a chiffré — de l''ordre de 3 à 5 L/s en août sur une retenue de quelques hectares. Laisser
    exactement 180 au barrage, c''est délivrer moins de 180 en bas. La marge disparaît le jour où la station
    aval mesure directement.


    ---


    ## 2. La contrainte qu''on ne peut pas déplacer


    Deux branches de ce dossier sont irrécupérables, et une seule ne l''est pas.


    Le rapport du 12 juin documente, sous 180 L/s, l''effondrement de la population et l''assèchement
    de deux frayères, **non reconstituables à l''échelle d''une décennie**. Une récolte perdue se replante
    en mars. Une frayère asséchée ne se replante pas. Cette asymétrie n''est pas un arbitrage moral, c''est
    la structure du problème : je n''ai pas le pouvoir d''arbitrer sous un seuil fixé par arrêté préfectoral,
    et je n''aurais pas la légitimité de le faire même si je l''avais.


    L''EHPAD de 110 lits et 4 jours de tampon constituent la seconde branche. Elle est garantie sans condition
    et sans discussion.


    **Le déficit ne se répartit donc pas sur trois usages. Il tombe sur celui dont la perte est réversible.**
    Je le dis ainsi, sans l''habiller : l''irrigation encaisse.


    ---


    ## 3. Mais je conteste que le déficit soit de 160 L/s


    C''est le point central de ce document, et il ne figure dans aucune des trois positions exprimées
    à la dernière séance.


    **150 L/s pour 9 200 habitants représente 12 960 m³/jour, soit 1 409 litres par habitant et par jour.**
    Une commune française de cette taille, industrie, bâtiments publics et pertes compris, se situe entre
    200 et 400 L/j/hab. Nous sommes à quatre à sept fois cette valeur. Trois hypothèses l''expliquent
    : la régie dessert au-delà de Ferney, elle alimente un gros client industriel, ou son rendement de
    réseau est très dégradé. Chacune change complètement la répartition. **Aucune n''a été produite devant
    la commission.**


    Je ne l''écris pas comme une accusation. Je l''écris parce que c''est le seul gisement de litres du
    dossier qui n''a jamais été ouvert, et parce que la régie a jusqu''ici obtenu 150 L/s sans avoir eu
    à les justifier.


    Le calcul qui rend cela concret pour tout le monde :


    > À 240 L/s sur 620 ha, la demande maraîchère correspond à **3,3 mm/jour** — soit déjà une irrigation
    déficitaire face à une ETP estivale de 5 à 6 mm/jour. **Cette demande n''est pas gonflée.** Je le
    dirai aux maraîchers jeudi.

    >

    > Et par conséquent : **chaque tranche de 10 L/s récupérée sur le réseau sauve 26 hectares** de culture
    à ration pleine.


    La presse écrit « les paysans ou les robinets ». La réalité arithmétique est que les fuites du réseau
    sont probablement le meilleur allié des maraîchers dans ce dossier, et que les 160 L/s manquants ne
    sont pas tous dans les champs.


    **Dispositif :** la régie conserve 150 L/s pendant sept jours — aucun litre d''irrigation n''est perdu
    à l''audit, puisque la dotation est maintenue pendant celui-ci. En contrepartie elle produit sous
    sept jours : volumes facturés par catégorie, rendement de réseau, mesures de débit nocturne sectorisées,
    index. À J+8 la dotation est fixée au besoin sanitaire augmenté des pertes incompressibles vérifiées,
    avec un plancher garanti par écrit qui ne descend jamais sous ce qui sécurise la population et l''EHPAD.
    **La régie obtient la garantie qu''elle exige. Elle l''obtient sur la fonction sanitaire, pas sur
    un historique de prélèvement.**


    ---


    ## 4. Comment se répartissent les 70 L/s d''irrigation


    70 L/s étalés sur 620 hectares font **0,98 mm/jour**. À ce niveau, on ne sauve rien : on répartit
    également la perte totale. Les mêmes 70 L/s concentrés sur **181 hectares à ration pleine** sauvent
    181 hectares.


    Je ne désignerai pas les parcelles à abandonner. Ce n''est pas ma compétence et ce serait la pire
    décision de ce dossier. La commission fixe l''enveloppe ; **un comité élu par les 34 exploitations
    propose la clé individuelle sous dix jours** ; la commission ratifie sauf violation du plancher. S''y
    ajoute la **transférabilité déclarée des quotas** entre exploitations — une exploitation en fin de
    cycle vaut mieux qu''elle cède son volume à un voisin en nouaison — plafonnée à 150 % du quota de
    base pour que les six grandes n''achètent pas les vingt-huit autres.


    La déclaration (parcelles, cultures, stades, index compteur) conditionne l''accès au quota individuel.
    Qui ne déclare pas relève d''un quota par défaut délibérément moins favorable. C''est ainsi que nous
    obtiendrons les données parcellaires que nous n''avons pas — en en faisant le prix de l''eau, pas
    l''objet d''une énième demande sans effet.


    **Sur les 4,1 M€ et les 90 emplois :** cette estimation est celle d''une partie, sans pièce, et elle
    repose sur un effet de seuil — « en dessous de 240, tout est perdu » — qui ne correspond à aucune
    réponse agronomique connue. La réponse à l''eau est continue et dépend du stade. Le chiffre qui déciderait
    vraiment — le volume sous lequel la perte devient disproportionnée, culture par culture — n''a jamais
    été produit. C''est exactement ce que la déclaration produira, et je pondérerai ce chiffre-là.


    ---


    ## 5. Le déclencheur de sortie remplace celui de 2022


    Le dispositif de 2022 a échoué le 9 août pour une raison identifiable : **48 heures de débit instantané
    mesurent une impulsion de ruissellement, pas une recharge de nappe.** L''orage a donné 520 L/s, les
    prélèvements ont repris intégralement le 11, le débit était à 340 quatre jours plus tard. La règle
    n''a pas été mal appliquée ; elle était mal construite.


    Nouvelle règle :


    - **Desserrage** uniquement si, sur **dix jours consécutifs** : moyenne glissante au barrage ≥ seuil,
    **et** débit mesuré à l''aval ≥ 180, **et** niveau piézométrique en hausse.

    - **Par paliers, un seul palier par fenêtre de dix jours. Jamais de levée totale.**

    - **Resserrage immédiat et automatique**, sous 24 heures, sans vote, dès qu''une moyenne journalière
    repasse sous le seuil.


    L''asymétrie est assumée : une erreur de resserrage coûte quelques jours d''irrigation, une erreur
    de desserrage coûte les frayères. Appliquée au 9 août, cette règle n''aurait rien levé du tout.


    ---


    ## 6. Les 600 000 € — quinze jours pour engager, donc décision jeudi


    600 000 € contre 4,1 M€ annoncés, c''est 15 %. Annoncer une indemnisation serait mentir. **Ces euros
    doivent produire des litres, pas compenser des pertes.**


    | Poste | Montant | Raison |

    |---|---|---|

    | Métrologie | ~80 k€ | Jaugeage contradictoire (station non étalonnée depuis 2023), station aval
    télétransmise, 3 piézomètres, compteurs télérelevés sur les 6 plus gros prélèvements |

    | Réseau régie | ~250 k€ | Sectorisation, campagne de recherche de fuites, réparations immédiates.
    **Seule ligne du budget qui crée de l''eau.** 10 points de rendement gagnés = ~15 L/s = ~39 ha sauvés
    |

    | Soutien ciblé | ~200 k€ | Priorité aux 28 exploitations détenant 320 ha et aux salaires saisonniers.
    **Explicitement pas au prorata de l''hectare**, qui enverrait la moitié à six exploitations |

    | Réserve | ~70 k€ | Non engagée, mobilisable sur les seuils de rupture ci-dessous |


    Les 80 k€ de métrologie conditionnent tout le reste : sans eux, chaque règle de ce document n''est
    qu''une déclaration. Toute la répartition repose sur une station unique, non étalonnée depuis trois
    ans, dont la courbe de tarage est précisément la plus incertaine à l''étiage. Une dérive de 10 % vaut
    41 L/s — quatre fois la marge que je propose.


    ---


    ## 7. Ce qui arrête tout (seuils observables, sans nouveau vote)


    - **< 300 L/s** en moyenne journalière, deux jours consécutifs → irrigation suspendue, hors goutte-à-goutte
    sur pérennes et pépinières. Seuil dérivé : 180 de réservé + ~110 de besoin sanitaire audité + marge.

    - **< 240 L/s** → situation d''urgence : saisine du préfet, interconnexion, citernage EHPAD. Sous
    ce niveau la question n''est plus la répartition mais l''alimentation de Ferney, et l''arbitrage sous
    le débit réservé n''appartient plus à cette commission.

    - **Tampon régie < 3 jours** → irrigation suspendue immédiatement, sans vote.

    - **Jaugeage révélant une surestimation ≥ 5 %** → toutes les dotations recalculées sous 48 h, l''irrigation
    absorbant la correction. **La dotation d''irrigation est provisoire à ce titre, et je le dirai explicitement
    pour que personne n''engage de dépense contre elle.**


    Aucune reprise n''est automatique après déclenchement.


    ---


    ## 8. Ce qui renverserait ma position


    - Un **jaugeage contradictoire montrant une sous-estimation ≥ 10 %** (débit réel ≥ 450 L/s) → révision
    immédiate à la hausse de l''irrigation.

    - Un **audit réseau établissant un rendement > 90 %** et un besoin sanitaire réellement voisin de
    150 L/s → le déficit est alors structurel et non redistribuable ; le dossier relève du préfet et d''un
    cadre dérogatoire, pas de cette commission.

    - Des **données de stades végétatifs** montrant qu''une fraction des 620 ha est à un stade critique
    où un volume modeste sauve une valeur disproportionnée → réallocation à l''intérieur de l''enveloppe.


    ---


    ## 9. Le contre-argument le plus fort contre ce que je propose


    *« Vous jouez la récolte sur une hypothèse relative aux pertes du réseau que vous n''avez pas vérifiée.
    Si l''audit revient à 145 L/s réellement nécessaires, vous aurez détruit 4,1 M€ et 90 emplois pour
    gagner une semaine de délai. Il fallait donner l''eau aux cultures maintenant — la seule échéance
    irréversible à court terme — et auditer ensuite. »*


    Il porte sur le calendrier, pas sur la direction. Sa prémisse même — l''échéance agronomique — est
    la raison pour laquelle l''audit est comprimé à sept jours et pour laquelle **la régie conserve 150
    L/s pendant sa durée** : aucun litre d''irrigation n''est immobilisé par l''audit. Ce que les maraîchers
    perdent la première semaine, ils le perdent de l''arithmétique 410 < 570, pas de la procédure.


    Sur le fond, je ne peux pas mettre en balance une estimation de 4,1 M€ produite par la partie qui
    la revendique, sans pièce et sur un effet de seuil invraisemblable, avec un rapport hydrobiologique
    daté et un tampon sanitaire de quatre jours, comme si ces trois éléments avaient le même statut probatoire.


    **Là où le contre-argument mord réellement** : il justifie de commander le jaugeage jeudi et non «
    sous quinzaine », et de fixer la dotation d''irrigation de la première semaine au maximum que les
    planchers autorisent, sans retenue supplémentaire. Je l''intègre.


    ---


    ## 10. Ce que je dis jeudi à chacun


    **Aux maraîchers, qui ont quitté la salle.** Votre demande de 240 L/s correspond à 3,3 mm/jour : elle
    est déjà déficitaire, elle n''est pas gonflée, et je le dirai à la presse. Je ne peux pas vous la
    donner — l''eau n''existe pas. Je vous propose autre chose qu''une consultation : **la clé de répartition
    entre vous est la vôtre**, la transférabilité des volumes, une voix délibérative au comité de desserrage,
    200 000 € orientés vers les vingt-huit plus petites et vers les saisonniers, et une campagne fuites
    dont chaque tranche de 10 L/s vous rend 26 hectares. En échange je veux vos parcelles, vos cultures
    et vos index.


    **À la régie.** Votre garantie est écrite, inconditionnelle, et porte sur la santé publique : Ferney
    et l''EHPAD ne manqueront pas d''eau, quel que soit l''état de la ressource. Elle porte sur votre
    besoin, pas sur votre historique. 250 000 € financent le réseau que vous auriez dû financer seule.
    Ouvrez vos chiffres sous sept jours.


    **À la rivière, qui n''a personne dans la salle.** Le seuil de 180 L/s n''est pas seulement maintenu
    : pour la première fois, il sera **mesuré là où l''arrêté l''exige**, en aval. Le dispositif de 2022
    n''a jamais vérifié qu''il était délivré.


    ---


    ## Première action, aujourd''hui


    Courrier recommandé à la régie exigeant sous sept jours le dossier réseau (volumes facturés par catégorie,
    rendement, débits nocturnes sectorisés, index), et bon de commande du jaugeage contradictoire et de
    la station aval. Le délai de la régie est la contrainte qui commande tout le calendrier ; il court
    à partir d''aujourd''hui, pas de jeudi.


    **Note de forme.** Les actes qui contraignent réellement — modification du débit réservé, sanctions,
    réquisition — relèvent du préfet. Les décisions de jeudi doivent lui être transmises immédiatement
    pour arrêté, faute de quoi les quotas resteront des recommandations et la sanction du dépassement
    — perte de l''allocation de la période suivante, seule sanction crédible en pénurie, une amende étant
    toujours moins chère qu''une récolte pour les plus grandes — sera inopposable.

    '
