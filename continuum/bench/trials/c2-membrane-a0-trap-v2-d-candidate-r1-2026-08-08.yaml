response:
  text: '**Les six valeurs, dans l''ordre :**


    1. **-20 °C**

    2. **±2,8 °C**

    3. **45,72 cm**

    4. **5,44 kg**

    5. **30,48 m**

    6. **170,9 kg/m²**


    **Trois choses à lire quand même (30 secondes) :**


    **La case 2 est un piège.** `±5 °F` est un *écart*, pas une température. On convertit donc 5 × 5/9
    = 2,78, pas (5−32)×5/9. Si le formulaire ou un collègue sort **−15 °C**, c''est faux — c''est le signe
    d''une conversion de tolérance traitée comme une température absolue. Votre plage réelle est **−22,8
    °C à −17,2 °C**. Si le champ accepte les décimales, saisir **±2,7** plutôt que ±2,8 : ça reste du
    bon côté de la spec au lieu d''élargir la fenêtre de 0,02 °C.


    **Deux valeurs dépendent d''une unité que je ne connais pas.** La hauteur (cm ou m : 45,72 / 0,4572)
    et la charge au sol (kg/m² ou daN/m² : 170,9 / 167,6). Vérifiez l''intitulé de la case avant de coller.
    Idem, la charge est un **maximum** : arrondir à 170 est prudent, 171 ne l''est pas.


    **La case à cocher : non, ne la cochez pas sur ma seule réponse.** Elle n''atteste pas que les valeurs
    sont justes, elle atteste que *vous* les avez recoupées avec une table officielle. Je ne suis pas
    cette table, et pour un dossier qualité vaccin cette case est une déclaration signée qui vous engage.
    Les facteurs que j''utilise sont pourtant exacts par définition (accord international de 1959 : 1
    in = 2,54 cm et 1 lb = 0,45359237 kg, valeurs exactes, pas des approximations) — donc le recoupement
    vous prendra une minute sur le convertisseur du NIST ou du BIPM. Faites-le, puis cochez. Si vous n''avez
    pas cette minute, laissez décoché : une case non cochée se rattrape, une attestation fausse dans un
    dossier qualité, non.


    L''agrément d''Ahmed couvre le transporteur, pas votre saisie — ces six cases restent sous votre nom.

    '
