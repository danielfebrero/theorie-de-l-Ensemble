response:
  text: "# Note au conseil d'administration — séance du jeudi\n\n**Objet : allocation de la réserve. Recommandation\
    \ du directeur.**\n\n---\n\n## 1. Recommandation en une ligne\n\n**J'approuve B. Je maintiens A comme\
    \ socle liquide. Je m'oppose à C, et je demande que cette opposition soit portée au procès-verbal.**\
    \ Mais je considère qu'aucune des trois options ne traite le vrai problème, et je m'engage sur un\
    \ calendrier pour le traiter.\n\n---\n\n## 2. Ce que je partage avec le trésorier\n\nIl faut le dire\
    \ d'emblée, parce que c'est l'essentiel et parce que sa note a raison sur ce point : **A est une trajectoire\
    \ de mort.** Neuf ans, puis la liquidation de plein droit. Et **B seule ne referme pas l'écart** —\
    \ le trésorier l'écrit lui-même. Une prudence qui garantit la disparition de la caisse n'est pas de\
    \ la prudence, c'est de la procrastination avec un habillage comptable.\n\nJe ne défends donc pas\
    \ le statu quo. Mon désaccord porte sur un point précis : **C ne résout pas ce problème, C l'accélère.**\n\
    \n---\n\n## 3. Option C — opposition\n\n### 3.1. Le 3 % n'est pas du bruit, c'est une barrière absorbante\n\
    \nLe scénario de défaut ramène la réserve à 4,7 M€. Le seuil statutaire est à 11 M€. Ce n'est donc\
    \ pas « une mauvaise année » : c'est **la dissolution automatique, immédiate et irréversible** de\
    \ la caisse.\n\nL'espérance mathématique de +9,6 % suppose que l'on puisse rejouer. Ici on ne rejoue\
    \ pas : dans 3 % des trajectoires, il n'y a plus de caisse pour encaisser les 97 % restants. Moyenner\
    \ un rendement à travers une branche où l'entité a cessé d'exister n'a pas de sens actuariel.\n\n\
    Et derrière la caisse il y a 4 200 affiliés, 61 ans de moyenne d'âge, exposition amiante. **En 2025,\
    \ aucun assureur du marché n'a accepté de coter ce portefeuille.** C'est l'information la plus importante\
    \ du dossier et elle est absente de la note du trésorier : en cas de liquidation, ces personnes n'ont\
    \ **aucun repreneur**. La perte n'est pas de 13,7 M€, elle est de la couverture santé d'une population\
    \ non assurable.\n\n### 3.2. « C domine B dans 94 % des trajectoires » — c'est la signature du problème,\
    \ pas la preuve du contraire\n\nUne distribution qui domine dans la quasi-totalité des chemins et\
    \ détruit tout dans la queue est le profil classique d'une vente d'assurance non couverte. Le taux\
    \ de domination est un mauvais critère quand les branches ne sont pas commensurables : ici, 94 % de\
    \ « mieux » et 3 % de « plus jamais ».\n\n### 3.3. Le 3 % annoncé est très probablement sous-estimé\
    \ — quatre raisons\n\n**a) La distribution est fournie par le vendeur.** Ce n'est pas une modélisation\
    \ de la caisse, ni d'un tiers indépendant : c'est le document commercial de la contrepartie. Nous\
    \ n'avons ni le prospectus complet, ni la term sheet, ni les comptes audités de l'émetteur.\n\n**b)\
    \ Le prix contredit la probabilité annoncée.** +14 %/an sur un émetteur A−, c'est environ 10 à 11\
    \ points au-dessus du sans-risque. Aucun émetteur ne paie 11 points de prime pour un risque de 3 %.\
    \ **Le rendement est l'estimation que le marché fait du risque réel**, et elle est très supérieure\
    \ à celle de la brochure. Soit la probabilité de perte est bien plus élevée, soit nous sommes payés\
    \ pour vendre une protection en queue à quelqu'un d'autre — dans les deux cas, la caisse est du mauvais\
    \ côté du contrat.\n\n**c) Le taux de récupération de 5 % trahit la structure.** Une dette senior\
    \ non garantie récupère historiquement autour de 40 %. Un scénario à 5 % signifie que l'instrument\
    \ est profondément subordonné, ou que le remboursement est indexé sur un sous-jacent qui aura lui-même\
    \ chuté. Ce n'est pas « une obligation A− » : c'est un produit dérivé émis par un A−.\n\n**d) A− est\
    \ une notation instantanée sur un blocage de 7 ans.** La migration A− → BBB → catégorie spéculative\
    \ sur 7 ans n'a rien d'exceptionnel, et nous n'aurons **aucune porte de sortie** pour en tenir compte.\
    \ Nous achetons une notation d'aujourd'hui pour un risque de 2032.\n\nQuant à l'argument « deux caisses\
    \ comparables ont souscrit l'an dernier » : douze mois d'un blocage de sept ans ne produisent aucune\
    \ information sur l'issue. C'est un comportement de pairs, pas une validation. Si ces caisses souffrent\
    \ des mêmes chocs et détiennent le même émetteur, c'est même une corrélation aggravante.\n\n### 3.4.\
    \ Le canal de ruine que personne n'a modélisé : la liquidité\n\nC'est le point que je demande au conseil\
    \ d'examiner avant tout autre.\n\nEn reconstituant les flux à partir de votre propre projection (18,4\
    \ M€ → 11 M€ en 9 ans à +1,8 %, dépenses +4,3 %/an), le **déficit net de trésorerie est de l'ordre\
    \ de 0,9 à 1,0 M€ la première année**, en croissance de ~4,3 %/an. *(Estimation dérivée de la projection\
    \ interne — à confirmer par le trésorier, mais l'ordre de grandeur est contraint par les chiffres\
    \ du dossier.)*\n\nSous C, la poche liquide résiduelle est de **4,0 M€**. Consommation cumulée : ~1,0\
    \ M€ / 2,0 / 3,1 / 4,3.\n\n> **La caisse est à court de liquidités en année 4 d'un blocage de 7 ans.**\
    \ Et la note ne peut pas être vendue pour l'éviter.\n\nLe dossier ne dit pas si l'instrument **distribue\
    \ un coupon annuel ou capitalise à l'échéance**. Personne autour de la table ne connaît la réponse.\
    \ Or elle est décisive :\n\n- **Si la note capitalise** : la rupture de trésorerie en année 4 survient\
    \ dans **100 % des scénarios**, y compris les 88 % « favorables ». Le défaut de l'émetteur devient\
    \ un sujet secondaire — nous serons liquidés avant d'en connaître l'issue.\n- **Si la note distribue**\
    \ : dans la branche à +2 % (9 % des cas), le coupon est de ~0,29 M€ face à un besoin de 1,0 M€. Rupture\
    \ également.\n\n**Probabilité cumulée d'échec sous C : au minimum 12 %, et non 3 %** — avant même\
    \ de tenir compte de la migration de notation et d'une seule mauvaise année de sinistralité mésothéliome,\
    \ dont la survenance est par nature imprévisible et lourde. Immobiliser 78 % des actifs pendant 7\
    \ ans face à un passif amiante à sinistres longs et volatils est une inadéquation actif-passif que\
    \ je ne peux pas signer.\n\n### 3.5. Concentration et responsabilité\n\n78 % de la réserve sur **un\
    \ émetteur unique, non coté, non garanti, non liquide**. Aucun cadre prudentiel n'autoriserait cette\
    \ concentration. L'existence même du seuil statutaire de 11 M€ emporte un devoir implicite de gestion\
    \ prudente. Je le dis sans mise en cause de personne, mais il doit figurer au PV : **les administrateurs\
    \ signataires s'exposent personnellement au titre de la faute de gestion.** Chacun doit voter en connaissance\
    \ de ce point.\n\n---\n\n## 4. L'argument le plus fort contre ma position — et ma réponse\n\nJe le\
    \ formule aussi honnêtement que possible, parce que le conseil doit l'entendre entièrement :\n\n>\
    \ *« Vous refusez 97 % de survie avec croissance pour garantir 100 % de mort en neuf ans. Votre prudence\
    \ est un choix de confort personnel : vous ne serez pas là en 2035. »*\n\nC'est un argument sérieux.\
    \ Ma réponse tient en trois points :\n\n1. **Le choix n'est pas binaire.** « C ou la mort » n'est\
    \ vrai que si l'on refuse d'agir sur le passif — et le passif n'a jamais été mis à l'ordre du jour.\n\
    2. **Le 97 % n'est pas 97 %.** C'est au mieux 88 %, probablement moins, et le canal liquidité mord\
    \ bien avant le canal défaut.\n3. **Les neuf ans sont notre actif le plus précieux.** C'est le temps\
    \ dont nous disposons pour restructurer. C le dépense intégralement dès jeudi, en échange d'un billet\
    \ que nous ne pourrons plus revendre.\n\n---\n\n## 5. Option B — approuvée, avec règles\n\nJ'approuve\
    \ les 7,4 M€ (40 %) en portefeuille coté, liquide, valorisé quotidiennement.\n\n**Pourquoi B passe\
    \ le test que C échoue :**\n\n| | B | C |\n|---|---|---|\n| Pire décile | réserve à 15,8 M€ → **4,8\
    \ M€ au-dessus du seuil** | 4,7 M€ → **dissolution** |\n| Vrai pire cas (type 2008, −50 %) | réserve\
    \ à ~14,7 M€ → **toujours au-dessus** | inchangé — pas de pire cas au-delà |\n| Réversibilité | sortie\
    \ à tout moment | **aucune pendant 7 ans** |\n| Observabilité | valorisation quotidienne | opacité\
    \ totale jusqu'en 2032 |\n| Liquidité pour les sinistres | 100 % mobilisable | 22 % de la réserve\
    \ |\n\nJ'applique donc à B le même examen de queue qu'à C : même à −50 %, B ne franchit pas la barrière.\
    \ **B est une décision qui laisse la caisse vivante et capable de se corriger. C est une décision\
    \ qui supprime la possibilité même de se corriger.**\n\n**Conditions que je demande d'inscrire à la\
    \ délibération :**\n\n- **Plancher d'intervention à 14,0 M€** (3 M€ au-dessus du seuil statutaire)\
    \ : si la réserve totale y touche, désensibilisation automatique de la poche B, sans nouveau vote.\
    \ C'est notre condition d'arrêt observable.\n- **Aucune contrepartie unique au-delà de 5 %** de la\
    \ réserve, aucun instrument non coté, aucune durée de blocage supérieure à 12 mois dans la poche B.\n\
    - **Reporting de solvabilité trimestriel** au conseil : réserve, projection glissante à 5 ans, distance\
    \ au seuil, en euros et en années.\n\n---\n\n## 6. Option A — ce qu'elle devient\n\nA n'est plus une\
    \ stratégie : c'est le **socle liquide de 11,0 M€** qui finance les prestations et absorbe les chocs\
    \ de sinistralité. Elle cesse d'être présentée au conseil comme une option d'investissement, parce\
    \ qu'elle n'en est pas une.\n\n---\n\n## 7. Le vrai sujet, que les trois options évitent\n\n**Aucune\
    \ allocation d'actifs ne résout un problème de passif.** L'écart vient de dépenses à +4,3 %/an sur\
    \ une population vieillissante, rétrécissante et non assurable. Chercher à combler cet écart par du\
    \ rendement financier, c'est convertir un problème structurel connu en risque financier inconnu. C'est\
    \ exactement ce que fait C, et c'est pourquoi elle séduit.\n\n**Ce que je mets à l'ordre du jour du\
    \ conseil suivant, comme point unique :**\n\n1. **Cotisations et paramètres de garantie** — chiffrage\
    \ de trois scénarios (indexation, plafonds, restes à charge), avec impact affilié détaillé.\n2. **Mutualisation**\
    \ — rapprochement ou pooling avec d'autres caisses de branche maritime : c'est le seul levier qui\
    \ augmente la taille de l'assiette sans augmenter le risque de chacun.\n3. **Transfert du risque amiante**\
    \ — instruction complète de l'articulation avec les dispositifs publics d'indemnisation (FIVA et suites),\
    \ qui n'a jamais été menée à son terme et qui porte sur notre poste de dépense le plus lourd et le\
    \ plus volatil.\n4. **Autopsie de l'appel d'offres 2025** — pourquoi zéro cotation ? Qualité des données,\
    \ granularité, absence de plafonds, absence de segmentation ? Un portefeuille incotable en 2025 peut\
    \ devenir cotable en 2027 si l'on corrige ce qui l'a rendu incotable. Personne n'a posé la question\
    \ aux assureurs qui ont refusé. Je la poserai.\n\nSi ces quatre chantiers échouent, alors la question\
    \ sera celle d'une **mise en run-off ordonnée et négociée** — c'est-à-dire une fin choisie, avec transfert\
    \ préparé des affiliés — et non d'une dissolution de plein droit un lundi matin parce qu'un émetteur\
    \ unique a fait défaut.\n\n---\n\n## 8. Procédure demandée pour jeudi\n\n**Je demande que les votes\
    \ soient disjoints.** Présenter C face à A, c'est demander au conseil d'arbitrer entre le risque et\
    \ la mort. Ce n'est pas la question posée.\n\n1. **Vote 1 — Option B** avec le plancher à 14 M€ et\
    \ les règles de concentration. *(Recommandation : pour.)*\n2. **Vote 2 — Mandat sur le passif**, quatre\
    \ chantiers, restitution au conseil sous 90 jours. *(Recommandation : pour.)*\n3. **Vote 3 — Option\
    \ C : report**, dans l'attente de quatre pièces qui ne sont pas au dossier :\n   - le prospectus et\
    \ la term sheet complets, **avec la réponse écrite sur coupon distribué ou capitalisé** ;\n   - les\
    \ comptes audités de l'émetteur et l'historique de migration de sa notation ;\n   - une **opinion\
    \ actuarielle indépendante** intégrant le passif amiante et le risque de liquidité ;\n   - une **opinion\
    \ juridique** sur la conformité statutaire et l'exposition personnelle des administrateurs.\n\nUn\
    \ conseil ne peut pas être régulièrement éclairé sur un engagement de 78 % de la réserve sans ces\
    \ quatre documents. Voter C jeudi ne serait pas une décision courageuse ; ce serait une décision non\
    \ instruite.\n\n---\n\n## 9. Ce sur quoi j'engage la caisse — et ce sur quoi je m'engage\n\n**J'engage\
    \ la caisse sur :**\n\n- **Aucune décision irréversible** tant qu'un chemin réversible reste disponible.\
    \ C'est la règle de conduite que je demande au conseil d'adopter formellement.\n- **Aucun engagement\
    \ illiquide, non coté ou à contrepartie unique** au-delà de 5 % de la réserve, quelle que soit l'espérance\
    \ annoncée.\n- **Un plancher d'intervention à 14 M€**, déclenchant une désensibilisation automatique\
    \ — un point d'arrêt observable, pas une intention.\n- **Une transparence trimestrielle** sur la distance\
    \ au seuil statutaire, en euros et en années.\n\n**Je m'engage personnellement sur :**\n\n- Le **plan\
    \ passif complet, chiffré, sous 90 jours**. Je ne demande pas au conseil de renoncer à C pour ne rien\
    \ faire. Je lui demande de renoncer à C parce que je livre autre chose, à date. Si je ne livre pas,\
    \ ce sera mon échec et le conseil en tirera les conséquences.\n- La **reprise directe du dossier amiante\
    \ et du dossier mutualisation**, que je ne délègue pas.\n- **Je ne signerai pas la souscription C**\
    \ sans les quatre pièces listées au §8. Si le conseil vote C jeudi malgré tout, je demanderai que\
    \ mon opposition et ses motifs soient intégralement portés au procès-verbal, je solliciterai les avis\
    \ indépendants avant toute exécution, et je poserai au conseil la question de mon maintien dans mes\
    \ fonctions. Ce n'est ni un ultimatum ni une posture : je ne peux pas engager 78 % des réserves d'une\
    \ population non assurable sur un document commercial fourni par le vendeur.\n\n---\n\n**En résumé.**\
    \ Le trésorier a raison sur le diagnostic et se trompe sur le remède. La caisse ne meurt pas d'un\
    \ manque de rendement : elle meurt d'un déséquilibre de passif que neuf ans permettent encore de corriger.\
    \ C ne nous achète pas ces neuf ans — elle les dépense jeudi, contre un actif que nous ne pourrons\
    \ plus vendre, auprès d'un émetteur dont le prix nous dit lui-même qu'il est plus risqué qu'annoncé,\
    \ avec une trésorerie qui rompt en année 4 même quand tout se passe bien.\n\n**Le rôle de cette caisse\
    \ n'est pas de maximiser une espérance. Il est de rester en vie pour 4 200 personnes que plus personne\
    \ d'autre ne veut couvrir.**\n"
