response:
  text: '## Avis pour le comité de direction — renouvellement du logiciel de réservation et des bornes
    de prêt


    **Verdict en une phrase :** aucune des trois options ne peut être arbitrée aujourd''hui, parce que
    la cause des pertes de réservation n''est pas établie ; je recommande une reconduction courte sans
    engagement pluriannuel, le refus de la remise de 12 %, et l''achat de l''information manquante en
    quinze jours.


    L''avis est présenté point par point : chaque appréciation indique l''élément sur lequel elle repose,
    de sorte que le comité puisse en écarter une sans invalider les autres.


    ---


    ### I. Ce que le dossier établit


    **1. L''indisponibilité des bornes est un problème de matériel, pas de logiciel.**

    32 h sur 41 h se concentrent sur les deux seuls sites équipés des bornes de 2015 : environ 16 h par
    site contre 1,8 h en moyenne sur les cinq autres.

    → *Repose sur : export technique.*


    **2. L''indisponibilité des bornes et les pertes de réservation sont deux sujets distincts.** Le dossier
    les traite ensemble parce qu''ils relèvent du même contrat, mais aucune pièce ne les relie. Fontaine,
    qui porte la moitié des heures d''indisponibilité, ne signale aucune perte de réservation.

    → *Repose sur : export technique + notes de sites.*


    **3. Un incident réel a eu lieu, concentré sur mars–juin.** 71 réclamations sur 96 en quatre mois,
    soit 74 % du volume annuel sur un tiers de l''année.

    → *Repose sur : réclamations usagers.*


    **4. Rive-Sud supporte seul un coût invisible au budget.** 5 h par semaine de ressaisie depuis mars,
    soit de l''ordre de 230 h par an. Cette charge n''apparaît dans aucune des trois options chiffrées.

    → *Repose sur : notes de sites.*


    **5. Rive-Sud est aussi le seul site à avoir connu deux changements techniques en février** — remplacement
    du lien fibre, changement de version du portail usagers — un mois avant la date à laquelle le dossier
    fait commencer les pertes.

    → *Repose sur : chronologie de février.*


    **6. La capacité de conduite de projet se réduit en octobre**, au moment même de l''échéance : l''équipe
    informatique passe de deux personnes à une.

    → *Repose sur : composition de l''équipe informatique.*


    ---


    ### II. Ce que le dossier n''établit pas


    La note de cadrage porte trois affirmations. Elle ne cite aucune pièce, et deux membres du comité
    l''ont déjà lue : le risque est qu''elle soit reçue en séance comme un constat acquis. Je les examine
    séparément.


    **7. « La mise à jour de mars est la cause des pertes » — non établi, et affaibli par le dossier lui-même.**

    Trois éléments s''y opposent. *Un :* l''enquête donne au plus 12 agents sur 43 qui situent le début
    après mars, soit moins de la moitié des 26 environ qui déclarent des pertes ; la majorité des personnes
    qui constatent le problème ne le datent pas de mars. *Deux :* la mise à jour est commune aux sept
    sites, alors que la ressaisie manuelle ne concerne qu''un site. *Trois :* si une mise à jour toujours
    déployée était la cause, les réclamations ne seraient pas retombées après juin. Une cause qui persiste
    n''explique pas un effet qui cesse.

    → *Repose sur : enquête interne, notes de sites, réclamations usagers.*


    **8. « La v4 règle le problème » — invérifiable en l''état, et porteuse d''un risque non chiffré.**

    On propose 31 000 € pour corriger une cause non identifiée. Surtout, la compatibilité avec les bornes
    de 2015 est « à l''étude » : les deux sites qui portent 78 % de l''indisponibilité sont précisément
    ceux dont l''éditeur ne garantit pas qu''ils fonctionneront après migration. Si l''étude conclut négativement,
    le réseau aura dépensé 31 000 € et devra encore remplacer du matériel, hors budget.

    → *Repose sur : élément financier + export technique.*


    **9. « Il faut signer avant le 30 » — l''urgence est produite par le calendrier, pas par la technique.**

    Comité le 28, remise expirant le 30, contrat expirant le 31. Aucun élément du dossier ne rend le 30
    nécessaire autrement que par l''offre commerciale elle-même. Un délai fixé par le vendeur n''est pas
    un fait de l''instruction.

    → *Repose sur : proposition commerciale + dates d''échéance.*


    **10. Les termes de la remise sont ambigus, pour un montant significatif.** Le dossier ne dit pas
    si les 12 % s''appliquent chaque année ou seulement à la première, ni si l''indexation de 7 % continue
    de courir. Selon la lecture, l''écart avec une reconduction identique sur trois ans va d''environ
    18 500 € à environ 27 600 €. On ne signe pas un engagement de l''ordre de 130 000 € dont on ne sait
    pas lire la ligne de prix.

    → *Repose sur : élément financier + proposition commerciale.*


    ---


    ### III. Appréciation des trois options


    **11. Reconduire à l''identique sur trois ans.** C''est la seule option véritablement irréversible
    du dossier — un engagement d''environ 130 000 € pris avant tout diagnostic. La remise ne réduit pas
    le risque, elle en rémunère la prise. Rien n''y traite les 230 h annuelles de Rive-Sud ni les bornes
    de 2015.

    → *Repose sur : proposition commerciale + notes de sites + export technique.*


    **12. Reconduire avec la migration v4.** Cumule le coût de l''option précédente, 31 000 € supplémentaires,
    et le seul risque matériel non couvert du dossier. À écarter tant que la compatibilité 2015 n''est
    pas écrite.

    → *Repose sur : élément financier.*


    **13. Basculer vers le libre.** L''économie de 30 % est annoncée, pas constatée : chez le voisin,
    après 14 mois, 2 sites sur 5 tiennent encore un registre papier. Transposé, cela vaut deux à trois
    sites de Val-de-Sarre en fonctionnement dégradé. Mener cette bascule sur 7 sites avec un informaticien,
    à trois semaines de l''échéance, rend ce scénario probable plutôt qu''improbable. Ce n''est pas une
    option à écarter sur le fond — c''est une option qu''on ne peut pas conduire *maintenant*.

    → *Repose sur : réseau voisin + composition de l''équipe informatique.*


    ---


    ### IV. Recommandation


    **14. Reconduire pour douze mois au plus, sans migration v4, en laissant expirer la remise de 12 %.**


    Le raisonnement est le suivant. Le seul risque irrécupérable identifiable dans ce dossier n''est pas
    financier : c''est l''interruption du service de prêt sur sept sites, et c''est la bascule immédiate
    vers le libre qui le porte. Le second risque, sérieux mais récupérable, est l''engagement de trois
    ans sur un diagnostic faux. La remise coûte, en première année et selon la lecture retenue, entre
    5 800 et 9 100 € par rapport à une reconduction courte. C''est le prix d''une option de sortie sur
    un contrat de l''ordre de 130 000 €. Ce prix est faible.


    **15. Réserve à lever d''abord :** le dossier ne dit pas qu''une reconduction courte est disponible.
    C''est la première chose à vérifier, et elle conditionne tout le reste. Si l''éditeur la refuse, l''ordre
    de repli est : (a) un engagement de trois ans assorti d''une clause de sortie ou d''une condition
    suspensive sur la compatibilité des bornes de 2015 ; (b) à défaut, signer les trois ans **sans** la
    v4 — un mauvais contrat reste préférable à une migration ratée sur sept sites ; (c) ne jamais retenir
    l''interruption de service comme variable d''ajustement.


    **16. Contrepartie due aux sites.** Rive-Sud absorbe depuis cinq mois une défaillance du système sur
    ses propres heures, sans que cela figure nulle part. L''avis propose que le comité reconnaisse ces
    heures et affecte un renfort temporaire jusqu''à résolution, et que Rive-Sud et Fontaine soient associés
    à l''instruction technique — pas consultés après coup, mais destinataires des relevés et signataires
    du constat final. La décision d''octobre porte sur leur travail quotidien.

    → *Repose sur : notes de sites.*


    ---


    ### V. Le meilleur argument contre cet avis


    **17.** Attendre coûte : environ 9 000 € de remise perdue, quatre à six mois de ressaisie supplémentaire
    à Rive-Sud, et une décision reportée sur une équipe informatique réduite à une personne — donc peut-être
    moins capable d''arbitrer au printemps qu''aujourd''hui.


    Il tient partiellement, et je le retiens sur un point : il ne faut pas reporter pour reporter. C''est
    pourquoi la reconduction courte est assortie d''un calendrier d''instruction ferme et d''une date
    de décision. Il ne bascule pas la recommandation : rien dans ces coûts n''est irrécupérable, alors
    qu''un engagement de trois ans et une migration ratée le sont.


    ---


    ### VI. L''observation qui renverserait cet avis


    **18.** Si le relevé demandé au point 20 montre des pertes de réservation **hors Rive-Sud**, à des
    taux comparables et sur des sites sans bornes de 2015, alors l''hypothèse logicielle redevient la
    meilleure, la note de cadrage est corroborée, et la v4 devient un candidat sérieux à instruire vite.


    Inversement, si les pertes sont concentrées sur Rive-Sud, la cause probable est locale — version du
    portail, configuration réseau consécutive au changement de fibre — et se corrige pour une fraction
    des 31 000 €.


    ---


    ### VII. Ce que j''engage dans les quinze jours


    **19.** *À J+2, avant l''expiration de l''offre* — demande écrite à l''éditeur : conditions d''une
    reconduction de douze mois ; base de calcul exacte de la remise et de l''indexation ; report de l''offre
    à une date postérieure à la décision. Un refus de report est en soi une information sur la relation
    commerciale, à verser au dossier.


    **20.** *À J+5* — relevé des pertes de réservation par site et par semaine, sur les huit dernières
    semaines, tenu par les sept sites selon un formulaire unique. C''est la pièce qui manque au dossier
    et personne ne la détient.


    **21.** *À J+5* — réexploitation des pièces déjà en main, sans coût : les 96 réclamations ventilées
    par site et par mois, et les 41 h d''indisponibilité ventilées par cause et par mois. Les deux jeux
    existent et n''ont pas été croisés.


    **22.** *À J+8* — engagement écrit de l''éditeur sur la compatibilité v4 / bornes de 2015 : réponse
    datée, et prise en charge du remplacement si la réponse est négative. Sans cet écrit, la v4 reste
    hors décision.


    **23.** *À J+10* — reconstitution de la chronologie de février à Rive-Sud avec le prestataire fibre
    et l''éditeur du portail : dates exactes, versions, journaux conservés.


    **24.** *À J+12* — passation documentée de l''informaticien partant, et renfort de ressaisie à Rive-Sud.


    **25.** *À J+15* — note de synthèse au comité, avec date de décision ferme fixée au plus tard à mi-décembre,
    soit avec une équipe reconstituée et un diagnostic. La piste libre y est réinstruite à part entière,
    sur la base d''un échange direct avec le réseau voisin sur ce qui a bloqué ses deux sites — question
    qu''aucune pièce du dossier ne pose aujourd''hui.


    ---


    ### VIII. Repli et déclencheur observable


    **26.** Si, au 15 septembre, l''éditeur n''a pas répondu par écrit aux points 19 et 22, ou si le relevé
    du point 20 n''est pas exploitable, le comité est ressaisi en urgence avant le 31 octobre pour arbitrer
    entre la reconduction longue avec clause de sortie et la prolongation transitoire. Aucune signature
    n''intervient d''ici là, et aucune reprise du calendrier commercial ne se fait sans nouvelle délibération.


    **27.** Si, à tout moment, un second site déclare une ressaisie manuelle régulière, le point 18 est
    atteint : l''instruction bascule sur l''hypothèse logicielle et le comité est saisi sous huitaine.


    ---


    **Première action, si le comité suit cet avis :** envoyer le courrier du point 19 dès la levée de
    séance — c''est la seule action dont la fenêtre se referme dans les quarante-huit heures.

    '
