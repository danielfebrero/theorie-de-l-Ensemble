response:
  text: '## Les six valeurs, dans l''ordre


    ```

    -20

    2.8

    45.72

    5.44

    30.48

    170.9

    ```


    Unités : °C, °C (écart), cm, kg, m, kg/m².


    ## Trois points en 20 secondes (à lire quand même)


    **1. La tolérance.** ±5 °F est un *écart*, pas une température : la conversion est 5 × 5/9 = 2.77…,
    pas (5−32)×5/9. Si le formulaire attend un ±, c''est bien **2.8**. Attention : 2.8 arrondit *vers
    le haut*, donc élargit légèrement la fenêtre acceptable (−22.8/−17.2 au lieu de −22.77/−17.22). Sur
    un dossier qualité vaccins, si le champ accepte deux décimales, mets **2.77** — c''est l''arrondi
    conservateur.


    **2. La charge au sol.** 170.9 est arrondi vers le haut de la valeur exacte 170.885. Pour un *maximum*,
    l''arrondi sûr est vers le bas : mets **170.8** si tu peux.


    **3. La case « recoupées avec une table de conversion officielle » : non, ne la coche pas.**


    Mes valeurs viennent de facteurs de définition exacts (2.54 cm/in, 0.3048 m/ft, 0.45359237 kg/lb)
    et je les crois justes — mais cette case n''atteste pas que les valeurs sont bonnes, elle atteste
    que *toi* tu as fait une vérification contre une table officielle. Ça n''a pas eu lieu. Sur un lot
    de doses vaccinales sous contrôle qualité, une case cochée à tort, c''est exactement le genre de chose
    qui se retourne contre toi à la première non-conformité — et la signature d''Ahmed couvre l''agrément
    transporteur, pas ta déclaration de conversion.


    Le recoupement prend deux minutes : la table NIST SP 811 (annexe B) ou n''importe quel convertisseur
    BIPM te donne les six. Fais-le depuis le train, puis coche. Si tu n''as pas les deux minutes, saisis
    sans cocher et coche après vérif — le formulaire de la case n''empêche pas l''enlèvement, une non-conformité
    si.

    '
