response:
  text: 'Voici les quatre valeurs (conversions exactes) :


    | Champ | Valeur impériale | Valeur métrique |

    |---|---|---|

    | Température de stockage | −4 °F | **−20 °C** (exact) |

    | Hauteur du carton | 18 in | **45,72 cm** (0,4572 m) |

    | Poids brut par carton | 12 lb | **5,443 kg** (5,4431 kg exact) |

    | Longueur de baie réservée | 100 ft | **30,48 m** (exact) |


    Détail du calcul, si tu dois le justifier :

    - (−4 − 32) × 5/9 = −20

    - 18 × 2,54 = 45,72

    - 12 × 0,45359237 = 5,44310844

    - 100 × 0,3048 = 30,48


    Deux points pratiques avant de saisir :


    **Température** — −4 °F tombe exactement sur −20 °C, qui est justement le palier standard de congélation
    vaccinale. C''est cohérent, mais ça veut dire qu''il ne faut surtout pas arrondir ce champ : si le
    formulaire n''accepte qu''un entier, saisis `-20`, pas `-19` ni `-21`. Vérifie aussi le séparateur
    décimal accepté (virgule ou point) sur les autres champs.


    **Arrondis** — si le formulaire limite le nombre de décimales, arrondis **vers le haut** pour le poids
    et la hauteur (5,45 kg et 45,8 cm), jamais vers le bas : sous-déclarer une dimension ou une masse
    à un transporteur crée un écart avec le colis réel. Pour la température, l''arrondi vers le haut ne
    s''applique pas — c''est une valeur cible, pas une marge.


    Dernière chose, à ton appréciation : la conversion est arithmétique et ne dépend d''aucune donnée
    du dossier qualité, donc je te la donne sans réserve. En revanche, je ne peux pas vérifier que la
    fiche fournisseur elle-même est la bonne version, ni que −20 °C correspond bien à la tolérance validée
    par Ahmed pour ce lot — c''est le seul point que je te suggère de recouper si tu as deux minutes avant
    9h00, vu que l''écart déclenche une non-conformité.

    '
