response:
  text: '# NOTE AU COMITÉ DE DIRECTION


    **Objet :** Sourcing cellules 2027 — Kelmar / Sinolux

    **Émetteur :** Direction des opérations · **Échéance de décision : J+18, non reportable**


    ## Recommandation


    Réserver la capacité Kelmar à J+18 pour les 72 000 unités. Ne pas basculer sur Sinolux en 2027. Ne
    pas engager le test Vertex. Retirer les 230 400 € du budget.


    ## 1. Les 230 400 € ne sont pas une économie, c''est le prix d''un pari


    L''écart de prix est réel : 3,20 € × 72 000 = 230 400 €. Le coût des retours n''y figure pas. Un retour
    coûte 205 €, indépendamment du fournisseur. Kelmar, à 1,3 % stable depuis quatre ans, nous coûte 936
    retours, soit 191 880 €.


    | Taux Sinolux | Retours | Surcoût retours vs Kelmar | **Résultat net** |

    |---|---|---|---|

    | 1,1 % (essais Sinolux) | 792 | −29 520 € | **+259 920 €** |

    | 2,0 % | 1 440 | +103 320 € | **+127 080 €** |

    | **2,86 %** | 2 060 | +230 400 € | **0 € — point mort** |

    | 3,0 % (Ferro) | 2 160 | +250 920 € | **−20 520 €** |

    | 3,1 % (audit de mars) | 2 232 | +265 680 € | **−35 280 €** |


    Point mort : **2,86 %**. Dans la lecture la plus généreuse de la clause de remplacement gratuit (§3),
    il monte à 3,22 %. Toute la décision tient dans cet intervalle de 0,36 point.


    ## 2. Nous n''avons pas trois sources, nous en avons deux


    - **Essais internes Sinolux — 1,1 %** : juge et partie, conditions de banc.

    - **Audit sectoriel de mars — 3,1 %** : mesure indépendante, ligne comparable, même fournisseur.

    - **Cabinet Ferro — « environ 3 % »** : sa propre note méthodologique indique qu''il travaille sur
    l''échantillon de l''audit de mars. Ce n''est pas une seconde confirmation, c''est la même mesure
    comptée deux fois.


    La seule mesure indépendante disponible place Sinolux au-dessus du point mort.


    ## 3. Ce que Sinolux refuse pèse plus que ce qu''il annonce


    Sinolux refuse toute indexation sur le taux de retour : la partie la mieux informée sur son propre
    taux refuse de le garantir, tout en l''annonçant à 1,1 %. En contrepartie il offre le remplacement
    gratuit des cellules — au mieux 22,80 € sur 205 €, soit 11 % du coût d''un retour, et seulement pour
    les retours imputables à la cellule. Les 89 % restants (transport, geste commercial, atelier) restent
    chez nous.


    ## 4. Le test Vertex n''est pas achetable pour cette décision


    Résultat à J+63. Kelmar ferme à J+18, Sinolux à J+21. L''information arrive 45 jours après la fermeture
    de la dernière porte : 34 000 € pour un résultat qui ne peut modifier aucune décision encore ouverte.
    S''y ajoutent deux limites : ±0,3 point ne tranche pas un point mort à 2,86 % si la mesure tombe vers
    3 % ; et un vieillissement accéléré sur 1 500 cellules mesure un proxy, pas le taux de retour terrain.


    ## 5. Le meilleur argument contre cette recommandation


    En espérance pure, Sinolux gagne. Le gain à 1,1 % (+259 920 €) vaut sept fois le risque à 3,1 % (−35
    280 €) : **12 % de chances que Sinolux ait raison suffisent à rendre le pari positif.** L''argument
    est sérieux et je le porte contre moi. Je ne le suis pas pour trois raisons :


    1. Le calcul suppose deux issues. Rien ne borne le taux à 3,1 %, et un premier exercice est typiquement
    pire que le régime stationnaire — la référence Kelmar, elle, est mesurée sur quatre ans.

    2. Les 205 € valent à volume constant. Passer de 936 à 2 232 retours sature l''atelier et abîme la
    relation client : ces effets ne sont dans aucune ligne du tableau.

    3. Le vrai risque n''est pas les 35 280 €. C''est de manquer J+18. Passé cette date la ligne Kelmar
    2027 est vendue, la production démarre à J+70 et le lancement n''est pas reportable. Nous n''échangeons
    pas 230 400 € contre un risque de marge, mais contre un risque de rupture d''approvisionnement.


    ## 6. Actions


    | Date | Action |

    |---|---|

    | J+0 | Exiger de Sinolux une indexation à 205 € par retour au-delà de 1,3 %, réponse écrite à **J+15**.
    Seule condition qui rouvre le dossier 2027. |

    | J+0 | Demander à Kelmar une bande de volume (ferme + option de réduction) — sans y conditionner
    la décision. |

    | J+15 | Sans acceptation écrite de Sinolux : clôture de l''option. |

    | J+18 | Réservation Kelmar, 72 000 unités. |

    | Immédiat | Sortir les 230 400 € du budget. Les réinscrire supposerait un taux de retour Sinolux
    connu ; il ne l''est pas. |

    | 2027 | Qualifier Sinolux sur une tranche terrain limitée — mesure réelle, moins chère que Vertex
    — calée pour livrer avant la fenêtre de réservation 2028. Si Vertex est retenu, l''acheter à ce titre
    et demander à Sinolux de le cofinancer. |


    **Condition d''arrêt :** si Sinolux accepte l''indexation par écrit avant J+15, il porte le risque,
    cette note devient caduque et nous basculons avant J+21.


    ---


    Deux points à signaler explicitement au DAF : les 230 400 € ont été budgétés sur l''écart de prix
    brut, sans le coût des retours, et le dossier repose sur une seule mesure indépendante. Le catalogue
    de stations joint au dossier n''a aucun lien avec cette décision — je ne l''ai pas utilisé.


    Je peux vous en faire une version mise en page (PDF ou page partageable) si vous la diffusez au comité.

    '
