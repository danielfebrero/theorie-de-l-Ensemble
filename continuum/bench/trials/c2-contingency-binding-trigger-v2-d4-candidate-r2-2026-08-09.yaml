response:
  text: '## Note


    Je tranche pour **B**, mais pas la version du dossier : telle qu''elle est calendée, B est dominée
    par A. Voici la note.


    ---


    **NOTE AU COMITÉ DE DIRECTION**

    **Objet : prestataire de paiement — renouvellement Solda ou bascule Payflux**

    **Recommandation : option B recalendée. Décision vendredi, première action lundi.**


    ### 1. L''ordre de grandeur de référence


    18 000 transactions × 42 € = **756 k€ de chiffre d''affaires par jour**. Un dixième de point d''échec
    de paiement = 18 transactions/jour = **276 k€ de CA par an**. Les écarts de qualité d''exécution pèsent
    donc le même ordre de grandeur que l''écart de prix entre les deux prestataires. Ce dossier n''est
    pas un dossier d''achat.


    ### 2. Ce que coûte réellement chaque option (12 premiers mois, décembre → novembre)


    | | Coût an 1 | Économie an 1 | Économie sur 24 mois |

    |---|---|---|---|

    | Renouvellement Solda | 1 400 k€ | — | — |

    | **A** — bascule intégrale 3 nov. | 900 k€ | **500 k€** | 1 000 k€ |

    | **B** — telle que présentée | 1 090 k€ | 310 k€ | 810 k€ |

    | **B recalendée** (recommandée) | 1 425 k€ | **−25 k€** | **475 k€** |


    B recalendée = Payflux 900 k€ + prolongation Solda au mois le mois décembre/janvier/février (3 × 130
    k€) + double run (3 × 45 k€). *Hypothèse explicite : le chiffre de 310 k€ du dossier n''intègre pas
    la prolongation Solda ; s''il l''intègre, B ressort à +128 k€ et la conclusion est inchangée.*


    **Le coût de la réversibilité est donc de l''ordre de 420 à 525 k€ sur l''engagement de 24 mois**
    (525 k€ d''écart de trésorerie, moins environ 107 k€ de pertes de montée en charge évitées, cf. §4).
    C''est le prix, et je le recommande.


    ### 3. Pourquoi A est écartée


    Le transfert de 2,1 millions de jetons et la fermeture du compte Solda sont **irréversibles à 6 semaines**,
    avec recollecte des empreintes de carte auprès des clients. Une reprise en décembre porterait sur
    31,7 M€ de CA sur six semaines : une perte de 5 points de conversion sur la base récurrente représente
    **1,6 M€**. On engagerait donc 1,6 M€ d''exposition plausible pour gagner 190 k€ sur B — et 420 k€
    sur B recalendée. Le rapport est de l''ordre de 4 à 8 contre 1, du mauvais côté.


    Concrètement : sous A à 100 % du trafic, une heure d''indisponibilité coûte **31,5 k€ et rien ne l''arrête**
    de notre côté. Sous B à 25 %, la supervision détecte en 5 minutes, l''astreinte rebascule en 15 :
    l''exposition est bornée à **2,6 k€**.


    ### 4. Pourquoi B telle qu''elle est rédigée est également écartée


    Dix semaines de paliers achevées avant le 30 novembre placent le passage à 100 % **sur le Black Friday**,
    le jour où Solda lui-même monte à 0,9 % d''échec. B paierait alors 190 k€ de plus que A pour exactement
    la même exposition. Le mérite de B n''est pas la progressivité : c''est de garder les deux comptes
    ouverts pendant le pic.


    Le seul point de comparaison dont nous disposons — le pilote chez un marchand comparable — donne 1,3
    % d''échec pendant trois semaines, soit +0,9 pt. À 100 % du trafic : 6 800 €/jour, **143 k€** sur
    la période. À 25 % : **36 k€**.


    ### 5. B recalendée — le calendrier


    - **Signature Payflux entre le 6 et le 15 octobre.** Signer plus tôt détruit 240 k€ d''optionalité
    : la fenêtre de sortie sans pénalité (90 jours) doit couvrir décembre et se refermer vers le 13 janvier,
    après le pic.

    - **Semaine du 3 novembre : 10 %. Semaine du 10 novembre : 25 %.**

    - **Du 17 novembre au 4 janvier : gel à 25 %.** Aucun changement de palier pendant le Black Friday
    ni décembre. Le pic est servi à 75 % par le prestataire dont nous connaissons la courbe, avec retour
    à 0 % possible en 15 minutes.

    - **Semaine du 5 janvier : 50 %. Semaine du 19 janvier : 100 %.**

    - **Compte Solda maintenu ouvert jusqu''au 28 février** — les six semaines qui suivent la coupure
    totale sont celles où le risque se concentre, et c''est la dernière fenêtre : Solda a écrit qu''il
    n''y aura aucune reconduction au-delà.


    **Levier à la main du comité** : supprimer le mois de février ramène l''an 1 à +105 k€, au prix du
    repli juste après la coupure totale. Je ne le recommande pas.


    ### 6. Le meilleur argument contre ma recommandation


    Le 1,3 % vient d''**un seul** pilote, chez un autre marchand, sur une intégration qui n''est pas la
    nôtre ; Payflux s''engage sur 99,9 % de disponibilité ; et B ajoute dix semaines de double flux —
    deux réconciliations, deux traitements d''impayés — donc son propre risque opérationnel, en pleine
    haute saison. Payer 420 k€ contre un risque peut-être déjà corrigé est contestable.


    Il ne l''emporte pas : la disponibilité contractuelle (99,9 % = 44 min/mois) ne couvre pas le taux
    d''échec, qui est notre vraie variable ; et la complexité de B est bornée et instrumentée, là où le
    mode de défaillance de A ne l''est pas.


    ### 7. Ce qui me ferait basculer sur A


    Que Payflux produise avant vendredi la **courbe journalière brute** du pilote montrant que la dégradation
    était imputable à un défaut d''intégration identifié et corrigé depuis, **et** accepte de porter la
    fenêtre de sortie sans pénalité à 180 jours. Les deux, pas l''un des deux.


    ### 8. Repli et déclencheur, sur l''option retenue


    Si, à un palier quelconque, le taux d''échec Payflux mesuré sur notre trafic dépasse celui de Solda
    de **plus de 0,3 point pendant 3 heures consécutives** : l''astreinte rebascule à 0 % sans validation
    hiérarchique, et le palier est gelé deux semaines. Si le palier à 25 % affiche plus de **0,8 % d''échec
    en soutenu** sur décembre : nous exerçons la sortie sans pénalité avant le 13 janvier et renouvelons
    avec Solda.


    Cette autorité de rebascule est donnée par écrit au responsable d''astreinte, sans escalade et sans
    reproche a posteriori ; aucun palier ne peut être avancé sans son accord. C''est l''équipe qui encaisse
    la panne à 3 h du matin qui tient la manette.


    ### 9. Lundi


    1. **Notifier Solda de la prolongation au mois le mois**, avant le 15 octobre. Cette notification
    est requise **quelle que soit l''option retenue par le comité** : sans elle, décembre se joue sans
    aucun repli, y compris sous A. Faire confirmer par écrit qu''elle préserve l''option sans engagement
    de durée minimale ; à défaut, négocier un préavis mensuel de 15 jours.

    2. **Ouvrir la négociation Payflux** sur trois points : fenêtre de sortie portée à 180 jours, avoirs
    de service au-delà de 0,6 % d''échec, et facturation démarrant au 1er décembre et non à la signature
    (sinon, ajouter 112 k€ à l''an 1).

    3. **Armer le tableau de bord en comparatif par prestataire** avec alerte automatique sur le seuil
    de 0,3 point, avant le premier palier.


    ---


    Deux points hors note, pour vous : le chiffre de 310 k€ du dossier mérite d''être confirmé auprès
    du contrôle de gestion avant vendredi — c''est la seule hypothèse de la note que je n''ai pas pu vérifier,
    et elle est signalée comme telle dans le texte. Et la vraie date limite de ce dossier n''est pas le
    30 novembre mais le **15 octobre** : c''est le seul levier qui expire sans qu''on l''ait utilisé.

    '
