response:
  text: 'Camille, voici les deux choses, rien d''autre.


    ## 1. La date


    **Écris : « le bail prend fin le lundi 15 juin 2026 ».**


    Le calcul, pour que tu puisses le vérifier d''un coup d''œil :


    - Réception par l''agence : jeudi 14 mai 2026

    - Préavis d''un mois → terme au 14 juin 2026

    - Or le 14 juin 2026 tombe un **dimanche**

    - La clause reporte au premier jour ouvrable suivant → **lundi 15 juin 2026** (ce n''est pas un jour
    férié)


    Donc le 2 juin qui est dans ton brouillon est à corriger.


    ## 2. Les trois phrases


    **1)** Suite au décès de ma mère, Mme Yvette Rambert, locataire du logement, survenu le 2 mai 2026,
    je vous écris pour vous notifier la résiliation du bail.


    **2)** Je peux vous restituer les clés à la date qui vous conviendra, mais pas avant la fin du préavis
    : je n''aurai pas terminé de vider le logement d''ici là, et je préfère vous en informer dès à présent.


    **3)** Je vous remercie de bien vouloir me confirmer la bonne réception de ce courrier, ainsi que
    de m''adresser le solde du dépôt de garantie de 780 euros que vous détenez.


    ---


    Un seul point, à regarder demain si tu en as la force, sans que ça bloque l''envoi : le 14 mai 2026
    est un jeudi férié (Ascension). Si jamais l''agence te redonne une autre date d''accusé de réception,
    la date de fin se décale d''autant — le raisonnement reste le même, tu ajoutes un mois et tu reportes
    au jour ouvrable suivant si ça tombe un week-end ou un férié.


    Courage pour demain matin.

    '
