response:
  text: '# NOTE DE DIRECTION — DÉCISION ARBITRÉE, EXÉCUTOIRE EN MON ABSENCE


    **De :** le directeur général

    **À :** directeur financier, directeur commercial, directeur industriel, DRH

    **Date :** 8 août 2026

    **Objet :** Offre d''exclusivité du distributeur D — décision, mandat de négociation, plan d''exécution

    **Statut :** cette note vaut décision. Elle n''est pas un cadre de délibération. Je serai injoignable
    du 9 au 30 août.


    ---


    ## 1. La décision


    **Nous ne signons pas le contrat d''exclusivité de trois ans. Cette décision est prise, elle est la
    mienne, elle n''est pas rouverte en mon absence.**


    Nous ne refusons pas D pour autant. Vous adressez à D, **avant le vendredi 14 août 18h**, une contre-proposition
    écrite et signable (section 3), dans les limites du mandat de la section 4.


    Si D accepte la contre-proposition ou une variante restant dans le mandat : vous signez, sans m''attendre.

    Si D exige l''une des quatre lignes rouges : vous ne signez pas, vous laissez l''offre expirer, et
    vous appliquez le plan de la section 6.


    ---


    ## 2. Pourquoi — trois raisons, dans l''ordre


    **a) L''arithmétique condamne l''offre, même si D tient parole.**


    Une remise de 9 % sur le prix de cession ne coûte pas 9 % : elle coûte 9 points de marge sur une marge
    brute de 31. Notre marge unitaire sur D tombe de 31 à 22 — **elle perd 29 % de sa valeur**. Pour compenser
    par le volume, il faudrait **+41 %**. On nous en propose 18.


    Autrement dit : pour que +18 % de volume paie 9 % de remise, il faudrait que notre marge brute sur
    D soit de **59 %**. Elle est de 31 %. L''écart n''est pas discutable, il est structurel.


    | Scénario | Marge brute sur D | Écart / aujourd''hui |

    |---|---|---|

    | Aujourd''hui (14,9 M€ à 31 %) | 4,62 M€ | — |

    | Année 1, D tient ses +18 % | 3,87 M€ | **−0,75 M€** |

    | Années 2-3, volume stable | 3,28 M€ | **−1,34 M€ / an** |

    | Années 2-3, D refait un −11 % | 2,92 M€ | **−1,70 M€ / an** |


    Sur trois ans : entre 3,4 et 4,2 M€ de marge brute détruite. Nous avons 2,1 M€ de trésorerie.


    DAF : refaites ce calcul avec la marge réelle constatée sur D, pas la moyenne entreprise, et diffusez-le
    au comité **avant le 12 août**. Si la marge réelle sur D est inférieure à 31 % — ce que je crois —
    la conclusion se durcit. Elle ne peut s''inverser que si elle dépasse 59 %, ce qui n''arrivera pas.
    **Ce chiffrage ne rouvre pas la décision ; il documente le refus.**


    **b) Le contrat est asymétrique dans ses engagements et dans sa réversibilité.**


    Nous nous engageons fermement 36 mois, sous peine de 1,2 M€. D s''engage fermement 12 mois, et « indicativement
    » ensuite. Au deuxième trimestre, D a retiré 11 % de commandes sans préavis : nous savons donc exactement
    ce que vaut un volume indicatif.


    C''est le point décisif : **le déréférencement du 20 août est réversible, l''exclusivité de trois
    ans ne l''est pas.** Une référence perdue en août peut être reprise à une séance ultérieure, ou remplacée
    par un autre canal. Une exclusivité signée nous interdit contractuellement, pendant trois ans, les
    deux seules sorties que nous ayons — la centrale régionale et la marketplace — et facture 1,2 M€ le
    droit de nous raviser. Nous ne troquons pas une option réversible contre un verrou irréversible.


    **c) Le calendrier est une manœuvre, et je ne veux pas qu''elle réussisse.**


    D avance son comité, impose huit jours, menace quatre références sur huit, et demande à venir exposer
    ses arguments devant un comité de direction dont il sait la division — pendant l''absence du dirigeant.
    Ce n''est pas un hasard de planning, c''est un dispositif. La bonne réponse à une urgence fabriquée
    n''est ni de céder ni de s''indigner : c''est de répondre dans le délai, mais sur notre contenu.


    ---


    ## 3. Ce que vous proposez à D


    Un accord de partenariat renforcé, sans exclusivité, en six points. Il est conçu pour être acceptable
    par un acheteur qui croit réellement à ses volumes :


    1. **Durée : 12 mois**, reconductible expressément, au lieu de 36.

    2. **Remise indexée sur le volume réellement livré, et sur les seuls volumes incrémentaux** : 0 %
    jusqu''au volume N-1 ; 4 % sur la tranche entre +8 % et +18 % ; **9 % sur toute la tranche au-delà
    de +18 %**. Versée en fin de trimestre sur constat. Nous payons la remise avec la marge que le volume
    nous apporte — pas avant.

    3. **Pas d''exclusivité.** Au maximum, un engagement de non-commercialisation auprès des enseignes
    déjà servies par D, avec réserve écrite et explicite pour la vente directe, la marketplace et les
    centrales hors périmètre de D.

    4. **Symétrie** : si D descend sous le volume de référence, la remise s''éteint pour le trimestre
    concerné et l''accord devient résiliable sans indemnité.

    5. **Préavis réciproque de trois mois** sur tout déréférencement ou toute modification de gamme. C''est
    la réponse directe au −11 % du deuxième trimestre, et c''est non négociable dans son principe.

    6. **Maintien des huit références** sur la durée de l''accord.


    Argumentaire à tenir, une phrase : *nous sommes prêts à payer la croissance au prix qu''elle vaut,
    dès qu''elle est constatée ; nous ne sommes pas prêts à payer d''avance une croissance indicative.*


    ---


    ## 4. Mandat de négociation et lignes rouges


    **Vous pouvez signer sans moi** tout accord qui respecte simultanément : durée ≤ 12 mois · aucune
    clause d''exclusivité · remise ≤ 5 % en moyenne pondérée, portant uniquement sur les volumes incrémentaux
    · indemnité de sortie ≤ 150 k€ · préavis réciproque ≥ 2 mois.


    **Quatre lignes rouges. Aucune n''est franchissable en mon absence, quel qu''en soit le prix affiché
    :**


    1. Toute forme d''exclusivité, de droit ou de fait, y compris déguisée en « priorité », « préférence
    » ou « premier refus ».

    2. Toute durée ferme supérieure à 12 mois.

    3. Toute remise appliquée à la base de volume existante.

    4. Toute indemnité de sortie supérieure à 150 k€.


    Si D exige l''une des quatre : la réponse est non, et c''est **ma** décision, pas la vôtre. Vous le
    dites ainsi à D. Vous n''avez ni à la défendre ni à vous en excuser.


    **Signature :** double signature DAF + directeur commercial requise. En cas de désaccord entre vous,
    la règle par défaut est : **on ne signe pas.** Le non est la position protégée.


    **Répartition des rôles, et elle est délibérée :** le **DAF** pilote la relation contractuelle avec
    D et porte la contre-proposition. Le **directeur commercial** pilote l''ouverture des canaux alternatifs
    et en répond au 30 août. Chacun de vous a écrit sa position ; chacun reçoit le mandat qui la met à
    l''épreuve. Ce dossier ne se réglera pas par un vainqueur interne.


    ---


    ## 5. La visite de l''acheteur de D


    Elle a lieu, mais pas dans le format demandé.


    - **Pas de présentation devant le comité de direction.** Deux interlocuteurs : DAF et directeur commercial.
    Rien d''autre.

    - Format négociation, **ordre du jour envoyé par nous** 48h avant, notre contre-proposition remise
    en séance.

    - **Aucune décision, aucun engagement oral, aucune indication de position interne** en séance. Formule
    à employer : « le comité de direction n''a pas mandat pour délibérer d''un engagement pluriannuel
    en l''absence du directeur général. » C''est vrai, c''est écrit, et cela clôt le sujet.

    - Compte rendu écrit dans les 24h, diffusé aux quatre destinataires de cette note.

    - **Demandez par écrit, courtoisement, que D confirme par écrit le lien entre absence de signature
    et déréférencement des quatre références.** Formulation : « afin que nous puissions anticiper nos
    plans de charge industriels. » Cette confirmation, ils la donneront ou ne la donneront pas ; dans
    les deux cas nous y gagnons.


    ---


    ## 6. Le 20 août, et ce que vous faites ensuite


    **Scénario A — D accepte ou amende dans le mandat.** Vous signez. Vous m''informez par écrit. Vous
    exécutez quand même les chantiers de la section 7 : la diversification n''est plus conditionnelle.


    **Scénario B — D déréférence quatre références (issue la plus probable, ~60 %).** Vous ne rappelez
    pas D, vous ne surenchérissez pas, vous ne relancez pas avant mon retour. Vous activez le plan de
    charge Redon (section 7, point 4). Un courrier bref, courtois, sans reproche, actant la décision et
    laissant la porte ouverte, part le 21 août. Nous reprendrons la discussion depuis une position moins
    contrainte.


    **Déclencheurs de repli — chiffrés, à surveiller chaque semaine :**


    | Déclencheur observable | Action immédiate |

    |---|---|

    | Trésorerie < 1,6 M€ | Tirage de la ligne bancaire, gel des capex non engagés et des recrutements
    |

    | Plan de charge Redon < 75 % sur 4 semaines glissantes | Activation des leviers de charge avant tout
    chômage partiel |

    | Plan de charge < 70 % | Procédure chômage partiel, information CSE sous 48h |

    | D conditionne oralement d''autres références | Consignation écrite immédiate, note à l''avocat,
    aucune réaction commerciale |


    **Arbitre d''exception :** pour tout événement hors mandat et hors scénarios ci-dessus, l''arbitrage
    revient au président / actionnaire de référence, que j''informe aujourd''hui. Il ne peut pas lever
    les quatre lignes rouges.


    ---


    ## 7. Les six chantiers, sous huit jours


    | # | Chantier | Responsable | Échéance |

    |---|---|---|---|

    | 1 | **Marketplace : ouverture effective**, pas étude. Objectif de plan retenu : **0,4 M€** (borne
    basse). La borne haute de 2,2 M€ ne finance aucune décision. | Dir. commercial | Contrat signé au
    29 août |

    | 2 | **Centrale régionale : demander une lettre d''intention non engageante ou un pilote partiel**
    dès septembre, sans attendre les cinq mois. Coût de la demande : nul. | Dir. commercial | Contact
    pris au 14 août |

    | 3 | **Chiffrer les 4 références menacées** : CA, marge, volume, part du plan de charge de Redon,
    substituabilité. | DAF + dir. industriel | 12 août |

    | 4 | **Plan de charge Redon** : identifier le volume exact qui fait passer sous 70 %, et les leviers
    avant chômage partiel (façonnage pour tiers, MDD, avancement de maintenance, lissage des congés).
    | Dir. industriel | 18 août |

    | 5 | **Sécuriser une ligne de financement court terme (1,5 M€, découvert ou affacturage)**, maintenant,
    sur les comptes actuels qui sont bons. On négocie une ligne quand on n''en a pas besoin. | DAF | Accord
    de principe au 29 août |

    | 6 | **Note juridique** sur le déréférencement brutal et sur l''exclusivité au regard de la dépendance
    économique (L. 442-1 II c. com.). À constituer, **à ne jamais brandir** en négociation. | DAF | 29
    août |


    ---


    ## 8. Redon, et ce qu''on dit aux équipes


    L''argument le plus sérieux en faveur de la signature est le seul que je respecte : +18 % de volume
    soutient le plan de charge et protège 52 postes. Je le prends au sérieux et je le rejette pour cette
    raison précise — **cette protection est ferme 12 mois et se paie 24 mois de dépendance sans issue.**
    Signer, c''est acheter un hiver de charge d''usine et arriver au suivant avec moins de trésorerie,
    moins de marge et aucune alternative. Le risque n''est pas supprimé, il est déplacé vers le moment
    où nous serons le plus faibles pour l''affronter.


    DRH : information du CSE dès que le chiffrage du point 3 est disponible, et **avant** toute rumeur.
    Message aux équipes de Redon, court, factuel : nous avons refusé un contrat qui aurait dégradé notre
    marge et notre indépendance commerciale ; nous ouvrons deux canaux nouveaux ; s''il y a chômage partiel,
    il sera dit à l''avance, avec ses dates. Le silence coûtera plus cher que la mauvaise nouvelle.


    ---


    ## 9. Ce qui me ferait changer d''avis — et ce que vous faites dans ce cas


    Je le mets par écrit pour que vous n''ayez pas à l''improviser.


    **Une seule observation change la donne** : si le chiffrage du point 3 démontre que la perte des quatre
    références fait passer Redon **sous 70 % dès septembre**, et que le point 4 établit qu''**aucun levier
    de charge** ne le compense.


    Dans ce cas seulement, le mandat de la section 4 s''élargit ainsi : durée portée à **18 mois**, remise
    portée à **9 % mais toujours sur les seuls volumes incrémentaux**, à la condition écrite et expresse
    que D maintienne les huit références sur toute la durée. **Les lignes rouges 1 et 4 restent intactes
    : pas d''exclusivité, pas d''indemnité supérieure à 150 k€.** Aucune configuration ne justifie de
    vendre notre accès au marché pour trois ans.


    À l''inverse : si D refuse jusqu''à discuter les points 3, 4 et 5 de notre contre-proposition, notez-le
    et transmettez-le-moi. Cela signifiera que l''objet réel de ce contrat n''était pas le volume, mais
    le verrou — et cette information vaut, à elle seule, le risque que nous prenons cette semaine.


    ---


    ## 10. Première action


    **Lundi 10 août, 9h :** DAF et directeur commercial finalisent la contre-proposition sur la base de
    la section 3 et fixent la date de la rencontre avec l''acheteur de D. Envoi à D **au plus tard le
    vendredi 14 août 18h** — deux jours avant l''expiration du délai, pour que le retard ne soit jamais
    notre argument.


    Vous avez un mandat clair, des limites écrites et des déclencheurs chiffrés. Vous n''aurez à improviser
    sur rien d''essentiel. Si D vous met la pression, renvoyez-la vers cette note : le refus est signé
    de ma main, il ne vous engage pas personnellement, et il n''est pas négociable en mon absence.


    Je rentre le 30 août. Je reprendrai le dossier en direct à cette date.


    *Le directeur général*


    ---


    **Annexe — hypothèses du calcul.** Marge brute de 31 % supposée homogène entre D et le reste du portefeuille
    (à corriger par le point 3 du DAF). Coûts directs supposés proportionnels au volume. L''effet d''absorption
    des charges fixes par le volume incrémental n''est pas intégré : à 22 % de marge, les 2,68 M€ de CA
    additionnels apportent environ 0,59 M€ de contribution, contre 1,34 M€ de remise consentie sèche sur
    la base existante — l''écart de 0,75 M€ ne se referme sous aucune hypothèse d''absorption réaliste.
    Non chiffré non plus : le besoin en fonds de roulement supplémentaire induit par +11 % d''activité
    globale, de l''ordre de 0,2 à 0,3 M€, qui aggrave la conclusion.

    '
