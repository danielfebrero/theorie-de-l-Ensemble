response:
  text: '# Note au comité de direction


    **Objet :** Contrat cellules 2027 — arbitrage Kelmar / Sinolux

    **De :** Direction des opérations · **Date :** lundi · **Décision demandée :** J+18


    ---


    ## 1. Décision proposée


    **Répartition 75 / 25 : réservation ferme Kelmar 54 000 cellules à J+18, commande Sinolux 18 000 cellules
    à J+21.** Pas de bascule complète. Pas de dépense de 34 000 € au laboratoire Vertex.


    ## 2. Les 230 400 € ne sont pas une économie, c''est un écart de prix d''achat


    L''écart de 3,20 € par cellule est intégralement consommé par 1 124 retours supplémentaires (205 €
    pièce), soit **1,56 point de taux de retour**. Kelmar étant à 1,3 %, le point mort Sinolux se situe
    entre **2,86 %** (si le remplacement gratuit ne réduit pas les 205 €) et **3,22 %** (si l''on crédite
    la cellule offerte, 22,80 €, soit 11 % du coût d''un retour).


    Coût complet du contrat, 100 % Sinolux, selon le taux réel :


    | Taux de retour Sinolux | Coût total | vs 100 % Kelmar (2 063 880 €) |

    |---|---|---|

    | 1,1 % (essais Sinolux) | 1 785 900 € | **+278 000 €** |

    | 3,1 % (audit de mars) | 2 048 300 € | +15 600 € |

    | 5,0 % (dérive plausible) | 2 297 500 € | **−234 000 €** |


    Au chiffre indépendant dont nous disposons, la bascule complète rapporte 15 600 € et non 230 400 €.
    Le montant inscrit au budget doit être reclassé en **provision pour risque retours**, pas en économie
    acquise.


    ## 3. Nous avons deux sources, pas trois


    Le cabinet Ferro travaille sur l''échantillon de l''audit de mars : ce n''est pas une confirmation,
    c''est la même mesure lue deux fois. Restent un chiffre du vendeur (1,1 %) et une mesure indépendante
    (3,1 %).


    **L''information la plus solide du dossier n''est pas un chiffre, c''est une position contractuelle
    :** Sinolux refuse l''indexation sur le taux de retour et accepte de remplacer la cellule. Il prend
    en charge les 22,80 € et refuse les 182 €. Si ses 1,1 % étaient fondés, l''indexation ne lui coûterait
    presque rien. Il price son propre risque à l''inverse de ce qu''il annonce.


    ## 4. Le test Vertex ne peut pas trancher 2027


    Résultat à J+63, après la date ferme Kelmar (J+18) et après l''expiration du prix Sinolux (J+21) :
    il arrive quand tout est signé. Sa précision (±0,3 point) recouvre par ailleurs toute la bande de
    point mort 2,86–3,22 %, et le vieillissement accéléré mesure une durée de vie, pas un taux de retour
    terrain.


    **La tranche de 18 000 cellules est un meilleur test, et elle est gratuite** : précision d''environ
    ±0,13 point sur la grandeur qui pilote réellement les 205 €, contre ±0,3 point pour 34 000 €.


    ## 5. Économie de l''option retenue


    | Taux Sinolux constaté | Résultat du 75/25 vs 100 % Kelmar |

    |---|---|

    | 1,1 % | +69 500 € |

    | 3,1 % | +3 900 € |

    | 5,0 % | **−58 400 €** |


    Le pire cas est plafonné à environ 58 000 € et il est encaissé par le compte de résultat 2027, pas
    par la continuité d''approvisionnement. C''est le prix d''une qualification fournisseur qui ouvre
    2028 sur volume complet.


    ## 6. Demandes à porter avant J+21


    - **Kelmar :** bande de flexibilité volume ±20 % sur la réservation. Contrepartie honnête : nous lui
    garantissons la majorité ferme dès J+18 plutôt qu''un appel d''offres contesté.

    - **Sinolux :** traçabilité lot/série sur les 18 000 cellules (condition non négociable, sans quoi
    la tranche ne mesure rien) ; prix 22,80 € verrouillé pour 2028 si le terrain confirme ≤ 2,5 % ; **et
    qu''il finance lui-même le test Vertex.** Sa réponse à cette dernière demande vaut mesure : 34 000
    € sont dérisoires pour un fournisseur convaincu de ses 1,1 % face à un contrat de 1,6 M€.


    ## 7. Repli et déclencheurs observables


    - Retours sur lot Sinolux **> 2,9 %** après 6 000 unités livrées → arrêt de l''introduction Sinolux,
    bascule du reliquat sur la bande de flexibilité Kelmar, aucun volume Sinolux en 2028.

    - **Tout mode de défaillance absent du parc Kelmar** (échauffement, gonflement, défaut précoce) →
    arrêt immédiat quel que soit le taux.

    - Si Kelmar refuse la bande de flexibilité, la tranche Sinolux est ramenée à 10 000 unités.

    - **Si Sinolux refuse la commande partielle : 100 % Kelmar.** Un gain espéré de 15 600 € ne justifie
    pas une queue de risque à −234 000 €.


    ## 8. Ce qui renverserait cette décision


    Une mesure indépendante du taux de retour, sur un échantillon et une ligne distincts de l''audit de
    mars, situant Sinolux à **2,3 % ou moins** — ou l''acceptation par Sinolux d''une clause indexée plafonnée
    à 300 000 €. L''un ou l''autre me fait passer à Sinolux majoritaire immédiatement.


    ## 9. Ce que nous ne pouvons pas faire


    Laisser filer la ligne Kelmar au J+18. Le lancement ne se reporte pas, la production démarre à J+70,
    et aucune capacité alternative n''existe avant la fin de l''année. Découvrir à J+60 que Sinolux est
    à 4 % sans ligne de repli n''est pas un mauvais résultat financier : c''est une rupture d''approvisionnement
    sur un contrat client engagé. C''est la seule branche du dossier dont on ne revient pas, et elle interdit
    la bascule complète indépendamment du calcul d''espérance.


    ---


    **Première action, aujourd''hui :** appel à Kelmar pour ouvrir la négociation de la bande de flexibilité,
    et courrier à Sinolux portant les trois demandes du §6. Réservation Kelmar signée au plus tard J+17.


    ---


    *Deux points d''hypothèse à valider avant signature : (a) le forfait de 205 € est décrit comme « tout
    compris » — s''il n''inclut pas la valeur de la cellule, le point mort tombe à 2,86 % et l''écart
    au chiffre de l''audit se creuse ; (b) la « réservation de capacité » Kelmar est supposée engager
    un volume, pas un droit de tirage — à confirmer, c''est ce qui conditionne la faisabilité du 75/25.*

    '
