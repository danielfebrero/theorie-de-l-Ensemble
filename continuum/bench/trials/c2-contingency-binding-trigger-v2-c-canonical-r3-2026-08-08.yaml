response:
  text: '# Note au comité de direction — 14 août 2026


    **Objet :** prestataire de paiement. Le contrat Solda expire le 30 novembre.

    **De :** direction des opérations


    ---


    ## Recommandation


    **Option B, avec un calendrier re-phasé autour du pic de fin d''année.** La décision se prend **lundi
    17 août**, pas en octobre : la date contraignante de ce dossier n''est pas le 30 novembre, c''est
    le **15 octobre**, dernier jour pour prolonger Solda au mois le mois.


    ## Le chiffre qui tranche


    Payflux garantit 99,9 % de disponibilité : **8,8 heures d''indisponibilité autorisées par an, 17,5
    heures sur les 24 mois d''engagement.** Au volume moyen de Vireo (756 k€/jour, soit 31,5 k€/heure),
    ces 17,5 heures valent **552 k€**.


    L''avantage complet de l''option A sur l''option recommandée est de **500 k€ sur 24 mois**.


    Le contrat de Payflux autorise donc, sans que Payflux soit un instant en faute, une indisponibilité
    qui coûte plus cher que tout ce que l''option A fait gagner. Et l''option A concentre cette exposition
    sur les heures les plus chères de l''année.


    ## Coût complet sur 24 mois (déc. 2026 – nov. 2028)


    | Poste | Renouveler Solda | Option A | **Recommandation** |

    |---|---:|---:|---:|

    | Frais prestataire | 2 800 k€ | 1 800 k€ | 1 800 k€ |

    | Prolongation Solda déc.–fév. | — | — | 390 k€ |

    | Double run (nov. → fév.) | — | — | 180 k€ |

    | Surcoût d''échec au rodage | — | 71 k€ | 11 k€ |

    | Écart d''échec récurrent (+0,1 pt) | — | 276 k€ | 263 k€ |

    | **Total** | **2 800 k€** | **2 147 k€** | **2 644 k€** |

    | Économie vs renouvellement | — | 653 k€ | 156 k€ |


    *Hypothèse retenue : la moitié des paiements échoués est récupérée par relance ou moyen alternatif.*


    **Deux corrections au dossier.** Les 500 k€ d''économie annoncés sont bruts : Payflux se stabilise
    à 0,5 % d''échec contre 0,4 % chez Solda, et ces 0,1 point coûtent 138 k€ de volume par an. L''économie
    récurrente réelle est de **~362 k€/an, pour les deux options**. Par ailleurs, les 310 k€ affichés
    pour l''option B n''intègrent pas la prolongation Solda (390 k€), sans laquelle l''option B n''a aucun
    retour arrière après le 30 novembre. Le tableau ci-dessus la compte.


    ## Pourquoi l''option A est écartée


    Une bascule le 3 novembre place le vendredi noir au **25ᵉ jour** d''exploitation. La seule mesure
    existante de Payflux — 1,3 % d''échec pendant trois semaines chez un marchand comparable — dit que
    le rodage dure 21 jours. Trois jours de marge. Personne n''a jamais mesuré Payflux sous charge de
    pic, alors que Solda, lui, double son taux d''échec ce jour-là (0,4 % → 0,9 %) : la dégradation sous
    pic est un fait établi, pas une hypothèse pessimiste.


    Surtout : sans prolongation, le compte Solda ferme le 30 novembre. À partir du 1ᵉʳ décembre, **il
    n''existe plus de retour arrière** — six semaines de délai et une recollecte d''empreintes auprès
    de 2,1 millions de porteurs. Six semaines de décembre-janvier sans rail carte, c''est 32 M€ de volume
    exposé et une perte définitive d''une part du parc de cartes enregistrées. Ce n''est pas un mauvais
    tirage, c''est une branche dont on ne revient pas.


    ## Calendrier


    | Échéance | Action |

    |---|---|

    | **Avant le 15 oct.** | Notification écrite à Solda : prolongation mensuelle 1ᵉʳ déc. → 28 fév. Plafond
    390 k€. |

    | 3 nov. / 17 nov. | 10 % puis 25 % du trafic sur Payflux. |

    | **24 nov. → 31 déc.** | **Gel à 25 %.** Aucune modification de configuration pendant le pic. |

    | 5 janv. / 12 janv. | 50 % puis 100 %. |

    | 24 janv. | Fin de la fenêtre de sortie gratuite. Arbitrage formel : on garde ou on sort à 0 €. |

    | 31 janv. | Si Payflux ≤ 0,5 % et aucun incident > 15 min depuis le 12 janvier : fermeture Solda
    anticipée, **175 k€ récupérés**. Sinon on conserve le filet. |

    | **28 fév.** | Fermeture Solda. Mur écrit, non reconductible. Tout doit être validé au 1ᵉʳ février.
    |


    Le gel du pic à 25 % coûte moins de 10 k€ : hors vendredi noir, Solda est meilleur que Payflux. En
    échange il nous livre la mesure de Payflux en charge que personne ne possède aujourd''hui — au quart
    du risque.


    ## Repli — déclencheurs observables


    Le tableau de bord rafraîchit toutes les 5 minutes ; l''astreinte bascule le trafic en moins de 15
    minutes **tant que les deux comptes sont ouverts**. C''est précisément ce levier que les 570 k€ achètent.


    - Échec Payflux **> 1,5 % pendant 30 min** → Payflux à 0 %, immédiatement.

    - Échec **> 0,8 % sur 24 h glissantes**, ou taux d''autorisation inférieur de plus de 1 point à Solda
    → palier gelé 7 jours.

    - **Tout incident Payflux > 30 min entre le 24 nov. et le 31 déc.** → Payflux à 0 % jusqu''au 5 janvier.

    - **20 janvier** : échec cumulé à 100 % depuis le 12 janvier supérieur à 0,6 % → sortie à coût nul,
    retour intégral Solda, renouvellement.


    ## Le meilleur argument contre cette note


    *« On paie 570 k€ certains contre un risque dont l''espérance ne dépasse peut-être pas 150 k€. »*
    C''est exact — et c''est le bon achat quand même : on n''assure pas l''espérance, on assure la queue.
    Ces 500 k€ d''écart représentent **0,18 % du volume annuel de Vireo**, soit seize heures de chiffre
    d''affaires. Une seule mauvaise semaine de décembre coûte davantage, et l''option A ne laisse aucun
    moyen de l''interrompre.


    ## Ce qu''on fait lundi 17 août


    1. **Notification Solda envoyée le jour même.** Deux mois d''avance ne coûtent rien et cela supprime
    la seule date qui puisse nous tuer. *(Ops)*

    2. **Négociation Payflux ouverte ; rien n''est signé avant** : (a) départ des 90 jours de sortie gratuite
    à la **mise à 100 %**, ou contrat en deux temps — intégration d''abord, engagement 24 mois ensuite
    ; (b) SLA d''échec contractuel ≤ 0,6 %/mois et ≤ 1,0 % les 21 premiers jours, avec avoirs ; (c) trois
    mois de gratuité (225 k€) en contrepartie des 24 mois. *(Achats + Ops)*

    3. **Vérification bloquante, réponse exigée au 15 septembre :** l''export des 2,1 millions de jetons
    est-il possible **sans** fermeture du compte Solda ? Si la réponse est non, toute la réversibilité
    de ce plan tombe et la recommandation devient : renouveler Solda 12 mois et relancer l''appel d''offres
    en mars avec un pilote réel. *(Ops + juridique)*

    4. **Supervision :** seuils d''alerte ci-dessus paramétrés dans le tableau de bord, astreinte réservée
    du 3 novembre au 24 janvier. *(Supervision paiement)*


    ---


    La pénalité de 240 k€ n''est pas la contrainte de ce dossier : elle vaut moins de six mois d''économie
    et elle s''achète. Un compte Solda fermé le 1ᵉʳ décembre, lui, ne s''achète pas.


    ---


    **Trois points hors note, pour vous :**


    - **Je n''ai pas retenu l''option B telle que rédigée**, mais une variante : gel de la montée pendant
    le pic et prolongation Solda jusqu''au 28 février. Le B du dossier (rampe continue de 10 semaines,
    fin le 12 janvier) laisse le 100 % arriver alors que la fenêtre de sortie gratuite est presque close
    et sans marge avant le mur du 28 février. Si la présidente veut la version « conforme au dossier »,
    c''est défendable, mais dites-lui que ça retire un mois de filet pour 175 k€.

    - **Le point 3 du lundi est réellement bloquant.** Si Solda exige la fermeture du compte pour libérer
    les 2,1 M de jetons, la réversibilité entière du plan tombe — et la bonne décision devient le renouvellement.
    Je n''ai aucune information sur ce point dans le dossier, et c''est la seule inconnue capable de renverser
    la recommandation.

    - **Écriture disque refusée** dans `/tmp/bench-campaign2/work/cell-vWDov2` ; la note est dans le scratchpad
    de session (fichier joint). Dites-moi si vous voulez que je la place ailleurs.

    '
