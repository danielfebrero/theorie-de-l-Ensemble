response:
  text: '## Recommandation au conseil — séance de jeudi


    **Verdict : A maintenu comme socle, B adopté sous encadrement écrit, C rejeté par veto — pas par notation.**


    Je ne demande pas au conseil d''arbitrer entre trois rendements. Je demande de reconnaître qu''une
    seule des trois options comporte une branche dont la caisse ne revient pas.


    ---


    ### 1. Ce que je fais de chaque option


    **A — Statu quo : conservé, mais requalifié.** Neuf ans, ce n''est pas une stratégie, c''est une piste
    d''atterrissage. Le trésorier a raison sur le diagnostic : A seule est une mort lente. Son mérite
    n''est pas le rendement, c''est qu''elle laisse neuf exercices de capacité de décision, pendant lesquels
    on observe, on apprend et on peut changer d''avis. C''est la ressource la plus rare au bilan.


    **B — Diversification 40 % : adoptée, avec cadre.** Pire décile : réserve à 15,8 M€, soit 4,8 M€ au-dessus
    du seuil statutaire. Perte bornée, valorisée quotidiennement, réversible en 48 h. C''est de la variance,
    pas de la ruine. Ordre de grandeur à faire confirmer par l''actuaire : le rendement mixé passe d''environ
    1,8 % à ~3,5 %/an, ce qui repousse le seuil des 11 M€ d''environ neuf ans à quatorze. B n''annule
    pas le problème — elle double le temps disponible pour le traiter.


    Conditions que je demande d''inscrire au règlement financier, avant exécution :

    - plancher de liquidité : jamais moins de douze mois de prestations brutes en souverain/monétaire
    ;

    - réserve < 15,0 M€ → réduction automatique de la poche à 20 %, sans nouveau vote ;

    - réserve < 13,5 M€ → liquidation intégrale de la poche vers le souverain ;

    - exposition maximale à un émetteur unique non coté et non liquidable : **0 %**.


    **C — Souscription structurée : opposition formelle.** Je demande que mon opposition et ses motifs
    soient portés au procès-verbal.


    ---


    ### 2. Pourquoi C est un veto


    La branche à 3 % n''est pas un mauvais tirage. C''est la fin de la caisse.


    4,7 M€ de réserve résiduelle, c''est **sous les 11 M€ : liquidation de plein droit**. Automatique,
    statutaire, sans délibération. 4 200 affiliés de 61 ans de moyenne d''âge, fortement exposés à l''amiante,
    se retrouvent sans couverture — et l''appel d''offres 2025 a établi qu''aucun assureur du marché ne
    les reprend. Il n''y a pas de marché de repli. Il n''y a pas de réassureur, pas de garantie publique,
    pas de seconde manche.


    Un pire cas dont on se relève est de la variance. Un pire cas absorbant est un veto. Les 3 % ne se
    compensent pas par les 88 % : la caisse ne joue pas 10 000 trajectoires, elle en joue une, une seule
    fois, et une des issues supprime le joueur. Moyenner sur des trajectoires dont certaines effacent
    l''entité est une erreur de catégorie, pas un désaccord sur le taux d''actualisation. Le calcul du
    trésorier est exact ; il répond à une autre question que celle posée.


    Quatre points aggravants, indépendants du débat sur l''espérance :


    1. **La distribution est fournie par le vendeur.** Les 88/9/3 émanent de la contrepartie dont ils
    décrivent le défaut. Ce n''est pas une estimation, c''est un argument commercial. Personne autour
    de la table n''a de moyen de l''auditer.

    2. **Un recouvrement à 5 % contredit la notation A−.** Une dette senior non garantie d''un émetteur
    A− récupère historiquement de l''ordre de 40 %. Une hypothèse à 5 % assortie de +14 %/an décrit un
    instrument subordonné ou à effet de levier — pas une exposition au crédit de l''entité notée. Le marché
    facture 14 % pour une raison. Nous ne savons pas laquelle, et c''est précisément le problème.

    3. **La branche « médiocre » à 9 % est ignorée.** Elle immobilise 78 % de la réserve pendant sept
    ans à +2 %/an, sous la dérive des dépenses de 4,3 %, sans sortie. En 2033, la caisse serait en plus
    mauvaise posture qu''avec A, et sans levier. Total des scénarios qui ne résolvent rien : **12 %**,
    pas 3 %.

    4. **Le seuil statutaire devient inobservable.** Avec 78 % de l''actif en titre non coté, le conseil
    perd pendant sept ans la capacité de mesurer sa propre solvabilité. Et il resterait 4,0 M€ liquides
    — la note ne dit pas à combien s''élève le flux annuel de prestations, et je demande ce chiffre avant
    jeudi : il est probable que 4,0 M€ ne couvrent pas un exercice défavorable. Le défaut de liquidité
    arriverait bien avant le défaut de l''émetteur, et il ne serait pas à 3 %.


    Sur « deux caisses comparables ont souscrit l''an dernier » : douze mois de survie sur une note à
    sept ans ne portent aucune information. Et si l''instrument est distribué au secteur mutualiste, l''échec
    serait simultané — cela réduit les chances de sauvetage, cela ne les augmente pas.


    Enfin, un point que les quatre cosignataires doivent connaître avant de voter : engager 78 % de la
    réserve des adhérents dans un titre non coté, illiquide, non garanti et à émetteur unique expose les
    administrateurs à titre personnel. **Je demande qu''un avis juridique indépendant sur la responsabilité
    des administrateurs soit obtenu et communiqué avant le vote de jeudi.**


    ---


    ### 3. Le trésorier a raison sur un point, et il faut le lui donner


    Aucune allocation d''actifs ne peut battre durablement 4,3 % de dérive médicale sur une cohorte amiante
    vieillissante avec 7,4 M€ de coussin. Il l''a vu avant les autres. Il a tort sur l''instrument, pas
    sur l''urgence.


    Le problème est au passif. On tente de le résoudre à l''actif parce que c''est le seul levier que
    le conseil manie seul. Je propose que le trésorier préside le chantier « Solvabilité 2035 », avec
    mandat, budget et calendrier — quatre axes, à ouvrir dans les neuf ans que A et B nous achètent :


    1. **Savoir ce qu''on doit.** Étude actuarielle indépendante de la queue amiante (latence 20–40 ans,
    pic d''incidence encore devant nous). Coût estimé 80–150 k€ face à un actif de 18,4 M€ et une décision
    qui engage la caisse entière. Tant qu''elle n''existe pas, la projection à neuf ans est elle-même
    incertaine — possiblement optimiste.

    2. **Sortir la charge amiante du bilan.** Recensement systématique des affiliés éligibles au FIVA
    et à la branche AT‑MP, actions en faute inexcusable contre les armateurs et chantiers. Un transfert
    légal d''une part de la charge pèse potentiellement plus lourd que tout l''écart de rendement entre
    A et C.

    3. **Mutualiser le risque de pointe.** Comprendre *pourquoi* l''appel d''offres 2025 est resté sans
    réponse — « aucune cotation » signifie souvent « données insuffisantes pour souscrire », pas « inassurable
    à tout prix ». Puis approcher les caisses maritimes comparables pour un pool ou une réassurance mutuelle
    en excédent de sinistre. Les deux caisses qui ont acheté la note ont le même problème et sont de meilleurs
    partenaires que l''émetteur.

    4. **Indexation des cotisations.** L''écart structurel vient de là. Un rattrapage progressif de 1,5
    point par an rapporte davantage que le différentiel A→B, sans aucune branche de ruine.


    Et une option à préparer sans la déclencher : **le transfert solvable choisi**. À 15 M€ de réserve,
    la caisse négocie ; à 11 M€, elle subit une liquidation. La dot est notre pouvoir de négociation.
    C''est exactement ce que la branche défavorable de C détruit.


    ---


    ### 4. Le meilleur argument contre moi


    Il est sérieux, et je le formule intégralement : *« Vous protégez l''institution, pas les adhérents.
    Dans neuf ans ils sont découverts de toute façon. C offre 88 % de chances de régler le problème. Refuser
    un pari favorable à 97 % au nom d''une queue à 3 %, c''est la prudence qui garantit l''échec. Et votre
    plan passif est une liste d''espoirs : aucun assureur n''a coté en 2025, le FIVA prend des années,
    et une population âgée refusera la hausse des cotisations. »*


    Ce qu''il change : je ne peux pas garantir que le plan passif aboutisse, et je ne le prétendrai pas
    devant le conseil. Ce qu''il ne change pas : l''asymétrie. Si mon plan échoue, nous le constatons
    progressivement, avec plus d''information, encore 13–15 M€ au bilan, et la possibilité de revoir la
    décision chaque année — y compris celle d''un transfert négocié. Si C échoue, il n''y a pas de « ensuite
    ». Et la logique du trésorier, si le conseil l''adopte, ne s''arrêtera pas à 2033 : reconduite à chaque
    échéance, elle atteint la ruine avec une probabilité qui tend vers 1.


    ---


    ### 5. Ce sur quoi j''engage la caisse


    - **Ce que je fais :** je vote A+B encadrés, je vote contre C, et je ne signe pas la souscription.
    Si le conseil adopte C, je demande l''inscription au PV de mon opposition motivée et je remets mon
    mandat de direction — je ne conduirai pas l''exécution d''une décision qui place la totalité de la
    couverture des adhérents sur un titre dont on ne peut pas sortir.

    - **Repli et déclencheur :** les seuils automatiques de dé-risquage de B (15,0 M€ / 13,5 M€), sans
    nouveau vote. Si la réserve passe sous 15 M€ pour cause de dérive et non de marché, ouverture immédiate
    du dossier de transfert négocié.

    - **L''observation qui me ferait changer d''avis sur C :** la documentation complète et non fournie
    par l''émetteur — rang de la créance, sûretés, levier, comptes audités —, une analyse crédit indépendante
    confirmant qu''il s''agit d''un senior non garanti de l''entité A− avec recouvrement normal, un avis
    juridique confirmant la conformité aux statuts, **et** un mécanisme de sortie. Si ces quatre pièces
    existaient, le titre ne servirait pas 14 %. Je le dis comme un test, pas comme une certitude : qu''on
    demande les pièces à l''émetteur avant jeudi.

    - **Première action, dès demain :** demande écrite à l''émetteur du prospectus complet et des comptes
    audités ; commande de l''avis juridique sur la responsabilité des administrateurs ; production du
    flux annuel de prestations et de la couverture de liquidité, à distribuer avec l''ordre du jour.


    Le rôle du conseil n''est pas de maximiser un rendement espéré. C''est de garantir qu''en 2035, quelqu''un
    paie encore les soins de 4 200 personnes que personne d''autre ne veut assurer. Toute option comportant
    une branche où cette phrase devient fausse est hors du mandat, quel que soit son espérance.

    '
