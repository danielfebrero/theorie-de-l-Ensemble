  text: 'L''écriture du fichier n''a pas été autorisée — voici la note directement, prête à copier.


    ---


    # NOTE DE DÉCISION — Prestataire de paiement


    **De :** Direction des opérations · **À :** Présidente du comité de direction · **Date :** 14 août
    2026


    ## Recommandation


    **Option B, calendrier avancé.** Bascule progressive à partir du 21 septembre, 100 % du trafic le
    2 novembre, compte Solda maintenu ouvert en secours chaud jusqu''au 31 décembre.


    C''est la même date de bascule complète que l''option A. La différence tient en une ligne : sous A,
    le compte Solda est fermé le 3 novembre et il n''existe plus de retour arrière pendant les deux mois
    qui font l''année. Sous B recalé, l''astreinte ramène 100 % du trafic sur Solda en quinze minutes,
    y compris le vendredi noir.


    ## Les chiffres (an 1)


    | | |

    |---|---|

    | Renouvellement Solda (référence) | 1,40 M€ |

    | Payflux | 0,90 M€ → **500 k€ d''économie brute** |

    | Double run 21 sept – 31 déc (3,3 mois × 45 k€) | − 150 k€ |

    | Prolongation Solda, décembre au mois | − 130 k€ |

    | **Économie nette recommandée** | **≈ 220 k€** (contre 500 k€ sous A) |


    **Écart : 280 k€.** Soit 0,6 % du chiffre d''affaires de novembre-décembre qu''il protège (≈ 46 M€
    au volume moyen, davantage en pic). À partir de l''an 2, les deux options valent exactement la même
    chose : 500 k€/an.


    ## Pourquoi pas A


    Le pilote Payflux mesure 1,3 % d''échec pendant trois semaines. Une bascule le 3 novembre place la
    fin de cette fenêtre au 24 novembre — **trois jours avant le vendredi noir**, sans marge, et ce pilote
    a été mesuré à volume normal, pas en pic. Solda lui-même double son taux d''échec ce jour-là (0,4
    % → 0,9 %). A demande à un rail neuf de tenir son 25ᵉ jour d''exploitation le jour le plus chargé
    de l''année.


    Ce n''est pas le coût moyen qui condamne A : 0,9 point d''échec sur trois semaines représente environ
    140 k€ de paiements bloqués, en partie récupérés par relance. C''est l''absence de sortie. Une fois
    les jetons transférés et Solda fermé, la seule voie de retour est six semaines de délai **plus** une
    recollecte des empreintes auprès de 2,1 millions de clients — et cette recollecte ne se rattrape pas.
    Par ailleurs, une disponibilité contractuelle de 99,9 % autorise 8 h 45 d''indisponibilité par an
    ; concentrées sur le vendredi noir, elles coûtent à elles seules davantage que l''économie de A et
    n''ouvrent qu''un avoir.


    Vireo dispose d''un tableau de bord à 5 minutes, d''une astreinte 24/7 et d''un rééquilibrage en 15
    minutes — outils qui ne fonctionnent **que si les deux comptes sont ouverts**. L''option A consiste
    à éteindre ce dispositif juste avant le pic.


    ## Calendrier


    - **Semaine du 24 août** — signature Payflux (conditions ci-dessous) ; intégration en bac à sable
    en septembre.

    - **Avant le 15 octobre, et dès lundi** — notifier à Solda la prolongation au mois le mois. Seule
    date irréversible du dossier.

    - **21 sept 10 % · 5 oct 25 % · 19 oct 50 % · 2 nov 100 %**, ce dernier palier sous condition : ≤
    0,6 % d''échec sur les deux semaines à 50 %, aucun incident majeur, latence dans la bande Solda.

    - **20 nov – 5 janv** — gel de toute modification de la chaîne de paiement. Solda ouvert en secours
    chaud.

    - **Janvier** — transfert final des jetons et clôture Solda, six semaines avant la butée du 28 février.


    ## Trois conditions à la signature


    1. **Fenêtre de sortie gratuite comptée à partir du premier trafic de production**, non de la signature.
    Sans cela elle expire le 15 novembre, avant la période qu''elle est censée couvrir, et les 240 k€
    redeviennent une exposition sèche.

    2. **Engagement écrit sur l''accompagnement de montée en charge** et un recours opérationnel sur la
    disponibilité. Un avoir n''est pas un recours.

    3. **Condition suspensive, à lever lundi.** Payflux et Solda doivent confirmer par écrit sous cinq
    jours ouvrés que les jetons peuvent être provisionnés chez Payflux tout en restant valides chez Solda.
    Si ce n''est pas possible, aucune bascule progressive n''existe : on prolonge Solda de décembre à
    février (390 k€) et on bascule d''un bloc le 12 janvier, hors saison — 110 k€ d''économie an 1, zéro
    exposition au pic.


    ## Repli et déclencheur


    Taux d''échec Payflux > 1,5 % sur trois relevés consécutifs, **ou** taux d''autorisation inférieur
    de 2 points à celui de Solda sur 30 minutes à mix comparable → l''astreinte ramène Payflux à 0 % en
    15 minutes, **sans validation hiérarchique**. Je demande au comité d''acter formellement cette autorité
    unilatérale : elle ne vaut rien si quelqu''un doit demander la permission un vendredi soir. Deux déclenchements
    dans la même semaine → le palier n''est pas relevé sans repasser devant le comité.


    ## Ce qui renverserait la recommandation


    Si, au 12 octobre, Payflux tourne sous 0,6 % d''échec à 25 % du trafic avec une latence dans la bande
    Solda, le 2 novembre devient une bascule complète en avance : même date que A, économie quasi pleine,
    et la prolongation Solda ne sert plus que de secours d''un mois. **Cette recommandation ne renonce
    pas aux 500 k€ ; elle en conditionne l''encaissement à une preuve que nous n''avons pas encore.**


    ## Lundi 17 août


    1. Courrier à Solda : prolongation au mois le mois, prix confirmé, butée du 28 février actée, sans
    engagement de durée minimale.

    2. Question écrite aux deux prestataires sur la coexistence des jetons — réponse exigée sous cinq
    jours ouvrés.

    3. Term sheet Payflux avec les trois conditions ; aucune signature avant.

    4. Supervision paiement : seuils d''alerte par prestataire, procédure de repli écrite, exercice de
    bascule à blanc avant tout trafic réel.


    ---


    **Le meilleur argument contre ma recommandation**, que je n''ai pas mis dans la note mais que la présidente
    peut soulever : le 1,3 % du pilote n''est pas une propriété de Payflux, c''est un artefact de réglage
    (routage, 3DS, logique de relance) chez un marchand qui n''est pas nous — une intégration soignée
    en septembre-octobre ferait démarrer la bascule du 3 novembre à 0,5 %, pas à 1,3 %, et B fait tourner
    deux rails pendant le pic, ce qui double la surface d''incident au pire moment. Il tient sur le taux
    d''échec, et c''est pourquoi le calendrier que je propose burn justement la fenêtre de rodage en septembre-octobre.
    Il ne bascule pas la décision, parce qu''il ne dit rien du seul point qui la fonde : sous A, si le
    réglage est mauvais, on ne le corrige pas — il n''y a plus de rail de secours, et le chemin de retour
    passe par 2,1 millions de clients.


    Si vous voulez, je peux réécrire la note dans un fichier ou la rendre en page imprimable — il me faudra
    juste l''autorisation d''écriture.

    '
