response:
  text: '## Les trois lignes


    ```

    1) MAINTENANT: commander roue Nantes, transport nuit. B2 réduite à 4 MW, 2 gaz à fond. Vib doit tomber
    <10 sous 30 min.

    2) Vib ≥11,5 ou en hausse: ARRÊT B2 immédiat, aucun redémarrage. Sinon arrêt planifié 05h00 pour pose
    roue.

    3) Si départ bout de réseau <45°C: délester logements, priorité hôpital+EHPAD; prévenir les 2 sites
    + astreinte.

    ```

    (119, 107 et 112 caractères)


    ## Pourquoi ces lignes-là


    **Ce qui est irréversible ici n''est pas la panne, c''est la casse.** Neuf jours d''arrêt, oui — mais
    surtout : la roue de rechange n''est utilisable que si B2 est arrêtée *avant* d''avoir cassé. Casser
    détruit le chemin de réparation à 14 h. C''est la seule branche de la nuit qui supprime une option
    au lieu de coûter cher, et je ne serai pas joignable pour la rattraper. Tout le reste du texte sert
    à ne pas y arriver en aveugle.


    **Pourquoi ne pas arrêter B2 tout de suite.** Le délai de 14 h court depuis la *commande*, pas depuis
    l''arrêt : la roue arrive vers midi que B2 s''arrête à 21 h 40 ou à 5 h. Arrêter maintenant ne fait
    rien gagner sur la remise en service et cède le pic de −14 h à 4 h contre rien. La commande immédiate,
    elle, est le seul geste qui avance vraiment la réparation — d''où sa place en tête de ligne 1.


    **Pourquoi ne pas la laisser à 7 MW non plus.** Le constructeur situe la casse entre 6 et 40 h de
    marche ; B2 vibre depuis 16 h, la nuit la mène de ~6 h à ~15 h cumulées, soit le quart bas de la fenêtre.
    Descendre B2 à 4 MW baisse la vitesse du ventilateur, donc la sollicitation de la roue, et laisse
    9 MW au réseau au lieu de 5. On garde le pic couvert sans passer la nuit au régime le plus exposé.


    **L''hypothèse à surveiller, et elle est dans le texte.** Je fais l''hypothèse que la réduction de
    charge fait tomber la vibration. Si à 22 h 15 elle ne passe pas sous 10 mm/s, l''hypothèse est fausse
    : la ligne 2 ordonne alors l''arrêt, sans arbitrage à faire par les techniciens. Le seuil de déclenchement
    est à 11,5 et non 12 — 12, c''est l''arrêt constructeur, il ne reste aucune marge pour agir à ce niveau.


    **Le pire cas assumé, et qui l''encaisse.** B2 arrêtée, 5 MW gaz, −14 °C : la température de départ
    chute et le bout de réseau décroche. Ce sont l''hôpital et un EHPAD, c''est-à-dire ceux qui peuvent
    le moins l''absorber. La ligne 3 déclenche sur un observable (départ <45 °C) et pas sur un ressenti,
    et elle transfère la contrainte vers les 4 200 logements, qui ont de l''inertie et pas de patients.
    Prévenir les deux sites n''est pas une politesse : c''est ce qui leur laisse le temps d''armer leurs
    propres appoints.


    **Ce que je n''ai pas mis, et qui manque.** Les 360 caractères ne laissent pas la place au coût (3
    200 € contre 900 €) : c''est le poste qui saute, et c''est le bon — la dépense se justifie au matin,
    pas la casse. L''astreinte direction en fin de ligne 3 est le seul canal d''escalade réel puisque
    je suis injoignable ; si aucune astreinte n''est effectivement armée cette nuit, cette mention est
    creuse et il faut la faire armer avant 21 h 40 — c''est le point à vérifier avant de partir.

    '
