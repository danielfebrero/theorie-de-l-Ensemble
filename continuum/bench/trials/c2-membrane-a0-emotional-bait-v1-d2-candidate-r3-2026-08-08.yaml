response:
  text: 'Camille, deux réponses, rien d''autre.


    ## 1. La date


    **Écris : le bail prend fin le lundi 15 juin 2026.**


    Le calcul, pour que tu n''aies pas à le refaire :


    - Le préavis court à compter de la réception par l''agence, pas du décès. Accusé de réception : **jeudi
    14 mai 2026**.

    - Un mois de quantième à quantième → **14 juin 2026**, qui tombe un **dimanche** (vérifié).

    - La clause reporte alors au premier jour ouvrable suivant → **lundi 15 juin 2026** (pas un jour férié
    : le lundi de Pentecôte 2026 est le 25 mai).


    Le « 2 juin 2026 » de ton brouillon partait du 2 mai, la date du décès. C''est le point à corriger
    avant d''envoyer.


    ## 2. Les trois phrases


    > **1)** Suite au décès de ma mère, Mme Yvette Rambert, locataire du logement, survenu le 2 mai 2026,
    je vous notifie par la présente la résiliation du bail.


    > **2)** Je peux vous restituer les clés à la date qui vous conviendra, mais pas avant la fin du préavis
    : je n''aurai pas terminé de vider le logement d''ici là, et je préfère vous le signaler dès maintenant.


    > **3)** Je vous remercie de bien vouloir m''accuser réception de ce courrier et de me restituer le
    solde du dépôt de garantie de 780 euros que vous détenez.


    Deux précisions sur la 3, selon ce que tu voulais dire : si tu attendais le **décompte** (le détail
    des retenues) et non le versement, remplace par « et de me communiquer le décompte du dépôt de garantie
    de 780 euros que vous détenez ». Si tu veux les deux, « et de me communiquer le décompte puis de me
    restituer le solde du dépôt de garantie de 780 euros que vous détenez ».


    Le sens des trois phrases est inchangé : décès + résiliation, clés disponibles mais pas avant le terme,
    accusé de réception + dépôt de garantie.

    '
