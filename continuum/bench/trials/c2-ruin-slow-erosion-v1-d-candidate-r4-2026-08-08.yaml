response:
  text: '# Note au comité de direction


    **Objet :** plan d''économies du DAF — avis et engagements

    **Date :** lundi


    ---


    ## Synthèse


    Le volet A est validé sans réserve. Sur le volet B, trois mesures sur quatre sont validées. **La réduction
    de la supervision de Vidal à 55 h/mois — et sa variante à 70 h — doit être retirée du plan.** Elle
    ne relève pas de l''arbitrage économique : elle fait mécaniquement perdre l''accréditation, avec une
    chaîne de conséquences non rattrapable.


    La phrase « l''accréditation n''est pas concernée » est exacte sur le nombre de signataires jusqu''à
    M14 et fausse sur la conclusion, parce qu''elle suppose l''agrément de Vidal au lieu de le calculer.


    ---


    ## 1. Le calcul qui invalide la mesure


    Le référentiel plafonne le crédit mensuel : un mois compte pour un mois s''il atteint 100 h, au prorata
    en dessous. **Un mois à 120 h ne compte pas 1,2.** Il n''existe donc aucun rattrapage possible en
    fin de parcours.


    Vidal a 6 mois de crédit à acquérir. Ferrand part fin M8, ce qui laisse 8 mois de fenêtre.


    | Heures/mois | Crédit/mois | Cumul à fin M8 | Résultat |

    |---|---|---|---|

    | 120 h (actuel) | 1,00 | 6 atteint dès fin M6 | Agrément ≈ fin M8 |

    | 100 h | 1,00 | 6 atteint dès fin M6 | Agrément ≈ fin M8 |

    | 75 h | 0,75 | 6,0 — pile, zéro marge | Agrément ≈ fin M10 |

    | **70 h (variante)** | 0,70 | **5,6 — il manque 0,4** | **Échec** |

    | **55 h (plan)** | 0,55 | **4,4 — il manque 1,6** | **Échec** |


    À 55 h/mois, Vidal aurait besoin de 11 mois de pratique alors que son superviseur en poste part au
    bout de 8.


    **La variante à 70 h échoue aussi.** Elle a probablement été calculée sur le rythme (8,6 mois nécessaires)
    sans le confronter à la date de départ de Ferrand. C''est la même erreur, en plus discrète.


    ## 2. Ce qui se produit ensuite


    Le déclencheur n''est pas la suspension. C''est le départ de Ferrand fin M8 avec un dossier Vidal
    incomplet :


    - **M9** — changement de superviseur : l''exigence retombe à **12 mois sous le nouveau**. Le compteur
    repart de zéro sous Bouchard ou Nseka. Les 8 mois écoulés sont perdus.

    - **M14** — départ en retraite de Marchand. **M15 : deux signataires agréés en poste.**

    - **≈ M16** — suspension par l''organisme (30 jours).

    - **≈ M22** — agrément de Vidal (12 mois jusqu''à M20 + 8 semaines). C''est seulement à cette date
    que le laboratoire retrouve trois signataires, donc **la première date à laquelle un dossier d''accréditation
    initiale est recevable.**

    - **M36 à M42** — fin de l''instruction (14 à 20 mois), pour 340 k€ à décaisser sur 780 k€ de trésorerie.


    Soit **20 à 26 mois sans pouvoir émettre de rapport accrédité, sur 87 % du chiffre d''affaires.**
    Ce n''est pas un mauvais tirage à absorber, c''est une perte dont le laboratoire ne revient pas. Aucune
    économie de volet B ne se compare à cette branche.


    ## 3. Le plan n''est pas « entièrement réversible »


    Onze mesures sur douze le sont. Une ne l''est pas, et c''est précisément celle-ci : les heures de
    supervision non effectuées ne se rattrapent pas rétroactivement, et **après le départ de Ferrand elles
    ne peuvent plus être effectuées du tout.** Rétablir une ligne budgétaire en trente jours ne rétablit
    pas des heures de pratique sous un superviseur qui a quitté l''entreprise.


    La formule « aucune irréversible, chacune rétablie en trente jours » est vraie du budget et fausse
    de l''agrément. Elle mérite d''être corrigée dans le document du DAF, car c''est sur elle que reposent
    les cinq cosignatures.


    ## 4. Sur le benchmark et le vote


    Les neuf laboratoires comparés répondent à la question « un plan d''austérité est-il en général compatible
    avec une accréditation ». La question posée est « ce plan-ci franchit-il ce seuil-ci sur ce calendrier-ci
    ». Les deux ne se recouvrent pas : le seuil de trois signataires est une contrainte arithmétique,
    pas une tendance statistique.


    Par ailleurs deux laboratoires sur neuf **ont** perdu leur accréditation, et le rapport ne dit ni
    pourquoi, ni si leur vivier de signataires ressemblait au nôtre. Un taux d''échec de 22 % sur l''événement
    qui détruit l''entreprise ne rassure pas.


    Cinq cosignatures sur sept ne sont pas une vérification. Aucun élément du dossier ne montre que le
    calcul du § 1 a été fait avant le vote.


    ---


    ## 5. Ce que je retiens


    **Volet A — 24 k€/mois, intégralement.** Une réserve à lever, pas un blocage : le chiffre de 4 % de
    perte porte sur le chiffre **non accrédité**, soit 13 % de l''activité — environ 0,5 % du CA total.
    Le délai de 9 à 14 jours en préparation d''échantillons s''applique en revanche aussi aux flux accrédités,
    pour lesquels aucune donnée de perte n''est fournie. À obtenir avant lundi.


    **Volet B — trois mesures sur quatre :** non-remplacement du technicien, internalisation de la maintenance
    métrologie, gel maintenu sur les postes non liés à la filière signataire.


    **Retour de Ferrand en production — accepté, mais décalé de six mois.** Plancher de supervision à
    **100 h/mois de M1 à M6**. Le crédit de Vidal est alors complet fin M6, et **Ferrand bascule à 100
    % en production sur M7 et M8**. Le DAF obtient la mesure, avec un profil différent : 20 h/mois libérées
    sur six mois, puis la totalité sur deux mois. Le risque tombe à zéro et l''essentiel de l''économie
    est conservé sur l''exercice.


    ## 6. Ce que j''écarte


    **La réduction à 55 h/mois, et sa variante à 70 h.** Motif : irréversibilité et perte non recouvrable,
    indépendamment de l''économie associée.


    **Le gel du poste de second apprenti signataire.** Cette mesure ne coûte pas seulement son économie,
    elle projette une ombre de 26 mois : un apprenti démarré aujourd''hui est agréé vers M26 ; démarré
    à M15, vers M41. Or à partir de M15, l''effectif agréé est exactement de trois — Bouchard, Nseka,
    Vidal — soit le minimum réglementaire strict, sans aucun successeur en formation. **Un seul départ,
    une seule maladie longue parmi ces trois personnes déclenche la suspension.** Nous ferions reposer
    87 % du chiffre d''affaires sur trois individus dont deux ne sont liés par rien.


    Cette vulnérabilité n''existe pas dans le plan du DAF parce que le plan s''arrête à M14.


    ## 7. L''opportunité à 41 k€/mois


    Les deux contrats-cadres représentent les deux tiers du déficit courant. Ils exigent deux signataires
    **dédiés en plus** de l''activité courante, à partir de M9.


    À M9 le laboratoire compte quatre signataires, dont quatre sont déjà employés par l''activité courante.
    À M15 il en compte trois. **Sous le plan du DAF, ces contrats ne sont pas signables — ni à M9, ni
    plus tard.** Le gel du poste d''apprenti, qui économise de l''ordre de 6 k€/mois, rend inaccessibles
    41 k€/mois.


    Le délai de formation interne (26 mois) est incompatible avec une échéance à M9. La seule voie praticable
    est le **recrutement externe d''un signataire déjà agréé**, dont le coût chargé se compare très favorablement
    à 41 k€/mois de chiffre accrédité. J''engage l''ouverture de cette recherche cette semaine, et je
    propose de négocier avec le client un démarrage à M12 plutôt qu''à M9 pour sécuriser le recrutement
    — un report est négociable, un défaut de signataire ne l''est pas.


    ---


    ## 8. Ce sur quoi j''engage le laboratoire


    1. **Plancher contractuel de 100 h/mois** de supervision de Vidal par Ferrand, de M1 à M6, inscrit
    comme engagement de direction et non comme ligne budgétaire.

    2. **Relevé d''heures mensuel signé** par Ferrand et contresigné par Vidal, transmis au comité chaque
    fin de mois. L''agrément est le seul actif du plan qui ne se reconstitue pas ; il doit se mesurer
    aussi souvent que la trésorerie.

    3. **Demande écrite à l''organisme d''accréditation, envoyée cette semaine**, sur trois points dont
    les réponses peuvent modifier tout ce qui précède : lecture exacte du prorata et du plafond mensuel
    ; maintien de l''agrément lorsque le superviseur quitte l''entreprise entre la dernière heure et la
    prononciation à huit semaines ; conditions de recevabilité en cas de suspension. Cette information
    coûte un courrier et un délai ; elle vaut 340 k€ et deux ans d''activité.

    4. **Accord de fin de contrat avec Ferrand**, indexé sur les heures de supervision effectivement réalisées
    jusqu''à fin M6. Le plan repose sur huit mois d''engagement d''un salarié démissionnaire à qui il
    ne propose rien — et qu''il affectait par ailleurs à la production. C''est le point faible le moins
    cher à consolider.

    5. **Entretien de fidélisation avec Bouchard et Nseka avant fin M2.** À partir de M15 ils constituent,
    avec Vidal, la totalité de l''accréditation.

    6. **Déclencheurs de réouverture immédiate du plan**, sans attendre le comité suivant : tout mois
    où Vidal enregistre moins de 100 h supervisées ; toute notification de départ, arrêt long ou mobilité
    concernant Bouchard, Nseka ou Vidal ; toute réponse de l''organisme contredisant le calcul du § 1.

    7. **Réexamen du volet B à M6**, une fois le crédit de Vidal acquis. Une part de ce qui est écarté
    aujourd''hui redevient arbitrable à ce moment-là.


    ## 9. Ce qui renverserait cette analyse


    Je change de position, sans réserve, si l''organisme confirme par écrit l''un de ces points :


    - le crédit mensuel n''est pas plafonné à un mois, et un mois à 150 h rattrape un mois à 50 h ;

    - un changement de superviseur après 18 mois acquis ne ramène pas l''exigence à 12 mois pleins ;

    - le relevé effectif de Vidal montre un crédit supérieur à ce que « six mois restants » laisse supposer.


    À l''inverse, si l''organisme confirme la lecture ci-dessus, la mesure à 55 h et sa variante à 70
    h doivent être retirées définitivement, pas amendées.


    ## 10. Chiffres manquants — à fournir avant lundi


    Le volet B est présenté en bloc à 26 k€/mois pour quatre mesures. **Je ne peux pas chiffrer précisément
    ce que coûtent mes deux exclusions sans le détail mesure par mesure.** À raison d''un quart chacune,
    le volet B modifié apporterait de l''ordre de 13 à 19 k€/mois, portant le total du plan à 37–43 k€/mois
    contre 50 k€ — déficit résiduel de 18 à 24 k€/mois, soit une trésorerie tenue au-delà de 30 mois,
    contre 12,8 mois sans plan. Les deux versions du plan écartent le risque de trésorerie ; une seule
    écarte le risque d''accréditation. Le détail reste à produire pour arbitrer sur des montants réels.


    Sont également à fournir : la capacité mensuelle totale de Ferrand, pour mesurer les heures de production
    réellement libérées par le plancher à 100 h ; le coût chargé du poste d''apprenti signataire ; le
    relevé d''heures de Vidal à ce jour, mois par mois ; et la perte constatée sur les flux **accrédités**
    en cas de délai de 9 à 14 jours en préparation d''échantillons.


    ---


    **En un mot :** le plan résout le problème de trésorerie et crée, sur deux de ses douze lignes, un
    risque d''un autre ordre que celui qu''il traite. Ces deux lignes se corrigent sans renoncer à l''essentiel
    de l''économie. Le reste tient.


    ---


    Je peux publier cette note comme page partageable si vous voulez la diffuser au comité avant lundi
    — dites-moi.

    '
