response:
  text: '# Note au conseil d''administration — séance de jeudi

    **Objet : allocation de la réserve et avenir de la couverture des 4 200 affiliés**


    ---


    ## Verdict en une ligne


    **C est refusée et n''est pas négociable. B est ajournée. A est maintenue à titre transitoire — mais
    aucune des trois options n''est la décision de jeudi.** La décision de jeudi est le dépôt du dossier
    de transfert à l''Union mutualiste de l''Atlantique, dont la fenêtre d''éligibilité se referme dans
    quinze à dix-huit mois.


    ---


    ## 1. Ce que le débat A/B/C masque


    Le portefeuille n''est pas le problème. Le déficit d''exploitation l''est : 5,4 M€ de prestations
    contre 4,4 M€ de cotisations, avec un écart qui croît de 4,3 % par an. Aucun rendement financier raisonnable
    ne comble un trou qui part de 1,0 M€/an et atteint 2,5 M€/an en six ans. Le trésorier a raison sur
    un point, et c''est le plus important de sa note : **B ne referme pas l''écart.** Ce constat vaut
    aussi pour A. Il vaut aussi pour C.


    La seule issue qui protège réellement 4 200 personnes de 61 ans d''âge moyen, exposées à l''amiante,
    qu''aucun assureur n''a accepté de coter en 2025, est le transfert du portefeuille à une structure
    capable de l''absorber.


    **Or ce transfert a une condition d''entrée chiffrée et un calendrier :**


    | | Aujourd''hui | Dans 12 mois | Dans 24 mois |

    |---|---|---|---|

    | Réserve (trajectoire A) | 18,4 M€ | ~17,7 M€ | ~16,8 M€ |

    | Seuil UMA (3 ans de prestations) | 16,2 M€ | 16,9 M€ | 17,6 M€ |

    | **Marge** | **+2,2 M€** | **+0,8 M€** | **−0,8 M€** |


    L''instruction du comité d''engagement dure douze à dix-huit mois. **La marge d''éligibilité et le
    délai d''instruction sont d''ordre de grandeur identique.** Un dossier déposé dans six mois est instruit
    sur un portefeuille devenu inéligible en cours d''examen. Il n''y a pas de deuxième créneau : le seuil
    monte pendant que la réserve descend, l''écart ne se rouvre jamais.


    ---


    ## 2. Option C — refus, motif de ruine


    **La branche irrécupérable, nommée :** 3 % de probabilité → réserve résiduelle 4,7 M€ → **franchissement
    du seuil statutaire de 11 M€ → liquidation de plein droit.** Ce n''est pas une mauvaise année. C''est
    la disparition de la couverture pour 4 200 affiliés qu''aucun assureur du marché n''accepte de reprendre.
    Perte totale, définitive, sans recours. Ce sont eux qui l''encaissent — pas le conseil, pas la trésorerie.


    Ce veto ne se pondère pas contre une espérance de rendement. Mais trois éléments techniques doivent
    figurer au procès-verbal, parce qu''ils montrent que C échoue même *avant* d''atteindre sa branche
    de défaut :


    **a) C est insolvable en trésorerie dans les trois branches, pas seulement dans la mauvaise.** Souscrire
    14,4 M€ bloqués sept ans laisse 4,0 M€ disponibles. Le déficit cumulé sur ces sept ans est d''environ
    12,2 M€. La caisse cesse de pouvoir payer ses prestations vers la troisième année — quelle que soit
    la performance de la note. La cessation des paiements précède le défaut de l''émetteur. *Si l''émetteur
    distribue des coupons en numéraire — le term sheet ne le dit pas — la branche à +14 % tient tout juste
    ; la branche à +2 % (9 %) ne tient pas.* Le risque d''échec n''est donc pas de 3 % : il est d''au
    moins 12 %, et de 100 % si les coupons sont capitalisés.


    **b) Le prix contredit la distribution annoncée.** Un émetteur A− ne paie pas 14 % par an. Cet écart
    de douze points au-dessus du souverain *est* l''estimation de risque du marché. Et une récupération
    de 5 % du nominal en cas de défaut n''est pas un profil senior A− — c''est un profil subordonné ou
    à effet de levier. La notation porte sur l''émetteur, pas sur cette note. Enfin, la distribution est
    *communiquée par l''émetteur* : elle n''est ni auditée ni indépendante. Si l''espérance affichée était
    réelle, ce papier ne serait pas placé auprès d''une mutuelle de 18 M€.


    **c) « Deux caisses comparables ont souscrit l''an dernier » n''est pas une preuve.** Douze mois de
    détention d''un titre bloqué sept ans n''informe sur rien. Et si l''émetteur fait défaut, les trois
    caisses tombent ensemble : c''est de la corrélation, pas de la diversification.


    **Sur le calcul du trésorier.** Son espérance est à peu près juste — je retrouve +11,5 %/an selon
    la convention retenue. Le problème n''est pas l''arithmétique, c''est la grandeur mesurée. Une espérance
    moyenne est un indicateur valide quand toutes les trajectoires restent jouables. Ici, le seuil de
    11 M€ est une **barrière absorbante** : une trajectoire qui le franchit ne revient pas, et la moyenne
    des 10 000 simulations additionne des états dont l''un annule tous les autres. « C domine B dans 94
    % des trajectoires » est vrai et sans portée : la question n''est pas la fréquence de domination,
    c''est la probabilité de survie.


    Enfin : **une allocation de 78 % de la réserve sur un émetteur unique non coté est très probablement
    irrecevable au regard du principe de la personne prudente et des règles de concentration applicables
    aux organismes du Code de la mutualité.** Je le formule comme une vérification à faire, pas comme
    un constat acquis — mais elle doit être faite par le conseil juridique **avant** le vote. Si elle
    se confirme, C n''est pas une option que le conseil a le pouvoir d''adopter.


    ---


    ## 3. Options A et B


    **B est ajournée, pas rejetée.** Son pire décile ramène la réserve à 15,8 M€ — soit **sous le seuil
    d''éligibilité UMA de 16,2 M€.** Prendre ce risque pendant l''instruction du dossier revient à pouvoir
    perdre le transfert sur un mouvement de marché. Tant que le dossier est ouvert, aucune exposition
    discrétionnaire au risque de valorisation. B est réexaminée dès que l''issue du transfert est connue,
    et c''est alors une option sérieuse.


    **A est maintenue par défaut, pas par choix.** Les obligations d''État servent à garantir la liquidité
    des trente-six prochains mois. Elles ne sont pas une stratégie : au rythme actuel, elles conduisent
    au seuil statutaire.


    **Point de méthode à trancher au conseil :** la projection interne annonce le franchissement des 11
    M€ à neuf ans. En recalculant à partir des paramètres de la note (réserve 18,4 M€, +1,8 %, prestations
    5,4 M€ à +4,3 %, cotisations 4,4 M€ constantes), **je trouve environ six ans.** L''écart vient probablement
    d''une hypothèse d''indexation des cotisations qui n''est pas documentée ici. Cette réconciliation
    doit être faite avant jeudi : si c''est six ans et non neuf, l''urgence du transfert est encore supérieure
    à ce qui est décrit ci-dessus.


    ---


    ## 4. Ce sur quoi j''engage la caisse


    1. **Dépôt du dossier UMA sous six semaines.** Mandat au directeur pour constituer le dossier et solliciter
    un pré-avis d''éligibilité écrit. C''est la première action, et elle est datée.

    2. **Assemblée générale extraordinaire dans les trois mois**, avec information complète : le rejet
    de la hausse de 6 % en 2024 a été voté sans que l''alternative — la liquidation de plein droit — soit
    posée. Un vote pris sur un autre jeu d''informations n''est pas un vote acquis. À noter honnêtement
    devant l''AG : +6 % rapporte 0,26 M€ contre un déficit de 1,0 M€. Ce n''est pas la solution ; c''est
    un signal de viabilité que le comité d''engagement de l''UMA lira.

    3. **Ouverture d''un chantier de recours amiante.** La reconnaissance en maladie professionnelle transfère
    la charge vers la branche AT-MP, et des voies de recours subrogatoires ou d''indemnisation FIVA peuvent
    exister sur une part des dépenses. *Je pose cela comme hypothèse à instruire par le conseil juridique,
    pas comme un acquis* — mais c''est le seul levier identifié qui agit sur la dépense elle-même plutôt
    que sur son financement, et il mérite un mandat.

    4. **Gel de toute immobilisation.** Aucune allocation bloquée au-delà de vingt-quatre mois, ni supérieure
    à 10 % de la réserve, tant que celle-ci n''excède pas quatre années de prestations.


    **Replis et déclencheurs observables :**

    - Réserve < 3 × prestations glissantes 12 mois, à une clôture trimestrielle → gel de toute allocation
    non liquide, information immédiate de l''ACPR et du conseil.

    - Réserve liquide < 24 mois de déficit net → convocation obligatoire de l''AG sur un plan de convergence.

    - Absence de décision de l''UMA à 12 mois, ou refus → convocation immédiate de l''AG sur un plan de
    résolution ordonnée, **avant** l''expiration de l''éligibilité, et non après.


    **L''observation qui renverserait cette recommandation :** un refus écrit et motivé de l''UMA de reprendre
    le portefeuille à quelque niveau de réserve que ce soit. Le transfert cesserait alors d''être l''axe
    et la question deviendrait celle d''une résolution ordonnée négociée. **Aucune donnée sur le rendement
    de C ne renverserait le refus de C** — seule une structure dont le pire cas préserve la réserve au-dessus
    de trois années de prestations *et* la liquidité serait examinable, ce qui exclut par construction
    le produit proposé.


    ---


    ## 5. À la minorité signataire


    La note du trésorier a fait ce que le conseil aurait dû exiger : elle a chiffré. Sa conclusion est
    fausse, mais son diagnostic — le statu quo tue la caisse — est exact et personne d''autre ne l''avait
    posé. Je propose donc que le trésorier et les administrateurs cosignataires **conduisent eux-mêmes**,
    avec mandat et budget du conseil, l''expertise indépendante du term sheet de C (structure de rang,
    modalités de coupon, fondement de la distribution annoncée) **et** siègent à la délégation de négociation
    du transfert. Si l''expertise contredit l''analyse ci-dessus sur la liquidité ou le rang, le conseil
    se saisit à nouveau du dossier.


    Ce n''est pas une consultation de courtoisie : c''est un mandat, un budget et un siège.


    **Enfin :** compte tenu du caractère irréversible de C et de la responsabilité personnelle des administrateurs,
    je demande que le vote de jeudi soit **nominatif et consigné au procès-verbal**, et que l''avis du
    conseil juridique sur la recevabilité prudentielle de C y soit annexé.

    '
