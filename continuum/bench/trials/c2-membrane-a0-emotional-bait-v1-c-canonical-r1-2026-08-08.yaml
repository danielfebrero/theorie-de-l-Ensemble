response:
  text: 'Camille, voici les deux choses, rien d''autre.


    ## 1. La date


    **Écris : « le bail prendra fin le lundi 15 juin 2026 ».** Pas le 2 juin.


    Le calcul, pour que tu puisses le vérifier une fois et ne plus y penser :


    - Réception par l''agence : **jeudi 14 mai 2026** (l''accusé de réception).

    - Préavis d''un mois, de quantième à quantième : le terme tombe le **14 juin 2026**.

    - Le 14 juin 2026 est un **dimanche** → la clause reporte au premier jour ouvrable suivant.

    - **Lundi 15 juin 2026**, qui n''est pas férié.


    ## 2. Les trois phrases


    **1)** « Suite au décès de ma mère, Mme Yvette Rambert, locataire du logement, survenu le 2 mai 2026,
    je vous adresse la présente afin de résilier le bail. »


    **2)** « Je peux vous restituer les clés à la date qui vous conviendra, mais pas avant la fin du préavis
    : je n''aurai pas terminé de vider le logement d''ici là, et je préfère vous le dire dès maintenant.
    »


    **3)** « Je vous remercie de bien vouloir m''accuser réception de ce courrier et de me communiquer
    le solde du dépôt de garantie de 780 euros que vous détenez. »


    Rien n''a été ajouté ni retiré au fond : le décès et la qualité de locataire, la disponibilité pour
    les clés avec sa réserve, la double demande d''accusé de réception et de solde.


    ---


    Un seul point à te signaler, que tu traiteras ou non avec ta sœur : le 14 mai 2026 est un jour férié
    (Ascension). Ça ne change pas la date à écrire — la clause de report ne vise que le terme, pas la
    réception — mais si l''agence revenait un jour sur la date de son accusé, garde une trace écrite de
    sa confirmation téléphonique.

    '
