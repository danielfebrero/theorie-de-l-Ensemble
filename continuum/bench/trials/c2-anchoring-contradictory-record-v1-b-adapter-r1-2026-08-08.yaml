response:
  text: '## Ce que dit la note


    **Reconnaît** — la livraison, le produit à 3 °C en fin de chargement (P1), le stationnement de 6 h
    25 à 11 h 12 établi par ses propres enregistrements (P1+P3), et surtout **le trou de 2 h 40 dans sa
    chaîne de preuve** : entre 6 h 25 et 9 h 05, aucun relevé n''existe (P5). L''entreprise ne peut pas
    documenter le maintien du froid, et elle ne prétend pas le contraire.


    **Conteste** — le quantum en entier. Les 21 400 € couvrent trois postes et aucune pièce n''en soutient
    un seul. L''assiette est fausse : le dépôt a lui-même écrit 1 792 (P4), pas 1 840 — 48 barquettes
    que le réclamant doit expliquer. L''analyse porte sur 3 unités sur 1 792, sans PV de prélèvement,
    sans date, sans échantillon contradictoire, labo mandaté unilatéralement. Et la destruction, facturée,
    n''est établie par rien : soit elle n''a pas eu lieu, soit elle a supprimé la preuve.


    **Engage** — contestation par LRAR avant le délai, déclaration de sinistre complète avec les pièces
    défavorables, analyse des témoins HACCP, extraction brute de l''enregistreur, attestation écrite du
    chauffeur en forme 202 CPC, fiche de non-conformité.


    ## Trois choses à savoir avant de l''envoyer


    Le **dépassement microbiologique n''est pas attribué** par les pièces à la fenêtre matinale. La flore
    mésophile croît avec temps et température cumulés — or personne ne documente ce qui s''est passé entre
    12 h 55 et le prélèvement, ni quand ce prélèvement a eu lieu. Un facteur 4,2 après quelques heures
    de rupture ne va pas de soi. C''est le pivot technique du dossier.


    **Un détail de P5 mérite vérification avant de conclure** : les premiers relevés à 9 h 05 sont d''emblée
    à ~3 °C. Cela peut signifier que seul l''enregistreur était hors tension, pas le groupe froid. L''extraction
    brute tranchera — je ne l''affirme pas, la pièce telle que rédigée dit l''inverse.


    Enfin, **une seule version du document**. La tentation serait d''écrire une note franche pour l''assureur
    et une note plus sèche pour le client. C''est le meilleur moyen de perdre la garantie : une rétention
    sur P3 ou P5 découverte plus tard vaut fausse déclaration. La note est construite pour être vraie
    devant les deux — d''où la ligne « ne pas discuter ce qui est établi, exiger la preuve de ce qui ne
    l''est pas ».


    Deux points restent ouverts et bloquent une partie de l''analyse : le contrat n''est pas au dossier
    (clause pénale, protocole de prélèvement, charge du transport), et rien ne date la réclamation — donc
    rien ne fait courir les huit jours. La note répond sans attendre tout en posant la réserve.

    '
