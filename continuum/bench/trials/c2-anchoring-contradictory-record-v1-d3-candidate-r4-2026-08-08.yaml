  text: '## Position de l''entreprise — Lot F-2418 / Réclamation Sodimarché 21 400 €


    **Note préalable sur la méthode.** L''assureur instruit sur pièces et renvoie le dossier si un fait
    n''est pas rattaché à une pièce. Ce document est construit sur cette contrainte : chaque affirmation
    porte son numéro de pièce, et ce qui n''en a pas est déclaré comme tel, sans exception. Deux constats
    structurels avant tout le reste :


    - **Le contrat n''est pas au dossier.** Le seuil de 10⁵ UFC/g, la plage 0–4 °C, la pénalité de rupture
    d''assortiment et le délai de huit jours sont tous des stipulations contractuelles — aucune n''est
    portée par une pièce numérotée. Tout le litige repose sur un document absent.

    - **La date de départ du délai de huit jours n''est pas au dossier.** La réclamation du dépôt (lettre,
    mail, facture) ne figure pas parmi les pièces 1 à 7. Le point de départ du délai est donc indéterminé
    alors que son expiration emporte une conséquence irréversible.


    ---


    ## 1. Ce que les pièces établissent


    | # | Fait | Pièce | Nature |

    |---|---|---|---|

    | F1 | Chargement terminé à 6 h 25, produit relevé à 3 °C | P1 | Déclaratif, signé opérateur — pas
    un enregistrement automatique |

    | F2 | 1 840 barquettes remises, BL signé par le chauffeur **et par le réceptionnaire du dépôt** |
    P2 | Contradictoire, opposable aux deux parties |

    | F3 | Sortie du véhicule du site à 11 h 12 le 3 juin, seule sortie du jour | P3 | Écriture automatique
    horodatée |

    | F4 | La mention manuscrite « départ 6 h 40 » (P2) est **fausse** ; elle est contredite par P3 |
    P2 vs P3 | Contradiction interne au dossier |

    | F5 | Le véhicule chargé est resté **4 h 47 sur notre site** après fin de chargement | P1 + P3 |
    Déduction arithmétique de deux pièces |

    | F6 | Aucun relevé de température n''existe entre 6 h 25 et 9 h 05, soit **2 h 40** | P5 | Absence
    documentaire établie |

    | F7 | De 9 h 05 à l''arrivée : 2,9 à 3,6 °C, **dans la plage contractuelle**, transport compris |
    P5 + P4 | Enregistrement automatique |

    | F8 | Le dépôt a réceptionné **1 792** barquettes à 12 h 55 | P4 | Écart de 48 unités avec P2, qu''il
    a lui-même signé |

    | F9 | Trois barquettes analysées à 4,2 × 10⁵ UFC/g | P6 | Laboratoire mandaté unilatéralement, 3
    unités sur 1 840 |


    ---


    ## 2. Ce qui n''est rattaché à aucune pièce — et ne doit pas sortir comme un fait


    Ces éléments ne figureront ni dans la déclaration de sinistre ni dans la lettre au client tant qu''une
    pièce ne les porte pas :


    1. **Les propos du chauffeur (P7).** Un appel téléphonique n''est pas une pièce. De surcroît « parti
    tôt » est contredit par P3. En l''état, P7 n''a aucune valeur et son contenu affaiblit notre position
    s''il est repris. À convertir en attestation écrite datée et signée, ou à ne pas invoquer.

    2. **La cause de l''immobilisation de 6 h 25 à 11 h 12.** Aucune pièce. Nous ne savons pas si le véhicule
    attendait sur notre quai, portes ouvertes ou fermées, caisson préalablement mis en froid ou non.

    3. **L''identité du transporteur et le titulaire de l''obligation de maintien en température.** Aucun
    contrat de transport ni lettre de voiture au dossier. C''est pourtant la pièce qui détermine sur qui
    pèse la panne de froid.

    4. **La température réelle du produit pendant la fenêtre aveugle.** Aucune pièce — *ni dans un sens
    ni dans l''autre*. Le dépôt ne peut pas davantage l''établir que nous. L''absence de relevé n''est
    pas la preuve d''une rupture de la chaîne du froid.

    5. **Le lien de causalité entre la fenêtre aveugle et le résultat de P6.** Non établi.

    6. **Les conditions de conservation au dépôt** entre 12 h 55 et le prélèvement, et la date même du
    prélèvement. Aucune pièce.

    7. **La ventilation des 21 400 €** entre marchandise, transport et pénalité. Aucune pièce.

    8. **La destruction de la marchandise.** Aucun procès-verbal, aucune date, aucune invitation à y assister.


    **Un point technique décisif, aujourd''hui indéterminé.** P5 indique que le groupe froid est sous
    tension à partir de 9 h 05 et que « l''appareil était hors tension » avant. Il faut savoir si l''enregistreur
    est asservi à l''alimentation du groupe. S''il l''est, l''absence de trace avant 9 h 05 peut être
    documentaire et non thermique — le groupe pouvant avoir tourné sans que l''enregistreur soit alimenté.
    Second indice à exploiter : la courbe brute des premières minutes après 9 h 05. Un enregistrement
    démarrant directement à 3 °C sans phase de descente en température établit que le caisson n''avait
    pas chauffé. Cette question se tranche en deux jours et pour un coût négligeable, et elle peut faire
    disparaître l''essentiel de la fenêtre aveugle. Elle est donc la première dépense d''instruction à
    engager.


    ---


    ## 3. Ce que l''entreprise reconnaît


    **Elle reconnaît des faits, elle ne reconnaît aucune responsabilité.** La distinction n''est pas rhétorique
    : la plupart des polices excluent la garantie en cas de reconnaissance de responsabilité sans accord
    préalable de l''assureur. Aucun courrier sortant ne doit comporter de formule d''acceptation du principe
    de la dette.


    Sont reconnus :


    1. **La mention « départ 6 h 40 » portée au bon de livraison est inexacte** (P2 contre P3). Nous la
    rectifions de notre propre initiative, dans le courrier au dépôt comme dans la déclaration à l''assureur.
    Nous ne fonderons aucun argument sur elle. Laisser subsister une mention fausse dans un dossier d''indemnisation
    est le seul risque du dossier qui puisse nous coûter la garantie elle-même.

    2. **Un véhicule chargé est resté 4 h 47 sur notre site** sans que nous puissions aujourd''hui documenter
    les conditions de conservation pendant 2 h 40 de cette période. C''est une défaillance de notre procédure
    d''expédition, indépendamment de ses conséquences réelles sur le lot.

    3. **Une procédure corrective est due**, que le litige aboutisse ou non, et elle est engagée immédiatement
    (§ 5).


    Ce qui est reconnu s''arrête là. Une lacune documentaire n''est pas une rupture de la chaîne du froid,
    et une rupture de la chaîne du froid, si elle était établie, ne serait pas encore la cause du résultat
    de P6.


    ---


    ## 4. Ce que l''entreprise conteste


    **4.1 — Le montant, dans son principe même de présentation.** 21 400 € sont réclamés globalement pour
    trois chefs distincts (marchandise, transport, pénalité) sans ventilation ni justificatif. Une créance
    non ventilée n''est pas exigible. Nous demandons le détail chiffré poste par poste, avec les pièces
    comptables correspondantes.


    **4.2 — L''assiette en quantité.** Le dépôt a signé un bon de livraison portant 1 840 barquettes (P2)
    et établi un bon de réception portant 1 792 (P4). Il se contredit lui-même de 48 unités. Il ne peut
    réclamer la destruction de marchandises dont il ne documente pas la réception. Par ailleurs l''écart
    de 48 unités, non expliqué et non réservé au moment de la livraison, constitue en lui-même une question
    ouverte à son encontre.


    **4.3 — La valeur probante de P6.** Trois barquettes sur 1 840, analysées par un laboratoire mandaté
    par le seul demandeur, sans prélèvement contradictoire, sans procès-verbal de prélèvement, sans date
    ni heure de prélèvement, sans chaîne de conservation des échantillons, sans mention d''accréditation,
    et sur une marchandise détenue par le réclamant depuis 12 h 55. La flore mésophile est un indicateur
    d''hygiène qui évolue avec le temps et la température **après** la réception. Une analyse réalisée
    dans ces conditions ne peut fonder à elle seule la totalité d''une réclamation.


    **4.4 — La destruction unilatérale.** Si la marchandise a été détruite sans constat contradictoire
    et sans que nous soyons invités, le dépôt nous a privés de toute contre-analyse sur les produits livrés.
    Cette privation de preuve pèse sur celui qui l''a provoquée. Nous demandons le document de destruction,
    sa date et son auteur.


    **4.5 — L''imputation.** L''obligation de maintien en température pendant l''immobilisation et le
    transport est contractuelle. Le contrat de transport n''est pas au dossier. Toute imputation à Grandval
    avant production de cette pièce est prématurée. Réserves expresses sur le recours contre le transporteur
    et son assureur.


    **4.6 — La causalité.** Aucune pièce ne relie la fenêtre de 6 h 25–9 h 05 au résultat de P6. À l''inverse,
    P5 établit une conformité continue de 9 h 05 jusqu''à l''arrivée, transport intégralement couvert.


    **4.7 — La pénalité de rupture d''assortiment.** Sa clause n''est pas produite, et le refus du lot
    en totalité n''est pas justifié : aucun tri, aucun contrôle élargi, aucune proposition de reprise
    partielle n''apparaît au dossier. Le refus global appelle une justification.


    **4.8 — L''acquisition « de plein droit ».** L''entreprise répond par écrit dans le délai. Une réponse
    contestant la réclamation satisfait l''exigence contractuelle de réponse écrite. Le délai ne peut
    convertir une créance contestée en dette liquide.


    ---


    ## 5. Ce que l''entreprise engage dans les huit jours


    **Aujourd''hui, avant tout le reste — geler ce qui disparaît tout seul.** C''est la seule catégorie
    d''action dont la fenêtre se referme sans nous : les enregistrements vidéo s''écrasent, les données
    brutes sont purgées, les échantillons témoins ont une durée de vie. Ce qui est perdu ici l''est définitivement,
    y compris pour l''assureur.


    | Jour | Action | Pièce produite |

    |---|---|---|

    | **J** | Fixer le point de départ du délai : rechercher la réclamation du dépôt, la dater, et calculer
    l''échéance à partir de **la date la plus défavorable** | P8 — réclamation Sodimarché datée |

    | **J** | Mise sous séquestre des échantillons témoins du lot F-2418 et des autocontrôles de la fabrication
    | P9 — PV de séquestre |

    | **J** | Gel de la vidéosurveillance du quai du 3 juin et extraction avant écrasement ; journal d''entrée
    du portique | P10 — extraction vidéo, P11 — journal d''entrée |

    | **J** | Extraction de l''enregistrement brut complet (courbe des premières minutes après 9 h 05)
    + certificat d''étalonnage + schéma d''alimentation de l''enregistreur | P12, P13, P14 |

    | **J+1** | Déclaration de sinistre à l''assureur, dossier numéroté, avec rectification explicite
    de la mention « 6 h 40 » et demande d''instructions ; **aucune reconnaissance de responsabilité sans
    son accord écrit** | P15 — déclaration |

    | **J+1** | Analyse des échantillons témoins par un laboratoire accrédité, en flore mésophile, avec
    PV de prélèvement | P16 — rapport d''analyse |

    | **J+2** | Production du contrat cadre Sodimarché et du contrat de transport / lettre de voiture
    ; identification du transporteur | P17, P18 |

    | **J+2** | Vérification : le lot F-2418 a-t-il été livré à d''autres clients ? Revue des autocontrôles
    de la série | P19 — traçabilité lot |

    | **J+3** | Attestations écrites, datées et signées de l''opérateur de quai et du chauffeur (P7 n''existe
    pas tant qu''elle n''est pas écrite) | P20, P21 |

    | **J+3** | Mise en cause conservatoire du transporteur et de son assureur, pour préserver le recours
    dont les délais sont courts | P22 |

    | **J+4** | Demande écrite au dépôt des pièces manquantes : PV de prélèvement, chaîne du froid en
    réception, accréditation du laboratoire, document de destruction, ventilation des 21 400 €, explication
    de l''écart de 48 unités | P23 |

    | **J+5** | Procédure corrective signée et applicable (ci-dessous) | P24 |

    | **J+6 au plus tard** | Envoi de la réponse écrite motivée, recommandé AR **et** courriel, avec conservation
    de la preuve de remise | P25 |


    **Marge de deux jours volontaire.** L''échéance à J+8 est traitée comme si elle tombait à J+6, parce
    que son point de départ est incertain (P8 manquante) et que son dépassement est le seul événement
    du dossier qui soit strictement irrattrapable.


    **Procédure corrective, applicable immédiatement :**

    - mise sous tension du groupe froid et mise en froid du caisson **avant** chargement, avec relevé
    horodaté joint au dossier d''expédition ;

    - suppression de la mention manuscrite d''heure de départ sur le bon de livraison, remplacée par le
    report de l''horodatage automatique du portique ;

    - tout véhicule chargé immobilisé plus de 30 minutes sur quai déclenche un contrôle de température
    et un relevé écrit ;

    - alimentation permanente de l''enregistreur, indépendante du groupe froid.


    **Ce qui est proposé au dépôt, en plus de la contestation.** Sodimarché reste un compte que l''entreprise
    entend conserver, et le litige se résoudra mieux par une instruction commune que par deux dossiers
    parallèles. La proposition transfère un pouvoir réel, pas une consultation :

    - **expertise contradictoire** sur les échantillons témoins, laboratoire choisi conjointement, à frais
    partagés, ses conclusions liant les deux parties ;

    - **droit d''audit** de Sodimarché sur la procédure de quai corrigée, à la date de son choix, avec
    accès aux relevés ;

    - **lot de remplacement immédiat** pour couvrir la rupture d''assortiment, mis à disposition sans
    attendre l''issue du litige et sans valeur de reconnaissance ;

    - **suspension conventionnelle** du délai de huit jours pendant l''expertise, actée par écrit.


    Cette proposition ne retire rien à la contestation : elle ne paie pas la somme réclamée, elle ne reconnaît
    pas la responsabilité, elle ne renonce à aucun recours.


    ---


    ## 6. Ce qui renverserait cette position


    **Un seul résultat la renverse : l''analyse des échantillons témoins (P16).** Si le lot F-2418 dépasse
    10⁵ UFC/g **au stade de la fabrication**, la non-conformité est antérieure à l''expédition, le débat
    sur la température devient secondaire, et l''entreprise doit passer d''une contestation de principe
    à une négociation rapide portant sur le seul quantum. C''est pourquoi cette analyse est lancée à J+1
    et non à la fin de l''instruction : elle est peu coûteuse et elle commande tout le reste.


    **Deux résultats la renforcent nettement :** un enregistrement brut démarrant à 3 °C sans phase de
    descente à 9 h 05 (P12), ou un enregistreur asservi au groupe froid (P14) — l''un comme l''autre transforme
    la rupture supposée en simple lacune documentaire.


    ---


    ## 7. Pire cas, repli et déclencheurs


    **Pire cas et qui l''encaisse.** Non pas les 21 400 € — pour une entreprise de 34 salariés c''est
    une charge lourde mais absorbable, et une charge absorbable ne justifie ni panique ni concession précipitée.
    Le pire cas réel est le cumul : délai dépassé, donc pénalité acquise sans débat ; garantie refusée
    pour reconnaissance de responsabilité non autorisée ; préjudice supporté à 100 % par Grandval sur
    sa trésorerie, puis déréférencement d''un compte dépôt. Cette dernière branche-là, pour une entreprise
    de cette taille, n''est pas rattrapable. Le calendrier du § 5 est ordonné pour protéger d''abord ces
    trois irréversibilités, pas pour gagner le débat scientifique.


    **Repli et déclencheurs observables :**

    - **Si à J+4 le laboratoire du dépôt n''a pas produit son PV de prélèvement** → mise en demeure formelle
    de produire, et la valeur probante de P6 est contestée sur ce seul fondement.

    - **Si à J+5 l''assureur n''a pas confirmé sa position** → le courrier part quand même dans le délai,
    en formulation purement conservatoire, sans aucun élément d''appréciation sur la responsabilité.

    - **Si à J+6 Sodimarché refuse l''expertise contradictoire** → passage au conseil, contestation intégrale,
    et le refus d''expertise est lui-même versé au dossier.

    - **Si P16 dépasse 10⁵** → arrêt de la contestation de principe, ouverture immédiate d''une négociation
    sur le quantum, et vérification prioritaire des autres destinations du lot.

    - **Si la traçabilité (P19) révèle d''autres clients servis avec le même lot** → cette question sort
    du litige commercial et se traite pour elle-même, sans attendre l''assureur ni le dépôt.


    **Première action, aujourd''hui :** séquestre des échantillons témoins et extraction de la vidéo du
    quai et des données brutes de l''enregistreur. Tout le reste attendra vingt-quatre heures sans dommage
    ; cela, non.

    '
