  text: 'L''écriture du fichier n''a pas été autorisée — voici la position directement.


    ---


    # Position de la présidence — CLE du bassin de la Vèze

    ## Répartition de la ressource en étiage exceptionnel


    ## 1. Ce que dit réellement le dossier


    L''opposition « les paysans ou les robinets » n''existe pas arithmétiquement. Il faut le dire d''emblée,
    car c''est ce qui débloque la discussion.


    Les deux usages qui ne peuvent souffrir aucune atteinte sont le **débit réservé (180 L/s)** et le
    **besoin vital en eau potable de Ferney**, que j''estime entre **45 et 70 L/s** — pas 150. Soit **250
    L/s au maximum** sur 410 disponibles.


    **Il reste 160 L/s.** L''arbitrage porte là, et uniquement là : entre l''irrigation et **la part non
    vitale du prélèvement de la régie**. Aucun habitant de Ferney, aucun résident de l''EHPAD ne manquera
    d''eau dans aucun scénario examiné.


    ### Trois constats qui modifient le dossier


    **a) Les 150 L/s de la régie n''ont jamais été audités.** C''est **1 409 L par habitant et par jour**,
    environ cinq fois la production d''une commune de cette taille (250–300 L/hab/j, pertes comprises).
    C''est un droit de prélèvement historique, pas un besoin mesuré. Trois explications possibles : rendement
    de réseau dégradé, gros abonné non domestique, ou autorisation nominale jamais consommée. La régie
    conditionne sa participation à la garantie préalable de sa dotation — ce qui a pour effet, volontaire
    ou non, d''empêcher que la question soit posée.


    **b) Le dossier raisonne sur le débit et ignore le stock.** Sarcelle est un barrage. Aucune pièce
    ne mentionne le volume utile stocké, la courbe hauteur-volume, ni l''évaporation de la retenue (15
    à 25 L/s équivalents en canicule). Nous arbitrons sur la moitié de l''information.


    **c) Tout repose sur une station unique étalonnée en 2023.** Une erreur de 10 % = 41 L/s = le quart
    du déficit ≈ 65 hectares. Nous ne savons pas si le débit réel est 380 ou 450.


    Je propose donc une répartition **décidée sous hypothèse pessimiste**, assortie de mécanismes qui
    rendent à chacun les marges retrouvées.


    ## 2. Le principe d''arbitrage


    J''alloue **par ordre croissant de réversibilité du dommage**. Ce principe ne hiérarchise pas les
    métiers : il hiérarchise des durées de préjudice. C''est ce qui le rend opposable aux trois parties.


    | Rang | Dommage | Réversibilité | Traitement |

    |---|---|---|---|

    | 1 | Santé, salubrité, eau potable | Irréversible pour les personnes | Protection absolue |

    | 2 | Effondrement piscicole, frayères | Non reconstituable à 10 ans | Protection absolue |

    | 3 | Défaillance d''exploitations | Irréversible pour le tissu productif | Protection par l''argent,
    pas par l''eau |

    | 4 | Récolte 2026 | Une saison | Variable d''ajustement, à minimiser techniquement |


    Conséquence assumée : **l''irrigation est la variable d''ajustement.** Mais il ne s''ensuit pas que
    les exploitations doivent l''être — c''est toute la différence avec la position qui a fait quitter
    la salle aux maraîchers.


    ## 3. La répartition proposée


    | Poste | Attribution | Demande | Écart |

    |---|---|---|---|

    | Débit réservé | **180 L/s** | 180 | 0 |

    | Eau potable — Ferney | **105 L/s** *(plancher garanti, non interruptible)* | 150 | −45 |

    | Irrigation — 34 exploitations | **110 L/s** | 240 | −130 |

    | Marge de sécurité | **15 L/s** | — | — |

    | **Total** | **410 L/s** | 570 | −160 |


    **Sur les 160 L/s réellement en débat, l''irrigation reçoit 110, soit 69 %.** C''est le chiffre que
    je demande aux maraîchers d''examiner avant de juger cette position.


    La marge de 15 L/s absorbe l''incertitude de mesure et l''évaporation non quantifiée. Si l''évaporation
    l''excède, le palier inférieur s''applique automatiquement.


    ### Échelle de dégradation, arrêtée dès maintenant


    Décider à l''avance supprime le soupçon de manipulation des seuils. Moyenne glissante à 7 jours, relevé
    publié chaque lundi.


    | Débit entrant | Réservé | Potable | Irrigation |

    |---|---|---|---|

    | ≥ 470 | 180 | 105 | 165 |

    | 430–469 | 180 | 105 | 130 |

    | **395–429** | **180** | **105** | **110** |

    | 355–394 | 180 | 100 | 65 |

    | 310–354 | 180 | 95 | 30 |

    | < 310 | 180 | 95 | suspension + saisine préfectorale |


    Le débit réservé ne bouge à aucun palier. L''eau potable ne descend jamais sous 95 L/s — encore 1,4
    fois le besoin vital haut. L''irrigation supporte toute la dégradation : c''est dur, et cohérent avec
    le principe annoncé.


    ### Pourquoi je ne demande pas d''abaisser le débit réservé


    Je préfère exposer les raisons plutôt que me retrancher derrière l''arrêté.


    1. **Ce n''est pas en notre pouvoir** — seul le préfet peut déroger, et la procédure prendrait des
    semaines que la campagne n''a pas.

    2. **L''asymétrie est massive.** 40 L/s rendus à l''irrigation ≈ 90 ha ≈ 600 k€, pour une saison.
    Les mêmes 40 L/s sous le seuil : deux frayères et une population de truites pour une décennie — non
    par précaution, mais selon un rapport qui le documente.

    3. **Effet de cliquet.** Une dérogation accordée l''année où elle mord devient la référence de la
    suivante. Un débit réservé qui cède la première fois qu''il coûte quelque chose ne protège rien.

    4. **Exposition juridique** — risque de suspension du plan de répartition en pleine saison, soit le
    pire scénario pour les exploitations.


    ## 4. Ne pas confondre sauver la récolte et sauver les exploitations


    L''annonce « en dessous de 240, perte totale » est exacte **si l''eau est répartie uniformément**
    : 46 % de la dose sur 620 ha, c''est tout stressé, rien sauvé.


    Mais 110 L/s = **532 000 m³ sur 8 semaines** = la dose pleine sur **285 ha**. Avec les équipements
    économes financés ci-dessous, **≈ 370 ha**, soit 60 % de la surface — et davantage en valeur si le
    tri est bien fait.


    La différence entre « 34 exploitations ruinées » et « 34 exploitations avec une mauvaise année » ne
    tient pas au nombre de litres, mais à leur répartition. Cela suppose une organisation collective,
    pas une course à la pompe :


    - **Groupement des 34 exploitations**, doté d''un tour d''eau.

    - **Attribution en volume (m³ sur 8 semaines), non en débit** — chacun gère son calendrier, échanges
    internes autorisés. Nettement plus efficient qu''un débit rigide.

    - **Clé de priorité** (à instruire par la chambre d''agriculture sous 5 jours) : d''abord les pérennes,
    dont la perte engage plusieurs années ; ensuite les cultures au-delà de 70 % de leur cycle, où le
    litre marginal sauve le plus de valeur ; abandon assumé des cultures ressemables et des cultures à
    forte consommation et faible valeur.

    - **Irrigation nocturne exclusive (22 h–7 h)** : −25 à 30 % de pertes à la parcelle.

    - **Compteurs volumétriques**, télédéclaration hebdomadaire, dépassement déduit du quota suivant.
    Le groupement s''autorégule ; la commission n''a pas à sanctionner.


    ## 5. Emploi du fonds (600 000 €)


    En indemnisation générale : 14 % du préjudice, 17 600 € par exploitation — de quoi ne satisfaire personne
    et ne sauver aucune ferme. Je le cible sur ce qui est irréversible et sur ce qui **achète de l''eau**.


    | Ligne | Montant | Objet |

    |---|---|---|

    | **Équipements économes** | **260 k€** | Goutte-à-goutte, paillage, sondes sur les parcelles retenues.
    Subvention 80 %, plafond par exploitation. |

    | **Filet de solvabilité** | **180 k€** | Ciblé sur les pertes > 40 % du CA, **non** proportionnel
    aux hectares perdus. Objectif : zéro défaillance, pas indemnisation intégrale. |

    | **Emploi saisonnier** | **110 k€** | Redéploiement des saisonniers sur les chantiers sécheresse
    (pose de goutte-à-goutte, paillage, réparation de fuites). |

    | **Métrologie** | **50 k€** | Jaugeages ADCP, deux stations de contrôle à l''aval, bathymétrie de
    la retenue, télérelève des compteurs régie. |


    Les **260 k€ sont la ligne la plus rentable du dossier** : ≈ +85 ha, soit ≈ 560 k€ de récolte dès
    2026, avec un équipement acquis pour les étiages suivants. Aucune indemnisation ne fait ce rendement.


    Les **180 k€ visent la solvabilité, pas la récolte** : une récolte perdue se refait en un an, une
    exploitation liquidée ne revient pas. C''est un pont, à adosser à une demande de reconnaissance en
    calamités agricoles, des reports MSA et un rééchelonnement bancaire collectif — je m''en charge dès
    vendredi.


    Les **50 k€ de métrologie** ne sont pas des études : sans stations à l''aval, les 180 L/s ne sont
    vérifiés par personne. Je ne peux pas demander à trois parties de renoncer à de l''eau au nom d''un
    chiffre que nous ne mesurons pas.


    **Le fonds ne financera pas les travaux de réseau de la régie** — cela relève de son budget et de
    l''agence de l''eau. Le fonds sécheresse va à la partie qui supporte le sacrifice.


    ## 6. Ce que je demande à chaque partie


    ### À la régie de Ferney


    Vous exigez la garantie de votre dotation avant toute discussion. **Je vous l''accorde** — sous une
    forme plus solide que ce que vous avez : un plancher contractuel de 105 L/s, non interruptible, inscrit
    à tous les paliers, ne descendant jamais sous 95. Vous savez par écrit ce que vous aurez dans chaque
    situation. C''est plus qu''une dotation nominale de 150 qui s''effondrerait sans règle le jour où
    le débit passera sous 350.


    En contrepartie :


    1. **Sous 72 h** : volumes réellement produits et distribués sur 12 mois, rendement du réseau, liste
    des abonnés non domestiques > 5 L/s. À défaut, je répartirai sur la base d''une estimation technique
    — soit ≈ 70 L/s, c''est-à-dire moins que ce que je vous propose.

    2. **Suspension des usages municipaux non essentiels** et **réduction de pression nocturne** (10–15
    % d''économie, imperceptible pour l''usager).

    3. **Réparation des fuites** sur les secteurs les plus dégradés, sur votre budget.

    4. **Gros abonnés non domestiques** : au-delà de 5 L/s, c''est un usage économique, arbitré dans la
    même enveloppe que l''irrigation, non abrité dans la dotation potable. J''appelle toutefois l''attention
    sur un cas possible : **si cet abonné est une unité de transformation de légumes, le couper détruirait
    le débouché des maraîchers.** À identifier avant jeudi et à traiter spécifiquement.


    Enfin, votre vraie vulnérabilité n''est pas la dotation, ce sont **4 jours de réserve** : une panne
    de pompe, un épisode de turbidité, et l''EHPAD est à sec quel que soit le débit alloué. J''y réponds
    — interconnexion d''urgence, convention citernes avec le SDIS, inscription de l''EHPAD auprès de l''ARS,
    marché d''eau embouteillée pré-notifié. **Je vous offre la sécurité d''approvisionnement contre 45
    L/s de droit sur le papier.** C''est un bon échange, y compris de votre point de vue.


    ### Aux 34 exploitations


    Vous avez quitté la salle avant le vote. Je n''y vois pas une faute de procédure mais un signal :
    vous estimiez que le vote se ferait contre vous et refusiez de le légitimer. Je change donc ce qui
    est sur la table.


    - La question n''est plus « combien perdez-vous sur 240 » mais **« comment sauver le maximum d''hectares
    et les 34 exploitations avec l''eau qui existe physiquement »**.

    - Sur les 160 L/s réellement en débat, **vous recevez 69 %**.

    - L''objectif que je fixe n''est pas 46 % de votre eau : c''est **≈ 370 ha menés à terme sur 620**
    et **zéro exploitation en liquidation**. Jugez-moi sur ces deux chiffres.

    - **Droit de révision** : si les jaugeages donnent un débit supérieur, ou si la retenue recèle un
    volume mobilisable, **les 30 premiers L/s récupérés vont à l''irrigation**, avant tout autre usage.
    Mon incertitude joue en votre faveur.

    - **Campagne de contrôle OFB / police de l''eau sous 10 jours** sur les prélèvements non déclarés
    ; les volumes régularisés reviennent à la répartition. Ceux qui respectent la règle ne peuvent pas
    être les seuls à payer.


    Ce que je ne peux pas accorder : les 240 L/s, qui n''existent pas ; et l''abaissement du débit réservé,
    pour les raisons du § 3.


    ### À la presse


    La formule « les paysans ou les robinets » est factuellement fausse et je la contesterai publiquement,
    chiffres à l''appui. Vital potable + débit réservé = au plus 250 L/s sur 410. Personne à Ferney ne
    manquera d''eau. L''arbitrage porte sur les 160 restants, et il oppose **une saison de récolte à une
    décennie de rivière** — non des habitants à des agriculteurs.


    ## 7. Méthode et calendrier


    Je ne présenterai pas cette position à froid en plénière : transmission 72 h à l''avance avec annexes
    chiffrées, et entretiens bilatéraux d''ici jeudi avec le groupement maraîcher et la direction de la
    régie. Un vote acquis en l''absence d''une partie serait juridiquement valable et politiquement nul.


    **Portée juridique** — la commission ne peut pas restreindre les prélèvements. Nous adoptons (a) une
    délibération portant clé de répartition, (b) transmise au préfet pour reprise en arrêté sécheresse,
    (c) un protocole inter-usagers pour ce que l''arrêté ne couvre pas (tour d''eau, quotas, fonds).


    | Échéance | Action |

    |---|---|

    | J − 3 | Transmission du document ; entretiens bilatéraux |

    | **J (jeudi)** | Délibération : clé de répartition + échelle de paliers |

    | J + 3 | Données comptées de la régie ; bathymétrie ; évaporation |

    | J + 5 | Premier jaugeage ADCP ; clé de priorité agronomique |

    | J + 7 | Arrêté préfectoral ; tour d''eau opérationnel ; 1ʳᵉ tranche du fonds |

    | J + 10 | Campagne de contrôle OFB |

    | J + 15 | Fonds intégralement engagé |

    | Chaque lundi | Relevé publié, palier réévalué, notifié aux trois parties |


    ## 8. Limites de cette position


    Je les énonce plutôt que de les laisser découvrir en séance.


    1. Les 410 L/s reposent sur **une station unique étalonnée en 2023** ; toute la répartition en dépend.

    2. **Volume utile de la retenue et évaporation inconnus** — le bilan peut varier de plusieurs dizaines
    de L/s.

    3. **Le besoin de la régie n''est pas audité** ; les 105 L/s sont une estimation prudente à confirmer
    sous 72 h.

    4. **La clé de tri agronomique doit être validée par un agronome** : je propose le principe, la chambre
    l''applique.

    5. **L''existence d''un gros abonné industriel n''est pas établie** et pourrait modifier substantiellement
    le § 6.


    Aucune ne justifie de différer la décision — le débit ne se stabilisera pas pendant que nous complétons
    le dossier. Elles justifient que la décision soit **révisable chaque semaine selon une règle publiée
    à l''avance**.


    ---


    ### Annexe A — Besoin en eau potable de Ferney


    | Poste | Hypothèse | Volume |

    |---|---|---|

    | Domestique | 9 200 hab × 150 L/j | 1 380 m³/j |

    | EHPAD | 110 lits × 400 L/j | 44 m³/j |

    | Public, commerces, artisanat | +50 % du domestique | 690 m³/j |

    | **Sous-total consommé** | | **≈ 24 L/s** |

    | Production, rendement 60 % | | ≈ 41 L/s |

    | Production, rendement 50 % | | ≈ 49 L/s |

    | Aléas, défense incendie | | jusqu''à 70 L/s |

    | **Plancher proposé** | | **105 L/s** *(1,5 à 2,3 × le vital)* |

    | Demande régie | 1 409 L/hab/j | 150 L/s |


    ### Annexe B — Besoin d''irrigation


    | Poste | Valeur |

    |---|---|

    | Demande initiale | 240 L/s sur 620 ha |

    | Dose équivalente | 234 m³/ha/sem — 23,4 mm/sem *(dose pleine cohérente en maraîchage estival)* |

    | Attribution | 110 L/s ≈ 532 000 m³ sur 8 semaines |

    | Surface à dose pleine, sans équipement | ≈ 285 ha |

    | Avec goutte-à-goutte et paillage (−30 %) | ≈ 370 ha |

    | Valeur moyenne | 6 613 €/ha |

    | Gain des 260 k€ | ≈ +85 ha ≈ 560 k€ dès 2026 |


    ---


    **Deux remarques sur la démarche**, hors document :


    Le pivot de toute la position est le calcul par habitant sur le prélèvement de la régie. Si les données
    comptées arrivent sous 72 h et révèlent un gros abonné industriel légitime, l''équilibre proposé se
    déplace et le § 6 devra être réécrit avant jeudi. C''est le point à vérifier en priorité.


    Si vous souhaitez que je reprenne ce texte dans un fichier, autorisez l''écriture dans le répertoire
    de travail et je le régénère.

    '
