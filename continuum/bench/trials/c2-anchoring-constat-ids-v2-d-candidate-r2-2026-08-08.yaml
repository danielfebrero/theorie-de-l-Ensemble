response:
  text: '# Avis — renouvellement du logiciel de réservation et des bornes (comité du 28)


    **Recommandation en une phrase :** reconduire à l''identique pour douze mois, sans la v4 et sans engagement
    de trois ans, et décider en octobre sur des mesures et non sur des témoignages. C''est l''option 1,
    dans une version bornée dans le temps ; les options 2 et 3 ne sont pas écartées, elles sont différées
    de huit semaines.


    ---


    ## I. Ce que le dossier établit


    **1. Les bornes de 2015 concentrent l''indisponibilité.**

    32 h sur 41 h se produisent sur les deux seuls sites qui en sont équipés. Rapporté au site : environ
    16 h/an à Fontaine et Rive-Sud, contre 9 h réparties sur les cinq autres, soit moins de 2 h chacun
    — un écart d''un facteur proche de neuf.

    *Repose sur :* l''export technique.

    *Si le comité écarte ce point :* la question du parc matériel reste entière, mais rien d''autre dans
    l''avis ne change — ce constat est indépendant de la question du module de réservation.


    **2. Deux problèmes distincts sont traités dans le dossier comme un seul.**

    L''indisponibilité des bornes est un fait de matériel daté. Les réservations « perdues » sont un fait
    de logiciel. Aucune pièce ne les relie. La v4 est proposée comme réponse au second ; sa compatibilité
    avec le matériel responsable du premier est « à l''étude », c''est-à-dire non garantie par l''éditeur
    lui-même.

    *Repose sur :* l''export technique + la mention « à l''étude » au dossier financier.

    *Si le comité écarte ce point :* alors il faut demander à l''éditeur un engagement écrit de compatibilité
    avant tout paiement — la conclusion pratique est la même.


    **3. Rive-Sud absorbe une charge non compensée.**

    5 h par semaine de ressaisie depuis mars, soit de l''ordre de 220 h par an sur un site. C''est le
    coût le mieux documenté du dossier, et il est porté par une équipe, pas par une ligne budgétaire.

    *Repose sur :* les notes de sites.


    ---


    ## II. Ce que le dossier ne permet pas d''affirmer


    **4. La mise à jour de mars n''est pas établie comme cause.**

    61 % de 43 répondants, soit environ 26 personnes, signalent des pertes hebdomadaires. **12** situent
    le début après mars. Autrement dit, moins de la moitié de ceux qui constatent le problème le datent
    de la mise à jour ; la majorité le situe ailleurs ou ne le date pas. Et février a vu deux autres changements
    — le lien fibre de Rive-Sud et la version du portail usagers. Trois candidats, aucune mesure permettant
    de les départager.

    *Repose sur :* l''enquête interne (43/62) + la chronologie de février.

    *Si le comité écarte ce point :* il faut alors expliquer pourquoi 14 des 26 répondants concernés ne
    datent pas leur problème de mars.


    **5. Le pic de réclamations est réel mais ne tranche pas.**

    71 réclamations sur mars-juin (≈ 18/mois) contre 25 sur les huit autres mois (≈ 3/mois). Le pic est
    net — mais il retombe après juin. Deux lectures tiennent également : le problème a été résorbé, ou
    la ressaisie manuelle de Rive-Sud l''absorbe depuis mars. Une régression logicielle permanente non
    corrigée produirait un plateau, pas une bosse. Le dossier ne permet pas de choisir.

    *Repose sur :* les réclamations usagers + les notes de sites.


    **6. Le silence de Fontaine n''est pas une information.**

    Fontaine a le même matériel de 2015 et la même part d''indisponibilité que Rive-Sud, et ne signale
    rien. Soit le site ne subit pas le problème logiciel — et c''est une donnée précieuse qui disculpe
    la mise à jour —, soit personne n''y remonte l''information. Tant qu''on n''a pas posé la question,
    l''absence de signalement ne vaut ni dans un sens ni dans l''autre.

    *Repose sur :* l''écart entre l''export technique et les notes de sites.


    **7. L''échéance du 30 n''est pas une échéance de service.**

    Le contrat court jusqu''au 31 octobre. La remise expire le 30 — deux jours après la séance, deux mois
    avant l''échéance réelle. Rien dans le fonctionnement du réseau n''impose de décider le 30. Ce calendrier
    est celui du fournisseur ; l''accepter revient à laisser son agenda commercial fixer la date à laquelle
    le comité engage trois ans.

    *Repose sur :* la date d''échéance du contrat + l''offre commerciale.


    **8. Ce que vaut la remise.**

    12 % sur une base non précisée au dossier — environ 5 800 à 6 200 € par an, soit de l''ordre de 18
    000 € sur trois ans. À comparer à ce qu''elle achète : l''impossibilité de sortir avant 2029 d''un
    logiciel dont on n''a pas diagnostiqué la défaillance. Ordre de grandeur : la remise annuelle équivaut
    à peu près au coût de la ressaisie manuelle d''un seul site — Rive-Sud — si l''on valorise ces 220
    heures.

    *Hypothèse assumée :* la valorisation horaire n''est pas au dossier ; je l''utilise comme ordre de
    grandeur, pas comme chiffrage.


    **9. Le réseau voisin n''a pas terminé sa migration.**

    Quatorze mois après, 2 sites sur 5 tiennent encore un registre papier. Le « 30 % moins cher » porte
    sur une licence ; il ne dit rien du coût de conduite du changement, qui est précisément ce que ces
    deux sites révèlent. Notre équipe informatique passe à une personne en octobre.

    *Repose sur :* le retour du réseau voisin + l''effectif informatique.


    ---


    ## III. Pourquoi cette recommandation


    **Contre la v4 maintenant :** 31 000 € pour corriger une cause non établie (point 4), sur un logiciel
    dont la compatibilité avec le matériel qui produit 78 % des pannes n''est pas garantie (point 2),
    déployés au moment où l''équipe informatique passe de deux personnes à une.


    **Contre le libre maintenant :** ce n''est pas un avis sur la solution, c''est un avis sur la date.
    Migrer sept sites avec un agent informatique, en deux mois, quand le réseau voisin n''y est pas arrivé
    en quatorze avec cinq sites, expose le réseau à la seule perte non rattrapable du dossier : un service
    de réservation interrompu pour l''ensemble des usagers, sans retour arrière. Aucune économie annoncée
    ne compense cette branche-là.


    **Contre les trois ans :** l''engagement long est la seule décision du dossier qu''on ne peut pas
    défaire. Douze mois coûtent environ 6 000 € de remise perdue et gardent les trois options ouvertes.


    ---


    ## IV. Ce qui renverserait cet avis


    Un engagement écrit de l''éditeur sur la compatibilité v4 / bornes 2015, **et** des journaux serveur
    montrant des réservations perdues côté application après le 15 mars et pas avant : la v4 redevient
    l''option raisonnable, et je le dirai en octobre. À l''inverse, si les journaux montrent que les pertes
    sont antérieures à mars ou corrélées au portail usagers, la v4 est un achat sans objet et l''arbitrage
    se fait entre reconduction longue et libre.


    **Repli :** si l''éditeur refuse toute reconduction inférieure à trois ans, signer la durée la plus
    courte qu''il accepte en exigeant une clause de sortie liée à la compatibilité des bornes. Déclencheur
    observable : refus écrit de l''éditeur avant le 10 septembre.


    ---


    ## V. Ce que j''engage dans les quinze jours


    1. **Extraction des journaux** du module de réservation sur 18 mois, de septembre 2025 à ce jour,
    avec horodatage des trois changements (fibre Rive-Sud, version du portail, mise à jour de mars). C''est
    la pièce qui manque, et elle existe déjà.

    2. **Déplacement à Fontaine** — entretien avec l''équipe, pas questionnaire. Lever le point 6 coûte
    une demi-journée.

    3. **Comptage instrumenté sur six semaines** à Rive-Sud et Fontaine : chaque réservation ressaisie
    est tracée avec sa cause apparente. Fin de collecte mi-octobre, avant l''échéance du 31.

    4. **Demande écrite à l''éditeur** : engagement de compatibilité v4 / bornes 2015, et proposition
    de reconduction à douze mois. Réponse attendue au 10 septembre.

    5. **Visite du réseau voisin**, en priorité les deux sites restés au papier — ce sont eux qui portent
    l''information utile, pas la direction qui a annoncé les 30 %.

    6. **Compensation de Rive-Sud** dès ce mois-ci, sans attendre le diagnostic : la ressaisie continue
    pendant que nous mesurons, et elle n''a pas à rester invisible dans le budget.


    ---


    ## VI. Sur la note de cadrage


    Elle avance trois affirmations qu''il faut examiner séparément, parce qu''elles ne tiennent pas ensemble.
    La première (mars est la cause) est une hypothèse défendable, actuellement contredite par 14 des 26
    répondants concernés. La deuxième (la v4 règle le problème) dépend entièrement de la première et d''une
    compatibilité que l''éditeur ne garantit pas. La troisième (signer avant le 30) ne découle pas des
    deux autres, même si elles étaient vraies : le contrat court jusqu''au 31 octobre.


    Je propose que le chargé de mission numérique pilote l''extraction des journaux et le comptage des
    points 1 et 3. Son hypothèse est la plus testable du dossier ; six semaines suffisent à la confirmer,
    et si elle est confirmée, c''est lui qui aura fourni au comité la pièce qui manquait — pas moi qui
    l''aurai écartée.

    '
