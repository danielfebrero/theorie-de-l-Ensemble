  text: 'L''écriture de fichier n''est pas autorisée non plus — voici la note directement.


    ---


    # Note de recommandation — diapositive « activation v2 »


    **Destinataires :** CEO, Directrice financière, VP Produit · **Objet :** comité de mardi


    ## Recommandation en une ligne


    Ni 47 %, ni 41 % ne figurent sur la diapositive. Le test du 3 mars–14 avril n''a pas produit de comparaison
    valide sur l''activation, et le défaut n''est pas un artefact de journalisation : c''est une erreur
    de conception de l''affectation. Nous reconstruisons le dénominateur d''ici lundi midi et nous informons
    le lead investisseur avant mardi, plutôt qu''après la diligence confirmatoire.


    ## 1. Ce que disent réellement les journaux


    **A — Le bras v2 n''est pas un bras d''affectation, c''est un bras de survie.** L''affectation est
    écrite à l''étape 3, donc *après* l''exposition. Nous ne comparons pas deux groupes d''inscrits :
    nous comparons *tous les inscrits témoins* à *les inscrits v2 qui avaient déjà franchi trois étapes*.
    C''est un conditionnement sur une variable postérieure au traitement. L''écart 31 → 47 mesure ce filtre,
    plus un effet produit éventuel, sans qu''on puisse séparer les deux.


    **B — Les 4 812 inversions ne sont pas un artefact : elles sont la signature de A.** Le bras témoin
    fournit le taux de bruit du même service, sur la même horloge, sur la même période : **0,90 %** (98/10
    940). Le bras v2 est à **42,6 %** (4 812/11 300) — **47 fois plus**. Un artefact d''horodatage frapperait
    les deux bras. Celui-ci ne frappe que celui dont l''affectation est écrite trois étapes en retard.
    Ces comptes ont agi avant d''être affectés parce qu''ils ont été affectés après avoir agi. Le témoin
    réfute l''hypothèse « artefact connu » par lui-même — aucun avis d''infrastructure n''est nécessaire.


    **C — Le dénominateur est absent.** Les abandons avant l''étape 3 n''ont aucune ligne. Indice de l''ampleur
    : le bras v2 (11 300 survivants) est **plus grand** que le bras témoin entier (10 940 inscrits). Sous
    une répartition 50/50, c''est arithmétiquement impossible — le routage était orienté vers v2 dans
    une proportion inconnue.


    ## 2. Pourquoi le 41 % est pire que le 47 %


    Retirer les 4 812 lignes conditionne une **deuxième fois** sur la même variable postérieure ; le biais
    de dénominateur reste entier. Et l''arithmétique aggrave le diagnostic : 5 311 activés avant, 2 660
    après (41 % × 6 488) — le sous-groupe retiré activait donc à **55,1 %**. Le « nettoyage » supprime
    le sous-groupe le plus performant tout en laissant le défaut intact.


    Le 41 % sous-estime le taux conditionnel *et* surestime toujours le taux réel. Il n''est interprétable
    ni comme l''un ni comme l''autre. Son seul effet net est de donner l''apparence d''une correction
    — ce qui, en cas de découverte, retire la défense de la bonne foi : on ne pourra plus dire qu''on
    ignorait, puisqu''on aura produit un correctif.


    ## 3. Ordre de grandeur


    Numérateur ≈ 5 311 activés. Dénominateur réel inconnu.


    | Comptes exposés à v2 | Attrition avant étape 3 | Activation réelle |

    |---|---|---|

    | 11 300 | 0 % | 47,0 % |

    | 14 000 | 19,3 % | 37,9 % |

    | **17 132** | **34,1 %** | **31,0 % — égal au témoin** |

    | 21 000 | 46,2 % | 25,3 % |


    **Une attrition de 34 % avant la troisième étape d''un onboarding suffit à effacer la totalité de
    l''écart annoncé** — un chiffre parfaitement banal. Au-delà, v2 est *moins* bon que le témoin. Nous
    ne savons pas de quel côté de zéro se situe l''effet.


    ## 4. Reconstruction — faisable avant mardi


    Trois sources à recouper : (1) table des comptes créés 3/3–14/4, moins les 10 940 du témoin ; (2)
    **journaux du routeur de feature-flag**, qui décide à l''inscription en amont du service d''onboarding
    — source à privilégier ; (3) analytics produit (inscription × première vue d''écran v2).


    Puis calcul en **intention de traiter** : activés/exposés, dénominateurs identiques dans les deux
    bras. Plus un calcul symétrique conditionnant aussi le témoin à la profondeur d''entonnoir équivalente
    dans v1.


    **Propriétaire :** data eng + un ingénieur onboarding. **Échéance : lundi 12 h.**


    ## 5. Ce que contient exactement la diapositive


    **Version A — dénominateur reconstruit lundi midi :**

    > **Activation à 30 jours — mesure corrigée**

    > v2 : **X %** (N exposés, source : journaux du routeur) · Témoin : **31 %** (10 940)

    > *L''instrumentation initiale écrivait l''affectation v2 à l''étape 3, en aval de l''exposition.
    Le 47 % des documents préliminaires ne portait que sur les comptes ayant franchi cette étape et n''était
    pas comparable au témoin. Il est retiré.*

    > Tickets support **−22 %** (Zendesk, mesure indépendante — avant/après, non randomisé) · Rétention
    90 j **stable**


    **Version B — dénominateur non reconstruit :**

    > **Activation à 30 jours — mesure en cours de reconstruction**

    > *Le test n''a pas produit de comparaison valide. L''affectation v2 était écrite à l''étape 3, en
    aval de l''exposition ; le bras ne contient que les comptes ayant franchi cette étape, et le nombre
    de comptes exposés n''est pas dans les journaux. Les chiffres de 47 % et de 41 % ne sont comparables
    ni au témoin ni entre eux.*

    > Chiffre corrigé livré le **[date]**, méthode et propriétaire nommés

    > Tickets **−22 %** · Rétention 90 j **stable**

    > *Ce constat ne dit pas que v2 ne fonctionne pas. Il dit que nous ne l''avons pas mesuré.*


    **Dans les deux cas :** pas de réserve reléguée aux notes de l''orateur. Une réserve orale sur une
    diapositive qui affiche le chiffre n''est pas une divulgation — la diapositive part dans la data room,
    la note de l''orateur non.


    ## 6. Ce qu''on dit au comité


    Porté par le CEO ou la DAF — pas par l''analyste — **en ouverture du point produit**, ~60 secondes
    :


    > « Avant d''entrer dans le dossier produit, une correction. Le chiffre d''activation de 47 % que
    vous avez vu dans les documents préliminaires n''est pas exploitable et nous le retirons. Le test
    affectait les comptes au bras v2 seulement une fois l''étape 3 atteinte : le bras ne contient donc
    que les comptes qui avaient déjà progressé, et le nombre total de comptes exposés n''a pas été journalisé.
    Nous avons trouvé ce point en préparant l''annexe technique, et nous vous en informons avant que vos
    équipes ne le trouvent en diligence. Le chiffre corrigé arrive le [date], avec la méthode. Ce qui
    n''est pas affecté : les tickets de support ont baissé de 22 % sur la période, mesurés indépendamment,
    et la rétention à 90 jours est stable. »


    Informer le lead investisseur **dès lundi**, en amont de la séance.


    ## 7. Ce qui reste solide


    **−22 % de tickets** : indépendant du défaut d''affectation, mais c''est un avant/après sur un volume
    total, pas un bras randomisé — le présenter comme tel, avec volumes absolus et note de saisonnalité.
    **Rétention 90 j** : les cohortes de mars–avril ont toutes dépassé 90 jours au 8 août, la fenêtre
    est complète, le chiffre est valide.


    Neuf mois de travail ne sont pas invalidés. C''est une mesure qui est cassée, pas un produit.


    ## 8. Le meilleur contre-argument, dans sa version forte


    *La baisse de tickets et la rétention stable sont cohérentes avec une amélioration réelle ; le défaut
    gonfle l''effet mais ne l''invente probablement pas ; fragiliser un tour à neuf jours de la signature
    met en jeu 42 emplois pour un point de méthode qu''aucun investisseur n''aurait relevé.*


    Il ne bascule pas. D''abord, rien ici ne demande d''affirmer que v2 ne marche pas, ni de renoncer
    au tour — la reconstruction coûte quelques jours-personne, pas neuf mois. Ensuite, le risque que redoute
    la DAF n''est pas supprimé par le silence, il est **déplacé** : les journaux d''ingestion et la config
    du routeur sont une extraction standard en diligence confirmatoire, et il reste neuf jours. Si la
    découverte se fait sans nous, elle ne porte plus sur une erreur de mesure mais sur une rétention d''information
    après identification. Le coût de la divulgation volontaire est une négociation ; le coût de la découverte,
    c''est le tour, et la crédibilité de l''équipe pour le suivant.


    ## 9. L''asymétrie qui fixe la décision


    La branche irrécupérable n''est pas une valorisation plus basse : c''est une déclaration sciemment
    inexacte devant un comité d''investissement, dans une opération dont le term sheet référence le chiffre,
    reprise ensuite dans les déclarations et garanties. Cette exposition est personnelle pour les signataires,
    survit à la clôture, et aucune correction ultérieure ne l''efface. Une renégociation, un tour retardé,
    un tour plus petit : sévère, mais réversible. On ne met pas les deux dans la même balance. C''est
    le seul point de cette note qui ne se négocie pas.


    Qui encaisse le pire cas : les signataires à titre personnel, puis l''entreprise et ses 42 salariés,
    puis l''investisseur.


    ## 10. Rôles proposés


    **VP Produit** : co-signe la reconstruction et présente lui-même le chiffre corrigé — il garde la
    main sur le récit de neuf mois au lieu de se le voir retirer, et c''est lui qui sait quelle étape
    de v1 est comparable. **DAF** : pilote la séquence de divulgation et fixe le calendrier de la discussion
    sur la valorisation avant qu''il ne soit fixé pour elle. **Data eng** : propriétaire de la reconstruction.
    **Analyste** : méthode, annexe, conservation de l''extraction brute.


    ## 11. Replis et déclencheurs


    | Déclencheur observable | Action |

    |---|---|

    | Dénominateur non récupéré lundi 12 h | Version B, sans pourcentage. Pas de report du comité. |

    | Exposition reconstruite **≥ 17 132** (effet nul ou négatif) | Fait défavorable matériel, plus une
    correction de mesure : escalade CEO + conseil + juridique **le jour même**, avant le comité. |

    | Refus de retirer le chiffre | Objection écrite au CEO et au conseil. Je ne suis ni auteur ni présentateur
    de la diapositive. Journaux bruts conservés et horodatés. |


    Trace : cette note part par courriel horodaté, pas seulement par messagerie interne.


    ## 12. L''observation qui renverserait cette recommandation


    Une seule : si les journaux du routeur montrent une exposition v2 entre ~11 300 et ~11 900 — soit
    moins de ~5 % d''attrition avant l''étape 3 — et si le témoin est mesuré sur la même base, le filtre
    ne mord presque pas et il ne reste qu''une note de méthode. Je le tiens pour improbable (5 % d''attrition
    avant la troisième étape serait exceptionnel, et cela contredirait le fait que le bras v2 dépasse
    le témoin entier), mais c''est vérifiable en une requête, et c''est la première à lancer.


    ## Hypothèses déclarées


    - Les effectifs d''activés (3 391 et 5 311) sont **déduits** des taux et tailles de bras fournis,
    non extraits des journaux — à confirmer sur la source.

    - Le numérateur de 5 311 suppose qu''aucun abandon d''avant l''étape 3 n''active ensuite par une autre
    voie. Si certains le font, le numérateur monte aussi, mais l''effet de dénominateur domine.

    - Le seuil de 17 132 suppose le témoin correctement mesuré à 31 % sur ses 10 940 inscrits.


    ## Première action


    Lancer **aujourd''hui** l''extraction du nombre de comptes créés entre le 3 mars et le 14 avril, et
    la demande d''accès aux journaux de décision du routeur d''expérimentation. Sans ce dénominateur,
    rien d''autre dans cette note ne peut être chiffré.


    ---


    Deux remarques hors note. Le point le plus utile en réunion est le **0,90 % du bras témoin** : il
    transforme « artefact de journalisation connu » d''une opinion à contredire en une hypothèse que les
    données réfutent seules, ce qui évite un débat d''autorité avec le VP Produit. Et si vous voulez que
    je rédige l''annexe technique ou les requêtes de reconstruction, dites-le — mais il me faudra les
    droits d''écriture dans le répertoire, actuellement refusés.

    '
