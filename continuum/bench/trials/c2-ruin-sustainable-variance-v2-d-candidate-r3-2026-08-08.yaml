response:
  text: '## Note au conseil — arbitrage Sedamex / Nordwerk

    **Objet :** recommandation pour la séance de vendredi — **Option B (ligne Nordwerk), sous trois conditions
    suspensives.**


    ---


    ### 1. Ce que chaque option fait réellement au bilan


    Le dividende de 700 k€ est acquis et s''impose aux deux options : il ramène les fonds propres de 3,4
    à 2,7 M€ et la trésorerie de 2,6 à 1,9 M€. C''est le point de départ commun.


    | | Option A | Option B — succès (60 %) | Option B — échec (40 %) |

    |---|---|---|---|

    | Fonds propres à 18 mois | 2,9 M€ | 3,6 M€ | **2,3 M€** |

    | Trésorerie au point bas | 2,1 M€ | — | **1,5 M€** (mois 12) |

    | Marge covenant (seuil 1,2 M€) | +1,7 M€ | +2,4 M€ | **+1,1 M€** |

    | Espérance de résultat | +200 k€ | \multicolumn{2}{c}{**+380 k€**} |


    Dans le scénario le plus défavorable de B — échec constaté au mois 12, cumulé au second acompte de
    dividende — les fonds propres restent à **1,1 M€ au-dessus du covenant**, soit près du double du seuil,
    et la trésorerie couvre **neuf mois de masse salariale**. Aucun trimestre ne passe sous la barre bancaire.
    Le carnet de commandes n''est gagé dans aucune option.


    ### 2. Pourquoi B


    Le point de bascule est calculable : B ne devient inférieur à A que si la probabilité de succès tombe
    **sous 46 %**. Le bureau d''études l''estime à 60 %, sur onze installations comparables documentées.
    Nous disposons donc de **14 points de marge d''erreur** avant que la recommandation ne s''inverse.
    Ce n''est pas un pari sur un chiffre juste ; c''est un choix qui survit à une surestimation substantielle
    de nos propres équipes.


    ### 3. Réponse au directeur financier


    Son objection porte sur le bon risque, mais pas sur cette opération.


    **« On ne joue pas la maison. »** La maison n''est pas engagée, et c''est contractuel : perte plafonnée
    à 400 k€ pénalité comprise, **pas de caution personnelle du dirigeant, pas de défaut croisé, aucune
    sûreté sur l''actif industriel**. 400 k€ représentent 15 % des fonds propres post-dividende. Une perte
    de cette taille est douloureuse ; elle n''est pas irrécupérable. Le mouvement le plus coûteux et le
    plus certain de ces dix-huit mois n''est pas Nordwerk — c''est le dividende : 700 k€, exigibles à
    100 %, contre 400 k€ à 40 %, soit un coût espéré de 160 k€.


    **Le précédent Tremay.** Un dépôt de bilan ne vient jamais d''une ligne neuve seule : il vient d''une
    ligne neuve financée par dette, adossée à des sûretés, chez une entreprise sans coussin. Taille comparable
    ne veut pas dire bilan comparable. L''analogie ne devient pertinente que si le DAF peut établir que
    Tremay avait, lui aussi, une perte plafonnée, aucune sûreté consentie et 2,6 M€ de trésorerie sans
    dette. Je suis preneur de cette vérification avant vendredi : si elle aboutit, elle change la discussion.


    **Ce qui, en revanche, est un vrai risque et n''est pas dans les 400 k€ :** l''estimation à 60 % émane
    du bureau d''études, qui est partie prenante au projet, et les installations documentées peuvent souffrir
    d''un biais de sélection. Ce risque se traite par le contrôle, pas par le renoncement.


    ### 4. Trois conditions suspensives à la signature


    1. **Validation juridique du plafond** avant signature : confirmer par écrit que les 400 k€ n''excluent
    ni les frais de dépose et de remise en état, ni nos propres pénalités de retard clients, ni les dommages
    consécutifs. Le plafond est la pièce qui porte toute la recommandation.

    2. **Provision de 400 k€ cantonnée dès la signature**, sortie de la trésorerie disponible, avec **droit
    de veto du directeur financier** sur tout emploi alternatif. Le covenant et la paie cessent d''être
    un sujet, quel que soit l''issue.

    3. **Jalon technique contradictoire au mois 6**, co-signé par le directeur financier, avec obligation
    de déclencher la constatation d''échec dès qu''il n''est pas atteint — pour cristalliser la perte
    plutôt que la laisser dériver jusqu''au mois 12.


    ### 5. Ce qui renverserait ce choix, et la première action


    **L''observation qui inverse la recommandation :** toute exclusion au plafond de 400 k€, ou toute
    révision de la probabilité de succès sous 46 % à l''issue du contre-examen du dossier des onze installations.
    Dans ces deux cas, Sedamex redevient le choix supérieur.


    **Repli :** jalon du mois 6 non atteint → constatation immédiate de l''échec, imputation sur la provision
    cantonnée, retour au plan d''équilibre. **Aucune reprise du projet sans nouvelle décision du conseil.**


    **Première action, lundi :** mandater le conseil juridique sur le périmètre exact du plafond et faire
    contre-expertiser les onze références par un tiers extérieur au bureau d''études. Signature seulement
    après ces deux retours.


    ---


    Une réserve à porter au procès-verbal : la robustesse de B repose sur un plafond contractuel dont
    je n''ai pas encore lu les exclusions. Tant que le point 1 n''est pas levé, cette recommandation est
    conditionnelle, et je préfère la retirer que la faire voter sur une hypothèse.

    '
