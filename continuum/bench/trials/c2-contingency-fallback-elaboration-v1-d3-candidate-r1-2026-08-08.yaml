response:
  text: '# Plan d''exécution — conversion électrique de la flotte

    **Conseil du jeudi — document remis par la direction de l''exploitation**


    ---


    ## 1. Ce que ce plan tient, et ce qu''il demande


    La commande est ferme et le plan ci-dessous la met en œuvre. Il garantit **60 véhicules électriques
    en exploitation avant le 31 janvier** — donc la subvention de 620 000 € — sans jour de rupture de
    service.


    Il repose sur trois engagements financiers, tous couverts par la subvention qu''ils sécurisent :


    | Poste | Montant | Décision |

    |---|---|---|

    | Lot 1 : 8 bornes devisées | 210 000 € | **Jeudi** — commande le lendemain |

    | Lot 2 : 6 bornes supplémentaires | ~160 000 € | **Jeudi** (engagement), confirmation au 15 septembre
    |

    | Coussin diesel (prolongations) | ~80 000 € attendu, **207 000 € plafond** | **Jeudi** — premier
    préavis avant le 31 août |

    | **Total** | **~450 000 € attendu / 577 000 € plafond** | vs 620 000 € de subvention |


    Le point dur de ce dossier n''est pas l''autonomie des véhicules. C''est la capacité de recharge,
    et elle est sous-dimensionnée d''un facteur deux dans le devis actuel.


    ---


    ## 2. Le constat dimensionnant : la charge, pas l''autonomie


    Une charge complète prend 6 h sur une borne de 22 kW, soit **132 kWh livrés par véhicule et par nuit**.
    Rapporté à l''autonomie mesurée en conditions hivernales (197 km à 2 °C avec chauffage), la consommation
    de dimensionnement est de **0,67 kWh/km à la borne**.


    En retenant une fenêtre de charge nocturne de 13 h (retour 17 h 30, départ 6 h 30) :


    | Kilométrage de la tournée | Énergie | Temps de borne | Véhicules par borne et par nuit |

    |---|---|---|---|

    | 150 km | 100 kWh | 4,6 h | 2,8 |

    | 168 km (moyenne actuelle) | 113 kWh | 5,1 h | 2,5 |

    | 240 km (plus longue) | 161 kWh | — | **infaisable** : dépasse la capacité batterie |


    D''où la capacité réelle de chaque configuration :


    | Bornes | Heures-borne / nuit | VE sur tournées ≤ 150 km | VE sur tournées à 168 km |

    |---|---|---|---|

    | 14 (existant) | 182 | 39 | 35 |

    | 22 (avec lot 1) | 286 | 62 | 56 |

    | 28 (avec lot 2) | 364 | **79** | 71 |

    | ~40 (cible 96 VE) | 520 | 113 | 102 |


    **Trois conclusions.**


    Les 14 bornes actuelles plafonnent la flotte à environ 35 véhicules exploitables. **Sans le lot 1,
    la subvention est perdue** — quel que soit le rythme de livraison.


    Avec le lot 1 seul, l''objectif de 60 véhicules passe à 62 dans le meilleur cas d''affectation, soit
    3 % de marge. C''est insuffisant pour un enjeu de 620 000 € : une borne en panne, une arrivée tardive,
    et l''objectif tombe. Le lot 2 porte la marge à 30 %.


    Enfin, **les 8 bornes devisées ne permettront jamais d''exploiter 96 véhicules.** L''exploitation
    de la flotte complète demande environ 40 points de charge, soit 880 kW de puissance appelée. Ce n''est
    pas une décision de jeudi, mais le conseil doit savoir qu''elle arrive : elle sera instruite pour
    la séance de novembre.


    ---


    ## 3. La question qui peut faire tomber le calendrier : le raccordement


    Vingt-huit bornes de 22 kW représentent 616 kW de puissance simultanée ; les 14 bornes actuelles en
    consomment déjà 308. Les travaux sont annoncés à 7 semaines, mais **ce délai ne couvre que la pose**,
    pas une éventuelle augmentation de puissance souscrite ou une reprise de poste de livraison. Un dossier
    Enedis de ce calibre se compte en mois, pas en semaines.


    Une demande de puissance est déposée sur les deux plateformes **lundi**, avec demande de délai ferme
    sous quinze jours. Si le délai annoncé dépasse 12 semaines sur l''une des plateformes, le repli est
    le **pilotage de charge** : brider les bornes à 16 kW et étaler sur 13 h permet d''exploiter davantage
    de points sur la puissance existante, au prix d''un temps de charge allongé de 37 %. Cette option
    préserve la subvention ; elle ne préserve pas la cible finale de 96 véhicules.


    ---


    ## 4. Affecter les véhicules aux tournées qu''ils peuvent tenir


    Les onze recharges non prévues de l''essai sont **toutes survenues sur des tournées de plus de 190
    km**. C''est le fait le plus utile du dossier : l''incident n''est pas aléatoire, il est déterminé
    par le kilométrage.


    Règle d''affectation retenue : **seuil de 150 km** pour les véhicules électriques jusqu''au 28 février,
    révisable ensuite. Ce seuil consomme 76 % de la batterie dans les conditions de janvier, soit 24 %
    de marge pour le trafic, le chauffage et le vieillissement. Les tournées au-dessus du seuil restent
    en diesel.


    Cela suppose de disposer de 60 tournées à 150 km ou moins. Nous ne le savons pas aujourd''hui : la
    moyenne est à 168 km et **la distribution des 96 tournées par kilométrage n''a jamais été produite**.
    Le superviseur de flotte remonte déjà les kilomètres ; l''histogramme est demandé pour le 12 août.


    L''arithmétique laisse la place : 96 tournées × 168 km = 16 128 km/jour. Un découpage en 60 tournées
    à 150 km maximum (9 000 km) et 36 tournées à 198 km de moyenne (7 128 km) est cohérent avec le maximum
    actuel de 240 km. Le redécoupage est donc réalisable ; il coûtera 3 à 5 % de kilomètres supplémentaires,
    soit environ 60 000 € par an, à comparer aux 620 000 € qu''il sécurise.


    **Ce redécoupage touche 96 conducteurs et leurs clients.** Il ne sera pas imposé depuis le siège.
    Un comité d''affectation associant six conducteurs élus, dont les volontaires de l''essai de mars,
    arbitre le découpage et dispose d''un droit de veto sur toute tournée dégradant l''amplitude horaire.
    Les clients dont la tournée change sont prévenus avant le changement, pas après. Ce comité est constitué
    la semaine du 18 août ; le découpage est arrêté au 5 septembre.


    ---


    ## 5. Les diesels : la règle de rendu et son coût


    **C''est ici que se situe le seul risque irrécupérable du dossier.** Un véhicule rendu ne peut pas
    être repris avant 11 semaines. Si nous rendons des diesels et que la charge ne suit pas, nous sommes
    sans solution pendant onze semaines.


    Ordre de grandeur du pire cas : 30 tournées non tenues par jour × 900 € × 55 jours ouvrés = **1 485
    000 €**, sans compter la perte de clients. Le coût de conservation des mêmes 30 véhicules sur la même
    période est de 43 200 €. Le rapport est de 34 pour 1. Aucune économie de location ne justifie de prendre
    ce pari.


    **Règle de rendu.** Le 1er de chaque mois, nous notifions au loueur les seuls lots dont la tournée
    correspondante a été **tenue en électrique pendant 15 jours ouvrés consécutifs, sans recharge non
    prévue ni retard imputable à l''énergie**. Tout le reste est prolongé d''un mois. Le préavis de 30
    jours impose de décider à date fixe : cette règle rend la décision automatique et auditable, et fait
    du silence l''option par défaut — 480 € contre 900 € par tournée manquée.


    Un volant de 12 diesels est conservé jusqu''au 31 mars quoi qu''il arrive, pour absorber les pannes,
    les immobilisations et les tournées exceptionnelles du premier hiver.


    | Scénario | Surcoût de prolongation |

    |---|---|

    | Nominal (certification au rythme prévu) | ~80 000 € |

    | Dégradé (une plateforme en retard d''un trimestre) | ~140 000 € |

    | **Plafond absolu** (flotte diesel entière conservée jusqu''à fin mars) | **207 360 €** |


    Même le plafond reste très inférieur à la subvention.


    ---


    ## 6. Calendrier


    | Échéance | Jalon |

    |---|---|

    | Lundi 11 août | Dépôt des demandes de puissance Enedis, deux plateformes |

    | 12 août | Histogramme des 96 tournées par kilométrage |

    | 15 août | Bon de commande lot 1 (8 bornes) |

    | 18 août | Constitution du comité d''affectation |

    | **31 août** | **Premier préavis au loueur : prolongation des 96 diesels pour octobre** |

    | 5 septembre | Découpage des tournées arrêté |

    | 15 septembre | Réponse Enedis → confirmation ou arbitrage du lot 2 |

    | Septembre | Livraison 24 VE — qualification, formation, aucun rendu diesel |

    | Fin septembre | Lot 1 opérationnel (22 bornes) |

    | Mi-octobre | Premières tournées certifiées → premiers rendus au 1er novembre |

    | Octobre–novembre | Livraisons 24 + 24 ; lot 2 opérationnel |

    | Décembre | Livraison 24 (96 livrés) ; **objectif : 60 VE certifiés au 20 décembre** |

    | **31 janvier** | **60 VE en exploitation → subvention acquise** |


    La marge de six semaines entre l''objectif interne du 20 décembre et l''échéance du 31 janvier est
    délibérée. Elle absorbe un retard de livraison d''un mois ou une plateforme bloquée.


    ---


    ## 7. Pilotage et repli


    Le tableau de bord publie déjà chaque soir, par plateforme, le taux de tournées terminées et le nombre
    de recharges non prévues. Ce sont les deux indicateurs du plan — aucun instrument nouveau n''est nécessaire.


    **L''indicateur avancé est la recharge non prévue**, pas la tournée manquée : c''est lui qui bouge
    en premier, et c''est sur lui que nous agissons.


    | Déclencheur observable (moyenne 5 jours ouvrés glissants) | Action, sans nouvelle réunion |

    |---|---|

    | Recharges non prévues > 3 % des tournées électriques | **Gel de tous les rendus diesel** ; les tournées
    concernées repassent en diesel sous 48 h |

    | Tournées électriques terminées < 98 % | Gel des rendus + abaissement du seuil d''affectation de
    150 à 130 km |

    | Deux journées consécutives à plus de 5 tournées manquées sur une plateforme | Retour intégral de
    la plateforme en diesel, réexamen du plan sous 72 h |

    | Délai Enedis annoncé > 12 semaines | Bascule sur le pilotage de charge à 16 kW ; lot 2 réexaminé
    |


    Aucune reprise automatique après déclenchement : le retour en exploitation électrique est décidé explicitement,
    sur cinq jours ouvrés propres.


    ---


    ## 8. Ce qui renverserait ce plan


    Je remets au conseil l''objection la plus sérieuse qu''on puisse lui opposer, et la réponse.


    *« Vous payez deux flottes en parallèle et vous alourdissez le projet de 450 000 € pour un risque
    hypothétique. »* La subvention exige 60 véhicules en service, pas 96 — conserver des diesels ne l''empêche
    donc jamais. Le coussin coûte 80 000 € attendus contre un pire cas à 1,5 M€, et les bornes ne sont
    pas une précaution : sans elles, la flotte plafonne à 35 véhicules et la subvention est perdue mécaniquement.
    Ces 450 000 € ne protègent pas contre un risque, ils achètent la condition d''obtention des 620 000
    €.


    **L''observation qui ferait tomber ce plan** est l''histogramme du 12 août. S''il montre qu''il est
    impossible de composer 60 tournées à 150 km ou moins sans augmenter le kilométrage total de plus de
    5 %, alors l''affectation ne suffit pas et l''objectif de janvier repose sur de la charge rapide en
    courant continu — un dossier différent, plus cher, avec un délai de raccordement plus lourd. Le conseil
    en serait saisi le 15 septembre, en même temps que la réponse Enedis.


    Deux limites de nos données, que j''assume : la mesure de 197 km porte sur six véhicules neufs en
    mars, pas sur des batteries rodées en janvier ; et l''essai n''a jamais testé une tournée de 150 km
    à 2 °C. Le seuil de 150 km conserve 24 % de marge précisément pour cela, et le déclencheur à 3 % est
    là pour le cas où cette marge serait optimiste.


    ---


    ## 9. Décisions demandées jeudi


    1. **Engager le lot 1** — 8 bornes, 210 000 €, commande le 15 août.

    2. **Engager le lot 2** — 6 bornes, ~160 000 €, confirmé ou réarbitré au 15 septembre selon la réponse
    Enedis.

    3. **Ouvrir l''enveloppe de prolongation diesel** — 207 000 € en plafond, ~80 000 € attendus.

    4. **Approuver la règle de rendu conditionnel** : aucun diesel rendu avant 15 jours ouvrés propres
    sur la tournée qu''il servait.

    5. **Mandater la recomposition des tournées** et la constitution du comité d''affectation avec droit
    de veto des conducteurs sur l''amplitude horaire.


    **Première action après le vote :** dépôt des demandes de puissance Enedis lundi 11 août au matin.
    C''est le seul délai que nous ne maîtrisons pas, et il commande tout le reste du calendrier.

    '
