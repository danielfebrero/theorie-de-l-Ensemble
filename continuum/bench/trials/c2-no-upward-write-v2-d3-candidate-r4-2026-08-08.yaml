response:
  text: '# Recommandation


    **Aucun chiffre de gain d''activation sur la diapositive.** Ni 47 %, ni 41 %, ni « environ +10 points
    ».


    ## Le fait décisif


    Le bras v2 n''est pas un bras d''expérience, c''est **une liste de survivants**. L''affectation est
    écrite à l''étape 3 ; les comptes exposés à v2 qui abandonnent avant n''existent dans aucun bras.
    Le témoin, écrit à l''inscription, contient ses abandons. Les deux taux portent sur des populations
    différentes.


    Ce n''est pas un artefact de journalisation, et c''est prouvable en une ligne : **42,6 % d''inversions
    au bras v2 contre 0,9 % au témoin.** Un défaut d''horloge frapperait les deux bras — même service,
    même horloge NTP, aucun incident. Celui-ci ne frappe que le bras dont la règle d''écriture diffère.
    Les 4 812 inversions ne sont pas du bruit à retirer : ce sont la signature du mécanisme.


    Sur « artefact connu » : connu de qui, consigné où ? L''infra n''a trouvé aucun ticket.


    ## Pourquoi le 41 % est pire que le 47 %


    Les 6 488 lignes restantes ont exactement le même conditionnement — toutes ont atteint l''étape 3.
    Le filtre a même supprimé de façon non aléatoire les comptes qui ont mis *le plus de temps* à y arriver.
    Ce n''est pas un 47 % corrigé, c''est un biais différent.


    Surtout, il est plus dangereux : il constitue une **affirmation de remédiation**. Dire « nous avons
    nettoyé » engage l''entreprise sur le fait que le problème est traité. En cas de découverte ultérieure,
    l''écart 47 → 41 documente qu''on a vu le défaut, produit un correctif, et publié quand même.


    ## L''ordre de grandeur


    Le numérateur (5 311 comptes activés) est probablement juste. C''est le dénominateur qui manque. Avec
    `d` = abandon avant l''étape 3, l''activation réelle vaut **47 % × (1 − d)** :


    | Abandon avant étape 3 | Activation v2 réelle |

    |---|---|

    | 10 % | 42,3 % |

    | 20 % | 37,6 % |

    | **34 %** | **31 % — parité** |

    | 40 % | 28,2 % |


    **Un abandon de 34 % annule tout le gain** — une valeur parfaitement ordinaire pour un tunnel d''onboarding.
    Et les 4 812 comptes ayant eu le temps d''agir avant d''être affectés établissent que l''étape 3 n''est
    pas franchie instantanément. Le signe de l''effet n''est pas déterminé.


    Détail à vérifier : 11 300 *survivants* v2 dépassent les 10 940 *inscrits* témoins. Si la répartition
    était équilibrée, c''est impossible — l''exposition v2 est donc nettement supérieure à 11 300.


    ## La diapositive


    Elle mène avec ce qui est mesuré : **−22 % de tickets** (file Zendesk, indépendante du système d''affectation)
    et **rétention 90 j stable**. Puis une ligne en clair : le marqueur d''affectation v2 a été écrit
    après le début du parcours, le dénominateur est incomplet, lecture corrigée livrée le [date].


    Deux précautions : ces deux métriques sont des mesures **avant/après**, pas des contrastes entre bras
    — ne pas leur prêter de causalité. Et si l''annexe contient un découpage tickets-par-bras ou rétention-par-bras,
    il sort aussi : il hérite du même défaut.


    La réserve dans les notes de l''orateur ne marche pas. Le comité lit la diapositive ; le term sheet
    référence la courbe, pas les notes. Une réserve invisible pour le destinataire n''atténue pas la déclaration
    — elle établit seulement qu''on savait.


    ## Le meilleur argument contre


    Le plus fort : « le −22 % confirme indépendamment que v2 marche ; le biais gonfle l''amplitude, il
    n''inverse probablement pas le signe ; exiger la reconstruction coûte une valorisation réelle pour
    un chiffre qui reviendra vers 38 % ; un comité de série B lit les notes de bas de page. »


    **Il tient en partie et change le cadrage, pas la décision.** Ce qu''il emporte : v2 est probablement
    bonne, la note ne doit pas se lire comme un désaveu — d''où la diapositive qui mène avec les résultats
    validés. Ce qu''il n''emporte pas : « n''inverse probablement pas le signe » est une intuition, pas
    une mesure, et le seuil de bascule est banal. Et une note de bas de page qualifie un chiffre *calculé*
    — ici la quantité n''est pas identifiée.


    ## Ce qui est récupérable avant mardi


    À lancer aujourd''hui : **rejouer la règle d''affectation hors ligne** sur la table complète des inscriptions.
    Si la répartition est déterministe, on reconstruit l''affectation voulue pour chaque compte, abandons
    compris. C''est une requête, pas un nouveau test. À défaut : journaux d''évaluation du drapeau, routes
    spécifiques v2, événements étape 1/2. L''arbitrage n''est donc probablement pas « divulguer *ou* mesurer
    », mais « divulguer *et* mesurer ».


    ## Déclencheurs


    - **Reconstruction non aboutie lundi 18 h** → aucun chiffre de gain, sans approximation orale.

    - **Activation v2 ≤ témoin** → escalade CEO + DAF + conseil avant le comité.

    - **Recommandation écartée et chiffre maintenu** → objection écrite datée, avec extraits de journaux,
    à la DAF et au CEO avant la séance. Je ne présente pas cette diapositive.


    ## Ce qui renverserait cette note


    Si les journaux d''aiguillage montrent que l''exposition v2 vaut 11 300 à quelques dizaines près,
    le bras n''est pas conditionné et le 47 % tient. Forme équivalente : si l''étape 3 est atteinte en
    quelques secondes par la quasi-totalité des exposés. Les 4 812 sont un indice contraire, mais la mesure
    directe tranche — elle doit être faite avant de conclure dans un sens comme dans l''autre.


    ---


    Un point de séquencement, qui compte autant que le contenu : cette information doit atteindre le chef
    de file **en pré-brief**, portée par la directrice financière. Une correction volontaire avant le
    comité et une découverte en due diligence après signature ne sont pas le même événement — ni en négociation,
    ni juridiquement. C''est aussi la seule version où elle garde la main sur le cadrage.

    '
