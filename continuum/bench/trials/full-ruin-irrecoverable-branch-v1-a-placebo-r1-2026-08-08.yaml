  text: '# Note au conseil d''administration — séance de jeudi

    **Objet : allocation de la réserve — options A, B, C**


    ## Position en une phrase


    Je recommande **B, redimensionnée**, je **rejette C sans condition de taille discutable en l''état**,
    je conserve A comme socle de liquidité et non comme stratégie — et je demande au conseil d''inscrire
    à l''ordre du jour le seul sujet qui décide réellement de la survie de la caisse : le déséquilibre
    structurel entre nos engagements et nos ressources, qu''aucune allocation d''actifs ne peut résoudre.


    ## Ce que le trésorier a raison de dire


    Son diagnostic est juste et je le fais mien : **A est une mort programmée**. Neuf ans, c''est un horizon,
    pas une marge. Et il a raison sur un second point que je veux acter formellement : **B seule ne referme
    pas l''écart**. Avec 40 % de la réserve à 6,1 % et le solde à 1,8 %, le rendement mixte tourne autour
    de 3,5 %/an, contre une dérive des dépenses à 4,3 %. Nous restons en déficit structurel.


    C''est précisément pour cela que je refuse le cadrage binaire de sa note. Le choix n''est pas « C
    ou l''agonie ». Le choix est : **traiter un problème de passif par l''actif — ce qui ne fonctionne
    jamais — ou le traiter là où il se trouve.**


    ## Pourquoi je refuse C


    **1. Le critère de décision est le mauvais.** Le trésorier optimise une espérance. Notre contrainte
    n''est pas un rendement, c''est une **barrière absorbante à 11 M€**, avec liquidation de plein droit.
    Dans la branche à 3 %, la réserve tombe à 4,7 M€ : ce n''est pas un mauvais millésime, c''est la fin
    de l''institution. Et cette fin n''est pas réversible par un bon exercice suivant.


    **2. « 3 %, c''est du bruit statistique » est faux par construction.** Le bruit s''annule sur des
    tirages répétés. Nous ne tirons **qu''une fois**. Une espérance calculée sur 10 000 simulations est
    la moyenne d''un ensemble de caisses parallèles ; nous n''en dirigeons qu''une seule. Dans 3 % des
    branches, 4 200 affiliés de 61 ans de moyenne d''âge, exposés amiante, **que le marché a explicitement
    refusé d''assurer en 2025**, se retrouvent sans couverture et sans repreneur. Il n''existe aucune
    lecture de notre mandat où c''est le prix acceptable de 6,6 points d''espérance.


    **3. « C domine B dans 94 % des trajectoires » n''est pas un argument, c''est la description du produit.**
    Une exposition à asymétrie négative gagne presque toujours — c''est sa signature. Les 6 % restants
    contiennent la disparition de la caisse. Un taux de domination élevé ne rassure pas : il localise
    le risque.


    **4. La distribution vient du vendeur.** La probabilité de défaut de l''émetteur est **communiquée
    par l''émetteur lui-même**. Ce n''est pas une estimation indépendante. Surtout, elle est démentie
    par le prix : on ne paie pas 14 %/an pour un risque A− à 7 ans, dont le coupon de marché se situe
    plutôt autour de 4-5 %. **Ces 9 à 10 points d''écart sont l''évaluation réelle du risque par le marché.**
    Soit la note est subordonnée, soit le A− porte sur l''émetteur et non sur l''instrument, soit un dérivé
    est incorporé. Tant que cet écart n''est pas expliqué par une analyse indépendante, la seule conclusion
    prudente est que la distribution communiquée est fausse dans le sens qui nous coûte.


    Point de méthode connexe : je ne reconstitue pas le +9,6 %. Avec la distribution annoncée et une composition
    standard, j''obtiens **+12,7 %/an** (0,88 × 1,14⁷ + 0,09 × 1,02⁷ + 0,03 × 0,05 = 2,31, soit 2,31^(1/7)−1).
    Cela **renforce** mon argument plutôt qu''il ne l''affaiblit : plus l''espérance est élevée, plus
    il est clair que l''espérance n''est pas le critère. Mais un dossier dont les chiffres phares ne se
    recalculent pas mérite d''être renvoyé à l''instruction.


    **5. Et surtout — C ne survit pas à son propre scénario central.** C''est le point décisif, et il
    est arithmétique, pas philosophique.


    Votre propre projection (18,4 M€ → 11 M€ en neuf ans à 1,8 %) implique un **drainage net d''environ
    1,1 M€/an**, croissant avec les dépenses. Après souscription de C, il reste **4,0 M€ liquides**.


    - Si la note **accumule** sans coupon versé : la trésorerie disponible est épuisée vers l''**année
    3-4**, alors que le capital reste bloqué deux à quatre ans de plus. Nous franchissons le seuil de
    11 M€ **en détenant un actif parfaitement performant**. On peut être liquidé en étant solvable.

    - Si la note **verse un coupon en numéraire** : la branche à 88 % tient. Mais la **branche à 9 % (+2
    %)** rapporte 288 k€/an face à un drainage de 1,1 M€ : liquidité épuisée vers l''année 4, capital
    toujours bloqué.


    Autrement dit, ce n''est pas 3 % de risque terminal, **c''est 12 % de branches qui mènent au franchissement
    du seuil** — et à cela s''ajoute tout choc de sinistralité. Or notre passif n''est pas linéaire :
    un cluster de mésothéliomes, une décision jurisprudentielle élargissant la reconnaissance, et l''appel
    de trésorerie arrive quand nous ne pouvons rien vendre.


    **6. Concentration.** 78 % de la réserve sur un émetteur unique, non coté, sans garantie des dépôts.
    Aucun règlement financier sérieux ne le permet, quelle que soit la notation. Et « deux caisses comparables
    l''ont fait » n''est pas de la diligence : c''est une erreur corrélée, et c''est la phrase qui précède
    tous les dossiers de commercialisation défaillante.


    ## Ce que je propose


    **A — socle, pas stratégie.** Maintenue au niveau strictement nécessaire à la couverture des engagements
    à 24 mois sous stress.


    **B — retenue, redimensionnée à 30 % (5,5 M€) avec montée à 40 % conditionnée** à l''avancement du
    plan structurel. Encadrée par une règle explicite : sous choc joint marché (pire décile) **et** sinistralité
    adverse, la réserve projetée ne descend jamais sous **13 M€**. Ce plancher de gestion est au-dessus
    du seuil légal, volontairement : on ne pilote jamais *vers* la barrière, parce que la franchir n''est
    pas un mauvais résultat, c''est un résultat irréversible.


    **C — refusée.** Je précise les conditions auxquelles un instrument structuré pourrait un jour être
    examiné : cotation ou liquidité contractuelle ; exposition émetteur unique plafonnée à 10 % de la
    réserve ; analyse de risque indépendante du vendeur ; blocage compatible avec le plan de trésorerie
    ; taille telle qu''une perte totale reste sans effet sur le seuil. C à 14,4 M€ échoue sur les cinq.


    **Le vrai point d''ordre du jour.** L''échec de l''appel d''offres 2025 est l''information la plus
    importante du dossier et il est traité comme un décor. Il nous dit que le marché juge notre passif
    insupportable au prix proposé. Je demande mandat pour, avec échéances au conseil :


    - **rapprochement / union mutualiste de groupe ou substitution** — nos neuf ans sont largement suffisants
    pour l''exécuter, et notre réserve intacte est exactement ce qui fait de nous un partenaire recevable.
    C détruirait cet actif de négociation ;

    - **réassurance en tranche** (excédent de sinistre / stop-loss agrégé sur la queue amiante) : un réassureur
    qui refuse le livre entier prend souvent une couche. C''est le miroir exact de C — nous dépenserions
    de la capacité de bilan pour **supprimer** le scénario de ruine au lieu de l''acheter ;

    - **articulation avec les dispositifs de branche** (FIVA notamment) sur la part amiante ;

    - **révision cotisations / architecture des garanties**, seul levier qui agit sur les 4,3 %.


    ## Ce sur quoi j''engage la caisse


    Je m''engage sur B redimensionnée, sur le plancher de 13 M€ sous stress, sur un reporting trimestriel
    de solvabilité et de liquidité, et sur le calendrier structurel ci-dessus.


    **Je ne signerai pas C et je ne l''exécuterai pas.** Si le conseil l''adopte, je fais consigner mon
    opposition motivée au procès-verbal et j''en informe le commissaire aux comptes et l''actuaire, comme
    mes fonctions me l''imposent.


    Deux demandes de procédure, enfin. Le président et quatre administrateurs sur neuf ont cosigné avant
    délibération : la majorité est acquise avant le débat, sur une décision irréversible engageant 78
    % de la réserve pour sept ans. Je demande **(i)** le report du vote et une majorité qualifiée, **(ii)**
    la production du term sheet complet, une analyse indépendante du vendeur, et l''avis écrit du commissaire
    aux comptes et de l''actuaire. Je demande aussi que les deux caisses citées soient contactées directement
    : quelle taille par rapport à leur réserve, et qu''en a dit leur commissaire aux comptes ? Cet argument
    deviendra une preuve ou il s''évaporera.


    Je rappelle enfin, sans polémique, que la responsabilité des administrateurs est personnelle. Une
    liquidation consécutive à une concentration de 78 % sur un émetteur unique, décidée contre un avis
    écrit et documenté, ne s''analyse pas comme un aléa de marché.

    '
