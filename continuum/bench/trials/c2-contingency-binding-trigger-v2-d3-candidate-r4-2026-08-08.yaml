    ## Verdict : **Option A**, mais pas la version qui est sur la table


    A telle qu''elle est décrite ferme Solda le 30 novembre et joue tout décembre sans filet. Ça, c''est
    indéfendable. A **plus 130 k€ de Solda en réserve chaude jusqu''au 31 décembre** : économie nette
    **370 k€**, contre **50 k€ au plus** pour B.


    Deux chiffres du dossier ne tiennent pas :


    - **B coûte 260 k€ non budgétés.** Dix semaines à partir du 3 novembre finissent le 12 janvier. Solda
    doit donc rester ouvert en décembre et janvier à 130 k€/mois — sans rapport avec la ligne « double
    run 45 k€/mois ». B **subit** à 260 k€ la réversibilité qu''A **achète** à 130 k€.

    - **Les 500 k€ d''A ne sont pas 500 k€.** Payflux se stabilise à 0,5 % contre 0,4 % : ce dixième de
    point vaut 276 k€ de CA par an, à faire tomber par un SLA contractuel.


    ---


    # Note au comité de direction — Prestataire de paiement


    **De :** Direction des opérations · **8 août 2026** · **Objet :** Solda / Payflux — recommandation
    et calendrier


    ### Recommandation : Option A

    Bascule intégrale le **3 novembre**, assortie du maintien de Solda en réserve chaude **jusqu''au 31
    décembre** (130 k€). **Économie nette année 1 : 370 k€.** Le point de non-retour passe du 30 novembre
    au 31 décembre — après le vendredi noir et après Noël.


    ### Les chiffres


    | | **A** | **B** |

    |---|---|---|

    | Économie annoncée | 500 k€ | 310 k€ |

    | Prolongation Solda | −130 k€ (décembre, **choisie**) | −260 k€ (déc. + janv., **subie**) |

    | **Économie réelle année 1** | **370 k€** | **50 k€ au plus** |

    | CA exposé pendant la montée en charge | 143 k€ | 21 k€ |


    *Base : 756 000 € de CA/jour. Chaque dixième de point de taux d''échec vaut 756 €/jour, soit 276 k€
    de CA sur l''année.*


    ### Pourquoi B s''effondre

    Dix semaines, deux calendriers possibles, tous deux perdants :

    - **Départ le 3 novembre** → fin le 12 janvier. Solda ouvert en décembre et janvier à son tarif écrit
    de 130 k€/mois : **260 k€ absents du dossier**. Il ne reste que 50 k€.

    - **Départ le 17 septembre**, pour finir avant le vendredi noir → la fenêtre de sortie sans pénalité
    de 90 jours s''épuise début décembre. On perd la seule porte de sortie gratuite juste avant Noël.


    B est présentée comme l''option prudente. Elle paie deux fois plus cher une prudence moins bien placée.


    ### Ce qui rend A tenable : le calendrier, pas la confiance

    - **3–30 novembre :** le contrat Solda court encore. Bascule retour en moins de 15 minutes, **coût
    nul**. Le vendredi noir (27 nov.) et le cyber lundi (30 nov.) se jouent avec Solda en secours chaud,
    Payflux étant alors au-delà des trois semaines de rodage observées au pilote.

    - **Décembre :** Solda maintenu à 130 k€. Même filet pendant le pic de Noël — le mois où l''absence
    de secours ne se rattrape pas.

    - **Signature Payflux datée du 5 octobre au plus tôt** : sortie sans pénalité jusqu''au 3 janvier.
    Travaux techniques lancés dès septembre sous lettre d''intention. *La date de signature se choisit
    sur la fenêtre de sortie, pas sur le calendrier des ingénieurs.*

    - **31 décembre :** on garde ou on sort, gratuitement, avec janvier et février encore disponibles
    pour re-consulter.


    ### Le pire cas, et qui l''encaisse

    Le point de non-retour n''est pas la bascule : c''est **la fermeture du compte Solda**. Six semaines
    de ré-ouverture et 2,1 millions d''empreintes de carte à redemander aux clients. Ce sont les clients
    qui l''encaissent, et cela ne se rattrape pas. Le plan ne franchit ce point qu''après un vendredi
    noir et un Noël passés sous Payflux, secours ouvert.


    Second mur : Solda a écrit que la prolongation **ne va pas au-delà du 28 février**. C''est cette date,
    non le 30 novembre, qui commande tout le calendrier.


    ### Repli et déclencheurs

    *Tableau de bord rafraîchi toutes les 5 min ; astreinte 24/7 ; redistribution en moins de 15 min.*

    - **3–24 novembre (rodage) :** échec > 1,5 % pendant 30 min → 50 % du trafic vers Solda. > 2,5 % pendant
    15 min → 100 %.

    - **À partir du 25 novembre (pic) :** échec > 1,0 % pendant 15 min → 100 % vers Solda. Repère : le
    pic Solda un vendredi noir est de 0,9 %.

    - **20 décembre :** si le taux d''échec Payflux n''est pas ≤ 0,6 % sur 14 jours glissants, on exerce
    la sortie sans pénalité avant le 31 décembre.

    - **L''astreinte bascule sans validation hiérarchique.** C''est elle qui tient le risque la nuit ;
    elle doit en avoir l''autorité par écrit.


    ### Ce qui renverserait cette recommandation

    **Une seule chose :** si le transfert des 2,1 millions de jetons est **destructif** — si les jetons
    cessent d''être valides chez Solda dès le transfert. Le repli à 15 minutes n''existerait plus, et
    B, qui migre par tranches, redeviendrait la bonne réponse. Question binaire posée à Payflux lundi,
    réponse exigée avant le 1er septembre.


    À surveiller : Payflux se stabilise à **0,5 %** contre 0,4 % chez Solda. Ce dixième de point vaut
    **276 k€ de CA par an**, à faire entrer au contrat sous forme de SLA à 0,5 % avec pénalités.


    ### Lundi

    1. **Payflux, écrit, réponse avant le 1er septembre :** le transfert de jetons est-il non destructif
    — les jetons restent-ils valides et routables chez Solda après transfert ?

    2. **Payflux :** signature datable au 5 octobre, travaux dès septembre sous LOI ; SLA échec ≤ 0,5
    % avec pénalités ; confirmation écrite que les 90 jours courent à la signature.

    3. **Solda, écrit, réponse avant le 30 septembre :** prolongation mensuelle à 130 k€ **sans engagement
    minimal**, résiliable mois par mois, jetons routables pendant la prolongation. Et : le renouvellement
    à 1,4 M€ reste-t-il ouvert pendant la prolongation ?

    4. **Notification de prolongation envoyée à Solda le 6 octobre** — neuf jours de marge sur le 15 octobre.
    C''est la seule échéance que le comité ne pourra pas rattraper.

    5. **Astreinte :** runbook de bascule retour écrit et **répété en conditions réelles avant le 15 octobre**
    ; seuils d''alerte réglés.


    ---


    Deux réserves sur ce que j''ai supposé, à confirmer par les points 1 et 3 de lundi : que la prolongation
    Solda soit résiliable au mois (si Solda impose un bloc ferme de trois mois, A tombe à 110 k€ — mais
    B tombe sous zéro, donc le verdict tient), et que les jetons restent valides chez les deux prestataires
    simultanément. Ce second point est le seul qui puisse inverser la recommandation.


    Si vous voulez, je peux reprendre la note en fichier ou en page partageable — il me faudra juste l''autorisation
    d''écriture qui a été refusée à l''instant.

    '
