response:
  text: '# Note au comité — Fermetures de magasins


    **Objet :** demande de l''actionnaire (+300 000 € de résultat dès l''exercice prochain) — recommandation

    **Recommandation en une phrase : ne fermer aucun magasin mardi. Aucune des trois fermetures envisagées
    ne rapporte les 300 000 € ; deux d''entre elles coûtent de l''argent. Une seule décision est urgente,
    et ce n''est pas une fermeture.**


    ---


    ## 1. Le point qui change tout : « perdre de l''argent » n''est pas « coûter de l''argent »


    Le résultat par magasin est juste. Mais il contient une part des frais de siège et de logistique —
    6,4 M€ répartis entre les 19 magasins au prorata du chiffre d''affaires. **Ces 6,4 M€ ne disparaissent
    pas si un magasin ferme.** Ils sont simplement redistribués sur les magasins restants.


    Ce qui compte pour l''actionnaire, c''est donc ce que chaque magasin **apporte réellement au groupe**
    : son résultat, avant cette quote-part.


    | | Résultat affiché | Quote-part siège | **Apport réel au groupe** |

    |---|---|---|---|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |


    Les trois magasins « déficitaires » rapportent ensemble **+114 000 €** par an.


    Les fermer tous les trois ne rapporte pas 300 000 € : **cela dégrade le résultat de 114 000 €**, avant
    même de compter le coût des fermetures. L''écart avec l''objectif serait de plus de 400 000 €.


    **Réserve honnête, à lever avant toute décision :** une partie des 6,4 M€ est probablement bien évitable
    (livraisons, encadrement régional). Nous ne savons pas laquelle. Si 40 % de la quote-part de Vitry
    disparaissait vraiment avec le magasin, le calcul ci-dessus s''inverserait pour ce site. C''est le
    premier chantier ci-dessous — et c''est le seul chiffre qui pourrait changer la recommandation.


    ---


    ## 2. Les trois cas, séparément


    **Chambéry — dossier à fermer, pas un magasin à fermer.**

    Il reste 6 ans de bail, sans clause de sortie. Sortir coûte 1,1 M€ d''indemnité, pour supprimer un
    magasin qui rapporte 32 000 € par an. Le magasin le plus proche est à 92 km : quasiment aucun client
    ne serait récupéré ailleurs. **À retirer de la discussion pour cet exercice.** Ce qui reste utile
    : renégocier le loyer, ou explorer une cession de bail — ni l''un ni l''autre n''engage l''enseigne.


    **Nîmes — deux questions qu''il ne faut pas mélanger.**

    Nous détenons les murs (1,9 M€). Vendre les murs rapporte de la trésorerie une fois ; cela ne crée
    pas 300 000 € de résultat récurrent, et cela ne dépend pas de la fermeture du magasin. À l''inverse,
    fermer le magasin fait perdre 19 000 € par an et laisse un actif immobilier sur les bras. **Les deux
    sujets doivent être instruits séparément.**


    **Vitry — le seul cas où il y a une vraie décision, et une vraie urgence.**

    C''est le seul site dont on peut sortir sans indemnité : bail échu dans 7 mois. C''est aussi celui
    qui rapporte le plus des trois (63 000 €), et le seul dont les clients pourraient réellement se reporter
    (14 km).


    Deux éléments doivent être posés avant d''en juger :


    - **18 % des entrées de Vitry sont des retraits de commandes web.** Vitry assume le coût de ce service
    (surface, personnel, temps) pendant que le chiffre d''affaires est enregistré sur l''entité e-commerce.
    Le magasin est donc structurellement sous-évalué par nos comptes, et fermer Vitry dégraderait aussi
    le service e-commerce sur la zone.

    - **Une urgence de calendrier.** Un congé de bail commercial suppose un préavis de six mois : la date
    limite pour se réserver la possibilité de sortir sans indemnité est probablement **dans les prochaines
    semaines**. Si elle passe, l''option disparaît pour 3, 6 ou 9 ans.


    ---


    ## 3. Ce que nos données ne permettent pas de dire


    Il faut le dire au comité avant qu''on nous oppose ces chiffres :


    - **Les compteurs d''entrée ne mesurent pas la performance commerciale.** Ils sont fiables (±2 %,
    24 mois d''historique) mais comptent des entrées, pas des acheteurs — et à Vitry, près d''une entrée
    sur cinq n''est pas un client du magasin. **Aucune fermeture ne sera justifiée par la fréquentation.**

    - **Nous ne savons pas quelle part des ventes se reporterait sur un autre magasin.** L''enseigne n''a
    jamais fermé de magasin. La carte de fidélité (23 % des tickets, dont 41 % de multi-magasins) indique
    que le report existe, mais sur un échantillon d''un quart des ventes, et pas forcément représentatif.

    - **Un seul fait observé existe :** la fermeture de Nîmes pendant cinq semaines en mars 2024. Seuls
    les totaux mensuels des magasins voisins ont été conservés — c''est grossier, mais c''est la seule
    mesure réelle dont nous disposons. Nous l''exploiterons.

    - **Un calendrier social incompressible.** Trois magasins représentent environ 65 à 70 postes. La
    procédure prendrait plusieurs mois et générerait des coûts avant toute économie. Même en décidant
    mardi, une fermeture **coûterait** de l''argent l''exercice prochain au lieu d''en rapporter.


    ---


    ## 4. Où sont réellement les 300 000 €


    Les montants débattus (63, 32, 19 k€) sont marginaux face aux 6,4 M€ de frais de siège et de logistique.
    **Les 300 000 € demandés représentent 4,7 % de cette ligne.** C''est là qu''il faut chercher en priorité
    — c''est la seule piste qui atteint l''ordre de grandeur demandé sans détruire de chiffre d''affaires
    ni engager l''enseigne de façon irréversible.


    ---


    ## 5. Ce qu''on engage d''ici là


    | Échéance | Engagement |

    |---|---|

    | **5 jours** | Faire confirmer par le conseil la date limite exacte du préavis de Vitry. Objectif
    : **préserver l''option**, sans l''exercer — renouvellement avec faculté de sortie, ou report négocié.
    |

    | **3 semaines** | Apport réel au groupe pour les **19 magasins**, et son évolution sur 3 ans. Un
    magasin en déclin rapide se traite différemment d''un magasin bas mais stable. |

    | **3 semaines** | Reconstituer, à partir des totaux mensuels de mars-avril 2024, le report de chiffre
    d''affaires observé pendant les 5 semaines de fermeture de Nîmes. |

    | **6 semaines** | Chiffrer la **part réellement évitable** des 6,4 M€, magasin par magasin. C''est
    la donnée qui manque pour décider. |

    | **6 semaines** | Plan de réduction des frais de siège et de logistique, cible 300–400 k€. |

    | **6 semaines** | Coût réel du service de retrait web à Vitry, et refacturation à l''entité e-commerce.
    *(Cela corrige la mesure, pas le résultat du groupe — mais sans cela nous décidons à l''aveugle.)*
    |

    | **En parallèle** | Chambéry : mandat de renégociation du loyer. Nîmes : évaluation des murs, indépendamment
    du sort du magasin. Aucun des deux n''engage l''enseigne. |


    **Décision demandée au comité mardi :** valider ce plan de travail, autoriser la démarche sur le bail
    de Vitry, et fixer un point de décision dans huit semaines, avec les chiffres.


    **Ce qui nous ferait changer d''avis :** si la part évitable des frais de siège dépasse 60 % pour
    un site, ou si l''apport réel d''un magasin recule de plus de 20 % par an sur trois ans, la fermeture
    redevient une option — et nous le dirons.

    '
