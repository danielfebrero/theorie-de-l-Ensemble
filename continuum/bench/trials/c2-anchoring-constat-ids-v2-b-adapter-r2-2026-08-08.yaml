response:
  text: '# Avis — Renouvellement « logiciel de réservation + bornes de prêt »

    **Comité de direction du 28 · échéance contractuelle 31 octobre**


    ---


    ## A. Ce que je retiens du dossier


    Chaque constat est autonome : le comité peut en écarter un sans que les autres tombent. J''indique
    pour chacun la pièce précise et l''effet de son retrait.


    **C1 — Le dossier mélange deux problèmes distincts.**

    D''un côté l''indisponibilité des bornes (matériel), de l''autre les réservations « perdues » (logiciel).
    Rien dans le dossier ne les relie.

    *Fondé sur* : export technique (41 h bornes) vs enquête interne (module de réservation). Deux sources,
    deux objets.

    *Si écarté* : il faudrait produire la pièce qui établit le lien. Elle n''est pas au dossier.


    **C2 — L''indisponibilité des bornes est un problème de parc, pas de logiciel.**

    32 h sur 41 (78 %) sur les deux seuls sites équipés en 2015, soit ~16 h/site/an contre ~1,8 h/site/an
    sur les cinq autres — un rapport de 1 à 9. Le facteur discriminant est l''âge du matériel, seule variable
    qui sépare ces deux sites.

    *Fondé sur* : export technique.

    *Si écarté* : la corrélation reste, seule son interprétation change.


    **C3 — L''enquête n''établit pas que la mise à jour de mars est la cause.**

    61 % de 43 répondants = 26 agents signalant des pertes. Seuls 12 situent le début après mars, soit
    au plus 12 des 26. Le dossier ne dit pas où les 14 autres situent le début. Une majorité de ceux qui
    constatent le problème ne le rattache donc pas à mars.

    *Fondé sur* : enquête interne (43/62 réponses).

    *Si écarté* : il ne reste aucune pièce datant l''origine des pertes.


    **C4 — Trois changements concurrents en février-mars ; la chronologie ne les départage pas.**

    Février : remplacement du lien fibre de Rive-Sud **et** changement de version du portail usagers.
    Mars : mise à jour. Le pic de réclamations (71 sur 96 entre mars et juin, ~17,8/mois contre ~3,1/mois
    le reste de l''année) est compatible avec les trois. Un pic postérieur à février est postérieur à
    mars aussi.

    *Fondé sur* : note de février + réclamations usagers.

    *Si écarté* : il faut expliquer pourquoi deux changements de février sont exclus sans examen.


    **C5 — La répartition par site contredit une cause logicielle réseau.**

    Rive-Sud ressaisit à la main depuis mars (~5 h/semaine, soit ~230 h/an, ~0,14 ETP non budgété). Fontaine,
    même génération de bornes, même logiciel, ne signale rien. Une mise à jour déployée sur le réseau
    devrait produire un effet sur les deux. Un incident local de février (fibre) n''en produirait qu''à
    Rive-Sud.

    *Fondé sur* : notes de sites.

    *Réserve honnête* : le silence de Fontaine n''est pas une preuve d''absence de problème — Fontaine
    porte une part des 32 h de panne. Cette contradiction doit être levée, pas interprétée.


    **C6 — Les réclamations s''arrêtent après juin, ce que personne n''explique.**

    Si des pertes surviennent « chaque semaine » depuis mars sans correction, les réclamations devraient
    se poursuivre. Trois lectures possibles — cause résorbée, usagers découragés, ressaisie de Rive-Sud
    absorbant l''effet — que le dossier ne permet pas de départager.

    *Fondé sur* : réclamations usagers (71 sur mars-juin).


    **C7 — La valeur de la remise n''est pas connue à un facteur 3 près.**

    Sur trois ans à 48 000 € indexés +7 % : ~154 300 €. Si les 12 % portent sur les trois annuités : ~135
    800 €, gain ~18 500 €. S''ils ne portent que sur la première : gain ~5 800 €. Le dossier ne dit ni
    l''assiette de la remise, ni si l''indexation subsiste. On ne peut pas arbitrer un engagement de ~154
    000 € — ~185 000 € avec la v4 — sur une contrepartie dont on ignore si elle vaut 5 800 € ou 18 500
    €.


    **C8 — La date du 30 est commerciale, pas opérationnelle.**

    L''échéance contractuelle est le 31 octobre : environ deux mois séparent la date de la remise de la
    date où le service serait réellement exposé. Aucune pièce ne fait du 30 une contrainte de continuité.


    **C9 — La v4 n''est pas décidable en l''état.**

    31 000 € pour une migration dont la compatibilité avec les bornes de 2015 est « à l''étude » chez
    l''éditeur — c''est-à-dire non établie. Ces bornes portent 78 % de l''indisponibilité. Payer 31 000
    € sans savoir si la solution couvre le parc à l''origine du principal symptôme mesuré n''est pas un
    arbitrage, c''est un pari.


    **C10 — La capacité informatique se réduit au moment exact où une migration s''exécuterait.**

    Deux agents, un départ en octobre. Toute migration — v4 ou libre — serait conduite à effectif divisé
    par deux, sans remplacement documenté.


    **C11 — Le retour du réseau voisin est incomplet.**

    Coût « annoncé » 30 % plus bas, non mesuré, hors charge interne ; 2 sites sur 5 tiennent encore un
    registre papier 14 mois après. C''est le signe d''une transition inachevée à 40 %, ce qui n''invalide
    pas la solution libre mais interdit de la présenter comme éprouvée.


    ---


    ## B. Sur la note de cadrage


    Elle avance trois affirmations — mars est la cause, la v4 règle le problème, il faut signer avant
    le 30 — et ne cite aucune pièce. Le dossier contredit ou n''appuie aucune des trois : C3-C4-C5 pour
    la première, C9 pour la deuxième, C8 pour la troisième. Deux membres du comité l''ont déjà lue ; je
    signale donc explicitement qu''elle ne peut pas servir de base à la décision du 28, sans mettre en
    cause son auteur, qui a formulé une hypothèse plausible mais non vérifiée.


    ---


    ## C. Ce que je recommande


    **Reconduire à l''identique, sur la durée la plus courte négociable, sans v4 à ce stade, et ne pas
    signer avant le 30.**


    Motif : les trois options se départagent sur une question de fait — combien de réservations sont réellement
    perdues, où, et depuis quel changement — à laquelle aucune pièce du dossier ne répond. Ni la v4 ni
    le libre ne peuvent être chiffrés tant que ce nombre est inconnu. Renoncer à la remise coûte entre
    5 800 € et 18 500 € étalés sur trois ans ; s''engager sur trois ans avec indexation et une migration
    à 31 000 € sur une compatibilité non établie engage ~185 000 €.


    **Le contre-argument le plus fort contre ma position** : si mars est bien la cause et si la v4 la
    corrige, attendre coûte une année de plus de ressaisie à Rive-Sud (~230 h), la remise, et la patience
    des usagers. Ma réponse : le calendrier ci-dessous tranche la question de fait avant fin septembre,
    soit un mois avant l''échéance réelle. La v4 reste décidable, pour une exécution au printemps — après
    le remplacement du poste informatique, pas pendant.


    **Ce qui me ferait changer d''avis** : une réponse écrite de l''éditeur confirmant la compatibilité
    v4 avec les bornes de 2015, plus des logs montrant une rupture nette à la date de la mise à jour de
    mars et non en février. Les deux, pas l''un des deux.


    **Un point est déjà décidable** : les bornes de 2015 relèvent d''un renouvellement de parc, indépendamment
    du choix logiciel (C2). Un chiffrage peut être lancé dès maintenant.


    ---


    ## D. Ce que j''engage dans les quinze jours


    | # | Action | Pièce attendue |

    |---|---|---|

    | 1 | Extraction des journaux du module de réservation, janvier-juillet, horodatés par site | Chronologie
    datée croisant erreurs, mise à jour de mars, bascule fibre et changement de version du portail |

    | 2 | Entretien structuré à Fontaine | Réponse à la contradiction C5 : contournement non déclaré,
    ou absence réelle d''incident |

    | 3 | Ventilation des 96 réclamations par site et par mois | Explication de l''arrêt après juin (C6)
    |

    | 4 | Question écrite à l''éditeur, réponse datée exigée | (a) compatibilité v4 / bornes 2015 : oui,
    non, ou coût matériel associé ; (b) reconduction 12 mois possible et à quel prix ; (c) remise maintenue
    après le 30 ; (d) liste des correctifs v4 sur le module de réservation |

    | 5 | Chiffrage du renouvellement des bornes de 2015, hors logiciel | Devis |

    | 6 | Mesure de la charge cachée : Rive-Sud confirmé, autres sites interrogés | Volume horaire réseau
    |

    | 7 | Plan écrit de couverture du départ d''octobre | Nom et date, ou constat d''absence de couverture
    |


    **Condition d''arrêt.** Si l''éditeur répond « à l''étude » sur le point 4(a) ou ne répond pas sous
    quinze jours, la v4 est retirée des options et le comité arbitre entre reconduction courte et préparation
    d''une bascule pour 2027. Si le point 7 ne produit aucun nom, aucune migration n''est engageable,
    quelle qu''elle soit.


    **Point de décision** : séance de fin septembre, sur pièces. Le contrat dispose alors encore d''un
    mois de marge.

    '
