    # AVIS — Renouvellement du marché SIGB / automates de prêt


    **Comité de direction du 28 août — échéance contractuelle 31 octobre**


    Sept constats indépendants. Chacun porte : sur quoi il repose, ce qui le renverserait, et ce qui tombe
    si le comité l''écarte. Aucun n''est le socle d''un autre.


    ---


    ## Partie 1 — Ce que je retiens


    ### C1. Le dossier réunit deux pannes distinctes qui n''ont pas la même solution


    Les 41 h d''indisponibilité sont un problème **matériel** : 32 h sur 41 concentrées sur les deux seuls
    sites en automates de 2015. Les pertes de réservations sont un problème **logiciel** : datées de mars,
    confirmées par les réclamations. Deux dossiers, deux remèdes. Les traiter comme un seul conduit à
    acheter la v4 en croyant régler les deux.


    - **Fondé sur** : la concentration 32/41 h d''un côté ; la datation de mars et le pic de réclamations
    de l''autre.

    - **Renversé par** : un croisement des horodatages montrant que les réservations se perdent *pendant*
    les fenêtres d''indisponibilité. Jamais fait. Une demi-journée (E2).

    - **Si écarté** : E2 tombe. E6 reste entier.


    ### C2. Le problème de réservation n''est pas lié à l''âge des automates


    Fontaine et Rive-Sud ont le même matériel de 2015. Rive-Sud ressaisit 5 h/semaine ; Fontaine ne signale
    rien. Le facteur commun n''explique pas l''écart.


    - **Fondé sur** : les deux notes de site opposées.

    - **Renversé par** : que Fontaine subisse le problème sans le remonter. Hypothèse sérieuse et **déjà
    partiellement étayée : l''export technique attribue à Fontaine des heures d''indisponibilité que le
    site déclare ne pas constater.** Le silence de Fontaine est donc déjà contredit une fois par la machine
    ; je ne m''appuie pas dessus une seconde fois sans vérifier (E3).

    - **Si écarté** : le dossier perd sa seule contre-observation interne et l''enquête redevient la seule
    source sur l''ampleur. E4 devient alors la vérification centrale.


    ### C3. L''enquête établit un ressenti largement partagé, pas une mesure


    43/62 réponses (69 %). 61 % des répondants ≈ 26 agents. Mais **seuls 12 datent le début après mars**
    — les autres décrivent le problème sans le rattacher à mars, ou n''ont pas su le dater. 19 agents
    n''ont pas répondu. Le seul élément mesuré côté agents reste Rive-Sud : 5 h/semaine ≈ 260 h/an, de
    l''ordre de 0,15 ETP **pour un seul site**. C''est le seul chiffre opposable aux 31 000 €.


    - **Renversé par** : rien en l''état — l''enquête dit ce qu''elle dit. Elle deviendrait une mesure
    par un relevé de deux semaines sur les 7 sites (E4).

    - **Si écarté** : la datation de mars ne repose plus que sur C4, qui reste solide et indépendant.
    L''argumentaire se rétrécit, il ne tombe pas.


    ### C4. Les réclamations usagers datent le problème plus sûrement que l''enquête


    71/96 sur quatre mois ≈ 18/mois, contre 25 sur les huit autres ≈ 3/mois. Facteur six, indépendant
    du déclaratif agent. Mais **le dossier ne dit pas ce qui s''est passé après juin.** Deux lectures
    opposées tiennent dans le même chiffre : le problème s''est résorbé, ou les usagers ont cessé de réclamer.
    Elles n''appellent pas la même décision.


    - **Renversé par** : le détail mensuel juillet-février. Une extraction, pas une étude (E5).


    ### C5. La v4 n''est pas, en l''état, une réponse au problème constaté


    31 000 € en une fois, et **rien au dossier n''établit que la v4 corrige la régression de mars** —
    l''éditeur ne l''a d''ailleurs pas reconnue. S''y ajoute le « à l''étude » sur la compatibilité 2015
    : à deux mois de l''échéance, c''est un coût matériel non chiffré, qui pèse précisément sur les deux
    sites déjà les plus dégradés.


    - **Renversé par** : un engagement écrit — la v4 corrige tel défaut identifié, et elle est compatible
    avec le parc 2015, sous garantie. **Avec cet écrit, la v4 devient l''option la plus solide du dossier
    et je la recommanderais.** Sans lui, c''est un achat à l''aveugle.

    - **Si écarté** et la v4 retenue le 28 : condition suspensive de l''écrit éditeur, et mandatement
    gelé jusqu''à réception.


    ### C6. La remise de 12 % expire avant que le dossier ne soit instruit


    L''offre expire le 30, le comité siège le 28, le contrat court jusqu''au 31 octobre : deux mois de
    marge, et il nous est demandé de décider en deux jours. Signer trois ans avant d''avoir fait reconnaître
    la régression, c''est abandonner le seul levier au moment précis où il servirait.


    Elle n''est de surcroît pas chiffrable : on ignore si les 12 % portent sur le tarif actuel ou indexé,
    et si l''indexation court pendant les trois ans.


    | Lecture | Coût 3 ans |

    |---|---|

    | Sans remise, +7 %/an | ≈ 165 100 € |

    | Remise sur tarif actuel, indexation neutralisée | ≈ 126 700 € |

    | Remise sur tarif indexé, indexation maintenue | ≈ 145 300 € |


    **≈ 18 600 € d''écart entre deux lectures de la même offre.** Une remise sans assiette définie n''est
    pas une remise, c''est une date limite.


    - **Renversé par** : une offre écrite précisant l''assiette et le sort de l''indexation, **et détachée
    du triennal**. Une remise sur douze mois serait recevable.


    ### C7. Le libre n''est pas conduisible ce semestre — moyens, pas mérite


    L''équipe passe de 2 à 1 en octobre, le mois même de l''échéance. Une migration sur 7 sites avec un
    agent n''est pas conduite, elle est subie. Et le précédent voisin se lit précisément : **à quatorze
    mois, 2 sites sur 5 tiennent encore un registre papier** — ce n''est plus un retard de déploiement,
    c''est une reprise ou un flux métier non couvert. Les « 30 % moins cher » portent sur la licence :
    ils ne comprennent ni la reprise, ni le double fonctionnement, ni le temps agent — c''est-à-dire exactement
    ce que leur registre papier nous montre.


    - **Renversé par** : deux éléments **réunis** — le poste remplacé, et un retour documenté du voisin
    établissant que ses deux sites relèvent d''une cause qui lui est propre. **Le second ne suffit pas
    sans le premier.**


    ---


    ## Partie 2 — Ce que je recommande


    **Aucune des trois options n''est en état d''être votée le 28.** Non que le dossier soit mince — il
    est riche — mais la question qui les départage n''y figure pas : *qu''est-ce qui s''est cassé en mars,
    et la v4 le répare-t-elle ?* Tant qu''elle est ouverte, reconduire à l''identique c''est payer une
    panne, migrer c''est acheter à l''aveugle, basculer c''est confier une migration à un agent seul.


    ### Reconduction courte — douze mois maximum, conditions actuelles, sans engagement pluriannuel. Et
    refus de l''offre du 30.


    1. **Cela ne coûte pas la remise** : elle n''est pas chiffrable et elle est adossée à trois ans. On
    refuse un avantage indéterminé au prix d''un engagement déterminé.

    2. **Cela préserve les trois options** : dans douze mois, deux d''entre elles seront devenues évaluables,
    ce qu''elles ne sont pas aujourd''hui.

    3. **Le coût de l''attente est borné** : ≈ 51 400 €, contre 31 000 € engagés sans garantie plus un
    coût matériel inconnu.

    4. **Cela place la renégociation après l''établissement des responsabilités de mars, pas avant.**


    **Réserve, à énoncer telle quelle :** cette recommandation suppose que le contrat autorise une prolongation
    courte ou une reconduction annuelle. Je ne l''ai pas encore vérifié (E1). S''il s''avère à prendre
    ou à laisser sur trois ans, je le dis maintenant plutôt qu''en octobre : la recommandation devient
    **la v4 sous condition suspensive de l''écrit éditeur**, et à défaut d''écrit, la reconduction à l''identique
    sur la durée la plus courte accessible. Dans aucun cas le libre ce semestre.


    ---


    ## Partie 3 — Ce que j''engage sous quinze jours


    **Avant la séance :**


    - **E1 — Clause de durée et de sortie** *(fonde toute la partie 2)*. Prolongation courte ? reconduction
    annuelle ? préavis de dénonciation et sa date butoir ? **Si le préavis est déjà passé ou tombe avant
    le 31 août, je préviens la directrice sans attendre le 28.**

    - **E3 — Entretien sur site à Fontaine** *(C2)*. Sur site, pas par questionnaire. L''export contredit
    déjà une fois la déclaration du site.


    **Dans les quinze jours suivants :**


    - **E2** *(C1)* — J+3. Croisement des horodatages indisponibilités / réservations perdues. Tranche
    : une panne ou deux.

    - **E5** *(C4)* — J+1. Extraction des réclamations juillet-février, mois par mois.

    - **E6** *(C5, C6)* — J+2. **Courrier recommandé à l''éditeur**, réponse écrite sous quinze jours
    : (a) reconnaissance ou non de la régression de mars et calendrier de correction ; (b) la v4 corrige-t-elle
    ce défaut — engagement contractuel, pas argumentaire commercial ; (c) compatibilité v4 / parc 2015,
    ferme, et à quel coût matériel. Mention que la décision de renouvellement est suspendue à ces réponses.
    **C''est ce qui remplace la remise comme levier — et ce levier ne se récupère pas après signature.**

    - **E7** *(C6)* — J+2. Réponse écrite au commercial : offre déclinée en l''état, preneurs d''une remise
    détachée du triennal avec assiette précisée. Par écrit, pour que le refus ne soit pas lu comme une
    manœuvre.

    - **E4** *(C3)* — J+10. Relevé de charge réelle, 7 sites, deux semaines. Si le réseau est à l''échelle
    de Rive-Sud, la v4 se paie en temps agent en moins de deux ans, et l''arbitrage change.

    - **E8** *(aucun constat)* — J+3. Rive-Sud : formalisation de la procédure de ressaisie, automatisation
    de l''extraction si possible. ≈ 110 h déjà consommées depuis mars. **Gagné quelle que soit l''option
    retenue.**

    - **E10** *(aucun constat)* — avant le 30 septembre. **Passation informatique avant le départ d''octobre**
    : accès, comptes prestataire, procédures d''exploitation SIGB et automates. **Aucune des trois options
    n''est conduisible sans elle, y compris la reconduction à l''identique.** C''est le point qui ne souffre
    aucun report.

    - **E9** *(C7)* — J+10. Réseau voisin : cause exacte des 2 sites au papier, propre à leur configuration
    ou non.

    - **E11** — J+15. Point d''étape écrit : les sept constats un par un, tient / renversé / non tranché,
    avec l''élément qui a fait basculer.


    **Séparabilité** — écarter C1 fait tomber E2 ; C2 → E3 ; C3 → E4 ; C4 → E5 ; C5 réduit E6 à ses points
    1 et 3 ; C6 → E7 ; C7 → E9. Rien d''autre ne bouge. **E1, E8, E10 et E11 ne dépendent d''aucun constat**
    et sont engagés dans tous les cas.


    ---


    Trois points sur lesquels j''attire votre attention avant la lecture :


    - **Le fait le plus utile du dossier n''est pas dans les chiffres, c''est une contradiction** : Fontaine
    ne signale rien alors que l''export lui attribue des heures d''indisponibilité. C''est la vérification
    la moins chère et celle qui déplace le plus de choses.

    - **La date du 30 est le seul élément du dossier qui n''apporte aucune information** — uniquement
    de la contrainte, deux jours après le comité et deux mois avant l''échéance réelle.

    - **E10 est en dehors de l''arbitrage** et ne devrait pas dépendre du vote : le départ d''octobre
    est le seul événement du dossier dont la date est certaine.

