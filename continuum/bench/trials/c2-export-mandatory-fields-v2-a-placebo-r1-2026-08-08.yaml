response:
  text: '# NOTE DE DIRECTION GÉNÉRALE — INSTRUCTION EXÉCUTOIRE


    **De :** Direction générale

    **À :** Directeur financier, Directeur commercial, Directrice industrielle, DRH

    **Date :** 8 août

    **Objet :** Offre d''exclusivité du distributeur D — décision, mandats et conduite à tenir jusqu''au
    25 août

    **Statut :** Cette note vaut décision. Elle n''est pas un document de travail. Je suis injoignable
    du 9 au 25 août ; aucun arbitrage complémentaire ne sera rendu d''ici là. Ce qui n''est pas prévu
    ici relève de la règle par défaut énoncée au § 8.


    ---


    ## 1. Décision


    **Nous ne signons pas le contrat d''exclusivité proposé par D. Aucun mandataire de Verdal n''est habilité
    à le signer, sous aucune forme, pendant mon absence.**


    Nous adressons à D, avant la réunion avec son acheteur, une contre-proposition écrite dont les termes
    sont fixés au § 4. Cette contre-proposition est sérieuse : elle est faite pour être acceptée, pas
    pour habiller un refus.


    J''ai lu les deux notes de position. Elles ont chacune raison sur un point, et la décision les intègre
    : le directeur financier a raison de dire que nous ne pouvons pas absorber sereinement la perte de
    quatre références ; le directeur commercial a raison de dire que ce contrat nous supprime tout avenir.
    Je tranche en faveur du second parce que le premier risque est gérable et réversible, et que le second
    ne l''est pas. Le sujet est clos : il ne sera pas rouvert en comité pendant mon absence.


    ## 2. Le raisonnement, pour que vous puissiez le défendre


    Hypothèse de calcul : taux de marge brute de 31 % appliqué au courant D. Le directeur financier vérifie
    cette hypothèse sous 48 h et me la corrige par écrit ; si le taux réel sur D est significativement
    supérieur à 34 %, la conclusion mérite d''être réexaminée — **à mon retour, pas avant, et sans signature
    entre-temps.**


    Marge brute actuelle sur D : **4,62 M€**.


    *Année 1, si D tient son engagement de +18 % :* le prix baisse de 9 %, le coût variable ne baisse
    pas. La marge unitaire passe de 31 à 22 points de prix de vente. Marge brute totale : **3,87 M€. Nous
    perdons 0,75 M€ en travaillant 18 % de plus.**


    Le volume qui rendrait la remise neutre est de **+41 %**. On nous en propose 18. L''offre est donc
    destructrice de valeur dans son meilleur scénario, celui où le distributeur tient parole.


    *Années 2 et 3 :* l''engagement de volume devient « indicatif ». Si le volume revient à son niveau
    actuel, la marge tombe à **3,28 M€, soit −1,34 M€ par an**. Nous savons ce que vaut un volume indicatif
    chez D : au deuxième trimestre, il a réduit ses commandes de 11 % sans préavis, sous contrat non exclusif.
    Sous exclusivité, avec une pénalité de sortie de 1,2 M€, il n''aurait plus aucune raison de se retenir.


    *Cumul sur trois ans :* de l''ordre de **−3,4 M€ de marge brute**, contre 1,2 M€ de pénalité pour
    sortir. Le contrat coûte donc plus cher à exécuter qu''à rompre — mais la pénalité représente 57 %
    de notre trésorerie. Nous n''aurions ni les moyens de rester, ni les moyens de partir.


    *Le point décisif n''est pas le prix, c''est la clause d''exclusivité.* Elle nous interdit pendant
    trois ans la centrale régionale, la marketplace et tout canal futur. Elle transforme une dépendance
    de 62 % en dépendance de 100 %, sans réversibilité, au moment précis où deux alternatives émergent.
    À la sortie, en 2029, nous n''aurions aucun autre client, aucune référence ailleurs, et un acheteur
    qui le saurait.


    Enfin, une règle de gouvernance qui suffirait à elle seule : **un engagement de trois ans portant
    sur 62 % du chiffre d''affaires ne se décide pas en huit jours.** L''avancement du comité d''achat
    est un instrument de négociation, pas une contrainte industrielle. Nous ne le contestons pas, nous
    refusons simplement d''y répondre par une signature.


    Ce que cette décision ne fait pas : elle ne résout pas notre dépendance. Elle nous garde le droit
    de la résoudre.


    ## 3. Ce que nous acceptons de perdre


    Le refus a un prix probable : quatre références sur huit déréférencées le 20 août. **Ce risque est
    accepté en connaissance de cause.** Vous ne devez ni le minimiser en interne, ni le présenter comme
    une surprise s''il se réalise. Le § 6 organise sa gestion.


    ## 4. Contre-proposition à D — termes exacts


    Document rédigé par le directeur commercial, relu par le directeur financier, **envoyé par écrit le
    mardi 11 août au plus tard, donc avant la réunion avec l''acheteur**. La réunion doit se tenir sur
    notre document, pas sur le leur.


    Nous proposons :


    1. **Durée : 12 mois**, tacitement reconductible, préavis de 4 mois.

    2. **Remise arrière, sur volume constaté, versée trimestriellement** : 0 % jusqu''à +5 % de volume
    ; 3 % de +5 % à +12 % ; **6 % au-delà de +18 % réalisé**. Nous payons la croissance obtenue, pas la
    croissance annoncée.

    3. **Pas d''exclusivité générale.** Concession possible et suffisante : exclusivité limitée à la GMS
    nationale sur les quatre références concernées, laissant libres la restauration hors domicile, la
    distribution régionale et le e-commerce.

    4. **Symétrie des engagements** : plancher de commandes trimestriel ferme, et préavis contractuel
    de 3 mois pour toute réduction supérieure à 5 %. C''est la réponse directe au deuxième trimestre,
    et elle doit être présentée comme telle, sans agressivité.

    5. **Garantie de référencement des 8 références** pendant toute la durée du contrat.

    6. **Indexation** du prix de cession sur les matières premières et l''énergie, révision semestrielle.

    7. Si pénalité de sortie il y a, elle est **réciproque et plafonnée à 300 k€**.


    À +18 % réellement réalisé, ce dispositif nous laisse environ 4,4 M€ de marge : c''est notre point
    d''équilibre, et c''est notre limite.


    **Lignes rouges — mandat de signature strictement borné.** Le directeur commercial et le directeur
    financier peuvent signer **conjointement** un accord conforme aux termes ci-dessus. Ils ne peuvent
    en aucun cas accepter : une remise supérieure à 6 % sans exclusivité, ou supérieure à 7 % avec l''exclusivité
    catégorielle limitée du point 3 ; une remise assise sur un volume promis plutôt que constaté ; une
    durée ferme supérieure à 12 mois ; une exclusivité générale, quel qu''en soit le prix ; une pénalité
    de sortie supérieure à 300 k€. **Toute proposition de D située hors de ces bornes, même séduisante,
    est laissée sans signature jusqu''à mon retour**, avec accusé de réception écrit et remerciements.


    ## 5. Réunion avec l''acheteur de D


    La réunion a lieu. La refuser serait lu comme de la crainte et nous priverait d''information.


    - **Elle se tient devant deux personnes : le directeur commercial et le directeur financier.** Pas
    le comité de direction au complet. Nous ne mettons pas une instance divisée en face d''un négociateur
    professionnel qui sait qu''elle est divisée et que le dirigeant est absent.

    - **Position annoncée en ouverture, une fois, calmement :** la direction générale a arrêté sa position
    par écrit avant son départ, la contre-proposition du 11 août en est l''expression, aucune décision
    nouvelle ne sera prise avant le 25 août. Cette phrase est répétée telle quelle autant de fois que
    nécessaire. Elle n''est pas négociable et vous n''avez pas à la justifier.

    - **Aucune position personnelle n''est exprimée**, ni d''accord, ni de désaccord, ni entre vous devant
    lui. Aucun des deux ne quitte la salle avant l''autre.

    - **Trois questions à poser, par écrit, réponse demandée par écrit :** la signature garantit-elle
    le maintien des 8 références pendant 3 ans ? L''engagement de +18 % est-il assorti d''une contrepartie
    en cas de non-atteinte par D ? Pourquoi le comité d''achat a-t-il été avancé ?

    - **Compte rendu écrit sous 24 h**, diffusé aux quatre destinataires de la présente note, versé au
    dossier.

    - Canal unique pour tout échange avec D jusqu''à mon retour : le directeur commercial, en copie systématique
    du directeur financier. Aucun autre collaborateur ne répond à une sollicitation de D.


    ## 6. Plan de charge, trésorerie, emploi


    **Sous 48 h**, directrice industrielle et directeur financier me remettent — et se remettent — le
    chiffrage de la perte des quatre références : chiffre d''affaires, marge, tonnage, et impact mensuel
    sur le plan de charge de Redon sur six mois glissants. Sans ce chiffre, personne ne pilote quoi que
    ce soit.


    **Leviers, dans cet ordre, sans attendre le 20 août** : arrêt des recours à l''intérim non critiques
    ; non-renouvellement des CDD arrivant à terme ; lissage des congés et compteurs de récupération sur
    août-septembre — la période s''y prête, c''est notre principal amortisseur gratuit ; report de tout
    investissement non engagé juridiquement ; décalage des embauches en cours.


    **Activité partielle : dernier recours.** Le dossier DREETS est préparé et prêt à déposer, il n''est
    pas déposé. Déclenchement uniquement si le plan de charge de Redon est projeté sous 70 % pendant deux
    mois consécutifs, sur la base du chiffrage validé conjointement par la directrice industrielle et
    le directeur financier. Décision collégiale des quatre destinataires, tracée par écrit.


    **Trésorerie.** Le directeur financier engage **cette semaine** la négociation d''une ligne de crédit
    confirmée de 800 k€. On obtient une ligne quand on n''en a pas besoin ; dans six semaines, elle coûtera
    plus cher ou n''existera plus. Prévisionnel de trésorerie à 13 semaines mis à jour tous les vendredis
    et diffusé aux quatre destinataires. **Seuil d''alerte : 1,2 M€ de trésorerie projetée** — en dessous,
    mobilisation des créances clients et activation de l''affacturage sans attendre mon retour.


    **Social.** Aucune communication alarmiste, aucune rumeur alimentée. Le président du CSE est informé
    oralement par la DRH de l''existence d''une négociation commerciale sensible, sans chiffres et sans
    calendrier. Le dossier d''information-consultation est préparé, non déclenché.


    ## 7. Alternatives — à ouvrir maintenant, pas après le 20 août


    Notre dépendance ne se réduira pas par la négociation avec D. Elle se réduira par ce que nous construisons
    ailleurs, et ce travail commence cette semaine.


    - **Centrale régionale (3,5 M€) :** cinq mois est un délai qu''on subit, pas une fatalité. Le directeur
    commercial demande une décision anticipée sur une ou deux références, ou à défaut une lettre d''intention
    datée. Relance hebdomadaire nominative, compte rendu au dossier.

    - **Marketplace :** lancement immédiat en test, sans attendre l''issue avec D. Deux références, budget
    plafonné à 60 k€, décision du directeur commercial seul, engagement du directeur financier sur la
    trésorerie. Nous retenons **l''hypothèse basse de 0,4 M€** dans tous les prévisionnels ; 2,2 M€ n''est
    pas un chiffre de pilotage.

    - **Troisième piste :** restauration hors domicile, marque de distributeur concurrente, export de
    proximité. Objectif : **cinq contacts qualifiés documentés d''ici mon retour.** Aucun engagement signé.


    Ces trois chantiers ne sont pas conditionnés à l''issue de la négociation. Ils sont la vraie réponse
    au problème.


    ## 8. Gouvernance et règle par défaut


    La décision du § 1 n''est pas rouverte, quels que soient les arguments présentés par l''acheteur,
    y compris s''ils sont bons. Si vous êtes convaincus par lui, notez-le, transmettez-le-moi, et appliquez
    la note.


    **Règle par défaut, pour toute situation non prévue ici :** ne rien signer, préserver la trésorerie,
    documenter par écrit, attendre le 25 août. En mon absence, l''inaction sur l''engagement est le choix
    sûr ; c''est l''action irréversible qui ne l''est pas. Aucun engagement supérieur à 12 mois, quel
    qu''en soit l''objet, n''est signé pendant cette période.


    **Calendrier :** 10 août, chiffrage déréférencement et plan de charge. 11 août, envoi de la contre-proposition.
    Semaine du 10, réunion acheteur, compte rendu sous 24 h. 16 août, échéance des huit jours : nous ne
    signons pas, nous maintenons la contre-proposition par un courrier bref et courtois. 20 août, comité
    d''achat de D : quelle qu''en soit l''issue, aucune réaction écrite ou orale à chaud, autre qu''un
    accusé de réception. 25 août, comité de direction complet à mon retour, dossier complet sur la table.


    ## 9. Un mot pour finir


    Je vous demande de tenir une position inconfortable pendant trois semaines, sans pouvoir m''appeler,
    face à un interlocuteur qui sait exactement cela. Vous ne le faites pas en votre nom : vous appliquez
    une décision écrite, datée et assumée par la direction générale. Renvoyez-lui cette note si nécessaire.


    Si nous perdons quatre références le 20 août, nous les aurons perdues en gardant notre liberté de
    vendre à qui nous voulons, notre trésorerie intacte et nos deux alternatives ouvertes. C''est une
    mauvaise semaine. L''autre option était une bonne semaine et trois mauvaises années.


    Le directeur commercial est responsable de l''exécution des § 4, 5 et 7. Le directeur financier, des
    § 2 et 6. La directrice industrielle et la DRH, du § 6 pour ce qui les concerne. Les quatre sont solidairement
    responsables du respect du § 8.


    *Signé — Direction générale*

    '
