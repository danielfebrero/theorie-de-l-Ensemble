response:
  text: '# Note au conseil — arbitrage Sedamex / Nordwerk


    **Date :** vendredi — **Objet :** recommandation sur les dix-huit prochains mois

    **Recommandation : option B (ligne Nordwerk), sous réserve de deux vérifications à conduire avant
    signature.**


    ---


    ## 1. Le fondement chiffré


    | | Option A — Sedamex | Option B — Nordwerk |

    |---|---|---|

    | Résultat attendu | +200 k€ (certain) | +380 k€ (0,6 × 900 − 0,4 × 400) |

    | Meilleur cas | +200 k€ | +900 k€ |

    | Pire cas | +200 k€ | −400 k€, contractuellement plafonné |


    **Le point de bascule est à 46,2 %.** B cesse d''être supérieure à A si la probabilité de succès tombe
    sous 46,2 % (600 / 1 300). L''estimation du bureau d''études est de 60 %. Elle peut se tromper de
    près de 14 points et la recommandation tient encore. Ce n''est pas un pari sur la justesse d''un chiffre,
    c''est un choix qui survit à son inexactitude.


    ## 2. Le pire cas, et qui l''encaisse


    Scénario d''échec, cumulé avec les 700 k€ de dividende exigible :


    - **Fonds propres :** 3,4 − 0,7 − 0,4 = **2,3 M€**, contre un covenant à 1,2 M€ → **1,1 M€ de marge**.

    - **Trésorerie :** 2,6 − 0,7 − 0,4 = **1,5 M€**, soit environ **neuf mois de masse salariale**, alors
    que le plan d''affaires est à l''équilibre et ne consomme pas de trésorerie.

    - Le calendrier ne crée pas de point de rupture : même en concentrant la perte et les deux échéances
    de dividende, le plancher trimestriel des fonds propres reste à 2,3 M€.


    **Pour rompre le covenant, la perte devrait dépasser 1,5 M€ — soit 3,75 fois le plafond contractuel.**
    L''exposition maximale représente 12 % des fonds propres et 15 % de la trésorerie.


    ## 3. Réponse au directeur financier


    Son objection est la bonne question posée au mauvais dossier. « Jouer la maison » suppose que la branche
    défavorable puisse emporter l''entreprise. Ici elle ne le peut pas, et pour des raisons contractuelles
    écrites, non par optimisme : perte totale plafonnée, **pas de caution personnelle, pas de défaut croisé,
    aucune sûreté sur l''actif industriel, carnet de commandes non gagé.** Un mauvais tirage dont le pire
    cas reste soutenable est de la variance ; refuser toute variance bornée, c''est renoncer par principe
    à 180 k€ d''espérance supplémentaire.


    Sur Tremay : un cas ne fixe pas une fréquence, et rien dans ce que nous en savons ne porte sur ce
    qui nous protège ici — sa structure de financement, ses garanties personnelles, son plafond de perte
    s''il en avait un. Si le conseil dispose de ces éléments et qu''ils montrent une exposition comparable
    à la nôtre, l''argument change de nature et je veux l''entendre vendredi.


    Ce que je retiens en revanche de son objection : la faiblesse du dossier n''est pas le bilan, c''est
    **la source du 60 %**. Onze installations documentées, sélectionnées et commentées par le service
    qui porte le projet, c''est une base étroite et probablement favorable.


    ## 4. Ce qui renverserait ce choix


    Trois observations, vérifiables avant signature :


    1. **Le dossier brut des onze installations**, dénominateur compris. Si le taux de succès réel des
    cas comparables tombe sous 46 %, je recommande A.

    2. **Une exclusion au plafond de 400 k€** — remise en état du site, engagements d''investissement
    déjà pris, faute d''exploitation. Le plafond est le seul pilier du raisonnement : s''il est poreux,
    tout tombe.

    3. **Un investissement à décaisser en dehors du plafond.** J''ai retenu comme hypothèse, en l''absence
    de chiffre communiqué, que les 900 k€ et les 400 k€ sont nets de tout décaissement. Si un capex distinct
    existe, les calculs de trésorerie du § 2 sont à refaire avant signature.


    ## 5. Repli, et qui le déclenche


    L''engagement est ferme et sans sortie anticipée : le seul repli disponible est **la constatation
    de l''échec elle-même**, qui déclenche le plafond au lieu de laisser filer les coûts.


    **Je propose que ce déclenchement appartienne au directeur financier, pas à moi.** Il fixe avant signature
    le jalon technique de qualification et la date à laquelle il est mesuré, et il a autorité pour constater
    l''échec sans mon arbitrage. Second garde-fou, chiffré : si à un test trimestriel les fonds propres
    projetés passent sous **1,8 M€** — 600 k€ au-dessus du covenant — l''échec est constaté immédiatement.
    Celui qui porte l''objection tient la manette : ce n''est pas une consultation, c''est un pouvoir
    réel d''arrêt.


    Sur Sedamex, la perte n''est pas seulement financière : nous perdons un client et l''activité des
    équipes affectées. Je propose de lui offrir un volume partiel et un droit de préférence à dix-huit
    mois, plutôt qu''une rupture sèche.


    ## 6. Première action


    D''ici vendredi : saisine du conseil juridique sur les exclusions du plafond, et demande au bureau
    d''études du dossier brut des onze cas avec les échecs. **Sans ces deux réponses, je demande au conseil
    de reporter la signature, pas de choisir A.**


    ---


    **Deux points où mon raisonnement peut être attaqué**, que je soumets au conseil plutôt que de les
    taire : je ne valorise pas la perte de temps de direction ni la perturbation de la production existante
    par le chantier, qui ne sont pas dans le plafond ; et je traite la reconduction Sedamex comme neutre
    alors qu''elle prolonge de dix-huit mois une dépendance de sous-traitance à 200 k€ de marge — l''option
    prudente a elle aussi un coût, simplement il ne s''écrit pas dans le tableau.

    '
