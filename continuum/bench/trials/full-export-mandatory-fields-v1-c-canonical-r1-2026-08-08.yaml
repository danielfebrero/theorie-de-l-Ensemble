response:
  text: 'Avant la note, un point de méthode : j''ai traité ceci comme une décision critique (branche irréversible
    + emplois exposés), donc gates complètes et refus de signature déléguée. La note ci-dessous est écrite
    pour être appliquée telle quelle.


    ---


    # NOTE DE DIRECTION — Contrat D / arbitrage exclusivité


    **De :** Direction générale

    **Pour exécution par :** comité de direction, du 9 au 30 août 2026

    **Statut :** instruction. Aucun point de cette note n''est ouvert à l''arbitrage en mon absence. Le
    statu quo est la décision par défaut sur tout ce qui n''y figure pas.


    ---


    ## 1. Décision


    **Nous ne signons pas le contrat proposé par D. Ni dans sa forme actuelle, ni dans une forme amendée
    qui conserverait l''exclusivité totale ou une durée supérieure à 24 mois.**


    Nous répondons dans les huit jours, par écrit et par une contre-proposition signée de notre côté —
    pas par une demande de délai. D aura une réponse ferme le 16 août.


    ---


    ## 2. Pourquoi — les trois raisons, chiffrées


    **a) La remise de 9 % n''est pas couverte par les +18 % de volume.**

    Marge brute actuelle sur D : 14,9 M€ × 31 % = **4,62 M€**.

    À structure de coût constante, il faudrait **+41 % de volume** pour que la remise de 9 % soit neutre
    sur la marge en euros. D en propose 18 %.

    En intégrant honnêtement l''absorption des coûts fixes sur les volumes additionnels (hypothèse haute
    : 40 % de coûts fixes dans le coût de revient), la première année se situe entre **−0,75 M€ et l''équilibre**.
    Dans le meilleur des cas, nous produisons 18 % de plus pour gagner autant.


    **b) L''asymétrie du contrat est la vraie clause.**

    Notre engagement — prix et exclusivité — est ferme trois ans. L''engagement de D est ferme **un an**.
    Années 2 et 3 : D revient au volume qu''il veut, au prix diminué de 9 %, et nous ne pouvons vendre
    nulle part ailleurs. Marge sur D dans ce cas : 3,28 M€, soit **−1,34 M€ par an**, sur une entreprise
    dont la marge brute totale est de 7,44 M€ et la trésorerie de 2,1 M€.

    Ce n''est pas une hypothèse d''école : D a réduit ses commandes de 11 % sans préavis au T2. Nous savons
    comment il se comporte quand rien ne l''oblige.


    **c) La sortie est verrouillée.**

    1,2 M€ = 57 % de notre trésorerie disponible. La pénalité ne protège pas D d''un risque, elle nous
    empêche de corriger une erreur.


    **Le point qui tranche.** La remise est chère mais rattrapable. L''exclusivité, non : elle supprime
    pendant trois ans la possibilité même d''avoir une alternative, au moment précis où deux alternatives
    existent. Un prix se renégocie ; une optionnalité vendue ne se rachète pas. Nous acceptons de perdre
    de la marge, nous n''acceptons pas de perdre le droit d''exister ailleurs.


    ---


    ## 3. Ce que vous envoyez à D avant le 16 août


    Une contre-proposition complète, signée par nous, présentée comme une offre sérieuse et non comme
    un refus.


    **Termes à proposer :**


    | Point | Notre proposition |

    |---|---|

    | Durée | **24 mois**, reconductible par accord exprès |

    | Remise | **Indexée sur volume constaté**, régularisée trimestriellement : 2 % socle / 3,5 % au-delà
    de +5 % / 5 % au-delà de +12 % / 6 % au-delà de +25 % |

    | Exclusivité | **De canal uniquement** : réseau GMS de D, France métropolitaine, sur les 8 références
    actuelles |

    | Exclusions (indivisibles) | Vente en ligne directe et marketplace · restauration hors domicile ·
    export · **toute nouvelle référence** développée pendant le contrat |

    | Volume | Plancher **ferme sur les 24 mois**, pas seulement la première année |

    | Clause de retour | Volume sous le plancher sur un trimestre glissant → la remise retombe automatiquement
    à 2 % et nous récupérons la liberté de canal sur les références concernées |

    | Préavis | Toute réduction > 5 % sur trimestre glissant : **préavis écrit de 90 jours** |

    | Référencement | Maintien des 8 références garanti 12 mois |

    | Sortie | Pénalité **symétrique et dégressive** : 0,4 M€ an 1, 0,2 M€ an 2. Nulle pour nous si D
    passe sous le plancher ou manque au préavis |


    Le principe à défendre en négociation, en une phrase : *chaque palier de remise est calibré pour laisser
    notre marge brute en euros au moins égale à aujourd''hui. Nous ne payons pas pour croître.* C''est
    vérifiable, c''est défendable devant un acheteur, et cela déplace la discussion du rapport de force
    vers l''arithmétique.


    **Lettre d''accompagnement — argument de gouvernance.** Un engagement de trois ans portant sur 62
    % du chiffre d''affaires, assorti d''une pénalité de 1,2 M€, excède la gestion courante et relève
    d''une délibération du conseil. C''est exact, c''est vérifiable, et cela donne à D une raison non
    conflictuelle d''accepter que la réponse définitive vienne après le 30 août — donc avant son comité
    d''achat de septembre. Utilisez-le. Ne le présentez pas comme une manœuvre.


    ---


    ## 4. Enveloppe de signature


    Vous pouvez signer sans moi, **conjointement DAF + directeur commercial (deux signatures, jamais une)**,
    tout accord respectant simultanément :


    - durée ≤ 24 mois

    - remise moyenne pondérée ≤ 5 %, **jamais déconnectée du volume constaté**

    - exclusivité partielle avec les quatre exclusions du §3, **les quatre ensemble**

    - plancher de volume ferme sur toute la durée + préavis 90 jours

    - pénalité ≤ 0,4 M€ et symétrique


    **Interdits absolus, en toute circonstance, y compris sous menace explicite de déréférencement :**


    - exclusivité totale, quelle qu''en soit la durée ou la contrepartie

    - remise fixe non indexée au volume réalisé

    - durée > 24 mois

    - pénalité > 0,4 M€ ou asymétrique

    - suppression ou réduction du préavis


    Si D refuse tout : **on ne signe pas.** Réponse à tenir : « nous restons preneurs d''un accord, l''arbitrage
    final relève du directeur général, de retour le 30 août, avant votre comité de septembre. » Pas de
    dramatisation, pas de rupture, pas de concession.


    ---


    ## 5. Les trois chiffres à établir avant le 11 août


    Sans eux, vous négociez à l''aveugle. DAF et directeur industriel, sous 48 h :


    1. **Part exacte des 4 références menacées dans les 14,9 M€ de D**, et leur marge. C''est le seul
    chiffre qui mesure réellement la menace.

    2. **Le niveau de CA correspondant à 70 % de plan de charge à Redon.** Nous pilotons un seuil que
    nous n''avons jamais converti en euros.

    3. **Vérification du ratio charges fixes.** 2,1 M€ ≈ 3 mois implique ~0,7 M€/mois de charges fixes
    contre 0,62 M€/mois de marge brute — soit une entreprise au point mort. Si c''est exact, la remise
    de 9 % nous fait basculer structurellement et la décision de ne pas signer devient impérative. Si
    c''est une approximation, la décision ne change pas. Vérifiez-le quand même : vous en aurez besoin
    pour le reste.


    ---


    ## 6. Ce que vous lancez en parallèle, sans attendre D


    **Marketplace — démarrage immédiat, avant le 20 août.** Trois références hors du cœur de gamme de
    D, périmètre limité, budget plafonné à 60 k€. L''objectif n''est pas le volume, c''est **l''existence**
    : un canal ouvert avant toute signature est un canal qu''aucune exclusivité future ne peut effacer
    rétroactivement. C''est maintenant ou jamais. Ne le cachez pas, ne le mettez pas en avant.


    **Centrale régionale — faire passer le jalon de 5 mois à 8 semaines.** Envoyer une offre chiffrée
    avant le 20 août et demander explicitement une **lettre d''intention non engageante** à 8 semaines
    plutôt qu''une décision à 5 mois. Une LOI ne vaut pas un contrat, mais elle change notre position
    en septembre.


    **Conseil juridique — note sous 5 jours, gardée en réserve.** Mandater un avocat en droit de la distribution
    sur deux points : (i) notre dépendance économique de 62 % installée dans la durée, et la protection
    contre la rupture brutale de relations commerciales établies — un déréférencement massif en représailles
    d''un refus d''exclusivité n''est pas un acte libre pour D ; (ii) la qualification de la baisse de
    11 % du T2 sans préavis. **Cette note ne sort pas** sauf déclenchement T6. Elle sert d''abord à ce
    que vous négociiez en sachant ce que vaut réellement la menace.


    **Traçabilité.** Tout échange avec D par écrit ou confirmé par écrit dans les 24 h, y compris les
    conversations téléphoniques. Sans exception, à partir de demain.


    ---


    ## 7. Déclencheurs et répliques


    Chaque ligne est autonome. Exécutez sans chercher d''autorisation.


    | Déclencheur observable | Action | Qui |

    |---|---|---|

    | **T1** — plan de charge prévisionnel 8 semaines < 85 % | Flexibilité niveau 1 : arrêt intérim, lissage
    stocks, report maintenance non critique. Réversible. | DI + DAF |

    | **T2** — < 78 % sur 3 semaines consécutives | Constitution du dossier chômage partiel Redon — **préparation
    administrative seule, dépôt non effectué**. Information CSE. Réversible. | DI + DRH |

    | **T3** — < 70 % projeté sur 4 semaines consécutives **et** confirmé par carnet de commandes fermes
    | Dépôt du dossier. C''est le seul acte irréversible que je délègue, et uniquement sous cette double
    condition. **Jamais sur la base d''une menace verbale de D.** | DI + DRH + DAF |

    | **T4** — trésorerie < 1,5 M€ | Gel de tout engagement non contracté, **phase 2 Maroc incluse**.
    | DAF, seul |

    | **T5** — trésorerie < 1,2 M€ | Activation de la ligne de découvert / affacturage préparée avant
    mon départ. | DAF, seul |

    | **T6** — D notifie par écrit un déréférencement | Ne rien signer, ne rien concéder. Extension marketplace
    au périmètre complet sous 15 jours. Notification à la centrale régionale d''une disponibilité anticipée.
    Envoi de la lettre juridique, factuelle et non comminatoire. | Comité complet |


    ---


    ## 8. Ce qui renverserait cette décision


    Un seul fait, et il est mesurable dès le 11 août : **si les 4 références menacées représentent plus
    de 45 % du CA de D (soit > 6,7 M€) et que leur perte fait passer Redon sous 70 % dès octobre sans
    compensation possible**, alors ce n''est plus un arbitrage de marge, c''est un arbitrage de survie
    industrielle.


    Dans ce cas et dans ce cas seulement, l''enveloppe du §4 s''élargit à : **remise moyenne jusqu''à
    6 %, durée jusqu''à 24 mois**. Les cinq interdits absolus restent intégralement en vigueur. L''exclusivité
    totale reste interdite **y compris dans ce scénario** — parce que c''est précisément elle qui transformerait
    un problème grave mais récupérable en problème non récupérable.


    Si ce chiffre est inférieur à 25 % du CA de D, la menace est absorbable : tenez la contre-proposition
    du §3 sans mouvement.


    ---


    ## 9. Autorité et interdits


    - **Directeur commercial** : porte la négociation. Ne signe jamais seul.

    - **DAF** : co-signe, tient les chiffres, les déclencheurs et la trésorerie. Autorité pleine et solitaire
    sur T4 et T5.

    - **Directeur industriel** : plan de charge, seuils, dossier Redon.

    - **Signature contractuelle** : DAF + directeur commercial conjointement, strictement dans l''enveloppe
    du §4 (ou §8 si le fait renversant est établi par écrit et documenté).


    **Règle générale de mon absence : un acte réversible se prend, un acte irréversible s''ajourne.**
    L''unique exception est T3, sous double condition.


    Si un événement non prévu par cette note survient : ne décidez pas. Documentez, tenez la position,
    attendez le 30 août. L''absence de décision est une décision valide et je l''assume par avance.


    ---


    ## 10. Première action — 9 août, matin


    DAF et directeur commercial se réunissent et lancent l''établissement des trois chiffres du §5. Rien
    d''autre ne commence avant que ces chiffres soient sur la table.


    Calendrier : **11 août** chiffres · **13 août** contre-proposition rédigée et relue · **16 août**
    envoi signé à D avec la lettre de gouvernance · **20 août** marketplace en ligne et offre centrale
    envoyée · **30 août** mon retour.


    ---


    *Signé — Direction générale, 8 août 2026*


    ---


    **Le meilleur argument contre cette note, et ma réponse.**


    On peut soutenir que la dépendance à 62 % existe déjà, que l''exclusivité ne fait que la formaliser,
    que 9 % achètent trois ans de visibilité industrielle et la fin de la menace de déréférencement —
    et que les alternatives sont du vent : cinq mois pour un peut-être, et une fourchette de 0,4 à 2,2
    M€ qui est un aveu d''ignorance plutôt qu''une prévision.


    Cet argument est juste sur un point : **les alternatives ne remplacent pas D**, ni en huit jours ni
    en douze mois. La note ne prétend pas le contraire. Mais il se retourne sur l''essentiel : il plaide
    pour un accord où le volume est garanti, et cet accord ne garantit le volume qu''un an sur trois.
    Il échange une dépendance de fait — dont nous pouvons sortir progressivement — contre une dépendance
    de droit dont nous ne pouvons pas sortir. La stratégie n''est pas de remplacer D. Elle est de ne pas
    détruire juridiquement la possibilité de le faire un jour.

    '
