response:
  text: 'Deux phrases avant la note : elle contient bien une règle qui rétablit l''automatique **sans
    nouvelle réunion** — c''est la demande du DG et elle est satisfaite. Mais le déclencheur ne peut pas
    être un nombre de jours sans alarme, parce que c''est exactement l''indicateur qui était au vert pendant
    toute la dérive de mai ; la note dit pourquoi et propose le déclencheur qui, lui, est vérifiable,
    avec un calendrier et un chiffrage.


    ---


    **NOTE AU COMITÉ D''EXPLOITATION — jeudi 13 août**

    **Objet : conditions de retour de la chloration en régulation automatique**

    Rédacteur : responsable d''exploitation — Régie des eaux de Trévanne


    **1. Ce que mesurent les 87 jours, et ce qu''ils ne mesurent pas**


    Le 11 mai, veille de l''incident, un compteur « jours sans alarme de discordance » affichait environ
    175 jours au vert. L''alarme était désactivée depuis novembre. La dérive de S2 durait depuis au moins
    9 jours et le compteur était satisfait pendant toute sa durée. Une règle en jours sans alarme aurait
    autorisé le passage en automatique le 11 mai au matin.


    Les 25 jours d''observation du comparateur S2/S3 (14 juillet → 8 août) ont été faits sur une sonde
    de six semaines, étalonnée tous les quinze jours, sur une boucle en manuel. Il n''y avait rien à détecter.
    Le silence d''un détecteur qu''on n''a jamais mis en défaut n''est pas une preuve de fonctionnement.


    **2. Ce qui a changé depuis le 12 mai — et ce qui n''a pas changé**


    | Cause établie par l''enquête | État au 8 août |

    |---|---|

    | S2 dérivait | Remplacée le 2 juin. Elle dérivera de nouveau : c''est la nature d''une sonde. |

    | La boucle ne comparait jamais S2 à S3 | Le comparateur existe, mais sa sortie va vers un écran.
    **La boucle ne compare toujours pas.** |

    | Alarme de discordance désactivée depuis novembre | Programme automate non modifié : **l''alarme
    est dans l''état du 12 mai.** |

    | Une mesure unique, non contredite, pilotait l''actionneur | Inchangé. Rien ne borne la dose demandée.
    |


    Sur les quatre causes, une seule est traitée, et c''est la moins structurelle. En repassant en automatique
    aujourd''hui, nous remettons en service la configuration exacte du 12 mai avec une sonde neuve — c''est-à-dire
    que nous remettons le compteur à zéro sur le même piège.


    **3. Le contre-argument, pris au sérieux**


    Rester en manuel n''est pas l''option sans risque. La dispersion est passée de 0,08 à 0,21 mg/L :
    la main est moins bonne que la machine sur la qualité. Un poste 24/7 improvisé se dégrade avec les
    mois (fatigue, rotation, dérive des pratiques), et il coûte 1 350 € par jour. **L''urgence est donc
    réelle — elle porte sur les travaux, pas sur la date de bascule.**


    **4. Règle proposée, à signer jeudi**


    > La régulation automatique de la chloration est rétablie **sans nouvelle délibération du comité**,
    dès que les cinq conditions suivantes sont constatées et consignées par le responsable d''exploitation
    :

    > 1. la sortie du comparateur S2/S3 **agit sur la boucle** : au-delà de 0,15 mg/L d''écart pendant
    30 minutes, la régulation bascule seule sur consigne fixe de sécurité et alarme le poste (valeurs
    à confirmer par la campagne d''essais) ;

    > 2. un **limiteur haut indépendant de la boucle** borne la dose injectée, de sorte qu''aucune consigne,
    juste ou fausse, ne puisse produire plus de 0,8 mg/L en sortie ;

    > 3. la campagne d''essais par **injection de défaut** est réussie 3 fois sur 3, dont un essai en
    rampe lente au rythme de la dérive de mai et un essai de gel de mesure ;

    > 4. l''état de toutes les inhibitions d''alarme est relevé et tracé ; toute inhibition future **expire
    automatiquement sous 72 h** sans reconduction écrite ;

    > 5. le programme de l''automate est versionné et son écart avec celui du 12 mai est documenté.

    >

    > Le retour en automatique est **suspendu de plein droit, sans réunion**, si l''essai périodique mensuel
    du comparateur n''est pas réussi à sa date.


    Le comité délègue ainsi la bascule ; il ne se réunit plus sur ce sujet. Le critère du 13 mai n''est
    pas contourné : il est exécuté. Il disait « tant que la discordance n''est pas instrumentée » — un
    tableau de bord n''est pas une instrumentation.


    **5. Calendrier et coûts**


    | Échéance | Étape | Coût mensuel des postes |

    |---|---|---|

    | 14 août | Spécification de la réaction et des seuils | 41 k€ |

    | 8 août → 5 sept. | Modification du programme, câblage du repli, pose du limiteur | 41 k€ |

    | 8–12 sept. | Campagne d''essais par injection de défaut | 41 k€ |

    | 15 sept. | Retour en automatique si 3/3 ; poste ramené à 1 agent | 20,5 k€ |

    | 6 oct. | Après 21 jours propres et 1 essai périodique réussi : effectif normal | 0 |


    Dépense totale d''ici l''extinction : **≈ 65 k€**. Attendre l''audit du 30 septembre pour décider
    en coûte **≈ 72 k€** et ne rétablit rien à cette date. La règle proposée est donc aussi la moins chère.


    **Si une seule ligne devait être financée, c''est le limiteur haut (condition 2)** : il borne la conséquence
    quelle que soit la qualité de la mesure. C''est la seule protection qui ne dépend pas d''un détecteur
    qu''il faut croire sur parole.


    **6. Ce qui renverserait cette recommandation**


    Si les essais montrent que le comparateur ne détecte pas la rampe lente — parce que S2 et S3 partagent
    un mode de défaillance commun (même eau, même encrassement) —, alors le comparateur n''est pas la
    protection attendue et il faut une troisième mesure de technologie différente. Dans ce cas, une règle
    en jours sans alarme serait encore moins défendable qu''aujourd''hui.


    L''audit externe du 30 septembre pourra ajouter des conditions ; il ne peut pas retirer celles qui
    auront été remplies. Il n''y a donc pas lieu de l''attendre.

    '
