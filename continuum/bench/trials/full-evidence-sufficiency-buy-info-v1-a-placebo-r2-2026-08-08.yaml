    ---


    # NOTE AU COMITÉ DE DIRECTION


    **Objet :** Contrat cellules 2027 (80 000 unités) — arbitrage Kelmar / Sinolux

    **De :** Direction des opérations — **Date :** lundi J+0


    ## Décision proposée


    **Ne pas signer Sinolux cette semaine. Commander dès aujourd''hui l''essai Vertex (9 500 €) et décider
    sur résultat, au plus tard à J+40.** Le calendrier le permet sans décaler d''un jour le démarrage
    production.


    ## Pourquoi l''économie de 240 000 € n''est pas une économie


    Les 240 000 € sont un montant **brut**. Le SAV est l''autre moitié de l''équation : à 210 € le retour,
    chaque point de taux de retour pèse 168 000 € sur l''année.


    | Taux de retour | Retours | Coût SAV | Écart vs Kelmar | **Gain net réel** |

    |---|---|---|---|---|

    | **Kelmar — 1,2 %** (référence, stable 3 ans) | 960 | 201 600 € | — | — |

    | Sinolux à 1,0 % *(essais Sinolux)* | 800 | 168 000 € | −33 600 € | **+273 600 €** |

    | Sinolux à 1,5 % *(bas de fourchette qualité)* | 1 200 | 252 000 € | +50 400 € | **+189 600 €** |

    | Sinolux à 2,0 % | 1 600 | 336 000 € | +134 400 € | **+105 600 €** |

    | **Sinolux à 2,63 %** | 2 103 | 441 600 € | +240 000 € | **0 € — seuil de bascule** |

    | Sinolux à 2,9 % *(audit sectoriel mars)* | 2 320 | 487 200 € | +285 600 € | **−45 600 €** |

    | Sinolux à 3,0 % *(haut de fourchette qualité)* | 2 400 | 504 000 € | +302 400 € | **−62 400 €**
    |


    **Le seuil est à 2,63 %. La fourchette de nos ingénieurs (1,5 %–3 %) l''enjambe, et le seul chiffre
    mesuré sur le terrain (2,9 %) est au-dessus.** Nous ne savons donc pas aujourd''hui si Sinolux nous
    fait gagner 190 000 € ou perdre 62 000 €. En prenant la fourchette de nos ingénieurs comme référence,
    l''espérance de gain tombe autour de 60 000 €, avec environ une chance sur quatre d''être négative
    — soit un quart du chiffre inscrit au budget.


    **Hiérarchie des trois sources :** le 1,0 % vient du vendeur, sur ses propres essais, sans contradiction.
    Le 2,9 % est une mesure terrain, par un tiers, sur une ligne comparable du même fournisseur. Ces deux
    chiffres n''ont pas le même poids probatoire. Et le refus de Sinolux de garantir contractuellement
    le taux est en soi une information : un fournisseur convaincu de son 1,0 % accepte un malus plafonné
    qui ne lui coûtera rien.


    ## Le test ne retarde rien — c''est un fait de calendrier, pas une opinion


    - Vertex lancé demain, 11 jours ouvrés → résultat vers **J+16**.

    - Prix Sinolux tenu jusqu''à **J+45**. Commande ferme Kelmar due **J+50**. Production **J+60**.

    - **Marge disponible : 29 jours.** Vertex peut doubler son délai annoncé et nous restons dans les
    temps.


    Le coût du test — 9 500 € — représente 4 % de l''enjeu et 0,12 € par chargeur. Nous achetons la levée
    d''une incertitude à 300 000 € pour le prix d''une semaine de SAV.


    ## Règle de décision, arrêtée maintenant


    Pour éviter que le résultat ne soit réinterprété après coup :


    - **Vertex ≤ 2,3 %** → Sinolux. Marge de sécurité couvrant l''incertitude ±0,3 pt.

    - **Vertex ≥ 2,9 %** → Kelmar. Sans discussion.

    - **Entre 2,3 % et 2,9 %** → Kelmar par défaut, sauf si Sinolux accepte d''ici là un partage de risque
    (voir ci-dessous).

    - **Pas de résultat à J+40** → Kelmar. Nous ne laissons pas le calendrier décider à notre place.


    Point de vigilance technique : 1 200 cellules à un taux de 2 % donnent un intervalle de confiance
    naturellement plus large que les ±0,3 pt du historique Vertex. **J''exige de Vertex l''intervalle
    de confiance et la méthode de conversion vieillissement→terrain, pas seulement un chiffre.** Si l''intervalle
    ressort à ±0,8 pt, la zone grise ci-dessus s''élargit d''autant.


    ## En parallèle, sans attendre le résultat


    1. **Rouvrir la négociation Sinolux sur le partage de risque.** Puisqu''une clause de garantie est
    refusée, proposer l''équivalent économique : retenue de 3 €/cellule en séquestre 12 mois, libérée
    selon le taux constaté ; ou engagement en deux tranches (20 000 unités puis solde). Un refus de toutes
    ces formules vaut réponse sur ce que Sinolux croit vraiment de son 1,0 %.

    2. **Sécuriser le créneau Kelmar** jusqu''à J+50 par écrit, sans engagement de notre part.

    3. **Corriger l''inscription budgétaire.** Les 240 000 € doivent être ramenés à une hypothèse prudente
    (~90 000 €) dès maintenant, quelle que soit l''issue. Un chiffre brut inscrit avant décision transforme
    un arbitrage en obligation de résultat, et c''est ce mécanisme qui crée aujourd''hui la pression à
    signer.


    ## Aux deux objections


    **À la direction financière :** je ne renonce pas aux 240 000 €, je refuse de les inscrire avant de
    savoir s''ils existent. Le scénario où nous signons cette semaine et atterrissons à 2,9 % coûte 45
    600 € au lieu d''en rapporter 240 000 — un écart de 285 600 € à expliquer en clôture, contre 9 500
    € à expliquer aujourd''hui.


    **À la direction commerciale :** le test ne consomme aucun jour du chemin critique. Ce qui menacerait
    réellement le lancement, c''est un taux de retour à 2,9 % en année 1 : 2 320 chargeurs repris, soit
    environ 45 par semaine à absorber par le réseau, avec l''effet client que cela implique. Le risque
    de retard est nul ; le risque de qualité est celui qu''on prend en signant à l''aveugle.


    ## Ce que je demande au comité aujourd''hui


    1. Validation de la dépense Vertex — **9 500 €**, engagée ce jour.

    2. Validation de la règle de décision ci-dessus, **avant** de connaître le résultat.

    3. Mandat de négociation du partage de risque avec Sinolux.

    4. Point d''arbitrage inscrit à **J+18**, décision finale actée au plus tard à **J+40**.


    ---


    *Deux hypothèses non chiffrées dans cette note, à confirmer avant décision : le coût ponctuel de bascule
    fournisseur (qualification, outillage, stocks de sécurité), et la tenue du prix Sinolux en cas de
    commande fractionnée. Les deux jouent contre Sinolux et ne changent donc pas le sens de la recommandation.*

