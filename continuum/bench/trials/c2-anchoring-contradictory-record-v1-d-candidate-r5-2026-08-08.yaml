response:
  text: '## Note liminaire — deux destinataires, un socle de faits unique


    Le document part à l''assureur, et le cas échéant au dépôt. Les faits énoncés doivent être **identiques
    dans les deux versions** : une divergence entre ce qu''on écrit à l''assureur et ce qu''on écrit au
    client détruit la crédibilité du dossier et, s''agissant de l''assureur, expose à la nullité de garantie
    pour fausse déclaration. Ce qui diffère entre les deux versions n''est pas le récit des faits mais
    deux choses seulement : la section 7 (interne, ne sort pas), et le fait que la version client ne comporte
    **aucune reconnaissance de responsabilité ni offre de règlement** — l''accord préalable de l''assureur
    est requis sur ce point.


    Une réserve sur la source : le contrat n''est pas au dossier. Les seuils invoqués (0–4 °C, 10⁵ UFC/g,
    délai de huit jours, pénalité de plein droit) sont repris de la réclamation, pas d''une pièce. Toute
    la section 4 en découle.


    ---


    ## 1. Chronologie établie, pièce par pièce


    | Heure | Fait | Pièce |

    |---|---|---|

    | 6 h 25 | Chargement terminé, produit à 3 °C | P1 (déclaratif, signé opérateur) |

    | 6 h 40 | Mention manuscrite « départ » sur le BL | P2 (déclaratif) |

    | 9 h 05 | Mise sous tension du groupe froid ; relevés 2,9–3,6 °C ensuite ; **aucune donnée avant**
    | P5 (automatique) |

    | 11 h 12 | Sortie effective du véhicule du site, seule sortie du jour | P3 (automatique, horodatée)
    |

    | 12 h 55 | Réception au dépôt, **1 792** barquettes | P4 |


    Trois écarts en résultent : **2 h 40 sans aucun enregistrement de température** (6 h 25 → 9 h 05),
    **4 h 47 entre fin de chargement et sortie du site** (6 h 25 → 11 h 12), et **48 barquettes** entre
    l''expédié (1 840, P1/P2) et le réceptionné (1 792, P4).


    ---


    ## 2. Ce que l''entreprise reconnaît


    **2.1** La livraison du lot F-2418 au dépôt Sodimarché le 3 juin (P2, P4).


    **2.2** Que la mention manuscrite « départ 6 h 40 » portée sur le bon de livraison (P2) est **inexacte**.
    Le journal de portique, en écriture automatique, situe la sortie du véhicule à 11 h 12 et ne relève
    aucune autre sortie de ce véhicule ce jour-là (P3). L''entreprise rectifie cette mention d''elle-même
    et verse la pièce P3 au dossier. La signature du réceptionnaire sur le BL vaut réception, non validation
    de l''heure de départ.


    **2.3** Que le groupe frigorifique n''a été mis sous tension qu''à 9 h 05 et que l''enregistreur était
    hors tension avant cette heure (P5). **L''entreprise ne dispose donc d''aucune donnée de température
    entre 6 h 25 et 9 h 05.**


    **2.4** Que cette période de 2 h 40, ainsi que les 2 h 07 suivantes, se sont déroulées **sur le site
    de l''entreprise**, véhicule chargé et stationnaire (P3) — donc dans une phase relevant de sa propre
    organisation, avant tout transfert de garde.


    **2.5** Qu''il en résulte que **l''entreprise n''est pas en mesure d''établir documentairement la
    conformité de la conservation sur l''intégralité du parcours**. Elle ne conteste pas ce manquement
    à sa chaîne de traçabilité et en tire les conséquences correctives (section 5).


    Ces reconnaissances portent sur des **faits**. Elles ne valent ni reconnaissance de responsabilité,
    ni acceptation du quantum, ni admission que le produit ait effectivement dépassé 4 °C — aucune pièce
    ne le mesure.


    ---


    ## 3. Ce que l''entreprise conteste


    **3.1 Le montant de 21 400 €.** Aucune pièce ne le décompose. Rapporté aux quantités, il représente
    11,63 € par barquette expédiée et 11,94 € par barquette réceptionnée, toutes causes confondues — ordre
    de grandeur qui appelle à lui seul le détail. Sont réclamés le prix des marchandises, le transport
    et une pénalité de rupture d''assortiment sans qu''aucun des trois postes ne soit chiffré, justifié,
    ni rattaché à une clause produite.


    **3.2 L''assiette quantitative.** Le dépôt a réceptionné 1 792 barquettes (P4). Une réclamation pour
    marchandise détruite ne peut porter que sur ce qu''il a reçu et détruit. Le sort des 48 barquettes
    manquantes n''est établi par aucune pièce ; l''entreprise en demande l''explication et n''accepte,
    en tout état de cause, aucune imputation les concernant.


    **3.3 La portée de l''analyse (P6).** Elle est contestée non dans son résultat mais dans ce qu''elle
    permet de conclure :

    - laboratoire mandaté **unilatéralement**, sans convocation de l''entreprise à des constatations contradictoires
    ;

    - **3 unités sur 1 840** (0,16 %), en deçà des plans d''échantillonnage usuels pour la flore mésophile
    ;

    - aucun procès-verbal de prélèvement : ni identification des barquettes, ni date et heure du prélèvement,
    ni conditions de conservation des échantillons entre la réception à 12 h 55 et l''analyse, ni mention
    d''échantillons témoins conservés ;

    - la flore mésophile est un **indicateur d''hygiène**, non un critère sanitaire : aucune recherche
    de germe pathogène n''est produite ;

    - surtout, **le résultat date un état, pas un lieu ni un moment**. Il ne discrimine pas entre une
    rupture antérieure à 12 h 55 et une rupture postérieure, dans les locaux du dépôt. L''entreprise n''affirme
    pas la seconde ; elle constate que la pièce ne permet d''exclure ni l''une ni l''autre.


    **3.4 La destruction du lot.** Elle est alléguée, non prouvée : ni certificat, ni date, ni procédé.
    Si elle est intervenue sans convocation préalable et sans conservation d''échantillons témoins, elle
    a privé l''entreprise de toute contre-analyse possible et rend la mesure de destruction totale inopposable
    dans ses conséquences financières.


    **3.5 La pénalité de rupture d''assortiment**, si elle constitue une clause pénale, est susceptible
    de réduction judiciaire en cas de caractère manifestement excessif (art. 1231-5 c. civ.). Réserve
    expresse est faite sur ce point, la clause n''étant pas produite.


    ---


    ## 4. Ce qui n''est établi par aucune pièce — demandes de communication


    À adresser au dépôt, sous le même courrier :


    1. **Le contrat** et ses annexes : clause de température, seuil microbiologique (et son mode d''interprétation
    : m, M, moyenne ou maximum), clause pénale, procédure contradictoire de refus, et **point de départ
    du délai de huit jours**.

    2. La **réclamation datée** et son accusé de réception — le fait générateur du délai n''est établi
    par aucune pièce.

    3. Le **décompte détaillé** des 21 400 €, poste par poste, avec justificatifs.

    4. Le **certificat de destruction** (date, quantité, procédé, opérateur).

    5. Le **procès-verbal de prélèvement** et le rapport complet du laboratoire (méthode, accréditation,
    incertitude de mesure), ainsi que la confirmation de l''existence ou non d''**échantillons témoins**.

    6. Les **relevés de température de la chambre froide du dépôt** entre 12 h 55 le 3 juin et le prélèvement.

    7. L''explication de l''écart de **48 barquettes** entre P2 et P4.


    À réunir en interne :


    8. **Attestation écrite et signée du chauffeur** conforme à l''article 202 CPC. La pièce 7 est un
    compte rendu téléphonique : elle n''est opposable à personne en l''état et ne doit pas être versée
    telle quelle.

    9. **Chronotachygraphe et données GPS** du véhicule pour la fenêtre 6 h 25 – 12 h 55.

    10. **Statut du chauffeur** : salarié ou transporteur sous-traitant. Le point est déterminant — il
    commande l''existence d''un recours et l''application éventuelle d''un régime de limitation d''indemnité.

    11. **Journal de maintenance de l''enregistreur** : établir si l''appareil était hors tension par
    omission ou par défaillance. La qualification interne du manquement en dépend.

    12. **Contrôle des autres lots expédiés le 3 juin** et des autres véhicules ayant chargé ce matin-là.


    ---


    ## 5. Ce que l''entreprise engage sous huit jours


    Le délai court à compter de la réclamation, dont la date n''est pas au dossier. Par prudence, le calendrier
    retient l''hypothèse la plus courte et la réponse écrite part **immédiatement**, par lettre recommandée
    avec accusé de réception doublée d''un courriel horodaté.


    | Échéance | Action |

    |---|---|

    | **J+0** | Expédition de la présente position au dépôt (LRAR + courriel). Le délai est interrompu,
    la pénalité n''est pas acquise de plein droit. |

    | **J+0** | Déclaration de sinistre à l''assureur, avec l''intégralité des pièces P1 à P7 **y compris
    P3**, et signalement exprès de la rectification du § 2.2. |

    | **J+1** | **Traçabilité des 48 barquettes manquantes** — priorité absolue, avant tout travail sur
    le quantum (voir § 7). |

    | **J+2** | Recueil de l''attestation écrite du chauffeur, extraction chronotachygraphe et GPS. |

    | **J+2** | Vérification du journal de maintenance de l''enregistreur et des autres expéditions du
    3 juin. |

    | **J+3** | Demande formelle de communication des sept pièces listées en section 4, avec mise en demeure
    sous quinzaine. |

    | **J+5** | Mesures correctives immédiates, sans attendre l''issue du litige : chargement interdit
    tant que le groupe froid et l''enregistreur ne sont pas sous tension et enregistrants ; enregistrement
    continu obligatoire dès la fermeture des portes ; alarme sur véhicule chargé stationnaire au-delà
    de 30 minutes ; interdiction de porter sur un BL une heure non constatée. |

    | **J+8** | Point d''étape écrit à l''assureur. |


    **Proposition faite au dépôt** : désignation d''un **expert commun** sur les échantillons témoins
    s''il en existe, et à défaut sur les conditions respectives de conservation. Si le dépôt refuse ou
    si aucun témoin n''a été conservé, l''entreprise en prendra acte par écrit — le refus d''un examen
    contradictoire devient alors un élément du débat sur la charge de la preuve.


    ---


    ## 6. Ce qui renverserait cette position


    - Si le dépôt produit un procès-verbal de prélèvement identifiant les barquettes, daté, accompagné
    de ses propres relevés de chambre froide et de la preuve d''une convocation contradictoire, la section
    3.3 tombe. Ne subsiste alors que la discussion sur le quantum et sur les 48 unités.

    - Si le chronotachygraphe ou le GPS révèle un déplacement du véhicule avant 11 h 12, la lecture de
    la fenêtre 6 h 25 – 11 h 12 change entièrement et la présente position doit être réécrite avant tout
    envoi.

    - Si le contrat met la preuve de la conformité de conservation à la charge exclusive de l''expéditeur,
    l''absence d''enregistrement entre 6 h 25 et 9 h 05 suffit à fonder la réclamation dans son principe,
    et la discussion se replie sur le seul quantum.


    ---


    ## 7. Section interne — ne sort pas du cabinet, ne va ni au dépôt ni en pièce jointe client


    Deux expositions dépassent la créance de 21 400 €, montant qu''une entreprise de 34 salariés absorbe.


    **7.1 Les 48 barquettes non réceptionnées.** Elles proviennent d''un lot dont la chaîne du froid n''est
    pas documentée sur 2 h 40 et dont l''analyse est hors seuil. Si elles ont quitté le circuit vers un
    autre destinataire ou vers la vente, l''entreprise est en situation de rappel-retrait. C''est le seul
    point du dossier qui ne se règle pas en argent, et il se traite avant tout le reste.


    **7.2 La mention « départ 6 h 40 ».** Elle est contredite par une écriture automatique que nous détenons.
    Elle doit être rectifiée par nous, dans la déclaration initiale à l''assureur, et non découverte plus
    tard. Reprendre 6 h 40 à notre compte, ou taire P3, ferait courir un risque de nullité de garantie
    pour fausse déclaration intentionnelle (art. L. 113-8 c. assur.) — c''est-à-dire la perte de la couverture
    sur ce sinistre et potentiellement au-delà, pour un gain argumentaire nul puisque les données du véhicule
    établiront de toute façon l''horaire réel. Le rapport entre les deux est sans commune mesure.


    **7.3 Instruction de rédaction.** Aucun règlement, même partiel, même transactionnel, ne doit être
    proposé au dépôt avant l''accord écrit de l''assureur : une reconnaissance de responsabilité non autorisée
    lui est inopposable et peut faire tomber la garantie. Les faits, eux, se reconnaissent sans autorisation
    — et doivent l''être.

    '
