response:
  text: '**Recommandation : le chiffre sort de la diapositive, et le retrait est annoncé en ouverture
    de séance — pas en notes de l''orateur.**


    ## Ce n''est pas un artefact de journalisation


    L''objection du VP Produit est réfutable avec les données que tu as déjà : **42,6 %** d''inversions
    dans le bras v2 contre **0,90 %** dans le témoin — un facteur ~47. Or les deux bras partagent le même
    service d''ingestion, la même horloge NTP unique, aucune source client, et l''infra ne trouve aucun
    incident. Toutes les causes candidates d''un artefact sont communes aux deux bras : elles prédisent
    un taux d''inversion *identique*. La seule différence entre les bras est exactement ce qui explique
    l''écart — le moment où la ligne d''affectation est écrite, documenté dans le code du 2 mars. Les
    0,90 % du témoin sont d''ailleurs ton étalon du vrai bruit d''écriture.


    ## Deux biais distincts, tous deux fatals


    1. **Sélection post-randomisation (le principal).** Entrer dans v2 exige d''être revenu en session
    2 ; le témoin est constitué dès la session 1. Le bras v2 ne contient que des survivants, le témoin
    est dilué par des abandons que v2 n''a jamais eu à porter. Ce n''est pas une comparaison de traitements.

    2. **L''effet précède la cause.** 4 812 activations sur 11 300 sont horodatées avant toute exposition
    à v2, et comptent quand même au numérateur du 47 %.


    ## Le signe de l''effet est inconnu


    Le bon comparateur n''est pas 31 % mais le taux d''activation du témoin *restreint aux retours en
    session 2*. Avec `p₂ = (0,31 − (1−s)p₁)/s`, sur une plage d''hypothèses toutes plausibles, l''écart
    va de **+11 pp à −5 pp** — et ce calcul reste généreux, puisqu''il laisse le 47 % intact. Le +16 pp
    est un majorant, pas une estimation. Signal corroborant déjà au dossier : une rétention 90 j stable
    est incohérente avec un gain réel de 16 points d''activation.


    ## Sur la diapositive


    **Version A** (si la ré-analyse est bouclée lundi) : estimation corrigée sur population appariée,
    fenêtre ancrée sur l''exposition dans les deux bras, IC 95 %, et la note de méthode *sur la diapositive*.
    La restriction est légitime : en session 1 les futurs v2 voient l''expérience témoin, donc « atteindre
    la session 2 » est une variable pré-exposition.


    **Version B** (sinon) : aucun chiffre d''activation — pas de fourchette, pas d''astérisque. Le retrait,
    la ré-analyse datée, et ce qui n''est pas affecté (Zendesk, rétention).


    ## Sur la CFO


    Elle a raison sur le fait, et c''est l''argument pour corriger maintenant. Si le term sheet référence
    la courbe, le chiffre est matériel et sera couvert par les reps des documents définitifs. **Une correction
    avant signature est un événement de due diligence ; une découverte après est une fausse déclaration.**
    Et un taux d''inversion de 42,6 % ressort au premier contrôle de cohérence si leur équipe demande
    les journaux.


    ## Le meilleur usage des jours restants


    Joindre les tickets Zendesk aux `user_id` et ventiler par bras sur la population restreinte : ~1 jour,
    et ça donne une vraie comparaison randomisée sur une métrique non contaminée. Arriver mardi en ayant
    *remplacé* une preuve cassée vaut mieux qu''en avoir seulement retiré une.


    Un point à traiter en priorité : 11 300 vs 10 940 alors que v2 exige la survie à la session 1 implique
    une allocation déséquilibrée (~63/37 si `s ≈ 60 %`). Si la config du 2 mars dit 50/50, il y a un troisième
    problème à trouver avant mardi.


    La décision revient au CEO avec la CFO et le conseil — pas au VP Produit seul, et pas à toi. Demande
    qu''elle soit consignée par écrit avec cette note au dossier.

    '
