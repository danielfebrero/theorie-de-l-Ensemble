response:
  text: '## Position de la présidence — bassin de la Vèze, séance du jeudi


    **En une phrase :** je ne répartis pas 410 L/s entre trois demandes, parce que le chiffre 410 n''est
    pas fiable, que la demande de 150 L/s de la régie n''a jamais été instruite, et que le déficit de
    160 L/s se traite d''abord par la métrologie et les fuites avant de se traiter par le sacrifice.


    ---


    ### 1. Constats, avant interprétation


    **L1 — la mesure.** Tout le dossier repose sur une station unique, étalonnée pour la dernière fois
    en 2023. Une dérive de 10 % — banale sur une station non ré-étalonnée après deux étiages — déplace
    le débit réel entre 369 et 451 L/s. Nous délibérons sur un nombre dont nous ignorons la barre d''erreur,
    et la marge du plan que je propose est exactement zéro.


    **L2 — le terme oublié.** Le 410 est mesuré **à l''entrée** du barrage. Ce que l''arrêté contraint,
    c''est ce qui **sort à l''aval**. Entre les deux : l''évaporation du plan d''eau et les pertes de
    la retenue, que personne n''a chiffrées. Si la retenue développe 20 ha en canicule, ce sont de l''ordre
    de 15 L/s — près de 20 % de la part maraîchère — qui disparaissent hors de tout tableau. Il n''existe
    aucune station de contrôle à l''aval : nous ne savons pas si le débit réservé est respecté aujourd''hui.


    **L3 — l''arithmétique que personne n''a faite.** 150 L/s pour 9 200 habitants = **1 409 L/habitant/jour**.
    L''ordre de grandeur d''une régie rurale, pertes de réseau comprises, se situe entre 200 et 300. La
    régie prélève donc environ cinq fois ce que sa population consomme. Cet écart est soit du rendement
    de réseau, soit des usages non domestiques, soit les deux — mais ce n''est pas de l''eau potable bue.
    C''est le plus gros gisement du bassin, et il n''a pas été ouvert parce que la régie refuse d''ouvrir
    la discussion.


    **L3bis — la marche d''escalier.** 240 L/s sur 620 ha = 3,3 mm/jour, soit une dose pleine cohérente.
    Mais « en dessous de 240, perte de la récolte » est une affirmation de négociation, pas d''agronomie
    : la réponse d''une culture à l''eau est continue, pas binaire. Ce qui produit la perte totale, ce
    n''est pas 80 L/s — c''est **80 L/s répartis uniformément** sur 620 ha (1,1 mm/j : tout le monde perd
    tout). Les mêmes 80 L/s concentrés en tour d''eau à dose déficitaire couvrent environ 320 ha. La différence
    entre 0 % et ~40 % de récolte ne tient pas à la ressource, elle tient à l''organisation.


    **L4 — les ensembles absents.** Trois parties sont à la table. Les porteurs des pertes irréversibles
    n''y sont pas : les 110 résidents de l''EHPAD (que la régie représente mal — la régie défend un prélèvement,
    pas une vulnérabilité), les 90 saisonniers (dont l''intérêt diverge de celui des 34 exploitants :
    une exploitation peut survivre en coupant la main-d''œuvre), et l''aval, qui a un rapport et pas de
    voix.


    **L6 — le classement qui compte.** Le critère n''est pas la gravité, c''est la réversibilité. Frayères
    : non reconstituable à dix ans. Rupture d''eau potable sur un EHPAD : irréversible par définition.
    Perte de récolte : douloureuse mais rejouable l''an prochain — **sauf** si elle emporte l''exploitation.
    La ruine agricole n''est pas la mauvaise récolte, c''est la cessation définitive. C''est cette cible-là,
    et pas la récolte, que le fonds doit protéger.


    ---


    ### 2. Ce que je verrouille


    - **180 L/s à l''aval, non négociable**, et désormais **mesurés**. C''est un arrêté préfectoral :
    la commission n''a pas le pouvoir de l''abaisser, et la perte documentée est la seule du dossier qu''aucun
    fonds ne rachète.

    - **Le noyau vital de l''eau potable, non négociable** — mais le noyau vital, ce n''est pas 150 L/s,
    c''est ce que la régie doit maintenant démontrer.


    ### 3. Répartition, sur trois semaines fermes (pas huit)


    L''horizon météo est de trois semaines ; je refuse de décider pour huit ce que je ne vois qu''à trois.


    | | J0 → J+21 | À partir de J+21, si la régie livre |

    |---|---|---|

    | Débit réservé aval | 180 L/s | 180 L/s |

    | Régie de Ferney | **150 L/s garantis, sans condition** | ~120 L/s |

    | Maraîchage | 80 L/s | ~110 L/s |


    La régie obtient immédiatement et intégralement ce qu''elle exige — cela ne me coûte rien, puisque
    je la lui accordais de toute façon, et cela lève son préalable à la discussion. En contrepartie elle
    produit sous 10 jours : rendement de réseau sectorisé, ventilation des 150 L/s par usage, état de
    l''interconnexion de secours, et un plan de descente à 120 L/s (réparations + arrêté municipal sur
    les usages non vitaux : arrosage d''espaces verts, lavage de voirie, remplissage de piscines, arrosage
    individuel).


    ### 4. Les 600 000 € : acheter des L/s, pas consoler


    | Poste | Montant | Ce que ça produit |

    |---|---|---|

    | Métrologie d''urgence | 60 k€ | Jaugeage et ré-étalonnage de Sarcelle, station de contrôle à l''aval,
    compteurs sur les 34 prises et sur les prélèvements de la régie |

    | Recherche et réparation de fuites, réseau de Ferney | **240 k€** | Le seul poste qui **crée** du
    débit au lieu de le déplacer |

    | Fonds de non-cessation maraîchère | 260 k€ | Indemnise la mise au repos contractualisée de surfaces
    déclarées, ciblée sur les exploitations en risque de défaillance définitive |

    | Police de l''eau du bassin + expertise agronomique du tour d''eau | 40 k€ | Sans contrôle, la grille
    est une fiction |


    **C''est ici que se joue la recomposition.** Ces 240 k€, les maraîchers les revendiqueront comme indemnisation
    : cela ferait 387 €/ha, sans un litre de plus. Investis dans le réseau de la régie, ils rendent vraisemblablement
    15 à 20 L/s — de l''eau achetée autour de 13 000 €/(L/s), sur un ouvrage durable. Je propose donc
    que **la convention affecte à l''irrigation, pour la durée de la crise, chaque litre récupéré sur
    les fuites**. Les maraîchers financent le réseau de la régie et en encaissent le rendement ; la régie
    sort de l''été avec un réseau réparé. Le clivage « les paysans ou les robinets » que titre la presse
    masque exactement cette alliance-là.


    ### 5. Le tour d''eau


    La commission fixe un volume, pas des noms. Les 34 exploitations constituent sous 10 jours un organisme
    unique de gestion qui répartit la dotation par tour d''eau, priorisé par stade critique et par valeur.
    À défaut, la commission répartit au prorata des surfaces — c''est-à-dire de la façon dont chacun sait
    qu''elle détruit tout. La répartition uniforme n''est pas neutre : c''est la seule qui garantit la
    perte annoncée.


    Ordres de grandeur, à confirmer par l''expertise financée ci-dessus : à 110 L/s en dose déficitaire,
    on couvre ~440 ha à rendement dégradé, soit peut-être 55 % de la production — environ 2,3 M€ sauvés
    sur 4,1. Le chiffre est fragile ; la direction ne l''est pas.


    ---


    ### 6. Ce que je dis à chacun, en séance


    **À la régie :** vous avez vos 150 L/s, tout de suite. Vous n''avez pas de discussion sur ce point.
    Vous en avez une sur ce que vous en faites : 1 409 L/habitant/jour est un chiffre que je poserai sur
    la table, et vos 4 jours de réserve tampon face à un EHPAD de 110 lits sont la vraie fragilité de
    ce bassin — pas votre dotation.


    **Aux maraîchers :** je ne peux pas vous rendre entiers. 600 000 € ne compensent pas 4,1 M€ et je
    ne prétendrai pas le contraire. Ce que je garantis : aucune exploitation ne sortira du métier à cause
    de cet été si le fonds peut l''éviter, le sacrifice des autres sera mesuré et publié, et l''essentiel
    de ce que vous pouvez encore sauver dépend du tour d''eau que vous seuls pouvez organiser. Vous avez
    quitté la salle parce que vous vous croyiez seule variable d''ajustement ; les compteurs sur la régie
    et la station à l''aval sont là pour que ce ne soit plus vérifiable sur parole.


    **Au préfet, dans le même document :** je demande une expertise contradictoire sur le seuil de 180
    L/s, avec délai de réponse fixé. Si les hydrobiologistes établissent que 165 L/s sur trois semaines
    ne compromet pas les frayères, ce sont 15 L/s que je veux pour les maraîchers. Je n''agirai pas avant
    la réponse ; je refuse de ne pas poser la question.


    ### 7. Le contre-argument le plus fort contre ma position


    *« Vous sanctuarisez 180 L/s pour des truites pendant que 90 emplois tombent. Vous refusez aux maraîchers
    la lecture en marche d''escalier — la récolte ne s''effondre pas d''un coup à 239 L/s — et vous l''accordez
    au milieu, où rien ne prouve non plus que la fonction bascule exactement à 180. »*


    Il est juste sur la forme et je le concède : la biologie n''a pas plus de seuil net que l''agronomie.
    Il ne renverse pas la décision pour deux raisons. La première est asymétrique, pas symétrique : si
    je me trompe sur les maraîchers, l''erreur coûte de l''argent et une saison, et le fonds existe précisément
    pour l''empêcher de devenir définitive ; si je me trompe sur 165 L/s, l''erreur coûte une décennie
    et aucun fonds ne la rachète. À ignorance égale, on ne place pas l''erreur du côté qu''on ne peut
    pas défaire. La seconde est prosaïque : le 180 est un arrêté. Le contester prend des semaines de procédure
    et ne délivre rien avant la fermeture de la fenêtre culturale. D''où l''expertise demandée avec délai
    — le seul chemin qui puisse rendre ces 15 L/s à temps.


    ### 8. Ce qui me ferait changer d''avis


    - Le jaugeage donne un débit réel s''écartant de plus de 8 % de 410 → toute la grille est recalculée
    avant application.

    - La régie démontre un rendement de réseau supérieur à 85 % et un usage vital réel proche de 150 L/s
    → les 30 L/s que j''escompte n''existent pas, et je retourne devant le préfet demander soit une dérogation,
    soit un abondement du fonds.

    - L''expertise agronomique établit qu''en dessous de 110 L/s le tour d''eau ne sauve rien → alors
    concentrer sur une surface réduite avec indemnisation pleine du reste devient la seule forme rationnelle,
    et la ventilation du fonds change.


    ### 9. Déclencheurs et repli — écrits dans la délibération


    - Débit entrant < 380 L/s trois jours consécutifs → irrigation à 50 L/s, commission réunie sous 48
    h.

    - Débit entrant < 350 L/s → irrigation suspendue, usages non vitaux de la régie restreints par arrêté.

    - Réserve tampon de Ferney < 3 jours → priorité absolue à l''eau potable, irrigation arrêtée, sans
    vote.

    - Mesure aval < 175 L/s deux relevés consécutifs → réduction immédiate au prorata de tous les prélèvements
    et information du préfet ; si le débit réservé n''est pas rétabli sous 72 h, arrêt total des prélèvements
    d''irrigation.

    - Compteur en dépassement de créneau → créneau transféré au collectif ; récidive → retrait pour la
    saison.


    ### 10. Première action


    Vendredi matin, avant tout arbitrage : bon de commande du jaugeage et de l''implantation de la station
    aval sur le fonds départemental. Nous devons cesser de répartir un nombre que nous n''avons pas vérifié.


    ---


    *Régime mixte, traité en profondeur critique : branche de perte irrécupérable identifiée sur deux
    ensembles (aval, EHPAD), irréversibilité et arrêté opposable sur l''un d''eux. Le veto porte sur les
    180 L/s et le noyau vital ; l''arbitrage porte sur le reste. Le pire cas de l''option retenue est
    encaissé par les maraîchers, à hauteur d''environ 1,8 M€ après tour d''eau et fonds — c''est le seul
    poste dont je peux dire qu''il sera encore là l''an prochain.*

    '
