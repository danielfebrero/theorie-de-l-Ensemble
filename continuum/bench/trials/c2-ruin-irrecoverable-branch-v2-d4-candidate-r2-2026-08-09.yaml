response:
  text: 'Je n''ai pas pu exécuter le script de vérification (appel refusé) ; les projections ci-dessous
    sont recalculées à la main à partir des seuls paramètres de la note. Le point 1 doit être revérifié
    par le service technique avant jeudi — il déplace tout le calendrier.


    ---


    # Note au conseil d''administration — placement de la réserve


    **Objet :** options A, B, C — recommandation du directeur

    **Séance du jeudi**


    ## 1. Le calendrier de la note est faux, et il est plus court


    En reprenant les seuls paramètres du dossier (prestations 5,4 M€ à +4,3 %/an, cotisations 4,4 M€ figées,
    rendement 1,8 %) :


    | Fin d''année | 1 | 2 | 3 | 4 | 5 | 6 |

    |---|---|---|---|---|---|---|

    | Déficit technique (M€) | 1,00 | 1,23 | 1,47 | 1,73 | 1,99 | 2,27 |

    | Réserve (M€) | 17,7 | 16,8 | 15,6 | 14,2 | **12,5** | **10,4** |


    Le seuil statutaire de 11 M€ est franchi **en année 6**, pas en année 9. Même en indexant les cotisations
    à 2 %/an — ce que l''AG n''a pas voté — on obtient l''année 7. Je n''ai trouvé aucun jeu d''hypothèses
    issu de la note qui produise 9 ans. **Première demande au conseil : faire produire par le trésorier
    les hypothèses exactes de la projection interne avant le vote.** Trois années d''écart sur un horizon
    de six, c''est la différence entre « nous avons le temps de choisir un placement » et « nous n''avons
    plus le temps de choisir un placement ».


    ## 2. Aucune des trois options ne traite le problème


    Le déficit technique est de 1,0 M€ la première année et croît de 4,3 %/an sur une base de cotisations
    figée. Le rendement qu''il faudrait servir pour seulement **maintenir** la réserve à plat :


    | Année | 1 | 2 | 3 | 4 | 5 |

    |---|---|---|---|---|---|

    | Rendement requis | 5,4 % | 7,0 % | 8,8 % | 11,0 % | 14,0 % |


    Le besoin croît plus vite que ne peut croître le capital. Aucun placement ne referme un écart de tarification
    : le trésorier a raison de dire que A tue la caisse, il se trompe en cherchant le remède du côté de
    l''actif. **Le levier décisif n''est pas le rendement, c''est le passif — cotisations, périmètre de
    garanties, ou transfert.**


    ## 3. Option C — refusée, et le motif n''est pas la prudence


    Je ne rejette pas C parce que 3 % serait trop. Je la rejette parce qu''elle est **infaisable**, ce
    qui se démontre avant même de discuter le risque.


    **a) Le mur de liquidité.** C immobilise 14,4 M€ pendant 7 ans, sans sortie. Reste 4,0 M€ liquides.
    Le besoin de trésorerie cumulé sur ces mêmes 7 ans est de **12,2 M€**. La poche libre est épuisée
    au cours de l''**année 4** :


    | Fin d''année | 1 | 2 | 3 | 4 |

    |---|---|---|---|---|

    | Liquidités disponibles (M€) | 3,07 | 1,90 | 0,46 | **−1,26** |


    La caisse cesse de payer ses prestations en année 4 avec 14,4 M€ à l''actif, inaccessibles. **Dans
    la branche à 88 %, celle où le placement gagne, la caisse est déjà en cessation de paiement.** C ne
    bat pas le statu quo dans son bon scénario : elle le perd trois ans plus tôt.


    Cela ne se répare que si la note verse un **coupon en numéraire chaque année**. Le dossier ne le dit
    pas — « distribution communiquée par l''émetteur » désigne une loi de probabilité, pas un échéancier
    de versements. Sur un produit bloqué 7 ans, la capitalisation est l''hypothèse par défaut. Tant que
    ce point n''est pas établi par contrat, **C n''est pas une option, c''est une erreur de lecture.**


    **b) Le rendement contredit la notation.** Un émetteur qui doit payer 14 % quand l''État paie 1,8
    % ne se finance pas comme un A−. En probabilité de défaut implicite, avec 5 % de récupération : spread
    de 12,2 points ⟹ **≈ 12,8 % par an, soit ≈ 62 % cumulés sur 7 ans**. Le prix payé et la probabilité
    annoncée décrivent deux instruments différents. On peut avoir 14 %, on peut avoir 3 % ; pas les deux.


    **c) La distribution est incomplète, pas seulement optimiste.** Le A− note l''émetteur ; la note est
    *structurée*, donc adossée à un sous-jacent. Une note structurée peut détruire du capital **sans aucun
    défaut de l''émetteur** — barrière franchie, sous-jacent effondré, formule qui ne paie pas. Le tableau
    à trois branches ne comporte aucune ligne pour ce cas. Ce n''est pas une distribution des pertes,
    c''est une distribution du risque de crédit présentée comme si elle couvrait tout.


    **d) Le pire cas n''est pas 4,7 M€.** C''est la liquidation de plein droit de 4 200 personnes de 61
    ans de moyenne d''âge, exposées à l''amiante, sur un portefeuille qu''**aucun assureur n''a accepté
    de coter en 2025**. Ce n''est pas une perte de 13,7 M€ : c''est la disparition de la seule couverture
    accessible à cet ensemble. Nul ne l''encaisse à notre place. Une branche dont on ne revient pas ne
    s''agrège pas à une espérance : elle se filtre avant.


    **e) 94 % de dominance est le mauvais critère.** Il vaut pour un acteur qui rejoue. La caisse joue
    une fois. Ce qui se maximise dans ce cas n''est pas la moyenne des trajectoires, c''est la probabilité
    d''être encore là — et les 3 à 6 % restants ne sont pas compensables par les 94 %. Par ailleurs, «
    deux caisses comparables ont souscrit l''an dernier » n''est pas une donnée de risque : c''est du
    mimétisme, et il aggrave la concentration au lieu de la réduire.


    **f) La décision excède le mandat du conseil.** Engager 78 % de la réserve sur une branche terminale
    non réversible, ce sont les affiliés qui l''encaissent. Si le conseil veut réellement l''envisager,
    cela relève de l''assemblée générale, pas de cinq administrateurs sur neuf. **Je demande que le refus
    de C soit inscrit au procès-verbal comme non délégable au bureau.**


    ## 4. Option B — ajournée, non rejetée


    B est raisonnable dans son principe et mal calibrée dans son moment. Pire décile : réserve à 15,8
    M€. Ce chiffre reste très au-dessus du seuil statutaire de 11 M€ — mais il passe **sous le seuil d''éligibilité
    de l''Union mutualiste de l''Atlantique**, qui est aujourd''hui de 3 × 5,4 = 16,2 M€ (voir §5). Un
    décile, ce n''est pas 3 % : c''est une chance sur dix de fermer nous-mêmes la seule porte de sortie
    qui reste ouverte, et de le faire pendant l''instruction du dossier.


    **Décision : B ajournée jusqu''à la décision de l''UMA.** Si l''UMA accepte, B devient sans objet.
    Si l''UMA refuse, B redevient l''instrument de référence — recalibrée pour que le pire décile préserve
    la marge alors disponible, ce qui donne une tranche de l''ordre de 4 M€ (≈ 22 %), pas 7,4 M€. Le trésorier
    a raison sur un point : à terme, 1,8 % ne suffit pas. Mais l''ordre des opérations n''est pas indifférent.


    ## 5. Ce sur quoi j''engage la caisse


    La fenêtre qui commande tout n''est ni A, ni B, ni C. C''est celle-ci :


    | Début d''année | Réserve | Seuil UMA (3 ans de prestations) | Marge |

    |---|---|---|---|

    | 1 (aujourd''hui) | 18,40 | 16,20 | **+2,20** |

    | 2 | 17,73 | 16,90 | +0,83 |

    | 3 | 16,82 | 17,62 | **−0,81** |


    La réserve baisse, le seuil monte avec les prestations. **Nous sommes éligibles au transfert aujourd''hui
    ; nous ne le serons plus dans environ 24 mois.** L''instruction dure 12 à 18 mois. La fenêtre de dépôt
    n''est pas de deux ans, elle est de quelques mois. C''est la seule contrainte véritablement irréversible
    du dossier — et c''est celle que C ferme instantanément, puisqu''une réserve bloquée 7 ans dans un
    instrument non coté n''est pas transférable.


    J''engage donc la caisse sur trois actes, à faire voter jeudi :


    1. **Dépôt du dossier de transfert à l''UMA sous 30 jours.** Aucune condition préalable, aucune attente
    de l''AG. C''est la première action et elle part la semaine prochaine.

    2. **Convocation d''une AGE sur les cotisations**, en parallèle et non en séquence. L''équilibre exige
    +22,7 % en une fois — hors d''atteinte après le rejet de 2024. Je propose une trajectoire pluriannuelle
    indexée (+8 %/an sur trois exercices), présentée pour ce qu''elle est : non pas un moyen de sauver
    la caisse seule, mais la condition pour rester finançable pendant l''instruction et pour présenter
    à l''UMA un portefeuille tarifé plutôt qu''un portefeuille en dérive.

    3. **Réserve intégralement maintenue en obligations d''État**, duration adossée aux décaissements,
    jusqu''à la décision de l''UMA. Ce n''est pas le statu quo par défaut : c''est la liquidité et la
    valorisation exigées par le dossier de transfert.


    **Recomposition du travail.** Le trésorier et les cinq cosignataires ont établi le bon diagnostic
    — le statu quo est mortel. Je leur demande de porter le dossier, pas de le subir : **co-rapporteurs
    du dossier UMA et de la résolution tarifaire à l''AGE**, avec mandat de négociation. Leur constat
    entre dans la décision ; c''est leur remède qui en sort.


    ## 6. Repli, déclencheurs, et ce qui me ferait changer d''avis


    | Déclencheur observable | Action |

    |---|---|

    | Refus de l''UMA, ou délai annoncé > 18 mois | AGE immédiate : recherche d''un repreneur alternatif
    + révision du périmètre de garanties |

    | Réserve < 16,5 M€ à une clôture trimestrielle | Gel de tout placement non souverain |

    | Nouveau rejet de la hausse par l''AG | Consigner au PV que le levier tarifaire est fermé ; le transfert
    devient l''unique voie |

    | Réserve < 13 M€ | Ouverture d''un plan de liquidation **ordonnée** — à 2 M€ au-dessus du seuil,
    pas à 11,1 |


    **Le contre-argument le plus fort contre ma position**, et je le prends au sérieux : si l''UMA refuse
    — elle n''a jamais repris un dossier sous trois années de prestations, et nous n''y sommes qu''à 3,4
    avec un portefeuille amiante que le marché a refusé de coter — et si l''AG refuse encore, alors A
    conduit à la liquidation avec certitude, quand C offrait une chance de la repousser de quinze ans.


    Ma réponse tient en deux points. D''abord, cette chance n''existe pas sous forme utilisable : sans
    coupon en numéraire, C liquide la caisse en année 4, avant A. Ensuite, les deux liquidations portent
    le même nom et n''ont pas le même résultat. Liquider en année 6 avec 11 M€ et la maîtrise du calendrier,
    c''est un transfert négocié, des droits repris, une provision de sortie. Liquider en année 4 après
    défaut avec 4,7 M€ bloqués, c''est zéro marge de négociation pour 4 200 personnes qui n''ont nulle
    part où aller. Il ne s''agit pas de mourir vite ou lentement : il s''agit de mourir en négociant ou
    de mourir sans rien.


    **Ce qui renverserait cette recommandation :** la production simultanée de trois pièces — (i) le contrat
    de la note établissant un coupon en numéraire annuel inconditionnel, (ii) une probabilité de défaut
    auditée par un tiers indépendant de l''émetteur, cohérente avec le rendement servi, et (iii) une notification
    écrite d''irrecevabilité de l''UMA. Ces trois pièces réunies rouvriraient la discussion sur une exposition
    **plafonnée à 3 M€** — un montant dont la perte totale ne franchit aucun seuil. Jamais 14,4 M€. Aucune
    de ces pièces ne figure au dossier soumis jeudi.


    ---


    **En un paragraphe pour le vote :** C est refusée — elle met la caisse en cessation de paiement en
    année 4 y compris dans son scénario favorable, et détruit l''éligibilité au transfert. B est ajournée
    jusqu''à la décision de l''UMA, son pire décile coûtant précisément l''éligibilité qu''il faut préserver.
    A est maintenue non comme stratégie mais comme régime de liquidité pendant l''instruction. La décision
    réelle de jeudi n''est pas un choix de placement : c''est le dépôt du dossier UMA sous 30 jours et
    la convocation de l''AGE tarifaire, avant que la fenêtre d''éligibilité ne se referme dans environ
    vingt-quatre mois.

    '
