response:
  text: '# Note au conseil — séance de jeudi

    **Objet : allocation de la réserve. Recommandation du directeur.**


    ## Recommandation en une phrase


    J''oppose un veto à l''option C, je propose l''adoption de l''option B dans un cadre borné, je maintiens
    l''option A comme socle de trésorerie et non comme stratégie — et je demande au conseil d''admettre
    que le vrai sujet de jeudi n''est pas l''allocation d''actif.


    ---


    ## 1. Ce que dit la projection à neuf ans


    La note du trésorier oppose une mort lente à une chance de survie. Elle a raison sur un point : A
    seule est une mort lente. Mais il faut nommer ce qui tue.


    En reconstituant la trajectoire (18,4 M€ → 11 M€ en neuf ans à +1,8 %/an, avec dépenses à +4,3 %/an),
    le déficit d''exploitation net ressort à **environ 0,95 M€ la première année, en croissance de 4,3
    %/an**. C''est cela qui vide la caisse — pas le rendement. *Cette reconstitution est une inférence
    : je demande au trésorier l''échéancier de trésorerie audité sur dix ans avant jeudi. Le reste de
    cette note en dépend, et je l''indique là où c''est le cas.*


    Conséquence : aucun des trois placements ne résout le problème. A rapporte 1,8 %, B rapporte 6,1 %,
    le déficit croît à 4,3 % sur une base qui se réduit. Le trésorier l''écrit lui-même pour B. Il ne
    l''écrit pas pour C.


    ## 2. Option C — veto


    Ce n''est pas un avis défavorable à pondérer avec d''autres. C''est un veto : si le conseil l''adopte,
    je ne l''exécute pas.


    **a) La question à poser au trésorier avant toute chose : les 14 % sont-ils versés en numéraire chaque
    année, ou capitalisés jusqu''au terme ?** Le dossier dit « bloquée 7 ans, sans sortie anticipée »
    sans le préciser. Les deux réponses tuent C, mais pas pour la même raison.


    **Si les coupons sont capitalisés :** souscrire 14,4 M€ laisse 4,0 M€ liquides. Le déficit cumulé
    sur quatre ans est d''environ 4,05 M€. **La caisse est à court de trésorerie en année 4 d''un blocage
    de 7 ans**, sans sortie, sans réassureur, sans garantie publique. Ce n''est pas un risque à 3 %. C''est
    une défaillance quasi certaine, y compris dans les 88 % de scénarios que l''émetteur qualifie de favorables.
    La caisse ferait faillite en ayant raison sur le placement.


    **Si un coupon de 14 % est réellement versé (2,0 M€/an) :** l''objection de liquidité tombe, et le
    veto tient sur les motifs suivants.


    **b) Les 3 % ne sont pas du bruit — c''est un état absorbant.** Une espérance mathématique ne se calcule
    pas à travers un seuil qui supprime l''entité qui la calcule. La branche défaut ramène la réserve
    à 4,7 M€, soit 6,3 M€ sous le plancher statutaire : liquidation de plein droit, immédiate, sans recours.
    Il n''y a pas de tirage suivant. Le trésorier rapporte que C domine B dans 94 % des trajectoires ;
    ses 10 000 simulations contiennent donc environ **300 caisses liquidées**, et il en publie la médiane.


    **c) La distribution vient du vendeur.** 88 / 9 / 3 ne comporte aucun scénario intermédiaire — pas
    de dégradation, pas de restructuration, pas d''extension de maturité, pas de recouvrement partiel
    entre 5 % et 100 %. Un risque de crédit réel est un continuum. Une distribution sans milieu n''est
    pas un modèle, c''est un argumentaire. Simuler 10 000 tirages depuis cette distribution ne la teste
    pas : cela la reformule.


    **d) Le taux trahit le rang.** Un instrument qui paie 14 %/an quand le sans-risque est à 1,8 % n''est
    pas du risque A−, quel que soit l''émetteur. Le recouvrement modélisé à 5 % le confirme : la dette
    senior non garantie se recouvre historiquement autour de 40 %. À 5 %, ce titre est subordonné ou son
    rendement est logé dans un dérivé qui s''annule. **La note A− porte sur l''émetteur, pas sur ce titre.**
    À demander par écrit : rang exact dans la structure de capital, et justification du taux de recouvrement.


    **e) Pas de sortie signifie pas de pilotage.** Même en voyant la signature se dégrader — élargissement
    des spreads, dégradation de notation, presse — la caisse ne peut rien faire pendant sept ans. Sur
    78 % de sa réserve.


    **f) Deux caisses comparables ont souscrit il y a un an.** Aucune n''a pu sortir, aucune n''est arrivée
    à échéance. Douze mois sur sept ans ne valident rien ; l''adoption corrélée par des pairs exposés
    au même argumentaire n''est pas une preuve, c''est le mécanisme même du risque de concentration sectoriel.


    **g) Conformité et responsabilité.** Une exposition de 78 % à un émetteur unique sur un titre non
    coté relève très probablement du non-admissible au regard des règles de dispersion et du principe
    de la personne prudente. Je demande la position écrite du commissaire aux comptes et de l''ACPR avant
    tout vote — pas après. Les administrateurs signataires doivent savoir qu''ils engagent leur responsabilité
    personnelle pour faute de gestion.


    **h) Le motif décisif.** L''appel d''offres 2025 a établi qu''aucun assureur ne reprend ce portefeuille.
    Les 4 200 affiliés n''ont donc **aucune couverture alternative**. La disparition de la caisse n''est
    pas un mauvais résultat parmi d''autres : c''est la fin de leur couverture santé, à 61 ans de moyenne
    d''âge, avec une exposition amiante dont le pic de sinistralité est devant eux. Un conseil d''administration
    n''a pas qualité pour miser 3 % de cela.


    ## 3. Option B — adoptée, bornée


    B passe le test que C échoue : **son pire cas est survivable et observable quotidiennement.**


    - Pire décile : réserve à 15,8 M€, soit 4,8 M€ au-dessus du plancher.

    - Stress à −50 % sur la tranche : réserve à 14,7 M€. Toujours au-dessus.

    - Pour franchir 11 M€, il faudrait −100 % sur un portefeuille coté diversifié.


    Surtout, la poche de 7,4 M€ **n''a jamais à être vendue pour payer des prestations** : les 11 M€ du
    socle obligataire couvrent à eux seuls environ neuf ans de déficit net. B n''est donc pas une prise
    de risque sur la trésorerie, c''est un placement de surplus adossé à l''horizon.


    Ce que B apporte, exactement : rendement mixte à ~3,5 %/an, échéance du plancher repoussée de **neuf
    à environ onze ans et demi**. Deux ans et demi de sursis. C''est ce que ça vaut, et c''est utile —
    à condition de savoir à quoi on emploie ces deux ans et demi.


    **Règle d''encadrement proposée au vote :** la poche risquée est dimensionnée de sorte que la réserve,
    après un stress de −50 % appliqué à cette poche, reste ≥ 14 M€. 7,4 M€ satisfait cette règle aujourd''hui
    ; le plafond se recalcule à chaque clôture trimestrielle et la poche est écrêtée automatiquement.


    ## 4. Option A — socle, pas stratégie


    Conservée pour les 11 M€ restants, en souverain et *investment grade* de duration courte adossée à
    l''échéancier des prestations. A n''est pas l''immobilisme : c''est le financement des neuf prochaines
    années de sinistres. Elle cesse d''être une stratégie le jour où on prétend qu''elle suffit.


    ## 5. Le vrai plan — au passif


    Aucune allocation ne comble un déficit d''exploitation. Je demande l''inscription à l''ordre du jour
    de jeudi, comme point distinct et non comme variable d''ajustement :


    1. **Recours amiante et subrogation.** Pour un portefeuille à forte exposition amiante, la voie FIVA
    et l''action en faute inexcusable de l''employeur peuvent déplacer une part significative de la charge
    hors de la caisse. C''est probablement le levier le plus important et le moins exploité. À chiffrer
    par un conseil spécialisé sous soixante jours.

    2. **Réassurance partielle.** L''appel d''offres 2025 portait sur la reprise du portefeuille entier.
    Une couverture en excédent de sinistre sur la seule tranche haute est un produit différent, à retester.

    3. **Cotisations et garanties.** L''écart est d''environ 2,5 % de la réserve par an. Traité tôt et
    progressivement, c''est un ajustement ; traité à 12 M€, c''est un choc.

    4. **Atterrissage négocié.** Le seuil de 11 M€ déclenche une liquidation *subie*. À 12,5 M€, une négociation
    de transfert ou de *run-off* ordonné est encore une décision *prise*. La différence, pour les affiliés,
    est considérable.


    ## 6. Le meilleur argument contre moi


    Le voici, honnêtement : *dans 97 % des cas, C fait passer 14,4 M€ à 36 M€ en sept ans, ce qui sauve
    réellement la caisse ; en refusant, tu garantis le déclin.*


    Il ne tient pas, pour deux raisons. D''abord, 36 M€ ne rendent pas la caisse pérenne — face à un déficit
    qui compose à 4,3 % et à un pic amiante encore devant, cela achète quinze à vingt ans, pas la permanence.
    Ensuite et surtout, ce gain s''obtient en rendant les sept prochaines années non rattrapables en cas
    d''erreur, pour une population qui n''a nulle part où aller.


    **Ce qui me ferait changer d''avis :** si l''échéancier de trésorerie audité montre un flux d''exploitation
    net proche de zéro ou positif, mon argument de liquidité en année 4 est faux et je le retire publiquement.
    Le veto tiendrait alors sur les seuls motifs (b) à (h) — et je le dirais ainsi.


    ## 7. Déclencheurs observables


    | Seuil constaté en clôture trimestrielle | Action, automatique |

    |---|---|

    | Réserve < 16 M€ | Poche B réduite de moitié ; conseil extraordinaire sous 15 jours |

    | Réserve < 14 M€ | Désensibilisation totale ; plan passif rendu obligatoire |

    | Réserve < 12,5 M€ | Ouverture d''une négociation de transfert ou de *run-off* ordonné |

    | Poche B en repli > 25 % au plus haut | Aucune vente ; gel des versements ; revue de mandat |

    | Déficit net annuel > projection + 20 % | Re-calibrage complet du plan |


    ## 8. Ce sur quoi j''engage la caisse


    J''engage la caisse sur B encadrée, sur A comme socle adossé, sur les quatre chantiers du passif avec
    des jalons datés, et sur ces cinq déclencheurs.


    Je ne l''engage pas sur C. Si le conseil vote C, je fais consigner mon opposition au procès-verbal,
    je saisis le commissaire aux comptes et l''ACPR d''une demande d''avis écrit préalable à toute souscription,
    et je ne signe pas. Je ne dis pas cela pour peser sur le vote : je le dis pour que les neuf administrateurs
    sachent, avant de lever la main, ce qu''ils signent et ce qu''ils engagent personnellement.


    ## 9. Première action


    Avant jeudi 18 h, je demande au trésorier trois documents : **(1)** l''échéancier de trésorerie audité
    sur dix ans ; **(2)** la confirmation écrite de l''émetteur sur le rang du titre dans la structure
    de capital et sur le versement — numéraire ou capitalisé — du coupon ; **(3)** la position du commissaire
    aux comptes sur l''admissibilité d''une concentration à 78 % sur un titre non coté.


    Si ces trois pièces ne sont pas au dossier, je demande le report du vote sur C. Pas son rejet : son
    report. Une option qui ne survit pas à trois questions de fait ne mérite ni d''être adoptée à cinq
    voix contre quatre, ni d''être rejetée à cinq voix contre quatre — elle mérite d''être close sur pièces,
    et de ne pas revenir l''année prochaine.


    ---


    *Je peux mettre cette note en page pour diffusion aux administrateurs si vous le souhaitez.*

    '
