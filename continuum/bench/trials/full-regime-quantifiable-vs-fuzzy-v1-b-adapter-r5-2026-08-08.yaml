response:
  text: '# Note au conseil — Affectation de l''enveloppe de 900 000 €


    **Objet :** Dossiers A (parc machines) et B (succession direction qualité)

    **Recommandation :** engager les deux, en totalité, sans arbitrage entre eux.


    ---


    ## 1. Les deux dossiers ne sont pas en concurrence — et c''est le point de départ


    L''ordre du jour les présente comme un arbitrage. Aux options que nous recommandons, ils totalisent
    **755 000 €** sur une enveloppe de 900 000 €. L''enveloppe n''est donc pas contraignante. La vraie
    question n''est pas « A ou B », mais : **ne pas laisser une coïncidence arithmétique dicter la décision.**


    Cette coïncidence mérite d''être nommée : renouvellement complet (620 000 €) + recrutement externe
    (280 000 €) = 900 000 € exactement. Le budget « tombe juste ». C''est la combinaison la plus coûteuse,
    et elle achète le moins de protection sur le seul risque que nous ne pourrions pas rattraper.


    Car les deux dossiers ne sont pas de même nature. Le dossier A est **réversible et mesuré** : cinq
    ans de données auditées, 47 événements, un fournisseur qui s''engage contractuellement avec pénalités,
    un achat divisible. Si nous nous trompons, nous le voyons et nous corrigeons. Le dossier B est **unique
    et irréversible** : aucun précédent interne, aucun comparable, un départ à date fixe, et un risque
    qui ne se chiffre pas en ligne de coût mais en 31 % du chiffre d''affaires et en continuité de certification.
    Il n''y a pas de deuxième essai.


    **Principe d''affectation retenu : l''enveloppe couvre d''abord ce qui ne se rattrape pas, ensuite
    ce qui rapporte.**


    ---


    ## 2. Dossier B — Décision : promotion **et** mission de transition. 135 000 €


    Les RH présentent trois pistes comme des alternatives. Ce n''en sont pas : elles ne couvrent pas les
    mêmes risques, et deux d''entre elles sont assez peu coûteuses pour être cumulées.


    - **Revalorisation de l''adjointe — 45 000 € sur deux ans, effective immédiatement.** Prendre effet
    maintenant, pas au départ : cela sécurise onze mois de transmission avec le titulaire encore en poste,
    et évite qu''elle parte elle-même une fois la succession connue.

    - **Mission de transition du directeur qualité — 90 000 € sur douze mois, contractualisée cette semaine.**
    C''est notre police d''assurance. Elle doit être signée maintenant : dans onze mois il sera retraité,
    sans obligation envers nous, et l''enveloppe n''existera plus.

    - **Recrutement externe — 280 000 € : écarté.** C''est l''option la plus chère et celle qui achète
    le moins de ce qui est réellement en jeu. Un recrutement extérieur arrive sans relation avec l''organisme
    notifié et sans crédibilité auprès des deux clients hospitaliers — c''est-à-dire sans les deux actifs
    que nous cherchons précisément à préserver.


    **135 000 € pour protéger 31 % du chiffre d''affaires et la continuité de notre certification.** Le
    rapport se passe de commentaire.


    ---


    ## 3. Dossier A — Décision : renouvellement complet, un seul lot. 620 000 €


    Soyons exacts sur la base chiffrée. Le parc actuel coûte environ **56 000 € par an** (43 000 € de
    coût direct d''immobilisation, 14 000 € de marge non produite sur 362 heures d''arrêt annuelles).
    Rapporté à 620 000 €, cela donne un retour de l''ordre de **onze ans — soit plus que les sept ans
    de garantie**. Sur ce seul critère, l''investissement ne se justifierait pas.


    Trois éléments le justifient malgré tout :


    1. **Le taux de rebut : 4,1 % contre 1,2 % garanti.** Nous ne pouvons pas le chiffrer faute de données
    de volume, mais sur du matériel de diagnostic médical un rebut à 4,1 % n''est pas seulement un coût
    — c''est un sujet qualité, donc un sujet de certification. Il rejoint le dossier B.

    2. **La garantie de 96 % de disponibilité avec pénalités transfère le risque au fournisseur.** Cette
    garantie perd sa valeur si nous ne remplaçons qu''une partie du parc : les machines conservées continueraient
    à porter les arrêts, sans couverture. C''est l''argument décisif contre un renouvellement par tranches.

    3. **Les 620 000 € non engagés seraient perdus.** Un retour à onze ans reste supérieur à zéro.


    Nous recommandons donc l''achat, en disant clairement au conseil qu''il est justifié par la non-reconductibilité
    de l''enveloppe et par la qualité produit, **non par le retour sur investissement**.


    ---


    ## 4. Répartition proposée


    | Poste | Montant |

    |---|---|

    | Dossier A — renouvellement complet, lot unique | 620 000 € |

    | Dossier B — revalorisation adjointe (2 ans) | 45 000 € |

    | Dossier B — mission de transition (12 mois) | 90 000 € |

    | Remplacement du poste laissé vacant par l''adjointe (CDD/intérim, 12 mois) | ~60 000 € |

    | Mandat de cabinet de recrutement, signé sous condition de déclenchement | ~40 000 € |

    | Requalification des 9 auditeurs internes et formalisation des dossiers non écrits | ~45 000 € |

    | **Total engagé** | **900 000 €** |


    Les trois derniers postes sont des ordres de grandeur à confirmer par la DRH avant clôture ; leur
    ventilation peut bouger, leur montant global non. Ils portent tous sur le dossier B : c''est là qu''est
    le risque non rattrapable.


    ---


    ## 5. L''objection la plus sérieuse


    Elle est réelle et le conseil doit l''entendre : *promouvoir une adjointe entrée il y a trois ans,
    c''est confier 31 % du chiffre d''affaires et le renouvellement de notre certification à quelqu''un
    qui n''a jamais tenu le poste — et la mission de transition prolonge d''un an notre dépendance à un
    seul homme au lieu de la supprimer.*


    Notre réponse tient en un point de contrôle daté. **À huit mois avant le départ, trois conditions
    doivent être vérifiées :** l''adjointe a piloté un cycle d''audit interne complet en titulaire ; elle
    est acceptée par écrit comme interlocutrice par l''organisme notifié ; elle a été présentée et reconnue
    par les deux clients hospitaliers. Si l''une des trois manque, nous activons le mandat de recrutement
    déjà signé, et la mission de transition — déjà contractualisée — sert de pont pendant la recherche.
    C''est précisément ce qu''elle achète : le droit d''essayer l''option interne sans risquer l''entreprise.


    ## 6. Trois actions à coût nul, qui conditionnent tout le reste


    - **Le directeur général parle au directeur qualité avant toute annonce.** S''il apprend la promotion
    de son adjointe sans avoir été associé, il peut refuser la mission de transition — et tout le dispositif
    tombe.

    - **Informer l''organisme notifié par écrit du plan de succession dès ce mois-ci**, et associer l''adjointe
    à chaque échange à partir de maintenant, pour qu''elle ait un historique avec eux le jour du départ.

    - **Visites conjointes chez les deux clients hospitaliers**, les deux ensemble, présentées comme une
    transition organisée et non comme un départ.


    ---


    ## Décisions demandées jeudi


    1. Engager 620 000 € sur le renouvellement complet du parc, en un lot.

    2. Engager 135 000 € sur le dispositif interne de succession qualité, et écarter le recrutement externe
    immédiat.

    3. Mandater la DRH pour engager le solde de 145 000 € avant clôture, selon la ventilation ci-dessus.

    4. Fixer le point de contrôle à huit mois et désigner son responsable devant le conseil.

    '
