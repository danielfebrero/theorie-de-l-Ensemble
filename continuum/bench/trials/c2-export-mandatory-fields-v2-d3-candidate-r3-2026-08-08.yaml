response:
  text: '# NOTE DE DIRECTION GÉNÉRALE


    **Objet :** Offre d''exclusivité D — décision et mandat exécutoire en mon absence

    **Destinataires :** Comité de direction (DAF, DC, DI, DRH, Directeur du site de Redon)

    **Date :** 8 août 2026

    **Portée :** Cette note vaut arbitrage. Elle s''applique du 9 août au 31 août inclus. Je serai injoignable.
    Aucune de ses limites ne peut être levée par consensus du comité.


    ---


    ## 1. La décision


    **Le contrat proposé par D n''est pas signable. Personne n''est autorisé à le signer, en l''état,
    à aucun moment de mon absence.**


    Ce n''est pas un refus de traiter avec D. C''est un refus de *ce texte-là*. Le comité reçoit ci-dessous
    un mandat de contre-proposition avec des bornes chiffrées, à exécuter avant le 20 août.


    Le critère qui l''emporte n''est pas commercial, il est arithmétique : **l''offre détruit de la marge
    dans son scénario nominal, c''est-à-dire même si D tient toutes ses promesses.**


    ---


    ## 2. Le calcul, pour qu''il ne soit plus discuté


    Sur la base 24 M€ / 31 % de marge brute, D représente 14,9 M€ de chiffre d''affaires et **4,62 M€
    de marge brute**.


    | Scénario | Marge brute sur D | Écart annuel |

    |---|---|---|

    | Aujourd''hui | 4,62 M€ | référence |

    | Contrat signé, **+18 % de volume tenu** | 3,87 M€ | **− 0,75 M€** |

    | Années 2-3, volume revenu au niveau actuel | 3,28 M€ | **− 1,34 M€** |

    | Années 2-3, volume à −11 % (le précédent du T2) | 2,92 M€ | **− 1,70 M€** |


    Une remise de 9 % sur le prix de cession n''est compensée par le volume qu''à partir de **+41 % de
    volume**. On nous en offre 18, et seulement la première année.


    La règle générale, que le comité utilisera en négociation : **remise maximale acceptable = 31 % ×
    v/(1+v)**, où v est l''engagement de volume *ferme*. Pour +18 % ferme, cela plafonne la remise à **4,7
    %**. Au-delà, nous payons pour travailler davantage.


    Sur trois ans, le contrat détruit **3,4 à 4,2 M€ de marge brute**, auxquels s''ajoutent **2,7 à 4
    M€ de marge renoncée** sur la centrale régionale et la marketplace, que l''exclusivité interdit. Notre
    trésorerie est de 2,1 M€.


    Deux conséquences que je veux voir écrites dans le compte rendu :


    - **Signer n''est pas une solution de trésorerie.** La remise s''applique dès la première facture
    — environ **112 k€ de marge en moins par mois** — alors que le volume supplémentaire, s''il vient,
    s''installe sur plusieurs trimestres. Les six premiers mois après signature sont *moins* bons en cash
    que le statu quo. L''argument « signer pour sécuriser » est faux dans sa dimension la plus urgente.

    - **Si le taux de marge réel chez D est inférieur à 31 %** — ce qui est probable pour notre plus gros
    client — tous les chiffres ci-dessus sont optimistes et la conclusion se durcit. L''incertitude ne
    joue pas en faveur de la signature.


    Le fait le plus décisif du dossier reste le T2 : **D a réduit ses commandes de 11 % sans préavis,
    hors contrat.** Un partenaire qui coupe sans préavis quand il n''a rien signé coupera aussi sous un
    contrat où le volume des années 2 et 3 est explicitement « indicatif ». On nous demande de rendre
    notre prix ferme pendant trois ans contre un volume ferme pendant un an. L''asymétrie est le produit,
    pas un détail de rédaction.


    ---


    ## 3. Limites dures — non négociables en mon absence


    Aucun engagement, écrit ou verbal, ne peut :


    1. **Accorder une exclusivité totale de canal**, de quelque durée que ce soit.

    2. **Exclure la marketplace ou les centrales régionales** hors enseignes exploitées par D.

    3. **Porter sur une durée supérieure à 18 mois.**

    4. **Comporter une pénalité de sortie à notre charge supérieure à 300 k€**, ni une pénalité non réciproque.

    5. **Porter la part de D au-delà de 65 % de notre volume.**

    6. **Consentir une remise non gagée sur un volume ferme et opposable**, années 2 et 3 comprises.


    Ces six lignes ne sont pas des positions de négociation. Ce sont les limites de ma délégation. En
    dehors d''elles, le comité n''a pas mandat, et une signature engagerait ses signataires à titre personnel.


    ---


    ## 4. Mandat de contre-proposition


    Le comité transmet à D, **par écrit, au plus tard le mardi 12 août à 12 h**, et en tout état de cause
    **avant toute réunion avec leur acheteur**, une contre-proposition construite ainsi :


    - **Remise : 4 %** sur le prix de cession — pas 9 %.

    - **Volume : +18 % fermes en année 1**, et **volume plancher ferme en années 2 et 3** (au minimum
    le volume 2025 réalisé).

    - **Clause de réversion tarifaire** : si le volume d''une année tombe sous l''engagement, le tarif
    revient de plein droit au prix plein l''année suivante, sans pénalité ni préavis. C''est la clause
    qui corrige l''asymétrie ; elle n''est pas une variable d''ajustement.

    - **Exclusivité limitée** au circuit GMS exploité par D, **exclusion explicite** du e-commerce, de
    la vente directe et des centrales régionales hors enseignes de D.

    - **Durée : 12 mois**, reconductible par accord exprès.

    - **Sortie : 250 k€, réciproque.** D verse le même montant s''il réduit ses volumes de plus de 15
    % sans préavis de six mois.

    - **Maintien des 8 références** pendant la durée du contrat.


    Marge de manœuvre du comité, sans me consulter : remise jusqu''à **5 %** contre +22 % fermes, ou jusqu''à
    **6 %** contre +28 % fermes. La règle du § 2 tranche tout cas intermédiaire. **Ces chiffres sont des
    plafonds, pas des objectifs.**


    ---


    ## 5. Le plan parallèle démarre le 11 août, quoi qu''il arrive


    Il ne s''agit pas d''un plan B. Il s''exécute en parallèle de la négociation, et il commence avant
    elle.


    **Marketplace — DC, décision immédiate.** Ouverture du canal dès cette semaine, avec un contrat résiliable
    à 30 jours. Deux raisons : c''est notre seul revenu additionnel actionnable en moins de cinq mois,
    à +6 points de marge ; et il devient impossible à ouvrir dès l''instant où une exclusivité est signée.
    Un canal ouvert vaut aussi comme fait établi dans la négociation.


    **Centrale régionale — DC.** Rendez-vous demandé sous 72 h. Objectif : obtenir un **avis intermédiaire
    écrit avant le 20 août**, même non engageant. Proposer un démarrage partiel sur 2 ou 3 références
    pour accélérer. 3,5 M€ à 31 % représentent 1,09 M€ de marge — plus que ce que le contrat D nous ferait
    perdre chaque année.


    **Redon — Directeur de site + DRH.** Préparer le dossier de chômage partiel **sans le déposer** :
    dossier instruit, chiffré, prêt à partir sous 48 h. Aucune information aux 52 salariés concernés avant
    qu''une décision soit prise. Ce qui doit m''être remis à mon retour, c''est un dossier prêt et non
    utilisé, pas une décision prise à ma place.


    **Trésorerie — DAF.** Plan de trésorerie hebdomadaire à 16 semaines, avec le point bas daté, sous
    trois hypothèses : contrat renégocié, statu quo, déréférencement de 4 références. Prise de contact
    avec nos banques **avant** le 20 août, pas après — une ligne se négocie quand on n''en a pas encore
    besoin.


    ---


    ## 6. La visite de l''acheteur de D


    **Refusée dans le format demandé.** Un acheteur qui sollicite un accès direct au comité de direction
    en l''absence du dirigeant, sur un dossier où le comité s''est divisé par écrit, ne vient pas exposer
    des arguments : il vient chercher le point le plus favorable d''un collectif divisé. Nous ne lui offrons
    pas cette prise.


    Format imposé :


    - **Deux interlocuteurs, DAF et DC ensemble.** Jamais l''un sans l''autre, à aucun moment, y compris
    en marge de la réunion. Aucun échange bilatéral, aucun appel individuel.

    - **60 minutes**, ordre du jour envoyé la veille par nos soins.

    - **Notre contre-proposition écrite a déjà été transmise.** La réunion porte sur notre texte.

    - **Aucun document remis, aucun chiffre de coût ou de marge communiqué, aucun engagement même conditionnel,
    même verbal.** La phrase à utiliser est : « Notre position est celle du courrier du 12 août. Le directeur
    général rentre après le 20. »

    - **Compte rendu écrit sous 24 h**, diffusé au comité et versé au dossier.


    Une remarque à verser au dossier : si D propose une réunion postérieure au 16 août, l''échéance des
    huit jours est négociable — ce qui en dit long. Le constater à voix haute, poliment, en réunion.


    ---


    ## 7. Les deux chiffres à produire avant le 11 août, 18 h


    Le comité ne peut pas décider correctement sans eux, et ils ne sont pas dans le dossier.


    1. **Le chiffre d''affaires exact des 4 références menacées de déréférencement**, en valeur et en
    part du CA D — DC et contrôle de gestion.

    2. **Le niveau de chiffre d''affaires en dessous duquel Redon passe sous 70 % de plan de charge**,
    exprimé en euros mensuels et en délai de déclenchement — Directeur de site.


    Point à vérifier en priorité par le DAF : 2,1 M€ pour trois mois implique environ **700 k€ de charges
    fixes mensuelles, soit 8,4 M€ par an, pour 7,4 M€ de marge brute**. Si ce ratio est exact, les 0,75
    M€ que coûte le contrat D ne sont pas un manque à gagner : c''est le basculement structurel en perte,
    et cela rend la signature strictement indéfendable. Si le ratio est faux, corrigez-le et dites-le-moi
    à mon retour — le sens de la décision ne change pas, seule son urgence change.


    ---


    ## 8. Grille de décision au 16 août


    Trois cas, et trois seulement.


    **Cas A — D accepte la contre-proposition, ou une variante à l''intérieur des bornes du § 3-4.**

    Signature autorisée. **Signature conjointe DAF et DC obligatoire.** En cas de désaccord entre eux,
    on ne signe pas : l''absence de signature est l''option par défaut, et elle ne requiert l''accord
    de personne.


    **Cas B — D refuse et maintient le déréférencement, mais les 4 références représentent moins de 35
    % du CA D.**

    On ne signe pas. Le déréférencement a lieu. Le plan du § 5 devient le plan principal. Nous perdons
    du chiffre d''affaires, nous conservons notre liberté commerciale et notre structure de marge, et
    nous restons fournisseur de D sur les 4 autres références.


    **Cas C — D refuse, et les 4 références représentent plus de 35 % du CA D.**

    Seul cas où un accord dégradé est autorisé, et dans ces bornes exclusivement : **remise ≤ 6 %, durée
    ≤ 12 mois, exclusivité GMS uniquement avec marketplace et centrales régionales expressément exclues,
    pénalité de sortie ≤ 400 k€ réciproque, clause de réversion tarifaire maintenue.** La clause de réversion
    et l''exclusion de la marketplace ne sont pas négociables, même dans ce cas : ce sont elles qui empêchent
    le contrat de devenir irréversible.


    Si D refuse même ces termes, **on ne signe pas et on assume le déréférencement.** Un contrat qui nous
    verrouille trois ans avec un partenaire qui coupe sans préavis, sans droit de compenser ailleurs et
    avec une sortie à 1,2 M€ — soit 57 % de notre trésorerie — n''est pas une sécurité. C''est la seule
    branche du dossier dont on ne revient pas.


    ---


    ## 9. Ce qui renverserait cette décision


    Je veux que le comité connaisse la condition de mon erreur, et qu''il la traite comme un fait, pas
    comme un argument.


    **Si les 4 références déréférencées représentent plus de 60 % du CA D** — soit environ 9 M€, plus
    d''un tiers de notre chiffre d''affaires total — et que le point bas de trésorerie tombe **avant fin
    octobre**, alors nous ne sommes plus dans un arbitrage de rentabilité mais dans un risque de solvabilité,
    et le cas C devient obligatoire plutôt que permis. Dans cette hypothèse seulement, le comité signe
    l''accord dégradé du § 8-C sans attendre mon retour, sous double signature, et consigne par écrit
    les chiffres qui l''ont déclenché.


    En dehors de cette configuration précise et vérifiée, le mandat s''applique tel quel.


    ---


    ## 10. Gouvernance et calendrier


    Le comité s''est divisé par écrit. Je ne demande à personne de changer d''avis ; je répartis la responsabilité
    de sorte que chacun exerce un pouvoir réel.


    - **Le DAF conduit la négociation avec D**, dans les bornes du § 4. C''est lui qui parle chiffres
    à l''acheteur.

    - **Le DC est responsable du plan alternatif** — marketplace et centrale régionale — avec un budget
    engageable de 80 k€ sans validation supplémentaire.

    - **Le directeur de Redon a une voix décisionnelle** sur tout arbitrage touchant le plan de charge
    : aucune décision affectant le site ne se prend sans son accord explicite, consigné.

    - Aucun des trois ne peut engager Verdal seul.


    **Calendrier :**


    | Date | Action | Responsable |

    |---|---|---|

    | 11 août, 18 h | Les deux chiffres du § 7 | DC, Dir. site |

    | 11 août | Ouverture marketplace, relance centrale | DC |

    | 12 août, 12 h | Contre-proposition écrite envoyée à D | DAF |

    | 12-14 août | Réunion acheteur, format § 6 | DAF + DC |

    | 15 août | Plan de trésorerie 16 semaines, contacts bancaires | DAF |

    | 16 août | Application de la grille § 8, décision consignée | DAF + DC |

    | 20 août | Comité d''achat D | — |


    ---


    ## 11. À mon retour


    Je veux trouver : le dossier de négociation complet avec l''ensemble des échanges écrits, le compte
    rendu de la réunion avec l''acheteur, les deux chiffres du § 7, le plan de trésorerie, le dossier
    Redon instruit et non déposé, et le canal marketplace ouvert.


    Si nous avons perdu quatre références, nous les aurons perdues en gardant notre liberté de vendre
    ailleurs, notre structure de marge et une trésorerie intacte. C''est réparable en dix-huit mois.


    Si nous avons signé le contrat tel qu''il est proposé, nous serons plus dépendants, moins rentables,
    sans issue avant 2029 et sans droit de chercher un client ailleurs. Cela ne se répare pas.


    Entre les deux, je choisis la première.


    **Le Directeur général**


    ---


    *Un mot au comité, hors mandat : je pars en sachant que je vous laisse une décision difficile sans
    possibilité de vous répondre. Ce n''est pas confortable, et je n''ai pas cherché à le rendre confortable
    en vous laissant de la latitude — la latitude, dans une négociation asymétrique et sous contrainte
    de calendrier, est ce que l''autre partie exploite. Les bornes ci-dessus vous protègent autant qu''elles
    vous contraignent. Si D vous dit qu''elles sont déraisonnables, c''est le signe qu''elles sont au
    bon endroit.*

    '
