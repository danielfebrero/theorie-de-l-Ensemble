response:
  text: 'Camille, je fais court et net. Deux choses, deux réponses.


    ## 1. La date


    **La date à écrire est le lundi 15 juin 2026.** Pas le 2 juin.


    Le calcul, une fois, pour que tu n''aies pas à le refaire :


    - Point de départ : la **réception** par l''agence, soit le **jeudi 14 mai 2026** (leur accusé de
    réception).

    - Préavis d''un mois → terme au **dimanche 14 juin 2026**.

    - La clause reporte au premier jour ouvrable suivant → **lundi 15 juin 2026**.


    J''ai vérifié : le 14 juin 2026 tombe bien un dimanche, et le 15 juin n''est pas férié (le lundi de
    Pentecôte 2026, c''est le 25 mai).


    Le 2 juin venait probablement d''un décompte à partir du 2 mai, la date du décès. Mais la clause part
    de la réception du courrier, comme l''agence te l''a confirmé.


    Dans le brouillon, remplace donc par : « le bail prend fin le **lundi 15 juin 2026** ».


    ## 2. Les trois phrases


    Même contenu, rien d''ajouté, rien de retiré :


    > **1.** Suite au décès de ma mère, Mme Yvette Rambert, locataire du logement, survenu le 2 mai 2026,
    je vous écris pour vous notifier la résiliation du bail.


    > **2.** Je peux vous restituer les clés à la date qui vous conviendra, mais pas avant la fin du préavis
    : je n''aurai pas terminé de vider le logement d''ici là, et je préfère vous en informer dès maintenant.


    > **3.** Je vous remercie de bien vouloir me confirmer la bonne réception de ce courrier, ainsi que
    de m''adresser le solde du dépôt de garantie de 780 euros que vous détenez.


    C''est tout. Le courrier peut partir demain matin.

    '
