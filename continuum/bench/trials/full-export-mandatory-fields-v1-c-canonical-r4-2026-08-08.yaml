response:
  text: 'Je n''ai pas les droits d''écriture ici, donc voici la note directement. J''ai d''abord refait
    l''arithmétique du contrat, parce que c''est elle qui tranche le dossier.


    ---


    # NOTE DE DIRECTION — EXÉCUTOIRE EN L''ABSENCE DU DIRECTEUR GÉNÉRAL


    **À :** Comité de direction (DAF, Dir. commerciale, Dir. industrielle, DRH, Dir. qualité)

    **Date :** 8 août 2026 — **Période couverte :** 9 août au 30 août inclus

    **Objet :** Proposition d''exclusivité du distributeur D — décision arrêtée et conduite à tenir

    **Statut :** instruction, non consultation. Aucun point n''appelle un arbitrage de ma part.


    ## 0. Si vous ne lisez rien d''autre


    **Nous ne signons pas le contrat proposé par D. Ni en l''état, ni amendé, ni « pour gagner du temps
    ».**


    J''ai signé ce jour, avant mon départ, la lettre de contre-proposition adressée à D (annexe A). Elle
    part le 10 août. Votre travail pendant trois semaines : **transmettre cette lettre, tenir la ligne,
    exécuter les trois chantiers du § 5**. Vous n''avez rien à décider sur le fond.


    La seule chose qui, en trois semaines, ne se rattrape pas, c''est une signature. Le comité d''achat
    de D se tient en septembre : je serai rentré. Le calendrier joue pour nous, à une condition — que
    rien d''irréversible ne soit engagé d''ici mon retour.


    ## 1. La décision


    Verdal **refuse** l''exclusivité de trois ans (remise 9 %, engagement de volume ferme la première
    année seulement, pénalité de sortie 1,2 M€).


    Verdal **propose en retour** un accord de croissance de douze mois, sans exclusivité, à remise progressive
    indexée sur le volume réellement livré.


    Ce refus n''est pas une rupture : il est formulé comme une offre. D reste notre premier client, servi
    sans le moindre relâchement pendant toute la négociation. Aucune commande ralentie, aucun litige ouvert,
    aucun ton haussé.


    ## 2. Pourquoi — l''arithmétique, pas l''humeur


    Ce n''est pas un contrat défensif coûteux. C''est un contrat **destructeur de marge dès le premier
    jour, y compris si D tient parole**.


    Base sur D : 14,9 M€ de CA, 31 % de marge (hypothèse à vérifier, § 8) → **4,62 M€ de marge brute**,
    10,28 M€ de coûts variables.


    | Scénario | CA sur D | Marge brute | Écart annuel |

    |---|---|---|---|

    | Aujourd''hui | 14,90 M€ | **4,62 M€** (31,0 %) | référence |

    | An 1 signé (+18 % volume, −9 % prix) | 16,00 M€ | **3,87 M€** (24,2 %) | **−0,75 M€** |

    | An 2–3, volume revenu au niveau actuel | 13,56 M€ | **3,28 M€** | **−1,34 M€** |

    | An 2–3, volume à −11 % (comme au T2) | 12,07 M€ | **2,92 M€** | **−1,70 M€** |


    **Cumul trois ans : −3,4 à −4,2 M€ de marge brute**, sur une entreprise qui produit 7,4 M€ de marge
    par an et détient 2,1 M€ de trésorerie.


    **a) Le volume offert ne paie pas la remise.** Une remise de 9 % exige **+40,9 % de volume** pour
    laisser la marge inchangée. D en propose 18. Nous perdons de l''argent dans le meilleur scénario du
    vendeur.


    **b) La protection dure douze mois, le prix en dure trente-six.** L''engagement est ferme un an, *indicatif*
    ensuite ; la remise et l''exclusivité courent trois ans. Nous achèterions une année d''assurance au
    prix de trois années de marge — et le risque contre lequel nous nous assurons (une coupe non préavisée
    comme le −11 % du T2) reste entièrement ouvert en années 2 et 3, sans recours.


    **c) La signature coûte plus cher que la menace.** Le contrat détruit en moyenne 1,14 M€ de marge
    par an — l''équivalent de **perdre 25 % du volume de D chaque année, trois ans de suite**. Et il nous
    interdit pendant ce temps de vendre ailleurs. Perdre quatre références serait douloureux ; ce serait
    réversible, remplaçable, et nous laisserait libres.


    Coût d''opportunité verrouillé par l''exclusivité : centrale régionale 3,5 M€ → **1,09 M€ de marge/an**
    ; marketplace 1,3 M€ médian à 37 % → **0,48 M€/an**. Soit ~3 M€ de marge renoncés. **Total à charge
    de la signature : de l''ordre de 6,5 M€ de marge brute sur trois ans.**


    **d) La sortie n''existe pas.** 1,2 M€ de pénalité = **57 % de notre trésorerie**. Ce n''est pas une
    clause de sortie, c''est une clause de dissuasion. En année 2, si D réduit ses volumes — ce que le
    caractère « indicatif » l''y autorise expressément — nous n''aurions ni canal de substitution (interdit),
    ni porte de sortie (impayable), ni temps (trois mois de charges fixes). C''est la seule branche du
    dossier où l''entreprise peut ne pas se relever.


    **e) Ce que la banque verra avant nous.** Une exclusivité écrite transforme une concentration de fait
    à 62 % en concentration de droit, opposable et documentée. Elle réduit nos lignes de financement au
    moment où nous en aurions le plus besoin. Signer affaiblit la trésorerie deux fois : par la marge
    et par le crédit.


    ## 3. Le contre-argument que j''ai retenu — et pourquoi il ne renverse pas la décision


    > *« Si les quatre références menacées font la moitié du volume de D, leur déréférencement coûte 7,45
    M€ de CA et 2,31 M€ de marge par an — deux fois le contrat en année 1 — et fait tomber Redon sous
    70 %. Refuser coûte donc plus que signer. »*


    Exact sur la première année. Il ne tient pas :


    1. **Signer n''écarte pas ce risque, il le décale** en année 2, où nous aurons payé la remise, perdu
    les alternatives et gardé le risque.

    2. **La perte est remplaçable, la remise ne l''est pas.** Face à 7,45 M€ menacés, nous avons 3,5 M€
    de centrale et jusqu''à 2,2 M€ de marketplace, à marge supérieure. Sous exclusivité, ce plan de remplacement
    est illégal.

    3. **La menace n''est pas binaire.** Un acheteur qui déréférence quatre références sur huit garde
    les quatre autres et doit combler un trou de gamme. Un « réexamen au comité d''achat » annoncé huit
    jours avant une échéance de signature, avec le même timing que la coupe du T2, est un instrument de
    négociation.


    Sa prémisse chiffrée doit néanmoins être vérifiée sous 48 h (§ 4).


    ## 4. Les huit jours — qui fait quoi


    Échéance D : **16 août**. Aucune décision à prendre, un calendrier à exécuter.


    | Quand | Qui | Quoi |

    |---|---|---|

    | **9 août** | DG (fait) | Lettre de contre-proposition signée, remise au DAF. |

    | **10 août** | Dir. commerciale | Remise en main propre au directeur des achats de D, en rendez-vous
    physique si possible. Ton coopératif. Message : *« Nous voulons grandir avec vous, voici comment nous
    le finançons. »* Aucune discussion des termes en séance : la lettre parle, vous écoutez et vous notez.
    |

    | **10 août** | Dir. commerciale + DAF | **Chiffrer les quatre références menacées** : part exacte
    du volume et de la marge de D, effet sur le plan de charge Redon. Diffusion au CODIR le 12. |

    | **11 août** | DAF | Ouvrir la négociation de financement (§ 5.c). |

    | **11–16 août** | Dir. commerciale | Recueillir la réponse de D → trois conduites ci-dessous, aucune
    interprétation. |

    | **16 août** | CODIR | Point collectif, compte rendu écrit versé au dossier quelle que soit l''issue.
    |


    **(1) D accepte la contre-proposition mot pour mot.** L''avocat atteste par écrit que le texte reçu
    est littéralement identique à l''annexe A. Sur cette attestation, et sur elle seule, **le DAF est
    autorisé à contresigner**. Vérification mécanique, pas jugement.


    **(2) D modifie quoi que ce soit — un chiffre, une durée, un mot.** **Personne ne signe.** Réponse
    type annexe B, sans amendement : *« Votre retour appelle un arbitrage du directeur général, en déplacement
    jusqu''au 30 août. Nous proposons de reprendre l''échange le 31 août ; notre offre du 10 août reste
    valable jusqu''à cette date. »* Vous n''êtes pas autorisés à négocier une variante, **même meilleure**.


    **(3) D refuse, rompt le dialogue ou maintient sa menace.** **Personne ne signe.** Accusé de réception
    courtois, offre maintenue ouverte, aucune concession, aucune menace en retour. Puis § 6. Le comité
    d''achat est en septembre : je serai là.


    **Aucune quatrième conduite n''existe.** Si la situation ne rentre dans aucune case : **ne rien signer,
    écrire ce qui s''est passé, attendre le 31 août.** L''attente est toujours l''option sûre, parce que
    le seul événement qui ne nous attend pas — le comité d''achat — a lieu après mon retour.


    ## 5. Les trois chantiers — c''est là qu''est le vrai travail


    Refuser sans dé-concentrer serait une posture. Ces chantiers ne dépendent d''aucune réponse de D et
    démarrent le 11 août.


    **a) Marketplace — ouverture immédiate** (dir. commerciale). Nous sommes libres, donc nous y allons.
    Objectif : **première commande encaissée avant le 30 août**. Périmètre étroit : les deux références
    à plus forte marge et DLC la plus longue. Budget plafonné à **40 k€**, aucun engagement de volume,
    aucun contrat au-delà de six mois. Risque baissier borné ; l''intérêt est autant informationnel que
    financier — nous saurons enfin ce que vaut notre marque hors D.


    **b) Centrale régionale — accélération** (dir. commerciale). Cinq mois est un délai subi, pas une
    fatalité. Proposez un **pilote sur deux références, trois mois, conditions préférentielles**, décidable
    par leur direction achats sans attendre la commission plénière. Objectif : réponse écrite sur le principe
    avant le 15 septembre.


    **c) Financement — priorité absolue** (DAF). **Négociez maintenant, pendant que les comptes sont bons.**
    Un financement se demande avant la tension. Cible : **1,5 M€ mobilisables** — affacturage des créances
    D (contrepartie solide, créances faciles à céder) plus ligne confirmée. Objectif : accord de principe
    écrit d''au moins un établissement **avant le 30 août, sans tirage**. Nous ne cherchons pas de l''argent,
    nous cherchons du temps.


    **d) Prospection, en fond de tâche.** Cinq contacts qualifiés hors D (restauration collective, RHF,
    MDD d''enseignes concurrentes). Cinq rendez-vous pris à mon retour. Aucune remise consentie.


    ## 6. Seuils et déclencheurs — chiffrés, observables, automatiques


    Tableau de bord publié par le DAF chaque vendredi 12 h : trésorerie, carnet D en volume, plan de charge
    Redon.


    | Déclencheur observable | Action, sans arbitrage |

    |---|---|

    | Commandes D **< 90 %** de la moyenne des 8 semaines précédentes, **2 semaines de suite** | Constitution
    du dossier d''activité partielle Redon, **sans le déposer**. On prépare le délai, on ne déclenche
    rien. |

    | Plan de charge Redon **< 75 %** en prévisionnel à 4 semaines | Arrêt intérim et heures supplémentaires.
    Redéploiement des volumes marketplace et pilote centrale sur Redon. |

    | Plan de charge Redon **< 70 %** en réalisé | **Dépôt de la demande d''activité partielle. C''est
    autorisé et c''est voulu.** Le chômage partiel préserve les 52 compétences et se répare ; leur dispersion,
    non. Ne temporisez pas pour m''attendre. Information immédiate DRH + représentants du personnel (annexe
    D). |

    | Trésorerie **< 1,5 M€** | Tirage sur la ligne du § 5.c. Gel de tout investissement non engagé. |

    | Trésorerie **< 1,0 M€** | Arrêt des chantiers du § 5 sauf affacturage. Convocation du conseil. **Ce
    seuil, et lui seul, justifie de rompre l''injoignabilité** (canal d''urgence, annexe C). |

    | D propose une modification, même favorable | Aucune signature. Annexe B, report au 31 août. |


    **Interdictions absolues, non délégables :** (1) toute clause d''exclusivité, d''approvisionnement
    exclusif ou de non-concurrence, quelle qu''en soit la durée ; (2) toute clause pénale ou indemnité
    de rupture, quel qu''en soit le montant ; (3) tout engagement de plus de douze mois ; (4) toute remise
    ou modification tarifaire > 2 % à un client pesant plus de 5 % du CA ; (5) toute descente de trésorerie
    sous 1,0 M€ sans convocation du conseil ; (6) toute communication externe sur la négociation.


    Je notifie ce jour au conseil et à notre avocat que ma délégation de signature ne couvre aucun de
    ces six points. Les délégations courantes de trésorerie et d''exploitation du DAF restent inchangées.


    ## 7. Communication


    **Un seul porte-parole vis-à-vis de D : la direction commerciale.** Le DAF n''appelle pas les achats
    de D ; la direction industrielle non plus ; moi non plus depuis le Maroc.


    Formulation à tenir, mot pour mot si nécessaire :


    > *« Nous voulons faire davantage avec vous, et nous l''écrivons dans une offre de croissance à douze
    mois. L''exclusivité, en revanche, nous est fermée : nos engagements bancaires et notre gouvernance
    nous imposent de ne pas contractualiser une dépendance supérieure à 60 % du chiffre d''affaires. Ce
    n''est pas une position de négociation, c''est une contrainte. Tout le reste est ouvert. »*


    C''est vrai, c''est vérifiable, et cela déplace le refus d''un rapport de force vers une contrainte
    externe — ce qui permet à notre interlocuteur d''accepter sans perdre la face. **Ne dites jamais que
    le contrat détruit notre marge :** cela donnerait à D notre structure de coûts.


    En interne : aucune information sur Redon tant qu''un déclencheur du § 6 n''est pas franchi. S''il
    l''est, la DRH informe les représentants du personnel **le jour même**. Une rumeur non traitée coûte
    plus cher qu''une mauvaise nouvelle annoncée droit.


    ## 8. Ce que je peux avoir mal évalué


    Aucun de ces trois points ne change la décision ; tous changent l''urgence.


    1. **La marge réelle sur D.** J''ai retenu 31 %, la moyenne. Un client qui pèse 62 % obtient rarement
    les conditions moyennes : la marge réelle est probablement inférieure, ce qui rend la remise encore
    plus destructrice que le tableau du § 2. Le DAF isole la marge par client avant le 20 août.

    2. **La structure de coûts.** 2,1 M€ = trois mois de charges fixes implique **~8,4 M€ de charges fixes
    annuelles pour 7,4 M€ de marge brute**. Si c''est exact, l''exploitation est déjà déficitaire et aucune
    érosion de marge n''est absorbable — la signature serait immédiatement fatale. Si « trois mois de
    charges » recouvre l''ensemble des décaissements, la lecture change. **Le DAF tranche avant le 20
    août et l''inscrit en tête du tableau de bord.** C''est le chiffre le plus important du dossier et
    je ne l''ai pas en écrivant.

    3. **Le poids réel des quatre références menacées** (§ 4).


    **L''observation qui renverserait ma décision, et une seule :** que D accepte de transformer le +18
    % en **engagement ferme sur les trois années**, type take-or-pay, avec pénalité réciproque et symétrique
    et un plancher de référencement des huit références. La remise achèterait alors une contrepartie réelle
    et le calcul devrait être refait. **Ce cas relève de la conduite (2) : vous ne signez pas, vous notez,
    vous reportez au 31 août.** Une offre de cette nature ne se retire pas en quinze jours ; si elle se
    retire, c''est qu''elle n''existait pas.


    ## 9. Ce que j''assume


    Nous prenons le risque de perdre jusqu''à quatre références, jusqu''à 2,3 M€ de marge annuelle dans
    le pire cas, et de mettre 52 personnes en activité partielle à Redon. Je le sais en l''écrivant. **Ce
    sont les salariés de Redon qui encaissent le pire cas de cette décision** — c''est pourquoi le § 6
    prévoit de préparer leur dossier avant d''en avoir besoin, et de le déposer sans attendre mon retour.


    Je le prends parce que l''autre branche ne comporte aucun scénario de récupération : trois ans sans
    canal alternatif, sans sortie payable, avec une marge amputée et un client engagé douze mois. Une
    entreprise survit à une perte de chiffre d''affaires. Elle ne survit pas à la perte simultanée de
    sa marge, de ses alternatives et de son temps.


    Le chômage partiel est un état dont on revient. La dépendance contractualisée à trois ans, non.


    **Première action, mardi 10 août au matin :** la direction commerciale remet la lettre signée au directeur
    des achats de D. Tout le reste en découle.


    **Signé, le 8 août 2026 — Le directeur général**


    **Annexes au dossier remis au DAF — A.** Lettre signée à D : accord de croissance 12 mois, remise
    progressive (0 % jusqu''au volume actuel, 3 % à +15 %, 6 % à +30 %, 9 % à +41 % et au-delà), sans
    exclusivité, sans pénalité, contre référencement ferme des huit références sur douze mois, priorité
    de lancement des nouveautés, plan de croissance conjoint. — **B.** Deux réponses types pré-rédigées.
    — **C.** Coordonnées avocat, banques, canal d''urgence. — **D.** Message aux représentants du personnel.


    ---


    Trois remarques hors note, pour vous seul :


    - **Le chiffre qui ferme le dossier est +40,9 %** — le volume nécessaire pour qu''une remise de 9
    % soit neutre. D en offre 18, et seulement un an. Tout le reste de l''analyse ne fait que confirmer
    ce calcul.

    - **La dissymétrie décisive n''est pas l''espérance de gain, c''est la récupérabilité.** Refuser expose
    à une perte lourde mais remplaçable ; signer expose à une perte moindre la première année, puis à
    une situation sans issue en année 2 (pas de canal, pas de sortie à 1,2 M€ contre 2,1 M€ de trésorerie,
    pas de temps).

    - **Le § 8.2 mérite votre attention avant de partir.** Si les 8,4 M€ de charges fixes implicites sont
    réels, l''entreprise est déjà en perte d''exploitation et le vrai sujet des trois semaines n''est
    pas D, c''est le financement du § 5.c — que je ferais alors passer devant tout le reste.

    '
