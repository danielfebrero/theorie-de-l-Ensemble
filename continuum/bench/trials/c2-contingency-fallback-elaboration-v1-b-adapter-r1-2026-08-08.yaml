response:
  text: '# Plan d''exécution — conversion de la flotte en 96 utilitaires électriques

    **Note au conseil — séance du jeudi** · Direction de l''exploitation


    ---


    ## 1. Ce qui commande le calendrier


    La commande est ferme, le calendrier de livraison est fixé, la subvention est conditionnée au 31 janvier.
    Le seul paramètre que nous pilotons est **le rythme auquel nous mettons les véhicules en tournée et
    celui auquel nous rendons les diesels**. Ce plan porte sur ce paramètre-là.


    Deux contraintes le fixent, et aucune des deux n''est l''autonomie annoncée.


    **a) L''autonomie de référence est 197 km, pas 260.** L''essai de mars mesure 232 km en moyenne et
    197 km par 2 °C avec chauffage. Notre montée en charge se déroule intégralement entre octobre et février.
    La valeur de planification est donc 197 km, et avec une réserve d''exploitation de 15 % : **167 km
    utiles**. La tournée moyenne fait 168 km. Autrement dit, en janvier, la moitié environ du carnet de
    tournées sort de l''enveloppe électrique sûre — et non 9 % comme le suggère l''essai de mars.


    L''indice le confirme : 11 tournées sur 120 ont exigé une recharge non prévue, **toutes au-dessus
    de 190 km**, en conditions de mars. À 2 °C, le seuil descend mécaniquement.


    **b) La capacité de charge plafonne la flotte en service bien avant les livraisons.** 14 bornes de
    22 kW, 6 h pour une charge complète. Sur une fenêtre de nuit de 12 h 30, une borne assure deux sessions.
    Soit :


    | Bornes | Véhicules rechargeables par nuit (hiver) |

    |---|---|

    | 14 (aujourd''hui) | ~28 |

    | 22 (tranche 1) | ~44 |

    | 30 (tranche 2) | ~62 |


    **96 véhicules livrés fin décembre, mais 28 rechargeables par nuit sans travaux.** C''est la contrainte
    dimensionnante du programme, et elle a un délai de 7 semaines.


    **Le levier qui résout les deux à la fois :** affecter les véhicules électriques aux tournées les
    plus courtes. Une tournée courte tient dans l''autonomie froide *et* libère la borne plus tôt. C''est
    la colonne vertébrale du plan.


    ---


    ## 2. Les six décisions demandées jeudi


    | # | Décision | Montant | Échéance |

    |---|---|---|---|

    | 1 | Commander les 8 bornes devisées | 210 000 € | **Signature vendredi** — 7 semaines de travaux,
    mise en service ~1er octobre |

    | 2 | Autoriser une tranche 2 de 8 bornes, déclenchement délégué | 210 000 € | Décision au plus tard
    le **15 octobre** pour disponibilité mi-décembre |

    | 3 | Enveloppe de prolongation de location diesel | 120 000 € | Immédiate, délégation d''émission
    des préavis à l''exploitation |

    | 4 | Adopter la règle de restitution (§5) et la règle d''affectation (§4) | — | Immédiate |

    | 5 | Mandater le recalibrage du carnet de tournées (plafond 175 km) | — | Rapport le 30 septembre
    |

    | 6 | Saisir la Région sur la définition de « roulent » | — | Courrier avant le **20 août** |


    La décision 1 est irréversible dans son délai : ne pas signer vendredi décale la mise en service à
    la mi-novembre et rend la cible de janvier inatteignable. La décision 2 est la contrepartie directe
    de la subvention : **210 000 € engagés pour sécuriser 620 000 €.**


    ---


    ## 3. Séquencement septembre → mars


    | Fin de mois | VE livrés | VE en tournée quotidienne | Bornes | Diesels conservés |

    |---|---|---|---|---|

    | Septembre | 24 | 18 | 14 | 78 |

    | Octobre | 48 | 34 | 22 | 62 |

    | Novembre | 72 | 48 | 22 | 48 |

    | Décembre | 96 | 58 | 30 | 38 |

    | **Janvier** | 96 | **66** | 30 | 30 |

    | Février | 96 | 78 | 30 | 18 |

    | Mars | 96 | 96 | 30 | 0 |


    L''écart entre véhicules livrés et véhicules en tournée n''est pas du gaspillage : ce sont les véhicules
    en rodage, en formation conducteur et en réserve de remplacement. Ils ne coûtent rien de plus, ils
    sont déjà achetés.


    La cible de janvier — 66 véhicules en tournée — passe la barre des 60 avec une marge de 6 véhicules.
    **Sans la tranche 2 de bornes, cette cible tombe à ~50 et la subvention est perdue.**


    ---


    ## 4. Règle d''affectation des tournées


    Le carnet est segmenté en trois classes, révisées chaque semaine selon la température prévue à 7 jours.


    - **Classe A — moins de 140 km.** Électrique en toutes conditions. Aucune restriction.

    - **Classe B — 140 à 175 km.** Électrique au-dessus de 5 °C. En dessous, appariement avec un véhicule
    de classe A le lendemain (rotation), ou bascule diesel.

    - **Classe C — plus de 175 km.** Diesel jusqu''au 1er mars, sans exception, jusqu''à ce que l''une
    des trois conditions soit levée : recalibrage du tracé sous 175 km, point de recharge intermédiaire
    confirmé, ou consommation froide réelle mesurée meilleure que l''essai.


    Trois mesures d''accompagnement, à coût nul ou faible, qui repoussent le seuil de 5 à 10 % :


    - **Préconditionnement sur borne** avant départ (habitacle et batterie chauffés sur le réseau, pas
    sur la batterie). Obligatoire, paramétré au superviseur de flotte.

    - **Formation éco-conduite hivernale** des conducteurs affectés, avant première prise de service.

    - **Routage des tournées longues** de manière à passer à proximité d''une plateforme entre 12 h et
    14 h : 45 min sur borne rendent environ 25 km.


    **Recalibrage du carnet (décision 5).** Le volume total est de ~16 100 km/jour sur 96 tournées. Un
    plafond à 175 km est arithmétiquement atteignable avec 92 tournées. La question est géographique et
    contractuelle, pas mathématique. Le service exploitation rend un chiffrage le 30 septembre : combien
    de tournées supplémentaires coûte un plafond à 175 km, et sur quels clients il bute.


    ---


    ## 5. Règle de restitution des diesels — le point dur


    **Rendre un diesel est la seule décision vraiment irréversible du programme.** Un véhicule rendu ne
    revient pas avant 11 semaines, c''est-à-dire jamais avant la fin de l''hiver. Une prolongation coûte
    480 €/mois. Une tournée non terminée coûte 900 €.


    > **Conserver un diesel un mois entier coûte un peu plus de la moitié d''une seule tournée ratée.**


    Cette asymétrie tranche le débat. La règle est donc :


    1. **Aucun diesel n''est rendu avant que son remplaçant électrique n''ait bouclé 15 jours ouvrés consécutifs
    sur sa tournée assignée, sans recharge non prévue**, et qu''un créneau de borne lui soit nominativement
    réservé.

    2. **Le préavis de 30 jours d''un lot n''est émis que si le mois écoulé est au vert** (§6). Le préavis
    est donc toujours en retard d''un mois sur la preuve : c''est délibéré.

    3. **À négocier cette semaine avec le loueur :** un droit d''annulation du préavis jusqu''à 10 jours
    avant la reprise, même contre indemnité. C''est une option peu coûteuse qui supprime notre principal
    risque de blocage. Si le loueur refuse, nous décalons tous les préavis d''un mois.


    **Coût du dispositif.** Le plan §3 représente ~67 000 € de prolongation au-delà du calendrier nominal.
    L''enveloppe demandée est de **120 000 €** afin de couvrir un scénario dégradé prolongé jusqu''en
    mai. Elle s''amortit à partir de 133 tournées sauvées, soit **1,1 % des ~12 000 tournées d''octobre
    à mars**. L''essai a mesuré 9,2 % de tournées en difficulté.


    ---


    ## 6. Pilotage : indicateurs et seuils d''arrêt


    Le tableau de bord du soir existe déjà et publie par plateforme le taux de tournées terminées et le
    nombre de recharges non prévues. Trois ajouts, opérationnels dès la première livraison :


    - État de charge au retour (distribution, pas moyenne) — le superviseur remonte déjà la donnée toutes
    les 10 min ;

    - Nombre de véhicules effectivement rechargés par nuit / capacité théorique ;

    - Température minimale du jour, en regard.


    **Seuils, sur moyenne glissante 7 jours des tournées électriques :**


    | | Recharges non prévues | Action |

    |---|---|---|

    | 🟢 Vert | < 1 % | Le lot de préavis du mois est émis. On avance. |

    | 🟠 Orange | 1 – 3 % | Préavis suspendus. Plafond de classe B abaissé de 10 km. |

    | 🔴 Rouge | > 3 %, ou 2 tournées non terminées le même jour | Tous les préavis gelés, annulation demandée
    sur les préavis en cours, tournées concernées rebasculées diesel, point au conseil sous 5 jours. |


    ---


    ## 7. Ce que nous ne savons pas encore, et la date à laquelle nous le saurons


    Ce plan est bâti sur cinq inconnues assumées. Chacune a un porteur et une échéance.


    | Inconnue | Pourquoi elle compte | Réponse attendue |

    |---|---|---|

    | Distribution réelle des longueurs de tournée | Détermine le nombre exact de diesels à conserver.
    Nous connaissons la moyenne et le maximum, pas la courbe. | **22 août** |

    | Le devis de 210 000 € couvre-t-il le renforcement du raccordement ? 22 bornes = 484 kW appelés.
    | Un poste de transformation non prévu ajoute des semaines, pas seulement des euros. | **20 août**
    |

    | Les véhicules commandés ont-ils la même chaîne de chauffage que les 6 véhicules d''essai (pompe
    à chaleur ou résistif) ? | Change directement la valeur de 197 km. | **20 août** |

    | Définition exacte de « roulent » par la Région : immatriculés et affectés, ou en service effectif
    ? | Peut assouplir ou durcir toute la cible de janvier. | **1er septembre** |

    | Nombre réel de sessions par borne et par nuit | Le chiffre de 2 est une hypothèse. S''il est de
    2,5, la tranche 2 devient facultative. | **30 septembre** |


    Si la réponse du 30 septembre est favorable, la décision 2 (210 000 €) est annulée et l''économie
    revient au conseil.


    ---


    ## 8. L''objection, et notre réponse


    **L''objection la plus forte :** ce plan sur-assure. Conserver jusqu''à 62 diesels en octobre coûte
    de l''argent, retarde le bénéfice environnemental voté le 4 mai, et signale aux conducteurs que les
    véhicules électriques ne tiennent pas. L''essai de mars portait sur 6 véhicules, sur des tracés non
    optimisés, avec un logiciel qui aura été mis à jour.


    **Elle est recevable sur le fond, et nous ne la retenons pas, pour trois raisons.**


    D''abord l''asymétrie des coûts : 480 € contre 900 €. Sur-assurer est bon marché, sous-assurer ne
    l''est pas.


    Ensuite la réversibilité : la prolongation est mensuelle et résiliable à 30 jours. Elle se corrige
    d''elle-même vers le bas à mesure que la preuve s''accumule — c''est exactement ce que fait le seuil
    vert du §6. La restitution, elle, ne se corrige pas : 11 semaines.


    Enfin le calendrier : l''hiver ne se rejoue pas. Une erreur d''excès de prudence se rattrape en mars.
    Une erreur inverse se paie jusqu''en avril, et emporte la subvention avec elle.


    ---


    ## Ce que le conseil obtient en signant jeudi


    - **La subvention de 620 000 € sécurisée** avec 6 véhicules de marge sur la condition du 31 janvier.

    - **Une flotte 100 % électrique en tournée au 31 mars**, deux mois après la fin des livraisons.

    - **Un dispositif de sécurité de 540 000 €** (bornes tranche 2 incluse), inférieur à la subvention
    qu''il protège, et dont 330 000 € restent conditionnels.

    - **Trois points d''arrêt explicites** avec des seuils chiffrés, alimentés par un tableau de bord
    qui tourne déjà.


    **Ce qui ne peut pas attendre : la signature du devis de bornes vendredi.** Sept semaines de travaux
    placent la mise en service au 1er octobre. Chaque semaine de retard sur cette signature est une semaine
    de retard sur la cible de janvier, et elle ne se rattrape pas.


    ---


    *Si vous voulez, je peux décliner ce plan en note d''une page pour la séance, ou le publier en page
    partageable pour les membres du conseil.*

    '
