    ---


    # NOTE AU COMITÉ DE DIRECTION


    **Objet :** Contrat cellules 2027 — 72 000 unités

    **De :** Direction des opérations

    **Décision demandée :** arbitrage fournisseur avant J+18 (réservation Kelmar, ferme et non reportable)


    ## 1. Décision recommandée


    **Réserver la capacité Kelmar à J+18 pour la totalité du volume 2027.** Ne pas attribuer le contrat
    2027 à Sinolux en l''état des preuves.


    En parallèle : trois vérifications à coût nul qui reviennent avant J+18 (§6), et une tranche de qualification
    Sinolux plafonnée pour préparer 2028 (§8).


    Je demande au comité de **sortir les 230 400 € du budget 2027**, ou de les reclasser en gain conditionnel.
    Les inscrire comme acquis, c''est engager de la dépense sur un chiffre qui, à la meilleure preuve
    disponible, vaut zéro.


    ## 2. Les 230 400 € ne sont pas une économie — c''est un pari dont le point mort est à 2,86 %


    L''écart d''achat est réel : 3,20 € × 72 000 = 230 400 €. Mais le résultat, c''est achat **plus**
    retours. À 205 € le chargeur repris, **1 124 retours supplémentaires** annulent la totalité de l''écart
    — soit 1,56 point de taux de retour.


    | Taux de retour Sinolux | Retours/an | Coût complet 2027 | Écart vs Kelmar |

    |---|---|---|---|

    | 1,1 % *(essais internes Sinolux)* | 792 | 1 803 960 € | **+259 920 €** |

    | 2,0 % | 1 440 | 1 936 800 € | +127 080 € |

    | **2,86 % — point mort** | 2 059 | 2 063 736 € | **≈ 0 €** |

    | 3,0 % *(cabinet Ferro)* | 2 160 | 2 084 400 € | −20 520 € |

    | 3,1 % *(audit sectoriel mars)* | 2 232 | 2 099 160 € | **−35 280 €** |

    | 4,0 % | 2 880 | 2 232 000 € | −168 120 € |


    *Référence Kelmar (1,3 %, stable sur quatre ans) : 1 872 000 € d''achat + 191 880 € de retours = **2
    063 880 €**.*


    Les deux seules mesures indépendantes du dossier sont **au-dessus** du point mort.


    ## 3. Nous avons deux sources, pas trois


    Le dossier paraît présenter trois estimations. Il en présente deux.


    - **1,1 %** — essais internes de Sinolux. Seule source sous le point mort, produite par la partie
    intéressée.

    - **3,1 %** — audit sectoriel de mars, ligne comparable du même fournisseur. Seule mesure indépendante.

    - **« environ 3 % »** — Ferro. Sa note méthodologique le dit : il travaille **sur l''échantillon de
    l''audit de mars**. Ferro ne confirme pas l''audit, il le relit. C''est la même donnée comptée deux
    fois.


    Nous n''avons donc pas « deux avis contre un », mais une mesure indépendante à 3,1 % contre une auto-déclaration
    à 1,1 %.


    ## 4. Le test Vertex ne peut pas éclairer cette décision


    Neuf semaines, c''est un résultat à **J+63**. La ligne Kelmar est vendue à **J+18**, le prix Sinolux
    tombe à **J+21**.


    Le résultat arriverait 45 jours après la seule décision qu''il pourrait éclairer, et 7 jours avant
    le démarrage de production — trop tard pour changer quoi que ce soit. Acheter Vertex aujourd''hui
    pour arbitrer 2027, c''est payer 34 000 € un chiffre qui arrive après la clôture du dossier.


    **En revanche Vertex vaut pour 2028** (§8) : l''écart de 230 400 €/an se represente chaque année,
    et une mesure à ±0,3 point avant la prochaine négociation vaut bien plus que 34 000 €.


    ## 5. Le refus d''indexation est notre meilleure information — et elle est gratuite


    Sinolux refuse toute clause indexée sur le taux de retour, mais accepte de remplacer gratuitement
    les cellules défectueuses. Les deux positions se lisent ensemble.


    Un fournisseur qui croit à 1,1 % ne perd rien à signer une indexation : à 1,1 %, elle ne se déclenche
    jamais. La refuser, c''est refuser de porter son propre chiffre.


    Quant à la clause acceptée, elle couvre la cellule — 22,80 € sur un événement à 205 €, soit 11 % du
    coût du risque. Sinolux a refusé la clause qui transfère le risque, et offert celle qui n''en transfère
    qu''un neuvième.


    **Réserve à lever avant J+18 :** si la cellule de remplacement n''est *pas* déjà comprise dans les
    205 €, le coût retour Sinolux tombe à 182,20 € et le point mort remonte à 3,22 % — auquel cas 3,1
    % redevient marginalement favorable (+15 610 €). C''est le seul paramètre du dossier capable d''inverser
    le signe. L''atelier peut répondre en 24 heures.


    ## 6. Trois vérifications à coût nul, réponses avant J+18


    1. **À Sinolux :** proposer une indexation ne se déclenchant qu''au-dessus de 2 %, plafonnée. Un refus
    confirme le §5 ; une acceptation change tout le dossier, et je recommanderais alors Sinolux sur la
    totalité du volume.

    2. **À l''atelier :** quelle part des 205 € est la cellule elle-même ? (§5)

    3. **À Ferro :** disposez-vous d''une donnée qui ne provienne pas de l''échantillon de mars ?


    Ces trois questions reviennent avant la fermeture Kelmar. Le test Vertex, non. C''est cette différence
    qui fonde la décision.


    ## 7. Le contre-argument, et pourquoi il ne tient pas


    > *« Prenez Sinolux. Le pire cas crédible est −35 280 € sur un contrat de 2,06 M€, soit 1,7 %. Le
    meilleur cas est +259 920 €. Sept contre un en faveur du pari. Réserver Kelmar, c''est payer 260 000
    € d''option pour éviter un risque de 35 000 €. »*


    Le rapport est exact, la conclusion ne suit pas.


    **a. Les probabilités ne sont pas symétriques.** La branche à +259 920 € repose uniquement sur l''auto-déclaration
    d''un fournisseur qui vient de refuser de la garantir. Les branches négatives reposent sur la seule
    mesure indépendante du dossier.


    **b. La perte n''est pas bornée à 35 280 €.** Ce chiffre suppose que 205 € reste 205 € à 2,4 fois
    le volume de retours — **43 retours par semaine contre 18 aujourd''hui**. Or les 205 € contiennent
    « geste commercial » et « traitement en atelier », deux postes qui montent quand la file s''allonge
    et que les mêmes clients reviennent. Et 3,1 % est une mesure ponctuelle, pas un plafond : à 4 %, la
    perte atteint 168 120 €. Le gain, lui, est arithmétiquement plafonné à 259 920 €. L''asymétrie joue
    dans l''autre sens que ne le suggère le ratio.


    **c. Le gain n''est pas perdu, il est différé.** Réserver Kelmar pour 2027 ne ferme pas 2028.


    ## 8. Tranche de qualification — à retenir si elle se négocie avant J+21


    Attribuer à Sinolux une tranche plafonnée à **12 000 unités**, prix inchangé, sur la capacité restante.


    - Gain d''achat : 38 400 €

    - Surcoût retours au pire cas mesuré (3,1 %) : 44 280 €

    - **Résultat pire cas : −5 880 €**


    Pour moins de 6 000 € d''exposition, Nordwatt obtient une donnée terrain qu''aucun laboratoire ne
    produit, et Sinolux obtient une entrée réelle plutôt qu''un refus sec — un fournisseur que nous avons
    intérêt à garder en concurrence pour 2028. Je propose de lui demander de cofinancer Vertex à parts
    égales : un fournisseur qui affirme 1,1 % devrait accueillir favorablement un laboratoire capable
    de le prouver. Sa réponse est elle-même une information.


    **À dire clairement :** cette tranche ne tranche pas 2027. Les retours s''accumulent sur la vie du
    produit ; une tranche livrée à J+70 ne donnera pas de taux exploitable avant plusieurs mois. Elle
    décide 2028.


    ## 9. Calendrier


    | Échéance | Action |

    |---|---|

    | J+0 → J+3 | Les trois questions du §6 partent |

    | J+10 | Synthèse ; ouverture négociation tranche Sinolux |

    | **J+18** | **Réservation ferme Kelmar — volume 2027** |

    | J+21 | Clôture tranche Sinolux si conditions réunies, sinon abandon |

    | J+63 | Résultat Vertex — entrée du dossier 2028 |

    | J+70 | Démarrage production, sans report |


    ## 10. Ce qui renverserait cette décision, et le repli


    **Deux observations, une seule fenêtre — avant J+18 :**


    1. Sinolux accepte une indexation au-dessus de 2 % → j''attribue 2027 à Sinolux sur la totalité du
    volume.

    2. L''atelier confirme que la cellule de remplacement est hors des 205 € **et** une seconde mesure
    réellement indépendante ressort sous 2,4 % → réexamen complet.


    Passé J+18, aucune information ne change plus rien pour 2027. C''est ce qui rend la date structurante
    — pas la pression commerciale.


    **Repli, déclencheur observable :** si la réservation Kelmar à J+18 s''accompagne d''une hausse au-dessus
    de 26,00 € ou d''un plancher de volume interdisant la tranche Sinolux, je remonte au comité sous 48
    heures avant signature. Si le taux de retour Kelmar dérive au-dessus de 1,6 % sur deux trimestres
    consécutifs en 2027, le dossier fournisseur est rouvert.


    ---


    **En une phrase :** l''économie de 230 400 € est réelle à l''achat et probablement nulle au bilan
    ; la seule chose qu''on ne récupère pas, c''est la ligne Kelmar à J+18 — donc on la garde, et on paie
    6 000 € pour apprendre ce que Sinolux vaut vraiment.


    ---


    Trois points sur la méthode, hors note :


    - **Le calcul est vérifié à la main**, pas exécuté — les permissions d''écriture et d''exécution ont
    été refusées dans ce répertoire. Chaque ligne du tableau est reproductible en deux opérations si vous
    voulez la recontrôler.

    - **Le point le plus fragile de ma recommandation** est la réserve du §5 : si la cellule de remplacement
    est hors des 205 €, le point mort passe à 3,22 % et le dossier bascule presque. Je ne l''ai pas enterrée
    dans une note de bas de page parce que c''est la seule question dont la réponse peut me faire changer
    d''avis avant J+18.

    - **Je n''ai pas pu écrire le fichier** `note-comite-cellules-2027.md` dans votre répertoire de travail.
    Dites-moi si vous voulez que je réessaie avec approbation, ou dans le scratchpad.

    '
