response:
  text: '## Recommandation au conseil — Caisse de prévoyance des Marins du Ponant


    **En une phrase : je refuse C, je plafonne et diffère B, je ne considère pas A comme un plan — et
    j''engage la caisse sur le dépôt immédiat du dossier de transfert à l''Union mutualiste de l''Atlantique,
    seule option qui protège la couverture des 4 200 affiliés.**


    ---


    ### 1. Le fait décisif que la note du trésorier ne contient pas


    L''UMA n''a jamais accepté un transfert dont la réserve représentait moins de trois années de prestations.
    Trois années de prestations, aujourd''hui, c''est **16,2 M€**. Notre réserve est de 18,4 M€.


    Nous sommes éligibles. De justesse, et pour très peu de temps.


    Le seuil monte de 4,3 %/an pendant que la réserve baisse :


    | | Réserve | Seuil 3 ans | Marge |

    |---|---|---|---|

    | Aujourd''hui | 18,4 | 16,2 | **+2,2** |

    | Dans 12 mois | 17,7 | 16,9 | **+0,8** |

    | Dans 24 mois | 16,8 | 17,6 | **−0,8** |


    La fenêtre d''éligibilité se referme dans **environ 15 à 18 mois**. L''instruction du comité d''engagement
    prend **12 à 18 mois**. Il n''y a pas de marge : le dossier doit partir maintenant, ou l''option disparaît
    sans avoir été examinée.


    Toute décision prise jeudi qui abaisse la réserve, la rend illiquide ou consomme du temps, détruit
    la seule sortie non destructive dont nous disposons. C''est le critère qui domine tous les autres.


    ---


    ### 2. Option C — je m''y oppose, et je demande que mon opposition soit portée au procès-verbal


    Je ne conteste pas l''arithmétique du trésorier sur l''espérance. Je constate deux erreurs de modèle
    qui la rendent inopérante, et une erreur de raisonnement qui la rend dangereuse.


    **Première erreur — le modèle suppose que la caisse ne verse aucune prestation.**


    La réserve résiduelle de 4,7 M€ annoncée en cas de défaut, c''est 4,0 M€ de poche liquide (18,4 −
    14,4) plus 0,72 M€ de récupération (5 % de 14,4). Ce chiffre n''est atteignable que si les 4,0 M€
    liquides sont encore intacts au bout de sept ans. Or nous versons 1,0 M€ de plus que nous n''encaissons,
    chaque année, et cet écart se creuse :


    | Fin d''année | Poche liquide |

    |---|---|

    | 1 | 3,0 M€ |

    | 2 | 1,8 M€ |

    | 3 | 0,3 M€ |

    | 4 | **épuisée** |


    **La caisse est en défaut de trésorerie au cours de la quatrième année — dans toutes les branches,
    y compris celle à 88 %.** La note est bloquée sept ans, non cotée, sans sortie anticipée. Il n''existe
    aucun mécanisme pour payer les prestations de la cinquième à la septième année. Le scénario favorable
    à +14 %/an est inatteignable : nous serions liquidés avant d''y arriver.


    Ce point suffit à lui seul. Il n''est pas une question d''appétit au risque, c''est une impasse comptable.


    **Deuxième erreur — « 94 % des trajectoires » n''est pas un argument quand 6 % sont absorbantes.**


    Les 10 000 simulations décrivent 10 000 caisses parallèles. Nous n''en avons qu''une, et elle ne redémarre
    pas. La liquidation de plein droit sous 11 M€ est une barrière absorbante : une fois franchie, aucune
    trajectoire favorable ultérieure n''existe. Moyenner à travers une barrière absorbante produit un
    chiffre juste et une décision fausse. La branche défaut à 3 % ramène la réserve à 4,7 M€ — soit 6,3
    M€ **sous** le seuil statutaire. Ce n''est pas une mauvaise année, c''est la fin de la caisse.


    **Troisième point — les 3 % ne sont pas une mesure, c''est une communication.**


    La distribution 88/9/3 est fournie par l''émetteur lui-même sur son propre produit. Elle n''est ni
    auditée ni indépendante. Un signal mérite l''attention du conseil : une récupération de 5 % du nominal
    en cas de défaut est très inférieure aux taux de récupération d''une dette senior (usuellement 35–45
    %). Cela indique que le produit est subordonné, ou qu''il embarque un levier de marché au-delà du
    risque de crédit de l''émetteur A−. Le « 3 % » ne couvre alors pas tous les chemins vers la perte.


    Quant aux deux caisses comparables : elles ont souscrit il y a un an, sur un blocage de sept ans.
    Nous n''avons aucune information sur leur résultat. Ce n''est pas une référence, c''est une coïncidence
    de calendrier.


    **Enfin, ce que « 3 % » désigne réellement.** Ce ne sont pas 3 % d''un capital. Ce sont 4 200 personnes
    de 61 ans de moyenne d''âge, avec une exposition amiante lourde, dont aucun assureur du marché n''a
    accepté de coter le risque en 2025. En cas de liquidation, elles ne se réassurent pas ailleurs : il
    n''y a pas d''ailleurs. Le trésorier écrit « du bruit statistique ». Le bruit est supporté par des
    gens qui ne votent pas jeudi et qui ne peuvent pas se couvrir. Une perte irrécupérable, imposée à
    un tiers qui ne peut pas la reconstituer, n''entre pas dans un calcul d''espérance : elle en sort
    par veto.


    **Position : C est rejetée. Sa taille (78 %), sa durée (7 ans), son illiquidité et son émetteur unique
    sont chacun disqualifiants ; réunis, ils constituent une décision que le conseil aurait à justifier
    individuellement.** Je signale sans agressivité que l''engagement de 78 % de la réserve d''une mutuelle
    sur un actif non coté, mono-émetteur, avec une rupture de trésorerie documentée en année 4, est exactement
    la configuration qui se qualifie en faute de gestion. Les administrateurs doivent disposer de cette
    information avant de voter.


    ---


    ### 3. Option B — accord de principe, montant réduit, déclenchement différé


    B est financièrement saine dans son principe : coté, valorisé quotidiennement, sortie possible à tout
    moment. Le pire décile (−35 % sur la tranche) laisse la réserve à 15,8 M€, très au-dessus des 11 M€.
    C''est de la variance, pas de la ruine.


    Mais 15,8 M€ est **sous le seuil d''éligibilité UMA de 16,2 M€**. Exécuter B à 7,4 M€ dès maintenant,
    c''est accepter une chance sur dix de perdre le transfert pendant les 18 mois exacts où il se joue
    — pour un gain espéré de +0,3 M€/an. Le rapport est mauvais.


    Le trésorier a raison sur un point : **B seule ne referme pas l''écart avant 2035.** C''est vrai,
    et ce n''est pas un reproche à B — c''est le diagnostic. Aucun rendement ne comble un écart structurel
    de 23 % entre cotisations et prestations sur un effectif vieillissant et non réassurable. Le problème
    n''est pas le rendement de l''actif ; il est au passif.


    **Position : B approuvée en principe, tranche plafonnée à 4,0 M€ (au lieu de 7,4), déploiement suspendu
    jusqu''à la décision de l''UMA** — ou déclenché immédiatement si l''UMA refuse d''ouvrir le dossier.
    Le plafond de 4,0 M€ est calibré pour que le pire décile (−1,4 M€) laisse la réserve au-dessus du
    seuil d''éligibilité.


    ---


    ### 4. Option A — ce n''est pas un plan, et son horizon est probablement plus court qu''annoncé


    Le statu quo ne se choisit pas ; il se subit. Une remarque de méthode sur la projection à neuf ans
    : elle ne se reconstitue à partir des paramètres de la note **que si l''on suppose les cotisations
    en hausse de 4,3 %/an**, au même rythme que les prestations. Or leur relèvement relève de l''AG, qui
    a rejeté 6 % en 2024. À cotisations constantes à 4,4 M€, le seuil de 11 M€ est atteint **au cours
    de la sixième année, pas de la neuvième**.


    Je demande que la direction financière confirme ou infirme cette hypothèse avant jeudi. Si les cotisations
    sont supposées indexées dans le modèle interne, le conseil doit savoir que cette indexation n''est
    pas acquise et que l''horizon réel se situe entre cinq et neuf ans selon un vote qu''il ne contrôle
    pas.


    **Position : A est retenue comme régime de gestion de l''actif pendant l''instruction du transfert,
    et uniquement à ce titre. Elle n''est pas une stratégie.**


    ---


    ### 5. Ce que je propose — quatre volets, à voter jeudi


    **Volet 1 — Dépôt du dossier UMA sous 30 jours.** Mandat donné au directeur, avec budget d''instruction.
    C''est la première action et elle conditionne tout le reste. Objectif : ne pas négocier seulement
    un transfert, mais un transfert avec contreparties pour nos affiliés — représentation des Marins du
    Ponant au sein de la structure d''accueil, lissage pluriannuel de l''alignement des cotisations, maintien
    des garanties amiante existantes. Nous arrivons avec une réserve encore supérieure au seuil : c''est
    notre seul levier de négociation, et il ne durera pas.


    **Volet 2 — AG extraordinaire dans les 90 jours, avec les vrais termes.** L''AG a rejeté 6 % en 2024
    parce qu''on lui a présenté une hausse, pas une alternative. Les termes réels sont : transfert, ou
    relèvement des cotisations de l''ordre de 20 %, ou liquidation à horizon 5 à 9 ans sans marché de
    remplacement. Une cotisation à 5,3 M€ équilibre la caisse ; 6 % ne l''a jamais fait. Les affiliés
    ont le droit d''arbitrer entre leur cotisation et leur couverture — c''est leur argent et leur risque.
    Ce volet reste utile même si le transfert aboutit : il améliore le dossier présenté à l''UMA.


    **Volet 3 — Actif : A par défaut, B plafonnée à 4,0 M€ en réserve conditionnelle.** Déclenchement
    sur décision UMA négative ou sur constat que la réserve passe sous 16,5 M€ sans perspective de transfert.


    **Volet 4 — Préparer une extinction choisie plutôt que subie.** Si le transfert échoue et que l''AG
    refuse le relèvement, une mise en run-off ordonnée décidée à 14–15 M€ préserve davantage pour les
    affiliés qu''une liquidation de plein droit déclenchée à 11 M€. Je demande que ce scénario soit chiffré
    dès maintenant, pas au moment où il s''imposera.


    ---


    ### 6. Le meilleur argument contre ma recommandation


    Le voici, formulé aussi fortement que possible : *« Le transfert ne dépend pas de nous. L''UMA n''a
    jamais accepté sous trois ans de prestations et nous n''y sommes que de quelques mois. Si son comité
    refuse, nous aurons consommé dix-huit mois à 1,8 %, perdu la fenêtre, et nous n''aurons ni transfert
    ni rendement. C est la seule option dont l''amplitude change réellement la trajectoire. »*


    Il tient partiellement, et il ne fait pas basculer la décision, pour deux raisons.


    L''asymétrie est décisive : **un transfert refusé nous laisse à ~17 M€, liquides, avec B, l''AG, le
    run-off choisi et quatre à cinq ans devant nous. Un C défaillant nous laisse liquidés, avec 4 200
    personnes non assurables et sans recours.** Un échec réparable ne s''échange pas contre un échec terminal,
    quelles que soient les probabilités affichées.


    Et les volets ne sont pas séquentiels : le dossier UMA et l''AG courent en parallèle. Nous ne misons
    pas tout sur le comité d''engagement — nous ouvrons deux portes en même temps, en gardant la troisième
    (B) armée.


    ---


    ### 7. Ce sur quoi j''engage la caisse


    **Verdict** — C rejetée par veto de ruine, non par arbitrage rendement/risque. B plafonnée à 4,0 M€
    et différée. A comme régime transitoire. Le transfert UMA est la décision principale.


    **Pire cas de l''option retenue, et qui l''encaisse** — L''UMA refuse et l''AG rejette le relèvement
    : réserve ~16,5 M€ dans 18 mois, extinction choisie à organiser vers 2029-2031. L''encaissent : les
    affiliés, avec une perte de couverture étalée, négociée et anticipée — et non instantanée.


    **Repli et déclencheur observable** — Réponse négative écrite de l''UMA, *ou* absence d''ouverture
    de dossier à 120 jours du dépôt : déclenchement immédiat du volet B (4,0 M€) et convocation de l''AG
    sur le scénario d''extinction choisie. Réserve constatée sous 15,0 M€ à toute date : suspension de
    toute exposition actions et bascule intégrale sur le volet 4.


    **L''observation qui renverserait ce choix** — Que le trésorier ou l''émetteur produise (i) une clause
    de sortie anticipée contractuelle sur la note, (ii) un versement de coupon en numéraire couvrant le
    déficit annuel, et (iii) une distribution de défaut certifiée par un tiers indépendant. Avec ces trois
    éléments, et une tranche ramenée à 2–3 M€, C redeviendrait discutable. En l''absence de l''un des
    trois, non. Symétriquement : si la direction financière démontre que les cotisations sont contractuellement
    indexées à 4,3 %, l''horizon revient à neuf ans et le volet 2 perd de son urgence — pas le volet 1.


    **Première action** — Lundi matin : instruction au directeur de constituer le dossier UMA, échéance
    de dépôt à 30 jours. Avant jeudi : confirmation écrite de la direction financière sur l''hypothèse
    d''indexation des cotisations, communiquée aux neuf administrateurs.


    ---


    Je porterai cette position au vote et je demanderai un vote nominal sur l''option C. Si le conseil
    l''adopte contre mon avis, je demanderai l''inscription au procès-verbal du calcul de trésorerie de
    la section 2 — l''épuisement de la poche liquide en année 4 dans toutes les branches — afin que chaque
    administrateur vote en connaissance de ce point précis.

    '
