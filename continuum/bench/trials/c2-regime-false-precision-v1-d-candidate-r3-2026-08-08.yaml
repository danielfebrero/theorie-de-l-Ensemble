response:
  text: '# Note au comité — fermetures de magasins


    **Objet : la décision de fermeture ne produit pas les 300 000 € attendus. Ce qu''il faut décider mardi
    à la place.**


    ---


    ## 1. Les trois magasins « en perte » ne perdent pas d''argent


    Le résultat par magasin est exact à l''euro près. Mais il inclut une part des frais de siège et de
    logistique (6,4 M€ au total), répartie au prorata du chiffre d''affaires. Cette part est une **convention
    de répartition, pas une dépense du magasin** : si le magasin ferme, la dépense reste et se redistribue
    simplement sur les 16 autres.


    Ce que chaque magasin apporte réellement au groupe, une fois sa quote-part de siège retirée :


    | | Résultat affiché | Quote-part siège incluse | **Apport réel au groupe** |

    |---|---|---|---|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |


    Les trois magasins couvrent leurs loyers, leurs salaires et leurs charges, et laissent 114 000 € pour
    financer le siège.


    **Conséquence directe :** fermer les trois dégrade le résultat du groupe de 114 000 €, avant même
    le premier euro de coût de fermeture. L''écart avec l''objectif actionnaire ne serait pas de 300 000
    € mais de 414 000 €.


    ## 2. Ce que coûterait chaque fermeture


    - **Chambéry** — 6 ans de bail restants, aucune clause de sortie, indemnité estimée 1,1 M€. Décaisser
    1,1 M€ pour perdre 32 000 € de contribution annuelle. Le magasin le plus isolé du réseau (92 km du
    suivant) : sa clientèle n''a nulle part où aller, donc pratiquement rien ne se reporterait. **Fermeture
    à écarter.** Le sujet Chambéry est un sujet de coûts (loyer au m², masse salariale rapportée au chiffre
    d''affaires), pas de fermeture.

    - **Nîmes** — murs en propriété, 1,9 M€. Ce n''est pas une décision de fermeture, c''est une décision
    d''actif. Vendre les murs rapporte de la trésorerie et crée un loyer permanent : au taux de marché,
    ce loyer dépasserait les 19 000 € que le magasin dégage aujourd''hui, et rendrait Nîmes réellement
    déficitaire. **À traiter séparément, et seulement si le besoin est de la trésorerie, pas du résultat.**

    - **Vitry** — le seul dont la sortie est gratuite (bail échu dans 7 mois, sans indemnité). C''est
    aussi celui qui apporte le plus (63 000 €), et ce chiffre est sous-estimé : 18 % de ses entrées sont
    des retraits de commandes web, dont le chiffre d''affaires est enregistré sur l''entité e-commerce.
    Vitry supporte le coût d''un service dont une autre entité encaisse la vente.


    À cela s''ajoute, pour n''importe quel site, un coût que le réseau n''a jamais payé : c''est la première
    fermeture de l''enseigne. Procédure collective avec le CSE, indemnités, délai de quatre à six mois
    au minimum, et un effet sur les 430 salariés qui ne se lit dans aucun tableau.


    ## 3. Où sont réellement les 300 000 €


    Dans les 6,4 M€ de frais de siège et de logistique — soit 337 000 € par magasin. **L''objectif représente
    4,7 % de ce poste.** C''est le seul gisement assez large pour être atteint sans détruire du chiffre
    d''affaires.


    Et c''est le même chiffre qui manque pour juger les fermetures : *quelle part des 6,4 M€ disparaît
    réellement quand un magasin ferme ?* Une partie (livraisons, encadrement régional) est sans doute
    variable. Personne dans cette maison ne sait aujourd''hui laquelle. Tant que ce chiffre n''existe
    pas, aucun plan de fermeture n''est chiffrable — et le travail pour l''obtenir est exactement celui
    qui produit le plan d''économies.


    ## 4. Ce qu''on décide mardi


    1. **Aucune fermeture n''est votée.** Aucune ne rapporte les 300 000 €, toutes en éloignent.

    2. **Chambéry sort du sujet fermeture** pour la durée du bail. Un plan de redressement de ses coûts
    propres est demandé sous 60 jours.

    3. **Vitry n''est pas fermé, mais le bail n''est pas renouvelé à l''aveugle.** Point d''attention
    urgent, à vérifier dès lundi : si le préavis du bail est de six mois — c''est l''usage —, la fenêtre
    de décision se referme dans quelques semaines, pas dans sept mois.

    4. **Un plan de 300 000 € sur les frais de siège et de logistique** est commandé au directeur financier,
    avec la décomposition demandée au point 5.

    5. **Une question est renvoyée à l''actionnaire** : 300 000 € de résultat récurrent, ou 300 000 €
    de trésorerie ? Les réponses n''ont rien à voir. À défaut de réponse, nous travaillons sur le résultat
    récurrent.


    ## 5. Ce qu''on engage d''ici là


    | Échéance | Action | Responsable |

    |---|---|---|

    | 48 h | Date exacte du préavis du bail de Vitry ; consigne qu''aucun congé ne soit délivré avant
    décision du comité | Direction juridique |

    | 15 jours | Reconstitution du compte de résultat des **19** magasins hors quote-part de siège. La
    clé au prorata du chiffre d''affaires pénalise mécaniquement les magasins à fort volume et faible
    marge : il est possible que nous discutions des trois mauvais magasins | Contrôle de gestion |

    | 15 jours | Mesure du flux de retraits web à Vitry : heures consommées, chiffre d''affaires enregistré
    chez e-commerce, refacturation normale entre entités | Contrôle de gestion + e-commerce |

    | 30 jours | Décomposition des 6,4 M€ en trois blocs : ce qui disparaît si un magasin ferme, ce qui
    est réductible sans fermeture, ce qui est incompressible | Direction financière |

    | 30 jours | Exploitation de la fermeture de Nîmes de mars 2024 (voir ci-dessous) | Contrôle de gestion
    |


    **Sur mars 2024.** Nîmes est resté fermé cinq semaines. C''est la seule observation réelle que nous
    possédions sur le report de clientèle d''un magasin vers ses voisins. Seuls les totaux mensuels des
    voisins subsistent, mais ils suffisent pour un ordre de grandeur, en les comparant à la même période
    de l''année précédente et à l''évolution du reste du réseau. Une précaution : une fermeture accidentelle,
    sans annonce ni redirection des clients, produit **moins** de report qu''une fermeture organisée.
    Le chiffre obtenu est donc un plancher, pas une estimation.


    À l''inverse, les 41 % de porteurs de carte ayant acheté dans deux magasins ne mesurent pas un report
    : ils décrivent les 23 % de clients les plus attachés, et un achat en déplacement n''est pas un trajet
    de 14 km consenti après la fermeture de son magasin. C''est un plafond. Le vrai report est entre les
    deux, et nous saurons dire où sous 30 jours.


    ## 6. L''objection la plus forte contre cette note


    *« Le raisonnement suppose que les frais de siège sont fixes. Si fermer trois magasins sur dix-neuf
    permet de supprimer une tournée logistique, un poste d''encadrement régional, une part de la paie
    — alors les frais baissent réellement et les fermetures paient. »*


    Cette objection est juste, et c''est la raison pour laquelle le point 5 du plan est la décomposition
    des 6,4 M€. Deux remarques cependant. D''abord, si l''on identifie 400 000 € de coûts de structure
    réellement supprimables, une grande partie l''est aussi **sans** fermer : la fermeture n''est pas
    ce qui autorise l''économie. Ensuite, la charge de la preuve est du bon côté : elle demande de nommer
    les lignes, pas d''invoquer un principe.


    ## 7. Ce qui nous ferait changer d''avis


    Un seul fait : que la direction financière démontre, ligne à ligne, que la fermeture des trois sites
    retire plus de **414 000 €** de frais de siège et de logistique en douze mois. Dans ce cas, le calcul
    s''inverse et le comité doit rouvrir le dossier.


    **Repli si le calendrier du bail de Vitry nous force la main avant d''avoir les mesures :** ne pas
    choisir à l''aveugle entre partir et se réengager neuf ans. Négocier un renouvellement court ou assorti
    d''une faculté de sortie à trois ans, et payer ce qu''il faut pour cette souplesse. Le coût d''une
    option est toujours inférieur au coût d''un engagement pris sans information.


    **Première action, lundi matin :** appel à la direction juridique sur le préavis de Vitry.


    ---


    Un dernier point, qui n''est pas financier. Les équipes des trois magasins n''ont jamais vu ces chiffres
    et n''ont jamais su qu''elles couvraient leurs coûts. Leur transmettre leur apport réel, et leur confier
    un mandat d''amélioration à 90 jours sur les postes qu''elles maîtrisent, coûte zéro euro et vaut
    mieux qu''une rumeur de fermeture qui circulera de toute façon dès mercredi.

    '
