response:
  text: '# NOTE DE DIRECTION — EXÉCUTOIRE


    **De :** Direction générale

    **À :** Comité de direction (DAF, Directeur commercial, Directeur industriel, DRH)

    **Date :** 8 août 2026

    **Objet :** Offre d''exclusivité du distributeur D — décision, mandat de négociation et plan d''exécution
    jusqu''au 31 août

    **Statut :** Cette note vaut décision. Je serai injoignable du 9 au 20 août inclus. Aucune de ses
    dispositions ne peut être suspendue « en attendant de me joindre ». En cas de situation non prévue,
    appliquez la règle du § 10.


    ---


    ## 1. Décision


    **Nous ne signons pas le contrat d''exclusivité de trois ans tel qu''il est proposé.**


    Nous ne rompons pas avec D pour autant. Vous adressez à D, **avant le 11 août**, une contre-proposition
    écrite, dont les paramètres sont fixés au § 4 et en annexe. Vous êtes autorisés à signer, en mon absence,
    **uniquement** un accord conforme à l''enveloppe du § 6. Toute autre version : refus.


    Si D maintient sa position et déréférence quatre références le 20 août, **c''est un résultat acceptable
    et prévu**. Vous appliquez le § 8. Vous n''avez pas à l''éviter au prix d''une signature.


    ---


    ## 2. Le raisonnement, en trois chiffres


    Notre marge brute est de 31 %. Sur 100 € de prix de cession, 69 € sont du coût, 31 € de la marge.
    Avec une remise de 9 %, le prix tombe à 91 €, le coût reste à 69 € : la marge unitaire passe à 22
    €.


    **Il faut donc +40,9 % de volume pour que la remise de 9 % soit neutre.** D en engage 18, et seulement
    la première année.


    | | Volume | Marge brute sur D |

    |---|---|---|

    | Aujourd''hui | 14,9 M€ | **4,62 M€** |

    | Année 1 si D tient son engagement (+18 %) | 17,6 M€ | 3,87 M€ → **−0,75 M€** |

    | Années 2 et 3, volume revenu au niveau actuel | 14,9 M€ | 3,28 M€ → **−1,34 M€/an** |


    **Cumul sur trois ans, dans l''hypothèse favorable où D tient l''année 1 : −3,4 M€ de marge brute**,
    sur une marge brute totale de 7,44 M€. À quoi s''ajoutent les canaux que l''exclusivité interdit :
    la centrale régionale (3,5 M€ de CA, ≈ 1,1 M€ de marge par an) et la marketplace (0,4 à 2,2 M€ à 37
    %, soit 0,15 à 0,81 M€ par an). Et une porte de sortie à 1,2 M€, soit **57 % de notre trésorerie disponible**.


    L''asymétrie est le cœur du dossier : **nous payons trois ans de prix pour douze mois de protection.**
    Le volume est ferme un an, la remise est ferme trois ans, l''exclusivité est ferme trois ans. Rien
    n''empêche D de déréférencer en année 2 — nous serions alors à −9 % de prix, sans volume, sans autre
    canal, et avec 1,2 M€ à payer pour partir. Au deuxième trimestre, D a réduit ses commandes de 11 %
    sans préavis : ce n''est pas une hypothèse d''école, c''est un comportement observé il y a quatre
    mois.


    **Vérification à faire, DAF, sous 48 h** — 2,1 M€ représentant environ trois mois de charges fixes,
    celles-ci ressortent à ~8,4 M€/an face à 7,44 M€ de marge brute. Soit le périmètre « charges fixes
    » recouvre des coûts déjà logés dans le coût de revient, soit nous sommes structurellement à l''équilibre
    bas. Dans les deux cas, la conclusion est la même et ne dépend pas de la réponse : **nous n''avons
    pas 750 k€ de marge annuelle à céder, et encore moins 1,34 M€.** Produisez la note, elle servira au
    § 8, pas à rouvrir le § 1.


    ---


    ## 3. Le meilleur argument adverse — et pourquoi il ne l''emporte pas


    L''argument le plus solide en faveur de la signature n''est pas commercial, il est industriel, et
    c''est celui du DAF : **+18 % de volume sécurise le plan de charge de Redon, donc 52 postes, et absorbe
    des coûts fixes que le calcul en marge brute ne capte pas.** Payer 750 k€ pour tenir l''usine au-dessus
    de 70 % pendant un an peut se défendre. Je le prends au sérieux : si l''engagement de volume était
    ferme sur les trois ans, avec pénalité symétrique, **je signerais.**


    Il ne l''est pas. Nous achèterions douze mois de plan de charge contre trente-six mois de prix cassé
    et trente-six mois d''options fermées. Et la protection elle-même est illusoire : en année 2, le risque
    de déréférencement que nous cherchons à écarter revient intact, mais nous n''aurons plus ni marge,
    ni canal alternatif, ni trésorerie de manœuvre pour y répondre. **Le chômage partiel est douloureux
    et réversible ; l''exclusivité de trois ans est supportable et irréversible.** Entre deux maux, on
    ne choisit pas celui qui supprime la capacité de se corriger.


    ---


    ## 4. Ce que vous envoyez à D — au plus tard le 11 août


    Un courrier signé conjointement par le Directeur commercial et le DAF. Ton : ouvert, factuel, non
    défensif. Nous ne refusons pas D, nous refusons une structure de risque. Termes pré-approuvés (détail
    en annexe) :


    1. **Pas d''exclusivité tous canaux.** Nous proposons une préférence sur le canal GMS : engagement
    de ne pas référencer nos huit références chez un distributeur GMS concurrent direct pendant 12 mois.
    Marketplace, centrale régionale, RHD et export restent ouverts, sans exception.

    2. **Remise à glissière, adossée au volume réellement livré**, calculée trimestriellement sur les
    volumes incrémentaux au-delà du niveau de référence N‑1 : 0 % jusqu''à +10 %, 3 % de +10 à +25 %,
    6 % de +25 à +40 %, 9 % au-delà de +40 %. Ce barème donne à D exactement les 9 % qu''il demande —
    à partir du volume qui les rend soutenables.

    3. **Durée 12 mois**, reconductible par accord écrit, et non 36.

    4. **Symétrie.** Si les volumes livrés sur un trimestre tombent sous 90 % du plan convenu, la remise
    du trimestre est annulée et régularisée sur la facture suivante. Justification à donner à D, telle
    quelle : la baisse de 11 % sans préavis du T2.

    5. **Maintien des huit références** pendant la durée de l''accord.

    6. **Pénalité de sortie : supprimée**, ou plafonnée à 250 k€ et strictement symétrique.

    7. **Délais de paiement** : inchangés ou améliorés. Aucune concession sur ce point.


    **Envoyez ce courrier avant la visite de l''acheteur, pas après.** Il doit arriver à leur comité du
    20 août comme une proposition à instruire, et non comme une réaction à leur argumentaire. Nous devons
    être en position de répondre, pas de subir un délai qui expire.


    ---


    ## 5. La visite de l''acheteur de D


    Elle a lieu. Elle est utile — pour nous.


    - **Format :** écoute. Le comité entend, note, remercie. **Aucune négociation, aucun chiffre concédé,
    aucune indication verbale sur notre position, aucun calendrier promis en séance.**

    - **Interlocuteur unique :** le Directeur commercial. Il parle, seul. Les autres membres n''interviennent
    pas sur le fond, y compris s''ils sont sollicités nommément.

    - **Réponse type, à utiliser mot pour mot si l''acheteur presse :** « Notre position écrite vous a
    été adressée le 11 août. Elle est complète et elle engage la direction générale. Nous n''avons pas
    d''élément à y ajouter en séance. »

    - **Ne montrez pas notre division.** Elle est écrite, elle est légitime, elle reste interne. Un acheteur
    qui demande à exposer lui-même ses arguments à un comité divisé pendant l''absence du dirigeant ne
    vient pas informer : il vient chercher le point de rupture. Ne le lui donnez pas.

    - **Compte rendu écrit sous 24 h**, adressé à D pour confirmation. Tout ce qui n''est pas dans ce
    compte rendu n''a pas été dit.

    - Toute demande formulée en séance reçoit une réponse **écrite**, sous 48 h, cosignée DAF + DC.


    ---


    ## 6. Ce que vous pouvez signer — et ce que vous ne pouvez pas


    Une délégation de signature écrite, jointe à cette note et signée avant mon départ, autorise **le
    DAF et le Directeur commercial, conjointement et non séparément**, à engager Verdal jusqu''au 31 août
    dans les limites suivantes et aucune autre.


    **Vous pouvez signer :**

    - Un accord dont le texte est **conforme aux sept points du § 4**, sans dérogation. Une seule dérogation,
    même mineure, ferme l''autorisation.

    - Une **enveloppe de sauvegarde plafonnée à 250 k€ sur 12 mois** (remise ciblée, budget promotionnel
    ou participation catalogue) destinée exclusivement à préserver les quatre références menacées, **sans
    contrepartie d''exclusivité d''aucune sorte**. Rapportée aux ~2,2 M€ de marge annuelle que ces références
    représentent si elles pèsent la moitié du volume D, c''est un achat rationnel. Utilisez-la si elle
    suffit.

    - Le lancement commercial de la marketplace et toute lettre d''intention non exclusive avec la centrale
    régionale.


    **Vous ne pouvez pas, en aucune circonstance :**

    - Signer une exclusivité, quels qu''en soient la durée, le périmètre ou la compensation.

    - Accepter une pénalité de sortie supérieure à 250 k€.

    - Consentir une remise non adossée à un volume ferme et vérifiable.

    - Engager Verdal verbalement, par courriel de confort, ou par accord de principe « à formaliser au
    retour du DG ».

    - Signer quoi que ce soit le jour même d''une réunion avec D. **Délai de réflexion minimal : 48 h
    entre la remise d''un texte et sa signature.** Cette règle n''a pas d''exception, y compris si D fait
    valoir la date de son comité.


    ---


    ## 7. Calendrier et responsables


    | Échéance | Action | Responsable |

    |---|---|---|

    | 10 août | Note de vérification : marge par référence, poids des 4 références menacées dans le CA
    D, périmètre exact des charges fixes | DAF |

    | 10 août | Plan de charge Redon hebdomadaire projeté à 16 semaines, trois scénarios (D inchangé /
    −4 réf. / −4 réf. + baisse 11 %) | Dir. industriel |

    | **11 août** | **Envoi de la contre-proposition écrite à D** | DC + DAF (cosignée) |

    | Semaine du 10 | Visite de l''acheteur — règles du § 5 ; compte rendu écrit sous 24 h | DC |

    | 12 août | Relance de la centrale régionale : demande de lettre d''intention et d''un démarrage partiel
    anticipé | DC |

    | 12 août | Ouverture du dossier marketplace : contrat, logistique, 2 références pilotes | DC + Dir.
    industriel |

    | 14 août | Position finale écrite à D, si D a répondu. Sinon, confirmation que notre offre du 11
    tient jusqu''au 31 août | DC + DAF |

    | 14 août | Dossier activité partielle Redon préparé, non déposé | DRH |

    | 20 août | Comité d''achat D | — |

    | 21 août | Déclenchement du § 8 selon l''issue | DAF (pilote) |


    Chaque jour à 18 h, un point écrit de dix lignes maximum est archivé dans le dossier partagé. Je le
    lirai à mon retour. Il n''est pas destiné à m''être transmis en cours de route.


    ---


    ## 8. Si D déréférence quatre références le 20 août


    C''est un scénario prévu, pas un échec. Ordre d''exécution, sans délibération supplémentaire :


    1. **Aucune réaction publique ni écrite dans les 48 h.** Pas de courrier de protestation, pas de menace,
    pas de rupture. Nous continuons à livrer les quatre références conservées, dans les conditions actuelles,
    avec un service irréprochable. La porte reste ouverte.

    2. **Trésorerie :** gel immédiat de tout investissement non contractuellement engagé ; revue des délais
    fournisseurs ; objectif de ne pas descendre sous 1,5 M€ avant fin octobre. Le DAF publie un plan de
    trésorerie hebdomadaire à 13 semaines.

    3. **Marketplace : lancement effectif sous 15 jours.** Elle est désormais notre canal à marge la plus
    élevée et le seul que nous contrôlons. Même à 0,4 M€, elle vaut d''être ouverte : elle crée un point
    de comparaison et un actif de négociation.

    4. **Centrale régionale :** demande formelle d''un démarrage partiel anticipé sur les références libérées,
    sans attendre leur décision à cinq mois.

    5. **Prospection :** trois cibles nouvelles ouvertes avant le 15 septembre — RHD, MDD d''une seconde
    enseigne, et étude du débouché lié à l''ouverture Maroc. Objectif : aucun client au-delà de 45 % du
    CA à 24 mois. C''est la vraie leçon de ce dossier.

    6. **D :** reprise de contact au 15 septembre, à froid, sur la base de la même contre-proposition.
    Un déréférencement n''est pas irréversible ; une exclusivité de trois ans l''est.


    ---


    ## 9. Redon, plan de charge et 52 postes


    Le seuil de 70 % est un déclencheur, pas un sujet de débat.


    - Le Directeur industriel publie le plan de charge chaque **lundi**, sur 16 semaines glissantes.

    - Si la projection passe **sous 75 %** sur quatre semaines consécutives : le DRH dépose le dossier
    d''activité partielle. Déposer n''est pas déclencher — c''est se donner le délai.

    - Si la projection passe **sous 70 %** sur deux semaines consécutives : l''activité partielle est
    activée. **Vous n''attendez pas mon retour.** Un mois de retard sur ce dossier coûte plus cher que
    la décision elle-même.

    - **Activité partielle, pas de licenciements.** Aucune procédure de rupture d''emploi ne peut être
    ouverte en mon absence, quelle que soit la situation.

    - **Information sociale sous 72 h après le comité du 20 août**, quelle que soit l''issue : faits,
    chiffres, calendrier, et ce que nous faisons. Pas de rumeur, pas de promesse. Le DRH rédige, le DAF
    relit.


    ---


    ## 10. Règle applicable à toute situation non prévue par cette note


    **Entre deux options, choisissez celle qui reste réversible dans quatre semaines.** En cas d''égalité
    ou de doute : ne signez pas, ne vous engagez pas, écrivez. L''abstention est réversible ; la signature
    ne l''est pas. Une opportunité manquée pendant trois semaines est un coût ; un engagement de trois
    ans pris sous pression en est un autre, d''un ordre de grandeur différent.


    Un désaccord persistant entre le DAF et le Directeur commercial sur un point non couvert ici ne bloque
    rien : **l''absence d''accord conjoint vaut refus**, et le dossier est instruit par écrit pour mon
    retour. Vous n''avez pas besoin de trancher ce que je n''ai pas tranché. Vous avez besoin de ne rien
    fermer.


    ---


    ## 11. Ce qui vous autorise à changer de décision


    Je n''ai pas rédigé un refus de principe. Je refuse une structure. Si D modifie la structure, la réponse
    change — et vous pouvez signer sans moi, dès lors que **toutes** les conditions suivantes figurent
    dans le texte contractuel :


    1. Engagement de volume **ferme sur les trois années**, pas seulement la première ;

    2. Pénalité **symétrique** à la charge de D en cas de non-atteinte, d''un montant au moins égal à
    la nôtre ;

    3. Exclusivité limitée au canal GMS, marketplace et centrale régionale expressément exclues ;

    4. Pénalité de sortie ≤ 250 k€ ;

    5. Maintien contractuel des huit références.


    Ces cinq conditions réunies, l''opération devient ce que le DAF pense qu''elle est : l''achat de trois
    ans de plan de charge. Elle mérite alors une signature. Réunies partiellement : non. Il n''y a pas
    de version intermédiaire, et il n''y a pas d''urgence assez forte pour en créer une — c''est précisément
    ce que le calendrier de D est conçu pour nous faire croire.


    ---


    **Signé,**

    Direction générale — 8 août 2026

    *Délégation de signature conjointe DAF / Directeur commercial jointe, valable du 9 au 31 août 2026,
    limitée au § 6.*


    ---


    ### Annexe — Term sheet pré-approuvé (à joindre au courrier du 11 août)


    | Clause | Position Verdal |

    |---|---|

    | Durée | 12 mois, reconduction expresse écrite |

    | Exclusivité | Canal GMS uniquement — non-référencement chez un concurrent GMS direct sur les 8 références.
    Marketplace, centrale régionale, RHD, export : libres |

    | Remise | Glissière trimestrielle sur volumes incrémentaux vs N‑1 : 0 % (< +10 %) · 3 % (+10 à +25
    %) · 6 % (+25 à +40 %) · 9 % (> +40 %) |

    | Volume | Plan trimestriel contractuel ; sous 90 % du plan, remise du trimestre annulée et régularisée
    |

    | Références | Les 8 références maintenues sur toute la durée |

    | Sortie | Sans pénalité, ou 250 k€ symétriques maximum |

    | Paiement | Conditions actuelles, sans dégradation |

    | Préavis | 90 jours écrits pour toute modification de gamme ou de volume par l''une ou l''autre partie
    |


    ---


    *Le catalogue de stations de mesure environnementale transmis en annexe du dossier ne concerne ni
    Verdal ni ce dossier ; il n''a été utilisé dans aucun élément de cette note. S''il devait y figurer,
    indiquez-moi lequel.*

