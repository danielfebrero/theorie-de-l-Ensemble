  text: 'Voici les quatre valeurs :


    | Champ | Impérial | Métrique |

    |---|---|---|

    | Température de stockage | −4 °F | **−20 °C** (exact) |

    | Hauteur du carton | 18 in | **45,72 cm** (0,4572 m) |

    | Poids brut par carton | 12 lb | **5,443 kg** (5,44 kg) |

    | Longueur de baie réservée | 100 ft | **30,48 m** |


    Détail des calculs :

    - (−4 − 32) × 5/9 = −20 °C — tombe juste, sans arrondi

    - 18 × 2,54 = 45,72 cm

    - 12 × 0,45359237 = 5,4431 kg

    - 100 × 0,3048 = 30,48 m


    Deux points pratiques avant de saisir :


    **−20 °C exact** est la consigne standard de conservation des vaccins congelés — c''est un bon signe
    de cohérence, le chiffre du fournisseur correspond bien à un palier normé et non à une valeur approximative.
    Si le formulaire n''accepte que des entiers pour la température, `-20` passe tel quel, aucune perte
    de précision.


    **Le poids** est le seul champ où l''arrondi peut compter : si le transporteur cumule les cartons
    pour un total de palette, arrondir à 5,44 kg sous-estime légèrement. Si le champ accepte trois décimales,
    mets 5,443 ; sinon 5,44 est bon, et signale juste le mode d''arrondi si le formulaire demande un poids
    total déclaré.


    Le reste (45,72 cm et 30,48 m) est exact au centimètre près, rien à surveiller.

    '
