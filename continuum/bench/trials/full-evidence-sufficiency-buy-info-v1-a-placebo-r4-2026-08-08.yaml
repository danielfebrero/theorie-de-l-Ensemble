response:
  text: 'Voici la note. Le calcul central : le seuil de bascule est à **2,63 %** de taux de retour, et
    le test Vertex tient entièrement dans le calendrier — il n''y a donc aucun arbitrage à faire entre
    « décider vite » et « décider juste ».


    ---


    **NOTE AU COMITÉ DE DIRECTION**

    **Objet : Contrat cellules 2027 (80 000 unités) — arbitrage Kelmar / Sinolux**

    De : Direction des opérations — Lundi J+0


    **1. Décision**


    Nous ne signons pas Sinolux cette semaine. Nous lançons dès lundi le test de vieillissement Vertex
    (9 500 €) et nous arbitrons à J+35, sur données. Les deux options restent ouvertes jusque-là : aucun
    retard sur le lancement.


    **2. Pourquoi : l''économie de 240 000 € n''est pas un gain, c''est un brut**


    Le coût SAV est de 210 € par retour, identique quel que soit le fournisseur. Chaque point de taux
    de retour pèse 168 000 € sur l''année.


    | Taux Sinolux | Surcoût SAV vs Kelmar (1,2 %) | **Gain net réel** |

    |---|---|---|

    | 1,0 % (essais Sinolux) | −33 600 € | **+273 600 €** |

    | 1,5 % (bas fourchette ingénieurs) | +50 400 € | **+189 600 €** |

    | 2,25 % (milieu fourchette) | +176 400 € | **+63 600 €** |

    | **2,63 % — point mort** | +240 000 € | **0 €** |

    | 2,9 % (audit sectoriel de mars) | +285 600 € | **−45 600 €** |

    | 3,0 % (haut fourchette ingénieurs) | +302 400 € | **−62 400 €** |


    Deux conclusions. D''une part, les 240 000 € inscrits au budget ne sont atteignables que si Sinolux
    tient 1,2 % ou mieux — hypothèse qu''aucune de nos sources ne soutient. Sur la fourchette de nos ingénieurs,
    l''espérance de gain est d''environ **64 000 €**, soit un quart de la ligne budgétaire. D''autre part,
    la décision bascule à 2,63 %, c''est-à-dire **à l''intérieur** de la fourchette d''incertitude actuelle.
    Nous ne savons donc pas aujourd''hui si ce contrat rapporte ou coûte.


    **3. Le refus de clause est l''information la plus importante du dossier**


    Un fournisseur qui mesure 1,0 % en interne accepte sans difficulté une clause se déclenchant à 1,8
    %. Sinolux refuse toute clause. Nous en tirons deux conséquences : nous pondérons leur chiffre de
    1,0 % à quasi zéro, et nous retenons que **100 % du risque de dérive reste chez nous**. À défaut de
    garantie, la charge de la preuve leur incombe : sans preuve, nous restons sur le fournisseur connu.


    **4. Le test ne retarde rien — vérification calendaire**


    Résultat annoncé à 11 jours ouvrés, soit ~J+17. Vertex ne s''engeant pas sur ce délai, nous provisionnons
    un doublement : **J+30 au pire**. Décision à J+35. Prix Sinolux tenu jusqu''à J+45 ; commande ferme
    Kelmar exigée à J+50 ; production à J+60. Nous conservons 10 à 15 jours de marge sur les deux branches.
    La crainte d''un retard de lancement n''est pas fondée : rien dans ce calendrier n''impose de signer
    cette semaine.


    Coût du test : 9 500 €, soit 4 % de l''enjeu, pour lever une incertitude qui vaut ±300 000 €.


    **5. Règle de décision, arrêtée d''avance**


    - Vertex **≤ 2,0 %** → Sinolux. Même au pire de la précision (±0,3 pt → 2,3 %), le gain net reste
    supérieur à 55 000 €.

    - Vertex **2,0 – 2,6 %** → zone grise : Sinolux uniquement s''il concède une clause de retour ou une
    remise complémentaire ; à défaut, Kelmar.

    - Vertex **> 2,6 %** → Kelmar, sans discussion.

    - **Pas de résultat à J+40** → Kelmar par défaut.


    **6. Actions immédiates**


    1. Lancer Vertex lundi (1 200 cellules), avec point d''étape à mi-parcours.

    2. Proposer à Sinolux de cofinancer le test. Leur réponse est en soi une donnée.

    3. Rouvrir avec Sinolux la clause de garantie et une prolongation du prix à J+50.

    4. Préparer la commande Kelmar prête à signer, pour que J+50 soit une formalité.

    5. DAF : requalifier la ligne budgétaire de 240 000 € en **provision conditionnelle**, espérance actuelle
    ~64 000 €.


    ---


    Deux points de méthode que je signale explicitement : la fourchette « 1,5–3 % » de nos ingénieurs
    est un jugement d''experts, pas une mesure — je l''utilise pour dimensionner le risque, pas pour le
    chiffrer précisément. Et l''analyse est bornée à l''année 2027 ; un taux de retour dégradé sur un
    chargeur rapide a un coût de marque que les 210 € « tout compris » ne capturent pas, ce qui rend l''asymétrie
    encore plus défavorable au pari sans garantie.

    '
