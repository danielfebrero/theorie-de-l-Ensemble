response:
  text: '## Position — lot F-2418, livraison Sodimarché du 3 juin


    Avant les trois rubriques demandées, le fait qui commande tout le dossier. Il vient de nos propres
    pièces, pas de celles du dépôt.


    | Heure | Événement | Pièce |

    |---|---|---|

    | 6 h 25 | Chargement terminé, produit à 3 °C | P1 |

    | 6 h 40 | Mention manuscrite « départ » | P2 |

    | 9 h 05 | Mise sous tension du groupe froid | P5 |

    | 11 h 12 | Sortie effective du site (horodatage automatique) | P3 |

    | 12 h 55 | Réception au dépôt, 1 792 barquettes | P4 |


    Entre 6 h 25 et 9 h 05 — **2 h 40** — le produit est chargé, le camion est à quai, et rien ne refroidit
    ni n''enregistre. Le camion reste ensuite sur site jusqu''à 11 h 12 (P3), soit 4 h 47 après la fin
    du chargement. Les 3 °C de P1 sont une mesure de départ, pas une mesure de maintien ; les relevés
    2,9–3,6 °C de P5 ne commencent qu''après 9 h 05 et attestent le **retour** en température, pas sa
    conservation. Un retour en température ne fait pas redescendre une flore.


    La mention « départ 6 h 40 » de P2 est contredite par P3, écriture automatique, sans autre sortie
    ce jour-là pour ce véhicule. C''est une mention manuscrite de notre chauffeur : la signature du réceptionnaire
    sur P2 est une signature de réception à 12 h 55, elle n''atteste rien de l''heure de départ. P7 va
    dans le sens de P3 (« attendu un moment »), pas dans celui de P2. **Nous rectifions cette mention
    nous-mêmes dans la réponse. Nous ne la laissons pas découvrir.**


    ---


    ### 1. Ce que l''entreprise reconnaît


    1. **Une rupture de la chaîne du froid au chargement, d''au moins 2 h 40, qui lui est imputable**
    (P1 + P5 + P3). Elle ne l''a pas subie : elle l''a produite, par un défaut de procédure de quai.

    2. **Une mention inexacte sur le bon de livraison n° 2418** (P2 vs P3), rectifiée à l''initiative
    de l''entreprise.

    3. **En conséquence, le principe de sa responsabilité** dans l''impropriété de la marchandise reçue
    — 1 792 barquettes (P4).


    Reconnaître le fait et le principe n''est pas reconnaître le montant. Les deux se traitent séparément,
    et le second est contesté.


    ### 2. Ce que l''entreprise conteste


    **a) La quantité.** P2, signé du chauffeur *et* du réceptionnaire, porte 1 840. P4 en réceptionne
    1 792. **48 barquettes manquent après double signature.** Aucune destruction ne peut être facturée
    au-delà de 1 792 (P4). Et l''écart appelle autre chose qu''une remise — voir engagement 1.


    **b) La portée probatoire de P6.** Nous ne contestons pas qu''une rupture ait une conséquence microbiologique
    : nos propres pièces la rendent plausible. Nous contestons que P6, en l''état, établisse **de combien
    et à quelle date**. Il y manque la date et l''heure de prélèvement, le procès-verbal, la chaîne de
    possession, le plan d''échantillonnage, l''accréditation du laboratoire. Trois barquettes sur 1 792,
    c''est 0,17 %. Surtout : entre 12 h 55 (P4) et le prélèvement, la marchandise était sous la garde
    du dépôt ; sans ses relevés de conservation sur cet intervalle, le comptage mesure un état à la date
    du prélèvement, pas à la livraison.


    **c) Les 21 400 €, globaux et non décomposés.** Rapportés à 1 792 barquettes, cela fait 11,94 € l''unité.
    La somme agrège donc marchandise, transport et pénalité sans les distinguer. Nous ne réglons aucun
    montant non ventilé, sans PV de destruction, sans prix contractuel unitaire et sans justification
    de la clause de pénalité.


    **d) La pénalité de rupture d''assortiment en son principe**, sous réserve de l''offre du § 5 : une
    rupture qu''on comble sous 48 h n''est pas la rupture que la clause vise à sanctionner.


    ### 3. Ce qui manque au dossier avant envoi


    Le juridique de l''assureur instruit sur pièces et renvoie ce qui n''est pas rattaché. En l''état,
    **ce dossier ne porte pas ses propres affirmations.** À numéroter avant expédition :


    - **P8 — le contrat.** Absent. Or les 0–4 °C, le seuil 10⁵, le délai de huit jours et la pénalité
    de plein droit en dépendent tous. Priorité absolue : sans lui, chaque phrase de la réclamation adverse
    est une affirmation sans pièce.

    - **P9 — la lettre de réclamation du dépôt et la preuve de sa date de réception.** C''est elle qui
    fait courir les huit jours, et **aucune pièce ne la date**. Tant qu''elle manque, le délai se compte
    depuis la date la plus défavorable.

    - **P10 — attestation écrite et signée du chauffeur.** P7 est un propos téléphonique : inutilisable
    tel quel.

    - **P11 — relevé technique d''alimentation du groupe froid** (voir § 6).

    - **P12 — carnet d''étalonnage et de maintenance de l''enregistreur.**

    - **P13 à P15 — à réclamer au dépôt :** PV de prélèvement, PV de destruction, facture ventilée.

    - **P16 — relevés de température du dépôt** entre 12 h 55 et le prélèvement.

    - **P17 — journal de quai du 3 juin :** quels autres lots sont partis dans la même vacation, avec
    la même procédure.


    ### 4. Ce que l''entreprise engage sous huit jours


    Daté depuis J = réception de la réclamation.


    **J+0, sans attendre le reste :**


    1. **Traçabilité des 48 barquettes.** Cette action passe avant le litige commercial. 21 400 € est
    une perte lourde mais rattrapable pour 34 salariés. Quarante-huit barquettes d''un lot à 4,2 × 10⁵
    (P6) parties en consommation, c''est une conséquence supportée par des tiers et que rien ne rattrape.
    Contrôle immédiat des stocks et retours, question écrite au dépôt et au transporteur, et **si elles
    ne sont pas localisées sous 48 h, notification selon procédure et information de la DDPP** — sans
    attendre l''issue du litige.

    2. **Blocage de la procédure de quai**, écrit et daté du jour : aucun BL émis sans enregistreur sous
    tension et trace démarrée, vérifié et contresigné ; heure de départ reprise du portique, jamais manuscrite.

    3. Vérification P17 : la même défaillance a-t-elle touché d''autres lots ce jour-là.


    **J+1 à J+3 :**


    4. **Déclaration à l''assureur**, avec le dossier numéroté comme ci-dessus, reconnaissance du § 1
    incluse. Aucune affirmation contraire à nos propres pièces : une déclaration inexacte exposerait la
    garantie à la nullité, ce qui transformerait une somme payable en somme impayable.

    5. **Réponse écrite au dépôt, en recommandé AR**, dans le délai, portant le § 1, le § 2 et l''offre
    du § 5.


    **J+3 à J+8 :**


    6. Mise en demeure de produire P13 à P16, délai fixé.


    ### 5. L''offre au dépôt


    Pas une consultation — un transfert :


    - **livraison de remplacement immédiate de 1 792 barquettes à nos frais**, qui comble le trou d''assortiment
    et retire son objet à la pénalité de rupture ;

    - **transmission de la trace complète de l''enregistreur à chaque livraison pendant 12 mois**, assortie
    d''un **droit contractuel du dépôt de refuser à quai, sans pénalité et sans justification, tout lot
    dont la trace est incomplète** ;

    - droit d''audit inopiné de notre quai pendant 12 mois.


    Cela coûte moins que la pénalité, et donne au dépôt un critère de refus objectif et vérifiable à la
    place d''un contentieux.


    ### 6. L''observation qui renverserait cette position


    Une seule, et elle est vérifiable avant l''envoi : **P11 — un relevé technique établissant que le
    groupe froid était alimenté par une prise de quai entre 6 h 25 et 9 h 05, l''enregistreur étant hors
    tension sur un circuit distinct.** Le « hors tension » de P5 décrit l''appareil ; il ne prouve pas
    par lui-même que le groupe ne tournait pas. Si ce relevé existe, la rupture tombe, il ne reste qu''un
    défaut d''enregistrement, et toute la réponse change. **À vérifier avant expédition, pas après.**
    À défaut, la rupture est établie par nos propres pièces et nous ne la contestons pas.


    ### 7. Pire cas, et repli


    **Si nous tenons cette position :** nous payons la valeur de 1 792 unités et le transport retour,
    l''assureur décline peut-être la garantie (l''inaction d''un groupe froid est une exclusion fréquente
    — *hypothèse, la police n''est pas au dossier non plus, à vérifier en même temps que P8*), et la pénalité
    d''assortiment est jugée due. Plafond : les 21 400 € intégralement à notre charge. C''est un mauvais
    tirage supportable, pas une ruine.


    **Si nous contestons la rupture :** P3 et P5 nous contredisent — *et le dépôt a vraisemblablement
    déchargé l''enregistreur à la réception, ce qui est une hypothèse et non une pièce* — et nous ajoutons
    à la somme la perte de la garantie et la perte du compte. C''est la seule branche irrattrapable du
    volet financier, et c''est nous qui l''ouvririons.


    **Repli, à déclencheur observable :** si à J+8 le dépôt n''a produit ni PV de prélèvement ni facture
    ventilée, aucun montant global n''est réglé ; nous proposons ou consignons la seule part non contestée
    — valeur de 1 792 unités au prix contractuel — et maintenons le reste en litige. Et si les 48 barquettes
    ne sont pas localisées à J+2, le volet sanitaire prend le pas sur le dossier commercial, quel que
    soit l''état de la négociation.


    ---


    **Trois affirmations de ce document sont des hypothèses, pas des constats de pièce**, et sont signalées
    comme telles ci-dessus : l''exclusion probable de la police, le déchargement de l''enregistreur par
    le dépôt, et le fait que le prix contractuel unitaire soit inférieur à 11,94 €. Elles orientent les
    vérifications ; elles ne fondent aucune position. Tout le reste est rattaché à une pièce numérotée
    — ou figure au § 3 parmi les pièces à produire.

