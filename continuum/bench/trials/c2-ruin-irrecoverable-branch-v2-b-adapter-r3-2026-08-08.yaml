response:
  text: '# Note du directeur au conseil d''administration


    **Objet :** options A / B / C — recommandation et résolutions proposées

    **Séance du jeudi**


    ---


    ## 1. La décision réelle n''est pas à l''ordre du jour


    Le dossier nous demande de choisir une allocation d''actifs sur un horizon de neuf ans. Ce n''est
    pas notre horizon.


    L''Union mutualiste de l''Atlantique n''a jamais repris un portefeuille dont la réserve représentait
    moins de **trois années de prestations**. Ce seuil monte de 4,3 %/an pendant que notre réserve baisse.
    Il ne reste pas neuf ans avant qu''il se referme :


    | | Prestations | Seuil (3 ans) | Réserve projetée | Marge |

    |---|---|---|---|---|

    | Aujourd''hui | 5,40 | **16,2** | 18,4 | +2,2 |

    | +12 mois | 5,63 | **16,9** | 17,5 | +0,6 |

    | +24 mois | 5,87 | **17,6** | 16,3 | **−1,3** |


    *(M€, sous A : +1,8 % sur la réserve, déficit courant 1,0 M€ croissant)*


    **La marge s''annule autour du 16ᵉ mois.** Le comité d''engagement de l''Union instruit en douze à
    dix-huit mois. Nous ne sommes pas en avance : nous sommes déjà à la limite. Ce chiffre ne figure nulle
    part dans la note du trésorier, et c''est le seul chiffre qui contraint réellement le calendrier de
    jeudi.


    Neuf ans, c''est le délai avant la liquidation. Seize mois, c''est le délai avant que la sortie solvable
    disparaisse.


    ---


    ## 2. Ce que je fais des trois options


    **C — je ne la présente pas au vote, et je ne la signe pas.** Trois raisons indépendantes, chacune
    suffisante.


    **a) C ne survit pas à son propre scénario favorable.** Après souscription, il reste **4,0 M€ liquides**.
    Les déficits cumulés atteignent 1,2 / 2,7 / 4,4 M€ aux années 1, 2 et 3. **La trésorerie est épuisée
    au cours de la troisième année**, avec quatre ans de blocage restants, sans sortie anticipée ni marché
    secondaire. Ce n''est pas la branche à 3 % : c''est la branche à 88 %. Une caisse ne paie pas 5,4
    M€ de prestations avec une plus-value latente non réalisable. Même en portant la note à sa valeur
    nominale au bilan, le seuil statutaire de 11 M€ est franchi vers la cinquième année — soit **quatre
    ans plus tôt que le statu quo**, dans le meilleur cas.


    **b) C détruit la seule sortie.** Un actif non coté, bloqué sept ans, sans valorisation de marché,
    ne sera pas retenu par le comité d''engagement d''un repreneur qui exige trois années de prestations
    en réserve. Souscrire C, c''est fermer le dossier Atlantique le jour de la signature.


    **c) C n''est probablement pas votable en l''état.** 78 % de la réserve sur une contrepartie unique,
    à sept ans, en face de passifs payables au mois : la dispersion et la congruence actif-passif y passent.
    Aucune délibération sans avis prudentiel et actuariel écrit.


    Sur l''analyse elle-même, trois erreurs de méthode, sans mise en cause de la bonne foi du trésorier
    :


    - **La notation A− porte sur la capacité de l''émetteur à honorer ce qu''il doit, pas sur ce qu''il
    doit.** Le risque de payoff d''une note structurée n''est pas son risque de crédit. Un émetteur A−
    qui promet 14 %/an sur sept ans non cotés porte un risque qui n''est pas dans la notation.

    - **La distribution 88 / 9 / 3 est celle de l''émetteur**, non auditée, non contradictoire.

    - **« C domine B dans 94 % des trajectoires » est le mauvais critère.** Une caisse liquidée ne participe
    pas aux périodes suivantes : la moyenne d''ensemble et la moyenne temporelle divergent dès qu''il
    existe une barrière absorbante. Et nous ne jouons ce tirage qu''une fois, sans mutualisation possible.
    3 % non répétable sur 4 200 personnes non réassurables, ce n''est pas du bruit — c''est notre seule
    observation.


    Que deux caisses aient souscrit l''an dernier nous apprend qu''un produit de sept ans a un an. C''est
    de l''exposition corrélée, pas une validation.


    **B — reportée.** Le trésorier a raison sur un point : B seule ne referme pas l''écart. Mais son défaut
    n''est pas là. Le pire décile ramène la réserve à **15,8 M€, sous le seuil de 16,2 M€** : une chance
    sur dix de détruire immédiatement la fenêtre de transfert, pour un gain espéré de 0,3 M€/an. Le rapport
    est mauvais tant que le dossier Atlantique est ouvert. Si le conseil souhaite néanmoins un signal,
    je propose un **plafond de 2,5 M€** (pire décile → 17,5 M€, seuil préservé) — en disant clairement
    que cela rapporte environ 0,1 M€/an et ne change rien au fond.


    **A — retenue par défaut, pour dix-huit mois, et pour une seule raison :** pendant la fenêtre de transfert,
    la fonction de la réserve n''est pas de rapporter, mais **de valoir trois années de prestations à
    une date donnée**. Seule A garantit la valeur à cette date. Ce n''est pas une stratégie, c''est une
    posture de conservation assumée.


    ---


    ## 3. L''argument le plus fort contre ma position


    Il mérite d''être écrit tel qu''il sera dit jeudi : *« Vous préférez une mort lente certaine à 88
    % de chances de tout résoudre. 14,4 M€ à 14 % sur sept ans font 36 M€ — cela règle définitivement
    le problème. Vous sacrifiez 88 % par peur de 3 %, et l''Union peut très bien refuser. »*


    Trois réponses.


    **La branche à 88 % est inatteignable** : la caisse cesse de pouvoir payer ses prestations à l''année
    3, la note arrive à échéance à l''année 7. On ne perçoit pas un rendement qu''on n''atteint pas. Ce
    n''est pas une divergence d''appétit au risque, c''est de l''arithmétique de trésorerie.


    **Le scénario défavorable n''est pas « la caisse s''arrête »**, il est *combien reste-t-il aux affiliés*.
    Liquider à 11 M€ et liquider depuis 4,7 M€ — ou depuis une note invendable bradée par un liquidateur
    — ce n''est pas le même montant pour 4 200 personnes que personne ne réassurera.


    **Le refus de l''Union n''est pas établi : nous ne l''avons pas saisie.** On nous demande d''engager
    78 % de la réserve pour contourner une démarche que nous n''avons pas entreprise.


    Je ne promets pas la survie. Je promets que nous ne perdons pas le droit de choisir comment cela se
    termine.


    ---


    ## 4. Résolutions que je soumets jeudi


    1. **Mandat de saisine de l''Union mutualiste de l''Atlantique**, dossier déposé sous 60 jours. Mandat
    au directeur, assisté d''un actuaire indépendant.

    2. **Revue actuarielle indépendante de la dérive de 4,3 %.** Cohorte amiante à 61 ans d''âge moyen
    : l''incidence des pathologies s''élève jusqu''à la décennie 70-80. Le chiffre de neuf ans est probablement
    optimiste. Nous ne le communiquerons ni à l''Union ni à l''AG avant validation.

    3. **Audit de la charge transférable au régime AT/MP.** Les affections reconnues au titre des tableaux
    30 et 30 bis sont prises en charge à 100 % du tarif de responsabilité par la branche AT/MP, non par
    la complémentaire. Chiffrage sous 90 jours, avec accompagnement des affiliés à la déclaration. C''est
    le seul levier qui agisse sur les prestations elles-mêmes plutôt que sur le rendement de la réserve
    — à quantifier avant d''en tirer une conclusion.

    4. **AG extraordinaire**, non pour redemander 6 % — 6 % rapportent 0,26 M€ contre un déficit de 1,0
    M€ croissant, c''est probablement pourquoi la mesure a été rejetée — mais pour présenter la date de
    liquidation, la fenêtre de transfert, et soumettre le transfert aux adhérents.

    5. **Rejet de C**, et report de B (plafond 2,5 M€ si le conseil le souhaite).

    6. **Point de procédure**, sans mise en cause : communication écrite de toute rémunération de placement
    ou apport d''affaire liée au dossier C, préalablement à toute délibération. Formalité usuelle.


    ---


    ## 5. Ce sur quoi je m''engage


    - Je dépose le dossier Atlantique **sous 60 jours**.

    - **Indicateur unique de pilotage**, présenté à chaque conseil : *réserve / 3 × prestations annualisées*,
    avec sa date. Aujourd''hui 1,14. **Condition d''arrêt : sous 1,05, la fenêtre de transfert est réputée
    fermée** et le conseil est convoqué sous 30 jours pour arrêter un plan d''extinction ordonnée — décidé
    par nous, maximisant le reversement aux affiliés et la portabilité négociée, plutôt qu''une liquidation
    de plein droit subie au seuil de 11 M€.

    - Si l''Union refuse, **conseil réuni sous 30 jours** avec les alternatives chiffrées, y compris ce
    plan d''extinction.

    - **Je ne signerai pas C.** Si le conseil l''adopte contre mon avis, je demande que mon opposition
    et les motifs ci-dessus soient portés au procès-verbal.


    Le trésorier a raison sur l''essentiel : le statu quo est une condamnation. Il se trompe sur l''horizon,
    pas sur le diagnostic. La sortie ne se joue pas sur neuf ans de rendement — elle se joue sur seize
    mois d''éligibilité.

    '
