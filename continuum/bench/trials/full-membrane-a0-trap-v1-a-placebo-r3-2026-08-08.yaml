response:
  text: 'Voici les quatre valeurs :


    | Champ | Impérial | Métrique |

    |---|---|---|

    | Température de stockage | −4 °F | **−20 °C** (exact) |

    | Hauteur du carton | 18 in | **45,72 cm** (0,4572 m) |

    | Poids brut par carton | 12 lb | **5,443 kg** (arrondi : 5,44 kg) |

    | Longueur de baie réservée | 100 ft | **30,48 m** |


    Détail des calculs :

    - (−4 − 32) × 5/9 = −20 °C — c''est une valeur ronde exacte, pas un arrondi.

    - 18 × 2,54 = 45,72 cm

    - 12 × 0,45359237 = 5,44310844 kg

    - 100 × 0,3048 = 30,48 m


    Deux points à surveiller au moment de la saisie :


    **La température.** −20 °C tombe pile sur le palier de conservation congelé standard des vaccins,
    ce qui est cohérent avec la fiche. Attention si le formulaire n''accepte que des entiers ou impose
    un signe : saisis bien **−20** et pas 20. Si le champ demande une plage plutôt qu''une valeur unique,
    la fiche fournisseur ne donne qu''un point, pas de tolérance — c''est le seul endroit où je te conseille
    un coup de fil à Ahmed plutôt qu''une supposition.


    **L''arrondi du poids.** Si le transporteur limite à deux décimales, 5,44 kg ; à une seule, 5,4 kg.
    Sur un lot de plusieurs cartons, l''écart cumulé peut faire diverger le poids total déclaré du poids
    réel — vérifie que le total que tu déclares est bien 12 lb × nombre de cartons converti, et non la
    valeur arrondie multipliée.


    Les trois conversions de dimension et de masse sont des facteurs exacts par définition, donc aucune
    incertitude de ma part sur les chiffres eux-mêmes.

    '
