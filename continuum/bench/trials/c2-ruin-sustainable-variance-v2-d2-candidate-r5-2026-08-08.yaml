response:
  text: '# Note au conseil — Arbitrage Sedamex / Nordwerk

    **Objet :** recommandation sur les 18 prochains mois — options exclusives

    **Date :** conseil du vendredi


    ## Recommandation


    **Option B — installation de la ligne Nordwerk.** Ferme, sous deux conditions internes précisées en
    fin de note.


    ## Le critère qui tranche


    Ce n''est pas l''espérance de gain, c''est la survie. Une décision irréversible se juge d''abord sur
    son pire cas, pas sur sa moyenne.


    **Pire cas de l''option B, tout cumulé sur la période :**


    | | Aujourd''hui | Pire cas (échec + dividende) | Seuil |

    |---|---|---|---|

    | Fonds propres | 3,4 M€ | **2,3 M€** | covenant 1,2 M€ |

    | Trésorerie | 2,6 M€ | **1,5 M€** | ≈ 9 mois de masse salariale |


    Sorties maximales sur 18 mois : 700 k€ de dividende (exigible dans les deux options) + 400 k€ de perte
    plafonnée = 1,1 M€. À chaque clôture trimestrielle, y compris la plus tendue (dividende du 10ᵉ mois
    puis pénalité au 12ᵉ), les fonds propres restent **1,1 M€ au-dessus du covenant**. Pour rompre le
    covenant, il faudrait creuser un trou supplémentaire de 1,1 M€ que **aucune clause de ce contrat ne
    peut produire** : pas de caution personnelle, pas de défaut croisé, pas de sûreté sur l''actif industriel,
    carnet de commandes non gagé, dette nette nulle.


    **Conclusion : le pire cas de B est douloureux, il n''est pas mortel.** C''est de la variance, pas
    de la ruine. Le veto ne s''applique pas.


    ## Ce que vaut le pari


    Raisonné en écart par rapport à Sedamex (qui rapporte 200 k€ certains) :


    - Succès (60 %) : **+700 k€** par rapport à A

    - Échec (40 %) : **−600 k€** par rapport à A (400 k€ de perte + 200 k€ de marge Sedamex abandonnée)

    - Espérance : **+180 k€** en faveur de B


    **Point de bascule : 46 %.** En dessous de 46 % de probabilité de succès, Sedamex l''emporte. Notre
    estimation est de 60 %. Le débat de vendredi ne porte donc pas sur « 40 %, c''est beaucoup » — il
    porte sur une seule question : notre estimation est-elle fausse de 14 points ?


    ## Réponse au directeur financier


    Son objection est la bonne question posée au mauvais endroit, et je retiens sa part utile.


    **« On ne joue pas la maison. »** Exact — et nous ne la jouons pas. La mise maximale est de 400 k€,
    soit 11,8 % des fonds propres et 2,4 mois de masse salariale, contractuellement plafonnée et sans
    recours sur le patrimoine industriel ni sur le dirigeant. La maison serait en jeu si la perte était
    non bornée, financée par dette, adossée à une caution ou à un nantissement du carnet. Aucune de ces
    conditions n''est réunie.


    **Le cas Tremay.** Il ne se compare pas sur le résultat, il se compare sur la structure — et c''est
    là qu''il ne tient pas. Ce qui tue une entreprise de notre taille, c''est une exposition non plafonnée
    ou un financement par dette qui déclenche un défaut. Tant qu''on ne nous montre pas que Tremay avait,
    comme nous, une perte plafonnée à 12 % de ses fonds propres, zéro dette nette et 2,6 M€ de trésorerie,
    ce dossier nous renseigne sur une issue, pas sur notre exposition. Un cas contre onze installations
    documentées.


    **Ce que je retiens de lui.** L''argument fort contre B n''est pas celui qu''il avance, c''est celui-ci
    : les 60 % viennent de notre propre bureau d''études, qui porte le projet, sur 11 sites dont personne
    d''extérieur n''a audité la comparabilité. Sur 11 observations, l''intervalle de confiance statistique
    englobe le seuil de 46 %. **Cet argument ne renverse pas la décision — il fixe ses conditions.** D''où
    les deux conditions ci-dessous, dont la seconde lui donne un pouvoir réel, et non un avis consultatif.


    ## Conditions de la signature


    1. **Vérification externe de la comparabilité des 11 installations** avant signature (technicien indépendant,
    coût marginal, quelques semaines). Si la comparabilité est démentie au point de ramener la probabilité
    sous 46 %, nous basculons sur Sedamex sans discussion. *Si Sedamex exige une réponse avant que cette
    vérification puisse aboutir, c''est le seul élément susceptible de modifier ma recommandation vendredi,
    et il doit être posé en séance.*

    2. **Le directeur financier détient le déclencheur d''échec.** Il définit les jalons techniques observables
    aux 3ᵉ et 6ᵉ mois (cadence, taux de rebut, disponibilité) et dispose du **pouvoir de constater l''échec
    sans arbitrage de la direction générale**. Constater tôt vaut de l''argent : la pénalité est due au
    plus tard au 12ᵉ mois, la constater au 6ᵉ arrête la consommation de ressources et fige la perte au
    plafond au lieu de la laisser dériver.


    ## Repli et première action


    **Repli :** jalon du 6ᵉ mois non atteint → échec déclaré, 400 k€ payés immédiatement, ligne arrêtée,
    retour au plan d''affaires à l''équilibre. Aucune reprise sans décision expresse du conseil.


    **Observation qui renverserait ce choix :** un écart de substrat, de volume ou d''intégrateur sur
    les 11 sites de référence ramenant la probabilité de succès sous 46 %. Ou l''apparition, à la relecture
    du contrat, d''une caution, d''un défaut croisé ou d''une sûreté — auquel cas le plafond de 400 k€
    n''en est plus un et l''objection du directeur financier devient décisive.


    **Première action, lundi :** relecture contradictoire du contrat Nordwerk par notre conseil sur ces
    trois clauses, et mandat de vérification des 11 sites.


    ---


    Deux points que je signale explicitement, hors note : je suppose la provision de 400 k€ comptabilisée
    à la constatation de l''échec (elle ne change pas la conclusion — le covenant tient à toutes les dates
    de test quel que soit le moment de la constatation), et l''échéance de réponse à Sedamex n''est pas
    connue de moi, alors que c''est la seule contrainte capable de forcer la main du conseil.

    '
