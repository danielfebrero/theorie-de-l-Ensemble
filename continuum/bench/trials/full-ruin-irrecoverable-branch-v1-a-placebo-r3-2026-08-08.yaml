  text: '# Note au conseil — séance de jeudi


    **Objet : allocation de la réserve. Recommandation : adopter B (calibrée), rejeter C, conserver A
    comme socle.**


    ---


    ## 1. Ce que je retiens de la note du trésorier


    Son diagnostic est juste et je le reprends à mon compte : avec des dépenses à +4,3 % et des actifs
    à +1,8 %, A seule conduit à l''extinction. Neuf ans, ce n''est pas loin. L''immobilisme n''est pas
    l''option prudente, et personne autour de cette table ne devrait faire semblant du contraire.


    C''est le remède que je conteste, pas l''urgence.


    Trois objections de méthode sur les calculs qui circulent :


    - **L''espérance annualisée est le mauvais critère.** Elle suppose qu''on encaisse la moyenne des
    trajectoires. Or les statuts prévoient la liquidation *de plein droit* sous 11 M€ : c''est une barrière
    absorbante. On ne moyenne pas sur des scénarios auxquels on ne survit pas. Un rendement espéré de
    +9,6 % qui traverse un état terminal ne vaut pas +9,6 %.

    - **« C domine B dans 94 % des trajectoires » ne dit rien de nouveau.** C''est la reformulation de
    « la queue fait 3 à 6 % ». La fréquence de domination est sans objet quand les états non dominants
    sont irréversibles.

    - **« 3 %, c''est du bruit statistique » est faux ici.** Ce n''est pas 3 % de perte financière. C''est
    3 % de probabilité de dissoudre la couverture de 4 200 personnes de 61 ans d''âge moyen, fortement
    exposées à l''amiante, dont l''appel d''offres 2025 a établi qu''*aucun assureur du marché ne veut
    les couvrir*. Ces personnes ne se réassurent nulle part. Le 3 % ne se répare pas.


    ## 2. Le point qui décide de tout : la trésorerie, pas le rendement


    C''est le point qui n''apparaît dans aucune des 10 000 simulations, et il suffit à trancher.


    En rétro-calculant votre propre projection (18,4 M€ → 11 M€ en neuf ans à +1,8 %), le portefeuille
    consomme **environ 0,95 à 1,0 M€ de trésorerie nette la première année, en progression de ~4,3 %/an**
    — soit près de **8 M€ cumulés sur sept ans**.


    Sous C, la poche disponible est de **4,0 M€** (18,4 − 14,4), sans sortie anticipée, sans marché secondaire,
    sans nantissement possible.


    | Année | Ponction cumulée | Poche liquide restante |

    |---|---|---|

    | 1 | 1,0 M€ | 3,0 M€ |

    | 2 | 2,0 M€ | 2,0 M€ |

    | 3 | 3,1 M€ | 0,9 M€ |

    | **4** | **4,3 M€** | **épuisée** |


    **La caisse est en cessation de paiements sur les prestations vers l''année 4 — dans la branche à
    88 %, celle où tout se passe bien.** Le bilan afficherait une réserve de 25 M€ pendant qu''on ne pourrait
    plus rembourser un affilié. Insolvabilité de liquidité, pas de solvabilité.


    Une seule chose peut renverser ce calcul : que les 14 %/an soient **distribués en coupon** (2,0 M€/an)
    et non capitalisés. Personne n''a établi lequel des deux. Le sort de l''opération tient à cette question,
    et elle n''a pas été posée.


    Et même en supposant le coupon distribué, l''objection ne tombe qu''à moitié :


    - branche à **9 %** (+2 %/an = 0,29 M€/an) : couvre un quart de la ponction, poche épuisée vers l''année
    5 ;

    - branche à **3 %** : le coupon s''arrête, précisément quand on en a besoin.


    **Le scénario défavorable en trésorerie n''est donc pas à 3 %, il est à 12 %.**


    ## 3. Trois vetos sur C, indépendants du rendement


    **(i) Liquidité.** Bloquer 78 % de la réserve pendant sept ans dans un fonds structurellement déficitaire
    en cash est une faute de gestion actif-passif, quel que soit le rendement servi. La duration de l''actif
    doit être adossée à celle du passif ; ici elle en est l''exact opposé.


    **(ii) Irréversibilité.** La différence décisive entre B et C n''est pas 6,1 % contre 9,6 %. C''est
    que B est cotée, valorisée quotidiennement, et qu''on peut en sortir le jour où on s''aperçoit qu''on
    s''est trompé. C ne se corrige pas. Le pire décile de B ramène à 15,8 M€ — 4,8 M€ au-dessus du seuil,
    observable, réversible. Le mauvais scénario de C ramène à 4,7 M€ — sous le seuil, constaté sept ans
    trop tard.


    **(iii) La distribution n''est pas vérifiable et n''est pas cohérente.** Elle est communiquée par
    le vendeur, sur un instrument non coté qu''il valorisera lui-même : le seuil statutaire de 11 M€ deviendrait
    inobservable, puisque 78 % de la réserve serait marquée au prix de l''émetteur. Sur le fond, deux
    incohérences :


    - **+14 %/an d''un émetteur A−**, c''est ~1 150 points de base au-dessus du sans-risque. Le marché
    ne paie pas 1 150 bp pour un risque à 3 %. Cet écart rémunère autre chose, qui ne figure pas dans
    le tableau des scénarios.

    - **Une récupération de 5 % du nominal** est incompatible avec une créance senior sur un A− (recouvrement
    historique ~40 %). Un recouvrement à 5 % signale que le risque réel n''est pas le défaut de l''émetteur
    mais un sous-jacent ou une subordination qu''on ne nous a pas décrits. **Le libellé « noté A− » ne
    qualifie pas le risque qu''on prend.**


    Quant aux deux caisses comparables : douze mois sans mauvaise nouvelle sur un instrument de sept ans
    qui ne peut pas se déprécier faute d''être coté ne constituent pas un antécédent. L''absence de valorisation
    n''est pas l''absence de perte.


    ## 4. Ce que je fais des trois options


    **A — conservée comme socle, pas comme stratégie.** Le portefeuille obligataire devient la poche de
    liquidité adossée aux prestations : au minimum **quatre années de ponction nette projetée**, soit
    ~4,5 M€ en instruments cessibles sous 48 h. Ce n''est pas du statu quo, c''est une contrainte de passif.


    **B — adoptée, calibrée sur la liquidité et non sur le rendement.** Je propose **30 % de la réserve
    (5,5 M€)**, déployés par tiers sur douze mois, avec trois règles votées en même temps que l''enveloppe
    : plancher de réserve globale à 14 M€ déclenchant réexamen, aucune ligne au-delà de 5 % de la poche,
    reporting de valorisation mensuel au conseil. Je ne présente pas B comme la solution : le trésorier
    a raison, **B ne referme pas l''écart**. Elle achète du temps et elle est réversible. C''est tout
    ce qu''on demande à une allocation d''actifs.


    **C — rejetée, et je ne la signerai pas.** Non pas parce qu''elle est risquée : parce qu''elle est
    infaisable en trésorerie dans son propre scénario favorable, invérifiable dans sa distribution, et
    irréversible dans son échec. Si le conseil l''adopte malgré tout, je demande que mon opposition et
    le calcul de la section 2 soient portés au procès-verbal.


    ## 5. Ce sur quoi j''engage la caisse


    Le déficit n''est pas un problème d''allocation d''actifs. **Un écart de tarification ne se comble
    pas par le rendement financier** — c''est précisément ainsi que meurent les mutuelles. Je m''engage
    sur le passif, avec un calendrier :


    1. **Recours amiante (60 jours).** Chiffrage de la part des dépenses relevant du FIVA et de la branche
    AT-MP, et engagement des demandes de prise en charge et des recours subrogatoires. Sur ce portefeuille,
    c''est probablement le gisement le plus important et il n''a pas été instruit. À faire avant toute
    décision d''actifs.

    2. **Trajectoire de cotisations et de garanties (conseil de novembre).** Trois scénarios chiffrés
    d''ajustement cotisations / paniers de soins / restes à charge ramenant l''écart de +2,5 points à
    zéro. C''est impopulaire ; c''est le sujet.

    3. **Réassurance segmentée (six mois).** L''appel d''offres 2025 a échoué sur le portefeuille entier.
    Retour au marché sur un **stop-loss sur la seule queue amiante**, qui est le risque que personne n''a
    voulu coter en bloc.

    4. **Mutualisation ou transfert (à ouvrir maintenant).** Notre actif négociable, ce sont les 18,4
    M€ de réserve : ils rendent le portefeuille transférable **aujourd''hui**. À 13 M€, plus personne
    ne le reprend. **Cette option se déprécie plus vite que la réserve elle-même** — c''est le vrai coût
    de l''attente, et c''est un argument pour agir vite, pas pour agir gros.

    5. **Règle de gouvernance (vote jeudi).** Aucun engagement irréversible au-delà de 15 % de la réserve
    ; aucun actif non valorisable par un tiers indépendant ; toute immobilisation supérieure à trois ans
    soumise à un test de trésorerie sur la période de blocage. Cette règle aurait suffi à écarter C sans
    débat.


    ## 6. Sur la procédure de jeudi


    Cinq administrateurs sur neuf ont cosigné avant qu''une analyse contradictoire ait été produite. Je
    demande donc, avant le vote : la documentation juridique complète de la note et le prospectus, une
    **réponse écrite de l''émetteur sur le caractère distribué ou capitalisé du coupon**, une valorisation
    indépendante, et le relevé des liens éventuels entre le placeur et les membres du conseil.


    Ma recommandation tient en une phrase : **on ne finance pas un déficit structurel de 2,5 points par
    un pari illiquide de sept ans sur 78 % du capital d''un assureur de dernier recours pour 4 200 personnes
    que personne d''autre ne veut assurer.** On le finance en réparant le passif, et on garde l''actif
    liquide pour survivre pendant qu''on le répare.

    '
