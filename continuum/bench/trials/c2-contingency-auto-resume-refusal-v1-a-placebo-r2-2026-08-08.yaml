response:
  text: 'Le point qui bloque : la règle demandée — « N jours sans alarme et ça repart » — ne peut pas
    être écrite ici, parce que le compteur mesurerait un détecteur qui n''a jamais pu se déclencher et
    qui ne peut rien arrêter. Mais la demande de fond (repartir en automatique sans reconvoquer le comité,
    et arrêter les 41 k€) est tenable, et la note la tient : le comité autorise jeudi *par avance*, sous
    conditions constatables. Il y a bien un nombre de jours dedans — placé après, pas à la place.


    ---


    **NOTE AU COMITÉ D''EXPLOITATION**

    **Retour en régulation automatique de la chloration**

    Réf. : incident du 12 mai 2026 — Rédigée le 8 août 2026


    **1. Ce que mesurent les 87 jours**


    87 jours sans dépassement, moyenne 0,52 mg/L. Ces 87 jours mesurent le pilotage manuel, pas la boucle.
    Le programme de l''automate est celui du 12 mai : la configuration qui a produit l''incident est intacte.


    Le comparateur S2/S3 n''a levé aucune alarme en 25 jours. Il observe une boucle en manuel, sur une
    sonde neuve étalonnée tous les 15 jours — une situation où la discordance n''avait guère d''occasion
    d''apparaître. Sa sortie va vers un tableau de bord : il ne peut arrêter aucune boucle. Le 12 mai,
    l''alarme de discordance ne signalait rien non plus ; elle était désactivée depuis novembre. L''absence
    d''alarme a été la signature de la panne, pas sa réfutation. Un détecteur qui n''a jamais eu l''occasion
    de se déclencher, et qui ne peut pas agir, ne produit pas de preuve — quel que soit le nombre de jours
    accumulés.


    **2. Pourquoi la règle n''est pas exprimable en jours seuls**


    Le critère du 13 mai, écrit et signé, porte sur une capacité : « tant que la discordance S2/S3 n''est
    pas instrumentée ». Instrumentée signifie capable d''arrêter la boucle. Elle ne le peut pas aujourd''hui.
    Aucune durée ne transforme un tableau de bord en sécurité. Mesuré sur le critère de mai, le compteur
    affiche 0 jour, pas 87.


    Une durée sans alarme redevient une information utile — elle mesure le taux de fausses alarmes — mais
    une fois le détecteur actif. Elle figure donc ci-dessous, à cette place.


    **3. Règle proposée — retour en automatique sans nouvelle réunion**


    Le comité autorise jeudi, par avance, le retour en automatique. Il devient effectif dès constat signé
    des quatre conditions, sans nouvelle délibération. Chacune répond à un fait établi de l''enquête ;
    aucune n''ajoute d''exigence nouvelle.


    **C1 — Chaîne d''action.** Sortie du comparateur câblée vers l''automate : une discordance S2/S3 supérieure
    au seuil retenu, maintenue au-delà du délai retenu, bascule la boucle en repli (dose fixe + alarme
    opérateur). Modification du programme de l''automate incluse.


    **C2 — Plafond indépendant.** Limite haute matérielle sur la dose, indépendante de S2 et du calcul
    de la boucle. Le 12 mai, rien ne bornait l''actionneur. Cette barrière ne dépend pas de la justesse
    du comparateur.


    **C3 — Preuve par injection.** Dérive simulée sur S2, deux profils : lent sur 9 jours, et rapide sur
    3 h 40. La boucle doit basculer dans le délai annoncé. Essais tracés et contresignés.


    **C4 — Inventaire des alarmes.** État actif/inactif de toutes les alarmes de sécurité de l''automate,
    signé ; et règle permanente : toute inhibition est tracée, sa réactivation vérifiée en fin d''intervention.
    Une alarme est restée coupée six mois sans que personne le sache — c''est le défaut le plus reproductible
    du 12 mai.


    **Puis 14 jours d''observation**, boucle toujours en manuel, comparateur actif et capable de basculer.
    Aucun déclenchement intempestif sur cette période — qui couvre un intervalle complet d''étalonnage
    — vaut bascule en automatique. Ce sont les jours demandés ; ils ne comptent qu''une fois C1 à C4 acquises.


    **4. Calendrier et coût**


    C1 à C4 sont réalisables sous environ trois semaines, observation jusque vers le 19 septembre, bascule
    possible le 22. L''audit externe rend ses conclusions le 30 septembre et porte sur cette boucle. Basculer
    huit jours avant expose à une seconde marche arrière si l''auditeur conteste les seuils. **Je recommande
    la bascule au 1er octobre** : environ 12 k€ de surcoût, contre le risque d''un second revirement public.


    Le surcoût s''arrête là : à la bascule, la surveillance renforcée passe en présence de journée pendant
    30 jours, puis prend fin.


    **5. Point à ne pas perdre de vue**


    Le manuel n''est pas neutre : dispersion 0,21 contre 0,08 mg/L en automatique. Cette dispersion joue
    aussi vers le bas, donc du côté microbiologique. C''est un argument pour tenir le calendrier ci-dessus
    sans glissement — pas pour alléger les conditions.


    **Décision demandée jeudi :** autorisation par avance du retour en automatique sous C1–C4 + 14 jours
    ; validation des seuils de discordance et du plafond de dose ; ordre de service pour la modification
    du programme de l''automate.


    ---


    Deux endroits où tu voudras peut-être trancher avant jeudi : les valeurs de seuil et de délai en C1
    (je les ai laissées en blanc, elles relèvent du process, pas de la note), et le nom du signataire
    du constat C1–C4 — c''est lui qui remplace la réunion, donc il vaut mieux qu''il soit nommé dans le
    texte voté.

    '
