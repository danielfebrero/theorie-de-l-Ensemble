response:
  text: "## Position de la présidence — répartition de la ressource du bassin de la Vèze\n\n*Note écrite\
    \ préalable à la séance de jeudi, adressée conjointement aux trois parties.*\n\n---\n\n### 1. Ce que\
    \ je retire de l'arbitrage avant d'ouvrir la discussion\n\n**Les 180 L/s réservés ne sont pas dans\
    \ le partage.** Deux raisons distinctes, dont chacune suffit :\n\n- La commission n'a pas le pouvoir\
    \ de les modifier. Le débit réservé relève de l'arrêté préfectoral. Un vote qui l'entamerait serait\
    \ nul et exposerait chacun d'entre nous.\n- Le rapport du 12 juin documente en dessous de ce seuil\
    \ une perte non reconstituable à l'échelle de la décennie. Une récolte perdue revient l'année suivante\
    \ ; une population de truites et deux frayères asséchées ne reviennent pas. Ce n'est pas une hiérarchie\
    \ de valeurs, c'est une hiérarchie de réversibilité, et c'est le seul critère qui puisse départager\
    \ trois demandes également légitimes.\n\n**La ressource réellement arbitrable est donc de 410 − 180\
    \ = 230 L/s**, pour deux usages qui en demandent 390. L'écart n'est pas de 160 L/s, il est de 160\
    \ L/s à répartir entre deux parties, ce qui n'est pas la même conversation.\n\n### 2. Ce que je refuse\
    \ de tenir pour acquis\n\nJe ne peux pas arbitrer 160 L/s en traitant comme des données trois chiffres\
    \ dont aucun n'est audité.\n\n**Le 410 L/s.** Une seule station, dernier étalonnage 2023. Toute la\
    \ décision repose sur ce capteur, et il mesure au barrage, pas là où les 180 L/s sont dus. Un jaugeage\
    \ contradictoire coûte quelques milliers d'euros et quelques jours : c'est sans commune mesure avec\
    \ l'enjeu. Je le commande immédiatement, plus une mesure indépendante au point de contrôle aval. La\
    \ restriction ne l'attend pas ; elle sera corrigée par lui.\n\n**Le 150 L/s de la régie.** 150 L/s\
    \ représentent 12 960 m³/jour, soit environ 1 400 litres par habitant et par jour. L'ordre de grandeur\
    \ d'une consommation domestique, pertes de réseau comprises, est de 200 à 250 litres. L'écart est\
    \ d'un facteur cinq à sept. Je n'en tire aucune accusation : il existe des explications (industriels\
    \ raccordés, périmètre plus large que Ferney, rendement de réseau dégradé). Mais je ne peux pas demander\
    \ aux maraîchers de renoncer au tiers de leur eau pendant que 150 L/s sont réputés intouchables sans\
    \ qu'aucune de ces explications ne soit produite. **La régie sera garantie sur son besoin vital, pas\
    \ sur son prélèvement historique.**\n\n**Le stock.** Nous parlons d'un barrage et nous ne discutons\
    \ que d'un débit entrant. Quel est le volume utile actuellement stocké dans la retenue, et quelle\
    \ est sa courbe de vidange à 410 L/s d'entrée ? Sur huit semaines, cette donnée peut déplacer l'ensemble\
    \ de l'arbitrage. Je la veux avant jeudi.\n\n*Précision de calendrier à confirmer avant séance :*\
    \ l'épisode « 520 puis 340 L/s en quatre jours » — de quelle année, et le 410 L/s est-il une valeur\
    \ instantanée ou une moyenne ? Si 340 était une valeur récente et non un épisode passé, l'eau arbitrable\
    \ tomberait à 160 L/s et la présente note serait à refaire.\n\n### 3. La répartition que je propose\n\
    \n| Usage | Dotation | Statut |\n|---|---|---|\n| Débit réservé aval | 180 L/s | Plancher intangible,\
    \ contrôlé à l'aval |\n| Eau potable Ferney | 150 L/s pendant 10 jours, puis dotation auditée | Garanti\
    \ sur le besoin sanitaire, sous condition documentaire |\n| Irrigation | 80 L/s, enveloppe globale\
    \ | Révisable à la hausse au fil de l'audit |\n\nLa dotation de la régie est maintenue à 150 L/s pendant\
    \ dix jours — aucune santé ne se joue pendant qu'on vérifie. Au dixième jour, elle produit son rendement\
    \ de réseau, la ventilation domestique / non-domestique de son prélèvement, et son plan de réparation\
    \ de fuites. **À défaut de production dans le délai, la dotation est ramenée d'office à 110 L/s**\
    \ et les 40 L/s basculent à l'irrigation, sans nouveau vote. Ce n'est pas une sanction, c'est ce qui\
    \ transforme une promesse d'audit en mécanisme. Chaque litre par seconde récupéré sur les pertes va\
    \ à l'irrigation, pas à la marge de sécurité.\n\n### 4. Enveloppe globale, et non quotas individuels\
    \ — le calcul qui décide\n\nLa commission n'a ni cultures, ni stades végétatifs, ni relevés de compteurs.\
    \ Des quotas individuels seraient arbitraires dans leur assiette et fragiles au contentieux. Mais\
    \ ce n'est pas la raison principale.\n\n240 L/s sur 620 ha, c'est 3,3 mm/jour. Je note que **la demande\
    \ des maraîchers n'est pas gonflée** : c'est déjà une ration déficitaire pour du maraîchage en août,\
    \ pas une ration de confort. Je le dis parce que cela m'engage sur la suite.\n\n80 L/s étalés uniformément\
    \ sur 620 ha, c'est **1,1 mm/jour**. Cette ration ne sauve rien : elle s'évapore et l'on perd tout,\
    \ sur toute la surface. C'est exactement ce que produirait un quota individuel proportionnel à l'hectare,\
    \ et c'est ce qui fabriquerait la perte totale de 4,1 M€ annoncée.\n\nLes mêmes 80 L/s concentrés\
    \ sur **200 hectares** donnent 3,46 mm/jour — la ration que les maraîchers ont eux-mêmes demandée.\
    \ Environ un tiers de la surface est tenu, et si ce tiers est choisi sur la valeur et le stade des\
    \ cultures, il porte bien plus qu'un tiers de la valeur.\n\n**La question n'est donc pas de partager\
    \ une pénurie, elle est de trier.** La commission est incapable de désigner les 200 hectares : elle\
    \ n'a aucune donnée parcellaire. Les 34 exploitations en sont capables. C'est pourquoi j'arrête un\
    \ volume global et je confie l'allocation interne à l'organisation des maraîchers, contre remise sous\
    \ dix jours d'un tour d'eau nominatif et d'un plan d'irrigation nocturne. Ce n'est pas une consultation\
    \ : c'est le pouvoir de décider qui est irrigué, et il change de mains.\n\nDeux garde-fous, parce\
    \ que 6 exploitations détiennent 300 des 620 ha et qu'une enveloppe globale sans compteur se répartit\
    \ toute seule au profit des plus grosses pompes : le tour d'eau doit être signé par une majorité d'exploitations\
    \ **et** par des exploitations représentant la majorité des surfaces ; et l'enveloppe n'est versée\
    \ qu'aux exploitations équipées d'un compteur relevé. À défaut d'accord au dixième jour, je bascule\
    \ d'office en quotas proportionnels à l'hectare — c'est-à-dire à la ration qui ne sauve rien. Chacun\
    \ sait alors ce qu'il perd en n'arrivant pas à s'entendre.\n\n### 5. Le mécanisme de levée — la véritable\
    \ erreur de 2022\n\nLe dispositif de 2022 n'a pas échoué par sévérité insuffisante, il a échoué par\
    \ la forme de son déclencheur : un seuil instantané sur 48 h, sur une station unique, lu sur un ruissellement\
    \ d'orage qui n'est pas une recharge. Restitution intégrale le troisième jour, effondrement le septième.\
    \ Je propose de le remplacer par :\n\n- **une moyenne glissante sur 10 jours**, jamais une valeur\
    \ instantanée ;\n- **une levée par paliers de 25 %** de la réduction, chaque palier devant tenir dix\
    \ jours après sa mise en œuvre avant d'ouvrir le suivant ;\n- **une hystérésis asymétrique** : seuil\
    \ de levée supérieur de 15 % au seuil de restriction — lent à desserrer, immédiat à resserrer ;\n\
    - **un indicateur non ruisselant** (piézomètre ou débit aval) en confirmation, pour ne plus lire une\
    \ pluie comme une nappe ;\n- **un déclencheur de repli automatique** : moyenne 3 jours sous le seuil\
    \ du palier en cours → retour immédiat au palier précédent, sans convocation ni vote.\n\n### 6. Les\
    \ 600 000 €\n\n600 000 € contre une perte annoncée de 4,1 M€, c'est 15 %. Ce fonds ne peut pas être\
    \ une indemnisation ; s'il est distribué comme telle, il est consommé et il n'achète rien. Je propose\
    \ qu'il achète les instruments sans lesquels aucune décision n'est exécutoire :\n\n- **~150 000 €**\
    \ : compteurs et télérelève sur les 34 exploitations, jaugeage contradictoire, étalonnage de la station,\
    \ point de mesure aval. Ce poste conditionne tous les autres.\n- **~150 000 €** : réparation des fuites\
    \ de la régie sur les secteurs au meilleur rendement litre/euro. C'est le seul poste qui **crée**\
    \ de l'eau sous quinze jours.\n- **~300 000 €** : soutien ciblé aux 28 exploitations les plus petites,\
    \ celles pour qui une saison perdue est une fin d'activité et non un mauvais exercice — versement\
    \ conditionné à l'acceptation du compteur et du tour d'eau.\n\n### 7. Ce que je dis à chaque partie,\
    \ sans l'adoucir\n\n**Aux maraîchers.** Vous portez la perte. Elle est réelle, elle est immédiate,\
    \ et elle n'est pas partagée à parts égales — c'est le résultat, pas un accident de rédaction. Je\
    \ l'assume sur un seul motif : de nos trois pertes possibles, la vôtre est la seule dont on revient.\
    \ Je ne vous demande pas de le trouver juste. En contrepartie je vous donne ce que la commission ne\
    \ sait pas faire — le choix des hectares tenus —, un compteur qui rend enfin vos prélèvements opposables\
    \ aux autres, et un audit de la régie dont chaque litre récupéré vous revient. Si l'audit dégage 60\
    \ L/s, vous passez de 200 à environ 350 hectares tenus. C'est votre principal gisement d'eau, et il\
    \ est chiffré.\n\n**À la régie.** Votre dotation sanitaire est garantie, inconditionnellement, dès\
    \ la première ligne de l'arrêté : 9 200 habitants et un EHPAD de 110 lits ne sont pas une variable\
    \ d'ajustement, et vos 4 jours de tampon sont trop courts pour supporter la moindre expérimentation.\
    \ Ce qui n'est pas garanti, c'est le volume au-delà. Refuser d'ouvrir la discussion tant que votre\
    \ dotation n'est pas acquise était compréhensible ; ce n'est plus possible maintenant qu'elle l'est.\
    \ Les 150 L/s appellent une explication, et vous êtes la seule à pouvoir la produire.\n\n**Sur le\
    \ milieu.** La partie qui n'est pas dans la salle est celle dont la perte est la seule irréversible.\
    \ Le plancher aval ne se négocie pas et, à compter de cet arrêté, il se mesure là où il est dû plutôt\
    \ que de se déduire d'une station située \nen amont.\n\n**À la presse.** Ce dossier n'oppose pas les\
    \ paysans aux robinets. Il oppose ce qui repousse à ce qui ne repousse pas, et il révèle que nous\
    \ arbitrons 160 L/s avec un capteur non étalonné depuis 2023 et un prélèvement de sept fois la norme\
    \ que personne n'avait interrogé.\n\n### 8. La meilleure objection contre cette position\n\n*« Vous\
    \ sacrifiez 90 emplois et 4,1 M€ d'économie locale présente au nom d'un rapport sur des truites et\
    \ d'un audit que vous ne tiendrez pas : aucune régie ne produit son rendement de réseau en dix jours,\
    \ donc les maraîchers resteront à 80 L/s pendant huit semaines, et votre \"gisement\" est un lot de\
    \ consolation. »*\n\nElle tient sur un point et je la retiens : la promesse d'audit ne vaut rien sans\
    \ conséquence datée. C'est pourquoi le défaut de production au dixième jour déclenche la bascule de\
    \ 40 L/s **de plein droit**, sans nouveau vote — la charge du retard pèse alors sur la régie et non\
    \ sur les maraîchers. Elle ne tient pas sur le classement des pertes : quelle que soit la valeur des\
    \ truites, la commission n'a juridiquement pas le pouvoir de descendre sous 180 L/s, et le seul arbitrage\
    \ réellement ouvert est celui entre potable et irrigation.\n\n### 9. Ce qui renverserait cette position\n\
    \nJe m'engage à la réviser, et non à la défendre, si l'un de ces faits apparaît : le jaugeage contradictoire\
    \ s'écarte de plus de 15 % des 410 L/s ; la retenue contient un volume utile significatif ; l'audit\
    \ établit que le besoin réel de la régie est proche de 150 L/s — auquel cas l'irrigation reste à 80\
    \ et je devrai le dire aux maraîchers sans me retrancher derrière un gisement disparu ; ou la mesure\
    \ aval montre que les 180 L/s n'atteignent déjà pas les frayères, ce qui obligerait à reconstruire\
    \ toute la répartition.\n\n### 10. Premières actions\n\n1. **Avant jeudi** : commande du jaugeage\
    \ contradictoire et de l'étalonnage ; demande écrite à la régie (rendement, ventilation, plan fuites)\
    \ ; demande du volume utile stocké et de sa courbe de vidange ; clarification du calendrier de l'épisode\
    \ 520/340.\n2. **Jeudi** : vote de l'enveloppe globale, du plancher sanitaire, du mécanisme de levée\
    \ à paliers et de la ventilation du fonds.\n3. **J+1 à J+10** : pose des compteurs ; remise du tour\
    \ d'eau par les maraîchers ; remise du dossier par la régie ; réunion tripartite hebdomadaire sur\
    \ données publiées.\n4. **J+10** : bascule automatique des 40 L/s en cas de défaut, ou passage en\
    \ quotas proportionnels en cas d'absence d'accord sur le tour d'eau.\n5. **En parallèle** : saisine\
    \ du préfet pour un arrêté sécheresse étendant les restrictions aux usages hors compétence de la commission\
    \ et aux éventuels préleveurs situés en amont du barrage — la commission arbitre 410 L/s, elle ne\
    \ les produit pas.\n"
