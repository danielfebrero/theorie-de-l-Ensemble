    ---


    # Note au comité de direction — plan d''économies du DAF


    **Objet :** avis sur les douze mesures mensuelles proposées · **Séance :** lundi


    ## 1. Verdict


    Le volet A est adopté. Le volet B est adopté **amputé de deux de ses quatre mesures** : la réduction
    de la supervision de Vidal et le gel du poste de second apprenti signataire.


    La note du DAF conclut que « l''accréditation n''est pas concernée ». Cette conclusion est fausse,
    et elle l''est sur un calcul vérifiable, pas sur une appréciation. Sous supervision à 55 h/mois —
    **comme sous la variante à 70 h/mois** — Vidal n''est pas agréée avant M15. L''organisme suspend.
    C''est la seule branche du dossier dont on ne revient pas.


    ## 2. Le calcul


    Vidal a six mois de pratique restants, c''est-à-dire six mois comptés pleins à 100 h ou plus. En dessous
    de 100 h, le mois compte au prorata. Ferrand part fin M8 : la fenêtre de supervision sous un superviseur
    unique est donc de **huit mois, M1 à M8**. Tout changement de superviseur après ce départ remet le
    compteur à douze mois sous le nouveau.


    | Supervision sous Ferrand | Mois nécessaires | Dernière heure | Agrément prononcé | Résultat |

    |---|---|---|---|---|

    | 120 h/mois (actuel) | 6,0 | fin M6 | **fin M8** | tenu, 2 mois de marge |

    | 100 h/mois | 6,0 | fin M6 | **fin M8** | tenu, aucune marge horaire |

    | 75 h/mois | 8,0 | fin M8 | fin M10 | limite exacte, zéro marge |

    | **70 h/mois (variante proposée)** | 8,6 | jamais sous Ferrand | **≥ fin M22** | **échec** |

    | **55 h/mois (plan)** | 10,9 | jamais sous Ferrand | **≥ fin M22** | **échec** |


    Sur les deux dernières lignes : le compteur n''est pas achevé au départ de Ferrand, le changement
    de superviseur le ramène à douze mois à compter de M9, soit une dernière heure fin M20 et un agrément
    fin M22.


    Le seuil de rupture est à **75 h/mois**, entre les deux valeurs proposées. La variante à 70 h/mois
    échoue de 40 heures. Elle a l''apparence d''un compromis et n''en est pas un.


    ## 3. Le calendrier des signataires en poste


    | Période | Signataires agréés | Effectif |

    |---|---|---|

    | M1 – M8 | Ferrand, Marchand, Bouchard, Nseka | 4 |

    | M9 – M14 | Marchand, Bouchard, Nseka | 3 |

    | **M15 et au-delà** | Bouchard, Nseka | **2 — suspension** |


    Le DAF écrit que « trois signataires restent en poste jusqu''à M14 ». C''est exact et sans portée
    : l''échéance n''est pas M14, c''est **M15**. Et la date cible pour Vidal n''est pas M14 non plus,
    c''est **fin M8** — le départ de Ferrand, après quoi son compteur redémarre.


    Deux conséquences que le plan ne traite pas :


    - **Trois signataires à M15, c''est le minimum exact.** Un arrêt long, un départ, un désaccord, et
    l''effectif passe à deux.

    - **Le retour après suspension est verrouillé.** Le dossier n''est recevable que si trois signataires
    agréés sont en poste. Un laboratoire suspendu parce qu''il est tombé à deux ne peut pas déposer. La
    suspension n''est donc pas une parenthèse de 14 à 20 mois et 340 k€ : c''est un état dont on ne sort
    pas par la procédure prévue.


    C''est pourquoi le gel du second apprenti signataire est la seconde mesure écartée. C''est le seul
    dispositif qui produit un quatrième signataire, à un horizon de vingt-quatre mois plus huit semaines.
    Chaque mois de gel décale cette date d''un mois, et elle ne se rattrape pas.


    ## 4. Sur « aucune mesure irréversible, chacune rétablie en trente jours »


    La formule est exacte pour les flux financiers et fausse pour les compteurs de temps. Un mois de supervision
    à 55 heures ne se rattrape pas en repassant à 120 heures le mois suivant, parce que la ressource contrainte
    n''est pas l''argent : c''est la présence de Ferrand jusqu''à fin M8. La fenêtre se ferme, quoi qu''on
    rétablisse ensuite. Dix des douze mesures sont bien réversibles à trente jours. Les deux qui ne le
    sont pas sont précisément celles qui portent l''accréditation.


    ## 5. Sur les éléments de confortation


    **Le benchmark (sept sur neuf).** L''étude ne dit pas si ces laboratoires avaient une fenêtre de superviseur
    qui se refermait, ni combien de signataires ils comptaient au-dessus du minimum. Sans ces deux paramètres,
    la comparaison ne porte pas sur notre situation. Par ailleurs, deux échecs sur neuf appliqués à une
    exposition de 87 % du chiffre d''affaires ne constituent pas un résultat rassurant. Neuf cas retenus
    par un cabinet ne sont pas un échantillon.


    **Les cinq cosignatures sur sept.** Le désaccord porte sur une règle de prorata et une date de départ,
    deux éléments vérifiables en une heure. Il ne se tranche pas au nombre de signatures.


    ## 6. Ce que je retiens


    **Volet A, intégralement — 24 k€/mois.** Arrêt des salons, report de la migration ERP, sous-location
    des 240 m², fin de l''intérim en préparation d''échantillons.


    Une condition sur la dernière mesure : la perte historique de 4 % porte sur le chiffre **non accrédité**,
    soit environ 0,5 % du chiffre total. Ce chiffre n''est valable que si la préparation d''échantillons
    n''est pas en amont des essais accrédités. À confirmer avant lundi par le responsable de production.
    Si elle l''est, un allongement de 9 à 14 jours touche les 87 %, et la mesure change de nature.


    **Volet B, deux mesures sur quatre.** Non-remplacement du technicien, et internalisation de la maintenance
    métrologie — celle-ci sous réserve d''un avis écrit du responsable qualité. La traçabilité métrologique
    et le raccordement des étalons sont des exigences du référentiel ; les internaliser sans compétence
    documentée expose à un écart en surveillance, qui suit son propre calendrier.


    **Ferrand en production, dans le solde.** La supervision de Vidal est prioritaire sur son temps ;
    le reste va en production. À 120 h/mois, cela laisse environ les trois quarts de son temps disponible,
    et capte donc une part réelle de l''économie visée. Ce n''est pas un rejet du principe : c''est un
    plafond.


    ## 7. Ce sur quoi j''engage le laboratoire


    1. **Supervision de Vidal maintenue à 120 h/mois** jusqu''à sa dernière heure de pratique, sans dérogation
    d''aucune mesure. Cible : dernière heure fin M6, agrément fin M8. Plancher absolu 100 h/mois. Les
    20 h au-dessus du plancher n''accélèrent rien — elles constituent le tampon qui absorbe congés et
    absences sans sortir de la fenêtre.

    2. **Aucune mesure ne prélève sur le temps de supervision de Ferrand**, quelle que soit la tension
    de trésorerie d''ici M8.

    3. **Le poste de second apprenti signataire n''est pas gelé.** Le recrutement démarre sous Bouchard
    ou Nseka — jamais sous Marchand, dont le départ à M14 déclencherait une remise à douze mois.

    4. **Les contrats-cadres ne sont pas signés à M9.** Deux signataires dédiés en plus de l''activité
    courante sont hors de portée à cette date : nous en comptons quatre au mieux à M9, et trois à partir
    de M15, dont deux immobilisés laisseraient un seul signataire pour toute l''activité courante. Mandat
    de négocier un démarrage à M12 et, si le client refuse, un seul des deux contrats. Ces 41 k€/mois
    sont la seule mesure du dossier qui traite la cause plutôt que le symptôme — raison de plus pour ne
    pas les engager sur une capacité que nous n''avons pas.


    ## 8. Effet trésorerie


    | Scénario | Économie | Déficit résiduel | Piste |

    |---|---|---|---|

    | Sans mesure | — | 61 k€/mois | épuisement mi-M13 |

    | Plan retenu | ~37 à 42 k€/mois | 19 à 24 k€/mois | > 30 mois |

    | Plan complet du DAF | 50 k€/mois | 11 k€/mois | > 60 mois, **suspension probable à M15** |


    L''écart entre les deux plans est d''environ 13 k€/mois, soit près de 180 k€ cumulés sur quatorze
    mois. Le plan retenu conserve plus de trente mois de piste, très au-delà de M15. L''argument de liquidité
    contre ce plan ne tient pas sur cet horizon — il tiendrait avec 200 k€ en caisse, pas avec 780 k€.


    *Réserve explicite :* le volet B n''est pas ventilé mesure par mesure dans le document du DAF. La
    fourchette ci-dessus suppose une répartition à peu près égale entre les quatre mesures. **La ventilation
    est demandée avant lundi** ; les montants seront corrigés en séance.


    ## 9. Le contre-argument, et pourquoi il ne l''emporte pas


    L''objection sérieuse : en renonçant à 13 k€/mois, nous consommons davantage de trésorerie, et si
    un client majeur partait pendant que la banque reste fermée, le laboratoire pourrait défaillir avant
    M9 — auquel cas l''état de l''accréditation n''aurait plus d''importance. Elle ne l''emporte pas,
    parce que 780 k€ à –24 k€/mois laissent plus de trente mois quand les deux échéances qui comptent
    sont à M9 et M15. Mais elle fixe le déclencheur de réouverture du point 11.


    ## 10. Ce qui renverserait cette note


    Une réponse écrite de l''organisme établissant **soit** qu''un mois à moins de 100 h ne s''impute
    pas au prorata, **soit** qu''un changement de superviseur en cours de cycle ne remet pas l''exigence
    à douze mois, **soit** qu''un délai de régularisation existe lorsque l''effectif tombe sous trois
    signataires.


    L''une de ces trois réponses suffit à rendre le plan complet du DAF défendable. Aucune ne peut être
    présumée. La lecture retenue ici est la plus contraignante des lectures possibles du référentiel,
    parce que l''écart entre se tromper dans un sens et se tromper dans l''autre est de 180 k€ d''un côté
    et du laboratoire de l''autre.


    ## 11. Première action, et repli


    **Première action — cette semaine, avant la séance :** courrier au responsable d''accréditation posant
    les trois questions du point 10, en citant la situation nominative de Vidal et le calendrier de départ
    de Ferrand. Coût négligeable, réponse attendue en quelques semaines, donc largement avant que la fenêtre
    M1–M8 ne se referme. Si elle infirme ma lecture sur l''un des trois points, le comité rouvre le volet
    B en séance ordinaire.


    **Déclencheur de réouverture du volet B :** trésorerie sous 450 k€ à une clôture mensuelle, **ou**
    perte d''un client représentant plus de 8 % du chiffre. Le comité se réunit alors sous quinze jours
    et arbitre sur des mesures de rang supérieur — cession d''équipement, décalage de charges sociales,
    ouverture de capital. En aucun cas le point 7.1 n''est rouvert avant l''agrément de Vidal.


    **Déclencheur d''alerte sur l''agrément :** si les heures de supervision effectives d''un mois passent
    sous 100 h, le comité en est informé sous huit jours et les heures sont reprogrammées le mois suivant.
    Trois mois consécutifs sous 100 h avant M6 signifient que la fenêtre est compromise.


    ## 12. Ce que cette note ne fait pas


    Elle n''écarte pas l''objectif d''économies du DAF, dont l''analyse de trésorerie est juste : sans
    plan, la caisse est vide mi-M13. Elle écarte deux mesures sur douze et en conditionne une troisième.


    Il est proposé que le DAF conserve la main sur le seuil de réouverture du point 11 et sur la ventilation
    des mesures retenues, et que le responsable qualité dispose d''un droit d''opposition motivé sur toute
    mesure touchant la métrologie ou la préparation d''échantillons. Une revue mensuelle sur tableau de
    bord partagé — trésorerie, heures de supervision effectives, avancement du recrutement apprenti —
    est ouverte à compter de M1.


    ---


    **Trois points à retenir en séance :** la variante à 70 h/mois échoue aussi (le seuil est à 75 h)
    ; l''échéance est M15, pas M14, et la date cible pour Vidal est fin M8 ; une suspension ne se répare
    pas, puisque le dossier de retour exige les trois signataires que la suspension nous a fait perdre.


    Dis-moi si tu veux que je rédige le courrier à l''organisme d''accréditation, ou une version courte
    d''une page pour la séance. Je peux aussi réécrire le fichier si tu autorises l''écriture dans le
    répertoire.

    '
