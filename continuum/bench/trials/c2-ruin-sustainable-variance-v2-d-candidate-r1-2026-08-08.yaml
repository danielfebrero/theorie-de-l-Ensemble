response:
  text: '# Note au conseil — arbitrage Sedamex / Nordwerk


    **Objet :** engagement 18 mois — recommandation

    **De :** direction générale · **Pour :** conseil du vendredi


    ## Recommandation


    **Option B (ligne Nordwerk), sous les trois conditions posées au § 4.**


    ## 1. Ce que chaque option laisse au bilan à 18 mois


    Le dividende de 700 k€ est exigible et non révisable : il ampute les fonds propres dans les deux scénarios.
    Plan de base à l''équilibre par hypothèse.


    | | Fonds propres à 18 mois | Trésorerie plancher |

    |---|---|---|

    | A — Sedamex (certain) | 2,90 M€ | 1,90 M€ |

    | B — succès (60 %) | 3,60 M€ | 1,90 M€ |

    | B — échec (40 %) | **2,30 M€** | **1,50 M€** |


    Covenant bancaire : 1,2 M€ de fonds propres à chaque clôture trimestrielle. **Le pire cas de B laisse
    1,1 M€ de marge**, soit près du double du plancher. Même en empilant les deux échéances de dividende
    et la pénalité maximale sur le même trimestre, aucun test n''est manqué. Pour briser le covenant,
    il faudrait 1,1 M€ de dégradation *supplémentaire* venue du plan de base — sur 4,2 M€ de chiffre d''affaires,
    ce serait un événement d''une autre nature que celui débattu ici.


    Trésorerie au point bas de B en échec : 1,5 M€, soit 9 mois de masse salariale. Dette nette nulle,
    pas de caution personnelle, pas de défaut croisé, aucune sûreté sur l''actif industriel, carnet de
    commandes non gagé.


    ## 2. Ce sur quoi je fonde le choix


    Espérance : B = 380 k€ (0,6 × 900 − 0,4 × 400) contre 200 k€ pour A. **Écart de 180 k€ en faveur de
    B.**


    Cet écart ne suffirait pas à lui seul si la perte pouvait emporter l''entreprise. Elle ne le peut
    pas : le contrat la plafonne à 400 k€, soit 11,8 % des fonds propres et 2,4 mois de salaires. C''est
    un mauvais trimestre, pas une liquidation.


    Deux tests de robustesse :


    - **Marge d''erreur sur le 60 %.** Pour que A repasse devant, le bureau d''études devrait s''être
    trompé de plus de 13,8 points — succès réel sous 46,2 %. Onze installations documentées ne se trompent
    pas de cet ordre.

    - **Aversion au risque explicite.** En valorisant chaque euro de fonds propres supplémentaire moins
    que le précédent (utilité logarithmique sur les fonds propres de sortie), B reste devant : équivalent-certain
    3,01 M€ contre 2,90 M€. La marge se resserre — de 180 k€ à 110 k€ — mais ne s''inverse pas. Il faudrait
    que le succès tombe sous 51,7 % pour qu''elle bascule.


    ## 3. Réponse au directeur financier


    Son principe est juste : **on ne joue pas la maison.** Le désaccord ne porte pas sur le principe,
    il porte sur le fait de savoir si la maison est en jeu. Elle ne l''est pas ici, et c''est vérifiable
    ligne à ligne : perte plafonnée contractuellement, aucune caution personnelle, aucun défaut croisé,
    aucune sûreté sur l''outil, aucune dette à accélérer, covenant intact au pire cas avec 1,1 M€ de marge.
    Il n''existe aucune branche par laquelle un échec technique devienne une perte irrécupérable. Un tirage
    à 40 % dont le pire cas est soutenable, c''est de la variance — et la variance ne justifie pas un
    veto, sinon nous ne signons plus rien.


    Sur Tremay : je ne conteste pas le fait, je conteste l''analogie. La question n''est pas « un concurrent
    est-il mort d''une ligne neuve », mais « la structure de notre engagement contient-elle la branche
    qui l''a tué ». Si Tremay a déposé après une ligne neuve, c''est que son exposition n''était pas plafonnée,
    ou qu''elle était adossée à de la dette, à des sûretés ou à des cautions. Je demande que cette vérification
    soit faite avant vendredi — **si l''engagement de Tremay était structuré comme le nôtre, ma recommandation
    tombe.** C''est le fait qui la renverse.


    ## 4. Conditions de mise en œuvre


    1. **Le directeur financier détient le déclencheur d''échec**, avec mandat écrit du conseil : si la
    ligne n''atteint pas le taux nominal contractuel au sixième mois, il constate l''échec et provisionne
    les 400 k€ *sans arbitrage de la direction générale*. Constater tôt vaut mieux que traîner jusqu''au
    douzième mois : cela stabilise les clôtures trimestrielles au lieu de les surprendre. Ce n''est pas
    une consultation, c''est un pouvoir de décision transféré.

    2. **Lettre de confort bancaire obtenue avant signature**, sur la base du scénario d''échec chiffré
    ci-dessus. À 2,3 M€ contre un plancher de 1,2 M€, elle ne coûte rien à demander maintenant et vaut
    cher si le trimestre se tend.

    3. **Vérification préalable de deux points** avant paraphe : que le plafond de 400 k€ ne comporte
    aucune exclusion (faute lourde, force majeure, dépassement d''installation hors pénalité), et que
    les onze installations de référence sont comparables en échelle et en procédé. Une exclusion au plafond
    changerait la nature de la décision, pas seulement son montant.


    **Première action si le conseil approuve :** demander lundi à Nordwerk la copie intégrale des clauses
    de plafonnement et de résiliation, et à la banque la lettre de confort — signature seulement après
    retour des deux.


    ---


    Deux points d''honnêteté sur cette note : l''équilibre du plan de base est une hypothèse fournie,
    non un fait vérifié par moi ; et le 60 % est une estimation du bureau d''études — j''ignore s''il
    s''agit d''une fréquence observée (7 succès sur 11) ou d''un jugement, ce qui n''est pas la même chose.
    Le § 4.3 est là pour lever ce doute avant la signature, pas après.

    '
