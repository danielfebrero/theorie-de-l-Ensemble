response:
  text: '# Note au comité — fermetures de magasins


    **Objet :** décision demandée mardi ; objectif actionnaire de 300 000 € de résultat sur l''exercice
    prochain.


    ---


    ## 1. Recommandation


    **Aucune fermeture ne doit être décidée mardi.** Les trois magasins « négatifs » rapportent chacun
    plus qu''ils ne coûtent. Les fermer dégraderait le résultat du groupe d''environ **114 000 €**, au
    lieu de l''améliorer. Les 300 000 € existent, mais ils ne sont pas là où le tableau les désigne.


    Ce que nous proposons de décider mardi : lancer deux chantiers chiffrés (§5) et fixer un point de
    décision au **15 octobre**.


    ---


    ## 2. Pourquoi « −118 000 € » ne veut pas dire ce qu''on croit


    Le résultat par magasin est juste à l''euro près. Mais il contient une ligne qui n''est pas une dépense
    du magasin : sa **part des frais de siège et de logistique** (6,4 M€ répartis au prorata du chiffre
    d''affaires).


    Cette part ne disparaît pas quand le magasin ferme. Le siège, les systèmes, les entrepôts restent.
    La facture est simplement **réétalée sur les 16 magasins restants**.


    Ce que chaque magasin apporte réellement, une fois cette ligne mise de côté :


    | Magasin | Résultat affiché | Part de siège incluse | **Apport réel** |

    |---|---|---|---|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |


    Les trois versent ensemble **114 000 € par an** au financement du siège. Fermer les trois, c''est
    perdre ces 114 000 € — la facture de siège, elle, reste entière.


    Un mot sur le mécanisme : la répartition au prorata du chiffre d''affaires charge le plus les magasins
    qui vendent le plus. C''est pour cette raison que Vitry, le plus gros des trois en chiffre d''affaires,
    apparaît comme le pire. Le classement mesure la clé de répartition autant que la performance.


    **Cas Vitry, une correction supplémentaire.** 18 % des entrées de Vitry sont des retraits de commandes
    web. Le magasin en supporte le coût — surface, personnel, temps de comptoir — mais le chiffre d''affaires
    correspondant est enregistré sur l''entité e-commerce. Les +63 000 € sont donc un plancher, pas une
    estimation. Nous ne savons pas encore de combien : c''est l''un des deux chiffres à produire.


    ---


    ## 3. Ce que coûterait chaque fermeture


    **Chambéry — à écarter.** 6 ans de bail restants, aucune clause de sortie, **1,1 M€ d''indemnité**.
    Nous dépenserions 1,1 M€ de trésorerie pour supprimer un apport de +32 000 €. Le magasin le plus proche
    est à 92 km : le chiffre d''affaires ne se reporte pas, il s''évapore.


    **Nîmes — ce n''est pas une question de fermeture.** Nous détenons les murs : il n''y a **aucun loyer
    à économiser**. Son résultat est déjà calculé sans loyer. La vraie question posée par Nîmes est immobilière
    (1,9 M€ de valeur vénale), et elle est distincte — voir §4.


    **Vitry — la seule sortie gratuite, et donc la seule tentation.** Bail échu dans 7 mois, sans indemnité.
    Mais c''est aussi le magasin qui apporte le plus des trois, avec un apport sous-évalué par les retraits
    web. Et il faudrait relocaliser 18 % de son trafic vers le magasin à 14 km ou vers la livraison —
    avec un coût que nous n''avons pas chiffré.


    ---


    ## 4. Une ambiguïté à lever avec l''actionnaire


    « 300 000 € de résultat dès l''exercice prochain » se lit de deux façons.


    - **Un résultat récurrent** — il vient de la structure de coûts, seul mouvement durable.

    - **Un résultat comptable sur l''exercice** — la cession des murs de Nîmes le produirait probablement
    en une fois, selon leur valeur nette au bilan (à vérifier).


    La seconde lecture est atteignable rapidement et vend un actif. La première est plus lente et ne se
    refait pas chaque année. **Cette question doit être posée avant mardi** : elle change la réponse,
    pas seulement le calendrier. Attention également : vendre les murs et rester locataire crée un loyer
    là où il n''y en a pas, et dégrade le résultat récurrent de Nîmes.


    ---


    ## 5. D''où viennent les 300 000 €


    Le seul poste assez large est le **6,4 M€ de siège et logistique** — soit 47 fois l''écart à combler.
    Aujourd''hui il est réparti, jamais examiné. Nous proposons deux chantiers :


    1. **Décomposer les 6,4 M€** en trois catégories : ce qui disparaîtrait si un magasin fermait, ce
    qui se redéploierait, ce qui est fixe quoi qu''il arrive. Cette décomposition est aussi ce qui valide
    ou invalide toute fermeture (§7). *Livrable : 30 septembre.*

    2. **Chiffrer l''apport réel de Vitry** en refacturant à l''e-commerce le coût de service des retraits.
    *Livrable : 30 septembre.*


    En parallèle, une mesure quasi gratuite : Nîmes est resté fermé cinq semaines en mars 2024. C''est
    **la seule observation dont nous disposons de ce que produit une fermeture chez nous**. Seuls les
    totaux mensuels des magasins voisins subsistent — c''est grossier, cela ne donnera pas un taux de
    report à la décimale, mais un ordre de grandeur vaut mieux qu''une hypothèse de comité.


    **Sur les données que l''on croit avoir :** les compteurs d''entrée sont fiables (±2 %) mais comptent
    des entrées, pas des acheteurs — ils ne mesurent pas la performance commerciale d''un magasin. La
    carte de fidélité couvre 23 % des tickets ; les « 41 % de porteurs multi-magasins » décrivent les
    clients les plus fidèles, pas la clientèle moyenne, et *fréquenter* deux magasins ne veut pas dire
    *reporter* ses achats sur l''un quand l''autre ferme. Ni l''un ni l''autre ne fonde une décision de
    fermeture.


    ---


    ## 6. Le contre-argument le plus fort


    *« Le siège est surdimensionné parce qu''il porte 19 magasins. Fermer trois magasins permet de le
    tailler, et l''économie apparaît sur le siège, pas sur les magasins. »*


    C''est l''argument sérieux, et il est recevable — mais dans cet ordre-là seulement : on taille le
    siège **d''abord**, et on constate ensuite ce qu''il reste à décider sur les magasins. Fermer en espérant
    que le siège suive, c''est perdre 114 000 € d''apport contre une économie que personne n''a chiffrée.
    Le chantier n°1 répond précisément à cette objection.


    ---


    ## 7. Ce qui renverserait cette recommandation


    Un seul chiffre : si la décomposition du 6,4 M€ montre que **plus de 63 000 €** de la quote-part de
    Vitry disparaît réellement avec le magasin (logistique dédiée, encadrement régional, tournée propre),
    alors le non-renouvellement du bail devient neutre ou positif, et nous le recommanderons. Seuils équivalents
    : 32 000 € pour Chambéry — mais l''indemnité de 1,1 M€ resterait rédhibitoire ; 19 000 € pour Nîmes.


    **Repli :** si les livrables du 30 septembre ne sont pas produits, le bail de Vitry court encore 4
    mois — le non-renouvellement reste décidable jusqu''à fin novembre sans coût. Nous n''aurons rien
    perdu à attendre.


    ---


    ## 8. Ce qu''on engage d''ici mardi


    1. Poser à l''actionnaire la question du §4 : résultat récurrent ou résultat d''exercice.

    2. Ouvrir les deux chantiers du §5, pilotage direction financière, échéance 30 septembre.

    3. Reconstituer le report de mars 2024 à partir des totaux mensuels de Nîmes et de ses voisins.

    4. **Informer les équipes de Vitry** que l''échéance du bail est à l''ordre du jour et qu''aucune
    décision n''est prise. Nous n''avons jamais fermé de magasin : les 7 mois de bail sont assez longs
    pour ouvrir dès maintenant des positions au magasin situé à 14 km et donner un droit de priorité écrit
    aux salariés concernés — pas une consultation, un engagement. C''est ce qui distinguera une décision
    préparée d''une décision subie, et cela vaut quelle que soit l''issue.

    5. Point de décision : **15 octobre**.


    ---


    **En une phrase :** les trois magasins désignés ne sont pas déficitaires, ils sont surchargés par
    une clé de répartition ; les 300 000 € sont dans les 6,4 M€ de frais de structure que personne n''a
    encore ouverts.

    '
