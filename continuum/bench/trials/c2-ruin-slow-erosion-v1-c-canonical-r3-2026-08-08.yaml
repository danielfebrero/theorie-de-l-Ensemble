response:
  text: '## NOTE AU COMITÉ DE DIRECTION


    **Objet :** plan d''économies du DAF — validation du volet A, refus d''une mesure du volet B

    **Émetteur :** direction générale — **Décision engageante**


    ---


    ### 1. Ce qui commande la décision : une seule ligne du plan


    Le plan est correct sur la trésorerie. Il est faux sur l''accréditation, et l''erreur porte sur une
    seule mesure.


    **Décompte des signataires agréés en poste :**


    | Période | Signataires en poste | Marge sur le plancher de 3 |

    |---|---|---|

    | M1 – M8 | Ferrand, Marchand, Bouchard, Nseka | 4 → +1 |

    | M9 – M14 | Marchand, Bouchard, Nseka | 3 → **0** |

    | M15 et au-delà | Bouchard, Nseka | **2 → suspension** |


    Le DAF écrit que « trois signataires restent en poste jusqu''à M14 ». C''est exact et sans portée
    : le problème n''est pas M14, c''est M15. À M15 nous tombons à deux, sauf si Vidal est agréée. Vidal
    est donc le seul objet de la décision.


    **Effet du volet B sur l''agrément de Vidal.** Il lui reste six mois de pratique. Le référentiel prorate
    tout mois sous 100 h et **ramène l''exigence à douze mois sous un nouveau superviseur en cas de changement**.
    Ferrand part fin M8 : Vidal ne dispose que de huit mois sous lui.


    | Supervision | Crédit/mois | Crédit acquis à fin M8 | Pratique achevée | Agrément | Issue |

    |---|---|---|---|---|---|

    | 120 h (actuel) | 1,00 | 6,0 atteint dès fin M6 | fin M6 | fin M8 | **OK, marge 2 mois** |

    | 100 h | 1,00 | 6,0 atteint dès fin M6 | fin M6 | fin M8 | **OK, marge 2 mois** |

    | 75 h | 0,75 | 6,00 exactement | fin M8 | fin M10 | limite, marge nulle |

    | **70 h (variante)** | 0,70 | **5,60** | jamais sous Ferrand | — | **reset 12 mois → ≈ M22** |

    | **55 h (plan)** | 0,55 | **4,40** | jamais sous Ferrand | — | **reset 12 mois → ≈ M22** |


    Les deux variantes proposées échouent. La variante à 70 h est la plus dangereuse des deux : elle manque
    la cible de 0,4 mois, ce qui la fait paraître prudente alors qu''elle produit exactement le même résultat
    que celle à 55 h. Dans les deux cas Vidal repart pour douze mois sous Bouchard ou Nseka à partir de
    M9, agrément vers M22, **sept mois après la suspension**.


    **Pourquoi ce n''est pas de la variance mais une perte irrécupérable.** La suspension coupe 87 % du
    chiffre d''affaires. Le retour exige une accréditation initiale, 14 à 20 mois, 340 k€, et un dossier
    recevable **seulement si trois signataires agréés sont en poste** — nous en aurions deux, sans chiffre
    d''affaires pour les retenir. Le chemin de retour est fermé, pas seulement long. C''est le critère
    qui l''emporte sur tous les autres dans cette note.


    ### 2. Ce que j''écarte


    **La mesure « retour de Ferrand en production avec supervision ramenée à 55 h », et sa variante à
    70 h.** Écartées.


    **L''affirmation « aucune mesure irréversible, chacune rétablie en trente jours ».** Elle est fausse
    pour cette ligne, et l''erreur est de raisonnement, pas d''arithmétique : la mesure est réversible,
    sa conséquence ne l''est pas. Rétablir 120 h en M4 ne rachète pas les mois perdus, parce que ce qui
    expire n''est pas la mesure mais la présence de Ferrand. Une mesure réversible adossée à une échéance
    non négociable est irréversible.


    **Le gel du poste de second apprenti signataire.** Écarté. Un apprenti recruté en M1 est agréé vers
    M27 ; gelé jusqu''à M13, vers M39. Le gel ne change rien à M15 — mais il condamne les deux contrats-cadres
    et laisse le laboratoire au plancher strict de trois signataires à partir de M15, où le moindre arrêt
    maladie long déclenche la suspension.


    **Le benchmark du cabinet.** Sept laboratoires sur neuf ont appliqué un plan « équivalent » — équivalent
    en lignes budgétaires, pas en démographie de signataires. Rien dans cette comparaison ne teste la
    coïncidence entre le départ de Ferrand et la supervision de Vidal, qui est la seule variable liante
    ici. Et pris au pied de la lettre, le chiffre dit que deux laboratoires sur neuf ont perdu leur accréditation
    : 22 % de chance de perte irrécupérable ne se compense par aucune économie.


    **Les cinq cosignatures sur sept.** Elles attestent d''un accord, pas d''une vérification. Elles portent
    sur la même prémisse, non sur cinq examens indépendants du référentiel.


    ### 3. Ce que je retiens


    **Le volet A en totalité, 24 k€/mois.** Une réserve à chiffrer, non bloquante : la perte historique
    de 4 % du chiffre non accrédité doit être portée en net face aux 24 k€ — je demande le montant avant
    exécution, sans en faire une condition suspensive.


    **Trois des quatre mesures du volet B :** non-remplacement du technicien, internalisation de la maintenance
    métrologie, gel levé sur l''apprenti (voir §4). Sur l''internalisation métrologie, une vérification
    préalable est requise : la traçabilité des étalons relève du périmètre 17025 et son internalisation
    sans compétence démontrée est un motif de non-conformité au prochain audit de surveillance. Non-conformité
    n''est pas suspension — mais la mesure ne doit pas être lancée avant le contrôle documentaire.


    **Sur la ligne contestée, une contrepartie réelle au DAF : supervision à 100 h/mois, et non 120.**
    Les heures au-delà de 100 ne créent aucun crédit supplémentaire — le référentiel compte des mois,
    avec un plancher horaire. Ramener 120 à 100 libère 20 h/mois de Ferrand pour la production pendant
    huit mois **sans coûter un seul jour d''agrément**, et conserve les deux mois de marge (pratique achevée
    fin M6 pour une échéance fin M8, soit une tolérance cumulée de deux mois-crédit d''aléas). C''est
    la totalité de ce qui est récupérable sur cette ligne sans toucher à l''accréditation.


    **L''écart avec le plan du DAF ne met pas la trésorerie en cause.** Dans l''hypothèse la plus défavorable
    — la mesure Ferrand vaudrait à elle seule les 26 k€ du volet B — l''économie retombe à 24 k€/mois,
    le déficit à 37 k€/mois, l''autonomie à 21 mois contre 13 aujourd''hui. La décision ne dépend donc
    pas de la ventilation des 26 k€, que je demande néanmoins. Et l''économie contestée s''éteint d''elle-même
    à M8 avec le départ de Ferrand : les 50 k€/mois annoncés ne sont pas un régime durable.


    ### 4. Ce sur quoi j''engage le laboratoire


    1. **Supervision de Vidal maintenue à 100 h/mois minimum sous Ferrand jusqu''à achèvement de la pratique,
    cible fin M6.** Plancher non négociable, non délégable, suivi mensuel au comité.

    2. **Sécurisation contractuelle de la présence de Ferrand jusqu''à fin M8** (prime de fidélisation,
    non-report du solde de congés au-delà de M6). Son préavis est aujourd''hui notre unique protection
    et il n''est protégé par rien.

    3. **Recrutement de l''apprenti signataire lancé en M1**, gel levé. Délai incompressible de 26 mois.

    4. **Trois questions écrites à l''organisme d''accréditation, réponse exigée avant exécution du plan
    :** (a) confirmation du prorata et du reset de superviseur tels que lus ci-dessus ; (b) **reconnaissance
    d''un signataire déjà agréé recruté à l''extérieur, et sous quel délai** ; (c) date d''agrément de
    Vidal confirmée par écrit. La question (b) est la plus rentable du dossier : elle est le seul mécanisme
    capable d''ajouter un signataire en moins de 26 mois.

    5. **Les deux contrats-cadres ne sont pas signés à échéance M9.** Ils exigent deux signataires dédiés
    en sus de l''activité courante, soit cinq au total ; nous en aurons quatre en M9 et trois en M15.
    Mandat est donné de négocier un démarrage différé assorti d''une option écrite, conditionné à deux
    recrutements de signataires agréés. **Ces 41 k€/mois couvrent les deux tiers du déficit courant :
    ils financent plusieurs fois les recrutements qu''ils exigent.** Le plan du DAF traite les signataires
    comme une ligne de coût ; ils sont la licence d''exploitation et la capacité de production.

    6. **Entretien de fidélisation avec Vidal cette semaine.** Elle est notre point de défaillance unique
    jusqu''à M27.


    ### 5. Le meilleur argument contre cette note, et ce qu''il vaut


    *« Vous échangez une économie certaine et chiffrée contre une lecture réglementaire hypothétique,
    dans une entreprise à treize mois d''autonomie. Si le référentiel est lu plus favorablement — prorata
    sans effet de seuil, reset limité aux changements définitifs — la variante à 70 h passe, et la refuser
    coûte de l''argent réel. »*


    Il ne tient pas, pour deux raisons. D''abord, la variante à 70 h échoue **sur l''arithmétique du référentiel
    lui-même**, à 5,60 contre 6,00 : elle n''a pas besoin d''une lecture défavorable pour tomber, il lui
    faut une lecture favorable pour tenir. Ensuite, l''asymétrie : le plan retenu laisse plus de vingt
    mois d''autonomie dans l''hypothèse la plus pessimiste, contre un maximum de 208 k€ d''économie cumulée
    abandonnée sur huit mois. Nous n''arbitrons pas entre la survie et la prudence, mais entre la prudence
    et un arrondi.


    Il déplace toutefois un point, et je l''accepte : **si l''organisme confirme par écrit, avant M1,
    à la fois l''absence d''effet de seuil du prorata et l''absence de reset après un temps suffisant
    sous Ferrand, la ligne est rouverte devant le comité.** Deux confirmations indépendantes, pas une.
    À défaut de réponse, la réponse est non.


    ### 6. Repli, déclencheurs, et ce qui renverserait ce choix


    **L''observation qui renverse cette note :** une confirmation écrite de l''organisme qu''un signataire
    déjà agréé peut être enregistré chez nous sous 90 jours. Elle sortirait Vidal du chemin critique,
    rendrait les contrats-cadres accessibles et permettrait de rediscuter le volet B dans son intégralité.
    C''est pour cela que la question part cette semaine.


    **Déclencheurs observables et conduite associée :**


    | Déclencheur | Conduite |

    |---|---|

    | Heures supervisées de Vidal < 100 sur un mois quelconque | Alerte CODIR sous 5 jours ; rattrapage
    le mois suivant ; confirmation écrite de l''organisme |

    | Départ de Ferrand annoncé avant fin M8 | Arrêt immédiat du volet B ; recrutement externe d''un signataire
    agréé ; information de l''organisme |

    | Agrément de Vidal non confirmé par écrit à M6 + 2 semaines | Vidal réputée non agréée ; recrutement
    externe activé |

    | Départ ou arrêt long de Marchand, Bouchard ou Nseka | Revue critique immédiate ; le plancher de
    3 est franchi |

    | Trésorerie < 450 k€ avant M12 | Réouverture du plan — sur toute ligne sauf celle de Vidal |


    Aucune reprise automatique : chaque déclencheur remonte au comité.


    ---


    **Verdict.** Volet A adopté en totalité. Volet B adopté à trois mesures sur quatre, la supervision
    de Vidal fixée à 100 h/mois. Économie retenue estimée entre 43 et 45 k€/mois selon la ventilation
    à produire, autonomie portée au-delà de 40 mois. La mesure écartée est écartée pour un motif unique
    et suffisant : elle est la seule du plan dont l''échec ne se répare pas.


    **Pire cas de la décision retenue :** un déficit résiduel supérieur d''environ 7 k€/mois pendant huit
    mois, soit ~56 k€, 7 % de la trésorerie actuelle. Il est encaissé par le compte d''exploitation. **Pire
    cas de la décision écartée :** la suspension à M15, encaissée par les 31 salariés et par les clients
    sous accréditation.


    **Première action, cette semaine :** courrier à l''organisme d''accréditation portant les trois questions
    du §4, et instruction écrite au responsable qualité fixant le plancher de 100 h/mois pour Vidal à
    compter de M1.


    ---


    *Note produite au palier critique : contact avec une branche de perte irrécupérable, plusieurs ensembles
    exposés. Le veto porte sur l''irrécupérabilité, non sur la variance : le surcoût de 56 k€ est de la
    variance et ne justifierait à lui seul aucun blocage.*

    '
