response:
  text: "# NOTE AU COMITÉ DE DIRECTION\n\n**Objet :** fermetures de magasins et objectif de +300 000 €\
    \ — recommandation\n**Pour décision :** comité du mardi\n\n---\n\n## En une phrase\n\nLes trois magasins\
    \ « en perte » ne perdent pas d'argent : ils rapportent ensemble **114 000 € par an**. Les fermer\
    \ ferait baisser le résultat, pas monter. Nous proposons de ne fermer aucun magasin mardi, de garder\
    \ une seule option ouverte (Vitry, décision dans 5 mois), et d'aller chercher les 300 000 € là où\
    \ ils se trouvent réellement : dans les 6,4 M€ de frais de siège et de logistique.\n\n---\n\n## 1.\
    \ Ce que dit vraiment la comptabilité\n\nLe résultat par magasin inclut une quote-part des frais de\
    \ siège et de logistique. Cette quote-part est le partage d'une facture commune : **elle ne disparaît\
    \ pas si le magasin ferme, elle se reporte sur les autres.**\n\n| Magasin | Résultat affiché | Quote-part\
    \ siège incluse | Ce que le magasin rapporte réellement |\n|---|---:|---:|---:|\n| Vitry | −118 000\
    \ € | 181 000 € | **+63 000 €** |\n| Chambéry | −96 000 € | 128 000 € | **+32 000 €** |\n| Nîmes |\
    \ −74 000 € | 93 000 € | **+19 000 €** |\n\nLes trois couvrent leurs propres loyers, salaires et charges\
    \ — et contribuent en plus 114 000 € au financement du siège.\n\nSi nous les fermions tous les trois,\
    \ le groupe perdrait ces 114 000 €, et les 402 000 € de frais communs qu'ils portaient se reporteraient\
    \ sur les 16 magasins restants. Plusieurs deviendraient « négatifs » à leur tour, au même compteur.\
    \ C'est le mécanisme classique : **chaque fermeture fabrique le déficitaire suivant.**\n\nL'objectif\
    \ est +300 000 €. La fermeture des trois donne **−114 000 €**, avant le premier euro de coût de sortie.\n\
    \n*Repère utile, tiré de la clé de répartition elle-même : ces trois magasins pèsent 2,8 %, 2,0 %\
    \ et 1,5 % du chiffre d'affaires du réseau — 6,3 % à eux trois.*\n\n---\n\n## 2. Trois situations\
    \ qui n'ont rien à voir entre elles\n\n**Chambéry — ne pas fermer, et ne pas y revenir cet exercice.**\
    \ Le bail court 6 ans sans clause de sortie : partir coûte 1,1 M€ tout de suite pour cesser d'encaisser\
    \ +32 000 € par an. Aucun retour sur investissement n'existe à cet horizon. Le magasin le plus proche\
    \ est à 92 km : le chiffre d'affaires perdu ne serait pas récupéré ailleurs. *Action : négociation\
    \ bailleur (baisse de loyer contre engagement de durée) et plan d'exploitation site.*\n\n**Nîmes —\
    \ séparer deux questions.** L'exploitation rapporte +19 000 €, sans loyer puisque nous détenons les\
    \ murs. C'est faible mais positif. La vraie question n'est pas « fermer ou pas », c'est « que faisons-nous\
    \ d'un actif de 1,9 M€ ? » — une décision de financement, à instruire à part. Attention : si nous\
    \ vendions les murs en restant locataires, Nîmes deviendrait réellement déficitaire. C'est notre décision\
    \ qui l'aurait rendu tel.\n\n**Vitry — la seule option qui mérite d'être gardée ouverte.** C'est le\
    \ seul site que nous pouvons quitter sans indemnité, et la fenêtre est datée : 7 mois. Deux points\
    \ doivent être établis avant de trancher :\n\n- **18 % des entrées sont des retraits de commandes\
    \ web.** Le magasin supporte le coût du service, le chiffre d'affaires part sur l'entité e-commerce.\
    \ Une partie de sa « perte » est un choix de comptabilité interne, pas une réalité économique. Corrigeable\
    \ sans négocier avec personne.\n- **Le magasin le plus proche est à 14 km.** Si une part significative\
    \ des clients s'y reporte, la fermeture devient gagnante. Sinon, nous détruisons 63 000 € pour rien.\
    \ Nous ne savons pas aujourd'hui laquelle des deux.\n\n*Un mot sur les compteurs d'entrée : ils sont\
    \ précis (±2 %, pas de demi-heure, 24 mois), mais ils comptent des entrées, pas des acheteurs, et\
    \ à Vitry près d'une sur cinq est un retrait web. Ils servent à organiser les horaires, pas à décider\
    \ d'une fermeture.*\n\n---\n\n## 3. Ce que nous engageons d'ici la décision (4 mois)\n\n1. **Reclasser\
    \ les 19 magasins hors frais de siège**, sur ce qu'ils rapportent réellement. Deux jours de contrôle\
    \ de gestion. Le classement ne sera probablement pas celui d'aujourd'hui.\n2. **Réattribuer à Vitry\
    \ la valeur du service e-commerce** qu'il rend (volume de retraits, CA associé, coût de traitement),\
    \ puis recalculer.\n3. **Estimer le report de clientèle**, en croisant deux sources imparfaites :\n\
    \   - la fermeture de Nîmes 5 semaines en mars 2024. Nous n'avons que les totaux mensuels des voisins\
    \ : cela donne un ordre de grandeur à 23 km, pas une mesure. Un seul événement, saisonnalité non neutralisée\
    \ — nous rendrons une fourchette, pas un chiffre.\n   - la carte de fidélité : 41 % des porteurs achètent\
    \ dans au moins deux magasins, à segmenter par distance. Biais connu : les porteurs (23 % des tickets)\
    \ sont plus mobiles que la moyenne. Traitée comme **borne haute**.\n4. **Ouvrir le chantier des 6,4\
    \ M€ de siège et logistique.** 300 000 € y représentent 4,7 % de l'enveloppe. Exigeant, mais c'est\
    \ le seul euro qui ne s'achète pas en détruisant de la marge.\n5. **Cadrer le volet social.** Nous\
    \ n'avons jamais fermé de magasin : information-consultation obligatoire, et au-delà d'un seuil de\
    \ suppressions, plan de sauvegarde de l'emploi. Plusieurs mois de calendrier et un coût à chiffrer\
    \ — ce calendrier est à lui seul incompatible avec un effet sur l'exercice prochain à Chambéry ou\
    \ Nîmes.\n\n---\n\n## 4. Ce qui nous ferait changer d'avis\n\nNous fermerons Vitry à l'échéance du\
    \ bail si **deux conditions** sont réunies : contribution toujours négative après réattribution du\
    \ service e-commerce, **et** marge récupérée au magasin de 14 km supérieure aux 63 000 € perdus. Le\
    \ seuil exact sera chiffré au point 3. Arbitrage au comité du mois 5, pas plus tard.\n\nÀ l'inverse,\
    \ **déclencheur de repli** : si à 4 mois le chantier siège n'a pas identifié 200 000 € d'économies\
    \ fermes, nous revenons devant l'actionnaire avec deux options explicites — cession des murs de Nîmes,\
    \ ou révision de la cible. Nous ne comblerons pas l'écart par une fermeture qui creuse le résultat.\n\
    \n---\n\n## 5. L'objection la plus sérieuse à cette note\n\n*« La répartition au prorata n'est pas\
    \ qu'un artifice : à force de garder des magasins peu contributifs, on maintient une structure de\
    \ siège que le réseau ne finance plus. »*\n\nElle est juste sur le fond, fausse sur le calendrier.\
    \ Les frais de siège ne sont pas éternellement fixes — mais ils ne baissent pas parce qu'un magasin\
    \ ferme, ils baissent parce qu'on décide de les baisser. C'est le point 4 de la section 3. Fermer\
    \ d'abord en espérant que le siège suive, c'est payer le coût immédiatement et attendre le bénéfice.\n\
    \n---\n\n## Décisions demandées mardi\n\n1. **Aucune fermeture votée ce jour.**\n2. **Vitry** maintenu\
    \ comme option ouverte ; arbitrage au comité du mois 5.\n3. **Chambéry et Nîmes** retirés de la liste\
    \ des fermetures pour cet exercice ; négociation bailleur ouverte à Chambéry.\n4. **Objectif de 300\
    \ 000 €** porté sur l'enveloppe siège et logistique, jalon à 200 000 € identifiés à 4 mois.\n5. **Première\
    \ action, dès mercredi** : lancement du reclassement des 19 magasins hors frais de siège.\n\n---\n\
    \nDeux points sur lesquels je ne peux pas m'engager avec les données fournies, et que je n'ai donc\
    \ pas chiffrés : le taux de report réel à 14 km (d'où la mesure au point 3.3) et le coût social d'une\
    \ fermeture, qui dépend des effectifs par site — non communiqués. Le premier conditionne la décision\
    \ Vitry ; le second ne change pas la recommandation, il l'aggrave dans le sens de la prudence.\n\n\
    Si vous voulez que je produise une version mise en page (PDF ou page partageable) pour distribution\
    \ au comité, dites-le-moi.\n"
