response:
  text: '# Note au conseil — séance du jeudi

    **Objet : affectation de l''enveloppe exceptionnelle de 900 000 €**


    ---


    ## 1. Ce que nous proposons de décider


    | Poste | Montant engagé | Décision demandée |

    |---|---|---|

    | **A — Parc machines**, renouvellement complet (6 machines) | **620 000 €** | Engagement en un lot,
    livraison échelonnée |

    | **B — Succession qualité**, promotion de l''adjointe + mission de transition du directeur sortant
    | **135 000 €** | Engagement immédiat, les deux ensemble |

    | **B — Option de repli**, mandat de recrutement externe conditionnel | **145 000 €** | Mandat signé
    jeudi, déclenché ou non au 4ᵉ mois |

    | **Total** | **900 000 €** | |


    ---


    ## 2. Les deux dossiers ne sont pas de même nature


    Le dossier A est une décision **mesurée et assurée** : cinq ans d''historique audité, un fournisseur
    qui s''engage avec pénalités, un achat divisible en tranches. Si nous nous trompons, nous le voyons
    dans les comptes et nous corrigeons.


    Le dossier B est une décision **non rattrapable**. Ce qui part avec le directeur qualité n''est pas
    une compétence — c''est une reconnaissance : celle de l''organisme notifié, sans laquelle nos dispositifs
    ne se vendent pas, et celle de deux clients hospitaliers qui pèsent 31 % du chiffre d''affaires. Ni
    l''une ni l''autre ne s''achète après coup. Le calendrier ne nous appartient pas : 11 mois, date fixe.
    Et comme il n''y a pas de second tour de table avant douze mois, ce que nous n''engageons pas jeudi
    sur B, nous ne pourrons pas l''engager du tout.


    **C''est pourquoi B est servi en premier et servi entièrement — non parce qu''il coûte cher, mais
    parce qu''il ne se rejoue pas.**


    ## 3. Sur B : les trois pistes RH ne sont pas des options concurrentes


    Elles ont été présentées comme un choix. C''est l''erreur à ne pas commettre.


    - Le **recrutement externe (280 k€)** amène quelqu''un qui n''a, par construction, aucune relation
    avec l''organisme notifié ni avec les deux clients. Il paie le plus cher ce qui résout le moins du
    problème — et il aurait de toute façon besoin du même recouvrement.

    - La **promotion de l''adjointe (45 k€)** apporte la continuité interne : trois ans de maison, connaissance
    du système qualité. Il lui manque exactement les relations externes.

    - La **mission de transition (90 k€)** est le seul instrument qui transfère ces relations. C''est
    le poste le plus utile de tout le dossier, et le moins cher.


    Nous recommandons **la promotion et la mission ensemble : 135 000 €.** La mission doit être assortie
    de trois obligations écrites, sans lesquelles elle ne vaut rien : successeure déclarée nominativement
    à l''organisme notifié **avant** le départ, présente à la prochaine visite de surveillance ; visites
    conjointes aux deux clients hospitaliers ; requalification documentée des 9 auditeurs internes.


    **L''option de repli (145 k€)** couvre le cas où l''adjointe ne tient pas le rôle. Le mandat du cabinet
    est signé jeudi — c''est la part qui doit être engagée sur cet exercice ; le surcoût salarial, lui,
    relèvera de la masse salariale des exercices suivants, pas de cette enveloppe. **Point de décision
    au 4ᵉ mois** (sept mois avant le départ) : si l''adjointe tient, le mandat est redéployé sur le recrutement
    d''un second référent réglementaire. Dans les deux cas l''argent sert, et dans les deux cas nous sortons
    de la situation actuelle — un seul homme entre nous et notre certification.


    ## 4. Sur A : ce que les chiffres disent vraiment


    Soyons exacts devant le conseil. Les pannes coûtent **environ 56 000 € par an** (213 000 € d''immobilisation
    directe sur 5 ans, plus 362 heures perdues par an à 38 € de marge). Rapporté à 620 000 €, cela donne
    un retour sur **onze ans**. Ce n''est pas, à soi seul, un dossier évident.


    Ce qui le rend acceptable tient à trois choses : des machines de 14 ans dont le taux de panne s''accélère
    avec l''âge (l''historique sous-estime les cinq années à venir), un écart de rebut de 4,1 % à 1,2
    % dont la valeur en euros n''est pas au dossier, et le fait que cette dépense ne sera pas finançable
    avant douze mois.


    **Deux vérifications à produire jeudi, avant le vote :**

    1. **La valeur en euros des 2,9 points de rebut.** C''est le seul chiffre qui peut faire passer A
    de « raisonnable » à « évident ». Il manque.

    2. **La base de calcul du taux de 96 %.** Sur nos propres heures de fonctionnement, notre disponibilité
    actuelle se situe déjà autour de 96 %. Si le fournisseur mesure autrement, cette garantie ne garantit
    rien. Elle doit être définie sur la même base que notre historique, sinon les pénalités sont décoratives.


    Nous recommandons **le lot complet**, avec livraison ordonnée des machines les plus défaillantes d''abord.
    Si l''historique machine par machine montre que deux d''entre elles pèsent chacune moins de 5 % des
    arrêts, elles sortent du lot et les fonds correspondants renforcent B.


    ## 5. L''objection la plus sérieuse à cette note


    On peut nous dire : *« vous mettez 620 000 € dans des machines à onze ans de retour, alors que le
    risque qui peut arrêter l''entreprise est un départ à onze mois. »*


    Elle est fondée, et voici la réponse. Sur B, la contrainte n''est pas l''argent mais le temps et le
    nombre de successeurs crédibles. Au-delà de 280 000 €, un euro de plus n''achète pas plus de sécurité
    : il achète un second inconnu. B est financé jusqu''à son point de saturation. A est le seul endroit
    où l''euro marginal se convertit encore en production mesurable.


    Enfin, sur le caractère non reconductible de l''enveloppe : il crée une pression à dépenser qui est
    elle-même un risque. **Si les deux vérifications du point 4 ne sont pas apportées jeudi, nous engageons
    A par tranche (3 machines, 310 000 €) et laissons le solde non engagé.** Perdre 310 000 € de droit
    de tirage coûte moins cher que d''acheter au mauvais prix une garantie qui n''en est pas une.


    ## 6. Ce que le conseil doit trancher jeudi


    1. **L''adjointe est-elle, oui ou non, la successeure ?** C''est la seule question dont dépend tout
    le reste du dossier B. Un « on verra » vaut « non » : il déclenche le mandat externe.

    2. **Le lot complet ou la tranche sur A**, au vu des deux chiffres réclamés au point 4.

    '
