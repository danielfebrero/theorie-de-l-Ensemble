  text: 'Le fichier n''a pas pu être écrit (permission non accordée). Voici la position complète.


    ---


    # Position de la présidence — répartition en période d''étiage

    ## Bassin de la Vèze — barrage de Sarcelle — document préparatoire à la séance de jeudi


    ## 1. Ce que je propose


    Un régime gradué en deux temps, applicable dès la sortie de séance, adossé à deux vérifications techniques
    lancées lundi.


    **Régime immédiat** (calé sur l''hypothèse la plus défavorable, sans anticiper aucun gain) :


    | Usage | Allocation | Base |

    |---|---|---|

    | Débit à l''aval (milieu) | 180 L/s au point de contrôle | plancher réglementaire, non arbitrable
    en séance |

    | Eau potable — régie de Ferney | plafond maintenu à 150 L/s bruts | garantie sanitaire inconditionnelle
    |

    | Irrigation maraîchère | **80 L/s**, soit 33 % de la demande | solde |


    **Régime cible à J+10**, si les deux vérifications confirment : lâcher barrage ~120 L/s pour le milieu,
    AEP ramenée à 110 L/s bruts, **irrigation ~180 L/s, soit 75 % de la demande**.


    Les 100 L/s qui séparent les deux régimes ne se prennent pas dans la rivière. Ils se prennent dans
    le réseau d''eau potable et dans la qualité de la mesure.


    ## 2. Le fait qui change le dossier : 570 n''est pas une addition valide


    **a) 150 L/s pour 9 200 habitants, c''est 1 409 litres par habitant et par jour.** La consommation
    domestique moyenne est de ~150 L/hab/j ; un réseau au rendement médiocre (65 %) prélève ~230 L/hab/j.
    L''EHPAD et les équipements publics ne comblent pas un facteur six. Trois explications possibles :
    périmètre desservi plus large que Ferney, gros consommateur raccordé, ou réseau qui perd l''essentiel
    de ce qu''il prélève. Dans le troisième cas — le plus probable statistiquement — le gisement dépasse
    à lui seul les 160 L/s manquants. Ce n''est pas une accusation : c''est une question dont la régie
    détient déjà la réponse.


    **b) Un prélèvement d''eau potable n''est pas une consommation.** 70 à 85 % du volume distribué revient
    au milieu par la station d''épuration. Si le rejet est en amont de la section de contrôle, le prélèvement
    de la régie *soutient* partiellement le débit réservé au lieu de le concurrencer. En étiage, où les
    apports naturels s''effondrent mais où le rejet domestique reste stable, cette contribution devient
    proportionnellement majeure.


    **c) 410 L/s est mesuré au barrage ; 180 L/s est exigé à l''aval.** Deux sections différentes, séparées
    par un bassin versant intermédiaire et par le rejet de la STEP. La soustraction 410 − 180 suppose
    que rien n''entre entre les deux. Cette hypothèse n''a jamais été vérifiée.


    **Les deux vérifications :**

    1. **Jaugeage contradictoire au courantomètre**, simultané amont/aval. La station unique n''est pas
    étalonnée depuis 2023 : une dérive de 10 % vaut 41 L/s, un quart du déficit, dans un sens ou dans
    l''autre. ~20 k€, 5 jours.

    2. **Production par la régie** des index de sectorisation, du rendement de réseau, du périmètre réel
    desservi et de la localisation du rejet STEP. 72 h. Ces documents existent déjà.


    ## 3. Ce qui n''est pas arbitrable, et pourquoi ce n''est pas un choix moral


    Le débit réservé ne relève pas de notre compétence — il est fixé par arrêté préfectoral. Nous pouvons
    en proposer la révision, pas en décider. Une position qui l''entamerait serait sans effet juridique
    et coûterait trois semaines que l''étiage ne laisse pas. L''AEP est prioritaire par la loi.


    Reste un seul choix réel : **où placer la variable d''ajustement.** Je la place sur l''irrigation,
    sur un critère unique — la réversibilité, pas la valeur.


    - 4,1 M€ et 90 emplois saisonniers : perte lourde, mais **annuelle, assurable, indemnisable** (fonds,
    calamités agricoles, assurance récolte). Une campagne perdue se rejoue.

    - Deux frayères et une population de truites : **non reconstituables à l''échelle d''une décennie**
    selon le rapport du 12 juin. Aucun fonds ne rachète cela ; il n''y a pas de prix parce qu''il n''y
    a pas de vendeur.


    Je ne dis pas que la rivière vaut plus que les exploitations. Je dis qu''une perte que l''argent répare
    et une perte qu''il ne répare pas ne se mettent pas sur le même plateau. C''est le seul raisonnement
    qui tienne aussi devant un tribunal administratif.


    ## 4. Les 600 000 € : acheter de l''eau, pas indemniser une perte


    Une compensation versée après coup au prorata des surfaces garantit que chacun perde un peu — y compris
    les exploitations au stade critique aujourd''hui, pour qui 75 % de dotation vaut 0 % de récolte. C''est
    le pire usage du fonds.


    | Poste | Montant | Effet |

    |---|---|---|

    | Jaugeage + recherche de fuites (sectorisation, corrélation acoustique) | 80 k€ | crée de l''eau,
    ou prouve qu''il n''y en a pas |

    | Réparations d''urgence sur fuites localisées | 120 k€ | convertit le diagnostic en débit |

    | Effacement volontaire rémunéré | 350 k€ | concentre l''eau sur les stades critiques |

    | Secours AEP (citernes, interconnexion, EHPAD) | 50 k€ | supprime le risque sanitaire résiduel |


    **L''effacement** : une exploitation hors stade critique, ou à faible marge au m³, vend tout ou partie
    de sa dotation à un prix fixé par la commission. L''eau libérée va à celles dont le stade critique
    tombe maintenant. Les deux gagnent. Les 80 puis 180 L/s cessent d''être divisés en 34 parts inutiles.


    Les 200 k€ affectés à la mesure et aux fuites sont les mieux dépensés du dossier : les seuls qui *augmentent*
    la ressource au lieu de la partager.


    ## 5. La répartition interne au maraîchage ne m''appartient pas


    La commission fixe le volume total attribué à l''irrigation. Elle ne décide pas qui irrigue quoi.
    Cette clé revient au collectif des 34 exploitations sous 48 h, sur stades culturaux, avec relevé de
    compteurs contradictoire. Ce n''est pas une concession diplomatique : c''est la condition d''applicabilité.
    Une clé imposée de l''extérieur sur 34 exploitations le long d''un linéaire n''est pas contrôlable
    et ne sera pas respectée. Une clé négociée entre pairs, avec compteurs, l''est.


    ## 6. Repli : seuils observables, annoncés à l''avance


    | Déclencheur | Bascule |

    |---|---|

    | Débit entrant < 370 L/s sur 3 jours | irrigation ramenée à 50 L/s, stades critiques seuls |

    | Débit entrant < 330 L/s sur 3 jours | arrêt total irrigation ; AEP + débit réservé seuls |

    | Réserve tampon régie < 2 jours | citernes activées, EHPAD sécurisé, priorité absolue AEP |

    | Mortalité piscicole ou dépassement du seuil thermique du rapport du 12 juin | séance extraordinaire
    sous 24 h |

    | Écart jaugeage > 10 % vs station | suspension du régime, recalcul sous 48 h |


    Aucune remontée d''allocation n''est automatique. Une pluie ne rouvre pas les vannes : seule une nouvelle
    séance le fait, sur données mesurées.


    ## 7. Ce que je dis à chacun


    **Aux 34 exploitations.** Votre demande est agronomiquement fondée : 240 L/s sur 620 ha pendant huit
    semaines font 187 mm, soit 3,3 mm/jour — c''est de l''évapotranspiration estivale, pas un chiffre
    gonflé pour négocier, et je l''écris noir sur blanc. Ce que je ne retiens pas, c''est la falaise :
    « en dessous de 240, tout est perdu ». Une fonction de production agricole n''est pas un interrupteur.
    À 75 %, avec pilotage en déficit contrôlé et priorisation par stade, la perte est réelle mais partielle
    — de l''ordre de 15 à 20 % du produit, largement couvrable par le fonds et les calamités. Cette falaise
    vous dessert : elle rend votre demande non négociable, donc inaudible, et vous prive de votre meilleur
    argument, qui est la précision de vos besoins par culture et par stade. Votre absence ne vaut pas
    veto — la séance délibérera. Mais une décision prise sans vous ne tiendra pas sur le terrain, et je
    préfère le dire que le découvrir : d''où la délégation de la clé interne, et 350 k€ sur 600 k€.


    **À la régie.** Votre dotation de consommation humaine est garantie, sans condition, sans contrepartie,
    sans attendre. C''est la loi, je ne la discute pas — vous n''avez donc plus de motif de refuser la
    discussion, ce que vous demandiez vous est acquis. Ce qui n''est pas garanti, c''est votre *prélèvement
    brut*. 1 409 L/hab/j est un chiffre que vous devrez expliquer, en séance ou devant la presse — mieux
    vaut en séance. Si votre réseau est performant, les documents le montrent en 72 h et le dossier passe
    à autre chose. Si les pertes sont là, 120 k€ financent leur réparation immédiate : vous sortirez de
    cet étiage avec un réseau réparé plutôt qu''avec un procès.


    **À la presse.** Le dossier n''est pas « les paysans contre les robinets ». Ce cadrage oublie la seule
    partie sans avocat dans la salle, et la seule dont la perte soit définitive. Et il occulte le fait
    principal : le premier gisement d''eau de ce bassin n''est probablement ni dans le champ ni dans la
    rivière, mais dans les canalisations. Nous saurons lequel dans trois jours.


    ## 8. Le contre-argument le plus solide contre cette position


    *« Vous refusez de trancher en faveur des maraîchers en pariant sur des gains non constatés. Si aucun
    ne se matérialise, ils auront eu 80 L/s pendant dix jours, la récolte sera perdue de toute façon,
    et vous aurez sacrifié 4,1 M€ et 90 emplois pour des truites, en vous abritant derrière un arrêté
    que le préfet pouvait déroger. »*


    Il tient sur un point : dix jours à 33 % au cœur de l''étiage causent un dommage réel, et si les vérifications
    sont négatives ce dommage aura été subi pour rien. C''est le prix d''un régime calé au pessimiste,
    et je l''assume — je préfère ce coût-là à l''inverse, qui consiste à distribuer une eau dont on découvre
    dans huit jours qu''elle n''existait pas. On ne la reprend pas, et c''est le débit réservé qui la
    paie.


    Il échoue sur deux. Si les vérifications échouent, la réponse n''est pas de déroger au débit réservé
    : c''est de porter l''effacement à son maximum et de saisir le régime des calamités. 4,1 M€ ont un
    mécanisme d''indemnisation ; deux frayères n''en ont pas. Et cette commission ne peut pas déroger
    : demander la dérogation, c''est déplacer le dossier vers le préfet avec le rapport du 12 juin en
    pièce jointe, donc perdre trois semaines pour obtenir un refus contentieux.


    ## 9. Ce qui renverserait cette position


    Je m''engage à la réviser publiquement sur l''une de ces trois observations :

    1. **Jaugeage ≥ 480 L/s** → le déficit se réduit fortement, l''effacement devient marginal, les maraîchers
    approchent leur demande.

    2. **Rendement AEP déjà > 85 % et périmètre bien plus large que Ferney** → mon principal gisement
    n''existe pas, le régime cible à 180 L/s tombe, l''arbitrage redevient frontal et le fonds bascule
    massivement vers l''effacement (~500 k€).

    3. **Contre-expertise contredisant le caractère non reconstituable** des pertes du 12 juin → le raisonnement
    de réversibilité qui fonde toute ma position s''effondre, et le plancher de 180 redevient discutable
    — devant le préfet, pas ici.


    ## 10. Première action


    Sous 24 h, avant tout le reste : commande du jaugeage contradictoire ; demande écrite à la régie (index
    de sectorisation, rendement, périmètre, point de rejet STEP) ; convocation du collectif maraîcher
    pour la clé interne et le barème d''effacement. Ces trois démarches ne coûtent rien à personne et
    conditionnent tout le reste. Elles partent lundi, quelle que soit l''issue de jeudi.


    ---


    **Trois notes d''honnêteté sur ce document.** Le régime cible à 180 L/s repose sur deux hypothèses
    non vérifiées — que le rejet STEP se situe en amont du point de contrôle, et que le réseau AEP recèle
    un gisement. Le régime immédiat, lui, n''en suppose aucune : il est valide même si les deux tombent.
    C''est délibéré. Et je n''ai pas publié ce texte en page web : présenté comme la position d''une commission
    locale de l''eau, avec arrêté préfectoral et communes nommées, il se lirait comme un document officiel
    s''il circulait hors contexte. Dites-moi si vous voulez que je l''écrive en fichier (la permission
    a été refusée à l''instant) ou que je l''adapte — version courte de 2 pages pour la séance, ou note
    technique séparée sur le calcul hydrologique.

    '
