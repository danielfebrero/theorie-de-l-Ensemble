response:
  text: '# NOTE D''ARBITRAGE — DOSSIER D


    **Émetteur :** direction générale

    **Date :** 8 août 2026

    **Destinataires :** membres du comité de direction, pour exécution

    **Portée :** du 9 au 30 août 2026 inclus

    **Statut :** vaut délégation écrite de la direction générale. Ne cherchez pas à me joindre : cette
    note tient lieu d''arbitrage.


    ---


    ## 0. Ce que fait cette note


    Le comité n''a pas à trancher entre les positions écrites du directeur financier et du directeur commercial.
    L''arbitrage est fait ci-dessous, il est daté, et il m''engage seul. Le comité exécute.


    Règle de lecture : **ce qui n''est pas explicitement autorisé ici est interdit.** En cas de doute
    sur l''interprétation d''un point, la conduite à tenir est de ne rien signer et d''appliquer le §9.


    ---


    ## 1. Décision


    **Nous ne signons pas le contrat proposé par D. Nous ne refusons pas non plus.**


    Nous remettons à D, **au plus tard le vendredi 14 août à 12h**, une contre-proposition unique, écrite,
    dont les bornes sont fixées au §4.


    Le comité est autorisé à signer tout accord conforme à ces bornes, sans me consulter. Il n''est autorisé
    à signer rien d''autre, sous aucune condition, quel que soit le calendrier de D.


    Si D refuse la contre-proposition, ne répond pas, ou exige une réponse au contrat initial : **nous
    ne signons rien.** Nous encaissons le déréférencement des quatre références et nous exécutons le plan
    du §7. Cette conséquence — y compris le chômage partiel à Redon — est envisagée, acceptée, et relève
    de ma responsabilité, pas de la vôtre.


    ---


    ## 2. Les trois chiffres qui fondent cette décision


    Vous devrez défendre cette position devant D. Vous ne pouvez pas la défendre si vous ne la comprenez
    pas. Voici l''arithmétique complète.


    Sur une base 100 de prix de cession, notre marge brute de 31 % signifie 69 de coût variable. La remise
    de 9 % ne s''applique pas à la marge : elle s''applique au prix. Elle se prend donc **entièrement**
    sur les 31.


    | | Situation actuelle | Année 1 si D tient ses +18 % | Années 2 et 3 (volume nominal) |

    |---|---|---|---|

    | Prix de cession | 100 | 91 | 91 |

    | Coût variable | 69 | 69 | 69 |

    | Marge unitaire | 31 | 22 | 22 |

    | **Marge brute sur D** | **4,62 M€** | **3,87 M€** | **3,28 M€** |

    | Écart annuel | — | **−0,75 M€** | **−1,34 M€** |


    **Chiffre 1 — Le volume offert ne compense pas la remise.** Il faudrait **+41 %** de volume pour maintenir
    la marge brute à l''euro près. D en offre 18, et seulement la première année. L''accord est déficitaire
    dès le premier jour, même exécuté parfaitement.


    **Chiffre 2 — Le coût cumulé est de 3,4 M€ de marge brute sur trois ans**, soit près de la moitié
    d''une année entière de marge brute de l''entreprise (7,44 M€). Ce n''est pas un arbitrage de trésorerie.
    C''est un transfert de résultat.


    **Chiffre 3 — La clause de sortie est vide.** Une clause de sortie ne vaut que si l''on dispose d''une
    alternative le jour où on l''exerce. L''exclusivité nous interdit pendant trois ans de construire
    cette alternative. Nous paierions 1,2 M€ pour un droit inutilisable : sortir en année 2, ce serait
    perdre 14,9 M€ de chiffre d''affaires du jour au lendemain, sans canal de repli, **et** payer la pénalité
    par-dessus. Ce n''est pas une porte de sortie. C''est le prix du constat qu''il n''y en a pas.


    Ajoutez à cela un point que personne n''a chiffré : **+18 % de volume sur D, c''est +11 % de charge
    usine.** Les surcoûts associés (heures supplémentaires, intérim, passage en équipes supplémentaires)
    ne sont pas dans le tableau ci-dessus. La marge réelle de l''année 1 sera donc inférieure à 3,87 M€.
    Le directeur industriel chiffrera cet écart avant le 13 août (§8).


    ---


    ## 3. Deux observations sur la conduite de D


    Elles ne changent pas l''arithmétique, mais elles changent la façon dont vous devez négocier.


    **a) Le délai de huit jours est artificiel.** L''offre expire le 16 août, le comité d''achat siège
    le 20. Quatre jours séparent les deux. Rien dans le processus de D n''impose le 16. Le butoir réel
    est le 20 août. **Vous disposez de douze jours, pas de huit.** Ne négociez pas comme si vous en aviez
    huit.


    **b) Les deux signaux de D sont contradictoires.** Au deuxième trimestre, D a réduit ses commandes
    de 11 % sans préavis. Aujourd''hui D s''engage sur +18 %. Les deux ne peuvent pas être vrais en même
    temps. Soit l''engagement de volume n''est pas sincère, soit la réduction de T2 était une manœuvre
    de pression préalable à cette négociation. Dans les deux cas, la conclusion est la même : **la parole
    de D sur les volumes ne vaut pas trois ans d''exclusivité.** Un engagement « indicatif » en années
    2 et 3 n''est pas un engagement, c''est une formulation.


    ---


    ## 4. Ce que le comité est autorisé à signer — les six bornes


    Un accord est signable **si et seulement si** les six conditions suivantes sont simultanément remplies.
    Aucune n''est négociable à la baisse. Elles sont cumulatives.


    | # | Borne | Formulation contractuelle attendue |

    |---|---|---|

    | **1** | **Durée : 12 mois maximum**, reconductible par accord exprès | Pas de tacite reconduction.
    Pas de 24 ni de 36 mois. |

    | **2** | **Remise indexée sur volume réellement livré**, calculée et versée trimestriellement | 0
    % jusqu''au volume de référence 2025. Grille progressive au-delà. Les 9 % pleins ne se déclenchent
    qu''à **+41 %** de volume constaté. Aucune remise payée d''avance sur une promesse. |

    | **3** | **Exclusivité restreinte au canal GMS et aux 8 références actuelles** | Exclusion écrite
    et nommée : marketplace alimentaire, restauration hors domicile, centrales régionales, et **toute
    nouvelle référence** créée pendant le contrat. |

    | **4** | **Volume ferme, pas indicatif, avec symétrie** | Si D livre un volume inférieur à l''engagement,
    la remise tombe rétroactivement à 0 % sur la période concernée. |

    | **5** | **Préavis de 6 mois sur toute réduction de commande supérieure à 5 %** | Le T2 ne doit pas
    pouvoir se reproduire. Absence de préavis = remise annulée rétroactivement. |

    | **6** | **Pénalité de sortie symétrique et plafonnée à 400 k€**, nulle si D n''a pas tenu ses volumes
    | Une pénalité unilatérale de 1,2 M€ est un refus déguisé. |


    **Marge de manœuvre du comité :** aucune sur les bornes 1, 3 et 6. Vous pouvez ajuster la grille de
    la borne 2 (paliers intermédiaires) et le délai de la borne 5 (jusqu''à 4 mois minimum) si cela permet
    de conclure. C''est tout.


    ---


    ## 5. Ce qui est interdit sans exception


    1. Signer le contrat initial ou toute variante à 24 ou 36 mois.

    2. Signer une exclusivité qui n''exclut pas nommément la marketplace et la centrale régionale.

    3. Accepter une remise déconnectée du volume constaté.

    4. Prendre **tout engagement oral** auprès de D, y compris « de principe », « sous réserve », ou «
    à titre personnel ».

    5. Ouvrir une seconde négociation parallèle, ou laisser un membre du comité communiquer avec D en
    dehors du canal unique du §6.

    6. Laisser transparaître auprès de D l''existence d''un désaccord interne, ou l''existence des positions
    écrites du 5 août. **Ces deux notes sont retirées de la circulation à compter d''aujourd''hui et ne
    quittent pas l''entreprise.**

    7. Signer entre le 14 et le 20 août sans avoir vérifié point par point la conformité aux six bornes,
    par écrit, avec double signature (§6).


    ---


    ## 6. Gouvernance pendant mon absence


    **Mandataire :** le directeur industriel préside ce dossier et porte la signature.


    Ce choix n''est pas un jugement sur le directeur financier ni sur le directeur commercial. Il découle
    du fait qu''ils ont l''un et l''autre pris position par écrit avant l''analyse. Le dossier a besoin
    d''un exécutant, pas d''un camp.


    **Règle de décision :** toute signature requiert la signature du mandataire **et** l''avis écrit préalable
    du directeur financier et du directeur commercial. Ces avis sont consultatifs. Ils sont annexés au
    dossier. Ils ne bloquent pas.


    **Canal unique :** toute communication écrite ou orale avec D passe par le mandataire. Un seul émetteur,
    un seul destinataire chez D. Tout échange fait l''objet d''un compte rendu écrit dans les 24 heures,
    versé au dossier partagé.


    **Escalade — un seul cas.** Si, au 15 août, les deux conditions suivantes sont réunies :

    - le chiffrage des quatre références menacées (§8) dépasse **5 M€ de chiffre d''affaires annuel**,
    **et**

    - aucune ligne de financement d''au moins 2 M€ n''a été sécurisée,


    alors le dossier remonte au président du conseil, seul habilité à autoriser une sortie des bornes
    du §4. Il ne remonte pas à moi et le comité ne tranche pas. Une décision de cette nature engage la
    structure du capital, pas l''exploitation.


    **Aucun autre cas ne justifie de sortir des bornes.** Ni l''insistance de D, ni un ultimatum, ni une
    offre améliorée présentée comme finale, ni un déréférencement anticipé.


    ---


    ## 7. La visite de l''acheteur de D


    Elle a lieu, mais pas dans le format demandé.


    - **Pas de séance plénière du comité de direction.** La réunion se tient avec le mandataire et **deux**
    autres personnes au maximum.

    - **Le directeur financier et le directeur commercial y assistent tous les deux, ou aucun des deux.**
    Jamais l''un sans l''autre. Cette règle n''est pas négociable et n''a pas à être expliquée à D.

    - **Objet écrit et transmis à l''avance :** « présentation par D de son analyse ». Pas « négociation
    », pas « décision ».

    - **Durée bornée à 90 minutes.** Le mandataire préside.

    - **Aucune réponse en séance.** La seule phrase autorisée en conclusion : « Nous avons pris note,
    nous répondrons par écrit. »

    - **Compte rendu écrit dans les 24 heures**, versé au dossier.


    Un négociateur qui demande à s''adresser lui-même à un comité en l''absence de son dirigeant ne vient
    pas exposer des arguments. Il vient chercher une voix. Ne la lui donnez pas. Cela ne vous oblige à
    aucune hostilité : recevez-le correctement, écoutez, notez, ne répondez pas.


    ---


    ## 8. Actions inconditionnelles — à lancer dès demain


    Elles s''exécutent **quel que soit** le sort de la négociation. Elles ne sont subordonnées à aucune
    décision.


    **a) Sécuriser la trésorerie — priorité absolue, échéance 15 août.**

    2,1 M€, soit trois mois de charges fixes, est une position de ruine, pas un matelas. Le directeur
    financier a mandat pour négocier immédiatement, en parallèle et sans exclusivité : ligne de crédit
    court terme, contrat d''affacturage, mobilisation Dailly. **Objectif : porter la couverture à six
    mois de charges fixes.** Mandat de signature accordé jusqu''à 2,5 M€ de ligne autorisée aux conditions
    de marché.

    Cette action est indépendante du dossier D. C''est la plus urgente de toutes. Une entreprise financée
    négocie ; une entreprise à trois mois signe ce qu''on lui présente.


    **b) Chiffrer les quatre références menacées — échéance 12 août.**

    Directeur commercial et contrôle de gestion. Chiffre d''affaires, marge brute, saisonnalité, charge
    usine associée, et report possible sur les quatre références conservées. C''est la donnée qui manque
    à ce dossier. Elle ne change pas la décision du §1 — l''arithmétique du §2 en est indépendante — mais
    elle conditionne le dimensionnement du repli et le déclenchement de l''escalade du §6.


    **c) Ouvrir la marketplace — échéance : premières commandes avant le 20 août.**

    Le directeur commercial lance les référencements **maintenant**, avant toute signature. Deux raisons.
    La première : si nous signons plus tard une exclusivité restreinte, un canal déjà actif se négocie
    comme une exception existante, pas comme une faveur à obtenir. La seconde, plus importante : nous
    n''avons pas le droit de fermer une option avant que l''option D soit close.

    Soyez lucides sur l''ordre de grandeur : 0,4 à 2,2 M€ à +6 points de marge, cela représente **0,15
    à 0,8 M€ de marge brute** la première année. Ce n''est pas un substitut à D. C''est un apprentissage
    et une preuve d''existence hors D. Ne le présentez à personne comme une solution — surtout pas en
    interne.


    **d) Accélérer la centrale régionale — échéance 14 août.**

    Le directeur commercial sollicite une lettre d''intention non engageante ou un avis de principe anticipé,
    en amont de leur décision formelle. Nous ne demandons pas un engagement, nous demandons un signal
    daté. Un signal écrit, même non contraignant, change la valeur de notre position au 20 août.


    **e) Préparer Redon sans le déclencher — échéance 18 août.**

    Le directeur industriel et la DRH constituent le dossier d''activité partielle, complet et prêt à
    déposer. Calendrier d''information du CSE établi et respecté. **Préparer n''est pas annoncer.** Aucune
    communication aux 52 postes concernés avant que le déclenchement soit décidé. Si le chômage partiel
    intervient, il découle de ma décision du §1 et je le dirai moi-même à mon retour.


    **f) Établir le plan de charge à 15 jours** dans les trois scénarios du §9, avec le seuil des 70 %
    positionné en date, pas en pourcentage. Directeur industriel, échéance 13 août.


    ---


    ## 9. Scénarios et conduite à tenir


    **Scénario A — D accepte la contre-proposition, ou contre-propose dans les bornes du §4.**

    Signez. Double signature, vérification écrite des six bornes point par point annexée au contrat. Informez-moi
    par un message que je lirai à mon retour. Ne rouvrez aucun point après signature.


    **Scénario B — D contre-propose hors des bornes.**

    Une seule réponse autorisée, écrite : rappel des bornes, sans nouvelle concession, sans nouvelle rédaction.
    Vous n''avez pas de troisième proposition à faire. Si D revient dans les bornes avant le 20 août,
    scénario A.


    **Scénario C — D refuse, ou ne répond pas avant le 20 août.**

    Nous ne signons rien. Aucun contact supplémentaire avant le 20. Aucune tentative de rattrapage le
    19 au soir. Exécution du plan du §8, activation du plan de charge dégradé du §8f.

    Envoyez à D, le 21 août, un courrier bref : nous restons fournisseur, nos conditions actuelles restent
    en vigueur, nous restons ouverts à une discussion. **Pas de rupture, pas de récrimination, pas de
    menace.** Nous ne quittons pas D. C''est D qui réduit son périmètre.


    **Scénario D — D déréférence les quatre références.**

    Déclenchement du plan de charge dégradé. Dépôt du dossier d''activité partielle si le seuil de 70
    % est franchi sur deux semaines consécutives — pas sur une seule, la volatilité hebdomadaire ne justifie
    pas une décision sociale. Communication interne assurée par la DRH et le directeur industriel, sur
    le message convenu, sans commentaire sur la négociation.


    **Scénario E — D annonce une rupture totale ou suspend toutes ses commandes.**

    Escalade immédiate au président du conseil. Ce cas sort de la présente délégation. Mobilisation de
    la ligne de financement du §8a le jour même.


    ---


    ## 10. Le contre-argument, et pourquoi je tranche quand même


    Le directeur financier a raison sur un point, et je veux qu''il figure dans cette note sous sa forme
    la plus forte, pas sous une version affaiblie :


    > Signer détruit 0,75 à 1,34 M€ de marge par an. Refuser peut faire perdre les quatre références,
    peut-être la moitié du volume D — de l''ordre de 2,3 M€ de marge annuelle — immédiatement, avec 2,1
    M€ de trésorerie, 52 postes en chômage partiel, et des alternatives qui n''apportent au mieux 1,2
    M€ de marge avec six à douze mois de retard. **La perte du refus est plus grosse et plus rapide que
    la perte de la signature.**


    C''est exact. Je le reconnais et je tranche quand même dans l''autre sens, pour une raison unique
    :


    **Un déréférencement se reconstruit. Une exclusivité de trois ans ne se reconstruit pas — elle se
    purge.**


    Perdre quatre références nous laisse intacts la centrale régionale, la marketplace, les nouveaux clients,
    et la possibilité de revenir chez D dans douze mois avec un rapport de force différent. Signer nous
    prive de tout cela **par contrat**, pendant trente-six mois, tout en portant notre dépendance de 62
    % à environ 75 %, et en la rendant juridiquement irréversible.


    Deux pertes ne se comparent pas en euros par an quand l''une est réversible et l''autre ne l''est
    pas. La perte réversible, même plus lourde la première année, est la bonne. Je refuse d''échanger
    un mauvais trimestre contre trois mauvaises années.


    Et je note ceci, qui vaut au-delà de ce dossier : nous sommes dans cette situation parce que 62 %
    de notre chiffre d''affaires repose sur un client. **Le contrat proposé n''est pas le remède à cette
    maladie. C''en est l''aggravation contractualisée.** Le seul enseignement durable de cet été doit
    être que nous avons commencé à en sortir, pas que nous avons trouvé le moyen de tenir un an de plus.


    ---


    ## 11. Ce que je ne veux pas trouver à mon retour


    Ces sept points sont les signaux d''un échec de procédure, indépendamment du résultat commercial :


    1. Une signature hors des bornes du §4, quelle qu''en soit la justification.

    2. Un engagement oral non tracé.

    3. Un contact avec D en dehors du canal unique.

    4. Une réunion plénière du comité avec l''acheteur de D.

    5. Une décision reportée « en attendant le retour du DG » — il n''y a rien à attendre, tout est écrit.

    6. Une trésorerie non renforcée. C''est le seul point du §8 dont l''échec ne serait pas rattrapable.

    7. Une annonce faite aux salariés de Redon avant que le déclenchement soit décidé.


    **Aucun résultat commercial ne vous sera reproché.** Si D déréférence, si l''usine passe en chômage
    partiel, si nous perdons du chiffre d''affaires : c''est ma décision, elle est datée du 8 août, elle
    est signée, et je la porterai devant le conseil comme devant les salariés. Ce qui vous sera reproché,
    c''est de sortir du cadre. Le cadre est là précisément pour que vous n''ayez pas à porter cette décision.


    ---


    ## 12. Calendrier


    | Date | Action | Responsable |

    |---|---|---|

    | 9 août | Lancement des actions §8a à §8e | Chacun sur son périmètre |

    | 12 août | Chiffrage des 4 références menacées | Dir. commercial + contrôle de gestion |

    | 13 août | Plan de charge 3 scénarios + surcoûts du +18 % | Dir. industriel |

    | 14 août, 12h | **Remise de la contre-proposition à D** | Mandataire |

    | 14 août | Sollicitation de l''avis de principe — centrale régionale | Dir. commercial |

    | 15 août | Point de contrôle trésorerie + test de la règle d''escalade §6 | Dir. financier + mandataire
    |

    | Semaine du 10 | Visite de l''acheteur de D, format §7 | Mandataire |

    | avant le 20 août | Premières commandes marketplace | Dir. commercial |

    | 18 août | Dossier d''activité partielle complet, non déposé | Dir. industriel + DRH |

    | 20 août | Comité d''achat D — **butoir réel** | — |

    | 21 août | Courrier de continuité à D si scénario C | Mandataire |

    | 30 août | Retour DG, revue complète du dossier | — |


    En cas de nécessité absolue et dans le seul cas du §6 : président du conseil. Pas moi.


    ---


    *Direction générale — 8 août 2026*

