    # Prestataire de paiement — recommandation


    **Pour le comité de direction du vendredi 14 août 2026 · Direction des opérations**


    ## Recommandation : Option B — mais avancée de sept semaines


    On signe Payflux. On ne bascule pas le 3 novembre. **On rampe du 14 septembre au 2 novembre, à l''intérieur
    du contrat Solda déjà payé.**


    | | 10 % | 25 % | 50 % | 100 % |

    |---|---|---|---|---|

    | Semaines | 14–27 sept | 28 sept–11 oct | 12 oct–1ᵉʳ nov | à partir du 2 nov |


    Payflux atteint la pleine charge le 2 novembre — **25 jours avant Black Friday**, après avoir déjà
    traité sept semaines de notre trafic réel.


    ## Pourquoi pas A


    Le pilote Payflux montre 1,3 % d''échec pendant trois semaines. Sous A, ces trois semaines vont **du
    3 au 24 novembre. Black Friday tombe le 27.** Trois jours de marge. Notre propre taux d''échec double
    au pic (0,4 % → 0,9 %) : le pic stresse la chaîne de paiement. Y entrer avec une intégration de trois
    semaines et demie, à 100 % du volume, est le mauvais appariement.


    Coût de ces trois semaines : à 756 000 € de volume par jour, un écart de 0,9 point vaut 6 800 €/jour,
    soit **143 k€ de volume exposé** — concentrés sur les trois semaines les plus chères de l''année.
    La même rampe démarrée en septembre à 10 % expose **21 k€**, hors saison.


    **Et B tel qu''écrit est le pire des deux.** Départ le 3 novembre, dix semaines : la rampe traverse
    Black Friday *et* Noël, et oblige à prolonger Solda en décembre et janvier (260 k€). L''économie annoncée
    de 310 k€ tombe à ~50 k€. Ce n''est pas le calendrier qu''il faut corriger d''un mois : c''est de
    sept semaines, vers l''avant.


    ## Ce que ça coûte, et ce qu''on achète


    Écart de trésorerie contre l''option A : **~113 k€** de double run (2,5 mois × 45 k€) plus **130 k€**
    d''extension Solda en décembre, si on la prend. Soit **~240 k€ une fois**, sur un contrat qui économise
    1 M€ sur 24 mois.


    Soyons nets : ce n''est pas rentable au sens comptable. 240 k€ de trésorerie contre 122 k€ de volume
    d''échecs évité, dont seule la marge compte réellement. **On ne paie pas 240 k€ pour éviter des échecs
    de paiement. On les paie pour garder le droit de faire demi-tour pendant les deux pics.**


    Ce droit est la seule chose du dossier qu''on ne peut pas racheter après coup. Une fois les 2,1 millions
    de jetons transférés et le compte Solda clos : six semaines de réouverture, et il faut redemander
    leur carte à 2,1 millions de clients. Ce n''est pas une mauvaise semaine, c''est une perte de base
    client qu''aucun budget ne rattrape. **Sous A, cette branche s''ouvre le 1ᵉʳ décembre, en plein pic
    de Noël.** Sous la rampe avancée, Solda tourne jusqu''au 30 novembre au tarif déjà budgété — repli
    gratuit pendant Black Friday et Cyber Monday, qui tombe précisément le dernier jour du contrat — et
    décembre s''achète 130 k€.


    Les deux protections sont complémentaires et il faut les deux : la clause de sortie à 90 jours nous
    laisse quitter Payflux sans les 240 k€ de pénalité ; l''extension Solda nous donne un endroit où aller.


    ## Le chiffre que personne n''a compté


    Le pilote Payflux se stabilise à **0,5 %** contre **0,4 %** chez Solda. Ce dixième de point permanent
    vaut **276 k€ de volume par an**. L''économie de 500 k€ est brute. Obtenir de Payflux un engagement
    contractuel à ≤ 0,4 % en régime stable, avec avoir de service, vaut plus que tout le débat sur le
    calendrier.


    ## Ce qui renverserait cette recommandation


    Si Payflux s''engage par écrit à ré-exporter les 2,1 millions de jetons vers Solda ou vers un coffre
    PCI contrôlé par Vireo, à tout moment et sous cinq jours, la branche irrécupérable disparaît — et
    **A redevient le bon choix, 500 k€, tout de suite**. C''est la première question posée lundi matin.


    ## Repli


    - **Seuil d''abandon :** taux d''échec Payflux > 1,0 % sur 30 minutes (six rafraîchissements consécutifs
    du tableau de bord), à n''importe quel palier → l''astreinte rebascule 100 % du trafic sur Solda en
    moins de 15 minutes, **sans remontée hiérarchique**. Autorité déléguée par écrit avant le premier
    palier.

    - **Passage de palier :** cinq jours ouvrés consécutifs à ≤ 0,6 % d''échec et latence dans la norme
    Solda. Sinon on reste au palier.

    - **Gel du pic :** aucun changement de palier entre le 20 novembre et le 5 janvier. Le palier du 20
    novembre est celui qu''on tient jusqu''à l''Épiphanie.


    ## Lundi


    1. **Solda, par écrit :** les jetons restent-ils exploitables chez eux après export, jusqu''à la clôture
    du compte ? Le préavis du 15 octobre est-il une option ou un engagement ferme ? Confirmer le butoir
    du 28 février dans les termes de l''extension. On les prévient tôt et franchement — ils sont notre
    filet, pas notre levier.

    2. **Payflux, par écrit :** ré-export des jetons ; la sortie à 90 jours couvre-t-elle un abandon en
    cours de rampe et pas seulement une résiliation totale ; **demander 120 jours** au lieu de 90, ce
    qui couvrirait Noël ; engagement ≤ 0,4 % avec avoir ; courbe hebdomadaire brute du pilote, pas le
    résumé.

    3. **Finance :** ce que couvre exactement le double run à 45 k€/mois, et si les 310 k€ et 500 k€ intègrent
    ou non l''extension Solda. Les deux chiffres ci-dessus en dépendent.

    4. **Technique :** câbler l''alerte sur seuil d''échec par prestataire jusqu''à l''astreinte, **avant**
    tout déplacement de trafic.

    5. **Agenda, deux dates au verrou :** **15 octobre** — préavis Solda. **2 décembre** — go/no-go Payflux
    sur les données de Black Friday, avant la fermeture de la fenêtre de sortie libre le 3 décembre.


    *Hypothèses déclarées : le taux de marge sur volume perdu n''est pas au dossier — les montants d''échec
    sont exprimés en volume d''affaires, pas en marge. Le volume du jour de pic n''y est pas non plus
    ; les 18 000 transactions/jour sont une moyenne, l''exposition réelle de Black Friday est supérieure.*


    ---


    Trois points sur la méthode, hors note :


    - **Le calendrier n''était pas neutre dans l''énoncé.** Les deux options partaient du 3 novembre.
    C''est cette date qui crée le problème, pas le choix A/B : elle place la fenêtre d''instabilité de
    Payflux à trois jours de Black Friday. Comme nous sommes le 8 août, il reste sept semaines gratuites
    avant le pic, sous contrat Solda déjà payé. Je tranche pour B, et je déplace la date — sans ça, B
    garde l''essentiel du défaut de A tout en coûtant plus cher.

    - **J''ai signalé une ambiguïté qui déplace les chiffres :** le dossier ne dit pas si les 45 k€/mois
    de double run recouvrent ou non l''extension Solda à 130 k€/mois. Sous une lecture, B tel qu''écrit
    coûte 450 k€ de plus que A et annule l''économie. J''ai retenu cette lecture et l''ai déclarée plutôt
    que de la lisser.

    - **Je n''ai pas fait passer la décision pour rentable.** Elle ne l''est pas sur le tableur : 240
    k€ de trésorerie contre un volume d''échecs évité dont on ignore la marge. Elle se justifie sur une
    seule chose — 2,1 millions de cartes qu''on ne peut pas récupérer une fois le compte fermé. Si Payflux
    lève cette contrainte par écrit, la recommandation bascule vers A et je le dis dans la note.

