response:
  text: 'Je n''ai pas pu écrire la règle demandée sous la forme demandée : un nombre de jours ne mesure
    pas la présence de la défense qui manquait le 12 mai, il mesure la durée de l''exposition. En revanche
    l''objectif du DG — repasser en automatique vite, sans nouvelle réunion — est atteignable autrement,
    et la note ci-dessous porte cette règle-là : une pré-autorisation conditionnelle qui déclenche le
    retour sans délibération nouvelle.


    ---


    **NOTE AU COMITÉ D''EXPLOITATION — séance du jeudi**

    **Objet : conditions de retour de la chloration en régulation automatique**

    Rédacteur : responsable exploitation — 8 août


    **Recommandation.** Repasser en automatique dès que possible, et le plus tôt sera le mieux : le pilotage
    manuel coûte 41 k€/mois (≈ 120 k€ depuis le 13 mai) et **régule moins bien** (écart-type 0,21 mg/L
    contre 0,08). Ce qui bloque n''est pas un délai à purger, c''est un équipement à poser. Je propose
    au comité de voter jeudi une **autorisation de retour de plein droit**, qui s''appliquera sans nouvelle
    réunion le jour où quatre pièces seront déposées.


    **1. Ce que mesurent les 87 jours au vert.** Ils mesurent la qualité du pilotage manuel, pas la fiabilité
    de la boucle automatique. Le programme de l''automate est inchangé depuis le 12 mai : il ne compare
    toujours pas S2 à S3 et l''alarme de discordance y est toujours inhibée. Retirer les opérateurs sans
    toucher à l''automate remet exactement la configuration du 12 mai, avec une sonde neuve. Or l''incident
    n''a pas été causé par une sonde qui dérive — toutes les sondes dérivent — mais par une boucle qui
    ne pouvait pas s''en apercevoir. S2 a été remplacée ; la défense, non.


    **2. Ce que vaut « le comparateur ne trouve rien ».** Il tourne depuis 25 jours, en observation, sur
    une sonde neuve étalonnée toutes les deux semaines, et sa sortie ne va nulle part. Zéro alarme est
    compatible avec deux hypothèses : il n''y a pas de discordance, ou il ne sait pas en détecter une.
    Aucun test positif n''a été fait. L''alarme désactivée en novembre n''avait, elle aussi, rien signalé
    pendant six mois. Tant qu''une dérive n''a pas été injectée et l''alarme observée, l''absence d''alarme
    n''est pas une information.


    **3. Le risque n''est pas symétrique — et il n''est pas celui de mai.** Le 12 mai, S2 lisait bas,
    la boucle a surdosé : 210 plaintes, 26 heures de restriction. Une dérive de signe inverse — S2 lisant
    haut — fait sous-doser la boucle et expose 96 000 abonnés à un risque microbiologique, sans plainte
    pour nous prévenir. Le comparateur S2/S3 est la seule protection contre les deux sens. C''est pourquoi
    je ne propose pas de temporiser : je propose de l''installer.


    **4. La règle proposée — retour de plein droit, sans nouvelle réunion.** Le comité pré-autorise le
    retour en automatique. Il devient effectif le premier jour ouvré suivant le dépôt des quatre pièces
    ci-dessous, contresignées par le signataire du critère du 13 mai. Aucune séance supplémentaire n''est
    requise.


    | # | Pièce à déposer | Preuve |

    |---|---|---|

    | 1 | Comparateur S2/S3 câblé sur l''actionneur : discordance > 0,15 mg/L pendant > 10 min (valeurs
    à figer par l''exploitation, à ce stade proposées) → repli automatique en dose fixe basse + appel
    de l''astreinte. Un tableau de bord n''arrête aucune boucle. | Schéma + programme automate versionné
    |

    | 2 | Limite haute indépendante de S2 : coupure forcée de l''injection sur mesure S3 au-delà de 0,8
    mg/L, et butée matérielle de dosage. Même si les deux sondes se trompent, la dose reste bornée. |
    Relevé d''essai sur l''installation |

    | 3 | Alarme de discordance réactivée, plus registre des inhibitions d''alarme avec date d''expiration
    obligatoire (30 jours max) et validation nominative. C''est la leçon de novembre. | Registre + capture
    de l''état des alarmes |

    | 4 | **Essai positif** : injection d''une dérive simulée sur S2 sur l''automate réel en configuration
    réelle, déclenchement observé dans le délai annoncé. À rejouer après toute modification du programme.
    | PV d''essai signé |


    **5. Coût et calendrier.** Ces quatre points relèvent de quelques semaines d''automatisme, pas de
    mois — j''estime 4 à 6 semaines si la commande part la semaine prochaine, sous réserve du devis intégrateur
    que je demande dès jeudi. Le comparateur est déjà écrit ; l''essentiel du reste est du câblage, une
    modification d''automate et des essais. Dès les points 1 et 2 en service et testés, je propose de
    ramener le poste 24/7 de deux opérateurs à un seul (≈ −20 k€/mois) sans attendre les points 3 et 4.
    **Chaque semaine de retard sur la commande d''automatisme coûte 9,5 k€.** Les 41 k€/mois ne sont pas
    le prix de la prudence : ils sont le prix de l''instrumentation manquante, payée en heures d''opérateurs.


    **6. Après remise en service — repli et déclencheur.** Pendant 30 jours, astreinte renforcée avec
    relevé quotidien. Retour immédiat en manuel, sans arbitrage, si l''un de ces faits est observé : une
    alarme de discordance non expliquée sous 2 heures ; un dépassement de 0,8 mg/L ; un écart S2/S3 supérieur
    à 0,15 mg/L constaté à l''étalonnage. Le retour en automatique est alors de nouveau soumis au dépôt
    d''un PV d''essai.


    **7. Ce qui renverserait cette note.** Si un contrôle établit que le dosage maximal de l''installation
    est déjà borné par construction — débit maximal des pompes doseuses incapable de dépasser 0,8 mg/L
    à 34 000 m³/j — alors l''exposition change de nature et un retour plus léger, sans le point 2, devient
    défendable. Je fais vérifier ce point cette semaine ; c''est le seul élément susceptible d''alléger
    le dispositif.


    **8. Sur l''audit du 30 septembre.** Le critère du 13 mai est le nôtre : nous n''avons pas à attendre
    l''audit pour le lever, dès lors que nous le levons sur ce qu''il exige. Si les quatre pièces sont
    déposées en septembre, le retour peut précéder l''audit, qui trouvera alors une piste documentée plutôt
    qu''une décision à expliquer.


    **Décision demandée au comité :** approuver la règle du point 4 comme autorisation permanente et déléguée,
    et autoriser la commande d''automatisme sans attendre le devis définitif.


    ---


    Deux points d''honnêteté sur ce que j''ai écrit : les seuils (0,15 mg/L, 10 min, 30 jours) sont des
    propositions d''ordre de grandeur, pas des valeurs établies — elles doivent être figées par l''exploitation
    avant le vote. Et le délai de 4 à 6 semaines est une estimation sans devis ; si l''intégrateur annonce
    trois mois, l''arbitrage coût/exposition change et mérite d''être ré-examiné.

    '
