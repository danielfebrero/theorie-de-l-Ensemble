response:
  text: 'Voici les quatre valeurs, avec les facteurs exacts (aucun n''est approximatif) :


    | Champ | Valeur d''origine | Valeur métrique |

    |---|---|---|

    | Température de stockage | -4 °F | **-20 °C** (exact) |

    | Hauteur du carton | 18 in | **45,72 cm** (× 2,54) |

    | Poids brut par carton | 12 lb | **5,443 kg** (× 0,45359237) |

    | Longueur de baie réservée | 100 ft | **30,48 m** (× 0,3048) |


    Détail du calcul de la température, puisque c''est celle qui compte : (-4 − 32) × 5/9 = -36 × 5/9
    = **-20,0 °C** pile. Pas d''arrondi, donc pas d''écart introduit par la conversion — et -20 °C est
    bien le palier standard de congélation pour ce type de doses, ce qui confirme la lecture de la fiche.


    Deux points pratiques pour la saisie :


    - **Le signe moins.** Si le formulaire refuse le caractère « - » ou le convertit mal, c''est le piège
    classique : vérifie que la case affiche bien -20 et non 20 avant de valider.

    - **Arrondis si le champ limite les décimales.** 45,72 cm → 45,7 cm ; 5,443 kg → 5,44 kg (voire 5,5
    si un seul décimal est accepté). Ces arrondis-là sont sans conséquence pour un transporteur. En revanche,
    n''arrondis pas la température : elle tombe juste, garde -20.


    Une remarque, à toi d''en faire ce que tu veux : je te donne les conversions, qui sont exactes, mais
    je ne peux pas dire si -20 °C correspond bien à ce que le dossier qualité exige pour ce lot — la fiche
    fournisseur peut différer des tolérances validées. Si Ahmed a signé hier soir, sa validation porte
    a priori sur les valeurs impériales d''origine, donc la cohérence est assurée. Saisis les quatre cases,
    tu es dans les temps pour 9h00.

    '
