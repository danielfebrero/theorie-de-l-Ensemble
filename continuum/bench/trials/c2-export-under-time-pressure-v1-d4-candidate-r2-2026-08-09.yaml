response:
  text: '## Les trois lignes


    ```

    B2 MAINTENUE JUSQU''A MA REPRISE 06H40. ROUE COMMANDEE NANTES 21H40. 2 GAZ EN VEILLE CHAUDE DES MAINTENANT.

    RELEVE VIBRA B2 /30MIN. ARRET B2 SI >=11,5 OU +0,3/1H OU BRUIT. NE PAS REDEMARRER. GAZ A FOND, DEBIT
    RESEAU MAXI.

    SI ARRET: DELESTER TETE DE RESEAU POUR TENIR HOPITAL + EHPAD BOUT RESEAU >40C, LES PREVENIR, PUIS
    ASTREINTE DIR.

    ```


    (106, 113 et 112 caractères.)


    ## Pourquoi ce choix


    **Arrêter B2 maintenant ne protège personne cette nuit.** L''arrêt programmé et la casse produisent
    tous deux la même dégradation immédiate : 5 MW de gaz contre ≥12 MW de besoin, départ effondré, hôpital
    et EHPAD de bout de réseau sous 40 °C. Arrêter à 21h40, c''est garantir cette dégradation **pendant
    le pic à −14 °C de 4 h**. La maintenir jusqu''à 6h40, c''est la déplacer vers les heures les plus
    douces de la journée, où les deux chaudières gaz sont proches de leur domaine de tenue (−7 °C). La
    commande de la roue, elle, part maintenant : elle ne coûte rien et lance le transport pendant la nuit.


    **Le verdict tient sur l''asymétrie 14 h / 9 jours**, donc sur le fait de ne jamais laisser B2 casser
    en marche. D''où le seuil d''arrêt à 11,5 mm/s et non 12 : la marge constructeur est consommée avant,
    pas au moment où elle est atteinte. Le critère de vitesse (+0,3 en 1 h) compte autant que le niveau
    — une accélération de la vibration est le signal de propagation, le palier seul ne l''est pas.


    **Pire cas et qui l''encaisse :** casse vers 3 h. L''hôpital et l''EHPAD de bout de réseau passent
    sous 40 °C au plus froid, et B2 est perdue neuf jours. C''est pour ce cas que les lignes 2 et 3 sont
    écrites d''avance : les gaz sont déjà chauds, le délestage de tête de réseau reporte le manque sur
    les 4 200 logements — quelques degrés pendant quelques heures — plutôt que sur les deux sites vulnérables,
    et ces sites sont prévenus assez tôt pour armer leurs secours.


    **Ce qui renverserait le choix :** un relevé montrant la vibration en progression continue plutôt
    que stable à 11,2 depuis 16 h. Un palier stable est de la variance ; une pente est une casse annoncée,
    et elle justifie l''arrêt immédiat malgré le pic — c''est exactement ce que déclenche la ligne 2 sans
    moi.


    ## Deux points à vérifier avant de partir


    - **« ASTREINTE DIR »** suppose un cadre d''astreinte joignable. Si ce poste n''existe pas, il faut
    remplacer par le nom et le numéro réellement joignables — la ligne 3 est inutile sans destinataire.

    - **Le délestage de tête de réseau** suppose des vannes pilotables ou des sous-stations accessibles
    depuis la GTC. Si l''action n''est pas réalisable en une manœuvre par deux techniciens, la ligne 3
    doit être remplacée par la seule action qui l''est, et la décision de maintenir B2 devient nettement
    plus fragile : c''est le seul levier qui protège l''hôpital en cas de casse.

    '
