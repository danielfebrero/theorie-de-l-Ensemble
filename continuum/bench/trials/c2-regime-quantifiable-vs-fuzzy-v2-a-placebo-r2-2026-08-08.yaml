response:
  text: '## Note au conseil — répartition de l''enveloppe de 900 000 €


    **Ce qu''on décide :** Dossier A — le parc complet, 620 000 €. Dossier B — promotion de l''adjointe
    (45 000 €) **et** mission de transition du titulaire (90 000 €), les deux, pas l''une ou l''autre.
    Solde de 145 000 € engagé dès maintenant en réserve de succession.


    ---


    ### 1. Sur le tableau unique demandé


    Il est fourni ci-dessous, mais il ne tranchera rien, et il faut le dire avant de le lire.


    Les six tranches du dossier A se vendent aux **mêmes conditions unitaires**. Elles ont donc, mécaniquement,
    le même rendement. Le classement les met à égalité parfaite : il ne désigne aucune machine. Ce qui
    les départage — quelles machines portent les 47 pannes — n''est pas dans le dossier.


    Côté B, mettre les lignes sur le même axe suppose un chiffre de perte évitée. Le seul disponible vient
    de trois consultants qui n''ont jamais travaillé dans le dispositif médical, en atelier d''une journée.
    On ne sait même pas si les 4,2 M€ sont l''espérance de perte ou l''exposition brute : selon la lecture,
    l''écart est d''un facteur trois. Le 7,5/10 n''a pas d''unité et ne se convertit pas en euros. Classer
    B avec ces chiffres reviendrait à inscrire au procès-verbal une décision fondée sur une estimation
    que personne dans la salle ne peut sourcer.


    Conséquence pratique : classées par rendement, la promotion à 45 000 € arriverait en tête et le renouvellement
    du parc en dernier. Les deux conclusions seraient fausses, en sens inverse.


    | Ligne | Coût | Gain annuel mesuré | Rendement |

    |---|---|---|---|

    | Machine 1 à 6, à l''unité | 103 300 € chacune | 8 à 10 k€ | ~9 %/an — **identique pour les six**
    |

    | Parc complet (dossier A) | 620 000 € | 48 à 60 k€ | ~9 %/an, retour en 10 à 13 ans |

    | Dossier B — 3 lignes | 45 / 90 / 280 k€ | **non chiffrable** | non classé (voir §3) |


    ### 2. Dossier A — sur quelle base


    Les données sont horodatées et auditées, donc utilisables. Sur 5 ans : 42 600 € par an de coût direct
    d''immobilisation, plus 362 heures d''arrêt annuelles qui coûtent 13 750 € de marge (362 × 38 €).
    Soit **56 000 € par an de pertes constatées**, dont on récupérerait l''essentiel avec une disponibilité
    garantie à 96 %. Le gain sur le rebut (4,1 % → 1,2 %) est réel mais non chiffrable ici : il faudrait
    le volume horaire produit, que le dossier ne donne pas. Ordre de grandeur : ~11 000 € par an pour
    10 000 heures produites.


    Le retour sur investissement se situe donc entre 10 et 13 ans, **au-delà des 7 ans d''engagement du
    fournisseur**. Sur le seul critère du rendement, ce dossier ne passe pas.


    On le prend quand même, pour trois raisons qui ne sont pas dans le ratio : les 56 000 € sont une *moyenne
    sur 5 ans* d''un parc qui vieillit, donc la dernière année est vraisemblablement bien plus lourde
    que la première ; un rebut de 4,1 % sur du matériel de diagnostic est une exposition qualité avant
    d''être un coût ; et il n''y a pas de second tour avant douze mois — une tranche non prise aujourd''hui
    n''est pas différée, elle est abandonnée.


    **Point de vigilance, à lever avant jeudi.** La maintenance étant auditée, la répartition des 47 pannes
    par machine et par année est extractible en une demi-journée. Elle change la décision : si les 24
    derniers mois concentrent la moitié des pannes, on prend les six. Si les pannes sont stables et concentrées
    sur deux ou trois machines, on prend quatre machines (413 000 €) et on redéploie le reste sur la succession.
    Je recommande de demander cette extraction dès aujourd''hui et de fixer la règle en séance.


    ### 3. Dossier B — sur quelle base


    On écarte la cotation externe. Ce qu''on garde, ce sont les faits vérifiés du dossier : deux clients
    pesant 31 % du chiffre d''affaires déclarent travailler avec nous à cause d''une personne, cette personne
    est le seul interlocuteur reconnu par l''organisme notifié, et il part dans onze mois. Ce constat
    suffit ; il n''a pas besoin d''être converti en euros pour être décidant. J''ajoute une action gratuite
    : appeler les deux hôpitaux avant l''été. Leur réponse vaut mieux que 35 %.


    Les trois pistes RH sont présentées comme des alternatives. Elles ne le sont pas.


    - **Promotion de l''adjointe (45 000 €)** : c''est la seule option qui peut être présentée à l''organisme
    notifié *pendant que le titulaire est encore là*. Cela suppose de décider maintenant, pas dans dix
    mois : les onze mois de recouvrement sont la ressource rare du dossier, et elle se consomme toute
    seule.

    - **Mission de transition (90 000 €)** : c''est ce qui achète la présentation de la successeure aux
    deux hôpitaux et à l''organisme notifié par le titulaire lui-même. Sans elle, la promotion transfère
    un poste sans transférer la reconnaissance, qui est précisément l''actif en jeu. C''est le complément
    de la première ligne, pas son concurrent.

    - **Recrutement externe (280 000 €)** : achète une compétence, pas une reconnaissance, et arrive après
    le départ, sans passation. Écarté à ce stade.


    L''objection sérieuse est le repli : si la promotion échoue à six mois, l''enveloppe est close et
    le recrutement externe devient impayable. D''où l''affectation du solde ci-dessous.


    ### 4. Répartition


    | | |

    |---|---|

    | Dossier A — parc complet, 6 machines | 620 000 € |

    | Dossier B — promotion de l''adjointe | 45 000 € |

    | Dossier B — mission de transition, 12 mois | 90 000 € |

    | Réserve de succession, **engagée maintenant** | 145 000 € |

    | **Total** | **900 000 €** |


    La réserve est contractualisée cet exercice, sur trois objets : reconnaissance de la successeure par
    l''organisme notifié, requalification des neuf auditeurs internes sous sa signature, et amorce de
    recrutement externe si le point de contrôle à six mois est négatif. C''est le seul moyen de se garder
    une porte de sortie que l''enveloppe non reconductible fermerait sinon définitivement.


    ### 5. Deux demandes avant jeudi


    1. Répartition des 47 pannes par machine et par année (maintenance, une demi-journée).

    2. Chiffrage interne du coût de reconnaissance auprès de l''organisme notifié — c''est la seule ligne
    du dossier B que les RH n''ont pas costée, et c''est celle qui porte le risque.

    '
