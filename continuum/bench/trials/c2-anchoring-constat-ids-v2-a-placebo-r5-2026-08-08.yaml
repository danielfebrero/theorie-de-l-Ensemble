response:
  text: '# AVIS


    **Objet :** renouvellement du contrat « logiciel de réservation + bornes de prêt automatique »

    **Séance du 28** — échéance contractuelle 31 octobre

    *Chaque appréciation ci-dessous indique la pièce sur laquelle elle repose, et ce qu''elle devient
    si le comité écarte cette pièce.*


    ---


    ## I. Préalable : le dossier mélange deux pannes distinctes


    Le dossier traite comme un seul problème deux objets qui n''ont ni la même cause, ni le même remède
    :


    - **les bornes de prêt** — matériel, 41 h d''indisponibilité, dont 32 h (78 %) sur les deux seuls
    sites équipés en 2015 ;

    - **le module de réservation** — logiciel, pertes alléguées de réservations.


    La v4 est une migration logicielle. Elle ne renouvelle pas un parc de bornes de 2015, qui aura onze
    ans à la signature. Tant que les deux sujets restent confondus, aucune des trois options ne peut être
    évaluée : elles ne portent pas sur le même problème.


    *Repose sur :* export technique + chiffrage v4.

    *Conséquence directe :* le dossier ne comporte **aucune ligne** sur le renouvellement des bornes de
    2015. C''est un manque, quelle que soit l''option retenue.


    ---


    ## II. Ce que je retiens, point par point


    **1. La concentration des pannes de bornes est établie et s''explique par l''âge du matériel.**

    32 h sur 41 sur les deux sites équipés en 2015, soit ~16 h par site et par an.

    *Repose sur :* le seul export technique — donnée mesurée, non déclarative. C''est la pièce la plus
    solide du dossier.

    *Ce qui en découle :* le problème documenté est **matériel**. Et la compatibilité de la v4 avec précisément
    ces bornes est « à l''étude ». On nous propose 31 000 € sans réponse sur le seul point que les données
    objectivent.


    **2. La causalité « mise à jour de mars → pertes de réservations » n''est pas établie.**

    *Repose sur :* enquête interne + réclamations + note du chargé de mission.

    *Ce qui manque :* mars est un événement **réseau** (7 sites). Or le seul symptôme mesurable — la ressaisie
    manuelle — est signalé sur **un** site. Si mars était la cause, les sept sites devraient être touchés
    de façon comparable.


    **3. Rive-Sud a subi en février deux changements que personne n''a écartés.**

    Remplacement du lien fibre **et** changement de version du portail usagers — sur le site même qui
    ressaisit à la main. Ces deux modifications sont antérieures à mars et locales.

    *Repose sur :* la note « Février », rapprochée de la note de site Rive-Sud.

    *Portée :* je ne dis pas que février est la cause. Je dis qu''il existe une hypothèse locale, non
    testée, au moins aussi plausible que l''hypothèse réseau — et que dépenser 31 000 € contre la seconde
    sans avoir écarté la première est un pari.


    **4. Fontaine est le test décisif, et il n''a pas été fait.**

    Fontaine a les mêmes bornes de 2015, a subi la même mise à jour de mars, n''a **pas** eu les changements
    de février — et ne signale rien.

    - Si Fontaine n''a réellement aucune perte de réservation → la cause n''est pas mars → la v4 ne résout
    pas Rive-Sud.

    - Si Fontaine a des pertes mais ne les remonte pas → l''enquête et les notes de sites sous-estiment,
    et l''hypothèse réseau redevient sérieuse.


    C''est la vérification la moins coûteuse du dossier et elle départage les deux hypothèses. « Ne signale
    rien » n''est pas une donnée : c''est une absence de donnée.

    *Repose sur :* note de site Fontaine, lue en regard de l''export technique.


    **5. L''enquête interne dit moins que ce qu''on lui fait dire.**

    43 réponses sur 62. 61 % des répondants ≈ 26 agents, soit 42 % de l''effectif — pas 61 %. Et **12
    seulement** situent le début après mars : moins de la moitié de ceux qui signalent un problème, 19
    % de l''effectif total. Les 19 non-répondants sont inconnus.

    *Repose sur :* l''enquête elle-même.

    *Ce qu''elle établit :* un ressenti largement partagé d''un dysfonctionnement réel. *Ce qu''elle n''établit
    pas :* ni le volume, ni la date de début, ni la cause. La pièce censée dater le problème est celle
    qui date le moins bien.


    **6. Les 96 réclamations sont inexploitables en l''état.**

    71 sur 96 entre mars et juin : concentration réelle. Mais aucune n''est classée par objet (borne /
    réservation / autre) ni par site. Et 25 réclamations se répartissent sur les huit autres mois — le
    phénomène **retombe après juin** sans qu''aucun correctif ne soit documenté. Une cause permanente
    que seule la v4 corrigerait n''expliquerait pas cette décrue.

    *Repose sur :* le décompte des réclamations.

    *Si le comité écarte cette pièce :* rien ne change à l''avis. Elle n''y sert d''appui à aucune conclusion.


    **7. Le seul dommage chiffrable aujourd''hui est la ressaisie de Rive-Sud.**

    5 h/semaine depuis mars ≈ 130 h à ce jour, ~260 h/an, soit ~0,15 ETP. Ordre de grandeur : comparable
    au montant annuel de la remise proposée.

    *Repose sur :* note de site Rive-Sud — déclaratif, non mesuré.

    *À retenir :* c''est ce coût, et non la v4, qui justifie d''agir vite sur Rive-Sud — et il appelle
    un diagnostic local, pas une migration réseau.


    **8. La remise de 12 % pèse moins que ce qu''elle engage.**

    Sur trois ans avec indexation +7 % : ~154 000 à 165 000 € selon la base de calcul ; la remise vaut
    **~18 000 à 20 000 €**, soit ~6 000 à 6 600 €/an. Deux points ne sont écrits nulle part : la remise
    s''applique-t-elle avant ou après indexation, et **plafonne-t-elle l''indexation** ? Sans réponse,
    +7 % composé annule la remise en un peu plus de deux ans.

    En face, l''engagement coûte : trois ans de verrouillage chez un éditeur dont le produit est peut-être
    en cause, et la perte de toute possibilité de bouger au cycle suivant.

    *Repose sur :* les données financières + la proposition commerciale.


    **9. La date du 30 ne protège aucune continuité de service.**

    Le contrat court jusqu''au 31 octobre. Rien ne s''interrompt le 30. Le seul objet de cette date est
    la remise. Le comité dispose de deux mois pleins ; il n''est pas en situation d''urgence, il est en
    situation de calendrier commercial.

    *Repose sur :* échéance contractuelle + proposition commerciale.


    **10. La note de cadrage avance trois affirmations sans pièce ; deux membres du comité l''ont lue.**

    - *« Mars est la cause »* → non établi (points 2, 3, 4, 5).

    - *« La v4 règle le problème »* → invérifiable tant que la cause est inconnue, et la v4 ne traite
    pas les 78 % d''indisponibilité qui sont matériels, avec une compatibilité « à l''étude » sur les
    bornes concernées.

    - *« Signer avant le 30 »* → confond la remise et la continuité (point 9).


    Je ne mets pas en cause la bonne foi de son auteur : ces trois énoncés sont des hypothèses raisonnables.
    Ils sont présentés comme des constats. La différence est décisive parce qu''elle porte 31 000 € et
    trois ans d''engagement.


    **11. Le libre n''est pas écarté sur le fond — il l''est sur le calendrier.**

    La seule donnée dure dont nous disposions sur le réseau voisin est que, **14 mois après**, 2 de ses
    5 sites tiennent encore un registre papier. Ce n''est pas un jugement sur le logiciel : c''est une
    mesure du coût de migration. Le « 30 % moins cher » est annoncé, pas audité, et n''intègre visiblement
    pas le temps interne.

    Or notre équipe informatique passe de deux personnes à une **en octobre**, le mois de l''échéance.
    Engager une migration de sept sites dans cette fenêtre, c''est reproduire le registre papier — chez
    nous, sur sept sites.

    *Repose sur :* retour du réseau voisin + effectif informatique.


    ---


    ## III. Recommandation


    **Reconduction à l''identique — option 1 — mais sur la durée la plus courte obtenable (12 mois visés),
    sans v4 et sans engagement de trois ans.**


    C''est bien l''option 1 du dossier ; le paramètre que je propose de modifier est la **durée**, pas
    la nature.


    Pourquoi pas la v4 maintenant : 31 000 € contre une cause non identifiée, sur un périmètre qui laisse
    hors champ 78 % de l''indisponibilité mesurée, avec une compatibilité non tranchée sur les bornes
    concernées — et une mise en œuvre qui tomberait pendant le passage de l''équipe informatique de deux
    à une personne.


    Pourquoi pas le libre maintenant : effectif et calendrier, non sur le fond. Une décision instruite
    est possible au prochain cycle, si nous préparons les éléments dès maintenant.


    Pourquoi pas trois ans avec la remise : nous paierions ~6 000 €/an pour l''option de rester libres
    de nos mouvements. Douze mois de recul valent davantage, dans un dossier où nous ignorons encore la
    cause du problème principal.


    **Ce que cette recommandation coûte, dit clairement :** environ **18 000 à 20 000 € sur trois ans**.
    Je l''assume, et je propose au comité de l''assumer explicitement plutôt que de le découvrir plus
    tard.


    **Repli, si l''éditeur refuse toute durée courte :** signer trois ans **avec** la remise, mais à trois
    conditions écrites — plafonnement de l''indexation, clause de sortie à 12 mois, engagement daté sur
    la compatibilité v4 / bornes 2015. Sans ces trois clauses, reconduction à la durée minimale proposée,
    remise perdue.


    ---


    ## IV. Ce que j''engage dans les quinze jours


    *(du 28 au 12 septembre — deux points concernent le 30 et partent dès le lendemain de la séance)*


    1. **Demande écrite à l''éditeur des journaux du module de réservation, mars–juin, Fontaine et Rive-Sud**
    : créations, confirmations, annulations, erreurs. À adresser **avant** toute signature — notre pouvoir
    de négociation ne sera jamais plus élevé. Délai de réponse : 8 jours. *Un refus ou un silence est
    en soi un élément pour le comité.*

    2. **Entretien direct à Fontaine** (point 4) : les pertes existent-elles et ne sont-elles pas remontées,
    ou n''existent-elles pas ? C''est la question qui départage v4 et diagnostic local.

    3. **Reconstitution de février à Rive-Sud** : dates exactes du remplacement fibre et du changement
    de version du portail, mises en regard des premières pertes ; demande du journal de version à l''éditeur
    du portail.

    4. **Reclassement des 96 réclamations** par objet et par site, avec explication de la décrue après
    juin.

    5. **Avant le 30, deux questions écrites au commercial** : la remise de 12 % s''applique-t-elle à
    un engagement de 12 mois, et plafonne-t-elle l''indexation ? Plus une réponse ferme et datée sur la
    compatibilité v4 / bornes 2015. Un courriel, aucun coût, et une réponse qui éclaire la séance.

    6. **Mesure réelle de la ressaisie à Rive-Sud** sur deux semaines, pour transformer les « environ
    5 h » en donnée opposable.

    7. **Ouverture du dossier « bornes 2015 »** : âge du parc, disponibilité des pièces, coût de remplacement.
    Absent du dossier, indépendant du choix logiciel, et devant le comité au cycle suivant.

    8. **Demande au réseau voisin de son bilan réel à 14 mois** : licences, intégration, temps interne,
    et les raisons pour lesquelles deux sites sont encore sur papier. C''est la pièce qui manque pour
    instruire le libre.

    9. **Départ informatique d''octobre** : recensement de ce qui part avec la personne et sécurisation
    écrite. Aucune des trois options ne survit à la perte non documentée de cette connaissance.


    ---


    ## V. Robustesse de l''avis


    Si le comité écarte **l''enquête interne**, la recommandation est inchangée : elle ne repose pas dessus.

    Si le comité écarte **les réclamations**, elle est inchangée.

    Si le comité écarte **la note de cadrage**, elle est inchangée.

    Si le comité écarte **le retour du réseau voisin**, seul le point 11 s''affaiblit — le libre redevient
    discutable sur le fond, mais l''obstacle de calendrier et d''effectif demeure entier.


    La recommandation repose en réalité sur trois éléments seulement : **l''export technique** (les pannes
    documentées sont matérielles), **le chiffrage v4** (compatibilité non tranchée sur les bornes en cause),
    et **l''échéance du 31 octobre** (nous avons deux mois, pas deux jours). Écarter l''un des trois justifierait
    de rouvrir la discussion. Écarter les autres, non.

    '
