response:
  text: '# Note au conseil — Caisse de prévoyance des Marins du Ponant

    **Objet : allocation de la réserve — options A, B, C**

    **Position du directeur, séance de jeudi**


    ---


    ## 1. Recommandation en une phrase


    Je recommande le **rejet de C**, le **report de B**, le **maintien de A à titre conservatoire pour
    18 mois maximum**, et j''engage la caisse sur une seule chose qui compte : **le dépôt du dossier de
    transfert à l''Union mutualiste de l''Atlantique avant le 30 septembre**. Les trois options à l''ordre
    du jour portent sur l''actif ; notre problème est au passif. Aucune n''est une solution, et l''une
    des trois nous coûte l''unique sortie qui en soit une.


    ---


    ## 2. Le point que le dossier ne traite pas : la fenêtre de transfert se referme


    L''UMA n''a jamais accepté un portefeuille dont la réserve représentait moins de **trois années de
    prestations**.


    | | Réserve | Prestations | Ratio |

    |---|---|---|---|

    | Aujourd''hui | 18,4 M€ | 5,4 M€ | **3,41 ans** |

    | Dans 12 mois | ≈ 17,5 M€ | 5,63 M€ | **≈ 3,1 ans** |

    | Dans 24 mois | ≈ 16,3 M€ | 5,87 M€ | **≈ 2,8 ans** |


    Le ratio passe sous 3,0 entre le 15ᵉ et le 22ᵉ mois. **Le comité d''engagement de l''UMA instruit
    en 12 à 18 mois.** Nous sommes déjà à la limite : un dossier déposé en janvier prochain sera instruit
    sur une caisse devenue inéligible pendant l''instruction.


    Question à poser à l''UMA par écrit cette semaine, avant toute autre chose : *l''éligibilité s''apprécie-t-elle
    à la date de dépôt ou à la date de décision ?* La réponse détermine si la fenêtre est de six mois
    ou de zéro.


    **Anomalie à corriger avant jeudi.** La projection interne annonce 11 M€ dans neuf ans. Ce chiffre
    n''est atteignable qu''en gelant les prestations à 5,4 M€. Avec la dérive de 4,3 %/an que le dossier
    énonce lui-même et des cotisations plates, je recalcule le franchissement du seuil statutaire **entre
    la 5ᵉ et la 6ᵉ année** (déficit 1,23 M€ l''an prochain, 1,73 M€ en année 3, 2,26 M€ en année 5). C''est
    le chiffre le plus lourd de conséquences du dossier et il est faux d''un facteur deux. Je demande
    l''arbitrage de l''actuaire avant la séance ; à défaut, les deux trajectoires seront présentées au
    conseil.


    ---


    ## 3. Option C — rejet. Trois motifs indépendants, dont deux ne sont pas des questions de goût du
    risque


    **a) C rend la caisse incapable de payer ses prestations en année 3, y compris dans sa branche favorable.**


    C immobilise 14,4 M€ pendant 7 ans sans sortie. Restent **4,0 M€ liquides** face à un déficit de trésorerie
    de 1,23 M€ l''an prochain, 1,47 M€ ensuite, 1,73 M€ en année 3.


    > 4,0 → 2,84 → 1,42 → **rupture en cours d''année 3.**


    Ce calcul ne suppose aucun sinistre : il tient dans la branche 88 % / +14 %. Le meilleur scénario
    de C est l''insolvabilité de trésorerie à 30 mois. La seule chose qui l''annulerait est que la note
    **distribue** 14 % en numéraire chaque année au lieu de capitaliser — le dossier ne le dit pas. Si
    le trésorier peut le documenter par le prospectus, ce motif tombe ; les deux suivants tiennent.


    **b) La branche à 3 % ne dégrade pas la caisse : elle la dissout.**


    4,7 M€ de réserve résiduelle, c''est **57 % sous le seuil de liquidation de plein droit**. Ce n''est
    pas une mauvaise année, c''est une barrière absorbante : après elle il n''y a pas de trajectoire.
    Une espérance mathématique moyenne sur des branches suppose qu''on les vit toutes ; nous n''en vivons
    qu''une. Trois pour cent n''est pas du bruit statistique — c''est trois pour cent de tout.


    Et ce 3 % est une **estimation fournie par l''émetteur sur son propre défaut**, à qui la souscription
    profite. Elle ne couvre par ailleurs que le défaut de l''émetteur : une note structurée non cotée
    peut détruire du capital sans que l''émetteur défaille. Les 10 000 simulations reproduisent fidèlement
    le paramètre qu''on leur a donné.


    **c) Qui encaisse le pire cas.** Pas la réserve, pas le conseil : **4 200 affiliés de 61 ans de moyenne,
    fortement exposés à l''amiante, qu''aucun assureur du marché n''a accepté de coter en 2025.** Après
    liquidation, ils n''ont pas de solution de repli — c''est précisément ce que le refus de cotation
    de 2025 démontre. L''asymétrie entre le gain (une réserve plus confortable) et la perte (une population
    non réassurable sans couverture) interdit de maximiser l''espérance. C''est la définition même d''une
    caisse de prévoyance.


    **d) Point de droit à trancher avant tout vote.** 78 % de la réserve sur un émetteur unique, non coté,
    illiquide — je demande l''avis écrit du commissaire aux comptes sur la conformité aux règles de dispersion
    et au principe de la personne prudente applicables à la caisse, et le cas échéant la saisine de l''ACPR.
    Je ne préjuge pas de la réponse, mais elle engage personnellement chaque administrateur qui votera,
    et elle doit être au dossier de séance, pas après.


    **e) C ferme la porte de l''UMA.** Un actif non coté, bloqué 7 ans, non cessible, ne se transfère
    pas dans une reprise de portefeuille. Voter C, c''est renoncer au transfert — sans que le dossier
    le dise.


    ---


    ## 4. Le trésorier a raison sur un point, et il faut le dire au conseil


    « Refuser C, c''est condamner la caisse à mourir à petit feu » — **c''est exact, et A n''est pas une
    réponse à cela.** Là où la note se trompe, c''est sur l''endroit du remède.


    Stabiliser la réserve exige un rendement de 6,7 % dès l''an prochain, 8,4 % l''année suivante, 10,6
    % en année 3, et ainsi de suite sans borne : un passif qui croît de 4,3 % sur une assiette de cotisations
    gelée ne se finance pas par une allocation d''actifs, quelle qu''elle soit. **Le problème n''est pas
    le rendement de 18,4 M€ ; c''est un écart de 1,0 M€ qui s''élargit chaque année.** Les sorties réelles
    sont au nombre de trois : le transfert, la révision cotisations/prestations, ou la dissolution négociée.
    Le reste est du financement de déficit par la prise de risque, ce qui n''a jamais rien financé.


    ---


    ## 5. Option B — reportée, pas écartée


    B n''est pas ruineuse : le pire décile ramène la réserve à 15,8 M€, au-dessus du seuil statutaire.
    Mais **15,8 M€ / 5,4 M€ = 2,93 années de prestations** : le pire décile de B nous fait passer sous
    la ligne de l''UMA immédiatement.


    En dimensionnant la tranche risquée pour préserver le ratio de 3,0 pendant la fenêtre, on obtient
    entre **1,7 et 4,3 M€ selon le moment où on mesure** — trop peu pour déplacer l''objectif du trésorier,
    assez pour compromettre le dossier de transfert. Je propose donc zéro pendant la fenêtre, et un mandat
    de diversification correctement calibré **dès que l''UMA a répondu** : si elle refuse, B redevient
    le cœur d''une stratégie de run-off, et je la défendrai à ce moment-là.


    ---


    ## 6. Option A — pas une stratégie, un conteneur daté


    Je ne demande pas au conseil de voter le statu quo. Je demande de voter **le maintien de la réserve
    en actifs liquides et sans risque pendant la durée de l''instruction UMA, avec échéance au 30 juin
    2027**. Passé cette date, A n''est plus une option et le conseil doit trancher entre le résultat du
    transfert et le run-off organisé.


    ---


    ## 7. Ce sur quoi j''engage la caisse


    1. **Avant le 30 septembre** — dépôt du dossier de transfert à l''UMA, avec la question écrite sur
    la date d''appréciation de l''éligibilité posée sous 8 jours.

    2. **Avant le 31 octobre** — convocation d''une AG extraordinaire, sur cotisations **et** structure
    des prestations. L''AG doit recevoir le vrai chiffre : les +6 % rejetés en 2024 rapportaient 0,26
    M€, soit un cinquième du déficit de l''an prochain. Combler l''écart par les seules cotisations demande
    de l''ordre de **+27 %**. L''AG doit aussi être informée que le refus n''est pas le statu quo : c''est
    la liquidation vers 2031, sans couverture de substitution.

    3. **Sous 15 jours** — note actuarielle corrigée, avec la trajectoire à dérive 4,3 %, et avis écrit
    du commissaire aux comptes sur la concentration.

    4. **Déclencheurs de repli, arrêtés dès jeudi** : refus de l''UMA, ou ratio réserve/prestations sous
    3,0, ou réserve sous 16,0 M€ → bascule immédiate en run-off organisé (réduction négociée des prestations,
    dissolution volontaire aux conditions de la caisse) plutôt que liquidation automatique à 11 M€, où
    plus rien ne se négocie.

    5. **Association des affiliés** : une délégation d''affiliés siège à la négociation de transfert et
    reçoit les scénarios chiffrés avant l''AG. Ce sont eux qui encaissent le pire cas ; ils doivent disposer
    d''une voix dans la décision, pas d''une information après coup.


    ---


    ## 8. Ce qui me ferait changer d''avis sur C


    Trois pièces, cumulativement : le prospectus établissant une **distribution en numéraire** annuelle
    ; une **garantie ou un collatéral indépendants de l''émetteur** ; et une branche défavorable laissant
    la réserve **au-dessus de 11 M€**. Si le trésorier produit ces documents, je révise ma position en
    séance. En leur absence, la souscription reste un pari à 78 % de la réserve sur la solvabilité d''un
    tiers unique, dont le prospectus n''a pas été versé au dossier.


    ---


    ## 9. Sur le vote


    Le président et quatre administrateurs ont cosigné la note du trésorier : C peut passer. Dans cette
    hypothèse, je demande que le procès-verbal consigne nommément **le calcul de trésorerie du § 3a, la
    branche à 4,7 M€, l''avis du commissaire aux comptes, et le vote de chaque administrateur**. Ce n''est
    pas une manœuvre : la responsabilité est personnelle, et chacun doit voter en sachant ce qu''il vote.
    Je n''exécuterai aucun ordre de souscription avant réception de cet avis écrit.


    Je propose enfin au trésorier de co-piloter le dossier AG. Sa modélisation y sera utile — appliquée
    cette fois à la bonne grandeur : non pas le rendement annualisé de la réserve, mais la probabilité
    de servir les prestations jusqu''au dernier affilié.


    *Le directeur*


    ---


    **Note sur les chiffres** — les projections de réserve, le ratio UMA et le calcul de trésorerie de
    C sont recalculés à partir des seules données du dossier (prestations 5,4 M€ à +4,3 %, cotisations
    4,4 M€ constantes, rendements annoncés). Ils divergent de la projection interne à neuf ans, dont je
    demande la révision. La question de conformité prudentielle est posée, pas tranchée : elle relève
    du commissaire aux comptes.

    '
