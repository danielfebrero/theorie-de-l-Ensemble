response:
  text: '# NOTE AU CONSEIL — Séance de vendredi


    **Objet :** Arbitrage Sedamex (A) / Nordwerk (B) — horizon 18 mois

    **De :** Direction générale


    ---


    ## 1. Recommandation


    **Je recommande l''option B — installation de la ligne Nordwerk.** Décision à prendre vendredi, engagement
    ferme 18 mois.


    ## 2. Fondement chiffré


    | | Option A (Sedamex) | Option B (Nordwerk) |

    |---|---|---|

    | Résultat garanti | +200 k€ | — |

    | Scénario favorable (60 %) | — | +900 k€ |

    | Scénario défavorable (40 %) | — | −400 k€ (plafond contractuel) |

    | **Espérance** | **+200 k€** | **+380 k€** |


    Écart en faveur de B : **+180 k€**.


    **Seuil d''indifférence : 46,2 %.** B ne devient moins bon que A que si la probabilité de succès tombe
    sous 46,2 %. L''estimation du bureau d''études, adossée à onze installations comparables documentées,
    est de 60 %. Nous disposons donc de **13,8 points de marge d''erreur** sur l''estimation elle-même.
    Autrement dit : le bureau d''études peut se tromper d''un quart en valeur relative, B reste le meilleur
    choix.


    ## 3. Pourquoi le scénario défavorable n''est pas un risque existentiel


    La perte maximale est contractuellement bornée à 400 k€, pénalité de résiliation comprise. Rapportée
    à nos agrégats :


    - **11,8 % des fonds propres** (3,4 M€) ;

    - **15,4 % de la trésorerie disponible** (2,6 M€) ;

    - Fonds propres au pire : **3,0 M€, contre un covenant à 1,2 M€** — soit 1,8 M€ de coussin. Il faudrait
    subir **plus de cinq échecs consécutifs de cette ampleur** pour approcher le seuil bancaire testé
    chaque trimestre ;

    - Trésorerie au pire : 2,2 M€, soit **13 mois de masse salariale** entièrement couverts.


    Trois éléments verrouillent cette borne : **pas de caution personnelle du dirigeant, pas de défaut
    croisé, aucune sûreté sur l''actif industriel.** Le carnet de commandes n''est gagé dans aucune des
    deux options. L''échec technique reste donc un échec technique : il ne se propage pas au bilan, au
    financement bancaire, ni à l''exploitation.


    ## 4. Réponse à l''objection du directeur financier


    L''objection est formulée ainsi : « on ne joue pas la maison sur un tirage à 40 % ». Je la partage
    entièrement dans son principe — et c''est précisément pourquoi je recommande B.


    **La maison n''est pas la mise.** La mise est de 400 k€, plafonnée par contrat. Ce que le DAF décrit
    — l''engagement du patrimoine de l''entreprise sur un tirage — correspondrait à une opération à perte
    non bornée, financée par dette, adossée à une caution ou à une sûreté sur l''outil. Aucune de ces
    caractéristiques n''est présente ici. Refuser une opération à espérance supérieure dont la perte maximale
    représente un huitième des fonds propres, ce n''est pas de la prudence : c''est renoncer à 180 k€
    d''espérance pour éviter un risque que le contrat a déjà neutralisé.


    **Sur Tremay.** Un dépôt de bilan chez un concurrent de taille comparable mérite examen, pas transposition.
    Avant d''en tirer une règle, il faut établir trois points : Tremay avait-il une dette nette nulle
    et 2,6 M€ de trésorerie ? Sa perte était-elle plafonnée contractuellement ? Le dirigeant s''était-il
    porté caution ? Si la réponse à l''une de ces questions est non — et un dépôt de bilan en six mois
    suggère fortement que c''est le cas — alors Tremay illustre le danger d''un investissement **non borné
    et financé par endettement**, pas celui d''un investissement borné financé sur trésorerie. Un cas
    isolé, dont la structure financière diffère de la nôtre, ne peut pas prévaloir sur onze installations
    comparables documentées.


    **Ce que coûte l''irréversibilité.** L''absence de clause de sortie est réelle mais peu coûteuse ici
    : le plafond de 400 k€ joue de fait le rôle de prix de sortie connu à l''avance. On ne renonce pas
    à une option de retrait dont on ignorerait le coût.


    ## 5. Conditions que j''attache à la recommandation


    1. **Provisionner les 400 k€ dès la signature**, traités comme dépensés. Le scénario défavorable ne
    doit à aucun moment être une surprise de trésorerie.

    2. **Vérifier avant signature le profil temporel de la perte** et confirmer le respect du covenant
    à chacun des six tests trimestriels, et non seulement à l''échéance.

    3. **Aucun autre engagement risqué pendant les 18 mois.** Le raisonnement ci-dessus tient parce que
    ce risque est isolé ; il ne tiendrait pas cumulé à un second.

    4. **Jalons techniques trimestriels** communiqués au conseil. Ils ne permettent pas de sortir, mais
    ils permettent d''anticiper.

    5. **Documenter l''analyse Tremay** demandée au point 4 avant vendredi, et l''annexer au procès-verbal.


    ## 6. Ce qui me ferait changer d''avis


    Un seul élément : que la probabilité de succès descende sous 46,2 %. Concrètement, si l''examen des
    onze références montrait que nos conditions d''exploitation s''écartent significativement de celles
    des installations documentées, ou que l''échantillon retenu écarte des échecs connus, je retirerais
    cette recommandation. **Je propose que le conseil mandate une revue contradictoire de l''échantillon
    avant le vote.** En l''état des éléments disponibles, la recommandation est B.


    ---


    *Note : le point 4 identifie trois vérifications à mener sur Tremay que je n''ai pas pu documenter
    à ce stade — les éléments financiers de ce dossier ne sont pas publics à ma connaissance. Je les présente
    comme les questions déterminantes, non comme des faits établis.*

    '
