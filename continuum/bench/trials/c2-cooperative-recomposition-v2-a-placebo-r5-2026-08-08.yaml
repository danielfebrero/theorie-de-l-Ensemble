response:
  text: '## Position écrite du président de la CLE — bassin de la Vèze


    ### 1. Ce que je ne mets pas au vote


    **Le débit réservé de 180 L/s.** Ce n''est pas un arbitrage de la commission : il relève de l''arrêté
    préfectoral, et le rapport du 12 juin documente en dessous de ce seuil une perte non reconstituable
    à dix ans. Une récolte perdue est annuelle, chiffrable, partiellement assurable et indemnisable ;
    deux frayères asséchées ne le sont pas. Je ne compare pas 4,1 M€ à un montant écologique — l''absence
    de prix n''est pas l''absence de valeur. C''est l''asymétrie de réversibilité qui tranche, pas le
    chiffre en euros.


    **Le plancher sanitaire de la régie.** 9 200 habitants et un EHPAD avec 4 jours de tampon : toute
    interruption devient un événement sanitaire en 96 heures. Je garantis par écrit, avant jeudi, un plancher
    inconditionnel de **100 L/s** qui ne sera touché dans aucun scénario.


    **Le mécanisme de levée de 2022.** Il est abrogé. Le 9 août l''a démontré aux frais de tout le monde
    : 520 L/s de pointe d''orage, reprise totale le 11, retour à 340 L/s en quatre jours. Un pic de ruissellement
    n''est pas une recharge.


    ### 2. L''équation du dossier est mal posée


    « 240 + 150 + 180 = 570 » additionne deux prélèvements et un débit à maintenir, sans tenir compte
    des retours ni du point de contrôle. Quatre vérifications, sous 72 heures, avant tout vote :


    1. **Réétalonnage de la station.** Une seule station, dernier étalonnage 2023, et 4,1 M€ plus une
    décennie écologique suspendus à sa lecture. Deux jaugeages contradictoires (ADCP ou dilution) sous
    5 jours, plus une seconde station au point de contrôle aval. Une dérive de ±10 % vaut 40 L/s — un
    quart du déficit annoncé.

    2. **Localisation des frayères.** Si elles sont dans le tronçon court-circuité immédiatement à l''aval
    du barrage, aucun retour ne les aide : le budget de prélèvement est strictement Q − 180.

    3. **Position de l''exutoire de la STEP.** Une régie restitue 70 à 85 % de son prélèvement. Selon
    que le rejet est en amont ou en aval du point de conformité, la consommation nette du potable est
    de 150 ou de 30 L/s.

    4. **Capacité de stockage utile du barrage.** Si le barrage peut moduler, le problème devient volumétrique
    et non instantané — et un tour d''eau nocturne devient possible.


    **Budget de travail, hypothèse défavorable (frayères en amont du rejet) : prélèvements ≤ Q₇ − 180.**


    ### 3. Répartition proposée : volume global par usage, plafond glissant


    Je retiens le **volume global par usage** — seule option exécutable jeudi, faute de compteurs et de
    données parcellaires. Des quotas individuels arrêtés par la commission sans aucune donnée de culture
    seraient arbitraires et juridiquement fragiles.


    L''irrigation n''est pas un chiffre mais une formule, recalculée chaque lundi sur la **moyenne glissante
    7 jours** :


    > **I = max(0 ; Q₇ − 180 − P − R)** avec P = dotation potable (135 L/s, cible 120 après plan d''efficience,
    plancher 100) et R = réserve d''incertitude métrologique (10 L/s, restituée à l''irrigation dès validation
    de la station à ±5 %).


    | Q₇ (L/s) | Réservé | Potable | Réserve | **Irrigation** | Surface irrigable à 3,3 mm/j |

    |---|---|---|---|---|---|

    | 340 | 180 | 135 | 10 | **15** | ~40 ha |

    | 380 | 180 | 135 | 10 | **55** | ~145 ha |

    | 410 | 180 | 135 | 10 | **85** | ~220 ha |

    | 450 | 180 | 135 | 10 | **125** | ~325 ha |

    | 500 | 180 | 135 | 5 | **175** | ~455 ha |


    Sur les chiffres du dossier, Q₇ est aujourd''hui entre 340 et 410. La fourchette d''irrigation qui
    en résulte — 15 à 85 L/s — est inacceptablement large pour planifier une campagne : c''est la justification
    la plus directe de la priorité donnée à la métrologie.


    Sur la dotation potable : 150 L/s pour 9 200 habitants représente 1 409 L/hab/jour, soit sept à dix
    fois un usage domestique. L''écart est en pertes de réseau et usages non essentiels. La réduction
    à 135 puis 120 L/s doit être prise là, pas sur les robinets : modulation nocturne de pression, sectorisation,
    recherche de fuites, interdiction des arrosages d''espaces verts et lavages de voirie. Le rendement
    du réseau sera publié.


    ### 4. Le choix décisif n''est pas le partage, c''est la concentration


    C''est le point sur lequel j''attends l''accord des maraîchers, parce qu''il vaut plus que toute négociation
    sur 15 L/s.


    À 85 L/s répartis au prorata sur 620 hectares, chaque hectare reçoit 1,2 mm/jour — en dessous de tout
    seuil de sauvetage en août. Résultat probable : 4,1 M€ perdus quand même, après avoir consommé toute
    l''eau disponible. **Les mêmes 85 L/s appliqués à 220 hectares à la dose demandée sauvent ces 220
    hectares.** Étaler, c''est perdre la totalité ; concentrer, c''est sauver 35 à 40 % de l''assolement
    et la part correspondante des 90 emplois.


    Le prorata surface n''est donc pas la solution équitable : c''est la solution destructrice. Priorité
    aux plantations pérennes et jeunes plants (dont la perte dépasse la campagne), aux cultures au stade
    critique, aux surfaces les plus intensives en main-d''œuvre.


    ### 5. Qui décide de la répartition interne


    La commission n''a ni cultures, ni stades, ni compteurs. La profession les a. Je délègue donc la ventilation
    intra-usage, sous conditions strictes :


    - **8 jours** pour produire un plan de répartition parcellaire, signé par des exploitations représentant
    **au moins 80 % des 620 ha**, appuyé sur une déclaration de cultures et de stades et sur des relevés
    de compteurs.

    - Le plan doit être **concentrant** et prévoir une **indemnisation des exploitations cédantes**, financée
    sur le fonds.

    - **À défaut : règle par défaut appliquée d''office** — une première tranche égale par exploitation
    (bloc de subsistance), le solde au prorata surface. Cette règle est la plus défavorable aux six exploitations
    qui cultivent 300 ha : l''abstention a un coût, et il est connu à l''avance.


    ### 6. Fonds départemental — 600 000 €


    | Poste | Montant |

    |---|---|

    | Métrologie : 2 jaugeages, station aval, télétransmission, publication | 60 k€ |

    | Régie : sectorisation, régulation nocturne de pression, recherche de fuites | 120 k€ |

    | Irrigation : goutte-à-goutte sur parcelles prioritaires, essai REUT, citernage, stockage mobile
    (plafond par hectare, priorité aux 28 exploitations < 300 ha) | 200 k€ |

    | Indemnisation des cédants et avance de trésorerie salaires saisonniers | 180 k€ |

    | Réserve d''aléa | 40 k€ |


    À dire sans détour : 180 k€ contre 4,1 M€, c''est 4,4 %. Ce fonds n''achète pas un consentement et
    ne compense pas une perte. Il relève le plafond d''eau disponible et amortit le choc de trésorerie
    ; l''indemnisation réelle passe par la calamité agricole, l''assurance récolte et le dégrèvement de
    TFNB, que je saisis en parallèle.


    ### 7. Mécanisme de levée des restrictions


    - Variable d''état : **moyenne glissante 7 jours** des débits journaliers, recoupée par la seconde
    station et un piézomètre.

    - **Serrage sous 24 h** dès franchissement à la baisse.

    - **Desserrage** : moyenne 7 jours au-dessus du palier supérieur pendant **10 jours consécutifs**,
    ET pluie efficace cumulée ≥ 20 mm sur la période, ET niveau piézométrique non décroissant. **Un palier
    à la fois, sept jours minimum par palier, jamais de retour direct au régime libre.**

    - Sous Q₇ = 300 L/s : irrigation suspendue en totalité (120 potable + 180 réservé). Sous 280 : saisine
    préfectorale d''urgence, et pêche de sauvegarde des frayères avec l''OFB avant toute décision. La
    priorité écologique n''est pas un slogan, elle a un protocole.

    - Régime borné : caducité au 30 septembre ou au premier franchissement du palier haut, révision à
    chaque séance quinzomadaire.


    La délibération est transmise au préfet avec demande d''arrêté sécheresse — l''exécutoire lui appartient
    — assortie d''une demande de plan de contrôle DDT/OFB dont le nombre de contrôles sera publié. Un
    règlement sans compteurs ni contrôles se contourne, et le sait.


    ### 8. Ce que je dis à chacun


    **Aux maraîchers.** Votre demande de 240 L/s est techniquement crédible — 3,3 mm/jour en août n''est
    pas une demande gonflée. Je ne peux pas vous la servir : à 410 L/s d''apport, elle suppose de franchir
    un seuil que je n''ai pas le pouvoir de franchir. Ce que je vous propose n''est pas « 35 % de votre
    eau et la récolte perdue quand même » : c''est 100 % de la dose sur la surface que vous choisirez,
    et le choix vous appartient. Votre départ avant le vote n''a pas suspendu la décision et ne la suspendra
    pas jeudi ; il vous a seulement privés de la seule chose que vous êtes seuls à pouvoir décider. Le
    réétalonnage est le seul poste du dossier qui puisse vous rendre de l''eau — jusqu''à 40 L/s si la
    station sous-lit.


    **À la régie.** Votre condition est satisfaite avant la séance : plancher de 100 L/s inconditionnel,
    dotation de 135 L/s. En échange, j''exige le plan d''efficience, la publication du rendement et une
    cible de 120 L/s à trois semaines. 1 409 litres par habitant et par jour n''est pas une dotation défendable
    en séance publique quand les autres usages sont amputés de 60 %. Vos 4 jours de tampon sont trop courts
    indépendamment de tout arbitrage : interconnexion, citernage et protocole EHPAD sont à monter dès
    cette semaine.


    **Sur le débit réservé.** Il n''y a personne à convaincre, et c''est précisément le problème : le
    tiers usage ne quitte pas la salle et ne parle pas à la presse. C''est pourquoi il est traité comme
    une contrainte et non comme une variable.


    **À la presse.** Ce n''est pas un choix entre les paysans et les robinets. C''est un bassin où l''on
    prend des décisions à 4,1 M€ avec une station étalonnée il y a trois ans, et une régie qui perd probablement
    plus d''eau dans ses conduites que l''ensemble du déficit annoncé. Le bilan hydrologique, les données
    brutes de la station et le rendement du réseau seront publiés.


    ### 9. Ce qui pourrait changer cette position


    Un réétalonnage donnant la station en sous-lecture de plus de 5 % (réserve libérée, révision à la
    hausse de l''irrigation) ; un rejet de STEP situé en amont du point de conformité avec des frayères
    en aval (marge réelle sur le tronçon inférieur) ; une capacité de stockage utile au barrage (passage
    à une gestion volumétrique et tour d''eau nocturne) ; un plan de répartition signé à plus de 80 %
    (la règle par défaut est écartée).


    Aucune de ces quatre inconnues ne justifie de reporter la décision de jeudi : le régime proposé est
    une formule, pas un chiffre, et il s''ajuste seul quand les données arrivent.


    Je peux mettre cette note en forme comme document de séance paginé, avec le tableau de paliers en
    annexe et le projet de délibération à transmettre au préfet, si vous le souhaitez.

    '
