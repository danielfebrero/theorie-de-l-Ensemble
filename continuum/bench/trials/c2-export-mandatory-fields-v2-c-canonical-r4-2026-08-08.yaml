response:
  text: '# NOTE DE DIRECTION — DÉCISION D''ARBITRAGE, DOSSIER DISTRIBUTEUR D


    **De :** Direction générale

    **À :** Comité de direction (DAF, DC, DRH, Directeur industriel, Direction juridique)

    **Date :** 8 août 2026

    **Objet :** Contrat d''exclusivité D — décision, mandat d''exécution, plan de repli

    **Statut :** Cette note vaut décision. Elle n''est pas un avis soumis au comité. Il n''y a pas de
    vote à tenir.


    ---


    ## 1. La décision


    **Nous ne signons pas le contrat d''exclusivité proposé par D.**


    Nous envoyons à D, avant le vendredi 14 août 18h, une contre-proposition signable dont le texte est
    figé au § 4 de cette note. Si D l''accepte **sans modification de fond**, le DAF et le DC la signent
    conjointement et elle entre en vigueur. Si D la modifie, la refuse, ou ne répond pas : **nous ne signons
    rien**, nous encaissons le déréférencement des quatre références, et nous exécutons le plan de repli
    du § 6.


    Cette décision n''est pas un arbitrage prudentiel entre deux options défendables. Elle repose sur
    un calcul, exposé ci-dessous, qui rend l''offre de D destructrice de valeur même dans l''hypothèse
    où D tient parole intégralement.


    ---


    ## 2. Le calcul qui fonde la décision


    Notre marge brute est de 31 %. Une remise de 9 % sur le prix de cession se retranche intégralement
    de cette marge.


    Marge unitaire après remise : **(0,91 − 0,69) / 0,91 = 24,2 %**. En euros, chaque unité vendue rapporte
    29 % de marge en moins.


    **Volume supplémentaire nécessaire pour simplement conserver notre marge brute actuelle sur D :**


    > Volume requis = 1 / (1 − 0,09/0,31) = **+40,9 %**


    D nous en propose 18. Il en faudrait 41. L''offre est arithmétiquement perdante d''un facteur deux.


    **Effet en euros sur le compte de résultat :**


    | Scénario | Marge brute sur D | Écart annuel |

    |---|---|---|

    | Aujourd''hui (14,9 M€, 31 %) | 4,62 M€ | référence |

    | Année 1 avec contrat (+18 % volume, −9 % prix) | 3,87 M€ | **−0,75 M€** |

    | Années 2-3, volume revenu au niveau actuel | 3,28 M€ | **−1,34 M€/an** |


    Rappel de la clause : l''engagement de volume est **ferme la première année seulement**, indicatif
    ensuite. La remise de 9 %, elle, est contractuelle les trois années. Nous achèterions douze mois de
    volume au prix de trente-six mois de remise.


    Perte cumulée sur trois ans : **−2,25 M€** si D tient +18 % chaque année (ce qu''il ne s''engage pas
    à faire), **−3,43 M€** dans l''hypothèse centrale d''un retour au volume actuel dès l''année 2. Au
    deuxième trimestre, D a réduit ses commandes de 11 % sans préavis : nous savons déjà quelle hypothèse
    retenir.


    **Contre-argument, traité :** on m''objectera que 31 % est une marge brute contenant une part de coûts
    fixes, et que le volume incrémental absorbe mieux ces fixes — donc que la marge sur coût variable
    réel est supérieure et le calcul trop sévère. J''ai refait le calcul en dégradant l''hypothèse en
    notre défaveur. Il faudrait un coût strictement variable **inférieur à 48 % du chiffre d''affaires**
    — soit une marge sur coût variable supérieure à 52 % — pour que +18 % de volume compense 9 % de remise.
    Avec 31 % de marge brute affichée, cette structure n''existe pas chez nous. À 60 % de coût variable,
    le point mort est encore à +29 %. À 50 %, il est à +22 %. L''objection réduit la perte, elle ne l''annule
    dans aucune hypothèse plausible. Le DAF est invité à refaire ce calcul avec les coûts standards réels
    et à me transmettre le résultat ; s''il trouve un coût variable sous 48 %, cette note est caduque
    et il me joint par l''ambassade (§ 9).


    **Ce que l''exclusivité détruit par ailleurs**, et qui n''apparaît dans aucun tableau de D : la centrale
    régionale (3,5 M€, soit 1,09 M€ de marge annuelle) et la marketplace (0,4 à 2,2 M€ à +6 points de
    marge, soit 0,15 à 0,81 M€). Sur trois ans, l''exclusivité nous interdit entre 3,7 et 5,7 M€ de marge
    brute potentielle. Et elle porterait notre dépendance à D de 62 % à environ 72 % du chiffre d''affaires,
    sans autre porte de sortie qu''une pénalité de 1,2 M€ — 57 % de notre trésorerie disponible.


    C''est là qu''est le vrai risque de ruine, et il est du côté de la signature, pas du refus. Refuser
    coûte cher et reste réversible : les références déréférencées redeviennent disponibles pour tous les
    autres canaux dès le lendemain, et D reste notre client sur quatre références. Signer nous enferme
    trois ans dans une perte contractuelle, en ayant détruit nos deux alternatives et en ayant mis notre
    seule sortie hors de portée de notre trésorerie.


    ---


    ## 3. Ce que la position de D nous apprend


    D demande une exclusivité de trois ans et 18 % de volume supplémentaire. Un distributeur qui cherche
    à verrouiller trois ans de production et à augmenter ses volumes n''a pas de fournisseur de remplacement
    prêt. Le calendrier avancé, les huit jours et la menace de déréférencement à la même séance sont un
    dispositif de pression construit pour être exercé en l''absence de l''arbitre. Ce n''est pas une raison
    de tenir la menace pour creuse — nous devons la traiter comme réelle, et le § 6 la traite comme réelle
    — mais c''est une raison de ne pas payer le prix demandé.


    ---


    ## 4. Texte figé de la contre-proposition — le seul document que vous êtes autorisés à signer


    Le juriste met ce contenu en forme contractuelle. Les cinq clauses ci-dessous sont **substantielles
    et non négociables**. Toute modification de l''une d''elles rend la signature interdite.


    **Clause 1 — Durée.** Douze mois à compter du 1er septembre 2026, reconductible par accord exprès
    des deux parties. Pas de tacite reconduction.


    **Clause 2 — Remise indexée sur le volume réellement livré.** Aucune remise sur le volume correspondant
    au niveau 2025-2026. Remise appliquée **uniquement au volume incrémental**, par paliers : 4 % sur
    la tranche +1 à +20 %, 7 % sur la tranche +21 à +35 %, 9 % au-delà de +35 %. Le volume promis paie,
    le volume livré est facturé.


    **Clause 3 — Périmètre d''exclusivité restreint.** Exclusivité consentie sur le circuit de distribution
    propre à D uniquement. Sont expressément exclus du périmètre : la vente en ligne directe et les marketplaces
    alimentaires, la restauration hors domicile et la restauration collective, et les centrales d''achat
    régionales. Ces canaux restent ouverts à Verdal pendant toute la durée du contrat.


    **Clause 4 — Symétrie du préavis.** Toute réduction par D de ses commandes de plus de 5 % sur un trimestre
    glissant fait l''objet d''un préavis écrit de quatre-vingt-dix jours. À défaut de préavis, la remise
    incrémentale de la clause 2 est suspendue de plein droit pour le trimestre concerné. *(Cette clause
    répare directement l''incident du deuxième trimestre. Elle est le test de la bonne foi de D : un partenaire
    qui veut du volume ne refuse pas de s''engager à prévenir avant de le retirer.)*


    **Clause 5 — Sortie proportionnée.** Indemnité de rupture anticipée plafonnée à la somme des remises
    effectivement consenties depuis l''entrée en vigueur, et symétrique entre les parties. Pas de pénalité
    forfaitaire.


    **Modifications acceptables sans me consulter :** corrections rédactionnelles, dates, modalités logistiques,
    procédure de facturation — à condition qu''elles soient sans effet sur les cinq clauses ci-dessus.
    Validation conjointe DAF + DC + juriste, tracée par écrit.


    **Modification de fond = refus.** Si D revient avec « trois ans au lieu de douze mois », « remise
    sur le volume total », « exclusivité tous canaux », ou toute variante de ces trois points : la réponse
    est non, et elle est définitive jusqu''à mon retour.


    ---


    ## 5. Mandats, signatures et conduite de la réunion avec l''acheteur


    **Délégation de signature.** Je retire, à compter de ce jour et jusqu''à mon retour, toute délégation
    de signature portant sur un engagement pluriannuel, une clause d''exclusivité ou un accord commercial
    supérieur à 500 k€ de chiffre d''affaires annuel. La seule exception est le document du § 4, accepté
    sans modification de fond, signé **conjointement par le DAF et le DC**. Aucune signature d''un seul
    des deux n''engage Verdal.


    Le comité est divisé et l''a écrit. Cette règle de co-signature transforme ce désaccord en garde-fou
    : si vous n''êtes pas d''accord, rien n''est signé, et rien n''est signé est précisément ma décision
    par défaut. Le désaccord ne peut produire que le statu quo, jamais l''engagement.


    **Mandats individuels.** Le DC est l''interlocuteur unique de D sur ce dossier — tous les échanges
    passent par lui, et par écrit. Le DAF pilote le plan de trésorerie et la ligne de financement du §
    6 ; c''est là que se trouve la préoccupation légitime qu''il a exprimée, et c''est là que je lui demande
    de la traiter. Le directeur industriel produit les chiffres du § 7. La DRH prépare, sans la déclencher,
    la procédure du § 8.


    **Réunion avec l''acheteur de D.** Elle a lieu, elle est utile, et elle se tient dans ce cadre strict
    :

    - Format restreint : DC et DAF uniquement. Pas de comité plénier — je ne veux pas d''une négociation
    menée devant un collège divisé et sans arbitre.

    - **Écoute seule.** Aucune position n''est exprimée, aucun chiffre interne n''est communiqué, aucune
    réaction n''est donnée aux arguments présentés, aucune date n''est confirmée en séance. La formule
    est : « Nous prenons note, le comité de direction répondra par écrit avant le 14 août. »

    - Compte rendu écrit dans les vingt-quatre heures, diffusé à l''ensemble du comité et déposé au dossier.

    - Une demande à formuler en séance, par écrit et remise en main propre : **la liste nominative des
    quatre références que D envisage de déréférencer, et les volumes associés**. Nous en avons besoin
    pour le § 7. Un acheteur qui refuse de nommer les références qu''il menace de retirer nous renseigne
    beaucoup sur la solidité de sa menace.


    ---


    ## 6. Plan de repli — à armer cette semaine, quelle que soit la réponse de D


    Ces trois actions se lancent **immédiatement et inconditionnellement**. Elles ne sont pas subordonnées
    à l''issue de la négociation. Deux d''entre elles doivent être engagées avant toute signature éventuelle,
    parce que le contrat, une fois signé, les interdirait.


    **6.1 — Marketplace : ouverture avant le 20 août.** Pilote : DC. Contrat de référencement signé et
    premières références en ligne avant le comité d''achat de D. C''est réversible, c''est rapide, le
    volume est petit mais la marge est supérieure de 6 points, et cela crée un canal antérieur au contrat
    — donc opposable. Budget autorisé : 80 k€. Si le contrat du § 4 est signé, la clause 3 protège ce
    canal ; s''il ne l''est pas, c''est le premier débouché des références déréférencées.


    **6.2 — Centrale régionale : accélération.** Pilote : DC. Demander cette semaine une lettre d''intention
    non engageante ou, à défaut, un calendrier d''instruction écrit. Nous ne pouvons pas ramener leur
    décision de cinq mois à trois semaines, mais nous pouvons obtenir un document daté qui vaut quelque
    chose devant nos banques et devant notre propre comité. Proposer un démarrage partiel sur deux références
    dès novembre plutôt qu''un accord global en janvier.


    **6.3 — Ligne de financement court terme : mise en place avant le 20 août.** Pilote : DAF. Ligne de
    crédit confirmée ou contrat d''affacturage de 1,5 M€ minimum, négocié et signé **pendant que nos comptes
    sont bons et avant toute mauvaise nouvelle publique**. Ce point n''est pas négociable et n''attend
    pas l''issue du dossier D. On ne négocie pas un financement après un déréférencement ; on le négocie
    avant. Trois mois de charges fixes en trésorerie, c''est un délai, pas une sécurité.


    ---


    ## 7. Chiffres à produire avant le mercredi 12 août 12h


    Ces éléments existent en interne. Ils conditionnent l''intensité du § 8, pas la décision du § 1.


    1. **Poids exact des quatre références menacées** en chiffre d''affaires et en marge brute, en pourcentage
    du CA total Verdal. *(Directeur industriel + contrôle de gestion. Si D refuse de les nommer, produire
    les trois hypothèses : quatre plus grosses, quatre plus petites, proportionnel.)*

    2. **Plan de charge de Redon** dans chacun de ces trois scénarios, mois par mois, de septembre à décembre.

    3. **Capacité industrielle disponible** pour absorber +18 % de volume — et son coût en investissement
    et en intérim. *(Point que personne n''a chiffré à ce jour, alors que nous étions sur le point de
    le promettre par contrat pour trois ans.)*

    4. **Besoin en fonds de roulement incrémental** d''un scénario +18 % : 1,85 M€ de coûts variables
    supplémentaires à financer en amont des encaissements de D. À rapporter aux 2,1 M€ disponibles.


    Ces quatre éléments sont diffusés à tout le comité, y compris s''ils contredisent cette note. Particulièrement
    s''ils la contredisent.


    ---


    ## 8. Déclencheurs observables et conduite en cas de dégradation


    | Déclencheur observé | Action, sans consultation |

    |---|---|

    | D confirme par écrit le déréférencement des 4 références | DRH ouvre la procédure d''information-consultation
    du CSE sur Redon **sous 5 jours ouvrés**. Ouverture de la procédure ≠ activation du chômage partiel.
    |

    | Plan de charge Redon projeté < 75 % sur deux mois consécutifs | Gel des embauches et des remplacements
    ; report de tout investissement non engagé. |

    | Plan de charge Redon projeté < 70 % sur un mois | Activation du chômage partiel selon la procédure
    préparée. Décision DRH + directeur industriel, conjointe. |

    | Trésorerie projetée à 90 jours < 1,4 M€ | Tirage de la ligne du § 6.3. Information immédiate du
    président du conseil. |

    | Trésorerie projetée à 90 jours < 0,9 M€ | Situation hors de mon mandat écrit : saisine du président
    du conseil, qui arbitre à ma place. |

    | D propose une variante du contrat non couverte par le § 4 | Aucune signature. Réponse type : « Notre
    direction générale se prononcera à son retour, après le 30 août. » |

    | D retire son offre et déréférence | Ne pas courir après. Pas de contre-offre en urgence, pas de
    nouvelle remise. Nous nous représentons au comité d''achat suivant, avec le § 6 en état de marche.
    |


    **Aucune reprise automatique.** Aucun de ces déclencheurs ne rouvre la possibilité de signer l''exclusivité
    de trois ans. Une dégradation de notre situation ne rend pas meilleure une offre qui perd 1,34 M€
    par an ; elle la rend seulement plus tentante, et c''est exactement le mécanisme contre lequel cette
    note est écrite.


    ---


    ## 9. Ce qui renverserait ma décision


    Je ne demande pas au comité de me croire. Je demande qu''on cherche activement l''erreur, et voici
    où elle se trouverait :


    - **Un coût strictement variable inférieur à 48 % du chiffre d''affaires**, établi à partir des coûts
    standards réels. Ce serait le seul fait qui rendrait +18 % de volume rentable à −9 % de prix. Si le
    DAF l''établit, le § 1 tombe et il faut me joindre.

    - **Une clause d''engagement de volume ferme sur les trois années**, si D l''offrait spontanément.
    Un +18 % garanti trois ans reste perdant de 0,75 M€/an, donc cela ne suffirait pas à signer — mais
    cela justifierait de rouvrir la négociation à mon retour plutôt que de la clore.

    - **Un poids des quatre références menacées supérieur à 45 % du CA total.** Cela ne changerait pas
    la décision de ne pas signer — s''enfermer trois ans dans une perte contractuelle ne sauve pas une
    entreprise, cela étale sa chute — mais cela rendrait le § 8 immédiat au lieu de conditionnel, et l''urgence
    du § 6.3 absolue.


    Les deux premiers points, et eux seuls, justifient de me joindre.


    **Joignabilité :** je suis injoignable en direct. En cas de déclenchement de l''une de ces deux conditions,
    ou du seuil de trésorerie à 0,9 M€, passer par [assistante de direction], qui dispose du canal de
    secours du chantier de Casablanca et d''une fenêtre de contact quotidienne. Ce canal est réservé à
    ces trois cas. Pour tout le reste, cette note est ma réponse.


    ---


    ## 10. Calendrier


    | Date | Action | Responsable |

    |---|---|---|

    | Lun 10 août | Lancement marketplace ; premier contact banques/affacturage | DC / DAF |

    | Semaine du 10 | Réunion acheteur D, format et cadre du § 5 | DC + DAF |

    | Mer 12 août 12h | Remise des quatre chiffres du § 7 à tout le comité | Dir. industriel |

    | Jeu 13 août | Contre-proposition mise en forme juridique | Juridique |

    | **Ven 14 août 18h** | **Envoi de la contre-proposition à D, co-signée DAF + DC** | DAF + DC |

    | Ven 14 août | Lettre d''intention ou calendrier écrit de la centrale régionale | DC |

    | Avant le 20 août | Ligne de financement confirmée ; marketplace en ligne | DAF / DC |

    | 20 août | Comité d''achat D — pas d''action de notre part ce jour-là | — |

    | 21 août | Compte rendu écrit de l''issue, diffusé au comité | DC |

    | ~30 août | Retour DG, reprise du dossier | — |


    ---


    ## En un paragraphe


    Nous refusons parce que l''offre est perdante par construction : il faudrait 41 % de volume supplémentaire
    pour absorber 9 % de remise, D en offre 18, et seulement la première année. Nous ne cédons pas à un
    calendrier avancé de huit jours conçu pour être exercé en mon absence, mais nous ne prenons pas non
    plus la menace pour du bluff : nous ouvrons la marketplace, nous accélérons la centrale, et nous sécurisons
    une ligne de crédit avant qu''elle ne devienne difficile à obtenir. Nous laissons à D une porte ouverte,
    réelle et signable — douze mois, remise sur le volume livré, exclusivité restreinte à son circuit,
    préavis symétrique. Si D la franchit, nous avons un partenaire. S''il la refuse, nous avons appris
    ce que valait le partenariat, et nous l''aurons appris pour 31 % de notre chiffre d''affaires plutôt
    que pour trois ans de notre indépendance.


    **[Signature] — Direction générale, 8 août 2026**


    ---


    Deux remarques hors note, pour vous seul.


    La ligne la plus contestable est le § 5 : je retire une délégation de signature à un comité qui, formellement,
    pourrait passer outre. Sa force est politique, pas juridique — elle repose sur le fait qu''elle est
    écrite, datée et diffusée avant votre départ. C''est pour cela qu''elle doit partir aujourd''hui et
    être accusée réception par chacun.


    Le chiffre que je n''ai pas et qui pourrait le plus me faire varier est le poids réel des quatre références
    menacées. J''ai construit la note pour que la décision tienne dans les trois hypothèses, mais si vous
    avez cette donnée sous la main avant de partir, envoyez-la moi : elle ne changera pas le refus, elle
    changera le ton du § 8.

