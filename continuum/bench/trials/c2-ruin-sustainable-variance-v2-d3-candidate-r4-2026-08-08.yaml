response:
  text: '# Note au conseil — arbitrage Sedamex / Nordwerk

    **Objet :** recommandation sur les 18 prochains mois — **Direction générale, séance du vendredi**


    ## Recommandation


    **Je recommande l''option B — installation de la ligne Nordwerk**, sous réserve suspensive d''une
    validation juridique du plafond de perte avant signature (voir §4).


    ## 1. Le chiffrage


    | | Option A — Sedamex | Option B — Nordwerk |

    |---|---|---|

    | Résultat sur 18 mois | +200 k€ certains | +900 k€ (60 %) / −400 k€ (40 %) |

    | Espérance | **+200 k€** | **+380 k€** |

    | Fonds propres au plus bas | 2,90 M€ | **2,30 M€** (branche défavorable) |

    | Trésorerie au plus bas | 2,10 M€ | **1,50 M€** (branche défavorable) |


    Trajectoire retenue pour le pire enchaînement de B : dividende de 350 k€ au 4ᵉ mois, dividende de
    350 k€ au 10ᵉ mois, pénalité de 400 k€ constatée au 12ᵉ mois, plan par ailleurs à l''équilibre.


    ## 2. Le covenant n''est pas menacé


    Fonds propres au test trimestriel le plus bas, branche d''échec : **2,30 M€ contre un seuil de 1,2
    M€**. La marge est de 1,1 M€. Pour rompre le covenant, il ne suffit pas que Nordwerk échoue : il faudrait
    que la perte réelle atteigne environ 1,5 M€, soit **près de quatre fois le plafond contractuel**.
    La trésorerie plancher, 1,50 M€, représente neuf mois de masse salariale. Aucun trimestre de la branche
    défavorable ne passe sous le seuil.


    ## 3. Réponse à l''objection de la direction financière


    L''objection est la bonne question posée au mauvais montant.


    **« On ne joue pas la maison. »** La maison n''est pas engagée. L''exposition maximale est de 400
    k€, soit 11,8 % des fonds propres et 15 % de la trésorerie. Elle est plafonnée au contrat, sans caution
    personnelle du dirigeant, sans défaut croisé, sans sûreté sur l''actif industriel, et le carnet de
    commandes n''est gagé dans aucune des deux options. Il n''existe donc **aucune branche de perte irrécupérable**
    : c''est de la volatilité de résultat sur un exercice, pas un risque de continuité. Un veto serait
    justifié si une branche pouvait emporter l''entreprise — ici, aucune ne le peut.


    **Le précédent Tremay.** Une défaillance n''est pas transposable sans sa structure. Une ligne neuve
    fait tomber une entreprise quand la perte est non plafonnée, financée par dette, ou adossée à une
    sûreté sur l''outil. Nous sommes dans la situation inverse sur les trois points, avec une dette nette
    nulle. Retenir Tremay comme argument, c''est raisonner sur un cas isolé sans en connaître les clauses,
    contre onze installations comparables documentées par notre bureau d''études.


    **Ce que l''objection capte justement**, et que je retiens : l''engagement est **irréversible sur
    18 mois**. C''est le vrai coût de B. Mais l''irréversibilité porte sur un montant borné et absorbable
    — c''est ce qui la rend acceptable.


    **Ce que je propose à la direction financière**, et que je demande au conseil d''entériner : elle
    pilote le comité de jalons Nordwerk et **détient le pouvoir de déclencher elle-même la constatation
    d''échec**, sans arbitrage de ma part. Je m''engage par ailleurs à ne proposer aucune distribution
    nouvelle avant la levée de l''incertitude technique.


    ## 4. Repli, déclencheurs et point de bascule


    - **Jalon technique au 6ᵉ mois.** Cadence et taux de rebut non conformes au dossier des onze installations
    → constatation immédiate de l''échec, sans attendre le 12ᵉ mois. On paie les 400 k€ plus tôt, on cesse
    d''y affecter des ressources, on redéploie l''atelier.

    - **Seuil de trésorerie.** Passage sous 1,3 M€ à une clôture trimestrielle → gel de tout investissement
    discrétionnaire et information du conseil sous 15 jours.

    - **Seuil de covenant.** Fonds propres projetés sous 1,6 M€ à un test → information immédiate du banquier,
    avant qu''il ne la demande.


    **L''observation qui renverse cette recommandation :** le plafond de 400 k€ est le pivot de tout le
    raisonnement. S''il comporte une exclusion — dommages indirects, coûts de remise en état, pénalités
    clients en aval non couvertes — ou si la définition contractuelle de l''« échec technique » laisse
    à Nordwerk la main sur sa constatation, alors l''exposition n''est plus bornée et **l''option A redevient
    la bonne décision**. Second point de bascule : si la non-reconduction fait perdre Sedamex de façon
    durable au-delà des 18 mois, sa valeur relationnelle dépasse les 200 k€ affichés et doit être réintégrée
    à l''arbitrage.


    **Première action, avant toute signature :** revue juridique du plafonnement et de la clause de constatation
    d''échec, restituée au conseil sous dix jours. Sans cette confirmation, la recommandation ne tient
    pas.

    '
