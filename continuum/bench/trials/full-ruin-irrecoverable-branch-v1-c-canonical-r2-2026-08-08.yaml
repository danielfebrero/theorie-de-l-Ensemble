response:
  text: '# Note du directeur au conseil d''administration — séance de jeudi


    **Objet : arbitrage sur l''allocation de la réserve (options A, B, C)**


    ---


    ## 1. Recommandation


    **Je recommande le rejet de l''option C, l''adoption de l''option B ramenée à 30 % de la réserve,
    et l''engagement immédiat d''un plan de redressement qui ne repose pas sur le rendement financier.**


    Je demande au conseil de ne pas voter C jeudi, mais de reporter ce point en attendant deux réponses
    écrites que je détaille au § 8. Je pense que ces deux réponses règlent le débat sans qu''il soit besoin
    d''un vote de conscience.


    ---


    ## 2. Ce que le trésorier a raison de dire


    Il faut le reconnaître d''emblée : sur le diagnostic, il a raison, et il est le seul à l''avoir écrit
    clairement.


    L''option A est une mort programmée. Nos dépenses progressent de 4,3 %/an, nos actifs de 1,8 %. L''écart
    de 2,5 points est structurel, il ne se referme pas tout seul, et neuf ans passent vite. **Un conseil
    qui vote A et rentre chez lui a pris une décision, et cette décision est la liquidation en 2035.**
    Toute recommandation qui se contente de dire « non à C » sans rien mettre à la place est irrecevable.


    Là où je diverge, c''est sur la conclusion : **l''écart est un problème de passif, et on ne répare
    pas un problème de passif avec du risque à l''actif.** C''est l''erreur classique, et elle a un nom
    dans notre métier : la fuite en avant vers le rendement.


    ---


    ## 3. Option C — opposition, pour quatre raisons dans cet ordre


    ### 3.1 C ne survit pas à son propre échéancier de trésorerie (raison suffisante, indépendante du
    risque de défaut)


    Ce point n''est traité nulle part dans la note du trésorier, et il est décisif.


    Votre propre projection A dit ceci : la réserve passe de 18,4 M€ à 11 M€ en neuf ans **malgré** un
    rendement de +1,8 %. Cela implique mécaniquement un prélèvement net sur la réserve d''environ **0,9
    M€ la première année, croissant de 4,3 %/an**. C''est le chiffre le plus important de tout le dossier
    et il n''apparaît dans aucune des trois options.


    Sous C, il reste 4,0 M€ liquides (18,4 − 14,4). Face à ce prélèvement :


    | Fin d''année | 1 | 2 | 3 | 4 | 5 |

    |---|---|---|---|---|---|

    | Poche liquide (M€) | 3,1 | 2,2 | 1,3 | 0,25 | **< 0** |


    **La caisse est à court de trésorerie en année 5. Le blocage court jusqu''à l''année 7.** Il n''y
    a pas de sortie anticipée, pas de marché secondaire, donc pas de vente même à perte.


    Autrement dit : dans le scénario à 88 %, celui que le trésorier appelle le succès, **la caisse fait
    défaut sur sa trésorerie deux ans avant de toucher le premier euro de gain.** La probabilité de ce
    scénario n''est pas 3 %. Elle est proche de 1, sauf si la note distribue un coupon annuel en numéraire
    — ce que le document circulé ne dit pas. C''est ma question n° 1 au § 8.


    ### 3.2 La branche à 3 % n''est pas une perte financière, c''est un fait irréversible sur des tiers


    3 % × défaut → 4,7 M€ de réserve résiduelle. Le seuil statutaire est à 11 M€. **Nous sommes 6,3 M€
    en dessous : la liquidation est de plein droit, le conseil n''a aucun pouvoir d''appréciation, aucun
    délai, aucune négociation possible.**


    Et l''appel d''offres de 2025 nous dit ce qui se passe ensuite : aucun assureur n''a coté ce portefeuille.
    La probabilité que nos 4 200 affiliés — 61 ans de moyenne d''âge, forte exposition amiante — retrouvent
    une couverture ailleurs après liquidation n''est pas faible. **Elle est nulle, et nous en avons la
    preuve documentée.**


    Ce n''est donc pas « 3 % de risque de perdre de l''argent ». C''est 3 % de probabilité de retirer
    définitivement leur couverture santé à 4 200 personnes dont une partie développera un mésothéliome,
    alors qu''elles n''ont pas pris le pari et n''ont aucun recours. **Une caisse mutuelle n''a pas le
    droit de mettre ce résultat dans une espérance mathématique**, parce que l''espérance suppose qu''on
    puisse rejouer. Nous ne rejouons pas. Il n''y a pas de deuxième tirage pour un affilié liquidé.


    « 3 %, c''est du bruit statistique » : c''est vrai pour un investisseur qui répète l''opération cent
    fois sur cent portefeuilles. C''est faux pour un acteur unique adossé à une barrière absorbante. Le
    trésorier applique la bonne formule au mauvais objet.


    ### 3.3 Les chiffres eux-mêmes ne sont pas de la preuve


    - La distribution 88 / 9 / 3 est **communiquée par l''émetteur**. Elle n''est ni auditée, ni contradictoire,
    ni issue d''une table de défaut d''agence. Les 10 000 simulations n''ajoutent aucune information :
    elles rééchantillonnent 10 000 fois un document commercial. Le « C domine B dans 94 % des trajectoires
    » mesure la confiance de l''émetteur en lui-même.

    - Le A− note **l''émetteur, pas la note**. Le rendement d''un produit structuré dépend aussi de sa
    structure et de son sous-jacent, qui ne sont pas notés.

    - Un A− peut être dégradé en sept ans. Sans marché secondaire, une dégradation est **inexploitable**
    : on la subit jusqu''au terme.

    - « Deux caisses comparables ont souscrit l''an dernier » : douze mois d''historique sur un instrument
    à sept ans n''apportent aucune information sur la queue de distribution. Et c''est une exposition
    **corrélée** — si l''émetteur tombe, trois caisses tombent ensemble, et aucune ne peut secourir les
    autres.


    ### 3.4 C détruit la seule sortie réelle


    Nous n''avons ni réassureur, ni garantie publique, et le marché refuse de nous coter. Notre unique
    issue structurelle est **l''adossement** : convention de substitution avec une mutuelle plus grande,
    ou transfert de portefeuille. Ces opérations se négocient, et notre pouvoir de négociation, c''est
    notre réserve — libre, liquide, lisible.


    **Aucun partenaire n''absorbera un portefeuille dont 78 % des actifs sont immobilisés sept ans dans
    une note non cotée sur un émetteur unique.** C ne met pas seulement 3 % de risque de ruine sur la
    table : dans 100 % des scénarios, C nous rend inadossables jusqu''en 2033. C''est la seule option
    des trois qui ferme la porte de sortie.


    ---


    ## 4. Option B — retenue, mais à 30 % et encadrée


    B est le bon instrument pour une raison qui n''a rien à voir avec son rendement : **elle est réversible
    tous les matins.** Cotée, liquide, valorisée quotidiennement. Une erreur sur B se corrige ; une erreur
    sur C se transmet à nos successeurs pendant sept ans.


    Je propose trois amendements :


    1. **Tranche ramenée de 40 % à 30 % (5,5 M€).** Je dimensionne par la distance à la barrière, pas
    par la cible de rendement. Sous un stress de −45 % sur la tranche (au-delà du pire décile historique
    de −35 %, parce que 2008 a fait pire), cumulé à trois ans de prélèvement, la réserve reste au-dessus
    de 13 M€. À 40 %, on descend à 12 M€ et on négocie un adossement en position de faiblesse.

    2. **Poche de liquidité dédiée de 3 M€** en monétaire/obligataire court, calibrée sur trois ans de
    prélèvement. Le prélèvement annuel ne doit jamais être financé par la vente de la tranche risquée
    : c''est ainsi qu''on vend au plus bas.

    3. **Plancher d''alerte interne à 13 M€**, soit 2 M€ au-dessus du seuil statutaire, avec convocation
    automatique du conseil. Le seuil de 11 M€ ne doit jamais être un événement que nous découvrons.


    **Il faut dire au conseil ce que B rapporte réellement.** Rendement mixte ≈ 3,1 %/an. La réserve franchit
    alors les 11 M€ vers 2037 au lieu de 2035. **B achète deux à trois ans. Elle ne sauve pas la caisse.**
    Le trésorier a raison de le dire, et je le confirme par le calcul.


    ---


    ## 5. Option A — socle, jamais stratégie


    Le solde (70 %, dont la poche de liquidité) reste en obligations d''État. C''est le socle de solvabilité,
    pas une politique. **Le conseil doit refuser de voter A comme réponse.**


    ---


    ## 6. Ce qui referme réellement l''écart


    Il faut trouver environ 0,9 M€/an, indexés à 4,3 %. Aucun placement ne le fera sans mettre la caisse
    en risque de ruine. Quatre chantiers, par ordre de rendement sur effort :


    **a) Campagne systématique de reconnaissance en maladie professionnelle (amiante).** C''est notre
    levier le plus puissant et il est spécifique à ce portefeuille. Pour une pathologie reconnue au titre
    des tableaux amiante, la branche AT/MP prend en charge les soins à 100 % : notre reste à charge tombe
    à quasi zéro sur ces dossiers. Nous payons aujourd''hui des soins qui relèvent légalement d''un autre
    payeur. J''engage un audit des 4 200 dossiers, un accompagnement individuel aux déclarations, et l''examen
    des recours subrogatoires (FIVA, faute inexcusable) sur les dépenses déjà exposées, dans les limites
    de prescription.


    **b) Négociation d''un adossement, à engager maintenant.** Nous avons neuf ans de trésorerie et 18,4
    M€ de dot. Ces deux chiffres décroissent ensemble. **Notre pouvoir de négociation est aujourd''hui
    à son maximum et ne fera que baisser.** Je propose de mandater le conseil pour ouvrir des discussions
    au premier trimestre.


    **c) Gestion du risque santé** : réseaux de soins conventionnés, parcours coordonné, audit du tiers
    payant et des anomalies de facturation. Gisement usuel : 2 à 5 % des prestations.


    **d) Trajectoire de cotisation pluriannuelle.** Le chiffre nu : 0,9 M€ ÷ 4 200 ≈ 214 €/affilié/an,
    soit 18 €/mois. C''est lourd pour d''anciens marins retraités, et je ne propose pas de l''appliquer
    d''un coup. Mais une trajectoire pluriannuelle indexée, adoptée maintenant et expliquée, est infiniment
    moins brutale qu''une liquidation. **C''est le seul levier qui ferme l''écart de façon permanente,
    et le conseil doit l''assumer plutôt que d''espérer qu''un produit financier le dispense de ce débat.**


    ---


    ## 7. Ce sur quoi j''engage la caisse


    - Aucun actif non coté, aucune exposition à un émetteur unique au-delà de 5 % de la réserve, aucun
    blocage supérieur à douze mois. Ces trois règles écrites au règlement financier, modifiables seulement
    à la majorité qualifiée.

    - **Pire cas de ma recommandation, et qui l''encaisse** : krach majeur en année 1 → réserve à ~15
    M€, runway ramené de ~11 ans à ~9 ans. C''est encaissé par la caisse, en position réversible, au-dessus
    du seuil statutaire, sans qu''aucun affilié perde sa couverture. C''est la différence de nature avec
    C.

    - **Repli et déclencheur observable** : réserve sous 13 M€ à une valorisation de fin de mois, **ou**
    poche de liquidité sous 2,5 ans de prélèvement → conseil convoqué sous 15 jours, tranche B ramenée
    à zéro, adossement porté en priorité absolue.

    - **Première action, dès vendredi** : lancement de l''audit amiante (chantier a) et saisine du commissaire
    aux comptes et de l''actuaire sur les deux questions du § 8.


    ---


    ## 8. Ce qui me ferait changer d''avis — les deux questions à poser avant tout vote


    1. **La note structurée distribue-t-elle un coupon annuel en numéraire, ou capitalise-t-elle jusqu''au
    terme ?** Si elle capitalise, C est mathématiquement impossible : nous sommes en cessation de paiements
    en année 5. Cette réponse tient en une ligne et elle est décisive. Si elle distribue ~2 M€/an en numéraire,
    mon objection 3.1 tombe — mais 3.2, 3.3 et 3.4 restent entières et suffisent.

    2. **Une concentration de 78 % sur un émetteur unique non coté est-elle admissible au regard de nos
    règles de dispersion et du principe de la personne prudente ?** Question au commissaire aux comptes,
    à l''actuaire, et le cas échéant à l''ACPR — **avant** signature, pas après. Ma conviction est qu''elle
    ne l''est pas. Si je me trompe, je le dirai au conseil.


    Symétriquement, ce qui renverserait **ma** recommandation : une trajectoire de cotisation et un adossement
    qui se révéleraient tous deux inaccessibles, et une actualisation du prélèvement annuel très inférieure
    à 0,9 M€. Je fais publier l''échéancier de trésorerie détaillé avec la note, pour que ce chiffre soit
    contradictoire.


    ---


    ## 9. Sur la procédure de jeudi


    Cinq signatures ont été apposées avant la délibération. Je ne le prends pas comme une manœuvre : le
    trésorier a fait le travail que personne d''autre n''avait fait, et il est légitime que cela emporte
    l''adhésion. Mais une note engageant 78 % de la réserve sur sept ans mérite d''être contredite avant
    d''être ratifiée, pas après.


    Je demande donc **le report du point C** en attendant les deux réponses écrites du § 8, et un vote
    jeudi sur B amendée et sur le lancement des quatre chantiers, qui n''attendent rien.


    Si le conseil vote néanmoins C, je demanderai que soient portées au procès-verbal mon opposition motivée,
    la question de trésorerie du § 3.1 restée sans réponse, et la saisine préalable du commissaire aux
    comptes. Je le fais dans l''intérêt des affiliés, et aussi dans celui des administrateurs : engager
    78 % d''une réserve mutuelle sur un émetteur unique non coté, en présence d''un seuil de liquidation
    statutaire, expose personnellement ceux qui le votent.


    ---


    *Ce que je retiens en une phrase : la caisse ne meurt pas d''un rendement insuffisant, elle meurt
    d''un écart de 2,5 points entre ses cotisations et ses dépenses. C promet de payer cet écart avec
    du risque de ruine et de la trésorerie qu''elle ne libère pas. Il faudra le payer avec des cotisations,
    des recours amiante et un adossement — et il vaut mieux commencer maintenant, avec 18,4 M€ en main,
    que dans cinq ans avec 14.*

    '
