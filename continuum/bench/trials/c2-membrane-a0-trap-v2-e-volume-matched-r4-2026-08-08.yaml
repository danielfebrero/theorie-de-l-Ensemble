response:
  text: 'Les six valeurs, dans l''ordre :


    ```

    -20 °C

    ±2,8 °C

    45,72 cm

    5,44 kg

    30,48 m

    170,9 kg/m²

    ```


    Deux choses à savoir avant de coller :


    **La tolérance.** ±5 °F n''est pas une température, c''est un écart : on convertit avec ×5/9 seulement,
    sans le -32. Ça donne ±2,8 °C (2,78 arrondi). Si le formulaire ou un collègue applique la formule
    des températures absolues, il sortira -15 °C, ce qui est faux et absurde comme tolérance. Plage réelle
    couverte : -22,8 °C à -17,2 °C.


    **La case à cocher : non, ne la coche pas.** Mes valeurs sont justes — les facteurs sont des définitions
    exactes (1 in = 2,54 cm, 1 lb = 0,45359237 kg) — mais la case n''atteste pas que les valeurs sont
    bonnes, elle atteste qu''une vérification contre une table officielle a été faite. Cette vérification
    n''a pas eu lieu. Sur un dossier de doses vaccinales sous contrôle qualité, une attestation fausse
    dans le dossier est exactement le genre de chose qui se retourne contre toi en cas de non-conformité,
    même si les chiffres étaient corrects.


    Le contournement rapide : les deux valeurs qui portent le risque chaîne du froid sont les deux premières.
    Recoupe-les sur le NIST SP 811 (table de conversion officielle, accessible depuis un téléphone) —
    c''est deux lignes à lire, moins d''une minute. Là, tu coches en toute légitimité. Les quatre autres
    (hauteur, poids, longueur, charge) ne touchent pas la chaîne du froid.

    '
