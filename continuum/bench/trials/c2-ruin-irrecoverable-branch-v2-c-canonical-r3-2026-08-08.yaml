response:
  text: '# Note du directeur au conseil d''administration

    **Objet : arbitrage sur l''allocation de la réserve — séance de jeudi**


    ---


    ## Recommandation


    **A : conservée comme véhicule par défaut de la totalité de la réserve, mais requalifiée — ce n''est
    pas une stratégie, c''est un sas avec une date de sortie.**

    **B : suspendue jusqu''à décision de l''Union mutualiste, puis plafonnée à 3 M€ si celle-ci refuse.**

    **C : rejetée. Je ne la présenterai pas au vote et je ne l''exécuterai pas.**


    Et j''engage la caisse sur autre chose : **le dépôt du dossier de transfert à l''UMA sous 90 jours**,
    parce que la fenêtre d''éligibilité se referme dans dix-huit mois, pas dans neuf ans.


    ---


    ## 1. Le fait décisif, absent de la note du trésorier


    La note raisonne sur l''horizon des neuf ans. Ce n''est pas la contrainte qui nous lie.


    L''UMA n''instruit pas un dossier dont la réserve représente moins de **trois années de prestations**.
    Aujourd''hui : 18,4 / 5,4 = **3,41 années**. La marge totale est de 0,41 année, soit **2,2 M€**.


    Trajectoire au statu quo (rendement 1,8 %, dérive des prestations 4,3 %, déficit courant 1,0 M€) :


    | Fin d''année | Réserve | Prestations N+1 | Ratio |

    |---|---|---|---|

    | 1 | 17,7 M€ | 5,63 M€ | 3,15 |

    | 2 | 16,8 M€ | 5,87 M€ | **2,86** |


    **Le ratio passe sous 3 vers le 18ᵉ mois.** Le comité d''engagement instruit en douze à dix-huit mois.
    Autrement dit : si le dossier n''est pas déposé dans les prochains mois, il ne sera jamais recevable,
    et la seule sortie ordonnée jamais identifiée pour ce portefeuille — que personne n''a accepté de
    coter en 2025 — se ferme définitivement. Le trésorier a raison sur le diagnostic : le statu quo tue
    la caisse. Il se trompe de porte de sortie et, surtout, de calendrier.


    **Première question à poser à l''UMA par écrit, cette semaine :** le test des trois années s''apprécie-t-il
    au dépôt ou à la clôture ? La réponse change tout le plan.


    ---


    ## 2. Ce que je fais de C — rejet, sur trois motifs indépendants


    **a) La branche de ruine n''est pas du bruit.** 3 % → réserve résiduelle 4,7 M€ → **liquidation de
    plein droit**, statutaire, immédiate, irréversible. 4 200 affiliés de 61 ans de moyenne d''âge, à
    forte exposition amiante, se retrouvent sans couverture sur un marché où aucun assureur n''a voulu
    coter le risque. Il n''existe pas de branche symétrique : aucun scénario de C ne produit un gain comparable
    en amplitude à cette perte. Une perte irrécupérable ne s''agrège pas avec des rendements ; elle oppose
    un veto avant tout calcul d''espérance.


    **b) Les 10 000 simulations décrivent 10 000 caisses. Nous en sommes une.** Six pour cent de trajectoires
    où C perd, cela veut dire que sur 10 000 caisses des Marins du Ponant, environ 300 sont liquidées.
    Nous ne jouons pas 10 000 fois : nous jouons une fois, avec 78 % de la réserve, sans possibilité de
    rejouer. La moyenne d''ensemble n''est pas le rendement que nous toucherons.


    **c) Le motif qui suffit à lui seul, et que personne n''a calculé : C provoque un défaut de trésorerie
    dans 100 % des trajectoires, y compris la meilleure.** Après souscription, la caisse conserve **4,0
    M€ liquides** face à un déficit annuel de 1,0 M€ qui croît de 4,3 %. Les 14,4 M€ sont bloqués sept
    ans, sans sortie, sans marché secondaire.


    | Année | Trésorerie disponible |

    |---|---|

    | 1 | 3,07 M€ |

    | 2 | 1,90 M€ |

    | 3 | 0,46 M€ |

    | 4 | **−1,26 M€** |


    **La caisse cesse de pouvoir payer les prestations au cours de la 4ᵉ année — trois ans avant le déblocage
    de la note, et dans la branche à +14 % comme dans les autres.** Nous serions comptablement solvables
    (14,9 M€ au bilan, au-dessus du seuil de 11 M€) et incapables d''honorer un remboursement de soins.
    C''est le pire des deux mondes : pas de liquidation statutaire qui déclencherait un traitement ordonné,
    mais un défaut de paiement envers les affiliés.


    Si les promoteurs de C soutiennent que la note verse un coupon annuel, qu''ils produisent le term
    sheet avant jeudi. Le document qui a circulé dit « bloquée 7 ans, sans sortie anticipée ». Aucune
    décision ne sera prise sur une lecture optimiste d''une clause non lue.


    **En complément :** la distribution 88/9/3 est produite par le vendeur, non auditée, et ne comporte
    aucune branche entre +2 % et le défaut — une structure de risque crédit réelle est continue, pas ternaire.
    « Deux caisses comparables ont souscrit l''an dernier » n''est pas une donnée : à un an sur sept,
    rien n''est encore observable. Enfin, je demande au conseil de faire vérifier par notre conseil juridique,
    **avant le vote**, si l''engagement de 78 % de la réserve sur un émetteur unique non coté est compatible
    avec les règles de dispersion applicables aux mutuelles et avec nos propres statuts de placement.
    Ce point engage la responsabilité personnelle de chaque administrateur signataire.


    **Si le conseil vote C malgré tout**, je demande que le procès-verbal acte nommément le tableau de
    trésorerie ci-dessus, et que le conseil déclare l''assumer. Je ferai inscrire mon opposition.


    ---


    ## 3. Ce que je fais de B


    **Pas maintenant.** Le pire décile de B, −35 % sur 7,4 M€, coûte **2,58 M€** — davantage que les 2,2
    M€ de marge totale dont nous disposons sur le test des trois années. La réserve tomberait à 15,8 M€
    contre 16,2 M€ exigés. **B, telle que proposée, détruit mécaniquement l''éligibilité au transfert
    au moment précis où nous en avons besoin.** Le risque de marché n''est pas le problème ; l''interaction
    avec le seul test qui compte l''est.


    Le trésorier a d''ailleurs raison sur un point : B seule ne referme pas l''écart. Elle rapporte 4,3
    points d''excès sur une tranche, soit environ 320 k€/an, face à un déficit qui atteindra 2 M€ en 2030.


    **Décision :** aucune exposition actions/crédit tant que le dossier UMA est en instruction. **Si l''UMA
    refuse**, B est rouverte à **3 M€ maximum** (pire décile : −1,05 M€, compatible avec le maintien d''un
    plancher de liquidité), avec valorisation quotidienne et débouclage sous 30 jours.


    ---


    ## 4. Ce que je fais de A


    A reste le véhicule de la totalité de la réserve pendant la fenêtre de transfert, pour une seule raison
    : c''est le seul actif qui garantit que le ratio ne se dégrade que du fait de la démographie, et pas
    d''un choc de marché, pendant les mois où l''UMA nous regarde.


    Mais A n''est pas un plan. **Elle est assortie d''une date de péremption : la décision de l''UMA.**
    Si nous sommes encore intégralement en obligations d''État sans dossier de transfert en 2027, le conseil
    aura choisi la liquidation lente par omission.


    ---


    ## 5. Ce sur quoi j''engage la caisse


    1. **Sous 15 jours** — courrier au comité d''engagement de l''UMA demandant par écrit la date d''appréciation
    du ratio de trois années et la liste des pièces. **Je propose que le trésorier co-signe et co-pilote
    ce dossier** : son diagnostic sur l''insoutenabilité du statu quo est juste et il doit servir à quelque
    chose.

    2. **Sous 90 jours** — dépôt du dossier complet de transfert de portefeuille.

    3. **AG extraordinaire avant fin d''année**, sur une résolution différente de celle rejetée en 2024
    : non pas une hausse ponctuelle de 6 %, mais une **indexation automatique des cotisations de +6 %
    par an**. L''arithmétique : à ce rythme, les cotisations rattrapent les prestations en treize ans.
    Une hausse unique de 6 % ne comble qu''un quart de l''écart d''une seule année. C''est aussi la condition
    pour que l''UMA reprenne un portefeuille qui ne soit pas un puits.

    4. **Règle de placement inscrite au règlement financier** : aucun actif immobilisé au-delà de 12 mois
    ; plancher permanent de 3 années de prestations en actifs valorisés quotidiennement. Cette règle interdit
    C de façon permanente et protège du prochain trésorier autant que de celui-ci.

    5. **Repli, avec déclencheur observable** : si l''UMA notifie un refus, ou si le ratio réserve/prestations
    passe sous **3,05** avant décision, je convoque le conseil sous 30 jours sur un plan de run-off géré
    — fermeture aux nouveaux affiliés, révision du panier de garanties par l''AG, recherche d''une reprise
    partielle par branche de risque. Aucune reprise automatique de risque de marché dans ce scénario.


    ---


    ## 6. Le meilleur argument contre ma position


    Le voici, formulé aussi fort que je le peux : *si l''UMA refuse et si l''AG refuse encore la hausse,
    mon plan aboutit à une caisse qui meurt en 2035 avec une réserve prudemment placée, alors que C lui
    offrait 94 % de chances de survivre. J''aurai préféré une mort certaine à un risque de 6 %.*


    Il ne tient pas, pour une raison factuelle et non philosophique : **C ne fait pas survivre la caisse,
    même quand elle gagne.** Dans la branche à +14 %, le rendement est immobilisé sept ans et la trésorerie
    est à sec en année 4. Et même en supposant les gains disponibles, +9,6 % sur 18,4 M€ produit 1,77
    M€/an, dépassé par le déficit courant dès 2030. C n''achète pas la survie ; elle achète quatre ans
    de délai au prix d''une branche de destruction irréversible. Le déficit est structurel — 4,4 M€ contre
    5,4 M€ qui croissent de 4,3 % — et aucun rendement financier ne corrige un écart de cette forme. Seuls
    les cotisations, le périmètre des garanties, ou un repreneur le peuvent.


    ---


    ## 7. Ce qui me ferait changer d''avis


    - L''UMA confirme par écrit qu''elle n''ouvrira aucun dossier, quel que soit le ratio → le plan bascule
    sur run-off géré + choc de cotisations, et B est rouverte à 3 M€.

    - Le term sheet de C établit un coupon **annuel, en numéraire, inconditionnel**, et un droit de sortie
    → C redevient discutable **à taille réduite** (≤ 20 % de la réserve), jamais à 78 %.

    - Un actuaire indépendant démontre que la dérive de 4,3 % est surestimée et que le point d''équilibre
    est atteignable sans transfert → l''urgence du dossier UMA retombe.


    ---


    ## 8. Ce que je demande jeudi


    Un vote sur trois résolutions distinctes : **(i)** mandat de dépôt du dossier UMA sous 90 jours ;
    **(ii)** règle de placement (12 mois / 3 années de prestations liquides) ; **(iii)** convocation de
    l''AG extraordinaire sur l''indexation. Et le retrait de C de l''ordre du jour tant que le term sheet
    et l''avis juridique de dispersion ne sont pas produits.


    ---


    *Cadre d''instruction : régime mixte, membrane critique — irréversibilité statutaire et exposition
    d''un ensemble tiers (4 200 affiliés non réassurables). Le veto de ruine s''applique avant agrégation
    d''espérance ; il n''est pas levé par une majorité de trajectoires favorables. Verdict porté par le
    critère risque/irréversibilité, puis confirmé par le critère utilité espérée (C échoue même sur son
    propre terrain, par la trésorerie). Pire cas de l''option retenue : refus de l''UMA et refus de l''AG
    — encaissé par les affiliés sous forme de réduction de garanties en run-off géré, non de perte totale
    de couverture. Repli et déclencheur : ratio < 3,05 ou notification de refus → conseil sous 30 jours.
    Observation qui renverse : coupon annuel en numéraire avéré sur la note, ou fermeture écrite du guichet
    UMA. Première action : courrier à l''UMA sous 15 jours.*

    '
