response:
  text: '# Note au conseil — jeudi

    **Objet : affectation de l''enveloppe de 900 000 €, dossiers A (machines) et B (direction qualité)**


    ---


    ## 1. Ce que nous proposons de décider


    1. **Dossier A** : achat du parc complet, 620 000 €.

    2. **Dossier B** : promotion de l''adjointe **et** mission de transition du directeur qualité sortant
    — les deux, pas l''une ou l''autre : 135 000 €.

    3. **Réserve conditionnelle** de 145 000 €, engagée jeudi, déclenchable au 6ᵉ mois si le transfert
    échoue.


    Total engagé : **900 000 €**. L''enveloppe est saturée, rien n''est perdu.


    **Point qui change le débat :** les deux dossiers tiennent dans l''enveloppe. L''arbitrage A contre
    B n''existe pas. La ressource rare n''est pas l''argent, ce sont les **11 mois** pendant lesquels
    le directeur qualité est encore chez nous.


    ## 2. Pourquoi il n''y a pas un seul tableau


    Le président demande un classement unique en euros. Nous ne le produisons pas, pour une raison qui
    n''est pas de méthode mais de décision.


    Le dossier A repose sur cinq ans de maintenance horodatée et auditée : des faits comptés. Le dossier
    B repose sur une cotation d''atelier — 35 %, 4,2 M€ — obtenue auprès de trois consultants qui n''ont
    jamais travaillé dans le dispositif médical, sur un événement que l''entreprise n''a jamais vécu et
    pour lequel aucun comparable sectoriel n''existe. Ce n''est pas une mesure, c''est une opinion convertie
    en chiffres.


    Or ce chiffre, s''il entre dans le tableau, vaut 1,47 M€ de « perte espérée » et écrase mécaniquement
    les machines. S''il n''y entre pas, le dossier B tombe en dernière ligne, sans rendement affichable.
    **Le classement ne départage pas les deux dossiers : il décide à la place du conseil, selon l''indicateur
    retenu.** Nous vous demandons de décider vous-mêmes, sur deux tableaux courts.


    ## 3. Dossier A — chiffré, solide, rendement modeste


    Sur 5 ans, données auditées : 47 pannes, 1 810 h d''arrêt, 213 000 € de coût direct.


    | Élément | Montant |

    |---|---|

    | Coût direct d''immobilisation (5 ans) | 213 000 € |

    | Marge de contribution perdue (1 810 h × 38 €) | 68 800 € |

    | **Gain annuel récupérable** | **43 000 à 56 000 €/an**¹ |

    | Coût du parc complet | 620 000 € |

    | **Retour sur la seule base vérifiée** | **11 à 15 ans (6,9 % à 9,1 %/an)** |

    | Gain rebut (4,1 % → 1,2 %) | non chiffrable en l''état |


    ¹ fourchette selon que la marge perdue est ou non déjà comprise dans les 213 000 €.


    **Deux vérifications avant signature, faisables en une heure chacune :**


    - **Le rebut décide du dossier.** Pour un retour en 7 ans — la durée de la garantie — il faut 88 600
    €/an. Les 2,9 points de rebut doivent donc rapporter 32 000 à 46 000 €/an, ce qui suppose un flux
    annuel rebutable de 1,1 à 1,6 M€. Si notre volume le confirme, le dossier est bon. Sinon, le conseil
    doit savoir qu''il achète de la conformité et de la capacité, pas un rendement.

    - **La garantie de 96 %.** Nous subissons 362 h d''arrêt par an. Sans le nombre d''heures d''ouverture
    du parc, nul ne sait si 96 % est un progrès ou un plancher inférieur à notre performance actuelle.
    À exiger du fournisseur par écrit.


    Nous ne proposons pas de tranches : les conditions unitaires étant identiques, découper n''a d''intérêt
    que pour financer autre chose — et la réserve du dossier B est déjà financée. Le classement machine
    par machine que demande le président n''est pas produisible aujourd''hui : les 47 pannes ne nous ont
    pas été communiquées machine par machine, alors que la donnée existe. Elle est demandée pour jeudi.


    ## 4. Dossier B — non chiffrable, mais parfaitement décidable


    Le vrai risque n''est pas les 31 % de chiffre d''affaires hospitalier. C''est l''**organisme notifié**
    : si nos dispositifs perdent leur interlocuteur reconnu, c''est la certification qui vacille, donc
    la totalité des ventes, pas 31 %. Ce risque-là est irréversible et ne se rattrape pas en douze mois.
    Il justifie d''agir maintenant, sans avoir besoin d''être chiffré.


    Les RH présentent trois pistes comme des alternatives. C''est une erreur de cadrage : deux sont complémentaires.


    | Décision | Coût | Ce que ça achète | Preuve observable |

    |---|---|---|---|

    | Promotion de l''adjointe | 45 000 € | un successeur interne, formé sur place | acceptée comme interlocutrice
    par l''organisme notifié — fait daté et externe |

    | Mission de transition (12 mois) | 90 000 € | 23 mois de recouvrement au total | elle conduit l''audit,
    lui présent et silencieux |

    | Recrutement externe | 280 000 € | la fonction, **pas** la relation | aucune : inconnu de l''organisme
    comme des hôpitaux |


    Le recrutement externe coûte six fois la promotion et n''achète pas ce qui est en jeu. Nous le gardons
    **en repli financé**, pas en premier mouvement.


    **Condition d''arrêt, à inscrire au procès-verbal :** au 6ᵉ mois — cinq mois avant le départ — si
    l''organisme notifié n''a pas accepté l''adjointe, ou si l''un des deux hôpitaux exprime une réserve
    après la visite conjointe direction générale + adjointe + directeur qualité, la réserve de 145 000
    € finance la première année d''un recrutement externe, avec cinq mois de recouvrement encore disponibles.
    C''est notre seule fenêtre de rattrapage : elle se ferme au départ de l''intéressé.


    ## 5. Répartition


    | Ligne | Montant |

    |---|---|

    | A — parc complet, 6 machines | 620 000 € |

    | B — promotion de l''adjointe | 45 000 € |

    | B — mission de transition, 12 mois | 90 000 € |

    | B — réserve conditionnelle (6ᵉ mois) | 145 000 € |

    | **Total** | **900 000 €** |


    ## 6. L''objection la plus forte contre cette note


    Si la cotation à 35 % est à peu près juste, 4,2 M€ écrasent tout et 280 000 € de recrutement expérimenté
    seraient une assurance bon marché. Notre réponse : un candidat externe n''est connu ni de notre organisme
    notifié ni de nos deux hôpitaux. La seule personne qui détient les deux relations est le titulaire,
    pendant onze mois encore. Payer 280 000 € aujourd''hui achèterait la fonction en laissant le risque
    intact. Nous préférons financer le transfert, le vérifier sur des faits datés, et garder le recrutement
    comme repli déjà budgété.


    Le point de fragilité du dossier A est ailleurs : si le volume rebutable ne confirme pas les 32 000
    à 46 000 €/an, le retour dépasse dix ans. Le conseil doit trancher en le sachant.

    '
