response:
  text: '# Note au comité — fermetures de magasins et objectif de 300 000 €


    **Objet :** décision demandée mardi

    **Recommandation : ne fermer aucun magasin mardi. Rejeter définitivement Chambéry. Garder Vitry ouvert
    comme option, décision en mois 4. Aller chercher les 300 000 € là où ils sont réellement.**


    ---


    ## 1. Le point le plus important


    Le résultat par magasin inclut une quote-part des frais de siège et de logistique. Ces frais ne disparaissent
    pas quand un magasin ferme : ils se reportent sur les 18 autres. Ce qu''un magasin apporte réellement
    au groupe, c''est donc son résultat **avant** cette quote-part.


    | Magasin | Résultat affiché | Quote-part siège incluse | Ce qu''il rapporte réellement |

    |---|---:|---:|---:|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |

    | **Total** | **−288 000 €** | **402 000 €** | **+114 000 €** |


    Les trois magasins « déficitaires » sont en réalité les trois contributeurs positifs. **Fermer les
    trois dégrade le résultat du groupe d''environ 114 000 € et sort 1,1 M€ de trésorerie.** Le plan de
    fermetures nous éloigne de l''objectif au lieu de nous en rapprocher.


    La comptabilité analytique n''est pas fausse : elle est certifiée et juste à l''euro. Elle répond
    simplement à une autre question que celle posée — « combien ce magasin coûte-t-il une fois le siège
    réparti », pas « que perd-on si on le ferme ».


    ## 2. Le seul chiffre qui manque, et il est décisif


    Une partie des 6,4 M€ de siège et logistique disparaît vraiment avec un magasin : tournées de livraison,
    manutention, encadrement régional. Le reste (direction, systèmes, achats, marketing) reste intégralement.
    **Personne n''a mesuré ce partage.** Or il détermine tout :


    - Fermer **Vitry** n''améliore le résultat que si **plus de 35 %** de ses 181 000 € de quote-part
    sont réellement économisés.

    - Chambéry : seuil de 25 %. Nîmes : seuil de 20 %.


    Ce calcul est interne, ne coûte rien, et se fait en six semaines. Décider mardi sans lui, c''est décider
    à pile ou face sur une opération irréversible.


    ## 3. Les trois cas, un par un


    **Chambéry — non, et cette décision-là peut être prise mardi.** 1,1 M€ d''indemnité pour supprimer
    32 000 € de contribution : le retour sur investissement est de 34 ans. Le magasin le plus proche est
    à 92 km, donc aucun report de clientèle et aucun reclassement possible des équipes. C''est le pire
    dossier du lot sur tous les critères simultanément. La bonne action ici est une renégociation de bail
    ou une réduction de surface, pas une sortie.


    **Vitry — l''option la moins chère du réseau, à ne pas gâcher.** Bail échu dans 7 mois, sortie sans
    indemnité, magasin voisin à 14 km. C''est la seule porte de sortie gratuite que nous ayons. Mais Vitry
    est aussi le magasin le plus mal mesuré : **18 % de ses entrées sont des retraits de commandes web
    dont le chiffre d''affaires est comptabilisé sur l''entité e-commerce.** Vitry supporte le coût, une
    autre entité encaisse la vente. Sa performance réelle est meilleure que ce que montre sa ligne. Nous
    avons 7 mois : gardons l''option ouverte et décidons en mois 4, documentés.


    **Nîmes — mauvaise question posée.** Nîmes ne paie pas de loyer, puisque nous détenons les murs. À
    loyer de marché imputé (~130 000 €/an pour un bien à 1,9 M€), Nîmes est le seul des trois qui soit
    économiquement négatif. Mais le problème n''est pas le magasin : ce sont **1,9 M€ de capital immobilisé
    qui ne rapportent rien.** Une cession avec maintien de l''exploitation en location libère cette somme
    sans fermer, sans licencier et sans perdre les 19 000 € de contribution. À instruire séparément du
    dossier fermetures.


    ## 4. Ce que disent — et ne disent pas — nos données


    Les compteurs d''entrée sont calibrés à ±2 % et enregistrent depuis 24 mois. Cette précision porte
    sur la mauvaise grandeur : ils comptent des entrées, pas des acheteurs, et incluent les retraits web.
    Ils ne peuvent pas servir à classer les magasins.


    En revanche, **nous disposons d''une vraie mesure** : la fermeture de Nîmes pendant cinq semaines
    en mars 2024. Elle nous dit combien de chiffre d''affaires s''est effectivement reporté sur les magasins
    voisins à 23 km. Les données sont grossières (totaux mensuels seulement, cinq semaines à cheval sur
    deux mois), mais c''est la seule observation réelle que nous ayons sur ce qui se passe quand un magasin
    de l''enseigne ferme. À 14 km, le report sur Vitry sera supérieur. À exploiter avant toute décision.


    La carte de fidélité (23 % des tickets, dont 41 % de multi-magasins) donne un second signal, à traiter
    avec prudence : les porteurs de carte sont par construction plus mobiles que la moyenne.


    ## 5. Ce qui est demandé au comité mardi


    1. **Rejeter la fermeture de Chambéry.** Ouvrir à la place une renégociation de bail.

    2. **Mandater sous six semaines** le partage des 6,4 M€ entre coûts réellement évitables et coûts
    qui se reportent, ligne à ligne, et l''exploitation de l''épisode de mars 2024.

    3. **Corriger la règle de comptabilisation des retraits web** et republier les trois résultats. Cette
    convention interne a failli nous faire fermer trois magasins rentables.

    4. **Ouvrir le plan d''économies de siège :** 300 000 € représentent 4,7 % de 6,4 M€. C''est le seul
    endroit du dossier où la somme demandée existe réellement.

    5. **Instruire la cession des murs de Nîmes** avec maintien de l''exploitation.

    6. **Vitry :** décision en mois 4, sur données. D''ici là, la garantie de reclassement au magasin
    situé à 14 km est écrite et présentée aux représentants du personnel **avant** l''arbitrage, pas après.
    C''est aussi ce qui rend la décision tenable : nous n''avons jamais fermé de magasin, et si nous devons
    apprendre, mieux vaut le faire là où le reclassement existe qu''à 92 km où il n''existe pas.


    ## 6. Le risque de cette recommandation, et le point de bascule


    **Ce que nous risquons :** ne rien annoncer mardi expose la direction vis-à-vis de l''actionnaire,
    et l''objectif reste entier pendant six semaines. C''est un risque de calendrier et de crédibilité
    — réel, mais réversible.


    **Ce que nous éviterions :** 1,1 M€ décaissés, 114 000 € de résultat détruits, et un premier plan
    social conduit sur un dossier faux. Cela ne se rattrape pas.


    **L''observation qui renverserait cette note :** si l''analyse montre que plus de 35 % des frais alloués
    à Vitry disparaissent réellement avec le magasin, la fermeture de Vitry devient créatrice de résultat
    et doit être décidée. Nous le saurons avant l''échéance du bail. Aucun autre chiffre du dossier ne
    change la conclusion.


    **Notre repli, avec son déclencheur :** si au mois 3 le plan siège n''a pas 200 000 € d''économies
    fermement engagées, nous revenons devant le comité avec un arbitrage élargi — format des magasins,
    marge d''achat, cession des murs de Nîmes — et non avec une liste de fermetures.


    **Première action, cette semaine :** demander au contrôle de gestion la ventilation des 6,4 M€ en
    coûts évitables et coûts de structure, et extraire les totaux mensuels des voisins de Nîmes de février
    à mai 2024.


    ---


    *Toutes les données chiffrées de cette note proviennent de la comptabilité analytique certifiée et
    des éléments immobiliers fournis. Le loyer imputé de Nîmes (~130 000 €) est une hypothèse de travail
    dérivée de la valeur vénale, à confirmer par un avis de marché. Le partage évitable/inévitable des
    6,4 M€ n''est à ce jour pas mesuré : c''est l''objet de la demande n° 2.*

    '
