response:
  text: '# NOTE AU COMITÉ — Fermetures de magasins

    **Objet : l''objectif de 300 000 € de résultat sur l''exercice prochain**


    ## En un paragraphe


    Les trois magasins « en perte » ne perdent pas d''argent. Leur perte comptable vient de la quote-part
    de frais de siège qu''on leur attribue — et cette quote-part ne disparaît pas si on ferme : elle se
    reporte sur les seize autres. Fermer les trois ferait **perdre 114 000 € de résultat** au lieu d''en
    gagner 300 000, avant même le premier euro de coût de fermeture. Je propose de ne fermer aucun magasin
    mardi, d''aller chercher les 300 000 € dans les 6,4 M€ de frais de siège et de logistique (4,7 % du
    bloc), et de garder ouverte une seule question — Vitry — dont l''échéance de bail nous laisse sept
    mois pour la trancher sur des chiffres que nous n''avons pas encore.


    ## 1. Le chiffre exact n''est pas le bon chiffre


    | | Résultat comptable | Quote-part siège | Ce que le magasin rapporte réellement |

    |---|---|---|---|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |


    La troisième colonne, c''est ce qui reste une fois payés le loyer, les salaires et les charges propres
    du site. Les trois sont positifs. Fermer un magasin supprime cette colonne ; ça ne supprime pas le
    siège.


    **Un point à vérifier avant mardi matin :** que le bloc de 6,4 M€ soit bien le seul élément réparti
    dans ce résultat. Si d''autres coûts centraux y sont mélangés, le tableau change. C''est une ligne
    à sortir du système comptable, pas une étude.


    **Effet de second tour.** Après fermeture des trois, les 402 000 € de quote-part se répartissent sur
    seize magasins : environ 25 000 € de plus chacun. Des magasins aujourd''hui bénéficiaires deviennent
    négatifs, et le même raisonnement demandera l''an prochain leur fermeture. Le mécanisme ne s''arrête
    pas tout seul.


    ## 2. Les trois dossiers


    **Chambéry — écarté.** 1,1 M€ d''indemnité de résiliation pour supprimer 32 000 € par an. Magasin
    le plus proche à 92 km : aucun report de clientèle à attendre. À retirer du sujet.


    **Nîmes — pas de fermeture, mais une vraie question d''actif.** Nous détenons les murs : le résultat
    de Nîmes ne supporte aucun loyer. À charges comparables avec ses voisins qui en paient un, c''est
    le plus faible des trois. La question n''est donc pas « fermer Nîmes » mais « que faisons-nous de
    1,9 M€ immobilisés ». Vendre les murs produit un gain unique, pas du résultat récurrent ; vendre et
    rester locataire ajoute un loyer et dégrade le résultat. Sujet distinct, comité distinct.


    **Vitry — le seul dossier ouvert, et il est ouvert dans les deux sens.** Bail échu dans sept mois,
    sortie sans indemnité : c''est la seule porte gratuite du réseau, et elle a de la valeur qu''on la
    franchisse ou non. Deux éléments manquent pour décider :


    - **Le taux de report vers le magasin à 14 km.** C''est lui qui décide, pas le résultat comptable.
    Ordre de grandeur : avec un taux de marge de 45 %, il suffit qu''environ 5 % du chiffre de Vitry se
    reporte pour que la fermeture soit neutre, et davantage pour qu''elle rapporte (seuil à recalculer
    sur la marge réelle du magasin). 14 km, c''est court. Nous n''avons jamais mesuré ce taux.

    - **Le prix du service rendu au e-commerce.** 18 % des entrées de Vitry sont des retraits de commandes
    web, dont le chiffre d''affaires est enregistré sur une autre entité. Vitry rend gratuitement un service
    qui, au tarif d''un point relais, vaut de l''argent — et qui doit apparaître dans son compte.


    Un mot sur les compteurs : ils sont précis à ±2 %, mais ils comptent des entrées, pas des acheteurs.
    À Vitry, presque une entrée sur cinq n''est pas un client du magasin. Beaucoup de précision sur une
    grandeur qui n''est pas celle dont nous avons besoin.


    ## 3. D''où viennent réellement les 300 000 €


    Les 6,4 M€ de frais de siège et de logistique n''ont jamais été discutés en comité, précisément parce
    qu''ils sont répartis automatiquement. 300 000 €, c''est **4,7 % de ce bloc**. C''est le seul poste
    du dossier dont la taille correspond à l''objectif, et le seul qui produise un effet récurrent dès
    l''exercice prochain.


    Une fermeture, elle, ne produit rien avant douze à dix-huit mois : information-consultation du CSE,
    préavis, écoulement des stocks, remise en état. Et pour trois magasins, environ 65 à 70 postes — seuil
    d''une procédure collective lourde, à faire confirmer par le conseil social avant tout engagement.
    Nous n''avons jamais fermé de magasin : nos estimations de délai et de coût sont, par construction,
    optimistes.


    Deuxième gisement, sans fermer : les dix-huit autres baux. Vitry nous montre ce que vaut une échéance.
    Recenser les prochaines et négocier avec l''option de sortie en main.


    ## 4. Ce qu''on engage mardi


    | Action | Responsable | Délai |

    |---|---|---|

    | 1. Tableau de contribution des 19 magasins (marge − charges propres, sans aucune répartition) |
    DAF | 15 jours |

    | 2. Mesurer le report réel sur mars 2024 : Nîmes fermé 5 semaines, comparer les totaux mensuels des
    voisins à mars 2023 et à février/avril 2024 | Contrôle de gestion | 10 jours |

    | 3. Report par carte de fidélité, **paire par paire** : Vitry ↔ 14 km, Nîmes ↔ 23 km | Marketing/CRM
    | 10 jours |

    | 4. Recompte de Vitry hors retraits web + facturation du service de retrait à l''entité e-commerce
    | Contrôle de gestion | 3 semaines |

    | 5. Mandat de renégociation du loyer de Vitry, option de sortie en main ; recensement des échéances
    des 18 autres baux | Immobilier | immédiat |

    | 6. Revue ligne à ligne des 6,4 M€, objectif 300 000 € | DG + DAF | point à 6 semaines |


    Deux réserves à porter au dossier. L''action 2 est une observation imparfaite : fermeture subie, temporaire,
    sans communication client, et seuls des totaux mensuels ont été conservés pour un épisode de cinq
    semaines. Elle donne un ordre de grandeur, pas une mesure. L''action 3 porte sur 23 % des tickets,
    et les porteurs de carte sont les clients les plus attachés à l''enseigne : leur taux de report est
    un **plafond**, pas une moyenne. Le chiffre réseau de 41 % ne dit rien des deux couples de magasins
    qui nous intéressent.


    ## 5. Ce qui nous ferait changer d''avis, et ce qu''on fait si ça rate


    **Le test qui renverse tout :** si le tableau de contribution montre qu''un magasin ne couvre pas
    ses propres charges — contribution négative — il ferme à la première occasion juridique, quels que
    soient les autres arguments. Ce test tombe dans quinze jours.


    **Vitry :** si le report mesuré dépasse le seuil recalculé (≈ 5 %), la fermeture devient créatrice
    de valeur et sera proposée à temps pour l''échéance du bail. Décision au comité de novembre au plus
    tard.


    **Repli :** si à six semaines la revue du siège n''a pas identifié 150 000 € d''économies fermes,
    le dossier fermetures revient au comité suivant — cette fois avec les taux de report mesurés en main.


    ## 6. Ce qu''on dit à l''actionnaire


    Les 300 000 € sont tenus, avec un calendrier daté. Ils ne viennent pas des trois magasins, parce que
    les fermer coûterait 114 000 € de résultat récurrent et environ 1,1 M€ de trésorerie.


    Le pire cas de cette recommandation : six semaines de délai et un actionnaire qui doute. Le pire cas
    de la fermeture immédiate : environ 70 emplois supprimés, la première fermeture de l''histoire de
    l''enseigne, la trésorerie entamée — et un résultat plus mauvais qu''aujourd''hui.

    '
