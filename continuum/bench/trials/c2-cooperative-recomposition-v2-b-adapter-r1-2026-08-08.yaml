response:
  text: '## Note de position — répartition de la ressource, bassin de la Vèze


    ### 1. Ce que je propose


    Deux phases, parce que le bilan actuel contient un poste que personne n''a vérifié.


    **Phase 1 — du lundi au J+15 (répartition immédiate, 410 L/s)**


    | Usage | Attribution | Statut |

    |---|---|---|

    | Eau potable (régie de Ferney) | 150 L/s | Garantie sans interruption, sous condition d''audit sous
    7 jours |

    | Débit réservé aval | 180 L/s | Intangible — hors compétence de la commission |

    | Irrigation (620 ha) | 80 L/s | Quota, avec droit de transfert et de renonciation |


    **Phase 2 — à partir de J+16**, après audit de la régie et ré-étalonnage de la station : la dotation
    potable est ramenée au besoin justifié majoré de 20 %, et **l''intégralité du volume libéré bascule
    vers l''irrigation**.


    ### 2. Le principe de classement


    Je ne classe pas les usages par importance sociale, mais par **réversibilité de la perte** :


    - Une atteinte sanitaire sur 9 200 habitants et 110 lits d''EHPAD ne se rattrape pas.

    - L''effondrement documenté le 12 juin — deux frayères, population non reconstituable à l''échelle
    d''une décennie — ne se rattrape pas.

    - Une récolte perdue est une perte d''une année : 4,1 M€, 90 emplois, c''est brutal, mais c''est réparable,
    indemnisable, et cela se reproduit la saison suivante.


    C''est le seul critère qui ne dépend pas de qui est présent dans la salle au moment du vote.


    ### 3. Le poste que personne n''a examiné : les 150 L/s de la régie


    150 L/s pour 9 200 habitants, c''est **environ 1 400 litres par habitant et par jour**, soit près
    de dix fois la consommation domestique moyenne française. Le besoin domestique strict de Ferney, EHPAD
    compris, est de l''ordre de 16 à 20 L/s.


    Ce chiffre n''est pas nécessairement faux : il peut recouvrir d''autres communes, des industriels,
    un rendement de réseau très dégradé. Mais il n''est **pas expliqué**, et c''est aujourd''hui le poste
    le moins documenté du bilan — alors que c''est le seul qui, à lui seul, pourrait combler le déficit
    de 160 L/s.


    Je refuse de couper un maraîcher avant d''avoir posé cette question. Donc :


    - la régie conserve 150 L/s pendant 15 jours, sans discussion, sans à-coup — sa réserve de 4 jours
    interdit toute brutalité ;

    - elle produit sous 7 jours : population réellement desservie, catégories d''abonnés, rendement de
    réseau, ventilation des 150 L/s ;

    - à J+16, sa dotation est ramenée au besoin justifié + 20 % de marge. Le reste retourne au pot commun.


    Si l''audit confirme un besoin de l''ordre de 30 à 50 L/s, l''irrigation ne reçoit pas 80 L/s mais
    plus du double, et l''essentiel du conflit disparaît.


    ### 4. Les 80 L/s d''irrigation : comment je les répartis


    D''abord une reconnaissance due aux maraîchers : 240 L/s sur 620 ha, c''est 3,3 mm/jour. C''est **déjà
    en dessous** des besoins d''août pour du maraîchage. Leur demande n''est pas gonflée.


    Ensuite le problème réel. 80 L/s, c''est soit **1,1 mm/jour sur 620 ha**, soit **3,4 mm/jour sur 205
    ha**. La première option arrose tout le monde à un tiers de la dose et risque de ne rien sauver du
    tout — on aurait alors consommé 80 L/s de rivière pour rien. La seconde sauve environ un tiers de
    la récolte. Je ne sais pas quels 205 hectares : la commission n''a ni cultures, ni stades, ni compteurs.
    **Les maraîchers, eux, le savent.**


    Donc :


    - **Base uniforme** : 85 % du volume au prorata de la surface déclarée — 0,11 L/s/ha. C''est la seule
    règle applicable sans données, et elle ne favorise personne.

    - **Transfert autorisé** : une exploitation peut céder tout ou partie de son quota à une autre du
    périmètre, pour la saison, sur déclaration à la commission. Plafond : nul ne peut dépasser 150 % de
    sa base, pour que les six grandes exploitations ne rachètent pas les vingt-huit autres.

    - **Renonciation indemnisée** : qui renonce à son quota passe en tête du fonds départemental.

    - **Réserve documentée** : 15 % attribués sur dossier d''une page (culture, surface, stade, système
    d''irrigation), priorité aux cultures pérennes — un fraisier ou une asperge perdus, c''est plusieurs
    années, une salade c''est six semaines. L''information est le prix de l''eau supplémentaire.

    - **Compteurs obligatoires** sur les 34 exploitations, posés sous 21 jours, financés par le fonds.
    Sans compteur, aucun quota n''est contrôlable, et aucune perte n''est indemnisable.


    ### 5. La levée des restrictions : pourquoi 2022 ne se reproduira pas


    Le dispositif de 2022 a échoué parce qu''il confondait un pic de ruissellement avec une reconstitution
    de ressource, qu''il fonctionnait en tout-ou-rien, et qu''il lisait un débit instantané.


    Nouveau déclencheur — **deux conditions cumulatives** :

    1. moyenne glissante sur 10 jours du débit entrant > 450 L/s ;

    2. stock du barrage stable ou en hausse sur ces mêmes 10 jours.


    Puis levée **par paliers de 25 %** de l''écart au besoin plein, chaque palier exigeant 10 nouveaux
    jours de tenue. Retour complet : 40 jours minimum. Resserrement, lui, **immédiat** sur moyenne 3 jours.
    L''asymétrie est délibérée et je l''assume par écrit.


    Contrôle : l''orage du 9 août 2022 aurait porté la moyenne 10 jours à ~376 L/s. Rien ne se serait
    déclenché.


    ### 6. La mesure elle-même


    Toute cette note repose sur 410 L/s issus d''une station unique étalonnée en 2023. Une erreur de 10
    %, c''est 41 L/s — le quart du déficit. Si le débit réel est inférieur, nous violons le débit réservé
    sans le savoir.


    **Jaugeage indépendant lancé dès vendredi**, deux points de contrôle amont/aval, résultat sous 10
    jours. En attendant, 5 % de la part irrigation sont retenus en précaution et libérés dès confirmation.


    ### 7. Les 600 000 €


    | Poste | € |

    |---|---|

    | Compteurs + télérelève, 34 exploitations | 45 000 |

    | Jaugeage, ré-étalonnage, points de contrôle | 20 000 |

    | Audit, recherche de fuites, réparations d''urgence (régie) | 130 000 |

    | Sécurisation EHPAD (interconnexion / plan de secours) | 60 000 |

    | Soutien maraîchers (renonciations, petites exploitations, pérennes) | 320 000 |

    | Réserve de gestion | 25 000 |


    320 000 € contre 4,1 M€, c''est 8 %. **Ce n''est pas une indemnisation, c''est un pont.** L''indemnisation
    réelle passe par la reconnaissance de calamité agricole, l''assurance récolte et le dégrèvement de
    TFNB : je demande formellement la saisine du préfet jeudi. Ces dossiers exigent des pertes établies
    — ce que seuls les compteurs et les déclarations parcellaires permettront.


    ### 8. Ce que je dis à chaque partie


    **Aux maraîchers, qui ont quitté la salle.** Votre demande n''est pas excessive, et je l''écris. Mais
    je ne peux pas prendre les 160 L/s manquants sur la santé publique ni sur un arrêté préfectoral que
    la commission n''a pas le pouvoir de modifier. Vous recevez un tiers de votre demande, une règle publiée
    et proportionnelle plutôt qu''un arbitrage discrétionnaire, le droit de concentrer cette eau là où
    elle sauve quelque chose, et la saisine des dispositifs qui, eux, peuvent vraiment indemniser. Votre
    affirmation qu''en dessous de 240 L/s tout est perdu est peut-être exacte — elle n''est pas établie,
    et je ne peux pas fonder une décision publique sur une donnée que vous seuls détenez et ne produisez
    pas. Votre absence jeudi ne bloquera pas le vote ; elle vous privera seulement de la main sur la réserve
    de 15 %.


    **À la régie.** Votre dotation est garantie, immédiatement et sans condition sur la part sanitaire
    — 4 jours de réserve n''autorisent aucun jeu. Mais garantie ne veut pas dire jamais examinée. Vous
    demandez qu''on coupe 160 L/s à d''autres sans avoir expliqué les vôtres. Sept jours pour la ventilation,
    et le fonds finance vos fuites et la sécurisation de l''EHPAD. Un refus de produire ces chiffres serait,
    lui, difficile à défendre devant les 34 exploitations.


    **Sur le débit réservé.** Il n''est pas sur la table, ni juridiquement — c''est la police de l''eau,
    pas la CLE — ni au fond : c''est la seule perte du dossier qui se compte en décennies. Aucune des
    deux autres parties n''a produit d''argument qui la surpasse.


    **À la presse.** Ce n''est pas « les paysans contre les robinets ». La rivière est à 45 % de sa normale
    et le tiers manquant sera pris quelque part. Il est pris sur l''irrigation non parce qu''elle compte
    moins, mais parce que c''est la seule perte qui soit annuelle et monétaire plutôt que sanitaire ou
    décennale.


    ### 9. Seuils d''arrêt, fixés à l''avance


    - Moyenne 10 j < 360 L/s → irrigation ramenée à 30 L/s (survie des pérennes seules).

    - < 340 L/s → irrigation à zéro.

    - **< 330 L/s → potable et débit réservé entrent en conflit direct.** La commission n''est plus compétente
    : saisine préfectorale. Ma recommandation, écrite dès maintenant pour ne pas être improvisée dans
    l''urgence — priorité au potable, dérogation au débit réservé strictement limitée dans le temps, et
    activation simultanée de l''approvisionnement de secours pour l''écourter au maximum.

    - Menace sur l''alimentation de l''EHPAD → action immédiate, sans vote.


    ### 10. Ce que je ne sais pas


    Je ne connais ni les cultures, ni les stades, ni les prélèvements réels. Je n''ai pas vérifié les
    4,1 M€. Je n''ai pas vérifié les 410 L/s. Je n''ai pas vérifié les 150 L/s. Je décide quand même,
    parce que ne pas décider revient à laisser le partage se faire à la pompe, au bénéfice des plus gros
    équipements.


    Mais j''engage la commission sur une échéance : **au 30 septembre, registre de comptage complet, station
    ré-étalonnée, base parcellaire constituée.** Le prochain étiage ne sera pas arbitré à l''aveugle.

    '
