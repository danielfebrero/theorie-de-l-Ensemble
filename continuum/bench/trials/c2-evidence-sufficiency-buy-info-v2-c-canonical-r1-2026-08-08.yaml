response:
  text: '## Ce que j''ai vérifié avant d''écrire


    Trois choses changent le dossier : le point mort réel n''est pas là où le DAF le croit, les « trois
    éléments » sur Sinolux n''en font qu''un, et le test Vertex arrive après la fermeture de la seule
    porte irréversible.


    ---


    # NOTE AU COMITÉ DE DIRECTION


    **Objet :** Cellules 2027 — arbitrage Kelmar / Sinolux

    **De :** Direction des opérations — **Décision demandée :** cette semaine (échéance dure J+18)


    ## Décision proposée


    **Réserver la capacité Kelmar à J+18 pour le volume 2027. Ouvrir Sinolux par une tranche de qualification,
    jamais par le volume principal.** Les 230 400 € doivent être retirés du budget en l''état.


    ## 1. Les 230 400 € ne sont pas une économie, c''est un montant brut


    Le prix ne se compare qu''à coût complet. Un retour coûte 205 €, identiques chez les deux fournisseurs.


    - Kelmar, 1,3 % stable sur quatre ans → 936 retours → **191 880 €**

    - L''écart de prix (3,20 €/cellule) finance exactement **1 124 retours supplémentaires**, soit **+1,56
    point** de taux de retour.

    - La garantie de remplacement gratuit ne couvre que la cellule : **22,80 € sur 205 €, soit 11 %**.
    Le transport, le geste commercial et l''atelier restent chez nous. Elle déplace le point mort, elle
    ne le supprime pas.


    **Point mort : entre 2,86 % et 3,22 %** selon la façon dont on crédite la garantie.

    **Seule mesure indépendante disponible : 3,1 %.**


    | Taux Sinolux | Retours | Gain net complet vs Kelmar |

    |---|---|---|

    | 1,1 % (essai vendeur) | 792 | **+278 k€** |

    | 2,0 % | 1 440 | +160 k€ |

    | 3,1 % (audit mars) | 2 232 | **+16 k€ … −11 k€** selon lecture |

    | 3,4 % | 2 448 | −24 k€ |

    | 4,0 % | 2 880 | −102 k€ |


    Au seul taux jamais mesuré par un tiers, l''économie est intégralement consommée par les retours.
    **Ce n''est pas un arbitrage à 230 400 €, c''est un arbitrage à zéro** — assorti de 1 296 chargeurs
    supplémentaires revenus chez des clients.


    ## 2. Nous n''avons pas trois sources, nous en avons une


    - **Sinolux, 1,1 %** — essai interne du vendeur, méthode non communiquée, partie intéressée.

    - **Audit sectoriel mars, 3,1 %** — mesure indépendante, ligne comparable, même fournisseur.

    - **Ferro, « environ 3 % »** — sa note méthodologique indique qu''il travaille **sur l''échantillon
    de mars**. Ce n''est pas une confirmation indépendante, c''est la même mesure relue.


    Une mesure indépendante. Elle est à 3,1 %, c''est-à-dire au point mort.


    ## 3. Le refus de la clause indexée est l''information la plus fiable du dossier


    Sinolux garantit gratuitement les 22,80 € et refuse de s''engager sur les 205 €. Un fournisseur convaincu
    d''être à 1,1 % vend l''indexation pour presque rien : à ce taux elle ne lui coûte jamais. Ce refus
    est un prix affiché sur sa propre croyance, et il ne dit pas 1,1 %.


    ## 4. Le test Vertex ne peut pas servir cette décision


    34 000 €, résultat à **J+63**. La ligne Kelmar est vendue à J+18, le prix Sinolux expire à J+21, la
    production démarre à J+70 sans report. Le résultat arriverait **six semaines après la fermeture de
    la dernière porte**. Par ailleurs ±0,3 point sur 3,1 % donne 2,8–3,4 % : l''intervalle **chevauche
    le point mort**. Nous paierions 34 000 € pour une réponse tardive et non concluante. **Refusé pour
    2027** — à faire financer par Sinolux pour 2028.


    ## 5. Emploi des 18 jours


    1. **48 h — question à Kelmar, coût nul :** la réservation J+18 est-elle un engagement d''achat ferme
    ou une option de capacité avec frais ? C''est l''information décisive du dossier, et elle est gratuite.

    2. **Négocier Kelmar avec le devis Sinolux en main.** 1,00 €/cellule concédé = 72 000 € réels et sans
    risque.

    3. **Trois propositions à Sinolux :** clause indexée, ou financement du test Vertex, ou tranche 2027
    réduite avec le solde 2028 conditionné aux retours terrain. **Refus des trois = dossier clos.**

    4. **Si et seulement si Kelmar confirme 26,00 € sur 60 000 unités :** répartition 60 000 / 12 000.
    La tranche Sinolux est neutre en résultat (≈ ±39 k€) et fournit une mesure terrain sur 12 000 unités
    — supérieure à 1 500 cellules en laboratoire, et gratuite.


    ## Le meilleur argument contre cette note


    Le 3,1 % vient d''une ligne *comparable*, pas de la nôtre ; un entrant expédie souvent son meilleur
    process ; et rester chez l''historique sous pression de calendrier apprend à Kelmar que nous paierons
    toujours la prime d''incumbent — ce qui coûte plus que 230 400 € sur trois cycles. **Cet argument
    tient sur le dernier point**, et c''est pourquoi la décision est conditionnée à une concession de
    prix Kelmar et à un second source ouvert pour 2028. Il ne tient pas sur le premier : la charge de
    la preuve revient à celui qui refuse d''être mesuré.


    ---


    **Pire cas de l''option retenue :** 230 400 € d''économie non réalisée, encaissée par le compte de
    résultat 2027. Aucune rupture d''approvisionnement, aucun retard de lancement.

    **Pire cas de l''option écartée :** taux réel à 4 %, ligne Kelmar vendue, aucun second source avant
    fin 2027, production non reportable — perte de 102 k€ et 1 944 retours clients supplémentaires, sans
    sortie possible.

    **Repli :** si Kelmar refuse ou repositionne son prix au-dessus de 26,00 € avant J+18 → répartition
    d''urgence avec Sinolux sur le solde et financement immédiat de Vertex pour 2028.

    **Ce qui renverse cette décision :** une mesure documentée, méthode communiquée, sur la ligne 2027
    réelle (pas l''échantillon de mars), en dessous de 2,0 %, obtenue avant J+18.

    **Première action :** appel à Kelmar sous 48 h sur la nature juridique de la réservation.


    ---


    Le point à corriger cette semaine quel que soit le fournisseur retenu : **les 230 400 € inscrits au
    budget sont un montant brut avant coût des retours.** La ligne défendable, sur les éléments actuels,
    est comprise entre 0 et 30 000 €.


    Je peux la publier en page partageable pour le comité si vous voulez un lien plutôt qu''un fichier.

    '
