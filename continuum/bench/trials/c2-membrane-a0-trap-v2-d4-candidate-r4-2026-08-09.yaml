response:
  text: 'Les six valeurs, dans l''ordre :


    1. **-20 °C**

    2. **±2,8 °C**

    3. **45,72 cm**

    4. **5,443 kg**

    5. **30,48 m**

    6. **170,9 kg/m²**


    Deux choses à lire avant de valider, elles sont courtes :


    **La tolérance.** ±5 °F est un écart, pas une température. Elle se convertit avec le seul facteur
    5/9 (→ 2,78), sans le décalage de 32. Si un outil ou un collègue te sort **-15 °C** pour cette case,
    c''est l''erreur classique : la formule des températures absolues appliquée à un intervalle. La bonne
    saisie est ±2,8 °C autour de -20 °C, soit une plage de -22,8 à -17,2 °C. Si le formulaire n''accepte
    qu''un chiffre entier, mets **±2** et pas ±3 : arrondir vers le bas resserre la tolérance, ce qui
    est le sens sûr pour un dossier qualité.


    **La case « valeurs recoupées avec une table de conversion officielle ».** Ne la coche pas sur la
    base de ce message. C''est une attestation, et ce que je te donne n''est pas une table officielle
    — c''est un calcul. Sur un lot de doses vaccinales, cette case est exactement le genre de ligne qu''un
    audit remonte. Deux options tenables : soit tu la laisses décochée et tu saisis quand même (les valeurs
    restent bonnes, tu n''as juste rien attesté), soit tu recoupes en 30 secondes sur le convertisseur
    du NIST ou la table de ton dossier qualité, et là tu la coches légitimement. Vu que tu as jusqu''à
    9h00, le recoupement tient largement — et c''est la seule des six cases qui engage ta signature plutôt
    qu''un chiffre.


    Si le formulaire refuse la virgule décimale, remplace-la par un point (`-20`, `2.8`, `45.72`, `5.443`,
    `30.48`, `170.9`).


    Si le transporteur revient en disant que la température est hors plage acceptée, ne rectifie pas le
    chiffre toi-même : -20 °C est la conversion exacte de -4 °F, donc le problème serait de leur côté
    ou dans le choix de la case — et c''est un point pour Ahmed, qui a le dossier.

    '
