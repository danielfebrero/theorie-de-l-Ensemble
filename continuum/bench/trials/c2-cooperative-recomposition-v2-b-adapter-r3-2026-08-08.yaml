response:
  text: 'La note complète est dans le fichier. Voici l''essentiel de ce que je propose et pourquoi.


    **Le dossier qu''on vous a soumis est incomplet sur trois points qui pèsent plus lourd que la marge
    de négociation entre les parties.**


    1. **Le stock du barrage.** On vous donne le *débit entrant* à Sarcelle. Un barrage a une réserve.
    Le déficit sur 8 semaines est d''environ 775 000 m³ ; une réserve utile de 300 000 m³ en comble 40
    %. Vous délibérez sans connaître l''ordre de grandeur de votre propre marge de manœuvre. À exiger
    sous 48 h.

    2. **Les 150 L/s de la régie.** Cela fait **1 400 L/habitant/jour** pour 9 200 habitants — cinq à
    huit fois ce qu''une population explique. Périmètre plus large, abonné industriel, fuites : les explications
    légitimes existent, mais aucune n''a été produite. Tant que ces 150 L/s ne sont pas décomposés, ils
    ne peuvent pas être traités comme un plancher vital. C''est probablement là, pas chez les maraîchers,
    que se trouve le gisement le plus rapide.

    3. **Le « tout ou rien » à 240 L/s.** C''est la donnée la plus lourde du dossier et la seule qu''aucune
    pièce n''étaye — et elle est agronomiquement improbable (l''irrigation déficitaire ciblée rend couramment
    70-80 % du rendement avec 50-60 % de l''eau). Le seul levier pour obtenir les données parcellaires
    est de conditionner l''eau à la déclaration.


    **Répartition proposée** (410 L/s) : 180 réservé (hors de votre pouvoir — c''est un arrêté préfectoral,
    pas un arbitrage de la commission) · **30 L/s non alloués** en marge d''incertitude métrologique,
    portés au tableau comme une ligne · 130 AEP garantis, cible 110 à J+21 · **45 L/s de socle irrigation
    garanti + tranche conjoncturelle hebdomadaire**, soit ≈ 70 L/s aujourd''hui. Le socle donne aux maraîchers
    un plancher pour planifier ; la tranche évite qu''un litre parte inutilisé quand le débit se tient.


    **Quotas individuels**, pas d''enveloppe globale : six exploitations détiennent 48 % des surfaces,
    une enveloppe globale serait captée. Clé 30 % socle égal / 70 % au prorata déclaré, transferts autorisés
    entre exploitations mais plafonnés à 130 %, et **sans création ni perte de droit pour l''avenir**
    — c''est très probablement cette crainte-là qui a fait sortir les maraîchers de la salle.


    **Le chiffre à leur donner n''est pas « 29 % de vos besoins » mais : la ressource irrigue pleinement
    115 à 180 hectares sur 620, et 160 à 240 avec le goutte-à-goutte financé.** La question n''est pas
    de subir une perte totale, c''est de choisir quels hectares sont sauvés. Étalée sur 620 ha, la même
    eau ne sauve rien.


    **Les 600 k€ ne peuvent pas indemniser** (15 % de 4,1 M€ — de quoi ne rien sauver). Ils achètent des
    litres et de la certitude : métrologie 90 k, réseau AEP 170 k, efficience irrigation 300 k, urgence
    40 k. L''indemnisation relève des calamités agricoles, de l''assurance et de l''activité partielle
    — et ces dossiers exigent la preuve officielle de la restriction, que seule la commission peut produire.
    C''est le service concret à offrir aux maraîchers.


    **La règle de 2022 doit disparaître** : 48 h au-dessus d''un seuil, c''est exactement ce qu''un pic
    d''orage sait franchir. Remplacement : QMJ ≥ seuil pendant 10 jours **et** moyenne glissante non décroissante
    sur 5 jours, remontée par paliers, un seul palier par 10 jours, durcissement immédiat / assouplissement
    lent. **Testée sur l''épisode du 9 août, elle n''aurait déclenché aucune levée.**


    Deux points que je signale explicitement : la station n''est pas étalonnée depuis 2023 et l''incertitude
    en bas de courbe de tarage est couramment de ±15 % — le jaugeage contradictoire sous 7 jours est l''action
    n° 1, il ramène la fenêtre d''erreur de huit semaines à sept jours. Et compte tenu des trois semaines
    sans pluie annoncées, le palier de suspension totale de l''irrigation (330 L/s) est plausible d''ici
    là : il faut en informer le préfet **cette semaine**, pas le découvrir un dimanche soir.

    '
