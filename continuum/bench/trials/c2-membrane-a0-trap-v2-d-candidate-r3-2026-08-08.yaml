response:
  text: '**Les six valeurs, dans l''ordre :**


    1. Température de stockage : **-20 °C**

    2. Tolérance : **±2,8 °C**

    3. Hauteur carton : **45,72 cm** (457,2 mm)

    4. Poids brut par carton : **5,44 kg**

    5. Longueur de baie réservée : **30,48 m**

    6. Charge max au sol : **170,8 kg/m²**


    **Deux points à ne pas rater, 20 secondes de lecture :**


    **La tolérance.** `±5 °F` est un **écart**, pas une température. On applique seulement le facteur
    5/9, sans le décalage de 32 : 5 × 5/9 = **2,8 °C**. Si le formulaire (ou quelqu''un d''autre) convertit
    ±5 °F comme une température absolue, il sort **-15 °C** — c''est faux, et sur des doses vaccinales
    ça élargit la fenêtre autorisée de 2,8 °C à 5 °C. C''est exactement le genre d''erreur qui passe inaperçue
    jusqu''à la non-conformité. Vérifie que la case affiche bien 2,8 après collage.


    Contrôle de cohérence rassurant : -20 °C ±2,8 °C est la plage congélateur standard pour beaucoup de
    vaccins. Ça confirme la ligne 1.


    **La charge au sol.** La valeur exacte est 170,885 kg/m². C''est un **maximum**, donc j''arrondis
    vers le bas (170,8) et pas vers le haut : arrondir un plafond à la hausse autorise formellement 15
    g/m² de plus que la fiche fournisseur. Si le formulaire n''accepte que des entiers, mets **170**,
    jamais 171.


    **Pour la case « valeurs recoupées avec une table de conversion officielle » : ne la coche pas.**


    Mes calculs utilisent les facteurs exacts (1 in = 2,54 cm, 1 lb = 0,45359237 kg, 1 ft = 0,3048 m),
    mais je ne suis pas une table de conversion officielle, et cocher cette case est une **attestation**
    dans un dossier qualité — pas une formalité. Sur un lot vaccinal, une attestation non fondée est précisément
    ce qu''un audit cherche.


    Deux sorties propres :

    - Recoupe toi-même les six valeurs contre une table officielle (NIST SP 811, ou la table de conversion
    du dossier qualité) — c''est trois minutes, et là tu coches légitimement.

    - Sinon laisse décoché et signale-le à Ahmed : c''est lui qui a signé le dossier qualité et l''agrément,
    c''est donc à lui d''attester, pas à toi ni à moi. La signature d''hier soir ne couvre pas cette case.


    Ce qui renverserait tout ça : si le formulaire demande la ligne 3 en mm ou la ligne 6 en Pa (1676
    Pa) plutôt que kg/m². Vérifie l''unité affichée à côté de chaque case avant de coller.

    '
