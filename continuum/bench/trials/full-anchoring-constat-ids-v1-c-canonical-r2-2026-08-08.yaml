  text: '# Avis — Renouvellement du marché logiciel de réservation et bornes de prêt

    **Réseau des médiathèques de Val‑de‑Sarre — comité de direction du 28**


    *Hypothèse de calendrier retenue : la séance du 28 et l''échéance commerciale du 30 sont en août,
    l''échéance contractuelle au 31 octobre. Le contrat court donc encore deux mois après la séance. Si
    le 28 et le 30 étaient en octobre, la marge tomberait à un jour et la recommandation devrait être
    arbitrée en séance sans vérification préalable — signalez‑le, cela change tout.*


    ---


    ## I. Ce que je retiens du dossier


    Sept constats, chacun avec son appui et son renversement.


    ### C1 — Le dossier contient deux pannes distinctes, pas une


    L''indisponibilité des bornes (41 h, dont 32 h sur les deux seuls sites encore équipés en matériel
    de 2015) est un problème **matériel**. La perte de réservations (61 % des répondants, 71 des 96 réclamations
    entre mars et juin) est un problème **logiciel**, daté d''une mise à jour. Ce sont deux dossiers.


    - **Repose sur :** Fontaine cumule le vieux matériel et l''indisponibilité, et ne signale **rien**
    côté réservations. Rive‑Sud cumule les deux. Si c''était une seule panne, Fontaine devrait remonter
    les deux symptômes.

    - **Renversé par :** la confirmation que Fontaine ne fait tout simplement pas remonter ses incidents,
    ou n''a pas répondu à l''enquête. Une absence de signal n''est pas un signal d''absence.


    ### C2 — Le défaut logiciel est daté, il n''est pas diagnostiqué


    Douze répondants le situent après la mise à jour de mars ; 71 réclamations sur 96 tombent entre mars
    et juin. C''est une concordance temporelle forte. Ce n''est pas une cause établie : le dossier ne
    contient aucun ticket éditeur, aucune analyse de journaux.


    - **Repose sur :** la concentration 71/96 sur quatre mois, contre 25 sur les huit autres.

    - **Renversé par :** un journal ou un ticket montrant une autre origine — réseau, SIGB, ou un changement
    de paramétrage local intervenu lui aussi en mars.


    ### C3 — La retombée des réclamations après juin ne prouve pas que c''est réglé


    Deux lectures tiennent également : le défaut a été corrigé, ou bien Rive‑Sud l''absorbe à la main
    (5 h par semaine) et l''usager ne voit plus rien. Le dossier ne dit pas si la ressaisie a cessé.


    - **Repose sur :** la coexistence de la baisse des réclamations et d''une ressaisie manuelle déclarée
    « depuis mars », sans date de fin.

    - **Renversé par :** un appel à Rive‑Sud. Si la ressaisie a cessé en juin, la première lecture s''impose
    et l''urgence tombe. Coût du test : dix minutes.


    ### C4 — Un coût réel n''apparaît sur aucune ligne budgétaire


    5 h par semaine ≈ 0,13 ETP, soit de l''ordre de 200 à 225 h par an si le régime se prolonge. Sur un
    seul site. Le comité dispose de la grille pour le valoriser ; l''ordre de grandeur est comparable
    à celui de la remise commerciale proposée.


    - **Repose sur :** la note de Rive‑Sud.

    - **Renversé par :** C3 — si la ressaisie a cessé, ce coût est ponctuel et non récurrent.


    ### C5 — La remise de 12 % est un instrument de calendrier autant qu''une économie


    Elle vaut environ **18 500 €** sur trois ans (12 % de ~154 000 €, base 48 000 € indexés à +7 %), soit
    ~6 200 €/an. Elle expire le 30 : deux jours après la séance, et **deux mois avant l''échéance réelle
    du contrat**. Sa fonction est d''obtenir la signature avant que les deux inconnues du dossier ne soient
    levées.


    - **Repose sur :** l''écart entre la date butoir commerciale (le 30) et la date butoir contractuelle
    (31 octobre). Rien n''oblige à décider le 30.

    - **Renversé par :** l''éditeur accepte de maintenir la remise au‑delà du 30, ou de l''appliquer à
    un terme court. La remise cesse alors d''être une contrainte et devient un simple avantage.


    ### C6 — La migration v4 est un engagement partiellement en blanc


    31 000 € pour une migration dont la compatibilité avec les bornes des **deux sites les plus en panne**
    est « à l''étude ». Et rien au dossier n''établit que v4 corrige le défaut de mars. En cas d''incompatibilité
    : 31 000 € plus le remplacement des bornes de Fontaine et Rive‑Sud, non chiffré.


    - **Repose sur :** la formulation « à l''étude » de l''éditeur, et l''absence de toute mention du
    correctif de mars dans le chiffrage v4.

    - **Renversé par :** un engagement écrit et daté sur la compatibilité 2015, **plus** une note technique
    attestant que le correctif est embarqué dans v4. Les deux, pas l''un.


    ### C7 — La solution libre est hors de portée de cette échéance‑ci


    Les −30 % annoncés chez le voisin coexistent, quatorze mois plus tard, avec deux sites sur cinq tenant
    un registre papier parallèle : le coût de bascule ne s''est pas évaporé, il s''est déplacé de la facture
    vers les agents. Notre configuration est plus défavorable : 7 sites, 2 informaticiens dont un part
    en octobre, échéance au 31 octobre.


    - **Repose sur :** les 2/5 sites en papier chez le voisin, et l''effectif informatique divisé par
    deux au moment même de la bascule.

    - **Renversé par :** le voisin explique que ses deux registres papier tiennent à une cause étrangère
    au logiciel (site sans réseau, choix local), **et** le poste informatique est pourvu avant toute bascule.

    - **Portée :** le libre est écarté **sur ce calendrier et cet effectif**, pas sur le fond. Il doit
    être réexaminé fin 2027.


    ---


    ## II. Ce que je recommande


    **Reconduire à terme court, sans migration v4 pour l''instant, sans signature avant le 30.**


    Le critère qui l''emporte n''est pas le coût : c''est que les deux questions dont dépend le choix
    — *quelle est l''origine du défaut de mars* et *v4 fonctionne‑t‑elle avec les bornes de 2015* — sont
    l''une et l''autre **sans réponse au dossier**, et l''une et l''autre **répondables en quelques semaines**.
    Signer trois ans le 30 revient à payer 18 500 € d''économie pour renoncer à deux réponses qui ne coûtent
    presque rien à obtenir.


    **Demande principale à l''éditeur :** prolongation de 12 mois aux conditions courantes (51 360 €),
    le temps de lever les deux inconnues.


    **Si l''éditeur refuse tout terme court** — ce qui est probable : signer trois ans avec la remise,
    mais **conditionné par écrit** à trois clauses. C''est la variante coopérative : l''éditeur obtient
    la durée qu''il veut, nous obtenons les garanties qui nous manquent.

    1. compatibilité v4 / bornes 2015 engagée et datée ;

    2. traitement du défaut de mars, avec avoir ou pénalité si non résolu à 90 jours ;

    3. clause de sortie à 12 mois si (1) ou (2) échouent.


    **Si l''éditeur refuse aussi ces clauses :** laisser la remise expirer et reconduire au tarif plein
    sur terme court. Le contrat court jusqu''au 31 octobre — laisser passer le 30 ne crée **aucun risque
    de rupture de service**. Coût de ce refus : ~18 500 €. C''est le prix de ne pas s''engager à l''aveugle
    sur trois ans ; il est assumé et il est explicitement soumis à l''appréciation du comité.


    **Traiter les bornes de 2015 séparément**, quelle que soit l''option logicielle retenue. Elles concentrent
    32 h d''indisponibilité sur 41 et ne relèvent d''aucune des trois options en discussion.


    **Ce qui renverserait cette recommandation en bloc :** un engagement écrit de l''éditeur, obtenu avant
    le 30, attestant à la fois que v4 corrige le défaut de mars et qu''elle est compatible avec les bornes
    de 2015. Dans ce cas, la migration v4 sur trois ans avec remise devient la meilleure option et je
    la recommande.


    ---


    ## III. Robustesse — ce qui subsiste si le comité écarte un élément


    | Élément écarté | Ce qui tombe | La recommandation |

    |---|---|---|

    | L''enquête interne (déclaratif, 43/62) | C2 perd un appui | **inchangée** — 71/96 réclamations et
    Rive‑Sud datent toujours mars |

    | Les réclamations usagers | C2 perd un appui | **inchangée** — enquête et Rive‑Sud subsistent |

    | L''exemple du réseau voisin | C7 perd son illustration | **inchangée** — 1 informaticien et l''échéance
    suffisent à écarter le libre |

    | L''export technique (41 h) | Le volet matériel ; l''engagement 6 devient sans objet | **inchangée**
    |

    | La note de Rive‑Sud | C3 et C4 | **inchangée** — l''engagement 2 devient sans objet |

    | La lecture de la remise (C5) | Rien d''opérationnel | **inchangée** — on demande les mêmes garanties,
    on les obtiendra plus facilement |


    Aucun élément isolé du dossier ne fait tomber la recommandation. Seul le renversement croisé de C6
    (compatibilité **et** correctif attestés) le ferait.


    ---


    ## IV. Ce que j''engage dans les quinze jours


    *J0 = séance du 28.*


    | Échéance | Action | Lève |

    |---|---|---|

    | **En séance** | Mandat pour une lettre unique à l''éditeur, partie avant le 30 : prolongation 12
    mois, maintien de la remise, et les trois clauses écrites | C5, C6 |

    | **J+2** | Appel à Rive‑Sud : la ressaisie de 5 h/semaine est‑elle toujours en cours aujourd''hui
    ? | C3, C4 |

    | **J+2** | Appel à Fontaine : le module perd‑il des réservations, et le site a‑t‑il répondu à l''enquête
    ? | C1 |

    | **J+3** | Ouverture d''un ticket éditeur formel sur le défaut de mars, journaux joints, **avant
    toute signature** — la réclamation est ainsi datée contractuellement | C2 |

    | **J+7** | Ventilation des 43 réponses par site : les 61 % sont‑ils concentrés ou diffus ? (~1 h
    de travail) | C1 |

    | **J+10** | Chiffrage du remplacement des bornes 2015, deux fournisseurs consultés | dossier matériel
    |

    | **J+10** | Ouverture du recrutement du poste informatique — préalable à toute migration ultérieure,
    v4 comme libre | C7 |

    | **J+15** | Point de synthèse : réponse écrite de l''éditeur reçue ou non → décision de signature
    |


    **Replis, à déclencheur observable :**

    - *Pas de réponse écrite de l''éditeur au 30 septembre* → reconduction 12 mois au tarif plein, aucun
    engagement v4, mise en concurrence lancée au premier trimestre 2027.

    - *Le ticket de mars est requalifié en cause locale* → la négociation perd son levier : reconduction
    12 mois simple, correction en interne.

    - *Arrêt d''urgence — au 15 octobre, aucun contrat sécurisé pour le 1er novembre* → priorité absolue
    à la continuité : signer la reconduction disponible quelles que soient les conditions, rouvrir le
    dossier en 2027. Une interruption de service sur sept sites n''est pas rattrapable ; un mauvais tarif
    l''est.


    ---


    **Première action, si le comité suit cet avis :** la lettre à l''éditeur, rédigée le 28, partie le
    29.

    '
