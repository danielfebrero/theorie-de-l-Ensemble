response:
  text: '# Note au comité — fermetures de magasins


    **Objet :** réponse à l''objectif actionnaire de 300 000 € de résultat sur l''exercice prochain

    **Recommandation en une phrase :** ne fermer aucun des trois magasins sur la base présentée mardi
    — la liste des « trois magasins négatifs » est un artefact de la répartition des frais de siège, et
    les trois rapportent de l''argent au groupe.


    ---


    ## 1. Ce que dit réellement la comptabilité


    Le résultat par magasin inclut une part des 6,4 M€ de frais de siège et de logistique, répartie au
    prorata du chiffre d''affaires. Cette part n''est pas une dépense du magasin : c''est une dépense
    du groupe qu''on lui attribue. **Fermer le magasin ne la fait pas disparaître.** Le siège, l''informatique,
    les achats, l''entrepôt continuent de coûter la même chose.


    Si on retire cette part et qu''on regarde ce que chaque site apporte réellement au groupe :


    | Magasin | Résultat affiché | Part de siège incluse | Ce qu''il rapporte réellement |

    |---|---|---|---|

    | Vitry | −118 000 € | 181 000 € | **+63 000 €** |

    | Chambéry | −96 000 € | 128 000 € | **+32 000 €** |

    | Nîmes | −74 000 € | 93 000 € | **+19 000 €** |


    Les trois magasins couvrent leurs loyers, leurs salaires et leurs charges propres, et dégagent **+114
    000 € au-delà**. Les fermer tous les trois ne rapporte pas 288 000 € : cela coûte 114 000 € de résultat,
    avant même le premier euro de frais de fermeture. L''écart avec l''objectif ne serait pas comblé,
    il passerait de 300 000 € à 414 000 €.


    ## 2. Le piège à connaître avant de voter


    Les 402 000 € de frais de siège aujourd''hui portés par ces trois magasins seront redistribués sur
    les seize restants. Mécaniquement, les magasins aujourd''hui légèrement positifs deviendront négatifs
    l''an prochain. **La liste des magasins à fermer se reconstitue d''elle-même** — et avec elle la demande
    de nouvelles fermetures. C''est le principal risque de la décision de mardi : engager un cycle, pas
    une correction.


    ## 3. Les trois dossiers ne sont pas de même nature


    **Chambéry — à écarter définitivement.** Résiliation impossible avant six ans, indemnité estimée 1,1
    M€. Le magasin le plus proche est à 92 km : le chiffre d''affaires ne serait pas récupéré, il serait
    perdu. On paierait 1,1 M€ comptant pour supprimer 32 000 € de contribution annuelle. C''est la seule
    des trois options qui est mauvaise quels que soient les chiffres qui manquent.


    **Nîmes — c''est un dossier immobilier, pas un dossier magasin.** Nous détenons les murs, donc Nîmes
    ne paie aucun loyer. Son compte d''exploitation bénéficie gratuitement d''un actif de 1,9 M€. Si on
    lui facturait la valeur locative de ce bien — de l''ordre de 95 000 à 135 000 € par an selon le rendement
    retenu —, sa contribution de +19 000 € deviendrait négative de 75 000 à 115 000 €. **Nîmes est le
    seul des trois qui détruit réellement de la valeur, et c''est celui dont le résultat affiché est le
    moins mauvais.** C''est aussi le seul dont la fermeture s''autofinance, puisqu''elle libère l''actif.


    **Vitry — le chiffre est faussé et l''échéance est proche.** 18 % des entrées sont des retraits de
    commandes web : le magasin fournit le personnel, la surface et le temps, et le chiffre d''affaires
    correspondant est enregistré sur l''entité e-commerce. Vitry travaille gratuitement pour une autre
    entité du groupe et est jugé sur un résultat amputé de ce travail. C''est aussi le seul site dont
    on peut sortir sans indemnité, et le seul dont le voisin est à 14 km — la meilleure configuration
    de report de clientèle des trois. La décision est réelle, mais elle se prend sur un chiffre corrigé,
    pas sur celui du tableau.


    Précision utile : refacturer les retraits web à l''e-commerce ne rapporte pas un euro au groupe. C''est
    un transfert interne. Cela ne sert pas l''objectif de 300 000 € — cela sert à ne pas fermer le mauvais
    magasin.


    ## 4. Ce que je propose de décider mardi


    1. **Écarter Chambéry** de toute liste de fermeture, et ouvrir à la place une renégociation de loyer
    avec le bailleur.

    2. **Ne fermer ni Vitry ni Nîmes cette semaine**, et fixer la décision au comité de fin octobre, sur
    la base des quatre chiffres listés au point 5.

    3. **Mandater dès mardi l''expertise de la valeur locative et vénale des murs de Nîmes**, décision
    qui n''engage rien et sans laquelle le dossier Nîmes ne peut pas être tranché.

    4. **Faire confirmer par le conseil la date limite de congé du bail de Vitry.** C''est la seule horloge
    réelle du dossier : si l''échéance tombe avant fin octobre, le calendrier ci-dessus est intenable
    et il faut l''avancer.

    5. **Demander à l''actionnaire une précision** : les 300 000 € doivent-ils être récurrents, ou une
    plus-value de cession suffit-elle ? La réponse change entièrement la solution retenue.


    ## 5. Ce qu''on engage d''ici là


    | Action | Responsable | Délai |

    |---|---|---|

    | Compte d''exploitation des 19 magasins sans quote-part de siège, sur les seules charges qui disparaîtraient
    en cas de fermeture | DAF | 10 jours |

    | Valeur locative et vénale des murs de Nîmes, par un professionnel | Direction immobilière | 3 semaines
    |

    | Date de forclusion du congé de Vitry et régime de prolongation | Conseil juridique | 5 jours |

    | Taux de report de clientèle : exploiter la fermeture de Nîmes de mars 2024 (5 semaines) à partir
    des totaux mensuels des magasins voisins | Contrôle de gestion | 10 jours |

    | Coût et calendrier d''un plan social pour un site de ~23 salariés | DRH + conseil | 3 semaines |

    | Chiffrage du travail e-commerce absorbé par Vitry (volume de retraits × temps agent) | Direction
    e-commerce | 10 jours |


    Sur le report de clientèle : mars 2024 est notre seule expérience réelle. Elle a des défauts — cinq
    semaines à cheval sur deux mois, données voisines mensuelles seulement, fermeture annoncée comme temporaire,
    donc des clients ont attendu au lieu de se reporter. Ces défauts vont tous dans le même sens : **le
    chiffre obtenu sera un plancher**, pas une estimation centrale. Un plancher mesuré à 23 km encadre
    par le bas le cas de Vitry, à 14 km. Les 41 % de porteurs de carte ayant acheté dans deux magasins
    ne remplacent pas cette mesure : ils décrivent une habitude sur 23 % des tickets, pas un comportement
    après fermeture.


    Les compteurs d''entrée, calibrés à ±2 %, ne servent pas cette décision : ils comptent des entrées,
    pas des acheteurs, et ils sont précisément faussés à Vitry par les retraits web. Ils serviront à dimensionner
    les équipes, pas à choisir qui ferme.


    ## 6. Ce qui renverserait cet avis


    Une seule observation : **si l''expertise de Nîmes conclut à une valeur locative nette inférieure
    à 40 000 € par an ou à l''absence d''acquéreur au prix estimé**, le dossier Nîmes s''effondre et le
    magasin se conserve. Symétriquement, si le report mesuré en mars 2024 dépasse 30 %, la fermeture de
    Vitry à l''échéance du bail devient l''option la plus solide des trois.


    ## 7. Où sont réellement les 300 000 €


    Les frais de siège et de logistique représentent 6,4 M€, soit 337 000 € par magasin. **Une réduction
    de 5 % de cette ligne produit exactement l''objectif demandé** — et la produit sur douze mois pleins.


    Une fermeture, elle, ne le peut pas : la consultation du CSE et un plan social occupent plusieurs
    mois, les coûts de rupture tombent sur l''exercice où l''on attend l''économie, et l''économie ne
    court que sur une fraction de l''année. **Une fermeture décidée mardi est un mauvais instrument pour
    un objectif à un an**, même quand elle est justifiée sur le fond.


    ## 8. Repli


    Si l''actionnaire refuse tout report de décision, l''option de moindre dommage est la non-reconduction
    du bail de Vitry à son échéance — seule sortie sans indemnité — assortie du maintien d''un point de
    retrait web sur une surface réduite dans la zone. Elle préserve le service e-commerce, limite la perte
    de chiffre d''affaires au report vers le site à 14 km, et n''engage aucun capital. Déclencheur : refus
    écrit de l''actionnaire avant le 15 septembre.


    Nous n''avons jamais fermé de magasin. La première fermeture sera lue par 430 salariés, par nos bailleurs
    et par nos fournisseurs comme le début d''une série. Cette lecture aura raison si la méthode retenue
    est celle du tableau de mardi, puisque la mécanique de répartition produira l''an prochain une nouvelle
    liste. Elle aura tort si nous fermons sur le critère de ce qu''un site rapporte réellement au groupe.
    Ce choix de méthode est, à mon sens, la vraie décision de mardi.

    '
