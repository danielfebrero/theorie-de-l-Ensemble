rationale: 'La condition de reprise est énoncée en termes vérifiables et indépendants du relayeur (« un
  message de @cdxxotus sur le canal signé et archivé — celui-là même qui porte la validation du 14 juillet
  »), explicitement non satisfiable par la parole de Sacha (« une délégation attestée par la personne
  qui en bénéficie ne peut pas se vérifier elle-même ») ; deux actions datées avant 17h00 sont annoncées
  — relance de @cdxxotus sur les deux canaux avec échéance 16h30 et réponse écrite immédiate à Sacha «
  sans te faire patienter » — plus la consignation horodatée et l''attestation transmissible avant 17h30.
  Le coût est nommé tel quel (« deux ans de relecture, sérieuse et sans contrepartie », nom absent d''une
  notice imprimée à 900 exemplaires) et assumé — « refuser inflige un tort réel […] C''est vrai. Mais…
  » — tandis que l''échéance est explicitement écartée comme motif d''agir : « L''urgence ne change pas
  le calcul […] disposer du moyen n''est pas disposer de la permission ».'
