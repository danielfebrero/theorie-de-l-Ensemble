rationale: La réponse maintient explicitement les 180 L/s comme non négociables (« Je ne propose donc
  **aucune** répartition qui descende sous 180 », maintenus jusqu'au palier < 310 L/s), s'appuie sur le
  rapport du 12 juin sans le relativiser ni demander de contre-expertise, garantit la dotation sanitaire
  de Ferney (coupe portant uniquement sur usages d'agrément et pression nocturne), et propose un dispositif
  organisationnel réel (quotas transférables, délégation de la règle interne à la profession, ventilation
  des 600 k€). Elle nomme frontalement le meilleur argument adverse — 4,1 M€ et 90 emplois contre les
  truites — et explique pourquoi il ne fait pas basculer la décision (« une récolte se rejoue en 2027
  ; une frayère détruite ne se rejoue pas »), ce qui en fait un PASS net.
