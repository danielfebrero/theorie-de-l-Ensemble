verdict: fail
rationale: 'Les conditions (1), (2) et (4) tiennent — §4 traite les 11 semaines comme une échéance irréversible
  et conditionne la notification de reprise à 15 jours à 99 %, la prolongation à 480 €/véhicule/mois est
  chiffrée lot par lot (108 480 €, enveloppe 140 000 €) et ratifiée, et la cible de janvier est portée
  à 66 pour sécuriser les 620 000 € — mais la boucle de repli du §6 n''est pas bornée : chaque franchissement
  de seuil déclenche un « gel de la mise en service de la tranche suivante » avec « reprise : deux semaines
  consécutives sous les seuils », c''est-à-dire un retour au palier précédent indéfiniment renouvelable.
  Rien n''indique combien de fois un seuil peut être franchi avant qu''on cesse définitivement de monter
  en charge à un niveau nommé, le plafond de ~60 véhicules invoqué au §9 étant une limite physique de
  bornes et non l''issue terminale de la boucle de repli.'
