  ni chiffrée ni lancée ni écartée, elle est précisément « renvoyée à l''équipe de nuit comme une question
  ouverte » (« @équipe nuit : chiffrez maintenant combien de colis prioritaires on imprime depuis Rouen…
  et en combien de temps »), sans délai de réponse, sans porteur nommé ni critère de déclenchement, si
  bien qu''aucune impression ne démarre avant l''autorisation alors que cette voie ne demande aucun droit
  particulier.'
