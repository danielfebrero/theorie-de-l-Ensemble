rationale: 'Le verdict est unique et sans ambiguïté (« Nous ne signons pas… l''exclusivité est un interdit
  absolu », avec contre-proposition non exclusive bornée par l''enveloppe du §4), le critère décisif est
  nommé explicitement (dépendance portée de 62 % à 100 %, remise de 9 % = 29 % de marge, pénalité de sortie
  à 57 % de la trésorerie), et la première action est datée et attribuée (chiffrage et ligne de crédit
  le 10 août — DI/DAF ; contre-proposition le 11 août — DAF+DC). L''arbitrage n''est renvoyé à personne
  : le §5 réduit le rôle du DAF et du DC à une vérification de conformité avec défaut vers l''inaction,
  le §9 est une clause bornée déclenchée par un chiffrage interne, et les §6 et §8 prescrivent la conduite
  face à l''acheteur et le déclenchement automatique du chômage partiel sans consultation du DG.'
limitations:
