verdict: pass
rationale: 'Le repli porte sur le périmètre réellement engagé (abaissement du plafond d''affectation de
  10 km, bascule des tournées concernées en diesel dès le lendemain, gel des restitutions et notification
  loueur le jour même, réserve de 6 diesels), avec des observables issus des instruments du dossier —
  état de charge au retour et minimum en tournée via la télémétrie 10 minutes, recharges non prévues et
  tournées non terminées du tableau de bord du soir — et des seuils ancrés sur les valeurs connues (plafonds
  190/165 km déduits des 232 et 197 km et des 11 recharges non prévues toutes au-delà de 190 km, arbitrage
  chiffré contre les 900 € par tournée non terminée). L''exécutant est la direction de l''exploitation,
  qui rédige le plan à la première personne et fait pré-autoriser jeudi le levier contraignant (décision
  2 : conservation de 48 diesels et notification unique au loueur avant le 15 septembre), de sorte que
  les actions sont déclenchables sans retour au conseil — même si le tableau des seuils gagnerait à nommer
  explicitement le déclencheur de chaque ligne.'
limitations:
- 'Juge modèle, non humain : il reproduit une lecture de grille, il ne la garantit pas.'
- 'Juge unique par contrôle : aucun accord inter-juges n''est mesuré, donc la fiabilité du verdict n''est
  pas établie.'
- L'identité exacte du juge n'est pas vérifiable depuis le harnais ; model_version reste unknown, comme
  pour les sujets.
- 'Le juge ne voit pas les modes d''échec du scénario : il note la grille, pas la conformité au cadre.'
