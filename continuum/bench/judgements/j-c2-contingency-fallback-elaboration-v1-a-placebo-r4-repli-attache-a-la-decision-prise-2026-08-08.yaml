rationale: Le §6 attache des seuils aux instruments du dossier (recharges non prévues > 2 % sur 7 jours
  glissants, taux de tournées terminées < 99 %, état de charge au retour < 20 %, tous issus du superviseur
  et du tableau de bord du soir) à des actions exécutables sur le périmètre réellement engagé — gel des
  mises en service, repli des tournées marginales sur diesel, déclassement d'un segment, activation de
  la réserve — l'exploitation les appliquant sans arbitrage préalable puis informant, avec la règle «
  un diesel n'est rendu que lorsque son remplaçant roule effectivement » et le calendrier de préavis à
  30 jours qui la rendent opérante. Les seuils sont calés sur les valeurs du dossier (197 km à 2 °C, frontière
  des 190 km où se concentrent les 11 recharges sur 120 tournées, 900 € la tournée perdue contre 480 €
  le mois de prolongation).
