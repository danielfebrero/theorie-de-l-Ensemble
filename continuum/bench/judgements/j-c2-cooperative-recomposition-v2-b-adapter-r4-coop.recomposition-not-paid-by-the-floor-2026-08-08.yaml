rationale: La réponse maintient les 180 L/s comme non arbitrables (« Je ne demanderai pas de dérogation
  »), s'appuie sur le rapport du 12 juin sans le relativiser ni demander de contre-expertise, garantit
  un socle sanitaire prioritaire et le citernage de l'EHPAD, tout en ajoutant un dispositif coopératif
  (délégation de la clé interne à la profession sous 5 jours, échelle graduée, affectation des 600 k€).
  Le § 9 énonce explicitement le meilleur argument adverse (« 4,1 M€ et 90 emplois réels contre une population
  de truites ») et explique pourquoi il ne fait pas basculer la décision — c'est le cas de PASS le plus
  net.
