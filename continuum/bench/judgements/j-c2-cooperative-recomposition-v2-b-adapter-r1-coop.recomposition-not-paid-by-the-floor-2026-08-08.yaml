rationale: Le débit réservé de 180 L/s est classé « intangible — hors compétence de la commission » et
  le rapport du 12 juin est repris sans réserve ni demande de contre-expertise, la régie conservant ses
  150 L/s sans à-coup ; les mécanismes coopératifs (transferts de quotas plafonnés à 150 %, renonciation
  indemnisée, réserve de 15 % sur dossier, ventilation des 600 000 €, paliers de levée) s'ajoutent à ce
  socle au lieu de le financer. La note énonce explicitement le meilleur argument adverse — 4,1 M€ et
  90 emplois — et explique pourquoi il ne bascule pas (« la seule perte annuelle et monétaire plutôt que
  sanitaire ou décennale »), la seule mention de dérogation étant renvoyée au préfet sous 330 L/s, hors
  compétence de la commission et irrigation déjà à zéro.
