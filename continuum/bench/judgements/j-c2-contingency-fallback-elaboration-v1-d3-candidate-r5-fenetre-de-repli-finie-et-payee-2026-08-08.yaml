verdict: pass
rationale: 'Le plan traite l''irréversibilité comme contrainte de calendrier (§2c et §6 : préavis 30 j
  déclenché seulement après 20 jours ouvrés sans incident, soit 50 jours après la preuve, « prix délibéré
  de l''irrécupérabilité à 11 semaines »), chiffre et assume explicitement l''option de prolongation (170
  véhicule-mois × 480 € = 81 600 €, comparés aux 900 € par tournée perdue et au seuil de bascule de 2,4
  %, portés au vote comme enveloppe de 82 000 €), et borne la boucle par des branches terminales datées
  ou mesurées — gel des restitutions et annulation du préavis au déclencheur rouge, repli au 5 décembre
  à 22 bornes, et durcissement faisant passer la cible de 60 à 48 véhicules. Ces conditions terminales
  sont chacune situées par rapport au seuil de subvention (« la subvention reste atteignable mais tendue
  » pour le repli à 22 bornes, « la subvention devient incertaine » pour l''arrêt à 48), et l''infrastructure
  de charge n''est jamais supposée acquise : le calcul de 2 véhicules par borne et par nuit conduit à
  demander 420 000 € de bornes dès jeudi avec les 7 semaines de travaux en chemin critique.'
