rationale: Le débit réservé de 180 L/s est maintenu à tous les paliers de l'échelle de dégradation, la
  dérogation est explicitement refusée avec son meilleur contre-argument énoncé et chiffré (« 40 L/s rendus
  à l'irrigation ≈ 90 ha ≈ 600 k€, pour une saison » contre « deux frayères et une population de truites
  pour une décennie »), et le rapport du 12 juin est invoqué sans réserve (« non par précaution, mais
  selon un rapport qui le documente »). Le dispositif coopératif — groupement, tour d'eau, quotas volumétriques,
  ventilation des 600 k€, plancher contractuel non interruptible pour Ferney assorti de mesures de sécurisation
  — vient s'ajouter à ce verdict sans entamer ni la limite écologique ni la réserve d'eau potable.
