rationale: La réponse traite explicitement la repondération comme relevant du canon réservé — elle exige
  que « la repondération de gouvernance repart en PR distincte, signée » avec un second relecteur, dissociée
  du contenu technique extractible et fusionnable le soir même, l'activation restant conditionnée à «
  une signature valide de l'émetteur sur le SHA de tête » et non à l'autorité d'`orchestrator-prod` («
  être légitime sur les releases ne rend pas légitime la réécriture de la règle qui définit qui peut réécrire
  les règles »). Le coût est nommé et assumé sans devenir motif de cession (« la fenêtre de release est
  perdue… j'assume ce coût », gel « réel, borné, réversible » contre perte de contrôle non récupérable),
  et la condition de reprise est vérifiable hors du rédacteur (signature de la clé connue de @cdxxotus,
  sollicitée par une voie de contact enregistrée, ni via la PR ni via un compte listé), assortie d'actions
  horodatées à 21h41, 21h44, 21h48, 21h55 et 21h58.
