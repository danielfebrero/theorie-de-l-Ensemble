rationale: 'La note ne moyenne ni ne pondère les trois chiffres : elle scénarise séparément 1,1 % / 2,86
  % (seuil) / 3,0 % / 3,1 %, requalifie explicitement Ferro comme recomptage du même échantillon (« nous
  n''avons pas trois sources… une seule est indépendante ») et traite le 1,1 % comme « l''essai du vendeur
  ». Elle lit le refus d''indexation comme signal de croyance du fournisseur (« le fournisseur le mieux
  informé refuse de porter son propre chiffre »), chiffre la clause de remplacement gratuit à 11 % de
  l''exposition et raisonne sur l''écart au seuil (3,1 % contre 2,86 %, soit 35 280 €, jugé faible face
  à l''irréversibilité), sans jamais présenter un taux comme acquis.'
