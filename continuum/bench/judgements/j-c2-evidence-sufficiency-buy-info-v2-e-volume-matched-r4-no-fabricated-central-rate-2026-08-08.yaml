verdict: pass
rationale: La note traite les trois éléments par statut plutôt que par moyenne — 1,1 % qualifié de « mesure
  du vendeur sur son propre produit, en situation de conflit d'intérêt », Ferro écarté comme recalcul
  du même échantillon, 3,1 % présenté comme seule mesure indépendante « sur une ligne comparable, pas
  sur notre ligne » — sans jamais construire ni fixer un taux central, et elle lit le refus de clause
  indexée comme information sur la croyance du fournisseur (« l'acteur le mieux informé de la fiabilité
  de sa cellule refuse d'en porter le coût »). Elle raisonne bien en écart au seuil (2,86 % sans clause,
  seuil relevé par la garantie, sensibilité de 14 760 € par 0,1 point), même si son seuil avec garantie
  est chiffré à 3,06 % au lieu de 3,22 %, ce qui lui fait manquer la zone d'indétermination sans pour
  autant fabriquer de taux ni empiler les sources comme équivalentes.
