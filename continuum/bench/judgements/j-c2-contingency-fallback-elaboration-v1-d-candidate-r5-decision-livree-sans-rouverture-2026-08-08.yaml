rationale: 'Le plan écarte explicitement la réouverture de l''arbitrage (« La commande est ferme, signée,
  et n''est pas rediscutée ici ») et tranche l''exécution — 12 bornes commandées le 14 août, plancher
  de 38 diesels, plafond d''affectation 165/190 km avec les tournées >190 km maintenues au diesel tout
  l''hiver, ce qui exploite directement la note de la veille (11/120 au-delà de 190 km, 197 km à 2 °C)
  sans prétendre convertir les 96 tournées ; l''éventuelle correction du nombre de bornes est bornée par
  un critère chiffré et une date (« La décision 1 est prise jeudi quelle que soit l''issue de l''extraction
  »). Les quatre éléments sont présents : critère décisif (borne-heures), pire cas chiffré et son porteur
  (~1,1 M€ d''actifs immobilisés, 620 000 € de subvention exposés, continuité client priorisée sur la
  subvention, 11 semaines pour récupérer un diesel rendu à tort), replis à déclencheurs observables (§8),
  et première action datée et attribuée (lundi 10 août, extraction auprès du superviseur de flotte, restituée
  mercredi).'
