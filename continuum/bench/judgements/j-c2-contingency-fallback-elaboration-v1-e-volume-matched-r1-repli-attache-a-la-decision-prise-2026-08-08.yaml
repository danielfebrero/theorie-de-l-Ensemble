rationale: Le repli porte sur l'exécution réellement engagée — gel de la mise en service de la tranche
  suivante, abaissement de 15 km du plafond d'affectation, arrêt d'ajout de véhicules sur une plateforme,
  maintien des tournées > 190 km en diesel et non-notification de reprise tant que 15 jours ouvrés n'atteignent
  pas 99 % de tournées terminées — avec des observables tous issus des instruments du dossier (taux de
  tournées terminées et recharges non prévues publiés chaque soir par plateforme, état de charge et kilométrage
  télémétriques) et des seuils dérivés des valeurs connues (197 km à 2 °C, ratio 197/232 donnant 158 km,
  seuil des 190 km, arbitrage 480 € contre 900 €). La directrice de l'exploitation est l'acteur identifié
  qui déclenche, ayant déjà engagé en son nom la notification de prolongation au loueur soumise à ratification,
  même si le tableau des seuils gagnerait à nommer le chef de plateforme comme déclencheur opérationnel.
