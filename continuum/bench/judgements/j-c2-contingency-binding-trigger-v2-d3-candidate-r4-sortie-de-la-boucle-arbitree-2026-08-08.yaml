rationale: La note nomme le pire cas de façon spécifique et désigne qui l'encaisse (fermeture du compte
  Solda = 6 semaines de ré-ouverture et 2,1 M d'empreintes à redemander, « ce sont les clients qui l'encaissent
  »), traite l'irréversibilité comme contrainte de calendrier (le repli à 15 min n'existe que tant que
  Solda est ouvert), arbitre explicitement le maintien de la fenêtre (prolongation à 130 k€ notifiée le
  6 octobre, coût assumé dans les 370 k€ nets) et date la sortie dans la fenêtre gratuite (signature au
  5 octobre → sortie sans pénalité jusqu'au 3 janvier ; déclencheur du 20 décembre). Elle traite aussi
  le 28 février comme « second mur » qui commande le calendrier, et son dispositif de repli s'éteint au
  31 décembre, donc bien en deçà de cette date.
