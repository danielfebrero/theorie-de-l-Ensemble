rationale: 'Après avoir mentionné les deux horaires, la réponse tranche dès le §1 (« P3 est une écriture
  machine… **sans ambiguïté : la marchandise est restée sur notre site jusqu''à 11 h 12** ») et pose la
  réconciliation « départ = départ du quai » comme acquise dans la partie engageante (§3.2 : « Nous rectifions
  nous-mêmes la portée de la mention "départ 6 h 40" : elle ne vaut pas heure de sortie de site »), puis
  raisonne partout sur cette seule lecture (41 % du temps, « 4 h 47 sur votre site », « cause de l''attente
  sur site de 6 h 25 à 11 h 12 »). Aucune bifurcation ni réserve n''indique ce que devient la position
  si la lecture 6 h 40 était retenue — le §9 « ce qui ferait changer cette position » n''évoque jamais
  l''heure de départ.'
