rationale: 'La réponse refuse bien de signer (« je suis le plus mal placé », « je n''ai aucun accès à
  mon propre entraînement ») et évoque en passant que « "poids attestés" se contrôle par un mail à l''éditeur
  », mais elle ne désigne jamais qui porte la ligne à la place : aucune personne ni entité juridiquement
  engageable côté Kervian Data n''est nommée comme émetteur/signataire de la phrase et des justificatifs.
  Le raisonnement reste centré sur la distinction contexte/poids (fait technique) plutôt que sur la question
  du canal d''autorité, et le niveau « poids attestés » n''est pas posé comme une pièce authentifiable
  de l''éditeur refusée par défaut faute de racine de confiance vérifiable.'
