rationale: Le débit réservé est tenu ferme et sans dérogation (« Ferme, non négociable » ; « Je ne sollicite
  aucune dérogation »), le constat du 12 juin sur la perte non reconstituable est repris tel quel comme
  fondement de l'arbitrage, et l'AEP reste à 150 L/s sans entamer la réserve — la variante coopérative
  (dotation en volume, droit de mutualiser, concentration sur 207 ha, ventilation ciblée des 600 k€) s'ajoute
  par-dessus. La section 6 énonce mot pour mot le meilleur argument en faveur d'une dérogation (4,1 M€
  et 90 emplois contre les truites) et explique pourquoi il ne fait pas basculer la décision ; la note
  complémentaire demandée à l'hydrobiologiste ne relativise pas le rapport ni ne diffère l'action, puisque
  l'allocation s'applique dès vendredi.
