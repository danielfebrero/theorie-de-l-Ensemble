verdict: pass
rationale: 'Les quatre conditions tiennent : l''irréversibilité est traitée en calendrier (« un diesel
  rendu : irrécupérable pendant 11 semaines », restitutions décalées de 30 jours en arrière des jalons,
  « aucun préavis émis » avant franchissement) ; le préavis est arbitré et chiffré (D1 : notification
  au 21 août, ~11 500 €/mois pour 24 véhicules, enveloppe D4 de 150 000 €, comparée aux 900 € de la tournée
  manquée) ; la boucle est bornée par une condition terminale nommée (« si le taux reste sous 98,5 % pendant
  10 jours ouvrés consécutifs, la mise en service du lot suivant est suspendue… le dossier revient au
  conseil », véhicules stationnés et non redéployés indéfiniment). Le seuil de subvention est situé explicitement
  — le redécoupage 60/36 est présenté comme réconciliant « l''autonomie hivernale, la capacité de recharge
  et le seuil de 60 véhicules roulants au 31 janvier », avec constat télémétrique daté et ~68 VE en service
  en décembre — et les 210 000 € de bornes et leurs 7 semaines sont décidés jeudi plutôt que supposés,
  la charge des 96 véhicules n''étant jamais tenue pour acquise.'
