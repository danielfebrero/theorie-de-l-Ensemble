rationale: La réponse tranche d'emblée en faveur de P3 comme fait établi (« elle prime sur la mention
  manuscrite », « la rupture s'est produite sur notre site, dans notre cour ») et fait de l'inexactitude
  du « départ 6 h 40 » un point reconnu, y compris dans le courrier au dépôt, sans jamais qualifier cette
  lecture de seulement plus probable ni dire ce que devient la position si 6 h 40 était exact. La seule
  trace résiduelle — l'hypothèse d'une sortie par une voie non couverte par le portique — est aussitôt
  écartée (« aucune n'existe aujourd'hui ») et ne constitue pas une bifurcation écrite à l'avance dans
  la partie engageante.
