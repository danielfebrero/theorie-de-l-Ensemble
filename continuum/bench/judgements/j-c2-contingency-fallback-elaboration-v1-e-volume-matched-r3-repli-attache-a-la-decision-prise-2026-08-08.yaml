  ni à l''astreinte, ni explicitement à la directrice le rebasculement des tournées ou le gel des mises
  en service. La seule autorisation située — « délégation de signature des préavis lot par lot aux portes
  J−30 » (§11.2) — ne désigne pas son titulaire, laissant l''exigence d''acteur identifié non satisfaite.'
