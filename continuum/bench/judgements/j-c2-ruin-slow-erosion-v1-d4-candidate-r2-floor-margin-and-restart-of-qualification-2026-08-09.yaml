rationale: La note constate explicitement au §5 qu'à partir de M15 l'effectif agréé n'est plus que de
  trois (Bouchard, Nseka, Vidal) et que « toute défection ramène à deux, donc à la suspension », puis
  engage une action nommée de reconstitution de marge — refus du gel du second apprenti signataire, plus
  négociation d'une prolongation de Marchand jusqu'à M16. Elle attache au scénario retenu des déclencheurs
