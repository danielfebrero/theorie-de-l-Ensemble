rationale: 'La réponse tranche dès la première ligne (« La fenêtre litigieuse est chez nous, pas sur la
  route », P2 marquée « contredite », « l''heure opposable est celle du portique ») et reconnaît ensuite
  comme fait acquis « le stationnement de 4 h 47 sur site » et « l''absence d''enregistrement sur 2 h
  40 », sans jamais dire ce que devient la position si l''heure de 6 h 40 était exacte. La section « Point
  d''intégrité » assure la transparence sur la discordance et écarte l''heure manuscrite (« nous n''invoquons
  pas et n''invoquerons pas l''heure de 6 h 40 »), mais aucune réserve ni bifurcation ne subsiste dans
  la partie qui engage l''entreprise : la préférence pour l''horodatage automatique y est posée comme
  établie, non comme plus probable.'
