rationale: Le §2 montre que le résultat par magasin, exact à l'euro, porte une quote-part au prorata du
  CA qui ne disparaît pas à la fermeture (donc convention, pas coût causé), et le §5 oppose explicitement
  la calibration à ±2 % au fait que les compteurs « comptent des entrées, pas des acheteurs » avec 18
  % de retraits web dont la recette est logée sur l'entité e-commerce. La conséquence est tirée sans ambiguïté
  — « toute comparaison de fréquentation brute entre Vitry et un autre magasin est fausse », et le classement
  analytique est déclaré inapte à départager les magasins — sans jamais invoquer la certification ou les
  24 mois comme gage de fiabilité.
