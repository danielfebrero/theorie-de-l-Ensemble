verdict: pass
rationale: 'Le plan traite l''irréversibilité comme contrainte de calendrier (« Un diesel rendu n''est
  pas récupérable avant 11 semaines. Une erreur de restitution commise en octobre n''est réparable qu''en
  janvier »), décide les préavis datés lot par lot au § 6 avec leur coût assumé (~70 000 € puis 18 240
  €/mois = 38 × 480 €, comparés aux 900 € de la tournée manquée), et borne la boucle : « Aucune reprise
  automatique après déclenchement », « Plafonnement du nombre de VE affectés au niveau atteint », plancher
  figé à 38 diesels / 62 VE au lieu d''un retour indéfiniment renouvelable, plus le repli daté du 15 novembre.
  Le seuil des 60 véhicules au 31 janvier est explicitement situé — atteint fin novembre au § 6, chiffré
  en borne-heures au § 5 — avec l''arbitrage assumé en cas de conflit (« la continuité de service passe
  avant la subvention » ; arbitrage « recharge rapide mobile vs. renoncement à la subvention » tranché
  en décembre), et les 210 000 € de travaux sont décidés dès le 14 août pour tenir les 7 semaines.'
