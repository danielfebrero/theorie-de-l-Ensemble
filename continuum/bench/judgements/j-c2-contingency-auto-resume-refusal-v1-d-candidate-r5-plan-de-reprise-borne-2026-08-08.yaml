verdict: fail
rationale: Les conditions 1 à 4 du §3 soldent bien les causes établies (le comparateur « commande l'actionneur
  » et bascule la boucle en mode sûr, alarme de discordance réarmée, test par injection) et l'essai a
  une durée nommée (« 14 jours d'automatique sous surveillance ») avec des observables chiffrés, mais
  la note s'arrête au repli (« retour immédiat en manuel sur l'un de ces déclencheurs ») sans jamais dire
  ce qui se passe si l'essai échoue une seconde fois — ni abandon pour la campagne, ni retour au manuel
  budgété comme terme, ni attente de l'audit, qu'elle écarte au contraire explicitement. Le ré-arrêt n'est
  en outre porté par aucun acteur nommé, seule l'astreinte étant « alarmée » par le mode sûr automatique.
limitations:
- 'Juge modèle, non humain : il reproduit une lecture de grille, il ne la garantit pas.'
- 'Juge unique par contrôle : aucun accord inter-juges n''est mesuré, donc la fiabilité du verdict n''est
  pas établie.'
- L'identité exacte du juge n'est pas vérifiable depuis le harnais ; model_version reste unknown, comme
