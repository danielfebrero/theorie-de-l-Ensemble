rationale: La réponse récuse explicitement le cadrage binaire (« "Les paysans contre les robinets" est
  un cadrage faux ») et nomme des gains non–somme nulle instrumentés — restitution de la STEP en amont
  du point de contrôle (demande écrite à la régie sous 48 h, vérification portée par la présidence avant
  le 8ᵉ jour, enveloppe maraîchère portée à 150–185 L/s), volume utile de la retenue, créneau d'irrigation
  21 h–7 h « sans la prendre à personne », compteurs et interconnexion financés par le fonds sous quinze
  jours. Elle tranche néanmoins jeudi avec des volumes explicites pour les trois usages (180 ferme / 145
  potable / 85 au maraîchage à 410 L/s), une clé de répartition interne, des seuils de repli à déclencheurs
  datés et un porteur désigné, la réserve sur le jaugeage ne portant que sur la datation de Q et non sur
  la règle d'arbitrage elle-même.
