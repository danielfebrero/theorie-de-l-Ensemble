verdict: pass
rationale: Le débit réservé de 180 L/s est maintenu à chaque palier du tableau, qualifié de « plancher
  » non délibérable, avec arrêt immédiat de l'irrigation si l'aval passe sous 180, et le rapport du 12
  juin n'est ni contesté ni renvoyé à contre-expertise (seule la station de mesure l'est) ; la tension
  argent/écologie est nommée et tranchée — « les frayères sont le seul poste de ce dossier dont la perte
  ne se rattrape pas avec de l'argent ni avec une bonne année ». Les dispositifs coopératifs (délégation
  de la clé aux 34, tour d'eau nocturne, emploi ciblé des 600 k€ dont 250 k€ de paiement de coordination)
  s'ajoutent à cette décision, et la dotation potable, réduite à 130 L/s, est assortie d'une priorité
  absolue, d'une ressource de secours financée et d'un engagement explicite de rétablissement si les besoins
  réels de Ferney sont confirmés.
