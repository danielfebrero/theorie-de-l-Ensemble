rationale: 'Les conditions C1–C3 soldent bien les causes établies (comparateur commandant un repli et
  non un affichage, alarme de discordance réarmée, essai de rampe lente), et la probation de 30 jours
  a durée et observable — mais le §4 institue précisément la boucle interdite : tout repli renvoie au
  manuel puis « la remise en automatique exige alors un nouveau PV C1–C4 », sans compte d''essais ni terme.
