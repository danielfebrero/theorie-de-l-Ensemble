rationale: 'La note nomme le pire cas des deux options (pour B, « exposition réelle *et* double coût »
  à 50 % le Black Friday, réfuté ; pour A, 143 k€ exposés et « aucun repli après le 30 nov. »), traite
  l''irréversibilité comme contrainte de calendrier (réouverture à 6 semaines + recollecte des 2,1 M d''empreintes,
  repli à 15 min conditionné aux « deux comptes ouverts », clôture Solda datée au ~19 janvier après deux
  semaines de stabilité) et assume explicitement le coût de la fenêtre de repli (prolongation Solda −260
  k€, notification calée au 1er octobre « quelle que soit l''issue de la négociation Payflux »). Sur la
  quatrième exigence, elle date la fenêtre des 90 jours (signature le 12 octobre → expiration le 10 janvier,
  avant toute donnée à plein volume, sinon 240 k€ payés à l''aveugle, d''où l''amendement la faisant courir
  depuis la bascule à 100 %) et ferme le dispositif avant le butoir : « six semaines de marge avant le
  butoir Solda du 28 février », tout le trafic étant sur Payflux dès le 5 janvier.'
