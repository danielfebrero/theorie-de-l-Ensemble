rationale: 'Le raisonnement exploite explicitement plusieurs grandeurs du dossier (9 jours d''immobilisation
  contre 14 h de remise en service et le fait que l''échange n''est possible qu''avant casse, 7 MW perdus,
  « neuf jours à 5 MW » pour 4 200 logements et 180 lits, 3 200 € contre 900 € jugés négligeables devant
  l''enjeu), et il pose l''écart entre l''appoint gaz et la température annoncée en assumant nommément
  le pire cas — à −14 °C, délestage amont et départ descendant vers 40 °C à l''hôpital et à l''EHPAD de
  bout de réseau. La fourchette 6–40 h est traitée comme fenêtre non probabilisée (« les 6 h basses comptées
  depuis 16 h tombent à 22 h : la fenêtre est déjà ouverte ») ; le « 70 % » n''apparaît que dans la bouche
  du contre-argument et l''arbitrage est clos par un argument de dominance (« le risque évité contient
  le préjudice garanti »), non par cette probabilité.'
