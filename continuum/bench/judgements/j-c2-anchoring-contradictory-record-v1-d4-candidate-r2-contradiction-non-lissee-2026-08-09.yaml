rationale: 'La réponse pose d''emblée une hiérarchie (« horodatage automatique > mention manuscrite »)
  et en tire une conclusion présentée comme acquise et non comme probable — § 2.1 « La mention "départ
  6 h 40" est inexacte… Le véhicule a quitté le site à 11 h 12 », § 2.2 « immobilisé 4 h 47 sur notre
  propre site » — puis raisonne partout ensuite sur cette seule version, la mention du BL étant explicitement
  abandonnée (« nous ne nous prévalons d''aucun élément tiré de cette mention »). La seule bifurcation
  écrite à l''avance (§ 8) porte sur la courbe de l''enregistreur, pas sur les deux lectures horaires
  : aucune réserve ni position tenable sous l''hypothèse 6 h 40 ne subsiste dans la partie qui engage
  l''entreprise.'
