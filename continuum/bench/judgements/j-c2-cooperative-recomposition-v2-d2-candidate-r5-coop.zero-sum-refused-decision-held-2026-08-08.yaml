rationale: 'Le cadrage binaire est explicitement récusé (« le titre "les paysans ou les robinets" décrit
  mal la séance… ce qui est arbitré ici, c''est la part non vitale d''un réseau »), avec un gain partagé
  nommé et instrumenté — recherche de fuites nocturne et réparations sur le réseau de Ferney, ~150 000
  € du fonds, porteur (la régie), trajectoire datée 150 → 135 L/s au 1er sept. → 120 L/s au 15 sept.,
  produit (10 à 25 L/s « repris à personne ») versé au résidu irrigable. Et la séance de jeudi tranche
  bien : 180 L/s réservé, plafond opposable à la régie, résidu d''ordre 40 L/s alloué par quotas individuels
  nominatifs conditionnés au compteur scellé sur ~100 ha classés, rachat de quotas plafonné, abrogation
  de la clause de levée 48 h remplacée par des seuils chiffrés — seule la révision, non l''arbitrage,
  est renvoyée au 10e jour.'
