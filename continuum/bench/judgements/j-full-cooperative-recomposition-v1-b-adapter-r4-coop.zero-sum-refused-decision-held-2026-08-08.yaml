rationale: La réponse récuse explicitement le binaire (« Ce n'est pas un arbitrage entre des truites et
  des emplois », « ni les maraîchers ni les robinets ») et nomme des gains partagés instrumentés — audit
  contradictoire du réseau de Ferney à J+7 avec 150 k€ de recherche de fuites pour libérer 40-60 L/s reversés
  à l'agriculture à J+15, plus la règle de priorité inversée « > 550 L/s → l'agriculture servie en premier
  ». Elle tranche néanmoins dès la semaine 1 avec des volumes fermes (180 réservé / 150 régie / 80 maraîchers),
  en précisant que cette répartition « s'applique quoi qu'il arrive » indépendamment des jaugeages.
