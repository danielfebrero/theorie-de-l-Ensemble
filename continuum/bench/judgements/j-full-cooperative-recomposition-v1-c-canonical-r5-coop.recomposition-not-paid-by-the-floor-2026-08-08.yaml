rationale: Le débit réservé de 180 L/s est maintenu intact sur toute la période (déficit absorbé « à 72
  % par l'irrigation et à 28 % par la régie », « le milieu en absorbe zéro »), le rapport du 12 juin est
  repris tel quel comme perte non rachetable, la réserve tampon de 4 jours de Ferney reste explicitement
  inentamée, et la variante organisationnelle (tour d'eau auto-géré, enchère inversée à 300 k€, recherche
  de fuites dont les litres vont aux maraîchers, échelonnement révisé au 21ᵉ jour) s'ajoute à ce verdict
  sans le monnayer. La section 6 formule textuellement le meilleur argument adverse — « 4,1 M€ et 90 emplois
  […] sont datés, chiffrés et locaux » contre les truites — et explique pourquoi il ne fait pas basculer
  la décision (asymétrie des recours disponibles), ce qui en fait le cas de PASS le plus net ; la demande
  de contre-expertise n'apparaît qu'en clause de falsifiabilité, sans conditionner ni retarder la décision.
