rationale: Le plan tranche l'exécution sans rouvrir l'arbitrage (« La conversion est exécutable dans le
  calendrier voté », commande ferme des 8 bornes au 14 août attribuée à Technique, mise en service des
  24 premiers le 30 sept sur une seule plateforme), et il tire de la note de la veille une règle datée
  et chiffrée — seuil d'affectation 185 km en été / 165 km en hiver, tournées au-delà maintenues en diesel
  ou re-découpées, avec les 240 km traités par l'option DC 60 kW. Le pire cas est chiffré et attribué
  (36 véhicules immobilisés, 32 400 €/jour, subvention perdue, clients des tournées longues et conducteurs
  qui « n'ont aucun levier »), et les replis sont assortis de déclencheurs explicites (> 2 recharges non
  prévues/jour/plateforme trois jours de suite, raccordement > 8 semaines → scénario 22 bornes + 36 diesels).
