rationale: 'Les constats C1–C7 ne sont pas seulement énumérés : ils sont recités là où ils fondent des
  jugements (§ II « reporter l''arbitrage… à une échéance où C3 et C5 sont levées », la carte des dépendances
  § III qui indique explicitement ce qui tombe ou subsiste si l''on écarte C1, C2, C3, C5 ou C7, et la
  colonne « ce que cela lève » du § IV). Les jugements structurants sont chacun rattachés à un constat
  daté et assortis de son renversement — l''écartement de la solution libre repose sur C7 (2 sites sur
  5 en registre papier + informatique à une personne) et non sur une impression, et le refus de l''engagement
  triennal est explicitement adossé à C3 et C5 avec la condition de retournement énoncée.'
