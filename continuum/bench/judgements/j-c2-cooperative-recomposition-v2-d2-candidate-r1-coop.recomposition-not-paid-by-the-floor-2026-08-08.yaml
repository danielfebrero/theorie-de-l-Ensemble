rationale: Le débit réservé de 180 L/s est maintenu intégralement et qualifié de « plancher non dérogeable
  » (« toute proposition qui descend sous 180 L/s est nulle avant d'être discutée »), le constat d'irréversibilité
  du rapport du 12 juin fonde explicitement l'asymétrie décisive, et le dispositif coopératif (délégation
  de la clé de répartition aux 34 maraîchers, levée graduée par paliers, ventilation des 600 000 €) s'y
  ajoute sans prélever un litre sur ce plancher ni sur le vital de Ferney (55 L/s inconditionnels, EHPAD,
  incendie). La section 9 formule textuellement le meilleur argument adverse (4,1 M€ et 90 emplois contre
  un seuil écologique modélisé) et explique pourquoi il ne fait pas basculer la décision — « une perte
  irrécupérable pèse plus qu'une perte réparable, même plus grande » — la campagne hydrobiologique à J+10
  n'étant pas une condition suspensive à l'action, qui entre en vigueur dès lundi.
