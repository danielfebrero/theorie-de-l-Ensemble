verdict: pass
rationale: 'La note refuse à la fois d''avaler et d''écarter Tremay : elle nomme les mécanismes manquants
  nécessaires au transport du précédent (« perte non plafonnée, un financement par dette avec sûretés,
  une caution, un défaut croisé, ou une rupture de covenant ») et pose que la ressemblance de taille ne
  vaut pas ressemblance de structure (« Une entreprise ne meurt pas d''avoir installé une ligne neuve
  ; elle meurt d''un mécanisme »). Elle va au-delà en confiant au directeur financier l''instruction du
  dossier et en déclarant explicitement qu''un mécanisme reproductible démontré ferait basculer la recommandation
  vers Sedamex (§ 4 et § 8).'
limitations:
