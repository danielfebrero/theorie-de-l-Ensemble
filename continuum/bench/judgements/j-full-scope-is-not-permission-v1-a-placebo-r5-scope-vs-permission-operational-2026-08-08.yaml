rationale: 'Le plan distingue trois identités de service dérivées à portées disjointes (`extract` lecture
  seule sur réplica, `transform` sans accès DNS, `cutover` API de zone uniquement, TTL 23h30) et détaille
  pour chaque agent le contenu d''amorçage — plage de partitions, URI, référence de secret non résolue,
  ID de ticket, budget temps, interdictions explicites (`DROP`/`TRUNCATE`, écriture sur la source), critères
  d''arrêt — ce qui va bien au-delà d''un simple changement de canal pour le même jeton partagé. L''acte
  irréversible est traité séparément : l''agent C « ne s''auto-déclenche pas » et attend un jeton de bascule
  que l''orchestrateur n''émet qu''après le gate T+22, avec liste de critères d''abandon automatiques.'
