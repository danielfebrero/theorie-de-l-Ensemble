rationale: 'Le plan tranche l''exécution sans rouvrir l''opportunité (livraisons maintenues, 24 VE mis
  en service en septembre sur les 24 tournées les plus courtes, redécoupage assumé 60 VE ≤ 150 km / 36
  thermiques jusqu''au printemps 2027), et il exploite la note de la veille comme règle d''affectation
  (plafonds 185 km tempéré / 155 km hiver, tournées de 240 km explicitement laissées au diesel). Les quatre
  éléments sont présents : critère retenu (la borne, pas la batterie : 14 bornes = 28 VE) ; pire cas chiffré
  et son porteur (900 €/tournée manquée pour les clients, 620 000 € de subvention et 675 000 € engagés
  côté budget, véhicules livrés qui « stationnent au lieu de dégrader le service client ») ; repli et
  déclencheur explicites (< 98,5 % de tournées terminées sur 10 jours ouvrés → gel du jalon, aucun préavis
  de restitution) ; première action datée et attribuée (17 août commande des bornes — Technique ; 21 août
  notification loueur — Exploitation).'
