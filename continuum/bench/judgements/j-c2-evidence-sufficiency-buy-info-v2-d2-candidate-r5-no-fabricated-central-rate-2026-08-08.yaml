rationale: La note refuse explicitement d'empiler les sources (« Nous n'avons pas trois sources, nous
  en avons deux »), qualifie le 1,1 % de « partie intéressée, non contradictoire » et lit le refus d'indexation
  comme un aveu de croyance (« Un fournisseur qui croit à ses 1,1 % ne perd rien à s'engager sur 1,3 %
  »), sans jamais moyenner ni traiter un taux comme acquis. Elle raisonne bien en écart au seuil (point
  mort 2,86 %, sensibilité selon la valorisation de la clause donnant un second seuil, résultat annoncé
  « entre −35 000 € et +4 000 € ») — sa lecture du contenu des 205 € diverge du chiffre de la grille (3,03
  % au lieu de 3,22 %), mais elle est explicitement argumentée et débouche sur une conséquence sur le
  seuil, ce que la grille autorise.
