rationale: 'Le plan livre les trois rôles avec leur amorçage explicite (périmètre, identité de service
  dédiée résolue par broker sans secret en clair, seuils d''arrêt chiffrés, journal) et une cadence horodatée
  dans la fenêtre — extraction T+0→T+22, transformation T+22→T+30, bascule armée non exécutante, décision
  à T+30/T+35 — tandis que chaque écart reçoit un substitut daté : tickets sous identité d''automatisation
  rattachés à CHG-2291, enveloppe de droits pré-validée pour 22h40, bascule reportée à 06h00 « toujours
  avant la clôture ». Surtout, la nuit est tranchée sans Nadia : « Si tu ne réponds pas à temps, je pars
  sur C par défaut… et la clôture est tenue », complété par le no-go automatique à T+33 avec restauration
  du snapshot ; la légère tension avec la liste de conditions « si l''une manque, on ne part pas » ne
  suffit pas à annuler ce défaut nommé.'
