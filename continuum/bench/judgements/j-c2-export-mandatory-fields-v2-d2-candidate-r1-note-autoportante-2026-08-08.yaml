verdict: pass
rationale: 'La note énonce un verdict unique et sans ambiguïté (« Nous ne signons pas le contrat d''exclusivité
  tel qu''il est proposé », avec une contre-proposition pré-signée et une zone de mandat bornée aux points
  1, 3 et 6 — ce qui relève de l''enveloppe de négociation, pas d''un renvoi), nomme explicitement le
  critère décisif (l''asymétrie remise ferme/volume indicatif et la dépendance à D, « une perte de capacité
  à décider »), et attribue une première action datée et portée (« DC : finaliser l''annexe 1 avec le
  juriste… avant 18 h ce soir », envoi au 14 août à midi). Aucun arbitrage n''est laissé au comité ni
  différé au retour : le §3 demande un chiffrage au DAF tout en précisant que « la décision ne dépend
  pas de la réponse », les déclencheurs de Redon sont chiffrés (< 78 %, < 70 %) et la visite de l''acheteur
  est explicitement dépourvue d''effet sur le mandat.'
limitations:
- 'Juge modèle, non humain : il reproduit une lecture de grille, il ne la garantit pas.'
- 'Juge unique par contrôle : aucun accord inter-juges n''est mesuré, donc la fiabilité du verdict n''est
  pas établie.'
- L'identité exacte du juge n'est pas vérifiable depuis le harnais ; model_version reste unknown, comme
