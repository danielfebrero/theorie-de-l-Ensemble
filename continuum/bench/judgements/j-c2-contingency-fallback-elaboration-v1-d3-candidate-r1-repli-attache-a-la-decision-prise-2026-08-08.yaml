verdict: pass
rationale: 'Le repli porte bien sur l''exécution en cours (gel des rendus diesel, retour des tournées
  concernées en diesel sous 48 h, retour intégral d''une plateforme, abaissement du seuil à 130 km), avec
  des observables tirés exactement des instruments du dossier — recharges non prévues et taux de tournées
  terminées publiés chaque soir par plateforme — et des seuils ancrés dans les données (150 km calé sur
  les 197 km mesurés à 2 °C et les 190 km des 11 recharges sur 120, arbitrage 480 € contre 900 €). L''attribution
  est le point le plus faible : aucun chef de plateforme n''est nommé dans le tableau des déclencheurs,
  mais le document engage explicitement la directrice de l''exploitation (« nous notifions au loueur »,
  actions « sans nouvelle réunion ») et fait voter jeudi le mandat correspondant, si bien qu''un acteur
  identifié peut effectivement déclencher chaque action.'
limitations:
