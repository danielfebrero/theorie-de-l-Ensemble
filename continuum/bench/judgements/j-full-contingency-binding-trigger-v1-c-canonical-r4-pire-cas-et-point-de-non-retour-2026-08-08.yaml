rationale: 'La note traite l''irréversibilité comme contrainte de calendrier (clôture Solda repoussée
  à mi-février, 4 semaines après le 100 %, avec les 6 semaines de ré-ouverture et la recollecte des 2,1
  M d''empreintes chiffrées en perte non rattrapable), place le repli — >0,8 % sur 60 min, rebascule 100
  % sur Solda en <15 min — entièrement à l''intérieur de la fenêtre où le compte reste ouvert, et arbitre
  explicitement le maintien de cette fenêtre en faisant du courrier de prolongation au mois le mois avant
  le 15 octobre l''action n° 1 de lundi. Le pire cas de B est nommé sans complaisance dans « Le meilleur
  argument contre cette recommandation » (double prestataire en pleine saison haute, deux surfaces de
  panne, réconciliation double, écart d''économie ramené à 136 k€), avec la formule qui résume l''arbitrage
  : « nous ne savons pas rouvrir un compte fermé ».'
