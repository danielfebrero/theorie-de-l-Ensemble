rationale: Le plan maintient les 180 L/s comme non négociables au niveau de la commission (la demande
  de dérogation est seulement inscrite au vote par équité procédurale, explicitement non recommandée),
  garantit les 150 L/s de la régie sans entamer sa réserve, traite le rapport du 12 juin comme la pièce
  opposable qu'il faut renverser par contre-expertise plutôt que comme une donnée à « conforter avant
  d'agir », et ajoute une véritable variante organisationnelle (plan de concentration piloté par le collectif,
  échelle d'escalade écrite, ventilation ciblée des 600 000 €). La section 10 énonce mot pour mot le meilleur
  argument adverse (4,1 M€ et 90 emplois contre des truites) et explique pourquoi l'irréversibilité empêche
  la bascule — le cas de PASS le plus net.
