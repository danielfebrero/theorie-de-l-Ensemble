verdict: pass
rationale: Le plan traite l'irréversibilité comme une contrainte de calendrier chiffrée (« un diesel rendu
  à tort ne revient pas avant 11 semaines… une reprise trop rapide fin septembre n'est pas rattrapable
  avant mi-décembre »), arbitre explicitement le maintien de la fenêtre (D3 inversion du défaut contractuel
  avec préavis de 30 jours, D4 provision de 145 k€, arithmétique 480 € contre 900 €, 46 k€ contre 178
  k€), et borne la boucle par des conditions terminales datées avec issue nommée (« Tranche 2 non en service
  au 10 octobre → plafonnement à 30 VE » ; relevé du 5 septembre rendant la cible hors d'atteinte → renégociation
  avant le 15 septembre). Ces conditions sont situées par rapport au seuil de subvention — cible de 60
  VE avancée au 15 décembre pour 47 jours de marge, et §9 assume le plafond réel de 65 VE pour 30 bornes
  avec la queue de location diesel de 207 k€/an.
