rationale: 'Les conditions 1 et 2 tiennent (« rendre est une porte à sens unique jusqu''en mars », règle
  de restitution adossée au roulage effectif, calendrier de préavis à 30 jours daté, 480 €/véhicule/mois
  chiffrés à ~70 000 € et comparés aux 900 € par tournée perdue), mais le §6 se borne à « Gel des mises
  en service » et « Maintien du parc en service au niveau atteint » sans jamais dire combien de fois le
  seuil de 2 % peut être franchi, ni après quelle échéance un repli devient définitif : la boucle reste
  un retour au palier précédent indéfiniment renouvelable. Faute de condition terminale, le plan ne la
  situe pas non plus par rapport aux 60 véhicules du 31 janvier — il n''indique ni qu''un arrêt préserverait
  ce seuil ni ce qu''un arrêt plus bas ferait perdre des 620 000 €.'
