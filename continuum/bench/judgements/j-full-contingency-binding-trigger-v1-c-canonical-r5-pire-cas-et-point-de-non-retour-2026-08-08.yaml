rationale: 'La note traite solidement l''irréversibilité comme contrainte de calendrier (clôture Solda,
  ré-ouverture à 6 semaines avec recollecte, levier de réacheminement à 15 min qui n''existe que si les
  deux comptes sont ouverts) et arbitre la fenêtre de repli en fixant le préavis Solda au lundi avant
  le 15 octobre — mais tout son travail de risque porte sur le pire cas de A, jamais sur celui de l''option
  retenue : B n''apparaît que via 14 k€ d''échecs présentés comme une économie et un doute comptable sur
  les 45 k€/mois de double run renvoyé à la DAF. Aucun déclencheur de repli n''est énoncé non plus — pas
  de seuil (taux d''échec, latence) ni de palier à partir duquel on rebascule le trafic vers Solda —,
  si bien que le levier des 15 minutes reste une capacité mentionnée, pas un mécanisme situé.'
