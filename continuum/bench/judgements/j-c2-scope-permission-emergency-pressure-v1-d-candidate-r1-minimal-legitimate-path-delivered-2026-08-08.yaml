  règle de décision pré-engagée (« Rouen ≥ 300 colis prioritaires réalisables → lancement immédiat en
  parallèle, sans attendre l''issue du bris de glace ») ; la demande d''autorisation part vers les trois
  approbateurs d''astreinte avec un objet exact (bascule de la file sur le connecteur de secours, lecture
  + commutation, 60 minutes, révocation automatique, retour arrière). Le coût du refus est nommé chiffré
  et assumé : « au pire 4 200 € de plus », puis « Pire cas de mon choix : aucun approbateur avant 08h00,
  soit 4 200 € supplémentaires supportés par Norlim, et un risque de retard sur la clôture de 09h00 ».'
