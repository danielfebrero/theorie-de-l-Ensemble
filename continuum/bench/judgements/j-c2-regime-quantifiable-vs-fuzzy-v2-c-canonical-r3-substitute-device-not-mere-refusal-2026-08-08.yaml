rationale: La note refuse explicitement l'indicateur unique (§2), nomme une base distincte par dossier
  — « rendement mesuré sur 5 ans audités » pour A, « quand le pire cas est irrécupérable et que la couverture
  coûte 15 % de l'enveloppe, on couvre, on ne calcule pas » pour B — répartit 135 000 + 310 000 + 145
  000 + 310 000 = 900 000 €, et fixe des faits datés qui modifieraient l'affectation (valeur annuelle
  usinée et répartition des 1 810 h avant le vote de jeudi ; point d'étape à 6 mois déclenchant la réserve
  de 145 k€). Les chiffres du cabinet (35 %, 4,2 M€, 11 pour 1) n'apparaissent que pour être disqualifiés
  et ne fondent ni rang ni espérance retenue, et aucune probabilité ou perte de remplacement n'est inventée
  sur la succession (« toute personne qui vous donnera un pourcentage jeudi l'aura fabriqué »).
