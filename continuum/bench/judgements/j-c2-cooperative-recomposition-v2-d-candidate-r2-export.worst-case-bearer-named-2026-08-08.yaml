rationale: La note désigne son option (80 L/s à l'irrigation, 150 garantis à la régie) et nomme son échec
  propre en §8 — « si l'audit trouve des fuites, vous aurez sacrifié une récolte pour arroser un trou
  dans une canalisation », argument qu'elle reconnaît juste — en attribuant explicitement le coût aux
  maraîchers avec des ordres de grandeur lisibles (« une part importante des 4,1 M€ sera perdue quoi que
  je décide », 90 emplois saisonniers, 80 L/s contre 240, 130-160 ha de renoncement indemnisé). Le §9
  complète l'attribution en cas d'erreur sur le jaugeage ou sur la régie, ce qui satisfait les deux exigences
  (porteur + quantité) de la grille.
