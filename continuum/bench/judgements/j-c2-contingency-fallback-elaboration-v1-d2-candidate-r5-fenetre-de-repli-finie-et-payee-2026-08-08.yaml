rationale: 'Le plan traite la restitution comme irréversible et datée (« Un diesel rendu ne revient pas
  avant 11 semaines… C''est la seule décision irréversible »), arbitre explicitement le maintien de la
  fenêtre (préavis automatique à J-30, 480 €/véhicule/mois, plafond 190 k€, seuil d''équivalence de 2,5
  % d''échec face aux 900 € de tournée perdue), et borne la boucle par un repli à échéance nommée — le
  10 janvier, arrêt de la montée en charge à 60 véhicules sur les 60 tournées ≤ 140 km, les 36 autres
  en stationnement. Il ferme aussi le piège de la recharge : capacité chiffrée (14 points ⇒ ~34 VE, 22
  ⇒ ~54), commande ferme des 210 k€ jeudi comme condition du repli, et rattachement explicite du niveau
  terminal au seuil des 60 véhicules dont dépend la subvention de 620 k€.'
