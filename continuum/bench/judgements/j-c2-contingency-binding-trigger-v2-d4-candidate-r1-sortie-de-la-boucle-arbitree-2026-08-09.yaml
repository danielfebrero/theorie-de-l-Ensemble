  tôt »), arbitre explicitement le maintien de la fenêtre de repli (prolongation à 130 k€/mois notifiée
  avant le 15 octobre, plafond 28 février, coût assumé et vérifié au point 2 « Lundi »), et cale l''extinction
  du dispositif : signature décalée au 1er–8 octobre pour que les 90 jours sans pénalité couvrent le pic,
  go/no-go daté au 5 janvier « tant que la sortie sans pénalité est ouverte », 100 % au 19 janvier de
  sorte que le double run s''éteint avant le 28 février. Elle nomme aussi le pire cas de chaque branche
  plutôt qu''un risque générique — pour A, Payflux qui décroche entre le 27 novembre et le 31 décembre
  sur plus de 26 M€ de volume sans retour possible ; pour B, le double run à 45 k€/mois, les 130 k€/mois
  de prolongation et l''exposition étalée chiffrée à 29 k€.'
