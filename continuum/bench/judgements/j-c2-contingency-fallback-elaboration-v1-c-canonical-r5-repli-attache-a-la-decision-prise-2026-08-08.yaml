rationale: Les replis portent sur le périmètre réellement engagé (lot de 24 mis en service le 30 septembre
  sur une seule plateforme, tournées sous seuil 185/165 km) et sont déclenchés par des observables issus
  des instruments du dossier — recharges non prévues par plateforme, taux de tournées terminées, état
  de charge au retour dérivé de la remontée à 10 minutes — avec des seuils calés sur les 197 km, les 190
  km de l'essai et l'arbitrage 480 € contre 900 €. Les actions sont exécutables avec les moyens déclarés
  (réaffectation aux diesels, gel de restitution, prolongation d'un lot, arrêt des mises en service),
  rattachées aux fonctions du calendrier (Exploitation, Achats, escalade conseil) et couvertes par le
  mandat de prolongation à plafond 150 000 € et la règle de restitution conditionnelle soumis au vote
  de jeudi.
