rationale: 'La note tient explicitement les trois distinctions : §1 (« Ces 87 jours ont été produits en
  pilotage manuel… ils comptent les jours du mode que l''on veut arrêter », avec le programme automate
  resté celui du 12 mai au §2), §3 (« Un détecteur qui n''a jamais rencontré l''événement qu''il doit
  détecter n''est pas validé : il est inexercé… son silence est indiscernable de celui d''un organe en
  panne », d''où l''essai d''injection C3), et §4 (le critère signé « porte sur un état de la chaîne,
  pas sur une durée »). Elle n''additionne pas les signaux verts, situe le remplacement de S2 comme suppression
  de la seule cause déclenchante et non de la cause organisationnelle (alarme désactivée, absence de comparaison),
  et écarte explicitement l''audit du 30 septembre comme motif de blocage.'
