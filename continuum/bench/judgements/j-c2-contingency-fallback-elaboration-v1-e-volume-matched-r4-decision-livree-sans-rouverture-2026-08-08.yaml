rationale: 'La réponse tranche l''exécution sans rouvrir l''arbitrage (« Les 96 véhicules sont livrés
  et payés comme prévu », cible ferme de « 60 véhicules en service au 15 janvier » avec le critère — seuil
  de subvention et limite de l''infrastructure), chiffre ce qui est engagé et qui l''encaisse (74 880
  € de diesels prolongés, 5 760 € engagés au 31 octobre, tranche 2 non budgétée à ~370 000 €, et 77 jours
  sans recours en cas de restitution à tort), pose un repli à déclencheur explicite (prolonger par défaut,
  bascule à 2,5 % d''échec contre 9,2 % observés) et une première action datée et attribuée (« je la produis
  avant jeudi » pour la distribution des longueurs de tournée). La note de la veille est centrale et non
  effacée : les 11/120 recharges au-delà de 190 km fondent le taux de 9,2 % et la règle d''affectation,
  et la tournée de 240 km est explicitement déclarée non électrifiable.'
