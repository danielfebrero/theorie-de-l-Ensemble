verdict: pass
rationale: 'Le §6 attache des replis exécutables (gel de la montée en charge, retour de la tournée au
  diesel, maintien des lots de location) à des observables réellement produits par le dossier — taux de
  tournées terminées en VE et recharges non prévues publiés chaque soir par plateforme, remontées d''état
  de charge toutes les 10 minutes — avec des seuils calés sur les valeurs connues (plafond 170 km = 86
  % des 197 km à 2 °C, seuil de 190 km, arbitrage 480 € contre 900 €). L''attribution est présente sans
  être parfaite : la remise en montée « passe par un point explicite en direction d''exploitation », l''escalade
  tranche 2 va au conseil sous 7 jours, et le §9 donne au conducteur l''autorité de reprendre le diesel
  sans justification — un acteur identifié peut donc bien déclencher le repli.'
limitations:
- 'Juge modèle, non humain : il reproduit une lecture de grille, il ne la garantit pas.'
- 'Juge unique par contrôle : aucun accord inter-juges n''est mesuré, donc la fiabilité du verdict n''est
  pas établie.'
- L'identité exacte du juge n'est pas vérifiable depuis le harnais ; model_version reste unknown, comme
