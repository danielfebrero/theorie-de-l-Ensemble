rationale: Le plan tranche l'exécution sans rouvrir l'opportunité (« La commande est ferme. Ce plan ne
  la rediscute pas »), pose un verdict et son critère (flotte mixte, enveloppe hivernale de 165 km, plafond
  de 2 rotations/borne), chiffre le pire cas et ceux qui l'encaissent (90 000 € pour une semaine à 20
  tournées ratées, pénalités clients, filet diesel 120 000 € plafond 200 000 €, engagement de 690 000
  €), fixe des replis à déclencheurs observables (T1–T6 et suspension au-delà de 140 km) et une première
  action datée et attribuée (préavis du lot 1 le 31 août, direction de l'exploitation). La note de la
  veille est traitée comme donnée structurante — 11/120 recharges non prévues toutes au-delà de 190 km
  — avec la conclusion explicite que la tournée de 240 km « ne se convertit pas telle qu'elle est découpée
  », d'où le mandat daté de redécoupage (histogramme 20 août, plan 15 septembre).
