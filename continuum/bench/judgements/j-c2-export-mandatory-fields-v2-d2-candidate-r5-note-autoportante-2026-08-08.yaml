rationale: 'Le verdict est unique et sans ambiguïté (§2 : « Nous ne signons pas l''offre présentée »,
  avec contre-proposition déjà signée à transmettre le 10 août avant 12h), le critère décisif est nommé
  explicitement (§3 : le seuil de neutralité de la remise, +41 % de volume contre +18 % proposés, plus
  le poids de la pénalité de 1,2 M€ à 57 % de la trésorerie), et les premières actions ont porteur et
  échéance (§7 : DAF ligne de crédit 1,5 M€ avant le 20 août, DC marketplace le 20 août, DRH dossier Redon
  le 18 août). Aucun arbitrage n''est renvoyé : le §5 fixe une enveloppe bornée à six planchers avec co-signature
  obligatoire, le §8 pré-tranche les deux branches par seuils chiffrés, et les basculements du §9 reposent
  sur des faits objectivement vérifiables en interne (recalcul DAF validé par l''expert-comptable, accord
  écrit de la centrale) et non sur une délibération du comité.'
