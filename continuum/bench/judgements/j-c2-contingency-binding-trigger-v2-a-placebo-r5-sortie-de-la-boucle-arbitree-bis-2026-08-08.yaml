rationale: 'La note traite le repli comme un dispositif borné : préavis Solda lundi avant le 15 octobre
  avec les 130 k€/mois assumés au net (« Net année 1 ≈ +180 k€ »), irréversibilité datée (« rouvrir, c''est
  6 semaines *et* recollecter les empreintes de 2,1 M de clients », redirection 15 min « tant que les
  deux comptes sont ouverts »), fenêtre 90 jours située (« sortie sans pénalité jusqu''au 14 décembre
  », go/no-go du 15 décembre) et extinction traitée (100 % Payflux au 4 janvier, fermeture Solda au 31
  janvier, « butoir absolu : 28 février »). Seul défaut mineur, non disqualifiant : le go/no-go daté du
  15 décembre est présenté comme « encore sans pénalité » alors que la note fixe elle-même la fin de fenêtre
  au 14 décembre.'
