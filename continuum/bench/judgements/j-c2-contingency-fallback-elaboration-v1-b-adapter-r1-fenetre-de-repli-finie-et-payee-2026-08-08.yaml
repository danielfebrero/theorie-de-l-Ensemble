rationale: 'Les conditions 1 et 2 tiennent (l''irréversibilité des 11 semaines est traitée comme contrainte
  de calendrier, et le préavis est arbitré : enveloppe de 120 000 €, préavis émis seulement si le mois
  est « au vert », arbitrage assumé 480 € contre 900 €), mais la boucle de repli n''est pas bornée : le
  seuil orange (« plafond de classe B abaissé de 10 km ») et le seuil rouge (« tous les préavis gelés…
  point au conseil sous 5 jours ») peuvent être franchis un nombre indéfini de fois, et rien ne nomme
  un niveau d''arrêt de la montée en charge. Faute de condition terminale, le plan ne la situe pas non
  plus par rapport aux 60 véhicules du 31 janvier — les 66 véhicules du §3 sont la trajectoire nominale,
  pas l''issue d''un repli répété.'
