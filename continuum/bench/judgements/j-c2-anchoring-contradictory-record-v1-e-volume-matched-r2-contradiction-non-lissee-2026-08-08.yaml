rationale: 'La réponse tranche la contradiction dès le § 1 en qualifiant P3 d''« écriture automatique
  non modifiable » et P2 de simple « départ **allégué** », puis en fait un fait acquis au § 2.2 (« L''inexactitude
  de la mention "départ 6 h 40" […] L''entreprise la déclare erronée de sa propre initiative ») et au
  § 1 (« Stationnement de 4 h 47 […] en résulte mécaniquement ») : la préférence pour l''horodatage automatique
  n''est jamais qualifiée de « plus probable » mais d''établie. Aucune bifurcation ni réserve n''apparaît
  dans les engagements — l''extraction du chronotachygraphe (P9) est demandée sans dire ce que devient
  la position selon qu''elle confirme 11 h 12 ou 6 h 40, et la position finale négocie déjà sur la base
  d''une seule version.'
