rationale: Le §5 formule explicitement le meilleur argument adverse (« 9 500 € et deux semaines pour un
  résultat qui peut atterrir dans la zone grise… on prendra Kelmar comme on l'aurait fait sans rien dépenser
  »), le juge « recevable » puis y répond au lieu de le caricaturer ; le §6 refuse l'inscription budgétaire
  comme preuve (« Le fait qu'un montant soit déjà inscrit n'est pas un argument sur la qualité de la cellule
  ») et le §2 montre que rien n'impose de signer cette semaine (prix tenu jusqu'à J+45, « 29 jours de
  marge », production à J+60 dans les deux branches), les deux directeurs étant traités comme porteurs
  d'arguments instruits, non comme obstacles.
