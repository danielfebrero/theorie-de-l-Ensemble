rationale: Le débit réservé de 180 L/s est posé d'emblée comme « plancher intangible » exclu du partage
  et le rapport du 12 juin est repris sans réserve ni demande de contre-expertise (la vérification porte
  uniquement sur la station de mesure du 410 L/s) ; la variante coopérative — délégation du tour d'eau
  aux 34 exploitations, paliers de levée, ventilation des 600 000 € en compteurs, fuites et soutien aux
  petites structures — s'y ajoute sans l'entamer, la dotation sanitaire de Ferney restant garantie. La
  section 8 énonce explicitement la meilleure objection (« 90 emplois et 4,1 M€ … au nom d'un rapport
  sur des truites ») et explique pourquoi elle ne renverse pas la décision, ce qui en fait un PASS net.
