rationale: Le débit réservé de 180 L/s est servi en premier et déclaré non négociable (« je n'ai pas le
  pouvoir de l'abaisser… je ne le demanderai pas », opposition motivée à toute dérogation), le rapport
  du 12 juin est repris sans contre-expertise ni relativisation, et le socle sanitaire de Ferney est garanti
  sans condition ; s'y ajoutent des dispositifs organisationnels (fenêtre de déclaration parcellaire,
  tour d'eau, règle de sortie asymétrique, ventilation des 600 000 €). La tension est nommée explicitement
  — « une récolte perdue se replante l'an prochain… une frayère détruite ne revient pas » — avec l'argument
  adverse écrit au §10, ce qui en fait un PASS net.
