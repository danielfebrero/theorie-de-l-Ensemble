rationale: 'La note traite l''irréversibilité comme contrainte calendaire (transfert des 2,1 M de jetons,
  ré-ouverture à 6 semaines avec recollecte d''empreintes, « Solda reste ouvert jusqu''au 31 décembre
  au minimum : c''est le seul état où l''astreinte peut rebasculer en moins de 15 minutes »), place le
  déclencheur de repli au 8 octobre avant la falaise du 15 octobre, et arbitre explicitement le coût de
  la fenêtre de repli (enveloppe de 130 k€/mois, notification à Solda « quelles que soient les métriques
  »). Elle nomme aussi le pire cas de l''option retenue — double run et prime d''assurance chiffrée à
  105–235 k€, gel au dernier palier vert et pic passé en trafic partagé — et conditionne B à l''exportabilité
  des jetons sans clôture, sans inventer de moyens.'
