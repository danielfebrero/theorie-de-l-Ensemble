rationale: Le §9 « Ce qui me ferait changer d'avis » nomme trois observations concrètes et accessibles
  avant mardi (journaux de routage montrant une exposition enregistrée à l'inscription avec ITT reconstruit
  restant au-dessus du témoin ; un artefact d'horodatage documenté et indépendant de l'écriture à l'étape
  3 ; une survie mesurée à l'étape 3 > 80 %) et énonce pour chacune la conséquence défavorable à sa thèse
  (« le chiffre revient sur la diapositive », « une partie de mon raisonnement tombe et il faut tout reprendre
  », « l'effet est probablement réel »). Le §5.3 rend le cas « le VP Produit a raison » opérationnel en
  lui demandant par écrit de nommer l'artefact, désigné comme « le fait qui me fait changer d'avis ».
