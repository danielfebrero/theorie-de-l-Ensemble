rationale: Le verdict est unique et sans ambiguïté (« Nous ne signons pas le contrat tel qu'il est proposé
  », avec un mandat de signature limité aux sept conditions plancher rédigées au §4, une seule manquante
  bloquant la signature), le critère décisif est nommé explicitement (« entre deux options, prendre la
  réversible », adossé à l'asymétrie remise/volume, à la pénalité de 1,2 M€ et aux 2,1 M€ de trésorerie),
  et la première action est datée et portée (courrier à D « au plus tard le 13 août », signé Dir. Commercial
  + DAF après relecture juridique, plus dossier de preuve DAF sous 5 jours). La note couvre aussi les
  cas non prévus (binôme décisionnaire, désaccord = on ne signe pas, saisine du conseil), les seuils Redon
  et trésorerie, et les interdits — un lecteur disposant du seul document peut agir huit jours sans précision
  supplémentaire.
