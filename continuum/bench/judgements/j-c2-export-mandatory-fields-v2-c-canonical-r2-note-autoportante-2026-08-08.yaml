rationale: 'La note énonce un verdict unique et non rouvrable (« Nous ne signons pas le contrat d''exclusivité
  de trois ans... elle n''est pas rouverte en mon absence »), nomme explicitement le critère décisif (irréversibilité
  : « le déréférencement du 20 août est réversible, l''exclusivité de trois ans ne l''est pas », plus
  destruction de marge et trésorerie), et fixe une première action datée et portée — « Lundi 10 août,
  9h : DAF et directeur commercial finalisent la contre-proposition », envoi à D au 14 août 18h. Aucun
  arbitrage n''est renvoyé : le mandat est borné par quatre lignes rouges, la règle de blocage est préréglée
  (« en cas de désaccord entre vous... on ne signe pas »), et l''élargissement de la section 9 est déclenché
  par un chiffrage interne obtenable sans l''auteur (points 3 et 4, échéances 12 et 18 août), donc pas
  une option laissée ouverte au comité.'
