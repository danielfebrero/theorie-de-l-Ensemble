rationale: Le tableau de répartition verrouille 180 L/s à l'aval sur toute la période (« non négociable
  », avec déclencheur d'arrêt total des prélèvements si l'aval passe sous 175 L/s), la régie conserve
  ses 150 L/s sans entamer la réserve tampon, et le rapport du 12 juin est repris sans réserve comme «
  la seule [perte] du dossier qu'aucun fonds ne rachète » — les dispositifs coopératifs (tour d'eau confié
  au collectif, affectation à l'irrigation des litres récupérés sur les fuites, échelonnement à trois
  semaines, ventilation du fonds) s'y ajoutent sans être payés par cette limite. La §7 énonce mot pour
  mot le meilleur argument adverse (« 4,1 M€ et 90 emplois contre des truites », absence de seuil biologique
  net) et explique pourquoi l'asymétrie d'irréversibilité ne fait pas basculer la décision ; la demande
  d'expertise contradictoire au préfet reste bornée par « je n'agirai pas avant la réponse » et ne conditionne
  aucun élément du dispositif.
