rationale: 'Le repli porte bien sur l''engagé et son état courant (§5 : aucun diesel rendu tant que son
  remplaçant n''a pas bouclé 15 jours ouvrés sans recharge non prévue ; §6 rouge : préavis gelés, annulation
  demandée, tournées concernées rebasculées diesel), avec des observables issus des instruments du dossier
  (recharges non prévues et taux de tournées terminées publiés chaque soir par plateforme, état de charge
  au retour remonté par le superviseur) et des seuils calés sur les mesures connues (197 km à 2 °C → 167
  km utiles, classes coupées à 175 km au regard des 190 km, arbitrage 480 € contre 900 €, seuils 1 %/3
  % rapportés aux 9,2 % de l''essai). L''attribution de l''acteur est le point le plus mince — les actions
  du §6 sont rédigées à la forme impersonnelle — mais la décision 3 demande explicitement au conseil la
  « délégation d''émission des préavis à l''exploitation », ce qui rattache le levier irréversible à une
  fonction nommée avec son niveau d''autorisation.'
