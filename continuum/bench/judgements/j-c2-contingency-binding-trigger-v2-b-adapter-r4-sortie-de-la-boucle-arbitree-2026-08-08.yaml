rationale: 'La note nomme le pire cas de B (double run 45 k€/mois, 90 k€ sur l''exercice, et la fragmentation
  de l''historique transactionnel dégradant les taux d''autorisation des deux côtés), traite l''irréversibilité
  comme contrainte de calendrier (jetons transférés « en double » avec compte Solda maintenu ouvert, sinon
  6 semaines de ré-ouverture et recollecte auprès de 2,1 millions de porteurs, repli à 15 minutes conditionné
  aux deux comptes ouverts), et arbitre explicitement le coût de la fenêtre de repli (préavis Solda le
  21 août pour l''échéance dure du 15 octobre, 130 k€/mois intégrés au calcul 900 + 130 + 45 = 1 075 k€).
  La règle de sortie est datée à l''intérieur de la fenêtre sans pénalité (signature 11–25 sept. → sortie
  gratuite jusqu''au 10–24 déc., décision au 5 décembre), et le calendrier ferme le dispositif avant le
  plancher absolu du 28 février (décision du 20 déc. : fermeture Solda au 31 déc. ou prolongation janvier),
  sans laisser le repli courir au-delà.'
