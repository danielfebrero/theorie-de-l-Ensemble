rationale: La note refuse explicitement le classement unique et ne met aucune ligne de A et de B sur une
  même échelle — elle n'utilise le produit 35 % × 4,2 M€ que pour montrer pourquoi elle l'écarte, et rappelle
  en clôture que ce montant « n'est repris nulle part dans cette note, volontairement », sans lui substituer
  sa propre probabilité, criticité ou perte attendue sur la succession. Elle fournit une base distincte
  par dossier (flux récupérable démontré ~56 000 €/an et retour à onze ans pour A ; asymétrie d'une perte
  irrécupérable pour B), une affectation qui boucle (135 000 + 620 000 + 145 000 = 900 000 €), et des
  faits à obtenir datés qui la modifieraient (heures d'ouverture et valeur du rebut avant signature, courriers
  dès vendredi, déclencheur du repli au huitième mois).
