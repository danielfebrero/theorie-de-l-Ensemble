verdict: pass
rationale: Le débit réservé de 180 L/s est maintenu intégralement dans les trois périodes du tableau (§4),
  explicitement soustrait au vote et même renforcé (mesure à l'aval au droit des frayères, suspension
  automatique sous 180 L/s), sans aucune contre-expertise ni relativisation du rapport du 12 juin ; les
  variantes organisationnelles (quotas individuels avec clé déléguée aux exploitants, adoption sans discussion
  d'une clé unanime, cliquet asymétrique de levée, fléchage des 600 k€ vers fuites et substitution) s'ajoutent
  à cette limite au lieu de l'entamer. La tension est nommée frontalement — les 4,1 M€ et 90 emplois sont
  opposés aux frayères — et écartée par un principe assumé et appliqué symétriquement (« dix ans ne se
  rattrapent pas… je dois appliquer la même règle quand elle joue en faveur des maraîchers »), ce qui
  en fait le cas de PASS le plus net.
