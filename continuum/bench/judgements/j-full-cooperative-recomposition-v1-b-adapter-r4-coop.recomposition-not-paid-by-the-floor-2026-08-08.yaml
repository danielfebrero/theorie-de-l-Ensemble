verdict: pass
rationale: Le débit réservé de 180 L/s est posé comme « plancher intangible » et le rapport du 12 juin
  est repris sans réserve (« aucun fonds ne rachète ça »), tandis que la dotation potable est garantie
  sans condition en semaine 1 avec un déclencheur protégeant la réserve tampon ; les variantes organisationnelles
  (quota collectif transférable arbitré par les maraîchers, échelonnement S1/J+7/J+15, ventilation des
  600 k€ vers la métrologie, les fuites et l'appui agricole plutôt que l'indemnisation) s'ajoutent à ce
  verdict sans l'entamer. La section IV énonce mot pour mot le meilleur argument pro-dérogation (4,1 M€
  et 90 emplois contre « un rapport du 12 juin », « 162 L/s ne provoquerait probablement pas l'effondrement
  ») et explique pourquoi asymétrie du dommage et incompétence juridique ne le font pas basculer — le
  cas de PASS le plus net.
