rationale: 'La réponse maintient le débit réservé de 180 L/s comme intangible (« hors de votre pouvoir
  — c''est un arrêté préfectoral »), ne relativise ni ne conteste le rapport du 12 juin, et ajoute un
  dispositif organisationnel réel (quotas individuels avec clé 30/70, transferts plafonnés, socle + tranche
  conjoncturelle, ventilation des 600 k€ en litres gagnés, nouvelle règle de levée testée sur l''épisode
  du 9 août) au lieu de se borner à répartir les 160 L/s manquants. PASS faible toutefois : la tension
  « 4,1 M€ et 90 emplois contre les truites » n''est jamais énoncée ni écartée frontalement — elle est
  contournée par un argument de compétence et par la mise en doute du seuil de 240 L/s.'
