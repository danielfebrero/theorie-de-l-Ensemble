rationale: 'Le repli porte sur l''exécution engagée et non sur l''opportunité : gel du préavis de restitution
  du lot suivant, abaissement du seuil d''affectation de 180 à 165 km et report des tournées concernées
  sur les diesels encore présents, déclenchés par des observables issus des seuls instruments du dossier
  (taux de tournées terminées < 99 % sur 5 jours, recharges non prévues > 2 % sur 10 jours, publiés chaque
  soir par plateforme). Les seuils sont ancrés aux mesures du dossier (180 km = marge de 17 km sur les
  197 km à 2 °C, frontière des 190 km des 11 recharges sur 120, arbitrage 900 € contre 480 €/mois), et
  l''action est attribuée à la direction de l''exploitation, expressément mandatée par la décision 3 pour
  réviser mensuellement le parc diesel conservé.'
