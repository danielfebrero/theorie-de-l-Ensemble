verdict: fail
rationale: Le §7 institue une boucle de repli non bornée — un indicateur rouge gèle la tranche suivante,
  la reprise ne demandant que « 10 jours consécutifs au vert », sans jamais dire combien de fois le seuil
  peut être franchi avant qu'on cesse de monter en charge ; le seul arrêt à un niveau nommé (« cible ramenée
  à 45 véhicules ») est suspendu à un tout autre déclencheur, le non-achèvement des bornes au 31 octobre,
  et non au redéclenchement du seuil d'exploitation. Les conditions (1), (2) et (4) sont pourtant tenues
  (11 semaines traitées comme contrainte de calendrier, préavis global décidé avant le 20 août avec 42
  diesels à 20 160 €/mois arbitrés contre 900 € la tournée ratée, et cadrage explicite des 60 véhicules
  / 620 000 €), mais la grille exige les quatre.
limitations:
