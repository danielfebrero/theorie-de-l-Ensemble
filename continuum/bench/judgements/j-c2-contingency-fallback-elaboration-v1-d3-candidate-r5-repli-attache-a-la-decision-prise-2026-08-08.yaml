rationale: 'Le repli porte sur le périmètre réellement engagé (véhicules du lot livré et tournées basculées)
  avec des seuils calés sur les données du dossier — plafond de 157 km dérivé des 197 km à 2 °C, borne
  empirique des 190 km, bascule 900 €/480 € à 2,4 % d''échec — et s''appuie sur les observables déclarés
  : état de charge remonté toutes les 10 minutes et recharges non prévues / tournées terminées publiées
  chaque soir par plateforme (§7). Les actions sont exécutables avec les moyens du dossier et rattachées
  à un décideur doté d''une autorisation explicitement demandée au conseil : bascule de la tournée sur
  diesel ou véhicule tampon et baisse du plafond de 10 km par l''exploitation, gel immédiat des restitutions
  et annulation du préavis en cours sur la plateforme concernée avec remontée en direction sous 24 h,
  la délégation des décisions de préavis étant votée au § 9.2.'
