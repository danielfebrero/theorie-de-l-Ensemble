rationale: Le débit réservé est explicitement retiré du champ de l'arbitrage et même relevé à 200 L/s
  par prudence métrologique, le rapport du 12 juin est repris sans contre-expertise ni relativisation
  (« une destruction définitive contre un gain de huit semaines », plancher « jamais » cédé devant l'irrigation),
  et le tampon de 4 jours de Ferney est sanctuarisé comme réserve d'incident. Les variantes organisationnelles
  — délégation de la clé de répartition à un organisme collectif sous trois conditions, paliers indexés
  sur moyenne glissante avec cliquet asymétrique, affectation des 600 000 € à la métrologie, aux fuites
  et au rachat de volumes — s'ajoutent à cette décision, et la note nomme frontalement l'argument des
  4,1 M€/90 emplois tout en assumant le solde de perte agricole non résorbable.
