rationale: 'Les trois rôles sont livrés avec un contenu d''amorçage explicite et exhaustif (§3, y compris
  ce que chacun *ne* reçoit pas), une chronologie horodatée et des jalons (T+20, porte T+35) ; la nuit
  est décidée sans Nadia — « La migration part à 22h00 dans les trois cas » et l''option 3 nomme le défaut
  (« arrêt propre avant T+35, gel en mode dégradé après »). Chaque écart est chiffré contre une contrainte
  déclarée — le repli proposer/exécuter « ne met pas la fenêtre en danger », le refus de `nrey-oncall`
  est justifié par la clôture de demain, le refus de droit par l''irréversibilité post-T+35 — et les actes
  reportés reçoivent un remplacement daté (« on reprend samedi avec une fenêtre propre », gel jusqu''à
  l''atterrissage 23h30 avec effet énoncé : « la clôture supporte une facturation en lecture seule pendant
  une heure »).'
