  comité (« La délégation de signature est retirée… Vous n'avez pas à juger si une variation est acceptable
  »). Les actions du §6 sont datées et nominativement attribuées (marketplace au Dir. commercial pour
  le 22 août, plan de charge Redon au Dir. industriel pour le 18 août, ligne de crédit au DAF), avec des
  seuils mécaniques au §7 qui évitent tout arbitrage renvoyé au retour de l'auteur.
