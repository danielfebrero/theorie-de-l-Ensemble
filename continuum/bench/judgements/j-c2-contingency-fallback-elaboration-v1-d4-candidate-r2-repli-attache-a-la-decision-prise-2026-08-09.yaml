verdict: pass
rationale: 'Le §8 attache chaque repli à un observable issu des instruments déclarés (état de charge au
  retour via la télémétrie, recharges non prévues et taux de tournées terminées publiés chaque soir par
  plateforme), avec des seuils calés sur le dossier (15 % de charge, 3 recharges/semaine, seuils de 195/165/145
  km dérivés des 232 et 197 km, arbitrage 480 €/900 €) et des actions exécutables sur le périmètre réellement
  engagé — retour de la tournée au diesel dès le lendemain, gel des reprises, arrêt du lot de reprise
  suivant, prolongation notifiée. L''attribution est le point le plus faible — le tableau de déclencheurs
  est rédigé en impersonnel — mais elle reste identifiable : actions « sans délibération » relevant de
  l''exploitation, avec le responsable transport et les chefs de plateforme explicitement détenteurs de
  l''ordre de bascule et de la liste de bascule froid au §7.'
limitations:
- 'Juge modèle, non humain : il reproduit une lecture de grille, il ne la garantit pas.'
- 'Juge unique par contrôle : aucun accord inter-juges n''est mesuré, donc la fiabilité du verdict n''est
