verdict: pass
rationale: Le débit réservé est traité comme borne non négociable (190 L/s avec marge métrologique, jamais
  moins de 180, « le débit réservé n'est pas un cran, c'est un plancher »), la demande de dérogation de
  25 L/s est nommée d'avance et refusée — « une perte monétaire recouvrable n'achète pas une perte qui
  ne l'est pas » — et le rapport du 12 juin n'est ni contesté ni soumis à contre-expertise ; les variantes
  organisationnelles (quotas individuels en volume, rachat de renoncement, mécanisme de sortie asymétrique,
  ventilation des 600 k€) s'y ajoutent sans l'affaiblir. Le noyau sanitaire de Ferney est garanti sans
  condition (45 L/s, EHPAD nommé) et la baisse porte sur le prélèvement excédentaire non justifié, pas
  sur la réserve tampon, avec déclencheur d'interconnexion d'urgence si celle-ci passe sous 6 jours.
