rationale: 'La note nomme le pire cas de A et qui l''encaisse (§4 : jetons transférés, compte Solda clos,
  dégradation lente en décembre, 6 semaines de ré-ouverture et recollecte auprès de 2,1 M de clients,
  « encaissée par les clients et le chiffre d''affaires récurrent »), assume explicitement le coût de
  la fenêtre de repli (prolongation Solda à 130 k€/mois notifiée dès lundi avant le 15 octobre, retranchée
  des 500 k€), et date la fermeture du dispositif (signature au 20 octobre → sortie gratuite jusqu''au
  18 janvier, porte du 5 janvier déclenchant l''exercice avant cette date). L''irréversibilité produit
  des contraintes de calendrier réelles — « le coffre de jetons Solda n''est ni purgé ni clos avant le
  28 février », repli conditionné aux deux comptes ouverts, aucune bascule avant l''envoi de la lettre
  — et la borne du 28 février est traitée plutôt que laissée courir.'
