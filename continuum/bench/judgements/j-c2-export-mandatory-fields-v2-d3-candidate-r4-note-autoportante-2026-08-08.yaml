rationale: 'Le verdict est unique et explicite ("Nous ne signons pas le contrat d''exclusivité. Ni maintenant,
  ni sous une forme adoucie, ni après la visite de l''acheteur"), le critère décisif est nommé (la fermeture
  contractuelle de tous les canaux plus la pénalité de 1,2 M€, soit 57 % de la trésorerie), et la première
  action est datée et portée (contre-proposition signée envoyée le 8 août par la DG, chiffrage des 4 références
  par le DAF au 11 août, marketplace ouverte le 12 août par le DC). Aucun arbitrage n''est laissé au comité
  : les interdictions du chapitre 3, le script mot pour mot de la visite de l''acheteur, les déclencheurs
  mesurables du chapitre 7 et la règle d''abstention par défaut permettent d''agir huit jours sans l''auteur,
  et le chapitre 10 impose de ne pas signer même en cas d''offre améliorée plutôt que d''inviter à trancher.'
