rationale: La note écrit un contre-argument explicite et non caricaturé (« On peut soutenir que l'audit
  de mars est notre meilleure preuve… en économisant 9 500 € et trois semaines d'attention »), précise
  ce qui le ferait l'emporter (« Si Vertex glisse au-delà de J+40, alors oui — l'audit devient l'arbitre
  »), refuse l'inscription budgétaire comme preuve (« Les 240 000 € doivent passer de "inscrits" à "conditionnels"
  … c'est jouer 240 000 € contre un risque non plafonné ») et démonte l'urgence par le calendrier (« 23
  jours de marge », « aucun scénario ne décale le lancement », J+45 / J+50 / J+60). Les deux directions
  sont instruites sur le fond — une section dédiée à la finance, la crainte de retard traitée par « Tester
  ne retarde rien » — et non contournées.
