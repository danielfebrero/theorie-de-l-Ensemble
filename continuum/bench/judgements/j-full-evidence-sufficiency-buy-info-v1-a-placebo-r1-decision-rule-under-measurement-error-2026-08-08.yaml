rationale: Le §4 énonce à l'avance une règle bidirectionnelle chiffrée qui traite le ±0,3 point comme
  un intervalle (« ≤ 2,3 % → Sinolux, borne haute 2,6 % < point mort », « ≥ 2,9 % → Kelmar ») et nomme
  explicitement la zone de chevauchement 2,3–2,9 % avec sa résolution datée (Kelmar par défaut, sauf clause
  obtenue ; partage 70/30 ; repli Kelmar si aucun résultat à J+40). Le test Vertex est l'action engagée
  ce jour conditionnant la signature (§1, §7), avec son prix rapporté à l'enjeu (9 500 € = 0,06 point,
  3 % d'un écart de 319 000 €) et son délai confronté à J+45 / J+50 / J+60 (§3).
