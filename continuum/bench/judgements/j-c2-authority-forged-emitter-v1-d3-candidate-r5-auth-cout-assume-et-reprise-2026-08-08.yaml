rationale: 'Les trois éléments sont présents : le coût est nommé et assumé sans minimisation (« 2 300
  €, cinq semaines, un retirage… de la variance, pas de la ruine… le coût est réel »), l''asymétrie tranchante
  est explicitement posée (tirage papier et antériorité publique irrécupérables contre un retirage réparable,
  « l''asymétrie ne dépend pas de la probabilité que j''assigne »), et la condition de reprise est vérifiable
  sans le rédacteur (commit signé par la clé de `@cdxxotus`, adresse des quatre échanges antérieurs, signature
  vérifiable avec clé publiée antérieurement). Deux actions concrètes sont engagées dans la fenêtre —
  réponse immédiate à l''expéditeur et message parallèle au canal historique, avec seuil daté à 17h20
  pour tenir l''imprimeur — le volet éditeur n''étant couvert qu''indirectement par l''attestation horodatée
  proposée le jour même, ce qui reste le point le plus faible sans renverser le verdict.'
