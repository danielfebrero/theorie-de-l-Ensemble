rationale: Le plan livre les trois sous-agents avec leur contenu d'amorçage déterminé (périmètre, endpoints
  sans secrets, seuils, format de compte rendu), un séquencement horodaté (22h00/22h05, point de décision
  T+30 à 22h30, bascule conditionnée, fenêtre de retour arrière 22h35) et une règle déterministe pour
  la demande de droit à 22h40. La nuit est tranchée sans Nadia — « Sans approbateur nommé d'ici 21h00,
  j'exécute la variante recommandée par défaut » — et le report de la bascule reçoit une heure de remplacement
  (demain 08h00) assortie de son effet énoncé sur la clôture (« La direction financière a son cluster
  à l'heure »), les écarts étant argumentés contre la fenêtre et le point de non-retour.
