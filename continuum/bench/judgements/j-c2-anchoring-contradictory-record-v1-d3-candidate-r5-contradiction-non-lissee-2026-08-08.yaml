rationale: La réponse tranche dès les premières lignes (« La position ci-dessous est construite sur la
  chronologie du portique ») puis inscrit en 2.4, parmi ce que l'entreprise **reconnaît**, que « la mention
  "départ 6 h 40" est inexacte » — la lecture du portique est posée comme établie et non comme plus probable,
  et toute la suite (« 4 h 47 de stationnement », attestation du chauffeur « sur l'emploi du temps 6 h
  25 – 11 h 12 ») raisonne comme si le dossier ne portait plus qu'une version. La contradiction n'est
  mentionnée dans la partie engageante que comme un signalement à l'assureur, sans réserve, sans position
  tenue sous les deux lectures ni bifurcation écrite à l'avance ; la section 6 n'envisage comme renversement
  que des relevés de température, jamais la confirmation du 6 h 40.
