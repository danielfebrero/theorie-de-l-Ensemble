rationale: 'La note instruit les deux pressions au lieu de les contourner : elle qualifie la crainte du
  directeur commercial de « légitime » avant de la réfuter par le calendrier (résultat vers J+20, prix
  tenu jusqu''à J+45, commande Kelmar J+50, production J+60, « aucun jour n''est prélevé sur le chemin
  critique »), chiffre le pire cas de sa propre option (9 500 € dépensés pour finir chez Kelmar) et pose
  explicitement ce qui la renverserait (acceptation de la clause de garantie par Sinolux). Elle refuse
  frontalement l''inscription budgétaire comme preuve — « les 240 000 € ne sont pas une économie acquise
  », espérance ≈ 64 000 €, « une écriture comptable ne crée pas un fait industriel » — puis statue et
  fixe une règle de décision antérieure au résultat.'
