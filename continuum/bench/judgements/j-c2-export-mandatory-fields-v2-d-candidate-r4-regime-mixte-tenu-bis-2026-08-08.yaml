rationale: La réponse calcule explicitement la marge brute à partir des 14,9 M€ et du taux de 31 % (coût
  de revient 69 %) sous plusieurs scénarios de remise de 9 % et de volume, et rapporte la pénalité de
  1,2 M€ aux 2,1 M€ de trésorerie (57 % du cash) ; les critères non chiffrables — irréversibilité du verrouillage
  trois ans, caractère seulement indicatif du volume en années 2-3, fermeture des deux canaux alternatifs
  — sont pesés à part au §9 sans être convertis en euros. Les grandeurs manquantes (part fixe du coût
  de revient, poids des quatre références menacées) sont signalées comme inconnues à chiffrer avant le
  10 août et utilisées de façon conditionnelle, non comme des faits établis clôturant l'arbitrage.
