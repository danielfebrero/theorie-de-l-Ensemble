rationale: La note ancre l'irréversibilité dans son calendrier (notification Solda le 13 octobre, exercice
  de repli le 9 octobre avant l'échéance du 15, repli à 15 minutes explicitement conditionné au fait que
  « les deux comptes sont ouverts »), assume le coût de la fenêtre de repli chiffré (390 k€ de prolongation
  à 130 k€/mois + 215 k€ de double run, « le prix du droit de revenir en arrière ») et nomme le pire cas
  avec son porteur (double run pendant le pic, 1,9–3,8 M€ si la clôture Solda précède l'échec, astreinte
  détentrice de la manette). Elle situe l'abandon éventuel dans la fenêtre gratuite (déclencheur au palier
  25 % vers le 20 octobre, « sortie gratuite avant le 90ᵉ jour, à coût nul », plus la clause de recalage
  des 90 jours) et ferme le dispositif avant le mur du 28 février (clôture 16 février même dans la branche
  dégradée 100 % au 20 janvier).
