rationale: 'Le tableau des replis (§5) porte sur le périmètre effectivement engagé — bascule des tournées
  électriques en diesel dès le lendemain matin, gel de la montée en service, prolongation du lot diesel
  concerné — avec des observables issus des instruments du dossier (recharges non prévues par nuit et
  par plateforme, taux de tournées terminées < 98 %), et des seuils dérivés des mesures connues (plafond
  de 167 km = 197 km à 2 °C moins 15 % de réserve, calé sur les 190 km au-delà desquels les 11 recharges
  non prévues sont survenues). L''exécution est attribuée : la règle d''affectation est « applicable par
  le responsable de plateforme sans arbitrage » (§3.2), le responsable transport co-signe la répartition
  mensuelle et dispose d''un veto sur la libération de tout lot diesel (§7), et le dépassement de la capacité
  réseau remonte au conseil sous 5 jours ouvrés.'
