rationale: La section 10 nomme explicitement le pire cas de l'option retenue et son porteur — « les maraîchers
  touchent 99 L/s tout de suite et des promesses ensuite, et quand votre recherche de fuites aboutira
  la culture sera morte », assorti de l'aveu « si le second jaugeage n'est pas livré à J+10, toute la
  construction perd sa légitimité » — avec des ordres de grandeur rattachés ailleurs au même ensemble
  (99 L/s au lieu de 240, ~370 ha sortis d'irrigation, 4,1 M€, 90 saisonniers, 757 €/ha non compensés),
  et la section 11 chiffre la dégradation (irrigation à ~65 L/s si surestimation > 10 %).
