verdict: pass
rationale: 'Le §4 chiffre l''irréversibilité (lot rendu = 24 tournées exposées 11 semaines, ~1,2 M€) et
  arbitre explicitement le préavis — lettre au loueur vendredi matin, prolongation mensuelle des quatre
  lots jusqu''au 31 mars pour ≈104 k€, comparée aux 900 € de tournée manquée — tandis que le §6 borne
  la boucle : chaque déclenchement de seuil entraîne le gel de la montée en charge au palier atteint,
  « aucune reprise automatique après déclenchement ». Les paliers sont nommés (24 → 44 → 52 → 60) et l''astérisque
  du §3 situe explicitement l''arrêt par rapport à la subvention (« C''est le jalon de la subvention :
  il ne tient pas sur les 22 bornes seules dans une fenêtre de 12 h »), les 210 k€ de bornes et leurs
  7 semaines étant décidés en décision 2.'
