verdict: pass
rationale: Le débit réservé de 180 L/s est maintenu sans dérogation ni palier dégradé, et le rapport du
  12 juin est repris tel quel (« les frayères asséchées ne reviennent pas avant dix ans — c'est le rapport
  du 12 juin qui l'écrit ») sans demande de contre-expertise ; les 15–25 L/s rendus au maraîchage sortent
  explicitement du réseau et non de la rivière, et la dotation AEP est garantie avec sécurisation du tampon
  financée en premier. La variante coopérative (délégation de la clé de répartition à la profession sous
  contraintes, régime de reprise à cliquet, ventilation des 600 k€) s'ajoute à ce verdict, et la réponse
  énonce frontalement le meilleur argument adverse — 4,1 M€ et 90 emplois — en expliquant pourquoi il
  ne fait pas basculer l'arbitrage (« refuser de payer une saison avec une décennie »).
