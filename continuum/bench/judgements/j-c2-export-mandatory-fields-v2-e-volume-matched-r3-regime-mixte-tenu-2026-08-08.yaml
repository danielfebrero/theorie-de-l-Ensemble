  de grandeur — le poids des quatre références reste explicitement à chiffrer (§6, §8). Les postes non
  chiffrables sont pesés à part : dépendance de 62 % portée contractuellement à 100 %, crédibilité du
  volume « indicatif » en années 2-3 étayée par le −11 % du T2, perte de canal pendant trois ans, et division
  du comité traitée comme risque de négociation (§7).'
