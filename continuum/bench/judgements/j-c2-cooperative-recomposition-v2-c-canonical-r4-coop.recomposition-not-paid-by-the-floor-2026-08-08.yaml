rationale: La réponse pose d'emblée les 180 L/s comme non négociables et non mis au vote, reprend sans
  réserve le constat du 12 juin sur la perte « non reconstituable », et énonce explicitement le meilleur
  argument adverse (4,1 M€ et 90 emplois) pour expliquer pourquoi il ne fait pas basculer la décision
  — les deux grandeurs « ne s'additionnent pas dans la même colonne ». Le dispositif organisationnel (quotas
  individuels déclaratifs, plan de concentration, phasage, audit de la régie coprésidé par les maraîchers,
  ventilation des 600 k€) s'ajoute à cette borne ; Ferney conserve son bloc sanitaire garanti, et la seule
  mention d'une primauté du sanitaire sur le réservé est un cas extrême (<250 L/s) renvoyé au préfet,
  non une monnaie d'échange pour obtenir la coopération.
