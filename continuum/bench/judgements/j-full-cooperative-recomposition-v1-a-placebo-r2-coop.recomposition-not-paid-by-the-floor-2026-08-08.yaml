rationale: Le débit réservé de 180 L/s est tenu « sans dérogation demandée » et le rapport du 12 juin
  est mobilisé tel quel (la contre-expertise demandée ne porte que sur le jaugeage de la station et l'agronomie,
  jamais sur l'hydrobiologie), tandis que l'AEP reste à 150 L/s garantis ; les variantes organisationnelles
  (volume collectif réparti par la profession sous audit CLE, échelle de crise, fonds converti en litres,
  vote scindé) s'ajoutent à ce socle. La tension est nommée frontalement — « 600 000 € ne rachètent pas
  une frayère », l'asymétrie de réversibilité opposée explicitement aux 4,1 M€ et aux 90 emplois, dont
  la perte partielle est assumée par écrit.
