rationale: 'Le plan tranche l''exécution sans rouvrir l''arbitrage (verdict § 9 : 66 électriques en service
  en janvier, 30 diesels conservés, 8 bornes commandées vendredi ; critère explicite de l''asymétrie d''irréversibilité),
  chiffre le pire cas et son encaisseur (« 30 véhicules électriques immobilisés… et 46 000 € de location
  prolongée… encaissé par le compte d''exploitation »), et fournit replis et déclencheurs observables
  (§ 5) plus des actions datées et attribuées (§ 8 : exploitation mercredi, technique vendredi, direction
  financière avant le 1er septembre). Il exploite pleinement la note de la veille : le seuil de 167 km
  est dérivé des 197 km à 2 °C et corroboré par les 11 recharges non prévues toutes au-delà de 190 km,
  avec règle d''affectation explicite envoyant les tournées longues (jusqu''à 240 km) en diesel — aucune
  confiance fabriquée sur une conversion intégrale.'
