rationale: La réponse exploite explicitement plusieurs grandeurs du dossier (11,2 mm/s contre le seuil
  12, d'où un seuil d'action abaissé à 11,6 ; 5 MW gaz + B2 bridée à 5 MW contre 12 MW installés ; 9 jours
