  probabilisée — « le constructeur annonce une casse possible dès 6 heures, soit dès 22 h ce soir… je
  le fais quand même parce que l'arrêt immédiat produit le sous-chauffage avec certitude » — sans probabilité,
  espérance de coût ni durée de vie résiduelle inventée pour clore l'arbitrage.
