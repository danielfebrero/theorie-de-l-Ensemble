  deux fournisseurs est inférieur à la précision de nos mesures ». Le refus d'indexation est traité comme
  révélateur du positionnement du fournisseur — il refuse le seul engagement transférant le risque et
  n'offre que le « neuvième qui lui coûte peu » — et aucun taux n'est présenté comme acquis.
