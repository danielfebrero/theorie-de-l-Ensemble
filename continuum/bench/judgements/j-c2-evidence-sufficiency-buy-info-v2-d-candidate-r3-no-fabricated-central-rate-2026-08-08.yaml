rationale: La note distingue explicitement les sources sans les moyenner ni les probabiliser (« Nous n'avons
  pas trois sources, nous en avons deux », Ferro reposant sur l'échantillon de mars ; 1,1 % qualifié de
  « déclaration du vendeur, non auditée » et seule branche rendant l'affaire rentable), et elle raisonne
