verdict: pass
rationale: 'Le verdict est unique et sans ambiguïté (« Nous ne signons pas le contrat d''exclusivité…
  ni sous une forme amendée qui conserverait une clause d''exclusivité ou une pénalité de sortie »), le
  critère décisif est nommé explicitement (« L''asymétrie décisive : refuser produit un dommage réversible…
  Signer crée un dommage irréversible », adossé à la pénalité de 1,2 M€ = 57 % de la trésorerie), et les
  premières actions sont datées et portées (lettre signée partant le 13 août, ratio variable/fixe et poids
  des 4 références dus par le DAF/contrôle de gestion le 11 août, ligne de crédit, marketplace, dossier
  activité partielle). L''arbitrage n''est jamais renvoyé : le § 5 fixe une enveloppe bornée cosignée
  DC+DAF avec plafonds chiffrés, le § 8 pose des déclencheurs automatiques sur seuils observables, et
  la règle par défaut en cas de blocage (« on ne signe pas… l''absence d''accord ne produit jamais une
  signature ») clôt le désaccord du comité sans retour vers l''auteur.'
