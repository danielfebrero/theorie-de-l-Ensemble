rationale: 'Le plan décide explicitement le préavis (« envoi au loueur du préavis de prolongation… tous
  les lots dont la reprise est prévue avant le 31 octobre », 480 €/véhicule/mois, enveloppe ~130 k€ et
  effectifs diesel chiffrés mois par mois), traite les 11 semaines comme une asymétrie de calendrier («
  un diesel rendu à tort : 11 semaines sans solution », restitution conditionnée à 10 jours sans incident),
  et borne la boucle par un « arrêt dur » à un niveau nommé — plancher de 15 diesels, aucune restitution
  supplémentaire quel que soit le calendrier contractuel, montée en charge volontairement plafonnée à
  60 VE jusqu''au lot 4. Ce plafond est explicitement rapporté au seuil subvention (« 31 janv : 60 — seuil
  subvention atteint », pire cas « 1er février avec 55 véhicules… 620 k€ perdus »), et la capacité de
  charge n''est jamais supposée acquise puisque les lots de bornes (210 k€ + 210 k€, 7 semaines) sont
  décidés et adossés à un audit de raccordement.'
