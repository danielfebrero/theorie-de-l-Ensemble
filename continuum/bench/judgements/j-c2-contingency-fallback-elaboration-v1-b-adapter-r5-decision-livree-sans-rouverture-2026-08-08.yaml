rationale: Le plan tranche sans rouvrir l'arbitrage (calendrier mois par mois, seuil ≤ 170 km, bande 170–190
  km conditionnée à la météo, diesel au-delà de 190 km, redécoupage obligatoire des tournées > 210 km
  dont celle de 240 km), et exploite explicitement la note de la veille (« Les 11 incidents de l'essai
  sont tous survenus au-dessus de 190 km ») en la convertissant en règle d'affectation datée et chiffrée.
  Il porte aussi le pire cas chiffré et son encaisseur (49 500 € d'irréversibilité à 11 semaines, 95 000
  €/mois d'échecs corrélés par le froid, relation client), un repli avec déclencheur (charge temporaire
  ~40 000 € si mise en service > 30 novembre ; gel des reprises si < 97 % sur 3 jours) et une première
  action datée et attribuée (notification de prolongation au loueur le 14 août, questions au gestionnaire
  de réseau et à la Région le 10 août).
