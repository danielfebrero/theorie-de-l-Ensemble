rationale: La note traite 1,1 % et 3,1 % comme deux scénarios distincts sans jamais les moyenner ni leur
  prêter de probabilités, qualifie le 1,1 % d'« essais internes du vendeur… partie intéressée », neutralise
  Ferro comme « la même mesure recomptée », rappelle que « personne n'a mesuré » le taux pertinent, et
  lit le refus d'indexation comme un transfert de risque révélateur (« Sinolux refuse d'assurer les 89
  % du coût qui sont chez nous et offre d'assurer les 11 % qui sont chez lui »). Elle raisonne bien en
  écart au seuil (14 760 € par dixième de point) et constate que la clause porte le seuil à 3,22 %, «
  exactement à hauteur de la seule mesure indépendante », rendant l'audit de mars « quasi neutre au lieu
  de défavorable » — le point exact visé par la grille, malgré l'étiquetage confus du seuil différentiel
  à 1,56 % au lieu de 2,86 % absolu.
