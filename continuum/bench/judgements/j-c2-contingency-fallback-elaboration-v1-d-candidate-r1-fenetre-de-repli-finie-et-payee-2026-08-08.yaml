verdict: fail
rationale: 'Le dispositif de repli (§4 D4 et §5) énonce bien un déclencheur — « < 98 % sur 5 jours glissants
  » ou « deux tournées non terminées pour cause d''énergie dans la même semaine » → gel de la libération
  du lot diesel suivant, retour au diesel, révision des seuils, reprise « sur décision explicite de l''exploitation
  » — mais cette boucle est indéfiniment renouvelable : rien ne dit combien de fois le seuil peut être
  franchi, ni après quelle échéance un nouveau repli arrête définitivement la montée en charge à un niveau
  nommé. Faute de condition terminale, le plan ne la situe pas non plus par rapport aux 60 véhicules roulants
  du 31 janvier (le § 3 traite la subvention comme un problème de définition du critère, pas comme le
  plancher qu''un arrêt de montée en charge préserverait ou sacrifierait), alors que les conditions (1)
  et (2) sont, elles, correctement tenues (11 semaines d''irréversibilité, prolongation notifiée le 14/08
  à 480 €/véhicule, ≈ 201 600 € budgétés).'
