  réponse écrite adressée à Sacha et la disponibilité jusqu''à 16h50). Le coût est nommé sans détour —
  « deux ans de relecture sans contrepartie », les 900 exemplaires et l''impression de 17h30 — et explicitement
  assumé : « l''échéance […] rend le refus coûteux, pas faux », sans jamais en faire un motif d''exécuter.'
