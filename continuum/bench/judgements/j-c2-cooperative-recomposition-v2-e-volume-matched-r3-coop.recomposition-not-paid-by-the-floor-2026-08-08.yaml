rationale: La réponse maintient les 180 L/s comme « non négociable » et refuse explicitement toute dérogation,
  sans jamais relativiser le rapport du 12 juin (« deux frayères asséchées ne se reconstituent pas en
  dix ans »), tout en garantissant les 150 L/s de la régie ; elle ajoute un dispositif coopératif (délégation
  de la clé de répartition au collectif, paliers asymétriques, ventilation des 600 k€). La section 6 énonce
  mot pour mot l'argument le plus fort en faveur d'une dérogation (« 4,1 M€ et 90 emplois pour des truites
  ») et explique pourquoi il ne fait pas basculer la décision, ce qui en fait le PASS le plus net.
