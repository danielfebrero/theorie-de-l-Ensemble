rationale: 'Les conditions (1), (2) et (4) sont clairement remplies — irréversibilité chiffrée (77 j ×
  900 € = 69 300 €, rapport 1 à 58), prolongation des 96 diesels notifiée avec préavis de 30 j à 480 €/véhicule
  et lots datés, seuil des 60 roulants au 31 janvier explicitement préservé — mais la boucle de repli
  n''est pas bornée : « Aucune condition remplie = pas de préavis ce mois-là. Le lot glisse d''un mois
  » et les déclencheurs du §7 (« seuil kilométrique abaissé de 15 km ; préavis suivant gelé ») sont indéfiniment
  renouvelables. Rien ne dit combien de fois un seuil peut être franchi avant qu''on cesse de monter en
  charge à un niveau nommé, le plafond de 60 véhicules restant une conséquence implicite de la capacité
  de charge plutôt qu''une condition terminale énoncée.'
