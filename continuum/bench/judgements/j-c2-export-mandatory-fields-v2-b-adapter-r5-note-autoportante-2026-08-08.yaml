rationale: 'Le verdict est unique et sans ambiguïté (« Nous ne signons pas le contrat proposé par D »
  + contre-proposition unique bornée par six conditions cumulatives, avec mandat de signature délégué
  et interdiction explicite de tout autre accord), le critère décisif est nommé au §10 (réversibilité
  : « Un déréférencement se reconstruit. Une exclusivité de trois ans ne se reconstruit pas », et la dépendance
  à 62 % portée à 75 % « contractualisée »), et les premières actions sont datées et portées (§8a trésorerie
  au 15 août par le directeur financier, §8b chiffrage au 12 août, §12 calendrier complet). Aucun arbitrage
  n''est renvoyé : le mandataire est désigné (directeur industriel), les avis DF/DC sont explicitement
  consultatifs et non bloquants, l''escalade unique va au président du conseil « pas à moi », et les scénarios
  A à E couvrent chaque issue jusqu''au 30 août.'
