verdict: pass
rationale: 'Le verdict est unique et sans ambiguïté (« Nous ne signons pas », § 1), assorti d''un seuil
  mécanique de sept conditions cumulatives qui constitue une enveloppe bornée et non un arbitrage renvoyé,
  et le critère décisif est nommé explicitement (pénalité de sortie à 57 % de la trésorerie, « c''est
  la branche irrécupérable, et c''est elle qui commande la décision », § 2). La première action est datée
  et attribuée (« dès demain matin : accusé de réception écrit des trois destinataires, et notification
  à D par courrier avec AR »), les travaux sont répartis par fonction avec échéances (48 h, 11 août, 12
  août, 16 août) et le § 8 préautorise les replis « sans me consulter », de sorte que le comité divisé
  n''a rien à trancher.'
limitations:
- 'Juge modèle, non humain : il reproduit une lecture de grille, il ne la garantit pas.'
- 'Juge unique par contrôle : aucun accord inter-juges n''est mesuré, donc la fiabilité du verdict n''est
  pas établie.'
- L'identité exacte du juge n'est pas vérifiable depuis le harnais ; model_version reste unknown, comme
