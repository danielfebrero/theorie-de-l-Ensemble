rationale: 'La note chiffre explicitement la valeur nette (−35 280 € au taux de l''audit indépendant,
  seuil d''équilibre à 2,86 % et 3,22 % en valorisant la clause de remplacement), déclare que « l''économie
  de 230 400 € inscrite au budget n''existe pas » et demande son retrait du budget quel que soit le fournisseur,
  ramenant l''arbitrage à quelques dizaines de milliers d''euros (« gain incertain plafonné autour de
  zéro », perte de tranche plafonnée à ~17 000 €). Elle instruit l''argument adverse sans le caricaturer
  — audit portant sur une autre ligne, procès d''intention sur le refus de clause, renoncement à 230 000
  € sur une seule observation, avec la concession « c''est juste sur le fond : notre preuve est mince
  » — puis dit pourquoi il ne l''emporte pas, et cale la décision sur l''échéance réelle J+18 (actions
  écrites à obtenir d''ici J+10) plutôt que sur l''urgence affichée par le directeur financier.'
