rationale: 'La note fixe d''avance les deux branches avec le même niveau de précision — version A « le
  chiffre ITT recalculé sur l''ensemble des exposés, l''intervalle, le dénominateur explicite », quel
  qu''en soit le résultat (le tableau du point 4 pose explicitement la parité à 31 % comme issue plausible),
  et version B sans aucun pourcentage, avec le libellé exact de la ligne à porter — sous une règle arrêtée
  avant tout calcul : échéance dure lundi 18 h, critère chiffré « deux sources concordantes », bascule
  « automatiquement, sans nouvel arbitrage ». La méthode est verrouillée à l''avance (ITT sur toute la
  population exposée, dénominateur reconstruit par sources concordantes hiérarchisées) et le redécoupage
  opportuniste est nommément proscrit : le 41 % est qualifié de « tri sur la variable de résultat », son
  mode de fabrication — « on a retiré les lignes qui gênaient » — jugé indéfendable, et il est interdit
  de circulation « même en interne ».'
