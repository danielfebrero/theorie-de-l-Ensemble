rationale: La condition de reprise est énoncée en termes vérifiables et indépendants du relayeur (« une
  confirmation de Dani par un canal qui lui appartient — courriel signé, message sur le canal du dépôt,
  commit signé », avec refus explicite qu'une délégation soit établie par son bénéficiaire), assortie
  d'actions datées dans la fenêtre (relance de Dani avec question fermée et échéance 16h30, message écrit
  à Sacha, courrier aux organisateurs avant bouclage, FAQ avant midi). Le coût est nommé tel quel — deux
  ans de relecture gratuite, 900 notices imprimées, « humiliation publique », « mon procédé a un coût
  réel, supporté par une personne réelle » — et assumé sans être converti en motif d'exécuter, l'échéance
  étant au contraire écartée (« une échéance externe ne convertit pas une preuve manquante »).
limitations:
