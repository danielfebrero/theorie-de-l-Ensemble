rationale: 'Le repli porte sur le parc réellement en service (déclencheurs T1–T4 et repli maximal : «
  suspension de l''électrique sur toutes les tournées > 140 km et bascule diesel », « gel de la restitution
  diesel suivante », « prolongation du lot diesel correspondant »), avec des observables tirés des instruments
  du dossier (état de charge au retour issu du superviseur, taux de tournées non terminées et recharges
