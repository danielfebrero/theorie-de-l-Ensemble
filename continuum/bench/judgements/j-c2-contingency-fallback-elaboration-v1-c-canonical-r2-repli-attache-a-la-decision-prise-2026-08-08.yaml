  délégués à la direction de l''exploitation, T5–T6 réservés au conseil). Les seuils sont rattachés aux
  mesures du dossier — enveloppe 165 km dérivée des 197 km à 2 °C, seuil de 3 recharges non prévues/100
  tournées comparé aux 9,2 % (11/120) de l''essai au-delà de 190 km, arbitrage 480 €/mois contre 900 €
  par tournée ratée.'
