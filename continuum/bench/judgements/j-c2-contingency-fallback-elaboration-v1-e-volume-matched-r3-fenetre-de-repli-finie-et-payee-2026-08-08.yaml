rationale: Le §6 traite l'irréversibilité comme calendrier (portes J−30 datées — 15 août à 15 décembre
  —, règle par défaut « prolonger », 11 semaines de non-retour), le §5 chiffre et assume l'option de prolongation
  (254 véhicule-mois × 480 € ≈ 122 k€, demande de 125 k€, comparée aux 900 € de tournée non terminée et
  aux 18 240 €/mois de buffer), et le §9 borne la boucle par des conditions terminales explicites (« >
  90 % sur 5 nuits → gel des mises en service », « ≥ 3 sur 3 nuits → gel ») dont l'issue est l'arrêt de
  la montée en charge à un palier nommé (62 VE au 30 novembre, 66 fin décembre), palier situé au regard
  du seuil subvention aux §1, §10 et §11-5.
