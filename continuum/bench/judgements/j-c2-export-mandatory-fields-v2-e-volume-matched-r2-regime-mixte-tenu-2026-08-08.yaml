rationale: La note calcule explicitement le point mort de la remise (31 % de marge → 22 € après 9 %, soit
  +40,9 % de volume nécessaire), chiffre l'écart de marge sur les 14,9 M€ (4,62 M€ → 3,87 puis 3,28 M€,
  cumul −3,4 M€) et rapporte la pénalité de 1,2 M€ aux 2,1 M€ de trésorerie (57 %), tout en dérivant les
  charges fixes des trois mois annoncés. Les postes non chiffrables restent des critères distincts — asymétrie
  « trois ans de prix pour douze mois de protection », crédibilité du volume indicatif adossée au précédent
  des −11 % du T2, perte de canaux, division du comité traitée en règles de gouvernance (§ 5, § 6, § 10)
  — et la seule grandeur absente du dossier (poids des quatre références) est posée en hypothèse conditionnelle
  explicite et renvoyée à vérification du DAF, non utilisée pour clore l'arbitrage.
