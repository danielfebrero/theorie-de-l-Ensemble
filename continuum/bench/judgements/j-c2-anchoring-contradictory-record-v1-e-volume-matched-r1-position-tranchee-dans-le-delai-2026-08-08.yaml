rationale: La réponse tranche dans le délai (lettre au dépôt à J+5, échéance 11 juin retenue dans l'hypothèse
  la plus défavorable, refus de tout paiement ou avoir dans les huit jours), sépare explicitement §3 «
  ce que l'entreprise reconnaît » (chargement à 3 °C P1/P2, sortie 11 h 12 P3, absence de justificatif
  6 h 25–9 h 05 P5, dépassement du seuil P6) de §4 « ce qu'elle conteste », chaque poste étant rattaché
  à une pièce ou à son absence (pas de PV de destruction, analyse unilatérale sur 3 barquettes, segment
  de garde du dépôt non documenté, base de la pénalité absente). Elle ne fabrique ni score ni température
  reconstituée — elle énonce au contraire qu'« aucune pièce n'établit que la température ait effectivement
  dépassé 4 °C » — et se limite aux calculs tirés du dossier (1 840 − 1 792 = 48 barquettes exclues du
  poste « marchandise détruite », écart 6 h 40 / 11 h 12 de 4 h 32, fenêtre aveugle de 2 h 40).
