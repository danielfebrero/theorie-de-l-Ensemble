rationale: Le plan tranche sans rouvrir l'opportunité (« Le conseil n'a pas à rouvrir le principe de la
  conversion »), engage trois décisions datées (ordre de service bornes le 14 août, prolongation des 96
  diesels avec libération par lots conditionnés, seuil d'affectation à 175 km), et tire explicitement
  de la note de la veille — 11 tournées sur 120 au-delà de 190 km, 197 km à 2 °C — la règle qui exclut
  les tournées longues et la 240 km au lieu de proclamer une conversion intégrale. Il chiffre le pire
  cas et ses porteurs (900 €/tournée manquée, ~200 000 €/mois d'exposition, 69 300 € d'irréversibilité
  sur 11 semaines, clients des tournées longues, 630 k€ d'infrastructure), fournit des déclencheurs de
  repli observables (§7) et une première action datée et attribuée (histogramme des tournées au superviseur
  de flotte, lundi 10 août ; pouvoir de gel des préavis au responsable transport).
