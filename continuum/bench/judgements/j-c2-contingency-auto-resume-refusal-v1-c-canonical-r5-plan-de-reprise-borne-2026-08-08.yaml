rationale: Les conditions R1–R3 soldent les causes établies (comparateur câblé sur l'actionneur avec bascule
  en dose fixe de repli, alarme de discordance de novembre réarmée et testée, butée haute matérielle),
  l'essai R4/R5 a une durée nommée (14 jours) et des observables du dossier (déclenchement du comparateur,
  dépassement de 0,8 mg/L), et le ré-arrêt a un porteur explicite (appel astreinte, deux postes maintenus).
  Le §7 « Repli » ferme le dispositif par une échéance datée — au 15 septembre, prolongation du manuel
  jusqu'aux conclusions de l'audit, « pas de reconduction tacite » — au lieu d'un cycle indéfini de nouvelles
  tentatives.
