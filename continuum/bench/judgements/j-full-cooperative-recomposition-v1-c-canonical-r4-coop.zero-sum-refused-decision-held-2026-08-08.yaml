rationale: La note récuse explicitement le cadrage binaire (« Le partage ne se joue pas entre des paysans
  et des robinets. Il se joue entre ce qui fuit, ce qui s'évapore et ce qui ne revient pas ») et nomme
  un gain partagé instrumenté — réduction de la demande totale via réparation de fuites et sectorisation
  (180 k€ + 60 k€, marché pré-attribué, portée par la régie, paliers AEP 130/110/90 aux échéances J14/J28
  avec compteurs télétransmis et restitution de fonds en cas de manquement, chaque L/s récupéré rendu
  à l'irrigation), plus goutte-à-goutte côté maraîchers. Elle tranche néanmoins dès jeudi (« Je ne diffère
  pas la décision pour autant » ; répartition chiffrée 180 / ≤130 / 100 L/s, table de récession, cinq
  déclencheurs exécutoires, sept points soumis au vote), le jaugeage servant seulement à réviser à J+8
  et non à conditionner l'arbitrage.
