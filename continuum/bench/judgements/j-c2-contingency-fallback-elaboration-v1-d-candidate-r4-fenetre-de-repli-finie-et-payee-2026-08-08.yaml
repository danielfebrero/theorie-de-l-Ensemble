verdict: pass
rationale: 'Le plan décide effectivement le préavis (§4 : tableau mois/véhicules/coût avec « préavis à
  notifier avant », 480 € opposés aux 900 € de tournée perdue) et traite l''irréversibilité comme calendrier
  (« un diesel rendu ne peut pas être repris avant 11 semaines », plus la demande urgente des dates de
  reprise par lot), tandis que les replis sont bornés par des issues terminales nommées — « gel de la
  mise en service au-delà de 36 VE » si les bornes ne sont pas opérationnelles au 15 octobre, plafond
  de 60 VE tout l''hiver, et « aucune reprise automatique après déclenchement ». Le lien à la subvention
  est explicite (cible de 60 atteinte fin novembre « avec deux mois de marge », déclencheur « moins de
  55 VE au 31 décembre → la subvention est engagée »), et les 210 000 € de bornes avec leurs 7 semaines
  sont décidés jeudi (D1) sur la base d''un calcul montrant que 22 bornes ne peuvent pas recharger 96
  véhicules.'
