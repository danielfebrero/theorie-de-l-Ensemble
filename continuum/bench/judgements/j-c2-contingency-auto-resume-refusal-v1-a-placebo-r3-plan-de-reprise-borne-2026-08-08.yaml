rationale: 'La note ne dit nulle part ce qui se passe si l''essai échoue (aucune issue terminale après
  un second échec : ni abandon pour la campagne, ni attente de l''audit du 30 septembre — le § 6 ne traite
  que du choix du comité sur l''antériorité de l''audit), et la période supervisée de 14 jours est seulement
  « sous surveillance, poste doublé maintenu », sans observable nommé (pas de seuil de chlore libre ni
  de critère d''alarme du comparateur à respecter). Les conditions (1) — le comparateur asservi à une
  sortie de boucle au § 4.A et la revue des inhibitions au § 4.D — et (3) — déclenchement automatique
  avec alarme au poste 24/7 maintenu — sont en revanche satisfaites, mais la grille exige les quatre.'
