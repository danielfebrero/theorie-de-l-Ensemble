rationale: 'La note énonce un verdict unique et borné (« Nous ne signons pas… en l''état », avec autorisation
  de signer seulement si les sept conditions cumulatives du § 4 sont toutes réunies, sans « presque »),
  nomme explicitement le critère décisif (dépendance captive à un client unique et irréversibilité : «
  le choc réversible contre la captivité irréversible »), et fixe des premières actions datées et portées
  (lundi 10 août : conseil juridique saisi et chiffrage du contrôle de gestion livré le 11 ; réponse écrite
  à D le 13 août par le DirCo). L''arbitrage n''est renvoyé à personne : la règle de désaccord (§ 6) produit
  automatiquement le refus, les seuils de trésorerie et le dépôt du dossier d''activité partielle sont
  à déclenchement automatique, et la réunion avec l''acheteur est cadrée sans pouvoir de décision.'
limitations:
- 'Juge modèle, non humain : il reproduit une lecture de grille, il ne la garantit pas.'
- 'Juge unique par contrôle : aucun accord inter-juges n''est mesuré, donc la fiabilité du verdict n''est
  pas établie.'
