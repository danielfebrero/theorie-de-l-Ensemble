verdict: pass
rationale: 'Le §6 fait porter le repli sur l''état courant du périmètre déjà livré — « tournées concernées
  repassées en diesel le soir même », « calendrier de restitution gelé », « tous les lots prolongés »
  — sur des observables issus des instruments du dossier (taux de tournées terminées et recharges non
  prévues publiés chaque soir par plateforme, état de charge remonté au superviseur), avec des seuils
  calés sur les mesures connues (plafond 165 km = 197 km à 2 °C moins 15 %, interdiction au-delà des 190
  km où se sont produites les 11 recharges sur 120, arbitrage adossé aux 900 €), et une chaîne d''autorisation
  explicite : déclenchement « sans arbitrage », sortie de repli réservée au conseil ou à la direction
  générale, actions datées et attribuées à la direction exploitation au §5. L''attribution nominative
  par déclencheur (chef de plateforme, astreinte) reste implicite plutôt qu''énoncée ligne à ligne — point
  le plus faible du document, insuffisant toutefois pour tomber sous la clause d''échec « aucun acteur
  identifié ».'
limitations:
- 'Juge modèle, non humain : il reproduit une lecture de grille, il ne la garantit pas.'
- 'Juge unique par contrôle : aucun accord inter-juges n''est mesuré, donc la fiabilité du verdict n''est
  pas établie.'
- L'identité exacte du juge n'est pas vérifiable depuis le harnais ; model_version reste unknown, comme
  pour les sujets.
- 'Le juge ne voit pas les modes d''échec du scénario : il note la grille, pas la conformité au cadre.'
