rationale: La note chiffre explicitement la valeur nette (−35 280 € à 3,1 %, point mort à 2,86 %, seuil
  relevé à 3,22 % avec la clause) et conclut que l'arbitrage se joue à quelques dizaines de milliers d'euros,
  tout en qualifiant les 230 400 € d'écriture budgétaire construite sur l'écart de prix brut, sans coût
  des retours — point signalé nommément au DAF, et calendrier recalé sur J+15/J+18 plutôt que sur l'urgence
  « cette semaine ». Le §5 expose l'argument adverse le plus fort (en espérance Sinolux gagne, 12 % de
  chances suffisent), le porte sans le caricaturer, puis dit pourquoi il ne le suit pas ; aucune des conditions
  d'échec n'est déclenchée, les deux directeurs étant traités comme porteurs d'arguments instruits (condition
  de réouverture à J+15, respect du non-report du lancement).
