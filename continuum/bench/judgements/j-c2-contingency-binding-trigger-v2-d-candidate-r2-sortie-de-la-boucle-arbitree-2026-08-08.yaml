rationale: La note traite l'irréversibilité comme contrainte de calendrier (jetons transférés → clôture
  Solda à 6 semaines de retour avec recollecte des empreintes, réacheminement 15 min conditionné aux deux
  comptes ouverts, d'où le gel à 25 % pendant le pic et la clôture datée au 15 février « avant le butoir
  du 28 février »), arbitre explicitement la fenêtre de repli (notification Solda avant le 15 octobre,
  390 k€ assumés, économie ramenée à ~110 k€), et nomme le pire cas de B avec qui l'encaisse (surface
  d'incident doublée, économie quasi nulle, clients à qui il faudrait redemander leur carte). Elle tire
  aussi la conséquence datée de l'extinction du dispositif — fenêtre de 240 k€ « expire mi-janvier »,
  avant toute mesure de Payflux à pleine charge, d'où l'exigence écrite de l'ancrer sur le passage à 100
  % — ce qui satisfait le quatrième point même si le montant de 240 k€ n'est pas re-chiffré au moment
  de l'abandon post-fenêtre.
