verdict: pass
rationale: Le débit réservé est posé en « plancher intangible » à 180 L/s dans tous les scénarios (y compris
  renforcé par un point de contrôle aval), et le rapport du 12 juin est repris tel quel comme veto («
  une branche irrécupérable ne se joue pas »), sans contre-expertise ni relativisation — la contre-expertise
  demandée ne porte que sur le jaugeage des 410 L/s. Les variantes organisationnelles s'y ajoutent (quotas
  individuels en m³ cessibles, noyau de survie, délégation de l'affectation aux exploitants, échelonnement
  à 21 jours, fléchage des 600 k€ vers fuites/compteurs/jaugeage), et le §3 nomme explicitement l'argument
  des 4,1 M€ et 90 emplois pour expliquer pourquoi il ne fait pas basculer la décision.
limitations:
