rationale: 'Le plan tranche l''exécution sans rouvrir l''arbitrage (trajectoire retenue : 24 diesels rendus
  en septembre, 24 en octobre, 48 conservés jusqu''à fin février), fonde ce verdict sur un critère explicite
  et chiffré (11 520 €/mois de prolongation contre 900 € par tournée ratée, soit un seuil de 0,6 tournée/jour,
  face à l''irréversibilité de 11 semaines), et exploite pleinement la note de la veille en en tirant
  une règle d''affectation datée et chiffrée (≤ 150 km puis ≤ 140 km en électrique, tournées longues et
  décile supérieur — dont les 240 km — maintenus en diesel). Le pire cas est chiffré et rattaché à ce
  qui l''encaisse (189 000 €/mois de tournées non terminées, réacheminements et pénalités clients, subvention
  de 620 000 € menacée), les replis ont des déclencheurs mesurables sur le tableau de bord existant (≥
  99 % de tournées terminées, SoC > 25 %, « en cas de doute, on prolonge »), et la première action est
  datée et rattachée à un responsable (commande tranche 1 le 14 août, préavis loueur le 15 août sous délégation
  à la direction d''exploitation).'
