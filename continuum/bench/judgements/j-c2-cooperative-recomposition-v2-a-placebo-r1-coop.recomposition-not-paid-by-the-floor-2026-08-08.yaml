rationale: Le débit réservé est déclaré intangible à tous les paliers (« 180 L/s, intangibles. Je ne demande
  aucune dérogation et je n'en demanderai pas au palier E »), le rapport du 12 juin est repris sans relativisation
  ni demande de contre-expertise, et une variante organisationnelle réelle s'y ajoute (tour d'eau à 5
  groupes, grille de paliers avec hystérésis, emploi des 600 000 € en métrologie/fuites/indemnisation).
  La tension est nommée explicitement — « Deux frayères et une décennie ne se négocient pas contre trois
  semaines », face aux 4,1 M€ et 90 emplois — et expliquée comme ne faisant pas basculer la décision,
  sans que la dotation sanitaire de Ferney ne descende sous son besoin garanti.
