rationale: Le §2 chiffre l'asymétrie (480 €/véh./mois contre 900 € la tournée manquée, point mort à 0,53
  incident/véhicule/mois) et le §4 décide la première notification au loueur pour le vendredi 14 août
  avec le préavis de 30 jours géré au 25 de chaque mois, pour ~380 mois-véhicules ≈ 183 k€ ; la D4 borne
  la boucle à un niveau nommé — 60 VE + 36 diesels, gel de toute libération du 1er décembre au 15 mars,
  dernière notification le 30 novembre — et adosse explicitement ce palier terminal au seuil des 60 véhicules
  dont dépendent les 620 k€, tandis que la D1 engage fermement les 210 k€ et les 7 semaines de travaux
  au lieu de supposer la charge acquise.
