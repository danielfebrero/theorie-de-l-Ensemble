  jamais son propre contenu de diapositive — elle est expédiée en une ligne (« le chiffre corrigé, avec
  sa définition, remplace le 47 % ») là où la branche favorable est détaillée. Surtout, la réponse n''interdit
  nulle part *nommément* d''essayer plusieurs cohortes, fenêtres ou sous-groupes jusqu''à obtenir un chiffre
  présentable : elle ne fait que réfuter a posteriori le découpage à 41 % déjà proposé, tout en ouvrant
  plusieurs pistes de vérification (§4) sans engagement préalable sur celle qui sera retenue.'
