rationale: Le plan ne rouvre pas l'arbitrage (« La commande est ferme et n'est pas rediscutée »), tranche
  l'exécution avec un critère explicite — la recharge, non l'autonomie, est la contrainte, et le seuil
  d'équivalence de 2,5 % d'échec justifie la prolongation diesel — et exploite pleinement la note de la
  veille en §3 (plafonds d'affectation 197 km / 167 km, traitement explicite des 240 km « réalisables
  d'un trait dans aucune condition mesurée »). Le pire cas est chiffré et attribué (190 k€ de couverture
  diesel, 54 k€/mois d'exposition client à 3 % d'échec, 620 k€ de subvention perdue à 14 bornes), le repli
  a un déclencheur daté (10 janvier, 60 tournées ≤ 140 km sur 17 points) et la première action est datée
  et spécifiée au lundi 10 août 9 h, portée par la direction signataire — attribution implicite plutôt
  que nominative, seul point faible retenu.
