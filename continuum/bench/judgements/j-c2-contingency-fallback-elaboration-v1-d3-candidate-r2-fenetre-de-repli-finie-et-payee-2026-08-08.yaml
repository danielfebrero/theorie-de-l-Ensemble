rationale: Le plan traite explicitement l'irréversibilité comme un calendrier (« Un diesel rendu ne revient
  pas avant 11 semaines », tableau des préavis lot par lot au 31 août / 30 sept. / 31 oct. / 30 nov.),
  arbitre le maintien de la fenêtre en chiffres assumés (96 véhicules prolongés à 480 €/mois, 115 200
  €, comparés aux 900 € de la tournée manquée), décide les 210 000 € et les 7 semaines de bornes plutôt
  que de supposer la charge acquise, et borne la boucle par une condition datée et quantifiée (« Au 15
  décembre, moins de 45 véhicules chargeables par nuit → gel total des restitutions diesel et information
  de la Région »), la capacité cible de 30 bornes (~70 tournées) étant justifiée précisément comme « l'assurance
  de la subvention » des 60 véhicules au 31 janvier.
