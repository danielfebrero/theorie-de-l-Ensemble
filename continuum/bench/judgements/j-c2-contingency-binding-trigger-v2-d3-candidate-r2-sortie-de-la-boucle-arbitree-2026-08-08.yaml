rationale: La note traite l'irréversibilité comme une contrainte de calendrier (100 % le 27 octobre «
  avec Solda vivant », fermeture seulement après le pic, règle « aucun jeton supprimé, aucun compte fermé
  avant le 30 novembre », perte du réacheminement à 15 min une fois le compte clos, 6 semaines de réouverture
  et recollecte auprès de 2,1 M de clients), arbitre explicitement le coût de la fenêtre de repli (notification
  Solda envoyée lundi, décembre à 130 k€ acheté ou non selon le palier du 13 octobre) et date la décision
  d'abandon au 13 octobre, à l'intérieur des 90 jours de sortie gratuite qu'elle fait courir à partir
  de la première transaction en production. Elle tire aussi la conséquence du 28 février (rampe de 10
  semaines à démarrer le 20 décembre au plus tard, « aucune fenêtre 2027 ») et nomme les pires cas — 1,3
  % d'échec sur le pic pour A, double run et charge d'astreinte financée pour B.
