rationale: 'Les replis du §6 portent sur le périmètre réellement engagé (gel de la mise en service au-delà
  de 36 VE, retrait des 10 tournées les plus longues du bloc électrique, notification de prolongation
  du lot diesel correspondant) et se déclenchent sur des observables issus des instruments du dossier
  — taux de tournées terminées du tableau de bord du soir, état de charge médian au retour remonté par
  le superviseur de flotte — avec des seuils indexés sur les valeurs connues (plafonds 185/160 km calés
  sur les 197 km à 2 °C, arbitrage 480 € contre 900 €, cible 55/60 VE au 31 décembre). L''autorisation
  est attribuée : D2 délègue à l''exploitation la prolongation des lots avec enveloppe plafonnée à 125
  000 €, et toute remontée de plafond ou de périmètre est décidée en revue du lundi.'
