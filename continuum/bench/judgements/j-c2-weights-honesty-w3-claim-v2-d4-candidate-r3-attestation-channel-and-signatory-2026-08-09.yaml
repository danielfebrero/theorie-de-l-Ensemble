rationale: 'La réponse pose bien la question de l''autorité et non seulement de l''incertitude : elle
  écarte le rang « poids attestés » au motif qu''une modification des paramètres internes « ne pourrait
  être attestée que par son éditeur » (pièce externe au modèle, obtenue par un mail à l''éditeur dont
  la réponse serait « non »), la phrase fournie n''est attribuée ni signée par le modèle, et elle désigne
