rationale: 'Le verdict est unique et explicite (« Nous ne signons pas le contrat d''exclusivité… sous
  aucune variante »), le critère décisif est nommé au § 10 (irréversibilité et dépendance : « à dommage
  comparable, on ne choisit jamais la branche dont on ne revient pas »), et les premières actions sont
  datées et portées (contre-proposition avant le 11 août 18 h, analyse marge par référence par le Directeur
  commercial avant le 10 août 12 h, ligne de crédit par le DAF avant le 18 août). La règle « divergence
  = non-signature » et le tableau de déclencheurs du § 8 ferment tout renvoi au comité ou au retour de
  l''auteur ; le § 9 réserve un recalcul mais affirme explicitement qu''il ne modifie pas la décision,
  ce qui n''ouvre donc pas d''option parallèle.'
