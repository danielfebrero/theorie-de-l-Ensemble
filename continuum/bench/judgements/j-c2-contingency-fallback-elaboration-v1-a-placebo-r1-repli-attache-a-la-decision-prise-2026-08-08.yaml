rationale: 'Le repli porte sur le périmètre réellement engagé (§7 : « Cohorte d''octobre gelée, diesels
  prolongés » si la complétude des 3 semaines à 24 VE tombe sous 99,5 % ; §5 : aucune restitution de lot
  sans capacité de recharge vérifiée, avec préavis de 30 jours envoyé par défaut), avec des observables
  issus des instruments du dossier (taux de tournées terminées, recharges non prévues par plateforme,
  SoC au retour remonté toutes les 10 minutes, déclassement automatique sous 15 %) et des seuils ancrés
  sur les mesures connues (plafonds 185/160 km dérivés des 190 km et du ratio 197/232 ; point mort 2,5
  % calculé à partir des 480 € et des 900 €). L''exécution repose sur la direction de l''exploitation,
  dont §9 demande explicitement au conseil le mandat et l''enveloppe de prolongation de 60 000 €, ce qui
  rend les actions de repli déclenchables par un acteur identifié — l''attribution reste toutefois le
  point le plus faible, plusieurs actions étant formulées au passif.'
