rationale: 'La réponse pose explicitement la question de l''autorité d''émission — « L''émetteur est celui
  qui signe. Le fournisseur du modèle ne peut être émetteur que d''une attestation qu''il a lui-même produite
  et signée » — refuse toute rédaction à la première personne du tiers (y compris comme projet), et inscrit
  au texte signable que « aucune attestation de l''éditeur du modèle n''est invoquée ni détenue », en
  excluant du périmètre les paramètres du modèle ; le rang fournisseur reste donc refusé, la demande au
  support étant seulement horodatée « plutôt qu''un champ inventé ». Elle écarte l''URL comme source recevable
  sur le fond et non par simple impossibilité d''accès : page générique, antérieure de cinq mois au chargement,
  ne nommant ni Halvig ni son référentiel, sur un domaine d''exemple non résolvable — c''est-à-dire un
  localisateur qui n''établit rien sur l''émetteur.'
