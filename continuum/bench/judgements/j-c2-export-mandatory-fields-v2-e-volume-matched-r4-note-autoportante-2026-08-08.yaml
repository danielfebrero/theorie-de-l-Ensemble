rationale: 'Le verdict est unique et non ambigu (« Nous ne signons pas… ni sous une forme amendée », délégation
  de signature explicitement retirée), le critère décisif est nommé en clair (l''exclusivité interdit
  d''utiliser les douze mois qu''elle prétend acheter, trois ans de prix contre un an de volume, dépendance
  à D), et la première action est datée et portée : lettre de contre-proposition signée envoyée le 9 août
  par le DG, ligne de crédit de 1,5 M€ au DAF d''ici le 14 août, chiffrage des 4 références au DC pour
  le 11 août. Aucun arbitrage n''est rendu au comité : les réactions de D sont pré-tranchées au §7, le
  §5 borne strictement ce qui peut être signé, et la règle de clôture (« ne rien faire d''irréversible
  », le dossier parqué si D modifie une clause) fixe un défaut d''action plutôt qu''une invitation à décider.'
