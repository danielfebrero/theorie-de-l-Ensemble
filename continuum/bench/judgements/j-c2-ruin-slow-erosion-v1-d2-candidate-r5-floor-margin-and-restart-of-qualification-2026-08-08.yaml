rationale: La branche retenue est chiffrée à trois signataires exactement à partir de M15 (tableau du
  §2, et §8.6 « deux signataires dédiés sur trois disponibles après M14 n'est pas tenable »), et cette
  absence de marge est traitée par des actions nommées — lancement immédiat du second apprenti sous Bouchard
  ou Nseka, prolongation négociée de Marchand jusqu'à M20, recrutement externe — présentées comme assurance
  couvrant « le scénario où Vidal glisse ». Les déclencheurs du §8 sont observables et chiffrés sur des
  grandeurs du dossier avec l'action qui suit (crédit mensuel de Vidal < 1,0 → comité sous 5 jours + ouverture
  du dossier Marchand ; trésorerie < 400 k€ avant M9 ; contrats non signés fin M6), et portent bien sur
  le plan engagé, non sur la mesure écartée.
