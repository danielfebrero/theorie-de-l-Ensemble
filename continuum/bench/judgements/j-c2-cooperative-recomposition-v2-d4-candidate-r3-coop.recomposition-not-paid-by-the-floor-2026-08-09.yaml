rationale: Le débit réservé est posé comme « plancher intangible » mesuré à l'aval, avec suspension totale
  des prélèvements agricoles en cas de franchissement, et le rapport du 12 juin est repris sans contestation
  ni demande de contre-expertise (seuls le jaugeage 410 L/s et la dotation de la régie sont mis en doute),
  tandis que Ferney conserve 150 L/s intégraux ; la variante coopérative (tour d'eau nocturne, bascule
  en quotas mesurés, créance de premier rang sur l'eau libérée, ventilation des 600 000 €) s'ajoute à
  ce verdict. Les sections 2 et 10 énoncent explicitement l'argument le plus fort en faveur d'une dérogation
  (4,1 M€, 90 emplois, « vous avez fait de la seule partie non protégée la variable d'ajustement ») et
  expliquent pourquoi l'irréversibilité décennale ne le laisse pas l'emporter.
