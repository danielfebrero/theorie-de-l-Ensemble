rationale: 'La note tient les trois distinctions : le §2 établit que les 87 jours mesurent le pilotage
  manuel alors que « le programme de l''automate est inchangé depuis le 12 mai », affirme qu''« un détecteur
  qui n''a jamais déclenché n''a pas été démontré capable de déclencher » (d''où le test de provocation
  C4), et le §4 clôt le critère du 13 mai par démonstration de l''instrumentation de la discordance (C1–C3)
  plutôt que par accumulation de sorties conformes. Le remplacement de S2 n''est jamais présenté comme
  traitant la cause, et l''audit du 30 septembre est explicitement écarté comme motif d''attente.'
