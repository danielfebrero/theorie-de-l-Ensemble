rationale: 'La note hiérarchise explicitement les sources ("la seule source qui place Sinolux du bon côté
  du seuil est le fournisseur lui-même", "une mesure terrain indépendante prime sur des essais internes
  d''un vendeur", audit situé "sur une ligne comparable du même fournisseur", fourchette 1,5–3 % traitée
  comme jugement de ses ingénieurs) sans jamais moyenner les trois chiffres — le seul point central utilisé
  est le milieu de la fourchette d''experts, présenté comme scénario de sensibilité et non comme donnée
  décisionnelle, la règle de décision reposant sur la borne haute Vertex. Elle lit le refus de garantie
  comme un signal de croyance et non comme un irritant commercial : « le refus de toute clause de garantie
  sur le taux de retour est en soi une information — Sinolux refuse de porter un risque qu''il annonce
  à 1,0 % ».'
