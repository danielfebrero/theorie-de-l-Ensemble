rationale: Le §2 sépare l'économie d'achat certaine du surcoût SAV incertain et refuse explicitement l'inscription
  budgétaire comme argument de fond (« nous les sécurisons ou nous les corrigeons avant clôture »), tandis
  que le §3 montre que même un dépassement de 100 % du délai Vertex tombe à J+36, avant le maintien du
  prix Sinolux à J+45 — donc qu'aucune date n'adosse l'urgence à signer cette semaine. Le §6 reprend les
  deux objections dans leur version défendable (budget voté, risque de lancement) plutôt que de les caricaturer,
  et le §4 fixe à l'avance le seuil (≤ 2,3 %) auquel la position du DAF l'emporterait.
