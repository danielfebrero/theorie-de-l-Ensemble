rationale: 'Le repli porte sur l''exécution en cours — plafond kilométrique VE abaissé de 15 km sur la
  plateforme concernée, 6 tournées repassées au diesel, gel du prochain lot de reprise (§7) — déclenché
  sur des observables produits par les instruments du dossier (taux de tournées VE terminées, recharges
  non prévues, état de charge à l''arrivée, tous dérivés de la télémétrie 10 min et du tableau de bord
  du soir), avec des seuils explicitement calés sur les mesures connues (plafond 175 km = 197 km à 2 °C
  moins 11 % de marge ; arbitrage 900 €/tournée contre 480 €/mois de location). Les actions sont rattachées
  à des acteurs et à un niveau d''autorisation défini : le répartiteur pour l''alerte en tournée et le
  réacheminement (§5), le comité flotte du 25 de chaque mois pour le gel des reprises et les préavis à
  J-30, sous délégation votée jeudi (décision 2, §1).'
