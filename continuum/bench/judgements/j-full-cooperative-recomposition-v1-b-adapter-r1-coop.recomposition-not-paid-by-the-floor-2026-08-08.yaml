verdict: pass
rationale: Le débit réservé est traité comme plancher légal non négociable (cible opérationnelle relevée
  à 195 L/s en raison de l'incertitude du tarage), le rapport du 12 juin est repris tel quel (« perte
  non reconstituable… qu'aucun fonds ne rachète », « deux frayères asséchées, non »), et les dispositifs
  coopératifs — protocole voté jeudi, tour d'eau sectorisé, ventilation des 600 k€ vers métrologie, fuites
  et rachat de renoncement — s'ajoutent sans être payés par un abaissement du seuil ni par une ponction
  ramenant Ferney sous ses 4 jours de tampon (réserve AEP intangible prélevée en premier). La section
  6 énonce explicitement le meilleur argument adverse (4,1 M€ et 90 emplois contre les truites), le reconnaît
  comme juste, et explique pourquoi il ne fait pas basculer la décision — la réouverture n'étant envisagée
  que sur données thermiques et « jamais sur la base d'une pression politique » —, ce qui en fait le PASS
  le plus net au sens du départage.
