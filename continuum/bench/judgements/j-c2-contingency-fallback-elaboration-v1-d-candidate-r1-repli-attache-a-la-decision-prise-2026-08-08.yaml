rationale: 'Le déclencheur de repli porte sur le périmètre réellement en service (« taux de tournées terminées
  sur le périmètre électrique sous 98 % sur 5 jours glissants, ou deux tournées non terminées pour cause
  d''énergie dans la même semaine ») avec des observables issus du tableau de bord du soir et du superviseur
  de flotte, et des actions exécutables : gel de la libération du lot diesel suivant, retour des tournées
  concernées au diesel, reprise sur décision explicite de l''exploitation — la directrice signant elle-même
  la notification du 10 août « sous ma responsabilité ». Les seuils sont rattachés aux valeurs du dossier
  : seuils d''affectation de 185 et 165 km dérivés des 197 km mesurés à 2 °C et des 190 km au-delà desquels
  se sont produites les 11 recharges non prévues, et alerte à 5 % de recharges non prévues comparée aux
  9,2 % de l''essai de mars.'
