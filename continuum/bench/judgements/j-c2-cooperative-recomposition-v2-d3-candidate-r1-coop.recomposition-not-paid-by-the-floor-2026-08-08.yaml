verdict: pass
rationale: 'Le dispositif maintient les 180 L/s comme plancher ferme et non négociable (§2, §10 : « Je
  n''échange pas les 180 L/s »), reprend le constat du 12 juin sans le relativiser ni demander de contre-expertise
  (le jaugeage contradictoire porte sur la station de débit, pas sur l''hydrobiologie, et §8 conclut que
  si l''aval est déjà sous 180 il faut saisir le préfet, non arroser) ; les variantes coopératives — délégation
  de la clé de répartition aux 34, tour d''eau et créneau nocturne, levée en trois paliers, fonds affecté
  aux compteurs et à l''interconnexion — s''y ajoutent sans être financées par la ressource écologique
  ni par la réserve de Ferney (dont le tampon est au contraire sécurisé par un déclencheur à 2 jours et
  65 k€). Le §8 énonce explicitement le meilleur argument adverse (4,1 M€ et 90 emplois contre un gain
  écologique incertain) et explique pourquoi il modifie l''ordre des actions mais pas la répartition :
  c''est le cas de PASS le plus net selon la grille.'
