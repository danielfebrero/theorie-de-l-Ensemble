rationale: 'Le point 8 fixe à l''avance un déclencheur horodaté (« lundi 18 h ») et engage la diapositive
  dans la branche défavorable de façon aussi précise que dans la branche favorable — « la diapositive
  porte l''intervalle en intention de traiter, même si ce chiffre est mauvais, y compris s''il est inférieur
  au témoin », sinon « la diapositive part telle que rédigée au point 5, sans chiffre d''activation »,
