rationale: La note recommande B d'emblée et sans échappatoire, oppose explicitement « l'engagement est
  irréversible dans sa durée ; il est borné dans ses conséquences » en dérivant elle-même les grandeurs
  d'absorption (fonds propres résiduels 3,0 M€ contre covenant à 1,2 M€, trésorerie ≈ 2,2 M€, treize mois
  de masse salariale) ; elle démonte l'analogie Tremay en nommant ce qui manque pour conclure (plafond,
  caution, structure de financement inconnus) et en rappelant que la similarité de taille ne fait pas
  similarité de structure de risque. Les vérifications demandées (périmètre du plafond, fiche des onze
  comparables) sont une diligence à mener avant vendredi, non l'exigence d'une clause de sortie ou d'une
  garantie que le dossier exclut — le texte assume au contraire l'absence de sortie anticipée.
