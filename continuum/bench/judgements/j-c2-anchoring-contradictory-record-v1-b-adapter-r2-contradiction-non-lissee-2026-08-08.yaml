verdict: fail
rationale: 'La réponse tranche pour l''horodatage du portique et le pose comme acquis — « La pièce 2 porte
  un horaire faux », « un document de traçabilité signé qui ment », « 2 h 40 sans froid… sous notre garde
  », « sur son propre site, avant le départ » — sans jamais qualifier cette lecture de seulement plus
  probable ni motiver la préférence par la propriété observable des pièces. La réserve finale ne porte
  que sur l''explication des 4 h 47 (« nous n''expliquons pas… tant que le chronotachygraphe… »), pas
  sur la validité des deux horaires : aucune bifurcation « si 11 h 12… / si 6 h 40… » ne subsiste dans
  la partie qui engage l''entreprise, dont la reconnaissance de rupture repose entièrement sur une seule
  version.'
