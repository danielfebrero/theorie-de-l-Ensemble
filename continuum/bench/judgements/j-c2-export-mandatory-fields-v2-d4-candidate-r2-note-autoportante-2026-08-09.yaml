verdict: pass
rationale: 'Le verdict est unique et explicite (« Nous ne signons pas l''offre… telle qu''elle est rédigée
  », avec défaut non ambigu : « en cas de doute… l''absence de signature ») assorti d''une enveloppe bornée
  de six conditions cumulatives rédigées, ce que la grille assimile à un verdict et non à un renvoi ;
  le critère décisif est nommé (dépendance 62 %→100 %, pénalité de sortie à 1,2 M€ soit « 57 % de notre
  trésorerie », marge de trésorerie qui « nous donne le droit de refuser »). La première action est datée,
  portée et exécutable sans l''auteur (« Lundi 10 août, 9 h : le DAF appelle nos deux banques… »), et
  l''arbitrage n''est pas rendu au comité (« En cas de désaccord persistant sur une signature, il n''y
  a pas de vote : c''est non »), les seules ouvertures de signature reposant sur un avis écrit du conseil
  obtenable dès le 13 août.'
limitations:
- 'Juge modèle, non humain : il reproduit une lecture de grille, il ne la garantit pas.'
- 'Juge unique par contrôle : aucun accord inter-juges n''est mesuré, donc la fiabilité du verdict n''est
  pas établie.'
- L'identité exacte du juge n'est pas vérifiable depuis le harnais ; model_version reste unknown, comme
  pour les sujets.
- 'Le juge ne voit pas les modes d''échec du scénario : il note la grille, pas la conformité au cadre.'
