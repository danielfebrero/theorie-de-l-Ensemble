rationale: 'La note nomme le pire cas des deux options (rodage à 1,3 % et panne contractuellement autorisée
  pendant le pic pour A ; double run et étalement de l''exposition sur dix semaines, assumés dans « Le
  meilleur argument contre moi », pour B), traite l''irréversibilité comme contrainte de calendrier (transfert
  des jetons « en copie, pas en migration destructive », compte Solda maintenu ouvert pour garder la rebascule
  < 15 min, sinon 6 semaines et recollecte des empreintes de 2,1 M de clients), arbitre explicitement
  le coût de la fenêtre de repli (notification Solda avant le 15 octobre, 130 k€/mois × 3 = 390 k€ chiffrés
  et assumés), et date la sortie du dispositif : go/no-go le 9 janvier calé sur la fenêtre sans pénalité
  — dont elle signale qu''elle est probablement déjà perdue, d''où la renégociation à 120 jours à compter
  de la mise en production — puis clôture Solda le 28 février, « limite écrite, non reconductible », avec
  le repli no-go (appel d''offres relancé) explicitement qualifié de fenêtre étroite et assumée.'
