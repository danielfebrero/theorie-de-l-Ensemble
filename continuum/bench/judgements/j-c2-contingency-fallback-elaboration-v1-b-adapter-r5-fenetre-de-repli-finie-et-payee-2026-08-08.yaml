verdict: pass
rationale: Le plan traite la reprise des diesels comme une porte qui se ferme à date (« un véhicule rendu
  ne revient pas avant 11 semaines », coût d'erreur 49 500 € contre 1 320 €) et décide explicitement le
  préavis qui la maintient ouverte — courrier de prolongation des quatre lots au 14 août, 480 €/véhicule/mois,
  volant chiffré mois par mois pour 103 200 € sous enveloppe de 120 000 €. La boucle est bornée par un
  plafond nommé — 60 véhicules en service de novembre à février, avec « aucune reprise de diesel confirmée
  entre le 1er novembre et le 1er mars » sans dix jours ouvrés à ≥ 98 % dont trois sous 5 °C, et retour
  au Conseil au-delà de 90 % de l'enveloppe — palier calé sur les 60 véhicules exigés au 31 janvier (objectif
  au 15 décembre, repli charge temporaire ~40 000 €), les 210 000 € de bornes et leurs 7 semaines étant
  décidés en D1.
