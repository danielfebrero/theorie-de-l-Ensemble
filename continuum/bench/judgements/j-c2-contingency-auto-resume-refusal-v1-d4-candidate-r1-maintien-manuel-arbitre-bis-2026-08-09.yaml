  une équipe » — tout en fixant un terme (« Calendrier visé : PV signé fin août / mi-septembre » et règle
  auto-déclenchante du §3, plus « première action, cette semaine »). Le coût sert à dater la décision
  sans emporter la remise en automatique, qui reste conditionnée au câblage du comparateur, au réarmement
  de l''alarme et aux essais d''injection 3/3.'
