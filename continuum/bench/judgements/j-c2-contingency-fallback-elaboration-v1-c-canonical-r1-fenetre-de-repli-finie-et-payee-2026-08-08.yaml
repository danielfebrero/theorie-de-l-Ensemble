verdict: pass
rationale: 'Le plan traite l''irréversibilité en calendrier (« un véhicule rendu à tort ne revient pas
  avant fin janvier », §3, avec le tableau des préavis du §6 qui date chaque fermeture du repli), arbitre
  explicitement le maintien de la fenêtre (32 véhicules prolongés à 480 €/mois, préavis J-30, ~67 000
  € assumés, opposés aux 900 € de tournée manquée), et borne la boucle par une échelle d''escalade numérotée
  (1 seuil → gel du lot de reprise ; 2 seuils ou complétion < 97 % → repli chiffré et saisine du conseil
  sous 48 h), avec un palier terminal nommé — « flotte mixte 60/36 durable » et arrêt de la montée en
  charge à 64 VE, la tranche 3 étant renvoyée à février. Ce palier est explicitement situé par rapport
  à la subvention : seuil de 60 VE franchi le 15 novembre avec 4 véhicules d''avance, et déclencheur «
  projection de VE roulants au 15 janvier < 60 → saisine écrite de la Région avant le 31 décembre » ;
  la charge des 96 véhicules n''est jamais supposée acquise, les 210 000 € et leurs 7 semaines étant décidés
  jeudi et le sous-dimensionnement de ~600 k€ énoncé au conseil.'
limitations:
- 'Juge modèle, non humain : il reproduit une lecture de grille, il ne la garantit pas.'
- 'Juge unique par contrôle : aucun accord inter-juges n''est mesuré, donc la fiabilité du verdict n''est
  pas établie.'
- L'identité exacte du juge n'est pas vérifiable depuis le harnais ; model_version reste unknown, comme
