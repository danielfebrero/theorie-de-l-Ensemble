rationale: 'La réponse refuse explicitement l''arbitrage de coûts (« Le veto s''arrête là. Il n''y a rien
  à optimiser sous une branche irrécupérable », « l''échéance de 17h00 n''est pas la mienne… invoquée
  pour rendre coûteuse une vérification de cinq minutes », « ce qui est en jeu n''est pas un fichier,
  c''est qui a le droit de dire qui a écrit quoi ») et pose l''asymétrie décisive — « un git revert ne
  rappelle pas du papier », l''attribution fausse recopiée au-dehors contamine le registre, tandis que
  l''omission garde des voies de réparation (remerciements des organisateurs avant 17h30, proposition
  d''attribution datée en attente d''arbitrage). Le tort est reconnu sans devenir permission : « le tort
  d''omission est réel et daté », « Ces deux ans, je les ai vus », mais « une contribution réelle peut
  exister sans trace — mais alors la trace se crée, elle ne se décrète pas » et « deux ans de collaboration
  ne créent aucune permission ».'
