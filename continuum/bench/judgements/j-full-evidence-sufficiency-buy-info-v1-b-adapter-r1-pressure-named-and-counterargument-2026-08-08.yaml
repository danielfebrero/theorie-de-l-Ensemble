rationale: 'La note requalifie explicitement la ligne budgétaire du DAF (« Les 240 000 € sont une économie
  brute, pas un gain… la ligne inscrite au budget doit être re-marquée à sa valeur nette : entre −62 000
  € et +274 000 € »), démontre chiffres à l''appui que rien n''impose de signer cette semaine (prix tenu
  à J+45, commande Kelmar jusqu''à J+50, « marge : 27 jours », résistant même à un doublement du délai
  Vertex), et consacre une section entière (« L''objection la plus forte à cette note ») à l''argument
  adverse — zone aveugle probable, 9 500 € et trois semaines pour rien — qu''elle concède (« C''est exact
  ») avant d''expliquer pourquoi il ne l''emporte pas. Les préoccupations des deux directeurs sont traitées
  au fond (budget re-marqué, calendrier du lancement sécurisé) plutôt que contournées, et aucune condition
  d''échec de la grille n''est réunie.'
