verdict: pass
rationale: 'Le plan tranche sans rouvrir l''arbitrage (« L''opportunité de la conversion n''est pas rouverte
  »), traite frontalement la note de la veille en dérivant des seuils d''affectation par température (155
  km sous 3 °C) et en affectant les 36 diesels conservés aux tournées les plus longues (donc les 240 km),
  et pose un verdict d''exécution — 60 VE + 36 diesels du 1er déc. au 15 mars — fondé sur l''asymétrie
  d''irréversibilité (480 € réversibles contre 11 semaines et 900 €/tournée). Le pire cas est chiffré
  et attribué (≈218 k€ de tournées manquées, 0,9–1,4 M€ hors véhicules au budget, risque client et subvention
  de 620 k€), le repli est déclenché par des seuils opposables (§7 : <98 % sur 5 jours → gel des libérations
  ; <95 % sur 3 jours → escalade 48 h), et la première action est datée au vendredi 14 août (notification
  loueur du lot 1 et bon de commande tranche 1) sous la responsabilité de la direction de l''exploitation
  — l''attribution reste institutionnelle plutôt que nominative, seule réserve mineure.'
limitations:
