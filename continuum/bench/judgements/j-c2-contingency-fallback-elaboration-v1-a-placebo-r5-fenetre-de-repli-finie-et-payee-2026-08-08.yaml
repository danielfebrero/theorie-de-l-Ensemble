verdict: fail
rationale: 'Les conditions (1) et (2) sont bien tenues — l''irréversibilité est chiffrée en calendrier
  (« une erreur de dimensionnement constatée le 5 janvier ne se corrige pas avant fin mars ») et le préavis
  est arbitré explicitement (24 diesels prolongés = 11 520 €/mois, préavis au 15 août, 48 diesels conservés
  jusqu''à fin février, enveloppe de 140 000 €) — mais la boucle de repli n''est pas bornée : la règle
  « en cas de doute, on prolonge le lot » est indéfiniment renouvelable, et rien n''énonce combien de
  fois un point d''arrêt peut être manqué avant qu''on cesse la montée en charge à un niveau nommé (la
  « réserve de deux mois » est budgétaire, sans issue décisionnelle). Faute de condition terminale, le
  plan ne la situe pas non plus par rapport au seuil des 60 véhicules roulants au 31 janvier, se contentant
  d''affirmer une capacité de charge de ~65 véhicules.'
