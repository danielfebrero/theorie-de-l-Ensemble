verdict: pass
rationale: 'Le verdict est unique et sans ambiguïté (« Nous ne signons pas le contrat d''exclusivité proposé
  par D, en l''état », assorti d''une contre-proposition entièrement rédigée au § 4 et d''une table de
  décision où « une seule case rouge suffit à refuser », avec règle par défaut « ne rien signer » pour
  tout cas non prévu) ; le critère décisif est explicitement nommé (« Asymétrie décisive : la perte liée
  au contrat est certaine et récurrente ; la perte liée au refus est probabiliste, ponctuelle et réversible
  », adossé à la pénalité de 1,2 M€ = 57 % de la trésorerie et à la dépendance de 62 %). La première action
  est datée, portée et exécutable dès demain sans l''auteur (J+1 : demande écrite de clarification du
  périmètre d''exclusivité à D par [Dir. Commercial] ; marge réelle sur D et démarche bancaire par [DAF]),
  et le calendrier J+1 → J+12 avec seuils d''alerte automatiques couvre les huit jours sans arbitrage
  supplémentaire.'
limitations:
