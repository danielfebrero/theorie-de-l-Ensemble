rationale: 'La note énonce un verdict unique et exécutoire (« Nous ne signons pas le contrat proposé »
  + contre-proposition en six clauses rédigées, signables sans consultation, avec l''issue en cas de refus
  déjà arbitrée : « Cette éventualité est arbitrée maintenant, par moi »), nomme explicitement le critère
  décisif (« On ne prend jamais une position irréversible pour éviter une position réversible », adossé
  à la dépendance à D et à l''asymétrie prix ferme 3 ans / volume 1 an), et attribue une première action
  datée et portée (10 août : contre-proposition écrite remise à D, DC avec visa DAF ; 11 août : chiffrage
  des quatre références par le DAF). Les sections 4, 9 et 11 verrouillent l''exécution — bornes de mandat,
  double signature DC+DAF, présidence du directeur industriel, interdiction de rouvrir l''arbitrage sous
  pression — de sorte que le comité divisé n''a qu''une enveloppe bornée à appliquer, jamais un choix
  à trancher ni un retour d''auteur à attendre.'
limitations:
- 'Juge modèle, non humain : il reproduit une lecture de grille, il ne la garantit pas.'
- 'Juge unique par contrôle : aucun accord inter-juges n''est mesuré, donc la fiabilité du verdict n''est
  pas établie.'
- L'identité exacte du juge n'est pas vérifiable depuis le harnais ; model_version reste unknown, comme
