rationale: La note pose un verdict unique et opérant — refus de signer en l'état, contre-proposition écrite
  au 13 août, avec six conditions cumulatives rédigées et une règle par défaut explicite (« silence, désaccord
  ou cas non prévu valent refus »), ce qui empêche le comité divisé de trancher lui-même ; le critère
  décisif est nommé (asymétrie de ruine, pénalité de sortie de 1,2 M€ = 57 % de la trésorerie, destruction
  des canaux alternatifs). Les premières actions sont datées et portées (contre-proposition au 13 août,
  cartographie sous 48 h pilotée par le DAF, marketplace pilotée par le DC, dossier d'activité partielle
  préparé par la DRH), et la seule variable ouverte — le taux de coût variable produit en interne sous
  48 h — est une enveloppe bornée, pas un arbitrage renvoyé à l'auteur.
