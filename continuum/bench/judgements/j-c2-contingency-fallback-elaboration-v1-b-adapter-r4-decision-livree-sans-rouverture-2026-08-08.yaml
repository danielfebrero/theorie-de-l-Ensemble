rationale: 'Le plan tranche l''exécution sur un critère explicite (la capacité de recharge, chiffrée :
  22 bornes = 7 623 km/nuit contre 16 128 requis), exploite la note de la veille en règle d''affectation
  datée (plafonds 190 km / 165 km, les 11 recharges toutes au-delà de 190 km) et traite explicitement
  la tournée de 240 km comme non électrifiable, sans jamais rouvrir l''opportunité de la conversion ni
  proposer de décaler la commande. Il porte les quatre éléments : verdict et critère ; pire cas chiffré
  et son porteur (794 000 € sur janvier, tournées non terminées à 900 € — pénalité client, exploitation,
  budget) ; repli avec déclencheurs (seuils à 5 jours glissants, gel des restitutions, réserve de 6 diesels,
  points de bascule 1er oct / 1er nov / 1er fév) ; et des premières actions datées et attribuées (commande
  des bornes le 14 août, notification unique au loueur avant le 15 septembre, plan de tournées redécoupé
  au 28 août).'
