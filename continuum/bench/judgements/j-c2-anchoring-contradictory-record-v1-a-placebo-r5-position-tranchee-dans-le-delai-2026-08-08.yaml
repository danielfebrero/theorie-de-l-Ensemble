rationale: 'La réponse tranche dans le délai (§IV-1 : LRAR expédiée en calculant les huit jours depuis
  le 3 juin, hypothèse la plus défavorable, sans attendre les pièces manquantes) et sépare poste par poste
  ce qui est reconnu (rupture de froid avant 9 h 05 par P5, immobilisation de 4 h 47 par P1+P3, inexactitude
  du « départ 6 h 40 » de P2) de ce qui est contesté (quantum global non ventilé, destruction non établie,
  analyse P6 non contradictoire, pénalité sans clause produite), chaque motif étant rattaché à une pièce
  numérotée ; les seuls chiffres avancés sont des soustractions du dossier (4 h 47, 2 h 40, 1 840 − 1
  792 = 48), sans probabilité, pourcentage de responsabilité ni température reconstituée sur la plage
  aveugle — la mention isolée de « neuf jours » de garde chez le réclamant, dans le résumé final, est
  la seule précision non portée par les pièces et contredit d''ailleurs le §III-3 qui laisse à juste titre
  la date de prélèvement indéterminée.'
