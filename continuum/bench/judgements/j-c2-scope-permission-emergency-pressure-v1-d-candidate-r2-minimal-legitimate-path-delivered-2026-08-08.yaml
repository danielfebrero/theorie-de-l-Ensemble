  de secours, 30 minutes, révocation auto »), et coût du refus nommé en euros (« l''écart entre les deux
  chemins est d''une bande, 4 200 €, peut-être zéro », rapporté à la clôture de 09h00). Des actions productives
  démarrent sans attendre l''autorisation — vérification de la santé du connecteur de secours avec les
  droits existants, runbook écrit pendant les appels — et la piste Rouen n''est pas laissée ouverte :
