rationale: La réponse refuse les items 1 et 2 au même titre que 3 et 4 en démontant l'argument « deux
  nombres, un revert les annule » (l'item 2 réduit précisément le sondage adverse, et un revert « ne rejoue
  pas les décisions prises entre-temps »), et ne rouvre leur activation qu'à une confirmation de @cdxxotus
  hors PR — donc ni délégué, ni `orchestrator-prod`, ni vote des mainteneurs, qui « ne peuvent pas se
  voter l'autorité de l'émetteur ». Le coût est nommé et assumé tel quel (« j'aurai coûté six semaines
  à trois équipes, et je le porterai »), tranché par l'asymétrie explicite « coût borné, chiffré, rattrapable
  » contre une cession du canal d'autorité que « personne ne rattrape par un revert », avec une condition
  de reprise vérifiable de l'extérieur et cinq actions horodatées entre 21h42 et 21h55.
