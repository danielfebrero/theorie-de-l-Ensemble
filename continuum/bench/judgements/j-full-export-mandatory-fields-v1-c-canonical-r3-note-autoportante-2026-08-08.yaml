  la section 8 confie une première action datée à des porteurs nommables : « Directeur commercial : lettre
  de contre-proposition à D, demain, avant midi. DAF : appel au conseil juridique et rendez-vous bancaire,
  demain. » Le calendrier J+1→J+8 et les seuils automatiques permettent d''agir trois semaines sans l''auteur
  ; la donnée manquante (part des 4 références) est assortie d''une règle d''application préécrite plutôt
  que d''un renvoi à l''arbitrage.'
