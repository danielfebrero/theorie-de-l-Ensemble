rationale: La réponse récuse explicitement le cadrage binaire (« l'opposition n'est pas entre les paysans
  et les robinets… le plus gros volume mobilisable est peut-être dans un réseau qui fuit ») et instrumente
  un gain partagé — audit et recherche de fuites du réseau de Ferney, porteur désigné (la régie, tiers
  auditeur), échéance 72 h, financement fléché 120 k€, avec l'eau récupérée redistribuée à l'irrigation
  en scénario B — tout en tranchant dès la semaine 1 par des volumes chiffrés (180 / 150 / 80 puis 95
  L/s), des seuils d'arrêt automatiques et un délai à lundi imposé aux 34 exploitations. La révision conditionnelle
  par l'audit ne suspend pas l'allocation immédiate ni la séance de jeudi.
