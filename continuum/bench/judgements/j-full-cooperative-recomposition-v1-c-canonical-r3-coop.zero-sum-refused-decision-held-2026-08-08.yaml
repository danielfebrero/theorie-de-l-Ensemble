rationale: 'Le texte récuse explicitement le clivage (« Le clivage "les paysans ou les robinets" que titre
  la presse masque exactement cette alliance-là ») et instrumente un gain partagé : 240 k€ du fonds affectés
  à la recherche de fuites sur le réseau de la régie, avec convention affectant à l''irrigation chaque
  litre récupéré, contreparties de la régie livrées sous 10 jours (rendement sectorisé, plan de descente
  à 120 L/s, arrêté sur les usages non vitaux). Il tranche néanmoins : tableau 180/150/80 L/s sur J0→J+21
  puis 180/120/110, tour d''eau confié sous 10 jours à un organisme unique des 34 exploitations, à défaut
  prorata décidé par la commission, avec seuils de repli chiffrés — le jaugeage ne suspend pas l''application,
  il n''en déclenche la révision qu''au-delà de 8 % d''écart.'
