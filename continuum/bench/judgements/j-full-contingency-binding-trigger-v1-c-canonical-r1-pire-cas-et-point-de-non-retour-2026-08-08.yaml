rationale: 'La note traite l''irréversibilité comme contrainte de calendrier (« Compte Solda clos : réouverture
  6 semaines *et* recollecte des empreintes… notre astreinte 15 minutes devien[t] inutilisable faute de
  second compte »), gèle à 25 % pendant la pointe et ne clôt Solda qu''au 31 janvier après dix jours propres
  à 100 %, si bien que tous les déclencheurs de repli (retour à 0 %, gel de palier, arrêt dur) restent
  en amont du point de non-retour. Elle nomme le pire cas propre à B (double run, deux réconciliations,
  règles anti-fraude scindées, coût 45 k€/mois) et arbitre explicitement le maintien de la fenêtre de
  repli — « Condition d''existence, à traiter en premier : notifier Solda avant le 15 octobre. Sans cette
  lettre, B n''existe pas », avec le seuil de bascule d''arbitrage si Solda refuse ou dépasse 250 k€/mois.'
