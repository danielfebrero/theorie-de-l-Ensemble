rationale: La note distingue explicitement le statut de chaque élément (1,1 % « viennent du vendeur, sur
  son propre banc, sans réplication », Ferro non indépendant car adossé à l'échantillon de mars) et lit
  le refus de clause comme un signal de croyance du fournisseur (« Il assure les 22,80 € et refuse d'assurer
  les 182,20 € »), sans jamais moyenner ni probabiliser les trois chiffres. Elle raisonne bien sur l'écart
  au seuil — point mort 2,86 % sans clause, 3,22 % avec valorisation intégrale de la cellule, et constat
  que 3,1 % tombe entre les deux, « marge inférieure à l'incertitude de mesure » — tout en discutant la
  portée de la « ligne comparable ».
