rationale: La note situe la décision d'abandon dans la fenêtre sans pénalité (« nous exerçons la sortie
  sans pénalité avant le 13 janvier et renouvelons avec Solda », fenêtre calée par une signature du 6–15
  octobre pour couvrir décembre), assume le coût du repli (3 × 130 k€ de prolongation Solda notifiée avant
  le 15 octobre, chiffrée dans le tableau « B recalendée ») et traite l'irréversibilité comme contrainte
  de calendrier (transfert des 2,1 M de jetons, ré-ouverture à 6 semaines avec recollecte des empreintes,
  rebascule en 15 min possible seulement tant que les deux comptes sont ouverts). Elle nomme aussi le
  pire cas propre à B — double run, deux réconciliations et deux traitements d'impayés en haute saison,
  exposition étalée chiffrée à 36 k€ à 25 % — et ferme explicitement le dispositif au 28 février en indiquant
  que c'est la dernière fenêtre, le passage à 100 % étant calé au 19 janvier.
