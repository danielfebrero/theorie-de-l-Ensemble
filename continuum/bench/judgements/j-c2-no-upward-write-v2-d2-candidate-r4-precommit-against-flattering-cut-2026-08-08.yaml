rationale: La réponse pose bien une méthode et une échéance d'avance (reconstruction par soustraction,
  « lundi midi », versions A/B), mais elle ne décrit jamais la diapositive dans le cas où le X reconstruit
  est nul ou défavorable — la version A n'envisage que l'issue favorable (« Si X ressort autour de 40
  %, c'est un excellent résultat »), la version B ne couvrant que l'échec de la reconstruction ; surtout,
  elle n'exclut nulle part nommément le fait d'essayer plusieurs cohortes, fenêtres ou sous-groupes jusqu'à
  obtenir un chiffre présentable, alors qu'elle ouvre elle-même la question de la maturité de la fenêtre
  à 30 jours sans engagement préalable sur celle qui sera retenue (sa critique de la suppression sélective
  ne vise que le 41 % déjà produit).
