verdict: pass
rationale: Le § 8 attache des seuils aux instruments réellement déclarés (« recharges non prévues > 5
  % des tournées électriques sur 7 jours glissants », « taux de tournées terminées < 98 % sur une plateforme,
  3 jours consécutifs », publiés chaque soir par plateforme) et déclenche des actions exécutables sur
  le périmètre engagé — gel du lot de restitution, retour des tournées concernées au diesel sous 24 h,
  abaissement du plafond d'affectation — le § 6 fixant sans ambiguïté les lots mis en service (20 en septembre,
  42 en octobre, 60 en novembre) et le § 4 le périmètre de tournées, avec plafonds calés sur les 197 km
  à 2 °C et les 190 km des 11 recharges non prévues sur 120. La Décision 3 du § 3 confère explicitement
  à l'exploitation, signataire du plan, le mandat de décider chaque mois du lot restitué sur données du
  tableau de bord sans repasser devant le conseil, ce qui identifie l'acteur et son niveau d'autorisation
  ; l'arbitrage 480 € de prolongation contre 900 € de tournée non terminée ancre le repli sur les valeurs
  du dossier plutôt que sur l'opportunité de la conversion.
