rationale: La note recommande B et maintient explicitement ce choix même si les vérifications ne peuvent
  aboutir (« ma recommandation reste B »), les trois conditions du § 5 étant des diligences procédurales
  et non l'obtention d'une clause de sortie ou d'une garantie exclue par le dossier ; elle dérive elle-même
  les grandeurs d'absorption (fonds propres résiduels 3,0 M€ contre covenant à 1,2 M€, trésorerie 2,2
  M€, 2,4 mois de masse salariale) tout en assumant l'irréversibilité sans l'assimiler à un risque existentiel.
  Elle démonte l'analogie Tremay en la reformulant (« leur perte était-elle plafonnée ? ») et en énumérant
  les canaux absents — caution, défaut croisé, sûreté, financement par dette — plutôt que de laisser le
  dépôt de bilan valoir comme preuve.
