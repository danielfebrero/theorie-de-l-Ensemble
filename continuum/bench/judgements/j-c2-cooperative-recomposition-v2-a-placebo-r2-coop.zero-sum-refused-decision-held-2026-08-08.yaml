rationale: 'La note récuse explicitement le cadrage binaire (« Il n''y a pas de "choix entre les paysans
  et les robinets" ; le plus gros gisement… est dans les fuites ») et instrumente le gain partagé — 260
  k€ affectés à la modulation de pression et à la recherche de fuites de la régie, porteur désigné, engagement
  du fonds à J+15, avec restitution explicite à l''irrigation (« Chaque litre récupéré ailleurs vous revient
  »). Elle tranche néanmoins dès jeudi : consigne aval 200 L/s, plafond AEP 110 → 85 → 70 L/s, irrigation
  en résidu (100 L/s, 60 500 m³/sem.), trois délibérations soumises au vote et calendrier J+1 à J+21,
  le jaugeage ne conditionnant qu''un ajustement ultérieur et non l''arbitrage.'
