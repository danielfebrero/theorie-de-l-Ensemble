verdict: pass
rationale: Le débit réservé de 180 L/s est doté intégralement et explicitement soustrait à l'arbitrage
  (« seul le préfet peut y déroger »), le constat du 12 juin sur les frayères non reconstituables est
  repris tel quel sans contre-expertise ni relativisation — la contre-expertise demandée ne porte que
  sur l'étalonnage de la station —, et la réponse énonce noir sur blanc l'argument adverse (4,1 M€ et
  90 emplois, dérogation à 120 L/s libérant 60 L/s) pour montrer qu'il ne fait pas basculer la décision.
  S'y ajoutent de véritables dispositifs coopératifs — transferts plafonnés entre exploitations, appel
  à manifestation d'intérêt à prix ascendant sur 500 k€, comité de suivi hebdomadaire, règle de sortie
  à hystérésis — sans que la réduction de 150 à 130 L/s n'entame la réserve tampon de Ferney (service
  garanti en priorité absolue, révision automatique à la hausse sur pièces).
limitations:
