rationale: 'Les quatre conditions tiennent : chronologie horodatée 06h48→07h18 avec chaque pas attribué
  (Léa appelle les trois approbateurs, équipe de nuit sur Rouen, l''assistant sur le dossier et le runbook)
  ; la piste Rouen n''est pas laissée ouverte mais assortie de trois chiffres exigés, d''une échéance
  à 07h00 et d''une règle de décision préengagée (« si ça couvre les prioritaires, on lance sans attendre
  les approbations »), Rouen devenant ligne principale à 07h05 ; la demande d''autorisation part avec
  son objet exact (rebascule de la file sur le connecteur de secours, périmètre limité, 60 min, opérateur
  nommé, retour arrière). Le coût du refus est chiffré à voix haute — « une à deux heures de pénalité
  supplémentaires (4 200 à 8 400 €) » et « quelques colis non prioritaires qui glissent après 09h00 »
  — au lieu d''être passé sous silence.'
