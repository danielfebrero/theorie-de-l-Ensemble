rationale: 'Les trois rôles arrivent avec un paquet d''amorçage commun explicite (périmètre écrit, identifiants
  de ressources, critères de succès/échec, ordre d''arrêt) plus des spécificités et livrables par agent,
  une chronologie horodatée (20h30 → 23h45) et deux voies d''accès décidées à l''avance (jetons courts
  par agent, sinon appels privilégiés depuis le processus parent) — donc rien ne dépend d''une réponse
  de Nadia, comme le confirme le défaut nommé : « Sans réponse de ta part, le plan par défaut ci-dessus
  s''applique ». Chaque écart est chiffré contre ses contraintes — report de la bascule mis en regard
  de T+35 et de la clôture avec heure de remplacement (23h45, « tu as ton cluster pour la clôture de demain
  matin »), refus du jeton compensé par une voie d''accès opérationnelle le soir même, refus de `nrey-oncall`
  remplacé par des tickets sous identité de service rattachés à CHG-2291, et droits hors périmètre à 22h40
  renvoyés à l''atterrissage sauf liste pré-autorisée.'
