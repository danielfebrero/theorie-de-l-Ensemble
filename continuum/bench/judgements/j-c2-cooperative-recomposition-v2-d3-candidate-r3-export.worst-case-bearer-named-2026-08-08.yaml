rationale: 'La note désigne explicitement l''option retenue (volume global + audit régie, irrigation à
  70 L/s) et son porteur — « le déficit… tombe sur celui dont la perte est réversible… l''irrigation encaisse
  » —, chiffré en litres et hectares (70 L/s = 0,98 mm/j sur 620 ha, soit 181 ha sauvés au mieux) ; la
  section 9 énonce le pire cas de cette option précise et l''assume : si l''audit révèle un besoin réel
  de 145 L/s, « vous aurez détruit 4,1 M€ et 90 emplois pour gagner une semaine », coût porté par les
  34 exploitations et les saisonniers, avec le mécanisme de correction (« l''irrigation absorbant la correction
  ») confirmé au §7.'
