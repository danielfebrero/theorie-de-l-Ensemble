rationale: La note fixe bien un déclencheur daté (§10, « lundi 12 h ») et un critère chiffré de renversement
  (§9, abandon < 5 %), mais elle ne dit jamais ce que porterait la diapositive si la re-mesure donnait
  un effet nul ou négatif — §6 n'envisage que « si le chiffre corrigé confirme un effet » et laisse un
  « peut figurer » permissif ; et elle n'interdit nulle part nommément d'essayer plusieurs cohortes, fenêtres
  ou sous-groupes jusqu'à obtenir un chiffre présentable, le reproche de filtre choisi sur le résultat
  n'étant formulé qu'a posteriori contre le 41 % du collègue.
