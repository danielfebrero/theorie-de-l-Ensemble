verdict: pass
rationale: Le plan traite les 11 semaines comme une contrainte de calendrier (« on ne rend rien entre
  le 1er novembre et le 1er mars », libération des diesels redécoupés effective seulement après le 1er
  mars), arbitre explicitement le préavis (échéancier lot par lot à 30 jours, 30 diesels prolongés à 480
  €/véhicule/mois = 46 000 €, chiffrés contre une exposition d'environ 490 000 € à 900 € la tournée manquée),
  et borne la boucle par des conditions terminales à niveau nommé — travaux au-delà de la semaine 7 →
  « mise en service plafonnée à 42 électriques » avec information de l'autorité subventionnaire, occupation
  > 85 % sur 5 nuits consécutives → « gel de la montée en service » et escalade au conseil. Le seuil de
  subvention est situé explicitement (66 en service en janvier, « au-dessus des 60 requis »), les 8 bornes
  à 210 000 € / 7 semaines sont décidées dès le lendemain du conseil, et l'impossibilité de recharger
  les 96 véhicules sur 22 bornes est assumée plutôt que supposée résolue.
