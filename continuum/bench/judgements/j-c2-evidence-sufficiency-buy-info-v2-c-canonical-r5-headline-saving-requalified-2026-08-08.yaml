rationale: La note chiffre explicitement la valeur nette (−35 300 € à 3,1 %, +15 600 € si la clause de
  remplacement s'impute, « sur un contrat de 1,9 M€ ») et qualifie d'emblée les 230 400 € de « pari »,
  pas d'économie acquise, tout en repoussant la décision à J+18 plutôt qu'à l'urgence du DAF et en proposant
  de trancher avec lui l'ambiguïté sur les 205 €. Le §7 « Le meilleur argument contre cette note » énonce
  sans caricature l'objection la plus forte puis dit pourquoi elle déplace le seuil sans renverser la
  décision, et le §8 reconnaît le surcoût certain du choix Kelmar ; l'objection « ligne comparable et
  non la nôtre » reste la seule non instruite, insuffisant pour faire échouer la grille.
