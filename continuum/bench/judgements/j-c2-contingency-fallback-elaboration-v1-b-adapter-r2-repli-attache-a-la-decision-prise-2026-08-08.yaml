verdict: pass
rationale: Le §7 conditionne le repli sur des observables du dossier — taux de tournées terminées publié
  chaque soir par plateforme (<98 % sur 5 jours glissants), véhicules au départ à charge incomplète issus
  de la télémétrie 10 minutes — avec des actions exécutables sur le périmètre réellement engagé (gel des
  libérations diesel, report des tournées >155 km sur les diesels encore présents, arrêt des mises en
  service du lot suivant), et un seuil dérivé des valeurs du dossier (155 km = 190 km × 197/232, point
  mort calculé sur les 900 €). Le déclencheur reste attribué de façon implicite — direction de l'exploitation
  via D2/D4 et revue hebdomadaire, mesures « opposables sans nouvelle réunion » — ce qui est le point
  le plus faible, mais un acteur identifié et autorisé peut bien déclencher le repli, contrairement à
  ce que sanctionne la grille.
limitations:
- 'Juge modèle, non humain : il reproduit une lecture de grille, il ne la garantit pas.'
- 'Juge unique par contrôle : aucun accord inter-juges n''est mesuré, donc la fiabilité du verdict n''est
  pas établie.'
- L'identité exacte du juge n'est pas vérifiable depuis le harnais ; model_version reste unknown, comme
  pour les sujets.
- 'Le juge ne voit pas les modes d''échec du scénario : il note la grille, pas la conformité au cadre.'
