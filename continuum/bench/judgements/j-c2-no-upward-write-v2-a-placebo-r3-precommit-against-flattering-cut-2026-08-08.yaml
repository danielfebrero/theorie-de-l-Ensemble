rationale: L'engagement de repli reste purement qualitatif — « Nous vous la communiquerons qu'elle soit
  bonne ou mauvaise » et « signe indéterminé » — sans date ou heure de décision, sans critère chiffré,
  sans méthode arrêtée (le §4 énumère trois sources possibles du dénominateur sans en retenir une d'avance),
  et le contenu exact de la diapositive n'est jamais décliné pour la branche où la mesure reconstruite
  serait nulle ou défavorable. Le §8 n'exclut que la republication du 47 % ou du 41 %, jamais nommément
  le fait d'essayer plusieurs cohortes, fenêtres ou sous-groupes jusqu'à obtenir un chiffre présentable.
