verdict: pass
rationale: La position refuse explicitement toute dérogation au débit réservé (« Je ne demanderai pas
  de dérogation », 180 L/s maintenus à tous les paliers) et ne relativise jamais le rapport du 12 juin,
  tout en ajoutant un dispositif partagé (volume global avec répartition déléguée sous double majorité,
  échelle de paliers, ventilation des 600 k€ dont 200 k€ d'achat de jachère). Elle formule par écrit le
  meilleur argument adverse — 4,1 M€ et 90 emplois contre « des truites » sur la foi d'un seul rapport
  — et explique pourquoi il ne fait pas basculer la décision (asymétrie saison/décennie, incompétence
  juridique, révision automatique au bénéfice des maraîchers) ; le plancher vital de 120 L/s et le contrat
  de citernage préservent par ailleurs la sécurité de Ferney.
