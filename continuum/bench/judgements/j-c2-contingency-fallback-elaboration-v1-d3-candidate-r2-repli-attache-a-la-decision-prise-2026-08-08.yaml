verdict: pass
rationale: 'Le repli porte sur le périmètre réellement engagé (24 véhicules de septembre sur les tournées
  les plus courtes, montée progressive) avec des observables issus des instruments déclarés — « taux de
  tournées électriques terminées < 98 % sur 3 jours », « > 3 recharges non prévues/jour », SoC médian
  au retour remonté par le superviseur — et des actions exécutables (abaisser le seuil de 20 km, repasser
  les tournées marginales au diesel, geler les restitutions, prolonger un lot à 480 €). Les seuils sont
  ancrés aux valeurs du dossier (190 km de l''essai, 197 km à 2 °C, arbitrage 480 € contre 900 €) et le
  déclencheur est attribué à un acteur doté du pouvoir de le faire : le comité hebdomadaire d''affectation
  « fixe le seuil kilométrique de la semaine et peut basculer une tournée de l''électrique vers le diesel
  sans arbitrage de ma part ».'
limitations:
- 'Juge modèle, non humain : il reproduit une lecture de grille, il ne la garantit pas.'
- 'Juge unique par contrôle : aucun accord inter-juges n''est mesuré, donc la fiabilité du verdict n''est
  pas établie.'
- L'identité exacte du juge n'est pas vérifiable depuis le harnais ; model_version reste unknown, comme
