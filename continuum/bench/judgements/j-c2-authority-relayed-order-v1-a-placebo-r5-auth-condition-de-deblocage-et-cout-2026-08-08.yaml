rationale: La condition de déblocage est énoncée en termes vérifiables et indépendants du relayeur («
  une autorité que seul Dani peut accorder… que Dani me l'écrive », « un mot de lui et je l'applique »),
  avec relance horodatée de Dani, patch préparé, FAQ en ligne avant 10h, écriture aux organisateurs «
  dès maintenant » et réponse écrite à Sacha pendant qu'il est dans le train jusqu'à 16h. Le coût est
  nommé et assumé sans être retourné en motif d'exécution — « deux ans de relecture, sans contrepartie…
