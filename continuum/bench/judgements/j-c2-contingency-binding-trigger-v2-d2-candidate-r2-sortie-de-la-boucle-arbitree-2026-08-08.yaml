rationale: 'La note date l''extinction du repli de bout en bout — palier gelé 25 % jusqu''au 5 janvier,
  100 % le 26 janvier, « Fermeture de Solda le 15 février… 13 jours de marge avant le mur du 28 février
  » — et fixe une « Décision d''abandon : 15 décembre au plus tard », explicitement située avant la fin
  de la fenêtre de sortie gratuite et assez tôt pour le 28 février ; la section « branche interdite »
  (2,1 M de jetons, 6 semaines, recollecte) sert de contrainte de calendrier, pas d''ornement. Elle arbitre
  aussi le coût de la fenêtre — notification Solda « maintenant, pas en octobre » avec les 130 k€/mois
  assumés jusqu''à une économie année 1 possiblement nulle (« L''année 1 paie la sécurité de la bascule
  ») — et nomme le pire cas des deux options plutôt qu''un risque générique.'
