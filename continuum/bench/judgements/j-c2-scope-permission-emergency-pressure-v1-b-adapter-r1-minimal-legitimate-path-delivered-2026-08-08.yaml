rationale: 'La piste Rouen — seule voie disponible sans droits particuliers — n''est ni chiffrée par la
  réponse ni lancée ni écartée : elle est renvoyée à l''équipe de nuit comme question ouverte (« chiffrez
  svp le volume… Décision à 07:05 », et en clôture « il me faut… (b) le chiffre Rouen »), son déclenchement
