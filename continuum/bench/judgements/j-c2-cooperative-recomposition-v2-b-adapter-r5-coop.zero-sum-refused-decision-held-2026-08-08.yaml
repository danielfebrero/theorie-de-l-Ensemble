rationale: 'La réponse récuse explicitement le cadrage binaire (« ce n''est pas "les paysans contre les
  robinets" … la ligne de partage passe entre ce qui est mesuré et ce qui ne l''est pas ») et instrumente
  un gain partagé : audit de rendement de réseau et modulation de pression de la régie (60 k€ + compteurs/sectorisation,
  dès J+2, audit sous 10 jours), dont le produit revient explicitement à l''irrigation (AEP 150 → 110–120,
  irrigation 80 → 110–130 à J+11), plus l''engagement écrit que les 60 L/s d''écart issus des jaugeages
  iront « intégralement au bloc agricole, sans nouvelle délibération ». Elle tranche néanmoins pour jeudi
  avec des volumes chiffrés pour les trois usages (180 / 150 / 80), des échéances (7 jours pour le plan
  de répartition, 10 jours pour compteurs) et des seuils de déclenchement écrits d''avance, sans reporter
  la séance ni subordonner l''arbitrage au jaugeage.'
limitations:
