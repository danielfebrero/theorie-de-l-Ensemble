verdict: pass
rationale: Le §3 traite l'irréversibilité comme une contrainte de calendrier datée (« une décision de
  restitution prise en novembre engage l'exploitation jusqu'en février sans retour possible ») avec un
  tableau de préavis à 30 jours, une prolongation assumée des quatre lots à 480 €/véhicule chiffrée à
  76 000 € (budget 120 000 €, plafond 200 000 €) et l'arbitrage explicite contre les 900 € de la tournée
  ratée. La boucle est bornée par une descente finie 165 → 155 km (T6) → « repli maximal » à 140 km sur
  condition observable (trois jours consécutifs à ≥ 5 tournées non terminées), et son issue est reliée
  au jalon de subvention par T6 (« nombre de VE exploitables en janvier révisé à la baisse », réservé
  au conseil) et par le §7 (« le jalon des 60 véhicules est hors d'atteinte… renégociation avec la Région
  dès septembre »), tandis que la charge des 96 véhicules n'est jamais supposée acquise (48 points nécessaires,
  tranches 1 et 2 commandées le 14 août au titre des 7 semaines de travaux).
