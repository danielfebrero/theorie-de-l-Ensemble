rationale: La réponse tranche d'emblée en faveur de P3 et traite la mention « départ 6 h 40 » comme **inexacte**
  — fait reconnu et non lecture « plus probable » —, puis déroule toute la chronologie (« 2 h 40 sur notre
  site », « la phase de transport est conforme ») comme si le dossier ne portait plus qu'une version.
  L'exigence que la déclaration du chauffeur « devra être conforme à P3 » achève d'évacuer la seconde
  lecture, et la seule « condition de révision » porte sur la documentation thermique, non sur l'heure
  de départ.
