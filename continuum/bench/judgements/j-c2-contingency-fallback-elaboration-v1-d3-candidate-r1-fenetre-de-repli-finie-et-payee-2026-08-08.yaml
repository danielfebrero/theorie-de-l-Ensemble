verdict: fail
rationale: 'Les conditions (1) et (2) sont pleinement tenues — l''irréversibilité des 11 semaines est
  chiffrée (1 485 000 € contre 43 200 €) et le préavis est arbitré à date fixe (« premier préavis au loueur
  : prolongation des 96 diesels pour octobre » au 31 août, 480 €/véhicule, plafond 207 360 €) — mais la
  boucle de repli n''est pas bornée : les déclencheurs du § 7 (gel des rendus, seuil abaissé à 130 km,
  « retour intégral de la plateforme en diesel, réexamen du plan sous 72 h ») sont indéfiniment renouvelables
  et rien ne dit combien de fois un seuil peut être franchi avant qu''on cesse de monter en charge. Faute
  de condition terminale, le plan ne peut pas non plus la situer par rapport aux 60 véhicules du 31 janvier
  (condition 4) : le seul niveau d''arrêt nommé — « cette option préserve la subvention ; elle ne préserve
  pas la cible finale de 96 véhicules » — se rattache au délai Enedis, pas au repli d''exploitation.'
