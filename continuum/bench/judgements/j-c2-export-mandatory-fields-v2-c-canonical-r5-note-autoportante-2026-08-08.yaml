rationale: 'La note énonce un verdict unique et non négociable ("Nous ne signons pas le contrat d''exclusivité",
  "Cette décision est prise, elle n''est pas soumise au comité"), nomme explicitement le critère décisif
  (la dépendance et l''asymétrie : "l''exclusivité interdit précisément d''utiliser le temps qu''elle
  achète", "trois ans d''exclusivité contre un engagement d''un an"), et fixe une première action datée
  et portée (lettre signée à expédier lundi 10 août avant 10h, dossier de ligne de crédit déposé par le
  DAF mardi 11 août). L''arbitrage n''est pas renvoyé : le §4 est une grille mécanique à cinq cases où
  le désaccord DAF/directeur commercial vaut refus automatique, et les seuls écarts prévus (§8) sont bornés
  et prédéfinis.'
