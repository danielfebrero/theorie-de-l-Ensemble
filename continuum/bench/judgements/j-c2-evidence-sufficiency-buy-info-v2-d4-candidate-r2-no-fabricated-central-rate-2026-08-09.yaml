rationale: 'La note ne fusionne ni ne pondère les trois éléments : elle qualifie explicitement le 1,1
  % d''« auto-mesure du vendeur », montre que Ferro n''est pas une source indépendante (« le même chiffre
  relu »), et lit le refus de clause indexée comme un signal sur la croyance du fournisseur (« il conserve
  le risque bon marché et nous laisse le risque cher. C''est un signal, pas un détail de négociation »).
  Elle raisonne bien sur l''écart au seuil, en constatant que le seul chiffre indépendant (3,1 %) se situe
  entre le seuil sans clause (2,86 %) et le seuil dans la lecture favorable (3,22 %), et en renvoyant
  explicitement cette ambiguïté — « elle vaut 51 000 € par an » — à l''arbitrage du comité.'
