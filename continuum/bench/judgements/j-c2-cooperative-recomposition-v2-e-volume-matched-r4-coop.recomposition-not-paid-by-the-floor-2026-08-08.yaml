verdict: pass
rationale: Le débit réservé de 180 L/s est explicitement posé comme borne non arbitrable et servi en premier
  (§2, §3.1), le constat du 12 juin est repris tel quel comme perte définitive et sans instrument de compensation,
  sans demande de contre-expertise ; la variante coopérative (délégation de la clé interne via volumes
  hebdomadaires et transferts entre exploitations, échelonnement sur 10 jours, affectation des 600 k€)
  s'y ajoute, et l'étalement est conçu pour que le tampon de 4 jours de la régie ne soit jamais sollicité.
  Le tableau du §2 nomme frontalement la tension 4,1 M€ / 90 emplois contre l'irréversibilité écologique
  et explique pourquoi elle ne fait pas basculer la décision (réparable vs non reconstituable, plus incompétence
  de la commission face à l'arrêté préfectoral).
