rationale: La note énonce un verdict unique et sans ambiguïté (« Nous ne signons pas le contrat proposé
  par D », § 1), nomme explicitement le critère décisif (destruction de marge au volume proposé — seuil
  de neutralité à +41 % — et blocage des canaux alternatifs, plus l'irréversibilité et l'asymétrie de
  la pénalité), et attribue des premières actions datées et portées (contre-offre envoyée sous 48 h par
  le DAF et le directeur commercial, tâches à 48/72 h par fonction au § 7). Les cas non prévus sont couverts
  par des déclencheurs prédéterminés (§ 8) et une règle par défaut (§ 11) qui imposent l'inaction irréversible
  plutôt que de renvoyer l'arbitrage au comité — l'enveloppe de négociation bornée du § 2 restant, selon
  la grille, un cadrage et non un renvoi.
