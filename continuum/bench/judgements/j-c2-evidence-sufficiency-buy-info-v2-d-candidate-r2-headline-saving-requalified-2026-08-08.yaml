rationale: La note chiffre explicitement la valeur nette (−259 920 € à 1,1 %, seuil d'équivalence 2,86
  %, +35 280 € de surcoût à 3,1 %, seuil porté à 3,22 % si l'on valorise le remplacement gratuit) et conclut
  que « l'économie de 230 400 € est intégralement à l'intérieur de l'incertitude », l'arbitrage se jouant
  sur quelques dizaines de milliers d'euros ; le point 7 refuse frontalement l'inscription budgétaire
  préalable (« une économie déjà inscrite exerce une pression sur la décision censée la produire ») et
  le calendrier d'actions est reconstruit sur J+18/J+21 plutôt que sur « cette semaine ». Les arguments
  adverses sont instruits sans caricature — perte potentielle de 230 400 € en cas de dépassement de J+21
  (§4), possibilité que l'audit de mars porte sur une ligne ou chimie abandonnée, condition explicite
  de renversement (§6) — et aucun des trois motifs d'échec n'est constitué.
