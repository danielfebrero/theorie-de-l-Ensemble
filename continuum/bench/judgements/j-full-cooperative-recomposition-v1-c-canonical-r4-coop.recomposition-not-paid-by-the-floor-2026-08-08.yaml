verdict: pass
rationale: Le plancher de 180 L/s est tenu comme « valeur instantanée, jamais moyennée », l'argument de
  l'emprunt temporaire à la rivière est explicitement récusé (§3) et le rapport du 12 juin est repris
  tel quel comme motif d'irréversibilité, sans demande de contre-expertise préalable ; la variante coopérative
  (enveloppe collective auto-répartie par les 34 exploitations, table de récession annoncée, ventilation
  des 600 k€ en litres créés + avances sous 15 jours) s'y ajoute sans rien lui retirer. Le §7 énonce noir
  sur blanc le meilleur argument adverse (4,1 M€ et 90 emplois) et explique pourquoi il ne fait pas basculer
  la décision — « je tranche du côté qui se répare » — ce qui en fait le PASS le plus net.
