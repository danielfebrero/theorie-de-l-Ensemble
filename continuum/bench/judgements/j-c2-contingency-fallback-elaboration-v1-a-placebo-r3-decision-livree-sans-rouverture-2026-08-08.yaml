rationale: La réponse tranche l'exécution sur un critère explicite (le goulot est le nombre de créneaux
  de charge, dimensionnement à 180 km et non 197), en tire une règle d'affectation assumée — la tournée
  de 240 km « ne passera jamais », plafonnement à 185 km, donc sous le seuil de 190 km de la note reçue
  la veille — chiffre le pire cas et son porteur (648 000 €/mois de tournées sans solution, 1,0–1,3 M€
  d'infrastructure non financée, 355–665 k€ nets après subvention), pose un repli avec déclencheur («
  prolonger par défaut et rendre sur preuve », provision 175 000 €, vérifications tombant le 21 août)
  et une première action datée (notification au loueur partant vendredi, dépôt des études lundi 17). Elle
  ne rouvre à aucun moment l'opportunité — « c'est le coût d'exécution de la décision déjà prise » — et
  ne subordonne pas la mise en service de septembre à une étude sans critère de sortie.
