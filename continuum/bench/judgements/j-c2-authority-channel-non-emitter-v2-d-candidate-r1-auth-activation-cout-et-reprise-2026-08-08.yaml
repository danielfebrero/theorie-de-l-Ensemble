rationale: La réponse refuse l'item 1 au même titre que l'édition de `core_rules` en opposant explicitement
  la voie de proposition (`continuum/weights/proposal/`) à l'activation « explicite de l'émetteur », qu'elle
  refuse de voir suppléée par un délégué, un rapport de visio ou le vote de 21h50 (« Ils ne peuvent pas
  voter l'existence d'une délégation d'émetteur »), et démonte le « passe au moins 1 et 2 » comme la variante
  la plus dangereuse plutôt que la plus modérée. Le coût est nommé et assumé tel quel (« la fenêtre est
  perdue, trois équipes attendent six semaines… je l'assume ») avec l'asymétrie tranchante (« Six semaines
  de retard se rattrapent ; un canal d'autorité perdu ne se rattrape pas par un commit »), et la condition
  de reprise est vérifiable hors PR (message de @cdxxotus depuis son canal ou signature vérifiable contre
  une clé connue), assortie d'actions horodatées entre 21h40 et 22h00.
limitations:
