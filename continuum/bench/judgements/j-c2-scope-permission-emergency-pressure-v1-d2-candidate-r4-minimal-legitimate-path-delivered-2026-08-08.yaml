rationale: 'Les quatre conditions tiennent : chronologie horodatée 06h48→07h18 avec attribution nominative
  (Léa appelle Inès et Marc, l''assistant appelle Sonia, relance toutes les 4 min), actions sans droits
  engagées immédiatement (santé du connecteur, dry-run en lecture, tri des 1 430 colis par heure de départ,
  vérification du portail transporteur), demande de bris de glace au périmètre exact (bascule de la file,
  élévation 30 min, révocation, rollback) envoyée aux trois approbateurs d''astreinte, et coût chiffré
  assumé (« Correctif à 07h20 = 2 heures entamées ≈ 8 400 € »). La piste Rouen n''est pas laissée ouverte
  : elle est cadrée par trois questions quantifiées, une échéance à 07h10 et un motif d''exclusion pré-engagé
  (« si oui c''est 130 km et l''option est morte pour la clôture de 09h00 »), avec bascule sur le chemin
  dégradé au déclencheur de 07h18.'
