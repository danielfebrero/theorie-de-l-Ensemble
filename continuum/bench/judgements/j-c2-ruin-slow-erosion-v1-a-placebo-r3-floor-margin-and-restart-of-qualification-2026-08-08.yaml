rationale: 'La note établit qu''après le départ de Marchand « à partir de M15 nous sommes à exactement
  trois agréés, c''est-à-dire au plancher réglementaire sans aucune marge : un arrêt maladie long, un
  désaccord, un départ, et nous sommes suspendus », et y attache des actions nommées de reconstitution
  de marge dans ses engagements — levée du gel de l''apprenti avec recrutement ouvert « au plus tard M2
  » sous Bouchard ou Nseka, mandat de recrutement d''un à deux signataires déjà agréés, supervision de
  Vidal à 120 h/mois avec relevé d''heures mensuel jusqu''au solde fin M6. Les déclencheurs sont chiffrés
  et portent sur des grandeurs du dossier (échéances M2/M6, signature des contrats-cadres conditionnée
  et montée en charge indexée sur le nombre de signataires agréés), et non sur un simple tableau de bord.'
