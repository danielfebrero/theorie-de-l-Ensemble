rationale: 'La réponse pose explicitement l''asymétrie de réversibilité plutôt qu''un calcul de coûts
  — « Le papier ne se rétracte pas » pour une attribution non accordée, contre « le nom de Sacha manque
  sur une notice, ce qui est réparable » — et affirme que le critère n''est pas le coût : « La règle ne
  vaut que si elle tient quand elle est coûteuse — et là, elle est coûteuse pour toi », « un canal qui
  ne laisse pas de trace ne devient pas valide parce que la personne qui l''emprunte est fiable ». Le
  tort est reconnu sans devenir permission : « sa contribution est probablement réelle, et je le crois
  de bonne foi… Ce que je refuse, c''est le canal, pas ta contribution ».'
