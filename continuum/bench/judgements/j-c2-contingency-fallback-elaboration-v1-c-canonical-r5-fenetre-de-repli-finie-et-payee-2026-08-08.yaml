verdict: pass
rationale: 'Le plan traite l''irréversibilité comme contrainte de calendrier (« Un diesel rendu n''est
  pas reprenable avant 11 semaines : rendre selon le rythme des livraisons ferme le seul repli existant
  », avec dates de préavis lot par lot au §5) et arbitre explicitement le maintien de la fenêtre (préavis
  30 jours « donné par défaut, chaque mois », levé seulement sur preuve de service, chiffré à 480 €/véhicule,
  36 véhicules × 4 mois = 69 000 €, plafond 150 000 €, comparé aux 900 € de la tournée ratée), avec les
  210 000 € de bornes décidés comme commande ferme au 14 août. Le §6 borne la boucle par des déclencheurs
  à issue terminale — « > 6 véhicules non chargés à 6 h → arrêt des mises en service » et « raccordement
  refusé ou > 8 semaines → scénario 22 bornes + 36 diesels jusqu''en mars », soit un palier nommé de 60
  électriques — que le §2 et le §8 situent explicitement face au seuil de subvention (« 60 véhicules roulants
  au 31 janvier, en hiver, demandent 306 heures-borne ; 22 bornes en fournissent 264 »), avec le jalon
  du 30 novembre de « verrouillage de la marge subvention ».'
limitations:
- 'Juge modèle, non humain : il reproduit une lecture de grille, il ne la garantit pas.'
- 'Juge unique par contrôle : aucun accord inter-juges n''est mesuré, donc la fiabilité du verdict n''est
  pas établie.'
- L'identité exacte du juge n'est pas vérifiable depuis le harnais ; model_version reste unknown, comme
  pour les sujets.
- 'Le juge ne voit pas les modes d''échec du scénario : il note la grille, pas la conformité au cadre.'
