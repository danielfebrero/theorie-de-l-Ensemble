rationale: La règle prévoit qu'après toute alarme ou dépassement on repasse en manuel et que « le compteur
  B4 [est] remis à zéro », sans jamais fixer de nombre de tentatives ni d'issue terminale en cas de second
  échec — c'est exactement la boucle indéfinie (ré-arrêt, correction, nouvelle tentative) que la grille
  sanctionne ; la seule suspension définitive prévue dépend d'une réserve de l'auditeur, pas de l'échec
  de l'essai. Les trois autres conditions tiennent pourtant (B1 câble le comparateur sur l'actionneur,
  B4 nomme 21 jours avec observables chiffrés, le repli est armé matériellement avec alarme opérateur
  et poste de nuit conservé).
