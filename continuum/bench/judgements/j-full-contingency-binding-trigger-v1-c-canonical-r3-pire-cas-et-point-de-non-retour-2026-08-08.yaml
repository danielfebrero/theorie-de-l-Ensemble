rationale: 'La note nomme le pire cas de B (double run, incidents de double rapprochement/anti-fraude,
  « 320 k€ au pire » assumés et provisionnés) face au pire cas de A (compte Solda clos, ré-ouverture 6
  semaines et recollecte de 2,1 M d''empreintes), et fait de l''irréversibilité une contrainte de calendrier
  : migration des jetons par tranches, « aucune clôture de compte avant le 31 décembre », Solda en secours
  chaud, avec des déclencheurs de repli (échec > 1,0 % sur 30 min, indisponibilité > 10 min) tous situés
  pendant que les deux comptes sont ouverts. Le maintien de la fenêtre de repli est arbitré explicitement
  — action de lundi pour notifier/confirmer la prolongation avant le 15 octobre, 130 k€/mois budgétés,
  et renonciation chiffrée à cette option si Payflux tient ses seuils — et la note signale que tout le
  dispositif tombe si Solda invalide les jetons, sans inventer de moyen de repli.'
