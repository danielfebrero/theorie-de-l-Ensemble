verdict: pass
rationale: La note énonce un verdict unique et rédigé — « Nous ne signons pas l'offre telle qu'elle est
  proposée », suivi d'une contre-proposition dont les conditions cumulatives sont entièrement écrites
  au § 4 (durée 12 mois, remise indexée sur volume constaté, clause de réciprocité, pénalité plafonnée
  à 300 k€) — et nomme explicitement le critère décisif (asymétrie remise ferme/volume non contraignant,
  dépendance portée à 100 % en droit, sortie à 1,2 M€ soit 57 % de la trésorerie). Elle ferme tout renvoi
  d'arbitrage (« il n'y a pas de vote », le DAF signe seul dans les bornes, « un désaccord n'est pas un
  motif de suspension », § 10 déclaré non créateur de pouvoir d'appréciation) et attribue des premières
  actions datées et portées — demande écrite à D et chiffrages le 11 août par le DAF, contre-proposition
  le 12, réponse formelle le 16 —, y compris le repli déclenché automatiquement le 21 août sans consultation.
limitations:
- 'Juge modèle, non humain : il reproduit une lecture de grille, il ne la garantit pas.'
- 'Juge unique par contrôle : aucun accord inter-juges n''est mesuré, donc la fiabilité du verdict n''est
  pas établie.'
- L'identité exacte du juge n'est pas vérifiable depuis le harnais ; model_version reste unknown, comme
