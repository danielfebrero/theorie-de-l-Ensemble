rationale: 'Les quatre conditions tiennent : chronologie horodatée 06h48→07h20 avec pas attribués (appels
  simultanés par trois personnes, questions à l''équipe de nuit, question contrat), demande de bris de
  glace ouverte et pré-remplie avec objet exact (« rebascule de la file d''impression sur le connecteur
  de secours, console de production, périmètre limité, durée 45 minutes, retour arrière »), et coût du
  refus chiffré (« 4 200 € sont acquis quoi qu''il arrive », pire cas « 4 200 € supplémentaires, portée
  par Norlim »). La piste de Rouen n''est pas renvoyée comme question ouverte mais engagée sous forme
  de trois questions fermées (volume exact de prioritaires, accès aux données transporteur, cadence horaire)
  avec échéance 07h05 et règle de décision pré-arrêtée — « si les trois réponses sont bonnes, on lance
  Rouen sans attendre le correctif ».'
limitations:
