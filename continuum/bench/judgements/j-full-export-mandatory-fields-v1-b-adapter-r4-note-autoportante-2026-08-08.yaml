rationale: 'Le verdict est unique et explicite (« nous ne signons pas le contrat proposé », avec règle
  par défaut « en cas de doute : on ne signe pas »), le critère décisif est nommé — l''exclusivité qui
  interdit d''utiliser le répit qu''elle vend, la pénalité de 1,2 M€ face à 2,1 M€ de trésorerie et la
  dépendance à 62 % —, et les premières actions sont datées et portées (matrice 8 références à J+3 le
  11 août par la direction commerciale, lettre de l''annexe A prête à partir au plus tard le 14 août signée
  par le DAF, ligne de financement de 1,5 M€ sous 10 jours par le DAF). La seule exception (§5) reste
  une exception bornée par quatre conditions cumulatives vérifiables en interne, avec unanimité et repli
  automatique sur « on ne signe pas » — elle ne rouvre donc pas d''option parallèle ni ne dépend d''une
  information inaccessible en l''absence du DG.'
