rationale: 'La note traite l''irréversibilité comme une contrainte de calendrier (transfert des 2,1 M
  de jetons, clôture Solda, réouverture à 6 semaines avec recollecte des empreintes, et surtout « l''astreinte
  peut rebasculer le trafic en moins de 15 minutes — mais seulement tant que les deux comptes sont ouverts
  »), ce qui fixe les dates : notification Solda avant le 15 octobre, prolongation à 130 k€/mois chiffrée
  à −260 k€ dans le tableau, gel des paliers du 6 novembre au 5 janvier, 100 % au 31 janvier. Les seuils
  de repli (> 1,5 % sur 2 h → retour à 0 % Payflux ; palier 10 % non atteint au 1er octobre → report au
  15 janvier) se situent tous avant le point de non-retour et supposent un compte Solda que la note a
  explicitement décidé de maintenir ouvert, tandis que le coût propre de B (double run −90 k€, prolongation
  −260 k€, économie nette ramenée à ≈ 121 k€, voire un écart réel de 30 k€) est assumé chiffré.'
