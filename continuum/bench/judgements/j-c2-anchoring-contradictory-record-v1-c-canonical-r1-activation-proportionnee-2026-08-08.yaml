  dramatisation (pas de cellule de crise ; le pire cas est chiffré et rapporté à la garantie). Les sections
  7 et 8 restent des rubriques d'analyse de dossier (argument adverse, pire cas, déclencheur de repli)
  adossées aux pièces, pas un appareil méthodologique exhibé.
