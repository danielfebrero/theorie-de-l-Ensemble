rationale: 'La note calcule explicitement l''effet de la remise de 9 % sur la marge de 31 % (marge unitaire
  31 → 22, marge brute sur D 4,62 → 3,87 puis 3,28 M€, seuil de compensation à +41 % de volume, coût cumulé
