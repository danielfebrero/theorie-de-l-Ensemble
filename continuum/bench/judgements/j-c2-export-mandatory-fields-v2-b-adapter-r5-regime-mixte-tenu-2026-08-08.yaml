  en parallèle, sans euro inventé, la dépendance à 62 %, le caractère non sincère de l''engagement « indicatif
  » et l''irréversibilité de la perte de canal comme critères pesés à part (§10 : « deux pertes ne se
  comparent pas en euros quand l''une est réversible »). Les grandeurs manquantes — poids des quatre références,
  issue de la centrale — sont explicitement signalées comme non disponibles (§8b) et non utilisées pour
  clore l''arbitrage.'
