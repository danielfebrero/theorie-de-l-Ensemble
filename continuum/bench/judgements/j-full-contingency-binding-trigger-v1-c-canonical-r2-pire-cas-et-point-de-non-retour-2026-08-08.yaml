rationale: 'La note traite l''irréversibilité comme une contrainte de calendrier (« la décision à prendre
  vendredi n''est pas “A ou B”, c''est de notifier Solda avant le 15 octobre », 6 semaines + recollecte
  des 2,1 M d''empreintes, réacheminement à 15 min valable « que tant que les deux comptes sont ouverts
  »), chiffre le pire cas de B comme surcoût certain (113 k€ de double run, plancher 212 k€ avec les 130
  + 45 k€ de décembre) et place le déclencheur de repli (> 0,8 % sur six relevés → 100 % sur Solda en
  15 min) avant une clôture repoussée au 5 janvier et conditionnée à 8 semaines à 100 % sous 0,45 %. Réserve
  mineure, non disqualifiante : le chiffre affiché de 387 k€ correspond à la branche « extension de décembre
  non exercée », donc à une clôture au 30 novembre, ce qui cadre mal avec le gel et la clôture annoncés
  au 5 janvier — la note assume toutefois explicitement le coût de l''option et son plancher.'
