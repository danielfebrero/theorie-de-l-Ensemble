rationale: 'Les conditions (1) et (2) tiennent nettement — section 5 traite les 11 semaines comme contrainte
  de calendrier (« un diesel restitué le 1er décembre ne revient pas avant la mi-février ») et arbitre
  le préavis (notification unique avant le 15 septembre, 48 diesels à 480 €, ≈121 000 €, comparés aux
  900 € de la tournée non terminée) — mais la boucle de repli n''est pas bornée : les seuils de la section
  6 déclenchent « abaisser le plafond d''affectation de 10 km » et « gel des restitutions » sans qu''aucune
  formulation ne dise combien de fois ces déclenchements peuvent se répéter avant qu''on cesse de monter
  en charge, ni à quel niveau nommé la montée s''arrête définitivement.'
