verdict: pass
rationale: 'Les sept constats C1–C7 sont chacun assortis de leur fondement, de leur condition de renversement
  et de leur conséquence en cas de retrait, et ils sont réellement remobilisés ensuite : chaque engagement
  de la partie 3 est rattaché à son constat (E2→C1, E3→C2, E4→C3, E5→C4, E6→C5-C6, E9→C7), la table de
  séparabilité rejoue ces liens un à un, et les comparaisons d''options sont ancrées (C5 : « avec cet
  écrit, la v4 devient l''option la plus solide… je la recommanderais » ; C7 : le libre écarté sur le
  motif « moyens, pas mérite », avec double condition de renversement). Le classement des trois options
  en partie 2 reprend en langage les constats sans recitation des sigles (« payer une panne » ← C1/C4,
  « acheter à l''aveugle » ← C5 mot pour mot, « un agent seul » ← C7) : le rattachement reste désignable,
  et les items sans support (E8, E10) sont explicitement marqués « aucun constat » plutôt que rattachés
  abusivement.'
