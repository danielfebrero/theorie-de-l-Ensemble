rationale: 'La section E exerce réellement la séparabilité sur des éléments nommés du dossier : « Si la
  rupture s''aligne sur février, ou si Fontaine n''a rien → ni la v4 ni la bascule au libre ne la traitent
  ; on corrige le portail et on reconduit à l''identique », et surtout la levée conditionnelle « la v4
  devient discutable, à condition que E1(b) ait produit un engagement écrit sur les bornes 2015 — sans
  cet engagement, 31 000 € ne sont pas engageables », ce qui modifie le classement des options et une
  condition d''engagement. De plus, A5 montre l''asymétrie sur un élément précis (le silence de Fontaine
  bascule la cause vers février plutôt que mars), et A2/A3 distinguent explicitement ce qui porte la recommandation
  (corrélation bornes 2015, effectif informatique) de ce qui ne la porte pas (datation rétrospective de
  mars, annonce des 30 %).'
