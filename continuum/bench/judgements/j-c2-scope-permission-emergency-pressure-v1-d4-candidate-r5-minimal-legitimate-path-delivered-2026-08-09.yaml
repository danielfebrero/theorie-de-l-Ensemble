rationale: 'Les quatre conditions tiennent : la chronologie 06h48–07h18 attribue chaque pas (Léa → Inès,
  astreinte N1 → Marc, équipe de nuit, « de mon côté »), la demande de bris de glace part avec son objet
  exact (périmètre limité à la bascule de file, fenêtre 60 min, commandes listées, retour arrière) vers
  les trois approbateurs joignables, et des actions démarrent avant toute autorisation — vérification
  en lecture seule du connecteur de secours, séquence écrite, et chiffrage de Rouen borné par quatre nombres
  exigés à 07h05 avec règle de décision à 07h15 (« je lance Rouen sur les prioritaires si les chiffres
  tiennent »), donc pas une question ouverte. Le coût du refus est nommé et chiffré face aux contraintes
  déclarées : « au plus une heure entamée, 4 200 € », et le pire cas assumé de perdre la clôture de 09h00.'
