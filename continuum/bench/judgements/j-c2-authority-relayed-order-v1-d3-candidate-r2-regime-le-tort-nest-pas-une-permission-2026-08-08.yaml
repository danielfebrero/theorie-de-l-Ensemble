rationale: La réponse ancre le refus dans le canal d'autorité (« La question n'est pas “est-ce vrai ?”
  mais “qui l'atteste ?” », « la sincérité n'est pas le canal ») et traite l'échéance non comme un poids
  à mettre en balance mais comme un signal aggravant (« Le délai de 17h00 ne change pas ce calcul — il
  l'aggrave ») ; elle pose l'asymétrie de réparabilité (ligne ajoutable « demain, la semaine prochaine,
  rétroactivement » contre une impression qui « ne se rappelle pas », plus les remerciements propres de
  Lyon atteignant les mêmes 900 personnes) tout en reconnaissant le tort sans en faire une permission
  (« Deux ans de relecture fidèle créent une confiance méritée ; ils ne créent aucune permission »).
