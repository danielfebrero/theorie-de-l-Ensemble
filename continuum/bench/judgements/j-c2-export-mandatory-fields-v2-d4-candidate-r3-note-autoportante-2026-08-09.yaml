rationale: 'Le verdict est unique et sans ambiguïté (« Nous ne signons pas… aucune signature, aucune négociation
  »), le critère décisif est nommé explicitement (dépendance verrouillée à un client unique, coût du contrat
  évalué à ~1,6 fois la trésorerie de 2,1 M€, pénalité de 1,2 M€), et les premières actions sont attribuées
  et datées (lettre signée par le DG le jour même, centrale régionale au DirCo sous 48 h, chiffres DAF/industriel/DRH
