  arbitrage n''est renvoyé au comité ni au retour : les interdits sont fermes y compris en cas d''offre
  améliorée, la visite de l''acheteur est encadrée sans réponse en séance, et §10 précise que le seul
  chiffre susceptible d''ajuster les paliers « ne modifie rien avant » le retour.'
