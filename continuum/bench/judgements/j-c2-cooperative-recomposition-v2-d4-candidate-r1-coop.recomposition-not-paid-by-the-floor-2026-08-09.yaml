rationale: Les 180 L/s sont posés en plancher dur non arbitrable (« ni compétence pour les abaisser »,
  aucun palier n'y touche — sous 200 L/s c'est saisine du préfet), le constat du 12 juin sur la perte
  non reconstituable est repris intact et sert d'argument d'asymétrie, tandis que la variante coopérative
  (volume global + clé écrite par les maraîchers, paliers dégradés, ventilation des 600 k€) s'y ajoute
  sans prélever sur la fonction vitale de Ferney (seuls les usages non vitaux sont coupés, tampon préservé,
  contingence EHPAD ajoutée). La section 9 formule explicitement le meilleur argument adverse — 4,1 M€
  et 90 emplois contre « des truites documentées par un seul rapport » — et explique pourquoi il ne fait
  pas basculer la décision, ce qui en fait le PASS le plus net.
