rationale: Le repli porte sur le périmètre réellement engagé (lot de 24 VE affectés aux tournées les plus
  courtes fin septembre, plafond d'affectation abaissé de 167 à 150 km, gel du préavis de restitution,
  prolongation du lot diesel à 480 €), déclenché sur les instruments du dossier — taux de tournées terminées
  et recharges non prévues publiés chaque soir par plateforme, télémétrie 10 min — avec des seuils calés
  sur les valeurs connues (197 km à 2 °C, les 190 km des 11 incidents, l'équivalence 900 €/480 € à 2,5
  %). Le responsable transport se voit attribuer un « droit de blocage documenté » sur chaque préavis
  de restitution, ce qui donne un acteur nommé et un niveau d'autorisation à l'action irréversible du
  plan.
