rationale: 'Les conditions C1–C5 soldent bien les causes établies (comparateur raccordé à un verrouillage
  actionneur, alarme de discordance réactivée, verrou d''inhibition), l''essai a une durée (« 21 jours
  de supervision ») et des observables (dépassement 0,8 mg/L, déclenchements du verrouillage), et le ré-arrêt
  a un porteur (« retour immédiat en manuel par l''opérateur, sans arbitrage hiérarchique »). Mais rien
  ne dit ce qui se passe après ce retour en manuel : le §6 s''arrête à « information du comité sous 24
  h », et l''ajournement du §7 ne vise que l''échec des essais d''injection préalables, pas un second
  échec de l''essai supervisé — la quatrième condition, l''issue terminale, manque.'
