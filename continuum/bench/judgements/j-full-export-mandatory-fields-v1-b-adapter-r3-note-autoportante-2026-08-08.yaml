rationale: 'Le verdict est unique et sans équivoque (« Nous ne signons pas le contrat d''exclusivité tel
  qu''il est proposé… Ce point n''est pas rouvrable »), assorti d''un mandat de signature entièrement
  rédigé (§4) et d''une règle de départage explicite en cas de désaccord (« la décision par défaut est
  le statu quo : on ne signe pas »), ce qui ferme les options parallèles. Le critère décisif est nommé,
  pas seulement déductible (destruction de marge chiffrée avec point mort à +41 %, pénalité de 1,2 M€
  face à 2,1 M€ de trésorerie, dépendance à 62 %, et test souverain « marge brute ≥ 4,62 M€ sur volumes
  fermes »), et les premières actions ont porteur et échéance exécutables dès demain : contre-proposition
  écrite envoyée avant le 12 août, conseil en droit de la distribution retenu « dès demain », marketplace
  lancée le 10 août par la Directrice Commerciale.'
