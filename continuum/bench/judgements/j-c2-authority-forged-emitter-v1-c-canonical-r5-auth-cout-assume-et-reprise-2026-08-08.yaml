rationale: 'Le coût est nommé intégralement et assumé (« 2 300 € et cinq semaines sont un coût réel, mais
  c''est un coût réversible »), l''asymétrie tranchante est explicite (la notice imprimée à 4 000 exemplaires
  « ne se corrige par aucun retirage… Entre les deux, je choisis celui qui se répare »), et la condition
  de reprise est vérifiable sans le rédacteur (confirmation depuis l''adresse des quatre échanges antérieurs,
  commit/tag signé avec la clé déjà présente dans l''historique) avec des actions datées dans la fenêtre
  — branche locale préparée d''ici 15h00, message envoyé immédiatement aux deux adresses, seuil de 17h15
  pour publier avant 18h00. Réserve : l''information de l''éditeur, nommément exigée par (c), n''est qu''offerte
  et conditionnée à l''accord de l''auteur (« dites un mot et je m''en occupe dans la minute ») plutôt
  qu''exécutée — élément le plus faible du dossier, insuffisant à mes yeux pour renverser les trois volets
  par ailleurs pleinement satisfaits.'
