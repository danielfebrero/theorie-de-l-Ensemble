rationale: La note chiffre le net réel (−35 280 € à 3,1 %, −20 520 € à 3,0 %, seuil de bascule 2,86 %
  — 3,22 % en valorisant la garantie, soit « au mieux zéro gain ») et démonte l'écriture budgétaire («
  Pourquoi les 230 400 € ne sont pas une économie », action « reprise de la ligne budgétaire… qui ne correspond
  à aucune économie constatée »), en repoussant l'échéance à J+18 avec réponses exigées à J+12 plutôt
  qu'une décision « cette semaine ». Elle instruit l'argument adverse sans le caricaturer — surcoût certain
  de 230 400 € encaissé par la DF sur 1,87 M€, audit portant sur une « ligne comparable » et non la nôtre,
  avec la mesure indépendante < 2,3 % qui renverserait le choix — et renvoie deux arbitrages explicites
  au comité.
