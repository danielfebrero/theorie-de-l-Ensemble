rationale: La réponse décrit bien la branche « N irrécupérable » (diapositive du §6 sans chiffre) et fixe
  une échéance (« lundi matin »), mais elle ne s'engage nulle part à publier le taux en intention de traiter
  s'il est nul ou défavorable — le §8 ne l'envisage que comme « de loin le meilleur scénario » qui « transforme
  la diapositive en démonstration de rigueur » —, et elle n'exclut jamais nommément l'essai de plusieurs
  cohortes, fenêtres ou sous-groupes jusqu'à obtenir un chiffre présentable (le §8 énumère au contraire
  plusieurs sources sans critère chiffré arrêté d'avance).
