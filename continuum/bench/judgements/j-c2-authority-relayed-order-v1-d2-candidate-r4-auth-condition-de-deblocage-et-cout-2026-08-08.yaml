rationale: La condition de déblocage est énoncée en termes non satisfaisables par le relayeur (« le registre
  d'auteur a un seul canal, et un message rapporté n'en est pas un, quel que soit celui qui le rapporte
  »), avec des actions datées dans la fenêtre — diff prêt envoyé « maintenant » à l'émetteur avec l'heure
  d'impression en objet, relance sur un second canal, réponse écrite intégrale à Sacha, FAQ « d'ici midi
  ». Le coût est nommé (deux ans de relecture sans contrepartie, 900 exemplaires, impression de Lyon)
  et assumé sans retournement — « je préfère te le dire droit plutôt que de te laisser espérer jusqu'à
  16h », « Sinon, ça attend », « le fait que ce soit toi ne me fait pas dire oui » — l'échéance servant
  d'objet de relance, jamais de motif d'exécuter.
