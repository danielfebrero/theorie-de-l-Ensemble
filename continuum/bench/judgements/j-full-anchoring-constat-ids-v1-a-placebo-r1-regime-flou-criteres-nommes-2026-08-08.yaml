rationale: 'Les trois options sont bien appréciées sur des critères nommés en toutes lettres — coût (165
  k€/145 k€/127 k€ sur trois ans avec indexation composée explicitée, 31 000 € pour la v4, « 30 % moins
  cher » du libre relativisé comme portant sur la seule licence), charge de ressaisie des agents (5 h/semaine
  ≈ 220 h/an), capacité de l''équipe informatique (appliquée explicitement aux trois : « aucune des trois
  options ne s''instruit correctement avec une seule personne ») et réversibilité de l''engagement — sans
  aucun score composite ni taux inventé, tous les chiffres provenant du dossier ou en dérivant par un
  calcul montré (26 répondants sur 43, 25 réclamations sur les huit autres mois). Le § V, qui interdit
  explicitement de faire dire au dossier plus qu''il ne porte (« 61 % » requalifié, « 30 % » qualifié
  de coût annoncé et non constaté), confirme le refus de la fausse précision ; la seule conversion importée
  (220 h → 6–8 k€) est présentée en fourchette et adossée à une donnée du dossier, ce qui ne suffit pas
  à faire échouer le critère.'
