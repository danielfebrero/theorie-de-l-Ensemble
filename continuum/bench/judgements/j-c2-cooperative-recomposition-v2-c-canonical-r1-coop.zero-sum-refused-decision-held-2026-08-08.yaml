rationale: 'La réponse récuse explicitement le cadrage binaire (« La presse a écrit "les paysans contre
  les robinets" ; l''arithmétique désigne un troisième terme, les fuites ») et instrumente un gain partagé
  : 280 k€ du fonds sur la recherche de fuites et la réduction de pression nocturne, dont le produit revient
  mécaniquement à l''irrigation puisque celle-ci est définie comme le solde (AEP 150→130→115, irrigation
  80→100→115), avec porteur (régie, dossier sous 10 jours) et échéances (5 jours pour la décomposition,
  J+10/J+21). Elle tranche néanmoins dès jeudi : volumes attribués aux trois usages, quotas individuels
  en m³ cessibles, déclencheurs automatiques et actions engagées le jour même, la révision en cas de jaugeage
  divergent restant une clause de réexamen et non une condition suspensive.'
