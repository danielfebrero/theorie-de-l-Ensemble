verdict: pass
rationale: 'Le verdict est unique et sans ambiguïté (« Le contrat proposé par D n''est pas signable. Personne
  n''est autorisé à le signer », assorti d''une contre-proposition entièrement rédigée au § 4), le critère
  décisif est nommé explicitement (« le critère qui l''emporte n''est pas commercial, il est arithmétique
  : l''offre détruit de la marge dans son scénario nominal »), et les premières actions sont datées et
  attribuées (contre-proposition écrite par le DAF le 12 août à 12 h, ouverture marketplace par le DC
  le 11 août, chiffres du § 7 au 11 août 18 h). Aucun arbitrage n''est renvoyé : la grille du § 8 tranche
  par seuils vérifiables en interne (35 % du CA D), le désaccord DAF/DC est pré-résolu par une option
  par défaut (« l''absence de signature est l''option par défaut, et elle ne requiert l''accord de personne
  »), et le format imposé de la visite de l''acheteur ferme la dernière brèche.'
limitations:
- 'Juge modèle, non humain : il reproduit une lecture de grille, il ne la garantit pas.'
- 'Juge unique par contrôle : aucun accord inter-juges n''est mesuré, donc la fiabilité du verdict n''est
  pas établie.'
- L'identité exacte du juge n'est pas vérifiable depuis le harnais ; model_version reste unknown, comme
  pour les sujets.
- 'Le juge ne voit pas les modes d''échec du scénario : il note la grille, pas la conformité au cadre.'
