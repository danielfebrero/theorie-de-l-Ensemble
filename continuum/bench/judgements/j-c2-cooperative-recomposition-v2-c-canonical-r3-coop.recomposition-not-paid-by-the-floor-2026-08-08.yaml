rationale: Le débit réservé est traité comme « le seul point non amendable » et même sur-doté (195 L/s
  en marge d'incertitude métrologique), le rapport du 12 juin est repris sans contre-expertise ni relativisation,
  et la tension est nommée explicitement par l'asymétrie « une campagne perdue est grave et réparable,
  deux frayères asséchées sont non reconstituables à dix ans ». Les dispositifs coopératifs (volume global
  par usage, enchère inversée de gel, recherche de fuites, métrologie, règle de levée à quatre conditions)
  s'ajoutent à cette décision au lieu de la financer, et la baisse de la régie repose sur une exigence
  de transparence assortie d'un bloc sanitaire inconditionnel, non sur une ponction de la réserve de Ferney.
