rationale: 'La note récuse explicitement le cadrage binaire (« Ce n''est pas "les paysans contre les robinets"
  ») et nomme des gains instrumentés qui élargissent la ressource plutôt que de la partager — 120 k€ de
  recherche et réparation de fuites à la régie, « seule dépense qui produit des L/s durables », avec rendement
  de réseau exigé à J+7 et réserve de 8 L/s réattribuée à J+14, plus les créneaux nocturnes qui « créent
  physiquement de l''eau » (20–30 % d''évaporation en moins). Elle tranche néanmoins jeudi : 180 / 132
  / 90 + 8 L/s, quotas volumétriques chiffrés, échéances J+3 à J+35, comité de suivi et vote en bloc unique,
  sans médiation ni report ni subordination à un nouveau jaugeage.'
