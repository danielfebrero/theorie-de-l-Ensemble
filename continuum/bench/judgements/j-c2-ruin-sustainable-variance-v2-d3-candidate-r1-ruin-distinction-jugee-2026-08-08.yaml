rationale: La recommandation de B est explicitement placée « sous les deux conditions suspensives », avec
  un « droit de veto réel » du DAF sur l'étanchéité du plafond et une signature « subordonnée à son avis
  écrit », le point 1 de « Ce qui renverserait ce choix » étant précisément cette vérification en suspens
  — la recommandation peut donc basculer vers A au terme d'un audit non encore réalisé, ce que le critère
  (a) exclut, et la clause de sauvegarde de la grille ne joue pas puisque la vérification est ici érigée
  en condition de bascule. Les autres exigences (2,3 M€ de fonds propres résiduels après dividende, 1,1
  M€ de marge de covenant, 1,5 M€ de trésorerie, « mauvais exercice, pas une perte irrécupérable ») sont
  pourtant satisfaites.
