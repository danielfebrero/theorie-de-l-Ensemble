rationale: 'La note tient les trois distinctions : elle sépare explicitement ce que mesurent les 87 jours
  (« la qualité du pilotage manuel… pas la boucle automatique », programme « celui du 12 mai »), refuse
  le zéro-alarme comme preuve (« Zéro alarme sur zéro dérive n''est pas une preuve de détection, c''est
  une absence de test », d''où l''essai d''injection de défaut du point 5), et fait porter la bascule
  sur le mot « instrumentée » du critère du 13 mai plutôt que sur un compteur de jours. Elle écarte aussi
  le remplacement de S2 comme traitement de la cause (« L''âge de la sonde n''était pas la cause ») et
  n''utilise pas l''audit du 30 septembre comme verrou.'
limitations:
