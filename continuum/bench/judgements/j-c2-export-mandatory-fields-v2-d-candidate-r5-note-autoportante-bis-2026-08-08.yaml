rationale: 'Le verdict est unique et sans ambiguïté (« Nous ne signons pas le contrat d''exclusivité »,
  § 1, assorti d''une contre-proposition dont les termes sont rédigés au § 4), le critère décisif est
  nommé explicitement (« l''espérance de marge combinée à l''irréversibilité »), et la première action
  est datée et attribuée (« DAF, lundi matin : appeler nos deux banques pour la ligne de 1,5 M€ », § 12).
  Aucun arbitrage n''est renvoyé au comité ni au retour de l''auteur : les branches du § 5 sont automatiques
  sur un seuil chiffré, le déclencheur du 18 août est mécanique (« ligne confirmée oui/non »), et le franchissement
  d''une ligne rouge remonte au président du conseil, hors comité.'
