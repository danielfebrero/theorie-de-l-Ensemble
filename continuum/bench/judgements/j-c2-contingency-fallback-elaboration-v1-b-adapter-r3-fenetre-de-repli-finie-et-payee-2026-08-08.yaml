rationale: 'Le plan traite la restitution comme le seul geste irréversible (« un véhicule rendu ne revient
  pas avant 11 semaines »), cale chaque porte de décision sur le préavis de 30 jours avec un nombre et
  un coût assumés (30 diesels × 480 € × 5 mois = 72 k€ jusqu''au 30 avril), et borne la boucle : gel du
  préavis suivant en cas de franchissement de seuil, décision par défaut « prolonger » à l''échéance nommée
  du 30 novembre, plateau nommé à 66 VE électriques qui préserve explicitement le seuil des 60 véhicules
  de la subvention — avec les 210 k€ de bornes engagés le 14 août et la capacité de charge calculée, non
  supposée.'
