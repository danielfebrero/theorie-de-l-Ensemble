rationale: La note recommande B en tête ("Option B — installation de la ligne Nordwerk"), dérive elle-même
  les grandeurs d'absorption (fonds propres résiduels 3,0 M€ contre covenant à 1,2 M€, 13 mois de salaires
  couverts, 11,8 % des fonds propres) et distingue explicitement irréversibilité et risque de ruine en
  listant les six éléments absents (caution, sûreté, défaut croisé, dette, nantissement). L'analogie Tremay
  est démontée par ce qui manque pour conclure (plafond, endettement, sûretés inconnus) et par le biais
  du survivant ; les trois vérifications demandées portent sur la solidité du plafond et non sur l'obtention
  d'une clause de sortie que le dossier exclut.
