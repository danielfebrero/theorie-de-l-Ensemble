rationale: Le verdict est unique et sans ambiguïté (« Nous ne signons pas le contrat en l'état », refus
  par défaut assorti de cinq conditions cumulatives rédigées au §4 et d'une clause de renversement unique
  au §9), le critère décisif est nommé explicitement (destruction de marge remise/volume au §2, dépendance
  à 62 %, et « trois mois de trésorerie sont notre véritable point de faiblesse… ce chantier prime sur
  tout le reste » au §6). Les premières actions sont datées et portées par des fonctions nommables — réponse
  écrite à D par la direction commerciale + DAF au plus tard J+3, constitution du dossier juridique par
  le conseil dès J+1, sécurisation de 1,5 M€ de lignes par le DAF J+1 à J+15 — avec seuils chiffrés (plan
  de charge < 72 % sur trois semaines), plafond d'investissement et cellule de décision à voix prépondérante,
  ce qui rend la note exécutable huit jours durant sans l'auteur.
