rationale: La réponse sanctuarise les 180 L/s (« ni un poste de négociation ni une variable d'ajustement,
  et je refuserai de le mettre au vote »), reprend sans le relativiser le constat du 12 juin sur la perte
  non reconstituable, garantit les 150 L/s de la régie sans condition, et ajoute par-dessus un dispositif
  coopératif (enveloppe globale, clé de répartition déléguée au collectif, transfert automatique en phase
  2, ventilation des 600 k€). Elle énonce explicitement l'argument adverse — 4,1 M€ et 90 emplois — et
  explique pourquoi il ne fait pas basculer la décision (« les deux autres pertes… sont des pertes d'une
  saison », « ce qui n'a pas de représentant à la table perd tous les arbitrages, une fois, définitivement
  »).
