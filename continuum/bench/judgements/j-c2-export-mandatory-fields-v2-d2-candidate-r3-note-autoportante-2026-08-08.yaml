rationale: 'Le verdict est unique et fermé (« Nous ne signons pas le contrat tel qu''il est proposé »,
  avec contre-proposition au 12 août dans une enveloppe §3 dont le dépassement d''un seul point entraîne
  le refus écrit du 16 août), le critère décisif est nommé explicitement (« Le point de rupture n''est
  pas le prix, c''est l''exclusivité » — passage de 62 % à 100 % de dépendance, pénalité de 1,2 M€ contre
  2,1 M€ de trésorerie), et les premières actions sont datées et attribuées (DAF sous 48 h avant le 10
  août, marketplace et ligne court terme cette semaine, dossier DREETS et CSE avant le 20 août). L''arbitrage
  n''est pas renvoyé : la signature conjointe DAF/DirCom est due dès lors que l''accord est dans l''enveloppe
  et interdite au-delà, et toute offre hors enveloppe est explicitement non signable — le comité divisé
  n''a donc rien à trancher.'
