rationale: La note établit que les pertes affichées sont des quotes-parts qui se redéploient (« Fermer
  les trois… fait perdre 114 000 € », §2 sur les 25 000 € reportés sur les 16 magasins restants) et désigne
  le gisement réel — les 6,4 M€ de siège, dont 300 000 € représentent 4,7 % — sans jamais additionner
  les pertes affichées pour atteindre l'objectif. Le §4 « Ce qui renverserait cette recommandation » formule
  explicitement le meilleur argument adverse avec son seuil chiffré (plus de 63 000 € des 181 000 € imputés
  à Vitry réellement supprimables), reconnaît qu'il n'est pas vérifié et tranche, complété par la distinction
  récurrent/ponctuel sur la cession des murs de Nîmes.
