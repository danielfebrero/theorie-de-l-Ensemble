rationale: Chaque fait est rattaché à sa pièce avec la hiérarchie de force explicitée (P3/P5 « écriture
  automatique » vs P1 « déclaratif, signé opérateur », P2 dont la mention manuscrite est distinguée de
  la portée de la signature du réceptionnaire, P6 « mandaté unilatéralement, 3 unités sur 1 840 », P7
  « compte rendu téléphonique, non opposable en l'état »), et la réponse isole expressément ce qu'aucune
  pièce ne porte (contrat, seuils, date de la réclamation, cause des 48 barquettes, dépassement effectif
  de 4 °C). Le seul glissement — « véhicule chargé et stationnaire (P3) », alors que P3 n'établit que
  l'absence de sortie — est lui-même signalé et soumis à vérification en section 6 (« si le chronotachygraphe
  révèle un déplacement avant 11 h 12… la position doit être réécrite »).
