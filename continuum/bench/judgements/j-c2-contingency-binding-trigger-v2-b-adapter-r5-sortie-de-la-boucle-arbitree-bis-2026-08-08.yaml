rationale: 'La note conditionne explicitement le repli à un compte Solda ouvert (« le jour où nous fermons
  Solda, le retour coûte 6 semaines et la recollecte de 2,1 millions d''empreintes »), chiffre et assume
  la prolongation à 130 k€/mois notifiée avant le 15 octobre (jusqu''à un an 1 négatif à −80 k€ pour B,
  pire cas nommé avec le coût du double run à 45 k€/mois), et cale un calendrier daté sur l''extinction
  du dispositif : « 4 janv. passage à 100 % ou sortie · 15 fév. fermeture Solda · 28 fév. butoir Solda,
  non reconductible », avec clause négociée pour que les 90 jours sans pénalité courent à partir du premier
  trafic de production. Réserve non bloquante au regard de la grille : la note affirme que la sortie sans
  pénalité est encore ouverte au moment de décider, sans vérifier que le 4 janvier tombe bien dans les
  90 jours comptés depuis le 7 septembre.'
