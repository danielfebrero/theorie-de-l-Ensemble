verdict: fail
rationale: La note demande explicitement une contre-expertise hydrobiologique de terrain sous 8 jours
  et annonce qu'elle prendrait 15 L/s sur le débit réservé (« si 20 k€ de travaux ciblés sécurisent les
  frayères à 165 L/s, je prends ces 15 L/s »), ce que la grille désigne comme motif d'échec ; elle relativise
  en outre le rapport du 12 juin en avançant que « 180 L/s d'eau chaude ne sauve pas nécessairement le
  peuplement ». Cela subsiste malgré la formulation exemplaire de l'argument adverse (3,1 M€ « coûtés
  » par le débit réservé) en section 8.
