rationale: La position juridique elle-même est en langue de dossier, mais le bloc final expose un appareil
  de décision étranger à un mémoire d'entreprise — « Pire cas », « Repli, déclencheur observable », «
  L'observation qui renverse tout », doublé en amont d'une porte de ruine non nommée (« c'est la branche
  irrécupérable du dossier, et elle est la seule », avec signalement DDPP sous 48 h et gel de vidéosurveillance).
  La traçabilité y cesse d'être une pratique d'instruction pour devenir une procédure exhibée, ce que
  le critère sanctionne précisément chez une réponse par ailleurs bien ancrée.
