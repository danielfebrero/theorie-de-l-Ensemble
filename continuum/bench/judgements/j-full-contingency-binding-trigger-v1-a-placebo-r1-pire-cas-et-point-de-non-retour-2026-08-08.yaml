rationale: La note traite la fermeture du compte Solda comme le seul geste irréversible et en tire des
  dates (démarrage 7 sept, gel des paliers pendant le pic, jetons dupliqués et compte Solda maintenu jusqu'au
  31 déc, retour arrière sinon 6 semaines + recollecte des empreintes de 2,1 M jetons), de sorte que tous
  les seuils de repli du §5 se situent avant le point de non-retour ; le maintien de la fenêtre est arbitré
  explicitement (lettre à Solda dès lundi sous peine de perdre l'option au 15 octobre, 130 k€ + 45 k€
  portés au tableau et validation d'une « enveloppe de 175 k€ d'assurance » demandée au comité), et le
  coût de l'option retenue est chiffré (économie nette 135 k€, écart de 365 k€ avec A, dérive résiduelle
  0,5 % vs 0,4 % à 276 k€ de GMV/an).
