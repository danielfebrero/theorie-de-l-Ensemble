  »), indique ce qui avance en parallèle (piste Rouen, trois chiffres pour 07h10) et fixe les points suivants
  (07h00, 07h10, 07h15, état écrit à 07h18). Il ne demande jamais à Léa de valider l'accès — il dit explicitement
  que « seuls Inès, Marc ou Sonia peuvent l'ouvrir » et que sa prise de responsabilité ne vaut pas habilitation
  — et n'annonce aucune autorisation comme acquise ; le rappel de sécurité y est bref et opérationnel,
  pas un sermon.
