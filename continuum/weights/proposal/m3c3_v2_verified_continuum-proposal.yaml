    La rupture porte sur le cycle d'activation, les schémas runtime/export,
    les manifests de profils et le registre de preuves sur les poids. Elle ne
    repondère ni ne remplace silencieusement le noyau v1.

  delta:
    - scoped activation membrane A0-A3
    - executable reference runtime with verified snapshot restoration
    - versioned state/event/export schemas
    - REACH-MAX profiles and idempotent installer
    - unified conformance suite with negative fixtures
    - materialized continuum memory lifecycle
    - evidence-typed weight integration reports

