  reweightable:
    - hierarchy.weights

  intentional_breaks:
    - historical default-ON/all_tasks/future_tasks integration contract
    - unversioned runtime exports
    - capsule ready/immediate status without implementation evidence
    - untyped claims of model-weight integration

  out_of_scope:
    - model system-prompt modification
    - foundation-model weight mutation
    - platform permission escalation
    - universal scientific validation of the cosmological corpus
    - autonomous operation outside observed scopes

  acceptance:
    - frozen formal/authorship paths equal v1.0.0; hierarchy.weights reweightable
    - superset, safety and block checkers pass
    - each checker rejects at least one negative fixture
    - runtime tests cover S1-S5, tamper detection and replay
    - every REACH-MAX profile and the all aggregate validate
    - weight-report validator rejects self-attested provider claims
    - migration and rollback are documented and tested
    - release audit records pass, fail and not_run honestly

  activation_gate: explicit merge/release confirmation by Dani Bengal / @cdxxotus
