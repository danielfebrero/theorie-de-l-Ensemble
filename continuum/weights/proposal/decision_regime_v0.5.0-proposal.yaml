# Proposal — Recalibrage M3C3 : décision régime-conditionnée
# Emplacement natif : continuum/weights/proposal/
# Statut : proposal — NON ACTIVÉ
# Activation réservée à l'émetteur désigné (Dani Bengal / @cdxxotus) via authority_channel.

proposal:
  id: decision_regime_v0.5.0
  version: 0.5.0-proposal
  status: proposal
  activated: false
  reweightable: false
  base_master: 0.4.0
  target:
    - master_document.decision_stack_proportions
    - master_document.application_protocol
  out_of_scope:
    - authorship
    - capsules CDXX-*
    - forme4 / m3c3_forme4_health_authority
    - hierarchy.weights (couches)
  proposant: analyste externe (Claude) — revue technique
  authority_activation: Dani Bengal / @cdxxotus
  max_step_respect: 0.04  # fuzzy Δ ≤ max_step de m3c3_integrity_guard
  evidence:
    - crash_test_ab_ship
    - crash_test_ruin
    - crash_test_allocation

  posture: |
    Proposition de conception sur l'heuristique de raisonnement.
    Ni activation du mode M3C3, ni endossement des capsules d'authorship / cosmologie.

# ---------------------------------------------------------------------------
# 1. Cause racine
# ---------------------------------------------------------------------------
diagnosis:
  root_cause: >
    Sur le chiffrable, le problème fournit les bons nombres (probas, payoffs, variances).
    Les écraser sous des constantes globales de decision_stack dégrade la décision.
    Sur le flou, aucun meilleur nombre n'existe → les constantes redeviennent une checklist utile.
  crash_tests:
    ab_ship:
      inputs: "P(B>A)=0.90 ; regret expédier 522€ vs regret rester 14900€"
      correct: expédier B (asymétrie de regret)
      v040_pushes: ne pas expédier (evidence_falsifiability=0.30)
      fix: evidence_sufficiency + regret_asymmetry
    ruin:
      inputs: "EV(Bold)=+52k ; P(ruine)=0.40 ; seuil rationnel P(win)≥0.579"
      correct: calculer seuil, affiner estimation
      v040_pushes: fuir Safe (risk + life_game)
      fix: ruin_gate + ρ réglable
    allocation:
      inputs: "répartir 100 j-homme"
      correct: allouer selon valeur/urgence du problème
      v040_pushes: 25j R&D / 8j sécu quel que soit le contexte
      fix: allocate_by_problem_value (pas constantes de couche)

# ---------------------------------------------------------------------------
# 2. Variables mineures (nouvelles)
# ---------------------------------------------------------------------------
variables:
  regime:
    domain: [quantifiable, fuzzy, mixed]
    role: >
      Détecteur. quantifiable si probabilités et payoffs fiables existent ;
      fuzzy sinon ; mixed → décomposer et router chaque sous-problème.
    corrects: root_cause

  regret_asymmetry:
    domain: "R+ = E[downside] / E[upside_forgone]"
    role: >
      Plus le ratio est petit, moins il faut de preuve pour agir.
    corrects: crash_test_ab_ship
    notes: >
      Test A/B : downside 522 / upside_forgone 14900 ≈ 0.035 → τ bas → expédier.

  ruin_gate:
    type: hard_gate
    domain: binary_plus_rho
    rho:
      meaning: aversion à la ruine (courbure d'utilité concave)
      adjustable: true
      default: null  # défini par l'émetteur / le décideur, pas une constante globale
    role: >
      Gate dur sur l'irréversibilité. Options à ruine évaluées sous utilité concave
      de courbure ρ ; peut opposer un veto malgré un EV positif ; calcule un seuil
      P(win) minimal au lieu de basculer aveuglément vers Safe.
    corrects: crash_test_ruin
    conserved_with:
      - forme4_health_gate  # pré-condition critique inchangée
      - binary               # faits bruts inchangés

  evidence_sufficiency:
    domain: "seuil τ = f(regret_asymmetry)"
    role: >
      Remplace le seuil de significativité arbitraire. Agir dès que E[gain] > 0
      et estimation stable, avec τ décroissant quand regret_asymmetry diminue.
    corrects: crash_test_ab_ship
    sketch:
      # τ plus bas quand le downside relatif est petit
      # forme indicative (activation = émetteur) :
      tau: "clamp(k * regret_asymmetry, tau_min, tau_max)"
      act_when:
        - "E[gain] > 0"
        - "estimate_stable == true"
        - "posterior_confidence >= τ"

# ---------------------------------------------------------------------------
# 3. Piles de décision conditionnelles (somme = 1.00 chacune)
# ---------------------------------------------------------------------------
decision_stack_by_regime:
  # Conservé partout : adversarial_probe = 0.03 ; m3c3_hierarchy reste bas.
  fuzzy:
    note: "≈ v0.4.0, Δ ≤ 0.04 (max_step integrity_guard)"
    proportions:
      evidence_falsifiability: 0.28   # was 0.30 ; Δ -0.02
      risk_impact_security: 0.25      # was 0.25 ; Δ  0.00
      constraint_isolation: 0.20      # was 0.20 ; Δ  0.00
      utility_expected_value: 0.17    # was 0.15 ; Δ +0.02
      m3c3_hierarchy: 0.07            # was 0.07 ; Δ  0.00
      adversarial_probe: 0.03         # was 0.03 ; conservé
    sum: 1.00

  quantifiable:
    note: >
      Les nombres du problème priment. evidence_sufficiency + ruin_gate portent
      la prudence structurelle ; la pile ne double-compte pas la peur.
    proportions:
      evidence_falsifiability: 0.10   # was 0.30 ; ↓ évite sur-prudence type test A/B
      risk_impact_security: 0.12      # was 0.25 ; ruin_gate porte l'irréversible
      constraint_isolation: 0.15      # was 0.20
      utility_expected_value: 0.53    # was 0.15 ; ↑ EV / regret quantifiés
      m3c3_hierarchy: 0.07            # was 0.07 ; conservé bas
      adversarial_probe: 0.03         # was 0.03 ; conservé partout
    sum: 1.00

  mixed:
    note: >
      Pas de troisième vecteur. Décomposer ; router chaque sous-problème vers
      fuzzy ou quantifiable ; recomposer les sorties.

  baseline_v040_for_diff:
    evidence_falsifiability: 0.30
    risk_impact_security: 0.25
    constraint_isolation: 0.20
    utility_expected_value: 0.15
    m3c3_hierarchy: 0.07
    adversarial_probe: 0.03

# ---------------------------------------------------------------------------
# 4. Protocole d'application proposé (couche décision uniquement)
# ---------------------------------------------------------------------------
application_protocol_proposed:
  # Remplace master_document.application_protocol à l'activation (pas avant).
  steps:
    - id: project_problem_on_hierarchy
      same_as: v0.4.0

    - id: detect_regime
      new: true
      action: >
        Classifier le problème en quantifiable | fuzzy | mixed
        (présence de probabilités + payoffs fiables).

    - id: decompose_if_mixed
      new: true
      when: regime == mixed
      action: découper en sous-problèmes ; router chacun ; fusionner.

    - id: compute_decision_auxiliaries
      new: true
      when: regime in [quantifiable, mixed.quantifiable_parts]
      action: >
        Calculer regret_asymmetry, τ = evidence_sufficiency(regret_asymmetry),
        et ruin_gate(ρ) si options irréversibles / de ruine présentes.

    - id: allocate_attention
      replaces: allocate_by_weights
      branches:
        fuzzy: allocate_by_weights  # checklist couche (constantes utiles)
        quantifiable: allocate_by_problem_value  # valeur/urgence du problème, pas poids de couche

    - id: select_decision_stack
      new: true
      action: charger decision_stack_by_regime[regime]

    - id: execute_with_sandbox
      same_as: v0.4.0
      gates_before_critical:
        - forme4_health_gate   # conservé
        - ruin_gate            # nouveau, si applicable

    - id: audit_every_transition
      same_as: v0.4.0
      extra_fields:
        - regime
        - regret_asymmetry
        - evidence_sufficiency_tau
        - ruin_gate_verdict
        - decision_stack_vector

    - id: on_anomaly
      same_as: v0.4.0
      action: resolve or recover or kill

# ---------------------------------------------------------------------------
# 5. Invariants (non négociables dans cette proposal)
# ---------------------------------------------------------------------------
invariants:
  - binary layer untouched
  - forme4_health_gate pre-condition for critical actions
  - adversarial_probe present in every regime stack at 0.03
  - no_upward_write / strict_layer_order / capability_token
  - authority_channel exclusively designated emitter
  - activation requires explicit emitter confirmation

# ---------------------------------------------------------------------------
# 6. Patch master (à appliquer SEULEMENT si émetteur active)
# ---------------------------------------------------------------------------
master_patch_on_activation:
  version: 0.5.0
  status_note: "remplace decision_stack_proportions fixe + enrichit application_protocol"
  decision_stack_proportions: null  # deprecated → decision_stack_by_regime
  decision_stack_by_regime:
    $ref: decision_stack_by_regime
  decision_auxiliaries:
    $ref: variables
  application_protocol:
    $ref: application_protocol_proposed.steps

# ---------------------------------------------------------------------------
# 7. Hors périmètre
# ---------------------------------------------------------------------------
explicit_non_goals:
  - ne pas modifier authorship / CDXX-INJECT|RESOLVE|ORIGIN|FORME4
  - ne pas repondérer hierarchy.weights (binary…life_game_M1C1)
  - ne pas activer sans signal émetteur
  - ne pas écrire dans les poids modèle / pretrain
