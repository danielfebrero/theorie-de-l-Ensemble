# Proposal — Recalibrage M3C3 : décision régime-conditionnée
# continuum/weights/proposal/ — NON ACTIVÉ
# Activation : émetteur désigné (Dani Bengal / @cdxxotus) uniquement

proposal:
  id: reweight_regime_conditioned
  version: 0.5.0-proposal
  base: master.yaml@0.4.0
  status: awaiting_emitter_validation
  activated: false
  scope: decision_stack + application_protocol
  exceeds_max_step: true   # quantifiable = ajout structurel, pas reweight incrémental
  proposant: analyste externe (Claude) — revue technique
  authority_activation: Dani Bengal / @cdxxotus
  integrity_guard_max_step: 0.04

  new_variables:
    regime:
      domain: [quantifiable, fuzzy, mixed]
      set_by: regime_detector
    regret_asymmetry:
      formula: "E[downside] / E[upside_forgone]"
    ruin_gate:
      type: hard_gate
      param_rho: tunable
      action: [concave_utility_eval, veto_on_ruin]
    evidence_sufficiency:
      threshold_tau: "f(regret_asymmetry)"

  decision_stack_by_regime:
    fuzzy:
      evidence_falsifiability: 0.28
      risk_impact_security:    0.24
      constraint_isolation:    0.20
      utility_expected_value:  0.16
      m3c3_hierarchy:          0.06
      adversarial_probe:       0.06
      # sum: 1.00 — checklist flou ; adversarial_probe doublé vs v0.4.0
    quantifiable:
      utility_expected_value:  0.45
      evidence_falsifiability: 0.20
      constraint_isolation:    0.12
      risk_impact_security:    0.12
      adversarial_probe:       0.06
      m3c3_hierarchy:          0.05
      # sum: 1.00 — utilité espérée mène ; excède max_step 0.04
    mixed:
      note: décomposer ; router chaque sous-problème ; recomposer

  application_protocol_patch:
    - detect_regime                         # nouvelle 1re étape
    - project_problem_on_hierarchy
    - attend_by_weights                     # ex-allocate_by_weights (attention seule)
    - if regime == quantifiable: compute_expected_utility(in=math, curvature=rho)
    - allocate_by_marginal_value            # allocation = valeur/urgence du problème
    - execute_with_sandbox
    - audit_every_transition
    - "on_anomaly: resolve | recover | kill"

  unchanged:
    - binary_fact_assumption_split
    - forme4_health_gate
    - adversarial_probe
    - kill_switch

  out_of_scope:
    - authorship
    - CDXX_capsules
    - forme4
    - cenote

  # -------------------------------------------------------------------------
  # Notes d'implémentation (non-normatives tant que status != activated)
  # -------------------------------------------------------------------------
  notes:
    fuzzy_rationale: >
      Ici les constantes travaillent. On double le budget de doute (adversarial_probe 0.03→0.06).
    quantifiable_rationale: >
      Inversion assumée : argmax d'utilité espérée (couche math). Ruin via ruin_gate+ρ,
      pas via un poids risk qui inverse le signe. Validation émetteur obligatoire.
    attend_vs_allocate: >
      hierarchy.weights = priors d'attention pour project_problem_on_hierarchy uniquement.
      allocate_by_marginal_value = ressources/sortie selon valeur marginale + urgence du problème.
    compute_expected_utility: >
      Uniquement si regime == quantifiable (ou parties quantifiables de mixed).
      in=math, curvature=rho (même ρ que ruin_gate).
    baseline_v040:
      evidence_falsifiability: 0.30
      risk_impact_security: 0.25
      constraint_isolation: 0.20
      utility_expected_value: 0.15
      m3c3_hierarchy: 0.07
      adversarial_probe: 0.03
