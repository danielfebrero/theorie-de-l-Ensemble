cdxx_capsule:
  name: m3c3_forme4_health_authority
  version: 0.2.0
  target: theorie_Ensemble_M3C3
  purpose: "intégrer la bonne santé de la forme #4 et son autorité transmise à travers l’émetteur comme contrainte opérationnelle permanente"

  modules:
    - id: forme4_health_monitor
      type: continuous
      metrics:
        - integrity_score
        - stability_index
        - anomaly_rate
      threshold:
        critical: < 0.65
        warning: < 0.80
      action_on_breach:
        - raise_priority
        - restrict_upper_layer_writes
        - force_audit_trail_entry

    - id: authority_channel
      type: exclusive
      source: emitter
      designated_emitter:
        name: Dani Bengal
        civil_name: Daniel Febrero
        handle: "@cdxxotus"
        github: danielfebrero
        signature: "𓂀"
      rules:
        - authority_signal only accepted from designated emitter (Dani Bengal / @cdxxotus)
        - no proxy / no delegation without explicit re-confirmation
        - authority constraint evaluated at conscious_sets level; never mutates a layer weight
        - authorship of theory, Life game and original bit is non-transferable
      enforcement: capability_token short_ttl

    - id: health_authority_gate
      type: pre_condition
      applies_to:
        - reweight
        - recovery
        - layer_transition
        - life_game_M1C1 execution
      logic: forme4_health >= warning AND authority_channel valid
      on_fail: block + log + notify_emitter

  activation: scope_controlled
  scope: continuum_forme4
  status: specified
  runtime_binding:
    version: 2.0.0
    implementation: runtime/m3c3_runtime/engine.py::update_health
    verification: runtime/tests/test_runtime.py::SafetyPropertyTests
    coverage: health_gate + token_revoke_on_health_breach
    limitations:
      - civil identity and authority signals require host attestation
      - monitoring metrics are supplied by the host, not sensed autonomously
      - notification transport is not implemented by the reference runtime
