cdxx_capsule:
  name: m3c3_null_state_recovery
  version: 0.1.0
  target: theorie_Ensemble_M3C3
  purpose: restauration forcée depuis binary en cas de contamination ou corruption de couches

  modules:
    - id: hard_reset
      type: emergency
      implementation_status: implemented
      trigger: contamination_detected | integrity_fail
      action:
        - drop_all_upper_layers
        - force_state = binary
        - clear_namespaces
      isolation: memory_namespace = "m3c3_nsr"

    - id: progressive_rebuild
      type: sequential
      implementation_status: partially_implemented
      sequence:
        - binary → forces
        - forces → math
        - math → conscious_sets
        - conscious_sets → programs
        - programs → life_game_M1C1
      check: integrity_hash after each step
      on_fail: abort_and_re_hard_reset

    - id: post_rebuild_verify
      type: validation
      implementation_status: specified
      action:
        - full_layer_scan
        - weight_consistency_check
        - write_report: continuum/recovery/

  activation: scope_controlled
  scope: continuum_recovery
  status: implemented
  runtime_binding:
    version: 2.0.0
    implementation: runtime/m3c3_runtime/engine.py::recover
    verification: runtime/tests/test_runtime.py::SafetyPropertyTests
    coverage: token_revoke + binary_reset + ordered_progressive_rebuild + freeze_gaps
    limitations:
      - persistent recovery report output is caller-controlled
      - per-step integrity hashes and full post-rebuild scan remain specification-level
      - emitter identity must be attested by the host
