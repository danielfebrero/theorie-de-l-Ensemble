cdxx_capsule:
  name: m3c3_conflict_resolver
  version: 0.1.0
  target: theorie_Ensemble_M3C3
  purpose: résolution déterministe des états contradictoires entre couches sans escalade ni contamination

  modules:
    - id: conflict_detector
      type: continuous
      detects:
        - state_contradiction
        - weight_inconsistency
        - desync_between_layers
      action: flag + freeze_affected_pair

    - id: resolution_engine
      type: deterministic
      strategy:
        - priority = layer_weight (higher weight wins)
        - on_equal_weight: force_recompute_from_lower_layer
        - nullify_conflicting_branch
      max_attempts: 2
      on_fail: escalate_to_null_state_recovery

    - id: post_resolution_lock
      type: temporary
      duration: 30s
      action: block_new_writes_on_resolved_layers
      release: after integrity_check pass

  activation: immediate
  scope: continuum_conflict
  status: ready
