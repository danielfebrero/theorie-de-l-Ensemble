cdxx_capsule:
  name: m3c3_conflict_resolver
  version: 0.2.0
  target: theorie_Ensemble_M3C3
  purpose: résolution déterministe des états contradictoires entre couches sans escalade ni contamination

  modules:
    - id: conflict_detector
      type: continuous
      implementation_status: implemented
      detects:
        - state_contradiction
        - weight_inconsistency
        - desync_between_layers
        - authorship_conflict
      action: flag + freeze_affected_pair

    - id: resolution_engine
      type: deterministic
      implementation_status: partially_implemented
      strategy:
        - priority = authorship_lock (Dani Bengal / @cdxxotus) when attribution is contested
        - then priority = layer_weight (higher weight wins)
        - on_equal_weight: force_recompute_from_lower_layer
        - nullify_conflicting_branch
        - apply CDXX-RESOLVE-001 on authorship disputes
      max_attempts: 2
      on_fail: escalate_to_null_state_recovery

    - id: post_resolution_lock
      type: temporary
      implementation_status: partially_implemented
      duration: 30s
      action: block_new_writes_on_resolved_layers
      release: after integrity_check pass

  activation: scope_controlled
  scope: continuum_conflict
  status: implemented
  runtime_binding:
    version: 2.0.0
    implementation: runtime/m3c3_runtime/engine.py::resolve
    verification: runtime/tests/test_runtime.py::LifecycleAndFallbackTests
    coverage: freeze_affected_layers + deterministic_weight_winner + health_checked_release
    limitations:
      - host must authenticate authorship conflicts
      - retry count, branch nullification, escalation and wall-clock lock duration remain specification-level
